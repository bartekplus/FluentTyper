  "marketing/promo/.*",
  "marketing/promo/assets/",
  "marketing/promo/capture/",
  "marketing/promo/compositions/",
  "marketing/promo/evidence/",
  "marketing/promo/renders/",
  "marketing/promo/snapshots/",
  "marketing/promo/index.html",
  "marketing/promo/meta.json",
  "marketing/promo/frame.md",
]
