name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and format check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - run: bun install --frozen-lockfile
      - name: ESLint
        run: bun run lint
      - name: Prettier
        run: bun run format:check

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - run: bun install --frozen-lockfile
      - name: Run unit tests (with retry for JSDOM flakiness on Linux)
        uses: nick-fields/retry@v3
        with:
          max_attempts: 3
          timeout_minutes: 10
          command: bun run test
      - run: bun run check:e2e:coverage

  e2e-smoke:
    name: E2E Smoke (${{ matrix.browser }})
    needs: [lint, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - run: bun install --frozen-lockfile
      - name: Install Firefox for Puppeteer
        if: matrix.browser == 'firefox'
        run: bunx puppeteer browsers install firefox
      - name: Run smoke e2e (10s target, non-blocking runtime report)
        env:
          BROWSER: ${{ matrix.browser }}
          CI: "true"
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          import time

          browser = os.environ["BROWSER"]
          budget_seconds = 10
          start = time.time()
          result = subprocess.run(["bun", "run", "test:e2e", f"--platform={browser}"], check=False)
          elapsed = time.time() - start
          print(f"smoke_elapsed_seconds={elapsed:.2f}")
          if result.returncode != 0:
            sys.exit(result.returncode)
          if elapsed > budget_seconds:
            print(f"::warning::Smoke e2e exceeded {budget_seconds}s target on {browser}: {elapsed:.2f}s")
          PY

  e2e-full:
    name: E2E Full (${{ matrix.browser }})
    needs: [e2e-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - run: bun install --frozen-lockfile
      - name: Install Firefox for Puppeteer
        if: matrix.browser == 'firefox'
        run: bunx puppeteer browsers install firefox
      - run: bun run test:e2e:full --platform=${{ matrix.browser }}
        env:
          CI: "true"
