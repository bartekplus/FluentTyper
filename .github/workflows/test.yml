name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      wordpress-persistence:
        description: Run WordPress save and reload tests with Playground
        type: boolean
        default: false

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint, format, and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Oxlint
        run: bun run lint
      - name: Prettier
        run: bun run format:check
      - name: TypeScript
        run: bun run typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run check:e2e:coverage
      - name: Install hunspell and bsdtar for build-tooling tests
        run: sudo apt-get update && sudo apt-get install -y hunspell libarchive-tools
      - name: Python build-tooling tests
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'

  e2e-smoke:
    name: E2E Smoke (${{ matrix.browser }})
    needs: [lint, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Install Firefox for Puppeteer
        if: matrix.browser == 'firefox'
        run: bunx puppeteer browsers install firefox
      - run: bun run test:e2e --platform=${{ matrix.browser }}

  performance-smoke:
    name: Extension performance lifecycle smoke
    needs: [lint, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run perf:smoke
        env:
          PERF_OUTPUT: .tmp/performance/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extension-performance
          path: |
            .tmp/performance/ci/results.json
            .tmp/performance/ci/summary.md

  e2e-docs:
    name: E2E Google Docs fixtures
    needs: [lint, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Google Docs cross-world fixtures (not live Docs)
        run: bun run test:e2e:docs

  e2e-full:
    name: E2E Full (${{ matrix.browser }})
    needs: [lint, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Install Firefox for Puppeteer
        if: matrix.browser == 'firefox'
        run: bunx puppeteer browsers install firefox
      - name: Full regression, including Gutenberg fixtures
        run: bun run test:e2e:full --platform=${{ matrix.browser }}

  wordpress-persistence:
    name: WordPress persistence (${{ matrix.browser }})
    if: github.event_name == 'workflow_dispatch' && inputs.wordpress-persistence
    needs: [lint, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Install Firefox for Puppeteer
        if: matrix.browser == 'firefox'
        run: bunx puppeteer browsers install firefox
      - run: bun run test:e2e:wordpress --platform=${{ matrix.browser }} --runtime=playground
