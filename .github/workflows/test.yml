name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and format check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.3.10'
    - run: bun install --frozen-lockfile
    - run: bun run check

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.3.10'
    - run: bun install --frozen-lockfile
    - run: bun test

  e2e:
    name: E2E (${{ matrix.browser }})
    needs: [lint, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]

    steps:
    - uses: actions/checkout@v4
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.3.10'
    - run: bun install --frozen-lockfile
    - name: Install Firefox for Puppeteer
      if: matrix.browser == 'firefox'
      run: bunx puppeteer browsers install firefox
    - run: bun run test:e2e --platform=${{ matrix.browser }}
      env:
        CI: 'true'
