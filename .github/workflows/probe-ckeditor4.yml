# Temporary: run the CKEditor 4 typing tests many times under CPU load. Removed before merge.
name: Probe CKEditor 4 typing

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  stressed:
    name: ${{ matrix.browser }} CKEditor 4 typing under CPU load (copy ${{ matrix.copy }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox]
        copy: [1, 2, 3, 4, 5, 6]
        include:
          - browser: chrome
            copy: 1
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - if: matrix.browser == 'firefox'
        run: bunx puppeteer browsers install firefox
      - run: |
          for c in $(seq $(nproc)); do (while :; do :; done) & done
          status=0
          bun run test:e2e:full --platform=${{ matrix.browser }} --test-name-pattern="ckeditor4 typing accepts a prediction|CKEditor 4 setData rewrites" --rerun-each 20 > run.log 2>&1 || status=$?
          grep -E "^error: ck|^\(fail\)|^ *[0-9]+ (pass|fail)$" run.log || true
          exit $status
