name: PR 412 simplify validation

on:
  push:
    branches: [work/pr-412-simplify]
    paths: [.github/workflows/pr-412-simplify.yml, .github/pr-412-simplify.py]

permissions:
  contents: write

concurrency:
  group: pr-412-simplify-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Consolidate fixtures and strengthen regression coverage
        run: python3 .github/pr-412-simplify.py tests
      - name: Establish behavior before production simplification
        run: |
          python3 - <<'PY'
          import subprocess
          result = subprocess.run(['bun', 'run', 'test'], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          lines = result.stdout.splitlines()
          indices = set(range(max(0, len(lines) - 25), len(lines)))
          for i, line in enumerate(lines):
              if '(fail)' in line or 'error:' in line:
                  indices.update(range(max(0, i - 20), min(len(lines), i + 12)))
          for i in sorted(indices):
              print(lines[i])
          print('BASELINE_EXIT:', result.returncode)
          raise SystemExit(result.returncode)
          PY
      - name: Simplify production code
        run: python3 .github/pr-412-simplify.py production
      - name: Format changed files
        run: |
          bunx prettier --write \
            src/adapters/chrome/content-script/suggestions/CodeContextResolver.ts \
            src/adapters/chrome/content-script/suggestions/MeasurementEditingContext.ts \
            src/adapters/chrome/background/router/MessageRouter.ts \
            tests/codeContextTestUtils.ts tests/CodeContextResolver.test.ts \
            tests/CodeContextGrammar.test.ts tests/CodeContextShadow.test.ts \
            tests/CodePredictionCapitalization.test.ts tests/background.routing.test.ts \
            tests/e2e/full.e2e.test.ts tests/e2e/coverage-matrix.json \
            docs/automatic-code-context.md .github/workflows/pr-412-simplify.yml
      - name: Validate refactored code and full unit suite
        run: |
          python3 - <<'PY'
          import subprocess
          commands = [
              ['bun', 'run', 'check'],
              ['bun', 'run', 'test'],
              ['bun', 'run', 'check:e2e:coverage'],
          ]
          failed = False
          for command in commands:
              result = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              lines = result.stdout.splitlines()
              print('COMMAND:', ' '.join(command), 'EXIT:', result.returncode, flush=True)
              indices = set(range(max(0, len(lines) - 25), len(lines)))
              if result.returncode:
                  for i, line in enumerate(lines):
                      if '(fail)' in line or 'error' in line.lower() or 'warn' in line.lower():
                          indices.update(range(max(0, i - 20), min(len(lines), i + 12)))
              for i in sorted(indices):
                  print(lines[i], flush=True)
              failed |= result.returncode != 0
          raise SystemExit(1 if failed else 0)
          PY
      - name: Publish validated tree on work branch
        run: |
          git rm -f .github/pr-412-simplify.py .github/workflows/pr-412-simplify.yml
          git add src/adapters/chrome/content-script/suggestions/CodeContextResolver.ts src/adapters/chrome/content-script/suggestions/MeasurementEditingContext.ts src/adapters/chrome/background/router/MessageRouter.ts tests/codeContextTestUtils.ts tests/CodeContextResolver.test.ts tests/CodeContextGrammar.test.ts tests/CodeContextShadow.test.ts tests/CodePredictionCapitalization.test.ts tests/background.routing.test.ts tests/e2e/full.e2e.test.ts tests/e2e/coverage-matrix.json docs/automatic-code-context.md
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: simplify code-context plumbing and regression fixtures'
          git push origin HEAD:work/pr-412-simplify
          git log -1 --format='%H %T'
