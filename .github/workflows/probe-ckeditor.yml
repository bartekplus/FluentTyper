# Temporary: reproduce the Firefox CKEditor mid-word flake. Removed before merge.
name: Probe CKEditor mid-word

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  stressed:
    name: Firefox mid-word under CPU load (copy ${{ matrix.copy }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        copy: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx puppeteer browsers install firefox
      - run: |
          for c in $(seq $(nproc)); do (while :; do :; done) & done
          failed=0
          for i in $(seq 15); do
            bun run test:e2e:full --platform=firefox --test-name-pattern="caret is mid-word" > run.log 2>&1 || { echo "RUN $i FAILED"; grep -E "CKEditor state|error:" run.log; failed=1; }
          done
          exit $failed
