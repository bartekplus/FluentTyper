name: PR 412 casing validation

on:
  push:
    branches: [work/pr-412-code-casing]
    paths: [.github/workflows/pr-412-casing-repair.yml]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Add regression tests
        run: |
          python3 .github/pr-412-casing-repair.py tests
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/CodePredictionCapitalization.test.ts')
          s = p.read_text()
          s = s.replace('const sendMessage = jest.fn(() => Promise.resolve());', 'const sendMessage = jest.fn((message: { context: { suppressAutoCapitalize?: boolean } }) => Promise.resolve(message));')
          p.write_text(s)
          p = Path('tests/SuggestionManager.test.ts')
          s = p.read_text()
          old = 'const { manager, getPrediction } = await createManager({ enabledGrammarRules: ["capitalizeSentenceStart"] });'
          new = 'const { manager, getPrediction } = await createManager({ enabledGrammarRules: ["capitalizeSentenceStart"], selectByDigit: false });'
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          PY
      - name: Prove regression fails on original production code
        run: |
          python3 - <<'PY'
          import subprocess
          result = subprocess.run(['bun', 'test', 'tests/CodePredictionCapitalization.test.ts', '--test-name-pattern', 'code suppression is request-local and does not force lowercase'], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          print(result.stdout)
          if result.returncode == 0 or '(fail) code prediction capitalization > code suppression is request-local and does not force lowercase' not in result.stdout:
              raise SystemExit('Expected the specific casing regression to fail before applying the fix')
          PY
      - name: Apply checked production patch
        run: |
          python3 .github/pr-412-casing-repair.py code
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/automatic-code-context.md')
          s = p.read_text()
          old = 'No settings, migrations, permissions, network requests, logging of typed text,\nprediction messages, or keyboard interception are added. Suggestions, explicit\nsnippet acceptance, the early-Tab bridge, and Markdown parsing are unchanged.'
          new = 'No settings, migrations, permissions, network requests, logging of typed text,\nor keyboard interception are added. Prediction requests carry an optional\nsentence-casing suppression flag for code/literal contexts; explicit snippet\nacceptance, the early-Tab bridge, and Markdown parsing are otherwise unchanged.'
          assert s.count(old) == 1
          s = s.replace(old, new)
          s = s.replace('This is automatic **grammar protection**, not a new autocomplete mode.', 'This applies automatic **grammar and prediction-casing protection**, not a new autocomplete mode.')
          p.write_text(s)
          PY
      - name: Format changed source and regressions
        run: |
          bunx prettier --write \
            src/core/domain/messageTypes.d.ts \
            src/adapters/chrome/content-script/suggestions/SuggestionPredictionCoordinator.ts \
            src/adapters/chrome/content-script/ContentMessageHandler.ts \
            src/adapters/chrome/background/PredictionTypes.d.ts \
            src/adapters/chrome/background/router/MessageRouter.ts \
            src/adapters/chrome/background/BackgroundServiceWorker.ts \
            src/adapters/chrome/background/PredictionManager.ts \
            src/adapters/chrome/background/PredictionOrchestrator.ts \
            src/adapters/chrome/background/PresageHandler.ts \
            src/adapters/chrome/background/PredictionInputProcessor.ts \
            tests/CodePredictionCapitalization.test.ts \
            tests/SuggestionManager.test.ts \
            tests/e2e/full.e2e.test.ts \
            tests/e2e/coverage-matrix.json \
            tests/e2e/coverage-baseline-ids.json \
            docs/automatic-code-context.md \
            .github/workflows/pr-412-casing-repair.yml
      - name: Strict checks and full unit suite
        run: |
          python3 - <<'PY'
          import subprocess
          commands = [
              ['bun', 'run', 'check'],
              ['bun', 'test', 'tests/CodePredictionCapitalization.test.ts'],
              ['bun', 'run', 'test'],
              ['bun', 'run', 'check:e2e:coverage'],
          ]
          failed = False
          for command in commands:
              result = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              lines = result.stdout.splitlines()
              print('COMMAND:', ' '.join(command), 'EXIT:', result.returncode, flush=True)
              if result.returncode:
                  print(result.stdout, flush=True)
              else:
                  print('\n'.join(lines[-20:]), flush=True)
              failed |= result.returncode != 0
          raise SystemExit(1 if failed else 0)
          PY
      - name: Publish validated tree on work branch only
        run: |
          git rm -f .github/pr-412-casing-repair.py .github/workflows/pr-412-casing-repair.yml
          git add src/core/domain/messageTypes.d.ts src/adapters/chrome tests/CodePredictionCapitalization.test.ts tests/SuggestionManager.test.ts tests/e2e/full.e2e.test.ts tests/e2e/coverage-matrix.json tests/e2e/coverage-baseline-ids.json docs/automatic-code-context.md
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: suppress automatic prediction capitalization in code per request'
          git push origin HEAD:work/pr-412-code-casing
          git log -1 --format='%H %T'
