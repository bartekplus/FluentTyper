<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FluentTyper Settings</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Core Stylesheets -->
    <link
      rel="stylesheet"
      type="text/css"
      href="/third_party/bulma/bulma.min.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="/third_party/bulma/bulma-switch.min.css"
    />

    <!-- CUSTOM THEME - Must be placed AFTER Bulma to override styles -->
    <link rel="stylesheet" type="text/css" href="/css/fluenttyper-theme.css" />

    <!-- JavaScript -->
    <script src="/popup/popup.js"></script>
  </head>

  <body class="fluenttyper-popup">
    <!-- Header -->
    <header class="popup-header" style="display: none">
      <img src="/icon/LogoFluentTyper.png" alt="FluentTyper Logo" />
      <h1 class="title is-5">FluentTyper</h1>
    </header>

    <!-- Modern Compact UI -->
    <main class="control-panel">
      <!-- Header Area -->
      <header class="panel-header">
        <div class="header-content">
          <h1 class="title is-6 mb-0" style="font-weight: 700">FluentTyper</h1>
          <div class="field mb-0">
            <input
              id="checkboxEnableInput"
              type="checkbox"
              name="checkboxEnableInput"
              class="switch is-small is-rounded"
              checked
            />
            <label for="checkboxEnableInput"></label>
          </div>
        </div>
      </header>

      <!-- Content Area -->
      <div class="panel-body">
        <!-- Global Controls -->
        <div class="control-card mt-2">
          <div class="card-row">
            <span class="row-label" data-i18n="popup_language">Language</span>
            <div class="select is-small is-rounded is-borderless">
              <select id="languageSelect"></select>
            </div>
          </div>
        </div>

        <!-- Site Settings -->
        <div id="domainSectionWrapper" class="mt-3">
          <div class="control-card">
            <!-- Domain Enable -->
            <div class="card-row border-bottom">
              <span
                id="checkboxDomainLabel"
                class="row-label"
                data-i18n="popup_enable_on_site"
                >Enable on this site</span
              >
              <div class="field mb-0">
                <input
                  id="checkboxDomainInput"
                  type="checkbox"
                  name="checkboxDomainInput"
                  class="switch is-small is-rounded"
                  checked
                />
                <label for="checkboxDomainInput"></label>
              </div>
            </div>

            <!-- Site Profile Toggle -->
            <section id="siteProfileSection">
              <div
                class="card-row"
                style="
                  align-items: flex-start;
                  padding-top: 0.75rem;
                  padding-bottom: 0.75rem;
                "
              >
                <div
                  style="display: flex; flex-direction: column; gap: 0.25rem"
                >
                  <span class="row-label" data-i18n="popup_site_profile_toggle"
                    >Use site profile</span
                  >
                  <small
                    id="siteProfileStatus"
                    data-i18n="popup_site_profile_status_global"
                    style="
                      font-size: 0.75rem;
                      color: var(--text-color-light);
                      line-height: 1.2;
                    "
                    >Using global settings</small
                  >
                </div>
                <div class="field mb-0" style="margin-top: 0.1rem">
                  <input
                    id="checkboxSiteProfileInput"
                    type="checkbox"
                    name="checkboxSiteProfileInput"
                    class="switch is-small is-rounded"
                  />
                  <label for="checkboxSiteProfileInput"></label>
                </div>
              </div>

              <!-- Site Profile Details (List Layout) -->
              <div id="siteProfileDetails" class="profile-details is-hidden">
                <div class="profile-row">
                  <span
                    class="profile-label"
                    data-i18n="popup_site_profile_language"
                    >Language</span
                  >
                  <div class="select is-small is-rounded is-borderless">
                    <select id="siteLanguageSelect"></select>
                  </div>
                </div>
                <div class="profile-row">
                  <span
                    class="profile-label"
                    data-i18n="popup_site_profile_num_suggestions"
                    >Suggestions Count</span
                  >
                  <div class="select is-small is-rounded is-borderless">
                    <select id="siteNumSuggestionsSelect"></select>
                  </div>
                </div>
                <div class="profile-row">
                  <span
                    class="profile-label"
                    data-i18n="popup_site_profile_inline"
                    >Inline Mode</span
                  >
                  <div class="select is-small is-rounded is-borderless">
                    <select id="siteInlineModeSelect"></select>
                  </div>
                </div>
              </div>
            </section>
          </div>
        </div>
      </div>
    </main>

    <!-- Bottom Toolbar -->
    <footer class="toolbar">
      <div class="toolbar-actions">
        <!-- Options Button -->
        <a
          class="toolbar-btn"
          id="runOptions"
          target="_blank"
          rel="noopener"
          data-i18n-title="popup_advanced_options"
          title="Advanced Options"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="3"></circle>
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
            ></path>
          </svg>
        </a>

        <!-- Issue Tracker -->
        <a
          class="toolbar-btn"
          href="https://github.com/bartekplus/FluentTyper/issues"
          target="_blank"
          title="Report Issue"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M12 16v-4"></path>
            <path d="M12 8h.01"></path>
          </svg>
        </a>

        <!-- GitHub -->
        <a
          class="toolbar-btn"
          href="https://github.com/bartekplus/FluentTyper"
          target="_blank"
          title="GitHub Source"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"
            ></path>
          </svg>
        </a>
      </div>

      <!-- Donate Button -->
      <a
        href="https://www.buymeacoffee.com/FluentTyper"
        target="_blank"
        class="toolbar-action-btn"
        title="Support Development"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="currentColor"
          stroke="none"
          class="mr-1"
          style="color: #facc15"
        >
          <path
            d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"
          ></path>
        </svg>
        Donate
      </a>
    </footer>
  </body>
</html>
