<!doctype html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title id="title"></title>
    <!-- Stylesheets -->
    <link id="favicon" rel="icon" href="/icon/icon128.png" />
    <link rel="stylesheet" type="text/css" href="/third_party/bulma/bulma.min.css" />
    <link rel="stylesheet" type="text/css" href="/third_party/bulma/bulma-divider.min.css" />
    <link rel="stylesheet" type="text/css" href="/third_party/bulma/bulma-slider.min.css" />
    <link rel="stylesheet" type="text/css" href="/third_party/bulma/bulma-switch.min.css" />
    <link rel="stylesheet" type="text/css" href="/css/fluenttyper-theme.css" />
    <link rel="stylesheet" type="text/css" href="/css/settings-engine.css" />
    <link rel="stylesheet" type="text/css" href="/suggestions/suggestions.css" />
    <!-- JavaScripts -->
    <script type="module" src="/options/settings.js"></script>
  </head>

  <body class="fluenttyper-options">
    <div class="options-app">
      <aside class="options-sidebar">
        <div class="options-sidebar-header">
          <p class="options-brand-kicker">FluentTyper</p>
          <h1 class="options-brand-title" data-i18n="options_workspace_title">
            Settings Workspace
          </h1>
          <p class="options-brand-copy" data-i18n="options_workspace_copy">
            Configure typing, languages, snippets, site rules, and appearance from one place.
          </p>
        </div>

        <label class="options-search">
          <span class="is-sr-only" data-i18n="options_search_label">Search settings</span>
          <input
            id="options-search-input"
            class="input"
            type="search"
            placeholder="Search settings"
            data-i18n-placeholder="options_search_placeholder"
          />
        </label>

        <nav
          class="options-nav"
          aria-label="Settings sections"
          data-i18n-aria-label="options_sections_nav_label"
        >
          <ul id="tab-container"></ul>
        </nav>
      </aside>

      <main class="options-main">
        <div class="options-mobile-toolbar">
          <label class="settings-stack-field">
            <span data-i18n="options_mobile_section_label">Section</span>
            <select id="mobile-section-select" class="input"></select>
          </label>
        </div>
        <div id="content" class="options-content"></div>
      </main>
    </div>

    <div id="settings-save-toast" class="settings-save-toast is-hidden" aria-live="polite">
      <span id="settings-save-toast-text" data-i18n="settings_status_saved">Changes saved</span>
    </div>
  </body>
</html>
