<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FluentTyper Test Page</title>
    <link rel="stylesheet" href="../../node_modules/ckeditor5/dist/browser/ckeditor5.css" />
    <style>
      body {
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        background-color: #f4f7f6;
        color: #333;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 50px;
      }

      h1 {
        font-weight: 600;
        color: #2c3e50;
        margin-bottom: 10px;
        text-align: center;
      }

      .container {
        display: flex;
        flex-direction: column;
        gap: 20px;
        width: 100%;
        max-width: 600px;
        background: #fff;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      label {
        font-size: 0.9em;
        font-weight: 500;
        color: #555;
      }

      textarea,
      input[type="text"],
      [contenteditable="true"] {
        padding: 12px 16px;
        font-family: inherit;
        font-size: 1rem;
        border: 1px solid #ddd;
        border-radius: 8px;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
        box-sizing: border-box;
      }

      textarea:focus,
      input[type="text"]:focus,
      [contenteditable="true"]:focus {
        outline: none;
        border-color: #3498db;
        box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
      }

      [contenteditable="true"] {
        min-height: 80px;
        cursor: text;
      }

      .ck-editor__editable {
        min-height: 80px;
      }

      #test-quill {
        min-height: 80px;
      }

      #test-quill .ql-editor {
        min-height: 80px;
      }

      #test-lexical-editor,
      #test-prosemirror-editor,
      #test-slate-editor,
      #test-tinymce {
        min-height: 80px;
      }
      #test-gutenberg .block-editor-rich-text__editable {
        min-height: 24px;
        white-space: pre-wrap;
      }
      .ProseMirror {
        white-space: pre-wrap;
      }
    </style>
  </head>

  <body>
    <h1>FluentTyper Testing Environment</h1>
    <div class="container">
      <div class="input-group">
        <label for="test-textarea">Textarea</label>
        <textarea id="test-textarea" rows="4"></textarea>
      </div>
      <div class="input-group">
        <label for="test-input">Text Input</label>
        <input type="text" id="test-input" />
      </div>
      <div class="input-group">
        <label for="test-email">Email Input</label>
        <input type="email" id="test-email" />
      </div>
      <div class="input-group">
        <label for="test-url">URL Input</label>
        <input type="url" id="test-url" />
      </div>
      <div class="input-group">
        <label for="test-native-list">Datalist Input</label>
        <input type="text" id="test-native-list" list="test-native-options" />
        <datalist id="test-native-options">
          <option value="Warsaw"></option>
          <option value="Berlin"></option>
        </datalist>
        <small>FluentTyper should back off here until the corner icon is clicked.</small>
      </div>
      <div class="input-group">
        <label for="test-semantic-email">Semantic Autocomplete Input</label>
        <input type="text" id="test-semantic-email" autocomplete="email" />
      </div>
      <div class="input-group">
        <label for="test-combobox">ARIA Combobox Input</label>
        <input
          type="text"
          id="test-combobox"
          role="combobox"
          aria-expanded="true"
          aria-controls="test-combobox-list"
        />
        <div id="test-combobox-list" role="listbox">
          <div role="option">Alpha</div>
          <div role="option">Beta</div>
        </div>
      </div>
      <div class="input-group" role="toolbar" aria-label="Formatting">
        <label for="test-toolbar-font">Font name</label>
        <input id="test-toolbar-font" type="text" role="combobox" value="Aptos" />
      </div>
      <div class="input-group">
        <label for="test-tel">Tel Input</label>
        <input type="tel" id="test-tel" />
      </div>
      <div class="input-group">
        <label for="test-disabled">Disabled Input</label>
        <input type="text" id="test-disabled" disabled />
      </div>
      <div class="input-group">
        <label for="test-readonly">Readonly Input</label>
        <input type="text" id="test-readonly" readonly />
      </div>
      <div class="input-group">
        <label for="test-contenteditable">Content Editable Div</label>
        <div contenteditable="true" id="test-contenteditable"></div>
      </div>
      <div class="input-group" id="test-ckeditor-group">
        <label for="test-ckeditor">CKEditor 5</label>
        <textarea id="test-ckeditor" rows="4"></textarea>
      </div>
      <div class="input-group" id="test-quill-group">
        <label for="test-quill">Quill</label>
        <div id="test-quill"></div>
      </div>
      <div class="input-group" id="test-lexical-group">
        <label for="test-lexical-editor">Lexical</label>
        <div id="test-lexical-editor" contenteditable="true"></div>
      </div>
      <div class="input-group" id="test-gutenberg-group"><div id="test-gutenberg"></div></div>
      <div class="input-group" id="test-prosemirror-group">
        <label for="test-prosemirror-editor">ProseMirror</label>
        <div id="test-prosemirror"></div>
      </div>
      <div class="input-group" id="test-slate-group">
        <label for="test-slate-editor">Slate</label>
        <div id="test-slate"></div>
      </div>
      <div class="input-group" id="test-tinymce-group">
        <label for="test-tinymce">TinyMCE</label>
        <div id="test-tinymce"></div>
      </div>
      <div class="input-group" id="test-review-editor-group">
        <div id="test-review-editor"></div>
      </div>
    </div>
    <script>
      const params = new URLSearchParams(window.location.search);
      const enableCkEditor = params.get("enableCkEditor") === "1";
      const enableQuill = params.get("enableQuill") === "1";
      const enableLexical = params.get("enableLexical") === "1";
      const enableProseMirror = params.get("enableProseMirror") === "1";
      const enableSlate = params.get("enableSlate") === "1";

      window.__ftResetTestPage = () => {
        if (document.activeElement instanceof HTMLElement) {
          document.activeElement.blur();
        }
        window.getSelection?.()?.removeAllRanges();

        const clearElement = (element) => {
          if (element instanceof HTMLInputElement || element instanceof HTMLTextAreaElement) {
            element.value = "";
            return;
          }
          // Slate renders through React; it is reset through its model below.
          if (element instanceof HTMLElement && element.closest("[data-slate-editor]")) {
            return;
          }
          if (element instanceof HTMLElement && element.isContentEditable) {
            element.textContent = "";
          }
        };

        document
          .querySelectorAll("textarea, input, [contenteditable='true']")
          .forEach(clearElement);

        const disabledInput = document.getElementById("test-disabled");
        if (disabledInput instanceof HTMLInputElement) {
          disabledInput.disabled = true;
        }

        const readonlyInput = document.getElementById("test-readonly");
        if (readonlyInput instanceof HTMLInputElement) {
          readonlyInput.readOnly = true;
        }

        document.querySelector("ft-shadow-test-component")?.remove();
        document.getElementById("ft-late-shadow-host")?.remove();
        document.getElementById("ft-nested-shadow-outer-host")?.remove();

        if (window.__testCkEditor?.setData) {
          void window.__testCkEditor.setData("");
        }
        if (window.__testQuill?.setText) {
          window.__testQuill.setText("");
        }
        if (window.__testLexical?.update) {
          window.__testLexical.update(() => {
            const root = window.__testLexical.getRootElement();
            if (root instanceof HTMLElement) {
              root.textContent = "";
            }
          });
        }

        window.__testSlateSetValue?.([{ type: "paragraph", children: [{ text: "" }] }]);
      };

      window.__testCkEditorReady = false;
      window.__testCkEditorError = null;
      const ckEditorGroup = document.getElementById("test-ckeditor-group");
      if (!enableCkEditor) {
        ckEditorGroup.style.display = "none";
      } else {
        const script = document.createElement("script");
        script.src = "../../node_modules/ckeditor5/dist/browser/ckeditor5.umd.js";
        script.onload = () => {
          const CKEDITOR = window.CKEDITOR;
          if (!CKEDITOR?.ClassicEditor) {
            window.__testCkEditorError = "CKEDITOR.ClassicEditor is unavailable";
            return;
          }

          const { ClassicEditor, Essentials, Paragraph, Bold, Italic, ImageInline } = CKEDITOR;

          class TestClassicEditor extends ClassicEditor {
            // ImageInline puts an inline object into a paragraph (typing next to it).
            static builtinPlugins = [Essentials, Paragraph, Bold, Italic, ImageInline];
            static defaultConfig = {
              toolbar: {
                items: ["bold", "italic"],
              },
            };
          }

          TestClassicEditor.create(document.getElementById("test-ckeditor"), {
            licenseKey: "GPL",
          })
            .then((editor) => {
              editor.ui.view.editable.element.id = "test-ckeditor-editable";
              window.__testCkEditorReady = true;
              window.__testCkEditor = editor;
            })
            .catch((error) => {
              window.__testCkEditorError = error?.message || String(error);
              console.error("CKEditor initialization failed in e2e test page.", error);
            });
        };
        script.onerror = () => {
          window.__testCkEditorError = "Failed to load CKEditor script";
        };
        document.head.appendChild(script);
      }

      window.__testQuillReady = false;
      window.__testQuillError = null;
      const quillGroup = document.getElementById("test-quill-group");
      if (!enableQuill) {
        quillGroup.style.display = "none";
      } else {
        const cssLink = document.createElement("link");
        cssLink.rel = "stylesheet";
        cssLink.href = "../../node_modules/quill/dist/quill.snow.css";
        document.head.appendChild(cssLink);

        const script = document.createElement("script");
        script.src = "../../node_modules/quill/dist/quill.js";
        script.onload = () => {
          if (typeof window.Quill !== "function") {
            window.__testQuillError = "window.Quill is unavailable";
            return;
          }
          try {
            const quill = new window.Quill("#test-quill", {
              theme: "snow",
              modules: { toolbar: false },
            });
            quill.root.id = "test-quill-editor";
            window.__testQuill = quill;
            window.__testQuillReady = true;
          } catch (error) {
            window.__testQuillError = error?.message || String(error);
            console.error("Quill initialization failed in e2e test page.", error);
          }
        };
        script.onerror = () => {
          window.__testQuillError = "Failed to load Quill script";
        };
        document.head.appendChild(script);
      }

      window.__testLexicalReady = false;
      window.__testLexicalError = null;
      const lexicalGroup = document.getElementById("test-lexical-group");
      if (!enableLexical) {
        lexicalGroup.style.display = "none";
      } else {
        const script = document.createElement("script");
        script.type = "module";
        script.src = "/test-lexical-editor.js";
        script.onerror = () => {
          window.__testLexicalError = "Failed to load Lexical test editor script";
        };
        document.head.appendChild(script);
      }
      const gutenbergGroup = document.getElementById("test-gutenberg-group");
      if (params.get("enableGutenberg") !== "1") gutenbergGroup.remove();
      else {
        if (params.get("gutenbergIframe") === "1") {
          const frame = document.createElement("iframe");
          frame.name = "editor-canvas";
          frame.style.cssText = "width:100%;height:600px;border:0";
          const html = `<!doctype html><html><head><style>body{font:16px sans-serif}.block-editor-rich-text__editable{min-height:24px;white-space:pre-wrap}</style></head><body><div id="test-gutenberg"></div><script src="${location.origin}/test-gutenberg-editor.js"><\/script></body></html>`;
          const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
          frame.src = url;
          frame.addEventListener("load", () => URL.revokeObjectURL(url), { once: true });
          gutenbergGroup.replaceChildren(frame);
        } else {
          const script = document.createElement("script");
          script.src = "/test-gutenberg-editor.js";
          document.body.appendChild(script);
        }
      }
      const proseMirrorGroup = document.getElementById("test-prosemirror-group");
      if (!enableProseMirror) {
        proseMirrorGroup.style.display = "none";
      } else {
        const script = document.createElement("script");
        script.src = "/test-prosemirror-editor.js";
        document.head.appendChild(script);
      }
      const slateGroup = document.getElementById("test-slate-group");
      if (!enableSlate) {
        slateGroup.style.display = "none";
      } else {
        const script = document.createElement("script");
        script.src = "/test-slate-editor.js";
        document.head.appendChild(script);
      }
      const tinyMceGroup = document.getElementById("test-tinymce-group");
      if (!params.has("tinyMceMode")) {
        tinyMceGroup.style.display = "none";
      } else {
        const script = document.createElement("script");
        script.src = "/test-tinymce-editor.js";
        document.head.appendChild(script);
      }
      // One real editor of the Review editor fixtures (tests/e2e/fixtures/review-editors).
      const reviewEditor = params.get("reviewEditor");
      if (!reviewEditor) {
        document.getElementById("test-review-editor-group").remove();
      } else {
        const script = document.createElement("script");
        script.src = `/test-review-${reviewEditor}.js`;
        document.head.appendChild(script);
      }
    </script>
  </body>
</html>
