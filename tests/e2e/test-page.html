<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FluentTyper Test Page</title>
    <style>
      body {
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        background-color: #f4f7f6;
        color: #333;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 50px;
      }

      h1 {
        font-weight: 600;
        color: #2c3e50;
        margin-bottom: 10px;
        text-align: center;
      }

      h2#test-name {
        font-weight: 400;
        color: #7f8c8d;
        margin-top: 0;
        margin-bottom: 30px;
        font-size: 1.2rem;
        text-align: center;
        max-width: 800px;
      }

      .container {
        display: flex;
        flex-direction: column;
        gap: 20px;
        width: 100%;
        max-width: 600px;
        background: #fff;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      label {
        font-size: 0.9em;
        font-weight: 500;
        color: #555;
      }

      textarea,
      input[type="text"],
      [contenteditable="true"] {
        padding: 12px 16px;
        font-family: inherit;
        font-size: 1rem;
        border: 1px solid #ddd;
        border-radius: 8px;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
        box-sizing: border-box;
      }

      textarea:focus,
      input[type="text"]:focus,
      [contenteditable="true"]:focus {
        outline: none;
        border-color: #3498db;
        box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
      }

      [contenteditable="true"] {
        min-height: 80px;
        cursor: text;
      }

      .ck-editor__editable {
        min-height: 80px;
      }
    </style>
  </head>

  <body>
    <h1>FluentTyper Testing Environment</h1>
    <h2 id="test-name"></h2>
    <div class="container">
      <div class="input-group">
        <label for="test-textarea">Textarea</label>
        <textarea id="test-textarea" rows="4"></textarea>
      </div>
      <div class="input-group">
        <label for="test-input">Text Input</label>
        <input type="text" id="test-input" />
      </div>
      <div class="input-group">
        <label for="test-contenteditable">Content Editable Div</label>
        <div contenteditable="true" id="test-contenteditable"></div>
      </div>
      <div class="input-group" id="test-ckeditor-group">
        <label for="test-ckeditor">CKEditor 5</label>
        <textarea id="test-ckeditor" rows="4"></textarea>
      </div>
    </div>
    <script>
      const params = new URLSearchParams(window.location.search);
      const testName = params.get("testName");
      const enableCkEditor = params.get("enableCkEditor") === "1";
      if (testName) {
        document.getElementById("test-name").textContent = testName;
      }

      window.__testCkEditorReady = false;
      window.__testCkEditorError = null;
      const ckEditorGroup = document.getElementById("test-ckeditor-group");
      if (!enableCkEditor) {
        ckEditorGroup.style.display = "none";
      } else {
        const script = document.createElement("script");
        script.src =
          "../../node_modules/@ckeditor/ckeditor5-build-classic/build/ckeditor.js";
        script.onload = () => {
          if (!window.ClassicEditor) {
            window.__testCkEditorError = "ClassicEditor global is unavailable";
            return;
          }

          window.ClassicEditor.create(
            document.getElementById("test-ckeditor"),
            {
              licenseKey: "GPL",
            },
          )
            .then((editor) => {
              editor.ui.view.editable.element.id = "test-ckeditor-editable";
              window.__testCkEditorReady = true;
              window.__testCkEditor = editor;
            })
            .catch((error) => {
              window.__testCkEditorError = error?.message || String(error);
              console.error(
                "CKEditor initialization failed in e2e test page.",
                error,
              );
            });
        };
        script.onerror = () => {
          window.__testCkEditorError = "Failed to load CKEditor script";
        };
        document.head.appendChild(script);
      }
    </script>
  </body>
</html>
