<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FluentTyper Test Page</title>
    <link rel="stylesheet" href="../../node_modules/ckeditor5/dist/browser/ckeditor5.css" />
    <style>
      body {
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        background-color: #f4f7f6;
        color: #333;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 50px;
      }

      h1 {
        font-weight: 600;
        color: #2c3e50;
        margin-bottom: 10px;
        text-align: center;
      }

      h2#test-name {
        font-weight: 400;
        color: #7f8c8d;
        margin-top: 0;
        margin-bottom: 30px;
        font-size: 1.2rem;
        text-align: center;
        max-width: 800px;
      }

      .container {
        display: flex;
        flex-direction: column;
        gap: 20px;
        width: 100%;
        max-width: 600px;
        background: #fff;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      label {
        font-size: 0.9em;
        font-weight: 500;
        color: #555;
      }

      textarea,
      input[type="text"],
      [contenteditable="true"] {
        padding: 12px 16px;
        font-family: inherit;
        font-size: 1rem;
        border: 1px solid #ddd;
        border-radius: 8px;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
        box-sizing: border-box;
      }

      textarea:focus,
      input[type="text"]:focus,
      [contenteditable="true"]:focus {
        outline: none;
        border-color: #3498db;
        box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
      }

      [contenteditable="true"] {
        min-height: 80px;
        cursor: text;
      }

      .ck-editor__editable {
        min-height: 80px;
      }

      #test-quill {
        min-height: 80px;
      }

      #test-quill .ql-editor {
        min-height: 80px;
      }

      #test-lexical-editor {
        min-height: 80px;
      }
    </style>
  </head>

  <body>
    <h1>FluentTyper Testing Environment</h1>
    <h2 id="test-name"></h2>
    <div class="container">
      <div class="input-group">
        <label for="test-textarea">Textarea</label>
        <textarea id="test-textarea" rows="4"></textarea>
      </div>
      <div class="input-group">
        <label for="test-input">Text Input</label>
        <input type="text" id="test-input" />
      </div>
      <div class="input-group">
        <label for="test-email">Email Input</label>
        <input type="email" id="test-email" />
      </div>
      <div class="input-group">
        <label for="test-url">URL Input</label>
        <input type="url" id="test-url" />
      </div>
      <div class="input-group">
        <label for="test-tel">Tel Input</label>
        <input type="tel" id="test-tel" />
      </div>
      <div class="input-group">
        <label for="test-disabled">Disabled Input</label>
        <input type="text" id="test-disabled" disabled />
      </div>
      <div class="input-group">
        <label for="test-readonly">Readonly Input</label>
        <input type="text" id="test-readonly" readonly />
      </div>
      <div class="input-group">
        <label for="test-contenteditable">Content Editable Div</label>
        <div contenteditable="true" id="test-contenteditable"></div>
      </div>
      <div class="input-group" id="test-ckeditor-group">
        <label for="test-ckeditor">CKEditor 5</label>
        <textarea id="test-ckeditor" rows="4"></textarea>
      </div>
      <div class="input-group" id="test-quill-group">
        <label for="test-quill">Quill</label>
        <div id="test-quill"></div>
      </div>
      <div class="input-group" id="test-lexical-group">
        <label for="test-lexical-editor">Lexical</label>
        <div id="test-lexical-editor" contenteditable="true"></div>
      </div>
    </div>
    <script>
      const params = new URLSearchParams(window.location.search);
      const testName = params.get("testName");
      const enableCkEditor = params.get("enableCkEditor") === "1";
      const enableQuill = params.get("enableQuill") === "1";
      const enableLexical = params.get("enableLexical") === "1";
      if (testName) {
        document.getElementById("test-name").textContent = testName;
      }

      window.__ftResetTestPage = () => {
        if (document.activeElement instanceof HTMLElement) {
          document.activeElement.blur();
        }
        window.getSelection?.()?.removeAllRanges();

        const clearElement = (element) => {
          if (element instanceof HTMLInputElement || element instanceof HTMLTextAreaElement) {
            element.value = "";
            return;
          }
          if (element instanceof HTMLElement && element.isContentEditable) {
            element.textContent = "";
          }
        };

        document
          .querySelectorAll("textarea, input, [contenteditable='true']")
          .forEach(clearElement);

        const disabledInput = document.getElementById("test-disabled");
        if (disabledInput instanceof HTMLInputElement) {
          disabledInput.disabled = true;
        }

        const readonlyInput = document.getElementById("test-readonly");
        if (readonlyInput instanceof HTMLInputElement) {
          readonlyInput.readOnly = true;
        }

        document.querySelector("ft-shadow-test-component")?.remove();
        document.getElementById("ft-late-shadow-host")?.remove();
        document.getElementById("ft-nested-shadow-outer-host")?.remove();

        if (window.__testCkEditor?.setData) {
          void window.__testCkEditor.setData("");
        }
        if (window.__testQuill?.setText) {
          window.__testQuill.setText("");
        }
        if (window.__testLexical?.update) {
          window.__testLexical.update(() => {
            const root = window.__testLexical.getRootElement();
            if (root instanceof HTMLElement) {
              root.textContent = "";
            }
          });
        }

        const testNameHeading = document.getElementById("test-name");
        if (testNameHeading) {
          testNameHeading.textContent = testName || "";
        }
      };

      window.__testCkEditorReady = false;
      window.__testCkEditorError = null;
      const ckEditorGroup = document.getElementById("test-ckeditor-group");
      if (!enableCkEditor) {
        ckEditorGroup.style.display = "none";
      } else {
        const script = document.createElement("script");
        script.src = "../../node_modules/ckeditor5/dist/browser/ckeditor5.umd.js";
        script.onload = () => {
          const CKEDITOR = window.CKEDITOR;
          if (!CKEDITOR?.ClassicEditor) {
            window.__testCkEditorError = "CKEDITOR.ClassicEditor is unavailable";
            return;
          }

          const { ClassicEditor, Essentials, Paragraph, Bold, Italic } = CKEDITOR;

          class TestClassicEditor extends ClassicEditor {
            static builtinPlugins = [Essentials, Paragraph, Bold, Italic];
            static defaultConfig = {
              toolbar: {
                items: ["bold", "italic"],
              },
            };
          }

          TestClassicEditor.create(document.getElementById("test-ckeditor"), {
            licenseKey: "GPL",
          })
            .then((editor) => {
              editor.ui.view.editable.element.id = "test-ckeditor-editable";
              window.__testCkEditorReady = true;
              window.__testCkEditor = editor;
            })
            .catch((error) => {
              window.__testCkEditorError = error?.message || String(error);
              console.error("CKEditor initialization failed in e2e test page.", error);
            });
        };
        script.onerror = () => {
          window.__testCkEditorError = "Failed to load CKEditor script";
        };
        document.head.appendChild(script);
      }

      window.__testQuillReady = false;
      window.__testQuillError = null;
      const quillGroup = document.getElementById("test-quill-group");
      if (!enableQuill) {
        quillGroup.style.display = "none";
      } else {
        const cssLink = document.createElement("link");
        cssLink.rel = "stylesheet";
        cssLink.href = "../../node_modules/quill/dist/quill.snow.css";
        document.head.appendChild(cssLink);

        const script = document.createElement("script");
        script.src = "../../node_modules/quill/dist/quill.js";
        script.onload = () => {
          if (typeof window.Quill !== "function") {
            window.__testQuillError = "window.Quill is unavailable";
            return;
          }
          try {
            const quill = new window.Quill("#test-quill", {
              theme: "snow",
              modules: { toolbar: false },
            });
            quill.root.id = "test-quill-editor";
            window.__testQuill = quill;
            window.__testQuillReady = true;
          } catch (error) {
            window.__testQuillError = error?.message || String(error);
            console.error("Quill initialization failed in e2e test page.", error);
          }
        };
        script.onerror = () => {
          window.__testQuillError = "Failed to load Quill script";
        };
        document.head.appendChild(script);
      }

      window.__testLexicalReady = false;
      window.__testLexicalError = null;
      const lexicalGroup = document.getElementById("test-lexical-group");
      if (!enableLexical) {
        lexicalGroup.style.display = "none";
      } else {
        const script = document.createElement("script");
        script.type = "module";
        script.src = "/test-lexical-editor.js";
        script.onerror = () => {
          window.__testLexicalError = "Failed to load Lexical test editor script";
        };
        document.head.appendChild(script);
      }
    </script>
  </body>
</html>
