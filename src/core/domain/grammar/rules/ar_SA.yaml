        return: >-
          [
            past,
            past + "ت",
            past + "وا",
            past + "ت",
            past + "نا",
            past + "تم",
            past + "ن",
            "ي" + present,
            "ت" + present,
            "ي" + present + "ون",
            "ت" + present + "ون",
            "ن" + present,
            first,
            "ي" + present,
            "ت" + present,
            "ن" + present,
            first,
            "ي" + present + "وا",
            "ت" + present + "وا",
