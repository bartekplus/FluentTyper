          - placeHead || PREDICATE_HEAD.has(head.word) || attachedPreposition(head.word)
          - last < list.length && adjacentToken(list[last])
          - "!list.slice(i + 1, last + 1).some((token) => LINKING_OBJECT.test(token.word))"
