        args: "ctx: DetectContext, list: readonly ArabicToken[], i: number, j: number"
        type: ArabicFinding[] | null
        let:
          role: list[j]
        when: j <= i + 2 && role && adjacentToken(role)
        return: >-
          /^ك(?!ال)\p{L}{3,}$/u.test(role.word) && ownsAt(ctx, role.start)
