          [/^ان(\p{L})(\p{L})ا(\p{L})$/u, [1, 2, 3], "ان$1$2$3", "ن$1$2$3"],
          [/^ا(\p{L})ت(\p{L})ا(\p{L})$/u, [1, 2, 3], "ا$1ت$2$3", "$1ت$2$3"],
