          ["عمل", ["عمل", "عمل"]],
          ["أكل", ["أكل", "أكل"]],
          ["دراسة", ["درس", "درس"]],
          ["كتابة", ["كتب", "كتب"]],
          ["شرح", ["شرح", "شرح"]],
          ["فحص", ["فحص", "فحص"]],
          ["جمع", ["جمع", "جمع"]],
          ["بحث", ["بحث", "بحث"]],
          ["سؤال", ["سأل", "سأل"]],
          ["تحليل", ["حلل", "حلل"]],
          ["تنظيم", ["نظم", "نظم"]],
          ["تطوير", ["طور", "طور"]],
          ["تصميم", ["صمم", "صمم"]],
          ["تقديم", ["قدم", "قدم"]],
          ["تنفيذ", ["نفذ", "نفذ"]],
          ["تحقيق", ["حقق", "حقق"]],
          ["تغيير", ["غير", "غير"]],
          ["تسجيل", ["سجل", "سجل"]],
          ["تعديل", ["عدل", "عدل"]],
          ["ترجمة", ["ترجم", "ترجم"]],
          ["مراجعة", ["راجع", "راجع"]],
          ["مساعدة", ["ساعد", "ساعد"]],
          ["مناقشة", ["ناقش", "ناقش"]],
          ["متابعة", ["تابع", "تابع"]],
          ["مشاركة", ["شارك", "شارك"]],
          ["إرسال", ["أرسل", "رسل"]],
          ["إصلاح", ["أصلح", "صلح"]],
          ["إعلان", ["أعلن", "علن"]],
          ["إغلاق", ["أغلق", "غلق"]],
          ["إنتاج", ["أنتج", "نتج"]],
          ["استخدام", ["استخدم", "ستخدم"]],
