      asRole:
        args: "ctx: DetectContext, list: readonly ArabicToken[], i: number"
        type: ArabicFinding[] | null
        when: i + 1 < list.length && WORK.test(list[i].word)
        return: roleAt(ctx, list, i, i + 1)
      # "سيما الراتب" -> "لا سيما الراتب": سيّما is not used without لا.
      laSiyyama:
        args: "ctx: DetectContext, list: readonly ArabicToken[], i: number"
        type: ArabicFinding[] | null
        let:
          token: list[i]
        when:
          - /^[وف]?سيما$/u.test(token.word) && ownsAt(ctx, token.start)
          - "!(i > 0 && adjacentToken(token) && /^[وف]?لا$/u.test(list[i - 1].word))"
        return: >-
          [
            {
              messageKey: "review_msg_style_phrasing",
              range: { start: token.end - 4, end: token.end },
              alternatives: ["لا سيما"],
              context: { start: token.start, end: token.end },
            },
          ]
      # "ل" + a word: "الكتاب" -> "للكتاب", "اللغة" -> "للغة".
      withLam:
        args: "word: string"
        return: 'word.startsWith("الل") ? "ل" + word.slice(2) : word.startsWith("ال") ? "ل" + word.slice(1) : "ل" + word'
      # A style finding with one fix.
      styleFinding:
        args: "start: number, end: number, fixed: string"
        type: ArabicFinding
        return: '{ messageKey: "review_msg_style_phrasing", range: { start, end }, alternatives: [fixed] }'
      # A style finding when the chunk owns its start.
      ownedStyle:
        args: "ctx: DetectContext, start: number, end: number, fixed: string"
        type: ArabicFinding[]
        return: "ownsAt(ctx, start) ? [styleFinding(start, end, fixed)] : []"
      # "القيام بدراسة الملف" -> "دراسة الملف": the verbal noun alone names the act. Only for a
      # noun that is itself a verbal noun ("القيام بالواجب" keeps its verb).
      doingTheAct:
        args: "ctx: DetectContext, list: readonly ArabicToken[], i: number"
        type: ArabicFinding[] | null
        let:
          parts: "/^(?<conj>[وف]?)(?<prep>بال|لل|ال)قيام$/u.exec(list[i].word)"
          act: list[i + 1]
          actParts: '/^ب(?<article>ال)?(?<noun>\p{L}{3,})$/u.exec(act.word)'
          noun: actParts.groups!.noun
          phrase: (actParts.groups!.article ?? "") + noun
          prep: parts.groups!.prep
        when:
          - i + 1 < list.length
          - parts && actParts && adjacentToken(act) && ownsAt(ctx, list[i].start)
          - derivedStems(noun) || PLAIN_VERBAL_NOUNS.has(noun)
        return: '[styleFinding(list[i].start, act.end, parts.groups!.conj + (prep === "بال" ? "ب" + phrase : prep === "لل" ? withLam(phrase) : phrase))]'
      # "بشكل كبير" -> "كثيرا": adverbs for the commonest adjectives.
      ADVERBS: 'new Map([["عام", "عموما"], ["خاص", "خصوصا"], ["كبير", "كثيرا"], ["جيد", "جيدا"], ["قوي", "بقوة"], ["سريع", "بسرعة"], ["دائم", "دائما"], ["مستمر", "باستمرار"], ["مباشر", "مباشرة"], ["واضح", "بوضوح"], ["كامل", "كاملا"]])'
      # Adjective shapes: participles (م-), فاعل, فعيل, فعول.
      ADJECTIVE_SHAPE: '/^(?:م\p{L}{3,}|\p{L}ا\p{L}{2}|\p{L}{2}[يو]\p{L})$/u'
      # "بشكل مناسب" -> "على نحو مناسب", "بصورة يومية" -> "يوميا", "بأسلوب عام" -> "عموما": a calque
      # of "in a ... way"; a relational adjective makes an adverb, others take على نحو.
      inAWay:
        args: "ctx: DetectContext, list: readonly ArabicToken[], i: number"
        type: ArabicFinding[] | null
        let:
          parts: "/^(?<pre>[وف]?)ب(?<way>شكل|صورة|أسلوب|طريقة)$/u.exec(list[i].word)"
          next: list[i + 1]
          feminineWay: parts.groups!.way.endsWith("ة")
          adj: "feminineWay ? next.word.slice(0, -1) : next.word"
          fixed: >-
            ADVERBS.get(adj) ??
            (/^\p{L}{2,}ي$/u.test(adj) ? adj + "ا" : ADJECTIVE_SHAPE.test(adj) ? `على نحو ${adj}` : undefined)
        when:
          - i + 1 < list.length
          - parts && adjacentToken(next) && ownsAt(ctx, list[i].start)
          - 'feminineWay ? next.word.endsWith("ة") : !next.word.endsWith("ة")'
          - '!adj.startsWith("ال")'
          - fixed
        return: "[styleFinding(list[i].start, next.end, parts.groups!.pre + fixed)]"
      # Durations and their accusative: "لأيام" -> "أياما".
      DURATIONS: >-
        new Map([
          ..."ساعة ساعات ساعتين يومين أسابيع أسبوعين شهرين سنة سنوات سنين سنتين عامين دقيقة دقائق دقيقتين فترة مدة لحظة لحظات"
            .split(" ")
            .map((word) => [word, word] as const),
          ...["يوم", "أيام", "أسبوع", "شهر", "أشهر", "شهور", "عام", "أعوام", "قرن", "قرون"].map((word) => [word, word + "ا"] as const),
        ])
      SINGULAR_DURATION: /^(?:ساعة|يوم|أسبوع|شهر|سنة|عام|دقيقة|لحظة|قرن)$/u
      DURATION_ADJECTIVE: /^(?:واحد|واحدة|كامل|كاملة|طويل|طويلة|قصير|قصيرة|أو)$/u
      # A finite verb by its shape: a past with a subject ending, or an imperfect.
      VERB_LIKE: '/^[وف]?(?:س?[يتنأ]\p{L}{2,}(?:ون)?|\p{L}{2,}(?<!ا)(?:ت|تم|نا|وا))$/u'
      # "عملت لساعات" -> "عملت ساعات": a duration after a verb is an adverb in the accusative,
      # with no لـ. Not after a noun ("خطة لعامين"), nor before a genitive ("ليوم الجمعة").
      forADuration:
        args: "ctx: DetectContext, list: readonly ArabicToken[], i: number"
        type: ArabicFinding[] | null
        let:
          parts: '/^(?<pre>[وف]?)ل(?<noun>\p{L}+)$/u.exec(list[i].word)'
          fixed: parts && DURATIONS.get(parts.groups!.noun)
          next: 'list[i + 1] && adjacentToken(list[i + 1]) ? list[i + 1].word : ""'
          previous: list[i - 1].word
        when:
          - i >= 1
          - fixed && adjacentToken(list[i]) && ownsAt(ctx, list[i].start)
          - '!next.startsWith("ال")'
          - "!(SINGULAR_DURATION.test(parts.groups!.noun) && next && !DURATION_ADJECTIVE.test(next))"
          - >-
            (VERB_LIKE.test(previous) && !previous.endsWith("ة")) ||
            (/^ال\p{L}+$/u.test(previous) && i > 1 && adjacentToken(list[i - 1]) && VERB_LIKE.test(list[i - 2].word))
        return: "[styleFinding(list[i].start, list[i].end, parts.groups!.pre + fixed)]"
      NOT_LAM_PREPOSITION: '/^(?:لا|لم|لن|لكن\p{L}*|لكي|لدى|لدي\p{L}*|لأن\p{L}*|لما|لقد|لعل|لو|ليس\p{L}*|ليت|لذلك|لهذا|لهذه|لي)$/u'
      MA_PRONOUNS: 'new Map([["معه", "به"], ["معها", "بها"], ["معهم", "بهم"], ["معي", "بي"], ["معنا", "بنا"], ["معك", "بك"], ["معكم", "بكم"]])'
      LI_PRONOUNS: 'new Map([["له", "فيه"], ["لها", "فيها"], ["لهم", "فيهم"]])'
      WISH: /^[وفبل]?(?:ال|لل)?رغب(?:ة|ات|ته|تها|تهم|تي|تنا|تك|تكم)$/u
      RELATION: /^[وفبل]?(?:ال|لل)?علاق(?:ة|ات|ته|تها|تهم|تي|تنا|تك|تكم|اته|اتها|اتهم|اتنا)$/u
      # Prepositions after nouns: a wish is "في" ("رغبة في الكتابة"), a relation "بـ" ("علاقة
      # بابنه"), caution "لـ" ("تحسبا لكل طارئ"). One feminine adjective may stand between the
      # noun and its preposition ("رغبة شديدة لـ", "علاقة وثيقة مع").
      nounPrepositions:
        args: "ctx: DetectContext, list: readonly ArabicToken[], i: number"
        type: ArabicFinding[] | null
        let:
          head: list[i].word
          j: '/^[^ل]\p{L}{2,}ة$/u.test(list[i + 1].word) && adjacentToken(list[i + 2]) ? i + 2 : i + 1'
          word: list[j].word
        when:
          - i + 2 < list.length
          - adjacentToken(list[i + 1])
        return: >-
          WISH.test(head)
            ? /^ل\p{L}{2,}$/u.test(word) && !NOT_LAM_PREPOSITION.test(word)
              ? ownedStyle(ctx, list[j].start, list[j].end, LI_PRONOUNS.get(word) ?? (word.startsWith("لل") ? "في ال" + word.slice(2) : "في " + word.slice(1)))
              : []
            : RELATION.test(head)
              ? MA_PRONOUNS.has(word)
                ? ownedStyle(ctx, list[j].start, list[j].end, MA_PRONOUNS.get(word)!)
                : word === "مع" && list[j + 1] && adjacentToken(list[j + 1])
                  ? ownedStyle(ctx, list[j].start, list[j + 1].end, "ب" + list[j + 1].word)
                  : []
              : /^و?تحسبا$/u.test(head) && list[i + 1].word === "من" && adjacentToken(list[i + 2])
                ? ownedStyle(ctx, list[i + 1].start, list[i + 2].end, withLam(list[i + 2].word))
                : []
      # "غير بالغ" (not adult), "غير بالضرورة" (not necessarily): adverbs, not an object.
      NOT_AFTER_GHAYR: /^بال(?:غ|ضرورة|كامل|مرة|تأكيد|طبع)/u
      # "لا تستعن سوى بالله" -> "بسوى الله", "غير بالله" -> "بغير الله": the preposition goes before
      # the word of exception (for غير only بـ: "غير بالغ" is "not adult").
      exceptPreposition:
        args: "ctx: DetectContext, list: readonly ArabicToken[], i: number"
        type: ArabicFinding[] | null
        let:
          word: list[i].word
          next: list[i + 1].word
          attached: '/^(?<p>[بل])(?<rest>ال\p{L}{2,})$/u.exec(next.startsWith("لل") ? "لال" + next.slice(2) : next)'
          fixed: "SEPARATE_PREPOSITIONS.has(next) ? `${next} ${word}` : attached && `${attached.groups!.p}${word} ${attached.groups!.rest}`"
        when:
          - i + 1 < list.length
          - (word === "سوى" || word === "غير") && adjacentToken(list[i + 1]) && ownsAt(ctx, list[i].start)
          - '!(word === "غير" && (attached?.groups!.p !== "ب" || NOT_AFTER_GHAYR.test(next)))'
          - fixed
        return: "[styleFinding(list[i].start, list[i + 1].end, fixed)]"
      CLAUSE_BREAK: /[.،,؛;!؟?:\n]/u
      STILL_PAST: /^(?:زال|زلت|زالت|زلنا|زالوا|دام|دمت|برح|انفك)$/u
      # أبدًا after a past negation, up to 5 words back in the clause (k is the word to read).
      neverPast:
        args: "ctx: DetectContext, list: readonly ArabicToken[], i: number, k: number"
        type: ArabicFinding[]
        when: k >= 0 && k >= i - 5 && !CLAUSE_BREAK.test(list[k + 1].gap) && !/^[وف]?(?:لن|لا)$/u.test(list[k].word)
        return: >-
          list[k].word === "لم" || (list[k].word === "ما" && !STILL_PAST.test(list[k + 1].word))
            ? [styleFinding(list[i].start, list[i].end + (ctx.text[list[i].end] === "\u064B" ? 1 : 0), "قط")]
            : neverPast(ctx, list, i, k - 1)
        else: "[]"
      # "لم أره أبدا" -> "لم أره قط": أبدًا is for the future, قطّ for the past; "أثناء العمل" ->
      # "في أثناء العمل".
      timeAdverbs:
        args: "ctx: DetectContext, list: readonly ArabicToken[], i: number"
        type: ArabicFinding[]
        let:
          word: list[i].word
          during: "/^(?<pre>[وف]?)أثناء$/u.exec(word)"
        return: >-
          [
            ...(word === "أبدا" && ownsAt(ctx, list[i].start) ? neverPast(ctx, list, i, i - 1) : []),
            ...(during &&
            ownsAt(ctx, list[i].start) &&
            !/^[وف]?(?:في|من)$/u.test(i > 0 && !CLAUSE_BREAK.test(list[i].gap) ? list[i - 1].word : "")
              ? [styleFinding(list[i].start, list[i].end, during.groups!.pre + "في أثناء")]
              : []),
          ]
      # The second "وأما أن" of an either-or, from `k` to 13 words after the first, in its
      # sentence, or -1.
      secondEither:
        args: "list: readonly ArabicToken[], i: number, k: number"
        type: number
        return: >-
          k + 1 < list.length && k < i + 14 && !/[.!؟?\n]/u.test(list[k].gap)
            ? list[k].word === "وأما" && list[k + 1].word === "أن"
              ? k
              : secondEither(list, i, k + 1)
            : -1
      # "فأما أن تحفظه وأما أن تضيعه" -> "فإما ... وإما": the choice is إمّا.
      eitherOr:
        args: "ctx: DetectContext, list: readonly ArabicToken[], i: number"
        type: ArabicFinding[] | null
        let:
          first: "/^(?<pre>[وف]?)أما$/u.exec(list[i].word)"
          k: secondEither(list, i, i + 2)
        when:
          - i + 1 < list.length
          - first && list[i + 1].word === "أن" && adjacentToken(list[i + 1])
          - k >= 0
        return: >-
          [
            ...ownedStyle(ctx, list[i].start, list[i].end, first.groups!.pre + "إما"),
            ...ownedStyle(ctx, list[k].start, list[k].end, "وإما"),
          ]
      # هامّ is "worrying": an important matter is مهمّ. A bare هام is also "wandered", so only as
      # a predicate closing the clause ("الأمر هام", "القرار هام جدا").
      HAMM: /^(?<pre>[وف]?)هام(?<f>ة?)$/u
      important:
        args: "ctx: DetectContext, list: readonly ArabicToken[], i: number"
        type: ArabicFinding[] | null
        let:
          parts: HAMM.exec(list[i].word)
          next: list[i + 1]
        when:
          - i >= 1
          - parts && adjacentToken(list[i]) && /^[وف]?ال\p{L}{2,}$/u.test(list[i - 1].word)
          - >-
            (!next ||
              CLAUSE_BREAK.test(ctx.text.slice(list[i].end, next.start)) ||
              /^(?:جدا|للغاية|لنا|لي|لك|لكم|له|لها|لهم)$/u.test(next.word)) &&
            ownsAt(ctx, list[i].start)
        return: "[styleFinding(list[i].start, list[i].end, `${parts.groups!.pre}مهم${parts.groups!.f}`)]"
      # Verbs that take their objects directly: "أعطى صاحبه كتابا", "كلفه العمل" (not the bare
      # "أصحبه", also "I accompany him").
      DIRECT_LI: /^[وف]?(?:أعطى|أعطت|أعطوا|يعطي|تعطي|يعطون|نعطي)$/u
      DIRECT_BI: /^[وف]?(?:كلف|كلفت|كلفوا|يكلف|تكلف|يكلفون|غرم|غرمت|يغرم|أصحبت|أصحبوا)(?:ه|ها|هم|ني|نا|ك|كم)$/u
      BI_PRONOUN: 'new Map([["به", "إياه"], ["بها", "إياها"], ["بهم", "إياهم"]])'
      # One trades in (في) goods. Not the bare "تاجر", also "a merchant".
      TRADE: /^[وف]?(?:تاجرت|تاجروا|يتاجر|تتاجر|يتاجرون|نتاجر|أتاجر)$/u
      # "أعطى لصاحبه كتابا" -> "أعطى صاحبه", "كلفه بالعمل" -> "كلفه العمل", "كلفه به" -> "كلفه
      # إياه", "يتاجر بالقطن" -> "يتاجر في القطن".
      directObjects:
        args: "ctx: DetectContext, list: readonly ArabicToken[], i: number"
        type: ArabicFinding[] | null
        let:
          object: list[i + 1]
          word: object.word
          fixed: >-
            DIRECT_LI.test(list[i].word) && /^ل\p{L}{3,}$/u.test(word) && !NOT_LAM_PREPOSITION.test(word)
              ? word.startsWith("لل")
                ? "ال" + word.slice(2)
                : word.slice(1)
              : DIRECT_BI.test(list[i].word) && /^ب(?:ال\p{L}{2,}|\p{L}{3,}ة)$/u.test(word)
                ? word.slice(1)
                : DIRECT_BI.test(list[i].word) && BI_PRONOUN.has(word)
                  ? BI_PRONOUN.get(word)!
                  : TRADE.test(list[i].word) && /^ب\p{L}{3,}$/u.test(word)
                    ? "في " + word.slice(1)
                    : undefined
        when:
          - i + 1 < list.length
          - adjacentToken(object) && ownsAt(ctx, object.start)
          - fixed !== undefined
        return: "[styleFinding(object.start, object.end, fixed)]"
      # "الجهاز عبارة عن صندوق" -> "الجهاز صندوق": عبارة عن adds nothing to the predicate. After
      # هو/هي the table rows keep the pronoun.
      amountsTo:
        args: "ctx: DetectContext, list: readonly ArabicToken[], i: number"
        type: ArabicFinding[] | null
        when:
          - i + 2 < list.length
          - list[i].word === "عبارة" && list[i + 1].word === "عن" && adjacentToken(list[i + 1])
          - adjacentToken(list[i + 2]) && ownsAt(ctx, list[i].start)
          - "!(i > 0 && /^(?:هو|هي|هم)$/u.test(list[i - 1].word))"
        return: '[styleFinding(list[i].start, list[i + 2].start, "")]'
      # Verbs of mutual fit: "يتناسب مع رأيه" (or "يتناسب هو ورأيه"), not "يتناسب ورأيه".
      MUTUAL: /^[وف]?(?:[يت](?:تناسب|تنافى|تلاءم|تلائم|تعارض|تناقض|تطابق|توافق|تكامل|تساوى)(?:ون|ان)?|تناسبت|تنافت|تعارضت|تناقضت|تطابقت|توافقت)$/u
      # Words whose own first letter is و: "لا يتناسب وضعه مع دخله" (his situation).
      WAW_ROOT: /^و(?:ال)?(?:ضع|قت|جه|جو|زن|صف|ظيف|عد|اقع|سع|طن|حد|لد|قع|سائل|سيل|ثيق|صول|قوف|جب|عي|زير|زار|رق|رد|فق|فر|سط|حش|هم|راث|ريث|صي)/u
      # "يتناسب ورأيه" -> "يتناسب مع رأيه": with no pronoun between, the partner takes مع. "لا
      # يتناسب ... مع": the partner comes later, this is the subject.
      mutualWaw:
        args: "ctx: DetectContext, list: readonly ArabicToken[], i: number"
        type: ArabicFinding[] | null
        let:
          partner: list[i + 1]
          parts: '/^و(?<rest>\p{L}{2,})$/u.exec(partner.word)'
        when:
          - i + 1 < list.length
          - MUTUAL.test(list[i].word) && adjacentToken(partner) && ownsAt(ctx, partner.start)
          - parts && !WAW_ROOT.test(partner.word)
          - '!list.slice(i + 2, i + 5).some((token) => /^مع\p{L}*$/u.test(token.word))'
        return: "[styleFinding(partner.start, partner.end, `مع ${parts.groups!.rest}`)]"
      NEGATION: /^[وف]?(?:ما|لا|لم|لن|ليس|ليست)$/u
      # After و, a word that is no verb: a pronoun, قد of a state, a preposition with a pronoun,
      # or a verb whose root starts with و ("إلا وجدته").
      NOT_AFTER_ILLA_WAW: '/^و(?:هو|هي|هم|هن|أنا|نحن|أنت|أنتم|قد|لكن|لا|في\p{L}*|ل(?:ه|ها|هم|هما|نا|ي|ك|كم)|ب(?:ه|ها|هم)|علي\p{L}*|من\p{L}*|عند\p{L}*|مع\p{L}*|ال\p{L}*)$|^و(?:جد|صل|قع|ضع|قف|لد|عد|جب|ثق|رد|سع|هب|زن|فى|كل|دع|صف|لي|عى|قى|رث)/u'
      # A negation in the clause before the exception, up to 6 words back (j is the word to read).
      negatedBefore:
        args: "ctx: DetectContext, list: readonly ArabicToken[], i: number, j: number"
        type: boolean
        return: >-
          j >= Math.max(0, i - 6) &&
          !CLAUSE_BREAK.test(ctx.text.slice(list[j].end, list[j + 1].start)) &&
          (NEGATION.test(list[j].word) || negatedBefore(ctx, list, i, j - 1))
      # "ما تحدث إلا وقال خيرا" -> "إلا قال": after an exception the verb takes no و.
      exceptAnd:
        args: "ctx: DetectContext, list: readonly ArabicToken[], i: number"
        type: ArabicFinding[] | null
        let:
          verb: list[i + 1]
        when:
          - i >= 1 && i + 1 < list.length
          - list[i].word === "إلا" && adjacentToken(verb) && ownsAt(ctx, verb.start)
          - '/^و\p{L}{3,6}$/u.test(verb.word) && !NOT_AFTER_ILLA_WAW.test(verb.word)'
          - negatedBefore(ctx, list, i, i - 1)
        return: '[styleFinding(verb.start, verb.start + 1, "")]'
      # "نحن كمعلمين" -> "نحن المعلمين": "we, the teachers" is the specifying accusative.
      weAs:
        args: "ctx: DetectContext, list: readonly ArabicToken[], i: number"
        type: ArabicFinding[] | null
        let:
          group: list[i + 1]
          parts: '/^ك(?<who>م\p{L}{3,}(?:ين|ون)|عرب|بشر)$/u.exec(group.word)'
        when:
          - i + 1 < list.length
          - /^[وف]?نحن$/u.test(list[i].word) && adjacentToken(group) && ownsAt(ctx, group.start)
          - parts
        return: '[styleFinding(group.start, group.end, "ال" + parts.groups!.who)]'
      # "بين ما كنت عائدا" at a sentence start -> "بينما" (while), not "between what". "بين ما كان
      # وما سيكون": between the two.
      whileJoined:
        args: "ctx: DetectContext, list: readonly ArabicToken[], i: number"
        type: ArabicFinding[] | null
        let:
          leadStart: Math.max(0, list[i].start - 40)
          lead: ctx.text.slice(leadStart, list[i].start)
          clause: list.slice(i + 3, i + 10)
          end: clause.findIndex((token) => CLAUSE_BREAK.test(token.gap))
        when:
          - i + 2 < list.length
          - list[i].word === "بين" && list[i + 1].word === "ما" && adjacentToken(list[i + 1])
          - '/(?:[.!؟?\n]|^)[^\p{L}\p{N}]*$/u.test(lead) && !(leadStart > 0 && !/[.!؟?\n]/u.test(lead))'
          - /^(?:كان|كانت|كنت|كنا|كانوا|كنتم)$/u.test(list[i + 2].word)
          - '!(end < 0 ? clause : clause.slice(0, end)).some((token) => token.word === "وما")'
          - ownsAt(ctx, list[i].start)
        return: '[styleFinding(list[i].start, list[i + 1].end, "بينما")]'
      LIES: /^[وف]?(?:يقع|تقع|وقع|وقعت|يمتد|تمتد|امتد|امتدت|يبعد|تبعد|يقيم|تقيم|أقام|أقامت)$/u
      COMPASS: /^(?:شمالي|جنوبي|شرقي|غربي)$/u
      # "تقع دمشق جنوبي حلب" -> "جنوب حلب": the place word is the adverb; the -ي adjective names a
      # part ("في جنوبي لبنان" is left alone).
      compassAdverb:
        args: "ctx: DetectContext, list: readonly ArabicToken[], i: number"
        type: ArabicFinding[] | null
        let:
          place: list[i + 1]
        when:
          - i >= 1 && i + 1 < list.length
          - COMPASS.test(list[i].word) && adjacentToken(list[i]) && adjacentToken(place)
          - '!place.word.startsWith("ال") && ownsAt(ctx, list[i].start)'
          - (LIES.test(list[i - 1].word) || (i > 1 && LIES.test(list[i - 2].word))) && !STYLE_PREPOSITIONS.has(list[i - 1].word)
        return: "[styleFinding(list[i].start, list[i].end, list[i].word.slice(0, -1))]"
      # The forms of a sound verb (by its past and imperfect stems) and their replacements, by
      # the slots of QAMA. A later slot of the same form wins. "تتعطش" -> "تعطش" would land on the
      # typed past "تعطش": such a form is left out (DROPPED keeps the forms left out so far).
      verbForms:
        args: "past: string, present: string, fixPast: string, fixPresent: string"
        let:
          seen: new Map(QAMA.map((_, slot) => [slotForm(past, present, slot), slotForm(fixPast, fixPresent, slot)] as const))
          dropped: new Set<string>()
        return: >-
          new Map(
            [...seen].filter(
              ([typed, fixed]) => !(fixed !== typed && seen.has(fixed) && !dropped.has(fixed) && dropped.add(typed)),
            ),
          )
      # Optional "say, don't say" advice from Arabic usage guides: a modern verb sense careful
      # writers replace with the classical one. The adjacent forms are phrase rows; these entries
      # cover a verb split from its confirming word, with the subject or a word between them:
      # "استقل الوزير السيارة", "فتحت الشرطة النار". "تمادى الطالب على زميله": against a person
      # it is تطاول على.
      GAPPED: >-
        [
          [verbForms("استقل", "ستقل", "ركب", "ركب"), /^(?:ال)?(?:سيار|قطار|طائر|حافل|سفين)\p{L}*$/u],
          [verbForms("فتح", "فتح", "أطلق", "طلق"), /^(?:النار|الرصاص)$/u],
          [verbForms("تستر", "تستر", "ستر", "ستر"), /^على\p{L}*$/u],
          [verbForms("صادق", "صادق", "صدق", "صدق"), /^على\p{L}*$/u],
          [verbForms("افتقد", "فتقد", "افتقر", "فتقر"), /^إلى$/u],
          [
            new Map([
              ["تمادى", "تطاول"],
              ["تمادت", "تطاولت"],
              ["تمادوا", "تطاولوا"],
              ["يتمادى", "يتطاول"],
              ["تتمادى", "تتطاول"],
              ["يتمادون", "يتطاولون"],
            ]),
            /^على\p{L}*$/u,
          ],
        ] as [ReadonlyMap<string, string>, RegExp][]
      # A preposition between them opens its own phrase: "تمادى في الكذب على الناس".
      GAP_PREPOSITION: /^(?:في|على|إلى|من|عن|مع|ب\p{L}+|ل\p{L}+)$/u
      SPACES: /^[ \t\u00a0]+$/u
      # The confirming word of a gapped verb at `k` (two or three words after the verb at `i`,
      # with only spaces between), or -1.
      gappedTarget:
        args: "list: readonly ArabicToken[], i: number, target: RegExp, k: number"
        type: number
        return: >-
          k <= i + 3 && k < list.length && SPACES.test(list[k].gap) && SPACES.test(list[k - 1].gap) && !GAP_PREPOSITION.test(list[k - 1].word)
            ? target.test(list[k].word)
              ? k
              : gappedTarget(list, i, target, k + 1)
            : -1
      # A verb of one GAPPED entry ("فتحت" is a verb of its own; "وفتحت" carries و): the verb
      # gets the replacement.
      gappedEntry:
        args: "ctx: DetectContext, list: readonly ArabicToken[], i: number, verbs: ReadonlyMap<string, string>, target: RegExp"
        type: ArabicFinding[]
        let:
          word: list[i].word
          pre: 'verbs.has(word) || !/^[وف]/u.test(word) ? "" : word[0]'
          fixed: verbs.get(word.slice(pre.length))
        when:
          - fixed
          - gappedTarget(list, i, target, i + 2) >= 0 && ownsAt(ctx, list[i].start)
        return: '[{ messageKey: "review_msg_style_phrasing", range: { start: list[i].start, end: list[i].end }, alternatives: [pre + fixed] }]'
        else: "[]"
      # A verb from GAPPED, one or two words, then its confirming word, with only spaces between.
      gappedUsage:
        args: "ctx: DetectContext, list: readonly ArabicToken[], i: number"
        type: ArabicFinding[] | null
        when: i + 2 < list.length
        return: "GAPPED.flatMap(([verbs, target]) => gappedEntry(ctx, list, i, verbs, target))"
    frames:
      # Optional: "المرأتان ذاتا مكانة" -> "ذواتا".
      - regex: "{{START}}ذاتا{{END}}"
        scan: text
        lookback: 96
        flags: gu
        return: walkTokens(m, ctx, frame, dualPossessor)
      # Optional: "هذا قميص قديمة.": an indefinite adjective after an indefinite noun. Every word
      # can be the noun.
      - regex: "{{WORD}}"
        scan: text
        lookback: 96
        flags: gu
        return: walkTokens(m, ctx, frame, indefiniteAdjective)
      # Optional: "هذا سلامة", "تلك سلام": a demonstrative before an indefinite noun.
      - regex: "{{START}}[وف]?(?:هذا|هذه|ذلك|تلك){{END}}"
        scan: text
        lookback: 96
        flags: gu
        return: walkTokens(m, ctx, frame, demonstrativePredicate)
      # Optional: "كتاب في البيت." -> "في البيت كتاب.". Every word that opens a sentence can be
      # the subject.
      - regex: "{{WORD}}"
        scan: text
        lookback: 96
        flags: gu
        return: walkTokens(m, ctx, frame, indefiniteSubject)
      # "قام بدراسة الملف" -> "درس الملف": a form of قام (with و, ف or س).
      - regex: "{{START}}[وف]?س?(?:{{QAMA}}){{END}}"
        scan: text
        lookback: 96
        flags: gu
        return: walkTokens(m, ctx, frame, lightVerbs)
      # "السياسة الجديدة والتي ستطبق" -> "التي".
      - regex: "{{START}}و(?:الذي|التي|الذين|اللذان|اللتان|اللذين|اللتين|اللواتي|اللاتي){{END}}"
        scan: text
        lookback: 96
        flags: gu
        return: walkTokens(m, ctx, frame, andRelatives)
      # "والأدهى من ذلك" -> "وأدهى من ذلك", "المرتبة الأعلى" -> "المرتبة العليا".
      - regex: "{{START}}[وف]?ال(?:{{ELATIVE}}){{END}}"
        scan: text
        lookback: 96
        flags: gu
        return: walkTokens(m, ctx, frame, elatives)
      # "يعمل كمدير" -> "يعمل بصفة مدير".
      - regex: "{{START}}[وف]?(?:عمل|عملت|عملوا|يعمل|تعمل|يعملون|نعمل|أعمل|اشتغل|اشتغلت|يشتغل|تشتغل){{END}}"
        scan: text
        lookback: 96
        flags: gu
        return: walkTokens(m, ctx, frame, asRole)
      # "سيما الراتب" -> "لا سيما الراتب".
      - regex: "{{START}}[وف]?سيما{{END}}"
        scan: text
        lookback: 96
        flags: gu
        return: walkTokens(m, ctx, frame, laSiyyama)
      # "القيام بدراسة الملف" -> "دراسة الملف".
      - regex: "{{START}}[وف]?(?:بال|لل|ال)قيام{{END}}"
        scan: text
        lookback: 96
        flags: gu
        return: walkTokens(m, ctx, frame, doingTheAct)
      # "بشكل مناسب" -> "على نحو مناسب", "بصورة يومية" -> "يوميا".
      - regex: "{{START}}[وف]?ب(?:شكل|صورة|أسلوب|طريقة){{END}}"
        scan: text
        lookback: 96
        flags: gu
        return: walkTokens(m, ctx, frame, inAWay)
      # "عملت لساعات" -> "عملت ساعات".
      - regex: "{{START}}[وف]?ل(?:{{DURATION}}){{END}}"
        scan: text
        lookback: 96
        flags: gu
        return: walkTokens(m, ctx, frame, forADuration)
      # "رغبة لـ" -> "رغبة في", "علاقة معه" -> "علاقة به", "تحسبا من" -> "تحسبا لـ".
      - regex: "{{START}}(?:[وفبل]?(?:ال|لل)?(?:رغب(?:ة|ات|ته|تها|تهم|تي|تنا|تك|تكم)|علاق(?:ة|ات|ته|تها|تهم|تي|تنا|تك|تكم|اته|اتها|اتهم|اتنا))|و?تحسبا){{END}}"
        scan: text
        lookback: 96
        flags: gu
        return: walkTokens(m, ctx, frame, nounPrepositions)
      # "لا تستعن سوى بالله" -> "بسوى الله", "غير بالله" -> "بغير الله".
      - regex: "{{START}}(?:سوى|غير){{END}}"
        scan: text
        lookback: 96
        flags: gu
        return: walkTokens(m, ctx, frame, exceptPreposition)
      # "لم أره أبدا" -> "لم أره قط", "أثناء العمل" -> "في أثناء العمل".
      - regex: "{{START}}(?:أبدا|[وف]?أثناء){{END}}"
        scan: text
        lookback: 96
        flags: gu
        return: walkTokens(m, ctx, frame, timeAdverbs)
      # "فأما أن تحفظه وأما أن تضيعه" -> "فإما ... وإما".
      - regex: "{{START}}[وف]?أما{{END}}"
        scan: text
        lookback: 96
        flags: gu
        return: walkTokens(m, ctx, frame, eitherOr)
      # "الأمر هام" -> "الأمر مهم".
      - regex: "{{START}}[وف]?هامة?{{END}}"
        scan: text
        lookback: 96
        flags: gu
        return: walkTokens(m, ctx, frame, important)
      # "أعطى لصاحبه كتابا" -> "أعطى صاحبه", "كلفه بالعمل" -> "كلفه العمل", "يتاجر بالقطن" ->
      # "يتاجر في القطن": DIRECT_LI, DIRECT_BI and TRADE.
      - regex: "{{START}}[وف]?(?:أعطى|أعطت|أعطوا|يعطي|تعطي|يعطون|نعطي|(?:كلف|كلفت|كلفوا|يكلف|تكلف|يكلفون|غرم|غرمت|يغرم|أصحبت|أصحبوا)(?:ه|ها|هم|ني|نا|ك|كم)|تاجرت|تاجروا|يتاجر|تتاجر|يتاجرون|نتاجر|أتاجر){{END}}"
        scan: text
        lookback: 96
        flags: gu
        return: walkTokens(m, ctx, frame, directObjects)
      # "الجهاز عبارة عن صندوق" -> "الجهاز صندوق".
      - regex: "{{START}}عبارة{{END}}"
        scan: text
        lookback: 96
        flags: gu
        return: walkTokens(m, ctx, frame, amountsTo)
      # "يتناسب ورأيه" -> "يتناسب مع رأيه": MUTUAL.
      - regex: "{{START}}[وف]?(?:[يت](?:تناسب|تنافى|تلاءم|تلائم|تعارض|تناقض|تطابق|توافق|تكامل|تساوى)(?:ون|ان)?|تناسبت|تنافت|تعارضت|تناقضت|تطابقت|توافقت){{END}}"
        scan: text
        lookback: 96
        flags: gu
        return: walkTokens(m, ctx, frame, mutualWaw)
      # "ما تحدث إلا وقال خيرا" -> "إلا قال".
      - regex: "{{START}}إلا{{END}}"
        scan: text
        lookback: 96
        flags: gu
        return: walkTokens(m, ctx, frame, exceptAnd)
      # "نحن كمعلمين" -> "نحن المعلمين".
      - regex: "{{START}}[وف]?نحن{{END}}"
        scan: text
        lookback: 96
        flags: gu
        return: walkTokens(m, ctx, frame, weAs)
      # "بين ما كنت عائدا" at a sentence start -> "بينما".
      - regex: "{{START}}بين{{END}}"
        scan: text
        lookback: 96
        flags: gu
        return: walkTokens(m, ctx, frame, whileJoined)
      # "تقع دمشق جنوبي حلب" -> "جنوب حلب".
      - regex: "{{START}}(?:شمالي|جنوبي|شرقي|غربي){{END}}"
        scan: text
        lookback: 96
        flags: gu
        return: walkTokens(m, ctx, frame, compassAdverb)
      # "استقل الوزير السيارة" -> "ركب": a verb of GAPPED, one or two words before its confirming
      # word. Each form of these verbs holds the imperfect stem of its entry (ستقل, فتح, تستر,
      # صادق, فتقد) or تماد.
      - regex: "{{START}}\\p{L}*(?:ستقل|فتح|تستر|صادق|فتقد|تماد)\\p{L}*{{END}}"
        scan: text
        lookback: 96
        flags: gu
        return: walkTokens(m, ctx, frame, gappedUsage)

