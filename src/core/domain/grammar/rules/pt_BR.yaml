      # "pos-graduação" -> "pós-": these prefixes are stressed and take their accent.
      - regex: "(?<target>pos|recem|alem|aquem)-(?=\\p{L})"
        return: "[ACCENTED_PREFIX[target.toLowerCase()]]"
      # "ela sera chamada", "você tera tempo" -> "será", "terá": the future of ser and ter has an
      # accent; "sera" and "tera" are other words.
      - regex: "(?:{{SUBJECT}}|qual|quando|o{{S}}que){{S}}(?<target>sera|tera){{S}}(?=\\p{L})"
        return: "[FUTURE_ACCENT[target.toLowerCase()]]"
      - regex: "(?<target>sera){{S}}(?=\\p{L}{2,}(?:ad|id)[oa]s?{{E}})"
        return: "[FUTURE_ACCENT[target.toLowerCase()]]"
      # "afear a faca" (make ugly) -> "afiar" (sharpen).
      - regex: "(?<target>afe(?:ar|ia|iam|ei|ou|aram|ando|ado|ados|ada|adas)){{S}}(?:(?:[oa]s?|um|uma|uns|umas|meus?|minhas?|seus?|suas?|nossos?|nossas?|esses?|essas?|estes?|estas?){{S}}){0,2}(?:facas?|facões|facão|lâminas?|tesouras?|machados?|navalhas?|serrotes?|foices?|enxadas?|serras?){{E}}"
        return: '[target.replace(/^afe/iu, "afi")]'
      # "arrear a bandeira" (harness) -> "arriar" (lower).
      - regex: "(?<target>arre(?:ar|ia|iam|ei|ou|aram|ando|ado|ados|ada|adas)){{S}}(?:(?:[oa]s?|um|uma|uns|umas|meus?|minhas?|seus?|suas?|nossos?|nossas?|esses?|essas?|estes?|estas?){{S}}){0,2}(?:velas?|bandeiras?|âncoras?|calças){{E}}"
        return: '[target.replace(/^arre/iu, "arri")]'
      # "comer os remédios" -> "tomar": medicine is taken.
      - regex: "(?<target>comer|como|come|comemos|comem|comi|comeu|comeram|comia|comiam|comendo|comido){{S}}(?:(?:[oa]s?|um|uma|uns|umas|meus?|minhas?|seus?|suas?|nossos?|nossas?|esses?|essas?|estes?|estas?){{S}}){0,2}(?:remédios?|medicamentos?|comprimidos?|pílulas?|antibióticos?|cápsulas?|analgésicos?|calmantes?){{E}}"
        return: "[EAT_TO_TAKE[target.toLowerCase()]]"
        message: review_msg_pt_word_choice
      # "O evento tomará lugar em" -> "terá lugar": an event takes place with "ter lugar"; a
      # person "toma lugar" (takes a seat).
      - regex: "(?<!(?:d[eoa]s?|n[oa]s?|aos?|às?|pel[oa]s?|para|com|sem){{S}})(?:{{EVENT}}){{E}}(?:{{S}}(?!(?:d[eoa]s?|com|para|por|que|e){{E}})[\\p{L}-]+){0,3}?{{S}}(?<target>toma|tomam|tomou|tomaram|tomará|tomarão|tomaria|tomariam|tomava|tomavam|tomasse|tomassem){{S}}lugar{{S}}(?=(?:{{PLACE_NEXT}}){{E}})"
        return: "[TAKE_PLACE[target.toLowerCase()]]"
        message: review_msg_pt_word_choice
      # "pedir um concelho" -> "conselho": a "concelho" is a council area.
      - regex: "(?:{{GIVE_ADVICE}}){{S}}(?:(?:[oa]s?|um|uma|uns|umas|meus?|minhas?|seus?|suas?|nossos?|nossas?|esses?|essas?|estes?|estas?){{S}}){0,2}(?:(?:bons?|bom|algum|alguns|outro|outros){{S}})?(?<target>concelhos?){{E}}"
        return: '[target.replace(/nc/i, "ns")]'
      # "assistir a um conserto", "vou a um conserto" -> "concerto": a "conserto" is a repair
      # ("levou o carro ao conserto").
      - regex: "(?:{{ASSIST}}{{S}}(?:(?:a|ao|aos){{S}})?(?:(?:um|uns|o|os|esse|este|aquele){{S}})?|(?:{{GO}}){{S}}a{{S}}(?:um|uns){{S}})(?<target>consertos?){{E}}(?!{{S}}(?:d[eoa]s?|no|na){{S}}(?!(?:rock|jazz|música|orquestra|banda|samba|forró|pagode){{E}}))"
        return: '[target.replace(/ns/i, "nc")]'
      - regex: "(?<target>consertos?){{S}}(?=(?:de{{S}}(?:rock|jazz|música|samba|forró|pagode)|da{{S}}(?:orquestra|banda)|sinfônicos?|ao{{S}}vivo){{E}})"
        return: '[target.replace(/ns/i, "nc")]'
      # "a amostra de arte" -> "mostra": an exhibition is a "mostra"; an "amostra" is a sample.
      - regex: "(?<target>amostras?){{S}}(?=(?:de|d[eoa]s?){{S}}(?:{{SHOW}}){{E}})"
        return: "[target.slice(1)]"
        message: review_msg_pt_word_choice
      # "contanto com" -> "contando com": "contanto" only opens "contanto que".
      - regex: "(?<target>contanto){{S}}(?=com{{E}})"
        fix: ["contando"]
      # "estivemos de sair" -> "tivemos de sair": obligation is "ter de".
      - regex: "(?<target>estive|esteve|estivemos|estiveram){{S}}de{{S}}(?!(?:{{NOT_INFINITIVE}}){{E}})(?=\\p{L}{2,}[aeiô]r{{E}})"
        return: "[HAD_TO[target.toLowerCase()]]"
        message: review_msg_pt_word_choice
      # "tenho muito a preço por ele" -> "apreço" (esteem).
      - regex: "(?:muito|grande|enorme|profundo|especial|imenso|sincero|meu|nosso|seu|todo{{S}}o){{S}}(?<target>a{{S}}preço){{S}}(?=(?:por|pel[oa]s?|a|ao|à){{E}})"
        fix: ["apreço"]
      # "o mas rapidamente possível" -> "o mais".
      - regex: "(?<![\\p{L}])o{{S}}(?<target>mas){{S}}(?=\\p{L}+{{S}}possíve(?:l|is){{E}})"
        fix: ["mais"]
      # "teve percas de 5%" -> "perdas": "perca" is the fish or a form of "perder".
      - regex: "(?<target>percas?){{S}}(?=(?:de|d[eoa]s?){{S}}(?:{{LOSS}}){{E}})"
        return: '[target.replace(/c/i, "d")]'
      - regex: "(?:grandes|pequenas|muitas|enormes|várias|evitar|reduzir|sofreu|sofrer|sofreram|houve|haverá){{S}}(?:as{{S}})?(?<target>percas){{E}}"
        fix: ["perdas"]
      # "O Rui trás o material" -> "traz": "trás" (behind) follows "para", "de", "por" or "lá".
      - regex: "(?<!(?:para|pra|de|por|lá|cá|em|daí|dali|aí|ali|e|é|marcha|ré|frente|atrás){{S}})(?<target>trás){{S}}(?=(?:o|a|os|as|um|uma|uns|umas|seu|sua|seus|suas|meu|minha|consigo|muitos|muitas|isso|isto|tudo|sempre|novidades){{E}})"
        fix: ["traz"]
      # "o último senso" -> "censo": a count, not a sense of something.
      - regex: "(?:último|próximo|penúltimo|novo|primeiro){{S}}(?<target>sensos?){{E}}(?!{{S}}(?:de|comum|crítico|estético|moral|prático|ético|artístico){{E}})"
        return: '[target.replace(/^s/i, "c")]'
      # "não te peco nada" -> "peço": "pecar" (to sin) takes no object pronoun.
      - regex: "(?:te|lhe|lhes|vos){{S}}(?<target>peco){{E}}"
        fix: ["peço"]
      # "vai a bordo" written as the verb "abordo": on board a ship or a plane.
      - regex: "(?<target>abordo){{S}}(?=(?:d[oa]s?){{S}}(?:\\p{L}+{{S}})?(?:navios?|aviões|avião|fragatas?|barcos?|naves?|aeronaves?|embarcaç(?:ão|ões)|trens?|cruzeiros?|iates?|submarinos?|helicópteros?|ônibus|veleiros?|lanchas?|caravelas?){{E}})"
        fix: ["a bordo"]
      # "Se caso eles vierem" -> "Caso": "se" and "caso" both open the condition.
      - regex: "(?<target>se{{S}}caso){{S}}(?=(?:ele|ela|eles|elas|você|vocês|nós|não|haja|seja|sejam|tenha|tenham|queira|queiram|precise|precisem|ocorra|aconteça){{E}})"
        fix: ["caso"]
        message: review_msg_contextual_grammar
      # "pão, leite e etc." -> "pão, leite, etc.": "etc." already says "and the rest".
      - regex: "\\p{L}+(?<target>,?{{S}}e{{S}}etc)(?=\\.|…|{{E}})"
        fix: [", etc"]
        message: review_msg_contextual_grammar
      # "e.t.c." -> "etc.".
      - regex: "(?<target>e\\.(?:{{S}})?t\\.(?:{{S}})?c\\.)"
        fix: ["etc."]
        message: review_msg_contextual_grammar
      # "Mas o que?", "Para que?": "que" at the end of a question is stressed: "quê".
      - regex: "(?<![\\p{L}])(?:o|para|pra|de|com|sem|em){{S}}(?<target>que)(?=[ \\t\\u00a0]{0,2}[?])"
        fix: ["quê"]
  - id: pt_BR.confusions
    checks: [portugueseConfusions]
    style: match
    message: review_msg_pt_crase
    sets:
      # Infinitives look like these nouns and adjectives, which can follow a crase ("à mulher").
      FEMININE_R:
        [
          mulher,
          colher,
          militar,
          titular,
          auxiliar,
          familiar,
          circular,
          similar,
          celular,
          escolar,
          popular,
          particular,
          exemplar,
          singular,
          regular,
          preliminar,
          complementar,
          lunar,
          solar,
          polar,
          nuclear,
          secular,
          vulgar,
          peculiar,
          hospitalar,
          curricular,
          disciplinar,
        ]
    defs:
      # The text before a clause start: a sentence mark or a line break, then spaces or quotes.
      CLAUSE_START: '/(?:^|[.!?:;][ \t\r\n\u00a0"”»)]{0,8}|\n[ \t\u00a0]{0,8})$/'
      # The crase finding for the `target` group, in the typed casing; a user word stays.
      crase:
        args: "ctx: DetectContext, m: RegExpExecArray, alternatives: string[]"
        type: RawFinding | null
        let:
          span: m.indices!.groups!.target
          typed: ctx.text.slice(span[0], span[1])
        when: "!ctx.dictionary.has(typed.toLowerCase())"
        return: >-
          finding("portugueseConfusions", "review_msg_pt_crase", span[0], span[1], alternatives.map((alt) => applyWordCase(alt, detectWordCase(typed))), {
            context: { start: m.index, end: Math.max(span[1], m.index + m[0].length) },
            ...(alternatives.length > 1 ? { requiresChoice: true as const } : {}),
          })
    frames:
      # {{GOVERNS_A}}: words that govern "a": locutions, nouns, adjectives and verbs. Before a
      # feminine noun the article fuses with it: "devido a falta" -> "à falta", "acesso as armas"
      # -> "às armas". "quanto a" only opening a clause ("tanto quanto a irmã" compares).
      - regex: "(?<lead>{{GOVERNS_A}}|quanto){{S}}(?:\\p{L}{3,16}mente{{S}})?(?<target>as?){{S}}(?<noun>\\p{L}{3,}){{E}}(?!-)"
        let:
          analysis: "ptNoun(noun)"
        when:
          - "!(/^quanto$/i.test(lead) && !CLAUSE_START.test(ctx.text.slice(Math.max(0, m.index - 12), m.index)))"
          - "noun === noun.toLowerCase()"
          - "analysis?.feminine === true && analysis.plural === (target.length === 2)"
        return: 'crase(ctx, m, [target.length === 2 ? "às" : "à"])'
      # Places one goes to: "vou a escola" -> "à escola". "foi" and "fui" also mean "was".
      - regex: "(?:{{GOES}}){{S}}(?<target>as?){{S}}(?=(?:{{DESTINATIONS}})s?{{E}})"
        return: 'crase(ctx, m, [target.toLowerCase() === "as" ? "às" : "à"])'
      # "à Sua Excelência": forms of address take no article.
      - regex: "(?<target>às?){{S}}(?=(?:sua|vossa|suas|vossas){{S}}(?:excelência|majestade|santidade|senhoria|alteza|eminência|magnificência|reverendíssima|excelências|majestades|santidades|senhorias|altezas|eminências|beatitudes?){{E}})"
        return: 'crase(ctx, m, ["a"])'
      # "à uma corrida", but "à uma hora", "à uma e meia".
      - regex: "(?<target>à){{S}}(?=uma{{E}}(?!{{S}}(?:hora|e|da|em{{S}}ponto){{E}}|[ \\t\\u00a0]*h))"
        return: 'crase(ctx, m, ["a"])'
      # A sum of money has no article: "equivale à R$ 35".
      - regex: "(?<target>à){{S}}(?=(?:R\\$|US\\$|€|\\$))"
        return: 'crase(ctx, m, ["a"])'
      # "à" before an infinitive; some nouns and adjectives look like infinitives ("à mulher").
      - regex: "(?<target>à){{S}}(?<verb>\\p{L}+(?:ar|er|ir)){{E}}"
        when:
          - "!(FEMININE_R.has(verb) || ctx.dictionary.has(verb))"
        return: 'crase(ctx, m, ["a"])'
  - id: pt_BR.contractions
    checks: [portugueseContractions]
    style: match
    message: review_msg_pt_contraction
    maps:
      # The prepositions a, de, em and por fused with the article, demonstrative or pronoun after them.
      FUSED:
        a:
          {
            a: "à",
            as: "às",
            o: "ao",
            os: "aos",
            aquele: "àquele",
            aquela: "àquela",
            aqueles: "àqueles",
            aquelas: "àquelas",
            aquilo: "àquilo",
          }
        de:
          {
            a: "da",
            as: "das",
            o: "do",
            os: "dos",
            este: "deste",
            esta: "desta",
            estes: "destes",
            estas: "destas",
            esse: "desse",
            essa: "dessa",
            esses: "desses",
            essas: "dessas",
            aquele: "daquele",
            aquela: "daquela",
            aqueles: "daqueles",
            aquelas: "daquelas",
            aquilo: "daquilo",
            ele: "dele",
            ela: "dela",
            eles: "deles",
            elas: "delas",
            isto: "disto",
            isso: "disso",
            aqui: "daqui",
            ali: "dali",
            aí: "daí",
          }
        em:
          {
            a: "na",
            as: "nas",
            o: "no",
            os: "nos",
            este: "neste",
            esta: "nesta",
            estes: "nestes",
            estas: "nestas",
            esse: "nesse",
            essa: "nessa",
            esses: "nesses",
            essas: "nessas",
            aquele: "naquele",
            aquela: "naquela",
            aqueles: "naqueles",
            aquelas: "naquelas",
            aquilo: "naquilo",
            ele: "nele",
            ela: "nela",
            eles: "neles",
            elas: "nelas",
            isto: "nisto",
            isso: "nisso",
          }
        por: { a: "pela", as: "pelas", o: "pelo", os: "pelos" }
      # Countries whose name always takes the article, in Brazil and in Portugal alike ("no Brasil",
      # "da China", "aos Estados Unidos"). France, Spain, Italy and England stay out: European
      # Portuguese also writes "em França", "de Espanha".
      COUNTRIES:
        Brasil: o
        Japão: o
        Canadá: o
        México: o
        Peru: o
        Chile: o
        Uruguai: o
        Paraguai: o
        Equador: o
        Egito: o
        Egipto: o
        Iraque: o
        Irã: o
        Irão: o
        Afeganistão: o
        Paquistão: o
        Vietnã: o
        Vietname: o
        Vaticano: o
        Reino Unido: o
        China: a
        Índia: a
        Argentina: a
        Bolívia: a
        Colômbia: a
        Venezuela: a
        Rússia: a
        Austrália: a
        Nova Zelândia: a
        Nova Guiné: a
        Costa Rica: a
        Costa do Marfim: a
        África do Sul: a
        Suíça: a
        Suécia: a
        Noruega: a
        Finlândia: a
        Holanda: a
        Bélgica: a
        Turquia: a
        Coreia: a
        Tailândia: a
        Indonésia: a
        Nigéria: a
        Estados Unidos: os
        EUA: os
      WITH_ARTICLE:
        em: { o: "no", a: na, os: nos }
        de: { o: do, a: da, os: dos }
        a: { o: ao, a: à, os: aos }
        para: { o: para o, a: para a, os: para os }
        por: { o: pelo, a: pela, os: pelos }
    sets:
      # Words ending like an infinitive that are nouns or adjectives after an article.
      NOUN_R:
        [
          ser,
          seres,
          mulher,
          mulheres,
          poder,
          poderes,
          lugar,
          lugares,
          ar,
          lar,
          lares,
          qualquer,
          olhar,
          olhares,
          mar,
          mares,
          líder,
          líderes,
          câncer,
          celular,
          celulares,
          prazer,
          prazeres,
          caráter,
          dever,
          deveres,
          saber,
          saberes,
          titular,
          titulares,
          jantar,
          jantares,
          par,
          pares,
          bar,
          bares,
          militar,
          militares,
          familiar,
          familiares,
          açúcar,
          parlamentar,
          parlamentares,
          altar,
          altares,
          dólar,
          dólares,
          colher,
          colheres,
          talher,
          talheres,
          pilar,
          pilares,
          radar,
          luar,
          patamar,
          polegar,
          escolar,
          escolares,
          similar,
          similares,
          popular,
          populares,
          particular,
          particulares,
          exemplar,
          exemplares,
        ]
      # Right after the article these are nouns ("do ser humano"); further on, verbs ("de a casa ser").
      VERB_LATER: [ser, poder, dever, saber, olhar, jantar]
    defs:
      # An infinitive (personal or not) later in the clause: the pair opens its subject or object.
      INFINITIVE_FORM: '/^(?:\p{L}+(?:ar|er|ir|ares|eres|ires|armos|ermos|irmos|arem|erem|irem)|\p{L}*p[oô]r|\p{L}*por(?:es|mos|em)|\p{L}+(?:ar|er|ir)-(?:me|te|se|lhes?|nos|vos)|\p{L}+[áêíô]-[ln][oa]s?)$/u'
      CLAUSE_AHEAD: '/^[^.;:!?()\n]{0,80}/'
      # "por" after a modal is "pôr" (portugueseConfusions says so).
      PT_MODAL_BEFORE: '/(?<![\p{L}])(?:pode|posso|podemos|podem|podia|quero|queremos|quer|queria|deve|devemos|devem|deveria|preciso|precisamos|precisa|precisam|para|sem|que|de|há|hei)[ \t\u00a0]+$/iu'
      CONTRACTION_START: '/(?:^|[.!?:;]["”»)]?[ \t\u00a0]*|\n[ \t\u00a0]*)$/'
      # An infinitive ahead in the clause; "deixar de o ser.": a lone "ser" closing it is the verb.
      infinitiveAhead:
        args: "text: string"
        return: >-
          (CLAUSE_AHEAD.exec(text)![0].match(/[\p{L}\p{M}-]+/gu) ?? []).some(
            (word, index, words) =>
              INFINITIVE_FORM.test(word) &&
              (!NOUN_R.has(word.toLowerCase()) ||
                (VERB_LATER.has(word.toLowerCase()) && (index > 0 || words.length === 1))),
          )
    frames:
      # An article must start more text: a bare letter ("termina em o.") is a mention.
      - regex: "(?<target>(?<first>a|de|em|por){{S}}(?<second>{{SECOND}})){{E}}(?:(?<=\\p{L}{3})|(?={{S}}[\\p{L}\\d\"“«'‘]))"
        let:
          before: "ctx.text.slice(Math.max(0, m.index - 24), m.index)"
          fused: "FUSED[first.toLowerCase()][second]"
          end: "m.index + target.length"
        when:
          - "second === second.toLowerCase()"
          - "!(first !== first.toLowerCase() && !CONTRACTION_START.test(before))"
          - "fused"
          - "!infinitiveAhead(ctx.text.slice(end, end + 96))"
          - '!(first.toLowerCase() === "por" && PT_MODAL_BEFORE.test(before))'
          - "!ctx.dictionary.has(target.toLowerCase())"
        return: 'finding("portugueseContractions", "review_msg_pt_contraction", m.index, end, [applyWordCase(fused, detectWordCase(first))], { context: { start: m.index, end: Math.min(ctx.text.length, end + 24) } })'
      # "em China" -> "na China": countries whose name always takes the article.
      - regex: "(?<target>(?<first>em|de|a|para|por){{S}}(?<country>Costa{{S}}do{{S}}Marfim|Estados{{S}}Unidos|Nova{{S}}Zelândia|África{{S}}do{{S}}Sul|Afeganistão|Reino{{S}}Unido|Nova{{S}}Guiné|Costa{{S}}Rica|Paquistão|Argentina|Venezuela|Austrália|Finlândia|Tailândia|Indonésia|Paraguai|Vietname|Vaticano|Colômbia|Uruguai|Equador|Bolívia|Noruega|Holanda|Bélgica|Turquia|Nigéria|Brasil|Canadá|México|Egipto|Iraque|Vietnã|Rússia|Suécia|Coreia|Japão|Chile|Egito|China|Índia|Suíça|Peru|Irão|Irã|EUA))(?![\\p{L}\\p{N}-])"
        message: review_msg_pt_country_article
        let:
          name: 'country.replace(/[ \t\u00a0]+/g, " ")'
          article: "COUNTRIES[name]"
          span: "m.indices!.groups!.target"
        when:
          - "first === first.toLowerCase()"
          - '!(!article || (first === "a" && article === "a") || ctx.dictionary.has(name.toLowerCase()))'
          - '!/^[ \t\u00a0]+\p{Lu}/u.test(ctx.text.slice(span[1], span[1] + 3))'
        return: 'finding("portugueseContractions", "review_msg_pt_country_article", span[0], span[1], [`${WITH_ARTICLE[first][article]} ${country}`])'
  - id: pt_BR.numberFormat
    checks: [portugueseNumberFormat]
    style: cased
    message: review_msg_pt_number_format
    maps:
      # "o 12o lugar", "a 1a vez": ordinals take º and ª.
      ORDINAL: { o: º, a: ª, os: ºs, as: ªs }
      # "2 m3": exponents are superscript.
      SUPERSCRIPT: { "2": ², "3": ³ }
    frames:
      # "1 999 349.56": an English decimal point after a spaced thousands group.
      - regex: "(?<![\\d.,])\\d{1,3}(?:[ \\u00a0]\\d{3}){1,6}(?<target>\\.)\\d{1,6}(?![\\d.,]{0,12}\\d)"
        fix: ","
      # "21,349.56", "4,500.00": English separators; Portuguese swaps them.
      - regex: "(?<![\\d.,])(?<target>\\d{1,3}(?:,\\d{3}){1,6}\\.\\d{1,6})(?![\\d.,]{0,12}\\d)"
        return: 'target.replace(/[.,]/g, (c) => (c === "," ? "." : ","))'
      # "7'5%", "1.250'75": an apostrophe typed for the decimal comma. Not feet and inches (5'10"),
      # minutes after a degree (8° 15'30") or a minute mark alone (aos 45').
      - regex: "(?<![\\d.,'’′º°]|[º°][ \\t\\u00a0])\\d{1,3}(?:[. \\u00a0]\\d{3}){0,6}(?<target>['’])\\d{1,3}(?![\\d'’′\"”″])"
        fix: ","
      # "896.96 km²", "2.5 kg": a decimal point before a unit (a thousands group has 3 digits).
      - regex: "(?<![\\d.,])\\d{1,3}(?<target>\\.)\\d{1,2}(?={{GAP}}(?:km²?|m[²³]?|cm|mm|kg|g|mg|ml|l|L|t|ha|GB|MB|TB|kW|W|V|°C|%)(?![\\p{L}\\p{N}]))"
        fix: ","
      # "12hrs", "15 hs", "01 hr": the hour symbol is "h".
      - regex: "(?<!:)\\d{1,2}{{GAP}}(?<target>{{HOUR_TYPOS}}){{E}}"
        fix: "h"
      # "às 14:30 hrs", "03:45H": a clock time takes at most a lowercase "h".
      - regex: "\\d{1,2}:\\d\\d(?<target>{{GAP}}(?:{{HOUR_TYPOS}}|H)){{E}}"
        fix: ""
      # "às 12H", "às 06 H".
      - regex: "(?:[àÀ]s|[aA]s|das|até){{S}}\\d{1,2}{{GAP}}(?<target>H){{E}}"
        fix: "h"
      # "Às 15 h. será": a symbol takes no period.
      - regex: "\\d{1,2}{{GAP}}h(?<target>\\.)(?={{S}}\\p{Ll})"
        fix: ""
      # "25ºC", "40º de febre": the ordinal indicator stands in for the degree sign. "o 25.º F"
      # (a dot before it) is an ordinal: the F there is a grade.
      - regex: "{{NUM}}(?<!\\.){{GAP}}(?<target>[ºo]){{GAP}}(?=[CF]{{E}})"
        fix: "°"
      - regex: "{{NUM}}(?<!\\.)(?<target>º)(?={{S}}de{{S}}(?:febre|temperatura|latitude|longitude){{E}})"
        fix: "°"
      # "25º 29' 49\"" -> "25° 29′ 49″": degrees before minutes, and the primes that mark them.
      - regex: "(?<target>\\d{1,3}{{GAP}}º{{GAP}}\\d{1,2}(?:,\\d+)?{{GAP}}['’′](?:{{GAP}}\\d{1,2}(?:,\\d+)?{{GAP}}(?:[\"”″]|['’′]{1,2}))?)"
        let:
          parts: 'target.match(/\d+(?:,\d+)?/g)!'
        return: '`${parts[0]}°\u202f${parts[1]}′${parts[2] ? `\u202f${parts[2]}″` : ""}`'
      # "38,8º", "3,5o": an ordinal is a whole number, so a decimal takes the degree sign.
      - regex: "[−-]?\\d{1,3},\\d{1,3}(?<target>[ºo])(?![\\p{L}\\p{N}])"
        fix: "°"
      # "18º norte", "55o N", "39º de calor": a bearing, a latitude or a temperature.
      - regex: "\\d{1,3}(?<target>[ºo])(?={{GAP}}(?:N|S|E|W|L|NE|NO|NW|SE|SO|SW)(?![\\p{L}\\p{N}-])|{{S}}(?:(?:ao|a){{S}})?(?:norte|sul|leste|oeste|nordeste|noroeste|sudeste|sudoeste|de{{S}}(?:latitude|longitude|calor|frio))(?![\\p{L}\\p{N}-]))"
        fix: "°"
      # "um ângulo de 137º.", "ontem fez 25º.": an angle or the weather closes the phrase.
      - regex: "(?:ângulos?|temperaturas?|fez|faz|fazia|fará|marcou|marca|atingiu|atinge|chegou{{S}}a|chegam{{S}}a|chegar{{S}}a){{S}}(?:de{{S}})?[−-]?\\d{1,3}(?:,\\d{1,3})?(?<target>[ºo])(?=[ \\t\\u00a0]{0,2}(?:[.,;:!?)]|$))"
        fix: "°"
      # "o 12o lugar", "a 1a vez": ordinals take º and ª.
      - regex: "{{ARTICLE}}{{S}}\\d{1,4}\\.?(?<target>os|as|o|a)(?={{E}}(?:{{S}}\\p{Ll}|[ \\t\\u00a0]{0,2}[.,;:!?]))"
        return: "ORDINAL[target]"
      # "no 1ª lugar" -> "1º", "na 2º posição" -> "2ª": the ordinal agrees with its determiner.
      - regex: "(?<![\\dºª°][ \\t\\u00a0]{0,8}){{MASCULINE_DET}}{{S}}\\d{1,4}\\.?(?<target>ª)(?={{S}}\\p{L})"
        fix: "º"
      - regex: "(?<![\\dºª°][ \\t\\u00a0]{0,8})(?:{{FEMININE_DET}}|(?<=(?:^|[.!?][ \\t\\u00a0]{0,8}|(?:é|será|foi|era|ser|seria|como){{S}}))[aA]){{S}}\\d{1,4}\\.?(?<target>º)(?={{S}}\\p{Ll})(?!{{S}}(?:de|graus?|à|no|na|em|celsius){{E}})"
        fix: "ª"
      # "o 8° colocado": the degree sign stands in for the ordinal indicator.
      - regex: "{{MASCULINE}}{{S}}\\d{1,4}(?<target>°)(?={{S}}\\p{Ll})(?!{{S}}(?:de{{S}}(?:febre|temperatura)|graus?){{E}})"
        fix: "º"
      # "30 Km", "120 KW", "por Km": the kilo prefix is a lowercase k.
      - regex: "(?:\\d+{{GAP}}|por{{S}}|/)(?<target>K)(?=(?:m|M|ms|g|G|W|w|Wh|Hz|m²|m2){{E}})(?!W[/.]h)"
        fix: "k"
      # "5 kW/h", "5 KW.h": energy is the kilowatt-hour, kWh; a kilowatt per hour is no unit. "kW.h"
      # (a product dot) stays.
      - regex: "\\d+{{GAP}}(?<target>[kK]W/h|KW\\.h){{E}}"
        fix: "kWh"
      - regex: "(?:\\d+{{GAP}}|por{{S}}|/)k(?<target>M|G)(?={{E}})"
        return: "target.toLowerCase()"
      # "2 m3", "por km2", "m/s2": exponents are superscript.
      - regex: "(?:\\d+{{GAP}}|por{{S}}|/)(?:km|cm|mm|dm|m)(?<target>\\^?[23])(?![\\p{L}\\p{N}])"
        return: "SUPERSCRIPT[target.slice(-1)]"
      - regex: "\\d+{{GAP}}(?:km|cm|mm|m)/s(?<target>\\^?2)(?![\\p{L}\\p{N}])"
        fix: "²"
      # "22° C" -> "22 °C": the degree sign stays with its scale letter.
      - regex: "\\d+(?<target>[ \\u00a0]?°[ \\u00a0]+[CF])(?![\\p{L}\\p{N}])"
        return: "` °${target.slice(-1)}`"
      # "30ºK", "30 º K", "30° K": the kelvin takes no degree sign ("30°K" is a shared check).
      - regex: "\\d+(?<target>[ \\u00a0]?º[ \\u00a0]?K|[ \\u00a0]?°[ \\u00a0]+K)(?![\\p{L}\\p{N}])"
        message: review_msg_kelvin_degree
        fix: " K"
      # "no ano de 1.989", "em maio de 2.014": a year has no thousands dot.
      - regex: "(?:[aA]nos?{{S}}(?:de{{S}})?|(?:{{MONTHS}}){{S}}de{{S}}|(?:[eE]m|[dD]esde|[aA]té){{S}}(?=[12]\\.\\d{3}[ \\t\\u00a0]*(?:[.,;:!?)]|$)))(?<target>[12]\\.\\d{3})(?![.,]?\\d)"
        message: review_msg_pt_year
        return: 'target.replace(".", "")'
      # "5,500,300": English commas between digit groups; Portuguese groups them with dots.
      - regex: "(?<![\\d.,])(?<target>\\d{1,3}(?:,\\d{3}){2,})(?![.,]?\\d)"
        return: 'target.replaceAll(",", ".")'
      # A year range with a space on one side of the dash only: "2013– 2021" -> "2013–2021".
      - regex: "(?<![\\d.,])(?<target>{{YEAR}}(?:[ \\u00a0]+[-–—]|[-–—][ \\u00a0]+){{YEAR}})(?!\\d|[.,]\\d)"
        message: review_msg_range_dash
        return: 'target.replace(/[ \u00a0]*[-–—][ \u00a0]*/, "–")'
  - id: pt_BR.typographyStyleFrames
    checks: [portugueseTypographyStyle]
    style: cased
    message: review_msg_pt_typography_style
    defs:
      # 1 to 99 in Roman numerals: the largest value first.
      ROMAN: '[[90, "XC"], [50, "L"], [40, "XL"], [10, "X"], [9, "IX"], [5, "V"], [4, "IV"], [1, "I"]] as [number, string][]'
      roman:
        args: "n: number"
        type: string
        let:
          next: ROMAN.find((pair) => n >= pair[0])
        when: next !== undefined
        return: next[1] + roman(n - next[0])
        else: '""'
    frames:
      # "século 20" -> "século XX": centuries take Roman numerals.
      - regex: "[sS]éculos?{{S}}(?<target>[1-9]\\d?)(?![\\dºª°\\p{L}]|[.,]\\d)"
        message: review_msg_pt_century
        return: "roman(Number(target))"
      # "às 10.00", "às 6,05 h", "das 9.30 às 11.00": Brazilian usage writes a clock time
      # with a colon (European texts also write 17.40 h, so this stays opt-in).
      - regex: "(?:[àÀ]s|[dD]as?|até{{S}}[àa]s){{S}}(?<target>(?:[01]?\\d|2[0-3])[.,][0-5]\\d(?:[.,][0-5]\\d(?:,\\d+)?)?)(?!\\d)(?={{GAP}}h{{E}}|{{S}}d[ae]{{S}}(?:manhã|tarde|noite|madrugada){{E}}|{{S}}(?:às|e|até){{E}}|[ \\t\\u00a0]{0,2}(?:[;!?]|\\.(?!\\d)|$))"
        message: review_msg_pt_number_format
        return: 'target.replace(/^(\d+)[.,](\d\d)(?:[.,](\d\d))?/, (_: string, h: string, min: string, sec: string | undefined) => `${h}:${min}${sec ? `:${sec}` : ""}`)'
      # "6,626 x 10", "5 * 2", "10,5x17,2km": multiplication between numbers (not hex "0x1F").
      - regex: "(?!0[xX]){{NUM}}(?<target>{{GAP}}[xX*]{{GAP}})(?=\\d)"
        return: 'target.replace(/[xX*]/g, "×")'
      # "em Niterói/RJ", "de Niterói - RJ", "para Niterói (RJ)": a city and its state take an
      # en dash. Only after a place preposition: "Gabeira (RJ)" names a politician's state. A
      # bare hyphen stays: "Águia de Marabá-PA" names a club.
      - regex: "(?:em|de|para|até){{S}}\\p{Lu}[\\p{Ll}\\p{M}]+(?:[ \\t\\u00a0-](?:d[aoe]s?|\\p{Lu}[\\p{Ll}\\p{M}]+)){0,6}(?<target>/|[ \\t\\u00a0][-–—][ \\t\\u00a0])(?={{UF}}(?![\\p{L}\\p{N}/-]))"
        fix: "–"
      - regex: "(?:em|de|para|até){{S}}\\p{Lu}[\\p{Ll}\\p{M}]+(?:[ \\t\\u00a0-](?:d[aoe]s?|\\p{Lu}[\\p{Ll}\\p{M}]+)){0,6}(?<target>{{GAP}}\\({{UF}}\\))"
        return: "`–${target.trim().slice(1, 3)}`"
  - id: pt_BR.typographyStyle
    checks: [portugueseTypographyStyle]
    style: match
    message: review_msg_pt_typography_style
    frames:
      # Chemical subscripts: "H2O" -> "H₂O". The code adds the guards that keep names and
      # models out.
      - regex: "(?<![\\p{L}\\p{N}_./-])\\d*(?:(?:H|He|Li|Be|B|C|N|O|F|Ne|Na|Mg|Al|Si|P|S|Cl|Ar|K|Ca|Ti|Cr|Mn|Fe|Co|Ni|Cu|Zn|Br|Ag|I|Ba|Pt|Au|Hg|Pb|U)\\d*){2,}(?![\\p{L}\\p{N}_-])"
        flags: gu
        scan: owned
        let:
          token: "m[0]"
          lead: '/^\d*/.exec(token)![0]'
          body: "token.slice(lead.length)"
        when:
          - "!userWord(ctx, m.index, m.index + token.length)"
          - '/[A-Za-z]\d/.test(body) && !/\d{3}|[A-Za-z][10](?!\d)|[A-GI-Za-z]\d\d/.test(body) && /[CHO]/.test(body)'
        return: 'finding("portugueseTypographyStyle", "review_msg_pt_typography_style", m.index, m.index + token.length, [lead + body.replace(/\d/g, (digit) => SUBSCRIPT_DIGITS[Number(digit)])])'
  - id: pt_BR.rangeDash
    checks: [emdashShortcut]
    style: match
    message: review_msg_range_dash
    defs:
      # "tel. 12-34", "art. 3-5", "CEP 12-14": the label of a code or a law before the pair.
      RANGE_CODE: '/(?:^|[^\p{L}])(?:tel|telefone|celular|fax|whatsapp|cep|nº|n\.º|no|número|ref|referência|processo|protocolo|art|artigo|lei|decreto|inciso|parágrafo|cpf|cnpj|rg|conta|agência|pedido|nota|versão|voo|linha|modelo|matrícula|isbn)\.?[ \t\u00a0]*:?[ \t\u00a0]*$|§[ \t\u00a0]*$/iu'
      # "venceu 3-1", "o jogo terminou 2-2", "placar de 1-0".
      RANGE_SCORE: '/(?:^|[^\p{L}])(?:venc|ganh|perd|derrot|empat|golead|goleou|placar|resultado|partida|jogo|set|vitória|derrota)\p{L}*(?:[ \t\u00a0]+\p{L}+){0,3}[ \t\u00a0]+$/iu'
    frames:
      # "pages 10-15", "1990-1995": two numbers of up to four digits joined by a hyphen. A dash,
      # a colon, a slash or a digit group after the second number makes a date, a phone number
      # or a code ("12-05-2020", "2024-05-01"); a decimal or a time ("8.00-9.00") stays.
      - regex: "{{RANGE_DASH}}"
        scan: owned
        lookback: 8
        flags: gu
        let:
          whole: "m[0]"
          a: "m[1]"
          dash: "m[2]"
          b: "m[3]"
          last: "a.length === 4 && b.length === 2 ? Number(a.slice(0, 2) + b) : Number(b)"
          before: "ctx.text.slice(Math.max(0, m.index - 48), m.index)"
          at: "m.index + a.length"
        when:
          - "!(m.index < ctx.from || namedExampleBefore(ctx.text, m.index))"
          - '!(a[0] === "0" || b[0] === "0" || (a.length === 3 && b.length === 4))'
          - "last > Number(a)"
          - "!(RANGE_CODE.test(before) || RANGE_SCORE.test(before))"
        return: 'finding("emdashShortcut", "review_msg_range_dash", at, at + dash.length, ["–"], { context: { start: m.index, end: m.index + whole.length } })'
  - id: pt_BR.cliticPlacement
    checks: [portugueseCliticPlacement]
    style: match
    message: review_msg_pt_proclisis
    maps:
      UNACCENT: { á: a, é: e, ê: e, í: i }
      ACCENTED_STEM: { á: a, ê: e, í: i, ô: o }
      STEM_ACCENT: { a: á, e: ê, i: i, o: ô }
      ACCENT: { a: á, e: ê, o: ô, i: í }
      STRESSED: { a: á, e: ê, o: ô }
    defs:
      # Imperfects and presents of -rer/-rir verbs end like a conditional or future ("queria",
      # "preferia", "queremos"), but their stem is no infinitive.
      NOT_INFINITIVE_STEM: '/^(?:\p{Ll}*(?:quer|quir|fer)|ger|diger|suger|inser|asser|ader|coer|iner|enxer|preter|par|color|flor|exaur)$/u'
      # Infinitives (personal ones too) and gerunds allow enclisis after an attractor.
      NON_FINITE: "/(?:[aeioô]r|[aeio]rem|[aeio]rmos|[aeio]res|ndo)$/"
      # "lo" -> "o", "nas" -> "as"; "nos" (us) stays.
      plainObject:
        args: "pronoun: string"
        return: 'pronoun === "nos" ? pronoun : pronoun.replace(/^[ln](?=[oa]s?$)/, "")'
      # The verb a hyphenated object pronoun was attached to, or null when it cannot be told.
      # "querem", "esperes" end like a personal infinitive, but their stem is no infinitive.
      # "encontramo-nos": the first person plural drops its -s. "fi-lo", "comprá-lo": an -r, -s or
      # -z fell off. "dão-no": "o/a" after a nasal. "beba-o": after a vowel.
      finiteVerb:
        args: "verb: string, pronoun: string"
        type: string | null
        return: >-
          NON_FINITE.test(verb) && !(/[aeio]r(?:em|es)$/.test(verb) && ptRStem(verb.slice(0, -2)))
            ? null
            : verb.endsWith("mo") && (pronoun === "nos" || /^l[oa]s?$/.test(pronoun))
              ? `${verb}s`
              : /^l[oa]s?$/.test(pronoun)
                ? null
                : /^n[oa]s?$/.test(pronoun) && pronoun !== "nos"
                  ? /(?:ão|õe|[aeê]m)$/.test(verb)
                    ? verb
                    : null
                  : /^[oa]s?$/.test(pronoun)
                    ? /[aeiouáéíóúâêô]$/.test(verb)
                      ? verb
                      : null
                    : verb
      # "comer" -> "comê", "fez" -> "fê", "fizemos" -> "fizemo", "partir" -> "parti": a stressed
      # final a, e or o is written with its accent (dá-lo, fê-lo, pô-lo).
      withoutConsonant:
        args: "verb: string"
        return: '/s$/.test(verb) ? verb.slice(0, -1) : verb.slice(0, -1).replace(/[aeo]$/, (vowel) => STRESSED[vowel]).replace(/^p[oô]$/, "pô")'
      # The finding for the `target` group, in the typed casing; a user word stays.
      cliticFinding:
        args: 'ctx: DetectContext, m: RegExpExecArray, replacement: string, messageKey: RawFinding["messageKey"]'
        type: RawFinding | null
        let:
          typed: m.groups!.target
          span: m.indices!.groups!.target
        when: "!ctx.dictionary.has(typed.toLowerCase())"
        return: 'finding("portugueseCliticPlacement", messageKey, span[0], span[1], [applyWordCase(replacement, detectWordCase(typed))], { context: { start: m.index, end: span[1] } })'
    filter:
      let:
        others: 'new Set(findings.filter((f) => f.messageKey !== "review_msg_pt_mesoclisis").map((f) => f.range.start))'
      return: 'findings.filter((f) => f.messageKey !== "review_msg_pt_mesoclisis" || !others.has(f.range.start))'
    frames:
      # "tira-mos as conclusões" -> "tiramos": "-mos" is the verb ending, not a pronoun. Before
      # an object "mos" (me + os) would repeat it.
      - regex: "(?<target>(?<verb>\\p{L}+[aeiê])-mos){{S}}(?=(?:o|a|os|as|um|uma|uns|umas){{E}})"
        message: review_msg_typo
        let:
          plain: 'verb.replace(/^(v|l|cr)ê$/, "$1e")'
        return: 'cliticFinding(ctx, m, `${plain}mos`, "review_msg_typo")'
      # {{ATTRACTORS}}: negations, indefinite pronouns, adverbs and subordinating words ("que
      # deve-lhe" -> "que lhe deve", "quando perguntei-lhe" -> "quando lhe perguntei"); Portugal
      # is, if anything, stricter about these than Brazil. A comma after the attractor breaks
      # the pull, and the frame needs the verb right after it. {{OBJECT}}: "bebemo-lo",
      # "dão-no", "conhecia-a": the forms "o/a" take after -r/-s/-z, a nasal or a vowel.
      - regex: "(?<attractor>{{ATTRACTORS}}){{S}}(?:(?:eu|tu|ele|ela|eles|elas|nós|vós|você|vocês){{S}})?(?<target>(?<verb>\\p{L}+)-(?<pronoun>{{SIMPLE}}|{{OBJECT}})){{E}}"
        let:
          finite: "finiteVerb(verb, pronoun)"
        when:
          - "verb.length >= 2 && pronoun === pronoun.toLowerCase()"
          - "finite !== null"
        return: 'cliticFinding(ctx, m, `${plainObject(pronoun)} ${finite}`, "review_msg_pt_proclisis")'
      # "Se comprá-las" -> "Se as comprar", "Quando fizé-lo" -> "Quando o fizer": after a
      # conditional "se" or "quando" the verb is the future subjunctive, not an infinitive, and
      # the pronoun goes before it. "se" counts only at the start of a clause, where it is no
      # pronoun.
      - regex: "(?:(?<=^|[.!?;:,\\n][ \\t\\u00a0]{0,8}|(?<![\\p{L}])(?:e|mas|ou){{S}})se|quando){{S}}(?<target>(?<stem>\\p{L}{2,}[áéêí])-(?<pronoun>l[oa]s?)){{E}}"
        when:
          - "stem === stem.toLowerCase()"
        return: 'cliticFinding(ctx, m, `${plainObject(pronoun)} ${stem.slice(0, -1)}${UNACCENT[stem.slice(-1)]}r`, "review_msg_pt_proclisis")'
      # "dir-lhe-ei", "amá-la-ei", "far-nos-iam".
      - regex: "(?:{{ATTRACTORS}}){{S}}(?<target>(?<stem>\\p{L}+)-(?<pronoun>{{SIMPLE}}|l[oa]s?)-(?<ending>{{FUTURE_ENDINGS}})){{E}}"
        let:
          base: "/^l[oa]s?$/.test(pronoun) ? (/[áêíô]$/.test(stem) ? `${stem.slice(0, -1)}${ACCENTED_STEM[stem.slice(-1)]}r` : null) : /r$/.test(stem) ? stem : null"
        when:
          - "base !== null"
        return: 'cliticFinding(ctx, m, `${plainObject(pronoun)} ${base}${ending}`, "review_msg_pt_proclisis")'
      # An infinitive before "-lo/-la" drops its r and accents the vowel left: "escrevê-lo",
      # "puxá-las", "pô-lo", "distraí-los" (only after a vowel: "parti-lo"). The verb is an
      # infinitive after a modal, a preposition or "a" ("tu vende-lo" is the second person, so
      # they must lead).
      - regex: "(?:{{INFINITIVE_LEAD}}){{S}}(?:(?:não|já|também|sempre){{S}})?(?<target>(?<stem>\\p{L}*(?:[aeo]|[aeiou]i))-(?<pronoun>l[oa]s?)){{E}}"
        message: review_msg_pt_enclitic_accent
        when:
          - "!(stem.length < 2 || stem !== stem.toLowerCase())"
        return: 'cliticFinding(ctx, m, `${stem.slice(0, -1)}${ACCENT[stem.slice(-1)]}-${pronoun}`, "review_msg_pt_enclitic_accent")'
      # "o/a" after a verb ending in r, s or z becomes "lo/la" and the consonant falls
      # ("comer-o" -> "comê-lo", "fez-o" -> "fê-lo", "fizemos-o" -> "fizemo-lo"); after a nasal
      # it becomes "no/na" ("tinham-o" -> "tinham-no", "põe-as" -> "põe-nas"). "lo/la" after a
      # kept r, s or z also drops it: "fazer-lo" -> "fazê-lo", "fiz-lo" -> "fi-lo".
      - regex: "(?<target>(?<verb>\\p{L}{2,}(?:[rsz]|m)|\\p{L}+(?:ão|õe))-(?<l>l)?(?<pronoun>[oa]s?)){{E}}(?!-)"
        message: review_msg_pt_object_form
        let:
          lower: "verb.toLowerCase()"
          nasal: "/(?:m|ão|õe)$/.test(lower)"
        when:
          - "verb.slice(1) === lower.slice(1)"
          - "!(l && nasal)"
          - "!(/s$/.test(lower) && !/(?:mos|is|es|as|us)$/.test(lower))"
        return: 'cliticFinding(ctx, m, nasal ? `${lower}-n${pronoun}` : `${withoutConsonant(lower)}-l${pronoun}`, "review_msg_pt_object_form")'
      # "poderia-se", "encontraremos-nos", "traria-o", "teriam-na". The first person singular
      # "-rei" only counts for the irregular "farei", "direi" and "trarei": "tirei-lhe" and
      # "preparei-te" are past tenses. "-á-lo" is an infinitive ("ignorá-lo"). The filter drops
      # a finding here when an earlier frame flagged the same verb.
      - regex: "(?<target>(?<stem>\\p{L}{0,24}[aeiouáéíóúâêô]r)(?<ending>ia|ias|íamos|íamo|íeis|iam|ás|á|emos|emo|eis|ão|ei)-(?<pronoun>{{SIMPLE}}|n[oa]s?|[oa]s?)){{E}}"
        message: review_msg_pt_mesoclisis
        let:
          full: 'ending.replace(/mo$/, "mos")'
          object: '/^[oa]s?$/.test(pronoun) || (/^n[oa]s?$/.test(pronoun) && pronoun !== "nos")'
          vowel: "stem.slice(-2, -1)"
        when:
          - "!NOT_INFINITIVE_STEM.test(stem.toLowerCase())"
          - '!(ending === "ei" && !/^(?:des|re|satis|contra|pre)?(?:far|dir|trar)$/.test(stem.toLowerCase()))'
          - '!(full !== ending && pronoun !== "nos")'
          - "!(object && !STEM_ACCENT[vowel])"
        return: 'object ? cliticFinding(ctx, m, `${stem.slice(0, -2)}${STEM_ACCENT[vowel]}-l${plainObject(pronoun)}-${full}`, "review_msg_pt_mesoclisis") : cliticFinding(ctx, m, `${stem}-${pronoun}-${full}`, "review_msg_pt_mesoclisis")'
  - id: pt_BR.ao90
    checks: [portugueseAO90]
    style: match
    message: review_msg_pt_ao90
    maps:
      # Prefix -> the letters after which it keeps its hyphen (beyond h). "pan" and "circum" keep it
      # before a vowel, m and n too: pan-americano, circum-navegação. "co" always joins.
      PREFIXES:
        anti: i
        auto: o
        contra: a
        extra: a
        infra: a
        intra: a
        ultra: a
        mega: a
        micro: o
        macro: o
        neo: o
        pseudo: o
        proto: o
        semi: i
        mini: i
        multi: i
        arqui: i
        tele: e
        bio: o
        super: r
        hiper: r
        inter: r
        sub: rb
        bi: i
        tri: i
        tetra: a
        penta: a
        hexa: a
        euro: o
        pan: aeiouáéíóúmn
        circum: aeiouáéíóúmn
        co: ""
    sets:
      # Latin phrases and words that only look prefixed.
      KEEP_SPACED: [sub judice, sub rosa, pós doc]
    defs:
      # "a pós em Direito": the clipped noun before a small word.
      SMALL_WORDS: "/^(?:que|em|de|do|da|dos|das|e|o|a|os|as|no|na|com|para|por|se|um|uma)$/"
      # Street, bridge and square names keep their capitals ("Rua Sete de Setembro").
      NAMED_PLACE: '/(?<![\p{L}])(?:Rua|Avenida|Av\.|Praça|Largo|Travessa|Estrada|Rodovia|Ponte|Estádio|Escola|Colégio|Parque|Vila|Bairro|Jardim|Hospital|Revolução)[ \t\u00a0]+(?:\d{1,2}|\p{Lu}\p{Ll}+)[ \t\u00a0]+de[ \t\u00a0]+$/u'
      # The prefix joined to its word: "co" drops an h, a hyphen before h or the vowel it ends in,
      # and a doubled r or s after a vowel (antirrugas, minissaia).
      joinPrefix:
        args: "prefix: string, word: string"
        return: >-
          prefix === "co"
            ? `co${word[0] === "h" ? word.slice(1) : word}`
            : word[0] === "h" || PREFIXES[prefix].includes(word[0])
              ? `${prefix}-${word}`
              : /[aeiou]$/.test(prefix) && /^[rs]/.test(word)
                ? `${prefix}${word[0]}${word}`
                : `${prefix}${word}`
      # The AO90 finding, unless the typed text is in the user's dictionary.
      ao90Finding:
        args: "ctx: DetectContext, start: number, end: number, replacement: string"
        when: "!ctx.dictionary.has(ctx.text.slice(start, end).toLowerCase())"
        return: 'finding("portugueseAO90", "review_msg_pt_ao90", start, end, [replacement])'
      # A month or weekday name with a capital: AO90 writes it in lowercase.
      ao90LowerName:
        args: "ctx: DetectContext, m: RegExpExecArray, target: string"
        let:
          span: "m.indices!.groups!.target"
        when:
          - '/^\p{Lu}\p{Ll}/u.test(target)'
          - '!(/-F/.test(target) || /^[ \t\u00a0]+(?:de[ \t\u00a0]+)?\p{Lu}/u.test(ctx.text.slice(span[1], span[1] + 8)))'
          - "!NAMED_PLACE.test(ctx.text.slice(Math.max(0, span[0] - 40), span[0]))"
        return: "ao90Finding(ctx, span[0], span[1], target.toLowerCase())"
    frames:
      # "auto-estima" -> "autoestima": a prefix joins its word except before h or the vowel it
      # ends in.
      - regex: "(?<![\\p{L}\\p{N}-])(?<prefix>anti|auto|contra|extra|infra|intra|ultra|mega|micro|macro|neo|pseudo|proto|semi|mini|multi|arqui|tele|bio|super|hiper|inter|sub|bi|tri|tetra|penta|hexa|euro|pan|circum|co)-(?<word>{{LETTERS}})(?![\\p{L}\\p{N}-])"
        flags: gu
        scan: owned
        let:
          fixed: "joinPrefix(prefix, word)"
        when:
          - "fixed !== m[0]"
        return: "ao90Finding(ctx, m.index, m.index + m[0].length, fixed)"
      # Prefixes that are never words on their own, so "anti inflamatório" is one word split.
      - regex: "(?<target>(?<prefix>anti|intra|infra|pseudo|proto|semi|multi|sub|neo){{S}}(?<word>{{LETTERS}})){{E}}"
        when:
          - "!(KEEP_SPACED.has(target.toLowerCase()) || SMALL_WORDS.test(word))"
          - "prefix === prefix.toLowerCase() && word === word.toLowerCase()"
        return: "ao90Finding(ctx, m.index, m.index + target.length, joinPrefix(prefix, word))"
      # "vice", "pós", "pré", "pró" and "recém" always take a hyphen.
      - regex: "(?<target>(?<prefix>{{ALWAYS_HYPHEN}}){{S}}(?<word>{{LETTERS}})){{E}}"
        when:
          - "!(KEEP_SPACED.has(target.toLowerCase()) || SMALL_WORDS.test(word))"
          - "prefix === prefix.toLowerCase() && word === word.toLowerCase()"
        return: "ao90Finding(ctx, m.index, m.index + target.length, `${prefix}-${word}`)"
      # "não-agressão" -> "não agressão": the 1990 Agreement drops the hyphen after "não"
      # ("não-me-toques" is a plant).
      - regex: "(?<target>não-(?<word>{{LETTERS}})){{E}}(?!-)"
        when:
          - 'target === target.toLowerCase() && word !== "me"'
        return: "ao90Finding(ctx, m.index, m.index + target.length, `não ${word}`)"
      # A day number (not an ordinal holiday name such as "1.º de Maio") before the month.
      - regex: "(?<![º°ª.]\\s?)\\d{1,2}{{S}}de{{S}}(?<target>{{AO90_MONTH}}){{E}}"
        return: ao90LowerName(ctx, m, target)
      - regex: "(?:em|de|até|desde){{S}}(?<target>{{AO90_MONTH}}){{S}}de{{S}}\\d{4}"
        return: ao90LowerName(ctx, m, target)
      - regex: "(?:próximo|próxima|último|última|no|na|nos|nas|neste|nesta|nesse|nessa|todo|toda|todos|todas|aos|às|cada){{S}}(?<target>{{AO90_WEEKDAY}}){{E}}(?!{{S}}de{{S}}\\p{L})"
        return: ao90LowerName(ctx, m, target)
  - id: pt_BR.invalidDates
    checks: [portugueseDates]
    style: match
    message: review_msg_pt_invalid_date
    defs:
      MONTH_NAMES: '"janeiro fevereiro março abril maio junho julho agosto setembro outubro novembro dezembro".split(" ")'
      WEEKDAY_NAMES: '"domingo segunda terça quarta quinta sexta sábado".split(" ")'
      # A word that puts a date after it: "em", "desde", "até", "dia", "data", "prazo", "vence", with
      # an optional verb or colon ("A data é", "Prazo:").
      DATE_CUE: '/(?:^|[\s(])(?:em|desde|até|dia|data|prazo|vence)(?:[ \t]+(?:é|era|foi|será))?[ \t]*:?[ \t]{1,8}$/iu'
      # The number of a month from its name or abbreviation (1-12; 0 when none).
      monthOf:
        args: "name: string"
        return: MONTH_NAMES.findIndex((month) => month.startsWith(name.toLowerCase())) + 1
      dateExists:
        args: "day: number, month: number, year?: number"
        return: month >= 1 && month <= 12 && day >= 1 && day <= daysInMonth(month, year)
      # A date that does not exist: nothing is proposed, the finding only points at it.
      invalidDate:
        args: "m: RegExpExecArray"
        type: RawFinding
        return: 'finding("portugueseDates", "review_msg_pt_invalid_date", m.index, m.index + m[0].length, [], { warningOnly: true })'
      # A weekday name in the case of the typed one.
      weekdayLike:
        args: "typed: string, full: string"
        return: '/^\p{Lu}/u.test(typed) ? full[0].toUpperCase() + full.slice(1) : full'
      # "Segunda-feira, 7" before a date that fell on a Tuesday: the weekday or the day is wrong.
      # `dayGroup` names the day in the match. With no year, the weekday is checked against each
      # year the date can mean (reviewClock).
      wrongWeekday:
        args: "ctx: DetectContext, m: RegExpExecArray, month: number, dayGroup: string"
        type: RawFinding | null
        let:
          weekday: m.groups!.weekday
          year: m.groups!.year as string | undefined
          day: Number(m.groups![dayGroup])
          years: "year === undefined ? yearsFor(month, day, contextYear(ctx.text, m.index, ctx.lang)) : [Number(year)]"
          weekdays: "[...new Set(years.map((one) => weekdayOf(one, month, day)))]"
          typed: WEEKDAY_NAMES.findIndex((name) => name.startsWith(weekday.toLowerCase().slice(0, 3)))
          text: m[0]
          alternatives: 'weekdays.map((actual) => `${weekdayLike(weekday, WEEKDAY_NAMES[actual] + (actual % 6 === 0 ? "" : "-feira"))}${text.slice(weekday.length)}`)'
          shifted: nearestDayOn(years[0], month, day, typed)
          dayAt: m.indices!.groups![dayGroup].map((at) => at - m.index)
        when:
          - "dateExists(day, month, year === undefined ? undefined : Number(year))"
          - "!(!years.length || weekdays.includes(typed))"
        return: >-
          finding("portugueseDates", year === undefined ? "review_msg_weekday_no_year" : "review_msg_pt_weekday_date", m.index, m.index + text.length, shifted !== null
                ? [...alternatives, `${text.slice(0, dayAt[0])}${shifted}${text.slice(dayAt[1])}`]
                : alternatives, {
            requiresChoice: true,
          })
    frames:
      # A weekday before a full date must be that date's weekday ("Segunda-feira, 7 de outubro
      # de 2014" -> "Terça-feira").
      - regex: "{{DATES_WEEKDAY}}(?<day>\\d{1,2})(?=[º°]?(?:{{SEP}}de{{SEP}}|{{SEP}}){{MONTH_NAME}}(?![\\p{L}])\\.?,?{{SEP}}(?:de{{SEP}})?(?<year>[0-9]{4})(?!\\d))"
        owner: weekday
        return: 'wrongWeekday(ctx, m, monthOf(month), "day")'
      # No year ("Segunda, 7 de outubro", "Seg, outubro 7", "Sexta, 31/10"): the Review clock
      # gives it.
      - regex: "{{DATES_WEEKDAY}}(?<day>\\d{1,2})(?=[º°]?(?:{{SEP}}de{{SEP}}|{{SEP}}){{MONTH_NAME}}(?![\\p{L}])(?!\\.?,?{{SEP}}(?:de{{SEP}})?\\d))"
        owner: weekday
        return: 'wrongWeekday(ctx, m, monthOf(month), "day")'
      - regex: "{{DATES_WEEKDAY}}{{MONTH_NAME}}\\.?{{SEP}}(?<day>\\d{1,2})(?![\\d/º°]|,?{{SEP}}(?:de{{SEP}})?\\d)"
        owner: weekday
        return: 'wrongWeekday(ctx, m, monthOf(month), "day")'
      - regex: "{{DATES_WEEKDAY}}(?<day>\\d{1,2})(?=/(?<month>\\d{1,2})/(?<year>[0-9]{4})(?![\\d/]))"
        owner: weekday
        return: 'wrongWeekday(ctx, m, Number(month), "day")'
      - regex: "{{DATES_WEEKDAY}}(?<a>\\d{1,2})/(?<b>\\d{1,2})(?![\\d/]|[.,]\\d)"
        owner: weekday
        return: 'Number(a) > 12 && Number(b) <= 12 ? wrongWeekday(ctx, m, Number(b), "a") : Number(b) > 12 && Number(a) <= 12 ? wrongWeekday(ctx, m, Number(a), "b") : null'
      # "31 de abril", "29 de fevereiro de 2023".
      - regex: "(?<target>(?<day>\\d{1,2})[º°]?(?:{{SEP}}de{{SEP}}|{{SEP}}|[/-]){{MONTH_NAME}}(?![\\p{L}])(?:\\.?(?:,?{{SEP}}(?:de{{SEP}})?|[/-])(?<year>[0-9]{4})(?!\\d))?)"
        let:
          given: "m.groups!.year as string | undefined"
        when:
          - "!dateExists(Number(day), monthOf(month), given === undefined ? undefined : Number(given))"
        return: "invalidDate(m)"
      # "30/02/2020": flagged only when neither the day/month nor the month/day reading exists.
      - regex: "(?<target>(?<day>\\d{1,2})(?<sep>[/.-])(?<month>\\d{1,2})\\k<sep>(?<year>[0-9]{4}|\\d{2}))(?![\\d/.-]\\d)"
        let:
          fullYear: "year.length === 4 ? Number(year) : undefined"
        when:
          - "!(/^(?:0+|9+)$/.test(day + month) && day[0] === month[0])"
          - '!(sep === "." && fullYear === undefined)'
          - '!(sep === "." && (Number(day) > 31 || Number(month) > 31) && !DATE_CUE.test(ctx.text.slice(Math.max(0, m.index - 16), m.index)))'
          - "!(dateExists(Number(day), Number(month), fullYear) || dateExists(Number(month), Number(day), fullYear))"
        return: "invalidDate(m)"
  - id: pt_BR.isoDates
    checks: [portugueseDates]
    style: match
    message: review_msg_pt_invalid_date
    frames:
      # An ISO date that no calendar has ("2025-02-30", "2023-02-29"). The year first makes the
      # form clear in each language. A fourth numeric part before or after ("1-2025-02-30",
      # "2025-02-30-7", "2025-02-30.1") makes it an ID, not a date. Arabic-Indic digits count too
      # ("٢٠٢٥-٠٢-٣٠"). Markdown emphasis around the date is not a word ("_2025-02-30_"); an
      # underscore glued to a word is ("build_2025-02-30_x"). The match start owns the match.
      - regex: "{{ISO_DATE}}"
        flags: gdu
        owner: none
        return: isoDateWarning(m, ctx, frame)
  - id: pt_BR.commas
    checks: [portugueseCommas]
    style: match
    message: review_msg_pt_comma
    sets:
      SUBJECTS: [eu, tu, ele, ela, você, nós, eles, elas, vocês]
      # "Como é que ele descobriu é um mistério", "O que ele quer eu não sei": an indirect question
      # inside a statement has a second verb of its own.
      STATEMENT_VERB:
        [
          é,
          era,
          foi,
          será,
          sei,
          sabe,
          sabem,
          sabemos,
          saber,
          pergunto,
          mistério,
          depende,
          interessa,
          importa,
        ]
    defs:
      # A conjunction or the start of a clause before the expression needs no comma.
      NO_COMMA_BEFORE: "/^(?:e|mas|ou|nem|que|pois|porém|se|quando|como|onde|porque|então|logo|assim|também)$/iu"
      # Words after which "mas" needs no comma: "não só ... mas", "nem ... mas".
      MAS_NO_COMMA: "/^(?:e|ou|nem|não|só|somente|apenas|mas|que|porém)$/iu"
      # The comma fix of the `target` group.
      commaAt:
        args: "m: RegExpExecArray, fixed: string"
        let:
          span: m.indices!.groups!.target
        return: 'finding("portugueseCommas", "review_msg_pt_comma", span[0], span[1], [fixed], { context: { start: m.index, end: Math.max(span[1], m.index + m[0].length) } })'
      # Whether the words after "é que" read as a direct question, not part of a statement.
      direct:
        args: "rest: string"
        let:
          words: 'rest.toLowerCase().match(/\p{L}+/gu) ?? []'
        return: "!words.some((word) => STATEMENT_VERB.has(word)) && !words.some((word, index) => index > 0 && SUBJECTS.has(word))"
    frames:
      # {{PARENTHETICAL}}: expressions that only ever stand apart from the clause. Left out
      # because they also read as ordinary words: "em geral" ("os carros, em geral caros,"), "no
      # fundo" ("no fundo do mar"), "isto é" ("isto é o que quero"), "de fato" ("um casal de
      # fato"). {{ADVERBS}}: expressions that are asides only when a comma closes them:
      # "portanto" inside a clause, "com efeito retroativo", "por exemplo o Brasil".
      # {{AFTER_CONJUNCTION}}: asides only right after a conjunction: "e no fundo, ficou" but
      # "caiu no fundo, e".
      #
      # ", no entanto está bem" -> ", no entanto, está bem": a word follows without a comma.
      - regex: "(?<=,){{S}}(?<target>(?:{{PARENTHETICAL}})|por{{S}}exemplo(?={{S}}que{{E}}))(?={{S}}[\\p{L}\\d])"
        return: "commaAt(m, `${target},`)"
      # "e além disso, está" -> "e, além disso, está": the aside a comma closes opens after the
      # conjunction too. Not at a sentence start: "Mas na verdade, ninguém sabe" opens with the
      # aside.
      - regex: "(?<=[\\p{L}\\d,]{{S}})(?:e|mas|ou|nem)(?<target>{{S}})(?:{{AFTER_CONJUNCTION}}){{E}}(?=,)"
        return: "commaAt(m, `,${target}`)"
      # "e, no fundo ficou" -> "e, no fundo, ficou": a comma after the conjunction opens an aside.
      - regex: "(?<=(?<![\\p{L}])(?:e|mas|ou|nem),){{S}}(?<target>{{AFTER_CONJUNCTION}})(?={{S}}[\\p{L}\\d])"
        return: "commaAt(m, `${target},`)"
      # "Disse no entanto, que" -> "Disse, no entanto, que". "além disso" also means "beyond
      # that" ("não via nada além disso,"). A conjunction or the start of a clause before the
      # expression needs no comma.
      - regex: "(?<lead>\\p{L}+)(?<target>{{S}})(?!além{{E}})(?:{{PARENTHETICAL}}|{{ADVERBS}}){{E}}(?=,)"
        when:
          - "!NO_COMMA_BEFORE.test(lead)"
        return: "commaAt(m, `,${target}`)"
      # A greeting or thanks before the name it addresses ("Bom dia Ana" -> "Bom dia, Ana").
      - regex: "(?<=^|[.!?;:\\n][ \\t\\u00a0]{0,8})(?:{{GREETINGS}})(?<target>{{S}})(?=\\p{L}{2,}(?:[ \\t\\u00a0]{0,8}[.!?,]|$))"
        when:
          - '/^\p{Lu}/u.test(ctx.text.slice(m.indices!.groups!.target[1]))'
        return: "commaAt(m, `,${target}`)"
      # A repeated "não" or "sim" answering a question ("Não não quero" -> "Não, não quero").
      - regex: "(?<=^|[.!?;:\\n][ \\t\\u00a0]{0,8})(?<first>não|sim)(?<target>{{S}})(?=\\k<first>{{E}})"
        return: "commaAt(m, `,${target}`)"
      # "Por exemplo" opening a sentence ("Por exemplo hoje choveu").
      - regex: "(?<=^|[.!?;:\\n][ \\t\\u00a0]{0,8})por{{S}}exemplo(?<target>{{S}})(?=\\p{L}{2,}{{E}})(?!(?:de|do|da|que){{E}})"
        return: "commaAt(m, `,${target}`)"
      # "sim senhor!", "não senhora.": the addressee after the answer.
      - regex: "(?:sim|não)(?<target>{{S}})(?=senhor(?:a|es|as)?[ \\t\\u00a0]{0,8}[.!?,;])"
        return: "commaAt(m, `,${target}`)"
      # "Adoro doce mas engorda" -> "doce, mas": "mas" opening a clause after a word. Words like
      # "não só ... mas" and "nem ... mas" need no comma before "mas".
      - regex: "(?<lead>\\p{L}+)(?<target>{{S}})mas(?={{S}}(?:eu|tu|ele|ela|você|nós|eles|elas|vocês|não|nunca|já|ainda|faz|fez|tem|tinha|há|havia|acho|parece){{E}})"
        when:
          - "!MAS_NO_COMMA.test(lead)"
        return: "commaAt(m, `,${target}`)"
      # "É caro mas é bom": a copula after "mas" opens a clause too, once a clause stands before
      # it ("Simples mas é bom" coordinates a bare adjective). "Vai mas é trabalhar", an emphatic
      # "mas é" before an infinitive, stays.
      - regex: "(?<=\\p{L}{{S}})(?<lead>\\p{L}+)(?<target>{{S}})mas(?={{S}}(?:é|era|foi|são|eram|foram|está|estava|estão|será|seria){{E}}(?!{{S}}\\p{L}+[aei]r{{E}}))"
        when:
          - "!MAS_NO_COMMA.test(lead)"
        return: "commaAt(m, `,${target}`)"
      # "as melhores intenções mas, porque..." -> ", mas,": an aside after "mas" means "mas"
      # opens a clause, which takes a comma before it.
      - regex: "(?<lead>\\p{L}+|\\d+|\\))(?<target>{{S}})mas(?=,)"
        when:
          - "!/^(?:e|ou|nem)$/iu.test(lead)"
        return: "commaAt(m, `,${target}`)"
      # "Devemos sim lutar" -> "Devemos, sim, lutar": an emphatic "sim" between a modal and its
      # infinitive stands between commas.
      - regex: "(?:{{MODALS}})(?<before>,?){{S}}sim(?<after>,?)(?={{S}}\\p{L}+(?:ar|er|ir|or){{E}})"
        owner: none
        let:
          start: "m.indices!.groups!.before[0]"
          end: "m.index + m[0].length"
          typed: "ctx.text.slice(start, end)"
        when:
          - "!(before && after)"
          - "!(start < ctx.from || start >= ctx.to)"
        return: 'finding("portugueseCommas", "review_msg_pt_comma", start, end, [`, ${typed.replace(/^,?[ \t\u00a0]+/, "").replace(/,$/, "")},`], { context: { start: m.index, end } })'
      # A whole line that signs off a letter ("Atenciosamente").
      - regex: "(?<=^|\\n)[ \\t\\u00a0]{0,8}(?=(?:{{CLOSINGS}})[.;]?{{LINE_END}})(?:\\p{L}{1,30}{{S}}){0,6}(?<target>\\p{L}{1,30}[.;]?){{LINE_END}}"
        return: 'commaAt(m, target.replace(/[.;]?$/, ","))'
      # A whole line that greets a letter's reader ("Prezado Senhor").
      - regex: "(?<=^|\\n)[ \\t\\u00a0]{0,8}(?:prezad[oa]s?|car[oa]s?|estimad[oa]s?|querid[oa]s?)(?:{{S}}(?:senhor(?:a|es|as)?|sr\\.?|sra\\.?|dr\\.?|dra\\.?|doutor(?:a)?|professor(?:a)?|\\p{L}[\\p{L}.]*|e|senhores|senhoras|colegas|amigos|amigas|clientes)){0,4}{{S}}(?<target>[\\p{L}.]{1,30}!?){{LINE_END}}"
        when:
          - '/[ \t\u00a0]\p{Lu}|senhor|doutor|professor|colegas|amig|clientes/u.test(m[0])'
        return: 'commaAt(m, target.replace(/!?$/, ","))'
      # A question opened by a question word and "é que" ends with "?" ("O que é que houve.").
      - regex: "(?<=^|[.!?;\\n][ \\t\\u00a0]{0,8})(?:quem|o{{S}}que|que|como|onde|de{{S}}onde|aonde|quando|por{{S}}que|qual|quanto|quantos|quantas){{S}}(?:foi|é|era){{S}}que{{E}}[^.!?\\n]{1,160}?(?<target>\\.)(?=[ \\t\\u00a0]*(?:\\n|$|\\p{L}))"
        message: review_msg_pt_question_mark
        let:
          span: "m.indices!.groups!.target"
        when:
          - 'direct(m[0].replace(/^.*?(?:foi|é|era)[ \t\u00a0]+que/isu, ""))'
        return: 'finding("portugueseCommas", "review_msg_pt_question_mark", span[0], span[1], ["?"], { context: { start: m.index, end: Math.max(span[1], m.index + m[0].length) } })'
  - id: pt_BR.introductoryCommas
    checks: [styleIntroductoryComma]
    style: match
    message: review_msg_introductory_comma
    frames:
      # styleIntroductoryComma (opt-in): an opening phrase that the comma usually sets off ("Por
      # favor faça" -> "Por favor, faça"; "Infelizmente não deu"). Writers often leave it out.
      - regex: "(?<=^|[.!?;\\n][ \\t\\u00a0]{0,8})(?:{{OPENING_PHRASES}})(?<target>{{S}})(?=\\p{L}+{{E}})(?!(?:de|do|da|dos|das|que|tudo){{E}})"
        let:
          span: "m.indices!.groups!.target"
        return: 'finding("styleIntroductoryComma", "review_msg_introductory_comma", span[0], span[1], [`,${target}`], { context: { start: m.index, end: span[1] } })'
  - id: pt_BR.agreement
    checks: [portugueseAgreement]
    style: match
    message: review_msg_pt_agreement
    maps:
      # Third person singular -> plural of the verbs whose subject usually follows them.
      EXIST_PLURAL:
        existe: existem
        existia: existiam
        existiu: existiram
        existirá: existirão
        existiria: existiriam
        acontece: acontecem
        acontecia: aconteciam
        aconteceu: aconteceram
        acontecerá: acontecerão
        aconteceria: aconteceriam
        ocorre: ocorrem
        ocorria: ocorriam
        ocorreu: ocorreram
        ocorrerá: ocorrerão
        ocorreria: ocorreriam
        surge: surgem
        surgia: surgiam
        surgiu: surgiram
        surgirá: surgirão
        surgiria: surgiriam
        resta: restam
        restava: restavam
        restou: restaram
        restará: restarão
        restaria: restariam
        basta: bastam
        bastava: bastavam
        bastou: bastaram
        bastará: bastarão
        bastaria: bastariam
        sobra: sobram
        sobrava: sobravam
        sobrou: sobraram
        sobrará: sobrarão
        sobraria: sobrariam
        falta: faltam
        faltava: faltavam
        faltou: faltaram
        faltará: faltarão
        faltaria: faltariam
        chega: chegam
        chegava: chegavam
        chegou: chegaram
        chegará: chegarão
        chegaria: chegariam
      AUXILIARY_PLURAL:
        vai: vão
        ia: iam
        irá: irão
        iria: iriam
        pode: podem
        podia: podiam
        poderá: poderão
        poderia: poderiam
        deve: devem
        devia: deviam
        deverá: deverão
        deveria: deveriam
        costuma: costumam
        costumava: costumavam
        continua: continuam
        começa: começam
      # "Tem existido muitos", "Está chegando os dias": a perfect or progressive of the same verbs.
      PERFECT_PLURAL:
        tem: têm
        tinha: tinham
        tenha: tenham
        teria: teriam
        terá: terão
        tivesse: tivessem
        está: estão
        estava: estavam
        esteve: estiveram
        esteja: estejam
        havia: haviam
        haveria: haveriam
        haja: hajam
        houvesse: houvessem
      PROPRIO_ENDING: { ele: o, ela: a, eles: os, elas: as }
      # Infinitive -> future subjunctive stem of the irregular verbs (the regular ones coincide).
      # "por" without its accent stays out: "quando ele por fim chegou".
      FUTURE_SUBJUNCTIVE:
        dizer: disse
        fazer: fize
        refazer: refize
        desfazer: desfize
        ver: vi
        rever: revi
        prever: previ
        ter: tive
        manter: mantive
        conter: contive
        obter: obtive
        deter: detive
        reter: retive
        pôr: puse
        propor: propuse
        compor: compuse
        supor: supuse
        ser: fo
        ir: fo
        dar: de
        estar: estive
        poder: pude
        saber: soube
        querer: quise
        trazer: trouxe
        caber: coube
      FUTURE_PERSON_ENDING: { "": r, es: res, mos: rmos, em: rem }
      PRONOUN_PERSON:
        eu: eu
        ele: ele
        ela: ele
        você: ele
        a gente: ele
        nós: nós
        eles: eles
        elas: eles
        vocês: eles
      PRETERITE_VOWEL: { o: a, e: e, i: i }
    defs:
      # A subject before the verb ("Ele resta...", "quem existe") makes it agree with that one.
      AGREE_SUBJECT_BEFORE: '/(?<![\p{L}])(?:eu|tu|ele|ela|você|nós|eles|elas|vocês|que|quem|o|a|isso|isto|tudo|nada|algo|ninguém)[ \t\u00a0]+$/iu'
      # "chegar" and "faltar" mostly follow their subject ("A polícia chegou alguns instantes
      # depois"): they only agree with one after them when nothing but an adverb comes before.
      SUBJECTLESS: '/(?:^|[.!?;:,\n]["''”’»)]*[ \t\u00a0]*|(?:^|[^\p{L}])(?:já|ontem|hoje|então|ainda|agora|aí|enfim|finalmente|não)[ \t\u00a0]+)$/iu'
      # "cheg-" or "falt-" as the verb, or as the participle after "tem", "está" and the like.
      ARRIVE_OR_LACK: '/^(?:\p{L}+[ \t\u00a0]+(?:\p{L}+[ \t\u00a0]+)?)?(?:cheg|falt)/iu'
      PLURAL_DETERMINER_WORD: /^(?:{{PLURAL_DETERMINER}})$/
      QUESTION_LEAD: "/^(?:sei|sabe|sabem|sabemos|saber|sabia|soube|decidir|decide|decidiu|decidimos|escolher|escolhe|escolheu|perguntar|pergunta|perguntou|ensinar|ensina|ensinou|aprender|aprende|aprendeu|entender|entende|explicar|explica|explicou|dizer|diz|disse|mostrar|mostra|mostrou|indicar|indica|definir|define|planejar|ideia|dúvida|noção|até|desde|de|para|sobre|é|era)$/iu"
      # "Vi eles faz um ano": a span of time after "fazer".
      ELAPSED: '/^[ \t\u00a0]{1,8}(?:\p{L}+[ \t\u00a0]{1,8})?(?:vezes|anos|meses|semanas|dias|horas|minutos|segundos|tempos|décadas|séculos|instantes|momentos|tempo)(?![\p{L}\p{M}\p{N}_''’@/#\\-])/iu'
      subjectless:
        args: "ctx: DetectContext, m: RegExpExecArray"
        return: "!ARRIVE_OR_LACK.test(ctx.text.slice(m.index, m.index + 40)) || SUBJECTLESS.test(ctx.text.slice(Math.max(0, m.index - 16), m.index))"
      # The agreement finding for the `target` group, in the typed casing; a user word stays.
      agreementFinding:
        args: 'ctx: DetectContext, m: RegExpExecArray, replacement: string, messageKey: RawFinding["messageKey"]'
        type: RawFinding | null
        let:
          typed: m.groups!.target
          span: m.indices!.groups!.target
        when: "!ctx.dictionary.has(typed.toLowerCase())"
        return: 'finding("portugueseAgreement", messageKey, span[0], span[1], [applyWordCase(replacement, detectWordCase(typed))], { context: { start: m.index, end: Math.max(span[1], m.index + m[0].length) } })'
      # A verb before its plural subject takes its plural form from `table`.
      postposed:
        args: "ctx: DetectContext, m: RegExpExecArray, table: Readonly<Record<string, string>>"
        when:
          - "!AGREE_SUBJECT_BEFORE.test(ctx.text.slice(Math.max(0, m.index - 16), m.index))"
          - subjectless(ctx, m)
        return: 'agreementFinding(ctx, m, table[m.groups!.target.toLowerCase()], "review_msg_pt_agreement")'
      # The same before a bare plural noun, whose spelling must tell its number and gender.
      bareSubject:
        args: "ctx: DetectContext, m: RegExpExecArray, table: Readonly<Record<string, string>>"
        let:
          noun: m.groups!.noun
          info: ptNoun(noun)
        when:
          - "!(noun !== noun.toLowerCase() || /mos$/.test(noun) || TIME_WORD.test(noun))"
          - "!PLURAL_DETERMINER_WORD.test(noun)"
          - info?.plural === true && info.feminine !== null
          - "!AGREE_SUBJECT_BEFORE.test(ctx.text.slice(Math.max(0, m.index - 16), m.index))"
          - subjectless(ctx, m)
        return: 'agreementFinding(ctx, m, table[m.groups!.target.toLowerCase()], "review_msg_pt_agreement")'
    frames:
      # Verbs of existing and happening agree with a plural subject placed after them: "Existe
      # muitos problemas" -> "Existem". {{SUBJECT_AFTER}}: a plural determiner and a plural
      # noun; "Acontece muitas vezes", "ocorre dois dias depois": a span of time ({{TIME}}) is
      # no subject.
      - regex: "(?<target>{{EXIST_VERBS}}){{S}}(?={{SUBJECT_AFTER}})"
        return: "postposed(ctx, m, EXIST_PLURAL)"
      # "Vai acontecer várias mudanças" -> "Vão".
      - regex: "(?<target>vai|ia|irá|iria|pode|podia|poderá|poderia|deve|devia|deverá|deveria|costuma|costumava|continua|começa){{S}}(?={{BETWEEN}}(?:{{INFINITIVES}}){{E}}{{S}}{{SUBJECT_AFTER}})"
        return: "postposed(ctx, m, AUXILIARY_PLURAL)"
      # "Tem existido muitos", "Está chegando os dias": a perfect or progressive of the same
      # verbs.
      - regex: "(?<target>{{PERFECT_AUXILIARIES}}){{S}}(?={{BETWEEN}}(?:{{PARTICIPLES}}){{E}}{{S}}{{SUBJECT_AFTER}})"
        return: "postposed(ctx, m, PERFECT_PLURAL)"
      # A bare plural after the verb: "Já aconteceu erros" -> "aconteceram", "tenha surgido
      # dúvidas" -> "tenham". The code checks the noun.
      - regex: "(?<target>{{EXIST_VERBS}}){{S}}{{AGREE_ADVERB}}(?<noun>\\p{L}{3,}s){{E}}"
        return: "bareSubject(ctx, m, EXIST_PLURAL)"
      - regex: "(?<target>{{PERFECT_AUXILIARIES}}){{S}}{{BETWEEN}}(?:{{PARTICIPLES}}){{S}}{{AGREE_ADVERB}}(?<noun>\\p{L}{3,}s){{E}}"
        return: "bareSubject(ctx, m, PERFECT_PLURAL)"
      # "próprio" agrees with the pronoun it reinforces: "ela próprio" -> "ela própria".
      - regex: "(?<pronoun>n?ele|n?ela|n?eles|n?elas|dele|dela|deles|delas){{S}}(?<target>própri[oa]s?){{E}}"
        let:
          base: 'pronoun.toLowerCase().replace(/^[nd]/, "")'
          typed: "target.toLowerCase()"
          wanted: "typed.replace(/[oa]s?$/, PROPRIO_ENDING[base])"
        when:
          - "wanted !== typed"
        return: 'agreementFinding(ctx, m, wanted, "review_msg_pt_agreement")'
      # A frequent irregular verb ({{IRREGULAR_FORMS}}) in the person of its pronoun subject.
      - regex: "(?<pronoun>eu|ele|ela|você|a{{S}}gente|nós|eles|elas|vocês){{S}}(?:(?:não|já|também|sempre|só|ainda|nunca){{S}}){0,2}(?<target>{{IRREGULAR_FORMS}}){{E}}"
        let:
          person: 'PRONOUN_PERSON[pronoun.toLowerCase().replace(/\s+/g, " ")]'
          typed: "target.toLowerCase()"
          rows: "PT_FORM_ROWS.get(typed)!"
          index: "PT_ROW_PERSONS.indexOf(person)"
          before: "ctx.text.slice(Math.max(0, m.index - 24), m.index)"
          targetEnd: "m.indices!.groups!.target[1]"
          after: "ctx.text.slice(targetEnd, targetEnd + 40)"
          wanted: "new Set(rows.map((row) => row[index]))"
        when:
          - "!rows.some((row) => row[index] === typed)"
          - '!(person === "eles" && (typed === "tem" || typed === "vem"))'
          - "!NOT_SUBJECT_BEFORE.test(before)"
          - '!(/^\p{Lu}/u.test(pronoun) && !/(?:^|[.!?:;"“«]\s*)$/u.test(before))'
          - '!/^[ \t\u00a0]+que(?![\p{L}])/u.test(after)'
          - "!(/^f[ia]z/.test(typed) && ELAPSED.test(after))"
          - "wanted.size === 1"
        return: 'agreementFinding(ctx, m, [...wanted][0], "review_msg_pt_agreement")'
      # A regular verb in the third person singular after a plural pronoun: "eles gosta" ->
      # "gostam", "nós gostava" -> "gostávamos".
      - regex: "(?<pronoun>nós|eles|elas|vocês){{S}}(?:(?:não|já|também|sempre|só|ainda|nunca){{S}}){0,2}(?<target>\\p{L}{3,}[ae]|\\p{L}{1,}(?:ou|eu|iu)){{E}}"
        let:
          we: 'pronoun.toLowerCase() === "nós"'
          before: "ctx.text.slice(Math.max(0, m.index - 24), m.index)"
          preterite: "/([oei])u$/.exec(target)"
          wanted: 'preterite ? `${target.slice(0, -2)}${preterite[1] === "i" && /[au]iu$/.test(target) && !we ? "í" : PRETERITE_VOWEL[preterite[1]]}${we ? "mos" : "ram"}` : !we ? `${target}m` : /ava$/.test(target) ? `${target.slice(0, -3)}ávamos` : /[^i]a$/.test(target) ? `${target}mos` : undefined'
        when:
          - '!(target !== target.toLowerCase() || PT_NOT_VERBS.has(target) || PT_FORM_ROWS.has(target) || target.endsWith("mente"))'
          - "!NOT_SUBJECT_BEFORE.test(before)"
          - "wanted !== undefined"
        return: 'agreementFinding(ctx, m, wanted, "review_msg_pt_agreement")'
      # The reverse: a regular verb in the third person plural after "eu", "ele", "ela" or
      # "você" ("ele não passeiam" -> "passeia", "eu gostaram" -> "gostei").
      - regex: "(?<pronoun>eu|ele|ela|você){{S}}(?:(?:não|já|também|sempre|só|ainda|nunca){{S}}){0,2}(?<target>\\p{L}{2,}[ae]m){{E}}"
        let:
          before: "ctx.text.slice(Math.max(0, m.index - 24), m.index)"
          wanted: 'ptSingularVerb(target, pronoun.toLowerCase() === "eu")'
        when:
          - "!(target !== target.toLowerCase() || PT_NOT_PLURAL_VERBS.has(target) || PT_FORM_ROWS.has(target))"
          - "!NOT_SUBJECT_BEFORE.test(before)"
          - "wanted !== undefined"
        return: 'agreementFinding(ctx, m, wanted, "review_msg_pt_agreement")'
      # After "quando", "se", "enquanto"... an irregular verb takes its future subjunctive, not
      # its infinitive: "Quando eu ver" -> "vir", "se nós fazermos" -> "fizermos".
      - regex: "{{FUTURE_CONJUNCTION}}{{S}}{{FUTURE_SUBJECT}}{{S}}(?:não{{S}})?{{FUTURE_INFINITIVE}}{{E}}"
        message: review_msg_pt_future_subjunctive
        return: 'agreementFinding(ctx, m, FUTURE_SUBJUNCTIVE[verb.toLowerCase()] + FUTURE_PERSON_ENDING[(m.groups!.person as string | undefined) ?? ""], "review_msg_pt_future_subjunctive")'
      # No subject: "Irei quando puder", "sempre que quiser". "quando" also opens an indirect
      # question with an infinitive ("não sei quando parar", "Quando usar a vírgula?"), so it
      # needs a word before it that asks for no question, and no question mark after.
      - regex: "(?<lead>\\p{L}+)[ \\t\\u00a0,]{1,8}(?<conj>quando|(?:assim|logo|sempre|depois){{S}}que){{S}}(?:não{{S}})?{{FUTURE_INFINITIVE}}{{E}}"
        message: review_msg_pt_future_subjunctive
        when:
          - '!(/^quando$/i.test(conj) && (QUESTION_LEAD.test(lead) || /^[^.!?\n]*\?/.test(ctx.text.slice(m.index + m[0].length, m.index + m[0].length + 160))))'
        return: 'agreementFinding(ctx, m, FUTURE_SUBJUNCTIVE[verb.toLowerCase()] + FUTURE_PERSON_ENDING[(m.groups!.person as string | undefined) ?? ""], "review_msg_pt_future_subjunctive")'
      # A neuter pronoun (isso, isto, aquilo, tudo) takes a masculine adjective: "Isso é muito
      # engraçada" -> "engraçado".
      - regex: "(?:isso|isto|aquilo|tudo){{S}}(?:não{{S}})?(?:é|era|foi|seja|fosse|será|seria|parece|parecia|fica|ficou|está|estava|continua){{S}}(?:(?:muito|tão|bem|super|bastante|meio|mais|menos|realmente|totalmente|completamente){{S}})?(?<target>{{FEMININE_ADJECTIVES}})(?=[ \\t\\u00a0]{0,2}(?:[.,;:!?]|$)|{{S}}(?:demais|mesmo|também|para|de){{E}})"
        let:
          typed: "target.toLowerCase()"
        return: 'agreementFinding(ctx, m, typed === "boa" ? "bom" : typed.replace(/a$/, "o"), "review_msg_pt_agreement")'
  - id: pt_BR.nounAgreement
    checks: [portugueseAgreement]
    style: match
    message: review_msg_pt_noun_agreement
    sets:
      # Determiners that may be an object pronoun before a verb.
      PRONOUN_LIKE: [o, a, os, as, nos]
      # "muita/pouca/tanta" are never the adverb: before a plural they disagree ("muita coisas").
      QUANTIFIERS: [muita, pouca, tanta]
      # Nouns that name a word, color or kind before another word: "a palavra brasileiro".
      NAMING:
        [
          palavra,
          palavras,
          termo,
          termos,
          nome,
          nomes,
          expressão,
          verbo,
          adjetivo,
          cor,
          tom,
          estilo,
          tipo,
          marca,
        ]
    maps:
      VERB_NUMBER:
        {
          é: são,
          foi: foram,
          era: eram,
          será: serão,
          seria: seriam,
          fosse: fossem,
          for: forem,
          seja: sejam,
        }
      VERB_SINGULAR:
        {
          são: é,
          foram: foi,
          eram: era,
          serão: será,
          seriam: seria,
          fossem: fosse,
          forem: for,
          sejam: seja,
        }
    defs:
      # Rows: masculine singular, feminine singular, masculine plural, feminine plural.
      DETERMINER_ROWS: >-
        [
          "o a os as", "um uma uns umas", "do da dos das", "no na nos nas", "pelo pela pelos pelas",
          "ao à aos às", "num numa nuns numas", "dum duma duns dumas", "este esta estes estas",
          "esse essa esses essas", "aquele aquela aqueles aquelas", "deste desta destes destas",
          "desse dessa desses dessas", "daquele daquela daqueles daquelas", "neste nesta nestes nestas",
          "nesse nessa nesses nessas", "naquele naquela naqueles naquelas", "meu minha meus minhas",
          "teu tua teus tuas", "seu sua seus suas", "nosso nossa nossos nossas",
          "vosso vossa vossos vossas", "algum alguma alguns algumas", "nenhum nenhuma nenhuns nenhumas",
          "outro outra outros outras", "todo toda todos todas", "- muita muitos muitas",
          "- pouca poucos poucas", "- - vários várias", "- - diversos diversas", "- - tantos tantas",
          "- - certos certas", "cujo cuja cujos cujas",
        ].map((row) => row.split(" "))
      DETERMINER_CELLS: 'new Map(DETERMINER_ROWS.flatMap((row) => row.flatMap((word, index) => (word === "-" ? [] : [[word, { row, index }] as const]))))'
      # Possessives and the like agree with the article before them: "o nosso", "as mesmas".
      POSSESSIVE_ROWS: '["meu minha meus minhas", "teu tua teus tuas", "seu sua seus suas", "nosso nossa nossos nossas", "vosso vossa vossos vossas", "outro outra outros outras", "mesmo mesma mesmos mesmas"].map((row) => row.split(" "))'
      POSSESSIVE_CELLS: "new Map(POSSESSIVE_ROWS.flatMap((row) => row.map((word, index) => [word, { row, index }] as const)))"
      # Demonstratives and quantifiers also stand alone ("estes são", "por muitos considerada", "de
      # todo verdade"): they only count before a noun whose ending no verb or adjective has. The
      # last row, "cujo", only ever stands before its noun.
      STANDALONE: "new Set([...DETERMINER_ROWS.slice(8, 17).flat(), ...DETERMINER_ROWS.slice(23, -1).flat()])"
      POSSESSIVE_DETERMINERS: new Set(DETERMINER_ROWS.slice(17, 22).flat())
      NOUN_ARTICLES: new Set(DETERMINER_ROWS.slice(0, 8).flat())
      CONTRACTED: "new Set(DETERMINER_ROWS.slice(2, 8).flat().filter((word) => !/^(?:a|à|às|ao|aos)$/.test(word)))"
      # A plural verb right after the noun phrase that opens a sentence.
      PLURAL_VERB_AFTER: '/^[ \t\u00a0]+(?:são|estão|foram|eram|estavam|têm|tinham|vão|iam|ficaram|ficam|parecem|serão)(?![\p{L}])/u'
      NAMED_TASK: '/^[ \t\u00a0]+a[ \t\u00a0]+\p{Ll}+[aei]r(?![\p{L}])/u'
      # Words before an article that leave it no pronoun: a preposition, or a sentence start.
      NOUN_PREPOSITION_BEFORE: '/(?:^|[^\p{L}])(?:para|com|sem|sobre|entre|contra|até|após|perante|desde|mediante|durante|conforme|segundo)[ \t\u00a0]+$/iu'
      # "cada um ajuda", "Um ajuda, o outro atrapalha": "um" as a pronoun.
      PRONOUN_UM: '/(?:^|[^\p{L}])(?:cada|nem|qualquer|algum|nenhum|tal|o)[ \t\u00a0]+$/iu'
      # "trinta e uma canetas", "mil e uma noites": a number ending in "um".
      NUMBER_AND: '/(?:^|[^\p{L}])(?:vinte|trinta|quarenta|cinquenta|sessenta|setenta|oitenta|noventa|cem|cento|mil|\p{N}+)[ \t\u00a0]+e[ \t\u00a0]+$/iu'
      # "isso da trabalho" (dá), "esta cansado" (está).
      NOUN_SUBJECT_BEFORE: '/(?:^|[^\p{L}])(?:eu|tu|ele|ela|você|nós|eles|elas|vocês|isso|isto|aquilo|tudo|nada|não|que|se|quem|me|te|lhe|nos|vos)[ \t\u00a0]+$/iu'
      # "por muitos considerada", "de todo verdade", "aos outros regras": a quantifier as a pronoun.
      PREPOSITION_JUST_BEFORE: '/(?:^|[^\p{L}])(?:por|a|de|para|entre|com|sem|aos|dos|das|às)[ \t\u00a0]+$/iu'
      # "o pelo do gato": a noun, after an article or a possessive.
      NOUN_PELO: '/(?:^|[^\p{L}])(?:o|os|um|seu|meu|teu|nosso|do|no|pelo)[ \t\u00a0]+$/iu'
      NUMBER_WORD: "/^(?:dois|duas|três|quatro|cinco|seis|sete|oito|nove|dez|onze|doze|treze|catorze|quatorze|quinze|vinte|trinta|quarenta|cinquenta|sessenta|setenta|oitenta|noventa|cem|cento|mil)$/"
      TODO_ARTICLE: '/^(?<todo>tod[oa]s?)[ \t\u00a0]+(?<article>[oa]s?)$/iu'
      # Adjectives of kind, which say what something is, not how someone felt ("voltou da viagem
      # cansado"): "-ico" with a written accent, nationalities in "-ês", "-eiro" and "-ário".
      # "mesa" and "meses" are nouns, so only "-ês" and longer "-eses" count.
      RELATIONAL: '/^(?:\p{Ll}*[áéíóúâêô]\p{Ll}*ic[oa]s?|\p{Ll}+ês|\p{Ll}{4,}eses|\p{Ll}+eir[oa]s?|\p{Ll}+ári[oa]s?)$/u'
      AFTER_ADJECTIVE: '/^(?:[ \t\u00a0]{0,2}(?:[.,;:!?)]|$)|[ \t\u00a0]{1,8}(?:e|ou|que|de|do|da|dos|das|em|no|na|nos|nas|para|com|por|pelo|pela)(?![\p{L}\p{M}\p{N}_''’@/#\\-]))/u'
      # "É necessário uma festa" -> "necessária", "É proibido as cartas" -> "São proibidas": with a
      # determiner, the subject after "ser" + adjective makes both agree.
      PREDICATE_BEFORE: '/(?:^|[^\p{L}])(?<verb>é|são|foi|foram|era|eram|será|serão|seria|seriam|fosse|fossem|for|forem|seja|sejam)(?<gap>[ \t\u00a0]+(?:(?:realmente|muito|bem|bastante|absolutamente|totalmente|extremamente)[ \t\u00a0]+)?)(?<adjective>(?<stem>necessári|proibid|permitid|obrigatóri|bonit)[oa]s?|louváve(?:l|is))[ \t\u00a0]+$/diu'
      # "O" alone reads as a capital, not as uppercase.
      nounCase:
        args: "typed: string"
        type: '"upper" | "title" | "lower"'
        return: 'typed.length === 1 ? (typed === typed.toLowerCase() ? "lower" : "title") : detectWordCase(typed)'
      nounFinding:
        args: "start: number, end: number, typed: string, alternatives: string[], context: { start: number; end: number }"
        type: RawFinding
        let:
          style: nounCase(typed)
        return: 'finding("portugueseAgreement", "review_msg_pt_noun_agreement", start, end, alternatives.map((alternative) => applyWordCase(alternative, style)), { context, ...(alternatives.length > 1 ? { requiresChoice: true } : {}) })'
      # The noun right after `end`: its analysis, or only its number.
      nextNoun:
        args: "ctx: DetectContext, end: number"
        type: PtNoun | null
        let:
          next: '/^[ \t\u00a0]+(\p{Ll}+)(?![\p{L}-])/u.exec(ctx.text.slice(end, end + 40))?.[1]'
          info: ptNoun(next)
        when: next !== undefined && !PT_NOT_NOUNS.has(next)
        return: "info ?? (/s$/.test(next) && !PT_SINGULAR_IN_S.has(next) && ptSingular(next) ? { feminine: null, plural: true, certain: false } : null)"
      # Whether the noun after fits the cell `index` of a row.
      fitsCell:
        args: "next: PtNoun | null, index: number"
        return: "!!next && next.plural === index > 1 && (next.feminine === null || next.feminine === (index % 2 === 1))"
      # "o nossa equipe" -> "a nossa", "os outro caras" -> "outros": an article and a possessive. The
      # noun after shows which of the two is wrong ("o mesma dia" -> "mesmo"); with no noun, or one of
      # either gender ("da seu espécie"), either word may be the wrong one.
      possessiveAgreement:
        args: "ctx: DetectContext, m: RegExpExecArray, cell: { row: string[]; index: number }, possessive: { row: string[]; index: number }"
        type: RawFinding | null
        let:
          typed: m.groups!.target
          word: m.groups!.noun
          start: m.indices!.groups!.target[0]
          wordStart: m.indices!.groups!.noun[0]
          wordEnd: m.indices!.groups!.noun[1]
          context: "({ start, end: wordEnd })"
          next: nextNoun(ctx, wordEnd)
          ownForm: possessive.row[cell.index]
          between: ctx.text.slice(start + typed.length, wordStart)
        when: '!(possessive.index === cell.index || cell.row[possessive.index] === "-")'
        return: >-
          next && fitsCell(next, cell.index) && !fitsCell(next, possessive.index)
            ? nounFinding(wordStart, wordEnd, word, [possessive.row[cell.index]], context)
            : (!next || fitsCell(next, cell.index)) && ownForm !== "-"
              ? nounFinding(start, wordEnd, typed, [`${cell.row[possessive.index]}${between}${word}`, `${typed.toLowerCase()}${between}${ownForm}`], context)
              : nounFinding(start, start + typed.length, typed, [cell.row[possessive.index]], context)
      # "Todo os erros" -> "Todos os", "toda as soluções" -> "todas as". "o mundo todo a admira":
      # after a noun, "todo" may close it and "a" be a pronoun.
      todoAgreement:
        args: "ctx: DetectContext, start: number, typed: string, noun: string, nounEnd: number, cell: { row: string[]; index: number }, context: { start: number; end: number }"
        type: RawFinding | null
        let:
          article: DETERMINER_CELLS.get(noun)!
          next: nextNoun(ctx, nounEnd)
          before: ctx.text.slice(Math.max(0, start - 40), start)
        when:
          - "!(article.index === cell.index || !next || next.plural !== article.index > 1)"
          - "!(next.feminine !== null && next.feminine !== (article.index % 2 === 1))"
          - "!(!next.certain && !SENTENCE_START.test(before) && !NOUN_PREPOSITION_BEFORE.test(before))"
        return: nounFinding(start, start + typed.length, typed, [cell.row[article.index]], context)
      # Whether the determiner surely is one here, for a noun whose gender is no certainty. "Nos
      # vemos amanhã": a sentence may open with the pronoun "nos". After "é necessário" or "é
      # proibido" the article opens the subject. "Um ajuda, o outro atrapalha": "um" as a pronoun.
      # "Nossa, que susto": an interjection.
      plainDeterminer:
        args: "ctx: DetectContext, det: string, start: number, typed: string"
        let:
          before: ctx.text.slice(Math.max(0, start - 40), start)
        return: >-
          det === "nos"
            ? false
            : PRONOUN_LIKE.has(det)
              ? SENTENCE_START.test(before) || NOUN_PREPOSITION_BEFORE.test(before) || PREDICATE_BEFORE.test(before)
              : det === "um" || det === "uma"
                ? !PRONOUN_UM.test(before) && !RECIPROCAL.test(ctx.text.slice(start, start + 80))
                : det === "nossa" && typed !== det
                  ? !SENTENCE_START.test(before)
                  : !STANDALONE.has(det)
      # Context that makes the word no determiner whatever noun follows. "Ela te da oportunidades":
      # the verb "dá" without its accent.
      notDeterminer:
        args: "det: string, before: string"
        return: >-
          ((det === "da" || det === "das") && NOUN_SUBJECT_BEFORE.test(before)) ||
          (/^pel[oa]s?$/.test(det) && NOUN_PELO.test(before)) ||
          (/^um/.test(det) && NUMBER_AND.test(before)) ||
          ((STANDALONE.has(det) || /^algu/.test(det)) && PREPOSITION_JUST_BEFORE.test(before))
      # "no porta malas", "um escalda rabos", "o camisa 10", "um extra três semanas": a compound
      # written without its hyphen, or a shirt number.
      compoundAfter:
        args: "ctx: DetectContext, end: number, noun: PtNoun"
        let:
          next: '/^[ \t\u00a0]+([\p{L}\p{N}]+)/u.exec(ctx.text.slice(end, end + 40))?.[1]'
        when: next !== undefined
        return: '/^\p{N}/u.test(next) || NUMBER_WORD.test(next) || (!noun.plural && /^\p{Ll}{3,}s$/u.test(next) && !!ptSingular(next) && !PT_NOT_NOUNS.has(next))'
        else: "false"
      # "a política econômico" -> "econômica": the adjective right after an agreeing noun phrase. A
      # verb may follow when the phrase opens the sentence; elsewhere a bare subject may follow the
      # phrase ("Na empresa brasileiro trabalha muito"). "-ês" adjectives of two genders in the
      # singular are rare; "português" takes "-esa".
      adjectiveAgreement:
        args: "ctx: DetectContext, nounEnd: number, feminine: boolean, plural: boolean, noun: string, subject: boolean"
        type: RawFinding | null
        let:
          found: '/^[ \t\u00a0]+(\p{Ll}+)(?![\p{L}\p{N}-])/u.exec(ctx.text.slice(nounEnd, nounEnd + 40))'
          adjective: found[1]
          start: nounEnd + found[0].length - adjective.length
          end: start + adjective.length
          nationality: /(?:ês|eses)$/.test(adjective)
          isPlural: "nationality ? /eses$/.test(adjective) : /s$/.test(adjective)"
          isFeminine: "!nationality && /as?$/.test(adjective)"
          stem: 'adjective.replace(nationality ? /(?:ês|eses)$/ : /[oa]s?$/, "")'
          wanted: 'nationality ? `${stem}${feminine ? (plural ? "esas" : "esa") : plural ? "eses" : "ês"}` : `${stem}${feminine ? "a" : "o"}${plural ? "s" : ""}`'
        when:
          - found !== null && !NAMING.has(noun)
          - "!(!RELATIONAL.test(adjective) || ptFiniteLookalike(adjective) || ctx.dictionary.has(adjective))"
          - "!(!subject && !AFTER_ADJECTIVE.test(ctx.text.slice(end, end + 12)))"
          - "!(isFeminine === feminine && isPlural === plural)"
        return: "nounFinding(start, end, adjective, [wanted], { start: nounEnd - noun.length, end })"
      # The adjective after "ser" before the determiner agrees with the noun; so does the verb.
      # "É necessário os alunos estudarem": the noun opens an infinitive clause.
      predicateAgreement:
        args: "ctx: DetectContext, detStart: number, nounEnd: number, feminine: boolean, plural: boolean"
        type: RawFinding | null
        let:
          offset: Math.max(0, detStart - 60)
          found: PREDICATE_BEFORE.exec(ctx.text.slice(offset, detStart))
          verb: found.groups!.verb
          gap: found.groups!.gap
          adjective: found.groups!.adjective
          stem: found.groups!.stem as string | undefined
          wantedAdjective: 'stem ? `${stem}${feminine ? "a" : "o"}${plural ? "s" : ""}` : plural ? "louváveis" : "louvável"'
          lowerVerb: verb.toLowerCase()
          verbPlural: lowerVerb in VERB_SINGULAR
          wantedVerb: "verbPlural === plural ? verb : applyWordCase(plural ? VERB_NUMBER[lowerVerb] : VERB_SINGULAR[lowerVerb], detectWordCase(verb))"
          adjectiveStart: offset + found.indices!.groups!.adjective[0]
          start: "wantedVerb === verb ? adjectiveStart : offset + found.indices!.groups!.verb[0]"
          end: adjectiveStart + adjective.length
          typed: ctx.text.slice(start, end)
        when:
          - found !== null
          - '!/^[ \t\u00a0]+\p{Ll}+(?:r|rem|res|rmos)(?![\p{L}])/u.test(ctx.text.slice(nounEnd, nounEnd + 30))'
          - "!(wantedVerb === verb && wantedAdjective === adjective.toLowerCase())"
        return: >-
          finding("portugueseAgreement", "review_msg_pt_noun_agreement", start, end, [wantedVerb === verb ? wantedAdjective : `${wantedVerb}${gap}${wantedAdjective}`].map((alternative) =>
              applyWordCase(alternative, nounCase(typed.split(/\s/)[0])),
            ), {
            context: { start, end: nounEnd },
          })
      # Determiner and noun agree: an adjective of kind after them must too, and a predicate before.
      agreeingPhrase:
        args: "ctx: DetectContext, det: string, start: number, nounEnd: number, noun: string, feminine: boolean, plural: boolean, before: string"
        let:
          subject: /^(?:[oa]s?|um|uma|uns|umas)$/.test(det) && SENTENCE_START.test(before)
          found: adjectiveAgreement(ctx, nounEnd, feminine, plural, noun, subject)
          predicate: predicateAgreement(ctx, start, nounEnd, feminine, plural)
        return: "[found, predicate].flatMap((f) => (f ? [f] : []))"
      # A determiner and a noun that disagree. "a" is also the preposition: "a pé", "a cavalo". "no
      # euromilhões", "uma Libertadores": a plural that agrees with a singular determiner in nothing
      # is mostly a name; a contracted preposition still shows the phrase ("na termos" -> "nos
      # termos"), but not before a name like "no Contas a Pagar" written in lowercase. A number
      # clash may also be the noun's: "os carro" -> "o carro" or "os carros".
      clashFix:
        args: "ctx: DetectContext, m: RegExpExecArray, det: string, cell: { row: string[]; index: number }, info: PtNoun, genderClash: boolean, pluralSubject: boolean, context: { start: number; end: number }"
        type: RawFinding | null
        let:
          typed: m.groups!.target
          noun: m.groups!.noun
          start: m.indices!.groups!.target[0]
          nounStart: m.indices!.groups!.noun[0]
          nounEnd: m.indices!.groups!.noun[1]
          detFeminine: cell.index % 2 === 1
          detPlural: cell.index > 1
          wanted: "cell.row[(info.plural ? 2 : 0) + ((info.feminine ?? detFeminine) ? 1 : 0)]"
          nounFix: "genderClash || pluralSubject ? null : detPlural ? ptPlural(noun) : ptSingular(noun)"
          between: ctx.text.slice(start + typed.length, nounStart)
        when:
          - '!(det === "a" && !pluralSubject)'
          - "!(info.plural && !detPlural && !pluralSubject && ((genderClash && (!CONTRACTED.has(det) || NAMED_TASK.test(ctx.text.slice(nounEnd, nounEnd + 24)))) || (!info.certain && info.feminine === null)))"
          - wanted !== "-"
        return: >-
          nounFix
            ? nounFinding(start, nounEnd, typed, [`${wanted}${between}${noun}`, `${det}${between}${nounFix}`], context)
            : nounFinding(start, start + typed.length, typed, [wanted], context)
      # The agreement of a determiner and the noun after it. An ending no verb or adjective has, or
      # a determiner that surely is one. "Este gatos estão", "Um canecas são": a plural verb right
      # after shows a plural subject. "colegas meus são": a possessive after its noun, before a
      # verb. "ao termos", "pelo fazermos": a personal infinitive, not the plural of "termo".
      plainAgreement:
        args: "ctx: DetectContext, m: RegExpExecArray, det: string, cell: { row: string[]; index: number }, context: { start: number; end: number }"
        type: RawFinding | RawFinding[] | null
        let:
          typed: m.groups!.target
          noun: m.groups!.noun
          start: m.indices!.groups!.target[0]
          nounEnd: m.indices!.groups!.noun[1]
          info: ptNoun(noun)
          before: ctx.text.slice(Math.max(0, start - 40), start)
          verbProof: info.certain && !ptFiniteLookalike(noun)
          pluralSubject: info.plural && SENTENCE_START.test(before) && PLURAL_VERB_AFTER.test(ctx.text.slice(nounEnd, nounEnd + 16))
          detFeminine: cell.index % 2 === 1
          detPlural: cell.index > 1
          genderClash: info.feminine !== null && info.feminine !== detFeminine
          numberClash: "info.plural !== detPlural && !(info.plural && /[aeio]rmos$/.test(noun))"
        when:
          - info !== null
          - "!notDeterminer(det, before)"
          - "!(!verbProof && !pluralSubject && !(QUANTIFIERS.has(det) && info.plural) && (!plainDeterminer(ctx, det, start, typed) || compoundAfter(ctx, nounEnd, info)))"
          - "!(POSSESSIVE_DETERMINERS.has(det) && info.feminine === null)"
        return: >-
          !genderClash && !numberClash
            ? info.feminine !== null
              ? agreeingPhrase(ctx, det, start, nounEnd, noun, info.feminine, info.plural, before)
              : null
            : clashFix(ctx, m, det, cell, info, genderClash, pluralSubject, context)
    frames:
      # A determiner and its noun. {{DETERMINER_LEAD}}: every determiner of DETERMINER_ROWS
      # but "à" and "às", which are portugueseConfusions' crase. "a" is also the preposition
      # ("a pé", "a meu ver"): it leads only for the adjective after its noun ("a política
      # econômica"). {{PRENOMINAL}}: two-gender adjectives that come before a noun: "um grande
      # erupção" -> "uma grande".
      - regex: "(?<target>{{DETERMINER_LEAD}})(?={{S}}(?:(?<modifier>(?:(?:mais|menos|tão){{S}})?(?:{{PRENOMINAL}})){{S}})?(?<noun>\\p{L}+){{E}}(?!-))"
        let:
          det: "target.toLowerCase()"
          start: "m.indices!.groups!.target[0]"
          nounEnd: "m.indices!.groups!.noun[1]"
          cell: "DETERMINER_CELLS.get(det)!"
          context: "({ start, end: nounEnd })"
          possessive: "POSSESSIVE_CELLS.get(noun)"
        when:
          - "!(modifier && modifier !== modifier.toLowerCase())"
          - "!(noun !== noun.toLowerCase() || ctx.dictionary.has(noun) || ctx.dictionary.has(det))"
          - '!/^(?:\.\.|…)/.test(ctx.text.slice(nounEnd, nounEnd + 2))'
          - '!(target !== det && !/^\p{Lu}\p{Ll}*$/u.test(target))'
        return: 'possessive && NOUN_ARTICLES.has(det) && det !== "a" && !modifier ? possessiveAgreement(ctx, m, cell, possessive) : TODO_ARTICLE.test(`${target} ${noun}`) && !modifier ? todoAgreement(ctx, start, target, noun, nounEnd, cell, context) : /^tod[oa]s?$/.test(det) ? null : plainAgreement(ctx, m, det, cell, context)'
  - id: pt_BR.verbAgreement
    checks: [portugueseAgreement]
    style: match
    message: review_msg_pt_agreement
    sets:
      # Time spans and words that open an adverbial, not a subject: "Este ano vão abrir", "Os
      # alunos dia 5 voltam", "Os jogadores fora de campo".
      VERB_NOT_SUBJECT_NOUNS:
        [
          vezes,
          anos,
          meses,
          semanas,
          dias,
          horas,
          minutos,
          segundos,
          tempos,
          décadas,
          séculos,
          instantes,
          momentos,
          ano,
          dia,
          mês,
          semana,
          vez,
          hora,
          minuto,
          segundo,
          século,
          momento,
          período,
          tempo,
          fim,
          verão,
          inverno,
          outono,
          primavera,
          sábado,
          domingo,
          gente,
          resto,
          pé,
          cavalo,
        ]
      # Nouns of quantity, whose verb may agree with their complement ("a maioria das escolas estão").
      DISTANT_COLLECTIVE:
        [
          maioria,
          minoria,
          metade,
          parte,
          resto,
          porção,
          porcentagem,
          percentagem,
          totalidade,
          quantidade,
          número,
          grupo,
          conjunto,
          série,
          dezena,
          centena,
          milhar,
          milhão,
          milhões,
          bilhão,
          bilhões,
          par,
          tipo,
          espécie,
        ]
    maps:
      HOUR_VERBS:
        deu: deram
        bateu: bateram
        soou: soaram
        dava: davam
        batia: batiam
        soava: soavam
        dará: darão
        baterá: baterão
        soará: soarão
        daria: dariam
        bateria: bateriam
      HOUR_AUXILIARIES:
        vai: vão
        ia: iam
        está: estão
        estava: estavam
        tinha: tinham
        havia: haviam
        pode: podem
        deve: devem
      SER_PRONOUN:
        foi: { eu: fui, nós: fomos, eles: foram, elas: foram, vocês: foram }
        é: { eu: sou, nós: somos, eles: são, elas: são, vocês: são }
        será: { eu: serei, nós: seremos, eles: serão, elas: serão, vocês: serão }
    defs:
      VERB_PLURAL_LEADS: new Set("{{VERB_PLURAL_LEAD}}".split("|"))
      # "Os ficheiros cache são", "As palavras passe são": a word before a verb modifies the noun.
      VERB_AFTER_SUBJECT: '/^[ \t\u00a0]+(?:é|são|foi|foram|era|eram|está|estão|estava|estavam|tem|têm|vai|vão|fica|ficam|será|serão|parece|parecem)(?![\p{L}])/u'
      # "Algumas coisas é melhor que não sejam ditas": an impersonal "é melhor que".
      IMPERSONAL_AFTER: '/^[ \t\u00a0]+(?:melhor|pior|bom|importante|necessário|preciso|possível|difícil|fácil)[ \t\u00a0]+que(?![\p{L}])/u'
      # Nothing but a sentence start or a conjunction before: "O sino bateu dez horas" has its
      # subject.
      HOUR_CLAUSE_OPENING: '/(?:(?:^|[.!?;:\n]["''”’»)]*)[ \t\u00a0]*|(?:^|[^\p{L}])(?:quando|que|até|mal|se|enquanto)[ \t\u00a0]+)(?:(?:já|não|ainda|nem|quase)[ \t\u00a0]+)*$/iu'
      TENSE_DETERMINER_BEFORE: '/(?:^|[^\p{L}])(?:o|a|os|as|um|uma|do|da|no|na|pelo|pela|este|esse|aquele|meu|seu|nosso)[ \t\u00a0]+$/iu'
      # Only a time phrase that opens its clause rules the verb: not "Quem chegou ontem enviará".
      FRONT_OPENING: '/(?:^|[.!?;:,\n]["''”’»)]*)[ \t\u00a0]*(?:(?:eu|tu|ele|ela|nós|vós|eles|elas|você|vocês)[ \t]+)?$/iu'
      # Endings that nouns have too ("bandeiras", "eras") need a known verb stem.
      RARE_ENDING: "/(?:ás|emos|eis|aras|eras|iras|áreis|êreis|íreis)$/u"
      # The agreement finding for `group`, in the typed casing; a user word stays.
      verbAgreementFinding:
        args: 'ctx: DetectContext, m: RegExpExecArray, group: string, alternatives: string[], messageKey: RawFinding["messageKey"]'
        type: RawFinding | null
        let:
          typed: m.groups![group]
          span: m.indices!.groups![group]
          style: detectWordCase(typed)
        when: "!ctx.dictionary.has(typed.toLowerCase())"
        return: >-
          finding("portugueseAgreement", messageKey, span[0], span[1], alternatives.map((alternative) => applyWordCase(alternative, style)), {
            context: { start: Math.min(m.index, span[0]), end: Math.max(span[1], m.index + m[0].length) },
            ...(alternatives.length > 1 ? { requiresChoice: true } : {}),
          })
      # Whether the frame's noun and verb read as subject and verb. "Os meninos é que sabem": the
      # cleft "é que" does not agree.
      subjectAndVerb:
        args: "ctx: DetectContext, m: RegExpExecArray"
        let:
          lead: m.groups!.lead
          noun: m.groups!.noun
          verb: m.groups!.target
          verbEnd: m.indices!.groups!.target[1]
          after: ctx.text.slice(verbEnd, verbEnd + 40)
        when:
          - 'lead === lead.replace(/^\p{Ll}/u, (c) => c.toUpperCase())'
          - SENTENCE_START.test(ctx.text.slice(Math.max(0, m.index - 8), m.index))
          - noun === noun.toLowerCase() && verb === verb.toLowerCase()
          - "!(VERB_NOT_SUBJECT_NOUNS.has(noun) || PT_NOT_FINITE.has(verb) || /mente$/.test(verb))"
          - '!/^[ \t\u00a0]+que(?![\p{L}])/u.test(after)'
        return: "!VERB_AFTER_SUBJECT.test(after) && !IMPERSONAL_AFTER.test(after)"
        else: "false"
      # The index of the first token from `from` on that is no clitic, or the end of the tokens.
      pastClitics:
        args: "tokens: ClauseToken[], from: number"
        let:
          found: tokens.findIndex((t, i) => i >= from && !PT_CLAUSE.clitics.has(t.w))
        return: "found < 0 ? tokens.length : found"
      # A past or future verb next to "ontem" or "amanhã"; `after` frames put the verb second.
      tenseFinding:
        args: "ctx: DetectContext, m: RegExpExecArray, after: boolean, past: boolean"
        type: RawFinding | null
        let:
          form: m.groups!.target.toLowerCase()
          start: m.indices!.groups!.target[0]
        when:
          - "!(after && !FRONT_OPENING.test(ctx.text.slice(Math.max(0, m.index - 8), m.index)))"
          - "!TENSE_DETERMINER_BEFORE.test(ctx.text.slice(Math.max(0, start - 12), start))"
          - "!(RARE_ENDING.test(form) && !ptKnownVerb(form))"
          # "esperam", "para": a present tense of an -rar verb, not a preterite or pluperfect.
          - '!(past && ptRStem(form.replace(/(?:am|a)$/, "")))'
        return: >-
          past
            ? verbAgreementFinding(ctx, m, "target", [ptFutureOfPast(form)], "review_msg_pt_tense_adverb")
            : verbAgreementFinding(ctx, m, "target", ptPastOfFuture(form), "review_msg_pt_tense_adverb")
    frames:
      # A noun-phrase subject opening the sentence and its verb: "Os meninos dança" -> "dançam".
      - regex: "(?<lead>{{VERB_PLURAL_LEAD}}){{S}}(?:(?:{{POSSESSIVE}}){{S}})?(?<noun>\\p{L}{3,}(?:[aeo]s|ões|ães|ais|éis|óis|res|zes)){{S}}{{VERB_ADVERBS}}{{VERB_CLITIC}}(?<target>\\p{L}{2,}|é){{E}}(?!-)"
        let:
          wanted: "ptPluralVerb(target)"
        when:
          - "subjectAndVerb(ctx, m)"
          - "wanted !== undefined"
        return: 'verbAgreementFinding(ctx, m, "target", [wanted], "review_msg_pt_agreement")'
      # "O menino gostam" -> "gosta".
      - regex: "(?<lead>{{VERB_SINGULAR_LEAD}}){{S}}(?:(?:{{POSSESSIVE}}){{S}})?(?<noun>\\p{L}{3,}){{S}}{{VERB_ADVERBS}}{{VERB_CLITIC}}(?<target>\\p{L}{2,}){{E}}(?!-)"
        let:
          rows: "PT_FORM_ROWS.get(target)"
          wanted: "rows ? rows.find((candidate) => candidate[3] === target && candidate[1] !== target)?.[1] : /[ae]m$/.test(target) && !PT_NOT_PLURAL_VERBS.has(target) && !PT_NOT_FINITE.has(target) ? ptSingularVerb(target, false) : undefined"
        when:
          - "subjectAndVerb(ctx, m) && !/s$/.test(noun) && !PT_NOT_FINITE.has(noun)"
          - "!(/^a$/i.test(lead) && !/(?:a|ção|dade|gem|ice|ez)$/.test(noun))"
          - "wanted !== undefined"
        return: 'verbAgreementFinding(ctx, m, "target", [wanted], "review_msg_pt_agreement")'
      # "A lista dos produtos estão", "Os preços da casa que comprei sobe": the code reads the
      # subject past its complements, a second noun phrase or a relative clause with the shared
      # clause reader.
      - regex: "(?<target>{{VERB_PLURAL_LEAD}}|{{VERB_SINGULAR_LEAD}}){{S}}(?=\\p{L})"
        let:
          tokens: "clauseTokensAfter(ctx.text, m.index, 16)"
          noun: "tokens[1] && !tokens[1].hyphen ? ptNoun(tokens[1].w) : null"
          leadPlural: "VERB_PLURAL_LEADS.has(tokens[0].w)"
          head: "skipPostnominal(PT_CLAUSE, tokens, 2)"
          joined: "skipCoordinated(PT_CLAUSE, ctx.text, tokens, head)"
          plural: "leadPlural || joined > head"
          end: "skipComplements(PT_CLAUSE, ctx.text, tokens, joined)"
          relative: "verbAfterRelative(PT_CLAUSE, ctx.text, tokens, end, () => true)"
          moved: "relative < 0 && (end > joined || joined > head)"
          at: "moved ? pastClitics(tokens, end) : relative"
          verb: "tokens[at]"
          after: "ctx.text.slice(verb.end, verb.end + 40)"
          rows: "PT_FORM_ROWS.get(verb.w)"
          wanted: "plural ? (!/[ae]m$|ão$/.test(verb.w) ? ptPluralVerb(verb.w) : undefined) : rows ? rows.find((row) => row[3] === verb.w && row[1] !== verb.w)?.[1] : /[ae]m$/.test(verb.w) ? ptSingularVerb(verb.w, false) : undefined"
        when:
          - 'target === target.replace(/^\p{Ll}/u, (c) => c.toUpperCase())'
          - "SENTENCE_START.test(ctx.text.slice(Math.max(0, m.index - 8), m.index))"
          - "noun !== null && !VERB_NOT_SUBJECT_NOUNS.has(tokens[1].w) && !DISTANT_COLLECTIVE.has(tokens[1].w)"
          - '!(tokens[0].w === "a" && noun.feminine !== true)'
          - "ctx.text.slice(tokens[1].start, tokens[1].end) === tokens[1].w"
          - "noun.plural === leadPlural"
          - "!(moved && at === end && at + 1 < tokens.length && ptFiniteVerb(tokens[at + 1].w))"
          - "at >= 0 && at < tokens.length"
          - "!(verb.hyphen || !ptFiniteVerb(verb.w) || /mente$/.test(verb.w))"
          - "!(ctx.text.slice(verb.start, verb.end) !== verb.w || ctx.dictionary.has(verb.w))"
          - "!/^(?:é|são|foi|foram|era|eram|será|serão|seja|sejam)$/.test(verb.w)"
          - '!(/^[ \t\u00a0]+que(?![\p{L}])/u.test(after) || IMPERSONAL_AFTER.test(after))'
          - "wanted !== undefined && wanted !== verb.w"
        return: 'finding("portugueseAgreement", "review_msg_pt_agreement", verb.start, verb.end, [wanted], { context: { start: m.index, end: verb.end } })'
      # Hours take the plural: "Já deu dez horas" -> "deram", "Está dando 10h" -> "Estão". Two
      # o'clock or later ({{HOUR}}): "uma hora" and "meio-dia" stay singular.
      - regex: "(?<target>deu|bateu|soou|dava|batia|soava|dará|baterá|soará|daria|bateria)(?={{S}}{{HOUR}})"
        when:
          - "HOUR_CLAUSE_OPENING.test(ctx.text.slice(Math.max(0, m.index - 40), m.index))"
        return: 'verbAgreementFinding(ctx, m, "target", [HOUR_VERBS[target.toLowerCase()]], "review_msg_pt_agreement")'
      - regex: "(?<target>vai|ia|está|estava|tinha|havia|pode|deve)(?={{S}}(?:dar|bater|soar|dando|batendo|soando|dado|batido|soado){{S}}{{HOUR}})"
        when:
          - "HOUR_CLAUSE_OPENING.test(ctx.text.slice(Math.max(0, m.index - 40), m.index))"
        return: 'verbAgreementFinding(ctx, m, "target", [HOUR_AUXILIARIES[target.toLowerCase()]], "review_msg_pt_agreement")'
      # "ser" agrees with the pronoun after it: "Quem fez foi eu" -> "fui".
      - regex: "(?<target>foi|é|será){{S}}(?<pronoun>eu|nós|eles|elas|vocês)(?=[ \\t\\u00a0]{0,2}(?:[.!?,;:]|$)|{{S}}(?:que|quem|mesm[oa]s?|própri[oa]s?){{E}})"
        return: 'verbAgreementFinding(ctx, m, "target", [SER_PRONOUN[target.toLowerCase()][pronoun.toLowerCase()]], "review_msg_pt_agreement")'
      # "trata-se de" and "precisa-se de" stay singular.
      - regex: "(?<target>tratam|precisam|necessitam)-se{{S}}de{{E}}(?!{{S}}(?:manhã|tarde|noite|madrugada|forma|maneira|modo){{E}})"
        when:
          - "SENTENCE_START.test(ctx.text.slice(Math.max(0, m.index - 8), m.index))"
        return: 'verbAgreementFinding(ctx, m, "target", [target.slice(0, -1)], "review_msg_pt_agreement")'
      # A future verb next to "ontem", "na semana passada", "na passada semana"; "a semana
      # passada" needs its comma. {{TIME_SUBJECT}}: a short subject between the time phrase and
      # the verb: "os editores", "ela", "vós".
      - regex: "(?<target>{{FUTURE_FORM}}){{S}}{{PAST_TIME}}{{E}}"
        message: review_msg_pt_tense_adverb
        return: "tenseFinding(ctx, m, false, false)"
      - regex: "(?:{{PAST_TIME}},?|{{BARE_PAST_TIME}}){{S}}{{TIME_SUBJECT}}(?<target>{{FUTURE_FORM}}){{E}}"
        message: review_msg_pt_tense_adverb
        return: "tenseFinding(ctx, m, true, false)"
      # A past verb next to "amanhã": "Enviaram amanhã" -> "Enviarão".
      - regex: "(?<target>{{PAST_FORM}}){{S}}{{FUTURE_TIME}}{{E}}"
        message: review_msg_pt_tense_adverb
        return: "tenseFinding(ctx, m, false, true)"
      - regex: "{{FUTURE_TIME}},?{{S}}{{TIME_SUBJECT}}(?<target>{{PAST_FORM}}){{E}}"
        message: review_msg_pt_tense_adverb
        return: "tenseFinding(ctx, m, true, true)"
  - id: pt_BR.subjunctives
    checks: [portugueseAgreement]
    style: match
    message: review_msg_pt_subjunctive
    sets:
      # "Espero que a sala limpa esteja pronta": an adjective, not the verb, when one of these follows.
      VERB_NEXT:
        [
          seja,
          sejam,
          esteja,
          estejam,
          fique,
          fiquem,
          fosse,
          fossem,
          estivesse,
          estivessem,
          ficasse,
          ficassem,
          é,
          são,
          está,
          estão,
          era,
          eram,
          foi,
          foram,
          fica,
          ficam,
          ficou,
          parece,
          parecem,
          pareça,
          continue,
          tenha,
          tenham,
          tem,
          têm,
          possa,
          possam,
          pode,
          podem,
          deve,
          devem,
          vá,
          vai,
          vão,
          venha,
          venham,
        ]
    defs:
      # "no caso", "o mesmo que", "acho ainda que": these read as conjunctions only opening a clause.
      CLAUSE_ONLY: "/^(?:caso|ainda|mesmo|antes)/i"
      SUBJUNCTIVE_CLAUSE_BEFORE: '/(?:^|[.!?;:,\n]["''”’»)]*)[ \t\u00a0]*$/u'
      SUBJUNCTIVE_DETERMINER_BEFORE: '/(?:^|[^\p{L}])(?:o|a|os|as|um|uma|do|da|no|na|ao|pelo|pela|este|esse|aquele|meu|seu|nosso|cada|qualquer|tal|neste|nesse|desse|deste|em|de)[ \t\u00a0]+$/iu'
      # Whether the person of a subjunctive reading fits the subject found ("-o" only after "eu").
      # No subject: the ending alone names the person; "-o" is as often a noun.
      personFits:
        args: "form: string, read: PtSubjunctive, subject: PtPerson | null"
        return: 'read.person === null || (subject ? read.person === subject : read.person !== "1s" && !/o$/.test(form))'
      # The subjunctive of the verb of the clause after a governor; `past` asks the imperfect.
      subjunctiveFinding:
        args: "ctx: DetectContext, m: RegExpExecArray, past: boolean"
        type: RawFinding | null
        let:
          lead: m.groups!.lead
          before: ctx.text.slice(Math.max(0, m.index - 24), m.index)
          clause: ptClauseVerb(ctx.text, m.index + m[0].length)
          read: ptSubjunctive(clause.word)
          wanted: "past ? read.past : read.present"
        when:
          - "!SUBJUNCTIVE_DETERMINER_BEFORE.test(before)"
          - "!(CLAUSE_ONLY.test(lead) && !SUBJUNCTIVE_CLAUSE_BEFORE.test(before))"
          # "Espera que eu já volto": a sentence-opening "espera" is the imperative "wait".
          - "!(/^esper[ae]$/i.test(lead) && SUBJUNCTIVE_CLAUSE_BEFORE.test(before))"
          - 'clause !== null && !(clause.afterNoun && VERB_NEXT.has(clause.next ?? ""))'
          - "!ctx.dictionary.has(clause.word)"
          - read !== null && personFits(clause.word, read, clause.person)
          - wanted !== null && wanted !== "" && wanted !== clause.word
        return: 'finding("portugueseAgreement", "review_msg_pt_subjunctive", clause.start, clause.end, [applyWordCase(wanted, detectWordCase(clause.word))], { context: { start: m.index, end: clause.end } })'
    frames:
      # A wish, request, fear or doubt and "que": "Espero que você está bem" -> "esteja".
      - regex: "(?<lead>{{PRESENT_GOVERNORS}}){{S}}que(?=[ \\t\\u00a0])"
        owner: lead
        return: "subjunctiveFinding(ctx, m, false)"
      # The same verbs in a past or conditional tense take the imperfect subjunctive: "Queria
      # que ele vem" -> "viesse".
      - regex: "(?<lead>{{PAST_GOVERNORS}}){{S}}que(?=[ \\t\\u00a0])"
        owner: lead
        return: "subjunctiveFinding(ctx, m, true)"
      # Conjunctions that take the present subjunctive ("Embora tem", "Caso parece").
      - regex: "(?<lead>{{CONJUNCTIONS}})(?=[ \\t\\u00a0])"
        owner: lead
        return: "subjunctiveFinding(ctx, m, false)"
  - id: pt_BR.subjectPredicates
    checks: [portugueseAgreement]
    style: match
    message: review_msg_pt_noun_agreement
