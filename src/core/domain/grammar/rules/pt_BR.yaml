      # Nouns spelled like a participle, which follow "ser" bare: "A crise é resultado de".
      NOUNS_IN_DO:
        [
          resultad,
          estad,
          mercad,
          soldad,
          advogad,
          deputad,
          delegad,
          cuidad,
          pecad,
          legad,
          recad,
          significad,
          partid,
          sentid,
          pedid,
          ruíd,
          tecid,
          marid,
          vestid,
          ouvid,
          apelid,
          bocad,
          dad,
          lad,
          prad,
          gad,
          fad,
          senad,
          reinad,
          eleitorad,
          mandad,
          atentad,
          cunhad,
          namorad,
          aliad,
          comunicad,
          atestad,
          diplomad,
          doutorad,
          mestrad,
          feriad,
          ditad,
          sobrad,
          telhad,
          gramad,
          machad,
          bordad,
        ]
      # "A gente está cansado": "a gente" is "we".
      NOT_PREDICATE_SUBJECT: [gente, maioria, minoria, metade, parte, porcentagem]
    defs:
      # What may follow a predicate adjective: the end of the clause or a word that cannot be its noun.
      CLAUSE_GOES_ON: '/^(?:[ \t\u00a0]*(?:[.,;:!?)"”»…]|$)|[ \t\u00a0]+(?:e|ou|mas|de|do|da|dos|das|com|para|pra|em|no|na|nos|nas|por|pelo|pela|a|ao|à|aos|às|hoje|agora|ontem|amanhã|demais|também|ainda|sempre|que|quando|porque|pois|se|como|depois|antes|aqui|ali|lá|mesmo|logo|desde|até|sem|nesta|neste|nessa|nesse)(?![\p{L}]))/u'
    frames:
      # "A palavra está correto" -> "correta", "Elas são altos" -> "altas": a pronoun of known
      # gender, or an article and a noun, opens the sentence before the copula.
      - regex: "(?:(?<pronoun>ele|ela|eles|elas)|(?<article>o|a|os|as){{S}}(?<noun>\\p{L}{3,})){{S}}(?:não{{S}})?(?<copula>{{COPULA_SER}}|{{COPULA_ESTAR}}){{S}}{{PREDICATE_ADVERBS}}(?<target>\\p{L}{3,}[oa]s?){{E}}(?![-\\p{L}])"
        let:
          info: "pronoun ? null : ptNoun(noun)"
          feminine: "info ? info.feminine === true : /^elas?$/i.test(pronoun)"
          plural: "info ? info.plural : /s$/i.test(pronoun)"
          stem: 'target.replace(/[oa]s?$/, "")'
          participle: '/\p{Ll}{2}(?:ad|id)$/u.test(stem) && !NOUNS_IN_DO.has(stem)'
          targetEnd: "m.indices!.groups!.target[1]"
          wanted: '`${stem}${feminine ? "a" : "o"}${plural ? "s" : ""}`'
        when:
          - "SENTENCE_START.test(ctx.text.slice(Math.max(0, m.index - 8), m.index))"
          - "target === target.toLowerCase() && !ctx.dictionary.has(target)"
          - "pronoun ? pronoun.slice(1) === pronoun.slice(1).toLowerCase() : noun === noun.toLowerCase() && !NOT_PREDICATE_SUBJECT.has(noun)"
          - "!!pronoun || (info !== null && info.feminine !== null)"
          - "!info || (/a/i.test(article) === feminine && /s$/i.test(article) === plural)"
          - "CLAUSE_GOES_ON.test(ctx.text.slice(targetEnd, targetEnd + 24))"
          - "ADJECTIVE_STEMS.has(stem) || participle"
          - '!(stem === "car" && /^[ \t\u00a0]+de(?![\p{L}])/u.test(ctx.text.slice(targetEnd)))'
          - "wanted !== target"
          - "/(?:ão|am|em)$/.test(copula) === plural"
        return: 'finding("portugueseAgreement", "review_msg_pt_noun_agreement", m.indices!.groups!.target[0], targetEnd, [applyWordCase(wanted, detectWordCase(target))], { context: { start: m.index, end: targetEnd } })'
  - id: pt_BR.relativeAgreement
    checks: [portugueseAgreement]
    style: match
    message: review_msg_pt_noun_agreement
    maps:
      PREPOSITION_FORMS:
        pel: [pelo, pela, pelos, pelas]
        n: ["no", na, nos, nas]
        d: [do, da, dos, das]
        a: [ao, à, aos, às]
    sets:
      # Pronominal verbs that govern "a": "Refere-se as práticas" lacks a crase, the noun is no subject.
      GOVERNS_A_SE:
        [
          refere,
          dirige,
          candidata,
          dedica,
          submete,
          adapta,
          acostuma,
          habitua,
          apega,
          destina,
          resume,
          limita,
          restringe,
          assemelha,
          equipara,
          alia,
        ]
    defs:
      # "Acontece muitas vezes", "ocorre dois dias depois": a span of time is no subject.
      TIME_WORD: /^(?:{{TIME}})$/
    frames:
      # "a razão pelo qual" -> "pela qual": "o/a qual" agrees with the noun right before it.
      - regex: "(?<noun>\\p{L}{3,}){{S}}(?<target>(?<prep>pel|n|d|a|à)(?<article>o|a|os|as)?){{S}}(?<qual>qual|quais){{E}}"
        let:
          row: "Object.values(PREPOSITION_FORMS).find((forms) => forms.includes(target))"
          info: "ptNoun(noun)"
          before: "ctx.text.slice(Math.max(0, m.index - 30), m.index)"
          wanted: "row[(info.plural ? 2 : 0) + (info.feminine ? 1 : 0)]"
          span: "m.indices!.groups!.target"
        when:
          - "noun === noun.toLowerCase() && target === target.toLowerCase()"
          - "row !== undefined"
          - "info !== null && info.feminine !== null"
          - '!/(?:^|[^\p{L}])(?:ou|e)[ \t\u00a0]+(?:\p{L}+[ \t\u00a0]+)?$/u.test(before)'
          - '(qual === "quais") === info.plural'
          - "wanted !== target"
        return: 'finding("portugueseAgreement", "review_msg_pt_noun_agreement", span[0], span[1], [wanted], { context: { start: m.index, end: m.index + m[0].length } })'
      # "Vende-se casas" -> "Vendem-se casas": with "se" the plural noun after the verb is its
      # subject. "Precisa-se de", "Trata-se de" have none.
      - regex: "(?<verb>\\p{L}{3,}[ae])-se{{S}}(?:(?<det>os|as|muitos|muitas|vários|várias|alguns|algumas|novos|novas|diversos|diversas|\\d+){{S}})?(?<noun>\\p{L}{3,}s){{E}}"
        owner: verb
        message: review_msg_pt_agreement
        let:
          info: "ptNoun(noun)"
          lower: "verb.toLowerCase()"
          stems: "ptVerbStems()"
          stem: "lower.slice(0, -1)"
          span: "m.indices!.groups!.verb"
        when:
          - "verb.slice(1) === verb.slice(1).toLowerCase() && noun === noun.toLowerCase()"
          - "info?.plural === true && info.feminine !== null"
          - "!(!det && !info.certain && !/[ao]s$/.test(noun))"
          - "!TIME_WORD.test(noun)"
          - "!GOVERNS_A_SE.has(lower)"
          - 'lower.endsWith("a") ? stems.ar.has(stem) : stems.er.has(stem) || stems.ir.has(stem)'
        return: 'finding("portugueseAgreement", "review_msg_pt_agreement", span[0], span[1], [applyWordCase(`${verb}m`, detectWordCase(verb))], { context: { start: m.index, end: m.index + m[0].length } })'
  - id: pt_BR.quantifiedAdjectives
    checks: [portugueseAgreement]
    style: match
    message: review_msg_pt_noun_agreement
    frames:
      # "Estamos muitos contentes" -> "muito contentes", "Ela está meia cansada" -> "meio
      # cansada": before an adjective "muito" and "meio" are adverbs.
      - regex: "(?:{{COPULA_SER}}|{{COPULA_ESTAR}}|somos|estamos|ficamos|fomos|éramos|estávamos){{S}}(?<target>muit[oa]s|pouc[oa]s|muita|pouca|demasiad[oa]s?|bastantes|meias?){{S}}(?<adjective>\\p{L}{3,}[oa]s?|contentes|felizes|tristes|alegres|doentes|inteligentes|diferentes|ansiosos){{E}}"
        let:
          stem: 'adjective.replace(/[oa]s?$/, "")'
          participle: '/\p{Ll}{2}(?:ad|id)$/u.test(stem) && !NOUNS_IN_DO.has(stem) && !/^(?:é|são|era|eram|foi|foram|será|serão|seria|seriam|somos|fomos|éramos)\s/iu.test(m[0])'
          end: "m.indices!.groups!.adjective[1]"
          wanted: 'target.startsWith("muit") ? "muito" : target.startsWith("pouc") ? "pouco" : target.startsWith("demasiad") ? "demasiado" : target.startsWith("meia") ? "meio" : "bastante"'
          span: "m.indices!.groups!.target"
        when:
          - "target === target.toLowerCase() && adjective === adjective.toLowerCase()"
          - "ADJECTIVE_STEMS.has(stem) || participle || /es$/.test(adjective)"
          - "CLAUSE_GOES_ON.test(ctx.text.slice(end, end + 24))"
        return: 'finding("portugueseAgreement", "review_msg_pt_noun_agreement", span[0], span[1], [wanted], { context: { start: m.index, end } })'
  - id: pt_BR.fixedAgreements
    checks: [portugueseAgreement]
    style: match
    message: review_msg_pt_noun_agreement
    maps:
      # "duas milhões" -> "dois", "as milhares de" -> "os": milhão, bilhão and milhar are masculine.
      MASCULINE_OF:
        uma: um
        duas: dois
        duzentas: duzentos
        trezentas: trezentos
        quatrocentas: quatrocentos
        quinhentas: quinhentos
        seiscentas: seiscentos
        setecentas: setecentos
        oitocentas: oitocentos
        novecentas: novecentos
        as: os
        das: dos
        nas: nos
        pelas: pelos
        estas: estes
        essas: esses
        aquelas: aqueles
        muitas: muitos
        várias: vários
        algumas: alguns
        tantas: tantos
        poucas: poucos
        outras: outros
      # "Segue anexo a lista" -> "anexa": "anexo" agrees with what is sent.
      ANNEX_DET:
        o: anexo
        a: anexa
        os: anexos
        as: anexas
        um: anexo
        uma: anexa
        meu: anexo
        minha: anexa
        meus: anexos
        minhas: anexas
        nosso: anexo
        nossa: anexa
        nossos: anexos
        nossas: anexas
        seu: anexo
        sua: anexa
        seus: anexos
        suas: anexas
    defs:
      # The agreement fix of `group`, unless it is already right or a user word.
      fixedAgreement:
        args: "ctx: DetectContext, m: RegExpExecArray, group: string, wanted: string"
        type: RawFinding | null
        let:
          span: m.indices!.groups![group]
          typed: ctx.text.slice(span[0], span[1])
        when: "!(wanted === typed.toLowerCase() || ctx.dictionary.has(typed.toLowerCase()))"
        return: 'finding("portugueseAgreement", "review_msg_pt_noun_agreement", span[0], span[1], [applyWordCase(wanted, detectWordCase(typed))], { context: { start: m.index, end: Math.max(span[1], m.index + m[0].length) } })'
    frames:
      # "duas milhões" -> "dois", "as milhares de" -> "os": milhão, bilhão and milhar are
      # masculine nouns, so the words before them are too ("duas mil" agrees with the noun after
      # "mil"). "a milhares de quilômetros" keeps the preposition "a". The match start owns the
      # frame.
      - regex: "(?<target>{{PLURAL_FEMININE}}){{S}}(?=(?:milhões|bilhões|trilhões|milhares){{E}})|(?<one>uma){{S}}(?=(?:milhão|bilhão|trilhão|milhar){{E}})"
        owner: none
        let:
          group: 'one ? "one" : "target"'
        when:
          - "!(m.index < ctx.from || m.index >= ctx.to)"
        return: "fixedAgreement(ctx, m, group, MASCULINE_OF[m.groups![group].toLowerCase()])"
      # "muitos poucos" -> "muito poucos": before "pouco" the intensifier is an adverb.
      - regex: "(?<target>muit[oa]s|muita|bastantes){{S}}(?=pouc[oa]s?{{E}})"
        return: 'fixedAgreement(ctx, m, "target", target.toLowerCase().startsWith("muit") ? "muito" : "bastante")'
      # "Segue anexo a lista" -> "anexa", "Seguem anexo as fotos" -> "anexas": "anexo" is an
      # adjective agreeing with what is sent ("em anexo" does not vary). "anexo a este e-mail" is
      # a preposition.
      - regex: "(?:segue|seguem|seguiu|seguiram|vai|vão|envio|enviamos|remeto|remetemos|encaminho|encaminhamos|mando|mandamos){{S}}(?<target>anex[oa]s?){{S}}(?<det>o|a|os|as|um|uma|meu|minha|meus|minhas|nosso|nossa|nossos|nossas|seu|sua|seus|suas){{S}}(?!(?:este|esta|esse|essa|aquele|aquela|isto|isso|presente|mensagem|e-mail|email|carta|ofício){{E}})\\p{L}"
        return: 'fixedAgreement(ctx, m, "target", ANNEX_DET[det.toLowerCase()])'
  - id: pt_BR.passiveNumber
    checks: [portugueseAgreement]
    style: match
    message: review_msg_pt_passive_number
    maps:
      COPULA_NUMBER:
        foi: foram
        foram: foi
        é: são
        são: é
        era: eram
        eram: era
        será: serão
        serão: será
        seria: seriam
        seriam: seria
        for: forem
        forem: for
        fosse: fossem
        fossem: fosse
        seja: sejam
        sejam: seja
    sets:
      SHORT_PARTICIPLES: [feit, dit, escrit, abert, cobert, pag, ganh, gast, entregu, aceit]
    defs:
      SUBJECT_AFTER_COPULA: '/^[ \t\u00a0]+(?:(?<one>o|um|uma)|os|as|uns|umas|outros|outras|todos|todas|muitos|muitas|vários|várias|alguns|algumas|novos|novas)[ \t\u00a0]/u'
    frames:
      # "Foram corrigido o valor" -> "Foi corrigido", "Foi pagos os juros" -> "Foram pagos": a
      # participle or adjective after "ser" takes the verb's number. The subject after them
      # tells which word is wrong, so a determiner must follow: "O destaque foi convidados de
      # honra" has a noun.
      - regex: "(?<copula>foi|foram|é|são|era|eram|será|serão|seria|seriam|for|forem|fosse|fossem|seja|sejam){{S}}(?<target>\\p{L}{3,}[oa]s?){{E}}(?![-\\p{L}])"
        let:
          stem: 'target.replace(/[oa]s?$/, "")'
          participle: '(/\p{Ll}{2}(?:ad|id)$/u.test(stem) && !NOUNS_IN_DO.has(stem)) || SHORT_PARTICIPLES.has(stem)'
          pluralCopula: "/(?:ão|am|em)$/.test(copula)"
          start: "m.indices!.groups!.copula[0]"
          end: "m.indices!.groups!.target[1]"
          subject: "SUBJECT_AFTER_COPULA.exec(ctx.text.slice(end, end + 24))"
          lower: "copula.toLowerCase()"
          fixed: "!!subject.groups!.one === pluralCopula ? `${COPULA_NUMBER[lower]} ${target}` : `${lower} ${pluralCopula ? `${target}s` : target.slice(0, -1)}`"
        when:
          - "target === target.toLowerCase() && copula.slice(1) === copula.slice(1).toLowerCase()"
          - "participle || ADJECTIVE_STEMS.has(stem)"
          - 'pluralCopula !== target.endsWith("s")'
          - "subject !== null && !ctx.dictionary.has(ctx.text.slice(start, end).toLowerCase())"
        return: 'finding("portugueseAgreement", "review_msg_pt_passive_number", start, end, [applyWordCase(fixed, detectWordCase(copula))], { context: { start, end } })'
  - id: pt_BR.personAgreement
    checks: [portugueseAgreement]
    style: match
    message: review_msg_pt_agreement
    maps:
      PERSON_OF_PRONOUN:
        { eu: 1s, tu: 2s, ele: 3s, ela: 3s, você: 3s, nós: 1p, eles: 3p, elas: 3p, vocês: 3p }
    sets:
      # Imperfects of crer, ler, ver and rir spelled like presents of criar, liar, viar, riar.
      OTHER_IMPERFECTS: [cria, crias, criam, lia, lias, liam, via, vias, viam, ria, rias, riam]
      KNOWN_SUBJECT_WORDS:
        [eu, e, tu, ele, ela, você, eles, elas, vocês, o, a, os, as, meu, minha, meus, minhas]
      # Heads that may agree with the plural after them: "A maioria dos alunos passaram".
      PERSON_COLLECTIVE:
        [
          maioria,
          minoria,
          parte,
          metade,
          grupo,
          porcentagem,
          percentagem,
          conjunto,
          série,
          totalidade,
          resto,
          número,
          quantidade,
          multidão,
          bando,
          dezena,
          centena,
          milhar,
          milhão,
          bilhão,
          trilhão,
        ]
    defs:
      # "e eu" belongs to WE_SUBJECT; "em nós", "estes nós" (knots), "mais do que eu" are no subject.
      NOT_PRONOUN_SUBJECT: '/(?:(?:^|[^\p{L}])(?:e|em|estes|estas|esses|essas|aqueles|aquelas|dos|pelos|seus|meus|nossos|vários|muitos)|(?:do|mais|menos|melhor|pior|maior|menor|tanto|tão)[ \t\u00a0]+que)[ \t\u00a0]+$/iu'
      PERSON_DETERMINER: "/^(?:o|a|os|as|meu|minha|meus|minhas)$/i"
      PERSON_PLURAL_LEAD: "/^(?:{{PLURAL_LEAD}})$/i"
      # Frames ignore case: a word that is no pronoun and follows no determiner is a name.
      namesCapitalized:
        args: "subject: string"
        let:
          words: 'subject.split(/[ \t\u00a0]+/)'
        return: 'words.every((word, i) => KNOWN_SUBJECT_WORDS.has(word.toLowerCase()) || PERSON_DETERMINER.test(words[i - 1] ?? "") || /^\p{Lu}/u.test(word))'
      # A regular verb in the person of its subject. One verb and tense only; "-o" after a third
      # person may be a noun ("ela trabalho").
      personFinding:
        args: "ctx: DetectContext, m: RegExpExecArray, subject: PtPerson"
        type: RawFinding | null
        let:
          typed: m.groups!.target
          found: ptVerbReadings(typed)
          first: found[0]
          wanted: ptInflect(first, subject)
          span: m.indices!.groups!.target
        when:
          - "!(typed !== typed.toLowerCase() || ctx.dictionary.has(typed) || PT_NOT_VERBS.has(typed) || OTHER_IMPERFECTS.has(typed))"
          - found.length > 0 && !found.some((a) => a.persons.has(subject))
          - "!found.some((a) => a.stem !== first.stem || a.tense !== first.tense)"
          - "!found.some((a) => a.conjugation !== first.conjugation)"
          - '!(/o$/.test(typed) && first.tense === "present" && subject !== "1p" && subject !== "2s")'
          - wanted !== typed
        return: 'finding("portugueseAgreement", "review_msg_pt_agreement", span[0], span[1], [applyWordCase(wanted, detectWordCase(typed))], { context: { start: m.index, end: span[1] } })'
    frames:
      # A pronoun subject and its verb: "Eu passeiam" -> "passeio", "Tu não falam" -> "falas".
      - regex: "(?<pronoun>eu|tu|ele|ela|você|nós|eles|elas|vocês){{S}}{{PERSON_ADVERBS}}{{PERSON_CLITIC}}(?<target>\\p{L}{2,}){{E}}(?!-)"
        let:
          before: "ctx.text.slice(Math.max(0, m.index - 24), m.index)"
          pronounEnd: "m.indices!.groups!.pronoun[1]"
          after: "ctx.text.slice(pronounEnd, pronounEnd + 8)"
        when:
          - "!(NOT_SUBJECT_BEFORE.test(before) || NOT_PRONOUN_SUBJECT.test(before))"
          - '!(/^\p{Lu}/u.test(pronoun) && !SENTENCE_START.test(before))'
          - '!/^[ \t\u00a0]+e(?![\p{L}])/u.test(after)'
        return: "personFinding(ctx, m, PERSON_OF_PRONOUN[pronoun.toLowerCase()] as PtPerson)"
      # A noun-phrase subject opening the sentence, with a prepositional phrase before its verb:
      # "As crianças da escola brinca" -> "brincam". Without one, the frames of
      # pt_BR.verbAgreement decide. In {{PHRASE}}, the phrase's noun is no infinitive ("de prosseguir") nor a
      # relative ("nas quais").
      - regex: "(?<lead>{{SINGULAR_LEAD}}|{{PLURAL_LEAD}}){{S}}(?<noun>\\p{L}{3,}){{PHRASE}}{{S}}{{PERSON_ADVERBS}}{{PERSON_CLITIC}}(?<target>\\p{L}{3,}){{E}}(?!-)"
        let:
          plural: "PERSON_PLURAL_LEAD.test(lead)"
          end: "m.indices!.groups!.target[1]"
          next: '/^[ \t\u00a0]+(\p{Ll}+)/u.exec(ctx.text.slice(end, end + 30))?.[1]'
        when:
          - "SENTENCE_START.test(ctx.text.slice(Math.max(0, m.index - 8), m.index))"
          - "lead.slice(1) === lead.slice(1).toLowerCase() && noun === noun.toLowerCase()"
          - "!(PERSON_COLLECTIVE.has(noun) || PT_NOT_VERBS.has(noun))"
          - "/s$/.test(noun) === plural"
          - "!(next && (PT_FORM_ROWS.has(next) || ptVerbReadings(next).length > 0))"
          - 'ptVerbReadings(target).every((a) => a.persons.has("3s") || a.persons.has("3p"))'
        return: 'personFinding(ctx, m, plural ? "3p" : "3s")'
      # "Eu e a Rita", "Tu e eu", "Ele e eu": a subject with "eu" in it is "nós".
      - regex: "(?<we>{{WITH_ME}}){{S}}{{PERSON_ADVERBS}}{{PERSON_CLITIC}}(?<target>\\p{L}{2,}){{E}}(?!-)"
        let:
          before: "ctx.text.slice(Math.max(0, m.index - 24), m.index)"
        when:
          - "!(NOT_SUBJECT_BEFORE.test(before) && !SENTENCE_START.test(before))"
          - "namesCapitalized(we)"
        return: 'personFinding(ctx, m, "1p")'
  - id: pt_BR.auxiliaryInfinitives
    checks: [portugueseAgreement]
    style: match
    message: review_msg_pt_auxiliary_infinitive
    maps:
      GERUND_ENDING: { ando: ar, endo: er, indo: ir }
    sets:
      # Words that end like a finite form but are none after an auxiliary.
      AUXILIARY_NOT_VERBS:
        [
          para,
          nada,
          cada,
          casa,
          toda,
          fora,
          pra,
          agora,
          parte,
          sorte,
          mente,
          corte,
          porte,
          forte,
          norte,
          peste,
          vale,
          sede,
        ]
    defs:
      # A finite form after an auxiliary: the infinitive of the -a, -e or -i form.
      auxiliaryInfinitive:
        args: "ctx: DetectContext, m: RegExpExecArray, target: string"
        let:
          fixed: "ptInfinitive(target)"
          span: "m.indices!.groups!.target"
        when:
          - "!(target.length < 4 || AUXILIARY_NOT_VERBS.has(target) || ctx.dictionary.has(target))"
          - "fixed !== null"
        return: 'finding("portugueseAgreement", "review_msg_pt_auxiliary_infinitive", span[0], span[1], [fixed], { context: { start: m.index, end: span[1] } })'
    frames:
      # "começou a escrevendo" -> "escrever": "começar a", "passar a", "voltar a" and "tornar a"
      # take the infinitive. "continuar a seguindo" stays out: there "a" may be the object
      # pronoun.
      - regex: "{{BEGINS}}{{S}}a{{S}}(?<target>\\p{L}+(?:ando|endo|indo)|pondo){{E}}(?!-)"
        let:
          lower: "target.toLowerCase()"
          fixed: 'lower === "pondo" ? "pôr" : `${lower.slice(0, -4)}${GERUND_ENDING[lower.slice(-4)]}`'
          span: "m.indices!.groups!.target"
        when:
          - "!ctx.dictionary.has(target.toLowerCase())"
        return: 'finding("portugueseAgreement", "review_msg_pt_auxiliary_infinitive", span[0], span[1], [fixed], { context: { start: m.index, end: span[1] } })'
      # "vão fazerem", "começaram a saberem" -> "fazer", "saber": the infinitive after an
      # auxiliary takes no person ending.
      - regex: "(?:{{AUXILIARY}}|{{MODAL}}|{{BEGINS}}{{S}}a|cheg(?:ou|aram|a|am|ava|avam){{S}}a){{S}}(?:(?:não|já|também|ainda|logo|sempre){{S}})?(?<target>\\p{L}{2,}[aeiô]r)em{{E}}"
        let:
          span: "m.indices!.groups!.target"
          typed: "ctx.text.slice(span[0], span[1] + 2)"
        when:
          - "!ctx.dictionary.has(typed.toLowerCase())"
        return: 'finding("portugueseAgreement", "review_msg_pt_auxiliary_infinitive", span[0], span[1] + 2, [target], { context: { start: m.index, end: span[1] + 2 } })'
      # The verb right after, maybe with a hyphenated pronoun: "vão lembra-se" -> "lembrar-se".
      - regex: "(?:{{AUXILIARY}}){{S}}(?:(?:não|já|também|ainda|logo|sempre){{S}})?(?<target>\\p{L}{2,}[aei])(?=-(?:me|te|se|nos|vos|lhes?){{E}}|{{E}})"
        return: auxiliaryInfinitive(ctx, m, target)
      # "quero come" -> "comer", "deve existe" -> "existir", "tentou abri" -> "abrir": modals
      # that take a noun too ("quero ajuda", "deve dinheiro") only count before an -e or -i
      # form, which is a verb of the second or third conjugation and seldom a noun.
      - regex: "(?:{{MODAL}}){{S}}(?:(?:não|já|também|ainda|logo|sempre){{S}})?(?<target>\\p{L}{2,}[ei])(?=-(?:me|te|se|nos|vos|lhes?){{E}}|{{E}})"
        return: auxiliaryInfinitive(ctx, m, target)
      # "comecei a escreve" -> "escrever": only -e and -i forms, as after the modals; "passa a
      # bola" has an article and a noun.
      - regex: "{{BEGINS}}{{S}}a{{S}}(?<target>\\p{L}{2,}[ei])(?=-(?:me|te|se|nos|vos|lhes?){{E}}|{{E}})"
        return: auxiliaryInfinitive(ctx, m, target)
  - id: pt_BR.verbFrames
    checks: [stylePhrasing]
    style: match
    message: review_msg_style_phrasing
    maps:
      # "fazer a seleção de" -> "selecionar": a noun that names the action of a regular verb, after
      # "fazer", "realizar" or "efetuar".
      ACTION_NOUNS:
        a seleção: selecionar
        a coleta: coletar
        a distribuição: distribuir
        a preparação: preparar
        a aplicação: aplicar
        a configuração: configurar
        a remoção: remover
        a inclusão: incluir
        a exclusão: excluir
        a alteração: alterar
        a modificação: modificar
        a identificação: identificar
        a classificação: classificar
        a elaboração: elaborar
        a execução: executar
        a programação: programar
        a negociação: negociar
        a reformulação: reformular
        a validação: validar
        a aprovação: aprovar
        a utilização: utilizar
        a marcação: marcar
        a digitação: digitar
        a conversão: converter
        a edição: editar
        a publicação: publicar
        a gravação: gravar
        a emissão: emitir
        a solicitação: solicitar
        a apuração: apurar
        a análise: analisar
        a avaliação: avaliar
        a verificação: verificar
        a correção: corrigir
        a instalação: instalar
        a organização: organizar
        a limpeza: limpar
        a entrega: entregar
        a divulgação: divulgar
        a contratação: contratar
        a criação: criar
        a atualização: atualizar
        a implementação: implementar
        a revisão: revisar
        a leitura: ler
        a descrição: descrever
        o planejamento: planejar
        o agendamento: agendar
        o orçamento: orçar
        o conserto: consertar
        o preenchimento: preencher
        o tratamento: tratar
        o armazenamento: armazenar
        o processamento: processar
        o desenvolvimento: desenvolver
        o mapeamento: mapear
        o lançamento: lançar
        o encerramento: encerrar
        o recebimento: receber
        o fornecimento: fornecer
        o treinamento: treinar
        o ajuste: ajustar
        o cálculo: calcular
        o cadastro: cadastrar
        o registro: registrar
        o envio: enviar
        o acompanhamento: acompanhar
        o monitoramento: monitorar
        o pagamento: pagar
      # "tornar possível o acesso" -> "possibilitar o acesso": "tornar" and an adjective that one verb
      # says (not after a reflexive "se").
      TORNAR:
        possível: possibilitar
        impossível: impossibilitar
        mais fácil: facilitar
        mais difícil: dificultar
        mais forte: fortalecer
        mais fraco: enfraquecer
        mais claro: esclarecer
        mais rápido: acelerar
    defs:
      ACTION_SLOTS: ptVerbSlots(["fazer", "realizar", "efetuar"])
      TORNAR_SLOTS: ptVerbSlots(["tornar"])
      # A verb with a noun or an adjective that one plain verb says, in the same tense: the slot of
      # the typed head verb, and the plain verb of the complement.
      verbFrame:
        args: "m: RegExpExecArray, ctx: DetectContext, slots: ReadonlyMap<string, number>, complements: Readonly<Record<string, string>>"
        let:
          head: m.groups!.head
          of: m.groups!.of as string | undefined
          span: m.indices!.groups!.target
          words: 'm.groups!.target.split(/[ \t\u00a0]+/)'
          slot: slots.get(head.toLowerCase())
          verb: 'complements[m.groups!.complement.toLowerCase().replace(/[ \t\u00a0]+/, " ")] as string | undefined'
          article: '!of || of.toLowerCase() === "de" ? "" : ` ${of.slice(1).toLowerCase()}`'
          plain: "`${ptConjugate(verb)[slot]}${article}`"
        when:
          # A capital after the first word is a name; a user word stays as typed.
          - "!words.some((word, i) => (i > 0 && word !== word.toLowerCase()) || ctx.dictionary.has(word.toLowerCase()))"
          - "slot !== undefined && !!verb"
        return: 'finding("stylePhrasing", "review_msg_style_phrasing", span[0], span[1], [/^\p{Lu}/u.test(head) ? plain[0].toUpperCase() + plain.slice(1) : plain])'
    frames:
      # "fez a análise do texto" -> "analisou o texto": a form of "fazer", "realizar" or
      # "efetuar" and a noun that names the action of a regular verb.
      - regex: "(?<target>(?<head>realizamos|realizaram|realizavam|realizaria|realizasse|realizando|realizava|realizará|realizado|efetuamos|efetuaram|efetuavam|efetuaria|efetuasse|efetuando|realizar|realizam|realizei|realizou|efetuava|efetuará|efetuado|fazemos|fizeram|fizesse|fazendo|realizo|realiza|realize|efetuar|efetuam|efetuei|efetuou|faziam|efetuo|efetua|efetue|fazer|fazem|fazia|faria|fizer|feito|faço|fará|faça|faz|fiz|fez){{S}}(?<complement>o{{S}}desenvolvimento|o{{S}}acompanhamento|a{{S}}identificação|a{{S}}classificação|a{{S}}implementação|o{{S}}preenchimento|o{{S}}armazenamento|o{{S}}processamento|o{{S}}monitoramento|a{{S}}distribuição|a{{S}}configuração|a{{S}}reformulação|o{{S}}planejamento|o{{S}}encerramento|o{{S}}fornecimento|a{{S}}modificação|a{{S}}programação|a{{S}}solicitação|a{{S}}verificação|a{{S}}organização|a{{S}}contratação|a{{S}}atualização|o{{S}}agendamento|o{{S}}recebimento|o{{S}}treinamento|a{{S}}preparação|a{{S}}elaboração|a{{S}}negociação|a{{S}}utilização|a{{S}}publicação|a{{S}}instalação|a{{S}}divulgação|o{{S}}tratamento|o{{S}}mapeamento|o{{S}}lançamento|a{{S}}aplicação|a{{S}}alteração|a{{S}}validação|a{{S}}aprovação|a{{S}}digitação|a{{S}}conversão|a{{S}}avaliação|a{{S}}descrição|o{{S}}orçamento|o{{S}}pagamento|a{{S}}inclusão|a{{S}}exclusão|a{{S}}execução|a{{S}}marcação|a{{S}}gravação|a{{S}}apuração|a{{S}}correção|o{{S}}conserto|o{{S}}cadastro|o{{S}}registro|a{{S}}seleção|a{{S}}remoção|a{{S}}emissão|a{{S}}análise|a{{S}}limpeza|a{{S}}entrega|a{{S}}criação|a{{S}}revisão|a{{S}}leitura|o{{S}}cálculo|a{{S}}coleta|a{{S}}edição|o{{S}}ajuste|o{{S}}envio){{S}}(?<of>de|d[oa]s?)){{E}}"
        return: "verbFrame(m, ctx, ACTION_SLOTS, ACTION_NOUNS)"
      # "torna possível o acesso" -> "possibilita o acesso"; "se torna possível" says "becomes".
      - regex: "(?<!(?:^|[^\\p{L}])se{{S}}|-se{{S}})(?<target>(?<head>tornamos|tornaram|tornavam|tornaria|tornasse|tornando|tornava|tornará|tornado|tornar|tornam|tornei|tornou|torno|torna|torne){{S}}(?<complement>mais{{S}}difícil|mais{{S}}rápido|impossível|mais{{S}}fácil|mais{{S}}forte|mais{{S}}fraco|mais{{S}}claro|possível)(?={{S}}(?:que|[oa]s?|um|uma|essa?|este|esta|isso|isto|tudo|\\p{L}+[çs]ão){{E}})){{E}}"
        return: "verbFrame(m, ctx, TORNAR_SLOTS, TORNAR)"
  - id: pt_BR.formalVerbs
    checks: [stylePhrasing]
    style: match
    message: review_msg_style_phrasing
    maps:
      ARTICLE_AFTER: { o: " o", a: " a", os: " os", as: " as" }
      GOOD: { bom: "", boa: "", bons: s, boas: s }
    defs:
      ACHAR_SLOTS: ptVerbSlots(["achar"])
      BAIXAR_SLOTS: ptVerbSlots(["baixar"])
      PASSAR_SLOTS: ptVerbSlots(["passar"])
      PEGAR_SLOTS: ptVerbSlots(["pegar"])
      ARRUMAR_SLOTS: ptVerbSlots(["arrumar"])
      FAZER_SLOTS: ptVerbSlots(["fazer"])
      DEIXAR_SLOTS: ptVerbSlots(["deixar"])
      PEDIR_SLOTS: ptVerbSlots(["pedir"])
      CHATEAR_SLOTS: ptVerbSlots(["chatear"])
      ATURAR_SLOTS: ptVerbSlots(["aturar"])
      JOGAR_SLOTS: ptVerbSlots(["jogar"])
      FALAR_SLOTS: ptVerbSlots(["falar"])
      MEXER_SLOTS: ptVerbSlots(["mexer"])
      # A finding unless a typed word is a user word; a capital carries onto the fixes.
      formalFinding:
        args: "ctx: DetectContext, m: RegExpExecArray, alternatives: string[]"
        let:
          span: m.indices!.groups!.target
          typed: m.groups!.target
          cased: '/^\p{Lu}/u.test(typed) ? alternatives.map((alt) => alt[0].toUpperCase() + alt.slice(1)) : alternatives'
        when: '!typed.split(/[ \t\u00a0]+/).some((word) => ctx.dictionary.has(word.toLowerCase()))'
        return: 'finding("stylePhrasing", "review_msg_style_phrasing", span[0], span[1], cased, { ...(cased.length > 1 ? { requiresChoice: true as const } : {}) })'
      # The formal verb in the tense and person of the typed one (`head`); `of` is the preposition
      # the formal verb also replaces. `statement`: statements only ("Você acha que…?" asks for the
      # reader's view in any register).
      formalSwap:
        args: "m: RegExpExecArray, ctx: DetectContext, slots: ReadonlyMap<string, number>, formal: string[], statement: boolean"
        let:
          head: m.groups!.head
          of: m.groups!.of as string | undefined
          slot: slots.get(head.toLowerCase())
          article: 'of ? (ARTICLE_AFTER[of.toLowerCase().replace(/^(?:d|n|sobre\s+)/, "")] ?? "") : ""'
        when:
          # A capital after the first word is a name.
          - 'head === head.toLowerCase() || /^\p{Lu}\p{Ll}*$/u.test(head)'
          - slot !== undefined
          - '!(statement && /^[^.!?\n]*\?/.test(ctx.text.slice(m.index, m.index + 200)))'
        return: 'formalFinding(ctx, m, formal.map((verb) => [ptConjugate(verb.split(" ")[0])[slot], ...verb.split(" ").slice(1)].join(" ") + article))'
    frames:
      # A verb form after a determiner is a noun ({{NOT_AFTER}}): "a bota", "a fala", "o passo".
      # Each swap names the complement that selects its sense in a lookahead.
      # "Acho que" gives an opinion; formal prose considers or judges.
      - regex: "(?<target>{{NOT_AFTER}}(?<head>achamos|acharam|achavam|acharia|achasse|achando|achava|achará|achado|achar|acham|achei|achou|acho|acha|ache))(?={{S}}que{{E}})"
        return: 'formalSwap(m, ctx, ACHAR_SLOTS, ["considerar", "julgar", "pensar"], true)'
      # "baixar o preço" -> "reduzir", but "baixar o arquivo" stays.
      - regex: "(?<target>{{NOT_AFTER}}(?<head>baixamos|baixaram|baixavam|baixaria|baixasse|baixando|baixava|baixará|baixado|baixar|baixam|baixei|baixou|baixo|baixa|baixe))(?={{S}}{{DET}}{{SOME}}(?:preços?|custos?|doses?|dosagens?|dosagem|nível|níveis|taxas?|juros|impostos?|gastos|despesas|consumo|velocidade|temperatura|tarifas?|salários?){{E}})"
        return: 'formalSwap(m, ctx, BAIXAR_SLOTS, ["reduzir"], false)'
      - regex: "(?<target>{{NOT_AFTER}}(?<head>passamos|passaram|passavam|passaria|passasse|passando|passava|passará|passado|passar|passam|passei|passou|passo|passa|passe))(?={{S}}{{DET}}{{SOME}}(?:dificuldades|necessidades|privações|apuros|apertos?){{E}})"
        return: 'formalSwap(m, ctx, PASSAR_SLOTS, ["passar por", "enfrentar"], false)'
      # "pegar os dados" -> "obter".
      - regex: "(?<target>{{NOT_AFTER}}(?<head>pegamos|pegaram|pegavam|pegaria|pegasse|pegando|peguei|pegava|pegará|pegado|pegar|pegam|pegou|pegue|pego|pega))(?={{S}}{{DET}}{{SOME}}(?:dados|informaç(?:ão|ões)|resultados|documentos|certidão|certidões|autorizaç(?:ão|ões)){{E}})"
        return: 'formalSwap(m, ctx, PEGAR_SLOTS, ["obter"], false)'
      # "pegar uma gripe" -> "contrair".
      - regex: "(?<target>{{NOT_AFTER}}(?<head>pegamos|pegaram|pegavam|pegaria|pegasse|pegando|peguei|pegava|pegará|pegado|pegar|pegam|pegou|pegue|pego|pega))(?={{S}}{{DET}}{{SOME}}(?:gripes?|doenças?|vírus|infecç(?:ão|ões)|resfriados?|covid|dengue|sarampo){{E}})"
        return: 'formalSwap(m, ctx, PEGAR_SLOTS, ["contrair"], false)'
      - regex: "(?<target>{{NOT_AFTER}}(?<head>pegamos|pegaram|pegavam|pegaria|pegasse|pegando|peguei|pegava|pegará|pegado|pegar|pegam|pegou|pegue|pego|pega))(?={{S}}{{DET}}{{SOME}}(?:ônibus|metrô|trem|trens|aviões|avião|táxis?|voos?|barcos?){{E}})"
        return: 'formalSwap(m, ctx, PEGAR_SLOTS, ["tomar"], false)'
      - regex: "(?<target>{{NOT_AFTER}}(?<head>arrumamos|arrumaram|arrumavam|arrumaria|arrumasse|arrumando|arrumava|arrumará|arrumado|arrumar|arrumam|arrumei|arrumou|arrumo|arruma|arrume))(?={{S}}{{DET}}{{SOME}}(?:empregos?|trabalhos?|vagas?|estágios?){{E}})"
        return: 'formalSwap(m, ctx, ARRUMAR_SLOTS, ["conseguir"], false)'
      - regex: "(?<target>{{NOT_AFTER}}(?<head>fazemos|fizeram|fizesse|fazendo|faziam|fazer|fazem|fazia|faria|fizer|feito|faço|fará|faça|faz|fiz|fez))(?={{S}}{{DET}}{{SOME}}(?:planos?|relatórios?|orçamentos?|projetos?|cronogramas?|pareceres|parecer){{E}})"
        return: 'formalSwap(m, ctx, FAZER_SLOTS, ["elaborar"], false)'
      # "não deixe que ele saia": letting is permitting.
      - regex: "(?<target>{{NOT_AFTER}}(?<head>deixamos|deixaram|deixavam|deixaria|deixasse|deixando|deixava|deixará|deixado|deixar|deixam|deixei|deixou|deixo|deixa|deixe))(?={{S}}que{{E}})"
        return: 'formalSwap(m, ctx, DEIXAR_SLOTS, ["permitir"], false)'
      - regex: "(?<target>{{NOT_AFTER}}(?<head>pedimos|pediram|pediria|pedisse|pedindo|pediam|pedirá|pedido|pedir|pedem|pediu|pedia|peço|pede|pedi|peça))(?={{S}}{{DET}}{{SOME}}(?:informaç(?:ão|ões)|documentos?|autorizaç(?:ão|ões)|permissão|esclarecimentos?|orçamentos?|reembolsos?|licença|apoio){{E}})"
        return: 'formalSwap(m, ctx, PEDIR_SLOTS, ["solicitar"], false)'
      - regex: "(?<target>{{NOT_AFTER}}(?<head>chateamos|chatearam|chateavam|chatearia|chateasse|chateando|chateiam|chateava|chateará|chateado|chatear|chateio|chateia|chateei|chateou|chateie))(?=(?:{{S}}(?:(?:mais|tanto){{S}})?(?:[oa]s?|me|te|nos|lhe|lhes|ninguém|você|vocês|seus?|suas?){{E}}|-(?:me|te|nos|lhe|lhes|o|a|os|as){{E}}))"
        return: 'formalSwap(m, ctx, CHATEAR_SLOTS, ["incomodar", "importunar"], false)'
      - regex: "(?<target>{{NOT_AFTER}}(?<head>aturamos|aturaram|aturavam|aturaria|aturasse|aturando|aturava|aturará|aturado|aturar|aturam|aturei|aturou|aturo|atura|ature))(?=(?:{{S}}\\p{L}|-(?:me|te|nos|o|a|os|as){{E}}))"
        return: 'formalSwap(m, ctx, ATURAR_SLOTS, ["suportar", "tolerar"], false)'
      # "jogar fora" -> "descartar".
      - regex: "(?<target>{{NOT_AFTER}}(?<head>jogamos|jogaram|jogavam|jogaria|jogasse|jogando|joguei|jogava|jogará|jogado|jogar|jogam|jogou|jogue|jogo|joga){{S}}fora)(?={{E}})"
        return: 'formalSwap(m, ctx, JOGAR_SLOTS, ["descartar"], false)'
      # "fala das questões" -> "aborda as questões".
      - regex: "(?<target>{{NOT_AFTER}}(?<head>falamos|falaram|falavam|falaria|falasse|falando|falava|falará|falado|falar|falam|falei|falou|falo|fala|fale){{S}}{{PREPOSITION}})(?={{S}}(?:{{SOME}}|(?:outr[oa]s?|vári[oa]s|tod[oa]s|ess[ea]s?|est[ea]s?){{S}})?(?:temas?|assuntos?|questão|questões|problemas?|tópicos?){{E}})"
        return: 'formalSwap(m, ctx, FALAR_SLOTS, ["abordar"], false)'
      - regex: "(?<target>{{NOT_AFTER}}(?<head>mexemos|mexeram|mexeria|mexesse|mexendo|mexiam|mexerá|mexido|mexer|mexem|mexeu|mexia|mexo|mexe|mexi|mexa){{S}}{{PREPOSITION}})(?={{S}}(?:códigos?|arquivos?|configuraç(?:ão|ões)|sistemas?|documentos?|textos?|contratos?|planilhas?){{E}})"
        return: 'formalSwap(m, ctx, MEXER_SLOTS, ["alterar"], false)'
      # "sob o ponto de vista" mixes "sob o prisma" and "do ponto de vista".
      - regex: "(?<target>sob{{S}}o){{S}}(?=ponto{{S}}de{{S}}vista{{E}})"
        return: 'formalFinding(ctx, m, ["do"])'
      # "é suposto que" copies "it is supposed that".
      - regex: "(?<target>é{{S}}suposto){{S}}(?=que{{E}})"
        return: 'formalFinding(ctx, m, ["supõe-se"])'
      # "segundo combinado" -> "conforme combinado": "segundo" takes a noun phrase.
      - regex: "{{NOT_AFTER}}(?<target>segundo){{S}}(?=(?:combinad|acordad|previst|solicitad|informad|estabelecid|planejad|programad|anunciad)[oa]s?{{E}})"
        return: 'formalFinding(ctx, m, ["conforme"])'
      - regex: "(?<target>(?:à|em){{S}}volta){{S}}(?=d[eoa]s?{{E}})"
        return: 'formalFinding(ctx, m, ["em torno"])'
      # "uma boa questão" -> "uma questão pertinente"; "a questão é boa" -> "pertinente".
      - regex: "(?<=(?:um|uma|uns|umas|que|muito|muita|muitos|muitas|tão){{S}})(?<target>(?<good>boa|bom|boas|bons){{S}}(?<noun>{{POINT}})){{E}}"
        let:
          plural: "GOOD[good.toLowerCase()]"
        return: "formalFinding(ctx, m, [`${noun} pertinente${plural}`, `${noun} relevante${plural}`])"
      - regex: "(?:{{POINT}}){{S}}(?:(?:é|são|foi|foram|era|eram|me{{S}}parece|parece|parecem){{S}})?(?:(?:muito|bem|bastante|realmente){{S}})?(?<target>boa|bom|boas|bons)(?=[ \\t\\u00a0]*[.,;!?]|$)"
        let:
          plural: "GOOD[target.toLowerCase()]"
        return: "formalFinding(ctx, m, [`pertinente${plural}`, `relevante${plural}`])"
  - id: pt_BR.sentenceStartNumbers
    checks: [styleSpelledNumbers]
    style: match
    message: review_msg_spelled_numbers
    defs:
      UNITS: '"zero um dois três quatro cinco seis sete oito nove dez onze doze treze catorze quinze dezesseis dezessete dezoito dezenove".split(" ")'
      TENS: '",,vinte,trinta,quarenta,cinquenta,sessenta,setenta,oitenta,noventa".split(",")'
      HUNDREDS: '",cento,duzentos,trezentos,quatrocentos,quinhentos,seiscentos,setecentos,oitocentos,novecentos".split(",")'
      # Months and abbreviations that follow a day or a page number.
      DAY_NOUNS: /^(?:janeiro|fevereiro|março|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro|jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez|pag|pág|págs|pags)$/
      # 1 to 999 in words, masculine: 21 -> "vinte e um", 100 -> "cem", 305 -> "trezentos e cinco".
      numberWords:
        args: "n: number"
        return: >-
          n === 100
            ? "cem"
            : [
                HUNDREDS[Math.floor(n / 100)],
                ...(n % 100 < 20
                  ? [n % 100 ? UNITS[n % 100] : ""]
                  : [TENS[Math.floor((n % 100) / 10)], n % 10 ? UNITS[n % 10] : ""]),
              ]
                .filter(Boolean)
                .join(" e ")
    frames:
      # A figure that opens a sentence, before a lowercase word: "12 pessoas chegaram." A line
      # with no full stop is a list item or a recipe line ("2 xícaras de farinha"), not a
      # sentence; one with another figure is a date, an address or a measure ("29 fevereiro
      # 2000.").
      - regex: "(?=[1-9])(?<=(?:^|[.!?]{{S}}|\\n[ \\t\\u00a0]{0,8}))(?<target>[1-9]\\d{0,2})(?={{S}}(?<noun>\\p{L}{3,}){{E}}(?<rest>[^\\n.!?]*)[.!?])"
        let:
          masculine: "numberWords(Number(target))"
          female: 'masculine.replace(/\bum$/, "uma").replace(/\bdois$/, "duas").replace(/entos\b/g, "entas")'
          forms: "female === masculine || /(?:o|os|or|ores)$|^dias?$/.test(noun) ? [masculine] : /(?:[^m]as?|ção|ções|dade|dades|gem|gens)$/.test(noun) ? [female] : [masculine, female]"
          span: "m.indices!.groups!.target"
        when:
          - 'noun === noun.toLowerCase() && !DAY_NOUNS.test(noun) && !/\d/.test(rest)'
        return: 'finding("styleSpelledNumbers", "review_msg_spelled_numbers", span[0], span[1], forms.map((form) => form[0].toUpperCase() + form.slice(1)), forms.length > 1 ? { requiresChoice: true } : undefined)'
  - id: pt_BR.markSpacing
    checks: [commaPeriodSpacing]
    style: match
    message: review_msg_space_before_mark
    frames:
      # After a lowercase word: a capitalized title ("History of the Caribbean : a study") may
      # follow the library convention of a spaced colon.
      - regex: "(?<=(?<![\\p{L}])\\p{Ll}\\p{L}*)(?<target>[ \\u00A0]+[:;])(?=[ \\t\\u00A0\\n]|$)"
        flags: dgu
        let:
          span: "m.indices!.groups!.target"
        return: 'finding("commaPeriodSpacing", "review_msg_space_before_mark", span[0], span[1], [ctx.source[span[1] - 1]])'
      - regex: "(?<=\\p{L})(?<target>\\.{3}|\\u2026)(?=\\p{Ll}{2})"
        flags: dgu
        let:
          span: "m.indices!.groups!.target"
        return: 'finding("commaPeriodSpacing", "review_msg_space_after_mark", span[0], span[1], [`${target} `])'
      # After a word of 4 letters or more: "e o …", "do …" mark an omission.
      - regex: "(?<=\\p{L}{4})(?<target>[ \\u00A0]+\\u2026)(?=[ \\t\\u00A0]*(?:\\n|$|[\"\\u201D\\u00BB)]))"
        flags: dgu
        let:
          span: "m.indices!.groups!.target"
          line: 'ctx.text.slice(ctx.text.lastIndexOf("\n", span[0]) + 1, span[0])'
        when:
          - '!/^[ \t\u00a0]*(?:…|\.{3}|\[…\])/u.test(line)'
        return: 'finding("commaPeriodSpacing", "review_msg_space_before_mark", span[0], span[1], ["…"])'
  - id: pt_BR.unitSpacing
    checks: [measurementUnitFormatting]
    style: match
    message: review_msg_measurement_spacing
    frames:
      - regex: "(?<![\\p{L}\\p{N}.,])(?<target>(?<number>\\d+(?:[.,]\\d+)*)(?<unit>kB|KB|MB|GB|TB|kbps|Mbps|Gbps|MWh|GWh))(?![\\p{L}\\p{N}])"
        flags: dgu
        let:
          span: "m.indices!.groups!.target"
          separator: 'resolveMeasurementLocale(ctx.lang)?.separator ?? " "'
        when:
          - "!ctx.dictionary.has(target.toLowerCase())"
        return: 'finding("measurementUnitFormatting", "review_msg_measurement_spacing", span[0], span[1], [`${number}${separator}${unit}`])'

