  PLURAL_DETERMINER: "mais|muitos|muitas|vários|várias|alguns|algumas|poucos|poucas|diversos|diversas|inúmeros|inúmeras|tantos|tantas|uns|umas|os|as|dois|duas|três|quatro|cinco|seis|sete|oito|nove|dez|vinte|cem|[2-9]|\\d{2,}"
  TIME: "vezes|anos|meses|semanas|dias|horas|minutos|segundos|tempos|décadas|séculos|instantes|momentos"
  SUBJECT_AFTER: "{{AGREE_ADVERB}}(?:{{PLURAL_DETERMINER}}){{E}}{{S}}(?!(?:{{TIME}}|mais|menos|de|do|da){{E}})\\p{L}{3,}s{{E}}"
  BETWEEN: "(?:(?:ainda|já|também|sempre|nunca{{S}}mais|nunca|talvez){{S}})?"
  INFINITIVES: "existir|acontecer|ocorrer|surgir|restar|bastar|sobrar|faltar|chegar"
  PARTICIPLES: "existido|acontecido|ocorrido|surgido|restado|bastado|sobrado|faltado|chegado|existindo|acontecendo|ocorrendo|surgindo|restando|sobrando|faltando|chegando"
  IRREGULAR_FORMS: "sou|é|somos|são|fui|foi|fomos|foram|era|éramos|eram|serei|será|seremos|serão|estou|está|estamos|estão|estive|esteve|estivemos|estiveram|estava|estávamos|estavam|vou|vai|vamos|vão|ia|íamos|iam|tenho|tem|temos|têm|tive|teve|tivemos|tiveram|tinha|tínhamos|tinham|faço|faz|fazemos|fazem|fiz|fez|fizemos|fizeram|fazia|fazíamos|faziam|posso|pode|podemos|podem|pude|pôde|pudemos|puderam|podia|podíamos|podiam|quero|quer|queremos|querem|quis|quisemos|quiseram|queria|queríamos|queriam|sei|sabe|sabemos|sabem|soube|soubemos|souberam|sabia|sabíamos|sabiam|dou|dá|damos|dão|dei|deu|demos|deram|dava|dávamos|davam|digo|diz|dizemos|dizem|disse|dissemos|disseram|dizia|dizíamos|diziam"
  FUTURE_INFINITIVE: "(?<target>(?<verb>dizer|fazer|refazer|desfazer|ver|rever|prever|ter|manter|conter|obter|deter|reter|pôr|propor|compor|supor|ser|ir|dar|estar|poder|saber|querer|trazer|caber)(?<person>es|mos|em)?)"
  FUTURE_CONJUNCTION: "(?:quando|se|enquanto|assim{{S}}que|logo{{S}}que|sempre{{S}}que|depois{{S}}que|caso|conforme)"
  FUTURE_SUBJECT: "(?:eu|tu|ele|ela|você|nós|eles|elas|vocês|a{{S}}gente|(?:o|a|os|as){{S}}\\p{L}+)"
  FEMININE_ADJECTIVES: "boa|linda|bonita|engraçada|perfeita|errada|certa|chata|estranha|esquisita|complicada|ótima|péssima|maravilhosa|necessária|obrigatória|verdadeira|falsa|ridícula|absurda|perigosa|gostosa|divertida|cansativa|curiosa|justa|injusta|correta|incorreta|clara|óbvia|rara|barata|fantástica|horrorosa|nojenta"
  VERB_PLURAL_LEAD: "os|as|uns|umas|estes|estas|esses|essas|aqueles|aquelas|meus|minhas|teus|tuas|seus|suas|nossos|nossas|alguns|algumas|muitos|muitas|vários|várias"
  VERB_SINGULAR_LEAD: "o|a|um|uma|este|esta|esse|essa|aquele|aquela|meu|minha|teu|tua|seu|sua|nosso|nossa"
  POSSESSIVE: "meus|minhas|teus|tuas|seus|suas|nossos|nossas|meu|minha|teu|tua|seu|sua|nosso|nossa"
  VERB_ADVERBS: "(?:(?:não|já|ainda|também|sempre|nunca|só|quase){{S}}){0,2}"
  VERB_CLITIC: "(?:(?:se|me|te|lhe|lhes|nos){{S}})?"
  HOUR: "(?:as{{S}})?(?:duas|três|quatro|cinco|seis|sete|oito|nove|dez|onze|doze|0?[2-9]|1\\d|2[0-3])(?:(?:{{S}})?(?:h|hs|horas){{E}}|:[0-5]\\d(?!\\d)|{{S}}d[ae]{{S}}(?:manhã|tarde|noite|madrugada){{E}})"
  PERIOD: "(?:semana|mês|ano)"
  PAST_TIME: "(?:(?:antes{{S}}de{{S}})?ontem|anteontem|n[ao]{{S}}{{PERIOD}}{{S}}passad[oa]|n[ao]{{S}}passad[oa]{{S}}{{PERIOD}})"
  BARE_PAST_TIME: "[ao]{{S}}(?:{{PERIOD}}{{S}}passad[oa]|passad[oa]{{S}}{{PERIOD}}),"
  FUTURE_TIME: "(?:(?:depois{{S}}de{{S}})?amanhã|n[ao]{{S}}próxim[oa]{{S}}{{PERIOD}}|n[ao]{{S}}{{PERIOD}}{{S}}que{{S}}vem)"
  TIME_SUBJECT: "(?:(?:os|as|o|a){{S}}(?!(?:que|qua[il]s?){{E}})\\p{L}+{{S}}|(?:eles|elas|ele|ela|tu|vós|nós|vocês|você){{S}})?"
  FUTURE_FORM: "\\p{L}{2,}(?:ar|er|ir)(?:ão|ás|á|ei|emos|eis)"
  PAST_FORM: "\\p{L}{2,}(?:aram|eram|iram|aras|eras|iras|ara|era|ira|áreis|êreis|íreis)"
  DETERMINER_LEAD: "o|a|os|as|um|uma|uns|umas|do|da|dos|das|no|na|nos|nas|pelo|pela|pelos|pelas|ao|aos|num|numa|nuns|numas|dum|duma|duns|dumas|este|esta|estes|estas|esse|essa|esses|essas|aquele|aquela|aqueles|aquelas|deste|desta|destes|destas|desse|dessa|desses|dessas|daquele|daquela|daqueles|daquelas|neste|nesta|nestes|nestas|nesse|nessa|nesses|nessas|naquele|naquela|naqueles|naquelas|meu|minha|meus|minhas|teu|tua|teus|tuas|seu|sua|seus|suas|nosso|nossa|nossos|nossas|vosso|vossa|vossos|vossas|algum|alguma|alguns|algumas|nenhum|nenhuma|nenhuns|nenhumas|outro|outra|outros|outras|todo|toda|todos|todas|muita|muitos|muitas|pouca|poucos|poucas|vários|várias|diversos|diversas|tantos|tantas|certos|certas|cujo|cuja|cujos|cujas"
  PRENOMINAL: "grandes?|enormes?|fortes?|breves?|leves?|tristes?|simples|principa(?:l|is)|excelentes?|importantes?|recentes?|\\p{L}{3,}(?:vel|veis)"

# The code of the rules' expressions (`let`, `when`, `return`): the helpers rules of several
# modules read.
defs:
  # Text before a sentence or clause start: punctuation, closing marks, an opening quote.
  SENTENCE_START: '/(?:^|[.!?;:\n]["''”’»)]*)[ \t\u00a0]*["''“‘«(]?[ \t\u00a0]*$/u'

  # A preposition makes the pronoun no subject ("para eles foi difícil", "a todos eles"); "e",
  # "ou" or a comma can join it to another subject ("eu e ela vamos"); after a copula it is the
  # predicate ("ser eu"); after an article it is a noun ("os nós", "o verdadeiro eu").
  NOT_SUBJECT_BEFORE: '/(?<![\p{L}])(?:(?:para|com|de|dentre|sem|entre|a|por|contra|até|sobre|perante|desde|após)(?:[ \t\u00a0]+(?:todos|todas|ambos|ambas))?|e|ou|nem|como|quanto|ser|sou|é|era|foi|o|a|os|as|um|uma|uns|umas|dos|das|nos|nas|aos|pelos|pelas|meu|seu|teu|nosso|verdadeiro|próprio)[ \t\u00a0]+$|,[ \t\u00a0]*$/iu'
rules:
  - id: pt_BR.accentParonyms
    checks: [portugueseAccentParonyms]
    style: match
    message: review_msg_pt_accent_paronym
    sets:
      # Time words open a sentence as an adverb: "Sábado continuo", "Este ano pratico mais".
      TIME_NOUNS:
        [
          ano,
          anos,
          mês,
          meses,
          dia,
          dias,
          semana,
          semanas,
          sábado,
          domingo,
          verão,
          inverno,
          outono,
          semestre,
          trimestre,
          momento,
          tempo,
          período,
          fim,
          resto,
          turno,
          amanhã,
          hoje,
          ontem,
          agora,
          depois,
          cedo,
          tarde,
          logo,
        ]
    defs:
      # The verb ending of each subject pronoun.
      PERSON_ENDING: >-
        wordTable<RegExp>({ eu: /o$/, tu: /[ae]s$/, ele: /[ae]$/, ela: /[ae]$/, você: /[ae]$/ })
      # "Um critica, o outro elogia": indefinite "um/uma" as a pronoun with "outro" later on.
      RECIPROCAL: '/^[^.!?;\n]{0,80}(?<![\p{L}])outr[oa]s?(?![\p{L}])/iu'
      # "dei a ela prática": a pronoun after a preposition is no subject.
      PARONYM_PREPOSITION_BEFORE: '/(?:^|[^\p{L}])(?:a|à|ante|até|com|contra|de|desde|em|entre|para|perante|por|sem|sob|sobre|após|como|que nem)[ \t\u00a0]+$/iu'
      # A word after it, not "de": "Ele médico, ela enfermeira" and "eu, cópia de" stay out.
      PT_OBJECT_AFTER: '/^[ \t\u00a0]+(?!(?:de|da|do|das|dos)(?![\p{L}]))[\p{L}\d"“«]/u'
      # A gerund, an infinitive or "a" + infinitive after it: the verb reading ("o resto continuo
      # amanhã a fazer", "o livro continuo lendo").
      PARONYM_VERB_AFTER: '/^[ \t\u00a0]+(?:(?:a[ \t\u00a0]+)?\p{Ll}+(?:ndo|[aei]r)|amanhã|depois|hoje|agora|logo|mais[ \t\u00a0]+tarde|sempre|ainda)(?![\p{L}])/u'
      # "da diferencia" -> "diferença": a Spanish-looking "-ncia" that Portuguese has only as a form
      # of the "-nciar" verb; the noun ends in "-nça".
      NCA_NOUN: "/(?:diferen|licen|senten|presen|finan|esperan|cren|aven|perten|parecen|queren)cias?$/"
      # The verb twin of an accented noun, unless the typed word is a user word.
      verbFinding:
        args: 'ctx: DetectContext, start: number, end: number, typed: string, context: RawFinding["context"]'
        type: RawFinding | null
        let:
          verb: ptVerbTwin(typed.toLowerCase())
        when: verb !== undefined && !ctx.dictionary.has(typed.toLowerCase())
        return: 'finding("portugueseAccentParonyms", "review_msg_pt_accent_verb", start, end, [applyWordCase(verb, detectWordCase(typed))], { context })'
      # The accented twin of the word after a lead that announces a noun or an adjective.
      afterLead:
        args: "m: RegExpExecArray, ctx: DetectContext"
        type: RawFinding | null
        let:
          typed: m.groups!.target
          alternatives: 'ptAccentedTwins(typed) ?? (NCA_NOUN.test(typed) ? [typed.replace(/cia(s?)$/, "ça$1")] : undefined)'
          span: m.indices!.groups!.target
        when:
          - alternatives !== undefined && !ctx.dictionary.has(typed)
          - "!gluedAfter(ctx.text, span[1])"
          - "!(/^um/i.test(m.groups!.lead) && RECIPROCAL.test(ctx.text.slice(span[1], span[1] + 96)))"
        return: 'finding("portugueseAccentParonyms", "review_msg_pt_accent_paronym", span[0], span[1], alternatives, { context: { start: m.index, end: span[1] }, ...(alternatives.length > 1 ? { requiresChoice: true as const } : {}) })'
    filter:
      let:
        starts: "new Set<number>()"
      return: "findings.filter((f) => !starts.has(f.range.start) && !!starts.add(f.range.start))"
    frames:
      # "Ele influência quem", "Você cópia os dados": after a singular subject pronoun, with a
      # verb ending of that person and more words after it, the accented noun twin stands for
      # its verb form.
      - regex: "(?<lead>eu|tu|ele|ela|você)(?:{{S}}(?:não|já|também|sempre|nunca|ainda|só|me|te|se|lhe|lhes|nos|vos))?{{S}}(?<target>\\p{L}*[áâéêíóôú]\\p{L}*){{E}}"
        message: review_msg_pt_accent_verb
        let:
          span: "m.indices!.groups!.target"
        when:
          - "PERSON_ENDING[lead.toLowerCase()].test(ptPlainVowels(target))"
          - "!PARONYM_PREPOSITION_BEFORE.test(ctx.text.slice(Math.max(0, m.index - 12), m.index))"
          - "PT_OBJECT_AFTER.test(ctx.text.slice(span[1], span[1] + 12))"
        return: "verbFinding(ctx, span[0], span[1], target, { start: m.index, end: span[1] })"
      # "Prática-se muito": the same before a hyphenated object pronoun.
      - regex: "(?<target>\\p{L}*[áâéêíóôúÁÂÉÊÍÓÔÚ]\\p{L}*)(?=-(?:me|te|se|lhe|lhes|nos|vos){{E}})"
        message: review_msg_pt_accent_verb
        let:
          span: "m.indices!.groups!.target"
        return: "verbFinding(ctx, span[0], span[1], target, { start: span[0], end: span[1] + 4 })"
      # "O serviço continuo" -> "contínuo", "Aulas praticas" -> "práticas": after a noun or
      # adjective opening a sentence, a first-person or second-person form is the accented twin.
      - regex: "(?<det>(?:[oa]s?|um|uma|uns|umas|est[ea]s?|ess[ea]s?|aquel[ea]s?|meus?|minhas?|seus?|suas?|nossos?|nossas?){{S}})?(?<noun>\\p{L}{3,}){{S}}(?<target>[a-zçãõáéíóúâêô]{3,}(?:o|as|es)){{E}}(?!-)"
        let:
          before: "ctx.text.slice(Math.max(0, m.index - 12), m.index)"
          lower: "noun.toLowerCase()"
          info: "TIME_NOUNS.has(lower) ? null : ptNoun(lower)"
          twins: "ptAccentedTwins(target)"
          span: "m.indices!.groups!.target"
          fits: "twins.filter((twin) => /o$/.test(twin) ? info.feminine === false && !info.plural : /as$/.test(twin) ? info.feminine !== false && info.plural : info.plural)"
        when:
          - "SENTENCE_START.test(before) && !ctx.dictionary.has(target)"
          - "target === target.toLowerCase() && noun.slice(1) === lower.slice(1)"
          - "info !== null && twins !== undefined"
          - "!(gluedAfter(ctx.text, span[1]) || PARONYM_VERB_AFTER.test(ctx.text.slice(span[1], span[1] + 32)))"
          - "fits.length === 1"
        return: 'finding("portugueseAccentParonyms", "review_msg_pt_accent_paronym", span[0], span[1], fits, { context: { start: m.index, end: span[1] } })'
      # {{DETERMINERS}}: contracted articles, indefinites, quantifiers and possessives, never
      # before a finite verb. {{PREPOSITIONS}}: prepositions, optionally with an article: "com a
      # pratica", "para o publico". "nos" is also the pronoun "us" before a verb ("ele nos
      # critica"); "no" only follows hyphenated.
      - regex: "(?<lead>(?!nos{{E}})(?:{{DETERMINERS}})|{{PREPOSITIONS}})(?={{S}}(?<target>[a-zçãõáéíóúâêô]+){{E}})"
        return: "afterLead(m, ctx)"
      # {{ADJECTIVES}}: adjectives that come before a noun and seldom stand for a person on
      # their own, so after an article they still announce a noun: "um forte estimulo", "a
      # principal evidencia", "da terceira vitima". "novo", "velho", "pequeno" or "melhor" stay
      # out: "o velho critica tudo". The same leads, or an article, before one of those
      # adjectives; "tão" before an adjective. "por último" is an adverb ("por último publica os
      # dados").
      - regex: "(?<lead>(?!por{{S}}últim)(?:(?!nos{{E}})(?:{{DETERMINERS}})|{{PREPOSITIONS}}|[ao]s?){{S}}(?:{{ADJECTIVES}})|t[ãa]o)(?={{S}}(?<target>[a-zçãõáéíóúâêô]+){{E}})"
        return: "afterLead(m, ctx)"
      # A transitive verb before its object: "tenho duvidas", "há duvida", "pediu credito". Two
      # finite verbs never stand side by side.
      - regex: "(?<lead>{{VERBS}})(?={{S}}(?<target>[a-zçãõáéíóúâêô]+){{E}})"
        return: "afterLead(m, ctx)"
      # After "ser" or "tornar" comes a noun or adjective: "foi publica" -> "pública", "tornou
      # especifica" -> "específica", "ser interprete" -> "intérprete".
      - regex: "(?<lead>é|era|eram|foi|foram|fui|ser|será|seria|sou|torna|tornou|tornam|tornaram|tornar|dava|davam)(?={{S}}(?<target>[a-zçãõáéíóúâêô]+){{E}})"
        return: "afterLead(m, ctx)"
      # One of those adjectives opening a sentence: "Grande distancia" -> "distância".
      - regex: "(?<lead>{{ADJECTIVES}})(?={{S}}(?<target>[a-zçãõáéíóúâêô]+){{E}})"
        return: "SENTENCE_START.test(ctx.text.slice(Math.max(0, m.index - 8), m.index)) ? afterLead(m, ctx) : null"
      # A bare article opening a sentence: a clitic "o/a" never starts written prose ("A arvore
      # caiu" -> "árvore"), so there it is the article.
      - regex: "(?<lead>[aoAO]s?)(?={{S}}(?<target>[a-zçãõáéíóúâêô]+){{E}})"
        return: "SENTENCE_START.test(ctx.text.slice(Math.max(0, m.index - 8), m.index)) ? afterLead(m, ctx) : null"
  - id: pt_BR.confusionFrames
    checks: [portugueseConfusions]
    style: portuguese
    message: review_msg_pt_homophone
    maps:
      # Verb forms typed for the noun that sounds the same: after a determiner only the noun fits.
      NOUN_TWIN:
        viajem: viagem
        viajens: viagens
        extirpe: estirpe
        extirpes: estirpes
        profetiza: profetisa
        profetizas: profetisas
        poetiza: poetisa
        poetizas: poetisas
        sinto: cinto
        sintos: cintos
        sinta: cinta
        sintas: cintas
        asso: aço
        assos: aços
        cerra: serra
        cerras: serras
      # "a" fused with the article that follows it.
      WITH_A: { o: ao, a: à, os: aos, as: às }
      # Elapsed-time "fazer" and its auxiliaries have no subject: the singular.
      IMPERSONAL:
        fazem: faz
        faziam: fazia
        fizeram: fez
        farão: fará
        fariam: faria
        vão: vai
        iam: ia
        irão: irá
        podem: pode
        deviam: devia
        devem: deve
        costumam: costuma
      HAVER_SINGULAR:
        haviam: havia
        haverão: haverá
        haveriam: haveria
        houvessem: houvesse
        houverem: houver
        hajam: haja
        haverem: haver
      # Long participle stem -> short participle stem (gender and number follow).
      SHORT_PARTICIPLE:
        gast: gast
        pag: pag
        ganh: ganh
        aceit: aceit
        eleg: eleit
        prend: pres
        acend: aces
        suspend: suspens
        expuls: expuls
        imprim: impress
        limp: limp
        salv: salv
        solt: solt
        morr: mort
        benz: bent
        enxug: enxut
        extingu: extint
      MODAL_SINGULAR:
        devem: deve
        deviam: devia
        deveriam: deveria
        deverão: deverá
        podem: pode
        podiam: podia
        poderiam: poderia
        poderão: poderá
        vão: vai
        iam: ia
        irão: irá
        costumam: costuma
        começam: começa
        continuam: continua
      COPULA_PLURAL: { foi: foram, é: são, era: eram, está: estão, estava: estavam }
      ESTAR_FOR_TER:
        tive: estive
        teve: esteve
        tivemos: estivemos
        tiveram: estiveram
        tinha: estava
        tínhamos: estávamos
        tinham: estavam
      ACCENTED_PREFIX: { pos: pós, recem: recém, alem: além, aquem: aquém }
      FUTURE_ACCENT: { sera: será, tera: terá }
      # "comer os remédios" -> "tomar".
      EAT_TO_TAKE:
        comer: tomar
        como: tomo
        come: toma
        comemos: tomamos
        comem: tomam
        comi: tomei
        comeu: tomou
        comeram: tomaram
        comia: tomava
        comiam: tomavam
        comendo: tomando
        comido: tomado
      # "o evento toma lugar" -> "tem lugar".
      TAKE_PLACE:
        toma: tem
        tomam: têm
        tomou: teve
        tomaram: tiveram
        tomará: terá
        tomarão: terão
        tomaria: teria
        tomariam: teriam
        tomava: tinha
        tomavam: tinham
        tomasse: tivesse
        tomassem: tivessem
      HAD_TO: { estive: tive, esteve: teve, estivemos: tivemos, estiveram: tiveram }
    frames:
      # "uma viajem longa" -> "viagem", "do asso" -> "aço".
      - regex: "{{NOUN_LEAD}}{{S}}(?<target>viajem|viajens|extirpe|extirpes|profetiza|profetizas|poetiza|poetizas|sinto|sintos|sinta|sintas|asso|assos|cerra|cerras){{E}}(?!-)"
        return: "[NOUN_TWIN[target.toLowerCase()]]"
      - regex: "(?<![\\p{L}][ \\t\\u00a0]{0,8})[oa]s?{{S}}(?<target>viajem|viajens|extirpe|extirpes|profetiza|profetizas|poetiza|poetizas|sinto|sintos|sinta|sintas|asso|assos|cerra|cerras){{E}}(?!-)"
        return: "[NOUN_TWIN[target.toLowerCase()]]"
        clauseStart: true
      # "que eles viagem" -> "viajem", "Não viagem sem seguro": the subjunctive is spelled with j.
      - regex: "(?:(?:que|embora|caso){{S}}(?:eles|elas|vocês)|(?<!uma{{S}})não){{S}}(?<target>viagem){{E}}(?!{{S}}(?:é|foi|era|será){{E}})"
        fix: ["viajem"]
      # "assistir ao filme" (to watch); "assistir o paciente" (to help) keeps its object.
      - regex: "{{ASSISTIR}}{{S}}(?<target>os?|as?(?={{S}}{{NOT_ARTICLE_NEXT}})){{S}}(?=(?:\\p{L}+{{S}})?(?:{{SHOWS}}){{E}})"
        return: "[WITH_A[target.toLowerCase()]]"
        message: review_msg_pt_regency
      # "obedecer aos pais", "desobedecer à lei".
      - regex: "(?:{{OBEDECER}}){{S}}(?<target>os?|as?(?={{S}}{{NOT_ARTICLE_NEXT}})){{S}}(?=\\p{L}{2,})"
        return: "[WITH_A[target.toLowerCase()]]"
        message: review_msg_pt_regency
