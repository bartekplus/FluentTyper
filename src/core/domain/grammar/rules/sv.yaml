# sv grammar rules. See docs/agents/grammar-rules.md for the format.
lang: sv

rules:
  - id: sv.typography
    checks: [swedishTypography]
    predicate: typography
  - id: sv.agreement
    checks: [swedishAgreement]
    predicate: agreement
  - id: sv.mellanTillDeDem
    checks: [englishPhraseCorrections]
    predicate: mellanTillDeDem
  - id: sv.enTillSpeechComma
    checks: [stylePhrasing]
    predicate: enTillSpeechComma

