          l',
          un,
          ce,
          cet,
          mon,
          ton,
          son,
          la,
          une,
          cette,
          sa,
          ma,
          ta,
          notre,
          votre,
          leur,
          les,
          des,
          ces,
          ses,
          mes,
          tes,
          nos,
          vos,
          leurs,
