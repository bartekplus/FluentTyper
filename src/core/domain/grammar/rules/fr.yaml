      # determiner of either gender, a masculine one too. "l'invité", "leur vécu", "les élus": the
      # participle is a noun of its own.
      participleOnlyNoun:
        args: "word: string, gender: string | null, number: string | null, nounFinding: AlternativesFix"
        type: RawFinding | null
        let:
          plural: number === "p"
          base: "plural && /[^s]s$/.test(word) ? word.slice(0, -1) : word"
          noun: "`${base}e`"
          nounIs: nounGender(noun)
        return: >-
          gender === "m" && !plural && word.endsWith("é") && !isVerbHomograph(word)
            ? nounGender(`${word}e`) === "m" && isVerbHomograph(`${word}e`)
              ? nounFinding([`${word}e`])
              : !isInflectedNoun(word) && isVerbHomograph(`${word.slice(0, -1)}er`) && isInflectedNoun(`${word.slice(0, -1)}er`)
                ? nounFinding([`${word.slice(0, -1)}er`])
                : null
            : gender === "m"
              ? null
              : /e$/.test(base) || (plural && base === word && /[sx]$/.test(word))
                ? null
                : !(nounIs === "f" || isVerbHomograph(noun)) || (nounIs === "m" && gender)
                  ? null
                  : adjectiveReadings(base).length || isVerbHomograph(base)
                    ? null
                    : !gender && isInflectedNoun(base)
                      ? null
                      : nounFinding([plural ? `${noun}s` : noun])
      # A verb form after a determiner, past the checks of the article. "la facilite", "la
      # citée": the feminine noun in -ité. "son ressentie", "mes démêlées": a feminine participle
      # for the masculine noun it comes from. "les sortis": a simple past that is also a
      # participle reads as the participle here.
      nounFromVerb:
        args: "ctx: DetectContext, m: RegExpExecArray, det: string, word: string, gender: string | null, number: string | null"
        type: RawFinding | null
        let:
          readings: verbReadings(word)
          end: m.index + m[0].length
          nounFinding: '(alternatives: string[]) => finding("frenchNounGender", "review_msg_fr_determiner_noun", m.indices!.groups!.noun[0], end, alternatives, { context: { start: m.index, end } })'
          finite: 'readings.filter((r) => typeof r.slot === "number")'
          participle: 'readings.some((r) => r.slot === "Q")'
          iteNoun: word.replace(/it(?:e|ée)$/, "ité")
          lemma: word.replace(/es?$/, "")
          pastOnly: finite.every((r) => hasPerson(r.slot, JE + TU))
        when:
          - readings.length > 0
          - "!/^[-'’]/.test(ctx.text.slice(end, end + 1))"
          - "!namedExampleBefore(ctx.text, m.index)"
        return: >-
          gender !== "m" &&
          /it(?:e|ée)$/.test(word) &&
          !isInflectedNoun(word) &&
          !isVerbHomograph(word) &&
          nounGender(iteNoun) === "f" &&
          isVerbHomograph(iteNoun)
            ? nounFinding([iteNoun])
            : finite.length === readings.length && !isVerbHomograph(word)
              ? finiteNoun(ctx, m, det, word, gender, number, nounFinding)
              : participle &&
                  gender !== "f" &&
                  lemma !== word &&
                  /[éiu]$/.test(lemma) &&
                  !isInflectedNoun(word) &&
                  !isVerbHomograph(word) &&
                  isVerbHomograph(lemma) &&
                  isInflectedNoun(lemma) &&
                  nounGender(lemma) !== "f"
                ? nounFinding([number === "p" ? `${lemma}s` : lemma])
                : !participle || (finite.length && !(number === "p" && pastOnly))
                  ? accentedNounFinding(ctx, m, det, word, gender, end, nounFinding)
                  : participleOnlyNoun(word, gender, number, nounFinding)
      # A noun written like a verb form or participle after a determiner: the noun's spelling.
      # "son issue", "mon amie": a possessive in -on also goes before a feminine vowel. "le", "la",
      # "les" are also pronouns before a verb ("il le coupe"): only after a preposition, a
      # conjunction, a negation or a verb, or at a sentence start are they articles; never after
      # a subject or another object pronoun. "les députes", "les arrives": a verb form in -es for
      # the noun in -és or -ées. After a verb, only a noun spelled like a verb form or participle
      # is read here.
      nounAfter:
        args: "ctx: DetectContext, m: RegExpExecArray, det: string"
        type: RawFinding | null
        let:
          typed: m.groups!.noun
          word: typed.toLowerCase()
          gender: '["mon", "ton", "son"].includes(det) && determinerVowel(word) ? null : DETERMINER_INFO[det][0]'
          number: DETERMINER_INFO[det][1]
          previous: tokensBefore(ctx.text, m.index, 1)[0]
          article: >-
            previous
              ? DETERMINER_OPENERS.has(previous.w) ||
                (AFTER_NEGATION_WORDS.has(previous.w) && !NE_BEFORE.has(previous.w)) ||
                (verbReadings(previous.w).length > 0 && !isVerbHomograph(previous.w))
              : /(?:^|[.!?…]\s{0,8})$/u.test(ctx.text.slice(Math.max(0, m.index - 9), m.index))
          accented: '!ONLY_DETERMINERS.has(det) && number === "p" ? accentedPlural(word) : null'
        when:
          - "!(typed !== word || word.length < 3 || ctx.dictionary.has(word))"
          - ONLY_DETERMINERS.has(det) || article
        return: >-
          accented
            ? finding("frenchNounGender", "review_msg_fr_determiner_noun", m.indices!.groups!.noun[0], m.index + m[0].length, [accented], {
                context: { start: m.index, end: m.index + m[0].length },
              })
            : !ONLY_DETERMINERS.has(det) &&
                previous &&
                !DETERMINER_OPENERS.has(previous.w) &&
                verbReadings(word).some((r) => typeof r.slot === "number") &&
                !/it(?:e|ée)$/.test(word)
              ? null
              : nounFromVerb(ctx, m, det, word, gender, number)
    frames:
      # "nos cette langue", "des sa naissance", "du notre site": two determiners in a row.
      - regex: "{{WORD_START}}(?<first>le|la|les|un|une|des|du|au|aux|ce|cet|cette|ces|mon|ton|son|ma|ta|sa|mes|tes|ses|notre|votre|nos|vos|leur|leurs)[ \\t]{1,8}(?<second>(?:le|la|les|un|une|des|du|au|aux|ce|cet|cette|ces|mon|ton|son|ma|ta|sa|mes|tes|ses|notre|votre|nos|vos|leur|leurs)(?![\\p{L}\\p{M}\\p{N}_-])|l['’](?=\\p{L}))"
        flags: giu
        scan: owned
        lookback: 1
        when: m.index >= ctx.from
        return: doubleDeterminer(ctx, m, first.toLowerCase(), second.toLowerCase().replaceAll("’", "'"))
      # "des plusieurs" -> "de plusieurs", "de des" -> "de" or "des", "à aux" -> "aux" or "à".
      # "ces plusieurs jours" is literary; only "des plusieurs" and "les certaines" are slips. "des
      # toutes petites": "toutes" is the adverb before an adjective; only "des toutes les". "la
      # Source de des Trois Caños": a name.
      - regex: "{{WORD_START}}(?<first>des|les|ces|mes|tes|ses|nos|vos|de|du|à)[ \\t]{1,8}(?<second>plusieurs|certains|certaines|toutes|tous|des|de|aux|entre){{WORD_END}}"
        flags: giu
        scan: owned
        lookback: 1
        let:
          lowerFirst: first.toLowerCase()
          lowerSecond: second.toLowerCase()
          end: m.index + m[0].length
          next: tokensAfter(ctx.text, end, 1)[0]
          alternatives: >-
            PAIR_QUANTIFIERS.has(lowerSecond)
              ? lowerFirst !== "des" && !(lowerFirst === "les" && lowerSecond !== "plusieurs")
                ? null
                : lowerFirst === "des"
                  ? [`${carryCase(first, "de")} ${second}`, second]
                  : [second]
              : lowerSecond === "toutes" || lowerSecond === "tous"
                ? lowerFirst !== "des" || !next || !PAIR_PLURAL_DETERMINERS.has(next.w)
                  ? null
                  : [`${carryCase(first, "de")} ${second}`]
                : lowerFirst === "de" && lowerSecond === "des"
                  ? next && /^\p{Lu}/u.test(ctx.text[next.start])
                    ? null
                    : [first, second]
                  : lowerFirst === "du" && lowerSecond === "de"
                    ? [first, second]
                    : lowerFirst === "à" && (lowerSecond === "aux" || lowerSecond === "entre")
                      ? [second, first]
                      : null
        when:
          - m.index >= ctx.from
          - '!(ctx.text[m.index - 1] === "-" || namedExampleBefore(ctx.text, m.index))'
          - "!!alternatives"
        return: >-
          finding(frame.ruleId, frame.messageKey, m.index, end, alternatives, {
            ...(alternatives.length > 1 ? { requiresChoice: true as const } : {}),
          })
      # A noun written like a verb form or participle after a determiner: the noun's spelling.
      # "ce sont", "ce fut": the pronoun before être. "les filles son arrivé": "sont" misspelt.
      - regex: "{{WORD_START}}(?<det>(?:le|la|les|un|une|des|du|au|aux|ce|cet|cette|ces|mon|ton|son|ma|ta|sa|mes|tes|ses|notre|votre|nos|vos|leur|leurs)(?=[ \\t])|l['’])[ \\t]{0,8}(?<noun>\\p{L}[\\p{L}\\p{M}]*)(?![\\p{L}\\p{M}\\p{N}_])"
        flags: dgiu
        scan: owned
        lookback: 1
        let:
          lowerDet: det.toLowerCase().replaceAll("’", "'")
        when:
          - m.index >= ctx.from
          - '!(determinerVowel(noun.toLowerCase()) && (lowerDet === "le" || lowerDet === "la"))'
          - lowerDet !== "ce"
          - '!(lowerDet === "son" && sontForSon(ctx.text, m.index))'
        return: nounAfter(ctx, m, lowerDet)
  - id: fr.ordinals
    checks: [frenchOrdinals]
    style: match
    message: review_msg_fr_ordinal
    defs:
      # The typographic suffix of an ordinal ("2ème" -> "e", "1ère" -> "re", "2nde" -> "de"), or
      # null. "1ème" is neither 1er nor 1re: it gets no suffix.
      ordinalSuffix:
        args: "number: string, typed: string"
        let:
          plural: '/s$/i.test(typed) ? "s" : ""'
          suffix: 'typed.toLowerCase().replace(/s$/, "")'
        return: >-
          /^(?:ère|ere|ière|iere)$/.test(suffix)
            ? (number === "1" ? `re${plural}` : null)
            : suffix === "ier"
              ? (number === "1" ? "er" : null)
              : suffix === "nd" || suffix === "nde"
                ? (number === "2" ? `${suffix.slice(1)}${plural}` : null)
                : number === "1" || number === "I"
                  ? null
                  : `e${plural}`
    frames:
      # "2ème", "XIXè", "16me", "2-ièmes", "XIX ième": an Arabic or Roman number and the
      # suffix, glued, after a hyphen, or after a space when the suffix is no word of its own.
      - regex: "(?<![\\p{L}\\p{N}_.,/-])(?<number>\\d{1,4}|[IVXLC]{1,7})(?<join>-|[ \\u00a0](?=(?:ièmes?|iemes?|èmes?|emes?)(?![\\p{L}])))?(?<suffix>ièmes?|iemes?|èmes?|emes?|ères?|eres?|ières?|ieres?|ier|nds?|ndes?|è|mes?)(?![\\p{L}\\p{N}_])"
        flags: gu
        scan: owned
        lookback: 1
        let:
          joined: 'join ?? ""'
          fixed: ordinalSuffix(number, suffix)
          start: m.index + number.length
          end: start + joined.length + suffix.length
        when:
          - m.index >= ctx.from
          # "Il a 16 ans, 2 me suffisent": a lowercase "me" may be the pronoun.
          - "!(/^mes?$/.test(suffix) && joined)"
          # "DIX", "MIXER": words.
          - '!(/^[IVXLC]/.test(number) && (/^(?:nd|ier|ère|ere|ière|iere)/.test(suffix) || !/\p{Ll}/u.test(suffix)))'
          - "!!fixed && !namedExampleBefore(ctx.text, m.index)"
        return: "finding(frame.ruleId, frame.messageKey, start, end, [fixed], { context: { start: m.index, end } })"
  - id: fr.rangeDashes
    checks: [emdashShortcut]
    style: match
    message: review_msg_range_dash
    defs:
      # "pages 10-15" -> "10–15". Not after a label of a code or a law ("tél. 12-34", "art. 3-5",
      # "n° 12-14").
      FRENCH_RANGE_CODE: '/(?:^|[^\p{L}])(?:tél|tel|téléphone|portable|mobile|fax|n°|no|numéro|réf|référence|code|cp|dossier|facture|commande|compte|iban|art|article|loi|décret|alinéa|al|version|vol|ligne|quai|chambre|salle|modèle|type|isbn)\.?[ \t ]*:?[ \t ]*$|§[ \t ]*$/iu'
      # "gagné 3-1", "le match s'est terminé 2-2", "mène 1-0".
      FRENCH_RANGE_SCORE: '/(?:^|[^\p{L}])(?:gagn|perd|battu|victoire|défaite|score|match|nul|mène|menait|emport|impos|set|mi-temps|résultat)\p{L}*(?:[ \t ''’]+\p{L}+){0,3}[ \t ]+$/iu'
    frames:
      # "pages 10-15", "1990-1995": two numbers of up to four digits joined by a hyphen. A dash,
      # a colon, a slash or a digit group after the second number makes a date, a phone number
      # or a code ("12-05-2020", "2024-05-01"); a decimal or a time ("8.00-9.00") stays.
      - regex: "{{RANGE_DASH}}"
        scan: owned
        lookback: 8
        flags: gu
        let:
          a: m[1]
          dash: m[2]
          b: m[3]
          # A range runs up: "1990-95" and the season "2014-15" end in 1995 and 2015; "3-1" does not.
          last: "a.length === 4 && b.length === 2 ? Number(a.slice(0, 2) + b) : Number(b)"
          before: ctx.text.slice(Math.max(0, m.index - 48), m.index)
          at: m.index + a.length
        when:
          - m.index >= ctx.from && !namedExampleBefore(ctx.text, m.index)
          # A leading zero or a 3-4 pair is a phone number or an ID: "0034-600", "12-05", "915-5512".
          - '!(a[0] === "0" || b[0] === "0" || (a.length === 3 && b.length === 4))'
          - last > Number(a)
          - "!(FRENCH_RANGE_CODE.test(before) || FRENCH_RANGE_SCORE.test(before))"
        return: 'finding(frame.ruleId, frame.messageKey, at, at + dash.length, ["–"], { context: { start: m.index, end: m.index + m[0].length } })'
  - id: fr.commas
    checks: [frenchCommas]
    style: match
    message: review_msg_fr_stray_comma
    # A comma never parts words that hold together: a subject pronoun and its verb ("Il, arrive"),
    # a determiner and its noun ("les, jolies filles"), "ne" and the verb, an object pronoun and
    # its verb, an auxiliary or a modal and its participle or infinitive ("il a, réussi"), "parce"
    # and "que". An inserted phrase closes with a second comma ("il a, bien sûr, réussi"): left
    # alone.
    sets:
      # Subject pronouns never stressed: "elle", "nous", "vous" may open a dislocation ("Elle, elle
      # sait").
      CLITIC_SUBJECTS: [je, tu, il, ils, on]
      COMMA_DETERMINERS:
        [les, des, ces, mes, tes, ses, nos, vos, cette, cet, ma, ta, mon, notre, votre, leurs]
      OBJECT_CLITICS: [me, m', te, t', se, s', le, la, les, lui, leur, "y", en]
      # Object pronouns and "ne" between a subject pronoun and its verb.
      SUBJECT_CLITICS: [me, "m'", te, "t'", se, "s'", le, la, les, lui, leur, y, en, ne, "n'"]
      # A negation before the comma is left out: "j'en peux plus, avancer !" calls out.
      COMMA_ADVERBS: [déjà, bien, toujours, encore, souvent, vraiment, beaucoup, aussi, enfin]
      # Words that open an insertion after a relative or a conjunction: "qui, sans sa copie, ...".
      INSERTION_OPENERS:
        [
          si,
          quand,
          lorsque,
          lorsqu',
          comme,
          pour,
          par,
          sans,
          avec,
          dans,
          sur,
          sous,
          selon,
          malgré,
          après,
          avant,
          en,
          à,
          au,
          aux,
          de,
          d',
          du,
          des,
          depuis,
          pendant,
          entre,
          vers,
          ni,
          bien,
          même,
          surtout,
          notamment,
        ]
      COMMA_NEGATIONS: [pas, plus, jamais, rien, guère]
      COMMA_MODALS: [pouvoir, devoir, vouloir, savoir, aller, falloir]
      COMMA_STRESSED: [moi, toi, lui, elle, nous, vous, eux, elles]
      # Words that open a clause or a relative and take their words without a comma when no second
      # comma closes an insertion.
      CLAUSE_OPENERS: [qui, que, qu', où, ni, parce, lorsque, lorsqu', puisque, puisqu', quoique]
      # Words after which an inversion asks or follows an adverb: "que dit-il ?", "ainsi dit-il".
      NOT_INCISE:
        [
          que,
          qu',
          comment,
          pourquoi,
          où,
          quand,
          combien,
          quoi,
          qui,
          ainsi,
          aussi,
          peut-être,
          encore,
          doute,
          moins,
          peine,
          sans,
          tant,
          toujours,
        ]
      COMMA_SUPERLATIVES: [plus, moins, mieux, pire, pis, meilleur, meilleure]
      COMMA_TIMES:
        [
          jour,
          matin,
          soir,
          nuit,
          semaine,
          mois,
          an,
          année,
          fois,
          heure,
          moment,
          instant,
          été,
          hiver,
          automne,
          printemps,
          week-end,
          lendemain,
          veille,
          midi,
        ]
    defs:
      commaFinite:
        args: "word: string"
        return: 'verbReadings(word).some((r) => typeof r.slot === "number") && !isVerbHomograph(word)'
      commaAuxiliary:
        args: "word: string"
        return: 'word === "été" || verbReadings(word).some((r) => typeof r.slot === "number" && (r.lemma === "avoir" || r.lemma === "être"))'
      commaModal:
        args: "word: string"
        return: 'verbReadings(word).some((r) => typeof r.slot === "number" && COMMA_MODALS.has(r.lemma))'
      # Index past the subject pronoun, "ne" and object pronouns before `k`, or -1 without one.
      # With `plain`, "en", "y" and a reflexive pronoun make a verb of its own ("elle s'en fut,
      # caressée par la brise"): -1.
      subjectBefore:
        args: "left: FrenchToken[], k: number, plain: boolean"
        let:
          j: skipWords(left, k, SUBJECT_CLITICS)
        when: '!(plain && left.slice(k, j).some((t) => ["en", "y", "se", "s''"].includes(t.w)))'
        return: "left[j] && SUBJECT_PRONOUNS.has(left[j].w) ? j : -1"
        else: "-1"
      # "Il a, réussi", "il a déjà, réussi", "il doit, toujours réussir": true or false, or null
      # when the words before the comma are no subject and verb.
      verbComma:
        args: "left: FrenchToken[], right: FrenchToken[]"
        type: boolean | null
        let:
          k: skipWords(left, 0, COMMA_ADVERBS)
          verb: left[k]
          # "il a été, aperçu": the passive's auxiliary before "été".
          passive: 'verb?.w === "été" && left[k + 1] && commaAuxiliary(left[k + 1].w) ? 1 : 0'
          next: right[skipWords(right, 0, COMMA_ADVERBS)]
        when: "!!verb && subjectBefore(left, k + 1 + passive, true) >= 0"
        # "Tout occupé que tu sois, tu dois": a new clause's subject ("tu" is also a participle).
        return: >-
          !next || SUBJECT_PRONOUNS.has(next.w)
            ? false
            : commaAuxiliary(verb.w) && verbReadings(next.w).some((r) => r.slot === "Q")
              ? true
              : commaModal(verb.w) && verbReadings(next.w).some((r) => r.slot === "I" && r.lemma === next.w)
                ? true
                : null
      # "Cela, arrive", "Les enfants, arrivent demain": a subject opening its clause and its verb.
      # "Les enfants, venez": a call and an imperative.
      subjectComma:
        args: "left: FrenchToken[], right: FrenchToken[]"
        let:
          l0: left[0]
          r0: right[0]
          persons: finitePersons(r0.w)
        when: "commaFinite(r0.w) && !right[1]?.hyphen"
        return: >-
          hasPerson(persons, TU + VOUS)
            ? false
            : left.length === 1 && ["cela", "ça", "ceci"].includes(l0.w)
              ? hasPerson(persons, IL)
              : left.length === 2 && ["les", "des", "ces", "mes", "tes", "ses", "nos", "vos"].includes(left[1].w)
                ? /[sx]$/.test(l0.w) && hasPerson(persons, ILS) &&
                  (nounGender(l0.w.slice(0, -1)) !== null || isInflectedNoun(l0.w.slice(0, -1)))
                : false
        else: "false"
      strayCommaBetween:
        args: "left: FrenchToken[], right: FrenchToken[]"
        type: boolean
        let:
          l0: left[0]
          l1: left[1]
          r0: right[0]
        when: "!!l0 && !!r0"
        # "Il, arrive demain": a subject pronoun opening its clause. "Les, jolies filles": a
        # determiner and what it determines; "les leurs" is a pronoun. "de, ne plus le faire": a
        # preposition and its infinitive. "Il ne vient, pas": the two parts of a negation around
        # the verb. "Lesquelles, arrivent": an interrogative pronoun and its verb. "C'est lui,
        # qui part": a cleft. "Il lui, dit", "Ils vont se, manger": an object pronoun and its
        # verb; after an object pronoun a form also spelled as a noun is the verb ("il le, dit").
        # "Le chat qui, arrive", "le lieu où, le chat arrive"; "qui, sans sa copie" opens an
        # insertion.
        return: >-
          CLITIC_SUBJECTS.has(l0.w)
            ? left.length === 1 && !SUBJECT_PRONOUNS.has(r0.w) && !["et", "ou"].includes(r0.w)
            : COMMA_DETERMINERS.has(l0.w)
              ? !(l1 && ["le", "la", "les", "des", "aux"].includes(l1.w)) &&
                (nounGender(r0.w) !== null || isInflectedNoun(r0.w) || adjectiveReadings(r0.w).length > 0)
              : l0.w === "ne"
                ? true
                : l0.w === "parce"
                  ? r0.w === "que" || r0.w === "qu'"
                  : l0.w === "de"
                    ? r0.w === "ne" || r0.w === "n'"
                    : COMMA_NEGATIONS.has(r0.w) && left.slice(1, 4).some((t) => t.w === "ne" || t.w === "n'")
                      ? verbReadings(l0.w).some((r) => typeof r.slot === "number")
                      : left.length === 1 && /^les?quel(?:le)?s?$|^laquelle$/.test(l0.w)
                        ? commaFinite(r0.w)
                        : COMMA_STRESSED.has(l0.w) && l1?.w === "est" && left[2]?.w === "c'"
                          ? r0.w === "qui"
                          : OBJECT_CLITICS.has(l0.w) && l0.w !== "en" && l0.w !== "la"
                            ? subjectBefore(left, 1, false) < 0 && !(l1 && commaModal(l1.w))
                              ? false
                              : verbReadings(r0.w).some((r) => typeof r.slot === "number" || r.slot === "I")
                            : (verbComma(left, right) ??
                              (CLAUSE_OPENERS.has(l0.w)
                                ? left.length > 1 && !COMMA_ADVERBS.has(r0.w) && !INSERTION_OPENERS.has(r0.w)
                                : subjectComma(left, right)))
        else: "false"
      # "Ces photos je les aime", "ce gâteau je le mange": the object taken up by its pronoun.
      objectTakenUp:
        args: "ctx: DetectContext, left: FrenchToken[], right: FrenchToken[], det: string"
        let:
          noun: left[0]
          plural: '["les", "ces", "mes", "tes", "ses", "nos", "vos", "leurs"].includes(det)'
          singular: '["le", "ce", "cet", "cette", "mon", "ton", "son", "ma", "ta", "sa"].includes(det)'
          clitic: right[1].w
          takenUp: 'plural ? clitic === "les" : singular && ["le", "la", "l''"].includes(clitic)'
          nounWord: ctx.text.slice(noun.start, noun.end) === noun.w && !COMMA_TIMES.has(noun.w)
        return: >-
          takenUp && nounWord &&
          (nounGender(noun.w.replace(/[sx]$/, "")) !== null || isInflectedNoun(noun.w.replace(/[sx]$/, ""))) &&
          !["plus", "moins", "mêmes"].includes(right[2].w) &&
          verbReadings(right[2].w).some((r) => typeof r.slot === "number")
    frames:
      # A comma between two words of one clause: "Il, arrive", "les, jolies filles".
      - regex: "(?<=\\p{L})[ \\t]?,[ \\t]{1,4}(?=\\p{Ll})"
        flags: gu
        scan: owned
        lookback: 1
        let:
          comma: m.index + m[0].indexOf(",")
          # A second comma before the clause ends closes an insertion: "il a, bien sûr, réussi".
          rest: ctx.text.slice(comma + 1, comma + 300)
          end: 'rest.search(/[,.;:!?…\n()«»"“”—]/u)'
          left: tokensBefore(ctx.text, m.index, 6)
          right: tokensAfter(ctx.text, m.index + m[0].length, 4)
        when:
          - m.index >= ctx.from
          - '!(end < 0 || rest[end] === ",")'
          - '!(!left[0] || ctx.text[left[0].start - 1] === "-" || left.some((t) => t.hyphen))'
          # Names, acronyms and words in capitals keep their punctuation.
          - '!/\p{Lu}/u.test(ctx.text.slice(left[0].start + 1, left[0].end))'
          - "!namedExampleBefore(ctx.text, left[0].start) && strayCommaBetween(left, right)"
        return: 'finding(frame.ruleId, frame.messageKey, m.index, m.index + m[0].length, [" "], { context: { start: left[0].start, end: right[0].end } })'
      # A reporting verb inverted with its subject is set off by commas: "Il viendra, dit-elle,
      # demain".
      - regex: "[ \\t]{1,4}(?:(?:me|te|lui|leur|nous|vous)[ \\t]{1,4})?(?:dit|disait|répondit|répond|ajouta|ajoute|demanda|demande|répliqua|réplique|expliqua|explique|poursuivit|poursuit|reprit|murmura|murmure|cria|lança|lance|affirma|affirme|déclara|déclare|souffla|souffle|soupira|soupire|précisa|précise|insista|insiste|conclut|répéta|répète)-(?:t-)?(?:il|elle|on|ils|elles){{WORD_END}}"
        flags: giu
        scan: owned
        lookback: 1
        let:
          before: tokensBefore(ctx.text, m.index, 1)[0]
          end: m.index + m[0].length
          # A word goes on after it: a comma closes the insertion too.
          after: '/^[ \t]{1,4}(?=\p{L})/u.exec(ctx.text.slice(end, end + 5))'
          inner: m[0].trimStart()
        when:
          - m.index >= ctx.from
          - "!(!before || before.end !== m.index || NOT_INCISE.has(before.w))"
          # "Ne dit-on pas", "il a dit-on pu": a question, or "dit-on" inside a compound tense.
          - '!(before.w === "ne" || verbReadings(before.w).some((r) => r.lemma === "avoir"))'
          - '!(ctx.text[before.start - 1] === "-" || namedExampleBefore(ctx.text, m.index))'
        return: >-
          finding(frame.ruleId, "review_msg_fr_missing_comma", m.index, after ? end + after[0].length : end,
            [after ? `, ${inner}, ` : `, ${inner}`], { context: { start: before.start, end } })
      # A fronted phrase taken up by "c'est" or by a pronoun: "Ces photos je les aime".
      - regex: "(?<=\\p{L})[ \\t]{1,4}(?=c['’]|(?:ce|cela|ça|je|tu|il|elle|on|nous|vous|ils|elles)(?![\\p{L}\\p{M}\\p{N}_-]))"
        flags: gu
        scan: owned
        lookback: 1
        let:
          left: tokensBefore(ctx.text, m.index, 5)
          first: left.at(-1)
          right: tokensAfter(ctx.text, m.index + m[0].length, 3)
          det: first.w
          # "Le plus grand c'est", "le pire ce fut", "le mieux cela serait".
          fronted: >-
            ["c'", "ce", "cela", "ça"].includes(right[0]?.w ?? "")
              ? ["le", "la", "les"].includes(det) && COMMA_SUPERLATIVES.has(left.at(-2)!.w)
              : left.length === 2 && SUBJECT_PRONOUNS.has(right[0]?.w ?? "") && !!right[2] &&
                objectTakenUp(ctx, left, right, det)
        when:
          - m.index >= ctx.from
          - "!!first && left.length >= 2 && left.length <= 4"
          # The phrase opens its sentence.
          - '/(?:^|[.!?…]\s{0,8}|\n)$/u.test(ctx.text.slice(Math.max(0, first.start - 9), first.start))'
          - "!(left.some((t) => t.hyphen) || namedExampleBefore(ctx.text, first.start))"
          - fronted
        return: 'finding(frame.ruleId, "review_msg_fr_missing_comma", m.index, m.index + m[0].length, [", "], { context: { start: first.start, end: right[0].end } })'
