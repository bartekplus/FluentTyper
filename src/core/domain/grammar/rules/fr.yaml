          previous: before[0]
          verb: 'previous.w === "plus" ? before[1] : previous'
        when:
          - "!(!previous || HOMO_DETERMINERS.has(previous.w) || HOMO_PREPOSITIONS.has(previous.w))"
          - '!["en", "après", "avant", "contre", "de", "d''"].includes(previous.w)'
