        flags: gu
        scan: owned
        lookback: 1
        let:
          subject: tokensBefore(ctx.text, m.index, 1)[0]
          elided: m[0].slice(0, 2)
          word: m[0].slice(2).toLowerCase()
          reflexive: '`${elided[0] === "C" ? "S" : "s"}${elided[1]}`'
          pair: 'word === "est" ? tokensAfter(ctx.text, m.index + m[0].length, 2) : []'
        when: m.index >= ctx.from
        return: >-
          word === "être"
            ? wordFinding(ctx, m.index, elided, [reflexive], frame.ruleId, frame.messageKey, { start: m.index, end: m.index + m[0].length })
            : word === "est" && cesBeforeNoun(ctx, pair)
              ? wordFinding(ctx, m.index, m[0], [carryCase(m[0], "ces")], frame.ruleId, frame.messageKey, { start: m.index, end: pair[1].end })
              : !subject || ctx.text[subject.start - 1] === "-"
                ? null
                : !["il", "elle", "on", "ils", "elles", "ne", "n'"].includes(subject.w)
                  ? null
                  : wordFinding(ctx, m.index, elided, [reflexive], frame.ruleId, frame.messageKey, {
