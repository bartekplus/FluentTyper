          CALQUE_FORMS.has(word)
            ? verbCalque(ctx, m)
            : word === "au" || word === "aux" || word === "à"
              ? goToTrade(ctx, m)
              : word === "auprès"
                ? addressedTo(ctx, m)
                : word === "pour"
