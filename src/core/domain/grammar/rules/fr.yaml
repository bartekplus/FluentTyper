          wordFinding(ctx, m.index, ctx.text.slice(m.index, end),
            [word === "au" ? "chez le" : word === "aux" ? "chez les" : "chez la"], "stylePhrasing", "review_msg_style_phrasing",
            { start: before.at(-1)!.start, end: trade.end })
      # "Adressez-vous auprès du guichet" -> "au guichet": one addresses oneself "à" someone.
      addressedTo:
        args: "ctx: DetectContext, m: RegExpExecArray"
        type: RawFinding | null
        let:
          before: tokensBefore(ctx.text, m.index, 3)
