      # "ne"); written French says "il y a", "s'il n'y a pas", "qu'il y a". "Y a -t-il": an
      # inversion; "Le recensement, y a dénombré": "y" and a compound tense. "y a vraiment
      # personne": the negation word may follow an adverb. "y a plus intéressant" compares:
