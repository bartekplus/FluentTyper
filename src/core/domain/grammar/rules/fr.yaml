    defs:
      HOMO_NUMBERS: /^(?:\d+|un|une|deux|trois|quatre|cinq|six|sept|huit|neuf|dix|onze|douze|quinze|vingt|trente|cent|mille)$/
      A_RANGE_END: '/^[ \t ]{1,8}\d+(?:[.,]\d+)?[ \t ]*(?:[.,;:!?)]|$|(?:h|heures?|ans?|mois|jours?|semaines?|minutes?|secondes?|euros?|€|%|km|kg|m|cm|mètres?|kilomètres?|degrés?|°)(?![\p{L}\p{N}]))/u'
      EPICENE_ADJECTIVE: /(?:ible|able|ile|aire|ique|ème)s?$/
      # Words after which "prés" is the noun (meadows): "les prés", "deux prés", "de verts prés".
      PRES_BEFORE: 'new Set([...HOMO_DETERMINERS, "deux", "trois", "quatre", "plusieurs", "quelques", "nombreux", "grands", "petits", "beaux", "verts"])'
      AFTER_EVEN: new Set([...HOMO_DETERMINERS, ...HOMO_STRESSED, ...SUBJECT_PRONOUNS, ...HOMO_PREPOSITIONS])
      # A homophone finding on the typed word.
      homoFix:
        args: "ctx: DetectContext, m: RegExpExecArray, alternatives: string[], context?: TextRange"
        return: 'wordFinding(ctx, m.index, m[0], alternatives, "frenchHomophones", "review_msg_fr_homophone", context)'
      homoAuxiliary:
        args: "word: string"
        return: 'verbReadings(word).some((r) => finiteReading(r) && (r.lemma === "avoir" || r.lemma === "être"))'
      # A verb form only: no noun or adjective spelled the same.
      onlyVerb:
        args: "word: string, test: ReadingTest"
        return: "!isVerbHomograph(word) && verbReadings(word).some(test)"
      plainParticiple:
        args: "word: string"
        return: 'onlyVerb(word, (r) => r.slot === "Q")'
      plainInfinitive:
        args: "word: string"
        return: 'onlyVerb(word, (r) => r.slot === "I")'
      # Participles no finite form spells: "fui", "parlé", not "fait".
      participleOnly:
        args: "word: string"
        return: 'verbReadings(word).length > 0 && verbReadings(word).every((r) => r.slot === "Q")'
      # Nothing before the token in its clause but a conjunction: it starts a clause.
      opensClauseAt:
        args: "tokens: FrenchToken[], i: number"
        return: "!tokens[i] || HOMO_CONJUNCTIONS.has(tokens[i].w)"
      # A sentence starts right before `index` (start, end mark, line break, opening quote).
      sentenceStartsAt:
        args: "text: string, index: number"
        return: '/(?:^|[.!?…]|\n|[«"“(—–-])[\s  ]*$/u.test(text.slice(Math.max(0, index - 6), index))'
      pluralToken:
        args: "t: FrenchToken | undefined"
        return: "!!t && /[sx]$/.test(t.w)"
      # "les enfants son là", "ce son eux": the evidence that the "son" at `index` is "sont", or
      # null. The noun checks skip such a "son": it is no determiner. "Ce son des enfants", "ce
      # son eux": "ce sont" before a plural noun phrase.
      sontForSon:
        args: "text: string, index: number"
        type: "{ start: number; end: number } | null"
        let:
          before: tokensBefore(text, index, 4)
          next: tokensAfter(text, index + 3, 1)[0]
        return: >-
          before[0]?.w === "ce" && !before[1] && next && CE_SONT_NEXT.has(next.w)
            ? { start: before[0].start, end: next.end }
            : (sonBeforeParticiple(text, index, before, next) ?? sonAfterPlural(text, before, next))
      # "trois vaisseaux son lancés", "là son cachés les trésors": the determiner "son" never
      # stands before a plural participle that no noun follows. "le son entendu": the noun after
      # a determiner.
      sonBeforeParticiple:
        args: "text: string, index: number, before: FrenchToken[], next: FrenchToken | undefined"
        type: "{ start: number; end: number } | null"
        let:
          nounSon: '!!before[0] && (HOMO_DETERMINERS.has(before[0].w) || ["au", "du"].includes(before[0].w))'
          after: tokensAfter(text, next.end, 1)[0]
        when:
          - "!!next && !next.hyphen && !nounSon && /[sx]$/.test(next.w) && participleOnly(next.w)"
          - >-
            text.slice(next.start, next.end) === next.w &&
            (!after || HOMO_DETERMINERS.has(after.w) || HOMO_PREPOSITIONS.has(after.w) || HOMO_ADVERBS.has(after.w) ||
              ["par", "et", "ou", "en"].includes(after.w))
        return: "{ start: before[0]?.start ?? index, end: next.end }"
      # "les personnes invitées son là": an adjective or participle may follow the noun. "des
      # personnes qui son là": "qui" after a plural noun. "certains son là", "même si certains
      # son là". "son" never stands before a plural: "les épaules son larges", "les enfants son
      # partis" (not the noun "partis"); a noun spelled alike in the singular ("son bras") may be
      # its noun.
      sonAfterPlural:
        args: "text: string, before: FrenchToken[], next: FrenchToken | undefined"
        type: "{ start: number; end: number } | null"
        let:
          relative: 'before[0]?.w === "qui" && pluralToken(before[1]) && !!before[2] && HOMO_PLURAL_DETERMINERS.has(before[2].w)'
          h: "pluralToken(before[0]) && pluralToken(before[1]) && participleOnly(before[0].w) ? 1 : 0"
          det: "relative ? before[2] : before[h + 1]"
          pronoun: 'h === 0 && PLURAL_SUBJECTS.has(before[0]?.w ?? "") && (!det || HOMO_CONJUNCTIONS.has(det.w))'
          predicate: >-
            adjectiveReadings(next.w).length ||
            verbReadings(next.w).some((r) => r.slot === "Q") ||
            HOMO_ADVERBS.has(next.w) ||
            next.w === "là" ||
            next.w === "ici" ||
            next.w === "en"
          nounLike: 'nounGender(next.w) || (!predicate && nounGender(next.w.replace(/[sx]$/, "")))'
        when:
          - >-
            pronoun || relative ||
            (!!det && (HOMO_PLURAL_DETERMINERS.has(det.w) || HOMO_NUMBERS.test(det.w)) && pluralToken(before[h]) &&
              !(before[h + 2] && !HOMO_CONJUNCTIONS.has(before[h + 2].w)))
          - "!(!next || next.hyphen || /^\\p{Lu}/u.test(text[next.start]))"
          - "!(nounLike || (!predicate && !/[sx]$/.test(next.w)))"
        return: "{ start: (det ?? before[0]).start, end: next.end }"
      # "il ma dit", "je la vu", "tu ta trompé", "il la bien fait", "il sa trompé": the "ma",
      # "ta", "la" or "sa" at `index` is an object pronoun and the auxiliary run together. Gives
      # the fix and its evidence, or null. The agreement checks skip such a word: it is no
      # determiner, and the participle after it waits for this fix. "il ma toujours affirmé":
      # adverbs between the auxiliary and its participle. "ils mon affirmé" -> "m'ont": a plural
      # subject, "mon" or "ton" and a participle only. "il ma répond" -> "me": a finite verb right
      # after the object pronoun. "il la dit", "elle la fait": a finite verb right after the
      # object pronoun; an adverb between them leaves only the participle: "il la bien fait" is
      # "l'a". "il sa trompé" -> "s'est": a reflexive verb takes être; "sa" before a noun is the
      # possessive.
      elidedAuxiliaryAt:
        args: "text: string, index: number"
        type: "{ fixed: string; start: number; end: number } | null"
        let:
          word: 'tokensAfter(text, index, 1)[0]?.w ?? ""'
          before: tokensBefore(text, index, 1)
          after: tokensAfter(text, index + word.length, 4)
          j: Math.max(0, after.findIndex((t, k) => !(after[k + 1] && HOMO_ADVERBS.has(t.w))))
          next: after[j]
          subject: before[0]
          person: >-
            subject.w === "je"
              ? JE
              : subject.w === "tu"
                ? TU
                : ["il", "elle", "on", "qui", "ça", "cela"].includes(subject.w)
                  ? IL
                  : ["ils", "elles"].includes(subject.w)
                    ? ILS
                    : 0
          readings: verbReadings(next.w)
          evidence: "{ start: subject.start, end: next.end }"
        when:
          - '["ma", "ta", "la", "sa", "mon", "ton"].includes(word)'
          - '!(!subject || !next || text[subject.start - 1] === "-")'
        return: >-
          word === "mon" || word === "ton"
            ? person === ILS &&
              readings.some((r) => r.slot === "Q") &&
              !readings.some((r) => finiteReading(r) && hasPerson(r.slot, ILS))
              ? { fixed: `${word[0]}'ont`, ...evidence }
              : null
            : !person || person === ILS
              ? null
              : (word === "ma" || word === "ta") &&
                  j === 0 &&
                  !isVerbHomograph(next.w) &&
                  readings.length > 0 &&
                  readings.every((r) => finiteReading(r)) &&
                  readings.some((r) => hasPerson(r.slot, person))
                ? { fixed: `${word[0]}e`, ...evidence }
                : !readings.some((r) => r.slot === "Q")
                  ? null
                  : (word === "la" || word === "sa") && j === 0 && readings.some((r) => finiteReading(r) && hasPerson(r.slot, person))
                    ? null
                    : word === "ma" && person === JE
                      ? null
                      : word === "sa"
                        ? person === IL && !nounGender(next.w)
                          ? { fixed: "s'est", ...evidence }
                          : null
                        : { fixed: `${word[0]}'${person === JE ? "ai" : person === TU ? "as" : "a"}`, ...evidence }
      # The words before "à" from index `i` are a subject opening the sentence: a name ("Pierre",
      # "Maman") or a determiner and a noun ("La maison"). "Hier, Pierre à raison": a name inside
      # the sentence. "Marie", "Pierre": a first name, even one spelled like a verb form. "Face à
      # une demande": a French word opening the sentence is no name.
      subjectOpens:
        args: "text: string, before: FrenchToken[], i: number"
        let:
          words: before.slice(i)
          first: words.at(-1)
        return: >-
          !first || !sentenceStartsAt(text, first.start)
            ? words.length === 1 && /^\p{Lu}/u.test(text[words[0].start]) && !verbReadings(words[0].w).length
            : words.length === 1 && firstNameGender(text.slice(first.start, first.end))
              ? true
              : words.length === 1
                ? /^\p{Lu}/u.test(text[first.start]) &&
                  !isFrenchWord(first.w) &&
                  !HOMO_ADVERBS.has(first.w) &&
                  !HOMO_CONJUNCTIONS.has(first.w) &&
                  !HOMO_STRESSED.has(first.w)
                : words.length === 2 &&
                  HOMO_DETERMINERS.has(words[1].w) &&
                  isInflectedNoun(words[0].w) &&
                  (!verbReadings(words[0].w).length || isVerbHomograph(words[0].w))
      # A name or a noun phrase opening the sentence, then what only avoir takes: "Pierre à
      # raison", "La maison à toujours une fuite", "Maman à le bras cassé", "Marie à un ami".
      avoirObject:
        args: "ctx: DetectContext, before: FrenchToken[], after: FrenchToken[], j: number, subject: FrenchToken"
        let:
          next: after[j]
          name: before.length === 1 && /^\p{Lu}/u.test(ctx.text[subject.start])
          adverbs: j > 0
          bare: 'AVOIR_BARE_NOUNS.has(next.w) && !["de", "d''"].includes(after[j + 1]?.w ?? "")'
          article: '(next.w === "le" || next.w === "les") && !!after[j + 1] && isInflectedNoun(after[j + 1].w) && !verbReadings(after[j + 1].w).length'
          determiner: 'HOMO_DETERMINERS.has(next.w) && (adverbs || (name && (next.w === "un" || next.w === "une")))'
        return: >-
          !["tort", "froid", "chaud", "part", "main", "pied", "cheval"].includes(next.w) &&
          (bare || article || determiner || (adverbs && plainParticiple(next.w)))
      # "il à mangé", "Paul à travaillé", "ça à l'air": the verb "a" written as the preposition.
      # "va-t-il à", "suffit t'il à": an inverted subject. A name or "qui", then a participle. A
      # noun + "à" + participle is as often an infinitive misspelt ("une eau à captée"), and "à
      # tout" a locution ("réponse à tout"). "Paul à travaillé": a first name opening the
      # sentence counts too.
      graveToA:
        args: "ctx: DetectContext, m: RegExpExecArray"
        type: RawFinding | null
        let:
          before: tokensBefore(ctx.text, m.index)
          after: tokensAfter(ctx.text, m.index + m[0].length, 4)
          i: 'before.findIndex((t) => !CLITICS.has(t.w) || t.w === "nous" || t.w === "vous")'
          subject: before[i]
          clitics: before.slice(0, Math.max(i, 0))
          j: skipWords(after, 0, HOMO_ADVERBS)
          next: after[j]
          context: "{ start: subject?.start ?? m.index, end: (next ?? after[0])?.end ?? m.index + m[0].length }"
          inverted: >-
            !!subject && (ctx.text[subject.start - 1] === "-" || ["t", "t'"].includes(before[i + 1]?.w ?? ""))
        return: >-
          after[0]?.w === "été"
            ? homoFix(ctx, m, ["a"], context)
            : !subject
              ? null
              : !inverted && (subject.w === "il" || subject.w === "on")
                ? homoFix(ctx, m, ["a"], context)
                : !inverted && subject.w === "tu" && opensClauseAt(before, i + 1)
                  ? homoFix(ctx, m, ["as"], context)
                  : !inverted &&
                      ["elle", "ça", "cela"].includes(subject.w) &&
                      opensClauseAt(before, i + 1) &&
                      next &&
                      (HOMO_DETERMINERS.has(next.w) || plainParticiple(next.w))
                    ? homoFix(ctx, m, ["a"], context)
                    : !clitics.length && next && subjectOpens(ctx.text, before, i) && avoirObject(ctx, before, after, j, subject)
                      ? homoFix(ctx, m, ["a"], context)
                      : !after[0] || !plainParticiple(after[0].w) || clitics.length
                        ? null
                        : (/^\p{Lu}/u.test(ctx.text.slice(subject.start, subject.end)) &&
                              (!sentenceStartsAt(ctx.text, subject.start) ||
                                (before.length === 1 && subjectOpens(ctx.text, before, i)))) ||
                            subject.w === "qui"
                          ? homoFix(ctx, m, ["a"], context)
                          : null
      # The word after a preposition: a determiner, a stressed pronoun, a name, a number or an
      # infinitive.
      startsNounPhrase:
        args: "text: string, token: FrenchToken"
        return: >-
          HOMO_DETERMINERS.has(token.w) ||
          HOMO_STRESSED.has(token.w) ||
          HOMO_NUMBERS.test(token.w) ||
          /^[\p{Lu}\d]/u.test(text.slice(token.start, token.end)) ||
          verbReadings(token.w).some((r) => r.slot === "I" && r.lemma === token.w)
      # "boîte a outils", "râpe a fromage": `next` is a bare noun (no determiner) after the noun
      # `previous`, which avoir would take only in a locution. "a son histoire", "a bien
      # transmis", "a rien": a determiner, an adverb or a pronoun. "a durée": a participle
      # misspelt. "a mangé", "a vendre", "a bon goût": a participle, an infinitive or an
      # adjective. "a valeur de loi", "a ordre de tirer": a noun with "de" may be one more
      # locution; "a désormais une forme", "a depuis ordonné": an adverb before the verb's own
      # object.
      bareNounAfterNoun:
        args: "text: string, previous: FrenchToken, next: FrenchToken, second: FrenchToken | undefined"
        let:
          w: next.w
          stem: /^(.+?)(?:ée?s?)$/.exec(w)?.[1]
          singular: w.replace(/[sx]$/, "")
          plural: singular !== w && isInflectedNoun(singular)
        when:
          - text.slice(previous.start, previous.end) === previous.w
          - "!(text.slice(next.start, next.end) !== next.w || AVOIR_BARE_NOUNS.has(next.w))"
          - "!(HOMO_DETERMINERS.has(w) || HOMO_STRESSED.has(w) || HOMO_QUANTIFIERS.has(w) || HOMO_ADVERBS.has(w))"
          - '!(w.endsWith("ment") || w === "rien" || w === "personne" || HOMO_NUMBERS.test(w))'
          - "!(stem && isVerbLemma(`${stem}er`))"
          - "!(!nounGender(previous.w) && !isInflectedNoun(previous.w))"
          - "!(verbReadings(previous.w).some(finiteReading) && !isVerbHomograph(previous.w))"
          - "!(verbReadings(next.w).some((r) => !finiteReading(r)) || adjectiveReadings(next.w).length)"
          - "!(!nounGender(w) && !nounGender(singular) && !plural)"
        return: >-
          !second
            ? true
            : ["de", "d'", "du", "des"].includes(second.w) || HOMO_DETERMINERS.has(second.w)
              ? false
              : !verbReadings(second.w).some((r) => r.slot === "Q")
        else: "false"
      # "a côté", "a moins que", "a peu près", "a l'exception de", "a bientôt.", "grâce a", "par
      # rapport a", "d'ici a": locutions where only the preposition fits. "Mary Quant a lancé": a
      # name.
      prepositionLocution:
        args: "ctx: DetectContext, before: FrenchToken[], after: FrenchToken[], end: number"
        let:
          next: after[0]
          second: after[1]
          b0: before[0]
          b1: before[1]
        return: >-
          AFTER_PREPOSITION.has(next.w)
            ? true
            : next.w === "l'" && second && ELIDED_AFTER.has(second.w)
              ? true
              : next.w === "moins" && (second?.w === "que" || second?.w === "qu'")
                ? true
                : next.w === "cause" && (second?.w === "de" || second?.w === "d'" || second?.w === "du")
                  ? true
                  : next.w === "peu" && second?.w === "près"
                    ? true
                    : FAREWELLS.has(next.w) && /^\s{0,8}(?:[.!?…,;]|$)/u.test(ctx.text.slice(next.end, next.end + 10))
                      ? /^\p{Ll}/u.test(ctx.text.slice(next.start, next.end)) && end <= next.start
                      : !b0
                        ? false
                        : /^\p{Lu}/u.test(ctx.text.slice(b0.start, b0.end)) && !sentenceStartsAt(ctx.text, b0.start)
                          ? false
                          : BEFORE_PREPOSITION.has(b0.w)
                            ? true
                            : (b0.w === "grâce" || b0.w === "grace") && (!b1 || !(b1.w in DETERMINER_GENDER))
                              ? true
                              : b0.w === "rapport" && b1?.w === "par"
                                ? true
                                : b0.w === "ici" && b1?.w === "d'"
      # "est supérieure", "sont identiques", "étant mariée": an adjective or a participle after
      # être, which "a" cannot follow.
      attributeBefore:
        args: "before: FrenchToken[]"
        let:
          adjective: before[0]
          verb: before[1]
        return: >-
          !!verb &&
          (verb.w === "étant" || verbReadings(verb.w).some((r) => finiteReading(r) && r.lemma === "être")) &&
          !nounGender(adjective.w) &&
          (adjectiveReadings(adjective.w).length > 0 ||
            /[ai]ble$/.test(adjective.w) ||
            verbReadings(adjective.w).some((r) => r.slot === "Q")) &&
          !verbReadings(adjective.w).some(finiteReading)
      # An adjective and nothing else: no noun, no finite verb.
      adjectiveOnly:
        args: "t: FrenchToken | undefined"
        return: "!!t && adjectiveReadings(t.w).length > 0 && !nounGender(t.w) && !verbReadings(t.w).some(finiteReading)"
      # A verb opening its sentence.
      openingVerb:
        args: "ctx: DetectContext, t: FrenchToken"
        return: sentenceStartsAt(ctx.text, t.start) && verbReadings(t.w).length > 0
      # "je pense a toi", "j'ai répondu a ta lettre", "A la fin": the preposition missing its
      # accent. "de 7 a 8.", "de 9 h a 17 h", "de 6 mois a 1 an": a range between numbers, closed
      # by the clause or a unit ("de 1989 a 13 disciplines" is avoir).
      aToGrave:
        args: "ctx: DetectContext, m: RegExpExecArray"
        type: RawFinding | null
        let:
          before: tokensBefore(ctx.text, m.index)
          after: tokensAfter(ctx.text, m.index + m[0].length, 2)
          next: after[0]
        when: '!(ctx.text[m.index + 1] === "-" || ctx.text[m.index - 1] === "-")'
        return: >-
          m[0] === "a" &&
          /(?<![\p{L}\p{N}])de[ \t ]+\d+[ \t ]*\p{L}*[ \t ]{1,8}$/u.test(ctx.text.slice(Math.max(0, m.index - 24), m.index)) &&
          A_RANGE_END.test(ctx.text.slice(m.index + 1, m.index + 24))
            ? homoFix(ctx, m, ["à"])
            : /^[ \t ]{1,8}\d/.test(ctx.text.slice(m.index + 1, m.index + 10)) && attributeBefore(before)
              ? homoFix(ctx, m, ["à"])
              : !next || next.hyphen
                ? null
                : aToGraveNext(ctx, m, before, after)
      # "prêtes a t'écouter", "a le faire": avoir takes no object pronoun and infinitive. A
      # capital "A" without its accent is tolerated typography: left alone. "elle a l'air
      # ravie": avoir l'air. "Venez-vous a la fête ?", "va-t-il a Paris": the verb already stands
      # before its subject. "a la fin, il part", "Alors, a ce soir": no subject before it in its
      # sentence; a text that opens on "a" may be a cut sentence: only after an end mark.
      # "légère a modérée.": a range between two adjectives that closes the clause. "une machine
      # a laver", "rien a faire": avoir never takes a bare infinitive; after a subject, "a" + an
      # infinitive in -er is as often a participle misspelt ("Sami a télécharger"): there only an
      # infinitive that sounds unlike its participle tells. "rien a faire", "beaucoup a
      # apprendre".
      aToGraveNext:
        args: "ctx: DetectContext, m: RegExpExecArray, before: FrenchToken[], after: FrenchToken[]"
        type: RawFinding | null
        let:
          next: after[0]
          previous: before[0]
          fix: '(context: FrenchToken | undefined) => homoFix(ctx, m, ["à"], { start: context?.start ?? m.index, end: next.end })'
          lead: ctx.text.slice(Math.max(0, m.index - 16), m.index)
        return: >-
          m[0] === "a" && CLITICS.has(next.w) && after[1] && plainInfinitive(after[1].w)
            ? fix(before[0])
            : m[0] === "A" || LATIN_A.has(next.w) || next.w === "t" || next.w === "t'"
              ? null
              : RELATIVE_LEQUEL.has(next.w)
                ? fix(undefined)
                : next.w === "l'" && after[1]?.w === "air"
                  ? null
                  : previous && ctx.text[previous.start - 1] === "-" && INVERTED_SUBJECTS.has(previous.w) && startsNounPhrase(ctx.text, next)
                    ? fix(previous)
                    : !previous &&
                        m[0] === "a" &&
                        /^\p{Ll}/u.test(ctx.text.slice(next.start, next.end)) &&
                        startsNounPhrase(ctx.text, next) &&
                        !plainParticiple(next.w) &&
                        (/[.!?…][ \t ]*$/u.test(lead) ||
                          /(?:^|[.!?…\n])[ \t ]*(?:alors|non|oui|bon|ok|bien|eh|ah|oh|ben|bref|enfin),[ \t ]*$/iu.test(lead))
                      ? fix(undefined)
                      : adjectiveOnly(previous) && adjectiveOnly(next) && /^[ \t ]*(?:[.!?;,)]|$)/u.test(ctx.text.slice(next.end, next.end + 9))
                        ? fix(previous)
                        : plainInfinitive(next.w) &&
                            next.w.length > 3 &&
                            ((previous &&
                              (HOMO_QUANTIFIERS.has(previous.w) ||
                                verbReadings(previous.w).some(
                                  (r) => r.slot === "I" || (finiteReading(r) && r.lemma !== "avoir" && !isVerbHomograph(previous.w)),
                                ))) ||
                              !next.w.endsWith("er"))
                          ? fix(previous)
                          : prepositionLocution(ctx, before, after, m.index + m[0].length)
                            ? fix(previous)
                            : !previous
                              ? null
                              : HOMO_QUANTIFIERS.has(previous.w) && plainInfinitive(next.w)
                                ? fix(previous)
                                : aToGraveClause(ctx, m, before, after, fix)
      # Past the clause's own subject clause ("ce qu'il pense a de l'importance") it may be the
      # verb; a "que" right after a verb opens an object clause instead ("je pense qu'il viendra
      # a"). "ce roman a vingt ans": "ce" before a noun is a determiner, not "ce qui", "ce doit".
      # "elle est contente a l'idée": an attribute adjective after être. "une boîte a outils",
      # "la râpe a fromage": a noun, then a bare noun avoir takes in no locution ("le chat a
      # faim", "la séance a lieu"). A name before it is the subject ("Maria a"), and only a noun
      # phrase may follow the preposition ("a et b", "a donc refusé" are the letter and the
      # verb). "Pensez a lui": a verb opening the sentence is no name.
      aToGraveClause:
        args: "ctx: DetectContext, m: RegExpExecArray, before: FrenchToken[], after: FrenchToken[], fix: TokenFix"
        type: RawFinding | null
        let:
          previous: before[0]
          next: after[0]
          window: tokensBefore(ctx.text, m.index, 30)
        when:
          - >-
            !window.some(
              (t, k) =>
                CLAUSE_SUBJECTS.has(t.w) &&
                !((window[k].w === "que" || window[k].w === "qu'") && !!window[k + 1] && onlyVerb(window[k + 1].w, finiteReading)) &&
                !(window[k].w === "ce" && !!window[k - 1] && !CLAUSE_SUBJECTS.has(window[k - 1].w) && !verbReadings(window[k - 1].w).some(finiteReading)))
          - "!(SUBJECT_PRONOUNS.has(previous.w) || CLITICS.has(previous.w))"
        return: >-
          attributeBefore(before) && startsNounPhrase(ctx.text, next)
            ? fix(previous)
            : bareNounAfterNoun(ctx.text, previous, next, after[1])
              ? fix(previous)
              : /^\p{Lu}/u.test(ctx.text.slice(previous.start, previous.end)) && !openingVerb(ctx, previous)
                ? null
                : !startsNounPhrase(ctx.text, next)
                  ? null
                  : aToGraveVerb(ctx, m, before, after, fix)
      # "j'ai peu d'argent a la fin", "il est a la gare", "il y a quelqu'un a la porte": être or
      # avoir right after its subject pronoun (past object pronouns and "ne") is the clause's
      # verb.
      pronounSubjectAt:
        args: "own: FrenchToken[], i: number"
        let:
          k: 'skipWhile(own, i + 1, (t) => CLITICS.has(t.w) || t.w === "ne" || t.w === "n''")'
          subject: own[k]
        return: >-
          !!subject && SUBJECT_PRONOUNS.has(subject.w) && subject.w !== "nous" && subject.w !== "vous"
            ? k === i + 1 || own.slice(i + 1, k).every((t) => t.w !== subject.w)
