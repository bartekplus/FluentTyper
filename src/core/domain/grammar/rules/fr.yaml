          - '!(!det || !["le", "la", "l''", "un", "une", "ce", "cet", "cette"].includes(det.w))'
          - "!(!isInflectedNoun(noun.w) || (verbReadings(noun.w).length && !isVerbHomograph(noun.w)))"
          - "!(before.length > 2 && !CLAUSE_SUBJECTS.has(before[2].w) && !HOMO_CONJUNCTIONS.has(before[2].w))"
          - '!(!word || /s$/.test(word.w) || !describesWord(word.w) || word.w.startsWith("demi"))'
