      surGraveToSur:
        args: "ctx: DetectContext, m: RegExpExecArray"
        type: RawFinding | null
        let:
          previous: tokensBefore(ctx.text, m.index, 2)[0]
          next: tokensAfter(ctx.text, m.index + m[0].length, 1)[0]
        when:
          - '!(!next || !HOMO_DETERMINERS.has(next.w) || next.w === "du" || next.w === "des")'
          - '!(!previous || ["coup", "bien", "pas", "si", "très", "trop", "assez", "aussi", "plus", "tout"].includes(previous.w))'
          - '!(homoAuxiliary(previous.w) || verbReadings(previous.w).some((r) => ["sembler", "paraître", "rester", "devenir", "sentir"].includes(r.lemma)))'
          - onlyVerb(previous.w, () => true)
        return: 'homoFix(ctx, m, ["sur"], { start: previous.start, end: next.end })'
      # "c'est sur on viendra", "c'est sur vous allez gagner": a clause after "c'est sûr"; "c'est
      # sur elle que" is the preposition in a cleft.
      clauseAfterSur:
        args: "after: FrenchToken[]"
        let:
          pronoun: after[0]
          verb: after[1]
        when: "!!pronoun && SUBJECT_PRONOUNS.has(pronoun.w)"
        return: '["je", "tu", "il", "on", "ils"].includes(pronoun.w) || (!!verb && onlyVerb(verb.w, finiteReading))'
        else: "false"
      # "la sur consommation": the prefix of a word written apart ("surconsommation").
      surPrefixed:
        args: "word: string"
        return: "isInflectedNoun(`sur${word}`) || verbReadings(`sur${word}`).length > 0 || isDictionaryCompound(`sur-${word}`)"
      # "il est sur d'arriver", "bien sur.": certain. "Bien sur." / "bien sur !": nothing for the
      # preposition to govern. "il est bien sur très grand": "bien sûr" before an adverb, a
      # pronoun or "que", where the preposition would need a noun phrase. "nous sommes surs", "en
      # êtes-vous surs ?", "nous nous sentions toujours surs": the preposition has no plural; only
      # "des pommes sures" (sour) follows a noun; "êtes-vous surs": the inverted subject after its
      # verb. "c'est peu sur.", "en est-il sur ?", "il n'est pas sur car": nothing after the
      # preposition. "C'est sur, on viendra", "c'est sur qu'il viendra": a clause or "que" after
      # "c'est sûr". "Vous pouvez bien sur avoir": "bien sûr" before an infinitive the
      # preposition never takes. "je suis sur qu'il viendra", "un endroit sur où dormir": the
      # preposition takes no clause. "tu peux bien sur le prendre": an object pronoun and its
      # verb after "bien sûr"; a verb that is also a noun ("tape bien sur la porte") may be the
      # preposition's noun. "un sur abri", "le plus sur moyen": the adjective between a
      # determiner and its noun. "il est sur d'arriver": être + sur + de + infinitive.
      surToSur:
        args: "ctx: DetectContext, m: RegExpExecArray"
        type: RawFinding | null
        let:
          before: tokensBefore(ctx.text, m.index, 2)
          after: tokensAfter(ctx.text, m.index + m[0].length, 2)
          rest: ctx.text.slice(m.index + m[0].length)
          fix: '() => homoFix(ctx, m, [m[0].replace("u", "û")])'
          next: after[0]
          words: tokensBefore(ctx.text, m.index, 5)
          k: words.findIndex((t) => !HOMO_ADVERBS.has(t.w) && !HOMO_DEGREE_ADVERBS.has(t.w))
          head: words[k]
          inverted: '!!head && SUBJECT_PRONOUNS.has(head.w) && ctx.text[head.start - 1] === "-" && !!words[k + 1]'
          ends: '/^[ \t]{0,4}(?:[.!?…:;,]|$|(?:car|mais|et certaine?s?)(?![\p{L}\p{M}]))/u.test(rest.slice(0, 8))'
          verb: after[1]
          det: 'before[0] && ["plus", "moins"].includes(before[0].w) ? before[1] : before[0]'
        return: >-
          before[0]?.w === "bien" && /^\s{0,8}(?:[.!?…]|$)/u.test(rest.slice(0, 10))
            ? fix()
            : before[0]?.w === "bien" && m[0].length === 3 && next && ["très", "pas", "que", "qu'", "il", "je", "on", "ils"].includes(next.w)
              ? fix()
              : /^(?:surs|sures)$/i.test(m[0])
                ? !head
                  ? null
                  : verbReadings(head.w).some((r) => LINKING_VERBS.has(r.lemma)) ||
                      (inverted && verbReadings(words[k + 1].w).some((r) => LINKING_VERBS.has(r.lemma)))
                    ? fix()
                    : !nounGender(head.w) && !nounGender(head.w.replace(/[sx]$/, "")) && !isInflectedNoun(head.w.replace(/[sx]$/, ""))
                      ? fix()
                      : null
                : ends && head && m[0].length === 3 &&
                    verbReadings((inverted ? words[k + 1] : head).w).some((r) => LINKING_VERBS.has(r.lemma) && typeof r.slot === "number")
                  ? fix()
                  : before[0]?.w === "est" &&
                      before[1]?.w === "c'" &&
                      (!next || clauseAfterSur(after) || next.w === "que" || next.w === "qu'" || ends)
                    ? fix()
                    : before[0]?.w === "bien" && next && verbReadings(next.w).some((r) => r.slot === "I" && r.lemma === next.w)
                      ? fix()
                      : m[0].length === 3 && next && ["que", "qu'", "où"].includes(next.w)
                        ? fix()
                        : before[0]?.w === "bien" &&
                            next &&
                            OBJECT_PRONOUNS_BEFORE_VERB.has(next.w) &&
                            verb &&
                            !isVerbHomograph(verb.w) &&
                            verbReadings(verb.w).some((r) => finiteReading(r) || r.slot === "I")
                          ? fix()
                          : det &&
                              ["un", "une", "le", "la", "les", "des", "ce", "cet", "cette", "ces"].includes(det.w) &&
                              next &&
                              (nounGender(next.w) || isInflectedNoun(next.w.replace(/[sx]$/, ""))) &&
                              !next.hyphen &&
                              !verbReadings(next.w).some((r) => r.slot === "I" && r.lemma === next.w) &&
                              !surPrefixed(next.w)
                            ? fix()
                            : before[0] &&
                                homoAuxiliary(before[0].w) &&
                                verbReadings(before[0].w).some((r) => r.lemma === "être") &&
                                (after[0]?.w === "de" || after[0]?.w === "d'") &&
                                after[1] &&
                                plainInfinitive(after[1].w)
                              ? fix()
                              : null
      # "il ce lève", "qui ce cache", "de ce placer", "en ce parlant": the reflexive pronoun. "Ce
      # sont répondu", "Ce sont-ils répondu ?": "sont" with a participle is reflexive. "Ce
      # promener est relaxant": an infinitive opening the sentence is reflexive. "Ce phénomène ce
      # transforme": a noun subject opening its clause, then its verb. An infinitive after a
      # preposition or a verb: "pour ce lancer", "il devrait ce placer"; "Pour ce faire," (to do
      # so) keeps its "ce", unless "faire" takes an infinitive or an attribute ("pour se faire
      # pardonner", "pour se faire belle"). "en ce parlant": a present participle. "qui ce
      # cache", "cela ce passe": after a subject pronoun a verb follows, never a noun; "qui ce
      # type pouvait être", "c'est qui ce type ?": a noun the verb or the question follows.
      ceToSe:
        args: "ctx: DetectContext, m: RegExpExecArray"
        type: RawFinding | null
        let:
          before: tokensBefore(ctx.text, m.index, 3)
          following: tokensAfter(ctx.text, m.index + m[0].length, 3)
          next: following[0]
          after: following[1]
          fix: '(from: FrenchToken | undefined) => homoFix(ctx, m, ["se"], { start: from?.start ?? m.index, end: next.end })'
          participle: 'next.hyphen && after && ["ils", "elles"].includes(after.w) ? following[2] : after'
          b0: before[0]
          b1: before[1]
          b2: before[2]
          subject: 'before[before[0]?.w === "ne" || before[0]?.w === "n''" ? 1 : 0]'
          previous: before[0]
          infinitive: >-
            verbReadings(next.w).some((r) => r.slot === "I" && r.lemma === next.w) &&
            !NOUN_INFINITIVES.has(next.w) &&
            !["lever", "coucher", "toucher", "parler", "devenir", "souvenir"].includes(next.w)
        when: "!!next"
        return: >-
          next.w === "sont" && (!before.length || HOMO_CONJUNCTIONS.has(before[0].w))
            ? participle && participleOnly(participle.w) && !isVerbHomograph(participle.w)
              ? fix(undefined)
              : null
            : next.hyphen
