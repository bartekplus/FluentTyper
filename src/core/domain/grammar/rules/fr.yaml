      # A prefix and its word written apart or with a hyphen: the dictionary spelling of the
      # compound ("co incidences" -> "coïncidences"). "anti-reflets", "auto-bronzant": many
      # hyphenated forms are accepted spellings; only learned prefixes that always close up lose
      # the hyphen. A capitalized prefix may be a name ("Nous and Co accompagne").
      - regex: "{{WORD_START}}(?<prefix>anti|auto|néo|géo|méga|mini|ultra|hyper|multi|psycho|franco|afro|vice|vidéo|micro|macro|post|co|cyber|extra|inter|intra|semi|pseudo|quasi|poly|télé|bio|éco|rétro|zig|anglo|germano|italo|hispano|gréco|judéo|sino|russo|austro|euro|sur|sous|contre)(?:[ \\t]+|-)(?<word>\\p{L}{3,}){{WORD_END}}"
        flags: giu
        scan: owned
        lookback: 1
        let:
          typed: m[0]
          lowerPrefix: prefix.toLowerCase()
          lowerWord: word.toLowerCase()
          hyphen: typed.includes("-")
          joined: "`${lowerPrefix}${lowerWord}`"
          hyphenated: "`${lowerPrefix}-${lowerWord}`"
          # "co incidences" -> "coïncidences": a vowel after "co" takes a diaeresis when joined.
          diaeresis: '`co${lowerWord[0] === "i" ? "ï" : "ë"}${lowerWord.slice(1)}`'
          dictionaryForm: >-
            hyphen
              ? CLOSING_PREFIXES.has(lowerPrefix) && !isFrenchWord(hyphenated) && isFrenchWord(joined) && isFrenchWord(lowerWord)
                ? joined
                : null
              : lowerPrefix === "sous" || lowerPrefix === "contre" || lowerPrefix === "vice"
                ? isFrenchWord(hyphenated)
                  ? hyphenated
                  : null
                : isFrenchWord(joined)
                  ? joined
                  : isFrenchWord(hyphenated)
                    ? hyphenated
                    : lowerPrefix === "co" && /^[ie]/.test(lowerWord) && isFrenchWord(diaeresis)
                      ? diaeresis
                      : null
          fixed: >-
            dictionaryForm ??
            (!hyphen &&
            prefix === lowerPrefix &&
            (isFrenchWord(lowerWord) || adjectiveReadings(lowerWord).length > 0) &&
            (NATIONALITY_PREFIXES.has(lowerPrefix) || (VOWEL_HYPHEN_PREFIXES.has(lowerPrefix) && /^[aeiouyéèêâîôûh]/.test(lowerWord)))
              ? hyphenated
              : null)
        when:
          - m.index >= ctx.from
          - '!(/^\p{Lu}/u.test(word) || ctx.dictionary.has(lowerWord) || namedExampleBefore(ctx.text, m.index))'
          - >-
            !PREPOSITION_PREFIXES.has(lowerPrefix) ||
            (!hyphen && !isNounLemma(lowerWord) && verbReadings(lowerWord).some((r) => r.slot === "Q" || r.slot === "I"))
          - "!!fixed"
        return: 'finding(frame.ruleId, "review_msg_closed_compound", m.index, m.index + typed.length, [carryCase(typed, fixed)])'
      # "un coffre fort", "les non voyants", "l'agro industrie": a compound the dictionary
      # hyphenates, written as two words after a determiner, or with a combining form in -o
      # ("agro", "anglo") that is no word of its own. "non voyants": the dictionary lists the
      # singular.
      - regex: "(?<![\\p{L}\\p{M}\\p{N}_-])(?<first>\\p{Ll}+)(?=[ \\t]{1,3}(?<second>\\p{Ll}+){{WORD_END}})"
        flags: gu
        scan: owned
        lookback: 1
        let:
          compound: >-
            isDictionaryCompound(`${first}-${second}`) ||
            isDictionaryCompound(`${first}-${second.replace(/(?<=..)[sx]$/, "")}`) ||
            isDictionaryCompound(`${first.replace(/(?<=..)[sx]$/, "")}-${second.replace(/(?<=..)[sx]$/, "")}`)
          previous: tokensBefore(ctx.text, m.index, 1)[0]
          gapStart: m.index + first.length
          secondStart: ctx.text.indexOf(second, gapStart)
        when:
          - m.index >= ctx.from
          - compound
          - "!(PREFIX_WORDS.has(first) || VERB_SECONDS.has(second))"
          - '!(verbReadings(second).some((r) => typeof r.slot === "number") && !isVerbHomograph(second))'
          - >-
            (/..o$/.test(first) && !isFrenchWord(first)) ||
            (!!previous && NOUN_PHRASE_OPENERS.has(previous.w) && spacedArticle(ctx, previous, first))
          - "!(namedExampleBefore(ctx.text, m.index) || ctx.dictionary.has(first))"
        return: 'finding(frame.ruleId, frame.messageKey, gapStart, secondStart, ["-"], { context: { start: m.index, end: secondStart + second.length } })'
      # "vio-loniste" -> "violoniste", "jour-nal" -> "journal": a word cut by a hyphen, where a part
      # is no word of its own and the joined form is one. "start-ups": the plural of a dictionary
      # compound.
      - regex: "{{WORD_START}}(?<first>\\p{Ll}[\\p{Ll}\\p{M}]*)-[ ]?(?<second>\\p{Ll}[\\p{Ll}\\p{M}]*){{WORD_END}}"
        flags: gu
        scan: owned
        lookback: 1
        let:
          joined: first + second
        when:
          - m.index >= ctx.from
          - "!(first.length < 2 || second.length < 2 || WELDED_PREFIXES.has(first))"
          - "!(knownWord(first) && knownWord(second))"
          - >-
            !(!knownWord(joined) ||
              isDictionaryCompound(`${first}-${second}`) ||
              isDictionaryCompound(`${first}-${second.replace(/[sx]$/, "")}`))
          - "!(ctx.dictionary.has(joined) || namedExampleBefore(ctx.text, m.index))"
        return: 'finding(frame.ruleId, "review_msg_split_word", m.index, m.index + m[0].length, [joined])'
      # "Aix en Provence", "Jean Marc", "le rez de chaussée": a name the dictionary hyphenates (its
      # case as listed) or a compound noun of three parts or more after a determiner. "Tout Paris
      # est à la fête": a capitalized common word opening a sentence.
      - regex: "{{WORD_START}}\\p{L}+(?:['’]\\p{L}+)?(?=[ \\t]{1,8}\\p{L}|-\\p{L})"
        flags: gu
        scan: owned
        lookback: 1
        let:
          lower: m[0].toLowerCase()
          opening: '!/[\p{L},;(]\s{0,8}$/u.test(ctx.text.slice(Math.max(0, m.index - 9), m.index))'
          compound: compoundsStartingWith(m[0].replaceAll("’", "'")).find((c) => compoundHit(ctx.text, c, m.index) !== null)
          hit: "compound ? compoundHit(ctx.text, compound, m.index) : null"
          previous: tokensBefore(ctx.text, m.index, 1)[0]
        when:
          - m.index >= ctx.from
          - "!(lower !== m[0] && opening && isFrenchWord(lower))"
          - "!!compound && !!hit"
          - "!(/^\\p{Ll}/u.test(compound) && !BARE_COMPOUNDS.has(compound) && (!previous || !NOUN_PHRASE_OPENERS.has(previous.w)))"
          - "!(namedExampleBefore(ctx.text, m.index) || ctx.dictionary.has(compound.toLowerCase()))"
        return: >-
          finding(frame.ruleId, frame.messageKey, m.index, m.index + hit[0].length, [compound.replaceAll("'", /’/.test(hit[0]) ? "’" : "'")])
  - id: fr.subjectVerbAgreement
    checks: [frenchSubjectVerbAgreement]
    style: match
    message: review_msg_fr_subject_verb
    frames:
      # "qu'il", "lorsqu'on": an elided conjunction before a pronoun that is always a subject.
      - regex: "(?<=(?<![\\p{L}\\p{M}])(?:qu|lorsqu|puisqu|quoiqu)['’])(?:il|on|ils)(?![\\p{L}\\p{M}\\p{N}_-])|{{WORD_START}}(?:(?:je|tu|il|elle|on|nous|vous|ils|elles|ça|cela|ceci)(?![\\p{L}\\p{M}\\p{N}_-])|personne(?=[ \\t]{1,8}n(?:e\\b|['’]))|ce(?:lui|lle|ux|lles)-(?:ci|là)(?![\\p{L}\\p{M}\\p{N}_-])|j['’](?=\\p{L}))"
        flags: giu
        scan: owned
        lookback: 1
        fixer: pronounSubject
      # A subject noun: its verb's agreement, or the verb of an object relative clause.
      - regex: "{{WORD_START}}(?:l['’](?=\\p{L})|(?:le|la|un|une|ce|cet|cette|mon|ton|son|ma|ta|sa|notre|votre|chaque|les|des|ces|mes|tes|ses|nos|vos|leurs|plusieurs|moi|toi|lui|nous|vous|eux|ceux|celles|celui|celle|deux|trois|quatre|cinq|six|sept|huit|neuf|dix|onze|douze|treize|quatorze|quinze|seize|vingt|trente|quarante|cinquante|soixante|cent|mille|plusieurs|quelques){{WORD_END}}|(?<![\\p{N},.][ \\u00a0]?)\\d+(?=[ \\u00a0]+\\p{L}))"
        flags: giu
        scan: owned
        lookback: 1
        fixer: nounSubjectOrRelative
      # "cet homme qui travail", "l'ordinateur qui crash": a noun where the relative's verb goes.
      - regex: "{{WORD_START}}qui(?=[ \\t])"
        flags: giu
        scan: owned
        lookback: 1
        fixer: nounAfterQui
      # Quantities whose verb agrees with their plural complement: "beaucoup de gens pensent", "la
      # plupart des élèves travaillent", "de nombreux élèves pensent".
      - regex: "{{WORD_START}}(?:(?:beaucoup|peu|trop|tant|assez|énormément|combien|la plupart|bon nombre|de plus en plus|de moins en moins)[ \\t]{1,8}(?:des?{{WORD_END}}|d['’])|de(?=[ \\t]))"
        flags: giu
        scan: owned
        lookback: 1
        fixer: quantitySubject
      # "La plupart pense" -> "pensent": "la plupart" alone stands for a plural subject.
      - regex: "{{WORD_START}}la[ \\t]+plupart{{WORD_END}}"
        flags: giu
        scan: owned
        lookback: 1
        fixer: pluralPlupart
      # "Dominique peux venir", "Sam et Marie comprit": a name opening its clause and its verb.
      - regex: "{{WORD_START}}\\p{Lu}\\p{Ll}+(?:-\\p{Lu}\\p{Ll}+)?{{WORD_END}}"
        flags: gu
        scan: owned
        lookback: 1
        fixer: nameSubject
      # Words after which the subject may follow its verb: "là où vivent les loups", "lorsque
      # s'annonce un orage", "le livre que lisent les enfants".
      - regex: "{{WORD_START}}(?:(?:où|lorsque|quand|que)(?=[ \\t])|(?:lorsqu|qu)['’](?=\\p{L}))"
        flags: giu
        scan: owned
        lookback: 1
        fixer: invertedSubject
  - id: fr.elision
    checks: [frenchElision]
    style: match
    message: review_msg_fr_elision
    # Elision: "le", "de", "que", "je", "ne", "me", "te", "se", "la" drop their vowel before a word
    # that starts with a vowel ("l'arbre", "qu'il"), written with an apostrophe and no space.
    sets:
      # Vowel-initial words that refuse elision ("le oui", "le onze", "la une").
      NO_ELISION: [oui, onze, onzième, onzièmes, ouistiti, uhlan, ululement]
      # Words after which an elided form reads differently.
      NOT_A_WORD_AFTER: [à, a, ou, où, et, est, en, au, aux]
      ELISION_ARTICLES: [le, la, les, un, une, du, des, ce]
      NOT_AFTER_ARTICLE:
        [il, ils, elle, elles, "on", aussi, encore, avec, ici, ensuite, alors, après, aujourd'hui]
      # Letters a text may use as variables ("si c divise a, alors c est premier").
      VARIABLE_LETTERS: [c, d, l, m, n, s, t]
      # Conjunctions ending in "que" elide only before these.
      QUE_COMPOUNDS: [lorsque, puisque, quoique]
      BEFORE_QUE_COMPOUND: [il, ils, elle, elles, on, un, une]
      # What may follow each elided word: s' only "il(s)", "en", "y", "est"; n', m', t', j' a verb
      # form or "en"/"y"; l', d' and qu' a noun, a verb or a pronoun.
      PRONOUN_AFTER: [en, y]
      # Function words the verb and noun lists leave out that begin like an elision: "ma" is no
      # "m'a", "quelle" no "qu'elle", "davantage" no "d'avantage".
      GLUED_LOOKALIKES:
        [
          ma,
          ta,
          sa,
          mon,
          ton,
          son,
          mes,
          tes,
          ses,
          les,
          des,
          dès,
          lui,
          leur,
          leurs,
          là,
          quel,
          quelle,
          quels,
          quelles,
          quoi,
          qui,
          quand,
          quant,
          quelque,
          quelques,
          quiconque,
          davantage,
          dont,
          dans,
          donc,
          devant,
          depuis,
          derrière,
          déjà,
          demain,
          dedans,
          dehors,
          jamais,
          jusque,
          jusqu,
          lorsque,
          loin,
          longtemps,
          maintenant,
          moins,
          même,
          mêmes,
          malgré,
          mais,
          ni,
          non,
          nous,
          toujours,
          tout,
          toute,
          tous,
          toutes,
          trop,
          très,
          tard,
          tôt,
          tant,
          selon,
          sans,
          sous,
          sur,
          si,
          soit,
          sauf,
          seulement,
          souvent,
          lequel,
          laquelle,
          lesquels,
          lesquelles,
          duquel,
          desquels,
          auquel,
          le,
          la,
          de,
          du,
          ne,
          me,
          te,
          se,
          ce,
          je,
          tu,
          il,
          elle,
          "on",
          ils,
          elles,
          notre,
          votre,
          nos,
          vos,
          mien,
          tien,
          sien,
          tandis,
          tantôt,
          dorénavant,
          désormais,
          jadis,
          lors,
        ]
      S_AFTER: [il, ils, en, y, est, était]
      D_AFTER: [un, une, en, où, autres, abord, accord, ailleurs]
      QU_AFTER:
        [
          il,
          ils,
          elle,
          elles,
          "on",
          un,
          une,
          en,
          aucun,
          aucune,
          avec,
          à,
          au,
          aux,
          ont,
          ici,
          alors,
          ainsi,
          après,
          avant,
          entre,
        ]
      SIL_DETERMINERS: [le, les, un, des, du, au, aux, ce, ces, son, ses, mon, ton, leur]
      SIL_CLITICS: [ne, n', te, t', vous, nous, me, m', le, la, les, l', lui, leur, "y", en, se, s']
      SINGULAR_MASCULINE: [un, le, ce, cet, mon, ton, son, notre, votre, leur, du, au]
    maps:
      # The letter a word elides to: "je" -> "j", "que" -> "qu", "la" -> "l".
      ELIDED:
        {
          je: j,
          me: m,
          te: t,
          se: s,
          le: l,
          la: l,
          ne: n,
          de: d,
          que: qu,
          lorsque: lorsqu,
          puisque: puisqu,
          quoique: quoiqu,
        }
      # The full words an elided letter stands for: "j'" -> "je"; "l'" is "le" or "la".
      FULL_FORM: { j: je, d: de, m: me, t: te, s: se, n: ne, qu: que }
      # Masculine singular forms with a second form before a vowel: "cet arbre", "un vieil homme",
      # "un bel été", "un nouvel ami".
      LIAISON_FORMS: { ce: cet, vieux: vieil, beau: bel, nouveau: nouvel, fou: fol, mou: mol }
    defs:
      ELISION_VOWEL: /^[aeiouâàäéèêëîïôöûùüœæ]/i
      apostropheNear:
        args: "ctx: DetectContext, index: number"
        let:
          nearby: ctx.text.slice(Math.max(0, index - 300), index + 300)
        return: 'nearby.includes("’") && !nearby.includes("''") ? "’" : "''"'
      # "sil vient", "sil vous plaît": the noun "sil" (a clay) only after a determiner and never
      # before a verb or a pronoun the way "s'il" is.
      silIsElided:
        args: "ctx: DetectContext, m: RegExpExecArray"
        let:
          before: tokensBefore(ctx.text, m.index, 1)[0]
          next: tokensAfter(ctx.text, m.index + m[0].length, 1)[0]
        when:
          - "!(before && SIL_DETERMINERS.has(before.w))"
          - "!!next"
        return: >-
          SIL_CLITICS.has(next.w) || ["est", "a", "fait", "faut"].includes(next.w) ||
          (hasPerson(finitePersons(next.w), IL + ILS) && !isVerbHomograph(next.w))
        else: "false"
    frames:
      # "jarrive", "sil", "nen", "dun": an elided word glued to the next without its apostrophe.
      - regex: "{{WORD_START}}(?:[cCjJsSnNmMtTdDlL]|[qQ]u)\\p{Ll}+{{WORD_END}}"
        flags: gu
        scan: owned
        lookback: 1
        let:
          typed: m[0]
          word: typed.toLowerCase()
          sil: '(word === "sil" || word === "sils") && silIsElided(ctx, m)'
          letter: 'word.startsWith("qu") ? "qu" : word[0]'
          rest: word.slice(letter.length)
          verb: 'verbReadings(rest).some((r) => typeof r.slot === "number")'
          fits: >-
            letter === "s"
              ? S_AFTER.has(rest)
              : letter === "j"
                ? PRONOUN_AFTER.has(rest) || hasPerson(finitePersons(rest), JE)
                : letter === "n" || letter === "m" || letter === "t"
                  ? PRONOUN_AFTER.has(rest) || verb
                  : letter === "d"
                    ? D_AFTER.has(rest) || isInflectedNoun(rest)
                    : letter === "qu"
                      ? QU_AFTER.has(rest)
                      : letter === "c"
                        ? rest === "en"
                        : letter === "l"
                          ? rest.length > 2 && (isNounLemma(rest) || (verb && rest.length > 3))
                          : false
          next: tokensAfter(ctx.text, m.index + typed.length, 1)[0]
        when:
          - m.index >= ctx.from
          - "!(GLUED_LOOKALIKES.has(word) || ctx.dictionary.has(word) || (!sil && isFrenchWord(word)))"
          # "nait", "connait": the 1990 spelling of a word with a circumflex.
          - '!(!sil && isFrenchWord(word.replace(/i(?=t$)/, "î").replace(/u(?=t$)/, "û")))'
          - "!(adjectiveReadings(word).length || namedExampleBefore(ctx.text, m.index))"
          # "Sil vient": a capital only at a sentence start; other capitals are names.
          - '!(/^\p{Lu}/u.test(typed) && !SENTENCE_START.test(ctx.text.slice(Math.max(0, m.index - 4), m.index)))'
          - '!/\p{Lu}/u.test(typed.slice(1))'
          # "Denis", "Léon": a capitalized d or l word is a name sooner than "D'enis".
          - '!((letter === "d" || letter === "l") && typed !== word)'
          - '!(rest.length < 1 || (!ELISION_VOWEL.test(rest) && !rest.startsWith("h")))'
          - fits
          # "nen fait", "den parler": "en" and "y" glued to an elided word come before a verb
          # ("the den is dark" is English).
          - "!PRONOUN_AFTER.has(rest) || (!!next && verbReadings(next.w).length > 0)"
        return: >-
          finding(frame.ruleId, frame.messageKey, m.index, m.index + typed.length, [
            typed.slice(0, letter.length) + apostropheNear(ctx, m.index) + typed.slice(letter.length),
          ])
      # "je aime", "que il", "le arbre": the full word before a vowel.
      - regex: "{{WORD_START}}(?<word>je|me|te|se|le|la|ne|de|que|lorsque|puisque|quoique)(?=(?<space>[ \\t]+)(?<next>\\p{L}[\\p{L}\\p{M}]*){{WORD_END}})"
        flags: giu
        scan: owned
        lookback: 1
        let:
          lower: word.toLowerCase()
          nextLower: next.toLowerCase()
          # "le ne explétif", "5.000 me": the word named, or a unit.
          previous: tokensBefore(ctx.text, m.index, 1)[0]
          end: m.index + word.length + space.length + next.length
        when:
          - m.index >= ctx.from
          # "je y vais" -> "j'y": the pronoun "y" elides like a vowel.
          - '!((!ELISION_VOWEL.test(next) && nextLower !== "y") || NO_ELISION.has(nextLower))'
          - "!(QUE_COMPOUNDS.has(lower) && !BEFORE_QUE_COMPOUND.has(nextLower))"
          - '!(NOT_A_WORD_AFTER.has(nextLower) && !(lower === "que" && nextLower === "à"))'
          # Names, titles and foreign words ("de Autant en emporte le vent") keep their spelling,
          # and so does a capitalized "Me"/"Se" inside a sentence ("Kiss Me Once", "Macintosh SE").
          - '!((next.length < 2 && nextLower !== "y" && nextLower !== "à") || /\p{Lu}/u.test(next))'
          # "de also known as", "que ab est": a foreign word or a variable keeps the full form.
          - isFrenchWord(nextLower)
          - '!(/^\p{Lu}/u.test(word) && !SENTENCE_START.test(ctx.text.slice(Math.max(0, m.index - 4), m.index)))'
          - "!(previous && ELISION_ARTICLES.has(previous.w))"
          # "Dois je y aller ?": an inverted "je" (its hyphen missing) never elides.
          - '!(lower === "je" && previous && hasPerson(finitePersons(previous.w), JE))'
          - '!/\d\s*$/.test(ctx.text.slice(Math.max(0, m.index - 3), m.index))'
          # "Et la il est", "la aussi": "là" missing its accent, not the article.
          - '!(lower === "la" && NOT_AFTER_ARTICLE.has(nextLower))'
          # "de un à dix": a number in a range.
          - '!((nextLower === "un" || nextLower === "une") && /^[ \t ]{1,8}(?:à|a)(?=\s|$)|^[ \t ]{0,8}\d/u.test(ctx.text.slice(end, end + 12)))'
          # "la une", "le un": the noun "une" or the numeral after an article.
          - '!((lower === "la" || lower === "le") && (nextLower === "un" || nextLower === "une"))'
          - "!(ctx.dictionary.has(lower) || namedExampleBefore(ctx.text, m.index))"
        return: "finding(frame.ruleId, frame.messageKey, m.index, end, [carryCase(word, ELIDED[lower]) + apostropheNear(ctx, m.index) + next])"
      # "l arbre", "qu il", "d’ enfants": the apostrophe missing, or followed by a space.
      - regex: "(?<![\\p{L}\\p{M}\\p{N}_'’.-])(?<letter>[cdjlmnst]|qu)(?:(?<mark>[ \\t]*['’][ \\t]+|[ \\t]+['’][ \\t]*)|[ \\t]+)(?<next>\\p{L}[\\p{L}\\p{M}]*){{WORD_END}}"
        flags: giu
        scan: owned
        lookback: 1
        let:
          before: ctx.text.slice(Math.max(0, m.index - 3), m.index)
          # "n y arrive", "j y vais": the pronoun "y" elides like a vowel.
          y: 'next.toLowerCase() === "y" && /^[jmnt]$/i.test(letter)'
        when:
          - m.index >= ctx.from
          # "a, b, c", "M. J Dupont", "2 l eau": letters, initials and units. A comma after a word
          # ("Alors, c est") still opens a clause; the list check is below.
          - '!(/\d[\s,]*$/.test(before) || /^\p{Lu}/u.test(next))'
          - '!!mark || !(/^\p{Lu}/u.test(letter) && !/(?:^|[.!?]\s*)$/.test(before))'
          # "l a u r e": a word spelled out; "la lettre l est": the letter named.
          - '!!mark || !/^\p{L}[ \t]+\p{L}(?![\p{L}''’])/u.test(ctx.text.slice(m.index + m[0].length - next.length))'
          - '!!mark || !/\blettres?[ \t]+$/iu.test(ctx.text.slice(Math.max(0, m.index - 10), m.index))'
          # "s" only elides "si" before "il(s)".
          - '!!mark || !(letter.toLowerCase() === "s" && !/^(?:ils?|en|y)$/.test(next))'
          - "!!mark || !(!ELISION_VOWEL.test(next) && !/^h/.test(next) && !y)"
          # A single letter before a word may be a variable or a list item ("l ensemble L").
          - '!!mark || !/^\s*[,;:]/.test(ctx.text.slice(m.index + m[0].length))'
          - '!!mark || !["et", "ou", "avec", "par", "entier"].includes(next.toLowerCase())'
          # "les valeurs a, b et c en", "la fonction c a été": letters in a list or as names.
          - '!!mark || !/(?<![\p{L}\p{N}])\p{L}\s*(?:,|\bet|\bou)\s*$/u.test(ctx.text.slice(Math.max(0, m.index - 8), m.index))'
          - '!!mark || !(letter === "c" && next.toLowerCase() === "a")'
          # "a t il", "aurai t elle": the euphonic t of an inversion wants hyphens, not "t'il".
          - "!!mark || !(/^t$/i.test(letter) && /^(?:il|elle|on|ils|elles)$/i.test(next))"
          - >-
            !!mark || !VARIABLE_LETTERS.has(letter) ||
            (ctx.text.slice(Math.max(0, m.index - 200), m.index + 200)
              .match(new RegExp(`(?<![\\p{L}\\p{N}'’-])${letter}(?![\\p{L}\\p{N}'’-])`, "gu")) ?? []).length <= 1
          # "n' pas": an apostrophe before a consonant has lost a word, not a space.
          - "!mark || ELISION_VOWEL.test(next) || /^h/i.test(next)"
          - "!namedExampleBefore(ctx.text, m.index)"
        return: "finding(frame.ruleId, frame.messageKey, m.index, m.index + m[0].length, [letter + (mark?.trim() || apostropheNear(ctx, m.index)) + next])"
      # "ce arbre" -> "cet", "un vieux ami" -> "vieil": a masculine singular noun or adjective that
      # starts with a vowel or a mute h.
      - regex: "{{WORD_START}}(?<word>ce|vieux|beau|nouveau|fou|mou)[ \\t\\u00a0]+(?<next>\\p{L}[\\p{L}\\p{M}]*)(?![\\p{L}\\p{M}\\p{N}_'’])"
        flags: giu
        scan: owned
        lookback: 1
        let:
          lower: word.toLowerCase()
          previous: tokensBefore(ctx.text, m.index, 1)[0]
        when:
          - m.index >= ctx.from
          - "/^[aeiouâàäéèêëîïôöûùüœæh]/.test(next) && !NO_ELISION.has(next)"
          - '!(next.startsWith("h") && hAspire(next))'
          # "homme", "état", or a masculine form that inflects ("ami", "ancien").
          - '(nounGender(next) === "m" || adjectiveReadings(next).some((r) => r.slot === "ms")) && isNounLemma(next)'
          # "ce est", "ce a été": a verb after the pronoun "ce".
          - '!(verbReadings(next).some((r) => typeof r.slot === "number") && !isVerbHomograph(next))'
          - 'lower === "ce" || (!!previous && SINGULAR_MASCULINE.has(previous.w))'
          - "!(ctx.dictionary.has(lower) || namedExampleBefore(ctx.text, m.index))"
        return: "finding(frame.ruleId, frame.messageKey, m.index, m.index + word.length, [carryCase(word, LIAISON_FORMS[lower])])"
      # "l'hibou", "j'hurle", "l'oui": an elision before a word that refuses it; "l'femme": the
      # article elided before a consonant.
      - regex: "{{WORD_START}}(?<letter>[jJdDlLmMtTsSnN]|[qQ]u)['’](?<next>\\p{L}[\\p{L}\\p{M}]*){{WORD_END}}"
        flags: gu
        scan: owned
        lookback: 1
        let:
          lower: next.toLowerCase()
          # "j'vais", "d'la": elided before a consonant, other words write speech on purpose.
          consonant: /^[bcdfgjklmnpqrstvwxzç]/.test(lower) && /^l$/i.test(letter)
          key: letter.toLowerCase()
          singular: "/[sx]$/.test(lower) && !isNounLemma(lower) ? lower.slice(0, -1) : lower"
          gender: 'key === "l" ? (nounGender(singular) ?? adjectiveReadings(lower).find((r) => r.slot.endsWith("s"))?.slot[0]) : undefined'
          full: 'key === "l" ? (gender ? (gender === "f" ? "la" : "le") : undefined) : FULL_FORM[key]'
        when:
          - m.index >= ctx.from
          - "!(next !== lower || next.length < 2 || ctx.dictionary.has(lower))"
          - '!(!consonant && !NO_ELISION.has(lower) && !(lower.startsWith("h") && hAspire(lower)))'
          - "!(!isFrenchWord(lower) || namedExampleBefore(ctx.text, m.index))"
          - "!!full"
        return: "finding(frame.ruleId, frame.messageKey, m.index, m.index + m[0].length, [`${carryCase(letter, full)} ${next}`])"
  - id: fr.dates
    checks: [frenchDates]
    style: match
    message: review_msg_fr_date
    # Dates the calendar rules out: a day past the month's end ("31 septembre", "29 février 2023")
    # and a weekday that contradicts a full date ("vendredi 28 août 2014" was a Thursday). A
    # weekday before a date with no year is checked with the Review clock.
    defs:
      FRENCH_MONTHS: >-
        [["janvier"], ["février", "fevrier"], ["mars"], ["avril"], ["mai"], ["juin"], ["juillet"],
        ["août", "aout"], ["septembre"], ["octobre"], ["novembre"], ["décembre", "decembre"]]
      FRENCH_WEEKDAYS: '["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"]'
      # A label that makes the next number a code: "dossier n° 12/34/2020", "réf. 31/13/2020".
      # "n° 41 avril 2023", "tome 52 mars": an issue or volume number before a month name.
      DATE_CODE_LABEL: '/(?:^|[\s(])(?:n[°o]\.?|num\.?|numéro|#|réf\.?|code|dossier|tome|vol\.?|volume)\s*:?\s{0,8}$/iu'
      # "le", "du", "au", "né" or "née" before a date, also before emphasis: "le **32.04.2020**".
      DATED_BEFORE: '/(?:^|[^\p{L}])(?:le|du|au|né|née)[ \t]+[*_~]{0,3}$/iu'
      DATE_PLURAL_BEFORE: '/(?:^|[^\p{L}])(?:les|des|ces|mes|tes|ses|nos|vos|leurs)[ \t]+$/iu'
      frenchMonthIndex:
        args: "month: string"
        return: '/^\d+$/.test(month) ? Number(month) - 1 : FRENCH_MONTHS.findIndex((names) => names.includes(month.toLowerCase()))'
      # A day or month no calendar has ("32 janvier", "11/50/2014"): flagged, nothing to offer.
      impossibleFrenchDate:
        args: "m: RegExpExecArray"
        type: RawFinding
        return: >-
          ({
            ruleId: "frenchDates",
            messageKey: "review_msg_fr_date",
            range: {
              start: Math.min(m.indices!.groups!.day[0], m.index + (m.groups!.weekday?.length ?? 0)),
              end: m.index + m[0].length,
            },
            alternatives: [],
            warningOnly: true,
          })
      # True when the match is a full date that needs no cue word: "aura lieu 32 janvier 2020",
      # "aura lieu 32/04/2020". A month name makes it a date; an all-number date needs a slash
      # and a four-digit year, with both parts near a day or a month. "1.45.2020" (a version),
      # "3-45-2020" (a score or a code) and "les 45 janvier" still need "le", "du" or "au".
      fullFrenchDate:
        args: "ctx: DetectContext, m: RegExpExecArray"
        let:
          day: m.groups!.day
          month: m.groups!.month
          year: m.groups!.year
          before: ctx.text.slice(Math.max(0, m.index - 16), m.index)
        return: >-
          !/^\d+$/.test(month)
            ? day.length <= 2 && !DATE_PLURAL_BEFORE.test(before) && !DATE_CODE_LABEL.test(before)
            : (m.groups!.sep ?? "/") === "/" &&
              year?.length === 4 &&
              Number(day) <= 39 &&
              Number(month) <= 39 &&
              !DATE_CODE_LABEL.test(before)
      # "lundi 7 octobre" with no year: the weekday of each year it can mean, or the nearest day.
      frenchWeekdayNoYear:
        args: "ctx: DetectContext, m: RegExpExecArray, month: number, day: number"
        type: RawFinding | null
        let:
          weekday: m.groups!.weekday
          years: yearsFor(month, day, contextYear(ctx.text, m.index, ctx.lang))
          weekdays: "[...new Set(years.map((y) => weekdayOf(y, month, day)))]"
          typed: FRENCH_WEEKDAYS.indexOf(weekday.toLowerCase())
          dayStart: m.indices!.groups!.day[0]
          dayEnd: m.indices!.groups!.day[1]
          between: ctx.text.slice(m.index + weekday.length, dayStart)
          near: nearestDayOn(years[0], month, day, typed)
        when: years.length > 0 && !weekdays.includes(typed)
        return: >-
          finding("frenchDates", "review_msg_weekday_no_year", m.index, dayEnd,
            [
              ...weekdays.map((w) => `${carryCase(weekday, FRENCH_WEEKDAYS[w])}${between}${m.groups!.day}`),
              ...(near === null ? [] : [`${weekday}${between}${near}`]),
            ],
            { requiresChoice: true, context: { start: m.index, end: m.index + m[0].length } })
      # A date whose day and month exist: a day past the month's end, or a wrong weekday.
      possibleFrenchDate:
        args: "ctx: DetectContext, m: RegExpExecArray, monthNumber: number, dayNumber: number"
        type: RawFinding | null
        let:
          weekday: m.groups!.weekday
          day: m.groups!.day
          year: m.groups!.year
          # A two-digit year leaves leap years open.
          yearNumber: "year && year.length === 4 ? Number(year) : undefined"
          dayStart: m.indices!.groups!.day[0]
          last: daysInMonth(monthNumber + 1, yearNumber)
          choices: 'monthNumber === 1 && yearNumber === undefined ? ["28", "29"] : [String(last)]'
        when: "!!dayNumber"
        return: >-
          dayNumber > last
            ? finding("frenchDates", "review_msg_fr_date", dayStart, dayStart + day.length, choices, {
                context: { start: m.index, end: m.index + m[0].length },
                ...(choices.length > 1 ? { requiresChoice: true as const } : {}),
              })
            : !weekday || (year && yearNumber === undefined)
              ? null
              : yearNumber === undefined
                ? frenchWeekdayNoYear(ctx, m, monthNumber + 1, dayNumber)
                : FRENCH_WEEKDAYS[weekdayOf(yearNumber, monthNumber + 1, dayNumber)] === weekday.toLowerCase()
                  ? null
                  : finding("frenchDates", "review_msg_fr_date", m.index, m.index + weekday.length,
                      [carryCase(weekday, FRENCH_WEEKDAYS[weekdayOf(yearNumber, monthNumber + 1, dayNumber)])],
                      { context: { start: m.index, end: m.index + m[0].length } })
      checkFrenchDate:
        args: "ctx: DetectContext, m: RegExpExecArray"
        type: RawFinding | null
        let:
          day: m.groups!.day
          month: m.groups!.month
          year: m.groups!.year
          monthNumber: frenchMonthIndex(month)
          dayNumber: Number(day)
          # "le 300 janvier" is a slip for a day; "les 300 janvier" or "1500 mai" are other numbers.
          dated: DATED_BEFORE.test(ctx.text.slice(Math.max(0, m.index - 11), m.index))
          numeric: /^\d+$/.test(month)
          # A zero day or month is a wrong date only with a four-digit year: "le 1/0" is a score.
          # A month name after "le", "du" or "au" makes it a date with no year: "le 0 avril".
          zero: dayNumber === 0 || (numeric && Number(month) === 0)
          # "01/31/2014" reads as a month-first date: only a pair impossible both ways is flagged.
          swapped: numeric && Number(month) >= 1 && Number(month) <= 31 && dayNumber >= 1 && dayNumber <= 12
        when:
          - "!namedExampleBefore(ctx.text, m.index)"
          - "!(day.length > 2 && (!dated || numeric))"
          - "!(zero && year?.length !== 4 && (numeric || !dated))"
        return: >-
          monthNumber < 0 || monthNumber > 11 || dayNumber > 31 || zero
            ? (dated || fullFrenchDate(ctx, m)) && !swapped
              ? impossibleFrenchDate(m)
              : null
            : possibleFrenchDate(ctx, m, monthNumber, dayNumber)
    frames:
      # "vendredi 28 août 2014", "le 31 septembre", "1er mars", "le 32 janvier"
      - regex: "{{DATE_START}}{{WEEKDAY}}(?<day>\\d{1,4})(?:er)?[ \\t]{0,8}[ \\t/-][ \\t]{0,8}(?<month>{{MONTH_NAMES}})(?:[ \\t/-]{1,8}(?<year>[0-9]{4}))?{{DATE_END}}"
        flags: dgiu
        scan: owned
        lookback: 1
        when: m.index >= ctx.from
        return: checkFrenchDate(ctx, m)
      # "28/08/2014", "31-09-1969", "31.11.89", "28/août/2014"
      - regex: "{{DATE_START}}{{WEEKDAY}}(?<day>\\d{1,4})(?<sep>[/.-])(?<month>\\d{1,2}|{{MONTH_NAMES}})\\k<sep>(?<year>[0-9]{4}|\\d{2}){{DATE_END}}"
        flags: dgiu
        scan: owned
        lookback: 1
        when: m.index >= ctx.from
        return: checkFrenchDate(ctx, m)
      # "le 31/04", "née le 30.02": a day and a month after "le" or "du".
      - regex: "(?<={{DATE_START}}(?:le|du|au)[ \\t]{1,8}[*_~]{0,3})(?<day>\\d{1,4})(?<sep>[/.])(?<month>\\d{1,2})(?![\\p{L}\\p{N}_/]|[.,/]\\d)"
        flags: dgiu
        scan: owned
        lookback: 1
        when: m.index >= ctx.from
        return: checkFrenchDate(ctx, m)
      # "vendredi 2014/08/28"
      - regex: "{{DATE_START}}{{WEEKDAY}}(?<year>[0-9]{4})\\/(?<month>\\d{1,2})\\/(?<day>\\d{1,2}){{DATE_END}}"
        flags: dgiu
        scan: owned
        lookback: 1
        when: m.index >= ctx.from
        return: checkFrenchDate(ctx, m)
  - id: fr.isoDates
    checks: [frenchDates]
    style: match
    message: review_msg_fr_date
    frames:
      # An ISO date that no calendar has ("2025-02-30", "2023-02-29"). The year first makes the
      # form clear in each language. A fourth numeric part before or after ("1-2025-02-30",
      # "2025-02-30-7", "2025-02-30.1") makes it an ID, not a date. Arabic-Indic digits count too
      # ("٢٠٢٥-٠٢-٣٠"). Markdown emphasis around the date is not a word ("_2025-02-30_"); an
      # underscore glued to a word is ("build_2025-02-30_x"). The match start owns the match.
      - regex: "{{ISO_DATE}}"
        flags: gdu
        owner: none
        let:
          range: invalidIsoDate(m, ctx)
        when: range
        return: "({ ruleId: frame.ruleId, messageKey: frame.messageKey, range, alternatives: [], warningOnly: true })"
  - id: fr.nounNumber
    checks: [frenchNounNumber]
    style: match
    message: review_msg_fr_noun_number
    # A determiner and the noun or adjective right after it share their number: "mes livres",
    # "la route". Which words are nouns comes from the dictionary (a Bloom filter of its inflected
    # entries); gender would need a source the dictionary does not have.
    sets:
      # Numbers also name things ("le numéro deux allemand", "tous les trois été"): left out.
      NUMBER_PLURAL: [les, des, mes, tes, ses, nos, vos, leurs, ces, aux, plusieurs, quelques]
      NUMBER_SINGULAR:
        [le, la, un, une, mon, ma, ton, ta, son, sa, ce, cet, cette, au, du, chaque, notre, votre]
      # Determiners that are also object pronouns before a verb ("je les aime", "tu la portes").
      NUMBER_CLITIC: [le, la, les]
      # Words after a plural determiner that are no singular nouns: adverbs ("les trop nombreux"),
      # "quelque" (about), numbers ("les quatre"); days and months stay singular after a
      # distributive "les" ("les lundi et mardi"); "un tiens vaut mieux que deux tu l'auras": the
      # proverb's noun.
      NUMBER_NOT_NOUNS:
        [
          tout,
          peu,
          trop,
          bien,
          mal,
          fort,
          très,
          plus,
          moins,
          quelque,
          environ,
          même,
          autant,
          presque,
          leur,
          quatre,
          cinq,
          six,
          sept,
          huit,
          neuf,
          onze,
          douze,
          treize,
          quatorze,
          quinze,
          seize,
          vingt,
          trente,
          quarante,
          cinquante,
          soixante,
          cent,
          mille,
          un,
          une,
          super,
          méga,
          mini,
          maxi,
          extra,
          ultra,
          hyper,
          multi,
          anti,
          ex,
          néo,
          lundi,
          mardi,
          mercredi,
          jeudi,
          vendredi,
          samedi,
          dimanche,
          janvier,
          février,
          mars,
          avril,
          mai,
          juin,
          juillet,
          août,
          septembre,
          octobre,
          novembre,
          décembre,
          tiens,
          rien,
        ]
      # "-al" and "-au/-eu" plurals that take an s.
      PLURAL_IN_S:
        [
          bal,
          carnaval,
          chacal,
          festival,
          récital,
          régal,
          cal,
          naval,
          fatal,
          natal,
          banal,
          final,
          bleu,
          pneu,
          landau,
          sarrau,
          émeu,
        ]
      # Nouns after a figure that name a place or a score, not a count ("au 12 rue", "à 3 contre
      # 1"), and abbreviations ("5 min", "2 vol.").
      NOT_COUNTED:
        [
          rue,
          avenue,
          boulevard,
          place,
          allée,
          impasse,
          chemin,
          quai,
          route,
          contre,
          min,
          max,
          hab,
          vol,
        ]
      NUMBER_DETERMINERS:
        [
          deux,
          trois,
          quatre,
          cinq,
          six,
          sept,
          huit,
          dix,
          onze,
          douze,
          treize,
          quatorze,
          quinze,
          seize,
          vingt,
          trente,
          quarante,
          cinquante,
          soixante,
          cent,
          mille,
        ]
      # Labels a number names a rank or an item after: "numéro deux", "page trois", "chapitre dix".
      RANKS:
        [
          numéro,
          page,
          chapitre,
          article,
          tome,
          acte,
          scène,
          étage,
          rang,
          "n°",
          volume,
          livre,
          partie,
          leçon,
        ]
      # Adjectives that stand before their noun; the masculine forms in s or x ("gros", "vieux")
      # show no number and are left out.
      PRENOMINAL_BASES:
        [
          grand,
          grande,
          petit,
          petite,
          grosse,
          beau,
          belle,
          bon,
          bonne,
          mauvaise,
          jeune,
          vieille,
          nouveau,
          nouvelle,
          joli,
          jolie,
          long,
          longue,
          haut,
          haute,
          vrai,
          vraie,
          fausse,
          propre,
          premier,
          première,
          dernier,
          dernière,
          prochain,
          prochaine,
          seul,
          seule,
          même,
          autre,
          meilleur,
          meilleure,
          pire,
          gentil,
          gentille,
          excellent,
          excellente,
        ]
      DEGREE_WORDS: [plus, moins, très, si, aussi, trop]
      # Nouns that stay singular in apposition: "des idées choc", "des dates limite".
      APPOSITIVE_NOUNS:
        [
          clé,
          choc,
          culte,
          limite,
          phare,
          pilote,
          type,
          éclair,
          record,
          modèle,
          témoin,
          maison,
          minute,
        ]
      # Words in the adjective slot that are determiners: "au moins certaines règles".
      NOT_SUPERLATIVES: [certain, certaine, certains, certaines, autre, autres, même, mêmes]
    maps:
      # Determiners whose number a superlative may contradict, with their forms for ms, fs and
      # plural.
      SUPERLATIVE_DETERMINERS:
        {
          le: [le, la, les],
          la: [le, la, les],
          les: [le, la, les],
          au: [au, à la, aux],
          aux: [au, à la, aux],
          ce: [ce, cette, ces],
          cette: [ce, cette, ces],
          ces: [ce, cette, ces],
          leur: [leur, leur, leurs],
          leurs: [leur, leur, leurs],
        }
    defs:
      NUMBER_SUBJECTS: 'new Set([...SUBJECT_PRONOUNS, "ne", "n''", "qui", "ça", "cela"])'
      PLURAL_ADJECTIVES: new Set([...PRENOMINAL_BASES].map((word) => pluralForm(word)))
      verbForm:
        args: "word: string"
        return: 'verbReadings(word).some((r) => r.slot !== "Q")'
      # The plural of a singular noun or adjective.
      pluralForm:
        args: "word: string"
        type: string
        return: >-
          PLURAL_IN_S.has(word)
            ? `${word}s`
            : /(?:eau|au|eu)$/.test(word)
              ? `${word}x`
              : /al$/.test(word)
                ? `${word.slice(0, -2)}aux`
                : `${word}s`
      # The singular a plural form comes from, when the dictionary knows it.
      singularForm:
        args: "word: string"
        return: "[/aux$/.test(word) ? `${word.slice(0, -3)}al` : null, /[xs]$/.test(word) ? word.slice(0, -1) : null].find((c) => c && isNounLemma(c)) ?? null"
      numberToken:
        args: "t: FrenchToken | undefined"
        return: "!!t && /^(?:\\d+|deux|trois|quatre|cinq|six|sept|huit|neuf|dix|vingt|trente|quarante|cinquante|soixante|cent|mille)$/.test(t.w)"
      # "j'ai 4 enfant", "en 3 partie": a figure from 2 up counts the noun after it. Not a year, a
      # decimal, a range, a score or a label ("page 4 ligne"): only after a preposition, a plural
      # determiner, a verb or at a clause start. "4 partie 2", "420 sujet(s)": a label, an
      # inclusive ending.
      countable:
        args: "ctx: DetectContext, m: RegExpExecArray, figure: string"
        let:
          value: Number(figure.replace(/\D/g, ""))
          noun: m.groups!.noun.toLowerCase()
          rest: ctx.text.slice(m.indices!.groups!.noun[1], m.indices!.groups!.noun[1] + 3)
          before: tokensBefore(ctx.text, m.index, 1)[0]
          readings: "before ? verbReadings(before.w) : []"
        when:
          - "!(value < 2 || (figure.length === 4 && value >= 1000 && value < 2100))"
          - "!(NOT_COUNTED.has(noun) || /^i?[eè]me$/.test(noun))"
          - '!/^(?:[\s ]*\d|[(*·])/u.test(rest)'
        return: >-
          !before || /[.!?:;\n]/.test(ctx.text.slice(before.end, m.index))
            ? true
            : PREPOSITIONS.has(before.w) ||
              NUMBER_PLURAL.has(before.w) ||
              before.w === "et" ||
              before.w === "en" ||
              (readings.length > 0 && (!isInflectedNoun(before.w) || readings.every((r) => r.slot === "Q")))
        else: "false"
      # "quatre enfant": a number from two up is a plural determiner, unless a determiner or a
      # label before makes it a name or a rank ("le numéro deux allemand", "les trois été"). "cinq
      # et six", "cent pour cent", "à neuf": parts of a number, a ratio, an adjective. "4 ami", "en
      # 3 partie": after a figure, a noun entry is the noun. "en 10 minute": after a figure, a
      # gendered noun that is also a verb form is the noun ("une famille sur trois cuisine", "six
      # moins deux fait": after a number word it is the verb).
      countedNoun:
        args: "ctx: DetectContext, m: RegExpExecArray, determiner: string, word: string, digits: boolean, start: number"
        type: RawFinding | null
        let:
          length: m.groups!.noun.length
          before: "digits ? undefined : tokensBefore(ctx.text, m.index, 1)[0]"
          after: ctx.text.slice(start + length, start + length + 12)
        when:
          - "!(before && (NUMBER_PLURAL.has(before.w) || NUMBER_SINGULAR.has(before.w) || RANKS.has(before.w)))"
          - '!(before && (before.w === "et" || before.w === "pour" || NUMBER_DETERMINERS.has(before.w)))'
          - "!(adjectiveReadings(word).length && !(digits && nounGender(word)))"
          - "!((verbForm(word) && !(digits && isVerbHomograph(word) && nounGender(word))) || /[sxz]$/.test(word) || !isInflectedNoun(word))"
          - '!/^[-''’]|^[\s ]{0,8}(?:,|et\b|ou\b)/u.test(after)'
        return: 'finding("frenchNounNumber", "review_msg_fr_noun_number", start, start + length, [pluralForm(word)], { context: { start: m.index, end: start + length } })'
      # A pronoun "le", "la", "les" before a word that is also a noun ("la routes", "des porte")
      # counts as a determiner where no verb can follow: after a preposition, a verb or at a
      # clause start. "les voyant si nerveux", "de les avoir vus": a present participle or an
      # infinitive. "lavé les tasse", "ranger la tasses": after a participle or an infinitive, a
      # finite form cannot follow an object pronoun.
      cliticNounSlot:
        args: "ctx: DetectContext, m: RegExpExecArray, word: string"
        let:
          before: tokensBefore(ctx.text, m.index, 1)[0]
          nonFinite: >-
            !!before &&
            verbReadings(before.w).length > 0 &&
            verbReadings(before.w).every((r) => r.slot === "Q" || r.slot === "I") &&
            verbReadings(word).every((r) => typeof r.slot === "number")
        when: '!verbReadings(word).some((r) => r.slot === "G" || r.slot === "I")'
        return: >-
          !before ||
          PREPOSITIONS.has(before.w) ||
          nonFinite ||
          (!isVerbHomograph(before.w) && verbReadings(before.w).some((r) => typeof r.slot === "number") && !NUMBER_SUBJECTS.has(before.w))
        else: "false"
      # "deux cent une personnes", "soixante et un ans": a number, not an article. "de ton
      # distincts": the noun "ton" (tone), "son" (sound). "les épaules son larges": "sont"
      # misspelt after a plural subject. "il ne leurs reste rien": the pronoun "leur" misspelt
      # before its verb. "vos nom et prénom", "les premier et deuxième": singulars sharing one
      # determiner. "étudiant*es", "résistant(e)s": inclusive endings. "ces don Juan": a title
      # before a name. "je les aime", "tu la portes", "ce sont": a pronoun before its verb;
      # "nous la sorts": a pronoun subject makes "la" an object pronoun, whatever follows. "un
      # enfants": a regular plural, not an entry of its own ("un temps") or a function word.
      determinedNoun:
        args: "ctx: DetectContext, m: RegExpExecArray, determiner: string, word: string, start: number"
        type: RawFinding | null
        let:
          length: m.groups!.noun.length
          previous: tokensBefore(ctx.text, m.index, 2)
          rest: ctx.text.slice(start + length)
          fixed: >-
            NUMBER_PLURAL.has(determiner)
              ? /[sxz]$/.test(word) || !isInflectedNoun(word)
                ? null
                : pluralForm(word)
              : NUMBER_SINGULAR.has(determiner)
                ? !/[sx]$/.test(word) || isNounLemma(word) || !isInflectedNoun(word)
                  ? null
                  : singularForm(word)
                : null
        when:
          - >-
            !((determiner === "un" || determiner === "une") &&
              (numberToken(previous[0]) ||
                (previous[0]?.w === "et" && numberToken(previous[1])) ||
                /\d[\s ]*$/u.test(ctx.text.slice(Math.max(0, m.index - 3), m.index))))
          - '!((determiner === "son" || determiner === "ton") && previous[0] && ["de", "le", "un", "du", "ce", "au"].includes(previous[0].w))'
          - '!(determiner === "son" && sontForSon(ctx.text, m.index))'
          - '!(determiner === "leurs" && ["ne", "n''", "se", "s''"].includes(previous[0]?.w ?? ""))'
          - '!/^[\s ]*(?:,|et\b|ou\b)/u.test(rest)'
          - '!/^[*·(.]\p{L}/u.test(rest)'
          - '!(NUMBER_PLURAL.has(determiner) && /^[ \t]+\p{Lu}/u.test(rest))'
          - '!(NUMBER_CLITIC.has(determiner) && NUMBER_SUBJECTS.has(previous[0]?.w ?? ""))'
          - "!verbForm(word) || (isVerbHomograph(word) && (!NUMBER_CLITIC.has(determiner) || cliticNounSlot(ctx, m, word)))"
          - "!!fixed"
        return: 'finding("frenchNounNumber", "review_msg_fr_noun_number", start, start + length, [fixed], { context: { start: m.index, end: start + length } })'
    frames:
      # A determiner and the noun right after it share their number: "mes livres", "la route".
      - regex: "(?:{{WORD_START}}(?<det>les|des|mes|tes|ses|nos|vos|leurs|ces|aux|plusieurs|quelques|le|la|un|une|mon|ma|ton|ta|son|sa|ce|cet|cette|au|du|chaque|notre|votre|deux|trois|quatre|cinq|six|sept|huit|dix|onze|douze|treize|quatorze|quinze|seize|vingt|trente|quarante|cinquante|soixante|cent|mille|(?<![\\d.,:/°#№]|n°[ \\t]?)\\d{1,3}(?:[ \\u00a0\\u202f]\\d{3})+|(?<![\\d.,:/°#№]|n°[ \\t]?)\\d+))(?=[ \\t]+(?<noun>\\p{L}+){{WORD_END}})"
        flags: dgiu
        scan: owned
        lookback: 1
        let:
          determiner: det.toLowerCase()
          word: noun.toLowerCase()
          digits: /^\d/.test(determiner)
          start: m.indices!.groups!.noun[0]
        when:
          - m.index >= ctx.from
          - "!(noun !== word || word.length < 3 || ctx.dictionary.has(word))"
          - "!(NUMBER_NOT_NOUNS.has(word) || namedExampleBefore(ctx.text, m.index))"
          - "!(digits && !countable(ctx, m, determiner))"
        return: >-
          NUMBER_DETERMINERS.has(determiner) || digits
            ? countedNoun(ctx, m, determiner, word, digits, start)
            : determinedNoun(ctx, m, determiner, word, start)
      # "de grosses société", "leurs propres démarcation", "un autre jours": a noun after an
      # adjective that stands before it takes the number the adjective and its determiner show.
      # "deux Parisiennes bascule": a capitalized word inside the sentence names people, and the
      # word after it may be their verb. "laisser les autres noyer", "les seuls restant": an
      # infinitive or a present participle. "les autres excellent en maths": a plural adjective
      # used as a noun, and its verb. "une des plus anciennes fabrique encore": "une des" is the
      # subject of the verb that follows. "les mêmes nom et prénom", "les grands-parents",
      # "étudiant*es". "de violentes migraine": any feminine plural adjective before a feminine
      # noun.
      - regex: "(?<![\\p{L}\\p{M}\\p{N}_-])(?<adj>grand|grande|petit|petite|grosse|beau|belle|bon|bonne|mauvaise|jeune|vieille|nouveau|nouvelle|joli|jolie|long|longue|haut|haute|vrai|vraie|fausse|propre|premier|première|dernier|dernière|prochain|prochaine|seul|seule|même|autre|meilleur|meilleure|pire|gentil|gentille|excellent|excellente|grands|grandes|petits|petites|grosses|beaux|belles|bons|bonnes|mauvaises|jeunes|vieilles|nouveaux|nouvelles|jolis|jolies|longs|longues|hauts|hautes|vrais|vraies|fausses|propres|premiers|premières|derniers|dernières|prochains|prochaines|seuls|seules|mêmes|autres|meilleurs|meilleures|pires|gentils|gentilles|excellents|excellentes|\\p{L}+es)(?=[ \\t]+(?<noun>\\p{L}+){{WORD_END}})"
        flags: dgiu
        scan: owned
        lookback: 1
        let:
          adjective: adj.toLowerCase()
          word: noun.toLowerCase()
          tokens: tokensBefore(ctx.text, m.index, 4)
          at: tokens.findIndex((t) => !DEGREE_WORDS.has(t.w))
          before: tokens[at]
          start: m.indices!.groups!.noun[0]
          rest: ctx.text.slice(start + noun.length)
          femininePlural: >-
            /es$/.test(adjective) &&
            !APPOSITIVE_NOUNS.has(word) &&
            nounGender(word) === "f" &&
            adjectiveReadings(adjective).some((r) => r.slot === "fp")
          fixed: >-
            PLURAL_ADJECTIVES.has(adjective) || femininePlural
              ? !(NUMBER_PLURAL.has(before.w) || NUMBER_DETERMINERS.has(before.w) || /^d[e']$/.test(before.w)) ||
                /[sxz]$/.test(word) ||
                !isInflectedNoun(word)
                ? null
                : pluralForm(word)
              : PRENOMINAL_BASES.has(adjective) && NUMBER_SINGULAR.has(before.w)
                ? !/[sx]$/.test(word) || isNounLemma(word) || !isInflectedNoun(word)
                  ? null
                  : singularForm(word)
                : null
        when:
          - m.index >= ctx.from
          - "!(noun !== word || word.length < 3 || ctx.dictionary.has(word))"
          - '!(/^\p{Lu}/u.test(adj) && tokensBefore(ctx.text, m.index, 1).length)'
          - "!(NUMBER_NOT_NOUNS.has(word) || namedExampleBefore(ctx.text, m.index))"
          - "!(verbForm(word) && !isVerbHomograph(word))"
          - '!verbReadings(word).some((r) => r.slot === "I" || r.slot === "G")'
          - "!(PLURAL_ADJECTIVES.has(adjective) && hasPerson(finitePersons(word), ILS))"
          - "!!before"
          - '!(before.w === "des" && ["un", "une", "l''un", "l''une"].includes(tokens[at + 1]?.w ?? ""))'
          - '!/^(?:[\s ]*(?:,|et\b|ou\b)|[-*·(.]\p{L})/u.test(rest)'
          - "!!fixed"
        return: "finding(frame.ruleId, frame.messageKey, start, start + noun.length, [fixed], { context: { start: before.start, end: start + noun.length } })"
      # "Les plus beau garçon" -> "Le", "la plus beaux parcs" -> "les": before a degree word, an
      # adjective and a noun that agree, the determiner takes their number. "les temps": a noun in
      # s that is its own singular shows no number. "au moins certaines règles": a locution and a
      # determiner, no superlative. "les plus gros budget": an adjective in s or x shows no
      # number. "je les plus": a pronoun before a verb is no determiner.
      - regex: "{{WORD_START}}(?<det>le|la|les|au|aux|ce|cette|ces|leur|leurs)(?=[ \\t]+(?<degree>plus|moins|très)[ \\t]+(?<adj>\\p{L}+)[ \\t]+(?<noun>\\p{L}+){{WORD_END}})"
        flags: dgiu
        scan: owned
        lookback: 1
        let:
          lowerDet: det.toLowerCase()
          nounPlural: /[sx]$/.test(noun)
          gender: "nounGender(nounPlural ? (singularForm(noun) ?? noun) : noun)"
          all: adjectiveReadings(adj).map((r) => r.slot)
          slots: 'all.filter((slot) => slot.endsWith(nounPlural ? "p" : "s") && (!gender || slot[0] === gender))'
          forms: SUPERLATIVE_DETERMINERS[lowerDet]
          right: 'nounPlural ? forms[2] : slots[0] === "fs" ? forms[1] : forms[0]'
        when:
          - m.index >= ctx.from
          - "!(ctx.dictionary.has(noun) || namedExampleBefore(ctx.text, m.index))"
          - "!(!isInflectedNoun(noun) || (verbReadings(noun).length && !isVerbHomograph(noun)))"
          - "!(isNounLemma(noun) && /[sxz]$/.test(noun))"
          - '!(lowerDet === "au" && degree.toLowerCase() === "moins")'
          - "!(NOT_SUPERLATIVES.has(adj) || new Set(all.map((slot) => slot[1])).size > 1)"
          - "!(!slots.length || new Set(slots).size > 1)"
          - (forms[2] === lowerDet) !== nounPlural
          - "!(NUMBER_CLITIC.has(lowerDet) && tokensBefore(ctx.text, m.index, 1).some((t) => SUBJECT_PRONOUNS.has(t.w)))"
        return: >-
          finding(frame.ruleId, frame.messageKey, m.index, m.index + det.length, [carryCase(det, right)], {
            context: { start: m.index, end: m.indices!.groups!.noun[1] },
          })
  - id: fr.gender
    checks: [frenchNounGender]
    style: match
    message: review_msg_fr_noun_gender
    # A singular determiner takes its noun's gender: "une maison", "un arbre", "cette idée".
    # Genders come from the bundled n-gram counts and the endings that fix one ("-tion", "-ment").
    maps:
      # The determiner of the other gender, before a consonant and before a vowel (null: none).
      GENDER_SWAP:
        {
          un: [une, une],
          une: [un, un],
          le: [la, null],
          la: [le, null],
          ce: [cette, cette],
          cet: [cette, cette],
          cette: [ce, cet],
          du: [de la, null],
          au: [à la, null],
          mon: [ma, null],
          ton: [ta, null],
          son: [sa, null],
          ma: [mon, mon],
          ta: [ton, ton],
          sa: [son, son],
          aucun: [aucune, aucune],
          aucune: [aucun, aucun],
        }
    sets:
      # Adverbs and prefixes written apart that sit between a determiner and its noun ("une tout
      # autre", "la post saison", "la vice présidente").
      GENDER_NOT_HEADS:
        [
          tout,
          bien,
          mieux,
          plus,
          moins,
          très,
          trop,
          peu,
          mini,
          maxi,
          post,
          pré,
          anti,
          ex,
          super,
          hyper,
          ultra,
          vice,
        ]
      # Object pronouns and negation that stand between a subject and its verb.
      GENDER_CLITICS: [me, m', te, t', se, s', lui, leur, "y", en, ne, n']
      GENDER_FEMININE: [une, la, cette, ma, ta, sa, aucune]
      NEVER_PRONOUNS: [cette, cet, mon, ton, du, au, aucun, aucune]
      # "il est la demain": "là" before an adverb, which the homophone check offers.
      LA_ADVERB_FOLLOWERS:
        [
          depuis,
          pour,
          avec,
          dans,
          chez,
          parmi,
          devant,
          derrière,
          maintenant,
          aujourd'hui,
          hier,
          demain,
          déjà,
          encore,
          toujours,
          aussi,
          quand,
          mais,
          car,
          parce,
          et,
          ou,
        ]
    defs:
      GENDER_VOWEL: /^[aeiouyâàäéèêëîïôöûùüœæ]/i
      # A verb form that no other entry spells.
      plainVerb:
        args: "word: string"
        return: '!isVerbHomograph(word) && verbReadings(word).some((r) => typeof r.slot === "number")'
      # "un longue ombre", "une excellent choix": an adjective before its noun whose singular
      # forms show the noun's gender; that gender, or null. "ils excellent", "il ombre": a verb
      # form counts only when another entry spells it too. "la mort fait", "la saint Loup": a
      # noun subject and its verb, a feast day.
      genderBeforeNoun:
        args: "ctx: DetectContext, m: RegExpExecArray, word: string"
        type: FrenchGender | null
        let:
          slots: adjectiveReadings(word).map((r) => r.slot)
          genders: 'new Set(slots.filter((s) => s.endsWith("s")).map((s) => s[0] as FrenchGender))'
          start: m.indices!.groups!.noun[0]
          next: tokensAfter(ctx.text, start + word.length, 1)[0]
          verb: 'verbReadings(next.w).some((r) => typeof r.slot === "number")'
          gender: "[...genders][0]"
        when:
          - '!(genders.size !== 1 || slots.some((s) => s.endsWith("p")))'
          - "!plainVerb(word)"
          - "!(!next || next.hyphen || ctx.text.slice(next.start, next.end) !== next.w)"
          - "!(adjectiveReadings(next.w).length || plainVerb(next.w))"
          - '!((verb && isInflectedNoun(word)) || word.startsWith("saint"))'
        return: "nounGender(next.w) === gender ? gender : null"
    frames:
      # A singular determiner takes the gender of its noun: "une maison", "un arbre", "cette idée".
      - regex: "(?:{{WORD_START}}|(?<={{WORD_START}}(?:[dD]|[qQ]u)['’]))(?<det>un|une|le|la|ce|cet|cette|du|au|mon|ton|son|ma|ta|sa|aucun|aucune)(?=[ \\t]+(?<noun>\\p{L}+)(?![\\p{L}\\p{M}\\p{N}_]))"
        flags: dgiu
        scan: owned
        lookback: 1
        let:
          lowerDet: det.toLowerCase()
          word: noun.toLowerCase()
          headGender: nounGender(word) ?? genderBeforeNoun(ctx, m, word)
          start: m.indices!.groups!.noun[0]
          after: ctx.text.slice(start + noun.length)
          second: /^[ \t]+(\p{L}+)/u.exec(after)?.[1].toLowerCase()
          # "le hibou", "la hausse": an h aspiré is a consonant; "la homme" -> "l'homme" elides.
          vowel: GENDER_VOWEL.test(word) || (word.startsWith("h") && !hAspire(word))
          elided: 'vowel && (lowerDet === "le" || lowerDet === "la")'
          fixed: 'elided ? "l''" : GENDER_SWAP[lowerDet][vowel ? 1 : 0]'
          previous: tokensBefore(ctx.text, m.index, 1)[0]
          next: tokensAfter(ctx.text, start + noun.length, 1)[0]
          # "de la gouvernement" -> "du", "à la projet" -> "au": the preposition contracts.
          joined: 'lowerDet === "la" && !elided && previous && previous.end + 1 === m.index ? previous : null'
          contracted: 'joined?.w === "de" ? "du" : joined?.w === "à" ? "au" : null'
          from: "contracted && joined ? joined.start : m.index"
        when:
          - m.index >= ctx.from
          - "!(noun !== word || word.length < 3 || ctx.dictionary.has(word))"
          # "EDF SA": an acronym, not a possessive.
          - "!(det.length > 1 && det === det.toUpperCase())"
          - '!(GENDER_NOT_HEADS.has(word) || word.endsWith("ième"))'
          - '!(lowerDet === "la" && LA_ADVERB_FOLLOWERS.has(word))'
          - '!(!headGender || (headGender === "f") === GENDER_FEMININE.has(lowerDet))'
          # "un après-midi", "la mi-temps", "une·un": a compound or an inclusive form.
          - "!/^[-'’·.*(]\\p{L}/u.test(after)"
          # "un marque page": a compound written apart takes its own gender.
          - "!(second && isDictionaryCompound(`${word}-${second}`))"
          # "le cure": determiners.ts offers "le curé" and "la cure" together.
          - "!(!GENDER_FEMININE.has(lowerDet) && verbReadings(word).length && accentedNoun(word))"
          - "!!fixed"
          # "mon amie": a feminine noun keeps "mon" before a vowel.
          - '!(["mon", "ton", "son"].includes(lowerDet) && vowel)'
          # "Sur ce, maman, je m'en vais": the phrase "sur ce" with its comma left out.
          - '!(lowerDet === "ce" && previous?.w === "sur" && tokensBefore(ctx.text, m.index, 2).length === 1)'
          # "les filles son arrivé": "sont" misspelt, no determiner.
          - '!(lowerDet === "son" && sontForSon(ctx.text, m.index))'
          # "de ton", "le son": the nouns "ton" and "son".
          - '!((lowerDet === "son" || lowerDet === "ton") && previous && ["de", "le", "un", "du", "ce", "au"].includes(previous.w))'
          # "je la porte", "ce base" (se), "dont une fait": a pronoun before a verb. "cette",
          # "mon", "du" are never pronouns: "cette chasse", "du porte" name the noun. "pour la
          # goûter": le and la before an infinitive are pronouns. "c'est le facture", "tirer le
          # chasse": after a verb, the determiner opens its object.
          - >-
            NEVER_PRONOUNS.has(lowerDet) ||
            (!((lowerDet === "le" || lowerDet === "la") && verbReadings(word).some((r) => r.slot === "I")) &&
              (!verbReadings(word).some((r) => typeof r.slot === "number") ||
                (!!previous &&
                  (PREPOSITIONS.has(previous.w) ||
                    (!SUBJECT_PRONOUNS.has(previous.w) &&
                      !GENDER_CLITICS.has(previous.w) &&
                      verbReadings(previous.w).length > 0 &&
                      !isInflectedNoun(previous.w))))))
          # "un unique sommet", "une mini salle": a modifier before the noun the determiner
          # agrees with.
          - '!(next && nounGender(next.w) === (GENDER_FEMININE.has(lowerDet) ? "f" : "m"))'
          - "!namedExampleBefore(ctx.text, m.index)"
          # "Le Monde", "La Défense": the title of a name keeps its article.
          - '!(/^\p{Lu}/u.test(det) && /^\p{Lu}/u.test(after.trim()))'
        # "l'" joins its noun: the space goes too.
        return: >-
          ({
            ruleId: frame.ruleId,
            messageKey: frame.messageKey,
            range: { start: from, end: elided && !contracted ? start : m.index + det.length },
            alternatives: [carryCase(ctx.text.slice(from, m.index + det.length), contracted ?? fixed)],
            context: { start: m.index, end: start + noun.length },
          })
  - id: fr.adjectives
    checks: [frenchAdjectiveAgreement]
    style: match
    message: review_msg_fr_adjective_agreement
    frames:
      # "trois heures et demi" -> "demie": "demi" after its noun.
      - regex: "{{WORD_START}}(?<noun>\\p{L}+)[ \\t]+et[ \\t]+(?<half>demi(?:e|s|es)?){{WORD_END}}"
        flags: giu
        scan: owned
        lookback: 1
        fixer: andAHalf
      # "une demie heure" -> "demi-heure": "demi" before its noun.
      - regex: "{{WORD_START}}(?<half>demie)(?:[ \\t]+|-)(?<noun>\\p{L}+){{WORD_END}}"
        flags: giu
        scan: owned
        lookback: 1
        fixer: halfBefore
      # "l'homme avec laquelle tu parles" -> "lequel", "la femme auquel" -> "à laquelle": the
      # relative pronoun takes the gender and number of the noun right before it.
      - regex: "{{WORD_START}}(?:lequel|laquelle|lesquels|lesquelles|auquel|auxquels|auxquelles|duquel|desquels|desquelles){{WORD_END}}"
        flags: giu
        scan: owned
        lookback: 1
        fixer: relativeAgreement
      # "des bons gens" -> "bonnes", "des gens cultivées" -> "cultivés": an adjective right before
      # "gens" takes its feminine form when it has one; an adjective after it stays masculine.
      - regex: "{{WORD_START}}gens{{WORD_END}}"
        flags: gu
        scan: owned
        lookback: 1
        fixer: gensAgreement
      # "des filles tel que Marie" -> "telles", "Tel est la question" -> "Telle", "tel une femme" ->
      # "telle": "tel" takes the gender and number of the noun it compares or announces.
      - regex: "{{WORD_START}}tel(?:le)?s?{{WORD_END}}"
        flags: giu
        scan: owned
        lookback: 1
        fixer: telAgreement
      # "des yeux verts clairs", "une jupe bleue foncée": a compound color after its noun.
      - regex: "{{WORD_START}}(?:bleu|bleue|bleus|bleues|vert|verte|verts|vertes|rouge|rouges|jaune|jaunes|gris|grise|grises|noir|noire|noirs|noires|blanc|blanche|blancs|blanches|rose|roses|violet|violette|violets|violettes|brun|brune|bruns|brunes|beige|beiges|mauve|mauves)[ \\t]{1,8}(?:clair|claire|clairs|claires|foncé|foncée|foncés|foncées|pâle|pâles|vif|vive|vifs|vives|sombre|sombres|canard|canards|océan|océans|améthyste|améthystes|émeraude|émeraudes|turquoise|turquoises|électrique|électriques|fluo|fluos|marine|nuit|ciel|pétrole){{WORD_END}}"
        flags: gu
        scan: owned
        lookback: 1
        fixer: colorShade
      # "un effet direct et indirects", "une entrée indépendante et séparé": two adjectives joined
      # by "et" or "ou" after their noun (or after être) share its gender and number.
      - regex: "{{WORD_START}}\\p{Ll}+(?=[ \\t]{1,8}(?:et|ou)[ \\t]{1,8}\\p{Ll})"
        flags: gu
        scan: owned
        lookback: 1
        fixer: adjectivePair
      # An adjective after its pronoun or noun subject, or before its noun.
      - regex: "{{WORD_START}}(?:[lj]['’](?=\\p{L})|(?:celui|celle|ceux|celles)(?=-)|(?:le|la|un|une|ce|cet|cette|mon|ton|son|ma|ta|sa|notre|votre|leur|les|ces|mes|tes|ses|nos|vos|leurs|des|je|tu|il|elle|nous|ils|elles|celui|celle|ceux|celles|certains|certaines|beaucoup|plusieurs){{WORD_END}})|(?<=\\p{L}-)(?:je|tu|il|elle|nous|ils|elles){{WORD_END}}"
        flags: giu
        scan: owned
        lookback: 1
        fixer: adjectiveCandidate
      # "et" before a form of être whose subject is left out: "elle s'admire et est fière".
      - regex: "{{WORD_START}}et[ \\t]+(?=(?:est|sont|était|étaient|sera|seront|serait|seraient|fut|furent|soit|soient|semble|semblent|paraît|paraissent|devient|deviennent|reste|restent|demeure|demeurent){{WORD_END}})"
        flags: giu
        scan: owned
        lookback: 1
        fixer: ellipticSubject
      # A first name as the subject of an adjective.
      - regex: "{{WORD_START}}\\p{Lu}\\p{Ll}+(?:-\\p{Lu}\\p{Ll}+)?{{WORD_END}}"
        flags: gu
        scan: owned
        lookback: 1
        fixer: firstNameSubject
      # The participle after avoir: invariable with no object before it ("nous avons mangé"),
      # agreeing with a noun that "que" brings before it ("les hommes que j'ai aidés").
      - regex: "(?<![\\p{L}\\p{M}\\p{N}_-])(?:ai|as|a|avons|avez|ont|avais|avait|avions|aviez|avaient|aurai|auras|aura|aurons|aurez|auront|aurais|aurait|aurions|auriez|auraient){{WORD_END}}"
        flags: giu
        scan: owned
        lookback: 1
        fixer: afterAvoir
  - id: fr.keptGenders
    checks: [frenchAdjectiveAgreement]
    style: match
    message: review_msg_fr_adjective_agreement
    frames:
      # "Je suis partie tôt et je suis rentré" -> "rentrée": a person ("je", "tu", "nous", or "et"
      # alone), its form of être and a participle. The fixer keeps the gender of the first
      # participle of each person in the sentence.
      - regex: "(?<![\\p{L}\\p{M}\\p{N}_'’-])(?:(?:je|j['’]|tu|nous)[ \\t]{1,4}(?:(?:ne|n['’])[ \\t]{0,4})?(?:(?:me|m['’]|te|t['’]|nous)[ \\t]{0,4})?|(?<=(?<![\\p{L}\\p{M}\\p{N}_'’-])et[ \\t]{1,4}))(?:suis|es|sommes|étais|étions)[ \\t]{1,4}(?:pas[ \\t]{1,4})?(?<part>\\p{L}+)(?![\\p{L}\\p{M}\\p{N}_'’-])"
        flags: giu
        scan: owned
        lookback: 1
        fixer: keptGender
  - id: fr.adjectivesRest
    checks: [frenchAdjectiveAgreement]
    style: match
    message: review_msg_fr_adjective_agreement
    frames:
      # "divers épices" -> "diverses", "pareil tempêtes" -> "pareilles": an adjective that serves as
      # the determiner of a plural noun takes its gender and number.
      - regex: "{{WORD_START}}(?:divers|diverse|diverses|différents|différentes|pareil|pareille|pareils|pareilles)(?=[ \\t]+\\p{L})"
        flags: giu
        scan: owned
        lookback: 1
        fixer: adjectiveDeterminer
      # "de" or "d'" before an adjective and its noun: the adjective agrees with the noun.
      - regex: "{{WORD_START}}(?:de{{WORD_END}}|d['’](?=\\p{L}))"
        flags: giu
        scan: owned
        lookback: 1
        fixer: deBeforeNoun
      # "une lettre qui est arrivé" -> "arrivée": after "qui" and être, the participle agrees with
      # the noun before "qui", the nearest one whose number the verb shows ("la fille du voisin qui
      # est venu": the neighbour).
      - regex: "{{WORD_START}}qui[ \\t]{1,4}(?<verb>est|sont|était|étaient|sera|seront|fut|furent|semble|semblent|paraît|paraissent|reste|restent){{WORD_END}}"
        flags: giu
        scan: owned
        lookback: 1
        fixer: quiParticiple
      # "Au fond du jardin sont planté les rosiers" -> "plantés", "Comment est venu le facteur ?":
      # after être with no subject before it, the participle agrees with the subject after it.
      - regex: "{{WORD_START}}(?:est|sont|était|étaient|sera|seront|fut|furent){{WORD_END}}"
        flags: giu
        scan: owned
        lookback: 1
        fixer: invertedParticiple
      # An inverted form of avoir and its participle: "Les as-tu lu ?" -> "lus".
      - regex: "(?<![\\p{L}\\p{M}\\p{N}_-])(?:ai|as|a|avons|avez|ont|avais|avait|avions|aviez|avaient|aurai|auras|aura|aurons|aurez|auront|aurais|aurait|aurions|auriez|auraient)(?:-t)?-(?:je|tu|il|elle|on|nous|vous|ils|elles){{WORD_END}}"
        flags: giu
        scan: owned
        lookback: 1
        fixer: invertedAvoir
  - id: fr.tout
    checks: [frenchTout]
    style: match
    message: review_msg_fr_tout
    # "tout" agrees with the noun phrase it opens: "tout le monde", "toute la journée", "tous les
    # jours", "toutes ces idées", "tous ceux", "tout cela". The determiner gives the number and,
    # when it can, the gender; otherwise the noun's gender list decides.
    maps:
      TOUT_FORMS: { ms: tout, fs: toute, mp: tous, fp: toutes }
      TOUT_SINGULAR_DETERMINERS:
        {
          le: m,
          ce: m,
          cet: m,
          la: f,
          cette: f,
          ma: f,
          ta: f,
          sa: f,
          mon: null,
          ton: null,
          son: null,
          notre: null,
          votre: null,
          "l'": null,
        }
      PLURAL_SUBJECT_FORMS:
        { ils: [tous], elles: [toutes], nous: [tous, toutes], vous: [tous, toutes] }
    sets:
      TOUT_PLURAL_DETERMINERS: [les, ces, mes, tes, ses, nos, vos, leurs]
      TOUT_NUMERALS: [deux, trois, quatre, cinq, six, sept, huit, neuf, dix]
      # Words between a plural determiner and its noun that say nothing of its gender.
      PRE_NOUN: [autres, premiers, premières, derniers, dernières, mêmes]
      TOUT_PREPOSITIONS:
        [
          à,
          de,
          d',
          pour,
          par,
          dans,
          sur,
          sous,
          avec,
          sans,
          chez,
          vers,
          entre,
          après,
          avant,
          contre,
          pendant,
          malgré,
          selon,
          et,
          ou,
          mais,
        ]
      # Idioms whose "tout" is right as written before a feminine noun.
      TOUT_IDIOMS: [ouïe, flamme, chose, pile, laine, soie, honte]
      # Words after a noun that make it the noun ("tout trace de", "tout confiance en lui").
      NOUN_COMPLEMENTS: [de, d', du, des, en, à, au, aux, pour, dans, sur, avec, envers]
      TOUT_NEGATIONS: [ne, "n'", pas, plus, jamais]
      MASCULINE_SINGULAR: [un, le, mon, ton, son, ce, cet, du, au]
      # "Ils ont tout fait une fois": a time after the object "tout".
      TOUT_TIMES: [fois, heure, minute, jour, semaine, mois, année, an, nuit, matin, soir]
      TOUT_ARTICLES: [un, une, des, du]
      # "une toute", "elle est toute": an article or être before "toute"; "en avant toute": the
      # fixed phrase.
      ARTICLE_OR_ETRE:
        [une, la, cette, sa, ma, ta, est, était, sera, fut, soit, reste, semble, paraît, avant]
      TOUT_SINGULAR_SUBJECTS: [je, "j'", tu, il, elle]
      TOUT_PLURAL_CLITICS: [les, nous, vous, leur, en]
      # Linking verbs after which "tout" before an adjective is the adverb: "elle est tout émue".
      TOUT_LINKING: [être, sembler, paraître, devenir, rester, demeurer]
    defs:
      finiteOrParticiple:
        args: "word: string"
        return: 'verbReadings(word).some((r) => typeof r.slot === "number" || r.slot === "Q" || r.slot === "I")'
      # A verb form that is not also a noun: "savent", "voir".
      verbOnly:
        args: "word: string"
        return: "!isInflectedNoun(word) && finiteOrParticiple(word)"
      singularGender:
        args: "word: string"
        type: FrenchGender | null
        let:
          direct: nounGender(word)
          singular: 'word.endsWith("aux") ? `${word.slice(0, -3)}al` : word.replace(/[sx]$/, "")'
        return: >-
          word === "personne" || word === "personnes"
            ? "f"
            : direct
              ? direct
              : singular !== word
                ? nounGender(singular)
                : null
      # The gender of the noun a determiner opens, skipping numerals and "autres". "tous les deux
      # partie de": after a numeral only a plural noun belongs to the determiner.
      headGenderAt:
        args: "after: FrenchToken[], from: number, i: number, numeral: boolean"
        type: FrenchGender | null | "verb"
        return: >-
          i >= Math.min(after.length, from + 3)
            ? null
            : i === from && verbOnly(after[i].w)
              ? "verb"
              : TOUT_NUMERALS.has(after[i].w) || PRE_NOUN.has(after[i].w)
                ? headGenderAt(after, from, i + 1, numeral || TOUT_NUMERALS.has(after[i].w))
                : numeral && !/[sx]$/.test(after[i].w)
                  ? null
                  : singularGender(after[i].w)
      # "Ils prennent tous le bus", "Elles ont toutes la grippe": a plural "tous" after its verb is
      # a pronoun, and the determiner after it opens the object.
      floatingTous:
        args: "before: FrenchToken[], text: string, index: number"
        let:
          previous: before[0]
        return: >-
          !previous
            ? /,[\s  ]*$/u.test(text.slice(Math.max(0, index - 4), index))
            : TOUT_PREPOSITIONS.has(previous.w)
              ? false
              : SUBJECT_PRONOUNS.has(previous.w) || CLITICS.has(previous.w) || finiteOrParticiple(previous.w)
      # "Ils ont tout obtenu un diplôme", "Elles n'avaient pas toute un ticket", "Elles savaient
      # toute que": after a plural subject and its verb, "tout" that is no object and no
      # determiner of the next noun is the subject's floating "tous" or "toutes".
      floatingPlural:
        args: "lower: string, before: FrenchToken[], after: FrenchToken[]"
        type: readonly string[] | null
        let:
          k: skipWords(before, 0, TOUT_NEGATIONS)
          verb: before[k]
          readings: 'verbReadings(verb.w).filter((r) => typeof r.slot === "number")'
          j: skipWhile(before, k + 1, (t) => CLITICS.has(t.w) || TOUT_NEGATIONS.has(t.w))
          subject: before[j] && PLURAL_SUBJECT_FORMS[before[j].w]
          next: after[0]
          object: after[1]
          avoir: 'readings.some((r) => r.lemma === "avoir")'
          participle: 'verbReadings(next.w).length > 0 && verbReadings(next.w).every((r) => r.slot === "Q")'
          objectAfter: >-
            object &&
            (TOUT_ARTICLES.has(object.w) || TOUT_PLURAL_DETERMINERS.has(object.w) || object.w in TOUT_SINGULAR_DETERMINERS) &&
            !TOUT_TIMES.has(after[2]?.w ?? "")
        when:
          - lower === "tout" || lower === "toute"
          - "!!verb"
          - readings.some((r) => hasPerson(r.slot, ILS + NOUS + VOUS))
          - "!!subject"
          - "!!next"
        return: >-
          avoir && participle && objectAfter
            ? subject
            : lower === "toute" && MASCULINE_SINGULAR.has(next.w)
              ? subject
              : next.w === "que" || next.w === "qu'"
                ? subject
                : null
      # A singular subject pronoun, its verb, then "tous" with no plural pronoun to float from. A
      # form that is also a noun is the verb only for avoir ("tu as") after its subject. "j'ai tous
      # essayé": a participle after avoir; "il veut tous savoir": an infinitive. "il fera tous pour
      # lui": a preposition after it.
      singularTousClause:
        args: "ctx: DetectContext, m: RegExpExecArray, next: FrenchToken"
        let:
          clause: tokensBefore(ctx.text, m.index, 6)
          k: 'skipWhile(clause, 1, (t) => CLITICS.has(t.w) || ["ne", "n''"].includes(t.w))'
          subject: clause[k]
          verb: 'verbReadings(clause[0].w).filter((r) => typeof r.slot === "number")'
          avoir: 'verb.some((r) => r.lemma === "avoir")'
          readings: verbReadings(next.w)
        when:
          - '!(!subject || !TOUT_SINGULAR_SUBJECTS.has(subject.w) || ctx.text[subject.start - 1] === "-")'
          - "!clause.slice(1, k).some((t) => TOUT_PLURAL_CLITICS.has(t.w))"
          - "!(!verb.length || (isInflectedNoun(clause[0].w) && !avoir))"
        return: >-
          avoir
            ? readings.some((r) => r.slot === "Q")
            : readings.some((r) => r.slot === "I" && r.lemma === next.w)
              ? true
              : ["pour", "par", "avec", "sans"].includes(next.w)
        else: "false"
      # "j'ai tous essayé", "il veut tous savoir", "il fera tous pour lui", "les tous premiers":
      # "tous" where no plural noun or pronoun can be its own: the pronoun or the adverb "tout".
      # "les tous premiers", "des tous petits": the adverb between a determiner and an adjective.
      singularTous:
        args: "ctx: DetectContext, m: RegExpExecArray, before: FrenchToken[], after: FrenchToken[]"
        return: >-
          (!!before[0] &&
            ["les", "des", "ces", "mes", "tes", "ses", "nos", "vos", "leurs"].includes(before[0].w) &&
            adjectiveReadings(after[0].w).some((r) => r.slot[1] === "p")) ||
          singularTousClause(ctx, m, after[0])
      # Whether "tout" before an adjective is the adverb: after a linking verb or a noun. "une
      # veste tout neuve": right after a noun its determiner opened.
      adverbialTout:
        args: "before: FrenchToken[]"
        let:
          previous: before[0]
          det: 'before[1]?.w ?? ""'
        when: "!!previous"
        return: >-
          verbReadings(previous.w).some((r) => typeof r.slot === "number" && TOUT_LINKING.has(r.lemma))
            ? true
            : (det in TOUT_SINGULAR_DETERMINERS || TOUT_PLURAL_DETERMINERS.has(det) || ["une", "des"].includes(det)) &&
              Boolean(nounGender(previous.w) || nounGender(previous.w.replace(/s$/, "")))
        else: "false"
      auxiliaryBefore:
        args: "before: FrenchToken[]"
        return: 'verbReadings(before[0]?.w ?? "").some((r) => typeof r.slot === "number" && (r.lemma === "avoir" || r.lemma === "être"))'
      # The gender and number slots of a word as an adjective; "étonnée", "émues": a feminine
      # participle.
      adjectiveSlots:
        args: "w: string"
        type: ReadonlySet<string>
        return: >-
          !adjectiveReadings(w).length && /é(?:e|es)$/.test(w) && verbReadings(w).every((r) => r.slot === "Q") && verbReadings(w).length
            ? new Set([w.endsWith("s") ? "fp" : "fs"])
            : new Set(adjectiveReadings(w).map((r) => r.slot))
      # "tout le ranger": the pronoun before its verb. "Tout l'alarme": an object pronoun before a
      # verb that is also a noun. "toute mon enfance": a possessive keeps "mon" before a feminine
      # vowel noun. "tous le monde", "tous le temps" ("ils ont tous le temps" is fine); before
      # other nouns only after a preposition or at a clause start, where "tous" cannot be the
      # subject; "à tous la vérité": "à tous" (to everyone) is a pronoun too.
      toutSingularDeterminer:
        args: "ctx: DetectContext, m: RegExpExecArray, lower: string, plural: boolean, after: FrenchToken[], before: FrenchToken[], fix: WordFix"
        type: RawFinding | null
        let:
          w: after[0].w
          head: headGenderAt(after, 1, 1, false)
          gender: "TOUT_SINGULAR_DETERMINERS[w] === null ? head : TOUT_SINGULAR_DETERMINERS[w]"
          noun: after[1]?.w
          idiom: 'noun === "monde" || noun === "temps"'
          right: 'gender === "m" ? "tout" : "toute"'
        when:
          - head !== "verb"
          - '!(w === "l''" && after[1] && verbReadings(after[1].w).some((r) => typeof r.slot === "number"))'
          - "!!gender"
          - "!plural || !(idiom ? auxiliaryBefore(before) : before[0] || floatingTous(before, ctx.text, m.index))"
        return: "lower === right ? null : fix([right])"
      # "tous les voir": a pronoun object; only the singular is wrong. "Nous avons tous nos
      # secrets": a "tous" after its verb belongs to the subject; "je présente à tous mes
      # excuses": "à tous" (to everyone) is a pronoun.
      toutPluralDeterminer:
        args: "ctx: DetectContext, m: RegExpExecArray, lower: string, plural: boolean, after: FrenchToken[], before: FrenchToken[], fix: WordFix"
        type: RawFinding | null
        let:
          head: headGenderAt(after, 1, 1, false)
          right: 'head === "m" ? "tous" : "toutes"'
        return: >-
          head === "verb" || !head
            ? plural
              ? null
              : fix(["tous", "toutes"])
            : plural && floatingTous(before, ctx.text, m.index)
              ? null
              : plural && before[0] && ["à", "pour", "entre"].includes(before[0].w)
                ? null
                : lower === right
                  ? null
                  : fix([right])
      # "une toute autre affaire": the adverb before "autre" after an article; "tout autre
      # personne" with no article: "any other", agreeing with the noun.
      toutAutre:
        args: "lower: string, after: FrenchToken[], before: FrenchToken[], fix: WordFix"
        type: RawFinding | null
        let:
          gender: 'after[1] ? (after[1].w === "personne" ? "f" : nounGender(after[1].w)) : null'
          right: 'gender === "m" ? "tout" : "toute"'
        return: >-
          before[0] && ["un", "une"].includes(before[0].w)
            ? lower === "tout"
              ? null
              : fix(["tout"])
            : before[0] && before[0].w in TOUT_SINGULAR_DETERMINERS
              ? null
              : !gender || adjectiveReadings(after[1].w).length
                ? null
                : lower === right
                  ? null
                  : fix([right])
      # "elle est tout belle", "une veste tout neuve": the adverb takes the gender and number of a
      # feminine adjective starting with a consonant; before a vowel it stays "tout" ("toute
      # étonnée" -> "tout étonnée").
      adverbAgreement:
        args: "w: string, lower: string, slots: ReadonlySet<string>, fix: WordFix"
        type: RawFinding | null
        let:
          vowel: /^[aeiouyâàéèêëîïôûœ]/.test(w)
          right: 'slots.has("fp") && !slots.has("fs") ? "toutes" : slots.has("fs") && !slots.has("fp") ? "toute" : null'
        return: >-
          vowel && lower === "toute" && !slots.has("fp")
            ? fix(["tout"])
            : !vowel && !/^h/.test(w) && right && lower !== right
              ? fix([right])
              : null
      # "pour tout nouvelle adhésion": before an adjective that starts with a consonant and its
      # noun, "tout" agrees with the noun whether it is the determiner or the adverb. "il inspecte
      # tout trace": after a verb or a preposition a noun that is also a verb form ("trace") is the
      # noun; at a clause start it may be the verb ("tout porte à croire"). After a verb, only
      # when a "de" complement or nothing follows ("il sait tout montre qu'il..." makes "tout" the
      # subject). "Elle est tout sourire": an adverb after être.
      toutSingularNoun:
        args: "lower: string, after: FrenchToken[], before: FrenchToken[], fix: WordFix"
        type: RawFinding | null
        let:
          w: after[0].w
          finiteNext: 'verbReadings(w).some((r) => typeof r.slot === "number")'
          nounSlot: >-
            !!before[0] &&
            (TOUT_PREPOSITIONS.has(before[0].w) ||
              (verbReadings(before[0].w).some((r) => typeof r.slot === "number" || r.slot === "Q") &&
                (!after[1] || NOUN_COMPLEMENTS.has(after[1].w))))
          adjectives: adjectiveReadings(w)
          nextGender: "after[1] ? nounGender(after[1].w) : null"
          gender: 'w === "personne" ? "f" : nounGender(w)'
        return: >-
          adjectives.length
            ? !nextGender || /^[aeiouyâàéèêëîïôûœh]/.test(w)
              ? null
              : !adjectives.some((r) => r.slot === `${nextGender}s`)
                ? null
                : !before[0] || !TOUT_PREPOSITIONS.has(before[0].w)
                  ? null
                  : lower === (nextGender === "m" ? "tout" : "toute")
                    ? null
                    : fix([nextGender === "m" ? "tout" : "toute"])
            : finiteOrParticiple(w) && !(nounSlot && isInflectedNoun(w) && finiteNext)
              ? null
              : !gender
                ? null
                : before[0] && verbReadings(before[0].w).some((r) => r.lemma === "être")
                  ? null
                  : lower === (gender === "m" ? "tout" : "toute")
                    ? null
                    : fix([gender === "m" ? "tout" : "toute"])
      # "Tout hommes" -> "Tous", "Toutes personne" -> "Toute": a bare noun of the other number.
      # "toutes deux", "tous ensemble": a number or an adverb, no noun. A plural "tous" before a
      # singular word may be the pronoun ("on a tous envie"): only at a clause start. "tout
      # personne" -> "toute personne", "toute sujet" -> "tout sujet".
      toutNoun:
        args: "ctx: DetectContext, m: RegExpExecArray, lower: string, plural: boolean, after: FrenchToken[], before: FrenchToken[], fix: WordFix"
        type: RawFinding | null
        let:
          next: after[0]
          w: next.w
          nounPlural: /[sx]$/.test(w) && !isNounLemma(w)
          bareGender: >-
            plural !== nounPlural &&
            (!plural || !before[0]) &&
            w.length > 2 &&
            isInflectedNoun(w) &&
            !TOUT_NUMERALS.has(w) &&
            w !== "ensemble" &&
            !/^\p{Lu}/u.test(ctx.text.slice(next.start, next.end)) &&
            !adjectiveReadings(w).length &&
            !verbReadings(w).length
              ? singularGender(w)
              : null
          right: 'bareGender ? TOUT_FORMS[`${bareGender}${nounPlural ? "p" : "s"}`] : ""'
        return: >-
          bareGender
            ? lower === right
              ? null
              : fix([carryCase(m[0], right)])
            : plural || TOUT_IDIOMS.has(w) || /^\p{Lu}/u.test(ctx.text.slice(next.start, next.end))
              ? null
              : toutSingularNoun(lower, after, before, fix)
      # "tout seule" -> "toute seule": "tout seul" is the adverb after any word. "tous" may be the
      # pronoun ("ils sont tous contents"): left alone. "Toute est prêt", "Toute arrive à point":
      # the pronoun subject of a verb is "tout"; a capital "Toute" inside a sentence opens a title
      # ("son livre, Toute la nuit"); "toute sont en Australie": a plural verb takes the pronoun
      # "toutes". "il a toute oublié": the object pronoun between avoir and its participle is
      # "tout" (after être "tout" may be the adverb: left alone); "elle nous a toute sauvées": a
      # plural participle shows the pronoun "toutes".
      toutWord:
        args: "ctx: DetectContext, m: RegExpExecArray, lower: string, plural: boolean, after: FrenchToken[], before: FrenchToken[], fix: WordFix"
        type: RawFinding | null
        let:
          w: after[0].w
          slots: adjectiveSlots(w)
          adjective: >-
            lower !== "tous" &&
            (adverbialTout(before) || adjectiveReadings(w).some((r) => r.lemma === "seul")) &&
            slots.size > 0 &&
            [...slots].every((slot) => slot[0] === "f") &&
            !isInflectedNoun(w) &&
            !verbReadings(w).some((r) => typeof r.slot === "number")
          sentenceStart: /(?:^|[.!?…]\s*)$/u.test(ctx.text.slice(Math.max(0, m.index - 4), m.index))
        return: >-
          adjective
            ? adverbAgreement(w, lower, slots, fix)
            : lower === "toute" &&
                !before[0] &&
                (sentenceStart || m[0] === lower) &&
                verbReadings(w).some((r) => typeof r.slot === "number") &&
                (!isInflectedNoun(w) || verbReadings(w).some((r) => r.lemma === "être" || r.lemma === "avoir"))
              ? fix([verbReadings(w).every((r) => r.slot === 32) ? "toutes" : "tout"])
              : lower === "toute" &&
                  verbReadings(before[0]?.w ?? "").some((r) => typeof r.slot === "number" && r.lemma === "avoir") &&
                  verbReadings(w).length > 0 &&
                  verbReadings(w).every((r) => r.slot === "Q")
                ? fix([w.endsWith("es") ? "toutes" : w.endsWith("s") ? "tous" : "tout"])
                : lower === "tous" && singularTous(ctx, m, before, after)
                  ? fix(["tout"])
                  : toutNoun(ctx, m, lower, plural, after, before, fix)
      # "tous ça" -> "tout ça". "tout ceux" -> "tous ceux", "toutes ceux" -> "tous ceux"; "avant
      # tout ceux-là", "après tout". "Ils sont tout deux" -> "tous deux".
      toutAfter:
        args: "ctx: DetectContext, m: RegExpExecArray, lower: string, plural: boolean, after: FrenchToken[], before: FrenchToken[]"
        type: RawFinding | null
        let:
          w: after[0].w
          fix: '(alternatives: string[]) => wordFinding(ctx, m.index, m[0], alternatives, "frenchTout", "review_msg_fr_tout", { start: m.index, end: after[Math.min(after.length - 1, 1)].end })'
          floated: floatingPlural(lower, tokensBefore(ctx.text, m.index, 5), after)
        return: >-
          floated
            ? fix([...floated])
            : w === "ça" || w === "cela" || w === "ceci"
              ? lower === "tout" || floatingTous(before, ctx.text, m.index)
                ? null
                : fix(["tout"])
              : w === "ceux" || w === "celles"
                ? before[0] && ["avant", "après", "malgré"].includes(before[0].w)
                  ? null
                  : lower === (w === "ceux" ? "tous" : "toutes")
                    ? null
                    : fix([w === "ceux" ? "tous" : "toutes"])
                : w in TOUT_SINGULAR_DETERMINERS
                  ? toutSingularDeterminer(ctx, m, lower, plural, after, before, fix)
                  : TOUT_PLURAL_DETERMINERS.has(w)
                    ? toutPluralDeterminer(ctx, m, lower, plural, after, before, fix)
                    : (w === "deux" || w === "trois") && !plural
                      ? (after[1] && isNounLemma(after[1].w)) ||
                        !before[0] ||
                        !(SUBJECT_PRONOUNS.has(before[0].w) || ["à", "pour", "entre"].includes(before[0].w) || finiteOrParticiple(before[0].w))
                        ? null
                        : fix(lower === "toute" ? ["toutes"] : ["tous", "toutes"])
                      : w === "autre" && !plural
                        ? toutAutre(lower, after, before, fix)
                        : toutWord(ctx, m, lower, plural, after, before, fix)
    frames:
      # The four forms of "tout". "c'est tous.", "Malgré tous,": the pronoun "tout". "mieux que
      # toute.", "il les a appelées toute,": "toute" alone is the pronoun "toutes". "le tout",
      # "un tout": the noun.
      - regex: "{{WORD_START}}(?:tout|toute|tous|toutes)(?![\\p{L}\\p{M}\\p{N}_'’])"
        flags: giu
        scan: owned
        lookback: 1
        let:
          typed: m[0]
          lower: typed.toLowerCase()
          after: tokensAfter(ctx.text, m.index + typed.length, 5)
          next: after[0]
          before: tokensBefore(ctx.text, m.index, 2)
          closing: '/^[ \t ]{0,2}(?:[.!?;,…]|$)/u.test(ctx.text.slice(m.index + typed.length))'
        when: m.index >= ctx.from
        return: >-
          lower === "tous" && closing && ((before[0]?.w === "est" && before[1]?.w === "c'") || before[0]?.w === "malgré")
            ? wordFinding(ctx, m.index, typed, [carryCase(typed, "tout")], frame.ruleId, frame.messageKey)
            : lower === "toute" && before[0] && !ARTICLE_OR_ETRE.has(before[0].w) && !(before[0].w === "à" && !before[1]) && closing
              ? wordFinding(ctx, m.index, typed, [carryCase(typed, "toutes")], frame.ruleId, frame.messageKey)
              : !next || next.start > m.index + typed.length + 3
                ? null
                : ctx.text[m.index + typed.length] === "-"
                  ? null
                  : before[0] && ["le", "un", "du", "au"].includes(before[0].w)
                    ? null
                    : toutAfter(ctx, m, lower, lower.endsWith("s"), after, before)
      # "Bonjour à tous", "merci à vous toutes", "le meilleur d'entre tous": "tout" alone at the
      # end of a greeting or after "d'entre" is the plural pronoun. "à tout" alone also offers the
      # feminine: the group may be all women.
      - regex: "{{WORD_START}}(?:(?:bonjour|bonsoir|salut|merci|bienvenue|bravo)[ \\t]+à[ \\t]+(?:vous[ \\t]+)?|d['’]entre[ \\t]+(?:nous[ \\t]+|vous[ \\t]+)?)(?<tout>tout|toute)(?=[ \\t]*(?:[.!?,;…]|$))"
        flags: giu
        scan: owned
        lookback: 1
        when: m.index >= ctx.from
        return: >-
          wordFinding(ctx, m.index + m[0].length - tout.length, tout,
            tout.toLowerCase() === "toute" ? ["toutes"] : ["tous", "toutes"], frame.ruleId, frame.messageKey)
  - id: fr.mood
    checks: [frenchMood]
    style: match
    message: review_msg_fr_subjunctive
    # Mood and tense read from closed triggers: "il faut que", "bien que", "vouloir que" take the
    # subjunctive; "si" (if) takes the imperfect, never the conditional; "j'aurai aimé" and "je
    # viendrais demain" mix up the conditional and the future, which sound alike in the first
    # person. Tense positions in the generated conjugations: 1 present, 2 imperfect, 4 future, 5
    # conditional, 6 subjunctive.
    maps:
      MOOD_PERSON:
        {
          je: 1,
          "j'": 1,
          tu: 2,
          il: 4,
          elle: 4,
          on: 4,
          ce: 4,
          "c'": 4,
          cela: 4,
          ça: 4,
          nous: 8,
          vous: 16,
          ils: 32,
          elles: 32,
        }
      # Subjunctive forms the regular stems do not give.
      IRREGULAR_SUBJUNCTIVE:
        {
          être: [sois, sois, soit, soyons, soyez, soient],
          avoir: [aie, aies, ait, ayons, ayez, aient],
          aller: [aille, ailles, aille, allions, alliez, aillent],
          faire: [fasse, fasses, fasse, fassions, fassiez, fassent],
          pouvoir: [puisse, puisses, puisse, puissions, puissiez, puissent],
          savoir: [sache, saches, sache, sachions, sachiez, sachent],
          vouloir: [veuille, veuilles, veuille, voulions, vouliez, veuillent],
          valoir: [vaille, vailles, vaille, valions, valiez, vaillent],
          falloir: ["", "", faille, "", "", ""],
          pleuvoir: ["", "", pleuve, "", "", ""],
        }
    sets:
      MOOD_DETERMINERS:
        [
          le,
          la,
          les,
          l',
          un,
          une,
          des,
          du,
          ce,
          cet,
          cette,
          ces,
          mon,
          ma,
          mes,
          ton,
          ta,
          tes,
          son,
          sa,
          ses,
          notre,
          nos,
          votre,
          vos,
          leur,
          leurs,
          chaque,
        ]
      MOOD_NEGATION: [ne, "n'"]
      # Words after which a noun phrase continues with a complement: the verb is further on.
      MOOD_COMPLEMENT: [de, d', du, des, qui, que, qu', dont, où, à, au, aux]
      # Triggers of the subjunctive just before "que".
      WILL_LEMMAS:
        [
          vouloir,
          souhaiter,
          exiger,
          ordonner,
          désirer,
          préférer,
          aimer,
          falloir,
          craindre,
          redouter,
          regretter,
          douter,
          attendre,
          permettre,
          refuser,
          interdire,
          empêcher,
          suffire,
          demander,
          déplorer,
          détester,
          plaire,
        ]
      SUBJUNCTIVE_CONJUNCTIONS: [pour, afin, avant, sans, pourvu]
      IMPERSONAL:
        [
          important,
          nécessaire,
          essentiel,
          indispensable,
          possible,
          impossible,
          normal,
          temps,
          urgent,
          préférable,
          souhaitable,
          naturel,
          rare,
          juste,
          inadmissible,
          inacceptable,
          étonnant,
          regrettable,
          utile,
          dommage,
          triste,
          logique,
          honteux,
        ]
      MOOD_DEGREE: [si, tellement, tant, assez, trop, aussi, plus, moins]
      MOOD_SKIPPED: [pas, plus, jamais, vraiment, absolument, beaucoup, bien]
      MOOD_ETRE: [est, était, sera, serait, soit, fut]
      FAIRE_LEMMAS: [faire]
      TROUVER_LEMMAS: [trouver]
      VALOIR_LEMMAS: [valoir]
      FAIRE_POUVOIR_LEMMAS: [faire, pouvoir]
      SUBJECT_AFTER_SI: [je, "j'", tu, il, elle, on, nous, vous, ils, elles]
      SI_OPENERS: [et, mais, ou, même, sauf, comme, car, or, donc]
      # "j'aurai aimé savoir" -> "aurais": a wish in the past is a conditional.
      WISHED: [aimé, souhaité, préféré, adoré, voulu]
      # "j'aimerais bien venir": a polite wish.
      WISHING: [aimerai, voudrai, préférerai, souhaiterai]
      WISH_ADVERBS: [bien, beaucoup, vraiment, tant, pas]
      MOOD_MODALS:
        [pouvoir, vouloir, devoir, aimer, préférer, souhaiter, falloir, valoir, être, avoir, savoir]
      # Triggers of the indicative before "que": "il est vrai que", "j'espère que", "du moment
      # que".
      STATING: [espérer, affirmer, dire, assurer, savoir, promettre]
      TRUE_WORDS: [vrai, certain, sûr, clair, évident, exact]
      MAIN_SUBJECTS: [je, "j'", tu, il, elle, on, ils, elles]
    defs:
      EMOTION: /^(?:content|ravi|heureu[sx]|heureuse|surpris|étonné|triste|désolé|fier|fière|furieu[sx]|furieuse|déçu|fâché|soulagé)(?:e?s?)$/
      FUTURE_CUES: /\b(?:demain|après-demain|bientôt|plus tard|prochaine?s?|un jour|dans (?:\d+|un|une|deux|trois|quatre|cinq|six|sept|huit|dix|quelques) (?:minutes?|heures?|jours?|semaines?|mois|ans|années))\b/iu
      MOOD_SENTENCE_END: '/[.!?…;:\n]/u'
      # ", mais", ", et", ", donc" start a new clause. A plain comma does not: "Si tu venais, je".
      MOOD_CLAUSE_BREAK: "/(?:,[\\s ]*(?:et|or|donc|car|puis)|(?<![\\p{L}\\p{M}\\p{N}_'’-])mais)(?![\\p{L}\\p{M}\\p{N}_'’-])/giu"
      moodFinite:
        args: "word: string"
        return: 'verbReadings(word).some((r) => typeof r.slot === "number")'
      moodParticiple:
        args: "word: string"
        return: 'verbReadings(word).some((r) => r.slot === "Q")'
      moodInfinitive:
        args: "t: FrenchToken | undefined"
        return: '!!t && verbReadings(t.w).some((r) => r.slot === "I")'
      # A finite form, or "fallu" ("il a fallu que").
      hasLemmaIn:
        args: "word: string, lemmas: ReadonlySet<string>"
        return: 'verbReadings(word).some((r) => lemmas.has(r.lemma) && (typeof r.slot === "number" || r.lemma === "falloir"))'
      finiteInTense:
        args: "word: string, tense: number"
        return: 'verbReadings(word).filter((r) => typeof r.slot === "number" && r.tense === tense)'
      # The present subjunctive of a verb for one person: "ils prennent" -> "prenne". Variant
      # spellings ("asseoir") upset the tense order: keep only subjunctive endings.
      regularSubjunctive:
        args: "reading: VerbReading, person: number, index: number"
        let:
          plural: "conjugate({ ...reading, tense: 1 }, ILS)[0]"
          form: >-
            person === NOUS || person === VOUS
              ? conjugate({ ...reading, tense: 2 }, person)[0]
              : plural.slice(0, -3) + ["e", "es", "e", "", "", "ent"][index]
        when:
          - 'person === NOUS || person === VOUS || plural?.endsWith("ent")'
          - "!(!form || !verbReadings(form).some((r) => r.lemma === reading.lemma))"
          - /(?:e|es|ent|ions|iez)$/.test(form)
        return: form
      subjunctive:
        args: "reading: VerbReading, person: number"
        let:
          index: "[JE, TU, IL, NOUS, VOUS, ILS].indexOf(person)"
          irregular: IRREGULAR_SUBJUNCTIVE[reading.lemma]
        return: "irregular ? irregular[index] || null : regularSubjunctive(reading, person, index)"
      # "condition que", "peur de que" ...: "ça lui fait plaisir que", "je trouve normal que", "à
      # supposer que". "comment se fait-il que", "se peut-il que": the inverted "il" after faire
      # or pouvoir. "faut-il que": the inverted subject after its verb. "il se doute que"
      # (suspects) takes the indicative.
      triggersSubjunctive:
        args: "before: FrenchToken[]"
        let:
          b0: before[0]?.w
          b1: before[1]?.w
          b2: before[2]?.w
          i: skipWords(before, 0, MOOD_SKIPPED)
        when: "!!b0"
        return: >-
          b0 === "bien"
            ? !b1 || !moodFinite(b1)
            : SUBJUNCTIVE_CONJUNCTIONS.has(b0)
              ? true
              : (b0 === "condition" || b0 === "moins") && b1 === "à"
                ? true
                : (b0 === "peur" || b0 === "crainte") && b1 === "de"
                  ? true
                  : b0 === "attendant" && b1 === "en"
                    ? true
                    : b0 === "ce" && b1 === "à" && b2 === "jusqu'"
                      ? true
                      : b0 === "dommage"
                        ? true
                        : b0 === "plaisir"
                          ? !!b1 && hasLemmaIn(b1, FAIRE_LEMMAS)
                          : b1 &&
                              hasLemmaIn(b1, TROUVER_LEMMAS) &&
                              (IMPERSONAL.has(b0) || EMOTION.test(b0) || /^(?:sympa|bizarre|étrange|dommage|génial|super|bien)$/.test(b0))
                            ? true
                            : IMPERSONAL.has(b0) || b0 === "probable"
                              ? b0 === "probable" && b1 !== "peu"
                                ? false
                                : b0 === "probable"
                                  ? !!b2 && MOOD_ETRE.has(b2)
                                  : !!b1 && MOOD_ETRE.has(b1)
                              : EMOTION.test(b0)
                                ? !!b1 && !MOOD_DEGREE.has(b1) && (MOOD_ETRE.has(b1) || moodFinite(b1))
                                : b0 === "mieux"
                                  ? !!b1 && hasLemmaIn(b1, VALOIR_LEMMAS)
                                  : (b0 === "peut" || b0 === "pourrait") && b1 === "se"
                                    ? true
                                    : b0 === "supposer" && b1 === "à"
                                      ? true
                                      : b0 === "il" && before[1]?.hyphen && b2 === "se"
                                        ? hasLemmaIn(before[1].w, FAIRE_POUVOIR_LEMMAS)
                                        : MOOD_PERSON[b0] && before[1]?.hyphen
                                          ? hasLemmaIn(before[1].w, WILL_LEMMAS)
                                          : !before[i] || !hasLemmaIn(before[i].w, WILL_LEMMAS)
                                            ? false
                                            : !(
                                                verbReadings(before[i].w).some((r) => r.lemma === "douter") &&
                                                ["se", "me", "te", "nous", "vous", "s'", "m'", "t'"].includes(before[i + 1]?.w ?? "")
                                              )
        else: "false"
      # The index after the words of a noun phrase from `i` ("tout le monde", "toutes ces
      # personnes"), or null when a complement makes the verb lie further on.
      nounPhraseEnd:
        args: "after: FrenchToken[], i: number"
        type: number | null
        return: >-
          after[i] && !moodFinite(after[i].w) && i < 4
            ? MOOD_COMPLEMENT.has(after[i].w)
              ? null
              : nounPhraseEnd(after, i + 1)
            : i
      # The verb of the clause a "que" opens, with its subject's person when a pronoun gives it.
      clauseVerb:
        args: "after: FrenchToken[], text: string"
        type: "{ verb: FrenchToken; person: number } | null"
        let:
          first: after[0]
          someone: '["chacun", "chacune", "quelqu''un"].includes(first.w)'
          person: "MOOD_PERSON[first.w] !== undefined ? MOOD_PERSON[first.w] : someone ? IL : 0"
          start: >-
            MOOD_PERSON[first.w] !== undefined || someone
              ? 1
              : MOOD_DETERMINERS.has(first.w) || (/^tou/.test(first.w) && MOOD_DETERMINERS.has(after[1]?.w))
                ? nounPhraseEnd(after, MOOD_DETERMINERS.has(first.w) ? 2 : 3)
                : /^\p{Lu}/u.test(text.slice(first.start, first.end))
                  ? 1
                  : null
          verb: after[skipWhile(after, start, (t) => MOOD_NEGATION.has(t.w) || CLITICS.has(t.w))]
        when:
          - "!!first"
          - start !== null
          - "!!verb"
        return: "{ verb, person }"
      # The text of the clause before and after the word at [start, end).
      clauseAround:
        args: "text: string, start: number, end: number"
        type: "[string, string]"
        let:
          bounds: sentenceBounds(text, start, 400, MOOD_SENTENCE_END)
          breaks: >-
            [...text.slice(bounds[0], bounds[1]).matchAll(MOOD_CLAUSE_BREAK)].map((b) => ({
              start: bounds[0] + b.index,
              end: bounds[0] + b.index + b[0].length,
            }))
          head: breaks.filter((b) => b.end <= start).at(-1)?.end ?? bounds[0]
          tail: breaks.find((b) => b.end > start && b.start >= end)?.start ?? bounds[1]
        return: "[text.slice(head, start), text.slice(end, tail)]"
      # "je" or "j'" right before a verb (ne and clitics skipped).
      firstPersonBefore:
        args: "before: FrenchToken[]"
        let:
          i: skipWhile(before, 0, (t) => MOOD_NEGATION.has(t.w) || CLITICS.has(t.w))
        return: 'before[i]?.w === "je" || before[i]?.w === "j''"'
      # A "si" clause in the imperfect.
      siImperfect:
        args: "part: string"
        let:
          si: "/(?:^|[\\s,])(?:si|s')[\\s ]*(?:\\p{L}+['’]?[\\s ]*){1,4}/iu.exec(part)"
        return: "!!si && si[0].split(/[\\s ’']+/u).some((w) => finiteInTense(w.toLowerCase(), 2).length > 0)"
      # The present indicative of a subjunctive form, for the person the clause gives it. A noun
      # subject is a third person.
      indicativeOf:
        args: "word: string, person: number"
        type: string[]
        let:
          readings: verbReadings(word)
        when:
          - '!(!readings.length || !readings.every((r) => typeof r.slot === "number"))'
          - readings.every((r) => r.tense === 6)
        return: >-
          [
            ...new Set(
              readings.flatMap((r) =>
                maskPersons(r.slot, person || IL + ILS)
                  ? conjugate({ ...r, tense: 1 }, lowestPerson(maskPersons(r.slot, person || IL + ILS))).slice(0, 1)
                  : [],
              ),
            ),
          ]
        else: "[]"
      # "il est certain qu'il parte", "j'espère que tu viennes".
      triggersIndicative:
        args: "before: FrenchToken[]"
        let:
          b0: before[0]?.w
          b1: before[1]?.w
          b2: before[2]?.w
        when: "!(!b0 || before.some((t) => MOOD_NEGATION.has(t.w) || t.hyphen))"
        return: >-
          b0 === "moment" && b1 === "du"
            ? true
            : TRUE_WORDS.has(b0)
              ? !!b1 && MOOD_ETRE.has(b1) && b2 === "il"
              : b0 === "paraît" || b0 === "parait"
                ? b1 === "il"
                : verbReadings(b0).some((r) => typeof r.slot === "number" && STATING.has(r.lemma))
        else: "false"
      # "j'aurai aimé savoir", "il aura aimé venir".
      wishedPast:
        args: "word: string, before: FrenchToken[], after: FrenchToken[], fix: WordFix"
        type: RawFinding | null
        let:
          participle: after[0].w
          j: skipWhile(after, 1, (t) => CLITICS.has(t.w))
        when:
          - '!(word === "aura" && (participle === "voulu" || !MOOD_PERSON[before[0]?.w ?? ""]))'
          - after[1]?.w === "bien" || moodInfinitive(after[j])
        return: 'fix([word === "aurai" ? "aurais" : "aurait"])'
      # "j'aimerai bien partir" -> "aimerais".
      politeWish:
        args: "word: string, sentence: string, after: FrenchToken[], fix: WordFix"
        type: RawFinding | null
        let:
          j: skipWhile(after, skipWords(after, 0, WISH_ADVERBS), (t) => CLITICS.has(t.w))
        when:
          - "!(FUTURE_CUES.test(sentence) || /\\b(?:quand|lorsque?|si|s'|dès)\\b/iu.test(sentence))"
          - moodInfinitive(after[j])
        return: "fix([`${word}s`])"
      # Modals and auxiliaries keep a polite conditional ("je voudrais"); only a "si" clause in the
      # imperfect tells their future is wrong ("si j'avais su, je n'aurai pas" -> "aurais"). "je
      # viendrais demain" -> "viendrai"; "si", reported speech or "mais" keep the conditional. "je
      # mangerai du chocolat si j'aimais ça", "Si l'on me faisait confiance, je parviendrai": the
      # "si" must sit in the clause of the verb: "Je partirai, mais si tu venais, je resterai".
      # "je saurai demain si tu étais là": "si" after savoir asks whether.
      conditionalFuture:
        args: "ctx: DetectContext, m: RegExpExecArray, word: string, sentence: string, fix: WordFix"
        type: RawFinding | null
        let:
          readings: 'verbReadings(word).filter((r) => typeof r.slot === "number")'
          modal: readings.some((r) => MOOD_MODALS.has(r.lemma))
          tense: >-
            readings.every((r) => r.tense === 5 && hasPerson(r.slot, JE))
              ? 5
              : readings.every((r) => r.tense === 4 && hasPerson(r.slot, JE))
                ? 4
                : 0
          parts: "tense === 4 ? clauseAround(ctx.text, m.index, m.index + m[0].length) : null"
        when:
          - readings.length > 0
          - "!(modal && !readings.every((r) => r.tense === 4 && hasPerson(r.slot, JE)))"
          - tense !== 0
        return: >-
          tense === 5
            ? !FUTURE_CUES.test(sentence) || /\b(?:si|s'|que|qu'|mais|sinon|volontiers)\b/iu.test(sentence)
              ? null
              : /\b(?:place|avis)\b/iu.test(sentence)
                ? null
                : fix([word.slice(0, -1)])
            : siImperfect(parts![0]) || (!readings.some((r) => r.lemma === "savoir") && siImperfect(parts![1]))
              ? fix([`${word}s`])
              : null
    frames:
      # "il faut que tu viens" -> "viennes", "bien qu'il est tard" -> "soit". "que tu finis": a
      # form right after its pronoun subject is no participle. Only a form that reads as a present
      # or future indicative and as nothing else. "que la porte ferme": a noun right after its
      # determiner is no verb. "que cela va fonctionner": "aller" + infinitive is reworded, not
      # put in the subjunctive. "qu'il est une médaille": "est" may stand for "ait" as well as
      # "soit".
      - regex: "{{WORD_START}}(?:(?:que|quoique)(?![\\p{L}\\p{M}\\p{N}_'’])|(?:qu|quoiqu)['’](?=\\p{L}))"
        flags: giu
        scan: owned
        lookback: 1
        let:
          lower: m[0].toLowerCase().replaceAll("’", "'")
          before: tokensBefore(ctx.text, m.index, 4)
          after: tokensAfter(ctx.text, m.index + m[0].length, 8)
          found: clauseVerb(after, ctx.text)
          verb: found.verb
          typed: ctx.text.slice(verb.start, verb.end)
          readings: verbReadings(verb.w).filter((r) => !(found.person && r.slot === "Q" && verb === after[1]))
          subjunctives: >-
            [
              ...new Set(
                readings
                  .map((r) => (found.person ? maskPersons(r.slot, found.person) : (r.slot as number)))
                  .map((mask, k) => (mask ? subjunctive(readings[k], lowestPerson(mask)) : null))
                  .filter((form) => form !== null),
              ),
            ]
          next: after[after.indexOf(verb) + 1]
          had: >-
            readings[0].lemma === "être" && next && (MOOD_DETERMINERS.has(next.w) || moodParticiple(next.w))
              ? subjunctive({ ...readings[0], lemma: "avoir" }, lowestPerson(readings[0].slot as number))
              : null
        when:
          - m.index >= ctx.from
          - lower.startsWith("quoiqu") || triggersSubjunctive(before)
          - "!!found"
          - '!(/\p{Lu}/u.test(typed) || verb.hyphen)'
          - >-
            !(!readings.length ||
              !readings.every((r) => typeof r.slot === "number" && (r.tense === 1 || r.tense === 4)))
          - "!(verb === after[1] && MOOD_DETERMINERS.has(after[0].w))"
          - "!(isInflectedNoun(verb.w) && !found.person)"
          - "!(subjunctives.length !== 1 || subjunctives.includes(verb.w))"
          - '!(readings[0].lemma === "aller" && next && verbReadings(next.w).some((r) => r.slot === "I"))'
        return: >-
          wordFinding(ctx, verb.start, typed, had ? [...new Set([...subjunctives, had])] : subjunctives, frame.ruleId, frame.messageKey, {
            start: m.index,
            end: verb.end,
          })
      # "il est certain qu'il parte" -> "part", "j'espère que tu viennes" -> "viens".
      - regex: "{{WORD_START}}(?:(?:que|quoique)(?![\\p{L}\\p{M}\\p{N}_'’])|(?:qu|quoiqu)['’](?=\\p{L}))"
        flags: giu
        scan: owned
        lookback: 1
        let:
          after: tokensAfter(ctx.text, m.index + m[0].length, 8)
          found: clauseVerb(after, ctx.text)
          typed: ctx.text.slice(found.verb.start, found.verb.end)
          forms: indicativeOf(found.verb.w, found.person)
        when:
          - m.index >= ctx.from
          - triggersIndicative(tokensBefore(ctx.text, m.index, 3))
          - "!(!found || found.verb.hyphen)"
          - '!(/\p{Lu}/u.test(typed) || found.verb.w === "soit")'
          - forms.length === 1
        return: 'wordFinding(ctx, found.verb.start, typed, forms, frame.ruleId, "review_msg_fr_indicative", { start: m.index, end: found.verb.end })'
      # "Tu ne la croies pas" -> "crois", "Il comprenne mal" -> "comprend": a subjunctive form in a
      # main clause, where no "que" comes before its pronoun subject. "il faille partir...": a
      # lowercase fragment at the text start may be cut after "que". "Il voulait tu viennes": a
      # "que" left out after a verb. "que je sache", "je ne sache pas": fixed phrases.
      - regex: "{{WORD_START}}(?:je|j['’]|tu|il|elle|on|ils|elles)(?![\\p{L}\\p{M}\\p{N}_’-])"
        flags: giu
        scan: owned
        lookback: 1
        let:
          subject: m[0].toLowerCase().replaceAll("’", "'")
          previous: tokensBefore(ctx.text, m.index, 1)[0]
          clause: ctx.text.slice(sentenceBounds(ctx.text, m.index, 400, MOOD_SENTENCE_END)[0], m.index)
          after: tokensAfter(ctx.text, m.index + m[0].length, 5)
          verb: after[skipWhile(after, 0, (t) => MOOD_NEGATION.has(t.w) || CLITICS.has(t.w))]
          typed: ctx.text.slice(verb.start, verb.end)
          forms: indicativeOf(verb.w, MOOD_PERSON[subject])
        when:
          - m.index >= ctx.from
          - '!(!MAIN_SUBJECTS.has(subject) || ctx.text[m.index - 1] === "-")'
          - "!(m.index === 0 && m[0] === subject)"
          - '!(previous && verbReadings(previous.w).some((r) => typeof r.slot === "number"))'
          - "!/(?:^|[^\\p{L}])(?:que|qu['’]|quoique|quoiqu['’])/iu.test(clause)"
          - '!(!verb || verb.hyphen || verb.w === "soit" || verb.w === "sache")'
          - typed === verb.w
          - forms.length === 1
        return: 'wordFinding(ctx, verb.start, typed, forms, frame.ruleId, "review_msg_fr_indicative", { start: m.index, end: verb.end })'
      # "si j'aurais su" -> "avais", "si tu viendras" -> "viens". "s'il": the elided "si" holds
      # its subject.
      - regex: "{{WORD_START}}(?:si(?![\\p{L}\\p{M}\\p{N}_'’])|s['’](?=ils?\\b))"
        flags: giu
        scan: owned
        lookback: 1
        let:
          lower: m[0].toLowerCase().replaceAll("’", "'")
          before: tokensBefore(ctx.text, m.index, 1)
          after: tokensAfter(ctx.text, m.index + m[0].length, 6)
          subject: after[0]?.w
          verb: after[skipWhile(after, 1, (t) => MOOD_NEGATION.has(t.w) || CLITICS.has(t.w))]
          typed: ctx.text.slice(verb.start, verb.end)
          readings: verbReadings(verb.w)
          person: MOOD_PERSON[subject]
          conditional: readings.every((r) => r.tense === 5)
          future: readings.every((r) => r.tense === 4)
          forms: >-
            [
              ...new Set(
                readings
                  .filter((r) => hasPerson(r.slot, person))
                  .flatMap((r) => conjugate({ ...r, tense: conditional ? 2 : 1 }, person)),
              ),
            ]
        when:
          - m.index >= ctx.from
          - "!(before[0] && !SI_OPENERS.has(before[0].w))"
          - 'lower === "s''" ? subject === "il" || subject === "ils" : !!subject && SUBJECT_AFTER_SI.has(subject)'
          - "!(!verb || verb.hyphen)"
          - '!/\p{Lu}/u.test(typed)'
          - '!(!readings.length || !readings.every((r) => typeof r.slot === "number"))'
          - conditional || future
          - forms.length === 1
        return: 'wordFinding(ctx, verb.start, typed, forms, frame.ruleId, "review_msg_fr_conditional", { start: m.index, end: verb.end })'
      # "j'aurai": the elided subject is glued on.
      - regex: "(?<![\\p{L}\\p{M}\\p{N}_-])(?:\\p{L}+rais?|aura)(?![\\p{L}\\p{M}\\p{N}_'’])"
        flags: giu
        scan: owned
        lookback: 1
        let:
          typed: m[0]
          word: typed.toLowerCase()
          before: tokensBefore(ctx.text, m.index, 4)
          after: tokensAfter(ctx.text, m.index + typed.length, 4)
          bounds: sentenceBounds(ctx.text, m.index, 400, MOOD_SENTENCE_END)
          sentence: ctx.text.slice(bounds[0], bounds[1])
          fix: '(alternatives: string[]) => wordFinding(ctx, m.index, typed, alternatives, frame.ruleId, "review_msg_fr_conditional", { start: before[0]?.start ?? m.index, end: after[1]?.end ?? m.index + typed.length })'
        when:
          - m.index >= ctx.from
          - '!(/\p{Lu}/u.test(typed.slice(1)) || ctx.text[m.index + typed.length] === "-")'
          - 'firstPersonBefore(before) || (word === "aura" && before[0])'
        return: >-
          (word === "aurai" || word === "aura") && WISHED.has(after[0]?.w ?? "")
            ? wishedPast(word, before, after, fix)
            : WISHING.has(word)
              ? politeWish(word, sentence, after, fix)
              : conditionalFuture(ctx, m, word, sentence, fix)
  - id: fr.negation
    checks: [frenchMissingNe]
    style: match
    message: review_msg_fr_missing_ne
    # Written French keeps the "ne" of a negation that spoken French drops: "j'ai pas compris" ->
    # "je n'ai pas compris", "on sait jamais" -> "on ne sait jamais". Opt-in: the dropped "ne" is
    # the norm of informal writing.
    sets:
      # h-initial verbs that elide ("je n'habite pas").
      MUTE_H: [habiter, habituer, hésiter, hériter, honorer, humilier, héberger, hiberner]
      NE_SUBJECTS:
        [je, tu, il, elle, "on", nous, vous, ils, elles, ça, cela, ceci, c', j', t', personne, rien]
      NE_DETERMINERS:
        [
          le,
          la,
          les,
          l',
          un,
          une,
          ce,
          cet,
          cette,
          ces,
          mon,
          ma,
          mes,
          ton,
          ta,
          tes,
          son,
          sa,
          ses,
          notre,
          nos,
          votre,
          vos,
          leur,
          leurs,
        ]
      # "jamais" meaning "ever": after a relative, a comparison or a doubt.
      EVER:
        [
          que,
          qu',
          qui,
          si,
          sans,
          avant,
          plus,
          moins,
          meilleur,
          meilleure,
          pire,
          seul,
          seule,
          quiconque,
          premier,
          première,
          dernier,
          dernière,
        ]
      # "pas mal", "pas loin", "pas à pas": no negation of the verb.
      NOT_NEGATING_PAS: [mal, loin, cher, moins, plus, tard]
      AFTER_PLUS: [jamais, rien, personne, aucun, aucune, guère]
      # "je joue plus beaucoup", "c'est plus très loin", "plus du tout": "plus" before a degree word
      # only negates ("more" would follow it).
      DEGREE_AFTER_PLUS: [beaucoup, très, trop, tellement, vraiment, du]
      # "ils peuvent plus penser": after these verbs "plus" and an infinitive negate.
      NE_MODALS: [pouvoir, vouloir, savoir, oser, devoir, falloir]
      # "il parle à personne", "il pense à rien": a preposition between the verb and its object.
      OBJECT_PREPOSITIONS: [à, de, "d'", avec, pour, sur, chez]
      # What may open the clause before a subject "personne" or "rien": "Plus personne", "que rien".
      NE_SUBJECT_OPENERS: [plus, que, qu', et, mais, si, car, donc, alors, quand]
      NEGATED_CLITICS: [me, m', te, t', se, s', "y", en, le, la, les, l', lui, leur, nous, vous]
    maps:
      # Elided subjects and their full form: "j'ai" -> "je n'ai".
      NE_ELIDED_SUBJECT: { "j'": je, "c'": ce }
    defs:
      NE_VOWEL: /^[aeiouyâàäéèêëîïôöûùüœæ]/i
      neFinite:
        args: "word: string"
        return: 'verbReadings(word).some((r) => typeof r.slot === "number")'
      # "Personne vient" -> "Personne ne vient", "Rien va plus" -> "Rien ne va": "personne" or
      # "rien" as the clause's subject; undefined when it is not one. "Personne morale": an
      # adjective; a noun homograph is the verb there ("Rien bouge"). "Personne est un terme...":
      # the noun named and defined.
      subjectNegation:
        args: "ctx: DetectContext, m: RegExpExecArray, before: FrenchToken[]"
        type: RawFinding | null | undefined
        let:
          after: tokensAfter(ctx.text, m.index + m[0].length, 4)
          i: 'skipWhile(after, 0, (t) => CLITICS.has(t.w) && t.w !== "nous" && t.w !== "vous")'
          verb: after[i]
          head: after[0]
          elides: >-
            NE_VOWEL.test(head.w) ||
            (head === verb && head.w.startsWith("h") && verbReadings(head.w).some((r) => MUTE_H.has(r.lemma)))
          apostrophe: 'ctx.text.slice(Math.max(0, m.index - 200), m.index).includes("’") ? "’" : "''"'
        when:
          - before.every((t) => NE_SUBJECT_OPENERS.has(t.w))
          - "!(!verb || verb.hyphen || !hasPerson(finitePersons(verb.w), IL))"
          - '!/\p{Lu}/u.test(ctx.text.slice(verb.start, verb.end))'
          - "!adjectiveReadings(verb.w).length"
          - '!(verbReadings(verb.w).some((r) => r.lemma === "être") && NE_DETERMINERS.has(after[i + 1]?.w ?? ""))'
        return: >-
          namedExampleBefore(ctx.text, m.index) || ctx.dictionary.has(m[0].toLowerCase())
            ? null
            : {
                ruleId: "frenchMissingNe",
                messageKey: "review_msg_fr_missing_ne",
                range: { start: head.start, end: verb.end },
                alternatives: [`${elides ? `n${apostrophe}` : "ne "}${ctx.text.slice(head.start, verb.end)}`],
                context: { start: m.index, end: verb.end },
              }
        else: undefined
      # The subject and the clitics before the verb, and the finding that puts "ne" before them.
      # "Vous inquiétez pas", "T'as pas": the chain's first pronoun is the subject. "finiras pas
      # comprendre": "par" mistyped, not a negation. "t'a pas": an elided "tu" needs a
      # second-person verb. "j'ai pas" -> "je n'ai pas", "t'as pas" -> "tu n'as pas".
      negatedClause:
        args: "ctx: DetectContext, m: RegExpExecArray, anchor: string, before: FrenchToken[], skip: number, verb: FrenchToken"
        type: RawFinding | null
        let:
          found: "before.findIndex((t, k) => k >= 1 + skip && !(CLITICS.has(t.w) && !(k > 1 + skip && NE_ELIDED_SUBJECT[t.w])))"
          i: "found < 0 ? Math.max(before.length, 1 + skip) : found"
          lead: before[i - 1]
          own: before[i]
          tLead: '!own && i > 1 + skip && lead.w === "t''" && i === 2 + skip'
          vLead: '!own && i > 1 + skip && !tLead && (lead.w === "vous" || lead.w === "nous")'
          subject: "own ? own : tLead || vLead ? lead : undefined"
          first: "own ? lead : tLead ? verb : vLead ? (before[i - 2] ?? verb) : lead"
          typedSubject: ctx.text.slice(subject.start, subject.end)
          isName: '/^\p{Lu}\p{L}+$/u.test(typedSubject) && capitalizedName(ctx.text, subject.start, typedSubject) && !neFinite(subject.w)'
          isNoun: '!neFinite(subject.w) && NE_DETERMINERS.has(before[i + 1]?.w ?? "")'
          apostrophe: 'ctx.text.slice(Math.max(0, m.index - 200), m.index).includes("’") ? "’" : "''"'
          headWord: first.w.replace(/'$/, "")
          elides: 'NE_VOWEL.test(headWord) || (headWord.startsWith("h") && verbReadings(headWord).some((r) => MUTE_H.has(r.lemma)))'
          elided: 'subject.w === "t''" ? "tu" : NE_ELIDED_SUBJECT[subject.w]'
          start: "elided && subject.end === first.start ? subject.start : first.start"
          replacement: '(elides ? `n${apostrophe}` : "ne ") + ctx.text.slice(first.start, verb.end)'
        when:
          - "!!subject"
          - NE_SUBJECTS.has(subject.w) || isName || isNoun
          - "!(namedExampleBefore(ctx.text, m.index) || ctx.dictionary.has(anchor))"
          - '!(anchor === "pas" && verbReadings(verb.w).some((r) => r.lemma === "finir"))'
          - '!(subject.w === "t''" && !hasPerson(finitePersons(verb.w), TU))'
        return: >-
          finding("frenchMissingNe", "review_msg_fr_missing_ne", start, verb.end, [
            start === subject.start
              ? `${/^\p{Lu}/u.test(typedSubject) ? elided[0].toUpperCase() + elided.slice(1) : elided} ${replacement}`
              : replacement,
          ], { context: { start: subject.start, end: m.index + m[0].length } })
      # A negation word after its verb with no "ne". "un pas", "le faux pas": a noun. "de personne
      # à personne": person to person. "rien que pour toi" (only), "rien ne l'arrête" (a new
      # subject).
      missingNeVerb:
        args: "ctx: DetectContext, m: RegExpExecArray, anchor: string, before: FrenchToken[]"
        type: RawFinding | null
        let:
          skip: '(anchor === "personne" || anchor === "rien") && OBJECT_PREPOSITIONS.has(before[0]?.w ?? "") ? 1 : 0'
          verb: before[skip]
          pair: tokensAfter(ctx.text, m.index + m[0].length, 2)
          next: pair[0]
          second: pair[1]
        when:
          - "!(!verb || verb.hyphen || verb.end + 3 < (skip ? before[0].start : m.index))"
          - '!(/\p{Lu}/u.test(ctx.text.slice(verb.start, verb.end).slice(1)) || !neFinite(verb.w))'
          - >-
            !(isInflectedNoun(verb.w) &&
              !verbReadings(verb.w).some((r) => r.lemma === "être") &&
              !["avoir", "aller", "faire"].some((l) => verbReadings(verb.w).some((r) => r.lemma === l)))
          - '!(anchor === "pas" && next && NOT_NEGATING_PAS.has(next.w))'
          - '!(anchor === "pas" && next?.w === "à" && second?.w === "pas")'
          - '!(skip && next?.w === "à")'
          - >-
            !(anchor === "plus" &&
              !(next &&
                (AFTER_PLUS.has(next.w) ||
                  (DEGREE_AFTER_PLUS.has(next.w) && (next.w !== "du" || second?.w === "tout")) ||
                  (verbReadings(verb.w).some((r) => NE_MODALS.has(r.lemma)) && verbReadings(next.w).some((r) => r.slot === "I")))))
          - '!(anchor === "rien" && next && ["que", "qu''", "ne", "n''"].includes(next.w))'
          - '!(anchor === "jamais" && before.some((t) => EVER.has(t.w)))'
        return: negatedClause(ctx, m, anchor, before, skip, verb)
    frames:
      # A negation word with no "ne" before the verb: "j'ai pas compris" -> "je n'ai pas compris".
      - regex: "{{WORD_START}}(?:pas|jamais|plus|rien|personne|guère|aucune?){{WORD_END}}"
        flags: giu
        scan: owned
        lookback: 1
        let:
          anchor: m[0].toLowerCase()
          before: tokensBefore(ctx.text, m.index, 8)
          subjectResult: 'anchor === "personne" || anchor === "rien" ? subjectNegation(ctx, m, before) : undefined'
        when:
          - m.index >= ctx.from
          - '!before.some((t) => t.w === "ne" || t.w === "n''" || t.w === "ni")'
        return: "subjectResult !== undefined ? subjectResult : missingNeVerb(ctx, m, anchor, before)"
      # "pour pas qu'il se fâche" -> "pour qu'il ne se fâche pas": the written negation of the
      # purpose clause wraps its verb.
      - regex: "{{WORD_START}}pour[ \\t]+pas[ \\t]+qu(?:e[ \\t]+|['’])"
        flags: giu
        scan: owned
        lookback: 1
        let:
          after: tokensAfter(ctx.text, m.index + m[0].length, 6)
          subject: after[0]
          i: skipWords(after, 1, NEGATED_CLITICS)
          verb: after[i]
          apostrophe: '/’/.test(ctx.text.slice(m.index, verb.end)) ? "’" : "''"'
          head: "after[1] && i > 1 ? after[1] : verb"
        when:
          - m.index >= ctx.from
          - "!(!subject || !(NE_SUBJECTS.has(subject.w) || subject.w in NE_ELIDED_SUBJECT))"
          - "!(!verb || verb.hyphen || !neFinite(verb.w))"
          - "!namedExampleBefore(ctx.text, m.index)"
        return: >-
          finding(frame.ruleId, frame.messageKey, m.index, verb.end, [
            `${ctx.text.slice(m.index, m.index + 4)} ${/['’]$/.test(m[0]) ? `qu${apostrophe}` : "que "}${NE_ELIDED_SUBJECT[subject.w] ?? ctx.text.slice(subject.start, subject.end)} ${NE_VOWEL.test(head.w) ? `n${apostrophe}` : "ne "}${ctx.text.slice(head.start, verb.end)} pas`,
          ], { context: { start: m.index, end: verb.end } })
  - id: fr.smallWords
    checks: [frenchHomophones]
    style: match
    message: review_msg_fr_homophone
    # More sound-alike small words told apart by a neighbour: "il ni arrive pas" (n'y), "il si
    # prend bien" (s'y), "il sans va" (s'en), "mes je" (mais), "dans prendre" (d'en), "cela leurs
    # permet" (leur), "mêmes si" (même), "parler d'avantage" (davantage), and "quel que soit" with
    # the gender and number of its noun.
    maps:
      # "croître" (to grow) has no object and takes no "que", no infinitive and no "à" + a noun:
      # those read "croire" (to believe). "il ne croît rien" -> "croit", "je te croîs" -> "crois".
      GROW_TO_BELIEVE: { croît: croit, croîs: crois, crût: crut, crûs: crus, crû: cru }
      # The subjunctive of avoir in a sentence with no "que" or relative to govern it is the
      # indicative that sounds alike: "il ait venu" -> "est", "j'aie fini" -> "ai".
      AVOIR_INDICATIVE: { aie: [ai, suis], aies: [as, es], ait: [a, est], aient: [ont, sont] }
      AVOIR_SUBJECTS: { aie: [je, "j'"], aies: [tu], ait: [il, elle, on], aient: [ils, elles] }
      QUELLE_FORMS:
        {
          quel: ["qu'elle", "qu'il"],
          quelle: ["qu'elle"],
          quels: ["qu'ils", "qu'elles"],
          quelles: ["qu'elles"],
        }
    sets:
      SW_SUBJECTS: [je, tu, il, elle, on, nous, vous, ils, elles]
      SW_THIRD: [il, elle, on, ils, elles]
      SW_CLAUSE_PRONOUNS:
        [je, j', tu, il, elle, "on", nous, vous, ils, elles, ce, c', ça, cela, pour, moi, toi]
      SW_ADVERBS_AFTER_MAIS:
        [bien, pas, plutôt, aussi, surtout, encore, non, oui, pourtant, alors, si, quand]
      SW_DETERMINERS:
        [
          le,
          la,
          les,
          l',
          un,
          une,
          mon,
          ma,
          mes,
          ton,
          ta,
          tes,
          son,
          sa,
          ses,
          ce,
          cet,
          cette,
          ces,
          notre,
          nos,
          votre,
          vos,
          leur,
          leurs,
        ]
      # Verbs that take "avantage" as their object: "tirer avantage", "avoir l'avantage".
      AVANTAGE_VERBS:
        [avoir, tirer, offrir, présenter, voir, trouver, apporter, donner, retirer, procurer]
      # Prepositions after which "nous"/"vous" + a plural noun is the possessive misspelt.
      NOUN_PREPOSITIONS: [de, d', à, pour, avec, sur, par, dans, sans, selon]
      # Plurals that may address the reader or follow the pronoun: "merci à vous messieurs", "pour
      # nous autres".
      VOCATIVES: [messieurs, mesdames, mesdemoiselles, amis, enfants, autres]
      SW_DEMONSTRATIVES: [ce, cet, cette, ces]
      SW_DEMONSTRATIVE_PRONOUNS: [celui, celle, ceux, celles]
      # Prepositions whose object "soi" may end the clause: "prendre soin de soi", "chez soi".
      SOI_PREPOSITIONS: [de, d', derrière, devant, pour, sur, chez, avec, sans, à, entre]
      SW_STRESSED: [moi, toi, lui, elle, eux, nous, vous, elles, soi]
      # What "est" may introduce: a place, a degree or a time adverb.
      AFTER_EST:
        [
          sur,
          sous,
          dans,
          là,
          ici,
          très,
          déjà,
          bien,
          trop,
          plus,
          toujours,
          encore,
          vraiment,
          assez,
          si,
          devant,
          derrière,
          loin,
          près,
        ]
      SUBJECT_PRONOUN_WORDS: [je, j', tu, il, elle, "on", nous, vous, ils, elles]
      # Words that open a clause of their own: "ce qu'il veut est simple", "celui qui part est
      # triste", "si tu viens, ..." keep the main verb "est"; so does an indirect question ("je
      # sais quel est le problème").
      SUBORDINATING:
        [
          que,
          qu',
          qui,
          dont,
          où,
          ce,
          si,
          quand,
          lorsque,
          lorsqu',
          comme,
          puisque,
          puisqu',
          quoi,
          lequel,
          laquelle,
          quel,
          quelle,
          quels,
          quelles,
          comment,
          pourquoi,
          combien,
        ]
      GROW_BELIEF_OBJECTS:
        [
          que,
          qu',
          rien,
          cela,
          ça,
          ceci,
          le,
          la,
          les,
          l',
          ce,
          cet,
          cette,
          ces,
          mon,
          ma,
          mes,
          ton,
          ta,
          tes,
          son,
          sa,
          ses,
          notre,
          nos,
          votre,
          vos,
          leur,
          leurs,
        ]
      GROW_OBJECT_CLITICS: [me, m', te, t', le, la, les, l', en]
      # "croît la nuit", "croît cette année": a time, not an object.
      GROW_TIMES:
        [
          nuit,
          jour,
          jours,
          matin,
          soir,
          an,
          ans,
          année,
          années,
          hiver,
          été,
          printemps,
          automne,
          saison,
          semaine,
          mois,
          siècle,
        ]
      RELATIVE_BELIEF: [auquel, auxquels, auxquelles, laquelle, quoi]
      GROW_AFTER_VERB:
        [
          ne,
          n',
          pas,
          plus,
          jamais,
          guère,
          point,
          vraiment,
          bien,
          aussi,
          même,
          toujours,
          encore,
          donc,
        ]
      # Verbs that take être: "il est venu", not "il a venu".
      AVOIR_ETRE_VERBS:
        [
          aller,
          venir,
          partir,
          arriver,
          naître,
          mourir,
          rester,
          tomber,
          entrer,
          sortir,
          monter,
          descendre,
          retourner,
          devenir,
          revenir,
          rentrer,
          décéder,
          parvenir,
          intervenir,
          survenir,
        ]
      SKIPPED_AFTER:
        [
          pas,
          plus,
          jamais,
          rien,
          point,
          guère,
          déjà,
          bien,
          toujours,
          souvent,
          vraiment,
          aussi,
          encore,
          tout,
        ]
      # Words after which "qu'elle" opens a clause: "afin qu'elle", "dès qu'elle".
      QUELLE_OPENERS: [afin, pour, dès, bien, sans, avant, pendant, parce, alors]
      QUELLE_VERBS: [a, est, sont, ont, soit, soient, fait, était, sera]
      QUELLE_CLITICS: [ne, n', me, m', te, t', se, s', le, la, les, l', lui, leur, "y", en]
      HUNDRED_NUMBER_WORDS:
        [
          un,
          une,
          deux,
          trois,
          quatre,
          cinq,
          six,
          sept,
          huit,
          neuf,
          dix,
          onze,
          douze,
          treize,
          quatorze,
          quinze,
          seize,
          vingt,
          trente,
          quarante,
          cinquante,
          soixante,
          cent,
          mille,
          et,
        ]
      MULTIPLIERS: [deux, trois, quatre, cinq, six, sept, huit, neuf]
    defs:
      AVOIR_GOVERNORS: '/(?<![\p{L}\p{M}])(?:(?:que|quoique|qui|dont|où|quoi|soit|plaise)(?![\p{L}\p{M}])|(?:qu|quoiqu)[''’])/iu'
      swFinite:
        args: "word: string"
        return: 'verbReadings(word).some((r) => typeof r.slot === "number")'
      swNounLike:
        args: "word: string"
        return: isInflectedNoun(word) || !!nounGender(word)
      swVerbOnly:
        args: "word: string"
        return: "!swNounLike(word) && swFinite(word)"
      swInfinitiveOnly:
        args: "word: string"
        return: '!nounGender(word) && verbReadings(word).some((r) => r.slot === "I")'
      participleOrAdjective:
        args: "word: string"
        return: 'verbReadings(word).some((r) => r.slot === "Q") || (adjectiveReadings(word).length > 0 && !nounGender(word))'
      # "de vous impressions" -> "vos", "pour nous enfants" -> "nos": after a preposition a plural
      # noun no verb spells takes the possessive.
      possessiveForPronoun:
        args: "ctx: DetectContext, m: RegExpExecArray, previous: string | undefined, next: FrenchToken"
        type: RawFinding | null
        when:
          - "!(!previous || !NOUN_PREPOSITIONS.has(previous) || VOCATIVES.has(next.w))"
          - "!(!/[sx]$/.test(next.w) || isNounLemma(next.w) || !isInflectedNoun(next.w))"
          - "!(verbReadings(next.w).length || adjectiveReadings(next.w).length)"
          - '!/^\p{Lu}/u.test(ctx.text.slice(next.start, next.end))'
        return: 'homoFix(ctx, m, [m[0].toLowerCase() === "nous" ? "nos" : "vos"], { start: m.index, end: next.end })'
      # "cette voiture ci" -> "voiture-ci", "celui si" -> "celui-ci": the demonstrative's "-ci".
      # "celui si cher": "si" before an adjective or an adverb is the degree word.
      demonstrativeCi:
        args: "ctx: DetectContext, m: RegExpExecArray, before: FrenchToken[], next: FrenchToken | undefined"
        type: RawFinding | null
        let:
          head: before[0]
          pronoun: SW_DEMONSTRATIVE_PRONOUNS.has(head.w)
        when:
          - '!(!head || ctx.text[m.index - 1] === "-" || ctx.text[m.index + 2] === "-")'
          - "!namedExampleBefore(ctx.text, m.index)"
          - >-
            pronoun
              ? !(m[0].toLowerCase() === "si" && next && !swFinite(next.w))
              : m[0].toLowerCase() === "ci" && swNounLike(head.w) && before.slice(1, 3).some((t) => SW_DEMONSTRATIVES.has(t.w))
        return: 'finding("frenchHomophones", "review_msg_fr_homophone", head.start, m.index + m[0].length, [`${ctx.text.slice(head.start, head.end)}-ci`])'
      # "je vais sois à la plage ou" -> "soit", "les contenus soie appropriés" -> "soient". "que je
      # sois", "ne sois pas", "et sois sage": a subject or an order keeps it. "soie" (silk) is a
      # noun: after a noun and before an adjective it is "soit".
      soisSoie:
        args: "ctx: DetectContext, m: RegExpExecArray, before: FrenchToken[], next: FrenchToken | undefined"
        type: RawFinding | null
        let:
          previous: before[0]
        when: "!!previous && !!next"
        return: >-
          m[0].toLowerCase() === "sois"
            ? !verbReadings(previous.w).length || isVerbHomograph(previous.w)
              ? null
              : ["je", "tu", "ne", "n'", "et", "mais", "ou", "donc"].includes(previous.w)
                ? null
                : homoFix(ctx, m, ["soit"])
            : !swNounLike(previous.w) || swFinite(previous.w) || SW_DETERMINERS.has(previous.w)
              ? null
              : !adjectiveReadings(next.w).length && !verbReadings(next.w).some((r) => r.slot === "Q")
                ? null
                : swNounLike(next.w) && !adjectiveReadings(next.w).length
                  ? null
                  : homoFix(ctx, m, [/[sx]$/.test(previous.w) ? "soient" : "soit"])
      # "qu'il soi" -> "soit", "quelque soi" -> "soit", "Soi prudent" -> "Sois". "il faut soi
      # partir, soit rester": the "soit ... soit" choice before an infinitive or a noun phrase;
      # "cette soirée soi mémorable": the verb between a noun and its attribute.
      soiVerb:
        args: "ctx: DetectContext, m: RegExpExecArray, previous: string | undefined, next: FrenchToken | undefined, fix: WordFix"
        type: RawFinding | null
        let:
          opening: /(?:^|[.!?…]\s*)$/u.test(ctx.text.slice(Math.max(0, m.index - 4), m.index))
        return: >-
          previous && ["il", "elle", "on", "ça", "cela", "quelque"].includes(previous)
            ? fix(["soit"])
            : !previous && opening && next && adjectiveReadings(next.w).length
              ? fix(["sois"])
              : !previous || !next
                ? null
                : (swFinite(previous) && !isVerbHomograph(previous) && (swInfinitiveOnly(next.w) || SW_DETERMINERS.has(next.w))) ||
                    (swNounLike(previous) &&
                      !swFinite(previous) &&
                      !SW_DETERMINERS.has(previous) &&
                      (adjectiveReadings(next.w).length > 0 || isInflectedNoun(next.w)) &&
                      !nounGender(next.w) &&
                      !swFinite(next.w))
                  ? fix(["soit"])
                  : null
      # "prendre soin de soit." -> "soi"; "quoi qu'il en soit.": "en soit" is the verb.
      soiSoit:
        args: "ctx: DetectContext, m: RegExpExecArray, previous: string | undefined, next: FrenchToken | undefined"
        type: RawFinding | null
        let:
          fix: "(alternatives: string[]) => homoFix(ctx, m, alternatives, { start: m.index, end: next?.end ?? m.index + m[0].length })"
        return: >-
          m[0].toLowerCase() === "soi"
            ? soiVerb(ctx, m, previous, next, fix)
            : !previous || !SOI_PREPOSITIONS.has(previous)
              ? null
              : !/^[\s ]*(?:[.!?…;,)]|$)/u.test(ctx.text.slice(m.index + m[0].length))
                ? null
                : fix(["soi"])
      # "il et parti", "le garçon et arrivé", "ceci et une table" -> "est". "chez elle et fait": a
      # stressed pronoun after a preposition is no subject. The word after the attribute closes
      # the clause or opens a complement. "Le garçon et arrivé.": a determiner + noun opening the
      # clause. "Le but et de partir": "de" and an infinitive, the attribute of "est".
      swEtToEst:
        args: "ctx: DetectContext, m: RegExpExecArray, before: FrenchToken[], after: FrenchToken[]"
        type: RawFinding | null
        let:
          next: after[0]
          subject: before[0]?.w
          fix: '() => homoFix(ctx, m, ["est"], { start: before[0]?.start ?? m.index, end: next.end })'
          opensClause: '!before[1] || ["et", "mais", "que", "qu''", "car", "donc"].includes(before[1].w)'
          attribute: participleOrAdjective(next.w) || AFTER_EST.has(next.w)
          closes: "!after[1] || /^(?:à|au|aux|en|dans|sur|par|de|d'|du|pour|avec)$/.test(after[1].w)"
        when:
          - '!(!next || /^\p{Lu}/u.test(ctx.text.slice(next.start, next.end)))'
          - "!(!subject || SW_STRESSED.has(next.w))"
        return: >-
          subject === "il" || subject === "on" || subject === "qui"
            ? attribute || SW_DETERMINERS.has(next.w)
              ? fix()
              : null
            : ["ceci", "cela", "ça"].includes(subject)
              ? (attribute && closes) || /^(?:un|une|le|la|les)$/.test(next.w)
                ? fix()
                : null
              : subject === "elle" && !opensClause
                ? null
                : subject === "elle"
                  ? AFTER_EST.has(next.w) || (attribute && closes)
                    ? fix()
                    : null
                  : before.length === 2 && SW_DETERMINERS.has(before[1].w) && swNounLike(subject)
                    ? AFTER_EST.has(next.w) ||
                      (verbReadings(next.w).some((r) => r.slot === "Q") && !nounGender(next.w) && closes) ||
                      ((next.w === "de" || next.w === "d'") && !!after[1] && swInfinitiveOnly(after[1].w))
                      ? fix()
                      : null
                    : null
      # Only a verb that cannot follow "est": a plural one, or one after ne/se ("est a une cause"
      # reads as "what is has a cause").
      estBeforeVerb:
        args: "ctx: DetectContext, m: RegExpExecArray, before: FrenchToken[], after: FrenchToken[]"
        type: RawFinding | null
        let:
          clitic: '["ne", "n''", "se", "s''"].includes(after[0].w)'
          verb: "clitic ? after[1] : after[0]"
          readings: verbReadings(verb.w)
        when:
          - '!(!verb || verb.hyphen || /^\p{Lu}/u.test(ctx.text.slice(verb.start, verb.end)))'
          - "!(!clitic && !/(?:ent|ont)$/.test(verb.w))"
          - verb.w !== "est"
          - '!(!readings.length || !readings.every((r) => typeof r.slot === "number"))'
          - "!(swNounLike(verb.w) || adjectiveReadings(verb.w).length)"
        return: 'homoFix(ctx, m, ["et"], { start: before[0].start, end: verb.end })'
      # "il est marié est a trois enfants", "il partit est ne revint pas" -> "et". "L'aile est
      # n'est que", "la partie est fut": the noun "est" (east). "il est agile est grand", "elle a
      # un manteau est des gants": the clause already has its verb, and no relative or
      # subordinate clause gives "est" a subject of its own. A coordination or a capital (a
      # sentence run on without its space) also starts afresh. The earlier verb right after its
      # subject pronoun: "il est agile est grand".
      swEstToEt:
        args: "ctx: DetectContext, m: RegExpExecArray, before: FrenchToken[], after: FrenchToken[]"
        type: RawFinding | null
        let:
          next: after[0]
          clause: tokensBefore(ctx.text, m.index, 12)
          opener: >-
            clause.findIndex(
              (t, i) =>
                SUBORDINATING.has(t.w) ||
                ["et", "ou", "mais"].includes(t.w) ||
                (i > 0 && /^\p{Lu}/u.test(ctx.text.slice(t.start, t.end)) && i < clause.length - 1))
          own: "opener < 0 ? clause : clause.slice(0, opener)"
        when:
          - '!(!next || !before[0] || ["c''", "n''", "qu''", "ce", "qui", "plus", "de", "on", "il", "elle", "tout"].includes(before[0].w))'
          - "!(before[1] && SW_DETERMINERS.has(before[1].w))"
        return: >-
          opener < 0 &&
          own.some(
            (t, i) =>
              i > 0 &&
              SUBJECT_PRONOUN_WORDS.has(own[i + 1]?.w ?? "") &&
              (t.w === "est" || t.w === "a" || !isVerbHomograph(t.w)) &&
              verbReadings(t.w).some((r) => typeof r.slot === "number"),
          ) &&
          !/^\p{Lu}/u.test(ctx.text.slice(next.start, next.end))
            ? homoFix(ctx, m, ["et"], { start: before[0].start, end: next.end })
            : estBeforeVerb(ctx, m, before, after)
      # "il ni arrive pas" -> "n'y"; "il si prend bien", "on ci sent bien" -> "s'y"; "il sans
      # va", "il c'en rend compte" -> "s'en". "il venait ci souvent", "je ne sais pas ci c'est
      # possible": "si" misspelt; "comme ci comme ça" and "de ci de là" keep it; a noun before it
      # may want "-ci". "mes je pense", "mai il pleut", "mas je" -> "mais"; "mes moi" is no
      # phrase, "pour moi" is: only "mais pour moi". "je viens dans prendre" -> "d'en". "dan la
      # maison" -> "dans" (lowercase: "Dan" is a name, "dan" a judo grade). "cela leurs permet"
      # -> "leur". "mêmes si", "ils sont mêmes grands" -> "même" (the adverb).
      smallWordNext:
        args: "ctx: DetectContext, m: RegExpExecArray, lower: string, previous: string | undefined, next: FrenchToken, before: FrenchToken[], after: FrenchToken[], fix: WordFix"
        type: RawFinding | null
        let:
          n: next.w
          adverb: '["pas", "plus", "jamais", "et", "mais"].includes(previous ?? "")'
        return: >-
          previous &&
          SW_SUBJECTS.has(previous) &&
          swVerbOnly(n) &&
          !/^\p{Lu}/u.test(m[0].slice(1)) &&
          (lower === "ni" || ((lower === "si" || lower === "ci" || lower === "sans") && SW_THIRD.has(previous)))
            ? fix([lower === "ni" ? "n'y" : lower === "sans" ? "s'en" : "s'y"])
            : lower === "ci"
              ? ctx.text[m.index - 1] === "-" || ctx.text[m.index + 2] === "-"
                ? null
                : previous && !adverb && (["comme", "de", "par"].includes(previous) || swNounLike(previous))
                  ? null
                  : previous && !adverb && !swFinite(previous)
                    ? null
                    : fix(["si"])
              : lower === "mes" || lower === "mai" || lower === "mas"
                ? lower === "mai" && (/\d[\s  ]*$/u.test(ctx.text.slice(0, m.index)) || previous === "de")
                  ? null
                  : !SW_CLAUSE_PRONOUNS.has(n) && !(lower === "mes" && SW_ADVERBS_AFTER_MAIS.has(n))
                    ? null
                    : lower === "mes" && (n === "moi" || n === "toi")
                      ? null
                      : fix(["mais"])
                : lower === "dans" && swInfinitiveOnly(n) && !SW_DETERMINERS.has(n)
                  ? fix(["d'en"])
                  : m[0] === "dan" &&
                      SW_DETERMINERS.has(n) &&
                      !/\d[\s  ]*(?:e|er|ème)?[\s  ]*$/u.test(ctx.text.slice(Math.max(0, m.index - 8), m.index))
                    ? fix(["dans"])
                    : lower === "leurs" && swVerbOnly(n) && !SW_DETERMINERS.has(n)
                      ? fix(["leur"])
                      : lower === "nous" || lower === "vous"
                        ? possessiveForPronoun(ctx, m, previous, next)
                        : lower === "et"
                          ? swEtToEst(ctx, m, before, after)
                          : lower === "est"
                            ? swEstToEt(ctx, m, before, after)
                            : lower === "mêmes"
                              ? previous && SW_DETERMINERS.has(previous)
                                ? null
                                : ["si", "s'il", "s'ils", "lorsque", "lorsqu'", "quand"].includes(n) || n === "s'"
                                  ? fix(["même"])
                                  : null
                              : null
    frames:
      # A short word that a homophone may stand for: "il ni arrive pas" -> "n'y", "mes je pense" ->
      # "mais", "cela leurs permet" -> "leur". "çà" only stands in "çà et là"; alone it is the
      # pronoun "ça".
      - regex: "{{WORD_START}}(?:ni|si|ci|sans|mes|mai|mas|dans|dan|leurs|mêmes|et|est|nous|vous|soi|soit|sois|soie|çà){{WORD_END}}"
        flags: giu
        scan: owned
        lookback: 1
        let:
          lower: m[0].toLowerCase().replaceAll("’", "'")
          before: tokensBefore(ctx.text, m.index, 3)
          after: tokensAfter(ctx.text, m.index + m[0].length, 3)
          previous: before[0]?.w
          next: after[0]
          fix: "(alternatives: string[]) => homoFix(ctx, m, alternatives, { start: before[0]?.start ?? m.index, end: next?.end ?? m.index + m[0].length })"
          ci: 'lower === "ci" || lower === "si" ? demonstrativeCi(ctx, m, before, next) : null'
        when: m.index >= ctx.from
        return: >-
          lower === "soi" || lower === "soit"
            ? soiSoit(ctx, m, previous, next)
            : lower === "sois" || lower === "soie"
              ? soisSoie(ctx, m, before, next)
              : lower === "çà"
                ? next?.w === "et"
                  ? null
                  : homoFix(ctx, m, ["ça"])
                : ci
                  ? ci
                  : !next
                    ? null
                    : smallWordNext(ctx, m, lower, previous, next, before, after, fix)
      # "je pense d'avantage à toi" -> "davantage" (more); "tirer avantage" keeps the noun. "il n'y
      # a pas d'avantage", "aucun": the noun.
      - regex: "(?<![\\p{L}\\p{M}\\p{N}_-])d['’]avantage{{WORD_END}}"
        flags: giu
        scan: owned
        lookback: 1
        let:
          before: tokensBefore(ctx.text, m.index, 4)
          next: tokensAfter(ctx.text, m.index + m[0].length, 1)[0]
          verb: 'before[skipWhile(before, 0, (t) => ["pas", "plus", "jamais", "rien", "en", "bien", "encore", "beaucoup"].includes(t.w))]'
          readings: verbReadings(verb.w)
        when:
          - m.index >= ctx.from
          - '!(next && ["sur", "de", "d''", "du", "des", "pour", "fiscal", "concurrentiel"].includes(next.w))'
          - "!!verb"
          - "!(!readings.length || readings.some((r) => AVANTAGE_VERBS.has(r.lemma)))"
          - '!(isInflectedNoun(verb.w) && !readings.some((r) => typeof r.slot === "number"))'
          - '!before.some((t) => t.w === "aucun" || t.w === "y")'
        return: 'homoFix(ctx, m, ["davantage"], { start: verb.start, end: m.index + m[0].length })'
      # "quel que soit sa raison" -> "quelle que soit", "quelles que soit ses idées" -> "quels que
      # soient": "quel" and "soit" take the gender and number of the noun. Coordinated nouns ("sa
      # cause et ses solutions") take the plural: leave them.
      - regex: "{{WORD_START}}quel(?:le)?s?[ \\t]+que[ \\t]+soi(?:en)?t{{WORD_END}}"
        flags: giu
        scan: owned
        lookback: 1
        let:
          typed: m[0]
          after: tokensAfter(ctx.text, m.index + typed.length, 3)
          det: after[0]?.w
          noun: after[1]?.w
