          wordFinding(ctx, start, ctx.text.slice(start, m.index + 1),
            nots.map((not) =>
              opener?.w === "si"
                ? `s'il ${not}y`
                : opener?.w === "qu'"
                  ? `qu'il ${not}y`
                  : opener
                    ? `${ctx.text.slice(opener.start, m.index).trimEnd()} il ${not}y`
                    : `il ${not}y`),
            frame.ruleId, frame.messageKey, { start, end: verb.end })
