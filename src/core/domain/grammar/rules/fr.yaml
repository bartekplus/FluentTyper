          accented: word[1] === "â"
          before: tokensBefore(ctx.text, m.index, 3)
          after: tokensAfter(ctx.text, m.index + typed.length, 3)
          noun: /^t[aâ]ches?$/.test(word) && before[0] !== undefined && HOMO_DETERMINERS.has(before[0].w)
          fits: >-
            accented && noun
