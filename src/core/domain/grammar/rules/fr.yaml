          start: m.indices!.groups!.target[0]
          end: m.indices!.groups!.target[1]
          found: 'wordFinding(ctx, start, target, [`${count} ${FEMININE_UNITS.has(unit.toLowerCase()) ? "bonnes" : "bons"} ${unit}`], frame.ruleId, frame.messageKey)'
        when: '/^\d+$/.test(count) || count.toLowerCase().split("-").every((w) => STYLE_NUMBER_WORDS.has(w))'
