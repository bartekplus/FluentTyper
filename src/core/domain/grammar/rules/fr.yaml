      etToEst:
        args: "ctx: DetectContext, m: RegExpExecArray"
        type: RawFinding | null
        let:
          before: tokensBefore(ctx.text, m.index, 8)
          pair: tokensAfter(ctx.text, m.index + m[0].length, 2)
          next: pair[0]
          fix: '(end: number) => homoFix(ctx, m, ["est"], { start: before[0].start, end })'
        when: "!(!before[0] || !next)"
        return: >-
          /^quel(?:le)?s?$/.test(before[0].w) && before.length === 1 && HOMO_DETERMINERS.has(next.w)
