          next: tokensAfter(ctx.text, m.index + m[0].length, 1)[0]
        when: '!(!previous || !HOMO_PREPOSITIONS.has(previous.w) || !next || ctx.text[m.index + m[0].length] === "-" || HOMO_ADVERBS.has(next.w))'
