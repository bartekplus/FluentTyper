      CLAUSE_SUBJECTS: [que, "qu'", qui, dont, où, ce, quoi]
      RELATIVE_LEQUEL: [laquelle, lequel, lesquels, lesquelles]
      # "a priori", "a cappella": Latin and Italian locutions keep their plain "a".
      LATIN_A: [priori, posteriori, minima, maxima, cappella, capella, contrario, fortiori, giorno]
      HOMO_STRESSED:
        [
          moi,
          toi,
          lui,
