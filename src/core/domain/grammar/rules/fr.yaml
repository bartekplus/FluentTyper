      # "j'aie fini" -> "ai". A pronoun subject of the same person ("N'aie pas peur" is the
      # imperative). "il ait parti" -> "est"; "il ait affiché" may be a passive ("il est
      # affiché"): both.
      - regex: "(?<![\\p{L}\\p{M}\\p{N}_-])(?:aie|aies|ait|aient){{WORD_END}}"
        flags: giu
        scan: owned
        lookback: 1
        let:
          lower: m[0].toLowerCase()
          lead: '/[^.!?…;:\n«"“]*$/u.exec(ctx.text.slice(Math.max(0, m.index - 300), m.index))![0]'
          before: tokensBefore(ctx.text, m.index, 6)
          k: 'skipWhile(before, 0, (t) => t.w === "ne" || t.w === "n''" || CLITICS.has(t.w))'
          after: tokensAfter(ctx.text, m.index + m[0].length, 4)
          next: after[skipWords(after, 0, SKIPPED_AFTER)]
