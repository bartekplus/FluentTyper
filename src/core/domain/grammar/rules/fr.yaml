        when:
          - "!(!verb || !/^adress/.test(verb.w))"
          - "!!fix"
        return: 'wordFinding(ctx, m.index, ctx.text.slice(m.index, next.end), [fix], "stylePhrasing", "review_msg_style_phrasing", { start: verb.start, end: next.end })'
      # "Merci pour m'avoir aidé" -> "de m'avoir aidé": thanks take "de" before an infinitive. "un
      # combat sans merci pour sauver son honneur": the idiom, not thanks. "merci pour le dîner":
      # an article, not a pronoun, before a noun spelled like a verb.
      thanksFor:
        args: "ctx: DetectContext, m: RegExpExecArray"
        type: RawFinding | null
        let:
          before: tokensBefore(ctx.text, m.index, 4)
          thanks: before.findIndex((t) => t.w === "merci" || /^remerci/.test(t.w))
          after: tokensAfter(ctx.text, m.index + m[0].length, 4)
          i: "CLITICS.has(after[0]?.w) ? (CLITICS.has(after[1]?.w) ? 2 : 1) : 0"
          verb: after[i]
          first: after[0]
        when:
          - before[thanks + 1]?.w !== "sans"
          - "!(thanks < 0 || !before.slice(0, thanks).every((t) => /^(?:beaucoup|encore|infiniment|vous|te|tous|bien)$/.test(t.w)))"
          - '!(!verb || !verbReadings(verb.w).some((r) => r.slot === "I"))'
          - "!(i > 0 && /^l/.test(after[i - 1].w) && isVerbHomograph(verb.w))"
        return: >-
          wordFinding(ctx, m.index, ctx.text.slice(m.index, first.start), [/^[aeiouyhéèêâîôû]/i.test(first.w) ? "d'" : "de "],
            "stylePhrasing", "review_msg_style_phrasing", { start: before[thanks].start, end: verb.end })
      # "Au final, il a gagné" -> "Finalement"; "au final de la sonate" names the finale.
      inTheEnd:
        args: "ctx: DetectContext, m: RegExpExecArray"
        type: RawFinding | null
        let:
          au: tokensBefore(ctx.text, m.index, 1)[0]
          next: tokensAfter(ctx.text, m.index + m[0].length, 1)[0]
        when: '!(au?.w !== "au" || au.end + 1 !== m.index || /^d/.test(next?.w ?? ""))'
        return: >-
          wordFinding(ctx, au.start, ctx.text.slice(au.start, m.index + m[0].length), ["finalement", "en fin de compte"],
