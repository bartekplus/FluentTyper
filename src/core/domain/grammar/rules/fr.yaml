      # être. "je ne sais pas ou aller", "dis-moi ou tu vas"; "dire" only with its object
      # ("dis-moi ou"): "on dit ou on écrit" is "or". "peux-tu me dire ou se trouve", "il ne
      # saurait dire ou le chat est": the infinitive "dire" after its object pronoun or a modal,
      # then a clause ("dire ou écrire" is "or"). "quelque part ou il fait beau", "partout ou tu
      # vas": a place, then a clause. "je ne vois pas ou aller": "voir" before an infinitive.
      ouAsked:
        args: "ctx: DetectContext, before: FrenchToken[], after: FrenchToken[], opensClause: boolean"
        let:
          previous: before[0]
          next: after[0]
          lemmas: >-
            next && SUBJECT_PRONOUNS.has(next.w) && after[1] && !after[1].hyphen
              ? verbReadings(after[1].w).filter(finiteReading).map((r) => r.lemma)
              : []
          k: 'skipWhile(before, 0, (t) => ["pas", "jamais", "ne", "n''"].includes(t.w))'
          imperative: 'before[k]?.w === "moi" && ctx.text[before[k].start - 1] === "-"'
          asking: "imperative ? before[k + 1] : before[k]"
        return: >-
          (lemmas.length > 0 &&
            /^\s{0,8}(?:[.!?…;,]|$)/u.test(ctx.text.slice(after[1].end, after[1].end + 10)) &&
            (lemmas.includes("vouloir") || lemmas.includes("être"))) ||
          (!!asking &&
            verbReadings(asking.w).some((r) => ASKING_VERBS.has(r.lemma) || (imperative && r.lemma === "dire")) &&
            !!next &&
            (startsClauseOu(next, after) ||
              verbReadings(next.w).some((r) => r.slot === "I") ||
              next.w === "se" ||
              next.w === "s'" ||
              (WHERE_ETRE.has(next.w) && !next.hyphen))) ||
          (asking?.w === "dire" &&
            !!before[k + 1] &&
            (["me", "m'", "te", "t'", "lui", "nous", "vous", "leur"].includes(before[k + 1].w) ||
              verbReadings(before[k + 1].w).some((r) => finiteReading(r) && ["pouvoir", "savoir", "vouloir"].includes(r.lemma))) &&
            !!next &&
            (startsClauseOu(next, after) || next.w === "se" || next.w === "s'" || opensClause)) ||
          ((previous.w === "partout" || (previous.w === "part" && before[1]?.w === "quelque")) && opensClause) ||
          (!!asking &&
            verbReadings(asking.w).some((r) => r.lemma === "voir") &&
            !!next &&
            verbReadings(next.w).some((r) => r.slot === "I" && r.lemma === next.w))
      # "deux où trois", "tu viens où pas ?": "or".
      ouGraveToOu:
        args: "ctx: DetectContext, m: RegExpExecArray"
        type: RawFinding | null
        let:
          before: tokensBefore(ctx.text, m.index, 2)
          after: tokensAfter(ctx.text, m.index + m[0].length, 2)
          previousNumber: 'HOMO_NUMBERS.test(before[0]?.w ?? "") || /\d[ \t ]{0,8}$/.test(ctx.text.slice(Math.max(0, m.index - 9), m.index))'
          nextNumber: 'HOMO_NUMBERS.test(after[0]?.w ?? "") || /^[ \t ]{0,8}\d/.test(ctx.text.slice(m.index + m[0].length, m.index + m[0].length + 9))'
          negation: '(after[0]?.w === "pas" || after[0]?.w === "non") && /^[\s  ]*[?!.]/u.test(ctx.text.slice(after[0].end))'
        when: (previousNumber && nextNumber) || negation
        return: homoFix(ctx, m, ["ou"])
