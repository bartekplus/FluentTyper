          - m.index >= ctx.from
          - "!AVOIR_GOVERNORS.test(lead)"
          - "!(!before[k] || !AVOIR_SUBJECTS[lower].includes(before[k].w))"
          - "!namedExampleBefore(ctx.text, m.index)"
        return: "homoFix(ctx, m, alternatives, { start: before[k].start, end: (next ?? after[0])?.end ?? m.index + m[0].length })"
