          - m.index >= ctx.from
          - "!(!before || !REMEMBER_REFLEXIVE.has(before.w))"
          - "!(!de || !next)"
          - start >= 0
        return: >-
          wordFinding(ctx, start, ctx.text.slice(start, next.start), [de.w === "de" ? "" : "le "], frame.ruleId, frame.messageKey, {
            start: before.start,
            end: next.end,
          })
