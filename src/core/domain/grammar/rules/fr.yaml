  - id: fr.auxiliary
    checks: [frenchVerbForms]
    style: match
    message: review_msg_fr_auxiliary
    # The auxiliary a verb takes: "je suis allé" not "j'ai allé", "il a nagé" not "il est nagé",
    # "il a été" not "il est été"; and "avoir raison/tort", "avoir 20 ans".
    maps:
      # Avoir's simple forms and être's in the same tense and person.
      AVOIR_TO_ETRE:
        {
          ai: suis,
          as: es,
          a: est,
          avons: sommes,
          avez: êtes,
          ont: sont,
          avais: étais,
          avait: était,
          avions: étions,
          aviez: étiez,
          avaient: étaient,
          aurai: serai,
          auras: seras,
          aura: sera,
          aurons: serons,
          aurez: serez,
          auront: seront,
          aurais: serais,
          aurait: serait,
          aurions: serions,
          auriez: seriez,
          auraient: seraient,
        }
      # "tu es" and "il est" share no avoir form with another person: "es" -> "as", "est" -> "a".
      ETRE_TO_AVOIR:
        {
          suis: ai,
          est: a,
          sommes: avons,
          êtes: avez,
          sont: ont,
          étais: avais,
          était: avait,
          étions: avions,
          étiez: aviez,
          étaient: avaient,
          serai: aurai,
          seras: auras,
          sera: aura,
          serons: aurons,
          serez: aurez,
          seront: auront,
          serais: aurais,
          serait: aurait,
          serions: aurions,
          seriez: auriez,
          seraient: auraient,
          es: as,
        }
      # The agreed participle forms each subject allows after être (the masculine singular aside).
      AUX_SUBJECT_FORMS:
        {
          je: [fs],
          "j'": [fs],
          tu: [fs],
          elle: [fs],
          on: [fs, mp, fp],
          nous: [mp, fp],
          vous: [fs, mp, fp],
          ils: [mp],
          elles: [fp],
        }
    sets:
      # Verbs that only ever take être: "il est allé", never "il a allé".
      ETRE_VERBS:
        [
          aller,
          venir,
          devenir,
          revenir,
          parvenir,
          survenir,
          advenir,
          arriver,
          partir,
          repartir,
          naître,
          mourir,
          décéder,
        ]
      # Intransitive verbs that only take avoir and have no passive: "il a nagé", never "il est nagé".
      AVOIR_VERBS:
        [
          nager,
          dormir,
          marcher,
          voyager,
          travailler,
          rire,
          sourire,
          pleurer,
          dîner,
          déjeuner,
          tousser,
          éternuer,
          mentir,
          bavarder,
        ]
      AUX_SUBJECTS: [je, "j'", tu, il, elle, on, nous, vous, ils, elles]
      AUX_BETWEEN: [pas, plus, jamais, déjà, encore, bien, toujours, souvent, vraiment]
    defs:
      # Only a past participle of one of the lemmas: no other reading.
      participleOf:
        args: "word: string, lemmas: ReadonlySet<string>"
        return: 'verbReadings(word).some((r) => r.slot === "Q" && lemmas.has(r.lemma)) && verbReadings(word).every((r) => r.slot === "Q")'
    frames:
      # A simple form of avoir or être: "j'ai allé" -> "je suis allé", "il est nagé" -> "il a nagé".
      - regex: "(?<![\\p{L}\\p{M}\\p{N}_-])(?:ai|as|a|avons|avez|ont|avais|avait|avions|aviez|avaient|aurai|auras|aura|aurons|aurez|auront|aurais|aurait|aurions|auriez|auraient|suis|est|sommes|êtes|sont|étais|était|étions|étiez|étaient|serai|seras|sera|serons|serez|seront|serais|serait|serions|seriez|seraient|es){{WORD_END}}"
        flags: giu
        scan: owned
        lookback: 1
        let:
          typed: m[0]
          lower: typed.toLowerCase()
          before: tokensBefore(ctx.text, m.index, 3)
          # The subject, past "ne": "je n'ai", "il ne s'est".
          subject: 'before[before[0]?.w === "n''" || before[0]?.w === "ne" ? 1 : 0]'
          after: tokensAfter(ctx.text, m.index + typed.length, 4)
          other: after.findIndex((t) => !AUX_BETWEEN.has(t.w))
          i: "other < 0 ? after.length : other"
          next: after[i]
          # "il est 20 ans": avoir gives an age ("il est trois ans plus jeune" compares).
          age: >-
            /^[ \t]+(?:\d+|deux|trois|quatre|cinq|six|sept|huit|neuf|dix|onze|douze|quinze|vingt|trente|quarante|cinquante|soixante)[ \t]+ans(?![\p{L}\p{M}\p{N}_'’-])(?![ \t]+(?:plus|moins|trop|de[ \t]+(?:plus|moins|trop|retard|avance)|d['’]avance))/iu.exec(
              ctx.text.slice(m.index + typed.length, m.index + typed.length + 24))
          end: "age ? m.index + typed.length + age[0].length : next.end"
          # "ils avaient partie liée": an agreed form that fits no être subject here is a noun.
          form: 'next ? (/es$/.test(next.w) ? "fp" : /e$/.test(next.w) ? "fs" : /s$/.test(next.w) ? "mp" : "") : ""'
          fixed: >-
            lower in AVOIR_TO_ETRE && next && participleOf(next.w, ETRE_VERBS)
              ? form && !AUX_SUBJECT_FORMS[subject.w]?.includes(form)
                ? null
                : AVOIR_TO_ETRE[lower]
              : lower in ETRE_TO_AVOIR
                ? verbReadings(lower).some((r) => r.lemma === "être") &&
                  (age ||
                    (next.w === "été" && i === 0) ||
                    participleOf(next.w, AVOIR_VERBS) ||
                    (i === 0 && ["tort", "tord", "raison"].includes(next.w)))
                  ? ETRE_TO_AVOIR[lower]
                  : null
                : null
          # "j'ai" -> "je suis", "n'ai" -> "ne suis", "je suis" -> "j'ai": the elided word right
          # before follows the new form.
          lead: before[0]
          leadWord: 'lead?.w === "j''" || lead?.w === "je" ? "je" : lead?.w === "n''" || lead?.w === "ne" ? "ne" : null'
          joinLead: "!!lead && !!leadWord && lead.end >= m.index - 1"
          vowel: "/^[aeéêio]/.test(fixed)"
          leadForm: >-
            joinLead
              ? (vowel
                  ? `${leadWord[0]}${/’/.test(ctx.text.slice(Math.max(0, m.index - 200), m.index)) ? "’" : "'"}`
                  : `${leadWord} `
                ).trimEnd()
              : ""
          casedLead: '/^\p{Lu}/u.test(joinLead ? ctx.text.slice(lead.start, lead.end) : "") ? leadForm[0].toUpperCase() + leadForm.slice(1) : leadForm'
          start: "joinLead ? lead.start : m.index"
          replacement: 'joinLead ? `${casedLead}${vowel ? "" : " "}${carryCase(typed, fixed)}` : carryCase(typed, fixed)'
        when:
          - m.index >= ctx.from
          - "!!subject && AUX_SUBJECTS.has(subject.w)"
          - '!(ctx.text[m.index - 1] === "-" || ctx.text[m.index + typed.length] === "-")'
          - "!!age || (!!next && !next.hyphen)"
          - "!!fixed && !ctx.dictionary.has(lower)"
          - replacement !== ctx.text.slice(start, m.index + typed.length)
        return: "finding(frame.ruleId, frame.messageKey, start, m.index + typed.length, [replacement], { context: { start: subject.start, end } })"
  - id: fr.questions
    checks: [frenchSubjectVerbAgreement]
    style: match
    message: review_msg_fr_subject_verb
    # A subject pronoun joined after its verb agrees with it as before it: "sont-ils",
    # "manges-tu", "pouvais-je", "partirons-nous". The euphonic t stands only before a singular:
    # "viendra-t-il".
    maps:
      # The pronoun of the other number or of the other plural person.
      PRONOUN_SWAP: { il: ils, elle: elles, ils: il, elles: elle, nous: vous, vous: nous }
      # A stressed pronoun is the antecedent of "qui", whose verb takes its person: "toi qui as",
      # "moi qui pensais", "nous qui partirons".
      STRESSED_PERSON: { moi: 1, toi: 2, lui: 4, elle: 4, nous: 8, vous: 16, eux: 32, elles: 32 }
    defs:
      # The verb and pronoun joined, with the euphonic t a third singular after a vowel needs.
      joinedInversion:
        args: "verb: string, pronoun: string"
        return: '`${verb}${PRONOUN_PERSON[pronoun.toLowerCase()] === IL && /[aeéc]$/i.test(verb) ? "-t-" : "-"}${pronoun}`'
      # The form of a reading's verb for a person ("peut-je" -> "puis-je").
      invertedForm:
        args: "r: VerbReading, person: number"
        let:
          form: conjugate(r, person)[0]
        return: 'form === "peux" && person === JE ? "puis" : form'
      # The inverted pairs that agree: the pronoun of the other number, or the verb for the
      # pronoun ("peut-tu" -> "peux-tu", "peut-je" -> "puis-je").
      inversionFinding:
        args: "m: RegExpExecArray, typedVerb: string, typedPronoun: string, readings: VerbReading[], persons: number, alternatives: string[]"
        let:
          verb: typedVerb.toLowerCase()
          pronoun: typedPronoun.toLowerCase()
          person: PRONOUN_PERSON[pronoun]
          swapped: PRONOUN_SWAP[pronoun]
          unique: >-
            [
              ...new Set([
                ...alternatives,
                ...(swapped && hasPerson(persons, PRONOUN_PERSON[swapped])
                  ? [joinedInversion(typedVerb, carryCase(typedPronoun, swapped))]
                  : []),
                ...readings
                  .map((r) => invertedForm(r, person))
                  .filter((form) => form && form !== verb)
                  .map((form) => joinedInversion(carryCase(typedVerb, form), typedPronoun)),
              ]),
            ]
        when: unique.length > 0 && unique.length <= 3
        return: >-
          finding("frenchSubjectVerbAgreement", "review_msg_fr_subject_verb", m.index, m.index + m[0].length, unique, {
            ...(unique.length > 1 ? { requiresChoice: true as const } : {}),
          })
    frames:
      # "sont-il" -> "sont-ils", "mange-tu" -> "manges-tu", "pouvait-ils" -> "pouvaient-ils".
      # "dussé-je", "aimé-je": the literary first person in -é. "Aidez-nous", "Laissons-vous":
      # after an imperative "nous" and "vous" are objects. Only a question word before the verb
      # makes them its subject. "aiment-t-ils": the verb agrees, the euphonic t goes.
      - regex: "{{WORD_START}}(?<verb>\\p{L}+)-(?<t>t-)?(?<pronoun>je|tu|il|elle|on|nous|vous|ils|elles){{WORD_END}}"
        flags: giu
        scan: owned
        lookback: 1
        let:
          lower: verb.toLowerCase()
          person: PRONOUN_PERSON[pronoun.toLowerCase()]
          readings: 'verbReadings(lower).filter((r) => typeof r.slot === "number")'
          persons: finitePersons(lower)
          previous: tokensBefore(ctx.text, m.index, 1)[0]
        when:
          - m.index >= ctx.from
          - '!(/\p{Lu}/u.test(verb.slice(1)) || ctx.dictionary.has(lower))'
          - "!namedExampleBefore(ctx.text, m.index)"
          - readings.length > 0
          - "!(hasPerson(persons, person) && !(!!t && person !== IL))"
          - '!(person === JE && lower.endsWith("é"))'
          - "!(person === NOUS || person === VOUS) || (!!previous && QUESTION_WORDS.has(previous.w))"
        return: "inversionFinding(m, verb, pronoun, readings, persons, hasPerson(persons, person) ? [`${verb}-${pronoun}`] : [])"
      # "Peux il partir ?": a verb and a subject pronoun with no hyphen, at a question's start.
      # "Mange il viendra ?": the pronoun is the subject of the verb after it.
      - regex: "{{WORD_START}}(?<verb>\\p{L}+)[ \\t]{1,4}(?<pronoun>je|tu|il|elle|on|nous|vous|ils|elles){{WORD_END}}"
        flags: giu
        scan: owned
        lookback: 1
        let:
          lower: verb.toLowerCase()
          end: m.index + m[0].length
          before: tokensBefore(ctx.text, m.index, 1)[0]
          opening: "before ? QUESTION_WORDS.has(before.w) : SENTENCE_START.test(ctx.text.slice(Math.max(0, m.index - 4), m.index))"
          readings: verbReadings(lower)
          persons: finitePersons(lower)
          person: PRONOUN_PERSON[pronoun.toLowerCase()]
          next: tokensAfter(ctx.text, end, 1)[0]
        when:
          - m.index >= ctx.from
          - '!(/\p{Lu}/u.test(verb.slice(1)) || ctx.dictionary.has(lower))'
          - "!(!opening || !inQuestion(ctx.text, end) || isVerbHomograph(lower))"
          - '!(!readings.length || !readings.every((r) => typeof r.slot === "number"))'
          - "!(hasPerson(persons, person) || namedExampleBefore(ctx.text, m.index))"
          - "!(next && !isVerbHomograph(next.w) && hasPerson(finitePersons(next.w), person))"
        return: inversionFinding(m, verb, pronoun, readings, persons, [])
      # "C'est toi qui a" -> "as", "Et moi qui pensait" -> "pensais". "Ceux me l'avaient dit": the
      # plural demonstrative as a subject. Only where nothing else may be the antecedent: the
      # sentence start, "et", "mais", or "c'est" / "ce sont". "un ami de toi qui est venu" may be
      # about the friend. "elle et moi qui savions": a coordinated antecedent.
      - regex: "{{WORD_START}}(?:(?<pronoun>moi|toi|lui|elle|nous|vous|eux|elles)(?:[ \\t]+seule?s?)?[ \\t]+qui|(?<demonstrative>ceux|celles)){{WORD_END}}"
        flags: giu
        scan: owned
        lookback: 1
        let:
          person: "pronoun ? STRESSED_PERSON[pronoun.toLowerCase()] : ILS"
          before: tokensBefore(ctx.text, m.index, 2)
          previous: before[0]?.w
          presented: '["est", "sont", "était", "étaient", "sera"].includes(previous ?? "") && ["c''", "ce"].includes(before[1]?.w ?? "")'
          opening: '["et", "mais"].includes(previous ?? "") && !before[1]'
          after: tokensAfter(ctx.text, m.index + m[0].length, 5)
          verb: 'after[skipWhile(after, 0, (t) => CLITICS.has(t.w) || t.w === "ne" || t.w === "n''")]'
          auxiliary: 'verbReadings(verb.w).some((r) => r.lemma === "avoir" || r.lemma === "être")'
          readings: verbReadings(verb.w)
          forms: "[...new Set(readings.map((r) => conjugate(r, person)[0]).filter(Boolean))]"
          found: wordFinding(ctx, verb.start, verb.w, forms, frame.ruleId, frame.messageKey)
        when:
          - m.index >= ctx.from
          - "!(previous && !presented && !opening)"
          - "!namedExampleBefore(ctx.text, m.index)"
          - "!(!verb || verb.hyphen)"
          - "!(isVerbHomograph(verb.w) && !auxiliary)"
          - ctx.text.slice(verb.start, verb.end) === verb.w
          - '!(!readings.length || !readings.every((r) => typeof r.slot === "number"))'
          - "!readings.some((r) => hasPerson(r.slot, person))"
          - "!(!forms.length || forms.length > 2)"
        return: "found && { ...found, context: { start: m.index, end: verb.end } }"
  - id: fr.imperative
    checks: [frenchVerbForms]
    style: match
    message: review_msg_fr_imperative
    # A sentence that opens with "ne" and no subject gives an order: the verb is an imperative.
    # "Ne prend pas" -> "Ne prends pas", "N'y vas pas" -> "N'y va pas", "Ne soit pas" -> "Ne
    # sois pas", "Ne me demander pas" -> "Ne me demandez pas".
    maps:
      # The second singular imperative of verbs whose present does not give it.
      IMPERATIVE_SINGULAR: { être: sois, avoir: aie, savoir: sache, vouloir: veuille, aller: va }
      IMPERATIVE_PLURAL: { être: [soyons, soyez], avoir: [ayons, ayez] }
    sets:
      IMPERATIVE_NEGATIONS: [pas, plus, jamais, rien, point, guère, personne]
      # Words that show a second person addressee: "ne me prend pas pour ton frère".
      SECOND_PERSON: [te, "t'", toi, ton, ta, tes, tien, tienne]
      # Nouns that take avoir bare: "n'es pas peur" -> "n'aie pas peur".
      IMPERATIVE_AVOIR_NOUNS: [peur, honte, froid, faim, soif, peine]
    defs:
      presentOf:
        args: "r: VerbReading, person: number"
        return: "conjugate({ ...r, tense: 1 }, person)"
      # The second singular imperative of a reading's verb: "prendre" -> "prends", "manger" ->
      # "mange", "offrir" -> "offre".
      singularImperative:
        args: "r: VerbReading"
        type: string | undefined
        return: >-
          r.lemma in IMPERATIVE_SINGULAR
            ? IMPERATIVE_SINGULAR[r.lemma]
            : r.lemma.endsWith("er") || presentOf(r, JE)[0]?.endsWith("e")
              ? presentOf(r, JE)[0]
              : presentOf(r, TU)[0]
      # The orders a finite verb after "ne" stands for, or null when it is one already
      # ("ne mange pas", "ne prends pas", "ne soyez pas") or no order. A third singular in "ne
      # sait pas lire" may be a note with its subject left out; only a second person in the
      # sentence or an exclamation makes it an order. A subjunctive ("ne soit pas") never opens
      # a note.
      finiteOrders:
        args: "ctx: DetectContext, after: FrenchToken[], i: number, finite: VerbReading[]"
        type: string[] | null
        let:
          verb: after[i]
          negation: after[i + 1]
          noun: after[i + 2]
          imperative: >-
            finite.some((r) =>
              [singularImperative(r), ...(IMPERATIVE_PLURAL[r.lemma] ?? [presentOf(r, NOUS)[0], presentOf(r, VOUS)[0]])].includes(verb.w))
          third: finite.every((r) => !hasPerson(r.slot, TU) && r.tense < 6)
          words: 'ctx.text.slice(verb.end, verb.end + 120).split(/[.!?…\n]/u)[0].toLowerCase().split(/[^\p{L}''’]+/u)'
          exclaims: '/^[^.?…\n]*!/u.test(ctx.text.slice(verb.end, verb.end + 120))'
          addressed: "[...after.slice(0, i).map((t) => t.w), ...words].some((w) => SECOND_PERSON.has(w))"
        when:
          - "!imperative"
          - "!third || exclaims || addressed"
        return: >-
          [
            ...new Set(
              finite
                .map((r) =>
                  r.lemma === "être" && noun && IMPERATIVE_AVOIR_NOUNS.has(noun.w) && negation.w === "pas"
                    ? IMPERATIVE_SINGULAR.avoir
                    : singularImperative(r))
                .filter((form) => form !== undefined),
            ),
          ]
    frames:
      # "Ne prend pas", "N'aies pas peur", "Ne vous laisser pas faire": a negated order.
      - regex: "{{WORD_START}}n(?:e{{WORD_END}}|['’](?=\\p{L}))"
        flags: giu
        scan: owned
        lookback: 1
        let:
          after: tokensAfter(ctx.text, m.index + m[0].length, 6)
          i: skipWords(after, 0, CLITICS)
          verb: after[i]
          negation: after[i + 1]
          readings: verbReadings(verb.w)
          clitics: after.slice(0, i).map((t) => t.w)
          infinitive: readings.find((r) => r.slot === "I" && r.lemma === verb.w)
          finite: 'readings.filter((r) => typeof r.slot === "number")'
          # "Ne me demander pas": an -er infinitive for the imperative of "tu" or "vous".
          forms: >-
            infinitive
              ? [
                  ...new Set([
                    ...(!clitics.includes("te") && !clitics.includes("t'") && presentOf(infinitive, VOUS)[0]
                      ? [presentOf(infinitive, VOUS)[0]]
                      : []),
                    ...(!clitics.includes("vous") && singularImperative(infinitive)
                      ? [singularImperative(infinitive)!]
                      : []),
                  ]),
                ]
              : finiteOrders(ctx, after, i, finite)
          found: wordFinding(ctx, verb.start, verb.w, forms, frame.ruleId, frame.messageKey)
        when:
          - m.index >= ctx.from
          - SENTENCE_START.test(ctx.text.slice(Math.max(0, m.index - 4), m.index))
          - "!(!verb || verb.hyphen || !negation || !IMPERATIVE_NEGATIONS.has(negation.w))"
          - ctx.text.slice(verb.start, verb.end) === verb.w
          - readings.length > 0
          - '!infinitive || verb.w.endsWith("er")'
          - "!!infinitive || finite.length === readings.length"
          - "!!forms && forms.length > 0 && forms.length <= 2"
        return: "found && { ...found, context: { start: m.index, end: negation.end } }"
      # "Va-y" -> "Vas-y", "Rend-toi" -> "Rends-toi", "Manges-le" -> "Mange-le", "Aller-y" ->
      # "Allez-y": the imperative a hyphenated object pronoun follows.
      - regex: "{{WORD_START}}(?<verb>\\p{L}+)-(?<pronoun>moi|toi|lui|nous|leur|le|la|les|en|y){{WORD_END}}"
        flags: giu
        scan: owned
        lookback: 1
        let:
          lower: verb.toLowerCase()
          readings: verbReadings(lower)
          current: 'readings.filter((r) => r.tense === 1 && typeof r.slot === "number")'
          enY: 'pronoun.toLowerCase() === "en" || pronoun.toLowerCase() === "y"'
          # "Aller-y", "Donner-moi": an infinitive opening the sentence for the "vous" imperative.
          # Before "en" and "y" the imperative in -e and "va" take an s: "penses-y", "vas-y".
          # "Manges-le": the -er imperative has no s before another pronoun. "Rend-toi",
          # "Prend-le": the third person for the second.
          form: >-
            readings.some((r) => r.slot === "I" && r.lemma === lower)
              ? !lower.endsWith("er") || !SENTENCE_START.test(ctx.text.slice(Math.max(0, m.index - 4), m.index))
                ? undefined
                : presentOf(readings[0], VOUS)[0]
              : !current.length || current.length !== readings.length
                ? undefined
                : enY
                  ? (lower !== "va" && !(lower.endsWith("e") && current.every((r) => r.lemma.endsWith("er")))) ||
                    !current.some((r) => hasPerson(r.slot, JE + 4))
                    ? undefined
                    : `${lower}s`
                  : lower.endsWith("es") && current.every((r) => r.lemma.endsWith("er"))
                    ? !current.some((r) => hasPerson(r.slot, TU))
                      ? undefined
                      : lower.slice(0, -1)
                    : /[td]$/.test(lower) && current.every((r) => !r.lemma.endsWith("er"))
                      ? !current.every((r) => r.slot === 4)
                        ? undefined
                        : singularImperative(current[0])
                      : undefined
          found: wordFinding(ctx, m.index, verb, [form], frame.ruleId, frame.messageKey)
        when:
          - m.index >= ctx.from
          - '!(/\p{Lu}/u.test(verb.slice(1)) || ctx.dictionary.has(lower))'
          - "!!form && form !== lower"
        return: "found && { ...found, context: { start: m.index, end: m.index + m[0].length } }"
  - id: fr.veillez
    checks: [frenchHomophones]
    style: match
    message: review_msg_fr_homophone
    frames:
      # "Veillez ne pas" -> "Veuillez": veiller takes "à"; "Veuillez à" -> "Veillez à": vouloir
      # takes a bare infinitive. "Veuillez à nouveau saisir": the adverb, not veiller's "à".
      - regex: "{{WORD_START}}veu?illez{{WORD_END}}"
        flags: giu
        scan: owned
        lookback: 1
        let:
          after: tokensAfter(ctx.text, m.index + m[0].length, 4)
          i: skipWords(after, 0, CLITICS)
          next: after[i]
        when: m.index >= ctx.from
        return: >-
          m[0].toLowerCase() === "veuillez"
            ? after[0]?.w !== "à" || after[1]?.w === "nouveau"
              ? null
              : wordFinding(ctx, m.index, m[0], ["veillez"], frame.ruleId, frame.messageKey)
            : !next
              ? null
              : !verbReadings(next.w).some((r) => r.slot === "I" && r.lemma === next.w) &&
                  !(i === 0 && (next.w === "ne" || next.w === "n'"))
                ? null
                : wordFinding(ctx, m.index, m[0], ["veuillez"], frame.ruleId, frame.messageKey)
  - id: fr.invariables
    checks: [frenchAdjectiveAgreement]
    style: match
    message: review_msg_fr_invariable_colour
    # Words that do not agree. An adjective used as an adverb after its verb: "coûter cher",
    # "sentir bon", "voler bas". A colour named by a noun ("des yeux marron") and a compound
    # colour ("des robes bleu clair").
    maps:
      # Adverbial adjective -> the verbs that take it bare.
      ADVERBIAL:
        {
          cher: [coûter, valoir, payer, vendre, acheter],
          bas: [voler, parler],
          haut: [voler, parler, viser],
          bon: [sentir],
          mauvais: [sentir],
          juste: [viser, chanter, deviner, tomber],
          faux: [chanter, sonner, jouer],
          clair: [voir],
          droit: [marcher, aller, filer],
          franc: [parler, jouer],
          fort: [parler, crier, frapper, taper],
          court: [couper, tourner],
          dur: [travailler, bosser, cogner],
          lourd: [peser],
        }
      # Agreed form -> masculine singular, for the adjectives above.
      ADVERBIAL_AGREED:
        {
          chère: cher,
          chères: cher,
          chers: cher,
          basse: bas,
          basses: bas,
          haute: haut,
          hautes: haut,
          hauts: haut,
          bonne: bon,
          bonnes: bon,
          bons: bon,
          mauvaise: mauvais,
          mauvaises: mauvais,
          justes: juste,
          fausse: faux,
          fausses: faux,
          claire: clair,
          claires: clair,
          clairs: clair,
          droite: droit,
          droites: droit,
          droits: droit,
          franche: franc,
          franches: franc,
          francs: franc,
          forte: fort,
          fortes: fort,
          forts: fort,
          courte: court,
          courtes: court,
          courts: court,
          dure: dur,
          dures: dur,
          durs: dur,
          lourde: lourd,
          lourdes: lourd,
          lourds: lourd,
        }
    sets:
      INVARIABLE_REFLEXIVE: [me, "m'", te, "t'", se, "s'", nous, vous]
      # Colours named by a noun: they stay invariable ("rose", "mauve", "fauve" agree and are left
      # out).
      NOUN_COLOURS:
        [
          marron,
          kaki,
          crème,
          turquoise,
          émeraude,
          ocre,
          saumon,
          olive,
          ivoire,
          bordeaux,
          prune,
          cerise,
          chocolat,
          caramel,
          moutarde,
          corail,
          azur,
          sable,
          citron,
          framboise,
          lavande,
          abricot,
          bronze,
          argent,
          cuivre,
          acajou,
          anthracite,
          indigo,
        ]
      BASE_COLOURS: [bleu, vert, rouge, jaune, gris, brun, noir, blanc, violet, orange, beige]
      SHADES: [clair, foncé, pâle, vif, sombre, marine, ciel, nuit, électrique]
    defs:
      # A base colour and a shade both agreed: "bleus clairs", "vertes foncées".
      colourShade:
        args: "ctx: DetectContext, m: RegExpExecArray, previous: FrenchToken, colour: string, singular: string"
        type: RawFinding | null
        let:
          next: tokensAfter(ctx.text, m.index + m[0].length, 1)[0]
          shade: next.w.replace(/(?:e?s|e)$/, "")
          shadeBase: "SHADES.has(shade) ? shade : SHADES.has(`${shade}é`) ? `${shade}é` : null"
          base: "BASE_COLOURS.has(colour) ? colour : singular"
          found: wordFinding(ctx, m.index, ctx.text.slice(m.index, next.end), [`${base} ${shadeBase}`], "frenchAdjectiveAgreement", "review_msg_fr_invariable_colour")
        when:
          - "!!next && next.start <= m.index + m[0].length + 1"
          - "!!shadeBase && next.w !== shadeBase"
        return: "found && { ...found, context: { start: previous.start, end: next.end } }"
    frames:
      # "La vie coûte chère" -> "cher", "Ces fleurs sentent bonnes" -> "bon".
      - regex: "{{WORD_START}}(?:chère|chères|chers|basse|basses|haute|hautes|hauts|bonne|bonnes|bons|mauvaise|mauvaises|justes|fausse|fausses|claire|claires|clairs|droite|droites|droits|franche|franches|francs|forte|fortes|forts|courte|courtes|courts|dure|dures|durs|lourde|lourdes|lourds){{WORD_END}}"
        flags: giu
        scan: owned
        lookback: 1
        let:
          typed: m[0]
          base: ADVERBIAL_AGREED[typed.toLowerCase()]
          before: tokensBefore(ctx.text, m.index, 4)
          i: '["pas", "plus", "jamais", "vraiment", "très", "trop", "si", "aussi"].includes(before[0]?.w) ? 1 : 0'
          verb: before[i]
          found: wordFinding(ctx, m.index, typed, [base], frame.ruleId, "review_msg_fr_adverbial_adjective")
        when:
          - m.index >= ctx.from
          - "!!base"
          - "!!verb && verbReadings(verb.w).some((r) => ADVERBIAL[base].includes(r.lemma))"
          # "elle se sent bonne", "il se voit claire": a reflexive verb takes an attribute.
          - "!before.slice(i + 1).some((t) => INVARIABLE_REFLEXIVE.has(t.w))"
          # "la coupe courte", "une marche droite": a noun spelled like the verb.
          - '!(isVerbHomograph(verb.w) && !SUBJECT_PRONOUNS.has(before[i + 1]?.w ?? ""))'
        return: "found && { ...found, context: { start: verb.start, end: m.index + typed.length } }"
      # "des yeux marrons" -> "marron", "des robes bleues claires" -> "bleu clair".
      - regex: "{{WORD_START}}(?:marron|kaki|crème|turquoise|émeraude|ocre|saumon|olive|ivoire|bordeaux|prune|cerise|chocolat|caramel|moutarde|corail|azur|sable|citron|framboise|lavande|abricot|bronze|argent|cuivre|acajou|anthracite|indigo|bleu|vert|rouge|jaune|gris|brun|noir|blanc|violet|orange|beige)\\p{Ll}{0,3}{{WORD_END}}"
        flags: gu
        scan: owned
        lookback: 1
        let:
          typed: m[0]
          lower: typed.toLowerCase()
          singular: lower.replace(/s$/, "")
          colour: lower.replace(/(?:e?s|e)$/, "")
          named: NOUN_COLOURS.has(singular) && lower !== singular
          # After a plural noun only: "les marrons" (chestnuts) is a noun of its own.
          previous: tokensBefore(ctx.text, m.index, 1)[0]
          found: "named ? wordFinding(ctx, m.index, typed, [singular], frame.ruleId, frame.messageKey) : null"
        when:
          - m.index >= ctx.from
          - named || BASE_COLOURS.has(colour) || BASE_COLOURS.has(singular)
          - "!!previous && /[sx]$/.test(previous.w) && isInflectedNoun(previous.w)"
          - "!adjectiveReadings(previous.w).length"
          - "!(verbReadings(previous.w).length && !isVerbHomograph(previous.w))"
        return: >-
          named
            ? found && { ...found, context: { start: previous.start, end: m.index + typed.length } }
            : colourShade(ctx, m, previous, colour, singular)
  - id: fr.style
    checks: [stylePhrasing]
    style: match
    message: review_msg_style_phrasing
    # French style advice (opt-in stylePhrasing) that needs more than a fixed phrase. The phrase
    # rows (calques, criticized phrasings, pleonasms) are in the phrase tables below.
    sets:
      # "calque > native native : nouns". The calque takes the native verb before these objects;
      # "*" means any use, and "!" marks a verb that "de" after it makes correct ("partir d'un
      # projet").
      VERB_CALQUE_LINES:
        - "rencontrer > respecter : norme exigence échéance critère obligation engagement"
        - "rencontrer > satisfaire : besoin attente demande"
        - "rencontrer > atteindre : objectif cible quota"
        - "compléter > remplir : formulaire questionnaire fiche déclaration sondage"
        - "compléter > conclure : transaction vente entente accord"
        - "opérer > exploiter : entreprise commerce magasin restaurant usine boutique franchise hôtel mine compagnie"
        - "opérer > conduire manœuvrer : machine grue véhicule chariot"
        - "émettre > délivrer : passeport permis visa diplôme licence attestation"
        - "émettre > publier : communiqué"
        - "endosser > appuyer : candidature candidat candidate proposition"
        - "supporter > soutenir appuyer : candidat candidate candidature cause initiative proposition réforme"
        - "adresser > aborder traiter : problème enjeu préoccupation défi problématique sujet"
        - "couper > réduire : dépense coût budget subvention salaire effectif prix"
        - "couper > supprimer : emploi"
        - "contrôler > maîtriser : incendie brasier"
        - "briser > battre : record"
        - "passer > adopter : loi règlement résolution motion"
        - "placer > passer : commande appel"
        - "loger > déposer : plainte grief"
        - "initier > lancer amorcer : projet programme processus démarche réforme changement dialogue enquête procédure"
        - "!partir > lancer : entreprise compagnie commerce projet mode rumeur débat discussion"
        - "combler > pourvoir : poste"
        - "solutionner > résoudre : *"
        - "impacter > toucher affecter : *"
        - "émotionner > émouvoir : *"
      CALQUE_ADVERBS:
        [
          pas,
          plus,
          jamais,
          point,
          toujours,
          déjà,
          bien,
          enfin,
          aussi,
          souvent,
          rarement,
          encore,
          vraiment,
          finalement,
          rapidement,
          mieux,
          mal,
        ]
      CALQUE_DETERMINERS:
        [
          le,
          la,
          l',
          les,
          un,
          une,
          des,
          du,
          de,
          d',
          ce,
          cet,
          cette,
          ces,
          mon,
          ma,
          mes,
          ton,
          ta,
          tes,
          son,
          sa,
          ses,
          notre,
          nos,
          votre,
          vos,
          leur,
          leurs,
          tous,
          toutes,
          chaque,
          plusieurs,
          certains,
          certaines,
          quelques,
          nombreux,
          nombreuses,
        ]
      CALQUE_AUXILIARIES:
        [a, ai, as, avons, avez, ont, avait, avaient, aura, auront, aurait, avoir, ayant]
      # "un bon dix minutes": the English word order; French puts "bon" after the number.
      STYLE_NUMBER_WORDS:
        [
          deux,
          trois,
          quatre,
          cinq,
          six,
          sept,
          huit,
          neuf,
          dix,
          onze,
          douze,
          treize,
          quatorze,
          quinze,
          seize,
          vingt,
          trente,
          quarante,
          cinquante,
          soixante,
          cent,
          et,
        ]
      FEMININE_UNITS: [minutes, heures, secondes, semaines, journées, années]
      # Forms of "aller", for "aller au coiffeur".
      ALLER_FORMS:
        [
          aller,
          vais,
          vas,
          va,
          allons,
          allez,
          vont,
          allé,
          allée,
          allés,
          allées,
          allais,
          allait,
          allions,
          alliez,
          allaient,
          irai,
          iras,
          ira,
          irons,
          irez,
          iront,
          irais,
          irait,
          irions,
          iriez,
          iraient,
          aille,
          ailles,
