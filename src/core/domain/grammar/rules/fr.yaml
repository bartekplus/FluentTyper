          moi: [mon, ma, mes],
          toi: [ton, ta, tes],
          lui: [son, sa, ses],
          elle: [son, sa, ses],
          nous: [notre, notre, nos],
          vous: [votre, votre, vos],
          eux: [leur, leur, leurs],
          elles: [leur, leur, leurs],
