      # The forms of a verb in the order of IRREGULAR_VERBS; -er verbs are built ("lançons",
      # "appuie", "complète").
      calqueVerbForms:
        args: "lemma: string"
        let:
          stem: lemma.slice(0, -2)
          hard: 'stem.replace(/c$/, "ç").replace(/g$/, "ge")'
          mute: 'stem.replace(/y$/, "i").replace(/é([^aeiouéèêy]+)$/, "è$1")'
          future: 'stem.replace(/y$/, "i")'
        return: >-
          IRREGULAR_VERBS[lemma]
            ? IRREGULAR_VERBS[lemma].split(" ")
            : [
                lemma,
                `${mute}e`,
                `${mute}es`,
                `${mute}e`,
                `${hard}ons`,
                `${stem}ez`,
                `${mute}ent`,
                `${hard}ait`,
                `${hard}aient`,
                `${future}era`,
                `${future}eront`,
                `${future}erait`,
                ...["é", "ée", "és", "ées"].map((end) => stem + end),
                `${hard}ant`,
              ]
      # Typed form -> the calque verb (its first row) and the slots the form fills.
      CALQUE_FORMS: >-
        [...new Set(CALQUE_ENTRIES.map((entry) => entry.lemma))]
          .flatMap((lemma) => calqueVerbForms(lemma).map((form, slot) => ({ form, lemma, slot })))
          .reduce(
            (forms, t) =>
              forms.set(
                t.form,
                forms.has(t.form)
                  ? { lemma: forms.get(t.form)!.lemma, slots: [...forms.get(t.form)!.slots, t.slot] }
                  : { lemma: t.lemma, slots: [t.slot] },
              ),
            new Map<string, { lemma: string; slots: number[] }>(),
          )
