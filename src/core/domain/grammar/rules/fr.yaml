      # version complète du formulaire", "la coupe des salaires": a noun or adjective. A subject
      # pronoun, an auxiliary or the clause start makes it a verb. "complète": je, il or an
      # imperative; the subject picks the native form.
      verbCalque:
        args: "ctx: DetectContext, m: RegExpExecArray"
        type: RawFinding | null
        let:
          typed: m[0]
          known: CALQUE_FORMS.get(typed.toLowerCase())!
          before: tokensBefore(ctx.text, m.index, 3)
          subject: 'before.find((t) => !CLITICS.has(t.w) && t.w !== "ne" && t.w !== "n''")'
          end: m.index + typed.length
          sentenceStart: "!before.length && SENTENCE_START.test(ctx.text.slice(Math.max(0, m.index - 4), m.index))"
          person: 'subject?.w === "je" || subject?.w === "j''" || sentenceStart ? 1 : subject?.w === "tu" ? 2 : 3'
          narrowed: known.slots.filter((slot) => slot === person || slot >= 12)
          slots: "known.slots.includes(1) && known.slots.length > 1 && narrowed.length ? narrowed : known.slots"
        when:
          - "!capitalizedName(ctx.text, m.index, typed)"
          - >-
            !(isVerbHomograph(typed.toLowerCase()) &&
              before.length > 0 &&
              before[0].w !== "ne" &&
              before[0].w !== "n'" &&
              !SUBJECT_PRONOUNS.has(subject?.w ?? "") &&
              !CALQUE_AUXILIARIES.has(subject?.w ?? ""))
        return: >-
          CALQUE_ENTRIES.filter((entry) => entry.lemma === known.lemma)
            .map((entry) => calqueFinding(ctx, m, entry.natives, entry.nouns, entry.noDe, slots, before, end))
            .find((found) => found !== null) ?? null
      # "Il va au coiffeur" -> "chez le coiffeur": one goes to a person's place with "chez".
      goToTrade:
        args: "ctx: DetectContext, m: RegExpExecArray"
        type: RawFinding | null
        let:
          word: m[0].toLowerCase()
          before: tokensBefore(ctx.text, m.index, 3)
          after: tokensAfter(ctx.text, m.index, 3)
          article: 'word === "à" ? after[1] : null'
          trade: 'word === "à" ? after[2] : after[1]'
          end: "article ? article.end : m.index + m[0].length"
        when:
          - before.some((t, i) => ALLER_FORMS.has(t.w) && before.slice(0, i).every((b) => CALQUE_ADVERBS.has(b.w)))
