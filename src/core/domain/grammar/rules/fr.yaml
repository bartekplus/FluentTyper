      - regex: "{{WORD_START}}(?<y>y[ \\t]?)?(?<verb>a|va)t-(?<pronoun>il|elle|on){{WORD_END}}"
        flags: giu
        scan: owned
        lookback: 1
        when:
          - m.index >= ctx.from
          - "!namedExampleBefore(ctx.text, m.index)"
        return: 'finding(frame.ruleId, frame.messageKey, m.index, m.index + m[0].length, [`${y ? `${y[0]} ` : ""}${y ? verb.toLowerCase() : verb}-t-${pronoun}`])'
      # "Donne-le moi" -> "Donne-le-moi", "Souvenez-vous en." -> "Souvenez-vous-en": a second
      # pronoun after a hyphenated imperative joins it too. "Allez-vous y aller ?": "y" belongs
      # to the infinitive; only a clause end tells. "Fais-le toi même", "Regarde-les nous
      # quitter": not a second object pronoun.
      - regex: "(?<=\\p{L}-)(?<first>le|la|les|moi|toi|lui|nous|vous|leur)[ \\t]+(?<second>moi|toi|lui|nous|vous|leur|en|y){{WORD_END}}"
        flags: giu
        scan: owned
        lookback: 1
        let:
          lowerFirst: first.toLowerCase()
          lowerSecond: second.toLowerCase()
          end: m.index + m[0].length
          closes: '/^[\s  ]*(?:$|[.!,;:)…])/u.test(ctx.text.slice(end))'
          next: tokensAfter(ctx.text, end, 1)[0]
        when:
          - m.index >= ctx.from
          - "!namedExampleBefore(ctx.text, m.index)"
          - >-
            lowerSecond === "en" || lowerSecond === "y"
