      HOMO_QUANTIFIERS: [rien, beaucoup, peu, trop, tant, assez, chose]
      # Words after which "a" starts a locution of the preposition: "a côté", "a travers", "a
      # l'exception de". Avoir has no reading with them.
      AFTER_PREPOSITION:
        [côté, coté, travers, droite, gauche, cheval, vélo, présent, propos, condition]
