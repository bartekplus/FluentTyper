      # Verbs a "where?" follows at the end of a question: "tu vas où ?", "il est où ?".
      WHERE_VERBS: [être, aller, habiter]
      # "je sais ou est la gare": être right after it asks where.
      WHERE_ETRE: [est, sont, était, étaient, se]
      OU_DEFINITE: [le, la, "l'", les, ce, cet, cette, ces]
      # Verbs whose attribute "sûr" may be: "être sûr", "se sentir sûr", "paraître sûr".
      LINKING_VERBS: [être, sentir, sembler, paraître, devenir, rester, demeurer]
      HOMO_DEGREE_ADVERBS:
        [
          peu,
          si,
          très,
          trop,
          assez,
          absolument,
          tout,
          fait,
          complètement,
          totalement,
          parfaitement,
