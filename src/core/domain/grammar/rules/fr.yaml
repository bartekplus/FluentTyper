      # subject pronoun ("je laisse") or opening the sentence as an imperative ("Porte les sacs",
      # "Attache la corde"). An imperative takes its object right after it: "Porte les sacs", not
      # "Chambre à coucher".
      clauseVerbAt:
        args: "ctx: DetectContext, own: FrenchToken[], t: FrenchToken, i: number"
        let:
          capital: /^\p{Lu}/u.test(ctx.text.slice(t.start, t.end))
        return: >-
          homoAuxiliary(t.w) && /^\p{Ll}/u.test(ctx.text[t.start]) && pronounSubjectAt(own, i)
            ? i > 0 || verbReadings(t.w).some((r) => r.lemma === "être")
            : i === 0
              ? false
              : capital && !openingVerb(ctx, t)
                ? false
                : onlyVerb(t.w, (r) => finiteReading(r) && r.lemma !== "avoir")
                  ? true
                  : !verbReadings(t.w).some((r) => finiteReading(r) && r.lemma !== "avoir" && r.lemma !== "être")
                    ? false
                    : own[i + 1] && SUBJECT_PRONOUNS.has(own[i + 1].w) && own[i + 1].w !== "nous" && own[i + 1].w !== "vous"
