                      : i === own.length - 1 &&
                        capital &&
                        sentenceStartsAt(ctx.text, t.start) &&
                        (HOMO_DETERMINERS.has(own[i - 1].w) || ["ceci", "cela", "ça", "moi", "lui"].includes(own[i - 1].w))
      # "je laisse cela a votre jugement", "porte les sacs a l'étage", "je suis a Montréal": the
      # clause already has its verb, so "a" is no second one. "quel âge a Tom": an inverted
      # subject after "quel". "il y a quelqu'un a la porte": "il y a" is the clause's verb. A
      # finite verb with its subject: "il pense a sa mère". A participle after its auxiliary:
      # "j'ai répondu a ta lettre", "elle est partie a la poste"; "ils ont été admis a l'école":
      # a passive's "été" before the participle. An infinitive governed by a finite verb: "il
      # faut parler a ta mère". After a preposition the infinitive may close a subject ("le
      # droit de voter a le droit").
      aToGraveVerb:
        args: "ctx: DetectContext, m: RegExpExecArray, before: FrenchToken[], after: FrenchToken[], fix: TokenFix"
        type: RawFinding | null
        let:
          previous: before[0]
          next: after[0]
          clause: tokensBefore(ctx.text, m.index, 12)
          joined: clause.findIndex((t) => HOMO_CONJUNCTIONS.has(t.w))
          own: "joined < 0 ? clause : clause.slice(0, joined)"
          verb: own.find((t, i) => clauseVerbAt(ctx, own, t, i))
          asked: own.some((t) => /^quel(?:le)?s?$/.test(t.w))
          ilYA: '!!verb && verb.w === "a" && own[own.indexOf(verb) + 1]?.w === "y"'
          auxiliary: 'before[skipWhile(before, 1, (t) => HOMO_ADVERBS.has(t.w) || t.w === "été")]'
          head: before[skipWhile(before, 1, (t) => CLITICS.has(t.w) || HOMO_ADVERBS.has(t.w))]
        return: >-
          verb && !asked && (ilYA || !own.some((t) => t.w === "y"))
            ? fix(verb)
            : onlyVerb(previous.w, (r) => finiteReading(r) && r.lemma !== "avoir" && r.lemma !== "être") && !plainParticiple(next.w)
              ? fix(previous)
              : verbReadings(previous.w).some((r) => r.slot === "Q") &&
                  auxiliary &&
                  /^\p{Ll}/u.test(ctx.text[auxiliary.start]) &&
                  homoAuxiliary(auxiliary.w)
                ? fix(previous)
                : verbReadings(previous.w).some((r) => r.slot === "I" && r.lemma === previous.w) && head && onlyVerb(head.w, finiteReading)
                  ? fix(previous)
                  : null
      startsClauseOu:
        args: "t: FrenchToken | undefined, after: FrenchToken[]"
        return: '!!t && (SUBJECT_PRONOUNS.has(t.w) || t.w === "c''" || (t.w === "l''" && after[1]?.w === "on"))'
      # "le jour ou il", "je sais ou aller", "Ou sont-ils ?": "where", not "or". "Et ou est le
      # métro ?", "Alors, ou se trouve le chalet ?": a question's first word past "et", "mais" or
      # "alors".
      ouToOu:
        args: "ctx: DetectContext, m: RegExpExecArray"
        type: RawFinding | null
        let:
          before: tokensBefore(ctx.text, m.index)
          after: tokensAfter(ctx.text, m.index + m[0].length, 3)
          rest: ctx.text.slice(m.index + m[0].length)
          fix: '() => homoFix(ctx, m, ["où"], { start: before[0]?.start ?? m.index, end: after[0]?.end ?? m.index + m[0].length })'
          opener: 'before.every((t) => ["et", "mais", "alors"].includes(t.w))'
          afterComma: '/(?:^|[.!?…]\s{0,8})(?:Et|Mais|Alors)\s{0,8},\s{0,8}$/u.test(ctx.text.slice(Math.max(0, m.index - 16), m.index))'
          startOfQuestion: 'm[0] === "Ou" ? sentenceStartsAt(ctx.text, m.index) : (before.length > 0 && opener) || afterComma'
        return: >-
          m[0] === "Ou" || startOfQuestion
            ? ouQuestion(after, rest, startOfQuestion, fix)
            : ouWhere(ctx, before, after, rest, fix)
      # "Ou sont mes clés ?": a question opened by "Ou" and a verb. "Ou serait-ce l'inverse ?": an
      # inversion right after it is "or", unless an infinitive follows ("Ou pourrons-nous aller ?").
      ouQuestion:
        args: "after: FrenchToken[], rest: string, startOfQuestion: boolean, fix: PlainFix"
        type: RawFinding | null
        let:
          next: after[0]
          infinitive: 'after[2] && verbReadings(after[2].w).some((r) => r.slot === "I")'
        when: 'startOfQuestion && rest.split(/[.!…\n]/)[0].includes("?") && !!next'
        return: >-
          next.hyphen
            ? infinitive
              ? fix()
              : null
            : next.w === "se" || next.w === "s'"
              ? fix()
              : onlyVerb(next.w, finiteReading) || next.w === "est"
                ? fix()
                : null
      # "Tu vas ou demain ?", "Il est ou Marc ?", "par ou ?": where, in a question after être,
      # aller or a preposition. "Tu viens ou pas ?", "tu es là ou tu pars ?": "or". "la maison ou
      # Marie est née", "pays ou le temps est doux": a name or a noun phrase and its verb open the
      # clause too. "Tu vas ou ?", "Ils partent ou demain ?".
      ouWhere:
        args: "ctx: DetectContext, before: FrenchToken[], after: FrenchToken[], rest: string, fix: PlainFix"
        type: RawFinding | null
        let:
          previous: before[0]
          next: after[0]
          question: /^[^.!?…\n]{0,30}\?/u.test(rest)
          where: 'verbReadings(previous.w).some((r) => finiteReading(r) && WHERE_VERBS.has(r.lemma)) || previous.w === "par"'
          or: >-
            next &&
            (["pas", "non", "bien", "alors", "quoi", "plutôt", "si"].includes(next.w) ||
              startsClauseOu(next, after) ||
              verbReadings(next.w).some(finiteReading))
          opensClause: >-
            startsClauseOu(next, after) ||
            (!!next &&
              ((/^\p{Lu}\p{Ll}/u.test(ctx.text.slice(next.start, next.end)) &&
                !!after[1] &&
                verbReadings(after[1].w).some(finiteReading)) ||
                (OU_DEFINITE.has(next.w) && !!after[2] && verbReadings(after[2].w).some(finiteReading))))
        when: "!!previous"
        return: >-
          question && where && !or
            ? fix()
            : PLACE_TIME_NOUNS.has(previous.w) && opensClause && ouPlaceOrTime(before, rest)
              ? fix()
              : ouAsked(ctx, before, after, opensClause)
                ? fix()
                : /^[\s  ]*\?/u.test(rest) && verbReadings(previous.w).some(finiteReading)
                  ? fix()
                  : null
      # "le jour ou la nuit" is "or"; a determiner before the noun keeps it a noun. "un mois ou je
      # m'abonne": only a definite noun is a time or place being named. "la seule fois ou il",
      # "des temps ou il": past an adjective, or the plural "des". "une ville ou il fait bon
      # vivre", "Pays ou il fait beau": a place, named or not. "une maison ou tu préfères un
      # appartement ?" offers a choice: not in a question.
      ouPlaceOrTime:
        args: "before: FrenchToken[], rest: string"
        let:
          d: >-
            before[1] &&
            !(HOMO_DETERMINERS.has(before[1].w) || before[1].w === "un" || before[1].w === "une") &&
            adjectiveReadings(before[1].w).length
              ? 2
              : 1
        return: >-
          (!!before[d] && (OU_DEFINITE.has(before[d].w) || before[d].w === "des")) ||
          (OU_PLACES.has(before[0].w) && !/^[^.!…\n]*\?/u.test(rest) && (!before[d] || ["un", "une"].includes(before[d].w)))
