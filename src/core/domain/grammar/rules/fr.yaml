          next: tokensAfter(ctx.text, m.index + m[0].length, 1)[0]
        when:
          - m.index >= ctx.from
          - '!(!before[i] || !["il", "elle", "on", "ce", "cela", "ça"].includes(before[i].w))'
          - '!/[^\s  ]$/u.test(ctx.text.slice(0, before[i].start))'
          - '!(!next || verbReadings(next.w).some((r) => typeof r.slot === "number"))'
          - "!namedExampleBefore(ctx.text, m.index)"
        return: >-
          finding(frame.ruleId, frame.messageKey, m.index, m.index + m[0].length, [carryCase(m[0], "peut être")], {
            context: { start: before[i].start, end: next.end },
