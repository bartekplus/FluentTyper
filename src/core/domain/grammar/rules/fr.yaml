                  : nounFinding([number === "p" ? `${stem}s` : stem])
      # "le carre", "au marche", "du cure": a masculine determiner and a form in -e whose -é
      # spelling is the noun. "un double sens", "le suicide": an adjective, or a noun of either
      # gender. "un double sens", "son indigne frère": an adjective before its noun. "le cure":
      # "le curé" or "la cure", the determiner's other gender.
      accentedNounFinding:
        args: "ctx: DetectContext, m: RegExpExecArray, det: string, word: string, gender: string | null, end: number, nounFinding: AlternativesFix"
