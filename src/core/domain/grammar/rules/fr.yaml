              (!(next && (adjectiveReadings(next.w).length > 0 || verbReadings(next.w).some((r) => r.slot === "Q"))) ||
                SW_DETERMINERS.has(next.w) ||
                next.w === "été"))
          - "!namedExampleBefore(ctx.text, m.index)"
        return: "homoFix(ctx, m, [...QUELLE_FORMS[lower]], { start: previous.start, end: verb.end })"
      # "plu grand", "plu tard" -> "plus": "plu" is the participle of plaire and pleuvoir, and
      # stands only after avoir ("ça m'a beaucoup plu", "a-t-il plu ?"). "elle s'y plu": a verb of
      # its own ("plut") after an object pronoun. "plu" after a sentence end opens it: only with
      # a word after it.
      - regex: "{{WORD_START}}plu{{WORD_END}}"
        flags: giu
        scan: owned
        lookback: 1
        let:
          before: tokensBefore(ctx.text, m.index, 4)
        when:
          - m.index >= ctx.from
          - '!before.some((t) => verbReadings(t.w).some((r) => r.lemma === "avoir"))'
          - "!(before[0] && CLITICS.has(before[0].w))"
          - "!(!tokensAfter(ctx.text, m.index + m[0].length, 1).length && !before.length)"
        return: homoFix(ctx, m, ["plus"])
  - id: fr.determiners
    checks: [frenchNounGender]
    style: match
    message: review_msg_fr_double_determiner
