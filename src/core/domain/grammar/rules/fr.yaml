        flags: giu
        scan: owned
        lookback: 1
        let:
          before: tokensBefore(ctx.text, m.index, 3).map((t) => t.w)
          end: m.index + m[0].length
          next: tokensAfter(ctx.text, end, 1)[0]
          article: det.toLowerCase().replace("’", "'")
          word: noun.toLowerCase()
          owners: STRESSED_OWNERS[who.toLowerCase()]
        when:
          - m.index >= ctx.from
          - >-
            !(!/^(?:est|sont|était|étaient)$/.test(before[0] ?? "") ||
              !["c'", "ce"].includes(before[before[1] === "ne" || before[1] === "n'" ? 2 : 1]))
          - "!/^(?:-|[ \\t]+(?:seule?s?|même|aussi|tout|toute|tous|toutes|de|d['’])(?![\\p{L}]))/u.test(ctx.text.slice(end, end + 8))"
