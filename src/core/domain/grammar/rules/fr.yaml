          pièce,
          chambre,
          site,
          page,
          ferme,
        ]
      ASKING_VERBS: [savoir, demander, indiquer, montrer, ignorer, expliquer]
      # Places a relative "où" names, with or without a determiner.
      OU_PLACES:
        [
          endroit,
          lieu,
          pays,
          ville,
          villes,
          maison,
          région,
          quartier,
          village,
          ferme,
          pièce,
