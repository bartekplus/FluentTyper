        flags: gu
        scan: owned
        lookback: 1
        let:
          previous: tokensBefore(ctx.text, m.index, 1)[0]
        when:
          - m.index >= ctx.from
          - "!(!previous || HOMO_DETERMINERS.has(previous.w) || !verbReadings(previous.w).some(finiteReading))"
        return: 'wordFinding(ctx, m.index, pret, ["près"], frame.ruleId, frame.messageKey, { start: m.index, end: m.index + m[0].length })'
