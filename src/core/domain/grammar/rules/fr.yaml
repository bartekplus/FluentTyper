      calqueObject:
        args: "text: string, end: number, nouns: ReadonlySet<string>, noDe: boolean"
        let:
          after: tokensAfter(text, end, 7)
          i: "CALQUE_ADVERBS.has(after[0]?.w) ? (CALQUE_ADVERBS.has(after[1]?.w) ? 2 : 1) : 0"
          j: "CALQUE_DETERMINERS.has(after[i + 1]?.w) ? i + 2 : i + 1"
        when: "!(!CALQUE_DETERMINERS.has(after[i]?.w) || (noDe && /^d/.test(after[i].w)))"
        return: "[after[j], after[j + 1]].find((t) => t && nouns.has(t.w)) ?? null"
      # One calque row on a verb form: the native verb's form for the same slots.
      calqueFinding:
        args: "ctx: DetectContext, m: RegExpExecArray, natives: string[], nouns: ReadonlySet<string> | null, noDe: boolean, slots: number[], before: FrenchToken[], end: number"
        let:
          noun: "nouns === null ? null : calqueObject(ctx.text, end, nouns, noDe)"
          alternatives: "natives.flatMap((native) => [...new Set(slots.map((slot) => calqueVerbForms(native)[slot]))].slice(0, 1))"
        when: "!(nouns && !noun)"
        return: >-
          wordFinding(ctx, m.index, m[0], alternatives, "stylePhrasing", "review_msg_style_phrasing", {
            start: before.at(-1)?.start ?? m.index,
            end: noun?.end ?? end,
          })
