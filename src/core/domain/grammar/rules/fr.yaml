      upHigh:
        args: "ctx: DetectContext, m: RegExpExecArray"
        type: RawFinding | null
        let:
          pair: tokensBefore(ctx.text, m.index, 2)
          en: pair[0]
          verb: pair[1]
          next: tokensAfter(ctx.text, m.index + m[0].length, 1)[0]
          end: m.index + m[0].length
        when: '!(en?.w !== "en" || !MONTER.has(verb?.w ?? "") || /^d/.test(next?.w ?? ""))'
        return: 'wordFinding(ctx, verb.end, ctx.text.slice(verb.end, end), [""], "stylePhrasing", "review_msg_style_phrasing", { start: verb.start, end })'
    frames:
      # "un bon dix minutes": the English word order; French puts "bon" after the number.
      - regex: "(?<target>un{{S}}bon{{S}}(?<count>\\p{L}+(?:-\\p{L}+)*|\\d+){{S}}(?<unit>minutes|heures|secondes|semaines|journées|années|jours|mois|ans)){{E}}"
