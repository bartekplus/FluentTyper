        scan: owned
        lookback: 1
        let:
          before: tokensBefore(ctx.text, m.index, 1)[0]
          after: tokensAfter(ctx.text, m.index + m[0].length, 4)
          i: "CALQUE_ADVERBS.has(after[0]?.w) ? (CALQUE_ADVERBS.has(after[1]?.w) ? 2 : 1) : 0"
