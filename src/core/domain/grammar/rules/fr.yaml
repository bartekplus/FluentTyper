    frames:
      # A word that has a homophone: each word checks its own confusion.
      - regex: "{{WORD_START}}(?:à|a|A|ou|Ou|où|sûre?s?|sure?s?|[cC]e|[sS]e|[sS]['’](?:est|était)|[sS]a|ma|ta|la|mon|ton|sont|son|on|non|[pP]eut|[pP]eux|[qQ]uant|[qQ]uand|du|[oO]nt|[pP]rés|guerres?)(?![\\p{L}\\p{M}\\p{N}_'’])"
        flags: gu
        scan: owned
        lookback: 1
        let:
          lower: m[0].toLowerCase().replaceAll("’", "'")
        when: m.index >= ctx.from
        return: >-
          lower === "à"
            ? graveToA(ctx, m)
            : lower === "a"
              ? aToGrave(ctx, m)
              : lower === "ou"
                ? ouToOu(ctx, m)
                : lower === "où"
                  ? ouGraveToOu(ctx, m)
                  : lower.startsWith("sû")
                    ? surGraveToSur(ctx, m)
                    : lower.startsWith("sur") || lower === "sure" || lower === "sures"
                      ? surToSur(ctx, m)
                      : lower === "ce"
                        ? ceToSe(ctx, m)
                        : lower === "se"
                          ? seToCe(ctx, m)
                          : lower.startsWith("s'")
                            ? sEstToCEst(ctx, m)
                            : lower === "sa"
                              ? (elidedAuxiliary(ctx, m) ?? saToCa(ctx, m))
                              : lower === "ma" || lower === "ta" || lower === "la"
                                ? (elidedAuxiliary(ctx, m) ?? (lower === "la" ? laToLa(ctx, m) : null))
                                : lower === "mon" || lower === "ton"
                                  ? elidedAuxiliary(ctx, m)
                                  : lower === "sont"
                                    ? sontToSon(ctx, m)
                                    : lower === "son"
                                      ? sonToSont(ctx, m)
                                      : lower === "on"
                                        ? onToOnt(ctx, m)
                                        : lower === "non"
                                          ? nonToNont(ctx, m)
                                          : lower === "peut" || lower === "peux"
                                            ? peutToPeu(ctx, m)
                                            : lower === "quant"
                                              ? quantToQuand(ctx, m)
                                              : lower === "quand"
                                                ? quandToQuant(ctx, m)
                                                : lower === "du"
                                                  ? duToDu(ctx, m)
                                                  : lower === "prés"
                                                    ? presToPres(ctx, m)
                                                    : lower === "guerre" || lower === "guerres"
