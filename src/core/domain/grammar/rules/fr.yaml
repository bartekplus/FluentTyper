      OBJECT_PRONOUNS_BEFORE_VERB:
        [le, la, les, l', me, m', te, t', se, s', en, "y", lui, leur, nous, vous]
      # Words before an infinitive that governs it: "de se placer", "pour se lancer".
      INFINITIVE_GOVERNORS: [de, "d'", pour, sans, à, par]
      ETRE_THIRD: [sont, sera, serait, seront, seraient, fut, furent]
      SE_ADVERBS: [bien, mal, mieux, plus, moins, trop, tant, tout]
      # "sa" is a possessive: it never stands before these, or at a clause end.
      NOT_AFTER_POSSESSIVE:
        [
          pour,
          que,
          qu',
          à,
          avec,
          comme,
          et,
          ou,
          mais,
          alors,
          donc,
          quand,
          si,
          là,
          ici,
          aussi,
          encore,
          non,
          oui,
          pas,
          avant,
          après,
          depuis,
          pendant,
          sans,
          sur,
          sous,
          dans,
          par,
          chez,
          en,
          vers,
          contre,
          entre,
          parce,
          car,
        ]
      JUDGING_VERBS: [trouver, rendre, juger, considérer, croire]
      HOMO_PREPOSITIONS:
        [de, à, avec, pour, dans, par, sur, sous, chez, sans, selon, depuis, pendant, malgré]
      HOMO_PLURAL_DETERMINERS: [les, des, ces, mes, tes, ses, nos, vos, leurs]
      # After "ce", words that open a plural noun phrase: "ce sont les enfants".
      CE_SONT_NEXT: [les, mes, tes, ses, nos, vos, leurs, eux, elles]
      # Plural pronoun subjects: "certains son partis".
      PLURAL_SUBJECTS: [ils, elles, certains, certaines, plusieurs, toutes]
      QUANTITY_WORDS: [beaucoup, peu, trop, tant, assez, plupart]
      PEU_DEGREE: [un, très, trop, si, assez, petit, bien]
      INVERTED_SUBJECTS: [tu, vous, il, elle, on, ils, elles, nous]
      # Infinitives that are also common nouns after "du": "il a du pouvoir", "du savoir".
      NOUN_INFINITIVES:
        [pouvoir, savoir, devoir, vouloir, dîner, déjeuner, goûter, souper, rire, sourire, plaisir]
      # Pronouns between devoir and its infinitive: "j'ai dû la lâcher".
      INFINITIVE_CLITICS: [le, la, les, l', lui, leur, "y", en, me, m', te, t', se, s', nous, vous]
      # Words after "an" that keep it: "l'an dernier", "un an plus tard", "dix ans révolus".
      AN_KEEPS:
