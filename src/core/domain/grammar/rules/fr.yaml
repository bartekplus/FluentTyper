          masculine: 'adjectiveReadings(adj).find((r) => r.slot === (plural ? "mp" : "ms"))'
          feminine: 'masculine ? inflect(masculine, plural ? "fp" : "fs")[0] : EPICENE_ADJECTIVE.test(adj) && /s$/.test(adj) === plural ? adj : undefined'
        when:
          - m.index >= ctx.from
          - plural === ["les", "des", "mes", "ces", "nos", "vos", "ses"].includes(lowerDet)
          - "!(an !== an.toLowerCase() || adj !== adj.toLowerCase() || AN_KEEPS.has(adj))"
          - '!verbReadings(adj).some((r) => finiteReading(r) || r.slot === "Q" || r.slot === "G")'
          - "!!feminine"
        return: >-
          finding(frame.ruleId, "review_msg_contextual_grammar", m.index, m.index + m[0].length, [
            `${carryCase(det, AN_DETERMINERS[lowerDet])}${lowerDet === "l'" ? "" : " "}${plural ? "années" : "année"} ${feminine}`,
