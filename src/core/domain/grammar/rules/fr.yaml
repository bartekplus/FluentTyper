      # stain). "Tâchons quand même de", "il tâche de ne pas le lui dire".
      - regex: "{{WORD_START}}[tT]ach(?:e|es|ez|ons|ent|ais|ait|aient|iez|ions|era|erai|eras|erons|erez|eront){{WORD_END}}"
        flags: gu
        scan: owned
        lookback: 1
        let:
          word: m[0].toLowerCase()
          previous: tokensBefore(ctx.text, m.index, 1)[0]
          after: tokensAfter(ctx.text, m.index + m[0].length, 7)
          k: 'skipWords(after, after[0]?.w === "quand" && after[1]?.w === "même" ? 2 : 0, HOMO_ADVERBS)'
