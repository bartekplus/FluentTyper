      - regex: "{{WORD_START}}[aA]veugl[eé]ment{{WORD_END}}"
        flags: gu
        scan: owned
        lookback: 1
        let:
          previous: tokensBefore(ctx.text, m.index, 1)[0]
          noun: 'HOMO_DETERMINERS.has(previous.w) || ["sans", "cet", "l''"].includes(previous.w)'
          adverb: m[0].toLowerCase() === "aveuglément"
        when:
          - m.index >= ctx.from
          - "!!previous"
        return: >-
          adverb && noun
            ? homoFix(ctx, m, [`${m[0].slice(0, 6)}ement`])
            : !adverb && !noun && verbReadings(previous.w).length && !isVerbHomograph(previous.w)
