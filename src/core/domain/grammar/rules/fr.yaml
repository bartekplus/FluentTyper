        when:
          - '!(gender !== "m" || !word.endsWith("e") || nounGender(word) === "m")'
          - "!(adjectiveReadings(word).length || !genderable(word))"
          - "!(following && (isInflectedNoun(following.w) || nounGender(following.w)))"
