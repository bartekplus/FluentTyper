          - '!(previous && (PRES_BEFORE.has(previous.w) || previous.w === "et" || previous.w === "ou"))'
          - '!(previous && /[sx]$/.test(previous.w) && (adjectiveReadings(previous.w).length || isInflectedNoun(previous.w.replace(/[sx]$/, ""))))'
