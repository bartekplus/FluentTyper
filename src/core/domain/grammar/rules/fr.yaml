      - regex: "(?:(?<=(?<!\\p{L})[qQ]u['’])|{{WORD_START}})[yY](?=[ \\t]+(?:en[ \\t]+)?a{{WORD_END}})"
        flags: gu
        scan: owned
        lookback: 1
        let:
          before: tokensBefore(ctx.text, m.index, 1)[0]
          opener: "before && Y_A_OPENERS.has(before.w) ? before : null"
          after: tokensAfter(ctx.text, m.index + 1, 4)
          k: 'after[0]?.w === "en" ? 1 : 0'
          verb: after[k]
          next: 'after[k + 1]?.w ?? ""'
          word: 'CALQUE_ADVERBS.has(next) && !Y_NEGATIVES.has(next) ? (after[k + 2]?.w ?? "") : next'
          nots: 'word === "plus" ? ["n''", ""] : Y_NEGATIVES.has(word) ? ["n''"] : [""]'
          start: opener?.start ?? m.index
        when:
          - m.index >= ctx.from
          - "!(before && !opener)"
          - '!(!before && !/(?:^|[.!?…,;:(\n])[\s\u00a0]*$/u.test(ctx.text.slice(0, m.index)))'
          - '!(verb?.w !== "a" || verb.hyphen)'
          - "!/^[ \\t]*-/.test(ctx.text.slice(verb.end, verb.end + 3))"
          - '!(next !== "eu" && verbReadings(next).some((r) => r.slot === "Q"))'
