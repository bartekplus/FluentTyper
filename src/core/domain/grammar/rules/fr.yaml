# fr grammar rules. See docs/agents/grammar-rules.md for the format.
lang: fr

rules:
  - id: fr.verbForms
    checks: [frenchVerbForms]
    predicate: verbForms
  - id: fr.homophones
    checks: [frenchHomophones]
    predicate: homophones
  - id: fr.hyphenation
    checks: [frenchHyphenation]
    predicate: hyphenation
  - id: fr.subjectVerbAgreement
    checks: [frenchSubjectVerbAgreement]
    predicate: subjectVerbAgreement
  - id: fr.elision
    checks: [frenchElision]
    predicate: elision
  - id: fr.dates
    checks: [frenchDates]
    predicate: dates
  - id: fr.nounNumber
    checks: [frenchNounNumber]
    predicate: nounNumber
  - id: fr.gender
    checks: [frenchNounGender]
    predicate: gender
  - id: fr.adjectives
    checks: [frenchAdjectiveAgreement]
    predicate: adjectives
  - id: fr.tout
    checks: [frenchTout]
    predicate: tout
  - id: fr.mood
    checks: [frenchMood]
    predicate: mood
  - id: fr.negation
    checks: [frenchMissingNe]
    predicate: negation
  - id: fr.smallWords
    checks: [frenchHomophones]
    predicate: smallWords
  - id: fr.determiners
    checks: [frenchNounGender]
    predicate: determiners
  - id: fr.ordinals
    checks: [frenchOrdinals]
    predicate: ordinals
  - id: fr.rangeDashes
    checks: [emdashShortcut]
    predicate: rangeDashes
  - id: fr.commas
    checks: [frenchCommas]
    predicate: commas
  - id: fr.countries
    checks: [frenchNounGender]
    predicate: countries
  - id: fr.auxiliary
    checks: [frenchVerbForms]
    predicate: auxiliary
  - id: fr.questions
    checks: [frenchSubjectVerbAgreement]
    predicate: questions
  - id: fr.imperative
    checks: [frenchVerbForms]
    predicate: imperative
  - id: fr.veillez
    checks: [frenchHomophones]
    predicate: veillez
  - id: fr.invariables
    checks: [frenchAdjectiveAgreement]
    predicate: invariables
  - id: fr.style
    checks: [stylePhrasing]
    predicate: style
  - id: fr.bareNoun
    checks: [frenchNounGender]
    predicate: bareNoun
  - id: fr.repeatedWords
    checks: [frenchRepeatedWords]
    predicate: repeatedWords

