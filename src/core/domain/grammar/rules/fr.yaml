    # langue", "des sa naissance" for "dès"); a verb form or participle after one is a noun spelled
    # like it: "le carre" (carré), "sa sortie" written "sa sorti", "un développent"
    # (développement), "mon déjeuné" (déjeuner).
    maps:
      # The gender (null: either) and the number of each determiner.
      DETERMINER_INFO:
        {
          le: [m, s],
          la: [f, s],
          "l'": [null, s],
          les: [null, p],
          un: [m, s],
          une: [f, s],
          des: [null, p],
          du: [m, s],
          au: [m, s],
          aux: [null, p],
          ce: [m, s],
          cet: [m, s],
          cette: [f, s],
          ces: [null, p],
          mon: [m, s],
          ton: [m, s],
          son: [m, s],
          ma: [f, s],
          ta: [f, s],
          sa: [f, s],
          mes: [null, p],
          tes: [null, p],
          ses: [null, p],
          notre: [null, s],
          votre: [null, s],
          nos: [null, p],
          vos: [null, p],
          leur: [null, s],
          leurs: [null, p],
        }
      DETERMINER_FEMININE_OF: { le: la, un: une, du: de la, au: à la, mon: ma, ton: ta, son: sa }
    sets:
      # Determiners that are never pronouns: a verb form after them is no verb.
      ONLY_DETERMINERS:
        [
          un,
          une,
          des,
          du,
          au,
          aux,
          ce,
          cet,
          cette,
          ces,
          mon,
          ton,
          son,
          ma,
          ta,
          sa,
          mes,
          tes,
          ses,
          notre,
          votre,
          nos,
          vos,
        ]
      # Second words that make a pair right: "le leur", "aux leurs" (possessive pronouns), "le son",
      # "un ton" (nouns), "le un", "la une" (the number, the front page), "le notre" (le nôtre, an
      # accent away).
      KEPT_SECOND: [leur, leurs, son, ton, un, une, notre, votre]
      AFTER_NEGATION_WORDS: [pas, plus, jamais, rien]
      NE_BEFORE: [ne, "n'"]
      # Quantifiers and prepositions that never follow these words: "des plusieurs pays", "les
      # certaines règles", "de des enfants", "à aux enfants", "des toutes les catégories".
      PAIR_QUANTIFIERS: [plusieurs, certains, certaines]
      PAIR_PLURAL_DETERMINERS: [les, ces, mes, tes, ses, nos, vos]
    defs:
      DETERMINER_OPENERS: 'new Set([...PREPOSITIONS, "que", "qu''", "et", "ou", "mais", "si", "quand", "car", "donc", "puis", "comme", "lorsque", "puisque"])'
