    defs:
      calqueNounPlural:
        args: "noun: string"
        return: "/[sxz]$/.test(noun) ? noun : /al$/.test(noun) ? `${noun.slice(0, -2)}aux` : `${noun}s`"
      # One row of the calque table.
      calqueEntry:
        args: "line: string"
        let:
          head: 'line.split(" : ")[0]'
          nouns: 'line.split(" : ")[1]'
          calque: 'head.split(" > ")[0]'
        return: >-
          ({
            lemma: calque.replace("!", ""),
            natives: head.split(" > ")[1].split(" "),
            nouns: nouns === "*" ? null : new Set(nouns.split(" ").flatMap((n) => [n, calqueNounPlural(n)])),
            noDe: calque.startsWith("!"),
          })
