# fr grammar rules. See docs/agents/grammar-rules.md for the format.
lang: fr

# Regex fragments of the frame rules: {{NAME}}.
fragments:
  # No letter, digit, underscore, apostrophe or hyphen before or after a word.
  WORD_START: "(?<![\\p{L}\\p{M}\\p{N}_'’-])"
  WORD_END: "(?![\\p{L}\\p{M}\\p{N}_'’-])"
  # The country names of review/french/countries.ts, longest first.
  COUNTRY_NAMES: "Nouvelle-Zélande|Arabie saoudite|Côte d['’]Ivoire|Biélorussie|Afghanistan|Ouzbékistan|Azerbaïdjan|Royaume-Uni|Philippines|Angleterre|Mauritanie|Californie|Luxembourg|Bangladesh|Kazakhstan|Mozambique|États-Unis|Seychelles|Madagascar|Allemagne|Slovaquie|Macédoine|Thaïlande|Indonésie|Australie|Argentine|Normandie|Bourgogne|Aquitaine|Sardaigne|Catalogne|Venezuela|Guatemala|Nicaragua|Groenland|Singapour|Belgique|Autriche|Roumanie|Bulgarie|Slovénie|Tchéquie|Moldavie|Lituanie|Lettonie|Finlande|Jordanie|Mongolie|Malaisie|Birmanie|Éthiopie|Tanzanie|Colombie|Jamaïque|Bretagne|Provence|Lorraine|Équateur|Portugal|Danemark|Paraguay|Honduras|Salvador|Cambodge|Pakistan|Cameroun|Zimbabwe|Botswana|Pays-Bas|Maldives|Antilles|Espagne|Pologne|Hongrie|Croatie|Albanie|Ukraine|Estonie|Norvège|Irlande|Islande|Turquie|Géorgie|Arménie|Algérie|Tunisie|Somalie|Namibie|Ouganda|Bolivie|Floride|Bavière|Uruguay|Ontario|Mexique|Vietnam|Sénégal|Nigeria|Burundi|Bahamas|Comores|Bahreïn|Maurice|France|Suisse|Italie|Serbie|Bosnie|Russie|Écosse|Égypte|Zambie|Guinée|Guyane|Alsace|Sicile|Canada|Québec|Brésil|Koweït|Rwanda|Soudan|Chypre|Monaco|Taïwan|Grèce|Suède|Syrie|Chine|Corée|Libye|Corse|Pérou|Chili|Japon|Népal|Tibet|Liban|Qatar|Yémen|Maroc|Niger|Tchad|Gabon|Congo|Kenya|Bénin|Ghana|Malte|Haïti|Inde|Iran|Irak|Laos|Mali|Togo|Cuba"
  # Markdown emphasis around a date is not a word: "le **32/04/2020**", "_32 janvier_".
  DATE_START: "(?<![\\p{L}\\p{N}][*_~]{0,3})"
  DATE_END: "(?![*_~]{0,3}[\\p{L}\\p{N}])"
  WEEKDAY: "(?:(?<weekday>dimanche|lundi|mardi|mercredi|jeudi|vendredi|samedi)[ \\t]{0,8},?[ \\t]{1,8})?"
  MONTH_NAMES: "janvier|février|fevrier|mars|avril|mai|juin|juillet|août|aout|septembre|octobre|novembre|décembre|decembre"
  # One word, also with an elision ("qu'on").
  REPEAT_WORD: "\\p{L}[\\p{L}\\p{M}]*(?:['’]\\p{L}[\\p{L}\\p{M}]*)?"

# Most French frames scan as `inChunk` of review/french/frenchTokens.ts expects: an owned scan
# from one character before the chunk (`scan: owned`, `lookback: 1`).
rules:
  - id: fr.verbForms
    checks: [frenchVerbForms]
    style: match
    message: review_msg_fr_infinitive
    # The -é / -er / -ez endings of first-group verbs sound alike. Their slot decides: a past
    # participle after avoir or être ("il a mangé"), an infinitive after a preposition or a verb
    # that governs one ("pour manger", "je veux manger"), "-ez" with a "vous" subject ("vous
    # mangez").
    maps:
      VF_PERSONS:
        { je: 1, "j'": 1, tu: 2, il: 4, elle: 4, on: 4, nous: 8, vous: 16, ils: 32, elles: 32 }
      # Determiners with the gender ("" either) and number they show.
      NOUN_DETERMINERS:
        {
          le: [m, s],
          la: [f, s],
          "l'": ["", s],
          un: [m, s],
          une: [f, s],
          du: [m, s],
          au: [m, s],
          ce: [m, s],
          cet: [m, s],
          cette: [f, s],
          mon: ["", s],
          ton: ["", s],
          son: ["", s],
          ma: [f, s],
          ta: [f, s],
          sa: [f, s],
          notre: ["", s],
          votre: ["", s],
          leur: ["", s],
          les: ["", p],
          des: ["", p],
          aux: ["", p],
          ces: ["", p],
          mes: ["", p],
          tes: ["", p],
          ses: ["", p],
          nos: ["", p],
          vos: ["", p],
          leurs: ["", p],
        }
    sets:
      # Adverbs that may stand between an auxiliary or a governing verb and the next verb.
      VF_ADVERBS:
        [
          pas,
          plus,
          jamais,
          rien,
          bien,
          mal,
          déjà,
          encore,
          toujours,
          souvent,
          beaucoup,
          trop,
          vraiment,
          tout,
          enfin,
          aussi,
          même,
          peu,
          presque,
          longtemps,
          également,
          ainsi,
          juste,
          seulement,
          sûrement,
          certainement,
          probablement,
          finalement,
          simplement,
          absolument,
          point,
          guère,
          vite,
          mieux,
          notamment,
          parfois,
          rarement,
          soudain,
          aussitôt,
          bientôt,
        ]
      VF_NEGATION: [ne, "n'"]
      VF_REFLEXIVES: [me, "m'", te, "t'", se, "s'", nous, vous, lui, leur]
      VF_OBJECTS: [le, la, les, "l'"]
      # Verbs governing a bare infinitive.
      VF_GOVERNING: [pouvoir, devoir, aller, falloir, oser, daigner, compter, valoir]
      # Governing verbs that also take an attribute participle after an object pronoun ("je le
      # veux terminé", "je l'ai laissé fermé", "il se sait traqué"): there they abstain.
      GOVERNING_WITH_ATTRIBUTE:
        [
          vouloir,
          savoir,
          aimer,
          adorer,
          préférer,
          détester,
          espérer,
          souhaiter,
          désirer,
          faire,
          laisser,
          entendre,
          sentir,
          voir,
          regarder,
          écouter,
        ]
      # "se faire aider", "se laisser tenter": a reflexive pronoun still governs an infinitive.
      REFLEXIVE_GOVERNORS: [faire, laisser]
      VF_DEGREE: [très, bien, trop, si, assez, vraiment, plutôt, tellement]
      # Words that may follow "c'est" + a participle in its clause: "c'est arrivé hier".
      AFTER_CEST_PARTICIPLE:
        [hier, comment, aujourd'hui, ici, là, quand, où, pourquoi, récemment, ce, cette]
      VF_PREPOSITIONS: [de, "d'", pour, sans, à, par]
      VF_DETERMINERS:
        [
          le,
          la,
          les,
          l',
          un,
          une,
          des,
          du,
          ce,
          cet,
          cette,
          ces,
          mon,
          ma,
          mes,
          ton,
          ta,
          tes,
          son,
          sa,
          ses,
          notre,
          nos,
          votre,
          vos,
          leurs,
        ]
      # "rien de changé", "quoi de prévu", "près de nous", "deux de cassés": the participle or the
      # pronoun after "de" is not governed by it.
      NOT_GOVERNING_DE:
        [
          rien,
          quoi,
          chose,
          personne,
          plus,
          moins,
          autre,
          un,
          une,
          aucun,
          aucune,
          près,
          loin,
          autour,
          auprès,
          côté,
          lors,
          hors,
          face,
          part,
          chacun,
          chacune,
          beaucoup,
          plupart,
          certains,
          plusieurs,
        ]
      # "pour toujours", "à jamais": the adverb completes the preposition.
      PREPOSITION_ADVERBS: [toujours, jamais, longtemps, bientôt, plus, même]
      # Participles more often a misspelt noun than a verb there: "de coté" for "de côté".
      MISSPELT_NOUNS: [coté]
      # Adjectives and nouns before "à" + an infinitive: "facile à lire", "du mal à dormir".
      A_GOVERNORS:
        [
          facile,
          faciles,
          difficile,
          difficiles,
          prêt,
          prête,
          prêts,
          prêtes,
          apte,
          aptes,
          simple,
          simples,
          agréable,
          agréables,
          pénible,
          pénibles,
          impossible,
          impossibles,
          dur,
          dure,
          durs,
          dures,
          lent,
          lente,
          mal,
          peine,
          difficultés,
          difficulté,
          tendance,
          intérêt,
        ]
      # Quantities an infinitive with "à" completes: "tout à gagner", "rien à signaler".
      TO_DO_QUANTITIES: [tout, rien, beaucoup, peu, trop, assez, plus]
      # Verbs whose "de", "à" or "par" introduces an infinitive far more than a noun.
      INFINITIVE_PREPOSITION_VERBS:
        [
          venir,
          continuer,
          essayer,
          finir,
          arrêter,
          cesser,
          refuser,
          accepter,
          décider,
          oublier,
          tenter,
          éviter,
          choisir,
          commencer,
          apprendre,
          chercher,
          réussir,
          hésiter,
          aider,
          obliger,
          autoriser,
        ]
      # Verbs whose object may do what the infinitive after it says: "il laisse son fils acheter".
      OBJECT_INFINITIVE_GOVERNORS: [laisser, voir, regarder, entendre, écouter, sentir, faire]
      # Nouns of time after a participle that describes its noun: "la tour illuminée la nuit".
      TIME_NOUNS:
        [
          nuit,
          jour,
          soir,
          matin,
          midi,
          minuit,
          veille,
          lendemain,
          semaine,
          mois,
          année,
          an,
          fois,
          heure,
          été,
          hiver,
          printemps,
          automne,
          lundi,
          mardi,
          mercredi,
          jeudi,
          vendredi,
          samedi,
          dimanche,
        ]
      # Conjunctions that open a clause with its own subject. "que", "et", "ou", "où", "donc" and a
      # comma also come before an infinitive ("ne fait que vous plaindre", "vous saluer et vous
      # remercier", "nulle part où vous cacher", "je peux donc vous montrer"): left out.
      VF_CLAUSE_OPENERS: [si, quand, lorsque, lorsqu', puisque, puisqu', comme, mais, car]
      # Words that keep a sentence-initial "vous" + infinitive a clause of its own: "Vous aimer
      # aller au cinéma", "Vous jouer pas".
      CONTINUES_FINITE: [pas, jamais, plus, rien, point]
      PLURAL_ETRE:
        [
          sommes,
          êtes,
          sont,
          étions,
          étiez,
          étaient,
          serons,
          serez,
          seront,
          serions,
          seriez,
          seraient,
          furent,
        ]
      PLURAL_AVOIR: [avons, avez, ont, avions, aviez, avaient, aurons, aurez, auront, auraient]
      VF_FEMININE_SUBJECTS: [elle, elles]
      VF_MASCULINE_SUBJECTS: [il, ils]
      # Words before the infinitive "avoir" that make it an auxiliary: "après avoir", "pour avoir".
      AVOIR_INFINITIVE_GOVERNORS: [après, pour, sans, de, "d'"]
      AVOIR_SUBJECT_WORDS: [je, "j'", tu, il, elle, on, nous, vous, ils, elles, qui, ça, cela]
      # Clitics between a noun subject and its verb: "la foule se déplace", "ma moto ne marche".
      VF_SUBJECT_CLITICS:
        [se, s', ne, n', me, m', te, t', nous, vous, le, la, les, l', lui, leur, "y", en]
      # Verbs that take an object and then its infinitive: "je vois les enfants jouer", "il emmène
      # le chien promener".
      OBJECT_INFINITIVE_EXTRA:
        [emmener, envoyer, mener, amener, apercevoir, observer, contempler, écouter]
      INFINITIVE_GOVERNOR_EXTRA:
        [
          vouloir,
          venir,
          partir,
          sortir,
          courir,
          monter,
          descendre,
          rentrer,
          retourner,
          sembler,
          paraître,
          croire,
          penser,
          falloir,
        ]
      # Nouns that take an infinitive complement, its "de" sometimes dropped: "une envie rentrer".
      INFINITIVE_NOUNS:
        [
          envie,
          besoin,
          temps,
          moyen,
          occasion,
          opportunité,
          droit,
          peur,
          intention,
          façon,
          manière,
          raison,
          chance,
          possibilité,
          capacité,
          plaisir,
          honte,
          mal,
          hâte,
          idée,
          habitude,
          permission,
          obligation,
        ]
      VF_OBJECT_PRONOUNS: [le, la, les, l', lui, leur, me, m', te, t', se, s', nous, vous]
      # Adjectives that come before their noun: "un nouveau ficher" misspells the noun.
      PRENOMINAL:
        [
          nouveau,
          nouvel,
          nouvelle,
          nouveaux,
          nouvelles,
          beau,
          bel,
          belle,
          beaux,
          belles,
          vieux,
          vieil,
          vieille,
          petit,
          petite,
          petits,
          petites,
          grand,
          grande,
          grands,
          grandes,
          bon,
          bonne,
          bons,
          bonnes,
          gros,
          grosse,
          jeune,
          jeunes,
          autre,
          autres,
          même,
          mêmes,
          premier,
          première,
          dernier,
          dernière,
          prochain,
          prochaine,
          seul,
          seule,
          mauvais,
          mauvaise,
          joli,
          jolie,
        ]
      PREPOSITIONS_BEFORE:
        [
          dans,
          en,
          sur,
          sous,
          avant,
          après,
          pendant,
          depuis,
          avec,
          sans,
          pour,
          par,
          chez,
          vers,
          entre,
        ]
      # Articles that are never object pronouns; "le", "la", "les", "l'" only after a preposition
      # or opening a clause.
      VF_ARTICLES: [un, une, des, du, au, aux]
      VF_DEFINITE: [le, la, les, "l'"]
      # Words that open a clause of its own, whose verb may follow a noun phrase.
      VF_SUBORDINATORS:
        [
          que,
          qu',
          qui,
          où,
          dont,
          si,
          quand,
          lorsque,
          lorsqu',
          puisque,
          puisqu',
          comme,
          et,
          ou,
          mais,
          car,
          donc,
          ni,
        ]
      # Prepositions that are also verb forms ("entrer", "contrer").
      NOT_PARTICIPLES: [entre, contre, outre]
    defs:
      # Adverbial phrases between an auxiliary and its participle, nearest word first. "il sera
      # lui-même remplacé", "elle sera elle aussi remplacée".
      ADVERBIAL_PHRASES: >-
        [
          ["même", "quand"],
          ["toutes", "pour", "fois", "une"],
          ["suite", "de", "tout"],
          ["moins", "au"],
          ["coup", "du"],
          ["fait", "à", "tout"],
          ["peu", "à", "peu"],
          ["même", "lui"],
          ["même", "elle"],
          ["mêmes", "eux"],
          ["mêmes", "elles"],
          ["aussi", "lui"],
          ["aussi", "elle"],
        ]
      OBJECT_INFINITIVE: new Set([...GOVERNING_WITH_ATTRIBUTE, ...OBJECT_INFINITIVE_EXTRA])
      # Verbs that take an infinitive, even across an adverbial phrase ("peut de cette manière
      # trier", "j'ai senti mon téléphone vibrer").
      VF_INFINITIVE_GOVERNORS: new Set([...VF_GOVERNING, ...OBJECT_INFINITIVE, ...INFINITIVE_GOVERNOR_EXTRA])
      ARTICLE_AFTER: 'new Set([...VF_PREPOSITIONS, ...PREPOSITIONS_BEFORE, "d''"])'
      avoirForm:
        args: "word: string"
        return: 'verbReadings(word).some((r) => r.lemma === "avoir" && typeof r.slot === "number")'
      etreForm:
        args: "word: string"
        return: 'verbReadings(word).some((r) => r.lemma === "être" && typeof r.slot === "number")'
      # The first-group infinitive a word spells ("manger"), from its -er, -é or -ez form.
      firstGroupLemma:
        args: 'word: string, slot: "I" | "Q" | number'
        return: >-
          verbReadings(word).find(
            (r) =>
              r.slot === slot &&
              r.lemma.endsWith("er") &&
              r.lemma !== "aller" &&
              (slot !== "Q" || word === `${r.lemma.slice(0, -2)}é`) &&
              (slot !== "I" || word === r.lemma) &&
              (slot !== VOUS || word === `${r.lemma.slice(0, -2)}ez`),
          )?.lemma ?? null
      # The subject before the verb chain ending at index `i`: negation and object pronouns are
      # skipped, and "nous"/"vous" at the start of the chain is the subject ("nous vous parlons").
      vfSubjectAt:
        args: "tokens: FrenchToken[], i: number"
        type: FrenchToken | undefined
        let:
          j: skipWhile(tokens, i, (t) => VF_NEGATION.has(t.w) || CLITICS.has(t.w))
          head: tokens[j]
          first: tokens[j - 1]
        return: 'head && SUBJECT_PRONOUNS.has(head.w) ? head : j > i && first && (first.w === "nous" || first.w === "vous") ? first : head'
      # Participle endings for an être subject, by its gender and number when the pronoun shows it.
      etreEndings:
        args: "subject: string | undefined"
        return: >-
          subject === "il" || subject === "on"
            ? ["é"]
            : subject === "elle"
              ? ["ée"]
              : subject === "ils"
                ? ["és"]
                : subject === "elles"
                  ? ["ées"]
                  : subject === "je" || subject === "j'" || subject === "tu"
                    ? ["é", "ée"]
                    : subject === "nous"
                      ? ["és", "ées"]
                      : ["é", "ée", "és", "ées"]
      # An adverb in -ment that no noun or verb spells ("rapidement", not "sentiment").
      mentAdverb:
        args: "word: string"
        return: /^\p{L}{4,}ment$/u.test(word) && !verbReadings(word).length && !isInflectedNoun(word) && !nounGender(word)
      # "elle fut quasiment remplacée", "il a rapidement mangé": adverbs in -ment.
      mentSkip:
        args: "tokens: FrenchToken[], i: number"
        type: number
        return: "tokens[i] && mentAdverb(tokens[i].w) ? mentSkip(tokens, skipWhile(tokens, i + 1, (t) => VF_ADVERBS.has(t.w) || VF_DEGREE.has(t.w))) : i"
      participleFinding:
        args: "ctx: DetectContext, m: RegExpExecArray, aux: FrenchToken, lemma: string, endings: string[]"
        return: >-
          wordFinding(ctx, m.index, m[0], endings.map((ending) => lemma.slice(0, -2) + ending), "frenchVerbForms",
            "review_msg_fr_past_participle", { start: aux.start, end: m.index + m[0].length })
      # "c'est compliquer", "comment est-ce arriver ?": with no infinitive as its topic ("partir,
      # c'est mourir") and nothing after it, the infinitive is the participle. "c'est rêver" is a
      # phrase of its own: only a degree adverb, a time or manner word after it, or a question
      # tells the participle ("c'est bien compliquer", "c'est arriver hier").
      cestParticiple:
        args: "ctx: DetectContext, m: RegExpExecArray, word: string, lemma: string, tokens: FrenchToken[], i: number, before: number, inverted: boolean, aux: FrenchToken"
        type: RawFinding | null
        let:
          ce: "inverted ? tokens[i - 1] : tokens[before]"
          topic: "inverted ? tokens.slice(i + 1) : tokens.slice(before + 1)"
          next: tokensAfter(ctx.text, m.index + m[0].length, 1)[0]
        when:
          - '!(isVerbHomograph(word) || !word.endsWith("er"))'
          - '!(!ce || /,[\s ]*$/u.test(ctx.text.slice(Math.max(0, ce.start - 9), ce.start)))'
          - '!topic.some((t) => verbReadings(t.w).some((r) => r.slot === "I"))'
          - "!(next && !AFTER_CEST_PARTICIPLE.has(next.w))"
          - '!(!next && !tokens.slice(0, i).some((t) => VF_DEGREE.has(t.w)) && !/^[^.!…\n]{0,40}\?/u.test(ctx.text.slice(m.index)))'
        return: 'participleFinding(ctx, m, aux, lemma, etreEndings("il"))'
      # "il a manger", "elle est arriver", "avez-vous signez": a participle after avoir or être.
      # Inversion: "avez-vous (déjà) signé", "a-t-il". "il y a dîner ce soir": "il y a" introduces
      # a noun. "a" and "as" are also a slip for "à" ("une machine a laver") and a noun ("un as").
      # "c'est manger", "partir, c'est mourir": an infinitive is the complement there. A noun
      # complement ("il est boucher") is no participle either. A pronoun that is not this
      # auxiliary's subject tells nothing about the agreement.
      auxiliaryParticiple:
        args: "ctx: DetectContext, m: RegExpExecArray, word: string, lemma: string, tokens: FrenchToken[], from: number"
        type: RawFinding | null
        let:
          inverted: >-
            tokens[from] && (SUBJECT_PRONOUNS.has(tokens[from].w) || tokens[from].w === "ce") && tokens[from + 1]?.hyphen
              ? tokens[from].w
              : undefined
          i: "inverted ? from + 1 : from"
          aux: tokens[i]
          avoir: avoirForm(aux.w)
          etre: "!avoir && etreForm(aux.w)"
          before: skipWhile(tokens, i + 1, (t) => VF_NEGATION.has(t.w) || CLITICS.has(t.w))
          subject: inverted ?? vfSubjectAt(tokens, i + 1)?.w
        when:
          - "!!aux"
          - avoir || etre
          - '!tokens.slice(i + 1, before).some((t) => t.w === "y")'
        return: >-
          avoir
            ? (aux.w === "a" || aux.w === "as") && !inverted && !["il", "elle", "on", "qui", "ça", "cela", "tu"].includes(subject ?? "")
              ? null
              : participleFinding(ctx, m, aux, lemma, ["é"])
            : subject === "c'" || subject === "ce"
              ? cestParticiple(ctx, m, word, lemma, tokens, i, before, !!inverted, aux)
              : !subject || !SUBJECT_PRONOUNS.has(subject) || isVerbHomograph(word)
                ? null
                : participleFinding(ctx, m, aux, lemma, etreEndings(hasPerson(lemmaPersons(aux.w, "être"), VF_PERSONS[subject]) ? subject : undefined))
      # "il a quand même aider", "il a une fois pour toutes abandonner": an adverbial phrase. "il
      # pense être arriver": the infinitive "être" as the auxiliary of a third person.
      participleAfterAuxiliary:
        args: "ctx: DetectContext, m: RegExpExecArray"
        type: RawFinding | null
        let:
          word: m[0].toLowerCase()
          lemma: 'word.endsWith("ez") ? firstGroupLemma(word, VOUS) : firstGroupLemma(word, "I")'
          tokens: tokensBefore(ctx.text, m.index)
          phrase: ADVERBIAL_PHRASES.find((p) => p.every((w, k) => tokens[k]?.w === w))
          i: mentSkip(tokens, skipWhile(tokens, phrase?.length ?? 0, (t) => VF_ADVERBS.has(t.w) || VF_DEGREE.has(t.w)))
        when: "!!lemma"
        return: >-
          tokens[i]?.w === "être" && word.endsWith("er") && !isVerbHomograph(word) && !tokens[i + 1]?.hyphen
            ? wordFinding(ctx, m.index, m[0], [`${lemma.slice(0, -2)}é`], "frenchVerbForms", "review_msg_fr_past_participle", {
                start: tokens[i].start,
                end: m.index + m[0].length,
              })
            : auxiliaryParticiple(ctx, m, word, lemma, tokens, i)
      # "il à mangé" is the auxiliary misspelt: only a verb before "à" governs ("commence à").
      # "facile à mangé", "du mal à passé", "obligé à signalé", "il continue à adopté": an
      # adjective or noun that takes "à" + infinitive, a participle, or a verb after its subject.
      # "de tendu à arqué": a range between two participles.
      aGovernsInfinitive:
        args: "tokens: FrenchToken[], i: number"
        let:
          previous: tokens[i + 1]
          range: '["de", "d''"].includes(tokens[i + 2]?.w ?? "")'
        when: "!(!previous || SUBJECT_PRONOUNS.has(previous.w))"
        return: >-
          A_GOVERNORS.has(previous.w)
            ? true
            : !range && !isVerbHomograph(previous.w) && verbReadings(previous.w).some((r) => r.slot === "Q")
              ? true
              : SUBJECT_PRONOUNS.has(tokens[i + 2]?.w ?? "") &&
                  verbReadings(previous.w).some((r) => typeof r.slot === "number" && r.lemma !== "avoir" && r.lemma !== "être")
                ? true
                : isVerbHomograph(previous.w)
                  ? false
                  : verbReadings(previous.w).some((r) => r.lemma !== "avoir" && r.lemma !== "être" && r.slot !== "Q")
        else: "false"
      # Whether a preposition before an infinitive governs it, from the words around it. "de leur
      # destinée": "leur" is a determiner as often as a pronoun. "I pour entrelacé", "râpé pour
      # râpé": a clause-final participle right after "pour" or "sans" names; "pour ne plus
      # travaillé" does not.
      prepositionGoverns:
        args: "tokens: FrenchToken[], i: number, ctx: DetectContext, m: RegExpExecArray"
        let:
          governor: tokens[i]
          previous: tokens[i + 1]
        return: >-
          tokens.slice(0, i).some((t) => t.w === "leur")
            ? false
            : i > 0 && PREPOSITION_ADVERBS.has(tokens[i - 1].w)
              ? false
              : (governor.w === "de" || governor.w === "d'") && previous && NOT_GOVERNING_DE.has(previous.w)
                ? false
                : governor.w === "à"
                  ? aGovernsInfinitive(tokens, i)
                  : !(
                      (governor.w === "pour" || governor.w === "sans") &&
                      i === 0 &&
                      /^[\s ]*(?:[.!?…]|$)/u.test(ctx.text.slice(m.index + m[0].length))
                    )
      # "il continue à fumé", "il vient de sauté": the preposition at `i` comes right after a verb
      # that governs an infinitive with it, so the word after it is the infinitive even when it is
      # also a noun or an adjective ("fumé", "sauté").
      governedByVerb:
        args: "tokens: FrenchToken[], i: number"
        let:
          verb: tokens[i + 1]
        when: '!(i > 0 || !verb || tokens[i].w === "pour" || tokens[i].w === "sans")'
        return: 'verbReadings(verb.w).some((r) => (typeof r.slot === "number" || r.slot === "Q") && INFINITIVE_PREPOSITION_VERBS.has(r.lemma))'
        else: "false"
      # "il laisse son fils acheté le pain", "je vois Marie mangé une pomme": a perception or
      # causative verb, its noun object, then a participle that takes an object of its own. A
      # participle that describes the noun takes none, so the word is the infinitive. "laisse" is
      # also a noun: the verb only after a pronoun or a name.
      objectBeforeInfinitive:
        args: "ctx: DetectContext, tokens: FrenchToken[], m: RegExpExecArray"
        let:
          noun: tokens[0]
          det: tokens[1]
          name: /^\p{Lu}\p{Ll}/u.test(ctx.text.slice(noun.start, noun.end))
          k: 'name ? 1 : VF_DETERMINERS.has(det?.w ?? "") ? 2 : -1'
          verb: tokens[k]
          subject: tokens[k + 1]
          named: "!!subject && /^\\p{Lu}\\p{Ll}/u.test(ctx.text.slice(subject.start, subject.end))"
          pair: tokensAfter(ctx.text, m.index + m[0].length, 2)
          next: pair[0]
          after: pair[1]
        when:
          - "!(k < 0 || !verb || (!name && !isInflectedNoun(noun.w) && !nounGender(noun.w)))"
          - verbReadings(verb.w).some((r) => OBJECT_INFINITIVE_GOVERNORS.has(r.lemma))
          - '!(isVerbHomograph(verb.w) && !named && !SUBJECT_PRONOUNS.has(subject?.w ?? ""))'
          - "!(!next || !after)"
        return: >-
          ["de", "d'"].includes(next.w)
            ? verbReadings(after.w).some((r) => r.slot === "I")
            : VF_DETERMINERS.has(next.w) && !TIME_NOUNS.has(after.w.replace(/s$/, ""))
        else: "false"
      # Its own subject: a pronoun, or an auxiliary for a participle ("j'ai pu", "s'être fait").
      # Pronouns before the governor or its auxiliary ("je l'ai laissé", "je te souhaite"). "le
      # prof va vous gronder": "peut", "doit", "va" are no nouns, any subject will do. "pour aller
      # chercher", "il veut aller chercher"; never the noun ("le devoir", "le savoir").
      verbGovernsSubject:
        args: "tokens: FrenchToken[], i: number, readings: VerbReading[], lemmas: string[], plain: boolean, attribute: boolean"
        let:
          governor: tokens[i]
          j: skipWhile(tokens, i + 1, (t) => VF_NEGATION.has(t.w) || CLITICS.has(t.w) || VF_ADVERBS.has(t.w))
          subject: vfSubjectAt(tokens, i + 1)
          head: "subject && SUBJECT_PRONOUNS.has(subject.w) ? subject : tokens[j]"
          auxiliary: "head && (avoirForm(head.w) || etreForm(head.w)) ? 1 : 0"
          chain: >-
            tokens.slice(i + 1, skipWhile(tokens, j + auxiliary, (t) => VF_NEGATION.has(t.w) || CLITICS.has(t.w))).filter((t) => t !== subject)
        return: >-
          attribute &&
          !plain &&
          (chain.some((t) => VF_OBJECTS.has(t.w)) ||
            (chain.some((t) => VF_REFLEXIVES.has(t.w)) && !lemmas.some((l) => REFLEXIVE_GOVERNORS.has(l))))
            ? false
            : readings.some((r) => typeof r.slot === "number") && head && (SUBJECT_PRONOUNS.has(head.w) || ["ça", "cela", "qui"].includes(head.w))
              ? true
              : readings.some((r) => typeof r.slot === "number" && VF_GOVERNING.has(r.lemma)) && !isVerbHomograph(governor.w)
                ? true
                : readings.some((r) => r.slot === "Q") &&
                    head &&
                    (avoirForm(head.w) || etreForm(head.w) || head.w === "être" || head.w === "avoir")
                  ? true
                  : readings.some((r) => r.slot === "I") &&
                      head &&
                      !isVerbHomograph(governor.w) &&
                      (VF_PREPOSITIONS.has(head.w) ||
                        readings.some((r) => typeof r.slot === "number") ||
                        verbReadings(head.w).some((r) => typeof r.slot === "number" && VF_GOVERNING.has(r.lemma)))
                    ? true
                    : governor.w === "faut"
      # Whether the verb at index `i` governs the infinitive after it, with its own subject. "en
      # fait", "tout à fait" (or "tout a fait"): no verb. "Veuillez trouver": the polite
      # imperative of vouloir governs an infinitive. "ils ont bien entendu gêné": "bien entendu"
      # (of course) is an adverb. "Laissez-vous guider", "fais-toi aider", "fais-leur visiter": an
      # imperative and its pronoun.
      verbGoverns:
        args: "tokens: FrenchToken[], i: number"
        let:
          governor: tokens[i]
          previous: tokens[i + 1]?.w
          adverb: 'previous === "en" || ((previous === "à" || previous === "a") && tokens[i + 2]?.w === "tout")'
          readings: verbReadings(governor.w)
          lemmas: "[...new Set(readings.map((r) => r.lemma))]"
          plain: lemmas.some((l) => VF_GOVERNING.has(l))
          attribute: lemmas.some((l) => GOVERNING_WITH_ATTRIBUTE.has(l))
        return: >-
          governor.w === "fait" && adverb
            ? false
            : governor.w === "veuillez"
              ? true
              : governor.w === "entendu" && previous === "bien"
                ? false
                : governor.hyphen &&
                    ["vous", "toi", "nous", "moi", "lui", "leur"].includes(tokens[i - 1]?.w ?? "") &&
                    lemmas.some((l) => REFLEXIVE_GOVERNORS.has(l))
                  ? true
                  : !plain && !attribute
                    ? false
                    : verbGovernsSubject(tokens, i, readings, lemmas, plain, attribute)
      # A participle that is also a noun or adjective entry ("sans passé", "carte d'abonné"), or a
      # noun in -ée missing its e ("lieu d'arrivé"), unless an object follows ("avant de passé la
      # commande"). "Jamais entendu parlé de lui": "entendre parler de" with its auxiliary left
      # out.
      governedInfinitive:
        args: "ctx: DetectContext, m: RegExpExecArray, word: string, lemma: string, tokens: FrenchToken[], i: number, governor: FrenchToken"
        type: RawFinding | null
        let:
          next: tokensAfter(ctx.text, m.index + m[0].length, 1)[0]
          object: next && VF_DETERMINERS.has(next.w)
        when: >-
          VF_PREPOSITIONS.has(governor.w)
            ? !(!object && !governedByVerb(tokens, i) && (isVerbHomograph(word) || isVerbHomograph(`${word}e`))) &&
              prepositionGoverns(tokens, i, ctx, m)
            : verbGoverns(tokens, i) ||
              (i === 0 && objectBeforeInfinitive(ctx, tokens, m)) ||
              (word === "parlé" && i === 0 && /^entendue?s?$/.test(governor.w))
        return: >-
          wordFinding(ctx, m.index, m[0], [lemma], "frenchVerbForms", "review_msg_fr_infinitive", {
            start: governor.start,
            end: m.index + m[0].length,
          })
      # "pour manger", "je veux changer", "il se fait aimer": an infinitive spelled as a
      # participle. "Fais-toi aidé", "laisse-moi passé": a stressed pronoun joined to an
      # imperative. "il a tout a gagné", "il est à supposer": after a quantifier object, "a" is the
      # preposition and the participle its infinitive; so is "à" after être ("il est a mangé" may
      # be "il a").
      infinitiveAfterGovernor:
        args: "ctx: DetectContext, m: RegExpExecArray"
        type: RawFinding | null
        let:
          word: m[0].toLowerCase()
          lemma: firstGroupLemma(word, "Q")
          tokens: tokensBefore(ctx.text, m.index)
          start: skipWhile(tokens, 0, (t) => CLITICS.has(t.w) || VF_ADVERBS.has(t.w) || VF_NEGATION.has(t.w))
          i: '["toi", "moi"].includes(tokens[start]?.w ?? "") && tokens[start + 1]?.hyphen ? start + 1 : start'
          governor: tokens[i]
          head: tokens[1]
          verb: tokens[2]
          quantity: '!!head && TO_DO_QUANTITIES.has(head.w) && !!verb && verbReadings(verb.w).some((r) => typeof r.slot === "number")'
          etre: 'governor.w === "à" && !!head && etreForm(head.w)'
        when:
          - "!(!lemma || MISSPELT_NOUNS.has(word))"
          - "!!governor"
        return: >-
          i === 0 &&
          (governor.w === "a" || governor.w === "à") &&
          !isVerbHomograph(word) &&
          head &&
          (etre || quantity) &&
          ctx.text[governor.start] !== "A"
            ? wordFinding(ctx, governor.start, ctx.text.slice(governor.start, m.index + m[0].length), [`à ${lemma}`],
                "frenchVerbForms", "review_msg_fr_infinitive", { start: head.start, end: m.index + m[0].length })
            : governedInfinitive(ctx, m, word, lemma, tokens, i, governor)
      # "pour vous parlez", "va vous grondez": "vous" there is the object of an infinitive. "vous
      # pouvez nous appelez": any object pronouns before the verb. "pour mieux vous débrouillez":
      # adverbs only between a preposition and "vous". "un dossier rédigé par vous": "par" governs
      # only right after a verb ("commencer par"). "Allez venez !": a sentence-initial governor
      # may be an imperative of its own.
      infinitiveAfterObjectVous:
        args: "ctx: DetectContext, m: RegExpExecArray"
        type: RawFinding | null
        let:
          lemma: firstGroupLemma(m[0].toLowerCase(), VOUS)
          tokens: tokensBefore(ctx.text, m.index)
          clitics: skipWords(tokens, 0, CLITICS)
          viaVous: clitics > 0
          afterAdverbs: "viaVous ? skipWords(tokens, clitics, VF_ADVERBS) : 0"
          i: '["de", "d''", "pour", "sans", "par"].includes(tokens[afterAdverbs]?.w ?? "") ? afterAdverbs : clitics'
          governor: tokens[i]
        when:
          - "!!lemma"
          - "!!governor"
          - >-
            ["de", "d'", "pour", "sans", "par"].includes(governor.w)
              ? !(tokens[i + 1] && NOT_GOVERNING_DE.has(tokens[i + 1].w)) &&
                !(governor.w === "par" && !verbReadings(tokens[i + 1]?.w ?? "").length)
              : verbGoverns(tokens, i) && !(!viaVous && !tokens[i + 1] && governor.w !== "veuillez")
        return: 'wordFinding(ctx, m.index, m[0], [lemma], "frenchVerbForms", "review_msg_fr_infinitive", { start: governor.start, end: m.index + m[0].length })'
      # "si vous continuer", "vous aimer aller au cinéma": a "vous" subject takes the -ez form.
      # The chain from "vous" to the verb: its first word is the subject. A sentence start, not a
      # list item or a comma-joined infinitive. "Vous dire cela ne changera rien": the infinitive
      # is a subject with its own verb.
      finiteAfterSubjectVous:
        args: "ctx: DetectContext, m: RegExpExecArray"
        type: RawFinding | null
        let:
          word: m[0].toLowerCase()
          infinitive: 'verbReadings(word).find((r) => r.slot === "I" && r.lemma === word)'
          tokens: tokensBefore(ctx.text, m.index)
          i: skipWhile(tokens, 0, (t) => VF_NEGATION.has(t.w) || CLITICS.has(t.w))
          vous: tokens.slice(0, i).at(-1)
          before: tokens[i]
          after: tokensAfter(ctx.text, m.index + m[0].length, 8)
          next: after[0]
          present: "conjugate({ ...infinitive, tense: 1 }, VOUS)"
        when:
          - "!(!infinitive || isVerbHomograph(word))"
          - vous?.w === "vous"
          - >-
            before
              ? VF_CLAUSE_OPENERS.has(before.w)
              : /(?:^|[.!?…]\s*|\n\s*)$/.test(ctx.text.slice(Math.max(0, vous.start - 4), vous.start)) &&
                !!next &&
                (CONTINUES_FINITE.has(next.w) || verbReadings(next.w).some((r) => r.slot === "I" && r.lemma === next.w))
          - '!after.some((t) => !isVerbHomograph(t.w) && verbReadings(t.w).some((r) => typeof r.slot === "number" && hasPerson(r.slot, IL + ILS)))'
          - present.length === 1
        return: 'wordFinding(ctx, m.index, m[0], present, "frenchVerbForms", "review_msg_fr_vous_verb", { start: vous.start, end: m.index + m[0].length })'
      vfAdjective:
        args: "t: FrenchToken"
        return: adjectiveReadings(t.w).length > 0 && !verbReadings(t.w).length && !nounGender(t.w)
      # "Ma moto fonctionner bien", "La foule se déplacer": a noun phrase opening the sentence,
      # then an -er infinitive with no other verb in the clause: the present or the imperfect. An
      # adjective between: "la vieille voiture tomber", "le train rapide arriver"; only a real
      # adjective, no verb form: "la législation semblant menacer" has its verb. "Au pinceau
      # ajouter": a preposition's contraction opens an instruction. "La voix étouffer de sanglots
      # coupa l'air": the clause's verb comes later. "Le verbe aimer est facile": any finite form
      # later, even one a noun spells.
      finiteForInfinitive:
        args: "ctx: DetectContext, m: RegExpExecArray"
        type: RawFinding | null
        let:
          word: m[0].toLowerCase()
          readings: verbReadings(word)
          tokens: tokensBefore(ctx.text, m.index, 8)
          k: skipWords(tokens, 0, VF_SUBJECT_CLITICS)
          first: tokens[k]
          second: tokens[k + 1]
          shift: "!!second && !(second.w in NOUN_DETERMINERS) && tokens[k + 2]?.w in NOUN_DETERMINERS"
          adjectiveFirst: shift && vfAdjective(first)
          noun: "shift && adjectiveFirst ? second : first"
          det: "shift ? tokens[k + 2] : second"
          known: nounGender(noun.w) ?? nounGender(noun.w.replace(/[sx]$/, ""))
          after: tokensAfter(ctx.text, m.index + m[0].length, 8)
          person: 'NOUN_DETERMINERS[det.w][1] === "p" ? ILS : IL'
          forms: "[1, 2].map((tense) => conjugate({ ...readings[0], tense }, person)[0])"
          found: wordFinding(ctx, m.index, m[0], forms, "frenchVerbForms", "review_msg_fr_subject_verb")
        when:
          - "!(m[0] !== word || isVerbHomograph(word))"
          - '!(word !== "aller" && firstGroupLemma(word, "I") !== word)'
          - '!readings.some((r) => r.slot !== "I")'
          - "!(shift && !adjectiveFirst && !PRENOMINAL.has(second.w))"
          - "!(!noun || !det || !(det.w in NOUN_DETERMINERS) || tokens[k + 3])"
          - '!["au", "aux", "du", "des"].includes(det.w)'
          - "!(tokens.slice(k).length > 3)"
          - SENTENCE_START.test(ctx.text.slice(Math.max(0, det.start - 4), det.start))
          - "!(!known && (!isInflectedNoun(noun.w) || adjectiveReadings(noun.w).length))"
          - "!(verbReadings(noun.w).length && !isVerbHomograph(noun.w))"
          - '!after.some((t) => verbReadings(t.w).some((r) => typeof r.slot === "number") || VF_NEGATION.has(t.w) || t.w === "n")'
          - "!forms.some((f) => !f)"
        return: "found && { ...found, context: { start: det.start, end: m.index + m[0].length } }"
      infinitiveGovernor:
        args: "t: FrenchToken"
        return: verbReadings(t.w).some((r) => VF_INFINITIVE_GOVERNORS.has(r.lemma))
      # "une écharpe nouer dans le dos", "la voix étouffer de sanglots": an infinitive right after
      # a noun is its participle, unless a verb before governs an infinitive ("j'entends la pluie
      # tomber", "il peut de cette manière trier") or the infinitive takes an object of its own.
      # "un jean noir coller à la peau", "un style diamétralement opposer": an adjective or a -ment
      # adverb between the noun and the word. "la fait passer": an object pronoun and a verb. "un
      # nouveau ficher": an adjective before its noun. "voit Jack, l'ami de son père entrer": the
      # governing verb may sit before an apposition. A pronoun subject right before the
      # determiner makes it an object pronoun. "concevoir des projets organiser les activités":
      # an infinitive with its own object ("au", "aux" open a complement: "collé aux jambes").
      # "Dans cette pièce fumer est interdit", "Avant l'exposition appliquer": an infinitive after
      # an opening phrase is a subject or an instruction. "Verser l'eau mélanger au bouillon": a
      # recipe's run of infinitive instructions. "Ma mère aimer le chocolat": a noun phrase
      # opening its clause is the subject of an infinitive written for its verb, unless the
      # clause's own verb comes later ("la voix étouffer de sanglots coupa l'air").
      participleAfterNoun:
        args: "ctx: DetectContext, m: RegExpExecArray"
        type: RawFinding | null
        let:
          word: m[0].toLowerCase()
          tokens: tokensBefore(ctx.text, m.index, 14)
          between: >-
            tokens[0] &&
            ((/..ment$/.test(tokens[0].w) && !isInflectedNoun(tokens[0].w)) ||
              (adjectiveReadings(tokens[0].w).length > 0 && !verbReadings(tokens[0].w).length)) &&
            tokens[2]?.w in NOUN_DETERMINERS
          before: "between ? tokens.slice(1) : tokens"
          noun: before[0]
          det: before[1]
          gender: nounGender(noun.w) ?? nounGender(noun.w.replace(/aux$/, "al").replace(/[sx]$/, ""))
          first: before.at(-1)!
          comma: /,[\s ]*$/u.test(ctx.text.slice(Math.max(0, first.start - 4), first.start))
          after: tokensAfter(ctx.text, m.index + m[0].length, 6)
          object: after[0] && after[0].w in NOUN_DETERMINERS && !/^aux?$/.test(after[0].w)
          clause: before.slice(2)
          verbBefore: 'clause.some((t) => verbReadings(t.w).some((r) => r.slot !== "I"))'
          detGender: NOUN_DETERMINERS[det.w][0]
          number: NOUN_DETERMINERS[det.w][1]
          genders: 'detGender || gender ? [detGender || gender!] : ["m", "f"]'
          found: >-
            wordFinding(ctx, m.index, m[0],
              genders.map((g) => `${word.slice(0, -2)}é${g === "f" ? "e" : ""}${number === "p" ? "s" : ""}`),
              "frenchVerbForms", "review_msg_fr_noun_participle")
        when:
          - '!(m[0] !== word || isVerbHomograph(word) || firstGroupLemma(word, "I") !== word)'
          - '!verbReadings(word).some((r) => r.slot !== "I")'
          - "!(!noun || !det || noun.hyphen || !(det.w in NOUN_DETERMINERS))"
          - "!(ctx.text.slice(noun.start, noun.end) !== noun.w || noun.w.length < 3)"
          - '!(verbReadings(noun.w).some((r) => r.slot !== "Q") && (VF_OBJECTS.has(det.w) || !isVerbHomograph(noun.w)))'
          - "!INFINITIVE_NOUNS.has(noun.w)"
          - "!(!gender && !isInflectedNoun(noun.w))"
          - "!((!gender && adjectiveReadings(noun.w).length) || PRENOMINAL.has(noun.w))"
          - "!before.slice(2).some((t) => infinitiveGovernor(t))"
          - '!(comma && tokensBefore(ctx.text, ctx.text.lastIndexOf(",", first.start), 8).some((t) => infinitiveGovernor(t)))'
          - "!(before[2] && (SUBJECT_PRONOUNS.has(before[2].w) || VF_NEGATION.has(before[2].w)))"
          - "!(object || (after[0] && VF_OBJECT_PRONOUNS.has(after[0].w)))"
          - "!(!verbBefore && clause.some((t) => PREPOSITIONS_BEFORE.has(t.w)))"
          - '!(!verbBefore && clause.some((t) => verbReadings(t.w).some((r) => r.slot === "I")))'
          - '!(!before[2] || VF_CLAUSE_OPENERS.has(before[2].w)) || after.some((t) => !isVerbHomograph(t.w) && verbReadings(t.w).some((r) => typeof r.slot === "number"))'
        return: "found ? { ...found, context: { start: det.start, end: m.index + m[0].length } } : null"
      isClauseVerb:
        args: "word: string"
        return: 'etreForm(word) || avoirForm(word) || (verbReadings(word).some((r) => typeof r.slot === "number") && !isInflectedNoun(word) && !isVerbHomograph(word))'
      # Right after an article the participle is a noun ("un blessé"); a misspelt noun ("un
      # trafique") is no participle.
      articleNoun:
        args: "det: FrenchToken, second: FrenchToken | undefined, lemma: string"
        let:
          article: VF_ARTICLES.has(det.w) || (!second && VF_DEFINITE.has(det.w))
        return: (article || (VF_DEFINITE.has(det.w) && ARTICLE_AFTER.has(second!.w))) && isNounLemma(`${lemma.slice(0, -2)}é`)
      # A noun phrase before the word when the clause already has its verb before or after it.
      # "je vois le chien mange": a verb of perception wants the infinitive; left alone. "a" may
      # be "à" or the Latin "a minima": not taken for avoir. A verb that is also a noun counts
      # after a subject pronoun: "il roule sur". "une magnifique emprunte": an adjective before a
      # misspelt noun, not a noun before its participle; the noun must show its gender.
      nounWithVerb:
        args: "ctx: DetectContext, m: RegExpExecArray, tokens: FrenchToken[]"
        let:
          noun: tokens[0]
          second: tokens[1]
          clause: tokens.slice(2)
          next: tokensAfter(ctx.text, m.index + m[0].length, 1)[0]
          verbAfter: '!clause.length && !!next && next.w !== "a" && isClauseVerb(next.w)'
          verbBefore: >-
            clause.some(
              (t, i) =>
                isClauseVerb(t.w) ||
                (verbReadings(t.w).some((r) => typeof r.slot === "number") && SUBJECT_PRONOUNS.has(clause[i + 1]?.w ?? "")))
        when:
          - "!(!second || !(second.w in NOUN_DETERMINERS))"
          - "!(ctx.text.slice(noun.start, noun.end) !== noun.w || noun.w.length < 3)"
          - "!(!isInflectedNoun(noun.w) || (verbReadings(noun.w).length && !isVerbHomograph(noun.w)))"
          - "!clause.some((t) => VF_SUBORDINATORS.has(t.w))"
          - "!clause.some((t) => infinitiveGovernor(t))"
          - verbAfter || verbBefore
          - '!(!nounGender(noun.w) && !nounGender(noun.w.replace(/[sx]$/, "")))'
        return: "true"
        else: "false"
    frames:
      # A word that may be a verb form: an infinitive, a participle or a "vous" form.
      - regex: "(?<![\\p{L}\\p{M}\\p{N}_-])\\p{L}+(?:er|é|ez|re|ir|oir)(?![\\p{L}\\p{M}\\p{N}_-])"
        flags: giu
        scan: owned
        lookback: 1
        let:
          lower: m[0].toLowerCase()
        when:
          - m.index >= ctx.from
          - "!capitalizedName(ctx.text, m.index, m[0])"
        return: >-
          lower.endsWith("é")
            ? infinitiveAfterGovernor(ctx, m)
            : lower.endsWith("ez")
              ? (participleAfterAuxiliary(ctx, m) ?? infinitiveAfterObjectVous(ctx, m))
              : lower.endsWith("er")
                ? (participleAfterAuxiliary(ctx, m) ??
                  finiteAfterSubjectVous(ctx, m) ??
                  participleAfterNoun(ctx, m) ??
                  finiteForInfinitive(ctx, m))
                : finiteAfterSubjectVous(ctx, m)
      # "il est partit", "elles étaient misent", "il a été dis": a finite form after être for its
      # participle, agreed with the subject the pronoun or the auxiliary shows. "est" is also the
      # East: only after a subject, or "été" after avoir. Only a form that sounds like the
      # participle is one misspelt ("partit", "dis", "misent"); "est atteignent", "a été
      # disparaîtra" are other slips.
      - regex: "(?<![\\p{L}\\p{M}\\p{N}_-])(?:suis|es|est|sommes|êtes|sont|étais|était|étions|étiez|étaient|serai|seras|sera|serons|serez|seront|serais|serait|serions|seriez|seraient|fus|fut|furent|été){{WORD_END}}"
        flags: giu
        scan: owned
        lookback: 1
        let:
          aux: m[0].toLowerCase()
          before: tokensBefore(ctx.text, m.index, 4)
          subject: vfSubjectAt(before, 0)
          after: tokensAfter(ctx.text, m.index + m[0].length, 4)
          word: after[skipWords(after, 0, VF_ADVERBS)]
          readings: verbReadings(word.w)
          participles: "[...new Set(readings.map((r) => pastParticiple(r.lemma)))]"
          participle: participles[0]
          plural: 'aux === "été" ? PLURAL_AVOIR.has(before[0].w) : PLURAL_ETRE.has(aux)'
          pronoun: 'subject?.w ?? ""'
          genders: 'VF_FEMININE_SUBJECTS.has(pronoun) ? [true] : VF_MASCULINE_SUBJECTS.has(pronoun) || aux === "été" ? [false] : [false, true]'
        when:
          - m.index >= ctx.from
          - '!(ctx.text[m.index + m[0].length] === "-" || ctx.text[m.index - 1] === "-")'
          - 'aux === "été" ? avoirForm(before[0]?.w ?? "") : !!subject && subject.w !== "y"'
          - "!(!word || word.hyphen || capitalizedName(ctx.text, word.start, word.w))"
          - "!(ctx.text.slice(word.start, word.end) !== word.w || isVerbHomograph(word.w))"
          - "!(adjectiveReadings(word.w).length || ctx.dictionary.has(word.w))"
          - '!(!readings.length || !readings.every((r) => typeof r.slot === "number"))'
          - "!(participles.length !== 1 || !participle || participle === word.w)"
          - word.w.startsWith(participle) || (/[std]$/.test(word.w) && participle.startsWith(word.w.slice(0, -1)))
        return: >-
          wordFinding(ctx, word.start, word.w,
            genders.map((feminine) =>
              plural && !(feminine ? `${participle}e` : participle).endsWith("s")
                ? `${feminine ? `${participle}e` : participle}s`
                : feminine
                  ? `${participle}e`
                  : participle),
            frame.ruleId, "review_msg_fr_past_participle", { start: m.index, end: word.end })
      # "j'ai comprit", "il a reçut", "on a mange": a finite form after avoir for its participle.
      # "a" and "as" are also a preposition and a noun: only after their subject or inverted.
      # "après avoir était publié", "il pense avoir comprit": an infinitive auxiliary; "ce qu'il
      # pensait avoir était perdu": after a relative, the verb after "avoir" is the main one. "il
      # y a", "il n'y en a": "y" makes "a" introduce a noun. "ils ont peut être raison":
      # "peut-être" missing its hyphen. "-er" present forms are the frame above's ("il a
      # manger"); this one takes the rest.
      - regex: "(?<![\\p{L}\\p{M}\\p{N}_-])(?:avoir|ai|as|a|avons|avez|ont|avais|avait|avions|aviez|avaient|aurai|auras|aura|aurons|aurez|auront|aurais|aurait|aurions|auriez|auraient)(?![\\p{L}\\p{M}\\p{N}_'’])"
        flags: giu
        scan: owned
        lookback: 1
        let:
          inverted: ctx.text[m.index + m[0].length] === "-"
          before: tokensBefore(ctx.text, m.index)
          subject: vfSubjectAt(before, 0)
          g: skipWhile(before, 0, (t) => VF_NEGATION.has(t.w) || CLITICS.has(t.w))
          governor: before[g]
          relative: 'before.slice(g, g + 4).some((t) => ["que", "qu''", "dont"].includes(t.w))'
          after: 'tokensAfter(ctx.text, m.index + m[0].length, 6).filter((t, i) => !(inverted && i < 2 && (SUBJECT_PRONOUNS.has(t.w) || t.w === "t")))'
          word: after[skipWords(after, 0, VF_ADVERBS)]
          readings: verbReadings(word.w)
          participles: "[...new Set(readings.map((r) => pastParticiple(r.lemma)))]"
        when:
          - m.index >= ctx.from
          - >-
            m[0].toLowerCase() === "avoir"
              ? !!governor &&
                (AVOIR_INFINITIVE_GOVERNORS.has(governor.w) ||
                  (!relative && !isVerbHomograph(governor.w) && verbReadings(governor.w).some((r) => typeof r.slot === "number")))
              : inverted || (!!subject && AVOIR_SUBJECT_WORDS.has(subject.w))
          - '!before.slice(0, 3).some((t) => t.w === "y")'
          - "!(!word || word.hyphen || capitalizedName(ctx.text, word.start, word.w))"
          - "!(ctx.text.slice(word.start, word.end) !== word.w || isVerbHomograph(word.w))"
          - '!(!readings.length || !readings.every((r) => typeof r.slot === "number"))'
          - '!(word.w === "peut" && tokensAfter(ctx.text, word.end, 1)[0]?.w === "être")'
          - "!(participles.length !== 1 || !participles[0] || participles[0] === word.w)"
        return: 'wordFinding(ctx, word.start, word.w, [participles[0]], frame.ruleId, "review_msg_fr_past_participle", { start: m.index, end: word.end })'
      # "un blesse", "les associes ne", "un terrain accidente", "le groupe reclasse arrive": a
      # first-group participle missing its accent, where a finite verb cannot stand: right after
      # an article, or after a noun phrase when the clause already has its verb before or after
      # it.
      - regex: "{{WORD_START}}\\p{Ll}{2,}es?{{WORD_END}}"
        flags: gu
        scan: owned
        lookback: 1
        let:
          word: m[0]
          readings: verbReadings(word)
          lemma: firstGroupLemma(word.replace(/es?$/, "é"), "Q")
          tokens: tokensBefore(ctx.text, m.index, 10)
          first: tokens[0]
          detFirst: first.w in NOUN_DETERMINERS
          det: "detFirst ? first : tokens[1]"
          noun: "detFirst ? undefined : first"
          number: NOUN_DETERMINERS[det.w][1]
          gender: NOUN_DETERMINERS[det.w][0] || (noun && nounGender(noun.w))
          found: >-
            wordFinding(ctx, m.index, word,
              (gender ? [gender] : ["m", "f"]).map((g) => `${lemma.slice(0, -2)}é${g === "f" ? "e" : ""}${number === "p" ? "s" : ""}`),
              frame.ruleId, "review_msg_fr_noun_participle")
        when:
          - m.index >= ctx.from
          - '!(!readings.length || !readings.every((r) => typeof r.slot === "number") || isInflectedNoun(word))'
          - "!(adjectiveReadings(word).length || NOT_PARTICIPLES.has(word))"
          - "!(!lemma || !readings.some((r) => r.lemma === lemma))"
          - "!(!first || first.hyphen)"
          - "detFirst ? articleNoun(first, tokens[1], lemma) : nounWithVerb(ctx, m, tokens)"
          - (number === "p") === word.endsWith("es")
        return: "found ? { ...found, context: { start: det.start, end: m.index + word.length } } : null"
  - id: fr.homophones
    checks: [frenchHomophones]
    style: match
    message: review_msg_fr_homophone
    # Small words that sound alike (a/à, ou/où, ce/se, sa/ça, sûr/sur, son/sont, du/dû, on/ont,
    # ma/m'a) told apart by the words around them. Fixed frames that need no context are phrase
    # rows; these frames read a subject, a verb form or a clause boundary.
    sets:
      HOMO_ADVERBS:
        [
          pas,
          plus,
          jamais,
          bien,
          déjà,
          encore,
          toujours,
          souvent,
          beaucoup,
          vraiment,
          aussi,
          même,
          enfin,
