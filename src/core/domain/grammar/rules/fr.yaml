          que,
          qu',
          quand,
          si,
          puis,
          alors,
          comme,
          lorsque,
          lorsqu',
          puisque,
          puisqu',
          où,
          ainsi,
        ]
      HOMO_DETERMINERS:
        [
          le,
          la,
          les,
          l',
          un,
          une,
          des,
          du,
          au,
          aux,
          ce,
          cet,
          cette,
          ces,
          mon,
          ma,
          mes,
          ton,
          ta,
          tes,
          son,
          sa,
          ses,
          notre,
          nos,
          votre,
          vos,
          leur,
          leurs,
