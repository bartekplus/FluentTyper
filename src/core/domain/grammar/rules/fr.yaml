      INDIRECT_OBJECTS: [lui, leur]
    defs:
      BARE_VOWEL: /^[aeiouyàâäéèêëîïôöûùüœæ]/
      # The readings of a word as a finite verb of the person.
      finiteOf:
        args: "word: string, person: number"
        return: verbReadings(word).filter((r) => hasPerson(r.slot, person))
      # The person of a pronoun subject that opens its clause at `before[i]`, or 0.
      subjectAt:
        args: "before: FrenchToken[], i: number"
        type: number
        let:
          subject: before[i]
          opener: before[i + 1]
        when: "!!subject && subject.w in BARE_PERSON"
        return: "!opener || SUBJECT_OPENERS.has(opener.w) ? BARE_PERSON[subject.w] : 0"
        else: "0"
      # The person of the subject when `before` is a pronoun subject, maybe "lui"/"leur", and a
      # finite verb that takes an object; or a pronoun, avoir and a participle. 0 otherwise.
      objectVerbPerson:
        args: "before: FrenchToken[]"
        type: number
        let:
          verb: before[0]
          # "j'ai baissé store": avoir and a participle.
          participle: verbReadings(verb.w).find((r) => r.slot === "Q")
          avoirPerson: >-
            participle && !NO_OBJECT.has(participle.lemma) && !isVerbHomograph(verb.w) &&
            subjectAt(before, 2) && before[1] &&
            finiteOf(before[1].w, subjectAt(before, 2)).some((r) => r.lemma === "avoir")
              ? subjectAt(before, 2)
              : 0
          person: 'subjectAt(before, INDIRECT_OBJECTS.has(before[1]?.w ?? "") ? 2 : 1)'
          readings: "person ? finiteOf(verb.w, person) : []"
        when: "!!verb && !verb.hyphen && verb.w.length >= 2"
        return: "avoirPerson || (person && readings.length && readings.every((r) => !NO_OBJECT.has(r.lemma)) ? person : 0)"
        else: "0"
      # "porte" -> ["une porte", "la porte", "sa porte"]; [] when the noun is not plainly a noun.
      determined:
        args: "word: string, person: number"
        let:
          plural: /[sx]$/.test(word) && !isNounLemma(word) && pluralSingulars(word).some(isNounLemma)
          possessive: BARE_POSSESSIVE[person]
          gender: "plural ? null : nounGender(word)"
          vowel: BARE_VOWEL.test(word)
        return: >-
          plural
            ? [`des ${word}`, `les ${word}`, `${possessive[2]} ${word}`]
            : !gender
              ? []
              : [
                  `${gender === "m" ? "un" : "une"} ${word}`,
                  vowel ? `l'${word}` : `${gender === "m" ? "le" : "la"} ${word}`,
                  `${gender === "f" && !vowel ? possessive[1] : possessive[0]} ${word}`,
                ]
      # A noun as far as the lists know, and nothing else: no adjective, adverb or verb form only.
      # "il prend parti", "elle a fini premier": a participle or a word in -é is no plain noun.
      plainNoun:
        args: "word: string"
        return: >-
          word.length >= 3 && !BARE_WORDS.has(word) && !word.endsWith("ment") && !word.startsWith("h") &&
          !adjectiveReadings(word).length &&
          !(verbReadings(word).length && !isVerbHomograph(word)) &&
          !verbReadings(word).some((r) => r.slot === "Q" || r.slot === "I") &&
          isInflectedNoun(word)
    frames:
      # A lowercase word that closes its clause.
      - regex: "{{WORD_START}}\\p{Ll}[\\p{Ll}\\p{M}]{2,}(?=[ \\t\\u00A0]*(?:[.!?…;,]|$))"
        flags: gu
        scan: owned
        lookback: 1
        let:
          word: m[0]
          end: m.index + word.length
          before: tokensBefore(ctx.text, m.index, 5)
          person: objectVerbPerson(before)
          alternatives: determined(word, person)
          subject: before.find((t) => t.w in BARE_PERSON)!
        when:
          - m.index >= ctx.from
          # The scan text may cut the clause short: read its end in the full text.
          - '/^[ \t ]*(?:[.!?…;,]|$)/u.test(ctx.text.slice(end, end + 20))'
          - "!ctx.dictionary.has(word) && plainNoun(word)"
          - "!!person && !namedExampleBefore(ctx.text, m.index)"
          - alternatives.length > 0
        return: "finding(frame.ruleId, frame.messageKey, m.index, end, alternatives, { context: { start: subject.start, end }, requiresChoice: true })"
  - id: fr.repeatedWords
    checks: [frenchRepeatedWords]
    style: match
    message: review_msg_repeated_words
    # Spoken French doubles some words for emphasis, so the check is off by default.
    sets:
      # The default-on repeated-word check already reads these (reviewDetectors.ts REPEATABLE_WORDS).
      REPEAT_DEFAULT_ON:
        [
          le,
          les,
          une,
          des,
          du,
          au,
          aux,
          dans,
          pour,
          avec,
          sur,
          et,
          mais,
          est,
          sont,
          par,
          ce,
          cette,
          ces,
          sans,
          je,
          tu,
          il,
          ils,
          on,
          à,
          mon,
          ma,
          mes,
          ton,
          ta,
          tes,
          son,
          sa,
          ses,
        ]
      # Words that French doubles with no error: interjections and sounds ("ah ah", "là là"), a
      # stressed pronoun before its clitic ("lui lui a dit"), "en en mangeant", "si si", "non non".
      DOUBLED_OK:
        [
          ah,
          ha,
          hé,
          eh,
          oh,
          ho,
          hi,
          hein,
          là,
          si,
          non,
          oui,
          bon,
          bla,
          toc,
          pan,
          chut,
          hop,
          ouh,
          ouf,
          bye,
          da,
          tic,
          tac,
          cha,
          tam,
          lui,
          en,
          nous,
          vous,
          elle,
          elles,
        ]
      PERSONAL_SUBJECTS: [je, j', tu, il, elle, on, ils, elles]
    defs:
      # "nous nous", "vous vous": a reflexive verb, unless another subject comes before them or
      # "ne" comes after them ("je vous vous écris", "que nous nous ne mentions pas").
      extraPronoun:
        args: "ctx: DetectContext, start: number, end: number"
        let:
          before: tokensBefore(ctx.text, start, 1)[0]
          after: tokensAfter(ctx.text, end, 1)[0]
        return: '(before !== undefined && PERSONAL_SUBJECTS.has(before.w)) || ["ne", "n''"].includes(after?.w ?? "")'
    frames:
      # One word or two words, then the same text again ("très très", "de moins de moins"),
      # also after an elision ("qu'on dit on dit").
      - regex: "(?<![\\p{L}\\p{M}\\p{N}_-])(?<unit>{{REPEAT_WORD}}(?:[ \\t]{1,4}{{REPEAT_WORD}})?)[ \\t\\u00A0]{1,4}\\k<unit>{{WORD_END}}"
        flags: giu
        scan: owned
        lookback: 1
        let:
          lower: 'unit.toLowerCase().replaceAll("’", "''")'
          words: lower.split(/[ \t]+/)
          end: m.index + m[0].length
          # "p p": spelled-out letters; "Coco Coco": a capital on the second copy starts a name.
          second: ctx.text.slice(end - unit.length, end)
        when:
          - m.index >= ctx.from
          - "!(words.some((w) => w.length < 2) || second !== second.toLowerCase())"
          - "!(words.length === 1 && REPEAT_DEFAULT_ON.has(lower))"
          - '!words.some((w) => DOUBLED_OK.has(w)) || (words.length === 1 && (lower === "nous" || lower === "vous") && extraPronoun(ctx, m.index, end))'
          - "!namedExampleBefore(ctx.text, m.index)"
        return: "finding(frame.ruleId, frame.messageKey, m.index, end, [unit], { context: { start: m.index, end } })"

