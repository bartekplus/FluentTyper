        args: "word: string"
        return: /^[aeiouyâàéèêîïôûœh]/.test(word)
      # "nos cette langue", "des sa naissance", "du notre site": keep one, or the preposition.
      # "le leur", "aux leurs": a possessive pronoun; "le son", "un ton": the nouns; "un des": one
      # of; "la une": the front page. "du notre site" is a double determiner; "la notre soit",
      # "celle du votre." keep "nôtre". "le leurs", "des leur": a possessive pronoun that does
      # not take the article's number. "le la du diapason": the note. "Est-ce la bonne", "ce la"
      # (cela): "ce" before another determiner is seldom an article. "les La Fontaine", "le CE":
      # a name or an acronym after the article. "dépose le au courrier": an object pronoun after
      # an imperative; "c'est le mon livre": être takes no object pronoun.
      doubleDeterminer:
        args: "ctx: DetectContext, m: RegExpExecArray, first: string, second: string"
        type: RawFinding | null
        let:
          end: m.index + m[0].length
          next: tokensAfter(ctx.text, end, 1)[0]
          nounNext: >-
            Boolean(
              next &&
              next.start <= end + 8 &&
              isInflectedNoun(next.w) &&
              !verbReadings(next.w).some((r) => typeof r.slot === "number"),
            )
          mismatched: '(second === "leurs" && DETERMINER_INFO[first][1] === "s") || (second === "leur" && ["les", "aux", "des"].includes(first))'
          typedFirst: m.groups!.first
          typedSecond: m.groups!.second
          previous: tokensBefore(ctx.text, m.index, 1)[0]
          space: 'second.endsWith("''") ? "" : " "'
          alternatives: >-
            [
              ...(first === "sa" ? [`${carryCase(typedFirst, "ça")}${space}${typedSecond}`] : []),
              ...(first === "au" || first === "aux" ? [`${carryCase(typedFirst, "à")} ${typedSecond}`] : []),
              ...(first === "du" ? [`${carryCase(typedFirst, "de")} ${typedSecond}`] : []),
              ...(first === "des" && second === "leur"
                ? [`${carryCase(typedFirst, "dès")} ${typedSecond}`, `${typedFirst} leurs`]
                : mismatched && second === "leurs"
                  ? [`${carryCase(typedFirst, "les")} leurs`]
                  : first === "des"
                    ? [`${carryCase(typedFirst, "dès")} ${typedSecond}`, `${carryCase(typedFirst, "de")} ${typedSecond}`]
                    : []),
              typedFirst,
              typedSecond,
            ]
        when:
          - '!(first === second || first === "leur" || first === "leurs")'
          - '!(KEPT_SECOND.has(second) && !mismatched && !(nounNext && (second === "notre" || second === "votre")))'
          - '!((first === "un" || first === "une") && second === "des")'
          - '!(second === "la" && first !== "la" && DETERMINER_INFO[first][0] !== "f")'
          - '!(first === "ce" || first === "cet")'
          - ctx.text[m.index - 1] !== "-"
          - '!/\p{Lu}/u.test(typedSecond)'
