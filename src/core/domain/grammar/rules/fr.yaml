          qui,
          ça,
          cela,
          ceci,
          tout,
          tous,
          toutes,
          chaque,
          chacun,
          plusieurs,
        ]
      # Bare nouns avoir takes in a locution: "a faim", "a lieu", "a accès", "a carte blanche".
      AVOIR_BARE_NOUNS:
        [
          faim,
          soif,
          peur,
          froid,
          chaud,
          sommeil,
          raison,
          tort,
          besoin,
          envie,
          honte,
          mal,
          lieu,
          cours,
          droit,
          horreur,
          confiance,
          hâte,
          beau,
          affaire,
          recours,
          trait,
          part,
          coutume,
          tendance,
          congé,
          charge,
          qualité,
          vocation,
          obligation,
          interdiction,
          ordre,
          accès,
          priorité,
          pitié,
          conscience,
          connaissance,
          intérêt,
          foi,
          soin,
          marre,
          cœur,
          coeur,
          idée,
          avantage,
          mission,
          autorité,
          carte,
          peine,
