      # -ment or the bare stem; "demandaient": an imperfect ending spells no noun in -ement. "un
      # trafique", "au travaille", "des appelles": a verb form in -e(s) for the noun without it.
      # After "et le", "le" is the pronoun ("il le prend et le travaille"). "aux mures": with no
      # gender in the determiner, "mûres" is as likely as "murs".
      finiteNoun:
        args: "ctx: DetectContext, m: RegExpExecArray, det: string, word: string, gender: string | null, number: string | null, nounFinding: AlternativesFix"
        type: RawFinding | null
        let:
          ment: '/aient$/.test(word) ? word : word.replace(/ent$/, "ement")'
          direct: '[ment, word.replace(/t$/, "")].find((noun) => noun !== word && nounGender(noun) && (!gender || nounGender(noun) === gender))'
          previous: tokensBefore(ctx.text, m.index, 1)[0]
          stem: 'nounStem(number === "p" ? word.replace(/s$/, "") : word)'
        return: >-
          direct
            ? nounFinding([direct])
            : !ONLY_DETERMINERS.has(det) && previous && !PREPOSITIONS.has(previous.w)
              ? null
              : !stem || gender === "f"
                ? null
                : !gender && isInflectedNoun(word.replace(/u(?=[^u]*$)/, "û"))
