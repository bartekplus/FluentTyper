# el grammar rules. See docs/agents/grammar-rules.md for the format.
lang: el

rules:
  - id: el.finalNu
    checks: [greekFinalNu]
    predicate: finalNu
  - id: el.strictFinalNu
    checks: [greekStrictFinalNu]
    predicate: strictFinalNu
  - id: el.perfectForm
    checks: [englishPhraseCorrections]
    predicate: perfectForm
  - id: el.questionAccent
    checks: [greekQuestionAccent]
    predicate: questionAccent
  - id: el.formalKai
    checks: [stylePhrasing]
    predicate: formalKai
  - id: el.punctuation
    checks: [greekPunctuation]
    predicate: punctuation

