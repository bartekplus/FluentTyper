  - id: pl.wordFormsFrames
    checks: [englishPhraseCorrections]
    style: polish
    message: review_msg_pl_abbreviation_dot
    frames:
      # Travel verbs only: "należał do Węgier" (belonged to Hungary) is right.
      - regex: "(?<=(?:jecha\\p{L}*|jadę|jedzie\\p{L}*|jadą|lecie\\p{L}*|leci\\p{L}*|lecę|wyjecha\\p{L}*|wyjeżdża\\p{L}*|wyjedzie\\p{L}*|przyjecha\\p{L}*|pojecha\\p{L}*|pojedzie\\p{L}*|polecia\\p{L}*|poleci\\p{L}*|wylecia\\p{L}*|wybra\\p{L}*{{S}}się|wybiera\\p{L}*{{S}}się|podróż\\p{L}*|wycieczk\\p{L}*|wyjazd\\p{L}*|emigrowa\\p{L}*|wyemigrowa\\p{L}*|uciek\\p{L}*|uciec|wróci\\p{L}*|wraca\\p{L}*){{S}})(?<target>do{{S}}(?<place>węgier|białorusi|syberii|moraw|antarktydy|kubę|kuby|malty|islandii|sycylii|sardynii|korsyki|krymu|kaszub|mazur|podhala|śląska|wołoszczyzny|filipin|madagaskaru|hawaje|hawajów)){{NOT_LETTER}}"
        message: review_msg_contextual_grammar
        fixer: formsDo
      # "Ważnym jest, aby": the predicative adjective before a clause is neuter "-e".
      - regex: "(?=\\p{L})(?<!(?:^|[^\\p{L}])(?:w|we|z|ze|na|do|od|ode|po|za|przy|przed|przede|nad|nade|pod|pode|dla|bez|u|ku|przez|przeze|między|o|wśród|spod|znad|zza|sprzed|tym|każdym|jednym|nim|kim|czym){{S}})(?<target>(?<stem>\\p{L}{3,}?)(?<end>ym|im))(?=(?:{{S}}(?:również|także|też|zawsze|zatem|więc))?{{S}}(?:jest|było|byłoby|będzie)(?:{{S}}to)?[ \\t\\u00a0]*,?[ \\t\\u00a0]*(?:że|aby|żeby|by|iż|gdy|jeśli){{NOT_LETTER}})"
        message: review_msg_contextual_grammar
        fixer: formsStem
      - regex: "(?=\\p{L})(?<=(?:jest|było|byłoby|będzie){{S}})(?<target>(?<stem>\\p{L}{3,}?)(?<end>ym|im))(?=[ \\t\\u00a0]*,[ \\t\\u00a0]*(?:aby|żeby|by|że|iż){{NOT_LETTER}})"
        message: review_msg_contextual_grammar
        fixer: formsStem2
      # Abbreviations that keep the word's last letter take no dot: "nr 2", "3 mln złotych".
      - regex: "(?<!(?:^|[^\\p{L}])(?:w|we|z|ze|na|do|od|ode|po|za|przy|przed|przede|nad|nade|pod|pode|dla|bez|u|ku|przez|przeze|między|o|wśród|spod|znad|zza|sprzed){{S}})(?<target>(?<abbr>nr|mln|mld|ha|kg|km|cm|mm)\\.)(?=[ \\t\\u00a0]+(?:\\p{L}|\\d))"
        verbatim: true
        fixer: formsAbbr
      # "3 m. tkaniny", "200 g. mąki": a unit after a number takes no dot inside the sentence.
      - regex: "(?<=\\p{N}{{S}})(?<target>(?<abbr>m|g|mg|ml|dag)\\.)(?=[ \\t\\u00a0]+\\p{L})"
        verbatim: true
        fixer: formsAbbr2
      # "Dr. Kowalski", "mgr. Anna Nowak", "Dr. hab. Nowak" -> no dot before a name in the
      # nominative (the dot marks "doktora", "magistra").
      - regex: "(?<target>(?<abbr>dr|mgr|dyr)\\.)(?={{S}}(?:hab\\.{{S}})?(?:\\p{L}{2,}{{S}})?\\p{L}+(?:ski|cki|dzki|ska|cka|dzka){{NOT_LETTER}})"
        verbatim: true
        fixer: formsAbbr3
      # "dr", "mgr" keep the last letter of "doktor" only: a man's name in an oblique case takes
      # "dr." ("dzięki dr. Kowalskiemu"); a woman's title does not inflect ("z dr Kowalską").
      - regex: "(?<target>dr|mgr|dyr)(?={{S}}(?:\\p{L}{2,}{{S}})?\\p{L}+(?:skiego|ckiego|dzkiego|skiemu|ckiemu|dzkiemu|skim|ckim|dzkim|owi){{NOT_LETTER}})"
        verbatim: true
        fixer: formsDr
      # "ok dwustu psów", "ok 5 km" -> "ok.": "około" shortened takes its dot before a count.
      - regex: "(?<![\\p{L}])(?<target>ok)(?={{S}}(?:\\d|dw|trz|czter|pięć|pięci|sześ|siedem|siedmi|osiem|ośmi|dziewię|dziesię|kilk|pół|stu|sto|tysi))"
        verbatim: true
        fix: "ok."
      # Truncations take one:"np.", "tzw.", "itd.", "m.in.", "p.n.e.", "proc.", "ok." before a number.
      - regex: "(?<target>np|tzw|itd|itp|m\\.in|p\\.n\\.e|n\\.e|proc|godz)(?![\\p{L}\\p{N}.])(?=[ \\t\\u00a0,;:)?!]|$)"
        verbatim: true
        fixer: formsNp
      - regex: "(?<target>ok)(?=[ \\t\\u00a0]+\\d)"
        lowercase: true
        fix: "ok."
