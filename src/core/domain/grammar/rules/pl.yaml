      # "Szkoła imieniem Marii Konopnickiej" -> "imienia".
      - regex: "(?<=(?:^|[^\\p{L}])(?:[Ss]zkoł\\p{L}*|[Ll]iceum|[Gg]imnazjum|[Tt]echnikum|[Zz]espół|[Uu]niwersytet|[Aa]kademi\\p{L}*|[Ii]nstytut|[Ss]zpital|[Pp]rzedszkol\\p{L}*)(?:{{S}}\\p{L}+){0,2}{{S}})(?<target>imieniem)(?={{S}}\\p{L})"
        fix: "imienia"
      # "for internetowych", "głupich for": the plural genitive of "forum" is "forów".
      - regex: "(?<=(?:^|[^\\p{L}])\\p{L}+(?:ych|ich){{S}})(?<target>for){{NOT_LETTER}}|(?<target>for)(?={{S}}(?:internetowych|dyskusyjnych){{NOT_LETTER}})"
        fix: "forów"
      # "z łam gazety", "łam czasopism": the columns are "łamy", genitive "łamów".
      - regex: "(?<=(?:^|[^\\p{L}])(?:z|ze|na|do){{S}})(?<target>łam)(?={{S}}|[ \\t\\u00a0]*[„\"])|(?<target>łam)(?={{S}}(?:gazet|gazety|czasopism|czasopisma|prasy|tygodnika|dziennika){{NOT_LETTER}})"
        fix: "łamów"
      # "Ja się tego właśnie boje", "się, proszę pana, nie boje" -> "boję", "boją".
      - regex: "(?<=(?:^|[^\\p{L}])się(?:{{S}}(?:tego|tej|ich|go|jej|was|nas|ciebie|ich|właśnie|nie|bardzo|trochę|już|wcale|naprawdę|zawsze|też|proszę|pana|pani|państwa)|,)+{{S}})(?<target>boje|boja)(?=[ \\t\\u00a0]*[.!?…])"
