# pl grammar rules. See docs/agents/grammar-rules.md for the format.
lang: pl

rules:
  - id: pl.compounds
    checks: [englishClosedCompounds, englishAlotCorrection]
    predicate: compounds
  - id: pl.confusions
    checks: [englishPhraseCorrections]
    predicate: confusions
  - id: pl.numerals
    checks: [polishNumerals]
    predicate: numerals
  - id: pl.dates
    checks: [polishDates]
    predicate: dates
  - id: pl.misplacedCommas
    checks: [polishMisplacedComma]
    predicate: misplacedCommas
  - id: pl.missingCommas
    checks: [polishMissingComma]
    predicate: missingCommas
  - id: pl.prepositionForms
    checks: [polishPrepositionForms]
    predicate: prepositionForms
  - id: pl.wordForms
    checks: [englishPhraseCorrections]
    predicate: wordForms
  - id: pl.caseAgreement
    checks: [polishCaseAgreement]
    predicate: caseAgreement
  - id: pl.quotes
    checks: [polishQuotes]
    predicate: quotes
  - id: pl.typography
    checks: [polishTypography]
    predicate: typography
  - id: pl.rangeDashes
    checks: [emdashShortcut]
    predicate: rangeDashes
  - id: pl.comparedWithJak
    checks: [englishPhraseCorrections]
    predicate: comparedWithJak
  - id: pl.degrees
    checks: [englishDoubledDegree, stylePhrasing]
    predicate: degrees
  - id: pl.commaFrames
    checks: [polishMissingComma, polishMisplacedComma]
    predicate: commaFrames
  - id: pl.capitals
    checks: [polishCapitalization]
    predicate: capitals
  - id: pl.conjunctions
    checks: [polishCaseAgreement]
    predicate: conjunctions
  - id: pl.clauses
    checks: [polishMissingComma]
    predicate: clauses
  - id: pl.style
    checks: [stylePhrasing]
    predicate: style
  - id: pl.officialese
    checks: [stylePhrasing]
    predicate: officialese
  - id: pl.subjects
    checks: [polishCaseAgreement]
    predicate: subjects
  - id: pl.typos
    checks: [englishPhraseCorrections]
    predicate: typos
  - id: pl.fragments
    checks: [englishSentenceFragment]
    predicate: fragments
  - id: pl.questions
    checks: [germanQuestionMarks]
    predicate: questions

