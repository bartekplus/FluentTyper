        przestrzał: na
        bakier: na
        opak: na
        łapu-capu: na
        niemiara: co
        polsku: po
        angielsku: po
        niemiecku: po
        francusku: po
        rosyjsku: po
        hiszpańsku: po
        włosku: po
        czesku: po
        słowacku: po
        ukraińsku: po
        chińsku: po
        japońsku: po
        szwedzku: po
        grecku: po
        arabsku: po
        portugalsku: po
        holendersku: po
        węgiersku: po
        fińsku: po
        duńsku: po
        norwesku: po
        chamsku: po
        swojsku: po
        góralsku: po
