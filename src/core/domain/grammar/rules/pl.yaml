      - regex: "(?<![\\p{L}])(?:godzina|minuta|sekunda|chwila|doba)(?=[ \\t\\u00A0]{1,8}temu(?![\\p{L}])(?![ \\t\\u00A0]+\\p{L}+(?:owi|u|emu)(?![\\p{L}])))"
        scan: polish
        flags: giu
        return: 'agreementSmallFrame(ctx, m, m[0].slice(0, -1) + "ę")'
      # "półtorej roku" -> "półtora roku", "półtora godziny" -> "półtorej godziny": the noun's
      # gender picks the form.
      - regex: "(?<![\\p{L}\\p{N}_'’@/-])(?<num>półtora|półtorej){{S}}(?<noun>\\p{L}{3,}){{WORD}}"
        scan: polish
        flags: gdiu
        let:
          tags: plNounTags(noun)
          gender: tagsAnd(tags, AGREEMENT_GENDERS)
          wanted: 'gender === PL_FEMININE ? "półtorej" : tagsAnd(gender, PL_FEMININE) || !gender ? "" : "półtora"'
        when:
          - '!(!plOnlyNoun(tags) || !tagsAnd(tags, plCases("Gs")) || plUserOrNamed(ctx, noun))'
          - "!(!wanted || wanted === num.toLowerCase())"
        return: >-
          ({ ...plFindingAt(ctx, m.index, m.index + num.length, [plCaseLike(num, wanted)], "polishCaseAgreement",
          "review_msg_pl_numeral_noun"), context: { start: m.index, end: m.index + m[0].length } })
      # "dwadzieścia trzej mężczyźni": men's "dwaj", "trzej", "czterej" stand alone, not after tens.
      - regex: "(?<![\\p{L}\\p{N}_'’@/-])(?:dwadzieścia|trzydzieści|czterdzieści|pięćdziesiąt|sześćdziesiąt|siedemdziesiąt|osiemdziesiąt|dziewięćdziesiąt){{S}}(?:dwaj|trzej|czterej){{S}}(?<noun>\\p{L}{3,}){{WORD}}"
        scan: polish
        flags: gdiu
        let:
          tags: plNounTags(noun)
          forms: plInflect(noun, plCases("Gp"), plCases("Np"))
          words: 'm[0].toLowerCase().split(/[ \t ]+/u)'
        when: "!(!plOnlyNoun(tags) || !tagsAnd(tags, PL_VIRILE) || plUserOrNamed(ctx, noun))"
        return: >-
          plFindingAt(ctx, m.index, m.index + m[0].length, forms.length === 1
          ? [plCaseLike(m[0], AGREEMENT_TENS[words[0]] + " " + AGREEMENT_MEN_UNITS[words[1]] + " " + forms[0])] : [],
          "polishCaseAgreement", "review_msg_pl_numeral_noun")
      # "Uczestnikami są wyłącznie uczniów": a genitive plural where the subject goes after "są".
      - regex: "(?<![\\p{L}\\p{N}_'’@/-])(?<verb>są|będą){{S}}(?:(?:wyłącznie|głównie|tylko|także|również|zwykle|najczęściej|zawsze|często){{S}})?(?<noun>\\p{Ll}{3,}){{WORD}}"
        scan: polish
        flags: gdu
        let:
          tags: plNounTags(noun)
          # The clause opens with an instrumental noun, the predicate: "Klientami są", "Dla firmy autorami
          # będą".
          clause: '(ctx.text.slice(Math.max(0, m.index - 60), m.index).split(/[.!?;:,—–()]/u).at(-1) ?? "").match(/\p{L}+/gu) ?? []'
          allForms: plInflect(noun, plCases("Np"), plCases("Gp"))
          # "uczniów": the men's plural "uczniowie", not the plural of things "ucznie".
          men: allForms.filter((form) => plMenOnlyPlural(form))
          forms: "allForms.length > 1 && men.length ? men : allForms"
        when:
          # A genitive plural with no nominative reading ("uczniów", "organizacji").
          - plOnlyNoun(tags) && tagsAnd(tags, plCases("Gp")) !== 0 && !tagsAnd(tags, plCases("Ns Np"))
          - "!plUserOrNamed(ctx, noun)"
          - "clause.slice(-3).some((word) => [plNounTags(word.toLowerCase())].some((own) => plOnlyNoun(own) && !tagsAnd(own, tagsWithout(PL_ALL_CASES, AGREEMENT_INSTRUMENTALS))))"
          - forms.length > 0 && forms.length <= 2
        return: >-
          plFindingAt(ctx, m.indices!.groups!.noun[0], m.indices!.groups!.noun[1], forms.map((form) => plCaseLike(noun, form)),
          "polishCaseAgreement", "review_msg_pl_agreement")
      # "tymi człowiekiem", "moimi siostrą". "między innymi handlem": "innymi" is left out,
      # it is part of "między innymi".
      - regex: "(?<![\\p{L}\\p{N}_'’@/-])(?<pronoun>tymi|Tymi|tamtymi|Tamtymi|takimi|Takimi|jakimi|Jakimi|jakimiś|Jakimiś|moimi|Moimi|twoimi|Twoimi|swoimi|Swoimi|naszymi|Naszymi|waszymi|Waszymi|owymi|Owymi|żadnymi|Żadnymi){{S}}(?<noun>\\p{Ll}{3,}){{WORD}}"
        scan: polish
        flags: gu
        let:
          # The noun is only a singular instrumental, of one gender.
          tags: plNounTags(noun)
          feminine: tagsAnd(tags, PL_FEMININE) !== 0
        when:
          - '!(!plOnlyNoun(tags) || tagsAnd(tags, tagsWithout(PL_ALL_CASES, plCases("Is"))) || plUserOrNamed(ctx, noun))'
          - feminine !== (tagsAnd(tags, tagsOr(PL_MASCULINE, PL_NEUTER)) !== 0)
        return: >-
          ({ ...plFindingAt(ctx, m.index, m.index + pronoun.length,
          [plCaseLike(pronoun, AGREEMENT_PLURAL_PRONOUNS[pronoun.toLowerCase()][feminine ? 1 : 0])], "polishCaseAgreement",
          "review_msg_pl_agreement"), context: { start: m.index, end: m.index + m[0].length } })
  # Polish typesetting: „…” quotes (opt-in), one dash style per inserted phrase, spaces around
  # "=" and "×", no space before "%", the decimal comma before a unit, symbols typed as letters
  # ("(C)"), spacing inside abbreviations, and a space after ";" or ")".
  - id: pl.quotes
    checks: [polishQuotes]
    style: match
    message: review_msg_pl_typography
    defs:
      # A quote pair: the opening mark (unless `fixOpen` is false) and the closing mark get the
      # Polish ones. `marks` is the length of each typed mark.
      quotePair:
        args: "m: RegExpExecArray, ctx: DetectContext, open: string, close: string, fixOpen: boolean, marks: number"
        let:
          end: m.index + m[0].length
          closeFinding: plFindingAt(ctx, end - marks, end, [close], "polishQuotes", "review_msg_pl_typography")
        return: >-
          fixOpen ? [plFindingAt(ctx, m.index, m.index + marks, [open], "polishQuotes",
          "review_msg_pl_typography"), closeFinding] : [closeFinding]
    frames:
      # A straight or English quote pair around a phrase on one line: „phrase”.
      - regex: "(?<![\\p{L}\\p{N}\"])\"(?=[\\p{L}\\p{N}])([^\"\\n]{1,200}?)(?<=[\\p{L}\\p{N}.!?\\u2026])\"(?![\\p{L}\\p{N}])"
        scan: polish
        flags: gu
        return: 'quotePair(m, ctx, "„", "”", true, 1)'
      - regex: "\\u201C(?=[\\p{L}\\p{N}])([^\\u201C\\u201D\"\\n]{1,200}?)(?<=[\\p{L}\\p{N}.!?\\u2026])\\u201D"
        scan: polish
        flags: gu
        return: 'quotePair(m, ctx, "„", "”", true, 1)'
      # „phrase“: the German closing quote after a Polish opening one.
      - regex: "\\u201E(?=[\\p{L}\\p{N}])([^\\u201E\\u201C\\u201D\"\\n]{1,200}?)(?<=[\\p{L}\\p{N}.!?\\u2026])\\u201C"
        scan: polish
        flags: gu
        return: 'quotePair(m, ctx, "„", "”", false, 1)'
      - regex: "\\u201A(?=[\\p{L}\\p{N}])([^\\u201A\\u2018\\u2019\\n]{1,200}?)(?<=[\\p{L}\\p{N}.!?\\u2026])\\u2019"
        scan: polish
        flags: gu
        return: 'quotePair(m, ctx, "„", "”", true, 1)'
      - regex: "(?<!<)>>(?=[\\p{L}\\p{N}])([^<>\\n]{1,200}?)(?<=[\\p{L}\\p{N}.!?\\u2026])<<(?!<)"
        scan: polish
        flags: gu
        return: 'quotePair(m, ctx, "»", "«", true, 2)'
  - id: pl.typography
    checks: [polishTypography]
    style: match
    message: review_msg_pl_typography
    defs:
      # A fix of the whole match; none when `fixed` is null or the typed text.
      typographySwap:
        args: "m: RegExpExecArray, ctx: DetectContext, fixed: string | null"
        when: fixed !== null && fixed !== m[0]
        return: plFindingAt(ctx, m.index, m.index + m[0].length, [fixed], "polishTypography", "review_msg_pl_typography")
    frames:
      # "— powiedział –": an inserted phrase opened with one dash and closed with the other.
      - regex: "(?<={{SP}})(?<open>[—–]){{SP}}(?<inner>[^—–.!?\\n]{1,80}?){{SP}}(?<close>[—–])(?={{SP}})"
        scan: polish
        flags: gu
        let:
          spaced: m[0].slice(1, -1)
        when: open !== close
        return: >-
          plFindingAt(ctx, m.index, m.index + m[0].length, [open + spaced + open, close + spaced + close],
          "polishTypography", "review_msg_pl_typography")
      # "19=20", "19 =20" -> "19 = 20" between numbers.
      - regex: "(?<=\\p{N})[ \\t]*=[ \\t]*(?=\\p{N})"
        scan: polish
        flags: gu
        return: 'typographySwap(m, ctx, m[0] === " = " ? null : " = ")'
      # "800x600", "800 x 600" -> "800 × 600" (not hex "0x1F"). A spaced capital X is a Roman month
      # ("12 X 1945").
      - regex: "(?<![\\p{L}\\p{N}.,])(?!0x)(\\p{N}{1,5})(?:[ \\t]?x[ \\t]?|X)(\\p{N}{1,5})(?![\\p{L}\\p{N}])"
        scan: polish
        flags: gu
        return: "typographySwap(m, ctx, `${m[1]} × ${m[2]}`)"
      # "10 %" -> "10%": Polish sets the percent sign close to the number.
      - regex: "(?<=\\p{N})[ \\u00a0]%"
        scan: polish
        flags: gu
        return: 'typographySwap(m, ctx, "%")'
      # "312.12 zł", "0.5%" -> the decimal comma before a unit or currency.
      - regex: "(?<![\\p{L}\\p{N}.,])(\\p{N}{1,6})\\.(\\p{N}{1,2})(?=[ \\u00a0]?(?:z\\u0142|z\\u0142otych|gr|%|proc\\.|kg|km|cm|mm|ml)(?![\\p{L}]))"
        scan: polish
        flags: gu
        return: "typographySwap(m, ctx, `${m[1]},${m[2]}`)"
      # "(C) 2012", "Linux(R)", "Choice(TM)" -> the symbol ("Hagan (R)" may name a party).
      - regex: "\\(C\\)(?=[ \\u00a0]+(?:\\p{N}|\\p{Lu}))"
        scan: polish
        flags: gu
        return: 'typographySwap(m, ctx, "©")'
      - regex: "(?<=\\p{L})\\(R\\)"
        scan: polish
        flags: gu
        return: 'typographySwap(m, ctx, "®")'
      - regex: "(?<=\\p{L}[ \\u00a0]?)\\(TM\\)"
        scan: polish
        flags: gu
        return: 'typographySwap(m, ctx, "™")'
      # "00–950 Warszawa": a postal code takes a hyphen.
      - regex: "(?<![\\p{N}\\u2013\\u2014-])\\p{N}{2}[\\u2013\\u2014]\\p{N}{3}(?=[ \\u00a0]+\\p{Lu}\\p{Ll})"
        scan: polish
        flags: gu
        return: 'typographySwap(m, ctx, m[0].replace(/[–—]/, "-"))'
      # "11.XI.1918", "11-XI-1918" -> "11 XI 1918".
      - regex: "(?<![\\p{L}\\p{N}.])(\\p{N}{1,2})[.-]([IVX]{1,4})[.-](\\p{N}{4})(?![\\p{N}])"
        scan: polish
        flags: gu
        return: "typographySwap(m, ctx, `${m[1]} ${m[2]} ${m[3]}`)"
      # "od 12 – 17 lutego" -> "od 12 do 17".
      - regex: "(?<![\\p{L}])([Oo]d[ \\u00a0]+\\p{N}+(?:,\\p{N}+)?)[ \\u00a0]*[\\u2013\\u2014-][ \\u00a0]*(\\p{N}+)(?![\\p{N}])"
        scan: polish
        flags: gu
        return: "typographySwap(m, ctx, `${m[1]} do ${m[2]}`)"
      # "błąd;wiem", "(od dawna)odpowiednim" -> a space after ";" and a closing bracket.
      - regex: "(?<=\\p{Ll}{2})[;](?=\\p{Ll}{2})"
        scan: polish
        flags: gu
        return: 'typographySwap(m, ctx, "; ")'
      - regex: "(?<=\\([^()\\n]{2,80}\\p{Ll})\\)(?=\\p{Ll}{3})"
        scan: polish
        flags: gu
        return: 'typographySwap(m, ctx, ") ")'
      # "zdanie ;" -> "zdanie;".
      - regex: "(?<=\\p{L})[ \\t]+;(?=[ \\t])"
        scan: polish
        flags: gu
        return: 'typographySwap(m, ctx, ";")'
      # "Zrobił to.„Naprawdę" -> a space between the sentence and the quote.
      - regex: "(?<=\\p{L}[.!?])\\u201E(?=\\p{L})"
        scan: polish
        flags: gu
        return: 'typographySwap(m, ctx, " „")'
      # "problem…." -> one ellipsis.
      - regex: "\\u2026\\.(?!\\.)"
        scan: polish
        flags: gu
        return: 'typographySwap(m, ctx, "…")'
      # "30g cukru", "w 2000r." -> a space between a number and "g" or the year's "r.".
      - regex: "(?<![\\p{L}\\p{N}.,])(\\p{N}{1,4})g(?=[ \\u00a0]+\\p{Ll}{3,})"
        scan: polish
        flags: gu
        return: "typographySwap(m, ctx, `${m[1]} g`)"
      - regex: "(?<![\\p{L}\\p{N}.,])(\\p{N}{3,4})r\\.(?![\\p{L}])"
        scan: polish
        flags: gu
        return: "typographySwap(m, ctx, `${m[1]} r.`)"
      # "o 1, 9 proc." -> "1,9": no space after a decimal comma before a percentage.
      - regex: "(?<![\\p{N}][ \\u00a0]?,[ \\u00a0]?|[\\p{N}.,])(\\p{N}{1,3}), (\\p{N}{1,2})(?=[ \\u00a0]?(?:%|proc\\.|procent))"
        scan: polish
        flags: gu
        return: "typographySwap(m, ctx, `${m[1]},${m[2]}`)"
      # "pierwszo–, drugo- i trzeciorzędowy": a hanging prefix in a list takes a hyphen, not a dash.
      - regex: "(?<=(?<![\\p{L}])\\p{Ll}{2,}[ouy])[\\u2013\\u2014](?=,)"
        scan: polish
        flags: gu
        return: 'typographySwap(m, ctx, "-")'
      # "Ad. 1" -> "Ad 1": the Latin "ad" is a word, not an abbreviation.
      - regex: "(?<![\\p{L}.])([Aa]d)\\.(?=[ \\u00a0]+\\(?\\p{N})"
        scan: polish
        flags: gu
        return: typographySwap(m, ctx, m[1])
      # "dom– jak", "dom –jak" -> "dom – jak": a dash between words has a space on both sides
      # ("jedno– i dwukonne" is a hanging prefix before a conjunction).
      - regex: "(?<=\\p{L}{2})[\\u2013\\u2014](?=[ \\u00a0](?!(?:i|oraz|lub|albo|czy|a)[ \\u00a0])\\p{L})"
        scan: polish
        flags: gu
        return: "typographySwap(m, ctx, ` ${m[0]}`)"
      - regex: "(?<=\\p{L}[ \\u00a0])[\\u2013\\u2014](?=\\p{L}{2})"
        scan: polish
        flags: gu
        return: "typographySwap(m, ctx, `${m[0]} `)"
      # "przykład.," -> "przykład,": a full word takes no dot before a comma.
      - regex: "(?<=(?<![\\p{L}.])\\p{Ll}{5,})\\.(?=,)"
        scan: polish
        flags: gu
        return: 'typographySwap(m, ctx, "")'
      # Abbreviations written with a space inside, or without the space between their parts.
      - regex: "(?<![\\p{L}])m\\.{{SP}}+in\\."
        scan: polish
        flags: gu
        return: 'typographySwap(m, ctx, plCaseLike(m[0], "m.in."))'
      - regex: "(?<![\\p{L}])z{{SP}}+o\\.{{SP}}+o\\."
        scan: polish
        flags: gu
        return: 'typographySwap(m, ctx, plCaseLike(m[0], "z o.o."))'
      - regex: "(?<![\\p{L}])p\\.{{SP}}*n\\.{{SP}}+e\\.?(?![\\p{L}])"
        scan: polish
        flags: gu
        return: 'typographySwap(m, ctx, plCaseLike(m[0], "p.n.e."))'
      - regex: "(?<![\\p{L}])p\\.{{SP}}+n\\.{{SP}}*e\\.?(?![\\p{L}])"
        scan: polish
        flags: gu
        return: 'typographySwap(m, ctx, plCaseLike(m[0], "p.n.e."))'
      - regex: "(?<![\\p{L}.]{{SP}}?)n\\.{{SP}}+e\\.?(?![\\p{L}])"
        scan: polish
        flags: gu
        return: 'typographySwap(m, ctx, plCaseLike(m[0], "n.e."))'
      - regex: "(?<![\\p{L}])dz\\.cyt\\."
        scan: polish
        flags: gu
        return: 'typographySwap(m, ctx, plCaseLike(m[0], "dz. cyt."))'
      - regex: "(?<![\\p{L}])op\\.cit\\."
        scan: polish
        flags: gu
        return: 'typographySwap(m, ctx, plCaseLike(m[0], "op. cit."))'
      # A wrong letter or a lost dot: "m.im." and "M.in" are "m.in.", "d.s" is "ds.", "44 p.n.e?"
      # needs its dot before the question mark.
      - regex: "(?<![\\p{L}])m\\.im\\.?(?![\\p{L}])"
        scan: polish
        flags: giu
        return: 'typographySwap(m, ctx, plCaseLike(m[0], "m.in."))'
      - regex: "(?<![\\p{L}])m\\.in(?![\\p{L}.])"
        scan: polish
        flags: giu
        return: 'typographySwap(m, ctx, plCaseLike(m[0], "m.in."))'
      - regex: "(?<![\\p{L}.])d\\.s\\.?(?![\\p{L}.])"
        scan: polish
        flags: gu
        return: 'typographySwap(m, ctx, plCaseLike(m[0], "ds."))'
      - regex: "(?<![\\p{L}])p\\.n\\.e(?![\\p{L}.])"
        scan: polish
        flags: gu
        return: 'typographySwap(m, ctx, plCaseLike(m[0], "p.n.e."))'
  - id: pl.rangeDashes
    checks: [emdashShortcut]
    style: match
    message: review_msg_range_dash
    defs:
      # A number, not a range: "nr 12-15", "tel. 500-600", "NIP 123-45".
      RANGE_ID_BEFORE: '/(?<![\p{L}])(?:nr|tel|fax|faks|nip|pesel|regon|krs|isbn|issn|sygn|kod|kodu|kodem)\.?[  ]*$/iu'
      # A score: "wygrali 1-2", "mecz zakończył się 2-3", "2-3 dla gości".
      RANGE_SCORE_BEFORE: '/(?<![\p{L}])(?:wynik|wygra|przegra|remis|mecz|pokona|zwycięż|zakończ|prowadz|set|bramk|gol|punkt|spotkani|starci)\p{L}*(?:[  ]+\p{L}+){0,4}[  ]+$/iu'
      RANGE_SCORE_AFTER: '/^[  ]+(?:dla|po)(?![\p{L}])/u'
    frames:
      # "pages 10-15", "1990-1995": two numbers of up to four digits joined by a hyphen. A dash,
      # a colon, a slash or a digit group after the second number makes a date, a phone number
      # or a code ("12-05-2020", "2024-05-01"); a decimal or a time ("8.00-9.00") stays.
      - regex: "{{RANGE_DASH}}"
        scan: owned
        lookback: 8
        flags: gu
        let:
          a: m[1]
          dash: m[2]
          b: m[3]
          before: ctx.text.slice(Math.max(0, m.index - 48), m.index)
          after: ctx.text.slice(m.index + m[0].length, m.index + m[0].length + 12)
        when:
          - "!(m.index < ctx.from || namedExampleBefore(ctx.text, m.index))"
          # A leading zero or a 3-4 pair is a phone number or an ID: "0034-600", "12-05", "915-5512".
          - '!(a[0] === "0" || b[0] === "0" || (a.length === 3 && b.length === 4))'
          # "31-123 Kraków": a postal code.
          - "!(a.length === 2 && b.length === 3)"
          # A range runs up: "1990-95" and the season "2014-15" end in 1995 and 2015; "3-1" does not.
          - "(a.length === 4 && b.length === 2 ? Number(a.slice(0, 2) + b) : Number(b)) > Number(a)"
          - "!(RANGE_ID_BEFORE.test(before) || RANGE_SCORE_BEFORE.test(before) || RANGE_SCORE_AFTER.test(after))"
        return: >-
          ({ ruleId: "emdashShortcut", messageKey: "review_msg_range_dash",
          range: { start: m.index + a.length, end: m.index + a.length + dash.length }, alternatives: ["–"],
          context: { start: m.index, end: m.index + m[0].length } })
  - id: pl.comparedWithJak
    checks: [englishPhraseCorrections]
    style: match
    message: review_msg_contextual_grammar
    frames:
      # "większy jak stary", "lepiej jak w domu" -> "niż": a comparison after a comparative.
      - regex: "(?<![\\p{L}])(?<word>\\p{L}{4,}){{S}}(?<target>jak){{S}}(?<next>\\p{L}+)(?![\\p{L}])"
        scan: polish
        flags: gdiu
        let:
          lower: word.toLowerCase()
          after: next.toLowerCase()
        when:
          - '!(lower.startsWith("naj") || !alreadyGraded(lower) || plUserOrNamed(ctx, word))'
          # "później, jak wróci": "jak" after a time adverb opens a clause of time.
          - '!(lower === "później" || lower === "wcześniej")'
          # "nic więcej jak", "niczym więcej jak" (nothing but) is a set phrase.
          - '!/(?:^|[^\p{L}])(?:nic|niczym|niczego)[ \t ]+$/iu.test(ctx.text.slice(Math.max(0, m.index - 12), m.index))'
          - "!(DEGREE_CLAUSE_AFTER.test(after) || plFiniteVerb(after))"
        return: >-
          ({ ...plFindingAt(ctx, m.indices!.groups!.target[0], m.indices!.groups!.target[1],
          [plCaseLike(target, "niż")], "englishPhraseCorrections", "review_msg_contextual_grammar"),
          context: { start: m.index, end: m.index + m[0].length } })
  - id: pl.degrees
    checks: [englishDoubledDegree, stylePhrasing]
    style: match
    message: review_msg_doubled_degree
    sets:
      # Comparative adverbs not spelled from their adjective.
      DEGREE_IRREGULAR_ADVERBS:
        [
          lepiej,
          gorzej,
          więcej,
          mniej,
          bliżej,
          dalej,
          wyżej,
          niżej,
          szybciej,
          później,
          wcześniej,
          dłużej,
          krócej,
        ]
    defs:
      # Irregular comparatives the stem rules do not reach.
      DEGREE_IRREGULAR: >-
        ({ dobry: "lepszy", zły: "gorszy", duży: "większy", mały: "mniejszy", wysoki: "wyższy",
        niski: "niższy", bliski: "bliższy", daleki: "dalszy", szeroki: "szerszy", głęboki: "głębszy",
        lekki: "lżejszy", ciężki: "cięższy", długi: "dłuższy" }) as Record<string, string>
      # Comparative adverbs; adverbs in -o whose comparative changes the stem ("brzydko" -> "brzydziej").
      DEGREE_ADVERBS: >-
        ({ dobrze: "lepiej", źle: "gorzej", szybko: "szybciej", brzydko: "brzydziej", krótko: "krócej",
        słodko: "słodziej", nisko: "niżej", blisko: "bliżej", wysoko: "wyżej", ciężko: "ciężej",
        lekko: "lżej", rzadko: "rzadziej", głęboko: "głębiej", daleko: "dalej", długo: "dłużej",
        często: "częściej", cicho: "ciszej", głośno: "głośniej", mocno: "mocniej", łatwo: "łatwiej",
        trudno: "trudniej", tanio: "taniej", drogo: "drożej", wesoło: "weselej" }) as Record<string, string>
      # Adjectives that name an extreme and take no degree.
      DEGREE_UNGRADED: /^(?:optymaln|maksymaln|minimaln)(?:y|a|e|ego|ej|emu|ą|ym|ych|ymi|ie)$/u
      # The synthetic comparative of a positive adjective, when the lexicon lists one.
      comparativeOf:
        args: "lemma: string"
        when: '!lemma.endsWith("szy")'
        return: >-
          [DEGREE_IRREGULAR[lemma], lemma.replace(/ny$/, "niejszy"), lemma.replace(/ni$/, "ńszy"),
          lemma.replace(/(?:o|e)?k[iy]$/, "szy"), lemma.replace(/[iy]$/, "szy")]
          .find((c) => c && c !== lemma && plHasAdjective(c)) ?? null
      # "ważniejszy", "najważniejszy", "dokładniej", "najbliżej": already a degree.
      alreadyGraded:
        args: "word: string"
        let:
          bare: 'word.startsWith("naj") ? word.slice(3) : word'
        return: >-
          DEGREE_IRREGULAR_ADVERBS.has(bare) || (/ej$/.test(bare) && plHasAdjective(bare + "szy")) ||
          [plAdjectiveOf(bare)].some((adj) => !!adj && /szy$/.test(adj.lemma) && adj.lemma !== "pierwszy")
      # "bardziej ważny" -> "ważniejszy" (stylePhrasing). "coraz bardziej popularna" and "mniej i
      # bardziej poważnych" keep the analytic form.
      degreeStyle:
        args: "ctx: DetectContext, m: RegExpExecArray, marker: string, word: string, lower: string, end: number"
        let:
          longer: ctx.text.slice(Math.max(0, m.index - 24), m.index)
          fixed: 'degreeFix(word, lower === "najbardziej" ? "naj" : "")'
        when:
          - '!/(?:^|[^\p{L}])(?:coraz|(?:naj)?mniej[ \t ]+(?:i|lub|albo|czy))[ \t ]+$/iu.test(longer)'
          - fixed !== null
        return: plFindingAt(ctx, m.index, end, [plCaseLike(marker, fixed)], "stylePhrasing", "review_msg_style_phrasing")
      degreeFix:
        args: "word: string, naj: string"
        let:
          adverbFix: >-
            DEGREE_ADVERBS[word] ? naj + DEGREE_ADVERBS[word]
            : word.endsWith("nie") ? degreeAdverbFix(word, naj) : null
        return: adverbFix || degreeAdjectiveFix(word, naj)
      # "dokładnie" -> "dokładniej", from the comparative "dokładniejszy".
      degreeAdverbFix:
        args: "word: string, naj: string"
        let:
          comparative: 'plHasAdjective(word.slice(0, -2) + "y") ? comparativeOf(word.slice(0, -2) + "y") : null'
        return: 'comparative?.endsWith("iejszy") ? naj + comparative.slice(0, -3) : null'
      degreeAdjectiveFix:
        args: "word: string, naj: string"
        let:
          adj: plAdjectiveOf(word)
          comparative: adj && comparativeOf(adj.lemma)
        return: "adj && comparative ? naj + plAdjectiveForm(comparative, adj.ending) : null"
      # Words after "jak" that make it "if" or "as" ("lepiej jak przyjdziesz", "jak najszybciej").
      DEGREE_CLAUSE_AFTER: /^(?:naj\p{L}*|i|ja|ty|on|ona|ono|my|wy|oni|one|się|to|tylko|zwykle|zawsze|wiadomo|wspomniałem|mówiłem|sądzę|myślę|widać|każdy|ktoś|coś|nikt|nic|gdyby|by|już)$/u
    frames:
      # "bardziej lepszy", "coraz najbardziej": a degree marked twice (englishDoubledDegree); opt-in,
      # "bardziej ważny" -> "ważniejszy" (stylePhrasing). The frame runs when either check is on.
      - regex: "(?<![\\p{L}])(?<marker>(?:naj)?bardziej|coraz[ \\t\\u00A0]+naj(?:bardziej|mniej))[ \\t\\u00A0]+(?<word>\\p{L}{3,})(?![\\p{L}])"
        scan: polish
        flags: giu
        anyCheck: true
        let:
          before: ctx.text.slice(Math.max(0, m.index - 8), m.index)
          lower: marker.toLowerCase()
          start: m.index
          end: start + m[0].length
        when:
          - "!plUserOrNamed(ctx, word)"
          # "tym bardziej lepiej" is "all the more"; "im bardziej" sets up a comparison.
          - '!/(?:^|[^\p{L}])(?:tym|im)[ \t ]+$/iu.test(before)'
        # "coraz najbardziej popularna" -> "coraz bardziej", "coraz najmniej" -> "coraz mniej".
        return: >-
          lower.startsWith("coraz")
          ? plFindingAt(ctx, start, start + marker.length, [marker.replace(/naj(?=bardziej|mniej)/iu, "")],
          "englishDoubledDegree", "review_msg_doubled_degree")
          : ctx.rules?.has("englishDoubledDegree") !== false && (alreadyGraded(word) || DEGREE_UNGRADED.test(word))
          ? (/^(?:lepsz|gorsz|lepiej|gorzej|lepsi|gorsi)/u.test(word) && lower === "bardziej" ? null
          : plFindingAt(ctx, start, end, [plCaseLike(marker, word)], "englishDoubledDegree",
          "review_msg_doubled_degree"))
          : ctx.rules && !ctx.rules.has("stylePhrasing") ? null
          : degreeStyle(ctx, m, marker, word, lower, end)
  - id: pl.commaFrames
    checks: [polishMissingComma, polishMisplacedComma]
    style: comma
    defs:
      # Opening phrases that are asides and may keep their comma ("Na szczęście,", "Po pierwsze,").
      COMMA_ASIDE_PHRASE: "/^(?:po (?:pierwsze|drugie|trzecie|czwarte|piąte|ostatnie|prostu|kolei|czym|co)|z (?:jednej|drugiej|innej|mojej|twojej|naszej) strony|w (?:końcu|ogóle|sumie|skrócie|zasadzie|rezultacie|efekcie|praktyce|rzeczywistości|istocie|gruncie rzeczy|każdym razie|przeciwnym razie|takim razie|tym razie|tym przypadku|tym wypadku|związku z tym|dodatku|zamian|zamian za to|ten sposób|szczególności|przeciwieństwie|porównaniu|skrócie|razie czego|razie potrzeby|razie wątpliwości|międzyczasie|tym czasie)|na (?:szczęście|nieszczęście|koniec|początek|przykład|razie|pewno|marginesie|wstępie|zakończenie|dodatek|ogół|odwrót|wszelki wypadek|domiar złego|przyszłość|tym etapie|wszelki)|przede wszystkim|mimo (?:to|wszystko)|pomimo to|bez (?:wątpienia|względu|dwóch zdań)|dla (?:przykładu|porządku|jasności|ścisłości)|ponad (?:to|wszystko)|poza tym|z (?:tego|tej) (?:powodu|przyczyny)|od (?:razu|tego czasu|teraz|dziś|jutra)|do (?:tego|rzeczy)|przy (?:tym|okazji)|za (?:to|chwilę|moment)|o (?:dziwo|ile))$/u"
      # Words that open a clause or an aside after the comma ("Po chwili, gdy…", "W domu, który…").
      COMMA_OPENS_CLAUSE: '/^(?:gdy|kiedy|jak|jeśli|jeżeli|że|iż|żeby|aby|by|bo|gdzie|dokąd|skąd|co|kto|czy|choć|chociaż|zanim|odkąd|dopóki|póki|skoro|ponieważ|gdyż|zwłaszcza|szczególnie|czyli|oraz|i|a|ale|lecz|albo|lub|bądź|ani|natomiast|jednak|więc|zatem|tj|np|tzn|około|mniej|więcej|między|jako|niż|tak|to|któr\p{L}*|jak\p{L}*|czyj\p{L}*)$/u'
    message: review_msg_pl_missing_comma
    frames:
      # "Nie wiem co robić" -> "Nie wiem, co robić" (not "jak najszybciej", "co nieco").
      - regex: "(?<![\\p{L}])(?<target>(?:wiem|wiesz|wie|wiemy|wiecie|wiedzą|wiedział\\p{L}*|wiedzieć|wiadomo|sprawdź|sprawdźmy|sprawdzić|sprawdzam|sprawdza|sprawdzę|sprawdził\\p{L}*|spytać|spytam|spytaj|spytał\\p{L}*|zapytać|zapytam|zapytaj|zapytał\\p{L}*|pytam|pyta|pytał\\p{L}*|zobacz|zobaczmy|zobaczyć|zobaczę|zobaczymy|zastanawiam{{S}}się|zastanawia{{S}}się|zastanawiał\\p{L}*{{S}}się|wahał\\p{L}*{{S}}się|waham{{S}}się|ustalić|zdecydować|pamiętam|pamiętasz|rozumiem|wyobraź{{S}}sobie|powiedz|pokaż|wyobrazić{{S}}sobie|wyobrażam{{S}}sobie|wyobraża{{S}}sobie|stwierdzić|ocenić|przewidzieć|określić|zrozumieć|wyjaśnić|wytłumaczyć|opisać|powiedzieć|pokazać))(?={{S}}(?:{{QUESTION_WORD}}){{S}}\\p{L})(?!{{S}}(?:jak{{S}}naj|co{{S}}nieco|co{{S}}do{{END}}|jak{{S}}i{{END}}))(?!(?<=nie{{S}}wiadomo){{S}}(?:kiedy|skąd|jak){{S}}(?:się{{S}})?(?:zrobił|minął|minęł|upłynął|upłynęł|zleciał|przeleciał|przemknął|przemknęł|wyrósł|wyrosł|pojawił|zjawił|znalazł|zniknął|zniknęł|nastał|nadszedł|nadeszł|zapadł|przeminął|przeminęł|ściemnił|wyskoczył|wyrwał)\\p{L}*{{END}})"
        flags: dgiu
        return: target + ","
      # "ktoś kto", "coś czego", "wszystko co" -> "ktoś, kto"; not a question ("Ten co?").
      - regex: "(?<![\\p{L}])(?<target>{{PRONOUN_HEAD}})(?={{S}}(?:{{PRONOUN_RELATIVE}}){{S}}[^.!?\\n]*[.!…]?)(?!{{S}}(?:{{PRONOUN_RELATIVE}}){{S}}[^.!?\\n]*\\?)(?!{{S}}co{{S}}(?:do|nieco|niemiara|najmniej|najwyżej|prawda|innego|chwila|dzień|roku|rusz|raz){{END}})(?!{{S}}\\p{L}+{{S}}\\p{L}+ć{{END}})"
        flags: dgiu
        return: target + ","
      # "zależy od tego czy", "pytanie co", "kwestia gdzie" -> "tego, czy": an indirect question
      # after a pronoun or a noun asking it; not "to czy tamto", "tego czy owego", "kiedy indziej".
      - regex: "(?<![\\p{L}])(?<target>tego|(?<=(?:na|o|przez|za|w|pod|nad|przed){{S}})to|tym|temu|pytanie|pytania|pytaniu|kwestia|kwestii|kwestię)(?={{S}}(?:czy|gdzie|kiedy|dlaczego|skąd|dokąd|ile|co){{S}}\\p{L})(?!{{S}}\\p{L}+{{S}}(?:tamto|tamtego|tamtym|owo|owego|owym|inne|innego|innym|nie|indziej){{END}})(?!{{S}}co{{S}}(?:do|nieco|niemiara|najmniej|najwyżej|prawda|innego|chwila|rusz|raz){{END}})"
        flags: dgiu
        return: target + ","
      # "zarówno Lecha jak i Jarosława" -> "Lecha, jak i": the pair's second half is set off.
      - regex: "(?<=(?<![\\p{L}])zarówno(?:{{S}}[^,.!?;:\\s]+){1,4})(?<target>{{S}}jak)(?={{S}}(?:i|też|również|także){{END}})"
        flags: dgiu
        return: '", " + target.trim()'
      # "Tam gdzie nie ma dróg" -> "Tam, gdzie".
      - regex: "{{CLAUSE_START}}(?<target>Tam|Tu|Tutaj)(?={{S}}(?:gdzie|dokąd|skąd){{END}})"
        return: target + ","
      # "Im większa tym lepiej" -> "Im większa, tym lepiej" (not "o tym" inside the first clause).
      - regex: "{{CLAUSE_START}}Im{{S}}(?:[^,.!?;\\n ]+{{S}}){0,4}?(?!(?:o|w|we|po|przy|na|nad|pod|przed|za|z|ze){{S}}tym)[^,.!?;\\n ]+(?<target>{{S}}tym){{END}}"
        return: '", " + target.trim()'
      # "Tak jak wczoraj tak i dziś" -> "Tak jak wczoraj, tak i dziś".
      - regex: "{{CLAUSE_START}}Tak{{S}}jak{{S}}(?:[^,.!?;\\n ]+{{S}}){0,4}?[^,.!?;\\n ]+(?<target>{{S}}tak)(?={{S}}(?:i|też|samo){{END}})"
        return: '", " + target.trim()'
      # "Była to tak czy inaczej porażka" -> "Była to, tak czy inaczej, porażka": the aside is set off
      # inside the sentence too (not "czy tak czy owak", the repeated question).
      - regex: "(?<=(?<![\\p{L}])(?!czy{{END}})\\p{Ll}+)(?<target>{{S}}tak{{S}}czy{{S}}(?:inaczej|siak|owak){{S}})(?=\\p{L})"
        message: review_msg_pl_comma_aside
        return: '", " + target.trim().replace(/\s+/gu, " ") + ", "'
      # "nie jest twoja tylko moja" -> "twoja, tylko moja": "tylko" contrasting with a denial.
      - regex: "(?<![\\p{L}])nie{{S}}(?:(?:jest|są|był|była|było|były|byli|jako|dla|do|na|w|z|o){{S}})?(?<target>\\p{L}+)(?={{S}}tylko{{S}}\\p{L})"
        flags: dgiu
        # "nie mam tylko czasu", "nie tylko": "tylko" means "only" after a verb.
        when: "!(plFiniteVerb(target) || /^(?:tylko|ma|mam|mamy|chodzi|wiem|ten|to|ta|się)$/u.test(target))"
        return: target + ","
      # "kawę a nie herbatę" -> "kawę, a nie herbatę"; "ciekawy a to dzięki" -> "ciekawy, a to dzięki".
      - regex: "(?<![\\p{L}])(?<target>\\p{Ll}{2,})(?={{S}}a{{S}}(?:nie{{S}}\\p{L}|to{{S}}(?:z{{S}}powodu|dzięki|dlatego|ze{{S}}względu|przez|z{{S}}uwagi){{END}}))"
        let:
          sentence: 'ctx.text.slice(Math.max(0, m.index - 60), m.index).split(/[.!?;:,\n]/u).at(-1)!'
        when:
          # "taki a nie inny" is one phrase.
          - "!/^(?:czy|i|a|albo|lub|ani|oraz|nie|że|to|tak(?:i|a|ie|iego|iej|iemu|ą|im|ich|imi))$/u.test(target)"
          # "między domem a nie szkołą" keeps "między X a Y" whole.
          - '!/(?:^|[^\p{L}])(?:po)?między(?![\p{L}])/iu.test(sentence)'
        return: target + ","
      # "Po zakończeniu prac, biuro zamknięto" -> no comma after an opening prepositional phrase;
      # not after a set aside ("Na szczęście,", "Z drugiej strony,") or before a clause ("Po
      # chwili, gdy…"), and only when nothing else in the sentence could pair with the comma.
      - regex: "{{CLAUSE_START}}(?<phrase>(?:w|we|z|ze|na|do|od|ode|po|za|przy|przed|przede|nad|nade|pod|pode|dla|bez|u|ku|przez|przeze|między|o|wśród|spod|znad|zza|sprzed){{S}}(?:\\p{L}+{{S}})?(?<noun>\\p{L}+))(?<target>,)(?={{S}}(?<rest>\\p{L}[^,;:()\"„”—–\\n]*)[.!?])"
        check: polishMisplacedComma
        message: review_msg_pl_extra_comma
        flags: dgiu
        let:
          lower: 'phrase.toLowerCase().replace(/\s+/gu, " ")'
          words: 'rest.toLowerCase().match(/\p{L}+/gu) ?? []'
          first: 'words[0] ?? ""'
          verb: words.findIndex((word) => plFiniteVerb(word))
        when:
          - "!COMMA_ASIDE_PHRASE.test(lower)"
          # A noun, or a name ("W Krakowie,").
          - 'plOnlyNoun(plNounTags(noun.toLowerCase()), true) || /^\p{Lu}\p{Ll}+$/u.test(noun)'
          - "!(COMMA_OPENS_CLAUSE.test(first) || /ąc$/u.test(first))"
          # "W pracy, w domu i w szkole": a list of phrases.
          - "!PREPOSITION_WORDS.has(first)"
          # "W rolnictwie, przemyśle i budownictwie": a list goes on in the same case.
          - >-
            !(tagsAnd(tagsCases(plNounTags(noun.toLowerCase())), tagsCases(plNounTags(first))) &&
            words.slice(1, verb < 0 ? undefined : verb).some((word) => /^(?:i|oraz|lub|albo|ani)$/u.test(word)))
        return: 'words.some((word) => plFiniteVerb(word) || plImpersonalVerb(word) || /ć$/u.test(word)) ? "" : null'
      # "między Pawłem, a Gawłem" -> "między Pawłem a Gawłem".
      - regex: "(?<![\\p{L}])(?:po)?między{{S}}(?:\\p{L}+{{S}}){0,2}\\p{L}+(?<target>,){{S}}a{{S}}\\p{L}"
        check: polishMisplacedComma
        message: review_msg_pl_extra_comma
        flags: dgiu
        return: '""'
      # "Ani prośby ani groźby" -> "Ani prośby, ani groźby".
      - regex: "(?<![\\p{L}])(?<first>ani|albo|bądź){{S}}(?!(?:co|jak){{S}}bądź)(?:[^,.!?;\\n ]+{{S}}){0,1}?[^,.!?;\\n ]+(?<target>{{S}}\\k<first>){{END}}"
        message: review_msg_pl_comma_aside
        flags: dgiu
        return: '", " + target.trim()'
      # "Co więcej nie ma sensu" -> "Co więcej, nie ma sensu".
      - regex: "{{CLAUSE_START}}(?<target>{{SET_OFF}})(?={{S}}\\p{L})"
        message: review_msg_pl_comma_aside
        return: target + ","
      # "Jak widać nikt nie przyszedł" -> "Jak widać, nikt": the aside ends before the clause; not
      # "Jak widać na wykresie, …" or "Jak wiadomo z historii".
      - regex: "{{CLAUSE_START}}(?<target>Jak{{S}}(?:widać|wiadomo|się{{S}}okazało))(?={{S}}\\p{L}[^,;:\\n.!?]*[.!?])(?!{{S}}(?:w|we|z|ze|na|do|od|ode|po|za|przy|przed|przede|nad|nade|pod|pode|dla|bez|u|ku|przez|przeze|między|o|wśród|spod|znad|zza|sprzed|że|iż|później|potem|wcześniej|dotąd|dziś|dzisiaj|wczoraj){{END}})"
        message: review_msg_pl_comma_aside
        return: target + ","
      # "Jednak, miałem rację" -> "Jednak miałem rację"; not before a phrase set off as an aside
      # ("Poza tym, ze względu na koszty …").
      - regex: "{{CLAUSE_START}}{{LINKING}}(?<target>,)(?!{{S}}(?:w|we|z|ze|na|do|od|ode|po|za|przy|przed|przede|nad|nade|pod|pode|dla|bez|u|ku|przez|przeze|między|o|wśród|spod|znad|zza|sprzed){{END}})(?={{S}}\\p{Ll}[^,;:\\n]*[.!?])"
        check: polishMisplacedComma
        message: review_msg_pl_extra_comma
        return: '""'
      # "Jest to więc, problem" -> no comma after a mid-sentence "więc"/"jednak"/"zatem".
      - regex: "(?<=\\p{Ll}{{S}})(?:więc|jednak|zatem)(?<target>,)(?={{S}}\\p{Ll}+(?:{{S}}\\p{Ll}+){0,2}[.!?])"
        check: polishMisplacedComma
        message: review_msg_pl_extra_comma
        return: '""'
      # "w którym, przygotowujemy" -> no comma right after the relative pronoun.
      - regex: "(?<=(?<![\\p{L}])(?:w|we|z|ze|na|do|od|ode|po|za|przy|przed|przede|nad|nade|pod|pode|dla|bez|u|ku|przez|przeze|między|o|wśród|spod|znad|zza|sprzed){{S}}(?:{{RELATIVE}}))(?<target>,)(?={{S}}\\p{Ll}[^,;:\\n]*[.!?])"
        check: polishMisplacedComma
        message: review_msg_pl_extra_comma
        return: '""'
      # "Gazeta, jest źródłem", "Każdy uczeń, wie": no comma between a subject and its verb. Only
      # a noun that cannot be a vocative ("Mamo, jest obiad"), or one after "każdy", is the subject.
      - regex: "{{CLAUSE_START}}(?:(?<det>każdy|każda|każde|Każdy|Każda|Każde|ten|ta|Ten|Ta){{S}})?(?<noun>\\p{L}\\p{Ll}+)(?<target>,){{S}}(?<verb>\\p{Ll}+){{END}}(?<aside>,)?"
        check: polishMisplacedComma
        message: review_msg_pl_extra_comma
        let:
          tags: plNounTags(noun.toLowerCase())
        when:
          - plOnlyNoun(tags) && tagsAnd(tags, plCases("Ns")) !== 0
          - '!(!det && tagsAnd(tags, plCases("Vs")))'
          # A form of two nouns may be a name too ("Marek, przyszedł list").
          - "[PL_MASCULINE, PL_FEMININE, PL_NEUTER].filter((gender) => tagsAnd(tags, gender)).length === 1"
          # "Uchwała, powiedział, ustala…": a reporting verb set off inside the sentence.
          - "!(aside && /^(?:powiedzia|mówi|twierdz|doda|zauważy|podkreśli|stwierdzi|zaznaczy|napisa|wyjaśni|przyzna|uważa|sądz|odpowiedzia|zapewni)/u.test(verb))"
        return: 'verb === "to" || plFiniteVerb(verb) ? "" : null'
      # "gruszek, ani jabłek", "gruszek, i jabłek": no comma before a single joining conjunction
      # between two nouns, nor between two verbs of one sentence ("Kupiłem chleb, oraz zjadłem").
      - regex: "(?<![\\p{L}])(?<left>\\p{Ll}{3,})(?<target>,){{S}}(?<conj>ani|ni|lub|albo|bądź|oraz|i){{S}}(?<right>\\p{Ll}{3,}){{END}}"
        check: polishMisplacedComma
        message: review_msg_pl_extra_comma
        let:
          sentence: 'ctx.text.slice(Math.max(0, m.index - 120), m.index).split(/[.!?;:\n]/u).at(-1)!'
          a: plNounTags(left)
          b: plNounTags(right)
        when:
          # A repeated conjunction ("ani X, ani Y") keeps its comma.
          - '!new RegExp(`(?<![\\p{L}])${conj}(?![\\p{L}])`, "iu").test(sentence)'
        # The same case, in either number ("czasu, ani pieniędzy"). Two verbs: the comma may close an
        # inserted clause, so only with no other comma before and a verb in the first part ("Wstał,
        # który…, i wyszedł" keeps it). "ani" stays out: "Nie oddał, ani nie przeprosił" may stress the
        # second denial.
        return: >-
          plOnlyNoun(a) && plOnlyNoun(b) && tagsAnd(tagsCases(a), tagsCases(b)) ? ""
          : conj === "ani" || conj === "ni" || !plFiniteVerb(right) || sentence.includes(",") ? null
          : (sentence.match(/\p{L}+/gu) ?? []).some((word) => plFiniteVerb(word.toLowerCase())) ? "" : null
      # "Oto do czego to prowadzi" -> "Oto, do czego": an indirect question after "oto" ("Oto jak…"
      # reads as one phrase).
      - regex: "{{CLAUSE_START}}(?<target>Oto)(?={{S}}(?:(?:w|we|z|ze|na|do|od|ode|po|za|przy|przed|przede|nad|nade|pod|pode|dla|bez|u|ku|przez|przeze|między|o|wśród|spod|znad|zza|sprzed){{S}})?(?:co|czego|czemu|czym|kto|kogo|komu|kim|gdzie|dlaczego|dokąd|skąd){{S}}\\p{L})"
        return: target + ","
      # "tym bardziej, że" -> "tym bardziej że": the comma goes before the whole conjunction.
      - regex: "(?<=(?<![\\p{L}])tym{{S}}bardziej)(?<target>,)(?={{S}}(?:że|iż){{END}})(?!{{S}}(?:że|iż){{S}}(?:jeżeli|jeśli|gdy|kiedy|gdyby|choć|chociaż){{END}})"
        check: polishMisplacedComma
        message: review_msg_pl_extra_comma
        return: '""'
      # "wątpliwości, co do raportu": "co do" is a preposition here ("co do których" opens a clause).
      - regex: "(?<=(?<![\\p{L}])(?:wątpliwości|wątpliwość|zastrzeżenia|zastrzeżeń|uwagi|uwag|pewności|pewność|zdania|pytania|pytań|obawy|obaw|sugestie|sugestii|ustalenia|ustaleń|jasności|zgody))(?<target>,)(?={{S}}co{{S}}do{{S}}(?!któr)\\p{L})"
        check: polishMisplacedComma
        message: review_msg_pl_extra_comma
        return: '""'
      # "Oto, jak to działa" -> "Oto jak": the pair reads as one phrase.
      - regex: "{{CLAUSE_START}}Oto(?<target>,)(?={{S}}jak{{END}})"
        check: polishMisplacedComma
        message: review_msg_pl_extra_comma
        return: '""'
      # "Nie wiem, dlaczego." -> no comma before a question word that stands alone at the end.
      - regex: "(?<=\\p{Ll})(?<target>,)(?={{S}}(?:dlaczego|czemu|po{{S}}co|skąd|dokąd|gdzie)[ \\t\\u00a0]{0,8}[.!?…])"
        check: polishMisplacedComma
        message: review_msg_pl_extra_comma
        return: '""'
      # "w trakcie, którego" -> "w trakcie którego": the preposition and its relative are one phrase.
      - regex: "(?<=(?<![\\p{L}])(?:w{{S}}trakcie|w{{S}}czasie|w{{S}}wyniku|w{{S}}ramach|na{{S}}skutek|z{{S}}powodu|na{{S}}podstawie|za{{S}}pomocą|przy{{S}}pomocy|w{{S}}celu|w{{S}}zakresie|podczas|dzięki|wobec|wskutek|według|spośród|pośród))(?<target>,)(?={{S}}(?:{{RELATIVE}}){{END}})"
        check: polishMisplacedComma
        message: review_msg_pl_extra_comma
        return: '""'
      # "odzywał, się sygnał": "się" never opens a clause.
      - regex: "(?<=\\p{Ll}(?:ł|ła|ło|li|ły))(?<target>,)(?={{S}}się{{S}}\\p{Ll})"
        check: polishMisplacedComma
        message: review_msg_pl_extra_comma
        return: '""'
      # "coś do powiedzenia a mianowicie" -> ", a mianowicie"; "Dorota w miarę jak rosła" -> ", w miarę jak".
      - regex: "(?<=\\p{Ll})(?<!(?:^|[^\\p{L}])(?:choć|chociaż|i|a|ale|że|bo|lecz|oraz|gdy|kiedy|lub|albo))(?<target>{{S}}(?:a{{S}}(?:mianowicie|zwłaszcza|szczególnie)|w{{S}}miarę{{S}}jak)){{END}}(?!{{S}}naj)"
        return: '"," + target'
      # "O ile …, o tyle …": the second half is set off.
      - regex: "(?<target>{{S}}o{{S}}tyle){{END}}(?<=(?:^|[.!?…]{{S}}|\\n)O{{S}}ile[^.!?;\\n]{3,300}\\p{L}{{S}}o{{S}}tyle)"
        return: '"," + target'
      # "Nie ma to innymi słowy sensu" -> ", innymi słowy,": an aside inside the sentence.
      - regex: "(?<=\\p{Ll})(?<target>{{S}}innymi{{S}}słowy)(?<after>{{S}}(?=\\p{Ll})|,)"
        message: review_msg_pl_comma_aside
        return: '"," + target + (after === "," ? "" : ",")'
      # "Musi tak być i koniec!" -> ", i koniec": after a verb, the phrase closes the matter.
      - regex: "(?<![\\p{L}])(?<verb>\\p{Ll}{2,20})(?<target>{{S}}i{{S}}(?:koniec|kropka))(?=[ \\t\\u00a0]{0,8}[.!])"
        return: '/ć$/u.test(verb) || plFiniteVerb(verb) ? "," + target : null'
      # "bez względu na to gdzie" -> "na to, gdzie": an indirect question after "to".
      - regex: "(?<=(?<![\\p{L}])(?:na|o|od|z|do|przez|za|po){{S}})(?<target>to)(?={{S}}(?:gdzie|kiedy|czy|ile|dlaczego|kto|którędy|skąd|dokąd){{END}})"
        return: '"to,"'
  - id: pl.capitals
    checks: [polishCapitalization]
    style: swap
    message: review_msg_pl_capitals
    defs:
      # Every word with a capital and the rest in lowercase.
      capitalWords:
        args: "word: string"
        return: >-
          word.split(/(?<=[ \t -])/u).map((part) => part.charAt(0).toUpperCase() +
          part.slice(1).toLowerCase()).join("")
      # Holiday words around a weekday ("Wielki Piątek", "Niedziela Palmowa", "Tłusty Czwartek").
      HOLIDAY_BEFORE: '/(?:Wielk\p{Ll}+|Tłust\p{Ll}+|Biał\p{Ll}+|Czarn\p{Ll}+|Zielon\p{Ll}+)[ \t ]+$/u'
      HOLIDAY_AFTER: '/^[ \t ]+(?:Palmow|Wielkanocn|Popielcow|Miłosierdzi|Zesłani|Bożego|Zielon|Świąt)/u'
      DAY_CONTEXT: '/(?:\p{N}\.?|(?<![\p{L}])(?:w|we|co|od|do|na|przez|po|przed|z|ze|około|każd\p{Ll}*|ten|tę|ta|tej|zeszł\p{Ll}*|przyszł\p{Ll}*|następn\p{Ll}*|ostatni\p{Ll}*|najbliższ\p{Ll}*|początku|końcu|połowie))[ \t ]+$/u'
      # Adjective endings (with the -i/-y spellings) that agree with a noun by its ending. "-u" is
      # the genitive ("oceanu Atlantyckiego"), the dative or the locative.
      CASING_AGREEING: >-
        [[/owi$/u, /(?:i|y)?emu$/u], [/u$/u, /(?:i|y)?(?:ego|emu)$|(?:i|y)m$/u],
        [/(?:em|ie)$/u, /(?:i|y)m$/u], [/(?:e|o)$/u, /i?e$/u], [/a$/u, /(?:i|y)?ego$/u],
        [/(?:[^aeiouyąęó])$/u, /(?:i|y)$/u]] as readonly (readonly [RegExp, RegExp])[]
      casingAgrees:
        args: "noun: string, adjective: string"
        let:
          n: noun.toLowerCase()
          a: adjective.toLowerCase().split("-").at(-1)!
          row: CASING_AGREEING.find(([ending]) => ending.test(n))
        return: "!!row && row[1].test(a)"
      # A feminine noun's ending and the adjective endings of the same case.
      FEMININE_AGREEING: >-
        [[/a$/u, /a$/u], [/o$/u, /a$/u], [/[iy]$/u, /ej$/u], [/e$/u, /ej$/u], [/[ęą]$/u, /ą$/u]] as
        readonly (readonly [RegExp, RegExp])[]
    frames:
      # "co Piątek", "w Maju" -> lowercase, not at a sentence start or in a holiday name.
      - regex: "(?<![\\p{L}])(?<target>{{WEEKDAY_OR_MONTH}}){{END}}"
        let:
          before: ctx.text.slice(Math.max(0, m.index - 24), m.index)
          after: ctx.text.slice(m.index + m[0].length, m.index + m[0].length + 24)
        when:
          - "!(plSentenceStart(ctx.text, m.index) || HOLIDAY_BEFORE.test(before) || HOLIDAY_AFTER.test(after))"
          # A heading or a list item ("Piątek: …", "• Sobota").
          - '!(/^[ \t ]*[:–—-]/u.test(after) || /(?:^|\n)[ \t ]*[-•*]?[ \t ]*$/u.test(before))'
          # Surnames share the words ("pan Środa", "Lipiec"): only after a date or a word that asks for a
          # day or month ("w", "co", "każdy", "zeszły", "5").
          - DAY_CONTEXT.test(before)
          # "Lipa", "Marek", "Marzena": a name sharing the stem.
          - "/^(?:Poniedział|Wtor|Środ|Czwart|Piąt|Sobot|Niedziel|Stycz|Lut[yemu]|Marc|Marz[ec]|Kwietni|Kwiecień|Czerw|Lip(?:iec|ca|cu|cem)|Sierp|Wrze[sś]|Październik|Listopad|Grud)/u.test(m[0])"
        return: m[0].toLowerCase()
      # "wielki piątek", "środę popielcową" -> every word capitalized.
      - regex: "(?<![\\p{L}])(?:wielk\\p{L}+{{S}}(?:piąt\\p{L}+|sobot\\p{L}+|czwart\\p{L}+)|tłust\\p{L}+{{S}}czwart\\p{L}+|niedziel\\p{L}+{{S}}(?:palmow|wielkanocn)\\p{L}+|poniedział\\p{L}+{{S}}wielkanocn\\p{L}+|środ\\p{L}+{{S}}popielcow\\p{L}+){{END}}"
        flags: giu
        return: capitalWords(m[0])
      # "Morza bałtyckiego", "oceanu Atlantyckiego" -> "Morza Bałtyckiego", "Oceanu Atlantyckiego".
      - regex: "(?<![\\p{L}])(?<noun>morz(?:e|a|u|em)|ocean(?:|u|owi|em|ie)){{S}}(?<adj>(?:bałtyck|czarn|śródziemn|kaspijsk|adriatyck|egejsk|martw|północn|atlantyck|spokojn|indyjsk|arktyczn)\\p{L}+){{END}}"
        flags: giu
        return: "casingAgrees(noun, adj) ? capitalWords(m[0]) : null"
      # "Ameryka łacińska", "republika Czeska", "Ruda śląska", "Sri lanka" -> every word
      # capitalized; a lowercase "ruda" (ore) or "republika" before a plain adjective stays.
      - regex: "(?<![\\p{L}])(?:Amery(?:ka|ki|kę|ką|ko|ce){{S}}(?:łacińsk|północn|południow|środkow)\\p{Ll}+|[Rr]epubli(?:ka|ki|kę|ką|ce|ko){{S}}(?:[Cc]zesk|[Ss]łowack|[Dd]ominikańsk|[Pp]ołudniowoafrykańsk)\\p{Ll}+|Rud(?:a|y|zie|ę|ą){{S}}śląsk\\p{Ll}+|Sri{{S}}(?:lank(?:a|i|ę|ą)|lance)|[Nn]ow(?:a|ej|ą){{S}}[Zz]elandi(?:a|i|ę|ą)|Wielk(?:a|iej|ą){{S}}[Bb]rytani(?:a|i|ę|ą)){{END}}"
        let:
          words: 'm[0].split(/[ \t ]+/u)'
          # A feminine noun and its adjective in one case ("w Ameryce północne stany" is two phrases).
          ending: FEMININE_AGREEING.find(([nounEnd]) => nounEnd.test(words[0]))?.[1]
        return: "/^(?:Sri|Now|now|Wielk)/u.test(words[0]) || ending?.test(words[1]) ? capitalWords(m[0]) : null"
      # "Bielsko-biała", "Rabka-zdrój", "Kędzierzyn-koźle": a hyphenated town name capitalizes
      # both parts.
      - regex: "(?<![\\p{L}-])\\p{Lu}\\p{Ll}+-(?:biał(?:a|ej|ą)|zdr(?:ój|oju|ojem|oje)|koźl(?:e|a|u|em)){{END}}"
        return: capitalWords(m[0])
      # "Europa zachodnia" -> "Europa Zachodnia": the region's name capitalizes both words.
      - regex: "(?=[zwśp])(?<=(?<![\\p{L}])Europ(?:a|y|ie|ę|ą){{S}})(?:zachodni|wschodni|środkow|północn|południow)(?:a|ej|ą){{END}}"
        return: capitalWords(m[0])
      # "po Angielsku" -> "po angielsku".
      - regex: "(?=\\p{Lu})(?<=(?<![\\p{L}])po{{S}})\\p{Lu}\\p{Ll}+sku{{END}}"
        return: m[0].toLowerCase()
      # "w języku Katalońskim", "województwo Mazowieckie" -> lowercase adjective.
      - regex: "(?=\\p{Lu})(?<=(?<![\\p{L}])(?<noun>język\\p{Ll}*|województw\\p{Ll}*|powiat\\p{Ll}*|powiecie){{S}})\\p{Lu}\\p{Ll}+(?:sk|ck)\\p{Ll}+(?:-\\p{Lu}\\p{Ll}+(?:sk|ck)\\p{Ll}+)?{{END}}"
        return: "casingAgrees(noun, m[0]) ? m[0].toLowerCase() : null"
      # "kilkuset Hertzów", "100 Ohmów" -> "herców", "omów".
      - regex: "(?=[HOWV])(?<=(?:\\p{N}|kilku\\p{L}*|stu|tysięcy|wielu){{S}})(?:Hertz|Herc|Ohm|Watt|Volt)(?:ów|y|a|e)?{{END}}"
        flags: giu
        return: >-
          m[0].toLowerCase().replace(/^hertz/, "herc").replace(/^ohm/, "om").replace(/^watt/, "wat")
          .replace(/^volt/, "wolt")
      # "na Ty", "per „Ty”" -> "na ty".
      - regex: "(?<![\\p{L}])(?:na|per){{S}}[„\"]?Ty[”\"]?{{END}}"
        return: 'm[0].replace(/[„"”]/gu, "").replace("Ty", "ty")'
      # "Sztuką zajmują się Ci, którzy" -> "ci".
      - regex: "(?=C)(?<=\\p{Ll}{{S}})Ci(?=,?{{S}}(?:którzy|co){{END}})"
        return: '"ci"'
      # "Zostań z Nami!", "z Naszymi doradcami" -> "nami", "naszymi": the writers' own "nas" and
      # "nasz" take no capital inside a sentence (only the reader's "Ty", "Wy" may, in a letter).
      # A capital word before or after makes it a name ("Ojcze Nasz", "Nasz Dziennik").
      - regex: "(?=N)(?<=(?<![\\p{L}])\\p{Ll}{1,20}{{S}})Na(?:szymi|szego|szemu|szych|szej|szym|sza|sze|szą|sz|mi|m|s)(?={{S}}\\p{Ll}|[ \\t\\u00a0]{0,8}(?:[.!?,;:]|$))"
        return: m[0].toLowerCase()
      # "Warszawie, Ul. Długa", "mieszka przy Ulicy Polnej" -> "ul.", "ulicy": the generic word of a
      # street name is lowercase inside the sentence.
      - regex: "(?=U)(?<=\\p{L},?{{S}})(?:Ul\\.|Ulic(?:a|y|ę|ą|e))(?={{S}}\\p{Lu}\\p{Ll})"
        return: m[0].toLowerCase()
      # "al. Ujazdowskie", "w alejach Jerozolimskich" -> "Al.", "Alejach": "Aleje" is part of a
      # plural avenue name.
      - regex: "(?<![\\p{L}])(?:al\\.|alej(?:e|ach|ami|om)|alei)(?={{S}}\\p{Lu}\\p{Ll}+(?:skie|ckie|dzkie|skich|ckich|dzkich|skim|ckim|skimi|ckimi){{END}})"
        return: capitalWords(m[0])
      # "Frankfurt Nad Menem", "Kazimierz Nad Wisłą" -> "nad".
      - regex: "(?=[NP])(?<=\\p{Lu}\\p{Ll}+{{S}})(?:Nad|Pod)(?={{S}}\\p{Lu}\\p{Ll}+)"
        return: m[0].toLowerCase()
      # "w gdańsku", "do niemiec", "na mazurach" -> a place name takes a capital (not "po
      # gdańsku", the Gdańsk way).
      - regex: "(?=\\p{Ll})(?<=(?<![\\p{L}\\p{N}_'’.@/-])(?:[wW]|[wW]e|[dD]o|[zZ]|[zZ]e|[nN]a|[oO]d|[oO]de|[pP]rzez|[pP]od|[nN]ad|[pP]rzy|[kK]oło|[oO]koło|[sS]pod|[zZ]nad|[uU]|[dD]la|[oO]bok|[wW]okół|[nN]iedaleko|[kK]u|[pP]rzed|[zZ]a|[mM]iędzy|[pP]omiędzy){{S}})\\p{Ll}+(?:-\\p{Ll}+)?{{END}}"
        return: "plPlaceForm(m[0]) ? capitalWords(m[0]) : null"
  # "żeby", "aby", "gdyby" carry the person ending themselves: "żebym zrobił", not "żeby
  # zrobiłem" or "żeby zrobiłbym"; "gdybyś zrobił", not "gdybyś zrobiłeś".
  - id: pl.conjunctions
    checks: [polishCaseAgreement]
    style: match
    message: review_msg_pl_conjunction_ending
    defs:
      # The verb's past-tense or conditional ending -> its bare past form ending, the person ending.
      CONJUNCTION_ENDINGS: >-
        [[/łbym$/u, "ł", "m"], [/łabym$/u, "ła", "m"], [/łbyś$/u, "ł", "ś"], [/łabyś$/u, "ła", "ś"],
        [/libyśmy$/u, "li", "śmy"], [/łybyśmy$/u, "ły", "śmy"], [/libyście$/u, "li", "ście"],
        [/łybyście$/u, "ły", "ście"], [/łem$/u, "ł", "m"], [/łam$/u, "ła", "m"], [/łeś$/u, "ł", "ś"],
        [/łaś$/u, "ła", "ś"], [/liśmy$/u, "li", "śmy"], [/łyśmy$/u, "ły", "śmy"],
        [/liście$/u, "li", "ście"], [/łyście$/u, "ły", "ście"]] as readonly (readonly [RegExp, string, string])[]
    frames:
      # "żeby zrobiłem" -> "żebym zrobił", "gdybyś zrobiłeś" -> "gdybyś zrobił": the conjunction
      # carries the person ending.
      - regex: "(?<![\\p{L}])(?<conj>żeby|ażeby|aby|gdyby)(?<person>m|ś|śmy|ście)?(?<between>(?:{{S}}(?!(?:że|który|która|które|i|a|ale|lub|oraz)[ \\t\\u00a0])\\p{L}{1,15}){0,3}?){{S}}(?<verb>\\p{L}{2,}(?:łbym|łabym|łbyś|łabyś|libyśmy|łybyśmy|libyście|łybyście|łem|łam|łeś|łaś|liśmy|łyśmy|liście|łyście))(?![\\p{L}])"
        scan: polish
        flags: giu
        let:
          ending: CONJUNCTION_ENDINGS.find(([regex]) => regex.test(verb))
        when:
          # "żeby przed stołem", "aby działem": a noun in -łem is no verb.
          - "!(plNounTags(verb.toLowerCase()) || plUserOrNamed(ctx, verb))"
          - ending !== undefined
          # "gdybyś zrobiłeś": the conjunction already has the ending; otherwise it moves there.
          - "!person || person === ending[2]"
        return: >-
          plFindingAt(ctx, m.index, m.index + m[0].length,
          [`${plCaseLike(conj, conj + (person || ending[2]))}${between} ${verb.replace(ending[0], ending[1])}`],
          "polishCaseAgreement", "review_msg_pl_conjunction_ending")
      # "żebyś przeczyta", "by będzie": a present or future form where the past one goes.
      - regex: "(?<![\\p{L}])(?:żeby|ażeby|aby|by)(?:m|ś|śmy|ście)?{{S}}(?:(?:nie|się){{S}})?(?<verb>\\p{L}{2,})(?![\\p{L}])"
        scan: polish
        flags: giu
        let:
          imperative: plImperativeVerb(verb)
          start: m.index + m[0].length - verb.length
        when:
          - "!(/(?:ł|ła|ło|li|ły)$/u.test(verb) || plUserOrNamed(ctx, verb))"
          - imperative || plFiniteVerb(verb)
        return: >-
          plFindingAt(ctx, start, start + verb.length, [], "polishCaseAgreement",
          imperative ? "review_msg_pl_imperative" : "review_msg_pl_conjunction_ending")
      # "Wiem, że przeczytaj", "Czy przeczytaj tę książkę?": an imperative in a clause. ", że
      # przeczytaj" (a reported clause after its comma: "tyle że uważaj" is a contrast), "Czy przeczytaj"
      # opening a question ("idź czy zostań" offers a choice).
      - regex: "(?:,[ \\t\\u00a0]{0,8}(?:że|iż)|(?=\\p{L})(?<=(?:^|[.!?…:;][\"”’»)]{0,3}[ \\t\\u00a0\\n]{1,8}|\\n[ \\t\\u00a0]{0,8}))czy){{S}}{{CLITICS}}(?<verb>\\p{L}{2,})(?![\\p{L}])"
        scan: polish
        flags: gdiu
        when: plImperativeVerb(verb) && !plUserOrNamed(ctx, verb)
        return: >-
          plFindingAt(ctx, m.indices!.groups!.verb[0], m.indices!.groups!.verb[1], [],
          "polishCaseAgreement", "review_msg_pl_imperative")
  # Clause boundaries read from finite verbs: two clauses run on without a comma or a
  # conjunction ("Kupiłem wino chciałem też wodę"), a relative clause left open ("Partie, które
  # popieram przegrywają"), a contrasting "a" or "więc" between clauses without its comma, and an
  # adverbial participle phrase ("idąc", "zrobiwszy") not set off from its clause.
  - id: pl.clauses
    checks: [polishMissingComma]
    style: match
    message: review_msg_pl_missing_comma
    sets:
      # Words that join two clauses or open one: verbs with one of these between them are fine.
      CLAUSE_JOINS:
        [
          i,
          a,
          oraz,
          lub,
          albo,
          bądź,
          ani,
          czy,
          ale,
          lecz,
          zaś,
          więc,
          bo,
          że,
          iż,
          żeby,
          aby,
          by,
          gdy,
          kiedy,
          jeśli,
          jeżeli,
          gdyby,
          choć,
          chociaż,
          jak,
          jakby,
          niż,
          co,
          kto,
          gdzie,
          dokąd,
          skąd,
          dlaczego,
          czemu,
          ile,
          zanim,
          dopóki,
          odkąd,
          póki,
          skoro,
          ponieważ,
          albowiem,
          niech,
          to,
          tylko,
          jednak,
          natomiast,
          toteż,
          czyli,
          mianowicie,
          ni,
        ]
      # Participles that work as prepositions ("począwszy od", "wyłączając") or in "chcąc nie chcąc".
      CLAUSE_FIXED:
        [
          począwszy,
          skończywszy,
          zacząwszy,
          wyjąwszy,
          pominąwszy,
          wyłączając,
          włączając,
          wliczając,
          chcąc,
        ]
    maps:
      # A form of "powinien" and the gender and number of its past forms.
      CLAUSE_POWIN_GENDER: { powinien: ł, powinna: ła, powinno: ło, powinni: li, powinny: ły }
      # The adjective ending that agrees with a form of "być" before it ("była nudna").
      CLAUSE_PREDICATE_ENDING: { ł: y, ła: a, ło: e, li: "", ły: e }
    defs:
      # A relative pronoun, after a comma and a preposition or not ("dom, w którym").
      CLAUSE_RELATIVE: /^któr/u
      # Conjunctions that join two clauses after a comma ("…, a Jurek pisał", "…, więc poszedł").
      CLAUSE_CONTRAST: /^(?:a|więc|lecz)$/u
      # Conjunctions that may also join two parts of one phrase ("ważną i tajemniczą miną").
      CLAUSE_COORDINATE: /^(?:i|oraz|lub|albo|bądź|ani|ni|a|zaś)$/u
      CLAUSE_FUTURE: /^będ(?:ę|ziesz|zie|ziemy|ziecie|ą)$/u
      CLAUSE_PAST: /(?:ł|ła|ło|li|ły)(?:em|am|eś|aś|śmy|ście|by\p{L}*)?$/u
      CLAUSE_INFINITIVE: /[ćc]$/u
      CLAUSE_MODAL: /^(?:musi|musia|mogł|mógł|mogl|chcia|chcie|mia|mie)/u
      # A form no noun or adjective shares: the past, "jest", "będzie", "powinien", "można".
      CLAUSE_CERTAIN: /(?:ł|ła|ło|li|ły)(?:em|am|eś|aś|śmy|ście|by\p{L}*)?$|^(?:jest|są|będ|powin|można|trzeba|należ|może$)|(?:ano|iono|[iyuę]to)$/u
      # Words after a past form that no adjective of the same spelling takes ("trwały już").
      CLAUSE_AFTER_VERB: /^(?:już|jeszcze|bardzo|tylko|nadal|wciąż|zawsze|też|także|również|długo|się|nie|tam|tu|tutaj|wtedy|wówczas|naprawdę|zbyt|całkiem|zupełnie|ostatnio|mi|mu|jej|im|nam|wam|ci)$/u
      # The nominative a past form's gender and number agree with: "ła" a feminine singular.
      CLAUSE_SUBJECT_OF: >-
        ({ ł: PL_MASCULINE, ła: PL_FEMININE, ło: PL_NEUTER, li: PL_VIRILE, ły: tagsOr(PL_FEMININE, PL_NEUTER) }) as
        Readonly<Record<string, number>>
      # Impersonal predicates: "można", "trzeba", "należy zrobić".
      CLAUSE_PREDICATIVE: /^(?:można|trzeba|należy|należało|należałoby|wypada|wypadało)$/u
      # An infinitive form: "zrobić", "móc", "pomóc", "biec".
      CLAUSE_INFINITIVE_FORM: /(?:ć|móc|biec|wlec|strzec|piec|rzec|tłuc)$/u
      # Adverbs that open a parenthetical "mówiąc" or "biorąc" ("krótko mówiąc").
      CLAUSE_ASIDE: /^(?:krótko|szczerze|ściśle|ogólnie|prawdę|inaczej|nawiasem|delikatnie|otwarcie|uczciwie|obiektywnie|generalnie|praktycznie|łagodnie|oględnie|kolokwialnie|potocznie|formalnie)$/u
      # Conjunctions opening a clause that a correlative "to" answers.
      CLAUSE_CONDITIONAL: /^(?:jeśli|jeżeli|jeśliby|jeżeliby|gdy|gdyby|kiedy|skoro|ponieważ|chociaż|choć)$/u
      clauseJoins:
        args: "word: string"
        return: CLAUSE_JOINS.has(word) || /^(?:któr|jak|czyj|ilu|(?:gdy|że|a)?by(?:m|ś|śmy|ście)$)/u.test(word)
      # A past form's (or "powinien"'s) gender and number: "ł", "ła", "ło", "li" or "ły".
      clauseGenderOf:
        args: "word: string"
        return: >-
          /^powin/u.test(word) ? (CLAUSE_POWIN_GENDER[word.replace(/(?:śmy|ście|em|eś|m|ś)$/u, "")] ?? "")
          : /(ł|ła|ło|li|ły)(?:em|am|eś|aś|śmy|ście|by\p{L}*)?$/u.exec(word)?.[1] ?? ""
      # "będzie" goes with a singular past form, "będą" with a plural one.
      clauseSameNumber:
        args: "future: string, past: string"
        return: "/^będ(?:ę|ziesz|zie)$/u.test(future) === !/^l|^ły/u.test(clauseGenderOf(past))"
      # "będzie (długo) robił", "robił będzie", "powinien był", "byłby zrobił", "wyobrażałem sobie
      # był": one verb in two words. "będą popierać przegrywały" is two. "trzeba będzie", "można
      # było". "będą umrzeć musieli": a modal takes the infinitive between; "będzie pomagali" is
      # two. "powinien był", "powinna była"; not "powinien było". The old pluperfect "zrobił był"
      # agrees; in a relative clause the next "był" opens the main clause ("Książka, którą
      # czytałem była nudna").
      clauseCompound:
        args: "list: readonly PlWord[], a: number, b: number, relative: boolean"
        let:
          first: list[a].lower
          second: list[b].lower
          pair: "[first, second]"
        return: >-
          pair.some((w) => /^(?:trzeba|można)$/u.test(w)) ? pair.some((w) => CLAUSE_FUTURE.test(w) || /^był/u.test(w))
          : CLAUSE_FUTURE.test(first) && CLAUSE_PAST.test(second)
          ? clauseSameNumber(first, second) && (CLAUSE_MODAL.test(second) || !list.slice(a + 1, b).some((w) => CLAUSE_INFINITIVE.test(w.lower)))
          : CLAUSE_PAST.test(first) && CLAUSE_FUTURE.test(second) ? b === a + 1 && clauseSameNumber(second, first)
          : pair.some((w) => /^powin/u.test(w)) ? pair.some((w) => /^by(?:ł|li)/u.test(w)) && clauseGenderOf(first) === clauseGenderOf(second)
          : !relative && pair.some((w) => /^by(?:ł|li)/u.test(w)) && pair.every((w) => CLAUSE_PAST.test(w)) &&
          clauseGenderOf(first) === clauseGenderOf(second)
      # The finite verb (or the predicative "można", "trzeba") of a clause stands at `i`. A capital
      # inside the sentence starts a name ("w Osunie"). "to znaczy", "to jest" (that is) and "na
      # chybił trafił" link; they are no predicate. "prze siebie", "prze piękny": a typo for
      # "przed", "przez" or "prze-", not "przeć". "może" is also "maybe", unless an infinitive
      # follows ("może być"). "miał" (also coal dust): a verb before an infinitive or after a
      # personal pronoun.
      clauseVerbAt:
        args: "list: readonly PlWord[], i: number"
        let:
          word: list[i].lower
          next: list[i + 1]?.lower ?? ""
        when:
          - '!(i > 0 && /^\p{Lu}/u.test(list[i].text))'
          - '!(list[i - 1]?.lower === "to" && /^(?:znaczy|jest)$/u.test(word))'
          - "!/^(?:chybił|trafił)$/u.test(word)"
          - '!(word === "prze" && /^(?:siebie|ze|zemnie)$|y$|a$|e$/u.test(next))'
        return: >-
          word === "może" ? CLAUSE_INFINITIVE.test(next)
          : CLAUSE_PREDICATIVE.test(word) || plFiniteVerb(word) || plImpersonalVerb(word) ? true
          : !plAmbiguousVerb(word) || clauseJoins(word) ? false
          : (CLAUSE_PAST.test(word) && CLAUSE_INFINITIVE_FORM.test(next) && !plNounTags(next)) ||
          /^(?:ja|ty|on|ona|ono|my|wy|oni|one)$/u.test(list[i - 1]?.lower ?? "") ||
          (CLAUSE_PAST.test(word) && clausePastInContext(list, i))
        else: "false"
      # A past form that is also an adjective ("trwały", "była") reads as the verb before an adverb
      # ("trwały już"), after its nominative subject ("żniwa trwały"), or, as "być", before an
      # agreeing predicate adjective that ends the phrase ("była nudna."). It stands beside its
      # masculine form ("trwały", "trwał"; "woli" has no "woł"). "-ło" is also an adverb ("śmiało
      # się obracał").
      clausePastInContext:
        args: "list: readonly PlWord[], i: number"
        let:
          word: list[i].lower
          gender: clauseGenderOf(word)
          next: list[i + 1]?.lower
          isBe: /^by(?:ł|li)/u.test(word)
          stem: word.slice(0, word.length - gender.length)
        when:
          - gender !== "" && next !== undefined
          - 'isBe || plListedVerb(gender === "ł" ? stem + "ła" : stem + "ł")'
        return: >-
          CLAUSE_AFTER_VERB.test(next) ? gender !== "ło" || isBe
          : clausePastBySubject(list, i, gender, next, isBe)
        else: "false"
      # The past form after its subject, or "być" closing a relative clause's main clause before a
      # predicate adjective ("którą czytałem była nudna").
      clausePastBySubject:
        args: "list: readonly PlWord[], i: number, gender: string, next: string, isBe: boolean"
        let:
          plural: gender === "li" || gender === "ły"
          prev: "list[i - 1] ? plNounTags(list[i - 1].lower) : 0"
        return: >-
          plOnlyNoun(prev) && tagsAnd(prev, plCases(plural ? "Np" : "Ns")) && tagsAnd(prev, CLAUSE_SUBJECT_OF[gender])
          ? gender !== "ły" || !tagsAnd(prev, PL_VIRILE)
          : isBe && list.slice(0, i).some((w) => CLAUSE_RELATIVE.test(w.lower)) && clauseBePredicate(list, i, gender, next)
      clauseBePredicate:
        args: "list: readonly PlWord[], i: number, gender: string, next: string"
        let:
          adjective: plAdjectiveOf(next)
          after: "list[i + 2] ? plNounTags(list[i + 2].lower) : 0"
        return: >-
          adjective !== null && !plNounTags(next) && !tagsAnd(after, PL_ALL_CASES) &&
          adjective.ending === CLAUSE_PREDICATE_ENDING[gender]
      # An adverbial participle: "idąc", "mając"; "zrobiwszy", "przyszedłszy". Not a comparative
      # ("nowszy", "ciekawszy") or "pierwszy".
      clauseAdverbialParticiple:
        args: "word: string"
        return: >-
          CLAUSE_FIXED.has(word) || plNounTags(word) || plAdjectiveOf(word) ? false
          : /ąc$/u.test(word) ? word.length >= 4
          : /[wł]szy$/u.test(word) && word.length >= 7 && !/^naj|pierwszy$/u.test(word) &&
          !plHasAdjective(word.slice(0, -3) + "y")
      # Insert ", " in the gap before the word at `at` (a fix of the spaces between it and the word
      # before).
      clauseCommaBefore:
        args: 'ctx: DetectContext, list: readonly PlWord[], at: number, segment: readonly [number, number], messageKey: RawFinding["messageKey"], choose: boolean'
        return: >-
          ({ ...plFindingAt(ctx, list[at - 1].end, list[at].start, [", "], "polishMissingComma", messageKey),
          ...(choose ? { requiresChoice: true as const } : {}), context: { start: segment[0], end: segment[1] } })
      clauseWarning:
        args: 'ctx: DetectContext, word: PlWord, segment: readonly [number, number], messageKey: RawFinding["messageKey"]'
        return: >-
          ({ ...plFindingAt(ctx, word.start, word.end, [], "polishMissingComma", messageKey),
          context: { start: segment[0], end: segment[1] } })
      # A past form the lexicon does not list counts here ("ubawił hrabiego, opowiadając").
      clauseIsVerb:
        args: "w: PlReadWord"
        return: w.verb || plPastByShape(w.lower)
      # The last clause verb at or before `j`, or -1.
      clauseVerbBefore:
        args: "list: readonly PlReadWord[], j: number"
        type: number
        return: "j < 0 || clauseIsVerb(list[j]) ? j : clauseVerbBefore(list, j - 1)"
      clauseParticiples:
        args: "ctx: DetectContext, list: readonly PlReadWord[], segment: readonly [number, number]"
        return: list.flatMap((p, i) => clauseParticipleAt(ctx, list, segment, p, i))
      # "krótko mówiąc", "szczerze mówiąc": a parenthetical, set off on both sides. At the start
      # ("Szczerze mówiąc nie wiem") the comma frames already ask for its comma. One participle
      # word alone ("jadł stojąc") is left alone.
      clauseParticipleAt:
        args: "ctx: DetectContext, list: readonly PlReadWord[], segment: readonly [number, number], p: PlReadWord, i: number"
        let:
          prev: list[i - 1]
          next: list[i + 1]
        when: p.participle && !plUserOrNamed(ctx, p.text)
        return: >-
          /^(?:mówiąc|biorąc)$/u.test(p.lower) && prev && CLAUSE_ASIDE.test(prev.lower)
          ? (list[i - 2] && next ? [{ ...plFindingAt(ctx, list[i - 2].end, next.start,
          [", " + ctx.source.slice(prev.start, p.end) + ", "], "polishMissingComma", "review_msg_pl_participle_comma"),
          context: { start: segment[0], end: segment[1] } }] : [])
          : !next ? [] : clauseParticipleComma(ctx, list, segment, i, prev)
        else: "[]"
      # "Zrobiwszy zakupy wróciła", "że mając czas zapomniał": the phrase needs its closing comma
      # before the main clause. "Szedł powoli rozglądając się" -> "Szedł powoli, rozglądając się".
      clauseParticipleComma:
        args: "ctx: DetectContext, list: readonly PlReadWord[], segment: readonly [number, number], i: number, prev: PlReadWord"
        let:
          verbBefore: clauseVerbBefore(list, i - 1)
          verbAfter: list.findIndex((w, j) => j > i + 1 && clauseIsVerb(w))
          opened: prev && clauseJoins(prev.lower)
        return: >-
          verbAfter > 0 && (verbBefore < 0 || opened) &&
          !list.slice(i + 1, verbAfter).some((w) => clauseJoins(w.lower) && !CLAUSE_COORDINATE.test(w.lower))
          ? [clauseWarning(ctx, list[i], segment, "review_msg_pl_participle_comma")]
          : verbBefore >= 0 && !opened &&
          !list.slice(verbBefore + 1, i).some((w) => clauseJoins(w.lower) && !CLAUSE_COORDINATE.test(w.lower))
          ? [clauseCommaBefore(ctx, list, prev.lower === "nie" && i - 1 > verbBefore ? i - 1 : i, segment,
          "review_msg_pl_participle_comma", false)]
          : []
      # The words after a purpose conjunction that its infinitive may follow ("aby się nie spóźnić").
      clauseSkipObjects:
        args: "list: readonly PlReadWord[], at: number, limit: number"
        type: number
        return: 'at < limit && /^(?:się|nie|sobie|to|tego|ją|go|je)$/u.test(list[at]?.lower ?? "") ? clauseSkipObjects(list, at + 1, limit) : at'
      # "Aby zdać egzamin student musi się uczyć": a purpose phrase opening the sentence ends with
      # a comma before the main clause. Warns at the main clause's verb.
      clausePurposeOpeners:
        args: "ctx: DetectContext, list: readonly PlReadWord[], segment: readonly [number, number]"
        let:
          first: "/^(?:ale|a|i|lecz|więc|zatem)$/u.test(list[0].lower) ? 1 : 0"
          before: ctx.text.slice(Math.max(0, segment[0] - 8), segment[0])
          at: clauseSkipObjects(list, first + 1, first + 3)
          infinitive: list[at]
          verb: list.findIndex((w, j) => j > at && w.verb)
        when:
          - '/^(?:aby|żeby|ażeby|by)$/u.test(list[first]?.lower ?? "")'
          - '!(segment[0] > 0 && !/(?:^|[.!?…,;:]["”’»)]*|\n)[ \t ]*$/u.test(before))'
          - "!(!infinitive || !CLAUSE_INFINITIVE_FORM.test(infinitive.lower) || plNounTags(infinitive.lower))"
          - verb >= 0
          - '!list.slice(at + 1, verb).some((w) => w.participle || (clauseJoins(w.lower) && !CLAUSE_COORDINATE.test(w.lower) && w.lower !== "to"))'
        return: '[clauseWarning(ctx, list[verb], segment, "review_msg_pl_run_on")]'
        else: "[]"
      # The adjectives from `k` on (no noun reading).
      clauseSkipAdjectives:
        args: "list: readonly PlReadWord[], k: number"
        type: number
        return: "k < list.length && plAdjectiveOf(list[k].lower) && !plNounTags(list[k].lower) ? clauseSkipAdjectives(list, k + 1) : k"
      # The "to" at `at` answers a conditional clause opening the segment, not a pronoun: not right
      # after the verb ("Jeśli zrobisz to dobrze") and not before a neuter noun ("to zdjęcie").
      clauseCorrelativeTo:
        args: "list: readonly PlReadWord[], verb: number, at: number"
        let:
          first: "/^(?:a|i|ale|lecz)$/u.test(list[0].lower) ? 1 : 0"
          k: clauseSkipAdjectives(list, at + 1)
          tags: "list[k] ? plNounTags(list[k].lower) : 0"
        when:
          - list[at].lower === "to" && at > verb + 1
          - CLAUSE_CONDITIONAL.test(list[first].lower) && first < verb
          - "!list.slice(first + 1, verb).some((w) => clauseJoins(w.lower) && !CLAUSE_COORDINATE.test(w.lower))"
        return: '!(plOnlyNoun(tags) && tagsAnd(tags, PL_NEUTER) && tagsAnd(tags, plCases("Ns As")))'
        else: "false"
      clauseRunOns:
        args: "ctx: DetectContext, list: readonly PlReadWord[], segment: readonly [number, number], afterComma: boolean"
        return: "clauseRunOnFrom(ctx, list, segment, afterComma, list.flatMap((w, i) => (w.verb ? [i] : [])), 1)"
      # The first run-on from the verb pair `k` on: two clause verbs with no comma or conjunction
      # between them.
      clauseRunOnFrom:
        args: "ctx: DetectContext, list: readonly PlReadWord[], segment: readonly [number, number], afterComma: boolean, verbs: readonly number[], k: number"
        type: RawFinding[]
        return: >-
          k >= verbs.length ? [] : clauseRunOnPair(ctx, list, segment, afterComma, verbs, k) ??
          clauseRunOnFrom(ctx, list, segment, afterComma, verbs, k + 1)
      # The findings of one verb pair, or null to read the next pair. "…, który popieram
      # przegrywają": the relative clause closes before the second verb. "Jak się okazało pociąg
      # odjechał": the aside's own comma frame asks for it. "Jeżeli pada deszcz to rano są
      # kałuże": "to" answering a conditional opener. Two present forms may hide a noun or an
      # adjective ("bawię się muszą nóżką"). "Marek czytał a Jurek pisał": a contrasting "a"
      # between clauses takes a comma; not "między domem a szkołą".
      clauseRunOnPair:
        args: "ctx: DetectContext, list: readonly PlReadWord[], segment: readonly [number, number], afterComma: boolean, verbs: readonly number[], k: number"
        type: RawFinding[] | null
        let:
          a: verbs[k - 1]
          b: verbs[k]
          relative: >-
            afterComma && list.slice(0, Math.min(2, a)).some((w) => CLAUSE_RELATIVE.test(w.lower)) &&
            !list.slice(0, a).some((w) => clauseJoins(w.lower) && !CLAUSE_RELATIVE.test(w.lower))
          between: "list.slice(a + 1, b).flatMap((w, j) => (clauseJoins(w.lower) ? [a + 1 + j] : []))"
          linking: between.filter((j) => !CLAUSE_COORDINATE.test(list[j].lower))
        when:
          - "!clauseCompound(list, a, b, relative)"
          - '!/^jak (?:się )?(?:okazało|widać|wiadomo)$/u.test(list.slice(0, a + 1).map((w) => w.lower).join(" "))'
        return: >-
          list.slice(0, b).some((w) => w.participle) ? []
          : linking.length === 1 && clauseCorrelativeTo(list, a, linking[0])
          ? [clauseCommaBefore(ctx, list, linking[0], segment, "review_msg_pl_run_on", true)]
          : !CLAUSE_CERTAIN.test(list[a].lower) && !CLAUSE_CERTAIN.test(list[b].lower) ? null
          : between.length === 1 && CLAUSE_CONTRAST.test(list[between[0]].lower)
          ? (list.slice(0, between[0]).some((w) => /^(?:po)?między$/u.test(w.lower)) ? null
          : [clauseCommaBefore(ctx, list, between[0], segment, "review_msg_pl_run_on", false)])
          : between.length ? null : clauseRunOnEnd(ctx, list, segment, a, b, relative)
      # The comma goes before the second verb (or its "nie") where the word before ends the
      # relative clause for sure: its verb, an infinitive, a noun or an adjective.
      clauseRunOnEnd:
        args: "ctx: DetectContext, list: readonly PlReadWord[], segment: readonly [number, number], a: number, b: number, relative: boolean"
        let:
          start: 'list[b - 1].lower === "nie" && b - 1 > a ? b - 1 : b'
          last: list[start - 1].lower
        return: >-
          relative && (start - 1 === a || CLAUSE_INFINITIVE.test(last) || tagsAnd(plNounTags(last), PL_ALL_CASES) ||
          plAdjectiveOf(last) !== null)
          ? [clauseCommaBefore(ctx, list, start, segment, "review_msg_pl_run_on", true)]
          : [clauseWarning(ctx, list[b], segment, "review_msg_pl_run_on")]
    frames:
      # A stretch of one sentence with no punctuation inside (a spaced " - " is a dash). The scan
      # starts 400 characters before the chunk; the fixer reads the clause boundaries from its verbs.
      - regex: "(?:[^,;:.!?\\u2026()[\\]{}\"\\u201E\\u201D\\u201C\\u00AB\\u00BB\\u201A\\u2018\\u2019'\\u2014\\u2013\\n-]|(?<=\\S)-|-(?=\\S))+"
        scan: owned
        lookback: 400
        flags: gu
        let:
          end: m.index + m[0].length
          base: plWords(m[0], m.index)
          list: >-
            base.map((w, i) => ({ ...w, verb: clauseVerbAt(base, i), participle:
            clauseAdverbialParticiple(w.lower) }))
          segment: "[m.index, end] as const"
        when:
          - "!(end <= ctx.from || namedExampleBefore(ctx.text, m.index))"
          - base.length >= 3
        return: >-
          [...clauseParticiples(ctx, list, segment), ...clausePurposeOpeners(ctx, list, segment),
          ...clauseRunOns(ctx, list, segment, ctx.text[m.index - 1] === ",")]
          .filter((finding) => finding.range.start >= ctx.from && finding.range.start < ctx.to)
  # Pleonasms and wordy officialese (optional `stylePhrasing`) that need a guard.
  - id: pl.style
    checks: [stylePhrasing]
    style: match
    message: review_msg_style_phrasing
    maps:
      # The plural case a numeral puts its noun in, by the numeral's own form.
      STYLE_OR_MORE_CASE:
        {
          dwa: Np,
          dwie: Np,
          trzy: Np,
          cztery: Np,
          dwom: Dp,
          dwóm: Dp,
          trzem: Dp,
          czterem: Dp,
          dwoma: Ip,
          trzema: Ip,
          czterema: Ip,
          dwóch: Gp,
          trzech: Gp,
          czterech: Gp,
          pięć: Gp,
          pięciu: Gp,
        }
      # The adjective ending of a non-virile plural in each case.
      STYLE_PLURAL_ENDING: { Np: e, Gp: ych, Dp: ym, Ip: ymi, Lp: ych }
      # "pełnić" goes with a function; a role is played ("odgrywać rolę").
      STYLE_PLAYS:
        pełni: odgrywa
        pełnią: odgrywają
        pełnił: odgrywał
        pełniła: odgrywała
        pełniło: odgrywało
        pełnili: odgrywali
        pełniły: odgrywały
        pełnić: odgrywać
        pełniący: odgrywający
        pełniąca: odgrywająca
        pełniące: odgrywające
        pełniąc: odgrywając
        spełnia: odgrywa
        spełniają: odgrywają
        spełniał: odgrywał
        spełniała: odgrywała
        spełniać: odgrywać
        spełniając: odgrywając
      # "posiadać" is owning; a beard, a talent or a sister one simply has ("ma brodę").
      STYLE_HAS:
        posiadam: mam
        posiadasz: masz
        posiada: ma
        posiadamy: mamy
        posiadacie: macie
        posiadają: mają
        posiadał: miał
        posiadała: miała
        posiadali: mieli
        posiadały: miały
        posiadać: mieć
        posiadając: mając
      # "ubrać" dresses someone; a garment one puts on ("włożyć płaszcz"). "założyć" fastens
      # (glasses, a watch); clothes one puts on ("włożyć buty").
      STYLE_PUTS_ON:
        ubrać: włożyć
        ubrał: włożył
        ubrała: włożyła
        ubrali: włożyli
        ubrały: włożyły
        ubrałem: włożyłem
        ubrałam: włożyłam
        ubiorę: włożę
        ubierze: włoży
        ubierz: włóż
        ubieram: wkładam
        ubiera: wkłada
        ubierają: wkładają
        ubierał: wkładał
        ubierała: wkładała
        ubierać: wkładać
        założyć: włożyć
        założył: włożył
        założyła: włożyła
        założyli: włożyli
        założyły: włożyły
        założyłem: włożyłem
        założyłam: włożyłam
        założyłeś: włożyłeś
        założyłaś: włożyłaś
        założyliśmy: włożyliśmy
        założyłyśmy: włożyłyśmy
        założę: włożę
        założy: włoży
        założysz: włożysz
        założymy: włożymy
        założycie: włożycie
        założą: włożą
        zakłada: wkłada
        zakładać: wkładać
        zakładał: wkładał
        zakładała: wkładała
        zakładali: wkładali
        zakładały: wkładały
        zakładam: wkładam
        zakładasz: wkładasz
        zakładają: wkładają
        zakładamy: wkładamy
        zakładacie: wkładacie
        załóż: włóż
        załóżcie: włóżcie
    defs:
      # A genitive plural adjective at `i`: "wieczornych godzin", "godzin wieczornych".
      orMoreAdjective:
        args: "tokens: RegExpExecArray[], i: number"
        return: 'i < tokens.length && !plNounTags(tokens[i][0]) && plAdjectiveOf(tokens[i][0])?.ending === "ych"'
      # The first index from `i` on that holds no such adjective.
      orMoreSkip:
        args: "tokens: RegExpExecArray[], i: number"
        type: number
        return: "orMoreAdjective(tokens, i) ? orMoreSkip(tokens, i + 1) : i"
      orMorePlural:
        args: "adj: string, wanted: string"
        return: plAdjectiveForm(plAdjectiveOf(adj)!.lemma, STYLE_PLURAL_ENDING[wanted])
      # The noun (and its adjectives) in the numeral's case: the fix and where it ends. None when
      # they cannot be read; an unknown "-ych" word after the phrase may be one more adjective.
      orMoreFix:
        args: "tokens: RegExpExecArray[], at: number, noun: string, tags: number, wanted: string, head: string, wordsStart: number"
        let:
          forms: "tagsAnd(tags, plCases(wanted)) ? [noun] : plInflect(noun, plCases(wanted))"
          last: orMoreSkip(tokens, at + 1) - 1
          unread: '/(?:ych|ich)$/u.test(tokens[last + 1]?.[0] ?? "") && !orMoreAdjective(tokens, last + 1)'
        when: forms.length === 1 && !unread
        return: >-
          ({ fixed: [head, ...tokens.slice(0, at).map((t) => orMorePlural(t[0], wanted)), forms[0],
          ...tokens.slice(at + 1, last + 1).map((t) => orMorePlural(t[0], wanted))].join(" "),
          end: wordsStart + tokens[last].index + tokens[last][0].length })
      # An opt-in style finding on `start`-`end`, each fix in the typed case; none on a user's word.
      styleFinding:
        args: "ctx: DetectContext, start: number, end: number, fixes: string[]"
        let:
          typed: ctx.source.slice(start, end)
        when: "!plUserOrNamed(ctx, typed)"
        return: plFindingAt(ctx, start, end, fixes.map((fix) => plCaseLike(typed, fix)), "stylePhrasing", "review_msg_style_phrasing")
    frames:
      # "dwie lub więcej godzin" mixes two governments: "co najmniej dwie godziny". The noun (and its
      # adjectives) follow the numeral's case; when they cannot be read, only the numeral is fixed.
      - regex: "(?<![\\p{L}\\p{N}_'’-])(?<numeral>dwa|dwie|trzy|cztery|dwom|dwóm|trzem|czterem|dwoma|trzema|czterema|dwóch|trzech|czterech|pięć|pięciu){{S}}lub{{S}}więcej(?<words>(?:{{S}}\\p{L}+){0,3})(?![\\p{L}\\p{N}_'’-])"
        scan: polish
        flags: giu
        let:
          baseWanted: STYLE_OR_MORE_CASE[numeral.toLowerCase()]
          # "w dwóch lub więcej krajów": the locative after "w", "o", "na", "przy", "po".
          wanted: >-
            baseWanted === "Gp" && /(?:^|[^\p{L}])(?:w|we|o|na|przy|po)[ \t ]+$/iu.test(ctx.text.slice(Math.max(0,
            m.index - 8), m.index)) ? "Lp" : baseWanted
          wordsStart: m.index + m[0].length - words.length
          head: '"co najmniej " + numeral'
          tokens: '[...words.matchAll(/\p{L}+/gu)]'
          # Genitive plural adjectives before the noun: "wieczornych godzin".
          at: orMoreSkip(tokens, 0)
          noun: 'tokens[at]?.[0] ?? ""'
          tags: plNounTags(noun)
          fix: >-
            plOnlyNoun(tags) && tagsAnd(tags, plCases("Gp")) && !(wanted === "Np" && tagsAnd(tags, PL_VIRILE))
            ? orMoreFix(tokens, at, noun, tags, wanted, head, wordsStart) : null
          end: "fix ? fix.end : wordsStart"
          typed: ctx.source.slice(m.index, end)
        when: "!plUserOrNamed(ctx, typed)"
        return: >-
          plFindingAt(ctx, m.index, end, [plCaseLike(typed, fix ? fix.fixed : head)], "stylePhrasing",
          "review_msg_style_phrasing")
      # Opt-in: "pełni istotną rolę" -> "pełni istotną funkcję" or "odgrywa istotną rolę".
      - regex: "(?<![\\p{L}\\p{N}_'’-])(?:(?<verb>pełni|pełnią|pełnił|pełniła|pełniło|pełnili|pełniły|pełnić|pełniący|pełniąca|pełniące|pełniąc|spełnia|spełniają|spełniał|spełniała|spełniać|spełniając)(?<mid>{{FILLER}}){{S}}(?<noun>rolę|roli)|(?<before>rolę|roli){{S}}(?<after>pełni|pełnią|pełnił|pełniła|pełniło|pełnili|pełniły|pełnić|pełniący|pełniąca|pełniące|pełniąc|spełnia|spełniają|spełniał|spełniała|spełniać|spełniając))(?![\\p{L}\\p{N}_'’-])"
        scan: polish
        flags: giu
        let:
          end: m.index + m[0].length
        return: >-
          verb ? styleFinding(ctx, m.index, end, [verb + mid + " " + (noun.toLowerCase() === "rolę" ? "funkcję" : "funkcji"),
          STYLE_PLAYS[verb.toLowerCase()] + mid + " " + noun])
          : styleFinding(ctx, m.index, end, [(before.toLowerCase() === "rolę" ? "funkcję" : "funkcji") + " " + after,
          before + " " + STYLE_PLAYS[after.toLowerCase()]])
      # "ubrać płaszcz", "założyć buty": clothes one puts on ("włożyć").
      - regex: "(?<![\\p{L}\\p{N}_'’-])(?<verb>ubrać|ubrał|ubrała|ubrali|ubrały|ubrałem|ubrałam|ubiorę|ubierze|ubierz|ubieram|ubiera|ubierają|ubierał|ubierała|ubierać|założyć|założył|założyła|założyli|założyły|założyłem|założyłam|założyłeś|założyłaś|założyliśmy|założyłyśmy|założę|założy|założysz|założymy|założycie|założą|zakłada|zakładać|zakładał|zakładała|zakładali|zakładały|zakładam|zakładasz|zakładają|zakładamy|zakładacie|załóż|załóżcie)(?<mid>{{FILLER}}){{S}}(?<noun>{{GARMENTS}})(?![\\p{L}\\p{N}_'’-])"
        scan: polish
        flags: giu
        return: 'styleFinding(ctx, m.index, m.index + m[0].length, [STYLE_PUTS_ON[verb.toLowerCase()] + mid + " " + noun])'
      # "napotkać na trudności": one meets difficulties without "na" ("na drodze" stays).
      - regex: "(?<![\\p{L}\\p{N}_'’-])(?<verb>napot(?:kać|kał\\p{L}*|kali\\p{L}*|ka|kają|kasz|kam|ykać|yka|ykają|ykał\\p{L}*|ykali\\p{L}*)){{S}}na(?<rest>(?:{{S}}\\p{L}+(?:e|ie|y|i|ą))?{{S}}(?:trudności|trudność|problem|problemy|przeszkody|przeszkodę|opór|sprzeciw|kłopoty))(?![\\p{L}\\p{N}_'’-])"
        scan: polish
        flags: giu
        return: styleFinding(ctx, m.index, m.index + m[0].length, [verb + rest])
      # "pięcioletnia rocznica", "20-letni jubileusz": the noun counts years already ("piąta rocznica").
      - regex: "(?<![\\p{L}\\p{N}_'’-])(?<target>(?:\\d+-|\\p{L}+)letni(?:a|ej|ą|ego|emu|m|e|ch|mi)?){{S}}(?:rocznic|jubileusz|urodzin)\\p{L}*(?![\\p{L}\\p{N}_'’-])"
        scan: polish
        flags: gdiu
        return: styleFinding(ctx, m.indices!.groups!.target[0], m.indices!.groups!.target[1], [])
      # "posiada brodę" -> "ma brodę".
      - regex: "(?<![\\p{L}\\p{N}_'’-])(?<verb>posiadam|posiadasz|posiada|posiadamy|posiadacie|posiadają|posiadał|posiadała|posiadali|posiadały|posiadać|posiadając)(?<mid>{{FILLER}}){{S}}(?<noun>{{FEATURES}})(?![\\p{L}\\p{N}_'’-])"
        scan: polish
        flags: giu
        return: 'styleFinding(ctx, m.index, m.index + m[0].length, [STYLE_HAS[verb.toLowerCase()] + mid + " " + noun])'
  - id: pl.styleFrames
    checks: [stylePhrasing]
    style: polish
    message: review_msg_style_phrasing
    maps:
      STYLE_POD_OBJECT:
        {
          pojęciem: pojęcie,
          terminem: termin,
          słowem: słowo,
          określeniem: określenie,
          hasłem: hasło,
        }
    frames:
      # "w przeciągu dwóch lat", "na przestrzeni 5 lat": a time span is "w ciągu".
      - regex: "(?<target>w{{S}}przeciągu|na{{S}}przestrzeni|przez{{S}}przeciąg)(?={{S}}(?:{{NUMERAL}}){{S}}(?:{{TIME_UNIT}}){{E}})"
        fix: "w ciągu"
      # "odnośnie tego" -> "odnośnie do tego".
      - regex: "(?<target>odnośnie)(?={{S}}(?!do{{E}})\\p{L})"
        fix: "odnośnie do"
      # "tak długo, dopóki" blends "tak długo, jak" and "dopóty, dopóki".
      - regex: "(?<target>tak{{S}}długo)(?=(?:{{S}}[^\\s,.!?;:]{1,20}){0,4},?{{S}}dopóki{{E}})"
        fix: "dopóty"
      # "tam pisało, że" is colloquial: "tam było napisane" ("tam się pisało" is impersonal).
      - regex: "(?<=(?<!się)(?:^|[^\\p{L}])(?:tam|(?:w|na){{S}}\\p{L}{2,20}){{S}})(?<target>pisało)(?=,?{{S}}że{{E}})"
        fix: "było napisane"
      # "nie tyle …, ile": "ale" does not close the pair ("nie tyle co" is "not so much").
      - regex: "(?<target>ale)(?<=(?:^|[^\\p{L}])nie{{S}}tyle(?!{{S}}co{{E}})(?:{{S}}[^\\s,.!?;:]{1,20}){1,6},{{S}}ale)(?={{S}}\\p{L})"
        fix: "ile"
      # "zarówno …, jak i": "jak również" does not close the pair.
      - regex: "(?<target>jak{{S}}również)(?<=zarówno(?:{{S}}[^\\s.!?;:]{1,20}){1,6}{{S}}jak{{S}}również){{E}}"
        fix: "jak i"
      # "rozumieć pod tym" is a calque: "rozumieć przez to".
      - regex: "(?<target>pod{{S}}tym(?:{{S}}(?:pojęciem|terminem|słowem|określeniem|hasłem))?)(?<=rozumi\\p{L}{0,6}(?:{{S}}\\p{L}{2,12}){0,2}{{S}}pod{{S}}tym(?:{{S}}\\p{L}{5,11})?){{E}}"
        let:
          noun: '/\p{L}+$/u.exec(target)![0].toLowerCase()'
        return: 'noun === "tym" ? "przez to" : "przez to " + STYLE_POD_OBJECT[noun]'
      # One clicks a link, not "on" it: "kliknij link".
      - regex: "(?<target>(?:kliknij|kliknijcie|kliknąć|kliknął|kliknęła|kliknęli|kliknę|kliknie|klikamy|klikać|klika|klikasz|klikam|klikając){{S}}na)(?={{S}}(?:{{UI_TARGET}}){{E}})"
        return: 'target.replace(/[ \t ]+na$/iu, "")'
  - id: pl.officialese
    checks: [stylePhrasing]
    style: polish
    message: review_msg_style_phrasing
    defs:
      # "cel podróży" for each case form of "destynacja".
      OFFICIALESE_DESTINATION: >-
        ({ a: "cel podróży", ę: "cel podróży", ą: "celem podróży", i: ["celu podróży", "celów podróży"],
        e: "cele podróży", om: "celom podróży", ami: "celami podróży", ach: "celach podróży" }) as
        Readonly<Record<string, string | string[]>>
    frames:
      # "wiodący" (leading) copies English: "czołowy", "główny". Not "wiodąca do lasu", "wiódł prym".
      - regex: "(?<target>wiodąc(?<end>y|a|e|ego|ej|emu|ą|ym|ych|ymi)){{E}}(?!(?:{{S}}\\p{L}+)?{{S}}(?:{{ROUTE}}){{E}})"
        let:
          ending: end.toLowerCase()
        return: '[plAdjectiveForm("czołowy", ending), plAdjectiveForm("główny", ending)]'
      # "destynacja" copies English: "cel podróży". A singular after an adjective or "ta" keeps
      # its gender, so it is left alone ("ta modna destynacja").
      - regex: "(?=destynacj)(?<!(?:^|[^\\p{L}])(?:\\p{L}{1,20}(?:a|ą|ej)|ta|tę|tą|tej){{S}})(?<target>destynacj(?<end>a|ę|ą|i|e|om|ami|ach)){{E}}"
        return: OFFICIALESE_DESTINATION[end.toLowerCase()]
      # "w terminach temperamentu" copies "in terms of": "w kategoriach".
      - regex: "(?=w{{S}}terminach)(?<=(?:^|[^\\p{L}])(?:{{DESCRIBE}})\\p{L}{0,8}(?:{{S}}\\p{L}{1,20}){0,3}{{S}})(?<target>w{{S}}terminach)(?={{S}}\\p{L})"
        fix: "w kategoriach"
      # A genesis is already how something came to be: "geneza powstania rękopisu" -> "geneza
      # rękopisu". Not the uprisings ("geneza powstania warszawskiego", "Powstania Styczniowego").
      - regex: "(?<target>(?<noun>genez(?:a|y|ie|ę|ą)){{S}}(?<tail>powstania)){{E}}"
        let:
          next: '/^[ \t ]{1,8}(\p{L}+)/u.exec(m.input.slice(m.index + m[0].length))?.[1]'
        when:
          - >-
            !(/^P/u.test(tail) || /^\p{Lu}/u.test(next ?? "") ||
            (/ego$/u.test(next ?? "") && !/^(?:tego|jego|owego)$/iu.test(next!)))
        return: noun
      # Officialese: "na odcinku kultury" -> "w dziedzinie kultury".
      - regex: "(?<target>na{{S}}odcinku)(?={{S}}(?:{{FIELDS}}){{E}})"
        fix: ["w dziedzinie", "w zakresie"]
      # Officialese: "na okoliczność urodzin" -> "z okazji", "w sprawie".
      - regex: "(?<target>na{{S}}okoliczność)(?={{S}}\\p{L})"
        fix: ["w sprawie", "z okazji"]
      # "Generalnie, …" opening a sentence copies "generally": "ogólnie", "zasadniczo".
      - regex: "(?=\\p{L})(?<=(?:^|[.!?…:;][\"”’»)]{0,3}[ \\t\\u00a0\\n]{1,8}|\\n[ \\t\\u00a0]{0,8}))(?<target>generalnie){{E}}"
        fix: ["ogólnie", "zasadniczo"]
      # "Dokładnie!" as a reply copies "Exactly!": "Właśnie", "Owszem".
      - regex: "(?=\\p{L})(?<=(?:^|[.!?…:;][\"”’»)]{0,3}[ \\t\\u00a0\\n]{1,8}|\\n[ \\t\\u00a0]{0,8}))(?<target>dokładnie(?<so>{{S}}tak)?)(?=[ \\t\\u00a0]{0,8}[!.](?![.]))"
        return: 'so ? ["właśnie tak", "owszem"] : ["właśnie", "owszem"]'
      # "i/lub" copies "and/or": "lub" already allows both. Not a path ("i/lub.json").
      - regex: "(?<target>i/lub|lub/i)(?![\\p{L}\\p{N}_/.-])"
        fix: "lub"
      # "cofnął się o krok do tyłu": moving back is already "cofać się".
      - regex: "cof\\p{L}{0,6}{{S}}się(?:{{S}}\\p{L}{1,12}){1,2}(?<target>{{S}}(?:wstecz|do{{S}}tyłu|w{{S}}tył)){{E}}"
        fix: ""
  # Subject and verb: a past form agrees with "on"/"ona" in gender ("ona poszła", not "ona
  # poszedł"), and "został"/"została"/"zostało"/"zostały" with the adjective or participle after
  # it ("zostało zrobione", not "zostało zrobiony").
  - id: pl.subjects
    checks: [polishCaseAgreement]
    style: match
    message: review_msg_pl_subject_verb
    defs:
      subjectPastForm:
        args: "word: string"
        return: plFiniteVerb(word) || plPastByShape(word)
      # The form "zostać" gives the adjective after it: masculine, feminine, neuter or plural.
      SUBJECT_ZOSTAC: "({ został: 0, została: 1, zostało: 2, zostały: 2 }) as Readonly<Record<string, number>>"
      # Plural past forms of verbs that take no direct object, so a plural noun before them is
      # their subject.
      SUBJECT_INTRANSITIVE_PAST: "/^(?:by|bywa|zosta|zostawa|(?:po|przy|wy|w|we|od|ode|do|ze|z|nad|nade|pod|pode)?sz|(?:przy|wy|po|od|do|za)?jecha|przyby|uciek|zniknę|umar|zmar|zginę|spa|siedzie|leże|mieszka|ży|płaka|krzycze|biega|chodzi|przychodzi|wychodzi|wraca|wróci|przyjeżdża|przyleci|odleci|pływa|(?:wy)?roś|zasnę|usnę)(?:li|ły)$/u"
      # Clause openers before a subject; a determiner may stand between ("że te dzieci").
      SUBJECT_OPENS_CLAUSE: '/(?:^|[.!?…:;]["”’»)]{0,3}\s+|\n\s*|(?:^|[^\p{L}])(?:że|gdy|kiedy|bo|ponieważ|jeśli|jeżeli|choć|chociaż|zanim|aż|a|ale|lecz|więc|wtedy|potem|dziś|wczoraj|tam|tu|tutaj)\s+)$/iu'
      # Non-virile plural determiners ("te dzieci", "wszystkie kobiety").
      SUBJECT_PLURAL_DETERMINER: "/^(?:te|tamte|owe|moje|twoje|swoje|nasze|wasze|wszystkie|inne|takie|niektóre|obie|dwie|trzy|cztery)$/iu"
      # Nouns of time and extent that stand in the accusative beside a verb ("całe noce spali").
      SUBJECT_DURATION: "/^(?:godziny|noce|minuty|sekundy|lata|doby|niedziele|soboty|wakacje|ferie|święta|popołudnia|chwile|mile)$/u"
      # Words before a noun that make it a second term, not the subject ("kobiety jak mężczyźni").
      SUBJECT_NOT_SUBJECT_BEFORE: 'new RegExp(`(?:^|[^\\p{L}])(?:jak|niż|jako|niczym|ani|czy|lub|albo|bądź|${PREPOSITIONS})[ \\t\\u00a0]+$`, "iu")'
      # A plural past form, also one that is a noun too ("miały").
      subjectPluralPast:
        args: "word: string"
        return: 'word === "były" || word === "byli" || subjectPastForm(word) || tagsAnd(plNounTags(word), PL_VERB) !== 0'
      # The other plural past form: "-ły" for "-li" and back ("mieli" -> "miały"), when listed.
      subjectOtherPlural:
        args: "verb: string"
        let:
          stem: verb.slice(0, -2)
          forms: >-
            verb.endsWith("li") ? [stem + "ły", ...(stem.endsWith("e") ? [stem.slice(0, -1) + "ały"] : [])]
            : [stem + "li", ...(stem.endsWith("a") ? [stem.slice(0, -1) + "eli"] : [])]
          known: forms.filter((form) => subjectPluralPast(form) || plAdjectiveOf(form))
        return: "known.length === 1 ? known : []"
      # A "-li" past form after a plural noun: feminine and neuter nouns (and "dzieci") only, as a
      # man's noun the lexicon does not mark ("kolarze") must not read as a thing's. An
      # intransitive verb, or a reflexive one after a noun that is no genitive object. The noun
      # opens its clause, after a plural determiner at most.
      subjectVirileVerbFits:
        args: "before: string, lower: string, tags: number, verb: string, reflexive: string | undefined"
        let:
          det: '/(\p{L}+)[ \t ]+$/u.exec(before)'
        when:
          - "!(tagsAnd(tags, tagsOr(PL_MASCULINE, PL_VIRILE)) || SUBJECT_DURATION.test(lower))"
          - SUBJECT_INTRANSITIVE_PAST.test(verb) || (!!reflexive && !tagsAnd(tags, plCases("Gp")) && subjectPastForm(verb))
        return: >-
          SUBJECT_OPENS_CLAUSE.test(before) || (!!det && (SUBJECT_PLURAL_DETERMINER.test(det[1]) ||
          plAdjectiveOf(det[1].toLowerCase())?.ending === "e") && SUBJECT_OPENS_CLAUSE.test(before.slice(0, det.index)))
        else: "false"
      # Only genitives between "większość" and its verb: "z nich", "ludności", "polskich miast".
      subjectGenitive:
        args: "word: string"
        return: >-
          /^(?:z|ze|nich|nas|was|tych|tego|tej|ich|jego|jej|(?:m|tw|sw)oj(?:ej|ego)|(?:m|tw|sw)oich|(?:nasz|wasz)(?:ej|ego|ych))$/u.test(word) ||
          tagsAnd(plNounTags(word), plCases("Gs Gp")) !== 0 || /^(?:ego|ej|ych)$/u.test(plAdjectiveOf(word)?.ending ?? "")
      # An adjective form read through a "nie-" prefix the lexicon does not list ("nieobecne").
      predicateAdjectiveWithNie:
        args: "word: string"
        let:
          adjective: plAdjectiveOf(word)
        return: >-
          adjective || !word.startsWith("nie") ? adjective
          : [plAdjectiveOf(word.slice(3))].map((base) => base && { lemma: "nie" + base.lemma, ending: base.ending })[0]
      predicateVirileLemmaWithNie:
        args: "word: string"
        when: word.length >= 4
        let:
          lemma: plVirileLemma(word)
        return: 'lemma || !word.startsWith("nie") ? lemma : [plVirileLemma(word.slice(3))].map((base) => base && "nie" + base)[0]'
      # "Oficerowie byli nieobecne" -> "nieobecni".
      predicateVirileFix:
        args: "adj: string"
        let:
          adjective: predicateAdjectiveWithNie(adj)
        when: adjective?.ending === "e"
        return: '[plVirileAdjective(adjective.lemma)].filter((virile) => virile !== "")'
      # "Kobiety były zmęczeni" -> "zmęczone".
      predicateOtherFix:
        args: "adj: string"
        let:
          lemma: predicateVirileLemmaWithNie(adj)
        when: "!!lemma && !plAdjectiveOf(adj)"
        return: '[plAdjectiveForm(lemma, "e")]'
      # Words before a future "będzie" + infinitive: its subject, a question word or a time.
      SUBJECT_FUTURE: "/^(?:ja|ty|on|ona|ono|my|wy|oni|one|kto|co|czy|nie|już|też|jutro|wkrótce|zaraz|potem|wtedy|później|dziś|dzisiaj|wieczorem|rano|że|gdy|kiedy|jeśli|i|a|ale)$/iu"
      # "będzie" + infinitive is a future only after its subject or a time word: "Najlepiej będzie
      # wyznać", "Zmuszona będę uciec", "Trzeba to będzie zrobić" use it as a copula. "Pierwszym
      # krokiem będzie wyjechać": an instrumental noun makes "będzie" the copula. "Będą umrzeć
      # musieli": the modal comes after its infinitive.
      aspectFutureFits:
        args: "ctx: DetectContext, m: RegExpExecArray"
        let:
          before: '/(\p{L}+)[ \t ]+$/u.exec(ctx.text.slice(Math.max(0, m.index - 30), m.index))?.[1]'
          tags: "before ? plNounTags(before.toLowerCase()) : 0"
          after: ctx.text.slice(m.index + m[0].length, m.index + m[0].length + 30)
        when:
          - "!(before && !SUBJECT_FUTURE.test(before) && !plOnlyNoun(tags))"
          - '!(tagsAnd(tags, plCases("Is Ip")) && !tagsAnd(tags, plCases("Ns Np")))'
          - '!/^[ \t ]+(?:mus|mog|móg|chci|chcie|mia|mie|potraf|umia|umie)\p{L}*/iu.test(after)'
        return: "true"
        else: "false"
      # Before the word: a comparison ("jak nikt"), a preposition ("za nic", "o nic").
      SUBJECT_NOT_NEGATING_BEFORE: 'new RegExp(`(?:^|[^\\p{L}])(?:jak|niż|niczym|prawie|${PREPOSITIONS})[ \\t\\u00a0]+$`, "iu")'
      # Numerals in the genitive ("od jakichś kilku lat").
      SUBJECT_GENITIVE_COUNT: "/^(?:kilku|paru|kilkunastu|kilkudziesięciu|kilkuset|dwóch|dwu|trzech|czterech|pięciu|sześciu|siedmiu|ośmiu|dziewięciu|dziesięciu|stu|tysięcy|wielu|niewielu)$/u"
      SUBJECT_SINGULAR_DIRECT: plCases("Ns As Gs Ds Is Ls Vs Np")
      SUBJECT_PLURAL_OBLIQUE: plCases("Gp Lp")
    frames:
      # "on poszła", "ona przyszedł": the pronoun disagrees with the past form's gender.
      - regex: "(?<![\\p{L}\\p{N}_'’@/-])(?<pronoun>on|ona){{S}}{{BETWEEN}}(?<verb>\\p{L}{2,}ł(?<fem>a)?)(?![\\p{L}\\p{N}_'’@/-])"
        scan: polish
        flags: gdiu
        let:
          feminine: pronoun.toLowerCase() === "ona"
        when: "!(feminine === !!fem || !subjectPastForm(verb.toLowerCase()) || plUserOrNamed(ctx, verb))"
        return: >-
          ({ ...plFindingAt(ctx, m.indices!.groups!.pronoun[0], m.indices!.groups!.pronoun[1],
          [plCaseLike(pronoun, feminine ? "on" : "ona")], "polishCaseAgreement", "review_msg_pl_subject_verb"),
          context: { start: m.index, end: m.index + m[0].length } })
      # "Przywróciła on pokój": the verb opens the clause, the pronoun follows it.
      - regex: "(?=\\p{L})(?<=(?:^|[.!?…:;][\"”’»)]{0,3}[ \\t\\u00a0\\n]{1,8}|\\n[ \\t\\u00a0]{0,8}))(?<verb>\\p{L}{3,}ł(?<fem>a)?){{S}}(?<pronoun>on|ona)(?![\\p{L}\\p{N}_'’@/-])"
        scan: polish
        flags: gdu
        let:
          feminine: pronoun.toLowerCase() === "ona"
        when: "!(feminine === !!fem || !subjectPastForm(verb.toLowerCase()) || plUserOrNamed(ctx, verb))"
        return: >-
          ({ ...plFindingAt(ctx, m.indices!.groups!.pronoun[0], m.indices!.groups!.pronoun[1],
          [plCaseLike(pronoun, feminine ? "on" : "ona")], "polishCaseAgreement", "review_msg_pl_subject_verb"),
          context: { start: m.index, end: m.index + m[0].length } })
      # "zostało zrobiony" -> "zrobione": the nominative after "zostać" takes the verb's gender.
      - regex: "(?<![\\p{L}\\p{N}_'’@/-])(?<aux>{{ZOSTAC}}){{S}}(?<word>\\p{L}{3,})(?![\\p{L}\\p{N}_'’@/-])"
        scan: polish
        flags: gdiu
        let:
          lower: word.toLowerCase()
          adjective: plAdjectiveOf(lower)
          forms: '[adjective.lemma, plAdjectiveForm(adjective.lemma, "a"), plAdjectiveForm(adjective.lemma, "e")]'
          wanted: SUBJECT_ZOSTAC[aux.toLowerCase()]
        when:
          - adjective !== null && !plUserOrNamed(ctx, word) && !plOnlyNoun(plNounTags(lower))
          - forms.includes(lower)
          - forms[wanted] !== lower
        return: >-
          ({ ...plFindingAt(ctx, m.indices!.groups!.word[0], m.indices!.groups!.word[1],
          [plCaseLike(word, forms[wanted])], "polishCaseAgreement", "review_msg_pl_subject_verb"),
          context: { start: m.index, end: m.index + m[0].length } })
      # "Zrobiony zostało": the participle opens the clause.
      - regex: "(?=\\p{L})(?<=(?:^|[.!?…:;][\"”’»)]{0,3}[ \\t\\u00a0\\n]{1,8}|\\n[ \\t\\u00a0]{0,8}))(?<word>\\p{L}{3,}){{S}}(?<aux>{{ZOSTAC}})(?![\\p{L}\\p{N}_'’@/-])"
        scan: polish
        flags: gdu
        let:
          lower: word.toLowerCase()
          adjective: plAdjectiveOf(lower)
          forms: '[adjective.lemma, plAdjectiveForm(adjective.lemma, "a"), plAdjectiveForm(adjective.lemma, "e")]'
          wanted: SUBJECT_ZOSTAC[aux.toLowerCase()]
        when:
          - adjective !== null && !plUserOrNamed(ctx, word) && !plOnlyNoun(plNounTags(lower))
          - forms.includes(lower)
          - forms[wanted] !== lower
        return: >-
          ({ ...plFindingAt(ctx, m.indices!.groups!.word[0], m.indices!.groups!.word[1],
          [plCaseLike(word, forms[wanted])], "polishCaseAgreement", "review_msg_pl_subject_verb"),
          context: { start: m.index, end: m.index + m[0].length } })
      # A plural subject and its past form: men take "-li" ("studenci przyszli"), everyone and
      # everything else "-ły" ("dzieci przyszły"): "Dzieci byli tutaj" -> "były". The fixer resumes the
      # scan at the noun's end.
      - regex: "(?<![\\p{L}\\p{N}_'’@/.-])(?<noun>\\p{L}{3,}){{S}}{{BETWEEN}}(?<verb>\\p{Ll}{2,}(?:li|ły))(?![\\p{L}\\p{N}_'’@/-])(?<reflexive>{{S}}się)?"
        scan: polish
        flags: gdu
        let:
          _resumed: frame.resume!(m.index + noun.length)
          lower: noun.toLowerCase()
          tags: plNounTags(lower)
          before: ctx.text.slice(Math.max(0, m.index - 40), m.index)
        when:
          - plOnlyNoun(tags) && tagsAnd(tags, plCases("Np")) !== 0 && !plUserOrNamed(ctx, noun + " " + verb)
          - '!(/\p{Lu}/u.test(noun[0]) && !plSentenceStart(ctx.text, m.index))'
          - "!SUBJECT_NOT_SUBJECT_BEFORE.test(before)"
          # A man's plural that is no accusative or singular form ("studenci", "ludzie"; not "metry").
          - >-
            verb.endsWith("li") ? subjectVirileVerbFits(before, lower, tags, verb, reflexive)
            : plMenOnlyPlural(lower) && !tagsAnd(tags, plCases("Ns Gs As Ap")) && subjectPluralPast(verb)
        return: >-
          ({ ...plFindingAt(ctx, m.indices!.groups!.verb[0], m.indices!.groups!.verb[1],
          subjectOtherPlural(verb.toLowerCase()), "polishCaseAgreement", "review_msg_pl_subject_verb"),
          context: { start: m.index, end: m.indices!.groups!.verb[1] } })
      # "Pływanie nie są zdrowe": "są" after a singular subject opening its clause. The fixer
      # resumes the scan at the noun's end.
      - regex: "(?<![\\p{L}\\p{N}_'’@/.-])(?<noun>\\p{L}{3,}){{S}}(?:nie{{S}})?(?<verb>są)(?![\\p{L}\\p{N}_'’@/-])"
        scan: polish
        flags: gdiu
        let:
          _resumed: frame.resume!(m.index + noun.length)
          lower: noun.toLowerCase()
          tags: plNounTags(lower)
        when:
          - '!(!plOnlyNoun(tags) || !tagsAnd(tags, plCases("Ns")) || tagsAnd(tags, PL_PLURAL) || /stwo$/u.test(lower))'
          - SUBJECT_OPENS_CLAUSE.test(ctx.text.slice(Math.max(0, m.index - 40), m.index))
          - "!plUserOrNamed(ctx, noun)"
        return: >-
          ({ ...plFindingAt(ctx, m.indices!.groups!.verb[0], m.indices!.groups!.verb[1], [],
          "polishCaseAgreement", "review_msg_pl_subject_verb"),
          context: { start: m.index, end: m.indices!.groups!.verb[1] } })
      # "Większość (ludności kraju) było" -> "była": before "być" or "zostać", which take no object,
      # "większość" is the subject, a feminine singular.
      - regex: "(?<![\\p{L}\\p{N}_'’@/-])większość(?<between>(?:{{S}}\\p{L}+){0,3}?){{S}}(?<verb>było|zostało|pozostało)(?![\\p{L}\\p{N}_'’@/-])"
        scan: polish
        flags: gdiu
        let:
          words: 'between.match(/\p{L}+/gu) ?? []'
          next: '/^[ \t ]+(\p{L}+)/u.exec(ctx.text.slice(m.index + m[0].length))?.[1]'
        when:
          # Only genitives between: "z nich", "ludności", "polskich miast".
          - words.every((word) => subjectGenitive(word.toLowerCase()))
          # "(Przez) większość czasu było zimno": a span of time before an impersonal predicate.
          - "!SUBJECT_NOT_SUBJECT_BEFORE.test(ctx.text.slice(Math.max(0, m.index - 40), m.index))"
          - "!(next && /o$/u.test(next) && !plOnlyNoun(plNounTags(next.toLowerCase())))"
        return: >-
          ({ ...plFindingAt(ctx, m.indices!.groups!.verb[0], m.indices!.groups!.verb[1],
          [plCaseLike(verb, verb.slice(0, -1) + "a")], "polishCaseAgreement", "review_msg_pl_subject_verb"),
          context: { start: m.index, end: m.indices!.groups!.verb[1] } })
      # "będzie zrobić", "będzie zrobił", "zaczął napisać": the compound future's "być" and the phase
      # verbs take an imperfective infinitive.
      - regex: "(?<![\\p{L}\\p{N}_'’@/-])(?<aux>będ(?:ę|ziesz|zie|ziemy|ziecie|ą)|zacz(?:ął|ęła|ęło|ęli|ęły|nę|niesz|nie|niemy|niecie|ną)|zaczyna\\p{L}*|przesta\\p{L}*|przestanie|kończy\\p{L}*|skończy\\p{L}*){{S}}(?:(?:się|nie|to|go|ją|je|mu|mi|jej|im|ci|już|znowu|znów){{S}}){0,2}(?<verb>\\p{L}{4,})(?![\\p{L}\\p{N}_'’@/-])"
        scan: polish
        flags: gdiu
        let:
          future: /^będ/iu.test(aux)
          lower: verb.toLowerCase()
        when:
          # The future takes an infinitive or a past form; the phase verbs only an infinitive.
          - "!(!future && !/[ćc]$/u.test(verb))"
          # "będzie dojrzały": a past form that is also an adjective is the predicate.
          - "!(!/[ćc]$/u.test(lower) && (plAdjectiveOf(lower) || plNounTags(lower)))"
          - "!(!plPerfectiveVerb(verb.toLowerCase()) || plUserOrNamed(ctx, verb))"
          - "!(future && /[ćc]$/u.test(lower)) || aspectFutureFits(ctx, m)"
        return: >-
          ({ ...plFindingAt(ctx, m.indices!.groups!.verb[0], m.indices!.groups!.verb[1], [],
          "polishCaseAgreement", "review_msg_pl_aspect"),
          context: { start: m.index, end: m.indices!.groups!.verb[1] } })
      # "Nigdy tego zrobiłam", "Nikt przyszedł": a negative pronoun or adverb without "nie".
      - regex: "(?<![\\p{L}\\p{N}_'’@/-])(?<neg>nigdy|nikt|nikogo|nikomu|niczego|nigdzie|nic){{S}}(?:(?:tego|to|go|ją|je|mu|mi|jej|im|nam|wam|ci|się|już|tam|tu){{S}}){0,2}(?<verb>\\p{L}{2,})(?![\\p{L}\\p{N}_'’@/-])"
        scan: polish
        flags: gdiu
        when:
          - plFiniteVerb(verb) || plPastByShape(verb)
          - "!SUBJECT_NOT_NEGATING_BEFORE.test(ctx.text.slice(Math.max(0, m.index - 24), m.index))"
          - "!plUserOrNamed(ctx, verb)"
        return: >-
          ({ ...plFindingAt(ctx, m.indices!.groups!.verb[0], m.indices!.groups!.verb[1], ["nie " + verb],
          "polishCaseAgreement", "review_msg_pl_double_negation"),
          context: { start: m.index, end: m.indices!.groups!.verb[1] } })
      # "Oficerowie byli nieobecne" -> "nieobecni", "Kobiety były zmęczeni" -> "zmęczone": a plural
      # "być" or "zostać" and the adjective that ends its clause.
      - regex: "(?<![\\p{L}\\p{N}_'’@/-])(?<verb>(?:by|zosta)(?:li|ły)(?:śmy|ście)?){{S}}(?:(?:bardzo|już|nadal|wciąż|też|także|również|zawsze|naprawdę|zbyt|całkiem|zupełnie|wtedy|tam|tu){{S}})?(?<adj>\\p{L}{4,})(?=[ \\t\\u00a0]{0,8}(?:[.,;:!?…)]|$|(?:i|oraz|a|ale)[ \\t\\u00a0]))"
        scan: polish
        flags: gdiu
        let:
          virileVerb: /li/u.test(verb.toLowerCase())
          # A subject of the other gender before the verb ("Dzieci byli zmęczone"): the verb is what
          # disagrees (pluralSubjects), not the adjective.
          word: '/(\p{L}+)[ \t ]+$/u.exec(ctx.text.slice(Math.max(0, m.index - 30), m.index))?.[1].toLowerCase() ?? ""'
          subject: plNounTags(word)
          fixes: "virileVerb ? predicateVirileFix(adj) : predicateOtherFix(adj)"
        when:
          - "!(tagsAnd(plNounTags(adj), PL_ALL_CASES) || plAmbiguousAdjective(adj) || plUserOrNamed(ctx, adj))"
          # A thing's plural the lexicon also reads as men's ("praktyki", "powody") is no man's; a man's
          # noun it does not mark ("kolarze") still has a man's shape.
          - >-
            !(plOnlyNoun(subject) && tagsAnd(subject, plCases("Np")) && (virileVerb
            ? !(plMenOnlyPlural(word) || (tagsAnd(subject, PL_MASCULINE) && plMenPluralShape(word)))
            : plMenOnlyPlural(word)))
          - fixes !== null
        return: >-
          ({ ...plFindingAt(ctx, m.indices!.groups!.adj[0], m.indices!.groups!.adj[1], fixes,
          "polishCaseAgreement", "review_msg_pl_agreement"),
          context: { start: m.index, end: m.indices!.groups!.adj[1] } })
      # "jakiś dziewczyn", "od jakiś kilku lat" -> "jakichś": the genitive or locative plural.
      - regex: "(?<![\\p{L}\\p{N}_'’@/-])(?<target>jakiś){{S}}(?<next>\\p{L}{3,})(?![\\p{L}\\p{N}_'’@/-])"
        scan: polish
        flags: gdiu
        let:
          tags: plNounTags(next.toLowerCase())
        when:
          - >-
            SUBJECT_GENITIVE_COUNT.test(next.toLowerCase()) || (plOnlyNoun(tags) &&
            tagsAnd(tags, SUBJECT_PLURAL_OBLIQUE) !== 0 && !tagsAnd(tags, SUBJECT_SINGULAR_DIRECT))
          - "!plUserOrNamed(ctx, next)"
        return: >-
          ({ ...plFindingAt(ctx, m.indices!.groups!.target[0], m.indices!.groups!.target[1],
          [plCaseLike(target, "jakichś")], "polishCaseAgreement", "review_msg_pl_agreement"),
          context: { start: m.index, end: m.index + m[0].length } })
  - id: pl.typosFrames
    checks: [englishPhraseCorrections]
    style: polish
    message: review_msg_contextual_grammar
    frames:
      # "prze" alone is only the verb "przeć" (push on), which takes no adjective and no "siebie":
      # "prze piękny" -> "przepiękny", "prze siebie" -> "przed siebie", "prze ze mnie" -> "przeze".
      - regex: "(?<target>prze{{S}}(?<word>\\p{L}{3,})){{E}}"
        let:
          adjective: plAdjectiveOf(word)
        when: word === word.toLowerCase()
        return: >-
          word === "siebie" ? ["przed siebie", "przez siebie"] : word === "zemnie" ? "przeze mnie"
          : adjective && !plAmbiguousAdjective(word) && adjective.ending !== "ą" ? "prze" + word : null
      - regex: "(?<target>prze{{S}}ze)(?={{S}}mnie{{E}})"
        fix: "przeze"
      # "wzdłuż polnej drużki" -> "dróżki": a path ("dróżka"), not a bridesmaid ("drużka").
      - regex: "(?=drużk)(?<=(?:^|[^\\p{L}])(?:wzdłuż|poln|leśn|wąsk|błotnist|kamienist|kręt|piaszczyst|wydeptan|górsk)\\p{L}{0,3}{{S}})(?<target>drużk(?<end>a|i|ę|ą|ce|ami|om|ach)){{E}}"
        return: '"dróżk" + end'
      # "dwóch wierz", "oprócz wierz" -> "wież": the genitive plural of "wieża", not "wierz" (believe).
      - regex: "(?=wierz)(?<=(?:^|[^\\p{L}])(?:dwóch|dwu|trzech|czterech|pięciu|sześciu|kilku|kilkunastu|kilkudziesięciu|wielu|paru|oprócz|spośród|wśród){{S}})(?<target>wierz){{E}}"
        fix: "wież"
      # "kity do podług" -> "podłóg" (floors): no preposition stands after "do".
      - regex: "(?=podług)(?<=(?:^|[^\\p{L}])(?:do|dla|kilku|wielu|dwóch|trzech|czterech|pięciu){{S}})(?<target>podług){{E}}"
        fix: "podłóg"
      # "ciszej nisz przednie" -> "niż": a comparison ("-ej", "-szy"), not niches.
      - regex: "(?=nisz)(?<=(?:^|[^\\p{L}])(?:\\p{L}{2,16}ej|\\p{L}{1,14}sz[yae]){{S}})(?<target>nisz){{E}}"
        fix: "niż"
      # "Skłam serdeczne życzenia" -> "Składam".
      - regex: "(?<target>skłamy?)(?=(?:{{S}}\\p{L}{3,20}(?:e|ie)){1,2}{{S}}życzenia{{E}})"
        return: 'target.length === 6 ? "składamy" : "składam"'
      # "tam i z potworem" -> "tam i z powrotem".
      - regex: "(?<target>potworem)(?<=(?:^|[^\\p{L}])(?:tam|tu|do{{S}}\\p{L}{2,20}(?:{{S}}\\p{L}{2,20})?){{S}}i{{S}}z{{S}}potworem){{CLAUSE_END}}"
        fix: "powrotem"
      # "podlegać ocenie" (dative); "podlać" waters something.
      - regex: "(?<target>podleją|podleje)(?={{S}}(?:ocenie|kontroli|opodatkowaniu|zmianie|zmianom|karze|regulacji|ochronie|przepisom|ustawie|weryfikacji|likwidacji|wymianie){{E}})|(?<=(?:^|[^\\p{L}])(?:temu|czemu){{S}})(?<target>podleją|podleje){{E}}"
        return: 'target.toLowerCase() === "podleją" ? "podlegają" : "podlega"'
      # "nie mieć nic wspólnego": "noc" (night) is a slip.
      - regex: "(?<target>noc)(?={{S}}wspólnego(?:{{S}}z{{E}}|[ \\t\\u00a0]*[.!?,;]))"
        fix: "nic"
      # "pół szklanki wody": "szklani" are glass men.
      - regex: "(?<target>szklani)(?={{S}}(?:wody|wrzątku|mleka|soku|herbaty|cukru|mąki|wina|piwa|kawy|kefiru|śmietany|oleju|ryżu|kaszy){{E}})"
        fix: "szklanki"
      # "bardziej" cut short after a degree word or before an adverb; "o bardzie" is a bard.
      - regex: "(?<target>bardzie){{E}}(?:(?<=(?:^|[^\\p{L}])(?:im|a|coraz|jeszcze|dużo|znacznie|nieco|trochę|wiele|zdecydowanie){{S}}bardzie)|(?={{S}}(?:\\p{L}{3,20}(?:nie|wo|ko)|niż){{E}}))"
        fix: "bardziej"
      # "u stóp góry": "stup" is the plural genitive of "stupa".
      - regex: "(?<target>stup)(?={{S}}(?:góry|gór|wzgórza|zapory|schodów|łóżka|ołtarza|tronu|pomnika|zamku){{E}})"
        fix: "stóp"
      # "coraz lepie", "jeszcze wyże": a comparative adverb that lost its "-j".
      - regex: "(?<target>lepie|wyże|niże|gorze|bliże|częście|szybcie|dłuże){{E}}(?<=(?:^|[^\\p{L}])(?:coraz|jeszcze|znacznie|dużo|nieco|trochę|zdecydowanie|wiele|daleko){{S}}\\p{L}{4,7})"
        return: target + "j"
      # "coraz skutecznej." -> "skuteczniej": after "coraz", a clause-final word is an adverb.
      - regex: "(?<target>\\p{L}{2,20}nej){{CLAUSE_END}}(?<=(?:^|[^\\p{L}])coraz{{S}}\\p{L}{5,23})"
        return: target.slice(0, -3) + "niej"
      # "w przededniu wyborów" is the only use of "przededniu" (with a genitive after it).
      - regex: "(?<!(?:^|[^\\p{L}])(?:w|jej|jego|ich|tego|tym|swoim|owym){{S}})(?<target>przededniu)(?={{S}}(?:\\p{L}{1,20}(?:ów|ych|ich|ego|ej|y|i|a|u)|świąt){{E}})"
        fix: "w przededniu"
      # "na podstawie danych": the preposition is part of the phrase.
      - regex: "(?<!(?:^|[^\\p{L}])(?:na|o|w|przy|po|ku|się|tej|jej|tylko|samej|solidnej|mocnej){{S}})(?<target>podstawie)(?={{S}}(?:danych|informacji|umowy|ustawy|art|artykułu|przepisów|wyników|badań|analizy|decyzji|dokumentów|faktury|wniosku|opinii|zaświadczenia|orzeczenia|uchwały|porozumienia){{E}})"
        fix: "na podstawie"
      # "niezbyt dobrze": "niebyt" is nonexistence.
      - regex: "(?<target>niebyt)(?={{S}}(?:dobrze|dobry|dobra|dobre|dużo|duży|duża|duże|wiele|często|długo|chętnie|mądrze|mądry|ładnie|jasno|jasne|pewnie|pewny|daleko|blisko|szybko|wysoko|wysoki|zadowolony|zadowolona|zadowoleni|zdrowy|zdrowo|udany|udana|udane|miło|miły|wygodnie|wygodny|łatwo|łatwy|łatwe|trudny|trudno|ciekawy|ciekawe|ciekawie){{E}})"
        fix: "niezbyt"
      # "Nagroda Główna", "Dworzec Główny": the capital names the institution.
      - regex: "(?<=(?:^|[^\\p{L}])(?:Nagroda|Nagrodę|Nagrody|Nagrodą|Komenda|Komendy|Komendzie|Komendę|Biblioteka|Biblioteki|Bibliotece|Księgowa|Księgowej|Kwatera|Kwatery|Rada|Rady|Radzie|Poczta|Poczty|Poczcie|Dworzec|Dworca|Dworcu|Urząd|Urzędu|Urzędzie|Inspektorat|Inspektoratu|Sztab|Sztabu|Rynek|Rynku){{S}})(?<target>Gówn(?:a|ej|ą|ę|y|ego|ym|emu)){{E}}"
        verbatim: true
        return: '/^G/u.test(target) ? "Główn" + target.slice(4) : null'
      # "ogólne informacje": "w ogóle" keeps "ogóle".
      - regex: "(?<!(?:^|[^\\p{L}])(?:w|we){{S}})(?<target>ogóle)(?={{S}}(?:informacje|zasady|warunki|przepisy|uwagi|wiadomości|pojęcia|wytyczne|założenia|dane|kryteria|cechy|wymagania|postanowienia){{E}})"
        fix: "ogólne"
      # "jedna rzecz": lowercase "jena" is no word ("Jena" is a town).
      - regex: "(?<target>jena)(?={{S}}(?:rzecz|osoba|sprawa|strona|część|kobieta|noc|chwila|godzina|minuta|książka|odpowiedź|myśl|droga|szansa|z){{E}})"
        return: '/^\p{Lu}/u.test(target) ? null : "jedna"'
      # "o tej porze": "potrze" is a verb ("rub").
      - regex: "(?<=(?:^|[^\\p{L}])(?:o|tej|każdej|dowolnej|późnej|wczesnej|nocnej|samej|innej|jakiej){{S}})(?<target>potrze){{E}}"
        fix: "porze"
      # "popełnić literówkę": "litrówka" is a litre bottle.
      - regex: "(?<target>litrówk\\p{L}{0,3})(?<=(?:^|[^\\p{L}])popełni\\p{L}{0,6}{{S}}(?:\\p{L}{2,12}{{S}})?litrówk\\p{L}{0,3}){{E}}"
        return: '"literówk" + target.slice(7)'
      # "boja się o" (a buoy) -> "boję się", "boją się".
      - regex: "(?<!(?:^|[^\\p{L}])(?:nie|się){{S}})(?<target>boja)(?={{S}}się(?:{{S}}(?:o|że|tego|go|jej|ich|mnie|ciebie|was|nas|ją|ludzi){{E}}|,{{S}}że{{E}}))"
        fix: ["boję", "boją"]
      # "ludzie lubią": "lubą" is the instrumental of "luba" (sweetheart).
      - regex: "(?<=(?:^|[^\\p{L}])(?:nie|oni|one|ludzie|wszyscy|dzieci|którzy|które){{S}})(?<target>lubą){{E}}"
        fix: "lubią"
      # A nursery is "żłobek" ("żłobka"); the crib in Bethlehem is "żłóbek".
      - regex: "(?<target>żłóbk(?:a|u|iem|i|ach|ów))(?={{S}}(?:przyzakładow|miejsk|publiczn|prywatn|gminn|integracyjn|państwow)\\p{L}{1,4}{{E}})"
        return: '"żłobk" + target.slice(5)'
      - regex: "(?<target>żłobk(?:a|u|iem|ach))(?={{S}}betlejemsk\\p{L}{1,4}{{E}})"
        return: '"żłóbk" + target.slice(5)'
      # "zmysł wzroku": "wzorek" is a pattern.
      - regex: "(?<target>wzorku){{E}}(?<=(?:^|[^\\p{L}])(?:zmysł\\p{L}{0,3}|narząd\\p{L}{0,3}|ostrość|ostrości|utrat\\p{L}{1,2}|zaburzeni\\p{L}{1,3}|badani\\p{L}{1,3}|kontakt\\p{L}{0,3}){{S}}wzorku)"
        fix: "wzroku"
      # "przedstawić zarzuty": "przestawić" moves something.
      - regex: "(?<target>przestawi(?:ono|ł|ła|li|ć|a|ają|any|ane|one))(?=(?:{{S}}\\p{L}{2,15}){0,2}{{S}}zarzut\\p{L}{0,3}{{E}})|(?<target>przestawi(?:ono|ł|ła|li)){{E}}(?<=(?:^|[^\\p{L}])zarzut\\p{L}{0,3}(?:{{S}}\\p{L}{2,15})?{{S}}przestawi\\p{L}{1,3})"
        return: '"przed" + target.slice(4)'
      # "podrapał si po głowie" -> "się" after a past form or an infinitive.
      - regex: "(?<target>si)(?={{S}}(?!(?:bemol|dur|moll|krzyżyk){{E}})\\p{L}|[ \\t\\u00a0]*[.,!?;])(?<=(?:^|[^\\p{L}])\\p{L}{2,20}(?:ł|ła|ło|li|ły|ać|ić|yć|eć|ąć){{S}}si)"
        fix: "się"
      # "mamy naprawdę wiele": "naprawę" (a repair) before an intensified word.
      - regex: "(?<=(?:^|[^\\p{L}])(?:mamy|jest|są|to|był|była|było|byli|ale|bo|czy){{S}})(?<target>naprawę)(?={{S}}(?:wiele|dużo|bardzo|mało|super|świetn\\p{L}{1,3}|fajn\\p{L}{1,3}|dobr\\p{L}{1,3}|ciekaw\\p{L}{1,3}|trudn\\p{L}{1,3}|ważn\\p{L}{1,3}|nie){{E}})"
        fix: "naprawdę"
      # "To mój prezent dal niego" -> "dla"; "w dal" is "into the distance".
      - regex: "(?<!(?:^|[^\\p{L}])w{{S}})(?<target>dal)(?={{S}}(?:niego|niej|nich|ciebie|siebie|nas|was|mnie|mamy|taty|dzieci){{E}})"
        return: '/^\p{Lu}/u.test(target) ? null : "dla"'
      # "ściśle określone": the adverb, not the adjective "ścisły".
      - regex: "(?<target>ścisł(?:e|y|a|ą|ym|ego|ej|i))(?={{S}}(?:określon|związan|ustalon|zdefiniowan|wyznaczon|ograniczon|przestrzegan|regulowan|kontrolowan|tajn)\\p{L}{1,3}{{E}})"
        fix: "ściśle"
      # "różnych": "rożny" is the corner of a pitch ("rzut rożny").
      - regex: "(?<!(?:^|[^\\p{L}])(?:rzut\\p{L}{0,3}|róg|rogu|kąt\\p{L}{0,3}|chorągiew\\p{L}{0,3}|chorągiewk\\p{L}{0,3}){{S}})(?<target>rożn(?:ych|ymi|ego|ej|ym))(?={{S}}(?!rzut)\\p{L})"
        return: '"różn" + target.slice(4)'
      # "stała się gwiazdą": "stałą" is an adjective form, not the past verb.
      - regex: "(?<target>(?:stał|okazał|wydawał|zdawał)ą)(?={{S}}się{{S}}\\p{L}{2,20}(?:ą|em|ym|im|ami){{E}})"
        return: target.slice(0, -1) + "a"
      # "Wiśniewski, alei" after "nie tylko": "ale i".
      - regex: "(?<target>alei)(?<=nie{{S}}tylko[^.!?]{1,80},{{S}}alei)(?={{S}}\\p{L})"
        fix: "ale i"
      # "Ta strona zawiera informacje": "zwierać" clenches.
      - regex: "(?<target>zwiera(?:ją|ł|ła|ło|ły)?)(?=(?:{{S}}\\p{L}{2,15})?{{S}}(?:informacj\\p{L}{1,3}|dane|danych|treść|treści|tekst|opis|opisy|listę|wykaz|zbiór|instrukcj\\p{L}{1,3}|przepisy|zapisy){{E}})"
        return: '"zawiera" + target.slice(6)'
      # "miał zamiar": "miął" crumples.
      - regex: "(?<target>miął)(?={{S}}(?:zamiar|ochotę|nadzieję|rację|okazję|czas|problem|pecha|szczęście|być){{E}})"
        fix: "miał"
      # "nadstawiać karku": "nastawiać" sets something.
      - regex: "(?<target>nastawi\\p{L}{0,5})(?=(?:{{S}}\\p{L}{2,12}){0,3}{{S}}(?:karku|głowy|ucha|uszu){{E}})"
        return: '"nad" + target.slice(2)'
      # "wysoką rangę": the English "range" after a Polish adjective.
      - regex: "(?<target>range){{E}}(?<=\\p{L}{2,20}ą{{S}}range)"
        return: '/^\p{Lu}/u.test(target) ? null : "rangę"'
      # "znaczną część": "znaczą" is a verb ("they mean").
      - regex: "(?<target>znaczą)(?={{S}}(?:część|ilość|większość|liczbę|kwotę|sumę|poprawę|przewagę){{E}})"
        fix: "znaczną"
      # "Nie oznacza to, że": "oznacz" is the imperative.
      - regex: "(?<target>oznacz)(?={{S}}to(?:{{S}}(?:jednak|wcale|jeszcze))?,?{{S}}że{{E}})"
        fix: "oznacza"
      # "Ministerstwo Zdrowia": "zdrowa" is the adjective.
      - regex: "(?<target>zdrowa){{E}}(?<=(?:^|[^\\p{L}])(?:ministerstw\\p{L}{0,3}|ministr\\p{L}{0,3}|ochron\\p{L}{0,2}|służb\\p{L}{0,2}|poradni\\p{L}{0,2}|ośrod\\p{L}{0,4}|centrum|fundusz\\p{L}{0,2}){{S}}zdrowa)"
        fix: "zdrowia"
      # "Powstanie Warszawskie": "postanie" means "will stand".
      - regex: "(?<target>postanie)(?={{S}}(?:warszawski|styczniow|listopadow|wielkopolski|śląski|kościuszkowski)\\p{L}{1,3}{{E}})"
        fix: "powstanie"
      # "do nich": the particle "niech" never follows a preposition.
      - regex: "(?<=(?:^|[^\\p{L}])(?:do|od|z|u|dla|bez|przez|na|o|po|za|przy|wśród|między|przed|nad|pod){{S}})(?<target>niech){{E}}"
        fix: "nich"
      # "pozwala sobie": "pozawalać" knocks things down.
      - regex: "(?<target>pozawal\\p{L}{1,5})(?={{S}}(?:sobie|mu|jej|im|nam|wam|mi|ci|na|to{{S}}na){{E}})"
        return: '"pozwal" + target.slice(7)'
      # "startować w wyborach": "stratować" tramples.
      - regex: "(?<target>stratow\\p{L}{1,5})(?={{S}}w{{S}}(?:wyborach|igrzyskach|zawodach|konkursie|maratonie|wyścigu|turnieju|mistrzostwach|olimpiadzie|plebiscycie){{E}})"
        return: '"start" + target.slice(5)'
      # "ponieść straty": "starty" are starts.
      - regex: "(?<target>starty){{E}}(?<=(?:^|[^\\p{L}])(?:poni\\p{L}{1,5}|ponosi\\p{L}{0,3}|odrabia\\p{L}{0,3}|odrobi\\p{L}{0,3}|wyrówna\\p{L}{0,3})(?:{{S}}\\p{L}{2,15})?{{S}}starty)"
        fix: "straty"
      # "z naprzeciwka", "z przeciwka": the words exist only after "z".
      - regex: "(?<!(?:^|[^\\p{L}])(?:z|na|zna){{S}})(?<target>naprzeciwka|przeciwka){{E}}"
        return: '"z " + target'
      # "na czele": "czele" lives only in the phrase.
      - regex: "(?<!(?:^|[^\\p{L}])(?:na|w)(?:{{S}}\\p{L}{1,15}){0,2}{{S}})(?<target>czele){{E}}"
        fix: "na czele"
      # "wespół z kimś", "wespół w zespół".
      - regex: "(?<target>wespół)(?={{S}}(?!(?:z|ze|w){{E}})\\p{L}{0,20}(?:ą|em|iem|ami|mi|ymi|imi|kimś|nim|nią){{E}})"
        fix: "wespół z"
      - regex: "(?<target>wespół{{S}}w)(?={{S}}\\p{L}{2,20}(?:ami|mi|ymi|imi){{E}})"
        fix: "wespół z"
      - regex: "(?<target>wespół{{S}}zespół){{E}}"
        fix: "wespół w zespół"
      # "a w związku z tym": the phrase needs its "w".
      - regex: "(?<=(?:(?:^|[^\\p{L}])(?:a|i|ale|lecz|więc|oraz)|[,;]){{S}})(?<target>związku)(?={{S}}z{{S}}(?:tym|powyższym|czym){{E}})"
        fix: "w związku"
      # "Ona dała mi": "z dala" (far off) is the only "dala".
      - regex: "(?<!(?:^|[^\\p{L}])z{{S}})(?<target>dala)(?={{S}}(?:mi|ci|mu|jej|nam|wam|im|go|ją|to|sobie){{E}})"
        fix: "dała"
      # "odgrywać rolę": "ogrywać" beats someone at a game.
      - regex: "(?<target>ogrywa\\p{L}{0,4})(?=(?:{{S}}\\p{L}{2,12}){0,2}{{S}}rol(?:ę|i){{E}})"
        return: '"od" + target.slice(1)'
      # "w swoim dorobku": "sowim" is an owl's.
      - regex: "(?<target>sow(?:im|ich|imi|ej|ą|ego))(?={{S}}(?:dorobku|książkach|książce|życiu|domu|pokoju|mieszkaniu|pracy|kraju|imieniu|zdaniu|rodzinie|dzieciach|rodzicach){{E}})"
        return: '"swo" + target.slice(3)'
      # "do zrobienia": a verbal noun after "do", not the virile participle.
      - regex: "(?<=(?:^|[^\\p{L}])do{{S}})(?<target>\\p{L}{3,20}(?:eni|ani|ęci)){{CLAUSE_END}}"
        return: '/^\p{Lu}/u.test(target) ? null : target + "a"'
      # "w lutym 2015": "lity" means solid.
      - regex: "(?<target>lit(?:y|ego|ym))(?={{S}}\\d{4}{{E}})"
        return: '"lut" + target.slice(3)'
      # "policyjne statystyki": "statystki" are film extras.
      - regex: "(?<target>statystk(?:i|ach|ami|om)?){{E}}(?<=(?:(?:policyjn|oficjaln|najnowsz|rządow|szpitaln|medyczn|demograficzn|krajow|światow|unijn)\\p{L}{1,3}|według){{S}}statystk\\p{L}{0,3})"
        return: '"statystyk" + target.slice(8)'
      # "Chodzi o to, że": "ty" after "o" before a clause.
      - regex: "(?<=(?:^|[^\\p{L}])o{{S}})(?<target>ty)(?=,{{S}}(?:że|żeby|aby|by){{E}})"
        fix: ["to", "tym"]
      # "o tym i o owym": "wym" is no word ("wym." abbreviates).
      - regex: "(?<=(?:^|[^\\p{L}])o{{S}})(?<target>wym)(?![\\p{L}\\p{N}]|\\.[ \\t\\u00a0]*\\p{L})"
        fix: "owym"
      # "stał na przodzie": "przedzie" needs its preposition.
      - regex: "(?<!(?:^|[^\\p{L}])(?:w|na){{S}})(?<target>przedzie){{E}}"
        fix: ["na przodzie", "w przodzie"]
      # "W lato" -> "Latem", "W lecie".
      - regex: "(?=\\p{L})(?<=(?:^|[.!?…:;][\"”’»)]{0,3}[ \\t\\u00a0\\n]{1,8}|\\n[ \\t\\u00a0]{0,8}))(?<target>W{{S}}lato)(?={{S}}\\p{L})"
        verbatim: true
        fix: ["Latem", "W lecie"]
      # "inny niż": "jak" compares like things ("nikt inny jak" keeps it).
      - regex: "(?<!(?:^|[^\\p{L}])(?:nikt|nic|ktoś|coś|kto|co|któż|cóż|nikogo|niczego|nikomu|niczym|nikim){{S}})(?<target>inn(?:y|a|e|i|ego|ej|emu|ą|ym|ych|ymi){{S}}jak)(?={{S}}(?!nie{{E}})\\p{L})"
        return: 'target.replace(/jak$/iu, "niż")'
  # Real-word slips: a lost or doubled small word, or a word that only its look-alike fits here.
  - id: pl.typos
    checks: [englishPhraseCorrections]
    style: match
    message: review_msg_contextual_grammar
    sets:
      # A second preposition that opens a set adverbial phrase ("do w pełni", "z na wpół").
      TYPO_ADVERBIAL:
        [
          w|pełni,
          w|miarę,
          w|ogóle,
          w|sumie,
          w|całości,
          w|zasadzie,
          w|końcu,
          w|dodatku,
          w|praktyce,
          w|razie,
          w|przybliżeniu,
          w|szczególności,
          w|pół,
          na|pewno,
          na|razie,
          na|nowo,
          na|przykład,
          na|wpół,
          na|zawsze,
          na|bieżąco,
          na|tyle,
          na|co,
          na|ogół,
          na|pół,
          na|raz,
          na|przemian,
          z|grubsza,
          z|daleka,
          z|bliska,
          z|osobna,
          z|powrotem,
          z|góry,
          z|dołu,
          z|przodu,
          z|tyłu,
          z|boku,
          z|rzędu,
          z|zewnątrz,
          z|wewnątrz,
          od|razu,
          od|nowa,
          od|dawna,
          od|zaraz,
          od|teraz,
          od|dziś,
          od|zawsze,
          od|czasu,
          od|tyłu,
          od|przodu,
          od|środka,
          do|końca,
          do|dziś,
          do|tyłu,
          do|przodu,
          do|góry,
          do|dołu,
          do|środka,
          do|teraz,
          do|zobaczenia,
          do|widzenia,
          do|niedawna,
        ]
      TYPO_NOT_A_VERB:
        [
          to,
          nie,
          tak,
          już,
          teraz,
          tu,
          tam,
          i,
          a,
          że,
          by,
          jak,
          gdy,
          co,
          też,
          tylko,
          bardzo,
          trochę,
          wtedy,
          znowu,
        ]
    defs:
      TYPO_NEGATION: '/(?:^|[^\p{L}])(?:nie\p{L}*|ani|nikt|nic|niczego|nikogo|żaden|żadna|żadne|żadnego|żadnej|nigdy|nigdzie|bez)(?![\p{L}])/iu'
      # A slip on `start`-`end` and its fix in the typed case; none on a user's word.
      typoSlip:
        args: "ctx: DetectContext, start: number, end: number, fix: string"
        let:
          typed: ctx.source.slice(start, end)
        when: "!plUserOrNamed(ctx, typed)"
        return: plFindingAt(ctx, start, end, [plCaseLike(typed, fix)], "englishPhraseCorrections", "review_msg_contextual_grammar")
    frames:
      # A preposition straight before an infinitive or an adverbial participle.
      - regex: "(?<![\\p{L}\\p{N}_'’-])(?<prep>na|do|od|dla|bez|przez|przy|u|z|ze|w|we|o){{S}}(?<verb>\\p{Ll}{3,}(?:ać|eć|ić|yć|ąć|uć|ąc)){{NO_LETTER_AFTER}}"
        scan: polish
        flags: gu
        when: "!(plNounTags(verb) || /(?:siąc|zając)$/u.test(verb))"
        return: typoSlip(ctx, m.index, m.index + m[0].length, verb)
      # "cale życie": "cale" (inches) before a neuter noun is "całe".
      - regex: "(?<![\\p{L}\\p{N}_'’-])(?<target>cale){{S}}(?<noun>\\p{L}{3,20}){{NO_LETTER_AFTER}}"
        scan: polish
        flags: giu
        let:
          tags: plNounTags(noun)
        when:
          - plOnlyNoun(tags) && tagsAnd(tags, PL_NEUTER) !== 0 && tagsAnd(tags, plCases("Ns As")) !== 0
          - '!(/^\p{Lu}/u.test(target) && !plSentenceStart(ctx.text, m.index))'
        return: typoSlip(ctx, m.index, m.index + 4, "całe")
      # "bać" is always reflexive: a form with no "się" in its clause.
      - regex: "(?<![\\p{L}\\p{N}_'’-])(?<verb>bał|bała|bało|bały|bałem|bałam|bałeś|bałaś|baliśmy|bałyśmy|boi|boję|boisz|boimy|boicie|bać){{NO_LETTER_AFTER}}"
        scan: polish
        flags: giu
        let:
          start: m.index
          end: start + m[0].length
          before: ctx.text.slice(Math.max(0, start - 48), start)
          after: ctx.text.slice(end, end + 40)
          clauseBefore: 'before.slice(before.search(/[^.!?;:,\n]*$/u))'
          clauseAfter: 'after.slice(0, (after.search(/[.!?;:,\n]/u) + 1 || after.length + 1) - 1)'
        when:
          - '!/(?:^|[^\p{L}])się(?![\p{L}])/iu.test(clauseBefore + " " + clauseAfter)'
          # "za boją", "o boi": the noun "boja".
          - '!/(?:^|[^\p{L}])(?:z|za|przed|nad|pod|między|o|na|przy|po|w|we)[ \t ]+$/iu.test(before)'
        return: typoSlip(ctx, start, end, verb + " się")
      # "się bał się": one "się" serves the verb.
      - regex: "(?<![\\p{L}\\p{N}_'’-])się{{S}}(?<verb>\\p{L}{2,20})(?<gap>{{S}})się{{NO_LETTER_AFTER}}"
        scan: polish
        flags: giu
        let:
          lowerVerb: verb.toLowerCase()
          start: m.index + m[0].indexOf(verb, 3)
        when:
          - "!TYPO_NOT_A_VERB.has(lowerVerb)"
          - plFiniteVerb(lowerVerb) || plListedVerb(lowerVerb) || plPastByShape(lowerVerb)
        return: typoSlip(ctx, start, m.index + m[0].length, verb)
      # Two prepositions in a row ("mieszkam w z Warszawie"): one of them is a slip.
      - regex: "(?<![\\p{L}\\p{N}_'’/.-])(?<first>[wW]|[dD]o|[zZ]|[nN]a|[oO]d){{S}}(?<second>na|z|od|do|w){{S}}(?<next>\\p{L}+){{NO_LETTER_AFTER}}"
        scan: polish
        flags: gu
        let:
          tail: m.index + m[0].length
          after: '/^[ \t ]+(\p{L}+)/u.exec(ctx.text.slice(tail, tail + 40))?.[1] ?? ""'
          noun: next.toLowerCase()
          typed: ctx.source.slice(m.index, m.index + m[0].length - next.length).trimEnd()
        when:
          - '!(first.toLowerCase() === second || TYPO_ADVERBIAL.has(second + "|" + next))'
          # "w od lat zamkniętym domu": the second preposition opens a phrase inside a noun phrase.
          - (plOnlyNoun(plNounTags(noun)) || plPlaceForm(noun)) && !plAdjectiveOf(after.toLowerCase())
          - "!plUserOrNamed(ctx, typed)"
        return: >-
          plFindingAt(ctx, m.index, m.index + typed.length, [first, plCaseLike(first, second)],
          "englishPhraseCorrections", "review_msg_contextual_grammar")
      # "bynajmniej" strengthens a denial; with none in its sentence "przynajmniej" was meant.
      - regex: "(?<![\\p{L}])bynajmniej(?={{S}}\\p{L})"
        scan: polish
        flags: giu
        let:
          before: ctx.text.slice(Math.max(0, m.index - 160), m.index)
          after: ctx.text.slice(m.index, m.index + 160)
          sentence: 'before.slice(before.search(/[^.!?\n]*$/u)) + after.split(/[.!?\n]/u)[0]'
        when: "!TYPO_NEGATION.test(sentence)"
        return: typoSlip(ctx, m.index, m.index + m[0].length, "przynajmniej")
  # A sentence that is only an adverbial participle phrase: "Przechodząc obok sklepu." No verb
  # stands outside its subordinate clauses. Opt-in: notes and headings can be fragments on purpose.
  - id: pl.fragments
    checks: [englishSentenceFragment]
    style: match
    message: review_msg_sentence_fragment
    defs:
      # Words that open a subordinate clause: its verb is not the sentence's verb.
      FRAGMENT_SUBORDINATE: '/^(?:któr\p{L}*|gdzie|dokąd|skąd|kiedy|gdy|że|iż|aby|żeby|by|bo|ponieważ|gdyż|jeśli|jeżeli|gdyby|choć|chociaż|co|czego|czym|kto|kogo|jak|jaki\p{L}*|jakby|zanim|dopóki|odkąd|skoro)$/iu'
      # Set phrases that comment on the sentence: "krótko mówiąc", "nie licząc", "rzecz biorąc".
      FRAGMENT_COMMENT: "/^(?:mówiąc|biorąc|licząc|wyłączając|sumując|reasumując|podsumowując|wliczając|uwzględniając|zakładając|abstrahując|pomijając|zaczynając|kończąc)$/iu"
      # Predicates that are no verb form: "to", "trzeba", "można", "widać".
      FRAGMENT_PREDICATIVE: "/^(?:to|jest|są|trzeba|można|warto|wolno|widać|słychać|szkoda|należy|brak|niech|oto|czas)$/iu"
      fragmentParticiple:
        args: "word: string"
        return: '/^\p{L}{2,}ąc$/u.test(word) && !plNounTags(word) && !plAdjectiveOf(word)'
      # The word can be a verb form. Unknown words in "-i", "-y" are read as verbs ("śpi").
      fragmentVerbLike:
        args: "word: string"
        return: >-
          FRAGMENT_PREDICATIVE.test(word) || /[ćc]$/u.test(word) || plFiniteVerb(word) ||
          plListedVerb(word) || plPastByShape(word) || plImpersonalVerb(word) ||
          tagsAnd(plNounTags(word), PL_VERB) !== 0 ||
          (!plNounTags(word) && !plAdjectiveOf(word) && /[iy]$/u.test(word) && word.length > 2)
    frames:
      # A sentence on one line that starts with a capital and ends with a full stop.
      - regex: "(?<=^|[.!?\\u2026][ \\t\\u00A0\\n]{1,8})\\p{Lu}[^.!?\\u2026\\n]{0,400}\\.(?=[ \\t\\u00A0\\n]{1,8}[\\p{Lu}\\u201E\"\\u2014\\u2013-]|[ \\t\\u00A0\\n]*$)"
        scan: polish
        flags: gu
        let:
          # The words of the parts of the sentence (commas, dashes and brackets end a part), without
          # the parts that open a subordinate clause.
          words: >-
            [...m[0].matchAll(/[^,;:—–()]+/gu)]
            .map((part) => [...part[0].matchAll(/\p{L}+/gu)].map((word) => ({ text: word[0], lower:
            word[0].toLowerCase(), start: m.index + part.index + word.index })))
            .filter((part) => part.length > 0 && !FRAGMENT_SUBORDINATE.test(part[0].text))
            .flat()
          participle: >-
            words.find((word) => fragmentParticiple(word.lower) && !FRAGMENT_COMMENT.test(word.lower) &&
            !plUserOrNamed(ctx, word.text))
        when:
          # Quick gate: most sentences have no "-ąc" word.
          - m[0].includes("ąc")
          - participle !== undefined
          - "!words.some((word) => !fragmentParticiple(word.lower) && fragmentVerbLike(word.lower))"
        return: >-
          ({ ...plFindingAt(ctx, participle.start, participle.start + participle.text.length, [],
          "englishSentenceFragment", "review_msg_sentence_fragment"),
          context: { start: m.index, end: m.index + m[0].length } })
  # A question that ends with a full stop: "Czy pójdziesz jutro do kina." -> "?". Opt-in: "Czy"
  # opens a question only when no comma follows; a question word opens one only before a
  # second-person verb, as "Jak widać…" and "Kiedy wrócił…" open statements.
  - id: pl.questions
    checks: [germanQuestionMarks]
    style: match
    message: review_msg_question_mark
    frames:
      # A sentence on one line that starts with "Czy" or a question word and ends with a full stop.
      - regex: "(?<=^|\\n|[.!?\\u2026][ \\t\\u00A0\\n]{1,8})(?<first>Czy|Dok\\u0105d|Dlaczego|Gdzie|Kiedy|Sk\\u0105d|Jak|Ile|Czemu|Kto|Co)(?![\\p{L}])[^.!?\\u2026\\n]{1,300}\\.(?=[ \\t\\u00A0\\n]{1,8}\\p{Lu}|[ \\t\\u00A0\\n]*$)"
        scan: polish
        flags: gu
        let:
          words: 'm[0].match(/\p{L}+/gu) ?? []'
        when:
          # Commas, colons, dashes, brackets and quotes join clauses or quote one.
          - '!/[,;:—–()"„”«»]/u.test(m[0])'
          - words.length >= 2
          # A question word asks only before a second-person verb: "-sz", "-cie", "-eś", "-aś".
          - >-
            first === "Czy" || words.slice(1, 4).map((word) => word.toLowerCase()).some((word) =>
            /(?:sz|cie|eś|aś|ście)$/u.test(word) && !plNounTags(word) && !plAdjectiveOf(word))
        return: >-
          plFindingAt(ctx, m.index + m[0].length - 1, m.index + m[0].length, ["?"],
          "germanQuestionMarks", "review_msg_question_mark")

