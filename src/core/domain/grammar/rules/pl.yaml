# pl grammar rules. See docs/agents/grammar-rules.md for the format.
lang: pl

# Regex fragments of the frame rules: {{NAME}}.
fragments:
  WEEKDAY_OR_MONTH: "(?:Poniedział\\p{Ll}*|Wtor\\p{Ll}*|Środ\\p{Ll}*|Czwart\\p{Ll}*|Piąt\\p{Ll}*|Sobot\\p{Ll}*|Niedziel\\p{Ll}*|Styczni\\p{Ll}*|Styczeń|Lut\\p{Ll}+|Marz\\p{Ll}*|Marc\\p{Ll}*|Kwie\\p{Ll}+|Czerw\\p{Ll}+|Lip\\p{Ll}+|Sierp\\p{Ll}+|Wrze\\p{Ll}+|Październik\\p{Ll}*|Listopad\\p{Ll}*|Grud\\p{Ll}+)"
  QUESTION_WORD: "czy|co|jak|gdzie|kiedy|dlaczego|skąd|dokąd|ile|kto|którędy|czemu"
  END: "(?![\\p{L}\\p{N}])"
  PRONOUN_HEAD: "ktoś|coś|ten|ta|ci|tego|tym|temu|wszystko|wszystkiego|wszystkim|wszystkiemu|każdy|nic|niczego"
  PRONOUN_RELATIVE: "kto|kogo|komu|kim|czego|czym|czemu|co|czyj\\p{L}*"
  CLAUSE_START: "(?=\\p{L})(?<=(?:^|[.!?…:;][\"”’»)]{0,3}[ \\t\\u00a0]{1,8}|\\n[ \\t\\u00a0]{0,8}))"
  SET_OFF: "(?:Co więcej|Innymi słowy|Jednym słowem|Krótko mówiąc|Szczerze mówiąc|Nawiasem mówiąc|Ogólnie mówiąc|Prawdę mówiąc|Po pierwsze|Po drugie|Po trzecie|Tak czy siak|Tak czy owak)"
  LINKING: "(?:Jednak|Jednakże|Poza tym|Ponadto|Natomiast|Dlatego|Dlatego też|Zatem|Toteż|Wobec tego|Otóż|Dodatkowo)"
  RELATIVE: "który|która|które|którego|której|któremu|którą|którym|których|którymi|którzy"
  NOT_LETTER: "(?![\\p{L}])"
  POSSESSIVE: "moja|moją|mojej|twoja|twoją|twojej|jego|jej|ich|nasza|naszą|naszej|wasza|waszą|swoja|swoją|swojej|była|byłą|byłej|przyszła|przyszłą|przyszłej"
  PRONOUN_OBJECT: "mi|ci|mu|jej|nam|wam|im|go|ją|je|ich|nas|was|mnie|cię|ciebie"
  COMPARATIVE: "(?:\\p{L}+(?:szy|sza|sze|si|szego|szej|szych|iej)|więcej|mniej|bardziej|lepiej|gorzej|dłużej|krócej|szybciej|wyżej|niżej|dalej|bliżej)"
  ROUTE: "do|ku|przez|poprzez|na|w|we|z|ze|od|wzdłuż|pod|nad|między|pomiędzy|obok|koło|prym|żywot\\p{L}*|życie|rej|tędy|dokąd|donikąd"
  DESCRIBE: "interpret|opis|ujm|ujmow|ujęt|ujął|ujęł|wyraż|wyraz|myśl|mów|rozumi|tłumacz|wyjaśni|analiz|definiow|zdefini|postrzeg|ocen|rozważ"
  FIELDS: "kultury|gospodarki|oświaty|edukacji|szkolnictwa|nauki|rolnictwa|przemysłu|handlu|usług|zdrowia|opieki|wychowania|rozwoju|współpracy|polityki|propagandy|produkcji|budownictwa|transportu|sportu|turystyki|bezpieczeństwa|zatrudnienia|pracy"
  NUMERALS: "pół|półtora|jeden|jedna|jedno|dwa|dwie|dwóch|trzy|cztery|pięć|sześć|siedem|osiem|dziewięć|dziesięć|\\p{L}+naście|\\p{L}+dzieści|\\p{L}+dziesiąt|sto|\\p{L}+set|\\p{L}+sta|tysiąc|tysiące|tysięcy|milion\\p{L}*|miliard\\p{L}*|kilka|kilkanaście|kilkadziesiąt|kilkuset|kilku|kilkunastu|setki|tysiące|połowy|połowie|połowę|stu|dwustu|trzystu|czterystu|pięciu|sześciu|siedmiu|ośmiu|dziewięciu|dziesięciu|dwudziestu|trzydziestu|czterdziestu|pięćdziesięciu|stu"
  TIME_UNIT: "lat|roku|miesięcy|miesiąca|tygodni|tygodnia|dni|dnia|dób|doby|godzin|godziny|minut|minuty|sekund|wieków|wieku|stuleci|dekad|kwartałów|sezonów"
  NUMERAL: "\\d+|dwóch|dwu|trzech|czterech|pięciu|sześciu|siedmiu|ośmiu|dziewięciu|dziesięciu|\\p{L}{2,9}(?:nastu|dziestu|dziesięciu)|stu|kilku|paru|wielu"
  UI_TARGET: "link|linki|przycisk|ikonę|ikonkę|odnośnik|baner|zdjęcie|obrazek|opcję|strzałkę|zakładkę|napis|krzyżyk|logo|plik|folder"
  CLAUSE_END: "(?=[ \\t\\u00a0]*(?:[.!?,;]|$))"
  # The word ends here and is not a short abbreviation ("por.", "ul."; none ends in "ą", "ę": "grą.").
  WORD: "(?![\\p{L}\\p{N}_'’@/-])(?<![ \\t\\u00a0]\\p{L}{0,2}(?![ąęĄĘ])\\p{L}(?=\\.))"
  # Prepositions that take only the genitive.
  GENITIVE_ONLY: "dla|do|od|bez|u|według|wg|oprócz|prócz|zamiast|obok|koło|wokół|wśród|spośród|spod|znad|zza|sprzed"
  JAKI: "jaki|jaka|jakie|jakiego|jakiej|jakiemu|jaką|jakim|jakich|jakimi"
  # Short words that may stand between a subject pronoun and its verb ("ona już wyszła").
  BETWEEN: "(?:(?:się|nie|już|też|także|również|wtedy|wczoraj|dziś|zawsze|nigdy|jednak|często|szybko|nagle|wreszcie|tylko)[ \\t\\u00a0]{1,8}){0,2}"
  ZOSTAC: "został|została|zostało|zostały"
  # Month names after a day: the genitive, the nominative and the Roman numerals.
  MONTH_WORD: "stycznia|lutego|marca|kwietnia|maja|czerwca|lipca|sierpnia|września|października|listopada|grudnia|styczeń|luty|marzec|kwiecień|maj|czerwiec|lipiec|sierpień|wrzesień|październik|listopad|grudzień|XII|XI|X|IX|VIII|VII|VI|V|IV|III|II|I"
  DECADE_WORDS: "lata|lat|latach|latami|latom"
  NO_LETTER_AFTER: "(?![\\p{L}\\p{N}_'’-])"
  # Clitics and short words between a conjunction and its verb ("że mu daj").
  CLITICS: "(?:(?:nie|się|mi|mu|go|ją|je|to|tę|tego|jej|im|nam|wam|ci|cię|mnie|nas|was|już|teraz)[ \\t\\u00a0]{1,8}){0,2}"
  # A past verb form before a split "by".
  PAST_VERB: "\\p{L}{1,20}?(?:ał|ała|ało|ali|ały|ił|iła|iło|ili|iły|ył|yła|yło|yli|yły|ął|ęła|ęło|ęli|ęły|ógł|ogła|ogło|ogli|ogły|eł|szedł|szła|szło|szli|szły)"
  # Words written together with "nie": active and passive participles, comparatives and
  # superlatives (a closed list: "-szy" is also a verb ending, "cieszy"), adjectives in -owy,
  # -ny, -ski and a few common bare ones, adverbs from adjectives, nouns in -ość and verbal nouns.
  # Adjective endings leave out "-ą", which a third-person plural verb shares ("giną").
  NIE_FORMS: "\\p{L}{2,}(?:ąc|on|an|ęt)(?:y|a|e|ego|ej|emu|ym|ych|ymi)|(?:naj)?(?:lepsz|gorsz|większ|wyższ|niższ|starsz|młodsz|dłuższ|krótsz|bliższ|dalsz|tańsz|droższ|szybsz|łatwiejsz|trudniejsz|ważniejsz|ciekawsz|lżejsz|cięższ|ładniejsz|prostsz|mądrzejsz|silniejsz|słabsz|bogatsz|nowsz|zdrowsz|piękniejsz|gorętsz|zimniejsz)(?:y|a|e|ego|ej|emu|ym|ych|ymi)|(?:naj)?(?:lepiej|gorzej)|\\p{L}{2,}(?:ow|n|sk|ck)(?:y|a|e|ego|ej|emu|ym|ych|ymi)|(?:dobr|zł|duż|wielk|mał|łatw|ciekaw|zdrow|chor|pewn|zdoln|grzeczn|uprzejm|wesoł|gotow|świadom|szczęśliw)(?:y|a|e|ego|ej|emu|ym|ych|ymi|zy|i)|(?:trudno|łatwo|dobrze|źle|daleko|wysoko|nisko|drogo|tanio|długo|dużo|mało|często|rzadko|chętnie|grzecznie|uprzejmie|ważne)|\\p{L}{2,}ość|\\p{L}{2,}(?:anie|enie|eniu|aniu)"
  # One space character.
  SP: "[ \\t\\u00a0]"
  # Case endings typed after a digit: ordinal, cardinal, and numeral noun ("piątka") endings.
  ORDINAL_END: "w?sz[yaeąę]|w?sz(?:ego|ej|emu|ym|ych|ymi)|wsi|g[iaeą]|gie|gi(?:ego|ej|emu|m|ch|mi)|c[iaeą]|cie|ci(?:ego|ej|emu|m|ch|mi)|[dt]?m[yaeą]|[dt]?m(?:ego|ej|emu|ym|ych|ymi)|s?t[yaeą]|s?t(?:ego|ej|emu|ym|ych|ymi)|go|ego|mu|emu|ej|ym|ych|ymi|y|i|a|e"
  CARDINAL_END: "u|ch|óch|ech|ciu|miu|ściu|tu|stu|ięć|ro|cio|mio|dmio|ścio|oro|oma|ma"
  NUMERAL_NOUN_END: "[jrt]?(?:ka|ki|kę|ką|kom|kami|kach|ce)|t?ek|jek|rek"
  # The second part of a digit compound ("5-minutowy", "3-krotny", "25-latek").
  COMPOUND_PART: "krotn\\p{L}*|krotnie|letni|latek|latka|latki|latków|latkiem|latkowi|latku|lecie|lecia|leciu|leciem|(?:minutow|sekundow|godzinn|dniow|tygodniow|miesięczn|osobow|pokojow|piętrow|procentow|kilometrow|metrow|centymetrow|litrow|bitow|stopniow|tonow|kilogramow|gramow|punktow|pasmow|drzwiow|biegow|cylindrow|calow|częściow|elementow|tysięczn|milionow|letni|roczn|dzienn)(?:y|a|ego|ej|emu|ą|i)"
  # Words that may stand between a verb and its noun: a pronoun, an adverb, adjectives.
  FILLER: "(?:[ \\t\\u00a0]{1,8}(?:on|ona|ono|oni|one|nadal|wciąż|też|także|również|zawsze|często|naprawdę|bardzo|niezwykle|wyjątkowo|szczególnie|dość|coraz|swoją|swój|swoje|jakąś|żadnej|(?:w|we|na|dla|przy|wśród|u)[ \\t\\u00a0]{1,8}\\p{L}+|\\p{L}+(?:ną|ową|ską|cką|ką|ą|ej|e|y|ie))){0,3}"
  GARMENTS: "płaszcz|kurtkę|sweter|golf|koszulę|bluzkę|sukienkę|spodnie|dżinsy|buty|kozaki|czapkę|kapelusz|rękawiczki|szalik|garnitur|marynarkę|spódnicę|skarpetki|piżamę|kamizelkę|koszulkę|płaszczyk|kurtkę|kalosze"
  FEATURES: "brodę|wąsy|oczy|włosy|nos|uszy|zęby|wymiary|wzrost|talent|zdolności|poczucie|cierpliwość|odwagę|charakter|temperament|rodzinę|dzieci|rodzeństwo|siostrę|brata|braci|siostry|córkę|syna|przyjaciół|czas|ochotę|pomysł|pomysły|nadzieję|wątpliwości|problem|problemy|wadę|wady|zalety|kota|psa"
  # Months in the locative ("w maju").
  LOCATIVE: "styczniu|lutym|marcu|kwietniu|maju|czerwcu|lipcu|sierpniu|wrześniu|październiku|listopadzie|grudniu"
  # Conjunctions, question words and relative pronouns that open a subordinate clause.
  SUBORDINATORS: "że|iż|żeby|ażeby|aby|by|ponieważ|gdyż|jeśli|jeżeli|gdyby|zanim|dopóki|gdy|zamiast|ale|lecz|dlaczego|gdzie|kiedy|który|która|które|którego|której|któremu|którą|którym|których|którymi|którzy|jaki|jaka|jakie|jakiego|jakiej|jakiemu|jaką|jakim|jakich|jakimi"

# The code of the rules' expressions (`let`, `when`, `return`) that rules of several areas use.
defs:
  # The prepositions after which a word must be a noun phrase.
  PREPOSITIONS: '"w|we|z|ze|na|do|od|ode|po|za|przy|przed|przede|nad|nade|pod|pode|dla|bez|u|ku|przez|przeze|między|o|wśród|spod|znad|zza|sprzed"'
  PREPOSITION_WORDS: new Set(PREPOSITIONS.split("|"))

rules:
  - id: pl.compoundsFrames
    checks: [englishClosedCompounds, englishAlotCorrection]
    style: polish
    message: review_msg_closed_compound
    frames:
      # "naj" is no word of its own: "naj lepszy", "naj częściej" -> the superlative.
      - regex: "(?<target>naj{{S}}(?<word>\\p{L}{2,}(?:sz[aeyąi]\\p{L}{0,3}|ej)))(?![\\p{L}])"
        return: '"naj" + word'
      # "niema" (mute, feminine) before a genitive object, or after one at the clause end, is "nie ma".
      - regex: "(?<target>niema)(?={{S}}(?:pojęcia|czasu|sensu|go|jej|ich|nic|nikogo|niczego|już|tu|tam|potrzeby|mowy|problemu|racji|prawa|wątpliwości|szans|znaczenia|co|kto|gdzie|jak|czego|kogo|nas|was|mnie|ciebie|tego|takiej|takiego|żadnego|żadnej|żadnych|sprawy|szansy|dokąd|kiedy)(?![\\p{L}]))"
        check: englishAlotCorrection
        message: review_msg_split_words
        fix: "nie ma"
      - regex: "(?<=(?:^|[^\\p{L}])(?:ich|go|jej|nas|was|tu|tam|już|nic|nikogo|mnie|ciebie|kogo|czego|nigdzie|teraz){{S}})(?<target>niema)(?=[ \\t\\u00a0]*[.!?,;…])"
        check: englishAlotCorrection
        message: review_msg_split_words
        fix: "nie ma"
      # "Czas na prawdę" (time for the truth) is a noun; a verb, an adverb or the end follows the adverb.
      - regex: "(?<!(?:dowód|dowody|dowodu|dowodem|czas|miejsce|liczyć|liczy|liczę|czekać|czeka|czekam|zasługuje|zasługiwać|szansę|szansa|ochotę|wpływ|prawo|gotowość|otwarty|otwarta|otwarci){{S}})(?<target>na{{S}}prawdę)(?!{{S}}(?:o|i|historyczną|naukową|absolutną|obiektywną|objawioną|ostateczną|jedyną|tego|jego|jej|ich|\\p{L}+ego|\\p{L}+ych)(?![\\p{L}]))(?![ \\t\\u00a0]*[.!?;:…)\"”»])"
        fix: "naprawdę"
      # "przód" is the front: "na przód statku"; the adverb ends its phrase or goes "ku" something.
      - regex: "(?<target>na{{S}}przód)(?=[ \\t\\u00a0]*(?:[.!?,;:…)\"”»]|$)|{{S}}(?:ku|i|a)(?![\\p{L}]))"
        fix: "naprzód"
      # "raz za razem" is a phrase of its own.
      - regex: "(?<!raz{{S}})(?<target>za{{S}}razem)(?![\\p{L}])"
        fix: "zarazem"
      # "uznać za pewne" (take for granted) and "za pewne kwoty" keep the adjective;
      # the adverb goes before a verb, a numeral or the end of the clause.
      - regex: "(?<!(?:uzna\\p{L}*|uważa\\p{L}*|uważ\\p{L}*|się|mie\\p{L}*|ma|mam|masz|mamy|macie|mają|wzi\\p{L}*|bra\\p{L}*|bior\\p{L}*|przyj\\p{L}*|poczyt\\p{L}*|uchodz\\p{L}*)(?:{{S}}\\p{L}+)?{{S}})(?<target>za{{S}}pewne)(?=[ \\t\\u00a0]*[.!?,;:…]|{{S}}(?:nie|już|to|jest|był|była|było|są|będzie|będą|się|kilka|kilku|wiele|wielu|tak|tylko|też|także|ktoś|coś|jutro|dziś|dzisiaj|wkrótce|niedługo|później|wtedy|teraz|znowu|jeszcze|wszyscy|wszystko|on|ona|oni|ono|ty|wy|my|ja||\\p{L}+(?:ł|ła|ło|li|ły|je|ją|ie|isz|esz|my|cie))(?![\\p{L}]))"
        fix: "zapewne"
      # "po środku" is also "after a remedy" (po środku nasennym).
      - regex: "(?<target>po{{S}}środku)(?!{{S}}\\p{L}*(?:ym|im)(?![\\p{L}]))(?![\\p{L}])"
        fix: "pośrodku"
      # "po woli dotarcia" (by the will to) and the Warsaw district "Wola" keep the noun.
      - regex: "(?<target>po{{S}}woli)(?=[ \\t\\u00a0]*(?:[.!?,;:…)]|$)|{{S}}(?:się|nie|ale|i|a|\\p{L}+(?:ł|ła|ło|li|ły|je|ją|ie|isz|esz|my|cie|ąc))(?![\\p{L}]))"
        return: '/^po\s+Woli$/u.test(target) ? null : "powoli"'
      # "ponad to, co" (beyond what) is two words.
      - regex: "(?<target>ponad{{S}}to)(?![\\p{L}])(?![ \\t\\u00a0]*,?[ \\t\\u00a0]*(?:co|czego|czym)(?![\\p{L}]))"
        fix: "ponadto"
      # "z resztą" (with the rest) takes a genitive; the adverb is followed by a clause.
      - regex: "(?<target>z{{S}}resztą)(?=[ \\t\\u00a0]*,|{{S}}(?:nikogo|nic|niczego|nie|to|tego|jest|był|była|było|są|ja|ty|on|ona|ono|my|wy|oni|one|już|zawsze|też|chyba|wiadomo|sam|sama|samo|sami|jak|co|kto|każdy|wszyscy|wszystko|mnie|ciebie|go|jej|ich|się|bardzo|dobrze|i)(?![\\p{L}]))"
        fix: "zresztą"
      # "co raz" (every so often) is rare; before a comparative it is "coraz".
      - regex: "(?<target>co{{S}}raz)(?={{S}}(?:\\p{L}+(?:iej|ej|szy|sza|sze|szego|szej|szym|szych|szą|si)|więcej|mniej|bardziej|lepiej|gorzej|częściej|rzadziej|bliżej|dalej|wyżej|niżej|dłużej|krócej|głośniej|ciszej|szybciej|wolniej|mocniej|trudniej|łatwiej|później|wcześniej|wyraźniej)(?![\\p{L}]))"
        fix: "coraz"
      # "dla tego" is fine before a noun ("dla tego człowieka"); a conjunction makes it "dlatego".
      - regex: "(?<target>dla{{S}}tego)(?=[ \\t\\u00a0]*(?:,[ \\t\\u00a0]*)?(?:że|iż|żeby|by|aby|też|właśnie|ponieważ|bo)(?![\\p{L}]))"
        fix: "dlatego"
      # "dla czego" stays in "dla czego innego"; before a finite verb it asks why.
      - regex: "(?<target>dla{{S}}czego)(?={{S}}(?:nie|się|\\p{L}+(?:esz|isz|ysz|asz|cie|ją|łeś|łaś|liście|łyście|łem|łam))(?![\\p{L}]))"
        fix: "dlaczego"
      # "a tym czasem" opens a contrast; "tym czasem się nie przejmuj" is the instrumental.
      - regex: "(?<=(?:^|[.!?]\\s{1,8}|(?:^|[^\\p{L}])a{{S}}))(?<target>tym{{S}}czasem)(?!{{S}}(?:się|nie|przejm\\p{L}*|zajm\\p{L}*|martw\\p{L}*)(?![\\p{L}]))(?![\\p{L}])"
        fix: "tymczasem"
      # "w prawdzie" (in truth) is a noun; the concession pairs with "ale"/"lecz" later.
      - regex: "(?<target>w{{S}}prawdzie)(?=[^.!?;\\n]{1,120}?,[ \\t\\u00a0]*(?:ale|lecz|jednak|to|a)(?![\\p{L}]))"
        fix: "wprawdzie"
      # A preposition takes no "tam": "na tam to dziecko" is the demonstrative "tamto".
      - regex: "(?<=(?:^|[^\\p{L}])(?:w|we|z|ze|na|do|od|ode|po|za|przy|przed|przede|nad|nade|pod|pode|dla|bez|u|ku|przez|przeze|między|o|wśród|spod|znad|zza|sprzed){{S}})(?<target>tam{{S}}(?<pron>ten|ta|to|te|ci|tego|tej|temu|tą|tę|tym|tych|tymi))(?![\\p{L}])"
        return: '"tam" + pron.toLowerCase()'
      # The noun "widzimisię" after a preposition or a possessive.
      - regex: "(?<=(?:^|[^\\p{L}])(?:od|z|na|dla|według|czyjegoś|czyjeś|czyjś|jego|jej|ich|swojego|swoje|swoim|własnego|własne){{S}})(?<target>widzi{{S}}mi{{S}}się)(?![\\p{L}])"
        fix: "widzimisię"
      # "o jej" before an exclamation mark is the interjection.
      - regex: "(?<target>o{{S}}jej)(?=[ \\t\\u00a0]*!)"
        fix: "ojej"
      # "wyjechać zagranicę" is the noun used for the adverbial "za granicę".
      - regex: "(?<=(?:jecha\\p{L}*|jeżdż\\p{L}*|jeździ\\p{L}*|wyjecha\\p{L}*|wyjeżdża\\p{L}*|wyjedzie\\p{L}*|lecie\\p{L}*|wylecia\\p{L}*|wyemigrowa\\p{L}*|wysła\\p{L}*|wysyła\\p{L}*|pojecha\\p{L}*|pojedzie\\p{L}*|uciek\\p{L}*|uciec){{S}})(?<target>zagranicę)(?![\\p{L}])"
        fix: "za granicę"
      - regex: "(?<=(?:by\\p{L}*|mieszka\\p{L}*|pracowa\\p{L}*|pracuj\\p{L}*|studiowa\\p{L}*|studiuj\\p{L}*|przebywa\\p{L}*|żyj\\p{L}*|żył\\p{L}*|odbywa\\p{L}*|zosta\\p{L}*|leczy\\p{L}*){{S}})(?<target>zagranicą)(?![\\p{L}])"
        fix: "za granicą"
      # "w stanie" (able) is two words after "być".
      - regex: "(?<=(?:jest|są|był|była|było|byli|były|będzie|będą|jestem|jesteś|jesteśmy|jesteście|byłem|byłam|byłeś|byłaś|nie){{S}})(?<target>wstanie)(?={{S}}\\p{L}+(?:ć|c)(?![\\p{L}]))"
        fix: "w stanie"
      # "w ogóle" written as one is handled by SPLIT_WORDS; "popołudniu" after no preposition is "po południu".
      - regex: "(?<!(?:^|[^\\p{L}])(?:w|we|z|ze|na|do|od|ode|po|za|przy|przed|przede|nad|nade|pod|pode|dla|bez|u|ku|przez|przeze|między|o|wśród|spod|znad|zza|sprzed|\\p{L}*ym|\\p{L}*im|tego|tamtego|to|tamto|jakimś){{S}})(?<![\"„“”«])(?<target>popołudniu)(?![\\p{L}])"
        return: 'target.startsWith("P") ? null : "po południu"'
      # "na około 300 zł", "w około połowie": "około" is the approximation, not the adverb.
      - regex: "(?<target>(?<prep>na|w){{S}}około)(?!{{S}}(?:\\d|{{NUMERALS}})(?![\\p{L}])|[ \\t\\u00a0]*\\d)(?![\\p{L}])"
        return: prep.toLowerCase() + "około"
      # "kary godny" (worthy of a penalty) after an adjective keeps the genitive: "najwyższej kary godne".
      - regex: "(?<!\\p{L}(?:ej|szej){{S}})(?<target>kary{{S}}godn(?<end>y|a|e|ego|ej|emu|ą|ym|ych|ymi|i))(?![\\p{L}])"
        return: '"karygodn" + end.toLowerCase()'
      # "nie mniej niż" (not less than) stays apart; "w tym nie mniej" is "including at least".
      - regex: "(?<target>nie{{S}}mniej)(?={{S}}jednak(?![\\p{L}]))(?!{{S}}jednak{{S}}niż)"
        fix: "niemniej"
      - regex: "(?<!(?:^|[^\\p{L}])w{{S}})(?<target>tym{{S}}nie{{S}}mniej)(?![\\p{L}])(?!{{S}}(?:niż|od)(?![\\p{L}]))"
        fix: ["tym niemniej", "niemniej"]
      # "by najmniej zaszkodzić" is the conjunction and the superlative.
      - regex: "(?<target>by{{S}}najmniej)(?![\\p{L}])(?!{{S}}\\p{L}+ć(?![\\p{L}]))"
        fix: "bynajmniej"
      # "uważać coś za zwyczaj" takes the noun.
      - regex: "(?<!(?:uważ|uzna|przyj|uchodz|poczyt|wzię|bierz|bior|bra)\\p{L}*[^.!?;\\n]{0,40})(?<target>za{{S}}zwyczaj)(?![\\p{L}])"
        fix: "zazwyczaj"
      # "za co miesięcznie płacą" is the pronoun "co"; otherwise the adverbs and adjectives are one word.
      - regex: "(?<!(?:^|[^\\p{L}])(?:za|po|na|o|przez|w){{S}})(?<target>co{{S}}(?<word>tygodniow|miesięczn|roczn|dzienn|godzinn)(?<end>ie|o|y|a|e|ego|ej|emu|ą|ym|ych|ymi|i))(?![\\p{L}])"
        let:
          ending: end.toLowerCase()
          stem: word.toLowerCase()
        # "codziennie" and "cotygodniowo": the adverb ending follows the adjective stem.
        when: '!((ending === "o") !== /ow$/.test(stem) && (ending === "o" || ending === "ie"))'
        return: '"co" + stem + ending'
      # "się do czekać", "od stresować": a verb prefix typed apart (a preposition never takes a
      # verb). Not a noun or a numeral in -ć ("do miłość", "od pięć"), nor "wy" (you).
      - regex: "(?<![\\p{L}])(?<target>(?<prefix>do|od|za|po|przy|roz|prze|pod|nad){{S}}(?<verb>\\p{L}{3,}))(?![\\p{L}])"
        when:
          - "!(plNounTags(verb) || plAdjectiveOf(verb) || /(?:ść|ęć)$|^(?:pięć|sześć|siedem|osiem|mać|chęć|płeć|nić|sieć)$/u.test(verb))"
          - "/(?:ać|eć|ić|yć|uć|ąć)$/u.test(verb) || plFiniteVerb(verb)"
          # "za był", "do jest": a verb that takes no prefix stays apart (and stays wrong).
          - '!/^(?:był\p{L}*|jest|są|będ\p{L}*|ma|mam|mieć|może)$/u.test(verb)'
        return: prefix.toLowerCase() + verb
      # "eks-mąż", "mini-spódniczka", "quasi-nauka": a prefix joins the word it opens.
      - regex: "(?<![\\p{L}])(?<target>(?<prefix>eks|mini|maksi|maxi|super|ultra|mega|anty|pseudo|quasi|neo|post|wice)-(?<word>\\p{L}{3,}))(?![\\p{L}-])"
        return: '/^\p{Ll}/u.test(word) ? prefix + word : null'
      # "v-ce prezes" -> "wiceprezes".
      - regex: "(?<![\\p{L}])(?<target>v-ce{{S}}(?<word>\\p{L}{3,}))(?![\\p{L}])"
        return: '"wice" + word'
      # "wciągu" is also the hoist ("wciąg"); before a span of time it is "w ciągu".
      - regex: "(?<target>wciągu)(?={{S}}(?:\\d|ostatni\\p{L}*|następn\\p{L}*|najbliższ\\p{L}*|kilk\\p{L}*|roku|lat|dnia|dni|tygodnia|tygodni|miesiąca|miesięcy|godziny|godzin|minuty|minut|sekund\\p{L}*|jednego|jednej|dwóch|trzech|całego|całej|pierwsz\\p{L}*|ubiegł\\p{L}*|tego|tej|życia|doby)(?![\\p{L}]))"
        fix: "w ciągu"
      # The noun "bezsens" has a genitive "bezsensu"; after "to"/"jest" or alone it is "bez sensu".
      - regex: "(?:(?<=(?:^|[^\\p{L}])(?:to|jest|był|była|było|są|byłoby|totalnie|zupełnie|kompletnie|całkiem|trochę){{S}})|(?=\\p{L})(?<=(?:^|[.!?…:;][\"”’»)]{0,3}[ \\t\\u00a0\\n]{1,8}|\\n[ \\t\\u00a0]{0,8})))(?<target>bezsensu)(?![\\p{L}])(?!{{S}}(?:istnienia|życia|tego|wojny|świata)(?![\\p{L}]))"
        fix: "bez sensu"
  - id: pl.compounds
    checks: [englishClosedCompounds, englishAlotCorrection]
    style: match
    message: review_msg_closed_compound
    sets:
      # Nouns and adjectives that end like past forms.
      COMPOUND_NOT_PAST:
        [
          siła,
          siły,
          skała,
          skały,
          ciało,
          ciała,
          działo,
          działa,
          mogiła,
          mogiły,
          chwała,
          chwały,
          żyła,
          żyły,
          nawała,
          chwili,
          sali,
          fali,
          stali,
          soli,
          roli,
          woli,
          cali,
          dali,
          wali,
          brali,
          pała,
          pały,
          pali,
          śmiały,
          biały,
          mały,
          cały,
          stały,
          dały,
          wały,
          zapał,
          zapały,
          upał,
          upały,
          kanał,
          kanały,
          szał,
          szały,
          bali,
          dział,
          działy,
          materiał,
          materiały,
          ideał,
          ideały,
          rytuał,
          rytuały,
          okazały,
          spały,
        ]
    defs:
      COMPOUND_NOUN_PHRASE_BEFORE: 'new RegExp(`(?:^|[^\\p{L}])(?:${PREPOSITIONS}|tej|tym|tego|ta|to|te|ten|swojej|mojej|jego|jej)[ \\t\\u00a0]+$`, "iu")'
      # An infinitive ("pomóc", "zrobić"), not a noun in -ść or a numeral in -ęć.
      compoundInfinitive:
        args: "word: string"
        return: >-
          (/ć$/u.test(word) && !/(?:ść|ęć|sieć|płeć|nić|mać|śmierć|łokieć|paznokieć|kmieć|śmieć)$/u.test(word)) ||
          /(?:^|[^\p{L}])(?:\p{L}*(?:móc|biec|piec|rzec|strzec|wlec|tłuc|ciec)|jeść|nieść|wieść|kraść|prząść|gnieść|paść|siąść|usiąść)$/u.test(word)
      COMPOUND_MODAL: "/^(?:mógł|mogła|mogło|mogli|mogły|chciał|chciała|chciało|chcieli|chciały|musiał|musiała|musiało|musieli|musiały|miał|miała|miało|mieli|miały|umiał|umiała|umieli|potrafił|potrafiła|potrafili|wolał|wolała|woleli|zdołał|zdołała|zdołali|powinien|powinna|powinno|powinni)$/iu"
      # Forms that are verbs, pronouns, ordinals or nouns despite the ending.
      COMPOUND_NIE_APART: '/(?:zna|^można|stanie|staniu|^inn\p{L}*|^jedyn\p{L}*|^setn\p{L}*|tysięczn\p{L}*|^sam\p{L}*|głow[aeyąę]|mow[aeyąę]|słow[aeoyąę]|budow[aeyąę]|połow[aeyąę]|krow[aeyąę]|^ścian\p{L}*|^zmian\p{L}*|^cen[aeyąę]|^win[aeyąę]|^stron\p{L}*|^scen\p{L}*|^więcej|^mniej|^bardziej)$/iu'
    frames:
      # "zrobił by", "chciał bym": the conditional "by" with its person ending joins the past form;
      # the conjunction "by" before an infinitive stays apart.
      - regex: "(?<![\\p{L}\\p{N}_'’-])(?<verb>{{PAST_VERB}})(?<space>{{S}})(?<by>by|bym|byś|byśmy|byście)(?![\\p{L}\\p{N}_'’-])"
        scan: polish
        flags: giu
        let:
          before: ctx.text.slice(Math.max(0, m.index - 24), m.index)
          # The words after "by": an infinitive or a past form makes it the conjunction ("przyszedł by
          # go zobaczyć", "chciał bym przyszedł").
          next: '(ctx.text.slice(m.index + m[0].length, m.index + m[0].length + 60).match(/\p{L}+/gu) ?? []).slice(0, 4)'
        when:
          - "!(COMPOUND_NOT_PAST.has(verb.toLowerCase()) || verb.length < 3)"
          # "w tej chwili by", "na fali by": a noun phrase, not a verb.
          - "!COMPOUND_NOUN_PHRASE_BEFORE.test(before)"
          # A person ending ("bym") or a modal ("mógł by zrobić") makes it the conditional.
          - "!(by.length === 2 && !COMPOUND_MODAL.test(verb) && next.some((word) => compoundInfinitive(word.toLowerCase())))"
          - '!/^\p{L}*(?:ł|ła|ło|li|ły)$/u.test(next[0] ?? "")'
          - "!plUserOrNamed(ctx, m[0])"
        return: >-
          plFindingAt(ctx, m.index, m.index + m[0].length, [plCaseLike(m[0], verb + by.toLowerCase())],
          "englishClosedCompounds", "review_msg_closed_compound")
      # "zrobili śmy": the personal ending "-śmy"/"-ście" is never a word of its own.
      - regex: "(?<![\\p{L}\\p{N}_'\\u2019-])(?<word>\\p{L}{2,30})(?<space>[ \\t\\u00A0]{1,8})(?<ending>\\u015Bmy|\\u015Bcie)(?![\\p{L}\\p{N}_'\\u2019-])"
        scan: polish
        flags: giu
        when:
          - "/(?:li|ły|by|ło|ła)$/iu.test(word)"
          - "!plUserOrNamed(ctx, m[0])"
        return: >-
          plFindingAt(ctx, m.index, m.index + m[0].length, [plCaseLike(m[0], word + ending.toLowerCase())],
          "englishClosedCompounds", "review_msg_closed_compound")
      # "nie" is written together with adjectives, adjectival participles, comparatives,
      # adjective-based adverbs and nouns in -ość/-anie (the 2026 rules: "niedobry", "niepalący",
      # "nielepszy", "nietrudno", "niepalenie"). It stays apart in a contrast ("nie dobry, lecz zły"),
      # in a question and after "to" ("To nie zły pomysł").
      - regex: "(?<![\\p{L}\\p{N}_'’-])(?<nie>nie)(?<sp>[ \\t\\u00a0]+)(?<word>{{NIE_FORMS}})(?![\\p{L}\\p{N}_-])"
        scan: polish
        flags: giu
        let:
          after: m.index + m[0].length
          sentenceBefore: 'ctx.text.slice(Math.max(0, m.index - 200), m.index).split(/[.!?…\n]/u).at(-1) ?? ""'
          sentenceAfter: 'ctx.text.slice(after, after + 200).split(/[.!…\n]/u)[0] ?? ""'
        when:
          - '!(COMPOUND_NIE_APART.test(word) || /^\p{Lu}/u.test(word))'
          # A question, or "to nie …" / "czy nie …": the negation is the sentence's, not the word's.
          - '!sentenceAfter.includes("?")'
          - '!/(?:^|[^\p{L}])(?:to|czy|czyż|że|żeby|gdyby|jakby|by|a|ale|lecz|ani)[ \t ]+$/iu.test(sentenceBefore)'
          # A comparison keeps the contrastive "nie": "nie lepszy od poprzednika".
          - '!/^[ \t ]+(?:od|niż)(?!\p{L})/iu.test(sentenceAfter)'
          # A contrast: "nie dobry, lecz zły", "nie tyle X, ile Y".
          - '!/^[^;:]{0,60}?(?:,[ \t ]*(?:ale|lecz|tylko|a|jednak)|[ \t ]lecz)(?!\p{L})/iu.test(sentenceAfter)'
          - "!plUserOrNamed(ctx, m[0])"
        return: >-
          plFindingAt(ctx, m.index, after, [plCaseLike(nie, "nie") + word.toLowerCase()],
          "englishClosedCompounds", "review_msg_closed_compound")
  - id: pl.confusionsFrames
    checks: [englishPhraseCorrections]
    style: polish
    message: review_msg_contextual_grammar
    maps:
      CONFUSION_CLITIC_LONG: { Mi: Mnie, Mu: Jemu, Go: Jego, Cię: Ciebie }
