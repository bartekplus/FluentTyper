      CONFUSION_KAZAC: { ze: że, zesz: żesz, zę: żę, zemy: żemy, zecie: żecie, żą: żą }
      CONFUSION_PRONOUN_LONG: { cię: ciebie, go: niego, mi: mnie }
      CONFUSION_PRONOUN_STRESSED: { mi: mnie, ci: tobie, mu: niemu }
