      - regex: "(?<!(?:^|[^\\p{L}])(?:w|we|z|ze|na|do|od|ode|po|za|przy|przed|przede|nad|nade|pod|pode|dla|bez|u|ku|przez|przeze|między|o|wśród|spod|znad|zza|sprzed|ode|beze|przeze|dla|daj|dajcie|dał|dała|dali|dać){{S}})(?<target>mnie)(?={{S}}więcej{{S}}(?:\\d|pół|co|tyle|tak|jak|w|o|od|do|na|przez|tydzień|godzinę|rok|miesiąc|dwa|dwie|trzy|cztery|pięć|sześć|siedem|osiem|dziewięć|dziesięć|sto|tysiąc|połowa|połowę|połowie|tak){{NOT_LETTER}})"
        fix: "mniej"
      - regex: "(?<=coraz{{S}})(?<target>mnie)(?!{{S}}(?:mniej|więcej){{NOT_LETTER}})(?={{S}}\\p{L})"
        fix: "mniej"
      # "rzec można" (one might say) is set off by commas or opens "że".
      - regex: "(?<target>rzecz)(?={{S}}można(?:{{S}}by)?[ \\t\\u00a0]*(?:,|{{S}}że{{NOT_LETTER}}))"
        fix: "rzec"
      - regex: "(?<=(?:można|trzeba|by{{S}}tak|tak){{S}}(?:by{{S}})?)(?<target>rzecz)(?=[ \\t\\u00a0]*(?:[,–—-]|$)|{{S}}że{{NOT_LETTER}})"
        fix: "rzec"
      # "W zależność od potrzeb" opening a clause; "popadł w zależność od" is the noun.
      - regex: "(?:(?=\\p{L})(?<=(?:^|[.!?…:;][\"”’»)]{0,3}[ \\t\\u00a0\\n]{1,8}|\\n[ \\t\\u00a0]{0,8}))|(?<=,{{S}}))(?<target>w{{S}}zależność)(?={{S}}od{{NOT_LETTER}})"
        fix: "w zależności"
      # "Zarówno X, jak Y" -> "jak i Y": the pair is "zarówno …, jak i …" (not an aside "jak wiadomo").
      - regex: "(?<=(?<![\\p{L}])zarówno{{S}}[^,.;:!?\\n]{1,80},{{S}})(?<target>jak)(?={{S}}(?!(?:i|też|również|także|wiadomo|widać|sądzę|myślę|się|już|mówiono|wspomniano|wiesz|wiecie){{NOT_LETTER}})\\p{L})"
        fix: "jak i"
      # A preposition takes the long pronoun: "do cię" -> "do ciebie", "dla mi" -> "dla mnie",
      # "przeciw mu" -> "przeciwko niemu" ("do mi" is also a pair of notes; "dzięki ci" thanks).
      - regex: "(?<=(?<![\\p{L}])(?:do|dla|od|u|bez|koło|obok|wokół|według|zamiast|oprócz|prócz|na|przez|o|za){{S}})(?<target>cię|go|mi){{NOT_LETTER}}"
        let:
          pronoun: target.toLowerCase()
          preposition: '/(\p{L}+)[ \t ]+$/u.exec(m.input.slice(0, m.index))![1].toLowerCase()'
        when: '!(pronoun === "mi" && (preposition === "do" || preposition === "za"))'
        return: CONFUSION_PRONOUN_LONG[pronoun]
      - regex: "(?<=(?<![\\p{L}])(?:ku|przeciw|przeciwko|wbrew){{S}})(?<target>mi|ci|mu){{NOT_LETTER}}"
        return: CONFUSION_PRONOUN_STRESSED[target.toLowerCase()]
      # "zarówno zyski i straty" -> ", jak i" when no "jak" follows in the sentence.
      - regex: "(?=\\p{L})(?<=(?<![\\p{L}])zarówno(?:{{S}}\\p{L}+){0,2}{{S}})(?!jak{{S}})(?<target>(?<word>\\p{L}+){{S}}i)(?={{S}}\\p{L})(?![^.!?;\\n]*(?<![\\p{L}])jak{{NOT_LETTER}})"
        verbatim: true
        return: word + ", jak i"
      # "Czym więcej, tym lepiej" -> "Im"; "im dłużej…, o tyle" -> "tym": the correlative pair is
      # "im …, tym …".
      - regex: "(?<![\\p{L}])(?<target>czym)(?={{S}}{{COMPARATIVE}}{{NOT_LETTER}}[^.!?;\\n]{0,80},{{S}}tym{{NOT_LETTER}})"
        fix: "im"
      - regex: "(?<=(?<![\\p{L}])im{{S}}{{COMPARATIVE}}{{NOT_LETTER}}[^.!?;\\n]{0,80},{{S}})(?<target>o{{S}}tyle){{NOT_LETTER}}"
        fix: "tym"
      # "opatrzył w podpis" -> "zaopatrzył w" (supply with); "opatrzyć" takes the instrumental
      # ("opatrzył podpisem"). Not "opatrzono w szpitalu", a place.
      - regex: "(?<target>opatrz(?:yć|ył\\p{L}{0,4}|yli|yły|ę|y|ymy|ycie|ą|ony|ona|one|eni|ono|ywać|ywał\\p{L}{0,4}|uje|ują))(?={{S}}w{{S}}(?:\\p{L}+{{S}})?(?<noun>\\p{L}{3,}){{NOT_LETTER}})"
        let:
          tags: plNounTags(noun)
        when: plOnlyNoun(tags) && tagsAnd(tags, plCases("As Ap")) !== 0 && !tagsAnd(tags, plCases("Ls Lp"))
        return: '"za" + target.toLowerCase()'
      # "kilka meczy" -> "meczów" ("koza meczy" bleats).
      - regex: "(?<=(?:wiele|kilka|kilku|kilkanaście|kilkunastu|kilkadziesiąt|dużo|mało|sporo|parę|pięć|sześć|siedem|osiem|dziewięć|dziesięć|liczba|liczby|liczbę|seria|serii|serię|setki|tysiące|wszystkich|ostatnich|kolejnych|rozegranych|wygranych|przegranych|domowych|wyjazdowych){{S}})(?<target>meczy){{NOT_LETTER}}"
        fix: "meczów"
      # "w Zakopanym" -> "w Zakopanem": the town keeps its old locative.
      - regex: "(?<=(?:w|we|o|po|przy){{S}})(?<target>Zakopanym){{NOT_LETTER}}"
        verbatim: true
        fix: "Zakopanem"
      # "Tak, proszę panią," -> "proszę pani": the address takes the genitive ("proszę panią o
      # pomoc" asks her for help).
      - regex: "(?<=(?<![\\p{L}])proszę{{S}})(?<target>panią)(?=[ \\t\\u00a0]*(?:[,.!?…—–]|$))"
        fix: "pani"
      # "ani raz nie" -> "ani razu nie": the negation takes the genitive.
      - regex: "(?<=(?<![\\p{L}])ani{{S}})(?<target>raz)(?={{S}}nie{{NOT_LETTER}})"
        fix: "razu"
      # "w szeregu przypadkach" -> "w szeregu przypadków": "szereg" (a number of) takes the genitive.
      - regex: "(?<=(?<![\\p{L}])w{{S}}szeregu{{S}})(?<target>\\p{L}+ach){{NOT_LETTER}}"
        let:
          forms: plInflect(target, plCases("Gp"))
        return: "plOnlyNoun(plNounTags(target)) && forms.length === 1 ? forms[0] : null"
      # "roku dwutysięcznego drugiego" -> "dwa tysiące drugiego": only the last word is ordinal.
      - regex: "(?<target>dwutysięczn(?:y|ego|ym|emu|a|ej|ą|e){{S}}(?<last>(?:pierwsz|drug|trzec|czwart|piąt|szóst|siódm|ósm|dziewiąt|dziesiąt)\\p{L}*)){{NOT_LETTER}}"
        return: '"dwa tysiące " + last'
      # "Możliwym jest" -> "Możliwe jest": the predicate adjective takes the neuter nominative.
      - regex: "(?=\\p{L})(?<=(?:^|[.!?…:;][\"”’»)]{0,3}[ \\t\\u00a0\\n]{1,8}|\\n[ \\t\\u00a0]{0,8}))(?<target>(?<stem>Możliw|Prawdopodobn|Konieczn|Wskazan|Niezbędn|Oczywist|Wiadom|Zrozumiał|Pewn|Jasn)ym)(?={{S}}(?:jest|było|będzie){{NOT_LETTER}})"
        return: stem + "e"
      # "na początku XX" -> "na początku XX wieku": a century in Roman numerals needs its noun.
      - regex: "(?<=(?<![\\p{L}])(?:na{{S}}początku|w{{S}}połowie|pod{{S}}koniec|u{{S}}schyłku|u{{S}}zarania|w{{S}}pierwszej{{S}}połowie|w{{S}}drugiej{{S}}połowie){{S}})(?<target>[IVX]{1,5})(?![\\p{L}\\p{N}])(?![ \\t\\u00a0]*(?:[–—-]|w\\.|wiek|stuleci|tysiącleci|i{{S}}[IVX]|lub|albo|,{{S}}[IVX]))"
        verbatim: true
        return: '/^[IVX]+$/u.test(target) ? target + " wieku" : null'
      # "dwadzieścia %" -> "dwadzieścia procent": the sign goes with digits only.
      - regex: "(?<=(?<![\\p{L}])(?:dwa|trzy|cztery|pięć|sześć|siedem|osiem|dziewięć|dziesięć|\\p{L}+naście|\\p{L}+dzieścia?|\\p{L}+dziesiąt|sto|kilka|kilkanaście|kilkadziesiąt|pół){{S}})(?<target>%)"
        fix: "procent"
      # "hyperłącze" -> "hiperłącze": Polish spells the Greek prefix with "i".
      - regex: "(?<![\\p{L}])(?<target>hyper(?<rest>\\p{L}{4,})){{NOT_LETTER}}"
        return: '/^\p{Ll}/u.test(target) ? "hiper" + rest : null'
      # "100 tyś. żołnierzy" -> "tys.": the abbreviation of "tysięcy" has no "ś".
      - regex: "(?<=\\p{N}{{S}})(?<target>tyś\\.?){{NOT_LETTER}}"
        verbatim: true
        fix: "tys."
      # Abbreviations written with a slash: "d/s" (do spraw) -> "ds.", "w/w" (wyżej wymieniony)
      # -> "ww.", "w/g" (według) -> "wg".
      - regex: "(?<![\\p{L}\\p{N}/.])(?<target>(?<word>d/s|w/w|w/g)\\.?)(?![\\p{L}\\p{N}/])"
        let:
          lower: word.toLowerCase()
        # "wg" takes no dot of its own; a dot after it ends the sentence.
        return: 'lower === "w/g" ? "wg" + target.slice(3) : lower === "d/s" ? "ds." : "ww."'
      # "Ile warzy ten monitor?", "warzy 2 kilo" -> "waży" ("warzyć" is to brew).
      - regex: "(?<=(?<![\\p{L}])ile(?:{{S}}\\p{L}+){0,2}{{S}})(?<target>warzy|warzą){{NOT_LETTER}}"
        return: target.replace("rz", "ż")
      - regex: "(?<target>warzy|warzą)(?={{S}}(?:\\d|około|ok\\.|ponad|prawie|niecałe|niemal|tylko|zaledwie|aż){{NOT_LETTER}})"
        return: target.replace("rz", "ż")
      # "odbywają się zagranicą" -> "za granicą" after a verb; "z zagranicą", "bliską zagranicą"
      # are the noun.
      - regex: "(?<=(?<![\\p{L}])(?<verb>\\p{L}+){{S}})(?<target>zagranicą){{NOT_LETTER}}"
        let:
          lower: verb.toLowerCase()
        return: 'lower === "się" || plFiniteVerb(lower) ? "za granicą" : null'
      # "Zmianie podleją" -> "podlegają" ("podleją" is "they will water").
      - regex: "(?<=(?<![\\p{L}])(?:zmianie|zmianom|ochronie|karze|opodatkowaniu|kontroli|regulacji|przepisom|ustawie){{S}})(?<target>podleją){{NOT_LETTER}}"
        fix: "podlegają"
      - regex: "(?<target>podleją)(?={{S}}(?:zmianie|zmianom|ochronie|karze|opodatkowaniu|kontroli|regulacji|przepisom|ustawie){{NOT_LETTER}})"
        fix: "podlegają"
      # "Gliwice leża w województwie" -> "leżą" ("leża" is a lair's genitive).
      - regex: "(?<target>leża)(?={{S}}(?:w|we|na|nad|pod|przy|obok|blisko|niedaleko){{NOT_LETTER}})"
        fix: "leżą"
      # "Zrobiłem to od tak." -> "ot tak" ("od tak dawna" is the preposition).
      - regex: "(?<target>od{{S}}tak)(?=[ \\t\\u00a0]*(?:[.,!?…;]|$))"
        fix: "ot tak"
      # "naważyli sobie piwa" -> "nawarzyli": one brews ("warzy") the beer of the idiom.
      - regex: "(?<target>naważ\\p{L}*)(?=(?:{{S}}\\p{L}+){0,4}{{S}}piw\\p{L}*{{NOT_LETTER}})"
        return: target.replace("naważ", "nawarz")
      - regex: "(?<=piw\\p{L}*(?:,?{{S}}\\p{L}+){0,3}{{S}})(?<target>naważ\\p{L}*)"
        return: target.replace("naważ", "nawarz")
      # "cześć druga", "Cześć IV" -> "część": an ordinal after the noun counts parts too.
      - regex: "(?<target>cześć)(?={{S}}(?:pierwsz|drug|trzeci|czwart|piąt|szóst|końcow)\\p{L}{0,3}{{NOT_LETTER}}|{{S}}(?<numeral>[IVX]{1,4}){{NOT_LETTER}})"
        return: '!numeral || /^[IVX]+$/u.test(numeral) ? "część" : null'
      # "na jednaj z ławek" -> "jednej" ("jednaj" is "win over!").
      - regex: "(?<target>jednaj)(?={{S}}(?:z|ze|\\p{L}+(?:i|y|ej)){{NOT_LETTER}})"
        fix: "jednej"
      # "anie" (no word) for "a nie".
      - regex: "(?<target>anie)(?={{S}}\\p{L})"
        lowercase: true
        fix: "a nie"
  - id: pl.confusions
    checks: [englishPhraseCorrections]
    style: match
    message: review_msg_contextual_grammar
    sets:
      # Counts after which "ze" is the preposition ("ze dwa lata", "ze sto osób").
      ZE_NOT_CONJUNCTION:
        [
          pięć,
          sześć,
          siedem,
          osiem,
          dziewięć,
          dziesięć,
          sto,
          setkę,
          tysiąc,
          kilka,
          kilkanaście,
          kilkadziesiąt,
          parę,
          pół,
          godzinę,
          tydzień,
          miesiąc,
          rok,
          dzień,
        ]
    defs:
      ZE_NEVER_AFTER_PREPOSITION: "/^(?:z|ze|w|we|na|do|od|za|po|pod|nad|przed|przez|przy|dla|bez|nie|się|to|trzeba|chc(?:ę|e|esz|emy|ecie|ą|iał\\p{L}*|ieli\\p{L}*|ieć)|tak|już|jest|są|był|była|było|byli|będzie|źle|dobrze|zawsze|wtedy|teraz|tu|tam|ktoś|coś|ja|ty|on|ona|ono|oni|one|my|wy|mu|mi|go|jej|ich|nic|nikt|wszyscy|wszystko|jeśli|gdy|kiedy|chociaż|jednak)$/iu"
    frames:
      # "ze" for "że": the preposition "ze" only stands before "mną" and words opening with two
      # consonants ("ze snu", "ze względu"), or loosely before a number ("ze dwa lata"). Before a vowel
      # or a single consonant and a vowel it can only be the conjunction.
      - regex: "(?<![\\p{L}\\p{N}_'\\u2019-])(?<ze>ze)(?<sp>[ \\t\\u00A0]{1,8})(?<next>\\p{L}+)"
        scan: polish
        flags: gu
        let:
          tags: plNounTags(next.toLowerCase())
          # No preposition takes these: "ze z tą", "ze źle", "ze to", nor a noun in a case "ze" does not
          # govern ("ze grupa").
          clash: plOnlyNoun(tags) && !tagsAnd(tags, plCases("Gs Is As Gp Ip Ap"))
          rest: next.replace(/^(?:ch|cz|dz|dź|dż|rz|sz)/iu, "c")
          before: ctx.text.slice(Math.max(0, m.index - 16), m.index)
        when:
          # Names and acronyms ("ze Lwowa", "ze ZUS-u") take the preposition loosely.
          - '!(/^\p{Lu}/u.test(next) || ZE_NOT_CONJUNCTION.has(next.toLowerCase()))'
          # Sibilant onsets take a nonstandard "ze" preposition more often than a typo.
          - >-
            ZE_NEVER_AFTER_PREPOSITION.test(next) || clash || (!/^(?:[sśzźż]|rz)/iu.test(next) &&
            (/^[aąeęioóuy]/iu.test(rest) || /^[aąeęioóuy]/iu.test(rest.slice(1))))
          # "wraz ze", "zgodnie ze": the word before already asks for the preposition.
          - '!/(?:^|[^\p{L}])(?:wraz|raz|razem|wspólnie|zgodnie|porównaniu|wspólnego)[ \t ]+$/iu.test(before)'
          - "!plUserOrNamed(ctx, ze)"
        return: >-
          plFindingAt(ctx, m.index, m.index + 2, [plCaseLike(ze, "że")], "englishPhraseCorrections",
          "review_msg_contextual_grammar")
  # Numbers in Polish prose: a digit takes no case ending ("5-ty" is "5." or "piąty", "6-ciu" is
  # "6" or "sześciu"), a digit compound takes a hyphen ("5-minutowy", "3-krotny"), and a numeral
  # governs its noun's form ("dwoje dzieci", "5 złotych", "100 gramów").
  - id: pl.numerals
    checks: [polishNumerals]
    style: match
    message: review_msg_pl_numeral_suffix
    maps:
      NUMERAL_COLLECTIVE:
        dwa: dwoje
        trzy: troje
        cztery: czworo
        pięć: pięcioro
        sześć: sześcioro
        siedem: siedmioro
        osiem: ośmioro
        dziewięć: dziewięcioro
        dziesięć: dziesięcioro
        jedenaście: jedenaścioro
        dwanaście: dwanaścioro
        trzynaście: trzynaścioro
        czternaście: czternaścioro
        piętnaście: piętnaścioro
        szesnaście: szesnaścioro
        siedemnaście: siedemnaścioro
        osiemnaście: osiemnaścioro
        dziewiętnaście: dziewiętnaścioro
        dwadzieścia: dwadzieścioro
        trzydzieści: trzydzieścioro
        czterdzieści: czterdzieścioro
        pięćdziesiąt: pięćdziesięcioro
        sześćdziesiąt: sześćdziesięcioro
        siedemdziesiąt: siedemdziesięcioro
        osiemdziesiąt: osiemdziesięcioro
        dziewięćdziesiąt: dziewięćdziesięcioro
      # Nouns counted with collective numerals, nominative plural -> genitive plural.
      NUMERAL_COLLECTIVE_NOUNS:
        dzieci: dzieci
        drzwi: drzwi
        oczy: oczu
        uszy: uszu
        sanie: sań
        kurczęta: kurcząt
        kocięta: kociąt
        szczenięta: szczeniąt
        źrebięta: źrebiąt
        cielęta: cieląt
        prosięta: prosiąt
        pisklęta: piskląt
        niemowlęta: niemowląt
    defs:
      # Spelled-out cardinals (nominative, then the personal "-u" form) for 1–10.
      NUMERAL_CARDINALS: >-
        ({ 1: ["jeden", "jednego"], 2: ["dwa", "dwóch"], 3: ["trzy", "trzech"], 4: ["cztery", "czterech"],
        5: ["pięć", "pięciu"], 6: ["sześć", "sześciu"], 7: ["siedem", "siedmiu"], 8: ["osiem", "ośmiu"],
        9: ["dziewięć", "dziewięciu"], 10: ["dziesięć", "dziesięciu"] }) as
        Readonly<Record<number, readonly [string, string]>>
      # The numeral nouns ("piątka", "setka") without their "-ka" ending.
      NUMERAL_NOUN_STEMS: >-
        ({ 1: "jedyn", 2: "dwój", 3: "trój", 4: "czwór", 5: "piąt", 6: "szóst", 7: "siódem", 8: "ósem",
        9: "dziewiąt", 10: "dziesiąt", 11: "jedenast", 12: "dwunast", 13: "trzynast", 14: "czternast",
        15: "piętnast", 16: "szesnast", 17: "siedemnast", 18: "osiemnast", 19: "dziewiętnast",
        20: "dwudziest", 30: "trzydziest", 40: "czterdziest", 50: "pięćdziesiąt", 60: "sześćdziesiąt",
        70: "siedemdziesiąt", 80: "osiemdziesiąt", 90: "dziewięćdziesiąt", 100: "set", 200: "dwuset",
        300: "trzyset", 400: "czteryset", 500: "pięćset", 600: "sześćset", 700: "siedemset",
        800: "osiemset", 900: "dziewięćset" }) as Readonly<Record<number, string>>
      # The fixes of a case ending typed after a number ("5-ty" -> "5.", "6-ciu" -> "sześciu").
      numeralSuffixFix:
        args: "num: string, ending: string, next: string | undefined"
        let:
          roman: "/^[IVXLC]+$/.test(num)"
          n: "roman ? 0 : Number(num)"
          end: ending.toLowerCase()
        # "10-cio", "4-ro" are compound stems ("dziesięcio-"): the digits alone. An ordinal day
        # before a month name is written without a dot: "21 maja".
        return: >-
          roman ? (/^(?:go|ego|tego|ty|tym|wiecz|ym)$/u.test(end) ? [num] : null)
          : /^(?:{{NUMERAL_NOUN_END}})$/u.test(end) ? numeralNounFix(num, n, end)
          : /^(?:{{CARDINAL_END}})$/u.test(end)
          ? (!NUMERAL_CARDINALS[n] || /^(?:ro|oro|cio|mio|dmio|ścio)$/u.test(end) ? [num]
          : [/^(?:u|ciu|miu|ściu|tu|stu|ech|óch|ch)$/u.test(end) ? NUMERAL_CARDINALS[n][1] : NUMERAL_CARDINALS[n][0], num])
          : next && /^(?:stycznia|lutego|marca|kwietnia|maja|czerwca|lipca|sierpnia|września|października|listopada|grudnia)$/iu.test(next)
          ? [num] : [num + "."]
      numeralNounFix:
        args: "num: string, n: number, end: string"
        let:
          stem: NUMERAL_NOUN_STEMS[n]
          caseEnding: /(?:kami|kach|kom|ka|ki|kę|ką|ce|ek)$/u.exec(end)?.[0]
        return: "!stem || !caseEnding ? [num] : [stem + caseEnding, num]"
      numeralSuffixFinding:
        args: "ctx: DetectContext, num: string, end: string, next: string | undefined, start: number, tokenEnd: number"
        let:
          fixed: numeralSuffixFix(num, end, next)
        when: fixed !== null
        return: plFindingAt(ctx, start, tokenEnd, fixed, "polishNumerals", "review_msg_pl_numeral_suffix")
      # The forms of "złoty" and "grosz": one, two to four, five and more, a fraction.
      NUMERAL_CURRENCY: >-
        ({ złoty: ["złoty", "złote", "złotych", "złotego"], złote: ["złoty", "złote", "złotych", "złotego"],
        złotych: ["złoty", "złote", "złotych", "złotego"], grosz: ["grosz", "grosze", "groszy", "grosza"],
        grosze: ["grosz", "grosze", "groszy", "grosza"], groszy: ["grosz", "grosze", "groszy", "grosza"] }) as
        Readonly<Record<string, readonly [string, string, string, string]>>
      # 1 złoty; 2–4 złote (not 12–14); else złotych; a fraction takes "złotego".
      numeralPluralForm:
        args: "amount: string, forms: readonly [string, string, string, string]"
        let:
          n: 'Number(amount.replace(/[\s ]/g, ""))'
          lastTwo: n % 100
          last: n % 10
        return: >-
          /[.,]\d/.test(amount) ? forms[3] : n === 1 ? forms[0]
          : last >= 2 && last <= 4 && !(lastTwo >= 12 && lastTwo <= 14) ? forms[1] : forms[2]
      # Unit names that take the plural after a number: "100 gramów", "2 kilogramy".
      NUMERAL_UNITS: >-
        ({ gram: ["gramy", "gramów"], kilogram: ["kilogramy", "kilogramów"], dekagram: ["dekagramy", "dekagramów"],
        miligram: ["miligramy", "miligramów"], wolt: ["wolty", "woltów"], amper: ["ampery", "amperów"],
        wat: ["waty", "watów"], kilowat: ["kilowaty", "kilowatów"] }) as
        Readonly<Record<string, readonly [string, string]>>
      NUMERAL_WORDS: >-
        ({ dwa: 2, trzy: 3, cztery: 4, pięć: 5, sześć: 6, siedem: 7, osiem: 8, dziewięć: 9, dziesięć: 10,
        dwadzieścia: 20, trzydzieści: 30, czterdzieści: 40, pięćdziesiąt: 50, sto: 100, dwieście: 200,
        trzysta: 300, pięćset: 500, tysiąc: 1000, kilka: 5, kilkanaście: 15, kilkadziesiąt: 50,
        kilkaset: 500 }) as Readonly<Record<string, number>>
    frames:
      # A digit (or Roman numeral), a dash or nothing, then a closed set of endings; not a unit ("5kg"):
      # "5-ty" is "5." or "piąty", "6-ciu" is "6" or "sześciu".
      - regex: "(?<![\\p{L}\\p{N}_.,/-])(?<num>\\d{1,4}|[IVXLC]{1,7})(?<dash>[ \\t]?[-—–][ \\t]?|’|')?(?<end>{{ORDINAL_END}}|{{CARDINAL_END}}|{{NUMERAL_NOUN_END}})(?![\\p{L}\\p{N}_-])(?<rest>[ \\t\\u00a0]+(?<next>\\p{L}+))?"
        scan: polish
        flags: gu
        let:
          start: m.index
          tokenEnd: start + num.length + (dash?.length ?? 0) + end.length
        when:
          # Glued without a dash, only the unmistakable ordinal endings ("21go", "90tych").
          - "!(!dash && !/^(?:go|ego|tego|ty|tych|tym|szy|wszy|gi|ci|ciu|miu|stu)$/u.test(end))"
          - "!(dash && /^['’]$/.test(dash) && !/^(?:ty|go|ego|tych)$/u.test(end))"
        # "32-u bitowy", "4-ro pasmowa": the digit joins the adjective with a hyphen. "32-u i 64-bitowe":
        # the first digit keeps only its hyphen.
        return: >-
          next && /^(?:u|ro|cio|mio|dmio|ścio|ciu|miu|o|ech|óch|oma)$/u.test(end) &&
          /^\p{Ll}+(?:ow|n|t|sk|cz|ln|ni)(?:y|a|e|ego|ej|emu|ą|ym|ych|ymi|i)$/u.test(next) &&
          !/^(?:lat|osób|ludzi)/u.test(next)
          ? plFindingAt(ctx, start, tokenEnd + rest.length, [num + "-" + next], "polishNumerals",
          "review_msg_pl_numeral_hyphen")
          : /^(?:u|ro|cio|mio|dmio|ścio|ciu|o)$/u.test(end) &&
          /^[ \t ]+(?:i|lub|albo|oraz|czy)[ \t ]+\d+-\p{L}/u.test(ctx.text.slice(tokenEnd, tokenEnd + 24))
          ? plFindingAt(ctx, start, tokenEnd, [num + "-"], "polishNumerals", "review_msg_pl_numeral_hyphen")
          : numeralSuffixFinding(ctx, num, end, next, start, tokenEnd)
      # "dwu krotnie", "ilu krotny": a numeral stem typed apart from "-krotny".
      - regex: "(?<![\\p{L}\\p{N}_-])(?<num>dwu|trzy|cztero|pi\\u0119cio|sze\\u015Bcio|siedmio|o\\u015Bmio|dziewi\\u0119cio|dziesi\\u0119cio|kilku|kilkunasto|kilkudziesi\\u0119cio|wielo|ilu|paru|stu)[ \\t\\u00a0]{1,3}(?<part>krotn\\p{L}*)(?![\\p{L}\\p{N}_-])"
        scan: polish
        flags: giu
        when: "!plUserOrNamed(ctx, m[0])"
        return: >-
          plFindingAt(ctx, m.index, m.index + m[0].length, [num + part.toLowerCase()], "polishNumerals",
          "review_msg_pl_numeral_hyphen")
      # A digit compound typed apart: "5 minutowy" (a five-minute ...), "3 krotny", "25 latek".
      # Only singular adjective forms: after a plural numeral a plural adjective can agree on its own
      # ("2 roczne raporty" are two annual reports).
      - regex: "(?<![\\p{L}\\p{N}_.,/-])(?<num>\\d{1,4})(?<gap>[ \\t\\u00a0]*['’][ \\t\\u00a0]*|[ \\t\\u00a0]+[-–—][ \\t\\u00a0]+|[ \\t\\u00a0]+[-–—]|[-–—][ \\t\\u00a0]+|[–—]|\\.[ \\t\\u00a0]{1,3}(?=krotn)|[ \\t\\u00a0]{1,3})(?<part>{{COMPOUND_PART}})(?![\\p{L}\\p{N}_-])"
        scan: polish
        flags: giu
        when:
          # "letni"/"roczny" with 1 is fine both ways; "letni" alone is "summer": only after 2+.
          - "!(/^(?:letni|roczn|dzienn)/iu.test(part) && Number(num) < 2)"
          # "25 letni" may be a summer day; with a dash ("25 - letni") it is the compound.
          - "!(/^(?:letni)$/iu.test(part) && !/[-–—]/u.test(gap))"
          - "!plUserOrNamed(ctx, part)"
        return: >-
          plFindingAt(ctx, m.index, m.index + m[0].length, [num + "-" + part.toLowerCase()],
          "polishNumerals", "review_msg_pl_numeral_hyphen")
      # "dwa dzieci" -> "dwoje dzieci": nouns counted with collective numerals.
      - regex: "(?<![\\p{L}\\p{N}])(?<num>dwa|trzy|cztery|pięć|sześć|siedem|osiem|dziewięć|dziesięć|jedenaście|dwanaście|trzynaście|czternaście|piętnaście|szesnaście|siedemnaście|osiemnaście|dziewiętnaście|dwadzieścia|trzydzieści|czterdzieści|pięćdziesiąt|sześćdziesiąt|siedemdziesiąt|osiemdziesiąt|dziewięćdziesiąt)(?<sp>[ \\t\\u00a0]+)(?<noun>dzieci|drzwi|oczy|uszy|sanie|kurczęta|kocięta|szczenięta|źrebięta|cielęta|prosięta|pisklęta|niemowlęta)(?![\\p{L}])"
        scan: polish
        flags: giu
        when:
          - "!plUserOrNamed(ctx, m[0])"
          # "rozmowa w cztery oczy" (in private) is an idiom.
          - '!/(?:^|[^\p{L}])w[ \t ]+$/iu.test(ctx.text.slice(Math.max(0, m.index - 4), m.index))'
        return: >-
          plFindingAt(ctx, m.index, m.index + m[0].length,
          [plCaseLike(m[0], `${NUMERAL_COLLECTIVE[num.toLowerCase()]}${sp}${NUMERAL_COLLECTIVE_NOUNS[noun.toLowerCase()]}`)],
          "polishNumerals", "review_msg_pl_numeral_noun")
      # 1 złoty; 2–4 złote (not 12–14); else złotych; a fraction takes "złotego". A noun after
      # "złote" makes it the adjective "golden": "2 złote medale".
      - regex: "(?<![\\p{L}\\p{N}.,])(?<amount>\\d{1,3}(?:[ \\u00a0]\\d{3})*(?:[.,]\\d+)?)(?<sp>[ \\t\\u00a0]+)(?<unit>złoty|złote|złotych|grosz|grosze|groszy)(?![\\p{L}])(?=[ \\t\\u00a0]*(?:[.!?,;:)…]|$|[ \\t\\u00a0](?:i|a|na|za|do|od|w|z|ze|to|netto|brutto|miesięcznie|rocznie|dziennie)(?![\\p{L}])))"
        scan: polish
        flags: gu
        let:
          wanted: numeralPluralForm(amount, NUMERAL_CURRENCY[unit])
          start: m.index + amount.length + sp.length
        when: wanted !== unit
        return: >-
          plFindingAt(ctx, start, start + unit.length, [wanted], "polishNumerals",
          "review_msg_pl_numeral_noun")
      # Unit names that take the plural after a number: "100 gramów", "2 kilogramy".
      - regex: "(?<![\\p{L}\\p{N}.,])(?<num>\\d{1,6}|dwa|trzy|cztery|pięć|sześć|siedem|osiem|dziewięć|dziesięć|dwadzieścia|trzydzieści|czterdzieści|pięćdziesiąt|sto|dwieście|trzysta|pięćset|tysiąc|kilka|kilkanaście|kilkadziesiąt|kilkaset)(?<sp>[ \\t\\u00a0]+)(?<unit>gram|kilogram|dekagram|miligram|wolt|amper|wat|kilowat)(?![\\p{L}])(?![ \\t\\u00a0]+(?:w|na|z|ze|o)(?![\\p{L}]))"
        scan: polish
        flags: giu
        let:
          n: '/^\d+$/.test(num) ? Number(num) : NUMERAL_WORDS[num.toLowerCase()]'
          forms: NUMERAL_UNITS[unit.toLowerCase()]
          lastTwo: n % 100
          wanted: "n % 10 >= 2 && n % 10 <= 4 && !(lastTwo >= 12 && lastTwo <= 14) ? forms[0] : forms[1]"
          start: m.index + num.length + sp.length
        when:
          - n !== 1
          - "!plUserOrNamed(ctx, unit)"
        return: >-
          plFindingAt(ctx, start, start + unit.length, [wanted], "polishNumerals",
          "review_msg_pl_numeral_noun")
  # Dates: a day the month does not have ("31 września", "29 lutego 2023"), a weekday that does
  # not fall on the date, a range that runs backwards, and the month's form after a day number
  # ("1 stycznia", not "1 styczeń", "1. stycznia" or the English-style "1 Sty").
  - id: pl.dates
    checks: [polishDates]
    style: match
    message: review_msg_pl_impossible_date
    defs:
      DATE_NOMINATIVE: '["styczeń", "luty", "marzec", "kwiecień", "maj", "czerwiec", "lipiec", "sierpień", "wrzesień", "październik", "listopad", "grudzień"]'
      DATE_ABBREVIATED: '["sty", "lut", "mar", "kwi", "maj", "cze", "lip", "sie", "wrz", "paź", "lis", "gru"]'
      DATE_ROMAN: '["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII"]'
      # Weekdays in the nominative, Sunday first as Date.getUTCDay counts.
      NOMINATIVE_WEEKDAYS: '["niedziela", "poniedziałek", "wtorek", "środa", "czwartek", "piątek", "sobota"]'
      # The centuries in Roman numerals, from 1.
      DATE_ROMAN_CENTURY: '["", "I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII", "XIII", "XIV", "XV", "XVI", "XVII", "XVIII", "XIX", "XX", "XXI"]'
      # Weekday stems (every case) and abbreviations, Monday first as in Polish calendars.
      DATE_WEEKDAYS: >-
        [[/^(?:poniedział\p{L}*|pon|pn)$/iu, 1], [/^(?:wtor\p{L}*|wt)$/iu, 2], [/^(?:środ\p{L}*|śr|sr)$/iu, 3],
        [/^(?:czwart\p{L}*|czw|cz)$/iu, 4], [/^(?:piąt\p{L}*|pt)$/iu, 5], [/^(?:sobot\p{L}*|sob|so)$/iu, 6],
        [/^(?:niedziel\p{L}*|niedz|nd|ndz)$/iu, 0]] as readonly (readonly [RegExp, number])[]
      # A weekday right before the date ("wtorek, 27 sierpnia 2014") or after it ("…2014, wtorek",
      # "(wtorek)").
      DATE_WEEKDAY_BEFORE: '/(?<![\p{L}])(?<w>poniedział\p{L}*|wtor\p{L}*|środ\p{L}*|czwart\p{L}*|piąt\p{L}*|sobot\p{L}*|niedziel\p{L}*|pon\.?|pn\.?|wt\.?|śr\.?|czw\.?|pt\.?|sob\.?|niedz\.?|nd\.?)[ \t ]*,?[ \t ]*$/iu'
      DATE_WEEKDAY_AFTER: '/^[ \t ]*[,(][ \t ]*(?<w>poniedział\p{L}*|wtor\p{L}*|środ\p{L}*|czwart\p{L}*|piąt\p{L}*|sobot\p{L}*|niedziel\p{L}*|pon\.?|pn\.?|wt\.?|śr\.?|czw\.?|pt\.?|sob\.?|niedz\.?|nd\.?)(?![\p{L}])/iu'
      dateMonthOf:
        args: "word: string"
        let:
          lower: word.toLowerCase()
          roman: DATE_ROMAN.indexOf(word.toUpperCase())
          genitive: PL_MONTHS_GENITIVE.indexOf(lower)
        return: "/^[ivx]+$/i.test(word) && roman >= 0 ? roman + 1 : genitive >= 0 ? genitive + 1 : DATE_NOMINATIVE.indexOf(lower) + 1"
      dateWeekdayNamed:
        args: "word: string"
        let:
          bare: 'word.replace(/\.$/, "")'
        return: DATE_WEEKDAYS.find(([regex]) => regex.test(bare))?.[1] ?? null
      # A weekday next to the date that does not fall on it. No year: the years the date can mean
      # (reviewClock).
      dateWeekday:
        args: "ctx: DetectContext, month: number, y: number | undefined, d: number, start: number, end: number"
        let:
          years: "y === undefined ? plYearsFor(month, d, plContextYear(ctx.text, start, ctx.lang)) : [y]"
          weekdays: "[...new Set(years.map((year) => plWeekdayOf(year, month, d)))]"
          before: DATE_WEEKDAY_BEFORE.exec(ctx.text.slice(Math.max(0, start - 24), start))
          after: DATE_WEEKDAY_AFTER.exec(ctx.text.slice(end, end + 24))
          named: before ?? after
          said: dateWeekdayNamed(named.groups!.w)
          key: 'y === undefined ? "review_msg_weekday_no_year" : "review_msg_pl_weekday_date"'
          typed: named.groups!.w
          wordStart: "before ? start - before[0].length : end + after![0].indexOf(typed)"
          # A weekday in the nominative ("wtorek, 13 października") is replaced. After a
          # preposition ("w środę") the case changes the form, so it only gets a warning.
          afterPreposition: '/(?:^|[^\p{L}])(?:w|we|na|od|do|przez|za|po|przed)[ \t ]+$/iu.test(ctx.text.slice(Math.max(0, wordStart - 12), wordStart))'
        when:
          - named !== null
          - said !== null && years.length > 0 && !weekdays.includes(said)
        # The day can be the slip instead: nothing is preselected.
        return: >-
          !afterPreposition && NOMINATIVE_WEEKDAYS.includes(typed.toLowerCase())
          ? { ...plFindingAt(ctx, wordStart, wordStart + typed.length,
          weekdays.map((w) => plCaseLike(typed, NOMINATIVE_WEEKDAYS[w])), "polishDates", key),
          requiresChoice: true as const }
          : plFindingAt(ctx, Math.max(0, before ? start - before[0].length : end),
          before ? end : end + after![0].length, [], "polishDates", key)
    frames:
      # "27 sierpnia 2014", "27 VIII 2014", "31 września", and dotted "27.08.2014": a day the
      # month does not have, or a weekday that does not fall on the date.
      - regex: "(?<![\\p{L}\\p{N}.,/-])(?:(?<day>\\d{1,2})[ \\t\\u00a0]+(?<mword>{{MONTH_WORD}})(?:[ \\t\\u00a0]+(?<year>\\d{3,4})(?![\\p{N}]))?(?![\\p{L}\\p{N}])|(?<dday>\\d{1,2})\\.(?<dmonth>\\d{1,2})\\.(?<dyear>[0-9]{4})(?![\\p{N}]|\\.\\p{N}))"
        scan: polish
        flags: giu
        let:
          dayText: day ?? dday
          yearText: year ?? dyear
          month: "mword ? dateMonthOf(mword) : Number(dmonth)"
          y: "yearText ? Number(yearText) : undefined"
          d: Number(dayText)
        when:
          # A Roman month needs a year, or it may be a chapter or a list number.
          - "!(mword && /^[IVX]+$/.test(mword) && !yearText)"
          - "!(mword && /^[ivx]+$/.test(mword))"
        return: >-
          month < 1 || month > 12 || d < 1 || d > plDaysInMonth(month, y)
          ? plFindingAt(ctx, m.index, m.index + m[0].length, [], "polishDates", "review_msg_pl_impossible_date")
          : dateWeekday(ctx, month, y, d, m.index, m.index + m[0].length)
  - id: pl.isoDates
    checks: [polishDates]
    style: match
    message: review_msg_pl_impossible_date
    frames:
      # An ISO date that no calendar has ("2025-02-30", "2023-02-29"). The year first makes the
      # form clear in each language. A fourth numeric part before or after ("1-2025-02-30",
      # "2025-02-30-7", "2025-02-30.1") makes it an ID, not a date. Arabic-Indic digits count too
      # ("٢٠٢٥-٠٢-٣٠"). Markdown emphasis around the date is not a word ("_2025-02-30_"); an
      # underscore glued to a word is ("build_2025-02-30_x"). The match start owns the match.
      - regex: "{{ISO_DATE}}"
        flags: gdu
        owner: none
        let:
          range: plInvalidIsoDate(m, ctx)
        return: 'range && plFindingAt(ctx, range.start, range.end, [], "polishDates", "review_msg_pl_impossible_date")'
  - id: pl.datesFrames
    checks: [polishDates]
    style: match
    message: review_msg_pl_impossible_date
    frames:
      # "11–1 lutego", "od 11 do 1 lutego": the range ends before it starts.
      - regex: "(?<![\\p{L}\\p{N}.,/-])(?<a>\\d{1,2})(?:[ \\t\\u00a0]*[–—-][ \\t\\u00a0]*|[ \\t\\u00a0]+do[ \\t\\u00a0]+)(?<b>\\d{1,2})[ \\t\\u00a0]+(?:stycznia|lutego|marca|kwietnia|maja|czerwca|lipca|sierpnia|września|października|listopada|grudnia|XII|XI|X|IX|VIII|VII|VI|V|IV|III|II|I)(?![\\p{L}])"
        scan: polish
        flags: giu
        when: Number(a) >= Number(b)
        return: >-
          plFindingAt(ctx, m.index, m.index + m[0].length, [], "polishDates",
          "review_msg_pl_impossible_date")
      # "1915–1840", "1855–40": a year range that runs backwards or repeats.
      - regex: "(?<![\\p{L}\\p{N}.,/-])(?<a>\\d{3,4})[ \\t\\u00A0]*[\\u2013\\u2014-][ \\t\\u00A0]*(?<b>\\d{1,4})(?![\\p{N}.,]\\d|[\\p{L}\\p{N}-])"
        scan: polish
        flags: gu
        let:
          after: ctx.text.slice(m.index + m[0].length, m.index + m[0].length + 24)
          # Years before Christ run backwards: "1814–1781 p.n.e." is right, "715–1840 p.n.e." is not.
          beforeChrist: '/^[ \t ]*(?:p\.?[ \t ]*n\.?[ \t ]*e|przed[ \t ]+(?:naszą|Chrystusem)|BC)/iu.test(after)'
          before: ctx.text.slice(Math.max(0, m.index - 16), m.index)
          startYear: Number(a)
          endYear: "b.length < a.length ? Number(a.slice(0, a.length - b.length) + b) : Number(b)"
        when:
          - '!/^[ \t ]*\d/u.test(after)'
          # "1962 – 272" is a year and a count; a longer end year is a year only before Christ.
          - "!(b.length !== a.length && b.length > 2 && !(beforeChrist && b.length > a.length))"
          # Only in a year context: "w latach", "w okresie", "lata".
          - '/(?:latach|lata|okresie|sezonie|rok\p{L}*|w|od)[ \t ]+$/iu.test(before)'
          - "!(beforeChrist ? endYear < startYear : endYear > startYear)"
        return: >-
          plFindingAt(ctx, m.index, m.index + m[0].length, [], "polishDates",
          "review_msg_pl_impossible_date")
      # "1 styczeń 2000", "Pierwszy styczeń": the month after a day is in the genitive.
      - regex: "(?<![\\p{L}\\p{N}.,/-])(?<day>\\d{1,2}|pierwszy|drugi|trzeci|czwarty|piąty)(?<dot>\\.)?(?<sp>[ \\t\\u00a0]+)(?<month>styczeń|luty|marzec|kwiecień|maj|czerwiec|lipiec|sierpień|wrzesień|październik|listopad|grudzień|stycznia|lutego|marca|kwietnia|maja|czerwca|lipca|sierpnia|września|października|listopada|grudnia)(?![\\p{L}])"
        scan: polish
        flags: giu
        let:
          index: DATE_NOMINATIVE.indexOf(month.toLowerCase())
          spelled: '/^\p{L}/u.test(day)'
          genitive: "index >= 0 ? PL_MONTHS_GENITIVE[index] : month.toLowerCase()"
          start: m.index + day.length + sp.length
        when:
          # "Maj" capitalized after "1" names the holiday; "w maju" etc. never reach here.
          - '!(index >= 0 && /^\p{Lu}/u.test(month))'
          - "!(index < 0 && !dot)"
          - "!(spelled && (dot || index < 0))"
        # "1. stycznia": no dot after the day before a month name.
        return: >-
          dot ? plFindingAt(ctx, m.index, m.index + m[0].length, [day + sp + genitive], "polishDates",
          "review_msg_pl_month_form")
          : plFindingAt(ctx, start, start + month.length, [plCaseLike(month, genitive)], "polishDates",
          "review_msg_pl_month_form")
      # "21 Sty 2012": an English-style month abbreviation between day and year.
      - regex: "(?<![\\p{L}\\p{N}.,/-])(?<day>\\d{1,2})(?<sp1>[ \\t\\u00a0]+)(?<month>sty|lut|mar|kwi|maj|cze|lip|sie|wrz|paź|lis|gru)\\.?(?<sp2>[ \\t\\u00a0]+)(?<year>\\d{4})(?![\\p{L}\\p{N}])"
        scan: polish
        flags: giu
        let:
          index: DATE_ABBREVIATED.indexOf(month.toLowerCase())
        # "1 maj 2012" is the nominative month, which monthForms puts in the genitive.
        when: month !== "maj"
        return: >-
          plFindingAt(ctx, m.index, m.index + m[0].length,
          [`${day} ${DATE_ROMAN[index]} ${year}`, `${day} ${PL_MONTHS_GENITIVE[index]} ${year}`],
          "polishDates", "review_msg_pl_month_form")
      # Decades are written with the decade and the century: "lata 90. XX w.", not "lata 1990."
      # (an English calque).
      - regex: "(?<=(?:^|[^\\p{L}])(?:{{DECADE_WORDS}}){{S}})(?<year>1\\d[0-9]0|20[0-9]0)\\."
        scan: polish
        flags: giu
        let:
          value: Number(year)
          century: DATE_ROMAN_CENTURY[Math.floor(value / 100) + 1]
        # "lata 1900." has no "lata 00.": the fix names the years ("lata 1900–1909").
        return: >-
          plFindingAt(ctx, m.index, m.index + m[0].length,
          [value % 100 ? `${value % 100}. ${century} w.` : `${value}–${value + 9}`], "polishDates",
          "review_msg_pl_decade")
      # A year takes no apostrophe ("lata '90", "Euro '2012").
      - regex: "(?<![\\p{L}\\p{N}])(?<mark>['’])(?<year>\\d{4}|\\d{2})(?![\\p{L}\\p{N}'’])"
        scan: polish
        flags: gu
        let:
          before: ctx.text.slice(Math.max(0, m.index - 12), m.index)
          # "Euro '2012": a full year needs no apostrophe; "lata '90" is the decade "90.".
          fixed: >-
            year.length === 4 ? year
            : /(?:^|[^\p{L}])(?:{{DECADE_WORDS}})[ \t ]+$/iu.test(before)
            ? (/^[ \t ]*[.]/u.test(ctx.text.slice(m.index + m[0].length)) ? year : year + ".")
            : null
        when: fixed !== null
        return: >-
          plFindingAt(ctx, m.index, m.index + m[0].length, [fixed], "polishDates",
          "review_msg_pl_decade")
      # "12 V 20015 r.", "w maju 20015 roku": a year with a digit typed twice.
      - regex: "(?<![\\p{L}])(?:{{MONTH_WORD}}|{{LOCATIVE}}|roku){{S}}(?<year>[12]\\d{4})(?=[ \\t\\u00a0]{0,8}(?:r\\.|rok\\p{L}*)(?![\\p{L}]))"
        scan: polish
        flags: giu
        let:
          # Drop one digit of a doubled pair: one year from 1000 to 2099, or no fix.
          years: >-
            [...new Set(Array.from({ length: year.length - 1 }, (_, i) => i + 1)
            .filter((i) => year[i] === year[i - 1]).map((i) => year.slice(0, i) + year.slice(i + 1)))]
            .filter((fix) => /^(?:1\d|20)\d\d$/.test(fix))
          start: m.index + m[0].length - year.length
        when: years.length === 1
        return: >-
          plFindingAt(ctx, start, start + year.length, years, "polishDates",
          "review_msg_pl_impossible_date")
  # Polish commas: a subordinate clause is set off by a comma before its conjunction or relative
  # pronoun ("Wiem, że…", "dom, w którym…"), and a compound conjunction takes the comma before
  # it as a whole ("…, mimo że", not "mimo, że").
  - id: pl.misplacedCommas
    checks: [polishMisplacedComma]
    style: match
    message: review_msg_pl_misplaced_comma
    maps:
      # First word of a compound conjunction -> the words that may follow it. "tyle że" only after
      # a comma or at the sentence start: "Zjadł tyle, że pękł" (so much that).
      COMMA_COMPOUNDS:
        {
          mimo: że|iż,
          pomimo: że|iż,
          podczas: gdy,
          chyba: że|żeby|by,
          nawet: jeśli|jeżeli|gdy|gdyby|kiedy,
          jeszcze: zanim,
          a: więc,
          o: ile,
          pod warunkiem: że|iż,
          tyle: że,
        }
    sets:
      # Words after which no comma opens the clause: conjunctions, and the sentence's start.
      COMMA_NO_COMMA_AFTER:
        [
          i,
          a,
          oraz,
          lub,
          albo,
          bądź,
          ani,
          czy,
          bo,
          ale,
          lecz,
          niż,
          jak,
          jakby,
          że,
          iż,
          żeby,
          aby,
          by,
          gdy,
          kiedy,
          jeśli,
          jeżeli,
          gdyby,
          który,
          która,
          które,
          którego,
          której,
          którym,
          których,
          którzy,
          to,
        ]
    defs:
      COMMA_PAIRS: "({ tak: /^czy\\s/iu, chcąc: /^nie\\s+chcąc$/iu, bądź: /^co\\s+bądź$/iu, byle: /^jak$/iu, chybił: /^trafił$/iu, wypisz: /^wymaluj$/iu }) as Readonly<Record<string, RegExp>>"
    frames:
      # "mimo, że" -> "mimo że": a compound conjunction takes the comma before it as a whole.
      - regex: "(?<![\\p{L}\\p{N}])(?:(?<prev>\\p{L}+)(?<gap>[ \\t\\u00a0]+))?(?<head>mimo|pomimo|podczas|chyba|nawet|jeszcze|a|o|pod[ \\t\\u00a0]+warunkiem|tyle)[ \\t\\u00a0]*,[ \\t\\u00a0]*(?<tail>że|iż|gdy|żeby|by|jeśli|jeżeli|gdyby|kiedy|zanim|więc|ile)(?![\\p{L}])"
        scan: polish
        flags: giu
        let:
          headKey: 'head.toLowerCase().replace(/\s+/g, " ")'
          headStart: "m.index + (prev ? prev.length + gap.length : 0)"
          joined: head + " " + tail
        when:
          - 'new RegExp(`^(?:${COMMA_COMPOUNDS[headKey]})$`, "iu").test(tail)'
          # "O, ile tu ludzi!" is the interjection "o".
          - '!(headKey === "o" && /^O$/.test(head) && plSentenceStart(ctx.text, headStart))'
          # "wtedy nawet, gdy" (even then, when) and "czy tak, czy owak" keep their comma; "mimo",
          # "podczas" and "pod warunkiem" are never read apart ("tam mimo, że" -> "tam, mimo że").
          - "!(prev && !/^(?:mimo|pomimo|podczas|pod)/iu.test(headKey) && /^(?:wtedy|wówczas|tylko|właśnie|tam|tu|czy)$/iu.test(prev))"
          - '!(headKey === "tyle" && (prev || !/(?:^|[,.!?…]\s*|\n\s*)$/u.test(ctx.text.slice(Math.max(0, headStart - 8), headStart))))'
        # "tam mimo, że" -> "tam, mimo że": the comma moves before the conjunction.
        return: >-
          prev && !COMMA_NO_COMMA_AFTER.has(prev.toLowerCase()) && !plUserOrNamed(ctx, prev)
          ? plFindingAt(ctx, m.index, m.index + m[0].length, [prev + "," + gap + joined], "polishMisplacedComma",
          "review_msg_pl_misplaced_comma")
          : plFindingAt(ctx, headStart, m.index + m[0].length, [joined], "polishMisplacedComma",
          "review_msg_pl_misplaced_comma")
      # Set phrases written without a comma: "tak czy owak", "chcąc nie chcąc".
      - regex: "(?<![\\p{L}])(?<phrase>(?<a>tak|chcąc|bądź|byle|chybił|wypisz)[ \\t\\u00a0]*,[ \\t\\u00a0]*(?<b>czy[ \\t\\u00a0]+(?:siak|owak|inaczej)|nie[ \\t\\u00a0]+chcąc|co[ \\t\\u00a0]+bądź|jak|trafił|wymaluj))(?![\\p{L}])"
        scan: polish
        flags: giu
        when:
          - '!/(?:^|[^\p{L}])czy[ \t ]+$/iu.test(ctx.text.slice(Math.max(0, m.index - 8), m.index))'
          # "Tak, czy inaczej?" can answer a question; only mid-sentence or before more text.
          - COMMA_PAIRS[a.toLowerCase()]?.test(b)
        return: >-
          plFindingAt(ctx, m.index, m.index + phrase.length, [a + " " + b], "polishMisplacedComma",
          "review_msg_pl_misplaced_comma")
      # No comma before "itd."/"itp.". The match starts at the first space of a run: a long run of
      # spaces is read once, not at each space.
      - regex: "(?<![ \\t\\u00a0])(?<comma>[ \\t\\u00a0]*,)(?=[ \\t\\u00a0]*(?:itd|itp|etc)\\.)"
        scan: polish
        flags: gu
        # "itp., itd.": a list of abbreviations.
        when: ctx.text[m.index - 1] !== "."
        return: >-
          plFindingAt(ctx, m.index, m.index + comma.length, [""], "polishMisplacedComma",
          "review_msg_pl_misplaced_comma")
      # "Do, czego", "nie wiem z, kim", "dom w, którym": a comma after a preposition, before the
      # pronoun it governs. The comma goes before the preposition, or away at the sentence start.
      - regex: "(?<![\\p{L}\\p{N}])(?:(?<prev>\\p{L}+)(?<gap>[ \\t\\u00a0]+))?(?<prep>za[ \\t\\u00a0]+pomocą|w|we|z|ze|na|do|od|ode|po|za|przy|przed|przede|nad|nade|pod|pode|dla|bez|u|ku|przez|przeze|między|o|wśród|spod|znad|zza|sprzed)[ \\t\\u00a0]*,[ \\t\\u00a0]*(?<pronoun>co|czego|czemu|czym|kogo|komu|kim|{{RELATIVE}}|{{JAKI}})(?![\\p{L}])"
        scan: polish
        flags: giu
        let:
          prepStart: "m.index + (prev ? prev.length + gap.length : 0)"
          end: m.index + m[0].length
          joined: prep + " " + pronoun
          moved: prev && !COMMA_NO_COMMA_AFTER.has(prev.toLowerCase()) && !plSentenceStart(ctx.text, prepStart)
        when:
          # "O, kogo widzę!": the interjection "o" opens the sentence.
          - "!(/^o$/iu.test(prep) && (!prev || COMMA_NO_COMMA_AFTER.has(prev.toLowerCase())))"
          # "bez, co gorsza, kurtki": an aside opens after the preposition.
          - '!/^[ \t ]*\p{L}+[ \t ]*,/u.test(ctx.text.slice(end, end + 30))'
        return: >-
          plFindingAt(ctx, moved ? m.index : prepStart, end, [moved ? prev + "," + gap + joined : joined],
          "polishMisplacedComma", "review_msg_pl_misplaced_comma")
  - id: pl.missingCommas
    checks: [polishMissingComma]
    style: match
    message: review_msg_pl_missing_comma
    defs:
      # What makes the word after a subordinator part of a set phrase: "kiedy indziej", "póki co".
      COMMA_SET_AFTER: >-
        ({ kiedy: /^(?:indziej|niekiedy|bądź)$/iu, gdzie: /^(?:indziej|niegdzie|bądź)$/iu,
        dlaczego: /^(?:innego|innym)$/iu }) as Readonly<Record<string, RegExp>>
      COMMA_RELATIVE_WORD: /^(?:{{RELATIVE}})$/
      COMMA_JAKI_WORD: /^(?:{{JAKI}})$/
      COMMA_QUESTION_OR_RELATIVE: /^(?:dlaczego|gdzie|kiedy|{{RELATIVE}})$/
      # Words after which the conjunction belongs to what comes before (compounds, coordination).
      COMMA_OPENS_COMPOUND: >-
        new Set([..."i a oraz lub albo bądź ani czy bo ale lecz niż jak jakby aż tylko właśnie nawet zwłaszcza szczególnie zaś dlatego mimo pomimo chyba tyle tak również także jednak jednakże przecież no pewnie jasne choć chociaż nie to wtedy wówczas raz co byle lada wiadomo potem zaraz dopiero jeszcze przy może omal nieomal prawie niemal więc zatem przeto przynajmniej dość jako tym bardziej daj mało rzadko warunkiem razie miarę chwili momencie czasie zamiast podczas dzięki wobec wie diabli licho oto".split(" "),
        ..."{{SUBORDINATORS}}".split("|")])
      # Which conjunctions each adverb may stand before.
      COMMA_ADVERB_SUBS: >-
        ({ tylko: /^(?:że|żeby|aby|by|gdy|kiedy)$/u, tak: /^(?:żeby|ażeby|aby|by)$/u, właśnie: /^(?:że|gdy|kiedy)$/u,
        "z tym": /^(?:że|iż)$/u }) as Readonly<Record<string, RegExp>>
      COMMA_SUBJECT_OR_OBJECT: /^(?:nie|ja|ty|on|ona|ono|my|wy|oni|one|go|ją|je|mu|mi|ci|się|to|mnie|cię|nas|was|ich|jej|im|nam|wam)$/u
      # A compound conjunction takes the comma before it as a whole: "zdradził, mimo że".
      COMMA_COMPOUND_TAILS: >-
        ({ mimo: /^(?:że|iż)$/u, pomimo: /^(?:że|iż)$/u, nawet: /^(?:jeśli|jeżeli|gdy|kiedy|gdyby\p{L}{0,5})$/u,
        dopiero: /^(?:gdy|kiedy|jak)$/u, zwłaszcza: /^(?:że|gdy|kiedy|jeśli|jeżeli)$/u,
        szczególnie: /^(?:że|gdy|kiedy|jeśli|jeżeli)$/u, "tym bardziej": /^(?:że|iż)$/u,
        "pod warunkiem": /^(?:że|iż)$/u, podczas: /^gdy$/u }) as Readonly<Record<string, RegExp>>
      # "który" opens a relative clause here: not a question ("o której?"), not the indefinite
      # "którego z" or "zaniemógł który", and no comma a few words back already opens the clause
      # ("w trakcie którego", "za pomocą którego", "uzwojenie którego"). "i w czasie której":
      # coordinated with an earlier relative; "złapać którego ptaka": indefinite.
      commaRelativeClause:
        args: "ctx: DetectContext, start: number, end: number"
        let:
          after: ctx.text.slice(end, end + 200)
          before: ctx.text.slice(Math.max(0, start - 60), start)
          clause: 'before.split(/[,;:—–(]/u).at(-1) ?? ""'
          words: 'clause.match(/\p{L}+/gu) ?? []'
        when:
          - '!/^[ \t ]*(?:[.!?,;:…)"”»]|z[ \t ])/u.test(after)'
          - '!/^[^.!?\n]*\?/u.test(after)'
          - "!words.slice(-4).some((word) => /^(?:i|oraz|a|lub|albo)$/iu.test(word))"
          - '!/ć$/u.test(words.at(-1) ?? "")'
        return: "words.length > 3 || !/[,;:—–(]/u.test(before)"
        else: "false"
      # "to że" -> "to, że", unless a particle comes before ("no to że").
      commaToZe:
        args: "ctx: DetectContext, m: RegExpExecArray, prev: string, gap: string"
        let:
          before: '/(\p{L}+)[ \t ]+$/u.exec(ctx.text.slice(Math.max(0, m.index - 24), m.index))?.[1]'
        when: "!!before && !/^(?:no|i|a|ale|bo|lecz|tylko|właśnie|nawet|tak|jak|mimo|pomimo)$/iu.test(before) && !plUserOrNamed(ctx, before)"
        return: plFindingAt(ctx, m.index, m.index + prev.length + gap.length, [prev + "," + gap], "polishMissingComma", "review_msg_pl_missing_comma")
      # A comma before a conjunction or a relative pronoun.
      commaMissing:
        args: "ctx: DetectContext, m: RegExpExecArray, prev: string, gap: string, prep: string | undefined, sub: string, lowerPrev: string, relative: boolean"
        let:
          end: m.index + m[0].length
          next: '/^[ \t ]+(\p{L}+)/u.exec(ctx.text.slice(end, end + 40))?.[1] ?? ""'
        when:
          # A preposition only goes with the relative pronoun: "dom w którym".
          - "!(prep && !relative)"
          - "!(COMMA_OPENS_COMPOUND.has(lowerPrev) || PREPOSITION_WORDS.has(lowerPrev))"
          # "ale" before punctuation is the noun ("bez żadnych ale"); "ale" opening an exclamation.
          - '!((sub === "ale" || sub === "lecz") && !/^[ \t ]+\p{L}/u.test(ctx.text.slice(m.index + m[0].length, m.index + m[0].length + 3)))'
          - '!(plUserOrNamed(ctx, prev) || /^\p{Lu}+$/u.test(prev))'
          - "!COMMA_SET_AFTER[sub]?.test(next)"
          # A bare question word ends the sentence without a comma: "Nie powie dlaczego."
          - "!(!next && /^(?:dlaczego|gdzie|kiedy)$/.test(sub))"
          - 'sub !== "by" || commaPurposeBy(ctx, prev, lowerPrev, next, end)'
          # "jaki" opens a clause after a noun or an infinitive ("założeń, jakie mamy", "wyobrazić,
          # jakie to było"), not as a question or an exclamation ("Jaki piękny dzień!"), not as
          # "some" before a number ("jakich trzydziestu tysięcy") or after a comparison ("jak
          # bałwan jaki").
          - >-
            !(COMMA_JAKI_WORD.test(sub) && (!(/ć$/u.test(prev) || plOnlyNoun(plNounTags(prev.toLowerCase()))) ||
            !next || /^(?:\d|pół|półtor|jed|dw|trz|czter|pięć|pięci|sześ|siedem|siedmi|osiem|ośmi|dziewię|dziesię|kilk|par|set|stu|sto|tysi)/iu.test(next) ||
            /^[^.!\n]*[?!]/u.test(ctx.text.slice(end, end + 200)) ||
            /(?:^|[^\p{L}])(?:jak|niczym|jakby)[ \t ]+$/iu.test(ctx.text.slice(Math.max(0, m.index - 12), m.index))))
          # "zamiast" opens a clause only before an infinitive ("zamiast pracować"), not a noun.
          - '!(sub === "zamiast" && !/(?:ć|c)$/u.test(next))'
          # A direct question keeps its question word: "A ty gdzie idziesz?".
          - '!(COMMA_QUESTION_OR_RELATIVE.test(sub) && /^[^.!\n]*\?/u.test(ctx.text.slice(end, end + 200)))'
          # "złapać którego ptaka": after an infinitive "który" is the indefinite pronoun.
          - "!(relative && (/ć$/u.test(prev) || !commaRelativeClause(ctx, m.index, m.index + m[0].length)))"
        return: plFindingAt(ctx, m.index, m.index + prev.length + gap.length, [prev + "," + gap], "polishMissingComma", "review_msg_pl_missing_comma")
      # "by" opens a clause of purpose before an infinitive ("wstąpił do domu, by się przebrać");
      # "można by zrobić", "mógł by zrobić" (split "mógłby") keep the conditional particle.
      # "Pokład szorowano by nie zostały ślady", "Pracuję by dzieci miały co jeść": after an
      # impersonal or present verb, "by" with a past form opens a clause of purpose too.
      commaPurposeBy:
        args: "ctx: DetectContext, prev: string, lowerPrev: string, next: string, end: number"
        let:
          verb: 'next === "się" ? (/^[ \t ]+się[ \t ]+(\p{L}+)/u.exec(ctx.text.slice(end, end + 60))?.[1] ?? "") : next'
          clause: '/^[ \t]+(?:\p{L}+[ \t]+){0,2}?(\p{Ll}+(?:ł|ła|ło|li|ły))(?![\p{L}])/u.exec(ctx.text.slice(end, end + 60))?.[1]'
          purpose: >-
            clause !== undefined && (plFiniteVerb(clause) || plAmbiguousVerb(clause)) &&
            (plImpersonalVerb(lowerPrev) || (plFiniteVerb(lowerPrev) && !/(?:ł|ła|ło|li|ły)$/u.test(lowerPrev)))
        return: >-
          purpose || !(!/(?:ć|móc|biec|wlec|strzec|piec|rzec|tłuc)$/u.test(verb) || plNounTags(verb.toLowerCase()) ||
          /^(?:można|trzeba|warto|wolno|lepiej|dobrze|trudno|łatwo|należy|należało|wypada|wypadało|opłacało|coś|nic)$/iu.test(prev) ||
          /^(?:mógł|mogł|mogl|chcia|chcie|musia|musie|miał|miel|umiał|umiel|potrafi|wola|wole|zdoła|powin)/iu.test(prev))
    frames:
      # "Wiem że", "dom w którym": a subordinate clause is set off by a comma before its
      # conjunction or relative pronoun.
      - regex: "(?<prev>\\p{L}+)(?<gap>[ \\t\\u00a0]+)(?:(?<prep>w|we|z|ze|na|do|od|ode|po|za|przy|przed|przede|nad|nade|pod|pode|dla|bez|u|ku|przez|przeze|między|o|wśród|spod|znad|zza|sprzed)[ \\t\\u00a0]+)?(?<sub>{{SUBORDINATORS}})(?![\\p{L}\\p{N}_'’-])"
        scan: polish
        flags: gu
        let:
          lowerPrev: prev.toLowerCase()
          relative: COMMA_RELATIVE_WORD.test(sub)
        when:
          - '!/\p{Lu}/u.test(sub[0])'
          # The word must start where the match starts (no letters glued before it).
          - '!/[\p{L}\p{N}_''’-]/u.test(ctx.text[m.index - 1] ?? "")'
        # "to że" -> "to, że" ("Chodzi o to, że…"), but not the particle in "no to że".
        return: >-
          lowerPrev === "to" && /^(?:że|iż)$/.test(sub) ? commaToZe(ctx, m, prev, gap)
          : commaMissing(ctx, m, prev, gap, prep, sub, lowerPrev, relative)
      # A compound conjunction takes the comma before it as a whole: "zdradził, mimo że".
      - regex: "(?<![\\p{L}\\p{N}_'’-])(?<prev>\\p{L}+)(?<gap>[ \\t\\u00a0]+)(?<head>mimo|pomimo|nawet|dopiero|zwłaszcza|szczególnie|tym[ \\t\\u00a0]+bardziej|pod[ \\t\\u00a0]+warunkiem|podczas)[ \\t\\u00a0]+(?<tail>\\p{Ll}+)(?![\\p{L}\\p{N}_'’-])"
        scan: polish
        flags: gu
        let:
          lowerPrev: prev.toLowerCase()
          # "Zrobię to pod warunkiem że": "to" is the verb's object here, not "to że".
          object: >-
            lowerPrev === "to" && plFiniteVerb(/(\p{L}+)[ \t ]+$/u.exec(ctx.text.slice(Math.max(0,
            m.index - 30), m.index))?.[1]?.toLowerCase() ?? "")
        when:
          - COMMA_COMPOUND_TAILS[head.replace(/\s+/gu, " ")]?.test(tail)
          - "!(!object && (COMMA_OPENS_COMPOUND.has(lowerPrev) || PREPOSITION_WORDS.has(lowerPrev)))"
          - '!(plUserOrNamed(ctx, prev) || /^\p{Lu}+$/u.test(prev))'
        return: >-
          plFindingAt(ctx, m.index, m.index + prev.length + gap.length, [prev + "," + gap],
          "polishMissingComma", "review_msg_pl_missing_comma")
      # "nie dość że" -> "nie dość, że".
      - regex: "(?<![\\p{L}])[Nn]ie[ \\t\\u00a0]+do\\u015B\\u0107(?=[ \\t\\u00a0]+\\u017Ce(?![\\p{L}]))"
        scan: polish
        flags: gu
        return: >-
          plFindingAt(ctx, m.index, m.index + m[0].length, [m[0] + ","], "polishMissingComma",
          "review_msg_pl_missing_comma")
      # An adverb between a clause and its subordinate conjunction: "wstąpił zatem żeby się przebrać"
      # -> "zatem, żeby"; "uważano jednak iż" -> "jednak, iż"; "poszedł do domu tylko żeby" -> "domu,
      # tylko żeby" or "domu tylko, żeby", "z tym że" -> ", z tym że" or "z tym, że" (the writer
      # chooses where the stress falls).
      - regex: "(?<![\\p{L}\\p{N}_'’-])(?<prev>\\p{L}\\p{Ll}*)(?<gap>[ \\t\\u00a0]+)(?<adverb>tylko|tak|właśnie|z[ \\t\\u00a0]+tym|zatem|więc|przeto|jednak|jednakże|przecież|także|również)(?<gap2>[ \\t\\u00a0]+)(?<sub>żeby|ażeby|aby|by|że|iż|gdy|kiedy)[ \\t\\u00a0]+(?:się[ \\t\\u00a0]+)?(?<next>\\p{L}+)"
        scan: polish
        flags: gu
        let:
          lower: prev.toLowerCase()
          key: 'adverb.replace(/[ \t ]+/gu, " ")'
          end: m.index + prev.length + gap.length + adverb.length + gap2.length + sub.length
        when:
          - "!(COMMA_OPENS_COMPOUND.has(lower) || PREPOSITION_WORDS.has(lower) || plUserOrNamed(ctx, prev))"
          # A capital inside the sentence names something.
          - "!(prev !== lower && !plSentenceStart(ctx.text, m.index))"
          - (COMMA_ADVERB_SUBS[key] ?? /^(?:że|iż|żeby|ażeby|aby|by)$/u).test(sub)
          # "tak by było lepiej": the conditional "by" goes with a finite verb, not an infinitive.
          - '!(sub === "by" && (!/(?:ć|móc|biec|wlec|strzec|piec|rzec|tłuc)$/u.test(next) || plNounTags(next)))'
        # Adverbs that also open the conjunction ("tylko że", "tak żeby"): the comma goes either side.
        return: >-
          plFindingAt(ctx, m.index, end, /^(?:tylko|tak|właśnie|z[ \t ]+tym)$/u.test(adverb)
          ? [prev + "," + gap + adverb + gap2 + sub, prev + gap + adverb + "," + gap2 + sub]
          : [prev + gap + adverb + "," + gap2 + sub], "polishMissingComma", "review_msg_pl_missing_comma")
      # Conjunctions that are also other words ("póki czas", "choć raz", "o ile więcej"): they open a
      # clause, and want the comma before them, only before a verb, "nie" or a pronoun subject.
      - regex: "(?<![\\p{L}\\p{N}_'’-])(?<prev>\\p{L}+(?:-\\p{L}+)?)(?<gap>[ \\t\\u00a0]+)(?<sub>póki|chociaż|choć|dopóty|o[ \\t\\u00a0]+ile)[ \\t\\u00a0]+(?<next>\\p{L}+)"
        scan: polish
        flags: gu
        let:
          lower: prev.toLowerCase()
          nextLower: next.toLowerCase()
        when:
          - "!(COMMA_OPENS_COMPOUND.has(lower) || PREPOSITION_WORDS.has(lower) || plUserOrNamed(ctx, prev))"
          - "!(prev !== lower && !plSentenceStart(ctx.text, m.index))"
          # "Dopóki …, dopóty …": the correlative of a clause that opened the sentence.
          - >-
            sub === "dopóty" ? /^[\s„"(]*dopóki(?![\p{L}])/iu.test(ctx.text.slice(Math.max(0, m.index - 200),
            m.index).split(/[.!?\n]/u).at(-1)!) : COMMA_SUBJECT_OR_OBJECT.test(nextLower) || plFiniteVerb(nextLower)
          # A question keeps "o ile" whole: "O ile wzrosła cena?".
          - '!/^[^.!\n]*\?/u.test(ctx.text.slice(m.index, m.index + 200))'
        return: >-
          plFindingAt(ctx, m.index, m.index + prev.length + gap.length, [prev + "," + gap],
          "polishMissingComma", "review_msg_pl_missing_comma")
  # Prepositions with a vowel-extended form: "we" and "ze" before a hard consonant cluster ("we
  # wtorek", "ze Świecia"), "ode/beze/przeze/przede/nade/pode" before "mnie/mną", and the short
  # form everywhere else.
  - id: pl.prepositionForms
    checks: [polishPrepositionForms]
    style: match
    message: review_msg_pl_preposition_form
    defs:
      # Short form -> long form, used before "mnie"/"mną" (and clusters for w/z).
      PREPOSITION_LONG: >-
        ({ w: "we", z: "ze", od: "ode", bez: "beze", przez: "przeze", przed: "przede", nad: "nade",
        pod: "pode", spod: "spode" }) as Readonly<Record<string, string>>
      PREPOSITION_SHORT: >-
        Object.fromEntries(Object.entries(PREPOSITION_LONG).map(([short, long]) => [long, short])) as
        Readonly<Record<string, string>>
      # The long form's own fixed phrases: "we dwoje", "przede wszystkim", "ode złego", "spode łba".
      PREPOSITION_LONG_KEPT: "/^(?:mnie|mną|dwoje|troje|czworo|dnie|śnie|łzach|wszystkim|łba|złego|drzwi|krwi|mgle|lwie|lwa|lwem|sobą|wszystko)$/iu"
      # The word opens with two consonants (digraphs count as one).
      opensWithCluster:
        args: "word: string"
        let:
          rest: 'word.replace(/^(?:ch|cz|dz|dź|dż|rz|sz)/iu, "c")'
        return: "!/^[aąeęioóuy]/iu.test(rest) && rest.length > 1 && !/^[aąeęioóuy]/iu.test(rest.slice(1))"
      # The form the preposition takes before `next`; null when the typed one may stay.
      preferredForm:
        args: "prep: string, next: string, afterWord: boolean"
        let:
          p: prep.toLowerCase()
          word: next.toLowerCase()
          pronoun: "/^(?:mnie|mną)$/u.test(word)"
        # "s Polski" after a lowercase word too ("gorzały s Polski"), not an initial ("J. S Bach").
        # "od mnie" -> "ode mnie"; "z mną" -> "ze mną"; "w mnie" -> "we mnie". "w wtorek" -> "we
        # wtorek": w/f and a consonant. "z Świecia", "z szkłem": a sibilant and a consonant.
        return: >-
          p === "s" ? (/^\p{Ll}/u.test(next) || afterWord ? "z" : null)
          : PREPOSITION_LONG[p] ? (p === "spod" && word === "łba" ? "spode"
          : pronoun ? (p === "przed" || p === "nad" || p === "pod" || p === "z"
          ? (word === "mną" ? PREPOSITION_LONG[p] : null)
          : word === "mnie" ? PREPOSITION_LONG[p] : null)
          : p === "w" && /^[wf]/u.test(word) && opensWithCluster(word) ? "we"
          : p === "z" && /^(?:[sśzźż]|sz|rz|wsz|wz|ws)/u.test(word) && opensWithCluster(word) ? "ze"
          : null)
          : preferredShort(p, next, word, pronoun)
      # A long form that may become the short one.
      preferredShort:
        args: "p: string, next: string, word: string, pronoun: boolean"
        let:
          short: PREPOSITION_SHORT[p]
        when: "!(!short || pronoun || PREPOSITION_LONG_KEPT.test(word))"
        # "we Wiedniu": a name in w- plus a vowel takes "w" ("we wodzie" may be regional speech).
        # "ze" before a lowercase non-cluster is the conjunction "że" (another check). "ze
        # Sionem", "we wodzie", "w tę i we w tę": sibilant or w-initial words keep it.
        return: >-
          p === "we" && /^\p{Lu}/u.test(next) && /^[wf]/u.test(word) && !opensWithCluster(word) ? "w"
          : (p === "ze" && /^\p{Ll}/u.test(next)) || /^(?:[sśzźżwf]|rz)/u.test(word) || word.length < 2 ||
          opensWithCluster(word) ? null : short
    frames:
      # A preposition and the word after it: "w wtorek" -> "we wtorek", "od mnie" -> "ode mnie".
      - regex: "(?<![\\p{L}\\p{N}_'\\u2019.-])(?<prep>w|we|z|ze|s|od|ode|bez|beze|przez|przeze|przed|przede|nad|nade|pod|pode|spod|spode)(?<sp>[ \\t\\u00A0]+)(?<quote>[\"\\u201E\\u201C\\u00AB]?)(?<next>\\p{L}+)"
        scan: polish
        flags: giu
        let:
          after: m.index + m[0].length
          wanted: >-
            preferredForm(prep, next,
            /\p{Ll}[ \t ]+$/u.test(ctx.text.slice(Math.max(0, m.index - 4), m.index)))
        when:
          # Acronyms and abbreviations ("z ZSRR", "w ww. czasopismach") are read letter by letter.
          - '!(/^\p{Lu}{2,}/u.test(next) || /^\.[ \t ]*\p{Ll}/u.test(ctx.text.slice(after, after + 4)))'
          - wanted !== null && wanted !== prep.toLowerCase()
          - "!plUserOrNamed(ctx, prep)"
        return: >-
          plFindingAt(ctx, m.index, m.index + prep.length, [plCaseLike(prep, wanted)],
          "polishPrepositionForms", "review_msg_pl_preposition_form")
  - id: pl.wordFormsFrames
    checks: [englishPhraseCorrections]
    style: polish
    message: review_msg_pl_abbreviation_dot
    maps:
      # Destinations taken with "na": "jechać na Węgry", not "do Węgier".
      FORMS_NA_PLACES:
        węgier: na Węgry
        białorusi: na Białoruś
        syberii: na Syberię
        moraw: na Morawy
        antarktydy: na Antarktydę
        kubę: na Kubę
        kuby: na Kubę
        malty: na Maltę
        islandii: na Islandię
        sycylii: na Sycylię
        sardynii: na Sardynię
        korsyki: na Korsykę
        krymu: na Krym
        kaszub: na Kaszuby
        mazur: na Mazury
        podhala: na Podhale
        śląska: na Śląsk
        wołoszczyzny: na Wołoszczyznę
        filipin: na Filipiny
        madagaskaru: na Madagaskar
        hawaje: na Hawaje
        hawajów: na Hawaje
    frames:
      # Travel verbs only: "należał do Węgier" (belonged to Hungary) is right.
      - regex: "(?<=(?:jecha\\p{L}*|jadę|jedzie\\p{L}*|jadą|lecie\\p{L}*|leci\\p{L}*|lecę|wyjecha\\p{L}*|wyjeżdża\\p{L}*|wyjedzie\\p{L}*|przyjecha\\p{L}*|pojecha\\p{L}*|pojedzie\\p{L}*|polecia\\p{L}*|poleci\\p{L}*|wylecia\\p{L}*|wybra\\p{L}*{{S}}się|wybiera\\p{L}*{{S}}się|podróż\\p{L}*|wycieczk\\p{L}*|wyjazd\\p{L}*|emigrowa\\p{L}*|wyemigrowa\\p{L}*|uciek\\p{L}*|uciec|wróci\\p{L}*|wraca\\p{L}*){{S}})(?<target>do{{S}}(?<place>węgier|białorusi|syberii|moraw|antarktydy|kubę|kuby|malty|islandii|sycylii|sardynii|korsyki|krymu|kaszub|mazur|podhala|śląska|wołoszczyzny|filipin|madagaskaru|hawaje|hawajów)){{NOT_LETTER}}"
        message: review_msg_contextual_grammar
        return: FORMS_NA_PLACES[place.toLowerCase()]
      # "Ważnym jest, aby": the predicative adjective before a clause is neuter "-e".
      - regex: "(?=\\p{L})(?<!(?:^|[^\\p{L}])(?:w|we|z|ze|na|do|od|ode|po|za|przy|przed|przede|nad|nade|pod|pode|dla|bez|u|ku|przez|przeze|między|o|wśród|spod|znad|zza|sprzed|tym|każdym|jednym|nim|kim|czym){{S}})(?<target>(?<stem>\\p{L}{3,}?)(?<end>ym|im))(?=(?:{{S}}(?:również|także|też|zawsze|zatem|więc))?{{S}}(?:jest|było|byłoby|będzie)(?:{{S}}to)?[ \\t\\u00a0]*,?[ \\t\\u00a0]*(?:że|aby|żeby|by|iż|gdy|jeśli){{NOT_LETTER}})"
        message: review_msg_contextual_grammar
        return: 'stem + (end.toLowerCase() === "im" ? "ie" : "e")'
      - regex: "(?=\\p{L})(?<=(?:jest|było|byłoby|będzie){{S}})(?<target>(?<stem>\\p{L}{3,}?)(?<end>ym|im))(?=[ \\t\\u00a0]*,[ \\t\\u00a0]*(?:aby|żeby|by|że|iż){{NOT_LETTER}})"
        message: review_msg_contextual_grammar
        return: 'stem + (end.toLowerCase() === "im" ? "ie" : "e")'
      # Abbreviations that keep the word's last letter take no dot: "nr 2", "3 mln złotych".
      - regex: "(?<!(?:^|[^\\p{L}])(?:w|we|z|ze|na|do|od|ode|po|za|przy|przed|przede|nad|nade|pod|pode|dla|bez|u|ku|przez|przeze|między|o|wśród|spod|znad|zza|sprzed){{S}})(?<target>(?<abbr>nr|mln|mld|ha|kg|km|cm|mm)\\.)(?=[ \\t\\u00a0]+(?:\\p{L}|\\d))"
        verbatim: true
        return: abbr
      # "3 m. tkaniny", "200 g. mąki": a unit after a number takes no dot inside the sentence.
      - regex: "(?<=\\p{N}{{S}})(?<target>(?<abbr>m|g|mg|ml|dag)\\.)(?=[ \\t\\u00a0]+\\p{L})"
        verbatim: true
        return: abbr
      # "Dr. Kowalski", "mgr. Anna Nowak", "Dr. hab. Nowak" -> no dot before a name in the
      # nominative (the dot marks "doktora", "magistra").
      - regex: "(?<target>(?<abbr>dr|mgr|dyr)\\.)(?={{S}}(?:hab\\.{{S}})?(?:\\p{L}{2,}{{S}})?\\p{L}+(?:ski|cki|dzki|ska|cka|dzka){{NOT_LETTER}})"
        verbatim: true
        return: abbr
      # "dr", "mgr" keep the last letter of "doktor" only: a man's name in an oblique case takes
      # "dr." ("dzięki dr. Kowalskiemu"); a woman's title does not inflect ("z dr Kowalską").
      - regex: "(?<target>dr|mgr|dyr)(?={{S}}(?:\\p{L}{2,}{{S}})?\\p{L}+(?:skiego|ckiego|dzkiego|skiemu|ckiemu|dzkiemu|skim|ckim|dzkim|owi){{NOT_LETTER}})"
        verbatim: true
        return: target + "."
      # "ok dwustu psów", "ok 5 km" -> "ok.": "około" shortened takes its dot before a count.
      - regex: "(?<![\\p{L}])(?<target>ok)(?={{S}}(?:\\d|dw|trz|czter|pięć|pięci|sześ|siedem|siedmi|osiem|ośmi|dziewię|dziesię|kilk|pół|stu|sto|tysi))"
        verbatim: true
        fix: "ok."
      # Truncations take one:"np.", "tzw.", "itd.", "m.in.", "p.n.e.", "proc.", "ok." before a number.
      - regex: "(?<target>np|tzw|itd|itp|m\\.in|p\\.n\\.e|n\\.e|proc|godz)(?![\\p{L}\\p{N}.])(?=[ \\t\\u00a0,;:)?!]|$)"
        verbatim: true
        return: target + "."
      - regex: "(?<target>ok)(?=[ \\t\\u00a0]+\\d)"
        lowercase: true
        fix: "ok."
  - id: pl.wordForms
    checks: [englishPhraseCorrections]
    style: match
    message: review_msg_pl_inflected_name
    maps:
      # The adjective endings that join a name in "-ie" without the apostrophe ("Charliego").
      SILENT_SHORT: { ego: go, go: go, emu: mu, mu: mu, em: m, m: m }
    defs:
      # The right spelling of a name ending in a vowel letter with its case ending, or "" when the
      # typed one is right; undefined when the name ends in no such letter.
      # - "-ie" sounds [i] ("Charlie"): adjective endings join without the apostrophe ("Charliego",
      #   "Charliemu", "Charliem").
      # - A silent "-e" ("Joyce", "Steve") keeps the apostrophe before a vowel ending ("Joyce'a",
      #   "Joyce'em", not "Joyce'm"), but the locative "-ie" replaces it ("Stevie", "Stonie");
      #   "-ke" names vary ("Locke'm", "Lockiem") and are left alone.
      # - "-y" sounds [i] ("Andy"): the short "-m" joins without the apostrophe ("Andym").
      silentEnding:
        args: "name: string, end: string"
        type: string | undefined
        return: >-
          /[^aeiouy]ie$/u.test(name) ? (SILENT_SHORT[end] ? name + SILENT_SHORT[end] : "")
          : /[^aeiouy]e$/u.test(name) ? (end === "m" ? (/ke$/u.test(name) ? "" : name + "'em")
          : end === "ie" && /[nvmbpf]e$/u.test(name) ? name.slice(0, -1) + "ie" : "")
          : /e$/u.test(name) ? "" : /[^aeiouy]y$/u.test(name) && end === "m" ? name + "m" : undefined
    frames:
      # Inflected foreign names: the ending joins a name whose last letter is pronounced ("Johnie",
      # "Bentleyu", "Andym"). Names ending in a silent "-e" keep the apostrophe.
      - regex: "(?<![\\p{L}\\p{N}'\\u2019-])(?<name>\\p{Lu}\\p{Ll}+)(?<mark>['\\u2019])(?<end>a|u|owi|em|iem|ie|om|\\u00F3w|ach|ami|y|i|ego|emu|go|mu|m|im|ym)(?![\\p{L}\\p{N}])"
        scan: polish
        flags: gu
        let:
          silent: silentEnding(name, end)
        when:
          # Silent French endings ("Jacques'a", "Charles'a") and a pronounced "-y" after a consonant
          # ("Kennedy'ego") keep the apostrophe. "-y" names drop the "i" of the ending: "Bill'im" ->
          # "Billym" is beyond this check.
          - >-
            silent !== undefined ? !!silent && !plUserOrNamed(ctx, name)
            : !/(?:ques|les|ges|ois|eux|aux|oix|ault|eau|[^aeiouy]y)$/u.test(name) &&
            !(/^(?:i|im|ie|iem)$/u.test(end) && /y$/u.test(name)) && !plUserOrNamed(ctx, name)
        return: >-
          plFindingAt(ctx, m.index, m.index + m[0].length, [silent || name + end],
          "englishPhraseCorrections", "review_msg_pl_inflected_name")
      # An acronym takes a hyphen before its ending ("SMS-ów", "PKP-u").
      - regex: "(?<![\\p{L}\\p{N}'\\u2019-])(?<name>\\p{Lu}{2,}|\\p{Lu}\\p{Ll}?\\p{Lu}+)(?<mark>['\\u2019])?(?<end>a|u|owi|em|ie|om|\\u00F3w|ach|ami|y|ach)(?![\\p{L}\\p{N}])"
        scan: polish
        flags: gu
        when:
          # A capital or a lowercase run inside ("PiS", "WiN") marks the acronym's own spelling.
          - "!(!mark && name.length < 3)"
          # "IPN'ie", "SMS’y": a vowel-initial ending after the apostrophe is the house style of some.
          - "!(mark && /^(?:ie|y)$/u.test(end))"
          - "!(/^(?:PL|EU|USA|UK|OK)$/u.test(name) && !mark)"
          - "!ctx.dictionary.has(m[0].toLowerCase())"
        return: >-
          plFindingAt(ctx, m.index, m.index + m[0].length, [name + "-" + end],
          "englishPhraseCorrections", "review_msg_pl_inflected_name")
  # Case and agreement read from the noun lexicon: a preposition governs the case of the noun
  # right after it, a demonstrative agrees with its noun, a numeral from five up takes the
  # genitive plural. A word is checked only when every dictionary reading of it is a noun.
  - id: pl.caseAgreement
    checks: [polishCaseAgreement]
    style: match
    message: review_msg_pl_agreement
    maps:
      # The cases each preposition governs (L locative, V for the vocative after "o").
      AGREEMENT_GOVERNS:
        {
          bez: G,
          beze: G,
          dla: G,
          do: G,
          od: G,
          ode: G,
          u: G,
          z: GIA,
          ze: GIA,
          spod: G,
          znad: G,
          zza: G,
          sprzed: G,
          spomiędzy: G,
          spośród: G,
          wśród: G,
          obok: G,
          podczas: G,
          według: G,
          zamiast: G,
          oprócz: G,
          prócz: G,
          wobec: G,
          wokół: G,
          dookoła: G,
          wzdłuż: G,
          dzięki: D,
          ku: D,
          przeciw: D,
          przeciwko: D,
          wbrew: D,
          w: LA,
          we: LA,
          na: LA,
          o: LAV,
          po: LA,
          przy: L,
          przez: A,
          przeze: A,
          poprzez: A,
          przed: IA,
          przede: IA,
          za: IAG,
          nad: IA,
          nade: IA,
          pod: IA,
          pode: IA,
          między: IA,
          pomiędzy: IA,
          poza: AI,
        }
      AGREEMENT_OBJECT_PRONOUNS: { ją: jej, je: ich }
      AGREEMENT_PRONOUN_GENITIVE: { niemu: niego, nim: niego, nią: niej, nimi: nich }
      AGREEMENT_TENS:
        {
          dwadzieścia: dwudziestu,
          trzydzieści: trzydziestu,
          czterdzieści: czterdziestu,
          pięćdziesiąt: pięćdziesięciu,
          sześćdziesiąt: sześćdziesięciu,
          siedemdziesiąt: siedemdziesięciu,
          osiemdziesiąt: osiemdziesięciu,
          dziewięćdziesiąt: dziewięćdziesięciu,
        }
      AGREEMENT_MEN_UNITS: { dwaj: dwóch, trzej: trzech, czterej: czterech }
      # a <-> ą, e <-> ę: the diacritic typed or dropped.
      AGREEMENT_TWIN: { a: ą, ą: a, e: ę, ę: e }
    sets:
      # Prepositions that also stand alone as adverbs ("Obok stoi dom"): a nominative after them is
      # a subject.
      AGREEMENT_ADVERBIAL: [obok, wokół, dookoła, wzdłuż, przeciw, przeciwko]
      # Idioms that keep an old accusative: "wyjść za mąż", "za pan brat", "Na koń!".
      AGREEMENT_OLD_ACCUSATIVES: [za mąż, za pan, na koń]
      # Short abbreviations a preposition takes ("w ust. 2", "przy ul. Długiej").
      AGREEMENT_SHORT_ABBREVIATIONS:
        [
          ust,
          lit,
          ok,
          ul,
          al,
          pl,
          os,
          ds,
          cz,
          ww,
          ub,
          dz,
          br,
          wł,
          zw,
          ob,
          dn,
          im,
          jw,
          św,
          ks,
          gen,
          por,
          kpr,
          hm,
          pkt,
          art,
          rys,
          tab,
          poz,
          str,
        ]
      # Numerals from five up (and "kilka"), which take the genitive plural in the nominative.
      AGREEMENT_FIVE_UP:
        [
          pięć,
          sześć,
          siedem,
          osiem,
          dziewięć,
          dziesięć,
          jedenaście,
          dwanaście,
          trzynaście,
          czternaście,
          piętnaście,
          szesnaście,
          siedemnaście,
          osiemnaście,
          dziewiętnaście,
          dwadzieścia,
          trzydzieści,
          czterdzieści,
          pięćdziesiąt,
          sześćdziesiąt,
          siedemdziesiąt,
          osiemdziesiąt,
          dziewięćdziesiąt,
          sto,
          dwieście,
          trzysta,
          czterysta,
          pięćset,
          sześćset,
          siedemset,
          osiemset,
          dziewięćset,
          kilka,
          kilkanaście,
          kilkadziesiąt,
          kilkaset,
          parę,
        ]
      # Nouns of number that count in the genitive plural ("tysiące ludzi", "setki listów").
      AGREEMENT_COUNT_NOUNS:
        [
          dziesiątki,
          setki,
          tysiące,
          miliony,
          miliardy,
          dziesiątek,
          setek,
          tysięcy,
          milionów,
          miliardów,
        ]
      # "dwa", "trzy", "cztery" (alone or ending "dwadzieścia trzy"): the nominative plural.
      AGREEMENT_TWO_TO_FOUR: [dwa, dwie, trzy, cztery, oba, obie]
      # The verbs of AGREEMENT_NEGATED_VERBS whose object may also stand in the partitive genitive
      # ("kupię chleba").
