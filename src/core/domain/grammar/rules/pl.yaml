      # "tak naprawę" (a repair) -> "tak naprawdę".
      - regex: "(?<=(?:^|[^\\p{L}])tak{{S}})(?<target>naprawę){{NOT_LETTER}}"
        fix: "naprawdę"
      # "rzec jasna", "na rzec fundacji" -> "rzecz".
      - regex: "(?<target>rzec)(?={{S}}jasna{{NOT_LETTER}})|(?<=(?:^|[^\\p{L}])na{{S}})(?<target>rzec)(?={{S}}\\p{L})"
        fix: "rzecz"
      # "stad też", "ni stad, ni zowąd" -> "stąd" (herds are "stada").
      - regex: "(?<target>stad)(?={{S}}(?:też|więc|wniosek|wynika){{NOT_LETTER}})|(?<=(?:^|[^\\p{L}])ni{{S}})(?<target>stad){{NOT_LETTER}}"
        fix: "stąd"
      # "ni stąd, nie zowąd" -> "ni zowąd".
      - regex: "(?<=stąd,?{{S}})(?<target>nie|n)(?={{S}}zowąd{{NOT_LETTER}})"
        fix: "ni"
      # "nie dal", "dal się", "dal mi" -> "dał" (not "w dal", "z dala").
      - regex: "(?<!(?:^|[^\\p{L}])(?:w|we|z|ze|na|tę|ta|tej){{S}})(?<target>dal)(?={{S}}(?:się|mi|mu|jej|nam|wam|im|ci|go|ją|je|jednak|za{{S}}wygraną){{NOT_LETTER}})|(?<=(?:^|[^\\p{L}])(?:nie|on|który|kto|ten|ojciec|brat){{S}})(?<target>dal){{NOT_LETTER}}"
        lowercase: true
        fix: "dał"
      # "moja zona" (a zone) -> "moja żona".
      - regex: "(?<=(?:^|[^\\p{L}])(?:{{POSSESSIVE}}){{S}})(?<target>zon(?:a|y|ie|ę|ą|o)){{NOT_LETTER}}"
