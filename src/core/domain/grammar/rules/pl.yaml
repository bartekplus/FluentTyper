          - plOnlyNoun(baseTags)
          - '!(AGREEMENT_NOMINAL_ADJECTIVES.has(adj.lemma) && tagsAnd(baseTags, plCases("Gs Gp")))'
          - "!(AGREEMENT_PARTICIPLE.test(adj.lemma) && !tagsAnd(baseTags, tagsWithout(PL_ALL_CASES, AGREEMENT_INSTRUMENTALS)))"
