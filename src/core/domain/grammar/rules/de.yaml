          - '!(/^\p{Lu}/u.test(next) || ctx.dictionary.has(low))'
          - '!(next === "zu" || /^(?:\p{Ll}+nd|\p{Ll}*ge\p{Ll}+t)(?:e|en|er|es|em)$/u.test(next))'
        return: >-
          ({ ruleId: "germanArticleGender", messageKey: "review_msg_german_adjective_ending", range: { start: m.indices!.groups!.det[0], end: nounEnd },
