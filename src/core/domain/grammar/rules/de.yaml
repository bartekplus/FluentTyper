          anstatt: [3],
        }
    defs:
      # Determiners and pronouns the adjective filter accepts ("bei ihr Rat", "für ihr Werk").
      ADJ_PRONOUN_LIKE: /^(?:k?ein|[dms]ein|ihr|unser|euer|dies|jen|jed|welch|manch|solch|all|viel)$/
      ADJ_PARTICIPLE: >-
        /^(?:\p{Ll}*ge\p{Ll}{2,}(?:t|en)|\p{Ll}{3,}iert|(?:ver|be|er|ent|zer|miss|unter|über|durch|hinter|wider)\p{Ll}{2,}(?:t|en))$/u
      # "Vorstellung" is no dictionary word but a noun of a known gender.
      adjNounKnown:
        args: "word: string"
        return: germanNounReading(word.toLowerCase()) !== null || germanGender(word) !== null
      # "Fremder", "Kranken": a noun made from an adjective.
      adjNominalized:
        args: "word: string"
        let:
          parts: /^(.+?)(?:e|er|en|es|em)$/.exec(word.toLowerCase())
        return: "!!parts && germanAdjective(parts[1])"
      # "edel" + "es" → "edles", "teuer" + "e" → "teure", "hoch" + "e" → "hohe", "müde" + "e";
      # "parallel" keeps its stressed -el.
      adjInflect:
        args: "lemma: string, ending: string"
        let:
          stem: >-
            lemma === "hoch" ? "hoh" : /[^aeioul]el$/.test(lemma) || /(?:eu|au)er$/.test(lemma) ? lemma.slice(0, -2) + lemma.at(-1) : lemma
        return: 'stem.endsWith("e") ? stem + ending.slice(1) : stem + ending'
      # The determiner's ending for its adjective, two for "ein" (edler / edles), or null. "die
      # blau Augen": a plural noun.
      adjEndingAfter:
        args: "det: string, prior: string, word: string"
        type: string[] | null
        let:
          low: det.toLowerCase()
          plural: /(?:[^i]n|s)$/.test(word)
          parts: /^(ein|kein|mein|dein|sein|ihr|unser|euer|dies|jed|welch)(e|en|em|er|es|)$/.exec(low)
          einWord: '!!parts && !["dies", "jed", "welch"].includes(parts[1])'
        return: >-
          Object.hasOwn(ADJ_ENDINGS, low) ? (low === "der" && PREPOSITIONS.has(prior.toLowerCase()) ? ["en"] : low === "die" && plural ? ["en"] : [ADJ_ENDINGS[low]])
          : !parts || (parts[1] === "ihr" && parts[2] === "") ? null
          : parts[2] === "" ? (einWord ? ["er", "es"] : null)
          : parts[2] === "e" ? (plural && parts[1] !== "ein" ? ["en"] : ["e"])
          : parts[2] === "er" || parts[2] === "es" ? (einWord ? ["en"] : PREPOSITIONS.has(prior.toLowerCase()) ? ["en"] : ["e"])
          : ["en"]
      # The strong endings an adjective takes after a preposition before this noun, or null.
      # "Anlagen", "Regeln", "Preisen": a plural in -n or -en of a known noun; "Gebäuden",
      # "Kindern": the -n of a masculine or neuter plural marks the dative. Only a plural: before a
      # singular the word is as often an adverb ("mit maximal Tempo").
      adjStrongEndings:
        args: "preposition: string, noun: string"
        type: string[] | null
        let:
          cases0: ADJ_PREPOSITION_CASES[preposition]
          head: 'noun.split("-").at(-1)!'
          reading: germanGender(head)
          pluralKnown: >-
            !reading && [head.slice(0, -1), head.slice(0, -2)].some((singular) => /n$/.test(head) && singular.length >= 3 && adjNounKnown(singular))
          genders: >-
            reading ? [...(reading.gender === "x" ? ["m", "n"] : [reading.gender]), ...(reading.plural ? ["pl"] : [])] : pluralKnown ? ["pl"] : null
          singular: "pluralKnown ? germanGender(head.slice(0, -1)) : null"
          cases: 'pluralKnown && singular && singular.gender !== "f" && cases0.includes(2) ? [2] : cases0'
          endings: new Set(cases.flatMap((c) => genders.map((g) => ADJ_STRONG[g][c])))
        when:
          - "!!cases0"
          - "!!genders"
          - genders.includes("pl") && genders.length === 1
        return: "endings.size <= 2 ? [...endings] : null"
      # The strong endings of a compound-opening adjective before a singular after a preposition.
      adjCompoundSingular:
        args: "preposition: string, adj: string, noun: string"
        type: string[] | null
        let:
          cases: ADJ_PREPOSITION_CASES[preposition]
          reading: 'germanGender(noun.split("-").at(-1)!)'
          genders: 'reading.gender === "x" ? ["m", "n"] : [reading.gender]'
          endings: new Set(cases.flatMap((c) => genders.map((g) => ADJ_STRONG[g][c])))
        when: "!!cases && !!reading && !reading.plural && ADJ_COMPOUND_FIRST.has(adj) && !ADJ_ADVERBIAL.has(adj)"
        return: "endings.size <= 2 ? [...endings] : null"
      adjEndingFinding:
        args: "m: RegExpExecArray, span: [number, number], fixes: string[]"
        type: RawFinding
        return: >-
          ({ ruleId: "germanAdjectiveForms", messageKey: "review_msg_german_adjective_ending", range: { start: span[0], end: span[1] },
          alternatives: fixes, context: { start: m.index, end: span[1] }, ...(fixes.length > 1 ? { requiresChoice: true as const } : {}) })
      # "Sie trinken lieber rot Wein", "kauft alt Gold": no article, a word that is no adverb.
      # "schwarz sehen", "rot sehen": a colour after the verb.
      adjectiveNoArticle:
        args: "ctx: DetectContext, m: RegExpExecArray, low: string, joinedNoun: boolean, glued: string"
        type: RawFinding | null
        let:
          adj: m.groups!.adj
          noun: m.groups!.noun
          span: m.indices!.groups!.target
          known: >-
            joinedNoun && germanAdjective(adj) && ![ADJ_ADVERBIAL, ADJ_CLAUSE_ADVERBS, ADJ_NOT_ADJECTIVES, ARTICLES].some((set) => set.has(adj))
        when: >-
          (ADJ_COMPOUND_ALONE.has(adj) || known) && !/^(?:seh|sieh|sah)/.test(low) && !noun.includes("-") &&
          /^\p{Ll}/u.test(m.groups!.det) && !ctx.dictionary.has(adj) && !ctx.dictionary.has(noun.toLowerCase())
        return: >-
          ({ ruleId: "germanAdjectiveForms", messageKey: "review_msg_closed_compound", range: { start: span[0], end: span[1] },
          alternatives: [glued], context: { start: m.index, end: span[1] } })
      # An adjective with no ending after a determiner or a preposition. "aus weiß Gold": "weiß"
      # (knows) only where it joins the noun. "letzte", "erster": already inflected. "im
      # liebevoll Oma-Haus genannten Hof": an extended attribute before its noun; not a participle
      # that ends the clause ("in öffentlich Gebäuden verboten."). "dicht an dicht Perlen": a fixed
      # pair around the preposition. A compound the dictionary lists is the fix ("Echtzeit"), and
      # a superlative stem or a word that is no adverb after a preposition ("in best Form", "aus
      # rot Gold"); one only the n-gram counts show is offered beside the ending.
      adjectiveAfterDeterminer:
        args: "ctx: DetectContext, m: RegExpExecArray, isPreposition: boolean, joinedNoun: boolean, glued: string"
        type: RawFinding | null
        let:
          det: m.groups!.det
          adj: m.groups!.adj
          noun: m.groups!.noun
          low: det.toLowerCase()
          span: m.indices!.groups!.target
          inflected: /^(.+?)(?:e|en|er|es|em)$/.exec(adj)
          next2: deTokensAfter(ctx.text, m.indices!.groups!.noun[1], 2)
          after: next2[0] ?? ""
          head: next2[1] ?? ""
          compound: adj + noun.toLowerCase()
          stemOnly: /^(?:best|mindest|höchst|kleinst|größt)$/.test(adj) || (isPreposition && ADJ_COMPOUND_ALONE.has(adj))
          listedJoin: joinedNoun && germanListedNoun(compound) !== null
        when:
          - >-
            !(!(germanAdjective(adj) || ADJ_COMPOUND_FIRST.has(adj)) || (ADJ_NOT_ADJECTIVES.has(adj) && !(joinedNoun && /^wei(?:ß|ss)$/.test(adj))) ||
            ARTICLES.has(adj))
          - "!(inflected && germanAdjective(inflected[1]))"
          - >-
            !(/^\p{Ll}+(?:te|ten|ter|tes|tem|nde|nden|nder|ndes|ndem|ene|enen|ener|enes)$/u.test(after) &&
            !(BOUNDARY.test(head) && /^(?:\p{Ll}*ge\p{Ll}{2,}|(?:ver|be|er|ent|zer)\p{Ll}{2,})(?:t|en)$/u.test(after)))
          - "!ctx.dictionary.has(adj) && !ctx.dictionary.has(noun.toLowerCase())"
          - "!(isPreposition && deTokensBefore(ctx.text, m.index, 1)[0]?.toLowerCase() === adj)"
        return: >-
          (listedJoin || (stemOnly && !adj.endsWith("e"))) && !noun.includes("-")
          ? { ruleId: "germanAdjectiveForms", messageKey: "review_msg_closed_compound", range: { start: span[0], end: span[1] },
          alternatives: [adj[0].toUpperCase() + compound.slice(1)], context: { start: m.index, end: span[1] } }
          : ADJ_ADVERBIAL.has(adj) || adjNominalized(noun) || !adjNounKnown(noun) || adj.endsWith("e") ? null
          : isPreposition ? adjectiveAfterPreposition(m, low, adj, noun, after, joinedNoun, glued, span)
          : adjectiveAfterArticle(ctx, m, det, low, adj, noun, joinedNoun, glued, span)
      # "in öffentlich Anlagen": the strong ending the preposition's case calls for, before a
      # plural. "für wichtig halten", "um … zu", "die Jahre über": no preposition there. "für
      # verschieden Themen": "für" only before a plural, and not in "für richtig Kinder zu loben".
      # "mit voll Ausstattung", "aus hart Pappe": before a singular, an adjective that opens
      # compounds takes its ending or joins the noun.
      adjectiveAfterPreposition:
        args: "m: RegExpExecArray, low: string, adj: string, noun: string, after: string, joinedNoun: boolean, glued: string, span: [number, number]"
        type: RawFinding | null
        let:
          endings: adjStrongEndings(low, noun) ?? adjCompoundSingular(low, adj, noun)
          fixes: >-
            [...endings.map((e) => `${adjInflect(adj, e)} ${noun}`), ...((ADJ_COMPOUND_FIRST.has(adj) || joinedNoun) && !noun.includes("-") ? [glued] : [])]
        when:
          - "!(/^(?:um|über|zu|bis|ab)$/.test(low) || ADJ_PRONOUN_LIKE.test(adj))"
          - '!(low === "für" && (after === "zu" || !adjStrongEndings(low, noun)))'
          - "!!endings"
        return: adjEndingFinding(m, span, fixes)
      # An adjective with no ending after an article. "von denen eines offensichtlich Kinder
      # ansprach": "eines" is a pronoun. ", in dem ständig Soldaten …": a relative pronoun. "der
      # allgemein Anklang fand", "Ich meine wirklich Radio": a pronoun, or the verb. "Sie hatte die
      # original Rechnung": after a finite verb the d-word is an article. "hat das sicher
      # Potenzial": a pronoun subject and an adverb. "macht einem richtig Lust": the pronoun "one".
      # "ein klein Haus" (kleines), "ein nett Mann" (netter): the noun's gender picks one ending.
      # "ein neu Wagen": "neuer Wagen" or "Neuwagen".
      adjectiveAfterArticle:
        args: "ctx: DetectContext, m: RegExpExecArray, det: string, low: string, adj: string, noun: string, joinedNoun: boolean, glued: string, span: [number, number]"
        type: RawFinding | null
        let:
          before: deTokensBefore(ctx.text, m.index, 2)
          prior: before.at(-1) ?? ""
          comma: 'before.length > 1 ? before[0] : ""'
          sentenceStart: 'prior === "" || /^[.!?:\n„"]$/.test(prior)'
          stem: '/^(\p{Ll}{2,}?)e?(?:te|ten|t)$/u.exec(prior)?.[1]'
          pronounRead: /^d(?:er|ie|as)$/.test(low) && ADJ_CLAUSE_ADVERBS.has(adj)
          afterVerb: "!pronounRead && (VERB_GOVERNORS.has(prior) || (!!stem && !/^ge/.test(prior) && germanInfinitive(`${stem}en`)))"
          endings0: adjEndingAfter(det, prior, noun)
          gender: 'germanGender(noun.split("-").at(-1)!)?.gender'
          endings: 'endings0 && endings0.length > 1 && (gender === "m" || gender === "n") ? [gender === "m" ? "er" : "es"] : endings0'
          fixes: >-
            [...endings.map((e) => `${adjInflect(adj, e)} ${noun}`), ...((ADJ_COMPOUND_FIRST.has(adj) || joinedNoun) && !noun.includes("-") ? [glued] : [])]
        when:
          - '!adj.endsWith("e")'
          - "!(/^(?:denen|welchen|davon)$/i.test(prior) && /^k?ein(?:e|er|es)$/.test(low))"
          - '!(comma === "," && /^d(?:er|en|em)$/.test(low))'
          - >-
            !(/^d(?:er|ie|as|en|em)$/.test(low) && !sentenceStart && !afterVerb && !PREPOSITIONS.has(prior.toLowerCase()) &&
            !ADJ_COMPOUND_ALONE.has(adj))
          - "!(/^ein(?:em|er)$/.test(low) && !PREPOSITIONS.has(prior.toLowerCase()))"
          - "!(/^(?:ich|wir|sie|die)$/i.test(prior) && /^(?:meine|meinen|seine)$/.test(low))"
          - "!!endings"
        return: adjEndingFinding(m, span, fixes)
      # The lemma of an inflected adjective: "große" → groß, "dunkle" → dunkel, "teure" → teuer.
      adjLemmaOf:
        args: "form: string"
        type: string | null
        let:
          stem: form.replace(/(?:e|en)$/, "")
        return: >-
          stem === "hoh" ? "hoch" : [stem, stem.replace(/([bcdfgkpt])l$/, "$1el"), stem.replace(/([bcdfgkpt])r$/, "$1er"),
          stem.replace(/(eu|au)r$/, "$1er")].find((c) => c.length >= 3 && germanAdjective(c)) ?? null
      # "Beamter" declines like an adjective and has no feminine "die Beamte": "der Beamte", "ein
      # Beamter", "den Beamten", "die Beamten" (plural). The determiner sets the ending.
      adjOfficialEndings:
        args: "det: string"
        let:
          d: det.toLowerCase()
        return: 'd === "der" || d === "dieser" || d === "jeder" ? ["e", "en"] : /^(?:k?ein|mein|dein|sein|ihr|unser|euer)$/.test(d) ? ["er"] : ["en"]'
    frames:
      # An adjective before a noun without its ending: "eine lang Reise" (lange), "ein edel
      # Kraut" (edler/edles); or a compound written apart: "in echt Zeit" (Echtzeit). A degree
      # word may stand between the article and the adjective ("eine sehr schön Frau").
      - regex: "{{WG}}(?<det>\\p{L}+)(?:{{S}}(?:{{ADJ_DEGREE}}))?{{S}}(?<target>(?<adj>\\p{Ll}+){{S}}(?<noun>{{CAP_NOUN}})){{E}}"
        flags: dgu
        let:
          low: det.toLowerCase()
          isDeterminer: >-
            (ARTICLES.has(low) || DEMONSTRATIVES.has(low) || /^(?:ein|kein|mein|dein|sein|unser|euer)$/.test(low) ||
            /^(?:k?ein|[dms]ein|ihr|unser|eur|jed)(?:er|es)$/.test(low)) &&
            !(det !== low && m.index > 0 && !/[.!?:\n„"]\s*$/.test(ctx.text.slice(Math.max(0, m.index - 4), m.index)))
          isPreposition: PREPOSITIONS.has(low) && det === low
          glued: adj[0].toUpperCase() + adj.slice(1) + noun.toLowerCase()
          # "Echtzeit", "Weißgold": the joined word is a known noun.
          joinedNoun: '!adj.endsWith("e") && germanNounReading(adj + noun.toLowerCase()) !== null'
        return: >-
          isDeterminer || isPreposition ? adjectiveAfterDeterminer(ctx, m, isPreposition, joinedNoun, glued)
          : adjectiveNoArticle(ctx, m, low, joinedNoun, glued)
      # "Es werden folgenden Daten gespeichert": with no article, the plural subject after
      # "werden" takes the strong ending -e ("folgende Daten"). A plural in -n or -s may be a
      # dative object ("Die Bücher werden armen Kindern geschenkt"), so it counts only when no
      # subject comes before "werden": the clause opens with a preposition, "es" or an adverb.
      - regex: "{{WG}}(?:(?=\\p{Ll}{3})(?<=(?:werden|wurden|würden){{S}})(?<target>(?<adj>\\p{Ll}{3,}en){{S}}(?<noun>\\p{Lu}\\p{Ll}{2,})){{E}})"
        flags: dgu
        let:
          stem: adj.slice(0, -2)
          participle: /\p{Ll}{3,}end$/u.test(stem) && germanInfinitive(stem.slice(0, -1))
          reading: germanGender(noun)
          # "Bäume", "Projekte": a plural in -e of a known noun.
          plural: >-
            reading ? reading.plural || reading.gender === "f"
            : [noun.slice(0, -1), noun.slice(0, -2)].some((s) => /n$/.test(noun) && s.length >= 3 && adjNounKnown(s)) ||
            (/e$/.test(noun) && [noun.slice(0, -1), deumlaut(noun.slice(0, -1))].some((s) => adjNounKnown(s)))
          span: m.indices!.groups!.target
          after: deTokensAfter(ctx.text, span[1], 2)
          next: after[0] ?? ""
          afterNext: after[1] ?? ""
          first: '(ctx.text.slice(Math.max(0, m.index - 80), m.index).split(/[.!?;:\n,]/).at(-1)!.match(/\p{L}+/gu) ?? [""])[0].toLowerCase()'
        when:
          - "!(!(germanAdjective(stem) || participle) || ARTICLES.has(adj) || DEMONSTRATIVES.has(adj))"
          # A feminine singular ("folgenden Frage") is no plural; "-n" alone shows the plural.
          - '!(!plural || (reading?.gender === "f" && !/n$/.test(noun)))'
          - ADJ_PARTICIPLE.test(next) && BOUNDARY.test(afterNext)
          - "!/[ns]$/.test(noun) || PREPOSITIONS.has(first) || ADJ_EMPTY_SUBJECT.has(first)"
          - "!ctx.dictionary.has(adj) && !namedExampleBefore(ctx.text, span[0])"
        return: >-
          ({ ruleId: "germanAdjectiveForms", messageKey: "review_msg_german_adjective_ending", range: { start: span[0], end: span[1] },
          alternatives: [`${stem}e ${noun}`] })
      # The strong ending after an article that already shows the case: "im mentalem Lexikon"
      # (mentalen).
      - regex: "{{WG}}(?<det>[dD]em|[iI]m|[zZ]um|[vV]om|[bB]eim|[aA]m|[eE]inem|[mM]einem|[dD]einem|[sS]einem|[iI]hrem|[uU]nserem|[eE]urem|[dD]iesem|[jJ]edem|[kK]einem|[dD]es|[eE]ines|[mM]eines|[dD]eines|[sS]eines|[iI]hres|[uU]nseres|[eE]ures|[dD]ieses|[jJ]edes|[kK]eines){{S}}(?<target>\\p{Ll}+(?:em|es))(?={{S}}{{CAP_NOUN}}{{E}})"
        flags: dgu
        let:
          stem: target.slice(0, -2)
        when:
          # "-em" after a dative article, "-es" after a genitive one.
          - target.endsWith("es") === det.toLowerCase().endsWith("es")
          # "einem einem Haus", "dem diesem": a determiner, not an adjective.
          - "!/^(?:ein|kein|mein|dein|sein|ihr|unser|eur|dies|jen|jed|welch|manch|solch|all|d)$/.test(stem)"
          - germanAdjective(stem) || germanAdjective(`${stem}e`) || germanAdjective(stem.replace(/(.)([lr])$/, "$1e$2"))
          - "!ctx.dictionary.has(target)"
        return: >-
          ({ ruleId: "germanAdjectiveForms", messageKey: "review_msg_german_adjective_ending",
          range: { start: m.indices!.groups!.target[1] - 2, end: m.indices!.groups!.target[1] }, alternatives: ["en"],
          context: { start: m.index, end: m.indices!.groups!.target[1] } })
      # Letter salutations: "Lieber Herr Müller", "Liebe Frau Weber", "Sehr geehrte Damen und
      # Herren" take the title's gender ("Liebe Herr" → Lieber). At a line start, or after a
      # greeting.
      - regex: "(?<=(?:^|\\n)[ \\t]{0,8}(?:{{GREETING_WORDS}}[ \\t]{1,4}|Sehr[ \\t]{1,4})?)(?<adj>[Ll]ieb(?:e|en|er|es)?|geehrt(?:e|en|er|es)?)(?=[ \\t]+(?<title>Herr|Frau|Damen)(?![\\p{L}\\p{M}]))"
        scan: owned
        flags: gu
        let:
          wanted: 'adj.replace(/(?:e|en|er|es)$/, "") + (title === "Herr" ? "er" : "e")'
          line: '/^[^\n,!:.?]*/.exec(ctx.text.slice(m.index, m.index + 120))![0]'
        when:
          - wanted !== adj
          - '!/(?<!\p{L})(?:als|wie)(?!\p{L})/u.test(line)'
        return: >-
          ({ ruleId: "germanAdjectiveForms", messageKey: "review_msg_german_adjective_ending", range: { start: m.index, end: m.index + adj.length }, alternatives: [wanted], context: { start: m.index, end: m.index + adj.length + title.length + 1 } })
      # A predicative adjective takes no ending: "Er war schnelle." (schnell), "Die sind
      # schlauen."
      - regex: "{{WG}}(?:{{COPULA_FORMS}})(?:{{S}}(?:{{DEGREE_ADVERBS}}))*{{S}}(?<target>\\p{Ll}{3,}?(?:e|en))(?=[ \\t]*[.!?])"
        flags: dgu
        message: review_msg_german_predicative
        let:
          lemma: adjLemmaOf(target)
        when:
          # "müde", "leise", "böse": the lemma itself ends in -e.
          - "!(ADJ_NOT_PREDICATIVE.has(target) || germanAdjective(target) || ctx.dictionary.has(target))"
          - germanNounReading(target) === null
          - lemma
        return: >-
          ({ ruleId: "germanAdjectiveForms", messageKey: "review_msg_german_predicative",
          range: { start: m.indices!.groups!.target[0], end: m.indices!.groups!.target[1] }, alternatives: [lemma],
          context: { start: m.index, end: m.indices!.groups!.target[1] } })
      # "Er ist schnelle als ich" → schneller: an ending before "als" where the comparative
      # belongs.
      - regex: "{{WG}}(?<prior>\\p{L}+){{S}}(?<target>\\p{Ll}{3,}?e)(?={{S}}als{{E}})"
        flags: dgu
        message: review_msg_german_predicative
        let:
          lemma: adjLemmaOf(target)
        when:
          # "die rote als Ersatz", "sowohl eine kleine als auch": an elided noun or a pair.
          - '!/^(?:k?ein|[dms]ein|ihr|unser|eu|dies|jen|jed|welch|d)\p{L}*$/iu.test(prior)'
          - '!(/^(?:sowohl|als|wie)$/i.test(prior) || /^als[ \t]+auch/.test(ctx.text.slice(m.index + m[0].length + 1)))'
          - "!(ADJ_NOT_PREDICATIVE.has(target) || germanAdjective(target) || ctx.dictionary.has(target))"
          # A vowel that may take an umlaut in the comparative ("größer") is left out.
          - '!(!lemma || /[aou](?![u])/.test(lemma.replace(/[ae]u/g, "")))'
        return: >-
          ({ ruleId: "germanAdjectiveForms", messageKey: "review_msg_german_predicative",
          range: { start: m.indices!.groups!.target[0], end: m.indices!.groups!.target[1] }, alternatives: [`${lemma}er`],
          context: { start: m.index, end: m.indices!.groups!.target[1] + 4 } })
      # "Beamter" declines like an adjective and has no feminine "die Beamte": "der Beamte",
      # "ein Beamter", "den Beamten", "die Beamten" (plural). The determiner sets the ending.
      - regex: "{{WG}}(?<det>[Dd](?:er|ie|en|em|es)|[Dd]ies(?:er|e|en|em|es)|[Jj]ede[rnms]|(?:[Kk]?[Ee]in|[Mm]ein|[Dd]ein|[Ss]ein|[Ii]hr|[Uu]nser|[Ee]uer)(?:en|em|es|er)?)(?:{{S}}\\p{Ll}+(?:e|en|er|es|em))?{{S}}(?<target>\\p{L}*[Bb]eamte[rn]?){{E}}"
        flags: dgu
        let:
          # "Beamte", "Beamter", "Beamten": the typed ending after "Beamt".
          stem: target.replace(/e[rn]?$/, "")
          endings: adjOfficialEndings(det)
          alternatives: endings.map((e) => stem + e)
        when: "!(endings.includes(target.slice(stem.length)) || ctx.dictionary.has(target.toLowerCase()))"
        return: >-
          ({ ruleId: "germanAdjectiveForms", messageKey: "review_msg_german_adjective_ending",
          range: { start: m.indices!.groups!.target[0], end: m.indices!.groups!.target[1] }, alternatives,
          context: { start: m.index, end: m.indices!.groups!.target[1] }, ...(alternatives.length > 1 ? { requiresChoice: true as const } : {}) })
  - id: de.articleGender
    checks: [germanArticleGender]
    style: match
    message: review_msg_german_article_gender
    sets:
      # Subject pronouns of a masculine object ("Ich habe ein Tisch reserviert").
      ART_SUBJECTS: [ich, du, er, wir, man]
      # Words after the object that keep the clause open: a participle, an infinitive, an adverb.
      ART_OBJECT_FOLLOWERS:
        [
          heute,
          morgen,
          gestern,
          allerdings,
          auch,
          noch,
          schon,
          nicht,
          gern,
          gerne,
          bereits,
          mal,
          wieder,
          jetzt,
          sofort,
          dort,
          hier,
          da,
          nie,
          immer,
          bitte,
          doch,
          endlich,
          erst,
          zu,
        ]
      ART_SUBJECT_PRONOUNS: [ich, du, er, sie, es, wir, ihr, man]
      ART_SUBORDINATORS:
        [dass, weil, wenn, ob, als, obwohl, damit, nachdem, bevor, falls, da, sobald]
      ART_MODALS:
        [
          kann,
          kannst,
          können,
          könnt,
          will,
          willst,
          wollen,
          wollt,
          muss,
          musst,
          müssen,
          müsst,
          soll,
          sollst,
          sollen,
          sollt,
          möchte,
          möchtest,
          möchten,
          darf,
          darfst,
          dürfen,
          werde,
          wirst,
          wird,
          werden,
          würde,
          würden,
        ]
      ART_POSTPOSITIONS:
        [nach, zufolge, gegenüber, entgegen, zuliebe, entsprechend, gemäß, nahe, halber, wegen]
      ART_MEASURES:
        [
          mal,
          stück,
          weile,
          jahr,
          tag,
          woche,
          monat,
          stunde,
          minute,
          sekunde,
          moment,
          augenblick,
          abend,
          morgen,
          nachmittag,
          nacht,
          wochenende,
          leben,
          zeit,
          ende,
          stockwerk,
          viertelstunde,
          halbjahr,
        ]
      # Verbs after which a bare noun phrase is the subject or object: "es gibt", "ist", "hat".
      ART_BARE_AFTER:
        [
          ist,
          sind,
          war,
          waren,
          gibt,
          gab,
          hat,
          habe,
          haben,
          hatte,
          hatten,
          wird,
          werden,
          bietet,
          bieten,
          braucht,
          brauchen,
          suche,
          suchen,
          wünsche,
          wünschen,
          wurde,
          wurden,
          kann,
          können,
          konnte,
          konnten,
          soll,
          sollen,
          sollte,
          sollten,
          muss,
          müssen,
          musste,
          mussten,
          will,
          wollen,
          wollte,
          wollten,
          darf,
          dürfen,
          wäre,
          wären,
        ]
      ART_TIME_SPANS:
        [
          Tag,
          Jahr,
          Woche,
          Monat,
          Sommer,
          Winter,
          Herbst,
          Frühling,
          Abend,
          Morgen,
          Nacht,
          Wochenende,
          Leben,
        ]
    maps:
      ART_RELATIVE_FOR: { m: der, f: die, n: das }
      ART_WRONG_RELATIVE: { m: [die, das], f: [das], n: [der, die] }
    defs:
      # The nominative alone.
      ART_NOMINATIVE: '["nom"] as GermanCase[]'
      # Degree words between the article and its adjective ("eine sehr schönes Haus").
      ART_DEGREE_WORD: /^(?:sehr|ganz|so|recht|ziemlich|besonders|wirklich|echt|total|äußerst|relativ|eher|zu)$/u
      # The determiners, either case of the first letter.
      ART_DETERMINER_WORDS: >-
        new RegExp("^(?:" + ["der die das dem den des", "ein eine einen einem einer eines kein keine keinen keinem keiner keines",
        "mein meine meinen meinem meiner meines dein deine deinen deinem deiner deines",
        "sein seine seinen seinem seiner seines ihre ihren ihrem ihrer ihres",
        "unser unsere unseren unserem unserer unseres euer eure euren eurem eurer eures",
        "dieser diese dieses diesem diesen jeder jede jedes jedem jeden", "zum zur im am vom beim ins"]
        .flatMap((group) => group.split(" ").map((w) => "[" + w[0] + w[0].toUpperCase() + "]" + w.slice(1))).join("|") + ")$", "u")
      # A copula, or "als"/"wie", makes the noun a predicate ("ich bin ein Mann").
      ART_COPULAS: >-
        /^(?:sein|bin|bist|ist|sind|seid|war|warst|waren|wart|wäre|wärst|wären|sei|gewesen|werden|werde|wirst|wird|werdet|wurde|wurdest|wurden|würde|würdest|würden|geworden|bleiben|bleibe|bleibst|bleibt|blieb|blieben|geblieben|heißen|heiße|heißt|hieß|scheinen|scheint|schien|nennen|nenne|nennt|nannte|als|wie)$/
      # Verbs whose object is a dative ("helfen", "danken", "gehören", "gefallen").
      ART_DATIVE_VERBS: >-
        /^(?:hilf|helf|half|geholf|dank|folg|gehör|gefall|gefäll|gefiel|antwort|vertrau|begegn|gratulier|zuhör|widersprech|schad|nütz|fehl|pass|schmeck|gehorch|rat|rät|riet|dien|ähnel|droh|verzeih|glaub|zustimm|stimm|beisteh|gönn)/
      ART_PERCEPTION: /^(?:seh|sieh|sah|hör|lass|läss|ließ|fühl|spür|heiß|hieß)/
      ART_CLAUSE_END: '/[.!?;:,\n–—()"„“»«]/'
      # Verbs of giving and telling.
      ART_GIVING: >-
        /^(?:gib|gibst|gibt|gebe|geben|gebt|gab|gabst|gaben|gäbe|schenk|zeig|bring|brachte|bracht|schick|send|erzähl|erklär|leih|lieh|verkauf|kauf|schreib|schrieb|empfehl|empfiehl|empfahl|reich|zeichn|backe|backt|backst|buk|koch|überreich|versprech|versprich|versprach|gönn|wünsch|liefer|borg)(?:e|st|est|t|et|en|te|test|ten|tet|n)?$/
      # Masculine person nouns.
      ART_PERSONS: >-
        /(?:mann|freund|vater|bruder|sohn|onkel|opa|großvater|chef|lehrer|arzt|hund|kater|gast|partner|schüler|kellner|mitarbeiter|nutzer|leser|käufer|besucher|fahrer|bürger|könig|papa|enkel|cousin|schwager|pfarrer|trainer|spieler|nachbar|kunde|boss|verkäufer)$/
      # "Lehrer:innen", and inside a compound "Student:innenvertretung".
      ART_GENDER_SIGN: '/^[*:_/](?:[Ii]n(?:nen)?(?!\p{L})|innen\p{Ll})/u'
      # Determiners and quantifiers spelled like adjectives, and prepositions in -e ("inklusive").
      ART_QUANTIFIER: /^(?:(?:dies|jen|jed|welch|manch|all|viel|wenig|einig|mehrer|beid|etlich|sämtlich|irgendwelch)\p{Ll}*|inklusive|exklusive)$/u
      # Prepositions and the cases they govern; two-way ones take the dative or the accusative.
      ART_GOVERNED: >-
        ({
          mit: ["dat"], von: ["dat"], bei: ["dat"], aus: ["dat"], nach: ["dat"], zu: ["dat"], seit: ["dat"], samt: ["dat"],
          nebst: ["dat"], außer: ["dat"], gemäß: ["dat"], für: ["acc"], gegen: ["acc"], durch: ["acc"], ohne: ["acc"],
          um: ["acc"], wider: ["acc"], wegen: ["gen"], trotz: ["gen"], während: ["gen"], statt: ["gen"], anstatt: ["gen"],
          aufgrund: ["gen"], innerhalb: ["gen"], außerhalb: ["gen"], oberhalb: ["gen"], unterhalb: ["gen"], mittels: ["gen"],
          in: ["dat", "acc"], an: ["dat", "acc"], auf: ["dat", "acc"], über: ["dat", "acc"], unter: ["dat", "acc"],
          vor: ["dat", "acc"], hinter: ["dat", "acc"], neben: ["dat", "acc"], zwischen: ["dat", "acc"],
        }) as Readonly<Record<string, readonly GermanCase[]>>
      artSentenceStart:
        args: "before: string[]"
        let:
          prior: before.at(-1) ?? ""
        return: 'prior === "" || /^[.!?:\n„"“»«]$/.test(prior)'
      # An inflected adjective or participle ("schönes", "gekaufte", "spannenden"); no determiner.
      # "weitere", "neueren": a comparative.
      artIsAdjective:
        args: "word: string"
        let:
          stem: word.replace(/(?:e|en|er|es|em)$/, "")
        return: >-
          !ART_DETERMINER_WORDS.test(word) && (germanAdjective(stem) || germanAdjective(`${stem}e`) ||
          germanAdjective(stem.replace(/(.)([lr])$/, "$1e$2")) || (/\p{Ll}{3}er$/u.test(stem) && germanAdjective(stem.slice(0, -2))) ||
          /^ge\p{Ll}{3,}t$|\p{Ll}{3,}end$/u.test(stem))
      artEndingOf:
        args: "word: string"
        return: '/(?:e|en|er|es|em)$/.exec(word)?.[0] ?? ""'
      artVerbCase:
        args: "word: string | undefined, first: boolean"
        return: "word === undefined ? null : germanVerbObjectCase(first && /^\\p{Lu}\\p{Ll}+$/u.test(word) ? word.toLowerCase() : word)"
      artPersonOrFeminine:
        args: "noun: string"
        return: ART_PERSONS.test(noun.toLowerCase()) || /(?:in|frau|mutter|schwester|tochter|tante|oma)$/.test(noun.toLowerCase())
      # A masculine noun as the direct object of a pronoun subject: "Ich habe ein Tisch reserviert"
      # (einen), "Wenn er der Mann sieht" (den). The pronoun is the subject, so the article cannot
      # be nominative unless a copula or "als"/"wie" makes the noun a predicate; dative verbs and a
      # second object ("ich gebe ein Freund das Buch") are left out. "der Lehrer" may be a
      # genitive plural. "Weder ich noch mein Freund können …": joined to the subject. Lowercase
      # words only: "Fehler" is no form of "fehlen".
      artObjectCase:
        args: "ctx: DetectContext, index: number, nounEnd: number, det: GermanDeterminer, typed: string, reading: GermanGenderReading, adjectives: string[]"
        type: string | null
        let:
          before: deTokensBefore(ctx.text, index, 12)
          clause: before.slice(boundaryBefore(before, before.length - 1) + 1)
          prior: (clause.at(-1) ?? "").toLowerCase()
          rest: ctx.text.slice(nounEnd, nounEnd + 120).split(/[.!?;:,\n–—]/)[0]
          restWords: 'rest.match(/\p{L}+/gu) ?? []'
          words: '[...clause, ...restWords].filter((w) => /^\p{Ll}/u.test(w))'
          second: >-
            restWords.some((w, i) => ART_DETERMINER_WORDS.test(w) && !germanContraction(w.toLowerCase()) && !PREPOSITIONS.has(restWords[i - 1]?.toLowerCase() ?? ""))
          subordinate: /^(?:wenn|weil|dass|ob|als|da|obwohl|falls|sobald|bevor|nachdem)$/.test((clause[0] ?? "").toLowerCase())
          next: restWords[0]?.toLowerCase() ?? ""
          open: >-
            !next || subordinate || ART_OBJECT_FOLLOWERS.has(next) || PREPOSITIONS.has(next) || germanContraction(next) ||
            /^(?:\p{Ll}*ge\p{Ll}+(?:t|en)|\p{Ll}+iert)$/u.test(next) || germanInfinitive(next)
          article: germanDeterminerFor(det, "m", "acc", typed)
        when:
          - reading.gender === "m" && !det.prep
          - '!(!(det.kind === "ein" && det.ending === "") && !(det.kind === "d" && det.ending === "der"))'
          - '!(det.kind === "d" && reading.plural)'
          - '!(det.kind === "ein" && (det.stem === "ihr" || det.stem === "sein"))'
          - clause.some((t) => ART_SUBJECTS.has(t.toLowerCase()))
          - "!(PREPOSITIONS.has(prior) || ART_DETERMINER_WORDS.test(prior))"
          - "!/^(?:und|oder|noch|sowie|sondern|bzw)$/.test(prior)"
          - "!words.some((w) => ART_COPULAS.test(w) || ART_DATIVE_VERBS.test(w))"
          - "!second"
          - '!(!open || /^\p{Lu}/u.test(restWords[0] ?? ""))'
          - "!!article"
        return: '[article, ...adjectives.map((a) => ART_DEGREE_WORD.test(a) ? a : a.replace(/(?:e|en|er|es|em)$/, "en"))].join(" ")'
      # The object of a verb that takes only a dative or only an accusative: "Ich helfe den Mann"
      # (dem), "Er fragt dem Lehrer" (den). Only a singular masculine or neuter noun whose article
      # shows the other case; the verb right before it with its subject earlier in the clause or a
      # subject pronoun between, or the verb right after it at the end of a clause that opens with
      # a subordinator or holds a modal. A second object, a postposition ("dem Namen nach") or an
      # infinitive the noun may belong to keeps the article. The typed article's readings that fit
      # the noun must all be the other object case.
      artVerbObjectCase:
        args: "ctx: DetectContext, index: number, nounEnd: number, det: GermanDeterminer, typed: string, head: string, reading: GermanGenderReading, adjectives: string[]"
        type: string[] | null
        let:
          before: deTokensBefore(ctx.text, index, 12)
          clause: before.slice(boundaryBefore(before, before.length - 1) + 1)
          rest0: 'ctx.text.slice(nounEnd, nounEnd + 120).split(ART_CLAUSE_END)[0].match(/[\p{L}\p{M}]+/gu) ?? []'
          pronounAfter: clause.length - 1 > 0 && ART_SUBJECT_PRONOUNS.has(clause[clause.length - 1].toLowerCase())
          i: "pronounAfter ? clause.length - 2 : clause.length - 1"
          verbBefore: "i >= 0 ? artVerbCase(clause[i], i === 0) : null"
          byBefore: "!!verbBefore && (pronounAfter || clause.slice(0, i).some((t) => /^\\p{L}/u.test(t)))"
          lowered: clause.map((t) => t.toLowerCase())
          verbAfter: "!byBefore && rest0.length > 0 && rest0.length <= 2 ? artVerbCase(rest0[0], false) : null"
          byAfter: >-
            !!verbAfter && (rest0.length === 1 || ART_MODALS.has(rest0[1].toLowerCase())) &&
            (ART_SUBORDINATORS.has((clause[0] ?? "").toLowerCase()) || lowered.some((t) => ART_MODALS.has(t))) &&
            (lowered.some((t) => ART_SUBJECT_PRONOUNS.has(t)) || /^\p{Lu}/u.test(clause[1] ?? ""))
          governed: "byBefore ? verbBefore : byAfter ? verbAfter : null"
          rest: "byAfter ? [] : rest0"
          lowerRest: rest.map((w) => w.toLowerCase())
          own: germanDeterminerReadings(det).filter(([g, c]) => germanCaseFits(head, reading, g, c))
          target: 'governed === "dative" ? "dat" : "acc"'
          other: 'governed === "dative" ? "acc" : "dat"'
          genders: '(reading.gender === "x" ? ["m", "n"] : [reading.gender]) as GermanCaseGender[]'
          fixes: >-
            [...new Set(genders.map((g) => [g, germanDeterminerFor(det, g, target, typed)] as const).filter(([, article]) => article !== null)
            .map(([g, article]) => [article, ...adjectives.map((a) => ART_DEGREE_WORD.test(a) ? a :
            a.replace(/(?:e|en|er|es|em)$/, germanAdjectiveEnding(det.kind === "ein" ? "mixed" : "weak", g, target)))].join(" ")))]
        when:
          - '!det.prep && reading.gender !== "f"'
          - "!!governed"
          - "!clause.some((t) => ART_PERCEPTION.test(t.toLowerCase()))"
          - '!ART_POSTPOSITIONS.has(lowerRest[0] ?? "")'
          - >-
            !(rest.some((w, k) => ART_DETERMINER_WORDS.test(w) && !germanContraction(w.toLowerCase()) && !PREPOSITIONS.has(lowerRest[k - 1] ?? "")) ||
            lowerRest.includes("zu"))
          - '!lowerRest.some((w, k) => k === rest.length - 1 && /^\p{Ll}/u.test(w) && germanInfinitive(w))'
          - "!own.some(([, c]) => c === target)"
          - '!(!own.length || own.some(([g, c]) => c !== other || g === "pl"))'
          - fixes.length > 0
        return: fixes
      # A person who receives something, with a thing as the second object: "Ich zeige den Mann
      # ein Bild" (dem Mann). Verbs of giving and telling, a masculine person noun with an
      # accusative-only article (a noun in -n may be a dative plural: "den Kollegen"), then an
      # article and a noun that names no person, time or measure ("den Film ein zweites Mal").
      artIndirectObject:
        args: "ctx: DetectContext, index: number, nounEnd: number, det: GermanDeterminer, typed: string, head: string, reading: GermanGenderReading, adjectives: string[]"
        type: string | null
        let:
          accusative: 'det.kind === "d" ? det.ending === "den" : det.kind === "ein" && det.ending === "en"'
          before: deTokensBefore(ctx.text, index, 3).map((t) => t.toLowerCase())
          verb: 'ART_SUBJECTS.has(before.at(-1) ?? "") ? before.at(-2) : before.at(-1)'
          after: deTokensAfter(ctx.text, nounEnd, 5)
          k: '/^\p{Ll}+(?:e|en|es|er)$/u.test(after[1] ?? "") ? 2 : 1'
          thing: after[k] ?? ""
          next: after[k + 1] ?? ""
          closes: >-
            BOUNDARY.test(next) || /^(?:und|oder|von|aus|mit|für|zum|zur)$/.test(next) || (/^\p{Ll}+$/u.test(next) && BOUNDARY.test(after[k + 2] ?? ""))
          article: germanDeterminerFor(det, "m", "dat", typed)
        when:
          - "!det.prep && accusative"
          - 'reading.gender === "m" && !/e[rl]?n$/.test(head) && ART_PERSONS.test(head.toLowerCase())'
          - "!!verb && ART_GIVING.test(verb)"
          - '/^(?:ein|eine|einen|das|die|kein|keine|keinen)$/i.test(after[0] ?? "")'
          - '!(!/^\p{Lu}\p{Ll}+$/u.test(thing) || ART_MEASURES.has(thing.toLowerCase()) || artPersonOrFeminine(thing))'
          - closes
          - "!!article"
        return: '[article, ...adjectives].join(" ")'
      # A compound written apart, told by its article: "die Haus Tür" (die fits Tür, not Haus), "der
      # Auto Schlüssel", "das Verkehrs Schild" (a linking -s after a nominative article). "der
      # Mutter Blumen" (two objects) keeps its space. "einer Berliner Schule": a place adjective in
      # -er. "die Bank Austria": a name goes on capitalized. "Verkehrs", "Küchen" (after "ein-",
      # which has no plural): a linking -s or -n. A linking -s after an article that is no
      # genitive; otherwise the article must not fit the first noun.
      artSplitCompound:
        args: "ctx: DetectContext, m: RegExpExecArray, typed: string, first: string"
        type: RawFinding | null
        let:
          nounEnd: m.indices!.groups!.noun[1]
          gap: '/^[ \t]{1,3}(\p{Lu}\p{Ll}{2,})(?![\p{L}\p{M}\p{N}_-])/u.exec(ctx.text.slice(nounEnd))'
          second: gap[1]
          after: deTokensAfter(ctx.text, nounEnd + gap[0].length, 1)[0] ?? ""
          low: first.toLowerCase()
          linked: >-
            (/(?:s|es)$/.test(low) && germanNounReading(low.replace(/e?s$/, "")) !== null) ||
            (/^ein(?:e[mnrs]?)?$/i.test(typed) && /n$/.test(low) && [low.slice(0, -1), low.slice(0, -2)].some((stem) => germanNounReading(stem) !== null))
          modsText: (m.groups!.mods ?? "").trim()
          end: nounEnd + gap[0].length
        when:
          - "!(/-|er$/.test(first) || ctx.dictionary.has(first.toLowerCase()))"
          - gap
          - '!(/^\p{Lu}/u.test(after) || ctx.dictionary.has(second.toLowerCase()))'
          - germanNounReading(second.toLowerCase()) !== null
          - linked || germanNounReading(low) !== null
          - germanDeterminerFits(typed, second) === true
          - >-
            !(linked ? /^(?:des|eines|keines|meines|deines|seines|ihres|unseres|eures|dieses|jedes)$/i.test(typed)
            : germanDeterminerFits(typed, first) !== false)
          - '!(modsText && !modsText.split(/[ \t ]+/).every((a) => ART_DEGREE_WORD.test(a) || artIsAdjective(a)))'
        return: >-
          ({ ruleId: "germanArticleGender", messageKey: "review_msg_closed_compound", range: { start: m.indices!.groups!.noun[0], end },
          alternatives: [first + second.toLowerCase()], context: { start: m.index, end } })
      # An adjective used as a noun keeps the adjective's ending after its article: "der
      # Angestellte" (not "Angestellter"), "ein Abgeordneter" or "eine Abgeordnete" (not "ein
      # Abgeordnete"). Any gender fits a person, so the article's own readings decide. Only "-er"
      # after "der" and "-e" after a bare ein-word. Person words: participles ("Angestellte") and
      # adjectives in -lich, -ig, -los, -isch ("Jugendliche"); "Vorsitzende": a present participle.
      # ", der Abgeordneter war": a relative pronoun before a predicate noun. "ein Abgeordneter": a
      # person, so no neuter fix. A capitalized word after it: a name or an open compound. "Ein
      # Abgeordnete betreffendes Problem": the object of a participle. "Ein Abgeordnete": a woman
      # as much as a man.
      artNominalizedAdjective:
        args: "ctx: DetectContext, m: RegExpExecArray, det: GermanDeterminer, typed: string, noun: string"
        type: RawFinding | null
        let:
          low: noun.toLowerCase()
          parts: '/^(\p{Ll}{3,}?)(e|en|er|es|em)$/u.exec(low)'
          stem: parts[1]
          typedEnding: parts[2]
          bareEin: det.kind === "ein" && det.ending === ""
          participle: >-
            (/^\p{Ll}*ge\p{Ll}+t$/u.test(stem) && germanInfinitive(`${stem.replace(/^\p{Ll}*?ge/u, "").slice(0, -1)}en`)) ||
            (/^(?:ver|be|er|zer|ent)\p{Ll}+t$/u.test(stem) && germanInfinitive(`${stem.slice(0, -1)}en`))
          present: /\p{Ll}{3,}end$/u.test(stem) && germanInfinitive(stem.slice(0, -1))
          personAdjective: present || (/(?:lich|ig|los|isch)$/.test(stem) && germanAdjective(stem))
          before: deTokensBefore(ctx.text, m.index, 2)
          start: artSentenceStart(before)
          all: germanDeterminerReadings(det)
          pairs1: 'start && all.some(([, c]) => c === "nom") ? all.filter(([, c]) => c === "nom") : all'
          pairs: 'pairs1.some(([g]) => g === "m") ? pairs1.filter(([g]) => g !== "n") : pairs1'
