          - '!(/^\p{N}+$/u.test(next) && /^\p{Lu}/u.test(after[1] ?? ""))'
          - '!(parsed.kind !== "ein" && !parsed.prep && germanInfinitive(next))'
          - '!(/^(?:und|oder|sowie|bzw)$/.test(next) && germanDeterminerFits(typed, after[1] ?? ""))'
          - "!(governed && !narrowed.length)"
          - combos.every(([c, g]) => germanCaseFits(head, reading, g, c) && germanDeterminerFor(parsed, g, c, typed) !== null)
          - fixes.length > 0 && fixes.length <= 3
        return: >-
          ({ ruleId: "germanArticleGender", messageKey: "review_msg_german_article_gender", range: { start: detStart, end },
          alternatives: fixes, context: { start: m.index, end: nounEnd }, ...(fixes.length > 1 ? { requiresChoice: true as const } : {}) })
