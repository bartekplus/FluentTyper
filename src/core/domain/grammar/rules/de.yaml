      sollen,
      sollt,
      sollte,
      sollten,
      will,
      willst,
      wollen,
      wollt,
      wollte,
      wollten,
      darf,
      darfst,
      dürfen,
      dürft,
      durfte,
      durften,
      dürfte,
      dürften,
      mag,
      möchte,
      möchtest,
      möchten,
      werde,
      wirst,
      wird,
      werden,
      werdet,
      würde,
      würdest,
      würden,
      wurde,
      wurden,
      worden,
      lass,
      lasse,
      lässt,
      lassen,
      ließ,
      tu,
      tue,
      tut,
      tun,
      brauchst,
      braucht,
      brauchen,
      habe,
      hast,
      hat,
      haben,
      habt,
      hatte,
      hatten,
      hätte,
      hätten,
      bin,
      bist,
      ist,
      sind,
      seid,
      war,
      waren,
      wäre,
      wären,
      sei,
      konntest,
      könntest,
      könntet,
      solltest,
      solltet,
      müsstest,
      müsstet,
      musstest,
      wolltest,
      wolltet,
      dürftest,
      dürftet,
      durftest,
      magst,
      mögt,
      mögen,
      mochte,
