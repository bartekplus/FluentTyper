          - '!((parsed.kind === "d" || parsed.kind === "dies") && !parsed.prep && !start && !afterPreposition)'
          - >-
            parsed.kind !== "ein" || !(ART_DETERMINER_WORDS.test(prior) || /^(?:ans|aufs|durchs|fürs|ums)$/.test(prior) || parsed.stem === "ihr" ||
            (parsed.stem === "mein" && /^(?:ich|wir|sie)$/.test(prior)) || (parsed.stem === "sein" && parsed.ending === "" && !afterPreposition) ||
