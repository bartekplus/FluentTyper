          - "!(!start && !governed && !ART_BARE_AFTER.has(prior) && !(neuter && !ART_DETERMINER_WORDS.test(prior)))"
          - "!(start && adj === low)"
          - '!(/^\p{Lu}/u.test(next) && !BOUNDARY.test(next))'
          - allowed.length > 0 && !allowed.includes(typedEnding)
        return: >-
          ({ ruleId: "germanArticleGender", messageKey: "review_msg_german_adjective_ending",
          range: { start: m.indices!.groups!.adj[0], end: m.indices!.groups!.adj[1] }, alternatives: allowed.map((e) => stem + e),
