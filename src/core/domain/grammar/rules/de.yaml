# de grammar rules. See docs/agents/grammar-rules.md for the format.
lang: de

# Regex fragments of the frame rules: {{NAME}}.
fragments:
  NOT_BLANK: "(?:^|(?=\\S))"
  W: "\\p{L}+"
  MONTHS: "Januar|Februar|April|Mai|Juni|Juli|August|September|Oktober|November|Dezember"
  AUXILIARIES: "hat|habe|haben|hatte|hatten|ist|sind|war|waren|wird|werden|wurde|wurden"
  PARTICIPLE: "(?:ge|be|ver|er|ent|zer)\\p{Ll}{2,}(?:t|en)"
  GEHEN: "gehen|gehst|geht|ging|gingst|gingen|gegangen|gehe"
  DATIVES: "mir|dir|ihm|ihr|uns|euch|ihnen|Ihnen"
  SEIN: "ist|sind|war|waren|bin|bist|seid|wäre|wären|sei|sein|gewesen"
  B: "(?<![\\p{L}\\p{M}])"
  # The German word gate (WORD_GATE of review/german/shared.ts).
  WG: "{{NOT_BLANK}}(?<![.\\p{L}\\p{M}\\p{N}_'’@/#\\\\-])"
  SEP: "[ \\t\\u00a0]?"
  REDUNDANT_STEMS: "[rR]und|[wW]eiß|[sS]chwarz|[tT]ot|[aA]lt|[aA]nder|[sS]elten|[fF]alsch|[zZ]eitlich|[sS]emantisch|[vV]iereckig|[jJ]üdisch|[iI]slamisch|[kK]atholisch|[aA]kustisch|[eE]invernehmlich|[wW]ahr|[pP]roblematisch|[kK]ünstlich|[üÜ]blich|[üÜ]berflüssig|[sS]chriftlich|[nN]eu|[gG]roß|[kK]lein|[lL]eer|[lL]etzt|[gG]emeinsam|[eE]hemalig|[wW]eiblich"
  NOUN_ENDING: "(?:e|en|n|s|es|er|ern|nen)?"
  RECHT_NOT_AFTER: "das|kein|ein|sein|ihr|mein|dein|unser|euer|jedes|volles|vollem|gutes|zum|im|vom|nach|mit|von|auf|zu|dem|des|dieses|jedem|allem"
  SAYING: "sagte|sagt|sagten|rief|ruft|riefen|fragte|fragt|fragten|dachte|denkt|meinte|meint|antwortete|antwortet|erwiderte|erwidert|flüsterte|flüstert|schrie|schreit|murmelte|murmelt|erklärte|erklärt|behauptete|behauptet|seufzte|lachte|rief|bat|befahl"
  # "23.08.2014", "23.8.", "23. August 2014", "23. Aug. 2014", "2015-09-28".
  DATE: "(?:(?<day>\\d{1,3})\\.(?:(?<month>\\d{1,2})\\.(?<year>[0-9]{4})?|[ \\t\\u00a0]?(?<name>September|November|Dezember|Februar|Oktober|Januar|Jänner|August|April|März|Juni|Juli|Sept|Jan|Jän|Feb|Mär|Apr|Mai|Jun|Jul|Aug|Sep|Okt|Nov|Dez)\\.?(?:[ \\t\\u00a0](?<year2>[0-9]{4}))?)|(?<isoYear>[0-9]{4})-(?<isoMonth>\\d{2})-(?<isoDay>\\d{2}))(?!\\d)"
  WEEKDAY: "(?<weekday>Sonntag|Montag|Dienstag|Mittwoch|Donnerstag|Freitag|Samstag|Sonnabend|(?:So|Mo|Di|Mi|Do|Fr|Sa)\\.?)"
  # A token that starts like a number word, either case: "sechs", "Hundert", "tausendzwei".
  NUMBER_PART: "(?:[eE]in|[eE]ins|[zZ]wei|[dD]rei|[vV]ier|[fF]ünf|[sS]echs|[sS]ieben|[aA]cht|[nN]eun|[zZ]ehn|[eE]lf|[zZ]wölf|[dD]reizehn|[vV]ierzehn|[fF]ünfzehn|[sS]echzehn|[sS]iebzehn|[aA]chtzehn|[nN]eunzehn|[zZ]wanzig|[dD]reißig|[vV]ierzig|[fF]ünfzig|[sS]echzig|[sS]iebzig|[aA]chtzig|[nN]eunzig|[hH]undert|[tT]ausend)\\p{Ll}*"
  NUMBER_STARTS: "ein|eins|zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn|elf|zwölf|dreizehn|vierzehn|fünfzehn|sechzehn|siebzehn|achtzehn|neunzehn|zwanzig|dreißig|vierzig|fünfzig|sechzig|siebzig|achtzig|neunzig|hundert|tausend"
  NUMBER_UNITS: "ein|eins|zwei|drei|vier|fünf|sechs|sieben|acht|neun"
  QUANTITY: "zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn|elf|zwölf|zwanzig|hundert|tausend|viele|mehrere|beide|zahlreiche|unzählige"
  ORDINAL_NOUNS: "Jahrhundert|Jahrhunderts|Jahrtausend|Stock|Stockwerk|Etage|Minute|Platz|Geburtstag|Jahrestag|Lebensjahr|Klasse|Spieltag|Runde|Liga|Etappe|Auflage|Kapitel|Januar|Februar|März|April|Mai|Juni|Juli|August|September|Oktober|November|Dezember"
  RANGE_END: "(?:[1-9]\\d{0,3}|0)\\.?|\\p{Lu}"
  RIGHT_VERBS: "haben|hat|hatte|hatten|hast|habe|hätte|hätten|geben|gibt|gab|gaben|gegeben|behalten|behielt|bekommen|bekam"

rules:
  - id: de.compounds
    checks: [germanCompounds]
    predicate: compounds
  - id: de.dates
    checks: [germanDates]
    style: match
    message: review_msg_german_invalid_date
    frames:
      # A weekday before its date: "Sonntag, 23.08.2014", "Samstag den 23. August".
      - regex: "{{WG}}(?<target>{{WEEKDAY}}(?<sep>,?[ \\t\\u00a0]+(?:(?:den|der|dem)[ \\t\\u00a0]+)?)(?<date>{{DATE}}))"
        flags: dgu
        fixer: weekdayDate
      # A date alone: "31. November", "29.2.2014".
      - regex: "(?<![\\d.])(?<target>{{DATE}})"
        flags: dgu
        fixer: loneDate
      # "am 31. april 2020": a full month name in lowercase (germanNounCasing reports its case).
      - regex: "(?<![\\d.])(?<target>(?<day>\\d{1,2})\\.[ \\t\\u00a0]?(?<name>januar|jänner|februar|märz|april|mai|juni|juli|august|september|oktober|november|dezember)(?:[ \\t\\u00a0](?<year2>[0-9]{4}))?)(?![\\p{L}\\d])"
        flags: dgu
        fixer: lowerDate
  - id: de.isoDates
    checks: [germanDates]
    # predicate: calls invalidIsoDates of review/isoDates.ts, a shared scan outside the German
    # modules.
    predicate: isoDates
  - id: de.dateDots
    checks: [germanDates]
    style: match
    message: review_msg_german_date_punctuation
    frames:
      # A day-month date without its closing dot ("am 13.12 um").
      - regex: "(?<=(?:^|[^\\p{L}])(?:am|vom|zum|bis|dem|den|seit){{S}})(?<target>(?<day>\\d{1,2})\\.(?<month>\\d{1,2}))(?=[ \\t\\u00a0]+[^\\d\\s.]|[ \\t\\u00a0]*[,)]|$)"
        flags: dgu
        fixer: dateDot
  - id: de.nounCasing
    checks: [germanNounCasing]
    predicate: nounCasing
  - id: de.prepositionCase
    checks: [germanPrepositionCase]
    predicate: prepositionCase
  - id: de.confusions
    checks: [germanConfusedWords]
    style: german
    message: review_msg_contextual_grammar
    frames:
      # "ihr seit zufrieden" → seid; a time word after it is the preposition ("bei ihr seit 2010").
      - regex: "{{NOT_BLANK}}(?<![.\\p{L}\\p{M}\\p{N}_'’@/#\\\\-])(?:(?<=(?<![\\p{L}])[iI]hr{{S}})(?<target>seit){{E}}(?!{{S}}(?:gestern|vorgestern|wann|langem|kurzem|jeher|damals|neuestem|Jahren|Monaten|Wochen|Tagen|Stunden|Minuten|Sekunden|Jahrzehnten|Jahrhunderten|Ewigkeiten|Generationen|geraumer|einigen|wenigen|vielen|mehreren|letztem|letzter|über|ca|etwa|Anfang|Ende|Mitte|Beginn|Bestehen|Gründung|zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn|elf|zwölf|zwanzig|hundert|dem|einem|einer|meinem|meiner|deinem|deiner|seinem|seiner|ihrem|ihrer|unserem|unserer|eurem|eurer|diesem|dieser|jedem|jeder|keinem|keiner|den|\\p{N}|\\p{Lu})))"
        fix: "seid"
      # "wenn ihr zufrieden seit." → seid: "seit" never closes a clause.
      - regex: "{{NOT_BLANK}}(?<![.\\p{L}\\p{M}\\p{N}_'’@/#\\\\-])(?:(?<target>seit)(?=[ \\t]*[.!?,;]))"
        fix: "seid"
      # "Seit ihr schon fertig?", "Seit bitte leise!"
      - regex: "{{NOT_BLANK}}(?<![.\\p{L}\\p{M}\\p{N}_'’@/#\\\\-])(?:(?<=(?:^|[.!?:]\\s{1,8}|\\n)[„\"]?)(?<target>Seit)(?={{S}}(?:ihr{{S}}[^,.!?\\n]*\\?|(?:bitte|mir|uns|ruhig|leise|vorsichtig|wachsam|still|willkommen|nett|brav|froh|dankbar|gespannt|bereit|gegrüßt|nicht|doch|bloß|mal){{E}}[^,\\n]*[!.])))"
        fix: "Seid"
      # "seid gestern", "seid zwei Tagen", "Seid dem letzten Mittwoch" → seit (no "ihr" around).
      - regex: "{{NOT_BLANK}}(?<![.\\p{L}\\p{M}\\p{N}_'’@/#\\\\-])(?:(?=[sS]eid{{E}})(?<!(?<![\\p{L}])[iI]hr{{S}}(?:\\p{L}{1,40}{{S}}){0,2})(?<target>[sS]eid){{E}}(?!{{S}}ihr{{E}})(?={{S}}(?:(?:gestern|vorgestern|wann|langem|kurzem|jeher|damals|neuestem|Jahren|Monaten|Wochen|Tagen|Stunden|Minuten|Sekunden|Jahrzehnten|Jahrhunderten|Ewigkeiten|Generationen|geraumer|einigen|wenigen|vielen|mehreren|letztem|letzter|über|ca|etwa|Anfang|Ende|Mitte|Beginn|Bestehen|Gründung|zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn|elf|zwölf|zwanzig|hundert|ein{{S}}paar|mehr{{S}}als|\\p{N}+){{E}}|(?:dem|einem|diesem|dieser|der|einer|letztem|letzter|letzten|vergangenem|vergangenen|vorigem|vorigen){{S}}(?:\\p{Ll}+{{S}})?(?:Montag|Dienstag|Mittwoch|Donnerstag|Freitag|Samstag|Sonntag|Jahr|Monat|Tag|Morgen|Abend|Beginn|Anfang|Ende|Sommer|Winter|Frühling|Herbst|Krieg|Unfall|Umzug|Start|Woche|Zeit|Nacht|Stunde|Saison|Kindheit|Jugend|Geburt|Schule|Studium){{E}})))"
        fix: "seit"
      # "Seid du weg bist" → Seit: "seid" takes no subject but "ihr" ("Seid du und Maria …" is
      # one).
      - regex: "{{NOT_BLANK}}(?<![.\\p{L}\\p{M}\\p{N}_'’@/#\\\\-])(?:(?<target>[sS]eid)(?={{S}}(?:ich|du|er|es|wir|man){{E}}(?![ \\t]*(?:,|und{{E}}|oder{{E}}))))"
        fixer: deSs
      # "mir dem Bus", "mir einer gewissen Routine" → mit; "Mir wem redest du?"
      - regex: "{{NOT_BLANK}}(?<![.\\p{L}\\p{M}\\p{N}_'’@/#\\\\-])(?:(?<target>[mM]ir)(?={{S}}(?:dem|einem|einer|meinem|meiner|deinem|deiner|seinem|seiner|ihrem|ihrer|unserem|unserer|eurem|eurer|diesem|jedem|keinem){{S}}(?:\\p{Ll}+{{S}}){0,2}\\p{Lu}))"
        fix: "mit"
      - regex: "{{NOT_BLANK}}(?<![.\\p{L}\\p{M}\\p{N}_'’@/#\\\\-])(?:(?<=(?:^|[.!?]\\s{1,8}))(?<target>Mir)(?={{S}}wem{{E}}))"
        fix: "Mit"
      # "tut mit leid", "gefällt mit gut", "Sag mit bitte", "Kann mit jemand" → mir.
      - regex: "{{NOT_BLANK}}(?<![.\\p{L}\\p{M}\\p{N}_'’@/#\\\\-])(?:(?:[tT]ut|[tT]at|[tT]äte){{S}}(?<target>mit)(?={{S}}(?:\\p{Ll}+{{S}})?leid{{E}})|(?:[gG]efällt|[gG]efiel|[fF]ällt|[fF]iel){{S}}(?<t2>mit)(?={{S}}(?:gut|sehr|nicht|besser|schon|auch|auf|ein){{E}}|[ \\t]*[.!?,])|(?:[sS]ag|[sS]agt|[gG]ib|[gG]ebt|[zZ]eig|[zZ]eigt|[sS]chick|[sS]chickt|[hH]ilf|[hH]elft|[bB]ring|[bB]ringt|[eE]rklär|[eE]rklärt){{S}}(?<t3>mit)(?={{S}}bitte{{E}})|(?:[kK]ann|[kK]önnte){{S}}(?<t4>mit)(?={{S}}(?:bitte{{S}})?jemand{{E}}))"
        fix: "mir"
      # "ich freue mir", "bedanke ich mir" → mich.
      - regex: "{{NOT_BLANK}}(?<![.\\p{L}\\p{M}\\p{N}_'’@/#\\\\-])(?:(?:freue|freu|bedanke|beeile|kümmere|entscheide|irre|schäme|wundere|ärgere|beschwere|erhole|verspäte|konzentriere|interessiere|gewöhne|verabschiede|entschuldige|verliebe|frage){{S}}(?:ich{{S}})?(?<target>mir){{E}})"
        fix: "mich"
      # "Ich würde mir sehr freuen", "Ich habe mir vertan", "möchte mir bei Ihnen bedanken".
      - regex: "{{NOT_BLANK}}(?<![.\\p{L}\\p{M}\\p{N}_'’@/#\\\\-])(?:(?<![\\p{L}](?:bei|mit|zu|von|an|vor|nach|aus|außer|gegenüber){{S}})(?<target>mir){{E}}(?=(?:{{S}}(?:sehr|so|riesig|total|wirklich|echt|herzlich|herzlichst|wahnsinnig|schon|auch|nicht|leider|immer|darum|darüber|dafür|bei|Ihnen|dir|euch|dafür|vielmals|nochmals|gleich))*{{S}}(?:freuen|bedanken|beeilen|kümmern|entscheiden|irren|schämen|wundern|ärgern|beschweren|erholen|verspäten|konzentrieren|verlieben|verabschieden|entschuldigen|vertan|geirrt|gefreut|bedankt|beeilt|gekümmert|geschämt|gewundert|geärgert|beschwert|erholt|verspätet|verliebt|verabschiedet){{E}}[ \\t]*(?:[.!?,;]|$)))"
        fix: "mich"
      # "mich Sorgen", "mich Bescheid", "mich erlaubt", "hat mich geholfen" → mir.
      - regex: "{{NOT_BLANK}}(?<![.\\p{L}\\p{M}\\p{N}_'’@/#\\\\-])(?:(?<!(?<![\\p{L}])(?:[lL]ass|[lL]asst|[lL]assen|[lL]ieß|[lL]ießen|[üÜ]ber|[fF]ür|[gG]egen|[uU]m|[dD]urch|[oO]hne|[aA]n|[aA]uf){{S}})(?<target>mich)(?={{S}}(?:Sorgen|Bescheid|erlaubt|erlauben|geholfen|helfen|sagen|gesagt|gedankt|vorstellen,{{S}}dass|wünschen,{{S}}dass){{E}}))"
        fix: "mir"
      - regex: "{{NOT_BLANK}}(?<![.\\p{L}\\p{M}\\p{N}_'’@/#\\\\-])(?:(?:[wW]ünsche|[wW]ünscht|[wW]ünschte){{S}}(?<target>mich)(?=,{{S}}dass{{E}}))"
        fix: "mir"
      # "mir unterstützt", "mir (bitte) zurückrufen" → mich.
      - regex: "{{NOT_BLANK}}(?<![.\\p{L}\\p{M}\\p{N}_'’@/#\\\\-])(?:(?<target>mir)(?={{S}}(?:bitte{{S}})?(?:unterstützt|zurückrufen|anrufen){{E}}))"
        fix: "mich"
      # "Ich weiß, das er kommt" → dass; "Das er kommt, weiß ich." → Dass.
      # "Ich glaube kaum, das das reicht", "Nicht, das ich wüsste", "Sie wusste das er kommt".
      - regex: "{{NOT_BLANK}}(?<![.\\p{L}\\p{M}\\p{N}_'’@/#\\\\-])(?:(?<=(?:(?:weiß|wusste|wussten|wüsste|weißt|wissen|sagt|sagte|sagten|gesagt|sage|sagen|schreibt|schrieb|hofften|glaubten|dachten|merkten|geschrieben|hoffe|hoffen|hofft|glaube|glauben|glaubt|denke|denkt|dachte|gedacht|finde|findet|meine|meint|heißt|bedeutet|klar|sicher|sehe|sieht|merke|merkt|zeigt|zeigte|erwarte|fürchte|behauptet|behauptete|gewährleistet|versprochen|vergessen|gehört|bemerkt|erfahren|verstanden|möglich|wichtig|schade|interessant|überzeugt|beklagt|höre|hören|hört|bedeutet|folgt|fest|beschwert|erstaunt|bewusst|froh|stolz|besorgt|gemerkt|erkannt|festgestellt|bewiesen|Folge|dessen)(?:{{S}}(?:nicht|kaum|auch|schon|nur|sehr|genau|wohl))?|Nicht),{{S}})(?<target>das)(?={{S}}(?:ich|du|er|sie|es|wir|man|alle|das|der|die|den|dem){{E}})|(?<t2>(?<verb>weiß|wusste|wussten|wüsste|weißt|wissen|sagt|sagte|sagten|gesagt|sage|sagen|schreibt|schrieb|hofften|glaubten|dachten|merkten|geschrieben|hoffe|hoffen|hofft|glaube|glauben|glaubt|denke|denkt|dachte|gedacht|finde|findet|meine|meint|heißt|bedeutet|klar|sicher|sehe|sieht|merke|merkt|zeigt|zeigte|erwarte|fürchte|behauptet|behauptete|gewährleistet|versprochen|vergessen|gehört|bemerkt|erfahren|verstanden|möglich|wichtig|schade|interessant|überzeugt|beklagt|höre|hören|hört|bedeutet|folgt|fest|beschwert|erstaunt|bewusst|froh|stolz|besorgt|gemerkt|erkannt|festgestellt|bewiesen|Folge|dessen){{S}}das)(?={{S}}(?:(?:ich|du|er|sie|es|wir|man){{S}}\\p{Ll}|(?:der|die|den|dem|ein|eine|einen|mein\\p{Ll}*|dein\\p{Ll}*|sein\\p{Ll}*|unser\\p{Ll}*){{S}}\\p{Lu})))"
        fixer: deDas
      - regex: "{{NOT_BLANK}}(?<![.\\p{L}\\p{M}\\p{N}_'’@/#\\\\-])(?:(?<=(?:^|[.!?]\\s{1,8}|\\n))(?<target>Das)(?={{S}}(?:ich|du|er|sie|es|wir|man){{S}}\\p{Ll}))"
        fix: "Dass"
      # "Das dem Mann ein Zahn fehlt, ist bedauerlich": a subject clause, its verb last.
      - regex: "{{NOT_BLANK}}(?<![.\\p{L}\\p{M}\\p{N}_'’@/#\\\\-])(?:(?<=(?:^|[.!?]\\s{1,8}|\\n))(?<target>Das)(?={{S}}(?:dem|der|den|die|ein\\p{Ll}*|mein\\p{Ll}*|dein\\p{Ll}*|sein\\p{Ll}*|ihr\\p{Ll}*|unser\\p{Ll}*|alle|alles|jemand|niemand|hier|so){{S}}(?<clause>[^.!?\\n,]*\\p{Ll}),{{S}}(?:ist|war|wäre|freut|ärgert|stört|wundert|zeigt|bedeutet|macht|liegt|hat|gefällt|beweist|spricht|überrascht){{E}}))"
        fixer: deDas2
      # "Gut das du da bist" → "Gut, dass": an adjective that opens a sentence before a clause.
      - regex: "{{NOT_BLANK}}(?<![.\\p{L}\\p{M}\\p{N}_'’@/#\\\\-])(?:(?<=(?:^|[.!?]\\s{1,8}|\\n))(?<target>(?<adj>(?:(?:[sS]ehr|[wW]irklich|[eE]cht|[gG]anz){{S}})?(?:[gG]ut|[sS]chön|[sS]uper|[tT]oll|[sS]chade|[kK]lasse|[pP]rima|[wW]ichtig|[kK]omisch|[sS]eltsam|[kK]lar|[lL]ogisch|[mM]erkwürdig|[eE]rstaunlich|[iI]nteressant)){{S}}das)(?={{S}}(?!(?:ist|war|wäre|wird|kann|muss|soll|hat|hatte|sei|bleibt){{E}})(?:nicht|jetzt|erst|selbst|fast|endlich|\\p{Ll}+(?<!t)){{E}}[^.!?\\n,]*\\p{Ll}[ \\t]*[.!?…]))"
        fixer: deAdj
      # "Toll das Menschen helfen", "einen Hinweis das Meilen gutgeschrieben werden": "das" before
      # a noun it cannot be the article of (a plural, or a masculine or feminine noun), after an
      # adjective or a noun it cannot refer back to, opens a "dass" clause that ends in its verb.
      - regex: "{{NOT_BLANK}}(?<![.\\p{L}\\p{M}\\p{N}_'’@/#\\\\-])(?:(?<target>(?<head>{{W}}){{S}}das)(?={{S}}(?<next>\\p{Lu}\\p{Ll}+){{E}}(?<rest>[^.!?\\n,;:]{0,80}\\p{Ll})[ \\t]*(?:[.!?,;:]|$)))"
        fixer: deHead
      # "immer wider", "ist wider da" → wieder; "wider Willen", "wider die Natur" stay.
      - regex: "{{NOT_BLANK}}(?<![.\\p{L}\\p{M}\\p{N}_'’@/#\\\\-])(?:(?<![fF]ür{{S}}und{{S}})(?<target>wider)(?={{S}}(?!(?:den|die|das|dem|des|ein|eine|einen|einem|eines|einer|jede|jeden|jedes|jeder|alle|allen|alles|aller|besseres|besseren|bessere|kein\\p{Ll}*|mein\\p{Ll}*|dein\\p{Ll}*|sein\\p{Ll}*|ihr\\p{Ll}*|unser\\p{Ll}*|eur\\p{Ll}*|diese\\p{Ll}*|jegliche\\p{Ll}*|solche\\p{Ll}*){{E}})\\p{Ll}+{{E}}(?!{{S}}\\p{Lu})|[ \\t]*(?:[.!?,;]|$)))"
        fixer: deWider
      # "wieder Erwarten" → wider; "wieder erwarten wir" is the verb.
      - regex: "{{NOT_BLANK}}(?<![.\\p{L}\\p{M}\\p{N}_'’@/#\\\\-])(?:(?<target>[wW]ieder)(?={{S}}Erwarten{{E}}))"
        fix: "wider"
      # "in denn Garten" → den; "Was ist den los?", "mehr den je", "es sei den" → denn.
      - regex: "{{NOT_BLANK}}(?<![.\\p{L}\\p{M}\\p{N}_'’@/#\\\\-])(?:(?<=(?:[iI]n|[aA]n|[aA]uf|[fF]ür|[dD]urch|[gG]egen|[uU]m|[oO]hne|[üÜ]ber|[uU]nter|[vV]or|[hH]inter|[nN]eben|[zZ]wischen){{S}})(?<target>denn)(?={{S}}(?:\\p{Ll}+{{S}})?\\p{Lu}))"
        fix: "den"
