      - regex: "{{NOT_BLANK}}(?<![.\\p{L}\\p{M}\\p{N}_'’@/#\\\\-])(?:(?<={{B}}(?<noun>[hH]elfe|[hH]ilfst|[hH]ilft|[hH]elft|[hH]elfen|[hH]alf|[hH]alfen|[gG]eholfen|[dD]anke|[dD]ankst|[dD]ankt|[dD]anken|[dD]ankte|[dD]ankten|[gG]edankt|[vV]ertraue|[vV]ertraust|[vV]ertraut|[vV]ertrauen|[vV]ertraute|[vV]ertrauten|[gG]ratuliere|[gG]ratulierst|[gG]ratuliert|[gG]ratulieren|[gG]ratulierte|[gG]ratulierten|[bB]egegne|[bB]egegnest|[bB]egegnet|[bB]egegnen|[bB]egegnete|[bB]egegneten|[gG]efällt|[gG]efiel|[gG]efielen|[gG]ehören|[gG]ehörten|[wW]iderspreche|[wW]idersprichst|[wW]iderspricht|[wW]idersprechen|[wW]idersprach|[wW]idersprachen){{S}})(?<target>ihn|mich|dich){{E}}(?!{{S}}(?:zu|selbst){{E}}))"
