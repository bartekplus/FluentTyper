          governed: "parsed.prep ? undefined : afterPreposition && Object.hasOwn(ART_GOVERNED, prior) ? ART_GOVERNED[prior] : undefined"
          narrowed: "governed ? cases0.filter((c) => governed.includes(c)) : cases0"
