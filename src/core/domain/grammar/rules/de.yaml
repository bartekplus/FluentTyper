      # The case a verb gives its object, a recipient, or the accusative of a pronoun subject's
      # object.
      articleObjectFix:
        args: >-
          ctx: DetectContext, m: RegExpExecArray, parsed: GermanDeterminer, typed: string, head: string, reading: GermanGenderReading,
          adjectives: string[], nounEnd: number, detStart: number, end: number
        type: RawFinding | null
        let:
          verbFix: artVerbObjectCase(ctx, m.index, nounEnd, parsed, typed, head, reading, adjectives)
          recipient: "verbFix ? null : artIndirectObject(ctx, m.index, nounEnd, parsed, typed, head, reading, adjectives)"
          object: "verbFix || recipient ? null : artObjectCase(ctx, m.index, nounEnd, parsed, typed, reading, adjectives)"
        return: >-
          verbFix ? { ruleId: "germanArticleGender", messageKey: "review_msg_german_verb_case", range: { start: detStart, end },
          alternatives: verbFix, context: { start: m.index, end: nounEnd }, ...(verbFix.length > 1 ? { requiresChoice: true as const } : {}) }
          : recipient ? { ruleId: "germanArticleGender", messageKey: "review_msg_german_verb_case", range: { start: detStart, end },
          alternatives: [recipient], context: { start: m.index, end: nounEnd } }
          : object ? { ruleId: "germanArticleGender", messageKey: "review_msg_german_object_case", range: { start: detStart, end },
          alternatives: [object], context: { start: m.index, end: nounEnd } }
          : null
      # The article (and its adjectives) of the noun's gender, in the typed article's cases,
      # narrowed by the preposition or the sentence start. "der", "die", "diese" are also pronouns:
      # "…, der Auto fährt". "auf der einen Seite", "das eine Mal": an adjective "eine"; "ich
      # meine", "kann sein", "ihr" and "einer" also are pronouns or verbs. "die Hotel Lobby", "das
      # Auto-" written apart, a name after the noun; "eine Office 2021 Lizenz": an open compound
      # with a number; "die Rad fahren": a pronoun and a bare object; "die Gewinn und
      # Verlustrechnung": a compound part missing its hyphen. "mit das Auto": the preposition's case
      # is wrong too (germanPrepositionCase). A sentence opens with its subject as often as not.
