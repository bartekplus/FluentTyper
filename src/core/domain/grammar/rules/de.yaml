# de grammar rules. See docs/agents/grammar-rules.md for the format.
lang: de

# Regex fragments of the frame rules: {{NAME}}.
fragments:
  NOT_BLANK: "(?:^|(?=\\S))"
  W: "\\p{L}+"
  MONTHS: "Januar|Februar|April|Mai|Juni|Juli|August|September|Oktober|November|Dezember"
  AUXILIARIES: "hat|habe|haben|hatte|hatten|ist|sind|war|waren|wird|werden|wurde|wurden"
  PARTICIPLE: "(?:ge|be|ver|er|ent|zer)\\p{Ll}{2,}(?:t|en)"
  GEHEN: "gehen|gehst|geht|ging|gingst|gingen|gegangen|gehe"
  DATIVES: "mir|dir|ihm|ihr|uns|euch|ihnen|Ihnen"
  SEIN: "ist|sind|war|waren|bin|bist|seid|wäre|wären|sei|sein|gewesen"
  B: "(?<![\\p{L}\\p{M}])"
  # The German word gate (WORD_GATE of review/german/shared.ts).
  WG: "{{NOT_BLANK}}(?<![.\\p{L}\\p{M}\\p{N}_'’@/#\\\\-])"
  SEP: "[ \\t\\u00a0]?"
  REDUNDANT_STEMS: "[rR]und|[wW]eiß|[sS]chwarz|[tT]ot|[aA]lt|[aA]nder|[sS]elten|[fF]alsch|[zZ]eitlich|[sS]emantisch|[vV]iereckig|[jJ]üdisch|[iI]slamisch|[kK]atholisch|[aA]kustisch|[eE]invernehmlich|[wW]ahr|[pP]roblematisch|[kK]ünstlich|[üÜ]blich|[üÜ]berflüssig|[sS]chriftlich|[nN]eu|[gG]roß|[kK]lein|[lL]eer|[lL]etzt|[gG]emeinsam|[eE]hemalig|[wW]eiblich"
  NOUN_ENDING: "(?:e|en|n|s|es|er|ern|nen)?"
  RECHT_NOT_AFTER: "das|kein|ein|sein|ihr|mein|dein|unser|euer|jedes|volles|vollem|gutes|zum|im|vom|nach|mit|von|auf|zu|dem|des|dieses|jedem|allem"
  SAYING: "sagte|sagt|sagten|rief|ruft|riefen|fragte|fragt|fragten|dachte|denkt|meinte|meint|antwortete|antwortet|erwiderte|erwidert|flüsterte|flüstert|schrie|schreit|murmelte|murmelt|erklärte|erklärt|behauptete|behauptet|seufzte|lachte|rief|bat|befahl"
  # "23.08.2014", "23.8.", "23. August 2014", "23. Aug. 2014", "2015-09-28".
  DATE: "(?:(?<day>\\d{1,3})\\.(?:(?<month>\\d{1,2})\\.(?<year>[0-9]{4})?|[ \\t\\u00a0]?(?<name>September|November|Dezember|Februar|Oktober|Januar|Jänner|August|April|März|Juni|Juli|Sept|Jan|Jän|Feb|Mär|Apr|Mai|Jun|Jul|Aug|Sep|Okt|Nov|Dez)\\.?(?:[ \\t\\u00a0](?<year2>[0-9]{4}))?)|(?<isoYear>[0-9]{4})-(?<isoMonth>\\d{2})-(?<isoDay>\\d{2}))(?!\\d)"
  WEEKDAY: "(?<weekday>Sonntag|Montag|Dienstag|Mittwoch|Donnerstag|Freitag|Samstag|Sonnabend|(?:So|Mo|Di|Mi|Do|Fr|Sa)\\.?)"
  # A token that starts like a number word, either case: "sechs", "Hundert", "tausendzwei".
  NUMBER_PART: "(?:[eE]in|[eE]ins|[zZ]wei|[dD]rei|[vV]ier|[fF]ünf|[sS]echs|[sS]ieben|[aA]cht|[nN]eun|[zZ]ehn|[eE]lf|[zZ]wölf|[dD]reizehn|[vV]ierzehn|[fF]ünfzehn|[sS]echzehn|[sS]iebzehn|[aA]chtzehn|[nN]eunzehn|[zZ]wanzig|[dD]reißig|[vV]ierzig|[fF]ünfzig|[sS]echzig|[sS]iebzig|[aA]chtzig|[nN]eunzig|[hH]undert|[tT]ausend)\\p{Ll}*"
  NUMBER_STARTS: "ein|eins|zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn|elf|zwölf|dreizehn|vierzehn|fünfzehn|sechzehn|siebzehn|achtzehn|neunzehn|zwanzig|dreißig|vierzig|fünfzig|sechzig|siebzig|achtzig|neunzig|hundert|tausend"
  NUMBER_UNITS: "ein|eins|zwei|drei|vier|fünf|sechs|sieben|acht|neun"
  QUANTITY: "zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn|elf|zwölf|zwanzig|hundert|tausend|viele|mehrere|beide|zahlreiche|unzählige"
  ORDINAL_NOUNS: "Jahrhundert|Jahrhunderts|Jahrtausend|Stock|Stockwerk|Etage|Minute|Platz|Geburtstag|Jahrestag|Lebensjahr|Klasse|Spieltag|Runde|Liga|Etappe|Auflage|Kapitel|Januar|Februar|März|April|Mai|Juni|Juli|August|September|Oktober|November|Dezember"
  RANGE_END: "(?:[1-9]\\d{0,3}|0)\\.?|\\p{Lu}"
  NUMBER_WORD: "\\d|(?<![\\p{L}])(?:ein|zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn|zwanzig|dreißig|fünfzig|hundert|halbes?|paar)"
  DAY_TIMES: "Morgen|Vormittag|Mittag|Nachmittag|Abend|Nacht|morgen|vormittag|mittag|nachmittag|abend|nacht"
  NUMBER_SUFFIXES: "seitig|stellig|prozentig|teilig|jährig|tägig|stündig|minütig|wöchig|monatig|sprachig|farbig|geschossig|zimmerig|türig|spurig|köpfig|sitzig|bändig|zeilig|wertig"
  ADJ_DEGREE: "sehr|ziemlich|recht|ganz|besonders|wirklich|unglaublich|äußerst|echt|so|relativ|extrem"
  CAP_NOUN: "\\p{Lu}[\\p{L}\\p{M}]*(?:-[\\p{L}\\p{M}]+)*"
  DEGREE_ADVERBS: "sehr|so|ganz|zu|echt|wirklich|ziemlich|richtig|total|nicht|doch|auch|schon|immer|eher|recht|extrem|einfach|leider|wohl"
  COPULA_FORMS: "ist|sind|war|waren|bin|bist|seid|wird|werden|wurde|wurden|bleibt|blieb|bleiben"
  GREETING_WORDS: "(?:Hallo|Hi|Hey|Moin|Servus|Guten[ \\t]{1,4}(?:Morgen|Tag|Abend))"
  CLAUSE_CHAR: "[^.!?;:,\\n]"
  CASE_PREPOSITION: "(?<prep>[mM]it|[vV]on|[bB]ei|[aA]us|[nN]ach|[zZ]u|[sS]eit|[sS]amt|[nN]ebst|[aA]ußer|[gG]emäß|[nN]ahe|[eE]ntsprechend|[wW]egen|[tT]rotz|[wW]ährend|[sS]tatt|[aA]nstatt|[aA]ufgrund|[bB]ezüglich|[aA]ngesichts|[mM]angels|[iI]nfolge|[aA]bzüglich|[zZ]uzüglich|[iI]nklusive|[eE]xklusive|[hH]insichtlich|[aA]nhand|[aA]nlässlich|[sS]eitens|[mM]ithilfe|[fF]ür|[gG]egen|[dD]urch|[wW]ider|[oO]hne|[uU]m|[bB]etreffend)"
  INFLECTED_ADJ: "\\p{Ll}+(?:e|en|er|es|em)"
  DATIVE_ONLY: "(?<prep>[Mm]it|[Vv]on|[Bb]ei|[Zz]u|[Aa]us|[Nn]ach|[Ss]eit|[Aa]ußer)"
  ARTICLE_DETERMINER: "[dD]er|[dD]ie|[dD]as|[dD]em|[dD]en|[dD]es|[eE]in|[eE]ine|[eE]inen|[eE]inem|[eE]iner|[eE]ines|[kK]ein|[kK]eine|[kK]einen|[kK]einem|[kK]einer|[kK]eines|[mM]ein|[mM]eine|[mM]einen|[mM]einem|[mM]einer|[mM]eines|[dD]ein|[dD]eine|[dD]einen|[dD]einem|[dD]einer|[dD]eines|[sS]ein|[sS]eine|[sS]einen|[sS]einem|[sS]einer|[sS]eines|[iI]hre|[iI]hren|[iI]hrem|[iI]hrer|[iI]hres|[uU]nser|[uU]nsere|[uU]nseren|[uU]nserem|[uU]nserer|[uU]nseres|[eE]uer|[eE]ure|[eE]uren|[eE]urem|[eE]urer|[eE]ures|[dD]ieser|[dD]iese|[dD]ieses|[dD]iesem|[dD]iesen|[jJ]eder|[jJ]ede|[jJ]edes|[jJ]edem|[jJ]eden|[zZ]um|[zZ]ur|[iI]m|[aA]m|[vV]om|[bB]eim|[iI]ns"
  ARTICLE_DEGREE: "sehr|ganz|so|recht|ziemlich|besonders|wirklich|echt|total|äußerst|relativ|eher|zu"
  GENITIVE_REFLEXIVES: "enthielt|enthielten|enthalte|enthältst|enthält|enthaltet|rühmen|rühmt|rühmte|rühmten|rühme|entledigte|entledigten|entledigt|entledigen|entledige|bemächtigte|bemächtigten|bemächtigt|bemächtigen|vergewisserte|vergewissert|vergewissern|erbarmte|erbarmt|erbarmen"
  DATIVE_DET: "dem|einem|keinem|meinem|deinem|seinem|ihrem|unserem|eurem|diesem|jenem|jedem|den|meinen|deinen|seinen|ihren|unseren|euren|diesen|jenen"
  GENITIVE_VERBS: "bedarf|bedürfen|bedurfte|bedurften|bedürfte|gedenke|gedenkt|gedenken|gedachte|gedachten"
  GENITIVE_PARTICIPLES: "enthalten|gerühmt|entledigt|bemächtigt|vergewissert|erbarmt"
  COLLOCATION_VERBS: "(?:nehm|nimm|nahm|nähm|genommen|leist|geleistet|zieh|zog|zög|gezogen|geb|gib|gab|gäb|gegeben|sag|gesagt|weiß|wiss|wusst|gewusst|trag|träg|trug|trüg|getragen|schaff|schuf|geschaffen|halt|hält|hielt|gehalten)\\p{Ll}*"
  COLLOCATION_STEMS: "(?:nehm|nimm|nahm|nähm|genommen|leist|geleistet|zieh|zog|zög|gezogen|geb|gib|gab|gäb|gegeben|sag|gesagt|weiß|wiss|wusst|gewusst|trag|träg|trug|trüg|getragen|schaff|schuf|geschaffen|halt|hält|hielt|gehalten)"
  COLLOCATION_NOUNS: "abstand|abschied|anteil|bezug|einfluss|kenntnis|rücksicht|stellung|folge|widerstand|beistand|nutzen|bilanz|bescheid|rechnung|abhilfe|rücksprache"
  IDIOM_ORDINALS: "ersten|zweiten|dritten|vierten|fünften|sechsten|siebten|achten|neunten|zehnten|elften|zwölften|fünfzehnten|zwanzigsten|dreißigsten|letzten"
  IDIOM_DEGREE: "sehr|ganz|ziemlich|echt|wirklich|total|so|zu|nicht|überhaupt|recht|richtig|extrem|besonders|gar|nie|immer|doch|auch|schon|eher|absolut|einfach|unheimlich|wahnsinnig"
  IDIOMS_SEIN: "ist|war|wäre|wird|wurde|sei|sein|bin|bist|sind|seid|waren|wären"
  POSSESSIVES: "mein|dein|sein|ihr|unser|euer|Ihr"
  IDIOMS_DATIVES: "[Mm]ir|[Dd]ir|[Ii]hm|ihr|[Uu]ns|[Ee]uch|ihnen|Ihnen"
  IDIOMS_MONTHS: "Januar|Februar|März|April|Mai|Juni|Juli|August|September|Oktober|November|Dezember"
  NOMINAL_ADJ: "(?<target>\\p{L}+)"
  LANGUAGE_NAMES: "deutsch|englisch|französisch|spanisch|italienisch|polnisch|russisch|türkisch|griechisch|schwedisch|portugiesisch|kroatisch|arabisch|chinesisch|japanisch|latein"
  LOWER_NOUNS: "Tee|Einmaleins|Feuer|Algebra|Geometrie|Rasen|Intelligenz|Netzwerk|Netzwerke|Medien|Energien|Energie|Dienst|Reife|Faden|Buffet|Gewalt|Grüße|Grüßen|Jahr|Winkel|Tür|Feld|Feldstärke|Strom|Bildungsabschluss|Bildungsabschlüsse|Menschenverstand"
  NAME_NOUNS: "Weltkrieg|Revolution|Krieg|Eisenbahn|Frieden|Mauer|Armee|Kreuz|Meer|Ozean|Abend|Schrift|Geist|Land|Nationen|Union|Zentralbank|Kommission|Osten|Schweiz|Alb|Spiele|Reich|Gericht|Abendmahl|Staaten|Königreich|Republik|Inseln|Stadt|Welt|Zwanziger|Währungsfonds|Strafgerichtshof|Rundfunk|Empfängnis|Gärten|Tatra|Walachei|Bundesamt|Fluss|Fernsehen|Bank|Bund|Volksrepublik|Vater|Garten|Turm|Seiten"
  RIGHT_VERBS: "haben|hat|hatte|hatten|hast|habe|hätte|hätten|geben|gibt|gab|gaben|gegeben|behalten|behielt|bekommen|bekam"

# The code of the rules' expressions (`let`, `when`, `return`): sets, maps and defs.
sets:
  # Never a pronoun: the genitive article, ein-words and possessives with a short ending, and the
  # preposition-article contractions.
  ARTICLES: [
      des, ein, eine, einen, einem, kein, keine, keinen, keinem, keinerlei, mein, meine, meinen, meinem, dein,
      deine, deinen, deinem, sein, seine, seinen, seinem, ihre, ihren, ihrem, unser, unsere, unseren, unserem,
      euer, eure, euren, eurem, am, im, zum, zur, beim, vom, ins, ans, aufs, ums, durchs, fürs, übers, unters,
      vors, hinterm, überm, unterm,
    ]
  # Articles and demonstratives that also stand alone as pronouns ("die kosten viel").
  DEMONSTRATIVES: [
      der, die, das, den, dem, dies, diese, dieser, diesen, diesem, dieses, jene, jener, jenen, jenem, jenes,
      welche, welcher, welchen, welchem, welches, solche, solcher, solchen, solchem, solches,
    ]
  PREPOSITIONS: [
      in, an, auf, aus, bei, mit, nach, von, vor, zu, für, gegen, ohne, durch, um, über, unter, hinter, neben,
      zwischen, seit, wegen, trotz, während, statt, anstatt, per, pro, laut, gemäß, dank, samt, bis, ab, außer,
      innerhalb, außerhalb, oberhalb, unterhalb, mittels, entlang,
    ]
  # Verbs that close a clause with a bare infinitive or a participle ("kannst du das ändern",
  # "diese habe ergeben").
  VERB_GOVERNORS: [
      kann, kannst, können, könnt, konnte, konnten, könnte, könnten, muss, musst, müssen, müsst, musste,
      mussten, müsste, müssten, soll, sollst, sollen, sollt, sollte, sollten, will, willst, wollen,
      wollt, wollte, wollten, darf, darfst, dürfen, dürft, durfte, durften, dürfte, dürften, mag,
      möchte, möchtest, möchten, werde, wirst, wird, werden, werdet, würde, würdest, würden, wurde,
      wurden, worden, lass, lasse, lässt, lassen, ließ, tu, tue, tut, tun, brauchst, braucht, brauchen,
      habe, hast, hat, haben, habt, hatte, hatten, hätte, hätten, bin, bist, ist, sind, seid, war, waren,
      wäre, wären, sei, konntest, könntest, könntet, solltest, solltet, müsstest, müsstet, musstest,
      wolltest, wolltet, dürftest, dürftet, durftest, magst, mögt, mögen, mochte, mochten, möchtet,
      würdet, wurdest,
    ]
  # Personal and reflexive pronouns.
  PRONOUNS: [ich, du, er, sie, es, wir, ihr, man, sich, mich, dich, uns, euch, mir, dir]
defs:
  # The noun-casing findings of the idiom frames: the filter afterIdiomNoun reads their ends.
  IDIOM_FINDINGS: new WeakSet<RawFinding>()
  # The findings of the lowercase noun frame: an idiom finding before one may drop it.
  NOUN_FINDINGS: new WeakSet<RawFinding>()
  # "darüber", "hierunter", "worüber": a preposition joined to da-, hier- or wo-.
  PRONOMINAL_ADVERB: /^(?:da|dar|hier|wo|wor)(?:an|auf|aus|bei|durch|für|gegen|hinter|in|mit|nach|neben|über|um|unter|von|vor|zu|zwischen)$/u
  # The index of the last clause boundary at or before i, or -1.
  boundaryBefore:
    args: "before: string[], i: number"
    type: number
    return: "i < 0 || BOUNDARY.test(before[i]) ? i : boundaryBefore(before, i - 1)"
  # Whether the clause before `at` has a verb that the word at its end can complete.
  governedBefore:
    args: "before: string[], at: number"
    let:
      from: boundaryBefore(before, at - 1) + 1
    return: before.slice(from, at).some((t) => VERB_GOVERNORS.has(t.toLowerCase()))
  # Verbs "zurecht" belongs to: zurechtkommen, -legen, -finden, -machen, -rücken, -weisen.
  ZURECHT_VERBS: '/(?<!\p{L})(?:ge)?(?:komm|kam|käm|leg|find|fand|fänd|mach|rück|weis|wies|stell|schneid|schnitt|bieg|bog|setz|zupf|richt)\p{Ll}*/u'
  # Nouns of fixed noun-and-verb phrases that are lowercase only as a slip, and their verbs' stems.
  NEHMEN: /^(?:nehm|nimm|nahm|nähm|genommen)/
  COLLOCATIONS: >-
    ({
      abstand: NEHMEN, abschied: NEHMEN, anteil: NEHMEN, bezug: NEHMEN, einfluss: NEHMEN,
      kenntnis: NEHMEN, rücksicht: NEHMEN, stellung: NEHMEN,
      folge: /^(?:leist|geleistet)/, widerstand: /^(?:leist|geleistet)/, beistand: /^(?:leist|geleistet)/,
      nutzen: /^(?:zieh|zog|zög|gezogen)/, bilanz: /^(?:zieh|zog|zög|gezogen)/,
      bescheid: /^(?:geb|gib|gab|gäb|gegeben|sag|gesagt|weiß|wiss|wusst|gewusst)/,
      rechnung: /^(?:trag|träg|trug|trüg|getragen)/, abhilfe: /^(?:schaff|schuf|geschaffen)/,
      rücksprache: /^(?:halt|hält|hielt|gehalten)/,
    }) as Readonly<Record<string, RegExp>>
  # Languages, which are nouns after "ist": "Das ist Englisch".
  LANGUAGES: "/(?:deutsch|^englisch|französisch|spanisch|italienisch|russisch|polnisch|türkisch|griechisch|chinesisch|japanisch|arabisch|niederländisch|schwedisch|portugiesisch|latein)$/"
  # The words of a text, in lowercase.
  lowerWords:
    args: "text: string"
    return: '(text.match(/\p{L}+/gu) ?? []).map((w) => w.toLowerCase())'
  # The rest of the clause after the match, to the next stop.
  clauseRest:
    args: "ctx: DetectContext, m: RegExpExecArray"
    return: 'ctx.text.slice(m.index + m[0].length, m.index + m[0].length + 120).split(/[.!?;,:\n]/)[0]'
  # The clause before the match, from the last stop.
  clauseBefore:
    args: "ctx: DetectContext, m: RegExpExecArray"
    return: 'ctx.text.slice(Math.max(0, m.index - 120), m.index).split(/[.!?;,:\n]/).at(-1) ?? ""'
  # The idiom frames' typed group: the first of "target", "t2"-"t5" that matched.
  idiomGroup:
    args: "m: RegExpExecArray"
    return: '["target", "t2", "t3", "t4", "t5"].find((k) => m.groups![k] !== undefined)!'
  # An idiom frame runs unless the user's dictionary holds the typed word or a named example
  # comes before it.
  idiomOpen:
    args: "m: RegExpExecArray, ctx: DetectContext"
    let:
      name: idiomGroup(m)
    return: "!ctx.dictionary.has(m.groups![name].toLowerCase()) && !namedExampleBefore(ctx.text, m.indices!.groups![name][0])"
  # The noun-casing finding of an idiom frame on its typed group; none when the fix is the typed word.
  idiomFinding:
    args: "m: RegExpExecArray, ctx: DetectContext, frame: FrameRef, fixed: string | readonly string[]"
    let:
      name: idiomGroup(m)
      span: m.indices!.groups![name]
      typed: m.groups![name]
      replacements: "[fixed].flat().filter((r) => r !== typed)"
    when: replacements.length > 0
    return: >-
      remember(IDIOM_FINDINGS, {
        ruleId: "germanNounCasing",
        messageKey: frame.messageKey,
        range: { start: span[0], end: span[1] },
        alternatives: replacements,
        ...(replacements.length > 1 ? { requiresChoice: true as const } : {}),
        context: { start: Math.max(0, span[0] - 40), end: Math.min(ctx.text.length, span[1] + 40) },
      })
  # "die erste, die zweite und …", "die erste, das Gebiet umfassende …": an ordinal before a
  # relative pronoun of its gender is a noun unless an enumeration, an attribute or a noun earlier
  # in the sentence ("Von den Zügen ist der erste, der …") follows or comes before.
  ordinalAsNoun:
    args: "m: RegExpExecArray, ctx: DetectContext"
    let:
      article: '/(\p{L}+)[ \t]+$/u.exec(m.input.slice(Math.max(0, m.index - 8), m.index))?.[1]'
      next: '/^,[ \t]+\p{L}+[ \t]+(\p{L}+)/u.exec(m.input.slice(m.index + m[0].length))?.[1] ?? ""'
      sentence: 'ctx.text.slice(Math.max(0, m.index - 120), m.index).split(/[.!?\n]/).at(-1)!'
    when: 'article?.toLowerCase() === m.groups!.relative && !/^\p{Ll}+e[nmrs]?$/u.test(next)'
    return: '!/[ \t]\p{Lu}/u.test(sentence)'
    else: "false"
  # A token that opens a clause, or no token.
  politeOpens:
    args: "token: string | undefined"
    return: 'token === undefined || /^(?:[.!?:,;„“"»«]|\n)$/.test(token)'
  # A token that ends a clause, or no token at all.
  BOUNDARY: '/^(?:[.!?:;,()"“”„«»–—\n-]|$)/'
  # An infinitive that a verb phrase made a noun ends with; no participle ("zum Markt erhoben").
  nominalVerb:
    args: "word: string"
    return: germanInfinitive(word) && !/^(?:ge|be|er|ver|ent|zer|emp|miss)\p{Ll}{3,}en$/u.test(word)

rules:
  - id: de.compounds
    checks: [germanCompounds]
    style: match
    message: review_msg_closed_compound
    sets:
      # Particles of separable verbs; "um" and "mit" are left out ("um zu gehen" is "in order to
      # go"), and "zu" ("zu zu muten") needs the joined verb to be known like the others.
      COMPOUND_PARTICLES: [
          ab, an, auf, aus, bei, ein, fest, fort, her, herab, heran, herauf, heraus, herbei, herein, herüber,
          herum, herunter, hervor, hin, hinab, hinauf, hinaus, hinein, hinüber, hinunter, hinweg, los, nach,
          nieder, vor, voran, voraus, vorbei, vorüber, weg, weiter, wieder, zurück, zusammen, zu, bereit, statt,
          teil, kennen, fertig, frei, zufrieden, wohl, hoch, dar, empor, entgegen, unter, zurecht,
        ]
      # Adverbs ending in -t, unlike the finite verbs whose particle comes next ("fängt an zu").
      NOT_FINITE: [nicht, jetzt, erst, oft, fast, meist, zuletzt, sonst, selbst, gut, recht, weit, halt, damit, dort, mit, seit, womit, somit, leicht, vielleicht, direkt, exakt]
      # Words that make the particle part of another phrase: "den weg", "gerade aus", "da nach",
      # "immer hin", "außen vor", "all zu".
      NOT_PARTICLE_AFTER: [
          der, die, das, den, dem, des, ein, eine, einen, einem, einer, eines, kein, keine, keinen, keinem, mein,
          meinen, meinem, dein, deinen, deinem, sein, seinen, seinem, ihren, ihrem, unseren, unserem, gerade, da,
          hier, wo, dort, all, immer, außen, bergauf, bergab,
        ]
      # Particles no main verb leaves right before a zu-infinitive ("Er fängt an zu laufen", "Sie
      # hat vor zu gehen" do), so they open the infinitive with no comma: "kein Grund los zu
      # brüllen", "Ist es gut unter zu gehen?".
      CLAUSE_PARTICLES: [
          herab, heran, herauf, heraus, herbei, herein, herüber, herum, herunter, hervor, hinab, hinauf, hinaus,
          hinein, hinüber, hinunter, hinweg, los, unter, nieder, empor, zurecht, zu,
        ]
      # Forms of "sein", which takes no particle ("ist kein Grund los zu brüllen").
      COMPOUND_COPULAS: [ist, sind, war, waren, bin, bist, seid, wäre, wären, sei]
      # Verbs that take a noun after "zum" or "beim" as a fixed phrase ("zum Ausdruck bringen",
      # "beim Wort nehmen", "zum Opfer fallen").
      COMPOUND_LIGHT_VERBS: [
          bringen, kommen, stellen, nehmen, machen, haben, werden, fallen, führen, gelangen, setzen, ziehen,
          rufen, zwingen, bewegen, dienen, geben, halten, nennen, treiben, reichen, schicken,
        ]
      # Full verbs that take a bare infinitive of their own ("Wir fahren zum Hafen angeln", "Sie
      # lernt beim Meister kochen").
      COMPOUND_BARE_VERBS: [gehen, fahren, kommen, laufen, lassen, sehen, hören, fühlen, spüren, bleiben, lernen, lehren, helfen, schicken, legen, sein]
      # Adjectives that take no ending ("ein lila Kleid", "eine super Idee") or that make a fixed
      # phrase with a noun ("ein wenig Zeit", "ein gut Stück"), and adverbs that the dictionary
      # also lists as adjectives ("Die erst Mitte Mai gefundene …").
      PAIR_UNINFLECTED: [
          lila, rosa, pink, beige, orange, oliv, super, klasse, prima, spitze, extra, top, mega, okay, live, online,
          offline, cool, fair, gratis, egal, pleite, schuld, quitt, wenig, viel, mehr, genug, ganz, gut, klein, halt,
          solch, welch, manch, paar, bisschen, recht, echt, voll, erst, sicher, natürlich, wirklich, ziemlich,
          bestimmt, eben, kaum, fast, gleich,
        ]
    maps:
      EMAIL_FORMS: { Emails: E-Mails, E-Mailadresse: E-Mail-Adresse }
    defs:
      ORDINAL_STEMS: '["Erst", "Zweit", "Dritt", "Viert", "Fünft", "Sechst", "Siebt", "Acht", "Neunt", "Zehnt", "Elft", "Zwölft", "Dreizehnt"]'
      # "beschlossen", "versuchte", "empfahl": a fixed prefix, which no particle splits off.
      FIXED_PREFIX: '/^(?:be|ver|er|ent|zer|emp|miss)\p{Ll}{3,}$/u'
      # The finding of a compound frame: the joined form of the `target` group, in its case.
      compoundFinding:
        args: "m: RegExpExecArray, ctx: DetectContext, replacement: string | null"
        type: RawFinding | null
        let:
          typed: m.groups!.target
          span: m.indices!.groups!.target
        when: "!!replacement && replacement !== typed && !ctx.dictionary.has(typed.toLowerCase())"
        return: >-
          ({ ruleId: "germanCompounds", messageKey: "review_msg_closed_compound", range: { start: span[0], end: span[1] },
          alternatives: [deLikeTyped(typed, replacement)], context: { start: Math.max(0, span[0] - 40), end: span[1] + 20 } })
      # "-adresse" → "-Adresse", "s" stays.
      emailRest:
        args: "rest: string | undefined"
        return: 'rest === undefined || !rest.startsWith("-") ? rest ?? "" : `-${rest[1].toUpperCase()}${rest.slice(2)}`'
      particleJoins:
        args: "particle: string, infinitive: string"
        return: germanInfinitive(infinitive) && germanInfinitive(particle + infinitive)
      # Whether the particle and the verb form after it make one verb: "ab sagst" (absagen). "ab
      # geschickt": a participle; "zu gelassen" may be "too calm". "zu gehen" is a zu-infinitive;
      # other particles join an infinitive too ("los gehen"). "gibt", "lässt": a listed irregular
      # form; "sagst", "sagte": a regular one. "vor fuhr", "bereit standen": a strong past form
      # ("zu lasen" is more likely a misspelled zu-infinitive). "zu lange", "zu enge": "too",
      # before an adjective in -e.
      compoundJoinsVerb:
        args: "particle: string, verb: string"
        let:
          participle: '/^ge(\p{Ll}{2,}?)(?:en|t)$/u.exec(verb)'
          listed: germanInfinitiveOf(verb)
          stem: '/^(.+?)(?:e|st|t|est|et|te|test|ten|tet)$/u.exec(verb)?.[1]'
        when: "!germanAuxiliary(verb)"
        return: >-
          participle ? particle !== "zu" && particleJoins(particle, `${participle[1]}en`)
          : /(?:en|ern|eln)$/.test(verb) && germanInfinitive(verb) ? particle !== "zu" && particleJoins(particle, verb)
          : listed ? particleJoins(particle, listed)
          : particle !== "zu" && germanPastInfinitives(verb).some((inf) => particleJoins(particle, inf)) ? true
          : !stem || (particle === "zu" && verb.endsWith("e")) ? false
          : particleJoins(particle, `${stem}en`) || particleJoins(particle, `${stem}n`)
        else: "false"
      # Whether a zu-participle closes a perfect with "haben" ("hatte die Tür zu gemacht"); not
      # after a linking verb, and not a split "dazu", "wozu" ("hatte da nichts zu gesagt").
      zuParticipleJoins:
        args: "ctx: DetectContext, index: number, aux: string | undefined"
        let:
          clause: 'ctx.text.slice(Math.max(0, index - 80), index).split(/[.!?;:,\n]/).at(-1)!.match(/\p{L}+/gu) ?? []'
        return: >-
          clause.some((t) => /^(?:hab(?:e|en|t)|hast|hat|hatte\p{Ll}*|hätte\p{Ll}*)$/u.test(t)) &&
          !clause.some((t) => COMPOUND_COPULAS.has(t) || /^(?:wirk|schein|schien|bleib|blieb|wird|wurde)\p{Ll}*$/u.test(t)) &&
          !clause.some((t) => /^(?:da|wo)$/i.test(t)) && !aux
      # Whether the words before `index` open an infinitive clause of their own (after a comma, or
      # "um", "ohne", "statt") with no finite verb whose particle the word could be: "Er
      # versprach, mich dort hin zu bringen" but not "Fang nicht an zu heulen". "Wir beschlossen
      # an zu fangen": a verb with a fixed prefix leaves no particle behind.
      infinitiveClause:
        args: "ctx: DetectContext, index: number, particle: string"
        let:
          before: ctx.text.slice(Math.max(0, index - 120), index)
          clause: '/(?:^|[.!?;:\n,])([^.!?;:\n,]*)$/.exec(before)?.[1] ?? ""'
          tokens: 'clause.match(/\p{L}+/gu) ?? []'
          verbs: >-
            tokens.filter((t) => /^\p{Ll}/u.test(t) && !COMPOUND_COPULAS.has(t) && ((/t$/.test(t) && !NOT_FINITE.has(t)) ||
            germanVerbLike(t) || /^(?:fing|gab|bot|nahm|sah|schlug|hielt|ließ|kam|ging|fingen|gaben|hörten)$/.test(t)))
        return: >-
          (verbs.length > 0 && verbs.every((t) => FIXED_PREFIX.test(t) && germanVerbLike(t))) ||
          ((/,[^,]*$/.test(before) || tokens.some((t) => /^(?:um|ohne|statt|anstatt)$/i.test(t)) || CLAUSE_PARTICLES.has(particle)) &&
          verbs.length === 0)
      # Where the phrase stands: opening the sentence before the clause's verb ("Beim Haare
      # schneiden kommen mir …", not "Beim Bäcker kaufen wir Brot"), or after "für das" at the end
      # of a clause, as thanks for an activity ("Danke für das Korrektur lesen.").
      phrasePlace:
        args: "ctx: DetectContext, start: number, end: number, article: boolean"
        let:
          rest: ctx.text.slice(end, end + 40)
          next: '/^[ \t]+(\p{Ll}+)/u.exec(rest)?.[1] ?? ""'
        return: >-
          article ? /[Dd]anke?[ \t]+(?:sch(?:ö|oe)n[ \t]+)?für(?:[ \t]+da)?s[ \t]+$/.test(ctx.text.slice(Math.max(0, start - 30), start)) &&
          /^[ \t]*(?:[,.!?;:)]|(?:mit|für|bei|von|an)[ \t]|$)/.test(rest)
          : /(?:^|[.!?:\n„"])[ \t]*\p{L}+[ \t]+$/u.test(ctx.text.slice(Math.max(0, start - 16), start)) && !!next &&
          !/^(?:die|der|das|den|dem|wir|sie|ich|er|es|man)$/.test(next) &&
          (germanAuxiliary(next) || germanVerbLike(next) || (/\p{Ll}{2,}e?t$/u.test(next) && germanInfinitive(`${next.replace(/e?t$/, "")}en`)))
      # "Wir treffen uns zum Kaffee trinken.": the clause's verb is a full verb, so the infinitive
      # closing it cannot be that verb's ("Ich muss beim Arzt anrufen", "Ich gehe zum Bäcker
      # einkaufen", "Wir bringen es zum Kochen bringen" keep theirs).
      nominalPhraseClause:
        args: "ctx: DetectContext, start: number, end: number, going: boolean, low: string, verb: string"
        let:
          clause: 'ctx.text.slice(Math.max(0, start - 80), start).split(/[.!?;:,\n]/).at(-1)!.match(/\p{L}+/gu) ?? []'
          verbs: clause.filter((w) => /^\p{Ll}/u.test(w) && germanVerbLike(w))
        when:
          - '!(going || germanNounReading(low) !== "noun" || COMPOUND_LIGHT_VERBS.has(verb))'
          - '/^[ \t]*(?:[.!?;]|$)/.test(ctx.text.slice(end, end + 4))'
          - '/(?<!\p{L})(?:zum|beim|fürs)[ \t]+$/iu.test(ctx.text.slice(Math.max(0, start - 8), start))'
          - verbs.length === 1 && !clause.some((w) => VERB_GOVERNORS.has(w.toLowerCase()))
        return: "!COMPOUND_BARE_VERBS.has(germanInfinitiveOf(verbs[0]) ?? verbs[0])"
        else: "false"
      # A noun compound written as two words: the second word, a capitalized noun.
      PAIR_SECOND: '/^[ \t]+(\p{Lu}\p{Ll}{2,})(?![\p{L}\p{M}\p{N}_@/#\\-])/u'
      PAIR_NUMBER: /^(?:\p{N}+|zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn|elf|zwölf|viele|mehrere)$/iu
      # Words before a name, so the pair after them is a name ("Herr Fuchs Bauer").
      PAIR_FUNCTION_WORDS: >-
        new Set([...ARTICLES, ...DEMONSTRATIVES, ...PREPOSITIONS, ...PRONOUNS,
        ..."ein kein mehr viel wenig ganz halb so sehr nur auch noch schon gut neu alle".split(" ")])
      # Superlative and other stems that only open compounds ("Kleinst|lebewesen", "Selbst|achtung").
      PAIR_STEMS: /^(?:kleinst|größt|höchst|mindest|best|selbst|meist)$/
      PAIR_TITLES: /^(?:Herr|Herrn|Frau|Dr|Prof|Familie|Firma|St|Sankt)$/
      # Determiners and counts after which an adjective before a noun takes an ending. Forms that
      # also stand alone as a pronoun or a verb ("eine", "meinen", "sein") are left out; "der",
      # "die", "das" count only at a sentence start ("in dem ständig Soldaten" is a relative
      # clause).
      PAIR_DETERMINED: >-
        new Set([...ARTICLES, ..."viele vielen mehrere mehreren einige einigen beide beiden".split(" ")].filter((w) =>
        !/^(?:k?ein(?:e|er|es)|meinen?|deine|seine?|ihre|unsere|eure)$/.test(w)))
      # A noun with a linking -s, -es, -n or -en ("Abfahrts", "Hochleistungs", "Behinderten").
      pairLinked:
        args: "word: string"
        return: >-
          ["s", "es", "n", "en"].some((end) => word.endsWith(end) && word.length - end.length >= 3 && germanNounReading(word.slice(0, -end.length)) !== null)
      # An inflected adjective or a participle ("getarnte", "leistenden", "einquartiert").
      pairAttribute:
        args: "w: string"
        return: >-
          /^\p{Ll}*(?:ge\p{Ll}+(?:t|en)|iert|end)(?:e|en|er|es|em)?$/u.test(w) ||
          (/^\p{Ll}+(?:e|en|er|es|em)$/u.test(w) && germanAdjective(w.replace(/(?:e|en|er|es|em)$/, "")))
      # "im roh Zustand", "eine trans Frau", "zwei halb Brüder": an adjective with no ending between
      # a determiner and a noun takes an ending there, so the two words are one compound
      # ("Rohzustand"). "der vorangegangen Frage": a participle that lacks its ending. A noun, not
      # an adjective used as one ("das politisch Machbare"). "sein eigen Fleisch und Blut": an old
      # fixed phrase. "zum wichtig Thema": a derived adjective opens a compound only where the
      # lexicon has it. A longer name after it ("die frei Wählbare Liste"), an extended attribute
      # ("die schnell Hilfe leistenden Helfer") or a zu-infinitive ("ein unter Druck zu lagerndes
      # Gas") keeps the words apart.
      pairSplitAdjective:
        args: "ctx: DetectContext, m: RegExpExecArray"
        type: RawFinding | null
        let:
          first: m[0]
          end: m.index + first.length
          pair: PAIR_SECOND.exec(ctx.text.slice(end, end + 48))
          low: pair[1].toLowerCase()
          before: deTokensBefore(ctx.text, m.index, 2)
          prior: before.at(-1) ?? ""
          opening: 'before.length < 2 || /^[.!?:\n„“"»«]$/.test(before[0])'
          det: prior.toLowerCase()
          stop: end + pair[0].length
          next: deTokensAfter(ctx.text, stop, 1)[0] ?? ""
        when:
          - '/^\p{Ll}{2,}$/u.test(first) && !/e$/.test(first) && !PAIR_UNINFLECTED.has(first)'
          - '!(ARTICLES.has(first) || DEMONSTRATIVES.has(first) || /ge\p{Ll}{2,}en$/u.test(first))'
          - germanAdjective(first) && germanNounReading(first) === null
          - pair
          - germanListedNoun(low) !== null && !germanAdjective(low.replace(/(?:e|en|er|es|em)$/, ""))
          - '!(first === "eigen" && low === "fleisch")'
          - "!(/(?:ig|lich|isch|sam|bar|haft|los)$/.test(first) && germanNounReading(first + low) === null)"
          - PAIR_DETERMINED.has(det) || PAIR_NUMBER.test(prior) || (opening && DEMONSTRATIVES.has(det))
          - '!(/^\p{Lu}/u.test(next) || next === "zu" || pairAttribute(next))'
          - "!ctx.dictionary.has(first) && !ctx.dictionary.has(low)"
          - "!namedExampleBefore(ctx.text, m.index)"
        return: >-
          ({ ruleId: "germanCompounds", messageKey: "review_msg_closed_compound", range: { start: m.index, end: stop },
          alternatives: [first[0].toUpperCase() + first.slice(1) + low], context: { start: Math.max(0, m.index - 40), end: stop + 20 } })
      # A word of the chunk: the compound it opens, split by a space. Both parts German nouns or
      # opening parts ("Joint Venture", "Game Boys" stay English). "Abfahrts", "Regenerierungs": a
      # word with this linking -s stands in no other place, so the compound needs no lookup
      # ("Abfahrts" is no genitive). A longer name or title: a capitalized word right before (not
      # at a sentence start) or after. "des Nachts Bücher lesen": an adverbial genitive. An
      # unknown compound only after a determiner or an adjective ("nach Hephaistions Tod" is a
      # name's genitive). At a sentence start a capitalized adjective or adverb is no part ("Viel
      # Spaß"). A noun of its own ("Fußball Spieler" may be two nouns) needs a number or a
      # determiner that fits the compound and not the first noun.
      nounPairFinding:
        args: "ctx: DetectContext, m: RegExpExecArray"
        type: RawFinding | null
        let:
          first: m[0]
          end: m.index + first.length
          pair: PAIR_SECOND.exec(ctx.text.slice(end, end + 48))
          second: pair[1]
          joined: first.toLowerCase() + second.toLowerCase()
          low: first.toLowerCase()
          fused: '/(?:ung|heit|keit|schaft|ion|tät)s$/.test(low) || (/s$/.test(low) && germanGender(low.slice(0, -1))?.gender === "f")'
          knownJoin: germanNounReading(joined) !== null
          secondNoun: "fused ? germanMayBeNoun(second.toLowerCase()) : germanListedNoun(second.toLowerCase()) !== null"
          before: deTokensBefore(ctx.text, m.index, 2)
          prior: before.at(-1) ?? ""
          stop: end + pair[0].length
          next: deTokensAfter(ctx.text, stop, 1)[0] ?? ""
          det: prior.toLowerCase()
          opening: BOUNDARY.test(prior)
          noun: germanNounReading(low) !== null
        when:
          - '/^\p{Lu}\p{Ll}{2,}$/u.test(first)'
          - pair
          - "!(joined.length < 8 || (!knownJoin && !fused))"
          - secondNoun && !PAIR_FUNCTION_WORDS.has(low)
          - "!ctx.dictionary.has(low) && !ctx.dictionary.has(second.toLowerCase())"
          - '!(/^\p{Lu}/u.test(next) || PAIR_TITLES.test(prior))'
          - '!/^(?:des|eines)$/i.test(prior)'
          - knownJoin || PAIR_DETERMINED.has(det) || DEMONSTRATIVES.has(det) || pairAttribute(prior)
          - '!(/^\p{Lu}/u.test(prior) && !BOUNDARY.test(before.at(-2) ?? ""))'
          - "!(opening && germanAdjective(low))"
          - >-
            noun && !fused ? (PAIR_NUMBER.test(prior) && /(?:er|en|n|e|s)$/.test(second)) ||
            (germanDeterminerFits(prior, first) !== true && !!germanDeterminerFits(prior, second))
            : noun || fused || germanAdjective(low) || PAIR_STEMS.test(low) || pairLinked(low)
          - "!namedExampleBefore(ctx.text, m.index)"
        return: >-
          ({ ruleId: "germanCompounds", messageKey: "review_msg_closed_compound", range: { start: m.index, end: stop },
          alternatives: [first + second.toLowerCase()], context: { start: Math.max(0, m.index - 40), end: stop + 20 } })
    frames:
      # "Ich bin ihm über den weggelaufen", "aus dem weggehen": "über den Weg laufen", "aus dem
      # Weg gehen" split the noun from the verb.
      - regex: "{{WG}}(?:(?<=(?:über{{S}}den|aus{{S}}dem){{S}})(?<target>[Ww]eg(?<verb>(?:ge)?(?:laufen|lief|liefen|läuft|gehen|ging|gingen|geht|gegangen|gelaufen)))){{E}}"
        flags: dgu
        return: "compoundFinding(m, ctx, `Weg ${verb}`)"
      # "Nach dem er gewonnen hatte": "dem" before a subject pronoun at the start of a sentence
      # is the conjunction "nachdem" or "seitdem" (after a comma it may open a relative clause:
      # "der Schlüssel, nach dem ich suche").
      - regex: "{{WG}}(?:(?:^|[.!?\\n„\"])[ \\t]*(?<target>(?<first>Nach|Seit){{S}}dem)(?={{S}}(?:ich|du|er|sie|es|wir|ihr|man){{E}})){{E}}"
        flags: dgu
        return: "compoundFinding(m, ctx, `${first}dem`)"
      # "So weit ich weiß", "so bald das Wetter …": "soweit", "sobald", "solange".
      - regex: "{{WG}}(?:(?:^|[.!?,;:\\n„\"])[ \\t]*(?<target>(?<first>[Ss]o){{S}}(?<second>weit|bald|lange|lang))(?={{S}}(?:ich|du|er|sie|es|wir|ihr|man|der|die|das){{E}})){{E}}"
        flags: dgu
        return: "compoundFinding(m, ctx, `${first}${second}`)"
      # "ihr zu Liebe.", "den Eltern zu gute kommen", "Berichten zu Folge", "zu Nichte machen":
      # fixed adverbs written apart, in the frames where "zu" is no preposition ("zu Liebe statt
      # Hass", "von Folge zu Folge", "zu gute Noten").
      - regex: "{{WG}}(?:(?<target>zu{{S}}(?:(?<liebe>Liebe)(?=[ \\t]*[.!?]|,{{S}}(?:weil|da|dass|obwohl|denn))|(?<gute>gute)(?:(?<gverb>{{S}}(?:kommen|kommt|kam|kamen|gekommen|halten|hält|hielt|hielten|gehalten)){{E}}|(?=[ \\t]*[.,!?;]))|(?<folge>Folge)(?=[ \\t]*[,.;]|{{S}}\\p{Ll})|(?<nichte>Nichte)(?=[ \\t]*[.!?]|{{S}}(?:mach|gemacht))))){{E}}"
        flags: dgu
        let:
          prior: deTokensBefore(ctx.text, m.index, 1)[0] ?? ""
        when:
          # "ihr zu Liebe", "den Eltern zu Liebe": a dative before it; "kam zu gute", "etwas zu gute
          # kommen": the verb or its object.
          - >-
            !((liebe || gute) && !/^(?:mir|dir|ihm|ihr|uns|euch|ihnen|Ihnen|\p{Lu}\p{Ll}+n?)$/u.test(prior) &&
            !(gute && /^(?:kam|kamen|kommt|käme|halte|hält|hielt|etwas|nichts|viel|wenig)$/.test(prior)))
          # "Berichten zu Folge", not "von Folge zu Folge".
          - '!(folge && (!/^\p{Lu}\p{Ll}+(?:en|n|ung|e)$/u.test(prior) || prior === "Folge"))'
        # "zu gute gehalten" → "zugutegehalten": the verb joins too.
        return: >-
          compoundFinding(m, ctx, liebe ? "zuliebe" : gute ? `zugute${gverb?.trim() ?? ""}` : folge ? "zufolge" : "zunichte")
      # "Er freute sich, das zuhören.": an infinitive clause after a comma, its zu written onto
      # the verb ("zu hören"); the clause ends after it or opens a dass-clause.
      - regex: "{{WG}}(?:(?<=,{{S}}(?:(?:das|es|dies){{S}})?|(?:mich|dich|ihn|uns|euch){{S}})(?<target>zu(?<verb>\\p{Ll}{3,}))(?=[ \\t]*(?:[.!?;]|,{{S}}(?:dass|ob|wie|was|wo|wer|wann|warum|bevor|hinter){{E}}))){{E}}"
        flags: dgu
        let:
          words: 'ctx.text.slice(Math.max(0, m.index - 80), m.index).split(/[.!?;:\n]/).at(-1)!.match(/\p{L}+/gu) ?? []'
        when:
          - '!(!germanInfinitive(verb) || germanAuxiliary(verb) || verb.startsWith("zu"))'
          # The main clause before the comma has its verb ("freute", "gelang"); "Bitte, zuhören!" is an
          # instruction. "Wir sollten, statt zu reden, zuhören": a modal takes the bare infinitive.
          - "!words.some((w) => VERB_GOVERNORS.has(w.toLowerCase()))"
          - '!(words.length < 2 || /!/.test(ctx.text.slice(m.indices!.groups!.target[1]).slice(0, 2)))'
        return: "compoundFinding(m, ctx, `zu ${verb}`)"
      # "beim Haare schneiden", "zum Auto fahren", "für das Korrektur lesen": a verb phrase made
      # a noun is one word ("beim Haareschneiden").
      - regex: "{{WG}}(?:(?=\\p{Lu}\\p{Ll})(?<=(?:[Bb]eim|[Zz]um|[Vv]om|[Vv]orm|[Ff]ürs|(?:[Ff]ür|[Üü]ber|[Nn]ach|[Vv]or|[Bb]ei|[Mm]it){{S}}d(?:as|em)){{S}})(?<target>(?<noun>\\p{Lu}\\p{Ll}+){{S}}(?<verb>\\p{Ll}+(?:en|ern|eln)))){{E}}"
        flags: dgu
        let:
          low: noun.toLowerCase()
          start: m.indices!.groups!.target[0]
          end: m.indices!.groups!.target[1]
          prefix: ctx.text.slice(Math.max(0, start - 8), start)
          # "beim Spazieren gehen", "vorm Schlafen gehen", "beim Gassi gehen": "gehen" made a noun with
          # an infinitive, or after "beim"; "Zum Arzt gehen ist wichtig" is a phrase.
          going: 'verb === "gehen" && (germanInfinitive(low) || !/zum[ \t]+$/i.test(prefix))'
          contraction: '/(?<!\p{L})(zum|beim|vom|vorm)[ \t]+$/iu.exec(prefix)?.[1]'
        when:
          - '!(!germanInfinitive(verb) || germanAuxiliary(verb) || verb === "lassen")'
          - '!(verb === "gehen" ? !going : germanNounReading(low) === null)'
        # "zum Zeitung lesen", "beim Haare schneiden": a noun the contraction cannot take as its dative
        # only heads the phrase made a noun.
        return: >-
          phrasePlace(ctx, start, end, /(?:d(?:as|em)|fürs)[ \t]+$/i.test(prefix)) ||
          (!!contraction && !going && nominalVerb(verb) && germanDeterminerFits(contraction, noun) === false) ||
          nominalPhraseClause(ctx, start, end, going, low, verb) ? compoundFinding(m, ctx, `${noun}${verb}`) : null
      # "Ideen zum selber machen", "beim Selbst Kochen": "selber" or "selbst" with an infinitive
      # after "zum", "beim" or "fürs" is one noun ("zum Selbermachen").
      - regex: "{{WG}}(?:(?<=(?:[Zz]um|[Bb]eim|[Ff]ürs){{S}})(?<target>(?<self>[Ss]elb(?:er|st)){{S}}(?<verb>\\p{L}+(?:en|ern|eln)))(?=[ \\t]*(?:[.!?;,]|$))){{E}}"
        flags: dgu
        let:
          low: verb.toLowerCase()
        when: germanInfinitive(low) && !germanAuxiliary(low)
        return: "compoundFinding(m, ctx, `${self[0].toUpperCase()}${self.slice(1)}${low}`)"
      # "zulange gewartet" → "zu lange"; "wenn ich da zulange" is "zulangen" (help oneself).
      - regex: "{{WG}}(?:(?<target>[Zz]ulange)){{E}}"
        flags: dgu
        return: >-
          compoundFinding(m, ctx, /(?<!\p{L})ich(?!\p{L})/iu.test(ctx.text.slice(Math.max(0, m.index - 80), m.index).split(/[.!?;,:\n]/).at(-1)!) ? null : "zu lange")
      # A separable verb's zu-infinitive written apart: "auf zu bauen" → "aufzubauen".
      - regex: "{{WG}}(?:(?<prev>\\p{L}+,?){{S}}(?<target>(?<particle>ab|an|auf|aus|bei|ein|fest|fort|her|herab|heran|herauf|heraus|herbei|herein|herüber|herum|herunter|hervor|hin|hinab|hinauf|hinaus|hinein|hinüber|hinunter|hinweg|los|nach|nieder|vor|voran|voraus|vorbei|vorüber|weg|weiter|wieder|zurück|zusammen|zu|bereit|statt|teil|kennen|fertig|frei|zufrieden|wohl|hoch|dar|empor|entgegen|unter|zurecht){{S}}zu{{S}}(?<verb>\\p{Ll}+))){{E}}"
        flags: dgu
        when:
          - COMPOUND_PARTICLES.has(particle) && germanInfinitive(verb)
          # "der Reihe nach zu holen", "von Grund auf zu bauen", "auf und ab zu gehen".
          - '!/^(?:Reihe|Grund|und|oder)$/.test(prev)'
          - infinitiveClause(ctx, m.indices!.groups!.target[0], particle)
          # A particle that opens no clause of its own joins even a verb the lexicon lacks
          # ("hinunterzuziehen", "loszubrüllen").
          - germanInfinitive(particle + verb) || (CLAUSE_PARTICLES.has(particle) && particle !== "zu")
        return: "compoundFinding(m, ctx, `${particle}zu${verb}`)"
      # "Falls du ab sagst,", "hat den Brief ab geschickt.", "als sie los gingen": a particle
      # written apart from its verb at the end of a clause, where a main clause would not split
      # it. "wieder", "weiter", "zusammen" and the like are left out: both spellings exist.
      - regex: "{{WG}}(?:(?<target>(?<particle>ab|an|auf|aus|bei|ein|los|nach|vor|weg|zu|dar|her|hin|fort|heraus|herein|hinaus|hinein|herum|statt|teil|unter|bereit|stand){{S}}(?<verb>\\p{Ll}{3,}))(?=(?:{{S}}(?<aux>\\p{Ll}+))?[ \\t]*(?:[,.!?;:)]|$))){{E}}"
        flags: dgu
        let:
          before: deTokensBefore(ctx.text, m.index, 3)
          prior: before.at(-1)?.toLowerCase() ?? ""
          # "das vor geschlagen hatte": an article is the object's, unless the particle is also a noun
          # ("den weg", "das aus").
          article: /^(?:d|k?ein|mein|dein|sein|ihr|unser)(?:er|ie|as|en|em|es|e)?$/.test(prior)
          # "hat die Tür zu gemacht": after a form of "haben", "zu" and a participle make one verb; "ist
          # zu gelassen", "wirkte zu gelassen" are "too calm".
          zuParticiple: 'particle === "zu" ? /^ge(\p{Ll}{2,}?)(?:en|t)$/u.exec(verb) : null'
        when:
          - "!(aux && !germanAuxiliary(aux))"
          # "von Anfang an gesagt", "von klein auf gelernt": the particle closes "von …".
          - '!(NOT_PARTICLE_AFTER.has(prior) && !(article && !/^(?:weg|aus|los|teil)$/.test(particle)))'
          - '!(before.some((t) => /^[Vv]on$/.test(t)) || before.at(-1) === "Berg")'
        return: >-
          compoundFinding(m, ctx, zuParticiple ? (zuParticipleJoins(ctx, m.index, aux) && germanInfinitive(`zu${zuParticiple[1]}en`) ? `zu${verb}` : null)
          : compoundJoinsVerb(particle, verb) ? particle + verb : null)
      # "sich um zu drehen", "damit um zu gehen": "um" as a particle.
      - regex: "{{WG}}(?:(?<=(?:sich|damit|dich|mich|uns|euch){{S}})(?<target>um{{S}}zu{{S}}(?<verb>\\p{Ll}+))){{E}}"
        flags: dgu
        return: "compoundFinding(m, ctx, germanInfinitive(`um${verb}`) ? `umzu${verb}` : null)"
      # "bereit stellen", "kennen lernen", "fertig stellen": a particle before an infinitive.
      - regex: "{{WG}}(?:(?<target>(?<particle>bereit|kennen|fertig|zufrieden|statt|teil|nieder|weg|los|vorbei|hinzu|preis|zugute){{S}}(?<verb>\\p{Ll}+(?:en|ern|eln)))){{E}}"
        flags: dgu
        return: >-
          compoundFinding(m, ctx, germanInfinitive(verb) && (germanInfinitive(particle + verb) || germanVerbLike(particle + verb)) ? particle + verb : null)
      # Times of day: "Dienstag Abend" → "Dienstagabend".
      - regex: "{{WG}}(?:(?<=(?:am|jeden|diesen|nächsten|letzten|kommenden|vergangenen|bis|ab|seit|vom|zum|Am|Jeden){{S}})(?<target>(?<day>Montag|Dienstag|Mittwoch|Donnerstag|Freitag|Samstag|Sonnabend|Sonntag){{S}}(?<time>{{DAY_TIMES}}))){{E}}"
        flags: dgu
        return: "compoundFinding(m, ctx, `${day}${time.toLowerCase()}`)"
      # Numbers with suffixes: "8 seitig" → "8-seitig".
      - regex: "(?<![\\p{L}\\p{N}.,-])(?<target>(?<n>\\p{N}+)(?:[ \\t]?)(?<suffix>(?:{{NUMBER_SUFFIXES}}|Seitig|Stellig|Prozentig|Teilig|Jährig|Tägig|Stündig|Minütig|Wöchig|Monatig|Sprachig|Farbig|Geschossig|Zimmerig|Türig|Spurig|Köpfig|Sitzig|Bändig|Zeilig|Wertig)(?:e|en|er|es|em)?)){{E}}"
        flags: dgu
        return: "compoundFinding(m, ctx, `${n}-${suffix.toLowerCase()}`)"
      # "acht hundertmal", "hundert tausendmal": a number word before "-mal" is one word.
      - regex: "{{WG}}(?:(?<target>(?<count>ein|zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn|zwanzig|hundert|tausend){{S}}(?<times>hundertmal|tausendmal))){{E}}"
        flags: dgu
        # "ein tausendmal größeres Problem": "ein" is the noun's article.
        return: >-
          compoundFinding(m, ctx, count === "ein" && /^[ \t]+\p{Ll}+er(?:e|es|en|er|em)?(?!\p{L})/u.test(ctx.text.slice(m.index + m[0].length, m.index + m[0].length + 30))
          ? null : count + times)
      # "im 5 Minuten Takt", "ein 9 Euro Ticket": a number and its unit before a noun that a
      # singular determiner goes with are one hyphenated word ("5-Minuten-Takt"). Without such
      # a determiner the unit may measure the noun ("3 Tage Urlaub"). A longer chain ("eine 14
      # Tage Geld zurück Garantie") is left alone.
      - regex: "{{WG}}(?:(?=\\p{N})(?<=(?<!\\p{L})(?:[Ee]in|[Ee]ine|[Ee]inen|[Ee]inem|[Ee]iner|[Ee]ines|[Ii]m|[Aa]m|[Zz]um|[Zz]ur|[Vv]om|[Bb]eim|[Ii]ns|[Dd]as|[Dd]em|[Dd]es){{S}})(?<target>(?<n>\\p{N}+){{S}}(?<unit>Minuten|Stunden|Tage|Wochen|Monate|Jahre|Euro|Dollar|Cent|Prozent|Punkte|Meter|Kilometer|Zimmer|Sterne|Gänge|Liter|Kilo|Gramm|Seiten|Personen|Zoll|Grad|Tonnen){{S}}(?<noun>\\p{Lu}\\p{Ll}{2,}))(?![ \\t]+(?:\\p{Lu}|zurück))){{E}}"
        flags: dgu
        return: 'compoundFinding(m, ctx, germanNounReading(noun.toLowerCase()) !== null ? `${n}-${unit}-${noun}` : null)'
      # "3. Klässler" → "Drittklässler".
      - regex: "(?<![\\p{L}\\p{N}.])(?<target>(?<n>1[0-3]|[1-9])\\.[ \\t]?[Kk]lässler(?<end>in|innen|n)?){{E}}"
        flags: dgu
        return: 'compoundFinding(m, ctx, `${ORDINAL_STEMS[Number(n) - 1]}klässler${end ?? ""}`)'
      # Abbreviations before nouns: "US Bürger" → "US-Bürger".
      - regex: "{{WG}}(?:(?<target>(?<acronym>US|EU|UN|UNO|IT|PC|PR|EDV|Kfz|KFZ|Pkw|PKW|Lkw|LKW|USB|PDF|HTML|CD|DVD|TV|SMS|GPS|WLAN|SPD|CDU|FDP|DFB|NATO|WHO){{S}}(?<noun>\\p{Lu}\\p{Ll}{2,}))){{E}}"
        flags: dgu
        return: 'compoundFinding(m, ctx, germanNounReading(noun.toLowerCase()) !== null ? `${acronym}-${noun}` : null)'
      # "in's Kino", "auf's Dach", "vor'm Haus": a preposition fused with its article takes no
      # apostrophe.
      - regex: "{{WG}}(?:(?<target>(?<prep>[Ii]n|[Aa]n|[Aa]uf|[Ff]ür|[Dd]urch|[Uu]m|[Hh]inter|[Üü]ber|[Uu]nter|[Vv]or)['’](?<article>s|n|m))){{E}}"
        flags: dgu
        return: "compoundFinding(m, ctx, `${prep}${article}`)"
      # "eMail", "e-mail", "E-mail", "EMail" are never right; "Email" (enamel) only after a
      # determiner that cannot go with "das Email".
      - regex: "{{WG}}(?:(?<target>(?:eMail|e-mail|E-mail|EMail|e-Mail)(?<rest>s|-\\p{L}[\\p{L}-]*)?)){{E}}"
        flags: dgu
        return: "compoundFinding(m, ctx, `E-Mail${emailRest(rest)}`)"
      # "Spam-Email", "HTML-EMail-Adresse": the mail part of a hyphenated compound.
      - regex: "{{WG}}(?:(?<target>(?<pre>(?:\\p{Lu}[\\p{L}]*|\\p{Lu}{2,})-)(?:Email|EMail|eMail|E-mail|e-mail|E-MAIL)(?<rest>s|-\\p{L}[\\p{L}-]*)?)){{E}}"
        flags: dgu
        # "Gold-Email", "Kupfer-Email": enamel; only a word that is no material.
        return: >-
          compoundFinding(m, ctx, /^(?:Gold|Silber|Kupfer|Zinn|Glas|Eisen|Stahl|Feuer)-$/.test(pre) ? null : `${pre}E-Mail${emailRest(rest)}`)
      # "E mail", "e Mails": the letter written apart.
      - regex: "{{WG}}(?:(?<target>[Ee][ \\t]+[Mm](?:ail|AIL|Ail)(?<rest>s?))){{E}}"
        flags: dgu
        return: "compoundFinding(m, ctx, `E-Mail${rest}`)"
      # "E-Mail Adresse", "E-Mail programm": the noun after it joins with a hyphen ("per E-Mail
      # Adressen schicken" sends addresses).
      - regex: "{{WG}}(?:(?<!(?:per|via|als|[Üü]ber|mit){{S}})(?<target>E-Mail{{S}}(?<noun>(?:[Aa]dresse|[Pp]rogramm|[Kk]onto|[Pp]ostfach|[Vv]erkehr|[Aa]nhang|[Ss]ignatur|[Ss]erver|[Vv]erteiler|[Bb]enachrichtigung|[Kk]ommunikation|[Mm]arketing)(?:n|en|e|s|es)?))){{E}}"
        flags: dgu
        return: "compoundFinding(m, ctx, `E-Mail-${noun[0].toUpperCase()}${noun.slice(1)}`)"
      - regex: "{{WG}}(?:(?<=(?:eine|einer|meine|deine|seine|ihre|Ihre|unsere|eure|keine|jede|diese|per|neue|letzte|kurze){{S}})(?<target>Email(?<rest>-\\p{L}[\\p{L}-]*)?)){{E}}"
        flags: dgu
        return: "compoundFinding(m, ctx, `E-Mail${emailRest(rest)}`)"
      - regex: "{{WG}}(?:(?<target>Emails|E-Mailadresse|E-Mailadressen)){{E}}"
        flags: dgu
        return: 'compoundFinding(m, ctx, EMAIL_FORMS[target] ?? "E-Mail-Adressen")'
      # "DinA4" → "DIN A4".
      - regex: "{{WG}}(?:(?<target>(?:DIN|Din|din)(?:-|{{S}})?[Aa](?<size>[0-8])(?<rest>(?:-|{{S}})?Blatt|-\\p{L}+)?)){{E}}"
        flags: dgu
        let:
          tail: '(rest ?? "").replace(/^[-\s]+/, "")'
        return: >-
          compoundFinding(m, ctx, !rest ? `DIN A${size}` : `DIN-A${size}-${tail[0].toUpperCase()}${tail.slice(1)}`)
      - regex: "{{WG}}(?:(?<target>(?:AddOn|Addon|addon|AddOns|Addons|addons)(?<rest>-\\p{L}+)?)){{E}}"
        flags: dgu
        return: >-
          compoundFinding(m, ctx, `Add-on${/s$/.test(target.replace(/-.*$/, "")) ? "s" : ""}${rest ?? ""}`)
      # A compound noun written as two words ("die Abfahrts Zeiten"), and an adjective with no
      # ending that opens a compound ("im roh Zustand"): each word whose start the chunk owns
      # (a word of letters, not glued into a number, path, mention or dotted token).
      - regex: "(?<![\\p{L}\\p{M}\\p{N}_@/#\\\\.-])\\p{L}[\\p{L}\\p{M}]*(?![\\p{L}\\p{M}\\p{N}_@/#\\\\]|\\.\\p{L})"
        scan: owned
        flags: gu
        let:
          split: pairSplitAdjective(ctx, m)
          pairFinding: nounPairFinding(ctx, m)
        return: "[...(split ? [split] : []), ...(pairFinding ? [pairFinding] : [])]"
      # "zu teil", "von statten": a bound first part written as two words, or written apart from
      # its verb ("zunichte gemacht").
      - regex: "{{WG}}(?:(?<first>zunichte|inne|zuteil|vonstatten|zugute|preis|zu{{S}}teil|von{{S}}statten|Preis)(?:(?<zu>{{S}}zu)?{{S}}(?<verb>\\p{Ll}+))?{{E}})"
        flags: dgu
        owner: first
        return: joinedFinding(ctx, m, JOINED_BOUND_FORMS, "germanCompounds")
      # "zu Pass(e)": "zupass" next to a form of "kommen".
      - regex: "{{WG}}(?:(?<first>zu{{S}}Passe?|zupasse?)(?:{{S}}(?<verb>\\p{Ll}+))?{{E}})"
        flags: dgu
        owner: first
        let:
          typed: verb ?? ""
          start: m.indices!.groups!.first[0]
          kommt: JOINED_KOMMEN.test(typed)
          near: kommt || deTokensBefore(ctx.text, start, 4).some((t) => JOINED_KOMMEN.test(t))
        when: "near && !(!/[ \\t]/.test(first) && !kommt)"
        return: >-
          joinedVerbFinding("germanCompounds", start, kommt ? m.index + m[0].length : start + first.length, `zupass${kommt ? typed : ""}`)
  - id: de.dates
    checks: [germanDates]
    style: match
    message: review_msg_german_invalid_date
    maps:
      # Month names and their short forms: the month's number.
      DE_MONTHS:
        {
          januar: 1, jänner: 1, jan: 1, jän: 1, februar: 2, feb: 2, märz: 3, mär: 3, april: 4, apr: 4,
          mai: 5, juni: 6, jun: 6, juli: 7, jul: 7, august: 8, aug: 8, september: 9, sep: 9, sept: 9,
          oktober: 10, okt: 10, november: 11, nov: 11, dezember: 12, dez: 12,
        }
    sets:
      DE_SHORT_MONTHS: [jan, jän, feb, mär, apr, jun, jul, aug, sep, sept, okt, nov, dez]
    defs:
      WEEKDAYS: '["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"]'
      WEEKDAY_SHORT: '["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"]'
      # A preposition or article that a date takes: "am", "vom", "bis zum", "seit dem".
      DATE_PREPOSITION: '/(?:^|[^\p{L}])(?:am|vom|zum|bis|ab|dem|den|seit)[ \t ]{1,8}$/iu'
      # The day, month and year of a DATE match.
      dateParts:
        args: "g: Record<string, string | undefined>"
        type: "{ day: number; month: number; year?: number }"
        return: >-
          g.isoYear ? { day: Number(g.isoDay), month: Number(g.isoMonth), year: Number(g.isoYear) }
          : { day: Number(g.day), month: g.month ? Number(g.month) : DE_MONTHS[g.name!.toLowerCase()],
          year: (g.year ?? g.year2) ? Number(g.year ?? g.year2) : undefined }
      # A date that the calendar has.
      dateValid:
        args: "date: { day: number; month: number; year?: number }"
        return: "date.month >= 1 && date.month <= 12 && date.day >= 1 && date.day <= deDaysInMonth(date.month, date.year)"
      dateFinding:
        args: 'start: number, end: number, alternatives: string[], key: RawFinding["messageKey"]'
        type: RawFinding
        return: >-
          ({ ruleId: "germanDates", messageKey: key, range: { start, end }, alternatives,
          ...(alternatives.length === 0 ? { warningOnly: true as const } : {}),
          ...(alternatives.length > 1 ? { requiresChoice: true as const } : {}) })
      # The weekday the date has, or the nearest date with the weekday typed: only the weekday and
      # the day change, so the range ends after the day.
      weekdayFix:
        args: "m: RegExpExecArray, parts: { day: number; month: number; year?: number }, years: number[], weekdays: number[], index: number"
        type: RawFinding
        let:
          g: m.groups!
          turn: (index - weekdays[0] + 7) % 7
          moved: "deUtcDate(years[0], parts.month, parts.day + (turn > 3 ? turn - 7 : turn))"
          typedDate: g.date
          dayText: "g.isoYear ? moved.toISOString().slice(0, 10) : String(moved.getUTCDate())"
          dayStart: "g.isoYear ? 0 : typedDate.indexOf(g.day)"
          dayEnd: "g.isoYear ? typedDate.length : dayStart + g.day.length"
          sep: 'g.sep.startsWith(",") ? g.sep : `,${g.sep}`'
          head: typedDate.slice(0, dayStart)
        return: >-
          dateFinding(m.indices!.groups!.target[0], m.indices!.groups!.date[0] + dayEnd,
          [...weekdays.map((w) => `${WEEKDAYS[w]}${sep}${head}${g.isoYear ? typedDate : g.day}`), `${g.weekday}${sep}${head}${dayText}`],
          parts.year === undefined ? "review_msg_weekday_no_year" : "review_msg_german_weekday_date")
    frames:
      # A weekday before its date: "Sonntag, 23.08.2014", "Samstag den 23. August".
      - regex: "{{WG}}(?<target>{{WEEKDAY}}(?<sep>,?[ \\t\\u00a0]+(?:(?:den|der|dem)[ \\t\\u00a0]+)?)(?<date>{{DATE}}))"
        flags: dgu
        let:
          parts: dateParts(m.groups!)
          start: m.indices!.groups!.target[0]
          punct: >-
            sep.startsWith(",") ? [] : [dateFinding(m.indices!.groups!.weekday[0], m.indices!.groups!.weekday[1],
            [`${weekday},`], "review_msg_german_date_punctuation")]
          early: >-
            (parts.year !== undefined && parts.year < 1583) ||
            /^[ \t ]*v\./.test(ctx.text.slice(m.index + m[0].length, m.index + m[0].length + 4))
          years: >-
            early ? [] : parts.year === undefined ? deYearsFor(parts.month, parts.day, deContextYear(ctx.text, start, ctx.lang))
            : [parts.year]
          weekdays: "[...new Set(years.map((y) => deWeekdayOf(y, parts.month, parts.day)))]"
          typedDay: weekday.replace(/\.$/, "")
          index: >-
            typedDay === "Sonnabend" ? 6 : Math.max(WEEKDAYS.indexOf(typedDay), WEEKDAY_SHORT.indexOf(typedDay))
        when: dateValid(parts)
        return: >-
          early || !years.length || weekdays.includes(index) ? punct : [...punct, weekdayFix(m, parts, years, weekdays, index)]
      # A date alone: "31. November", "29.2.2014".
      - regex: "(?<![\\d.])(?<target>{{DATE}})"
        flags: dgu
        let:
          parts: dateParts(m.groups!)
          namedZero: >-
            m.groups!.name !== undefined && parts.day === 0 && DATE_PREPOSITION.test(ctx.text.slice(Math.max(0, m.index - 12), m.index))
        when:
          - "!isoYear && !dateValid(parts)"
          - "!(parts.year === undefined && !namedZero && (parts.day === 0 || parts.month === 0 || parts.month > 12))"
        return: >-
          dateFinding(m.indices!.groups!.target[0], name && !year2 && !DE_SHORT_MONTHS.has(name.toLowerCase())
          ? m.indices!.groups!.name[1] : m.indices!.groups!.target[1], [], "review_msg_german_invalid_date")
      # "am 31. april 2020": a full month name in lowercase (germanNounCasing reports its case).
      - regex: "(?<![\\d.])(?<target>(?<day>\\d{1,2})\\.[ \\t\\u00a0]?(?<name>januar|jänner|februar|märz|april|mai|juni|juli|august|september|oktober|november|dezember)(?:[ \\t\\u00a0](?<year2>[0-9]{4}))?)(?![\\p{L}\\d])"
        flags: dgu
        let:
          parts: dateParts(m.groups!)
        when:
          - "!dateValid(parts)"
          - "!!year2 || DATE_PREPOSITION.test(ctx.text.slice(Math.max(0, m.index - 12), m.index))"
        return: >-
          dateFinding(m.indices!.groups!.target[0], m.indices!.groups!.target[1], [], "review_msg_german_invalid_date")
  - id: de.isoDates
    checks: [germanDates]
    style: match
    message: review_msg_german_invalid_date
    frames:
      # An ISO date that no calendar has ("2025-02-30", "2023-02-29"). The year first makes the
      # form clear in each language. A fourth numeric part before or after ("1-2025-02-30",
      # "2025-02-30-7", "2025-02-30.1") makes it an ID, not a date. Arabic-Indic digits count too
      # ("٢٠٢٥-٠٢-٣٠"). Markdown emphasis around the date is not a word ("_2025-02-30_"); an
      # underscore glued to a word is ("build_2025-02-30_x"). The match start owns the match.
      - regex: "{{ISO_DATE}}"
        flags: gdu
        owner: none
        fixer: common:invalidIsoDate
  - id: de.dateDots
    checks: [germanDates]
    style: match
    message: review_msg_german_date_punctuation
    frames:
      # A day-month date without its closing dot ("am 13.12 um").
      - regex: "(?<=(?:^|[^\\p{L}])(?:am|vom|zum|bis|dem|den|seit){{S}})(?<target>(?<day>\\d{1,2})\\.(?<month>\\d{1,2}))(?=[ \\t\\u00a0]+[^\\d\\s.]|[ \\t\\u00a0]*[,)]|$)"
        flags: dgu
        when: "dateValid({ day: Number(day), month: Number(month) })"
        return: >-
          dateFinding(m.indices!.groups!.target[0], m.indices!.groups!.target[1], [`${target}.`], "review_msg_german_date_punctuation")
  - id: de.nounCasing
    checks: [germanNounCasing]
    style: match
    message: review_msg_german_idiom_case
    # "mit meinem gewissen vereinbaren": once an idiom makes the word before a noun, a verb form
    # after it stays a verb.
    filter:
      let:
        nounEnds: "new Set(findings.filter((f) => IDIOM_FINDINGS.has(f)).map((f) => f.range.end))"
      return: "findings.filter((f) => !NOUN_FINDINGS.has(f) || !nounEnds.has(blankStart(ctx.text, f.range.start)))"
    sets:
      # Determiners that are as often a whole noun phrase: "keiner macht", "alle liefen".
      NC_QUANTIFIERS: [
          alle, allen, aller, alles, viele, vielen, vieler, einige, einigen, einiger, mehrere, mehreren, beide,
          beiden, wenige, wenigen, andere, anderen, meisten, manche, mancher, manchen, manchem, manches, jede,
          jeder, jeden, jedem, jedes, einer, eines, keiner, keines, meiner, meines, deiner, deines, seiner, seines,
          ihrer, ihres, unserer, unseres, eurer, eures, ihr,
        ]
      NC_NUMBERS: [zwei, drei, vier, fünf, sechs, sieben, acht, neun, zehn, elf, zwölf, zwanzig, dreißig, hundert, tausend]
      # Lowercase words with an adjective ending that are not adjectives.
      NC_NOT_ADJECTIVES: [
          gerne, alleine, lange, heute, ohne, ferne, nahe, gestern, morgen, oben, unten, außen, innen, hinten,
          vorne, zusammen, trotzdem, seitdem, außerdem, ebenso, eben, wieder, immer, nimmer, sondern, aber,
          oder, weder, später, früher, näher, weiter, selten, offen, gegen, neben, unter, hinter, über, wider,
          bisschen, ihnen, denen, deren, dessen, wessen, habe, hatte, hätte, werde, wurde, würde, wäre, sei,
          könne, müsse, solle, wolle, dürfe, möge, wisse, gebe, hier, eher, gerade,
        ]
      # The finite verb after a sentence-initial noun phrase ("Der zugriff wurde …").
      NC_AUXILIARIES: [
          ist, sind, war, waren, wird, werden, wurde, wurden, hat, haben, hatte, hatten, kann, können, konnte,
          konnten, muss, müssen, musste, mussten, soll, sollen, sollte, sollten, will, wollen, wollte, wollten,
          darf, dürfen, durfte, durften, mag, möchte, möchten, würde, würden, wäre, wären, sei, seien, hätte,
          hätten, bleibt, blieb, gibt, gab,
        ]
      NC_COORDINATORS: [und, oder, sowie, bzw]
      # Genitive determiners after a noun ("der angriff des Gegners"); "der", "meiner" are also
      # datives ("Diese stellen meiner Frau Wein").
      NC_GENITIVES: [des, eines, meines, deines, seines, unseres, eures, dieses, jenes]
      NC_DEGREE_WORDS: [wirklich, sehr, ganz, ziemlich, besonders, äußerst, echt, total, so, recht]
      NC_CLAUSE_LINKS: [
          und, oder, aber, denn, doch, sondern, dass, weil, ob, wenn, als, obwohl, damit, bevor, nachdem,
          während, bis, falls, sobald, solange, da, wie, wo, was, wer, sodass,
        ]
      # Genitive or dative determiners after a noun ("die Grenzen meiner Sprache").
      NC_GENITIVE_LIKE: [
          von, vom, der, des, dieser, dieses, jener, jenes, meiner, meines, deiner, deines, seiner, seines, ihrer,
          ihres, unserer, unseres, eurer, eures, einer, eines,
        ]
      # Nouns that end a clause as the particle of a separable verb: "er steht kopf", "sie gibt
      # nichts preis", "das findet statt", "er hält stand".
      NC_VERB_PARTICLE_NOUNS: [kopf, preis, statt, stand, eis, haus, hof, maß, not, acht, kehrt, hohn]
      # Object pronouns before a demonstrative that is the article of an object ("mir die treue").
      NC_OBJECT_PRONOUNS: [mir, dir, ihm, ihr, uns, euch, ihnen, sich, sie, es, er, wir, ich, du, man]
      NC_HABEN: [habe, hast, hat, haben, habt, hatte, hattest, hatten, hattet, hätte, hätten]
      NC_SECOND_EXCEPTIONS: [halt, stand, statt, teil, preis, acht]
      # Lowercase words the dictionary lists only as nouns that are also adverbs ("wir sind zuhause").
      NC_BARE_EXCEPTIONS: [zuhause, topp]
      NC_VERB_PARTICLES: [los, ab, an, auf, aus, ein, mit, vor, weg, zu, zurück, hin, her, fest]
      # Frequent German function words that are no noun, adjective or verb form.
      NC_FUNCTION_WORDS: [
          nicht, auch, noch, schon, nur, viel, wenig, mehr, genug, etwas, nichts, kein, gern, gerne, bitte, immer,
          wieder, dann, jetzt, heute, hier, da, dort, ja, doch, mal, gerade, nie, oft, ihm, ihnen, ihn, uns, euch,
          selbst, bloß, eben, halt, wohl, kaum, fast, sogar, gar, ganz, endlich, bereits, meist, erst, zuerst,
        ]
      NC_MAIN_CLAUSE_LINKS: [und, oder, aber, denn, doch, sondern]
      NC_SUBORDINATORS: [dass, weil, wenn, ob, obwohl, damit, nachdem, bevor, falls, sobald, solange, sodass]
      NC_WH_WORDS: [
          wie, wo, was, wer, wen, wem, wann, warum, weshalb, wieso, weswegen, wohin, woher, womit, wodurch,
          worauf, woran, worüber, wofür,
        ]
      # Words in the noun-or-adjective list that are function words or particles here: "sein",
      # "ein", "unter", "weiß" (knows), "fern" (sieht fern), "klein" (sieht klein aus).
      NC_EITHER_EXCEPTIONS: [weiß, fern, fest, frei, klein, groß, dicht, nah, nahe, hoch, tief, weit]
      # Comparatives used as adverbs before a particle or adjective ("lieber fern").
      NC_ADVERB_COMPARATIVES: [lieber, eher, besser, mehr, weniger, länger, weiter, öfter]
      # Lowercase is standard or allowed: "am besten", "die meisten", "alles andere", "etwas
      # mehr", "ohne weiteres", "bei weitem".
      NOMINAL_LOWERCASE_OK: [
          anderen, andere, anderes, einen, einzige, einzigen, meisten, wenigsten, mindesten, ganzen, beiden,
          weiteres, mehr, weniger, viele, vieles, einiges, solches, folgendes, mögliche, dasselbe, denselben,
          demselben, letzten, nächsten, ersten, selben, selbigen, gleichen,
        ]
      # Words in -es that are determiners or pronouns, not adjectives.
      NOMINAL_NOT_NEUTER: [
          alles, etwas, nichts, dieses, jenes, welches, manches, solches, folgendes, vieles, weniges, anderes,
          einiges, beides, jedes, keines, meines, deines, seines, ihres, unseres, eures, eines, dasselbe,
        ]
      NOMINAL_DEGREE: [sehr, ganz, wirklich, total, allzu, besonders, ziemlich, richtig, echt, so, recht, selbst]
      # Words before a name or a title: "heißt Fröhlich", "und Ehrlich".
      NAME_CUES: [heißt, heiße, heißen, hieß, hießen, nennt, nannte, genannt, namens, titel, und, oder, sowie, bzw, von]
      CAPITAL_PARTICLES: [aus, vor, an, ab, zu]
      CAPITAL_SUBORDINATORS: [weil, dass, wenn, während, ob, als, obwohl, damit, bevor, nachdem, sobald, falls, da, seit, seitdem]
      # Names of two adjectives and a noun, each adjective capitalized.
      NAME_TRIPLES:
        [heilig römisch:reich, zweit deutsch:fernsehen, erst deutsch:fernsehen, national olympisch:komitee, international olympisch:komitee]
      # Adjective and noun pairs that are no names, so the adjective stays lowercase inside a
      # sentence: "grüner Tee", "künstliche Intelligenz", "mit freundlichen Grüßen".
      LOWER_PAIRS: [
          grün:Tee, schwarz:Tee, klein:Einmaleins, groß:Einmaleins, olympisch:Feuer, linear:Algebra,
          analytisch:Geometrie, englisch:Rasen, künstlich:Intelligenz, sozial:Netzwerk, sozial:Netzwerke,
          sozial:Medien, erneuerbar:Energien, erneuerbar:Energie, öffentlich:Dienst, mittler:Reife, rot:Faden,
          kalt:Buffet, höher:Gewalt, freundlich:Grüße, freundlich:Grüßen, herzlich:Grüße, herzlich:Grüßen,
          lieb:Grüße, lieb:Grüßen, best:Grüße, best:Grüßen, neu:Jahr, recht:Winkel, spitz:Winkel, stumpf:Winkel,
          offen:Tür, elektrisch:Feld, elektrisch:Feldstärke, elektrisch:Strom, magnetisch:Feld,
          mittler:Bildungsabschluss, mittler:Bildungsabschlüsse, gesund:Menschenverstand,
        ]
    maps:
      # Stems of irregular comparatives and superlatives: "beste", "besseres", "höchste", "nächste".
      NOMINAL_IRREGULAR: { be: gut, besser: gut, höch: hoch, näch: nah }
    defs:
      # Names of several words capitalize their adjective too: "der Erste Weltkrieg", "die
      # Französische Revolution", "im Nahen Osten". Each pair is "adjective stem:noun"; a leading
      # "!" marks a name the words never spell generically, the others need a definite article
      # before them ("ein rotes Kreuz" is any red cross, "das Rote Kreuz" the organization).
      NAME_PAIRS: >-
        ("!erst:Weltkrieg !zweit:Weltkrieg !französisch:Revolution !dreißigjährig:Krieg " +
        "!hundertjährig:Krieg !siebenjährig:Krieg !transsibirisch:Eisenbahn !westfälisch:Frieden " +
        "chinesisch:Mauer rot:Armee rot:Kreuz rot:Meer schwarz:Meer tot:Meer still:Ozean " +
        "indisch:Ozean atlantisch:Ozean kalt:Krieg heilig:Abend heilig:Schrift heilig:Geist " +
        "heilig:Land vereint:Nationen europäisch:Union europäisch:Zentralbank " +
        "europäisch:Kommission nah:Osten fern:Osten mittler:Osten sächsisch:Schweiz " +
        "fränkisch:Schweiz holsteinisch:Schweiz märkisch:Schweiz böhmisch:Schweiz schwäbisch:Alb " +
        "olympisch:Spiele römisch:Reich jüngst:Gericht " +
        "letzt:Abendmahl vereinigt:Staaten vereinigt:Königreich tschechisch:Republik " +
        "dominikanisch:Republik zentralafrikanisch:Republik kanarisch:Inseln britisch:Inseln " +
        "balearisch:Inseln ewig:Stadt dritt:Welt dritt:Reich golden:Zwanziger " +
        "international:Währungsfonds international:Strafgerichtshof bayerisch:Rundfunk " +
        "!trojanisch:Krieg !unbefleckt:Empfängnis !hängend:Gärten !hoh:Tatra !groß:Walachei " +
        "!klein:Walachei !statistisch:Bundesamt !gelb:Fluss bayerisch:Fernsehen deutsch:Bank " +
        "deutsch:Bund demokratisch:Republik demokratisch:Volksrepublik islamisch:Republik " +
        "türkisch:Republik heilig:Vater englisch:Garten schief:Turm gelb:Seiten").split(" ")
      NAME_ALWAYS: 'new Set(NAME_PAIRS.filter((p) => p.startsWith("!")).map((p) => p.slice(1)))'
      NAME_PAIR_SET: 'new Set(NAME_PAIRS.map((p) => p.replace("!", "")))'
      NAME_NOUN_SET: 'new Set(NAME_PAIRS.map((p) => p.split(":")[1]))'
      NAME_DEFINITE: '/(?<![\p{L}\p{N}])(?:der|die|das|des|dem|den|im|am|vom|zum|zur|beim|ins)[ \t]+$/iu'
      nameStem:
        args: "adj: string"
        return: adj.toLowerCase().replace(/(?:e|en|er|es|em)$/, "")
      # The noun without a case or plural ending: "Tees", "Feldes", "Winkeln".
      nameLemmas:
        args: "noun: string"
        return: '[noun, ...["s", "es", "n"].map((e) => noun.replace(new RegExp(`${e}$`), ""))]'
      # A capital for the lowercase word at `start` of a name.
      nameCapital:
        args: "ctx: DetectContext, start: number, context: { start: number; end: number }"
        type: RawFinding | null
        let:
          word: '/^\p{L}+/u.exec(ctx.text.slice(start))?.[0] ?? ""'
        when: '/^\p{Ll}/u.test(word) && !ctx.dictionary.has(word) && !namedExampleBefore(ctx.text, start)'
        return: >-
          ({ ruleId: "germanNounCasing", messageKey: "review_msg_german_name_case", range: { start, end: start + 1 },
          alternatives: [word[0].toUpperCase()], context })
      capitalStemVerb:
        args: "stem: string"
        return: stem.length >= 2 && (germanInfinitive(`${stem}en`) || germanInfinitive(`${stem}n`))
      # Whether a capitalized word is a finite verb form that agrees with the subject pronoun.
      # "Kam", "Gibt", "Bin": a listed or strong form, of a person the list does not tell.
      capitalVerbAgrees:
        args: "pronoun: string, low: string"
        let:
          third: '/t$/.test(low) && capitalStemVerb(low.replace(/e?t$/, ""))'
        return: >-
          /(?:en|ern|eln)$/.test(low) && germanInfinitive(low) ? pronoun === "wir" || pronoun === "sie"
          : !!germanInfinitiveOf(low) || germanPastInfinitives(low).length > 0 ? true
          : pronoun === "ich" ? /e$/.test(low) && germanVerbLike(low)
          : pronoun === "du" ? /st$/.test(low) && capitalStemVerb(low.replace(/e?st$/, ""))
          : pronoun === "wir" ? false : third
      NOMINAL_ENDING: /^(.+?)(?:sten|ste|sten|e|en|em|er|es)$/
      # Determiners that leave an adjective after them inflected for an elided noun ("ein neues").
      NOMINAL_DETERMINER: /^(?:k?ein|[dms]ein|ihr|unser|euer|das|dies|jen|jed|welch|manch|solch|all|viel|wenig|etwas|nichts)(?:e|en|er|es|em)?$/
      # Whether the word is an inflected adjective or superlative ("gröbste"); with `comparative`,
      # also a comparative or an irregular form ("schlimmeres", "besseres", "bestes").
      nominalAdjectiveForm:
        args: "typed: string, comparative: boolean"
        let:
          stem: NOMINAL_ENDING.exec(typed)?.[1]
        when: "!!stem"
        return: >-
          (comparative && !!NOMINAL_IRREGULAR[stem]) || (comparative ? [stem, stem.replace(/(?<=\p{L}{3})er$/u, "")] : [stem])
          .some((s) => [s, `${s}e`, deumlaut(s)].some((form) => germanAdjective(form)))
        else: "false"
      neuterAdjective:
        args: "w: string"
        return: /^\p{Ll}+(?:e|en|er|es|em)$/u.test(w) && nominalAdjectiveForm(w, false)
      # Past degree words and other adjectives ("ein wirklich schönes neues").
      neuterPriorAt:
        args: "before: string[], at: number"
        type: number
        return: >-
          at > 0 && (NOMINAL_DEGREE.has(before[at]) || before[at] === "," || nominalAdjectiveForm(before[at], false))
          ? neuterPriorAt(before, at - 1) : at
      # A frame of a nominalized adjective; the frame owns no group, so the match start decides.
      # The fixed phrases: capitalize the last word. "im folgenden korrigierten Artikel": an
      # attribute before its noun ("die im folgenden beschriebene Geschichte": an "-e" word
      # cannot follow "im" as its attribute). "Dieses Konzept ist das beste, was …": a noun
      # earlier in the sentence it may refer to. "grau in grau": an idiom of the colour twice.
      # The word must be an adjective form (the languages are listed as such).
      nominalizedFinding:
        args: "m: RegExpExecArray, ctx: DetectContext"
        type: RawFinding | null
        let:
          groups: m.indices!.groups ?? {}
          name: >-
            ["target", "sup", "es", "e", "lang", "ganzen", "poss", "abs", "what", "fixed", "fixed2", "rank"].find((k) => groups[k])
          span: 'name ? groups[name] : [m.index + m[0].search(/\p{L}+$/u), m.index + m[0].length]'
          start: span[0]
          end: span[1]
          typed: ctx.text.slice(start, end)
          fixed: name === "fixed" || name === "fixed2" || name === "rank"
          fixedAfter: 'fixed ? deTokensAfter(ctx.text, end, 1)[0] ?? "" : ""'
          after: deTokensAfter(ctx.text, end, 2)
          next: after[0] ?? ""
          second: after[1] ?? ""
          # "etwas Besonderes und dieses Jahr": after "etwas" only a second adjective before a noun
          # ("etwas neues und gutes Wissen") makes it an attribute.
          pairedAttribute: >-
            name === "es" && nominalAdjectiveForm(second, false) && !NOMINAL_NOT_NEUTER.has(second) &&
            /^\p{Lu}/u.test(deTokensAfter(ctx.text, end, 3)[2] ?? "")
          adjectiveNext: >-
            /^\p{Ll}+(?:e|en|er|es|em)$/u.test(next) && !germanVerbLike(next) && !PRONOMINAL_ADVERB.test(next) &&
            !/^(?:hinter|unter|über|wider|aber|oder|sondern|weder|immer|wieder|gegen|ohne)$/.test(next)
          nextNoun: "next.length > 2 ? germanNounReading(next) : null"
          before: deTokensBefore(ctx.text, m.index, 12)
        when:
          - "!(start < ctx.from || start >= ctx.to)"
          - '/^\p{Ll}/u.test(typed) && !ctx.dictionary.has(typed)'
          - '!(fixed && /^\p{Ll}+(?:en|er|es|em)$/u.test(fixedAfter) && !germanInfinitive(fixedAfter))'
          - '!(NOMINAL_LOWERCASE_OK.has(typed) && name !== "what" && !fixed)'
          - 'name !== "what" || !/[ \t]\p{Lu}/u.test(ctx.text.slice(Math.max(0, start - 120), start).split(/[.!?\n]/).at(-1)!)'
          - ctx.text.slice(Math.max(0, m.index - typed.length - 1), m.index).trim() !== typed
          - '!(name !== "lang" && name !== "poss" && name !== "what" && !!name && !fixed && !nominalAdjectiveForm(typed, false))'
          # Coordinated or parenthesized adjectives: "im privaten und beruflichen Bereich", "im
          # äußeren, modernen Sinn", "ins pfälzische (bayerische) Dorf", "nicht im klaren, sondern
          # im komplizierten Stil".
          - >-
            !(/^(?:und|oder|bzw|sowie|\()$/.test(next) && name !== "ganzen" && name !== "lang" &&
            (name !== "es" || next === "(" || pairedAttribute))
          - '!(next === "," && /^(?:sondern|\p{Ll}+(?:e|en|er|es|em))$/u.test(second))'
          - '!(adjectiveNext && name !== "es" && name !== "e" && !fixed)'
          # "als erstes und einziges", "als letztes der Gase", "mehr als letztes?"; "als erstes nach
          # dem Krieg gebautes Auto": the first of an extended attribute.
          - '!(!name && /^als/.test(m[0]) && !/^\p{Ll}+$/u.test(next))'
          - '!(!name && /^als/.test(m[0]) && /^(?:der|des|die|das)$/.test(next))'
          - '!(!name && /^als/.test(m[0]) && /^[^.!?,;:\n]{0,60}?\p{Ll}es[ \t]+\p{Lu}/u.test(ctx.text.slice(end, end + 80)))'
          # "über alles liebe": a verb.
          - '!(name === "e" && germanVerbLike(typed))'
          - '!(/^\p{Lu}/u.test(next) && !/^(?:Sie|Ihnen|Ihr|Ihre)$/.test(next))'
          - '!(/^\p{Ll}+(?:e|en|er|es|em)$/u.test(next) && germanAdjective(NOMINAL_ENDING.exec(next)?.[1] ?? ""))'
          # "fürs hartnäckige nachfragen": the adjective of a noun typed lowercase. Not where it is
          # the verb: "im allgemeinen stimme ich", "wird sich zum guten wenden".
          - >-
            !(nextNoun === "noun" || (nextNoun === "finite" && !PRONOUNS.has(second.toLowerCase())) ||
            (nextNoun === "infinitive" && name === "target" && !governedBefore(before, before.length)))
          - "!namedExampleBefore(ctx.text, start)"
        return: >-
          ({ ruleId: "germanNounCasing", messageKey: "review_msg_german_noun_case", range: { start, end: start + 1 },
          alternatives: [typed[0].toUpperCase()], context: { start: m.index, end } })
      NC_NOMINALIZING: '/(?<![\p{L}\p{N}])(?:beim|zum|vom|ins)[ \t]+$/iu'
      # "ein klopfen erfüllte den Raum", "kein zurückweichen.": an infinitive after a neuter
      # ein-word, before the clause's end, its verb or a preposition, is a noun; not before "zu",
      # where "ein" may be a particle. "einem" alone is the pronoun "one" ("der es einem leihen
      # würde"), so only after a preposition.
      NC_NEUTER_EIN: '/(?<![\p{L}\p{N}])(?:ein|kein|(?:mit|von|bei|aus|nach|zu|seit)[ \t]+k?einem)[ \t]+$/iu'
      # ", mit dem", ", die", ", wegen der": a relative clause after the noun.
      NC_RELATIVE: '/^(?:(?:\p{Ll}+ )?(?:der|die|das|dem|den|denen|dessen|deren|welche|welcher|welches|welchem|welchen))(?: |$)/u'
      # Fixed phrases with a lowercase word that is no noun there.
      NC_IDIOMS: '/^(?:kreuz und quer|sage und schreibe|gang und gäbe|zeit (?:seines|ihres|meines|deines))\b/iu'
      # Particles that open a separable verb: its finite form only ends a clause ("als er angriff").
      NC_PARTICLE: /^(?:an|auf|aus|ab|ein|mit|nach|vor|zu|zurück|weg|bei|los|fest|hin|her)(?=\p{Ll}{3})/u
