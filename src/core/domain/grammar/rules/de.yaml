      jene,
      jener,
      jenen,
      jenem,
      jenes,
      welche,
      welcher,
      welchen,
      welchem,
      welches,
      solche,
      solcher,
      solchen,
      solchem,
      solches,
    ]
  PREPOSITIONS:
    [
      in,
      an,
      auf,
      aus,
      bei,
      mit,
      nach,
      von,
      vor,
      zu,
      für,
      gegen,
      ohne,
      durch,
      um,
      über,
      unter,
      hinter,
      neben,
      zwischen,
      seit,
      wegen,
      trotz,
      während,
      statt,
      anstatt,
      per,
      pro,
      laut,
      gemäß,
      dank,
      samt,
