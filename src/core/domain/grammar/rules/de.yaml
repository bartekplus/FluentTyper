# de grammar rules. See docs/agents/grammar-rules.md for the format.
lang: de

rules:
  - id: de.compounds
    checks: [germanCompounds]
    predicate: compounds
  - id: de.dates
    checks: [germanDates]
    predicate: dates
  - id: de.nounCasing
    checks: [germanNounCasing]
    predicate: nounCasing
  - id: de.prepositionCase
    checks: [germanPrepositionCase]
    predicate: prepositionCase
  - id: de.confusions
    checks: [germanConfusedWords]
    predicate: confusions
  - id: de.adjectiveForms
    checks: [germanAdjectiveForms]
    predicate: adjectiveForms
  - id: de.articleGender
    checks: [germanArticleGender]
    predicate: articleGender
  - id: de.suspendedHyphen
    checks: [germanSuspendedHyphen]
    predicate: suspendedHyphen
  - id: de.abbreviations
    checks: [germanAbbreviations, germanAbbreviationSpacing]
    predicate: abbreviations
  - id: de.quotes
    checks: [germanQuotes]
    predicate: quotes
  - id: de.straightQuotes
    checks: [germanStraightQuotes]
    predicate: straightQuotes
  - id: de.commas
    checks: [germanCommas]
    predicate: commas
  - id: de.verbAgreement
    checks: [germanVerbAgreement]
    predicate: verbAgreement
  - id: de.questionMarks
    checks: [germanQuestionMarks]
    predicate: questionMarks
  - id: de.numbers
    checks: [germanNumbers]
    predicate: numbers
  - id: de.rangeDashes
    checks: [emdashShortcut]
    predicate: rangeDashes
  - id: de.typography
    checks: [germanTypography]
    predicate: typography
  - id: de.decadeCentury
    checks: [stylePhrasing]
    predicate: decadeCentury
  - id: de.colloquial
    checks: [germanColloquial]
    predicate: colloquial
  - id: de.recommended
    checks: [germanRecommendedSpelling]
    predicate: recommended
  - id: de.redundancy
    checks: [stylePhrasing]
    predicate: redundancy
  - id: de.anglicisms
    checks: [germanCompounds]
    predicate: anglicisms
  - id: de.joinedVerbs
    checks: [germanJoinedVerbs]
    predicate: joinedVerbs

