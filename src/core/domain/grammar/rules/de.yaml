      # Ansicht nach kein Konflikt", "ein Server internes Problem", "den ganzen Winter über ein
      # Einzelgänger", "Halte durch, mein Schatz!".
      articleCaseFix:
        args: >-
          ctx: DetectContext, m: RegExpExecArray, parsed: GermanDeterminer, typed: string, head: string, reading: GermanGenderReading,
          modsText: string, adjectives: string[], inflected: string[], typedReadings: [GermanCaseGender, GermanCase][]
        type: RawFinding | null
        let:
          before: deTokensBefore(ctx.text, m.index, 2)
          prior: (before.at(-1) ?? "").toLowerCase()
          nounEnd: m.indices!.groups!.noun[1]
          detStart: m.indices!.groups!.det[0]
          end: "adjectives.length ? m.indices!.groups!.mods[1] : m.indices!.groups!.det[1]"
          bareEin: >-
