          - solch || artIsAdjective(low)
          - head.length >= 3 && /^\p{Lu}/u.test(head)
          - "!ctx.dictionary.has(low) && !ctx.dictionary.has(head.toLowerCase())"
          - "!ART_GENDER_SIGN.test(ctx.text.slice(m.indices!.groups!.noun[1]))"
          - reading
