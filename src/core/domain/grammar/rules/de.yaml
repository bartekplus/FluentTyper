          wrongCase: >-
            parsed.kind === "ein" && parsed.ending === "" && reading.gender === "m" && !(parsed.stem === "kein" && prior === "ohne") &&
            !(prior === "über" && ART_TIME_SPANS.has(before.at(-2) ?? "")) &&
            !(parsed.stem === "mein" && /^[ \t]*[!,]/.test(ctx.text.slice(nounEnd, nounEnd + 4))) &&
            /^(?:für|um|gegen|ohne|durch|über|auf|in|an|unter|vor|hinter|neben|zwischen|mit|von|zu|bei|aus)$/.test(prior) &&
            !/(?<!\p{L})was(?!\p{L})/iu.test(ctx.text.slice(Math.max(0, m.index - 30), m.index)) &&
            !/(?<!\p{L})(?:sein|werden|bleiben|nach)(?!\p{L})/u.test(restOfClause) &&
            !/^[ \t]+\p{Ll}+(?:e|es|en|er|em)[ \t]+\p{Lu}/u.test(restOfClause) &&
            !/(?<!\p{L})(?:nach|und)[ \t]+$/u.test(ctx.text.slice(Math.max(0, m.index - 12), m.index - prior.length - 1))
        return: >-
          bareEin && inflected.every((a) => artEndingOf(a) === "er")
          ? { ruleId: "germanArticleGender", messageKey: "review_msg_german_adjective_ending",
          range: { start: m.indices!.groups!.mods[0] + modsText.length - modsText.trimStart().length, end },
          alternatives: [adjectives.map((a) => ART_DEGREE_WORD.test(a) ? a : a.replace(/(?:e|en|er|es|em)$/, "es")).join(" ")],
          context: { start: m.index, end: nounEnd } }
          : !wrongCase && typedReadings.some(([g, c]) => germanCaseFits(head, reading, g, c))
          ? articleObjectFix(ctx, m, parsed, typed, head, reading, adjectives, nounEnd, detStart, end)
