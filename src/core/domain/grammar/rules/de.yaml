          ({ ruleId: "germanCommas", messageKey: "review_msg_german_comma", range: { start: wordStart, end: wordStart + word.length },
          alternatives: [`${word},`], context: { start: Math.max(0, wordStart - 40), end: Math.min(ctx.text.length, at + 40) } })
      # A finite verb form: listed, or a regular third person ("lernt") of a known verb; not a
      # participle ("übereilt", "garantiert").
      commaFiniteWord:
        args: "t: string"
        return: >-
          COMMA_FINITE.has(t) || germanAuxiliary(t) || (/^\p{Ll}{3,}t$/u.test(t) &&
          !/^(?:ge|be|ver|er|ent|zer|miss|über|unter|hinter|wider)|iert$/u.test(t) && germanInfinitive(`${t.replace(/e?t$/, "")}en`))
      commaClauseFrom:
        args: "tokens: string[], from: number"
        type: number
        return: "from > 0 && !commaClauseEnd(tokens[from - 1]) ? commaClauseFrom(tokens, from - 1) : from"
      # The tokens after the last clause end among `tokens`.
      commaLastClause:
        args: "tokens: string[]"
        return: tokens.slice(commaClauseFrom(tokens, tokens.length))
      # The tokens of the clause after `index`, up to its end (at most `n`).
      commaClauseAfter:
        args: "text: string, index: number, n: number"
        let:
          tokens: deTokensAfter(text, index, n)
          end: tokens.findIndex((t) => commaClauseEnd(t))
        return: "end < 0 ? tokens : tokens.slice(0, end)"
      # Whether the clause after `index` ends in a lowercase word, as a subordinate clause ends in
      # its verb ("weil es regnet"); "ob deiner Antwort" ends in a noun. Unknown past 24 tokens.
      commaVerbFinal:
        args: "text: string, index: number"
        let:
          tokens: deTokensAfter(text, index, 24)
          end: tokens.findIndex((t) => commaClauseEnd(t))
        return: 'end < 0 || (end > 0 && /^\p{Ll}/u.test(tokens[end - 1]))'
      # Whether the clause before `index` starts right at `at` tokens back: a sentence start.
      commaClauseStartBefore:
        args: "before: string[], at: number"
        return: at === 0 || commaClauseEnd(before[at - 1]) || /^(?:und|aber|doch|denn)$/i.test(before[at - 1])
      # A zu-infinitive in the clause: "zu lesen", "anzurufen". The index of the infinitive, or -1.
      commaZuInfinitive:
        args: "clause: string[]"
        let:
          k: >-
            clause.findIndex((t, i) => (t === "zu" && i + 1 < clause.length && /^\p{Ll}+$/u.test(clause[i + 1]) &&
            (germanInfinitive(clause[i + 1]) || COMMA_IRREGULAR.has(clause[i + 1]))) ||
            (/^\p{Ll}{2,}zu\p{Ll}+(?:en|ln|rn)$/u.test(t) && germanInfinitive(t.replace("zu", ""))))
        return: 'k >= 0 && clause[k] === "zu" ? k + 1 : k'
      # The tokens after `index` up to the clause end, when they form an infinitive group of at
      # least one word before its zu-infinitive, which ends the clause: "ihn so zu sehen". A verb
      # form inside would close another clause ("darauf gewartet ihn zu sehen", "schwer sein das
      # zu erklären"); so would another clause or group ("darum und …", "daran dass …"). "Es gibt
      # daran nichts zu tun": the object of the infinitive.
      commaInfinitiveGroup:
        args: "text: string, index: number"
        type: string[] | null
        let:
          clause: commaClauseAfter(text, index, 12)
          verb: commaZuInfinitive(clause)
          words: 'clause.slice(0, clause[verb - 1] === "zu" ? verb - 1 : verb)'
        when:
          - "!(verb < 0 || verb !== clause.length - 1)"
          - '!(words.length === 0 || words.some((w) => !/^\p{L}+$/u.test(w)))'
          - >-
            !words.some((w) => (w === w.toLowerCase() && (commaFiniteWord(w) || /^ge\p{Ll}{3,}(?:t|en)$/u.test(w) ||
            VERB_GOVERNORS.has(w) || COMMA_IRREGULAR.has(w))) ||
            /^(?:und|oder|aber|sondern|denn|doch|dass|weil|wenn|ob|ohne|um|statt|anstatt)$/.test(w))
        return: "/^(?:nichts|etwas|viel|vieles|wenig|einiges|genug|mehr|was)$/.test(words[0]) ? null : words"
      # Whether a particle and a verb of the clause make one verb ("kommt … an": ankommen).
      commaParticleJoins:
        args: "word: string, t: string"
        let:
          low: t.toLowerCase()
          stem: low.replace(/(?:e?test|e?tet|e?ten|e?te|e?st|e?t|en|e)$/, "")
        return: "[germanInfinitiveOf(low), `${stem}en`, `${stem}n`].some((inf) => !!inf && germanInfinitive(word + inf))"
      # "Es geht darum euch …", "Es kommt darauf an ihn …": the word the comma follows. "kurz
      # darauf", "noch dazu": an adverb of time or addition. "kommt darauf an", "denken darüber
      # nach": a particle of the clause's verb; "nicht daran gedacht": the participle that closes
      # the clause.
      commaCorrelate:
        args: "ctx: DetectContext, typed: string, at: number, before: string[]"
        type: "{ word: string; start: number } | null"
        let:
          end: at + typed.length
          sentence: commaLastClause(before)
          next: '/^[ \t]+(\p{Ll}+)(?=[ \t])/u.exec(ctx.text.slice(end, end + 24))'
          word: next?.[1] ?? ""
          particle: COMMA_CORRELATE_PARTICLES.has(word) && sentence.some((t) => commaParticleJoins(word, t))
          participle: '/^ge\p{Ll}{3,}(?:t|en)$/u.test(word) && !germanAuxiliary(word)'
          last: "next && (particle || participle) ? { word, start: end + next[0].length - word.length } : { word: typed, start: at }"
        when:
          - "!(sentence.length === 0 || sentence.some((t) => COMMA_OWN_INFINITIVE.test(t.toLowerCase())))"
          - '!/^(?:kurz|gleich|bald|noch|bis|und|oder|aber)$/i.test(before.at(-1) ?? "")'
        return: "commaInfinitiveGroup(ctx.text, last.start + last.word.length) ? last : null"
      commaEsSkip:
        args: "tokens: string[], i: number"
        type: number
        return: 'i < tokens.length && (COMMA_ES_FILLERS.has(tokens[i]) || /^\p{Lu}\p{Ll}+$/u.test(tokens[i])) ? (i > 3 ? -1 : commaEsSkip(tokens, i + 1)) : i'
      # "Er ist es gewohnt hart …", "Es macht mich traurig ihn …": the word the comma follows, for
      # an "es" at `at` that stands for the infinitive group. "Es macht …" opens the clause; "…
      # ist es …" follows the verb. Only a dative noun or two ("Frauen") between, never a whole
      # phrase. "Es ist gut möglich zu …": a degree word, not a group.
      commaEsAdjective:
        args: "ctx: DetectContext, at: number, back: string[], prior: string"
        type: "{ word: string; start: number } | null"
        let:
          tokens0: deTokensAfter(ctx.text, at + 2, 9)
          linked: COMMA_ES_LINKS.has(prior)
          verb: tokens0[0] ?? ""
          from: "linked ? at + 2 : ctx.text.indexOf(tokens0[0], at + 2) + tokens0[0].length"
          tokens: "linked ? tokens0 : tokens0.slice(1)"
          i: commaEsSkip(tokens, 0)
          word: tokens[i]
          participle: '/^(?:ge\p{Ll}{3,}t|\p{Ll}{3,}iert)$/u.test(word)'
          start: ctx.text.indexOf(word, from)
          group: commaInfinitiveGroup(ctx.text, start + word.length)
        when:
          - linked || (commaClauseEnd(back.at(-1)) && COMMA_ES_LINKS.has(verb) && !COMMA_CLAUSE_COPULAS.has(verb))
          - i >= 0
          - '!(!word || !/^\p{Ll}+$/u.test(word) || COMMA_ES_DEGREE.has(word) || COMMA_DETERMINER.test(word))'
          - germanAdjective(word) || participle
        return: "group && !(group.length === 1 && COMMA_ES_DEGREE.has(group[0])) ? { word, start } : null"
      commaEs:
        args: "ctx: DetectContext, at: number"
        type: "{ word: string; start: number } | null"
        let:
          back: deTokensBefore(ctx.text, at, 2)
          prior: (back.at(-1) ?? "").toLowerCase()
        return: >-
          COMMA_ES_OBJECT_VERBS.has(prior) ? (commaInfinitiveGroup(ctx.text, at + 2) ? { word: ctx.text.slice(at, at + 2), start: at } : null)
          : commaEsAdjective(ctx, at, back, prior)
      # The noun's determiner, past its adjectives: "der erste Schritt", "das neue Bild".
      commaDeterminerAt:
        args: "before: string[], k: number"
        type: number
        return: 'k > 0 && /^\p{Ll}+e[mnrs]?$/u.test(before[k]) && !COMMA_NOUN_DETERMINER.test(before[k]) ? commaDeterminerAt(before, k - 1) : k'
      # A finite verb of a relative clause. "die im Park spielen", "das wir lesen": a plural verb
      # after a plural subject. "die ich kenne", "den du suchst": the first or second person.
      # "bellt", "zählt", "fehlschlägt", "malte": a regular or umlauted third person or past.
      commaRelativeFinite:
        args: "w: string, i: number, tokens: string[], plural: boolean"
        let:
          stem: '/^(\p{Ll}{2,}?)(?:e?t|e?te)$/u.exec(w)?.[1]'
        return: >-
          w !== w.toLowerCase() ? false
          : COMMA_FINITE.has(w) || germanAuxiliary(w) || VERB_GOVERNORS.has(w) || !!germanInfinitiveOf(w) ? true
          : (plural || tokens.slice(0, i).some((t) => /^(?:wir|sie|Sie)$/.test(t))) && germanInfinitive(w) ? true
          : /^\p{Ll}{3,}(?:e|e?st)$/u.test(w) && tokens.slice(0, i).some((t) => /^(?:ich|du)$/.test(t))
          ? germanVerbLike(w.replace(/e?st$/, "en")) || germanVerbLike(w)
          : !stem || /^ge\p{Ll}+t$/u.test(w) ? false
          : [stem, stem.replace(/ä/g, "a").replace(/ö/g, "o").replace(/ü/g, "u")].some((s) => germanInfinitive(`${s}en`))
      # "der das bezahlt hat", "die man sehen kann", "das er gemacht haben muss": a participle or
      # infinitive before the finite verb that closes the clause.
      commaVerbChain:
        args: "tokens: string[], verb: number"
        type: number
        let:
          current: tokens[verb]
          next: tokens[verb + 1] ?? ""
          perfect: 'COMMA_PERFECT_AUX.test(next) && /^(?:ge|be|ver|er|ent|zer|über|unter)\p{Ll}{2,}(?:t|en)$|^\p{Ll}{3,}iert$/u.test(current)'
          modal: COMMA_MODAL_AUX.test(next) && /(?:en|ern|eln)$/.test(current)
        return: "perfect || modal ? commaVerbChain(tokens, verb + 1) : verb"
      # "Ist der Test der im Firefox fehlschlägt problematisch?": a relative clause after its
      # noun, set off before its pronoun and, when the sentence goes on, after its last verb. The
      # pronoun must fit the noun's gender ("die Kinder die …" is a plural, "die Frau die …" a
      # feminine) and open the clause with a word no article goes before ("die sehr schöne Frau"
      # is an adverb before an adjective), and the clause must end in a finite verb. "der mir
      # bisher unbekannten Autorin": an article before an extended attribute and its noun. "der
      # zählt ist …": a verb right after the pronoun may also be a main clause's.
      commaRelative:
        args: "ctx: DetectContext, typed: string, at: number"
        type: RawFinding[]
        let:
          fits: COMMA_RELATIVES[typed]
          before: deTokensBefore(ctx.text, at, 5)
          noun: before.at(-1) ?? ""
          k: commaDeterminerAt(before, before.length - 2)
          nounStart: at - noun.length - 1
          reading: germanGender(noun)
          genders: 'reading.plural ? [reading.gender, "p"] : [reading.gender]'
          agrees: 'genders.some((g) => fits.includes(g) || (g === "x" && (fits.includes("m") || fits.includes("n"))))'
          tokens: deTokensAfter(ctx.text, at + typed.length, 10)
          opener: tokens[0] ?? ""
          plural: fits.includes("p") && genders.includes("p")
          stopAt: "tokens.findIndex((t) => commaClauseEnd(t) || /^(?:und|oder|aber|dass|weil|wenn|ob)$/.test(t))"
          first: "tokens.slice(0, stopAt < 0 ? tokens.length : stopAt).findIndex((w, i) => commaRelativeFinite(w, i, tokens, plural))"
          verb: "first < 0 ? -1 : commaVerbChain(tokens, first)"
          after: tokens[verb + 1]
          verbStart: ctx.text.indexOf(tokens[verb], at + typed.length)
        when:
          - '/^\p{Lu}\p{Ll}{2,}$/u.test(noun) && COMMA_NOUN_DETERMINER.test(before[k] ?? "")'
          - "ctx.text.slice(nounStart, at) === `${noun} `"
          - reading
          - agrees
          - COMMA_RELATIVE_OPENERS.has(opener) || (opener === opener.toLowerCase() && commaFiniteWord(opener))
          - '!(/^\p{Ll}+e[mnrs]?$/u.test(tokens[1] ?? "") && germanAdjective(tokens[1].replace(/e[mnrs]?$/, "")))'
          - verb >= 0
          - >-
            !tokens.slice(0, verb).some((t, i) => /^\p{Ll}{2,}e[mnrs]?$/u.test(t) && !COMMA_NOUN_DETERMINER.test(t) && /^\p{Lu}/u.test(tokens[i + 1] ?? ""))
        return: >-
          [commaFinding(ctx, nounStart, noun, at), ...(after && !commaClauseEnd(after) && verb > 0 && /^\p{L}/u.test(after)
          ? [commaFinding(ctx, verbStart, tokens[verb], verbStart)] : [])]
        else: "[]"
      commaSubordinatorBack:
        args: "before: string[], i: number"
        type: number
        return: "i >= 0 && !COMMA_SUBORDINATORS.has(before[i].toLowerCase()) ? commaSubordinatorBack(before, i - 1) : i"
      commaSentenceOpens:
        args: "before: string[], k: number"
        return: 'k < 0 || (/^[.!?\n]$/.test(before[k]) && (k === 0 || (before[k - 1] ?? "").length > 1))'
      commaSkipFillers:
        args: "clause: string[], i: number"
        type: number
        return: "i < clause.length && COMMA_FILLERS.has(clause[i]) ? commaSkipFillers(clause, i + 1) : i"
      # The last of the first n tokens of the clause, found one after the other from `word`.
      commaTaken:
        args: "ctx: DetectContext, clause: string[], j: number, n: number, word: string, start: number"
        type: "{ word: string; start: number }"
        return: >-
          j >= n ? { word, start } : commaTaken(ctx, clause, j + 1, n, clause[j], ctx.text.indexOf(clause[j], start + word.length))
      commaSkipAskFillers:
        args: "chain: string[], k: number"
        type: number
        return: "k >= 0 && COMMA_ASK_FILLERS.has(chain[k].toLowerCase()) ? commaSkipAskFillers(chain, k - 1) : k"
      # The branches of the comma check: each gives its commas, or null when it does not apply.
      # "Es geht darum euch …", "Es ist wichtig gesund zu essen": an infinitive group that a
      # correlate or "es" announces.
      commaCorrelateBranch:
        args: "ctx: DetectContext, typed: string, low: string, at: number, before: string[]"
        type: RawFinding[] | null
        let:
          last: commaCorrelate(ctx, typed, at, before)
        when: typed === low && COMMA_CORRELATES.has(low)
        return: "last ? [commaFinding(ctx, last.start, last.word, last.start)] : []"
      commaEsBranch:
        args: "ctx: DetectContext, low: string, at: number"
        type: RawFinding[] | null
        let:
          last: commaEs(ctx, at)
        when: low === "es"
        return: "last ? [commaFinding(ctx, last.start, last.word, last.start)] : []"
      commaRelativeBranch:
        args: "ctx: DetectContext, typed: string, low: string, at: number"
        type: RawFinding[] | null
        when: typed === low && Object.hasOwn(COMMA_RELATIVES, low)
        return: commaRelative(ctx, typed, at)
      # A conjunction inside a sentence: "Er bleibt weil es regnet". "sondern" joins any phrase:
      # "kein Zufall, sondern Absicht". "sobald wie möglich" is "so bald", an adverb. "Insekten
      # sondern Duftstoffe ab": the verb "absondern".
      commaSubordinateBranch:
        args: "ctx: DetectContext, typed: string, low: string, at: number, end: number, prior: { word: string; start: number } | null"
        type: RawFinding[] | null
        let:
          clause: commaClauseAfter(ctx.text, end, 12)
        when: >-
          typed === low && COMMA_SUBORDINATORS.has(low) && !!prior &&
          !(COMMA_JOINED.has(prior.word.toLowerCase()) && !(prior.word === "nicht" && (low === "ob" || low === "dass")))
        return: >-
          clause.length >= (low === "sondern" ? 1 : 2) && (low === "sondern" || commaVerbFinal(ctx.text, end)) && !COMMA_TIME_SPANS.test(prior.word) &&
          !(low === "sobald" && /^[ \t]+(?:wie|als)[ \t]+möglich/.test(ctx.text.slice(end, end + 20))) &&
          !(/^(?:wenn|falls|sofern)$/.test(low) && COMMA_ELLIPTICAL.has(clause[0])) && !(low === "sondern" && clause.at(-1) === "ab") &&
          !(low === "nachdem" && prior.word.toLowerCase() === "je") ? [commaFinding(ctx, prior.start, prior.word, at)] : []
      # "Sie ging um zu lesen": an infinitive group inside the sentence. "ohne Schlüssel zu
      # öffnen", "um 8 Uhr an zu fangen": a preposition before a noun or a time; "es geht um das
      # Recht zu leben", "sich um etwas zu kümmern": "um" the verb's. "gehen" and "handeln" take
      # "um" only with "es" ("es geht um", "es handelt sich um").
      commaInfinitiveBranch:
        args: "ctx: DetectContext, typed: string, low: string, at: number, end: number, prior: { word: string; start: number } | null, before: string[]"
        type: RawFinding[] | null
        let:
          clause: commaClauseAfter(ctx.text, end, 12)
          verb: commaZuInfinitive(clause)
          impersonal: before.some((t) => /^es$/i.test(t))
        when: typed === low && COMMA_INFINITIVE_LEADS.has(low) && !!prior
        return: >-
          COMMA_JOINED.has(prior.word.toLowerCase()) || verb < 0 || /^(?:\p{Lu}|\p{N}|halb$|viertel$)/u.test(clause[0]) ||
          clause.slice(0, 3).includes("Uhr") || (low === "um" && [...before, clause[verb]].some((t) =>
          COMMA_UM_VERBS.has(t.toLowerCase()) && (impersonal || !COMMA_IMPERSONAL_UM.has(t.toLowerCase()))))
          ? [] : [commaFinding(ctx, prior.start, prior.word, at)]
      # "Um zu lesen ging sie": an infinitive group that opens the sentence.
      commaOpeningInfinitiveBranch:
        args: "ctx: DetectContext, typed: string, low: string, end: number, before: string[]"
        type: RawFinding[] | null
        let:
          clause: commaClauseAfter(ctx.text, end, 12)
          verb: commaZuInfinitive(clause)
          next: clause[verb + 1]
        when: COMMA_INFINITIVE_LEADS.has(low) && typed !== low && commaClauseStartBefore(before, before.length)
        return: >-
          verb >= 0 && next && /^\p{Ll}+$/u.test(next) && !COMMA_JOINED.has(next)
          ? [commaFinding(ctx, ctx.text.indexOf(clause[verb], end), clause[verb], ctx.text.indexOf(clause[verb], end))] : []
      # "Als ich es gesagt hatte bin ich gegangen": a clause's last verb right before the next
      # clause's verb; not a verb chain ("gesehen werden kann"). "Nachdem er besiegt wurden war": a
      # plural auxiliary after the clause's singular pronoun is a slip for a participle
      # ("worden"), not the clause's last verb.
      commaAuxBranch:
        args: "ctx: DetectContext, typed: string, low: string, at: number, end: number, before: string[]"
        type: RawFinding[] | null
        let:
          next: '/^[ \t]+(\p{Ll}+)(?!\p{L})/u.exec(ctx.text.slice(end, end + 24))?.[1]'
          chain: germanInfinitiveOf(low) === low || germanInfinitiveOf(next ?? "") === next
          lead: commaSubordinatorBack(before, before.length - 1)
          slip: 'low.endsWith("en") && lead >= 0 && COMMA_SINGULAR_SUBJECTS.has((before[lead + 1] ?? "").toLowerCase())'
        when:
          - typed === low && germanAuxiliary(low)
          - "!!next && next !== low && germanAuxiliary(next) && !chain && !slip"
        return: "[commaFinding(ctx, at, typed, end)]"
      # "Sag mal hast du Zeit?": the request before the question.
      commaSagBranch:
        args: "ctx: DetectContext, typed: string, end: number"
        type: RawFinding[] | null
        let:
          verb: '/^[ \t]+mal[ \t]+(\p{Ll}+)/u.exec(ctx.text.slice(end, end + 24))?.[1]'
        when: /^[Ss]agt?$/.test(typed) && !!verb
        return: 'germanAuxiliary(verb) ? [commaFinding(ctx, ctx.text.indexOf("mal", end), "mal", ctx.text.indexOf("mal", end))] : []'
      # "Er kommt auch wenn es regnet": the comma goes before the pair.
      commaPairBranch:
        args: "ctx: DetectContext, typed: string, low: string, at: number, end: number, prior: { word: string; start: number } | null"
        type: RawFinding[] | null
        let:
          after: '/^[ \t]+(\p{Ll}+)/u.exec(ctx.text.slice(end, end + 16))?.[1] ?? ""'
        when:
          - typed === low && Object.hasOwn(COMMA_PAIRS, low) && !!prior && !COMMA_JOINED.has(prior.word.toLowerCase())
          - COMMA_PAIRS[low].includes(after) && commaVerbFinal(ctx.text, end + 1 + after.length)
        return: "[commaFinding(ctx, prior.start, prior.word, at)]"
      # "Ich glaube das stimmt", "Meinst du das klappt?", "Peter behauptet seine Mutter …": a main
      # clause after an opinion verb. "Peter behauptet …", "Die Menschen glauben …" at a sentence
      # start; not "Für meinen Bruder", "Wenn behauptet wird", "Was glauben Sie", "John F.
      # Kennedy wissen".
      commaOpinionBranch:
        args: "ctx: DetectContext, typed: string, low: string, at: number, end: number, before: string[]"
        type: RawFinding[] | null
        let:
          last: before.length - 1
          subjectWord: before[last] ?? ""
          subjectLow: subjectWord.toLowerCase()
          pronounSubject: COMMA_SUBJECTS.has(subjectLow) && commaClauseStartBefore(before, last)
          nounSubject: >-
            /^\p{Lu}\p{Ll}+$/u.test(subjectWord) && !COMMA_SUBJECTS.has(subjectLow) && !COMMA_NOT_SUBJECTS.has(subjectLow) &&
            !ARTICLES.has(subjectLow) && !DEMONSTRATIVES.has(subjectLow) && !PREPOSITIONS.has(subjectLow) &&
            (commaSentenceOpens(before, last - 1) || (/^(?:der|die|das)$/i.test(before[last - 1] ?? "") && commaSentenceOpens(before, last - 2)))
          subjectFirst: typed === low && COMMA_OPINIONS.has(low) && (pronounSubject || nounSubject)
          asked: COMMA_OPINION_QUESTIONS.has(low) && commaClauseStartBefore(before, before.length)
        when: subjectFirst || asked
        return: commaOpinionComma(ctx, typed, at, end, subjectFirst)
      # The word the comma follows: the verb, its subject in a question, then fillers ("Ich denke
      # mal, …"). The clause's own finite verb within four words, something before it. "Ich finde
      # es seltsam, wie er redet": the verb closes a clause of its own. "Ich glaube an Gott", "ich
      # finde nicht, …": no clause of its own begins here; "Man hofft und träumt": a second verb.
      commaOpinionComma:
        args: "ctx: DetectContext, typed: string, at: number, end: number, subjectFirst: boolean"
        type: RawFinding[]
        let:
          clause: commaClauseAfter(ctx.text, end, 9)
          i: "commaSkipFillers(clause, subjectFirst ? 0 : 1)"
          rest: clause.slice(i)
          verbAt: rest.findIndex((t, k) => k > 0 && k <= 4 && commaFiniteWord(t))
          last: commaTaken(ctx, clause, 0, i, typed, at)
        when:
          - 'subjectFirst || COMMA_QUESTION_SUBJECTS.has(clause[0] ?? "")'
          - verbAt >= 1
          - "!rest.slice(0, verbAt).some((t) => COMMA_W_WORDS.has(t) || COMMA_SUBORDINATORS.has(t))"
          - "!/^(?:an|auf|daran|darauf|nicht|nichts|kein|keine|so|auch|zu|sehr|und|oder|aber|sowie|sondern|bzw)$/i.test(rest[0])"
        return: "[commaFinding(ctx, last.start, last.word, last.start)]"
        else: "[]"
      # "Stell dir vor du gewinnst": the clause the imagining introduces.
      commaVorBranch:
        args: "ctx: DetectContext, typed: string, at: number, end: number"
        type: RawFinding[] | null
        when: >-
          typed === "vor" && /^[ \t]+(?:ich|du|er|sie|es|wir|ihr|man|der|die|das|ein|eine|\p{Lu}\p{Ll}+)[ \t]+\p{Ll}/u.test(ctx.text.slice(end, end + 30))
        return: >-
          /(?:^|[.!?:\n„"])[ \t]*(?:Stell|Stelle|Stellt|Stellen)[ \t]+(?:dir|euch|Sie[ \t]+sich|sich|mir)(?:[ \t]+(?:doch|mal|nur|einfach|bitte|jetzt|einmal))*[ \t]+$/u.test(ctx.text.slice(Math.max(0, at - 50), at))
          ? [commaFinding(ctx, at, typed, at)] : []
      # "Daher dachte ich mir ich frage …": an inverted opinion verb and its subject before a
      # second clause with its own subject.
      commaInvertedBranch:
        args: "ctx: DetectContext, typed: string, low: string, end: number, before: string[]"
        type: RawFinding[] | null
        let:
          next: deTokensAfter(ctx.text, end, 4)
          reflexive: '/^(?:mir|dir|sich|uns|euch)$/.test(next[1] ?? "") ? 1 : 0'
          second: next[1 + reflexive] ?? ""
          word: next[reflexive]
        when: typed === low && COMMA_OPINION_VERBS.test(low) && !commaClauseStartBefore(before, before.length)
        return: >-
          /^(?:ich|du|er|sie|wir|ihr|man)$/.test(next[0] ?? "") && /^(?:ich|du|er|sie|es|wir|ihr|man)$/.test(second) &&
          (commaFiniteWord(next[2 + reflexive] ?? "") || germanVerbLike(next[2 + reflexive] ?? ""))
          ? [commaFinding(ctx, ctx.text.indexOf(` ${word}`, reflexive ? ctx.text.indexOf(next[0], end) + next[0].length : end) + 1, word,
          ctx.text.indexOf(` ${word}`, reflexive ? ctx.text.indexOf(next[0], end) + next[0].length : end) + 1)] : []
      # "Das ist soweit ich weiß erledigt": a short inserted clause takes a comma on both sides.
      # "wofür Sie soweit ich weiß keine Lizenz haben": inside a subordinate clause the formula
      # may stand without commas.
      commaSoweitBranch:
        args: "ctx: DetectContext, typed: string, low: string, at: number, end: number, prior: { word: string; start: number } | null, before: string[]"
        type: RawFinding[] | null
        let:
          inserted: >-
            /^[ \t]+(?:ich|wir|man)(?:[ \t]+(?:das|es))?[ \t]+(?:weiß|wissen|sehe|sehen|beurteilen[ \t]+kann|beurteilen[ \t]+können|verstehe|verstanden[ \t]+habe|informiert[ \t]+bin)(?=[ \t]+\p{L})/u.exec(ctx.text.slice(end, end + 50))
          nested: commaLastClause(before).some((t) => COMMA_W_WORDS.has(t.toLowerCase()) || COMMA_SUBORDINATORS.has(t))
        when: typed === low && /^(?:soweit|sofern)$/.test(low) && !!prior && !COMMA_JOINED.has(prior.word.toLowerCase())
        return: >-
          inserted && !nested ? [commaFinding(ctx, prior.start, prior.word, at),
          commaFinding(ctx, end + inserted[0].length - /\p{L}+$/u.exec(inserted[0])![0].length, /\p{L}+$/u.exec(inserted[0])![0], end + inserted[0].length)] : []
      # "Er fragt wie das geht": an indirect question. "Sie wissen nicht an was sie glauben": a
      # preposition opens the question. "Weiß die Abteilung warum …": a question opens with the
      # asking verb and its subject. "Es ist richtig wie du das machst", "Mir ist klar woran es
      # liegt": a predicative adjective before the clause; "so groß wie", "genauso schnell wie"
      # compare. "weiß schon, warum": a filler after the verb; "so wie" compares.
      commaQuestionBranch:
        args: "ctx: DetectContext, typed: string, low: string, at: number, end: number, prior: { word: string; start: number } | null, before: string[]"
        type: RawFinding[] | null
        let:
          prep: COMMA_QUESTION_PREPOSITIONS.has(prior.word) && /^(?:was|wem|wen)$/.test(low)
          lead: "prep ? deWordBefore(ctx.text, prior.start) : prior"
          chain: "prep ? before.slice(0, -1) : before"
          k0: commaSkipAskFillers(chain, chain.length - 1)
          subject: >-
            [k0 - 1, k0 - 2, k0 - 3].find((i) => i >= 0 && COMMA_ASKING.has(chain[i].toLowerCase()) && /^\p{Lu}/u.test(chain[i]) &&
            commaClauseEnd(chain[i - 1]) && chain.slice(i + 1, k0 + 1).every((t) => /^\p{Lu}/u.test(t) ||
            /^(?:der|die|das|ein|eine|(?:mein|dein|sein|ihr|unser|eur)e?|euer)$/.test(t)))
          k: subject ?? k0
          predicate: >-
            k > 0 && /^\p{Ll}+$/u.test(chain[k]) && germanAdjective(chain[k]) && chain.slice(0, k).some((t) => COMMA_PREDICATE_VERBS.has(t.toLowerCase())) &&
            !chain.slice(Math.max(0, k - 2), k).some((t) => COMMA_COMPARING.has(t.toLowerCase()))
          lw: lead.word.toLowerCase()
          clause: commaClauseAfter(ctx.text, end, 12)
          last: clause.at(-1) ?? ""
        when:
          - typed === low && COMMA_W_WORDS.has(low) && !!prior
          - lead
          - "!(k < 0 || (!COMMA_ASKING.has(chain[k].toLowerCase()) && !predicate))"
          - "!(COMMA_JOINED.has(lw) && !COMMA_ASK_FILLERS.has(lw))"
        return: 'clause.length >= 2 && /^\p{Ll}+$/u.test(last) && !COMMA_OBJECT_PRONOUNS.has(last) ? [commaFinding(ctx, lead.start, lead.word, at)] : []'
    frames:
      # The comma German sets before a clause or an infinitive group: "Er bleibt, weil es
      # regnet", "Sie ging, um zu lesen", "Ich glaube, das stimmt". Each word whose start the
      # chunk owns (a word of letters, not glued into a number, path, mention or dotted token).
      - regex: "(?<![\\p{L}\\p{M}\\p{N}_@/#\\\\.-])\\p{L}[\\p{L}\\p{M}]*(?![\\p{L}\\p{M}\\p{N}_@/#\\\\]|\\.\\p{L})"
        scan: owned
        flags: gu
        let:
          typed: m[0]
          low: typed.toLowerCase()
          at: m.index
          end: at + typed.length
          prior: deWordBefore(ctx.text, at)
          before: deTokensBefore(ctx.text, at, 8)
        when:
          # Only the words a check below starts at; the reads after this cost more than the test.
          - >-
            COMMA_CORRELATES.has(low) || low === "es" || Object.hasOwn(COMMA_RELATIVES, low) || COMMA_SUBORDINATORS.has(low) ||
            COMMA_INFINITIVE_LEADS.has(low) || germanAuxiliary(low) || low === "sag" || low === "sagt" || Object.hasOwn(COMMA_PAIRS, low) ||
            COMMA_OPINIONS.has(low) || COMMA_OPINION_QUESTIONS.has(low) || typed === "vor" || COMMA_OPINION_VERBS.test(low) ||
            low === "soweit" || low === "sofern" || COMMA_W_WORDS.has(low)
          - "!deEnglishLine(ctx.text, at) && !namedExampleBefore(ctx.text, at)"
        # The first check that applies gives the commas; the writer's own words keep theirs.
        return: >-
          (commaCorrelateBranch(ctx, typed, low, at, before) ?? commaEsBranch(ctx, low, at) ?? commaRelativeBranch(ctx, typed, low, at) ??
          commaSubordinateBranch(ctx, typed, low, at, end, prior) ?? commaInfinitiveBranch(ctx, typed, low, at, end, prior, before) ??
          commaOpeningInfinitiveBranch(ctx, typed, low, end, before) ?? commaAuxBranch(ctx, typed, low, at, end, before) ??
          commaSagBranch(ctx, typed, end) ?? commaPairBranch(ctx, typed, low, at, end, prior) ?? commaOpinionBranch(ctx, typed, low, at, end, before) ??
          commaVorBranch(ctx, typed, at, end) ?? commaInvertedBranch(ctx, typed, low, end, before) ??
          commaSoweitBranch(ctx, typed, low, at, end, prior, before) ?? commaQuestionBranch(ctx, typed, low, at, end, prior, before) ?? [])
          .filter((f) => !ctx.dictionary.has(ctx.text.slice(f.range.start, f.range.end).toLowerCase()))
  - id: de.commaFrames
    checks: [germanCommas]
    style: match
    message: review_msg_german_comma
    defs:
      COMMA_COPULAS: /^(?:ist|sind|war|waren|wäre|wären|sei|scheint|klingt|wird|wurde|bin|bist|seid)$/
      COMMA_COORDINATORS: /^(?:und|oder|aber|sowie|bzw)$/
      # A comma after text[start, end).
      commaAfter:
        args: "ctx: DetectContext, start: number, end: number, alternative: string"
        type: RawFinding
        return: >-
          ({ ruleId: "germanCommas", messageKey: "review_msg_german_comma", range: { start, end },
          alternatives: [alternative],
          context: { start: Math.max(0, start - 40), end: Math.min(ctx.text.length, end + 40) } })
    frames:
      # A salutation alone on its line: "Sehr geehrte Frau Weber", "Liebe Anna!" take a comma.
      - regex: "(?<=(?:^|\\n)[ \\t]{0,8})(?:Sehr[ \\t]{1,4}geehrte[r]?|Liebe[r]?)[ \\t]{1,4}(?:Herr|Frau|Damen[ \\t]{1,4}und[ \\t]{1,4}Herren|Kolleginnen[ \\t]{1,4}und[ \\t]{1,4}Kollegen|\\p{Lu}\\p{Ll}+)(?:[ \\t]{1,4}(?:Dr\\.|Prof\\.|\\p{Lu}[\\p{Ll}-]+)){0,3}!?(?=[ \\t]*(?:\\n|$))"
        scan: owned
        flags: gu
        let:
          end: m.index + m[0].length
          named: '/^Liebe[r]?[ \t]+(\p{L}+)/u.exec(m[0])?.[1]'
          word: '/\p{L}+\.?!?$/u.exec(m[0])![0]'
          start: end - word.length
        when: >-
          !(named && /^(?:Grüße|Gruß|Grüßen|Wünsche|Wünschen)$/.test(named))
        return: >-
          ({ ruleId: "germanCommas", messageKey: "review_msg_german_comma", range: { start, end }, alternatives: [`${word.replace(/!$/, "")},`], context: { start: m.index, end } })
      # Paired words ("teils lustig, teils traurig", "halb …, halb …", "einerseits …,
      # andererseits", "je …, desto", "So weit, so gut"): the word that takes the comma after
      # it. The gate first checks the paired word after it, so the long lookbehinds run only
      # there.
      - regex: "{{WG}}(?:(?=\\p{L}+{{S}}(?:teils|halb|andererseits|desto|umso|so){{E}})(?:(?<=(?:[Tt]eils){{S}}(?:{{CLAUSE_CHAR}}{0,60}?{{S}})?)(?<word>\\p{L}+)(?={{S}}teils{{E}})|(?<=[Hh]alb{{S}})(?<w2>\\p{L}+)(?={{S}}halb{{S}}\\p{L})|(?<=(?:^|[.!?;:\\n]{{S}}?)[Ee]inerseits{{S}}{{CLAUSE_CHAR}}{0,80}?)(?<w3>\\p{L}+)(?={{S}}andererseits{{E}})|(?<=(?:^|[.!?\\n,]{{S}}?)[Jj]e{{S}}{{CLAUSE_CHAR}}{0,80}?)(?<w4>\\p{L}+)(?={{S}}(?:desto|umso){{E}})|(?<=[Ss]o{{S}})(?<w5>weit)(?={{S}}so{{S}}gut{{E}})))"
        flags: dgu
        owner: word|w2|w3|w4|w5
        let:
          name: '["word", "w2", "w3", "w4", "w5"].find((k) => m.groups![k] !== undefined)!'
          typed: m.groups![name]
        when: "!COMMA_COORDINATORS.test(typed)"
        return: commaAfter(ctx, m.indices!.groups![name][0], m.indices!.groups![name][1], `${typed},`)
      # "Wo denkst du ist es?": a w-question's verb follows an inserted "denkst du".
      - regex: "{{WG}}(?:(?<=(?:^|[.!?\\n][ \\t]*)(?:Wo|Was|Wie|Wann|Warum|Wieso|Weshalb|Wer|Wen|Wem|Wohin|Woher|Welche\\p{Ll}*){{S}}(?:denkst|glaubst|meinst|denkt|glaubt|meint|dachtest|dachtet|dachten|glaubtest|glaubten|meintest|meinten|denken|glauben|meinen){{S}})(?<word>du|ihr|Sie)(?={{S}}(?:ist|sind|war|waren|soll|sollte|sollen|kann|könnte|wird|würde|hat|hätte|muss|müsste|sei|wäre|kommt|geht|passiert|liegt|steht|gibt){{E}}))"
        flags: dgu
        owner: word
        return: commaAfter(ctx, m.indices!.groups!.word[0], m.indices!.groups!.word[1], `${word},`)
      # "Hallo wie geht es euch?": a greeting before a sentence takes a comma ("Hallo du" and
      # "Hallo ihr beiden" address someone).
      - regex: "{{WG}}(?:(?<=(?:^|\\n|[„\"]))(?<word>Hallo|Hi|Hey|Servus|Moin)(?={{S}}(?:wie|was|wo|wann|warum|ich|wir|da|habt|hast|kannst|könnt|seid|bist){{E}}))"
        flags: dgu
        owner: word
        return: commaAfter(ctx, m.indices!.groups!.word[0], m.indices!.groups!.word[1], `${word},`)
      # "Du kommst morgen oder?", "Das stimmt nicht wahr?": the tag question after a statement.
      - regex: "{{WG}}(?:(?<word>\\p{L}+)(?={{S}}(?:oder(?:{{S}}etwa{{S}}nicht)?|nicht{{S}}wahr|gell|stimmt's|stimmts)[ \\t]*\\?))"
        flags: dgu
        owner: word
        let:
          start: m.indices!.groups!.word[0]
          clause: 'ctx.text.slice(Math.max(0, start - 200), start).split(/[.!?;:\n]/).at(-1)!'
          first: '/\p{L}+/u.exec(clause)?.[0] ?? word'
          low: first.toLowerCase()
          verbFirst: germanAuxiliary(low) || /st$/.test(low) || germanVerbLike(low)
        when:
          - >-
            !(COMMA_COPULAS.test(word) || COMMA_COORDINATORS.test(word) || /^(?:entweder|das|es)$/i.test(word))
          - >-
            /[ \t]/.test(clause.trim()) && !verbFirst && !/(?<!\p{L})entweder(?!\p{L})/iu.test(clause)
        return: commaAfter(ctx, start, m.indices!.groups!.word[1], `${word},`)
      # "Das ist glaube ich egal": an inserted "glaube ich" after the finite verb.
      - regex: "{{WG}}(?:(?<=(?:ist|sind|war|waren|hat|haben|hatte|hatten|wird|werden|kann|können|muss|müssen|soll|sollte|wäre|würde)(?:{{S}}(?:aber|doch|ja|auch))?{{S}})(?<target>(?:glaube|denke|finde|meine|schätze|vermute){{S}}ich)(?={{S}}\\p{L}))"
        flags: dgu
        let:
          at: m.indices!.groups!.target[0]
          start: 'at - /[ \t ]*$/.exec(ctx.text.slice(Math.max(0, at - 8), at))![0].length'
        return: >-
          commaAfter(ctx, start, m.indices!.groups!.target[1], `, ${target.replace(/[ \t ]+/g, " ")},`)
  - id: de.verbAgreement
    checks: [germanVerbAgreement]
    style: match
    message: review_msg_german_verb_agreement
    sets:
      # Imperatives that a "du" may follow: "Sei du still", "Lies du vor".
      VERB_IMPERATIVES:
        [
          sei,
          hab,
          habe,
          werd,
          werde,
          tu,
          tue,
          lauf,
          laufe,
          fahr,
          fahre,
          gib,
          nimm,
          sieh,
          lies,
          sprich,
          hilf,
          iss,
          schlaf,
          schlafe,
          trag,
          trage,
          halt,
          halte,
          lass,
          lasse,
          geh,
          gehe,
          komm,
          komme,
          wisse,
        ]
      # "sie", "es" and "ihr" may also be objects ("Ihr habe ich …").
      VERB_OBJECT_TOO: [sie, es, ihr]
      VERB_SUBJECTS: [ich, du, er, sie, es, man, wir, ihr, Sie]
      # Words that open a sentence before its verb: "Was macht du?", "Dann sagt du es".
      VERB_OPENERS:
        [
          was,
          wie,
          wo,
          wann,
          warum,
          wieso,
          weshalb,
          wohin,
          woher,
          womit,
          wozu,
          worüber,
          dann,
          da,
          jetzt,
          nun,
          so,
          also,
          heute,
          morgen,
          gestern,
          damals,
          danach,
          trotzdem,
          deshalb,
        ]
      # Words that open a new clause or link two: the repeat may belong to it ("Es ist, wie es ist").
      VERB_CLAUSE_LINKS:
        [
          und,
          oder,
          aber,
          sondern,
          denn,
          sowie,
          bzw,
          wie,
          was,
          wer,
          wo,
          wann,
          warum,
          wieso,
          weshalb,
          dass,
          ob,
          weil,
          wenn,
          falls,
          obwohl,
          je,
          desto,
          umso,
          der,
          die,
          das,
          dem,
          den,
          denen,
          dessen,
          deren,
          welche,
          welcher,
        ]
      VERB_SUBORDINATORS:
        [
          dass,
          ob,
          weil,
          wenn,
          falls,
          obwohl,
          warum,
          wieso,
          weshalb,
          wie,
          was,
          wer,
          wo,
          wann,
          nachdem,
          bevor,
          sobald,
        ]
      # Infinitives that follow their own finite form: "Sie werden Ärzte werden", "das kann sein".
      VERB_SELF_GOVERNED:
        [sein, haben, werden, können, müssen, wollen, sollen, dürfen, mögen, lassen, wissen]
      VERB_LINKS:
        [
          und,
          oder,
          aber,
          sondern,
          denn,
          sowie,
          bzw,
          wie,
          was,
          wer,
          wo,
          wann,
          warum,
          wieso,
          weshalb,
          dass,
          ob,
          weil,
          wenn,
          falls,
          obwohl,
          je,
          desto,
          umso,
          nachdem,
          bevor,
          sobald,
          damit,
          als,
        ]
      VERB_NOT_BETWEEN: [ich, du, er, sie, es, wir, ihr, man, und, oder]
      # Bare stems that are no ich-form with its "-e" dropped often enough to doubt ("Seh ich auch
      # so", "Geb dir recht"), so they count as imperatives at a sentence start.
      VERB_BARE_ONLY: [sprech, les, ess, vergess, werf, brech, mess, stehl, fress, sterb]
      # Words that follow an imperative but no dropped "ich" form at once: "Les dir das durch".
      VERB_AFTER_BARE:
        [
          dir,
          mir,
          dich,
          mich,
          uns,
          euch,
          doch,
          bitte,
          endlich,
          weniger,
          mehr,
          lieber,
          ruhig,
          einfach,
          schnell,
          langsam,
          leiser,
          lauter,
        ]
      # Words that open a sentence before an imperative: "Bitte gib …", "Dann bewirb dich".
      VERB_IMPERATIVE_OPENERS: [bitte, dann, nun, jetzt, also, und, einfach]
    maps:
      # Strong verbs that change "e" to "i" or "ie" in the "du" imperative: "Sprich leiser!",
      # "Lies das!", "Bewirb dich!".
      VERB_E_TO_I:
        {
          geb: gib,
          nehm: nimm,
          sprech: sprich,
          les: lies,
          seh: sieh,
          ess: iss,
          helf: hilf,
          werf: wirf,
          treff: triff,
          gess: giss,
          mess: miss,
          brech: brich,
          stech: stich,
          sterb: stirb,
          werb: wirb,
          derb: dirb,
          fehl: fiehl,
          stehl: stiehl,
          fress: friss,
          tret: tritt,
        }
    defs:
      # Pronoun subjects and the persons they take. "sie" is she or they; "es" also takes a plural
      # ("es sind viele").
      VERB_SUBJECT_SLOTS: >-
        ({ ich: [0], du: [1], er: [2], es: [2, 5], man: [2], sie: [2, 5], wir: [3], ihr: [4] }) as Readonly<Record<string, readonly GermanSlot[]>>
      # "Ich denke, wir habe …": a main clause after an opinion verb and its comma.
      VERB_OPINION: /^(?:glaube|denke|hoffe|finde|meine|weiß|schätze|vermute|befürchte|wette)$/
      VERB_TOKEN_END: '/^(?:[.!?:;]|\n)$/'
      VERB_DOUBLE_BOUNDARY: '/^(?:[.!?,;:()"„“”»«–—]|\n)$/'
      VERB_MODAL_BOUNDARY: '/^(?:[.!?,;:()"„“”»«–—…]|\n)$/'
      # A participle with an adjective's "-e" before the auxiliary that closes its clause: "was sie
      # gesagte hatte" (gesagt).
      VERB_DETERMINER: >-
        /^(?:der|die|das|dem|den|des|k?ein\p{Ll}*|mein\p{Ll}*|dein\p{Ll}*|sein\p{Ll}*|ihr\p{Ll}*|unser\p{Ll}*|eu\p{Ll}*|dies\p{Ll}*|jed\p{Ll}*)$/u
      # The slots of a subject word; an Object member name ("constructor") is no subject.
      verbSubjectSlots:
        args: "word: string"
        return: "Object.hasOwn(VERB_SUBJECT_SLOTS, word) ? VERB_SUBJECT_SLOTS[word] : undefined"
      # The forms of the verb of `typed` that fit the person slots. "ich wart hier" (warte), "seid
      # du nicht da bist" (seit): another word. "er weißt auf … hin": "weist" (weisen) as much as
      # "weiß". "er lies den Boden machen": "ließ", not the imperative of "lesen".
      fittingForms:
        args: "typed: string, slots: readonly GermanSlot[]"
        type: string[] | null
        let:
          low: typed.toLowerCase()
        when: low !== "wart" && low !== "seid"
        return: >-
          low === "weißt" && slots.includes(2) ? ["weiß", "weist"]
          : low === "lies" && (slots.includes(0) || slots.includes(2)) ? ["ließ"]
          : germanFittingForms(typed, slots)
      verbFinding:
        args: "start: number, typed: string, fits: string[], context: [number, number]"
        type: RawFinding
        let:
          cased: fits.map((f) => deLikeTyped(typed, f))
        return: >-
          ({ ruleId: "germanVerbAgreement", messageKey: "review_msg_german_verb_agreement", range: { start, end: start + typed.length },
          alternatives: cased, context: { start: context[0], end: context[1] }, ...(cased.length > 1 ? { requiresChoice: true as const } : {}) })
      # Whether the token at i opens the sentence (no token, a stop or a quote mark).
      verbOpensAt:
        args: "before: string[], i: number"
        return: 'i < 0 || VERB_TOKEN_END.test(before[i]) || /^[„“"»«]$/.test(before[i])'
      # The start of the clause that ends at `from`: after the last token that `stop` matches.
      verbClauseFrom:
        args: "before: string[], from: number, stop: RegExp"
        type: number
        return: "from > 0 && !stop.test(before[from - 1]) ? verbClauseFrom(before, from - 1, stop) : from"
      # The position of the clause's token `first`, found back from `pos` token by token.
      verbRepeatStart:
        args: "text: string, clause: string[], i: number, first: number, pos: number"
        type: number
        return: "i < first ? pos : verbRepeatStart(text, clause, i - 1, first, text.lastIndexOf(clause[i], pos - 1))"
      # "Sollte wir uns kümmern?", "Bei Jan habe wir": the verb before its subject. "Wünscht du
      # …?", "Was macht du?": a regular verb's third-person ending before "du", at the sentence's
      # start or after one opening w-word or adverb; else listed verbs only. "Ich weiß du magst
      # …": the verb has its own subject; a new clause starts at "du".
      verbBeforeSubject:
        args: >-
          ctx: DetectContext, typed: string, low: string, slots: readonly GermanSlot[], before: string[], prior: string | undefined,
          sentenceStart: boolean, at: number, end: number
        type: RawFinding | null
        let:
          opener: before.length - 2
          fits: fittingForms(prior, slots)
          start: ctx.text.lastIndexOf(prior, at)
        when:
          - '!(VERB_OBJECT_TOO.has(low) || !prior || !/^\p{L}+$/u.test(prior))'
          - "!(typed !== low && !sentenceStart)"
          - >-
            !!germanVerbForms(prior.toLowerCase()) || (low === "du" && (verbOpensAt(before, opener) ||
            (VERB_OPENERS.has(before[opener].toLowerCase()) && verbOpensAt(before, opener - 1))))
          - '!(low === "du" && VERB_IMPERATIVES.has(prior.toLowerCase()))'
          - '!(VERB_SUBJECTS.has(before.at(-2) ?? "") || VERB_SUBJECTS.has(before.at(-2)?.toLowerCase() ?? ""))'
          - "!!fits"
        return: verbFinding(start, prior, fits, [start, end])
    frames:
      # A subject pronoun and its verb in the wrong person: "Wir sollte heute gehen", "Sollte
      # wir uns kümmern?". Each word whose start the chunk owns.
      - regex: "(?<![\\p{L}\\p{M}\\p{N}_@/#\\\\.-])\\p{L}[\\p{L}\\p{M}]*(?![\\p{L}\\p{M}\\p{N}_@/#\\\\]|\\.\\p{L})"
        scan: owned
        flags: gu
        let:
          typed: m[0]
          low: typed.toLowerCase()
          slots: verbSubjectSlots(low)
          at: m.index
          end: at + typed.length
          before: deTokensBefore(ctx.text, at, 4)
          after: deTokensAfter(ctx.text, end, 3)
          prior: before.at(-1)
          sentenceStart: 'prior === undefined || VERB_TOKEN_END.test(prior) || /^[„“"»«]$/.test(prior)'
          afterOpinion: 'prior === "," && VERB_OPINION.test(before.at(-2) ?? "")'
          verb: after[0]
          # "Wir sollte heute gehen": the subject opens the sentence, the verb follows; "Sie hast du
          # gesehen": an object before the verb and its subject. "Ihr wurde die Vorfahrt genommen": the
          # dative "ihr" before a noun subject. "es läuft": the plural fits "es" only before a plural
          # subject ("es kamen viele").
          fitsAfter: >-
            (sentenceStart || afterOpinion) && verb && /^\p{Ll}/u.test(verb) && !(VERB_OBJECT_TOO.has(low) && VERB_SUBJECTS.has(after[1] ?? "")) &&
            !(low === "ihr" && /^(?:der|die|das|ein|eine|kein|keine)$/i.test(after[1] ?? "")) && !/^['’]$/.test(after[1] ?? "")
            ? fittingForms(verb, slots)?.slice(0, low === "es" ? 1 : undefined) : undefined
        when:
          - slots
          # "du und ich sind", "ich, der …": a coordinated subject or an apposition.
          - '!/^(?:und|oder|sowie|bzw|,|&|\/|-)$/.test(after[0] ?? "")'
          - "!deEnglishLine(ctx.text, at) && !namedExampleBefore(ctx.text, at)"
        return: >-
          fitsAfter ? verbFinding(ctx.text.indexOf(verb, end), verb, fitsAfter, [at, ctx.text.indexOf(verb, end) + verb.length])
          : verbBeforeSubject(ctx, typed, low, slots, before, prior, sentenceStart, at, end)
      # The finite verb written twice in one clause: "Max wird Wirt wird." (the second goes),
      # "dass er hat Hunger hat" (the first goes, a subordinate clause ends in its verb). The
      # scan reads each word that ends a clause.
      - regex: "(?<![\\p{L}\\p{M}\\p{N}_'\\u2019-])(\\p{Ll}{3,})(?=[ \\t]*[.!?,;:])"
        scan: owned
        flags: gu
        message: review_msg_german_double_verb
        let:
          verb: m[1]
          before: deTokensBefore(ctx.text, m.index, 16)
          clause: before.slice(verbClauseFrom(before, before.length, VERB_DOUBLE_BOUNDARY))
          first: clause.indexOf(verb)
          subordinate: VERB_SUBORDINATORS.has(clause[0]?.toLowerCase() ?? "")
          # The repeat's position: the clause's tokens joined back as typed.
          firstStart: verbRepeatStart(ctx.text, clause, clause.length - 1, first, m.index)
          range: "subordinate ? { start: firstStart, end: firstStart + verb.length + 1 } : { start: m.index - 1, end: m.index + verb.length }"
        when:
          - "!(VERB_SELF_GOVERNED.has(verb) || germanNotVerb(verb))"
          - "!!germanVerbForms(verb) || (germanVerbLike(verb) && germanNounReading(verb) === null)"
          # Adjacent ("ist ist") is a doubled word; "zu kaufen" a zu-infinitive.
          - '!(first < 0 || first === clause.length - 1 || clause.at(-1) === "zu")'
          - "!clause.slice(first + 1).some((t) => VERB_CLAUSE_LINKS.has(t.toLowerCase()))"
          - "!clause.slice(first + 1).includes(verb)"
          - "!deEnglishLine(ctx.text, m.index) && !namedExampleBefore(ctx.text, m.index)"
          - firstStart >= 0
          - '/^[ \t]/.test(ctx.text.slice(subordinate ? range.end - 1 : range.start))'
        return: >-
          ({ ruleId: "germanVerbAgreement", messageKey: "review_msg_german_double_verb", range, alternatives: [""],
          context: { start: firstStart, end: m.index + verb.length } })
      # A plural noun subject opening the sentence and a singular verb right after it: "Die
      # Schüler soll" (sollen), "Die Frauen wurde" (wurden). The noun is plural when "die"
      # stands before a masculine or neuter noun, or before a feminine noun's -en/-n form.
      - regex: "(?<=(?:^|[.!?:\\n\\u201E\"][ \\t]{0,4}))(?:Die|Diese|Alle|Meine|Deine|Seine|Ihre|Unsere|Eure|Viele|Manche|Einige|Beide)(?:[ \\t]+\\p{Ll}+(?:e|en))?[ \\t]+(?<noun>\\p{Lu}\\p{Ll}{2,})[ \\t]+(?<verb>\\p{Ll}+)(?![\\p{L}\\p{M}])"
        scan: owned
        flags: gu
        let:
          fits: fittingForms(verb, [5])
          start: m.index + m[0].length - verb.length
        when:
          - germanVerbForms(verb)?.some((f) => f.slot === 2) === true && germanPluralNoun(noun)
          - "!ctx.dictionary.has(noun.toLowerCase()) && !deEnglishLine(ctx.text, m.index)"
          - "!!fits"
        return: verbFinding(start, verb, fits, [m.index, start + verb.length])
      # After a modal or "werden" in the same main clause, the verb that ends it is an
      # infinitive: "Ich will ein Auto kaufe" (kaufen), "Ich möchte Lehrer werde" (werden).
      - regex: "(?<![\\p{L}\\p{M}\\p{N}_'\\u2019-])(\\p{Ll}{3,})(?=[ \\t]*[.!?,;:])"
        scan: owned
        flags: gu
        message: review_msg_german_modal_infinitive
        let:
          verb: m[1]
          infinitive: germanFiniteInfinitive(verb)
          before: deTokensBefore(ctx.text, m.index, 12)
          clause: before.slice(verbClauseFrom(before, before.length, VERB_MODAL_BOUNDARY))
          modal: clause.findIndex((t) => germanModal(t.toLowerCase()) && t.toLowerCase() !== verb)
        when:
          # "werde" may end a clause after a modal ("Ich möchte Lehrer werde"); the modals may not.
          - '!((germanModal(verb) && germanInfinitiveOf(verb) !== "werden") || VERB_SELF_GOVERNED.has(verb))'
          - "!!infinitive && infinitive !== verb"
          - "!(modal < 0 || modal === clause.length - 1)"
          # "… die Arbeit lenken kann als auch …": an infinitive before the modal ends a subordinate clause.
          - "!(modal > 0 && germanInfinitive(clause[modal - 1].toLowerCase()))"
          - '!clause.slice(modal + 1).some((t) => VERB_LINKS.has(t.toLowerCase()) || t === "zu")'
          - "!ctx.dictionary.has(verb) && !deEnglishLine(ctx.text, m.index)"
          - "!namedExampleBefore(ctx.text, m.index)"
        return: >-
          ({ ruleId: "germanVerbAgreement", messageKey: "review_msg_german_modal_infinitive", range: { start: m.index, end: m.index + verb.length },
          alternatives: [infinitive], context: { start: Math.max(0, m.index - 40), end: m.index + verb.length } })
      # A subordinate clause with a pronoun subject and an auxiliary at its end: "weil du
      # gelogen hat" (hast), "als wir gekündigt wurde" (wurden). Only lowercase words that are
      # no subject pronoun or finite verb between them, so no other clause or subject
      # intervenes. The scan starts 120 characters before the chunk; the verb must be in it.
      - regex: "(?<![\\p{L}\\p{M}])(?:[Ww]eil|[Ww]enn|[Aa]ls|[Dd]ass|[Oo]b|[Oo]bwohl|[Nn]achdem|[Bb]evor|[Ff]alls|[Ss]obald|[Ww]arum|[Ww]ieso|[Ww]eshalb|[Ww]ann|[Ww]ohin|[Ww]oher|[Dd]amit|[Ss]eitdem)[ \\t]+(?<subject>ich|du|wir|ihr)(?<middle>(?:[ \\t]+\\p{L}+){1,6}?)[ \\t]+(?<verb>\\p{Ll}+)(?=[ \\t]*[,.!?;])"
        scan: owned
        lookback: 120
        flags: gu
        let:
          between: middle.trim().split(/[ \t]+/)
          fits: fittingForms(verb, verbSubjectSlots(subject)!)
          start: m.index + m[0].length - verb.length
        when:
          - germanAuxiliary(verb)
          # A capitalized word only after its article ("das Buch"), so no noun or name subject.
          - >-
            between.every((w, i) => !/^\p{Lu}/u.test(w) ||
            /^(?:der|die|das|dem|den|des|k?ein\p{Ll}*|mein\p{Ll}*|dein\p{Ll}*|sein\p{Ll}*|ihr\p{Ll}*|unser\p{Ll}*|eu\p{Ll}*|dies\p{Ll}*)$/u.test(between[i - 1] ?? ""))
          - "!between.some((w) => VERB_NOT_BETWEEN.has(w) || (germanAuxiliary(w) && !/^(?:sein|haben|werden)$/.test(w)))"
          # A finite verb in between ("weil ich glaube es ist") starts another clause.
          - '!between.some((w) => !/^ge\p{Ll}+(?:t|en)$|en$|iert$/u.test(w) && germanVerbLike(w))'
          - "!!fits"
          - "!(start < ctx.from || start >= ctx.to)"
          - "!deEnglishLine(ctx.text, m.index) && !namedExampleBefore(ctx.text, m.index)"
        return: verbFinding(start, verb, fits, [m.index, start + verb.length])
      # The "du" imperative of an e→i verb written with its "e": "Sprech nicht so laut"
      # (Sprich), "Ess weniger!" (Iss), "Dann bewerbe dich" (bewirb).
      - regex: "(?<![\\p{L}\\p{M}\\p{N}_'’-])(?<prefix>(?:be|emp|er|ent|ver|zer|über|unter|wider|miss)?)(?<stem>geb|nehm|sprech|les|seh|ess|helf|werf|treff|gess|mess|brech|stech|sterb|werb|derb|fehl|stehl|fress|tret)(?<e>e?)(?![\\p{L}\\p{M}\\p{N}_'’-])"
        scan: owned
        flags: giu
        let:
          typed: m[0]
          at: m.index
          low: stem.toLowerCase()
          lowPrefix: prefix.toLowerCase()
          # "empfehl", "befehl": "fehl" takes a prefix; "gess" and "derb" only with "ver".
          prefixFits: 'low === "fehl" ? /^(?:be|emp)$/.test(lowPrefix) : /^(?:gess|derb)$/.test(low) ? lowPrefix === "ver" : lowPrefix !== "emp"'
          bare: "!e && !lowPrefix && VERB_BARE_ONLY.has(low)"
          before: deTokensBefore(ctx.text, at, 2)
          after: deTokensAfter(ctx.text, at + typed.length, 2)
          prior: before.at(-1)
          opens: 'prior === undefined || VERB_TOKEN_END.test(prior) || /^[„“"»«]$/.test(prior)'
          next: after[0] ?? ""
          sentence: '/^[^.!?\n]*[.!?]?/.exec(ctx.text.slice(at))![0]'
          afterOpener: >-
            prior !== undefined && VERB_IMPERATIVE_OPENERS.has(prior.toLowerCase()) &&
            (before.length < 2 || VERB_TOKEN_END.test(before[0]) || /^[„“"»«,]$/.test(before[0]))
          sure: >-
            afterOpener || (opens && after.some((t) => /^(?:bitte|doch)$/.test(t))) ||
            (opens && sentence.endsWith("!") && !(low === "seh" && /^(?:dich|euch|uns)$/.test(next))) || (opens && bare && VERB_AFTER_BARE.has(next))
        when:
          - prefixFits && typed === deLikeTyped(typed, typed.toLowerCase())
          # "Messe", "Lese", "Treff": a noun at the sentence's start ("Sprech-" only opens compounds).
          - '!(/^\p{Lu}/u.test(typed) && !bare && germanNounReading(typed.toLowerCase()) !== null)'
          - '!(VERB_SUBJECTS.has(next) || /^\p{Lu}/u.test(next) || next === "")'
          - "sure && !deEnglishLine(ctx.text, at) && !namedExampleBefore(ctx.text, at)"
          - "!ctx.dictionary.has(typed.toLowerCase())"
        return: "verbFinding(at, typed, [deLikeTyped(typed, `${lowPrefix}${VERB_E_TO_I[low]}`)], [at, at + typed.length + 1 + next.length])"
      # The passive's participle "worden" written as a form of "werden": "nachdem er besiegt
      # wurden war" (worden), and the reverse, "Die Sachen worden gegessen" (wurden). The scan
      # starts 40 characters before the chunk; the typed form must be in it.
      - regex: "(?<![\\p{L}\\p{M}])(?<participle>\\p{Ll}{3,}(?:t|en))[ \\t]+(?<target>wurden|werden|w\\u00FCrden|wurde)(?=[ \\t]+(?:war|ist|bist|sind|waren|seid|w\\u00E4re|w\\u00E4ren|sei|seien)[ \\t]*[.!?,;])|(?<![\\p{L}\\p{M}])(?<t2>worden)(?=[ \\t]+ge\\p{Ll}{2,}(?:t|en)[ \\t]*[.!?,;])"
        scan: owned
        lookback: 40
        flags: gu
        let:
          typed: target ?? t2
          start: "target ? m.index + m[0].length - typed.length : m.index"
        when:
          - "!(start < ctx.from || start >= ctx.to)"
          - "!(participle && (germanAuxiliary(participle) || germanNotVerb(participle)))"
          - "!deEnglishLine(ctx.text, start) && !namedExampleBefore(ctx.text, start)"
        return: 'verbFinding(start, typed, [target ? "worden" : "wurden"], [m.index, start + typed.length])'
      # A participle with an adjective's "-e" before the auxiliary that closes its clause: "was
      # sie gesagte hatte" (gesagt).
      - regex: "(?<![\\p{L}\\p{M}])(?<target>ge\\p{Ll}{2,}te)(?=[ \\t]+(?:hatte|hatten|hattest|hat|habe|haben|hast|h\\u00E4tte|h\\u00E4tten)[ \\t]*[.!?,;:])"
        scan: owned
        flags: gu
        let:
          # "gesagte" → "sagen", "gewartete" → "warten": a weak verb's participle.
          stem: 'target.slice(2, target.endsWith("ete") ? -3 : -2)'
        when:
          - "germanInfinitive(`${stem}en`) && !ctx.dictionary.has(target)"
          # "was der gesuchte hat": a nominalized participle after its article.
          - '!VERB_DETERMINER.test(deTokensBefore(ctx.text, m.index, 1)[0]?.toLowerCase() ?? "")'
          - "!deEnglishLine(ctx.text, m.index) && !namedExampleBefore(ctx.text, m.index)"
        return: verbFinding(m.index, target, [target.slice(0, -1)], [m.index, m.index + m[0].length])
  - id: de.questionMarks
    checks: [germanQuestionMarks]
    style: match
    message: review_msg_question_mark
    sets:
      Q_W_WORDS:
        [
          wer,
          wen,
          wem,
          wessen,
          was,
          wann,
          wo,
          wohin,
          woher,
          warum,
          wieso,
          weshalb,
          weswegen,
          wie,
          welche,
          welcher,
          welchen,
          welchem,
          welches,
          womit,
          wofür,
          woran,
          worauf,
          worüber,
          wovon,
          wozu,
          inwiefern,
        ]
      # A preposition before the w-word: "Ab wann", "Mit wem", "An welchem Tag".
      Q_W_PREPOSITIONS: [ab, bis, seit, mit, von, an, auf, für, in, aus, bei, nach, zu, um, über]
      # Words that may stand between the w-word and its verb: "Wie viel kostet das".
      Q_DEGREES: [viel, viele, lange, oft, spät, alt, groß, weit, hoch, teuer, schnell, sehr]
      # A sentence that is only a w-word and particles: "Warum eigentlich nicht."
      Q_PARTICLES:
        [
          denn,
          eigentlich,
          nicht,
          überhaupt,
          endlich,
          bloß,
          nur,
          schon,
          noch,
          genau,
          dann,
          jetzt,
          nun,
          so,
        ]
      Q_SUBJECTS: [ich, du, er, sie, es, wir, ihr, man, Sie]
      Q_OPENERS: [Und, Aber, Oder, Na, Also]
      # Particles of statements and exclamations: "Kann ich jedenfalls behaupten.", "Hat er doch".
      Q_STATEMENT: [doch, ja, jedenfalls, halt, eben, wohl]
      Q_PLURAL_2: [seid, habt, werdet, könnt, müsst, sollt, wollt, dürft, mögt, wisst]
      # Particles between the w-word and its verb: "Wann aber kommst du".
      Q_INSERTED: [aber, denn, eigentlich, nun]
      # W-words that ask, not exclaim, before "!": "Ab wann gilt das!" ("Wie schön ist das!" exclaims).
      Q_ASKING: [wann, wo, wohin, woher, warum, wieso, weshalb, weswegen]
    defs:
      Q_DETERMINERS: >-
        /^(?:der|die|das|den|dem|des|ein|eine|einen|einem|einer|mein\p{Ll}*|dein\p{Ll}*|sein\p{Ll}*|ihr\p{Ll}*|unser\p{Ll}*|euer|eure\p{Ll}*|dies\p{Ll}*|jemand|man)$/u
      Q_PARTICIPLE_PREFIX: '/^(?:ge|be|er|ver|ent|zer|miss)\p{Ll}+(?:t|en)$/u'
      # "Kann mir jemand sagen, ob …", "Weißt du, wie …": a question that holds an indirect one.
      QUESTION_ASKS: >-
        /^(?:Kann|Kannst|Könnte|Könntest|Könnten|Weiß|Weißt|Wisst|Wissen|Gibt)[ \t]+(?:mir|uns|jemand|du|ihr|Sie|es)(?!\p{L})[^,]*,[ \t]*(?:ob|wie|was|wann|wo|warum|wer|welche\p{Ll}*)(?!\p{L})/u
      QUESTION_TAG: >-
        /,[ \t]*(?:oder(?:[ \t]+nicht)?|nicht[ \t]+wahr|gell|gelle|richtig|stimmt['’]s)[ \t]*$/u
      # A finite verb form: listed, a "du" form, or a regular present form of a known verb.
      # "dauert": an infinitive in -n ("dauern"); "passierte": a regular past form.
      questionFinite:
        args: "token: string"
        let:
          stem: "/^(.+?)(?:st|t|et|est)$/u.exec(token)?.[1]"
          past: "/^(.+?)(?:te|ten|test|tet)$/u.exec(token)?.[1]"
        return: >-
          germanAuxiliary(token) || !!germanInfinitiveOf(token) || (/^\p{Ll}+$/u.test(token) && !Q_PARTICIPLE_PREFIX.test(token) &&
          [stem, past].some((s) => !!s && (germanInfinitive(`${s}en`) || germanInfinitive(`${s}n`))))
      # Whether the words of a sentence read as a question: a verb first, or a w-word first.
      isQuestion:
        args: "words: string[]"
        let:
          i0: "Q_OPENERS.has(words[0]) ? 1 : 0"
          first: words[i0]
        when: "!!first"
        return: >-
          germanAuxiliary(first.toLowerCase()) && /^\p{Lu}/u.test(first) && i0 === 0 ? auxQuestion(words, first.toLowerCase())
          : wQuestion(words, i0, first.toLowerCase())
        else: "false"
      # "Hast du Zeit.", "Kann das Problem gelöst werden.": an auxiliary or modal first. "Seid
      # leise." is an order, "Seid ihr da." a question; "Kannst es dir schönreden." drops its
      # "du". "Ist Peter krank.": a name as the subject. "Kann das gelöst werden.": an
      # infinitive auxiliary closes the question.
      auxQuestion:
        args: "words: string[], low: string"
        let:
          next: words[1] ?? ""
          rest: words.slice(2)
          name: >-
            /^\p{Lu}\p{Ll}+$/u.test(next) && !Q_DETERMINERS.test(next.toLowerCase()) && !germanInfinitive(words.at(-1)!) && germanGender(next) === null
        when:
          - '!(Q_PLURAL_2.has(low) && next !== "ihr")'
          - '!(/st$/.test(low) && low !== "ist" && next !== "du")'
        return: >-
          (Q_SUBJECTS.has(next) || Q_DETERMINERS.test(next) || name) && !rest.some((w, k) => Q_STATEMENT.has(w) ||
          (germanAuxiliary(w) && !(k === rest.length - 1 && /^(?:werden|haben|sein)$/.test(w))))
        else: "false"
      # A w-word (after its preposition) first: "An welchem Tag starb er", "Wessen Auto ist das".
      # "Was bin ich doch für ein Glückspilz": an exclamation. "fuhr sie", "starb Cäsar": a verb
      # form the lexicon lacks, then its subject. "Was zählt ist Erfolg": a second finite verb.
      wQuestion:
        args: "words: string[], i0: number, low: string"
        let:
          i1: 'Q_W_PREPOSITIONS.has(low) && Q_W_WORDS.has(words[i0 + 1]?.toLowerCase() ?? "") ? i0 + 1 : i0'
          i2: i1 + 1
          i3: '/^(?:welch|wessen)/.test(words[i2 - 1].toLowerCase()) && /^\p{Lu}/u.test(words[i2] ?? "") ? i2 + 1 : i2'
          i4: 'Q_DEGREES.has(words[i3] ?? "") ? i3 + 1 : i3'
          i5: 'Q_INSERTED.has(words[i4] ?? "") ? i4 + 1 : i4'
          rest: words.slice(i5)
          subjectAfter: >-
            rest.length <= 3 && /^\p{Ll}+$/u.test(rest[0]) && (Q_SUBJECTS.has(rest[1] ?? "") || /^\p{Lu}/u.test(rest[1] ?? ""))
        when:
          - i1 !== i0 || Q_W_WORDS.has(low)
          - '!(rest.length === 0 || rest.some((w) => Q_STATEMENT.has(w) || w === "für"))'
        return: >-
          rest.every((w) => Q_PARTICLES.has(w)) ||
          ((questionFinite(rest[0]) || subjectAfter) && !rest.slice(1).some((w) => germanAuxiliary(w) && !/en$/.test(w)))
        else: "false"
      # "Ab wann gilt das!": only a w-word that asks, before a verb that is no subjunctive. "Wo
      # kommen die nur immer hin!": a sigh, not a question.
      exclaimedQuestion:
        args: "sentence: string, words: string[]"
        let:
          w: 'Q_W_PREPOSITIONS.has(words[0]?.toLowerCase() ?? "") ? 1 : 0'
        return: >-
          !(/[,;:"„“”«»()]/.test(sentence) || !Q_ASKING.has(words[w]?.toLowerCase() ?? "") ||
          words.some((x) => /^(?:hätte|hätten|wäre|wären|würde|würden|könnte|könnten)$/.test(x) || /^(?:nur|bloß|immer)$/.test(x)) ||
          !isQuestion(words))
    frames:
      # A full stop or a "!" after a letter that closes a line or comes before a capital: the
      # end of a sentence that may be a question ("Wann kommst du.").
      - regex: "(?<=\\p{L})[.!](?=[ \\t]*(?:\\n|$)|[ \\t]+\\p{Lu})"
        scan: owned
        flags: gu
        let:
          at: m.index
          win: Math.max(0, at - 300)
          start0: win + ctx.text.slice(win, at).search(/[^.!?\n]*$/)
          quote: '/^[ \t]*["„»]/.exec(ctx.text.slice(start0, at))'
          start: 'quote && !/["“”«]/.test(ctx.text.slice(start0 + quote[0].length, at)) ? start0 + quote[0].length : start0'
          sentence: ctx.text.slice(start, at)
          exclaimed: ctx.text[at] === "!"
          tagged: 'QUESTION_TAG.test(sentence) && !/(?<!\p{L})ob(?!\p{L})/u.test(sentence)'
          words: 'sentence.match(/\p{L}+/gu) ?? []'
        when:
          - "!deEnglishLine(ctx.text, at) && !namedExampleBefore(ctx.text, start)"
          # "Hast du Mt. Fuji gesehen?": an abbreviation, the sentence goes on.
          - '!/(?:^|\s)\p{Lu}\p{Ll}?$/u.test(sentence)'
          - >-
            exclaimed ? exclaimedQuestion(sentence, words) : QUESTION_ASKS.test(sentence.trimStart()) || tagged ||
            (!/[,;:"„“”«»()]/.test(sentence) && words.length >= 2 && !/(?:^|\s)\p{L}$/u.test(sentence) && isQuestion(words))
        return: >-
          ({ ruleId: "germanQuestionMarks", messageKey: "review_msg_question_mark", range: { start: at, end: at + 1 },
          alternatives: ["?"], context: { start, end: at + 1 } })
      # Quoted speech that a verb of asking reports, closed without a question mark: '"Wohin
      # gehst du", fragte sie.' → '"Wohin gehst du?"'.
      - regex: "(?<=\\p{L})\\.?(?<quote>[\"\\u201C\\u201D\\u00AB\\u00BB])(?=,?[ \\t]+(?:fragte|fragten|fragt|erkundigte|erkundigten|erkundigt|wollten?(?:[ \\t]+\\p{Ll}+)?[ \\t]+wissen)(?!\\p{L}))"
        scan: owned
        flags: gu
        let:
          line: ctx.text.slice(ctx.text.lastIndexOf("\n", m.index) + 1, m.index)
        when:
          - '/["„»«“]/.test(line) && !deEnglishLine(ctx.text, m.index)'
          - "!namedExampleBefore(ctx.text, m.index)"
        return: >-
          ({ ruleId: "germanQuestionMarks", messageKey: "review_msg_question_mark", range: { start: m.index, end: m.index + m[0].length },
          alternatives: [`?${quote}`], context: { start: Math.max(0, m.index - 60), end: m.index + m[0].length + 12 } })
  - id: de.numbers
    checks: [germanNumbers]
    style: match
    message: review_msg_german_numbers
    # "hundert tausend mal" already covers its "tausend mal": a number fix that overlaps an
    # earlier finding goes. The ordinal and range frames run last and keep theirs.
    filter:
      return: >-
        findings.reduce((kept, f) => f.messageKey === "review_msg_german_numbers" &&
        kept.some((k) => k.range.start < f.range.end && f.range.start < k.range.end) ? kept : kept.concat([f]), [] as RawFinding[])
    maps:
      ONE_OF:
        { millionen: million, milliarden: milliarde, billionen: billion, billiarden: billiarde }
    defs:
      # A number in words below a hundred and below a thousand ("achtundzwanzig", "dreihundert").
      NUMBER_BELOW_100: >-
        "(?:(?:ein|zwei|drei|vier|fünf|sechs|sieben|acht|neun)und(?:zwanzig|dreißig|vierzig|fünfzig|sechzig|siebzig|achtzig|neunzig)|zwanzig|dreißig|vierzig|fünfzig|sechzig|siebzig|achtzig|neunzig|zehn|elf|zwölf|dreizehn|vierzehn|fünfzehn|sechzehn|siebzehn|achtzehn|neunzehn|ein|eins|zwei|drei|vier|fünf|sechs|sieben|acht|neun)"
      NUMBER_BELOW_1000: "`(?:(?:ein|zwei|drei|vier|fünf|sechs|sieben|acht|neun)?hundert(?:und)?${NUMBER_BELOW_100}?|${NUMBER_BELOW_100})`"
      NUMBER_WORD: 'new RegExp(`^(?:${NUMBER_BELOW_1000}?tausend(?:und)?${NUMBER_BELOW_1000}?|${NUMBER_BELOW_1000})$`, "u")'
      DIGIT_WORDS: '["null", "ein", "zwei", "drei", "vier", "fünf", "sechs", "sieben", "acht", "neun", "zehn", "elf", "zwölf"]'
      # A number in words, written as one: "dreihundertsechsundzwanzig".
      numberWord:
        args: "word: string"
        return: NUMBER_WORD.test(word.toLowerCase())
      # The number words joined ("zwei drei Tage" is "two or three": only a whole number joins).
      writtenNumber:
        args: "first: string, rest: string, mal?: string"
        let:
          joined: '[first, ...rest.trim().split(/[ \t ]+/)].join("").toLowerCase()'
        when: numberWord(joined)
        return: "deLikeTyped(first, mal ? `${joined}mal` : joined)"
      numberFinding:
        args: "start: number, end: number, alternatives: string[]"
        type: RawFinding
        return: >-
          ({ ruleId: "germanNumbers", messageKey: "review_msg_german_numbers", range: { start, end }, alternatives,
          context: { start: Math.max(0, start - 30), end: end + 30 } })
      # The finding for the group `name` of m, unless it is already right or the writer's word.
      numberFix:
        args: "ctx: DetectContext, m: RegExpExecArray, name: string, alternatives: string[] | null"
        type: RawFinding | null
        let:
          span: m.indices!.groups![name]
          typed: m.groups![name]
        when:
          - "!!alternatives && !alternatives.includes(typed) && !namedExampleBefore(ctx.text, span[0])"
          - "!ctx.dictionary.has(typed.toLowerCase())"
        return: numberFinding(span[0], span[1], alternatives)
    frames:
      # Number words written apart: "sechs und zwanzig", "Zwei Hundert", "hundert tausend mal".
      - regex: "{{WG}}(?:(?<target>(?<first>{{NUMBER_PART}})(?<rest>(?:{{S}}(?:und{{S}})?{{NUMBER_PART}})+)(?:{{S}}(?<mal>mal))?)){{E}}"
        flags: dgu
        let:
          end: m.index + m[0].length
          fixed: writtenNumber(first, rest, mal)
        when:
          - '!/zwischen[ \t]+$/i.test(ctx.text.slice(Math.max(0, m.index - 12), m.index))'
          - '!(!mal && /^[ \t]+\p{Lu}\p{Ll}+[ \t]+\p{Ll}+(?:e|er|es|en|em)(?!\p{L})/u.test(ctx.text.slice(end, end + 40)))'
        return: 'numberFix(ctx, m, "target", fixed ? [fixed] : null)'
      # "acht mal versucht" → "achtmal"; "acht mal zwei" multiplies and stays.
      - regex: "{{WG}}(?:(?<target>(?<first>{{NUMBER_PART}}){{S}}mal)(?!{{S}}(?:{{NUMBER_PART}}|\\d))){{E}}"
        flags: dgu
        return: 'numberFix(ctx, m, "target", numberWord(first) ? [`${first}mal`] : null)'
      # "Achtmal zwei ist 16" → "Acht mal zwei".
      - regex: "{{WG}}(?:(?<target>(?<first>{{NUMBER_PART}})mal)(?={{S}}(?:(?!ein)(?:{{NUMBER_STARTS}})\\p{Ll}*|\\d+){{E}}(?:{{S}}\\p{L}+)?{{S}}(?:ist|gleich|ergibt|macht|sind|=))){{E}}"
        flags: dgu
        return: 'numberFix(ctx, m, "target", numberWord(first) && first.toLowerCase() !== "ein" ? [`${first} mal`] : null)'
      # "zwei an halb" → "zweieinhalb".
      - regex: "{{WG}}(?:(?<target>(?<n>{{NUMBER_UNITS}}|zehn|elf|zwölf|1[0-2]|[1-9]){{S}}an{{S}}halb)){{E}}"
        flags: dgu
        return: 'numberFix(ctx, m, "target", [`${/\d/.test(n) ? DIGIT_WORDS[Number(n)] : n === "eins" ? "ein" : n}einhalb`])'
      # "bis Drei", "unter Null", "wir Fünf": a number that is no noun there.
      - regex: "{{WG}}(?:(?=\\p{Lu})(?<=(?:bis|um|durch|über|unter|gegen|zu|auf|[Ww]ir|[Ii]hr|[Dd]iese|als|an{{S}}die){{S}})(?<target>(?:Null|Zwei|Drei|Vier|Fünf|Sechs|Sieben|Acht|Neun|Zehn|Elf|Zwölf|\\p{Lu}\\p{Ll}*(?:zig|ßig|zehn|hundert|tausend)\\p{Ll}*))(?!{{S}}\\p{Lu})){{E}}"
        flags: dgu
        return: 'numberFix(ctx, m, "target", numberWord(target) || target === "Null" ? [target.toLowerCase()] : null)'
      # "zwei Million", "viele Möglichkeit": a singular after a plural quantity. ("einige
      # Übung", "wenige Hoffnung" take a mass noun in the singular.)
      - regex: "{{WG}}(?:(?=\\p{Lu})(?<=(?:(?:{{QUANTITY}})|(?:Vielzahl|Reihe|Menge|Anzahl|Fülle){{S}}(?:von|an))(?:{{S}}\\p{Ll}{1,30}(?:e|en))?{{S}})(?<target>\\p{Lu}\\p{Ll}+(?:ung|heit|keit|schaft|ion|tät))(?!\\p{L})|(?=[MB]il)(?<=(?:{{QUANTITY}}|[2-9]|\\d{2,12}(?:,\\d{1,6})?){{S}})(?<t2>Million|Milliarde|Billion)(?!\\p{L})){{E}}"
        flags: dgu
        owner: target|t2
        let:
          next: 't2 ? /^[ \t]+(\p{Lu}\p{Ll}+)/u.exec(ctx.text.slice(m.index + m[0].length))?.[1] : undefined'
        when: "!t2 || !(next && germanNounReading(next.toLowerCase()) === null)"
        return: >-
          !t2 ? numberFix(ctx, m, "target", [`${target}en`]) : numberFix(ctx, m, "t2", [t2 === "Milliarde" ? "Milliarden" : `${t2}en`])
      # "eine halbe Millionen", "eine Viertelmilliarden", "1 Millionen": a half, a quarter or
      # one is one ("2,1 Millionen" is a decimal).
      - regex: "{{WG}}(?:(?<=(?:[Hh]albe|[Hh]alben|[Hh]alber|(?<!\\p{L})[Ee]iner?|(?<![\\p{N},.])1){{S}})(?<target>Millionen|Milliarden|Billionen|Billiarden)|(?<=(?:[Ee]ine|[Ee]iner|[Dd]ie|[Dd]er){{S}})(?<t2>Viertel(?:millionen|milliarden))){{E}}"
        flags: dgu
        owner: target|t2
        let:
          name: 'target ? "target" : "t2"'
          typed: m.groups![name]
        when: '!/(?:\d|zwei|drei|vier|fünf|viele|mehrere|beide)[ \t]+halbe[nr]?[ \t]+$/iu.test(ctx.text.slice(Math.max(0, m.index - 30), m.index))'
        return: >-
          numberFix(ctx, m, name, [typed.replace(/(millionen|milliarden|billionen|billiarden)$/i, (plural) => deLikeTyped(plural, ONE_OF[plural.toLowerCase()]))])
      # "12,450,300", "4,250.75": English digit groups. German groups thousands with a point
      # and writes a decimal comma ("1,250" alone is a decimal).
      - regex: "{{WG}}(?:(?<![\\p{N},.])(?<target>[1-9]\\d{0,2}(?:(?:,\\d{3}){2,}(?:\\.\\d{1,2})?|,\\d{3}\\.\\d{1,2}))(?![\\p{N},.]\\d|\\p{L})){{E}}"
        flags: dgu
        let:
          parts: target.split(".")
        return: 'numberFix(ctx, m, "target", [parts[0].replaceAll(",", ".") + (parts[1] ? `,${parts[1]}` : "")])'
      # "im 20 Jahrhundert", "am 3 Mai", "in den 4 Stock": a numeral between a definite article
      # and a noun that counts in order is an ordinal and takes its dot.
      - regex: "{{WG}}(?:(?<=(?:[Ii]m|[Aa]m|[Zz]um|[Vv]om|[Bb]eim|[Dd]em|[Dd]en|[Dd]er|[Dd]as|[Ss]eit{{S}}dem|[Ii]n{{S}}den|[Ii]n{{S}}der|[Aa]b{{S}}der|[Aa]b{{S}}dem){{S}})(?<target>[1-9]\\d{0,2})(?={{S}}(?:{{ORDINAL_NOUNS}}){{E}})){{E}}"
        flags: dgu
        let:
          span: m.indices!.groups!.target
        when: "!namedExampleBefore(ctx.text, span[0])"
        return: '({ ...numberFinding(span[0], span[1], [`${target}.`]), messageKey: "review_msg_german_ordinal_dot" })'
      # "von 9–10 Uhr", "Seiten von A-Z", "vom 7.-10. März", "zwischen 2019 – 2021": after "von"
      # or "zwischen" the dash stands for "bis" or "und", which German writes out.
      - regex: "{{WG}}(?:(?=[0-9]|\\p{Lu})(?<=(?:[Vv]on|[Vv]om|[Zz]wischen){{S}}(?:(?:\\p{Lu}\\p{Ll}{2,12}|S\\.|Nr\\.){{S}})?)(?<target>(?<from>{{RANGE_END}})[ \\t]?[-–][ \\t]?(?<to>{{RANGE_END}}))(?![-–\\d])){{E}}"
        flags: dgu
        let:
          before: ctx.text.slice(Math.max(0, m.index - 30), m.index)
          between: '/zwischen[ \t]+(?:\S+[ \t]+)?$/i.test(before)'
          span: m.indices!.groups!.target
        when:
          - '!(between && !/\d/.test(from + to))'
          - '!(/(?<!\p{L})\p{Lu}\p{Ll}+[ \t]+von[ \t]+$/u.test(before) && /\d/.test(from + to))'
          - "!namedExampleBefore(ctx.text, span[0]) && !ctx.dictionary.has(target.toLowerCase())"
        return: >-
          ({ ...numberFinding(span[0], span[1], [`${from} ${between ? "und" : "bis"} ${to}`]), messageKey: "review_msg_german_range" })
  - id: de.rangeDashes
    checks: [emdashShortcut]
    style: match
    message: review_msg_range_dash
    defs:
      # Not after a label of a code or a law ("Tel. 12-34", "§ 3-5", "Az. 12-14"), and not after
      # "von" or "zwischen", where germanNumbers writes "bis" or "und".
      RANGE_CODE: >-
        /(?:^|[^\p{L}])(?:tel|telefon|handy|mobil|fax|plz|nr|nummer|kto|konto|iban|blz|az|aktenzeichen|art|artikel|abs|absatz|ziff|ziffer|din|iso|isbn|version|flug|linie|gleis|zimmer|raum|modell|typ|rechnung|bestellung|kundennummer|von|vom|zwischen)\.?:?(?:[ \t ]+\p{L}{2,13})?[ \t ]*$|§[ \t ]*$/iu
      # "gewann 3-1", "das Spiel endete 2-2", "steht es 1-0".
      RANGE_SCORE: >-
        /(?:^|[^\p{L}])(?:spiel|sieg|gewann|gewinn|verlor|verlier|unterl[ai]g|endstand|halbzeit|ergebnis|treffer|satz|sätze|partie|unentschieden|steht[ \t ]+es|stand[ \t ]+es)\p{L}*(?:[ \t ]+\p{L}+){0,3}[ \t ]+$/iu
    frames:
      # "pages 10-15", "1990-1995": two numbers of up to four digits joined by a hyphen. A dash,
      # a colon, a slash or a digit group after the second number makes a date, a phone number
      # or a code ("12-05-2020", "2024-05-01"); a decimal or a time ("8.00-9.00") stays.
      - regex: "{{RANGE_DASH}}"
        scan: owned
        lookback: 8
        flags: gu
        let:
          a: m[1]
          dash: m[2]
          b: m[3]
          before: ctx.text.slice(Math.max(0, m.index - 48), m.index)
        when:
          - "!(m.index < ctx.from || namedExampleBefore(ctx.text, m.index))"
          # A leading zero or a 3-4 pair is a phone number or an ID: "0034-600", "12-05", "915-5512".
          - '!(a[0] === "0" || b[0] === "0" || (a.length === 3 && b.length === 4))'
          # A range runs up: "1990-95" and the season "2014-15" end in 1995 and 2015; "3-1" does not.
          - "(a.length === 4 && b.length === 2 ? Number(a.slice(0, 2) + b) : Number(b)) > Number(a)"
          - "!(RANGE_CODE.test(before) || RANGE_SCORE.test(before))"
        return: >-
          ({ ruleId: "emdashShortcut", messageKey: "review_msg_range_dash",
          range: { start: m.index + a.length, end: m.index + a.length + dash.length }, alternatives: ["–"],
          context: { start: m.index, end: m.index + m[0].length } })
  - id: de.typography
    checks: [germanTypography]
    style: match
    message: review_msg_typographic_symbol
    sets:
      CHEMICAL_ELEMENTS:
        [
          H,
          He,
          Li,
          Be,
          B,
          C,
          N,
          O,
          F,
          Ne,
          Na,
          Mg,
          Al,
          Si,
          P,
          S,
          Cl,
          Ar,
          K,
          Ca,
          Mn,
          Fe,
          Co,
          Ni,
          Cu,
          Zn,
          Br,
          Ag,
          Sn,
          I,
          Ba,
          Pt,
          Au,
          Hg,
          Pb,
        ]
      # One element with a count only as a gas.
      CHEMICAL_GASES: [H2, O2, N2, O3, Cl2, H², O², N², O³]
    maps:
      SUBSCRIPTS: { "²": "₂", "³": "₃" }
    defs:
      # Codes, postal codes and account numbers stay: never after a word that names a code.
      CODE_BEFORE: >-
        /(?:Nr\.?|Nummer|PLZ|Postleitzahl|ID|Tel\.?|Telefon|Fax|Kto\.?|Konto|Kontonummer|Artikel|Bestellung|Code|Pin|PIN|Jahr|Jahre|Version|Seite|Zimmer|Raum|BLZ|IBAN|Kunden\p{L}*|Rechnung\p{L}*|Auftrag\p{L}*|Vorgang\p{L}*|Ticket\p{L}*)[ \t:.#-]*$/u
    frames:
      # Typeset German multiplies with × or ·: "6,6 x 10⁻³⁴", "5*2", "a * b" (opt-in). "0x1F" is
      # hexadecimal; a "*" without spaces between words is a gender star or emphasis.
      - regex: "(?<=(?<![\\p{L}\\p{N}.,])\\d+(?:[.,]\\d+)?[ \\u00A0]?)[x*](?=[ \\u00A0]?\\d)|(?<=[\\p{L}\\p{N}][ \\u00A0])\\*(?=[ \\u00A0][\\p{L}\\p{N}])"
        scan: owned
        flags: gu
        when:
          - '!/(?<![\p{L}\p{N}.,])0$/u.test(ctx.text.slice(Math.max(0, m.index - 2), m.index))'
          - "!namedExampleBefore(ctx.text, m.index)"
        return: >-
          ({ ruleId: "germanTypography", messageKey: "review_msg_typographic_symbol", range: { start: m.index, end: m.index + 1 },
          alternatives: ["×", "·"], requiresChoice: true, context: { start: Math.max(0, m.index - 20), end: m.index + 20 } })
      # A chemical formula takes subscript counts: "CO2", "H2O", "CO²" → "CO₂", "H₂O" (opt-in).
      - regex: "(?<![\\p{L}\\p{N}_])(?:[A-Z][a-z]?[0-9\\u00B2\\u00B3]*){1,6}(?![\\p{L}\\p{N}_])"
        scan: owned
        flags: gu
        let:
          formula: m[0]
          symbols: "formula.match(/[A-Z][a-z]?/g)!"
        when:
          - "/[0-9²³]/.test(formula) && !/^[0-9]/.test(formula)"
          - symbols.every((s) => CHEMICAL_ELEMENTS.has(s))
          - 'symbols.length === 1 ? CHEMICAL_GASES.has(formula) : symbols.some((s) => s === "H" || s === "O")'
          - "!namedExampleBefore(ctx.text, m.index)"
        return: >-
          ({ ruleId: "germanTypography", messageKey: "review_msg_typographic_symbol",
          range: { start: m.index, end: m.index + formula.length },
          alternatives: [formula.replace(/[0-9²³]/g, (d) => SUBSCRIPTS[d] ?? String.fromCharCode(0x2080 + Number(d)))],
          context: { start: Math.max(0, m.index - 20), end: m.index + formula.length + 20 } })
      # A long number groups its thousands with a point: "250000 Besucher" → "250.000"
      # (opt-in).
      - regex: "(?<![\\p{L}\\p{N}.,:/#+_-])[1-9]\\d{4,}(?![\\p{L}\\p{N}.,:/_-])"
        scan: owned
        flags: gu
        message: review_msg_german_thousands
        let:
          digits: m[0]
          end: m.index + digits.length
          after: ctx.text.slice(end, end + 12)
        when:
          - "!(digits.length > 12 || CODE_BEFORE.test(ctx.text.slice(Math.max(0, m.index - 24), m.index)))"
          - >-
            !(digits.length === 5 && !/^[ \t]*(?:[.,;!?)]|[ \t]\p{Ll}|[ \t]?(?:[€$%£]|[kMGT]?B\b|km|kg|Euro|Dollar|Franken))/u.test(after))
          - "!namedExampleBefore(ctx.text, m.index)"
        return: >-
          ({ ruleId: "germanTypography", messageKey: "review_msg_german_thousands", range: { start: m.index, end },
          alternatives: [digits.replace(/\B(?=(?:\d{3})+$)/g, ".")] })
  - id: de.decadeCentury
    checks: [stylePhrasing]
    style: match
    message: review_msg_style_phrasing
    frames:
      # "in den 1970er Jahren des 20. Jahrhunderts": the four-digit decade names its century
      # already (opt-in style advice).
      - regex: "{{WG}}(?:(?<target>(?<decade>(?:1[0-9]|20)\\d0er(?:-|{{S}})Jahren?){{S}}des{{S}}(?:vorigen|letzten|vergangenen|\\d{1,2}\\.|neunzehnten|zwanzigsten|einundzwanzigsten){{S}}Jahrhunderts)){{E}}"
        flags: dgu
        return: >-
          ({ ruleId: "stylePhrasing", messageKey: "review_msg_style_phrasing",
          range: { start: m.indices!.groups!.target[0], end: m.indices!.groups!.target[1] },
          alternatives: [decade, target.slice(2)], requiresChoice: true })
  - id: de.colloquial
    checks: [germanColloquial]
    style: match
    message: review_msg_german_colloquial
    sets:
      # "rein" and "ran" alone are an adjective ("rein zufällig") and a call ("ran an die Arbeit").
      HER_ALONE: [rum, raus, rauf, runter, rüber]
      # Gaps the phrase table already covers, and "den Sinn" as an object ("was den Sinn ausmacht").
      COVERED_GAPS: [es, das, wenig, mehr, das keinen]
    maps:
      # The spoken short forms of her-/hin- particles and their full forms.
      HER_FULL:
        ran: [heran]
        rum: [herum]
        raus: [heraus, hinaus]
        rein: [herein, hinein]
        rauf: [herauf, hinauf]
        runter: [herunter, hinunter]
        rüber: [herüber, hinüber]
      # "Sinn machen" copies the English phrase; German says "Sinn ergeben".
      ERGEBEN:
        {
          macht: ergibt,
          machen: ergeben,
          machte: ergab,
          machten: ergaben,
          machst: ergibst,
          mache: ergebe,
          gemacht: ergeben,
        }
      # Clipped words of speech and their written forms ("Mathe", "Infos", "Kuli").
      CLIPPED:
        Mathe: [Mathematik]
        Info: [Information]
        Infos: [Informationen]
        Uni: [Universität]
        Unis: [Universitäten]
        Abi: [Abitur]
        Kuli: [Kugelschreiber]
        Kulis: [Kugelschreiber]
        Limo: [Limonade]
        Deo: [Deodorant]
        Klo: [Toilette]
        Reli: [Religion]
      # Spoken names of a measured quantity, and their written forms.
      QUANTITY_NAMES:
        volt: [elektrische Spannung]
        ampere: [elektrische Stromstärke]
        coulomb: [elektrische Ladung]
        watt: [Leistung]
        kilowatt: [Leistung]
        megawatt: [Leistung]
        ps: [Leistung]
        hertz: [Frequenz]
        joule: [Energie]
        kilogramm: [Gewicht, Masse]
        gramm: [Gewicht, Masse]
      QUANTITY_PLURAL:
        elektrische Spannung: elektrische Spannungen
        elektrische Stromstärke: elektrische Stromstärken
        elektrische Ladung: elektrische Ladungen
        Leistung: Leistungen
        Frequenz: Frequenzen
        Energie: Energien
        Gewicht: Gewichte
        Masse: Massen
      # "plus rechnen" (addieren) and "Plus-Rechnen" (Addition).
      ARITHMETIC: { plus: addier, minus: subtrahier, geteilt: dividier }
      RECHNEN_ENDINGS: { rechnen: en, rechnet: t, rechnest: st, rechne: e, gerechnet: t }
      OPERATION: { Plus: Addition, Minus: Subtraktion, Geteilt: Division, Mal: Multiplikation }
      # Spoken short forms: an article without "ei-" ("n netter Typ", "ne Frage"), a verb with
      # "es" or "du" joined to it ("ich mags", "gehts", "meinste").
      SPOKEN_ARTICLES: { n: ein, ne: eine, nen: einen, nem: einem, ner: einer }
      SPOKEN_JOINED:
        mags: mag es
        liebs: liebe es
        gebs: gebe es
        habs: habe es
        nehms: nehme es
        machs: mache es
        kenns: kenne es
        wills: will es
        kanns: kann es
        stehts: steht es
        gefällts: gefällt es
        gehts: geht es
        gibts: gibt es
        kommts: kommt es
        siehts: sieht es
        läufts: läuft es
        klappts: klappt es
        passts: passt es
        haste: hast du
        biste: bist du
        kannste: kannst du
        weißte: weißt du
        siehste: siehst du
        willste: willst du
        meinste: meinst du
        guckste: guckst du
        machste: machst du
        hörste: hörst du
        gehste: gehst du
        kommste: kommst du
    defs:
      # "Du brauchst nicht kommen" → "zu kommen": the particle of a separable verb.
      SPOKEN_SEPARABLE: /^(?:an|ab|auf|aus|bei|ein|mit|nach|vor|weg|zurück|her|hin|los|fest|zu|vorbei)/
      # A spoken form at text[start, end), unless it is the writer's word or English.
      spoken:
        args: "ctx: DetectContext, start: number, end: number, alternatives: string[]"
        type: RawFinding | null
        let:
          typed: ctx.text.slice(start, end)
        when:
          - "!ctx.dictionary.has(typed.toLowerCase()) && !namedExampleBefore(ctx.text, start)"
          - "!deEnglishLine(ctx.text, start)"
        return: >-
          ({ ruleId: "germanColloquial", messageKey: "review_msg_german_colloquial", range: { start, end }, alternatives,
          context: { start: Math.max(0, start - 40), end: end + 20 } })
      # A spoken measure at m, read from 64 characters before the chunk; null outside it.
      measure:
        args: "m: RegExpExecArray, ctx: DetectContext, alternatives: string[]"
        type: RawFinding | null
        when: "!(m.index < ctx.from || namedExampleBefore(ctx.text, m.index))"
        return: >-
          ({ ruleId: "germanColloquial", messageKey: "review_msg_german_colloquial", range: { start: m.index, end: m.index + m[0].length },
          alternatives, context: { start: Math.max(0, m.index - 40), end: m.index + m[0].length + 20 },
          ...(alternatives.length > 1 ? { requiresChoice: true as const } : {}) })
      # A verb form: an infinitive, a 1st singular or past form, a present form in -t or -st.
      herVerbForm:
        args: "word: string"
        return: >-
          word.length >= 3 && (germanVerbLike(word) || germanInfinitive(word) ||
          [`${word.replace(/e?s?t$/, "")}en`, `${word.replace(/t$/, "")}n`].some((infinitive) => infinitive !== word && germanInfinitive(infinitive)))
      # The verb after the particle: "bekommen", "zubekommen" (zu-infinitive), "gefallen" (a
      # participle: "ge" + stem + "t" or "en").
      herVerbAfter:
        args: "rest: string"
        let:
          participle: '/^ge(\p{Ll}{2,}?)(?:et|t|en)$/u.exec(rest)'
        return: >-
          herVerbForm(rest) || (rest.startsWith("zu") && herVerbForm(rest.slice(2))) ||
          (!!participle && [`${participle[1]}en`, `${participle[1]}n`].some((s) => germanInfinitive(s)))
    frames:
      # Spoken short forms (authored): an article without "ei-" ("n netter Typ", "ne Frage"),
      # a verb with "es" or "du" joined to it ("ich mags", "gehts", "meinste").
      - regex: "(?<![\\p{L}\\p{M}\\p{N}_'’.-])(?:(?<article>n|ne|nen|nem|ner)(?=[ \\t]+(?<adjective>\\p{Ll}+(?:e|en|er|es|em)[ \\t]+)?\\p{Lu}\\p{Ll})|(?<joined>[mM]ags|[lL]iebs|[gG]ebs|[hH]abs|[nN]ehms|[mM]achs|[kK]enns|[wW]ills|[kK]anns|[sS]tehts|[gG]efällts|[gG]ehts|[gG]ibts|[kK]ommts|[sS]iehts|[lL]äufts|[kK]lappts|[pP]assts|[hH]aste|[bB]iste|[kK]annste|[wW]eißte|[sS]iehste|[wW]illste|[mM]einste|[gG]uckste|[mM]achste|[hH]örste|[gG]ehste|[kK]ommste))(?![\\p{L}\\p{M}\\p{N}_'’-])"
        scan: owned
        flags: gu
        let:
          word: article ?? joined
        when: '!(article === "n" && !adjective)'
        return: >-
          spoken(ctx, m.index, m.index + word.length, [deLikeTyped(word, article ? SPOKEN_ARTICLES[article] : SPOKEN_JOINED[joined.toLowerCase()])])
      # "Du brauchst nicht kommen" → "zu kommen": "brauchen" with a negation or "nur" takes
      # "zu". The scan starts 80 characters before the chunk; the verb must be in the chunk.
      - regex: "(?<![\\p{L}\\p{M}])(?:[Bb]rauch(?:e|st|t|en|te|test|ten|tet))(?<middle>(?:[ \\t]+[\\p{L}\\p{M}]+){1,6}?)[ \\t]+(?<verb>\\p{Ll}{3,}(?:en|ern|eln))(?=[ \\t]*[.!?,;:\"\\u201C\\u201D]|[ \\t]*$)"
        scan: owned
        lookback: 80
        flags: gu
        let:
          words: middle.trim().split(/[ \t]+/)
          start: m.index + m[0].length - verb.length
          particle: SPOKEN_SEPARABLE.exec(verb)?.[0]
        when:
          - 'words.some((w) => /^(?:nicht|nie|kein\p{Ll}*|nur|bloß|erst)$/u.test(w))'
          - '!(words.includes("zu") || /zu\p{Ll}+en$/u.test(verb) || !germanInfinitive(verb))'
          - "!(start < ctx.from || start >= ctx.to)"
        return: >-
          spoken(ctx, start, start + verb.length, [particle && germanInfinitive(verb.slice(particle.length)) ? `${particle}zu${verb.slice(particle.length)}` : `zu ${verb}`])
      # A preposition with an interrogative "was" is spoken German; writing uses the wo(r)-
      # adverb: "Für was kämpft er?" (Wofür), "um was es geht" (worum). Not the indefinite
      # "was" ("für was Neues", "gegen was neues").
      - regex: "(?<![\\p{L}\\p{M}\\p{N}_-])(?<prep>[Aa]us|[Uu]m|[Aa]uf|[Ff]\\u00FCr|[Dd]urch|[Mm]it|[\\u00DC\\u00FC]ber|[Aa]n|[Vv]on|[Nn]ach|[Zz]u|[Ii]n|[Bb]ei|[Gg]egen|[Vv]or)[ \\t]+was(?![\\p{L}\\p{M}\\p{N}_-])"
        scan: owned
        flags: gu
        let:
          after: ctx.text.slice(m.index + m[0].length, m.index + m[0].length + 30)
          clause: '/^[^.!?,;:\n]*/.exec(after)![0]'
          before: ctx.text.slice(Math.max(0, m.index - 2), m.index)
          low: prep.toLowerCase()
        when:
          # "was Neues", "was neues", "was anderes": "etwas"; "Auf was für einem …": "was für".
          - '!/^[ \t]+(?:\p{Lu}|\p{Ll}+(?:es|e)(?![\p{L}])|für(?![\p{L}]))/u.test(after)'
          # "um was zu essen", "um was aufzubauen": "um … zu" with "etwas".
          - '!(/^[Uu]m$/.test(prep) && /(?<![\p{L}])zu(?![\p{L}])|\p{Ll}+zu\p{Ll}+en(?![\p{L}])/u.test(clause))'
          # The clause opens with it: a question or an indirect question after a comma.
          - '!(m.index > 0 && !/(?:^|[,;:\n„"]\s*|[.!?]\s+)$/.test(before))'
        return: >-
          ({ ruleId: "germanColloquial", messageKey: "review_msg_german_colloquial", range: { start: m.index, end: m.index + m[0].length },
          alternatives: [deLikeTyped(prep, /^[aeiouü]/.test(low) ? `wor${low}` : `wo${low}`)],
          context: { start: Math.max(0, m.index - 40), end: m.index + m[0].length + 20 } })
      # "Sinn machen" copies the English phrase; German says "Sinn ergeben". The phrase table
      # holds the adjacent forms; this frame takes the verb a few words before "Sinn" ("Das
      # macht für mich wenig Sinn", "Macht es vielleicht Sinn") and "Sinn zu machen". The scan
      # starts 64 characters before the chunk; the verb must be in the chunk.
      - regex: "(?<![\\p{L}\\p{M}\\p{N}_-])(?<verb>[Mm]acht|[Mm]achen|[Mm]achte|[Mm]achten|[Mm]achst|[Mm]ache)(?<gap>(?:[ \\t]+\\p{Ll}+){1,4}?)[ \\t]+(?:einen[ \\t]+|keinen[ \\t]+)?Sinn(?![\\p{L}\\p{M}\\p{N}_-])|Sinn[ \\t]+zu[ \\t]+(?<zu>machen)(?![\\p{L}\\p{M}\\p{N}_-])"
        scan: owned
        lookback: 64
        flags: gu
        let:
          typed: verb ?? zu
          start: "m.index + (verb ? 0 : m[0].length - zu.length)"
          words: (gap ?? "").trim().split(/[ \t]+/)
          rest: '/^[^.!?;:\n]*/.exec(ctx.text.slice(m.index + m[0].length))![0]'
        when:
          - "!(start < ctx.from || start >= ctx.to)"
          - '!(verb && (COVERED_GAPS.has(words.join(" ")) || /^d(?:en|em|es|er|ie)$/.test(words.at(-1)!)))'
          # "macht … Sinn aus": the verb "ausmachen", or a genitive after "Sinn" ("Sinn des Lebens").
          - '!/^[ \t]+(?:des|der|eines|einer)(?![\p{L}])|(?<![\p{L}])aus[ \t]*$/u.test(rest)'
          - "!namedExampleBefore(ctx.text, start) && !deEnglishLine(ctx.text, start)"
        return: >-
          ({ ruleId: "germanColloquial", messageKey: "review_msg_german_colloquial", range: { start, end: start + typed.length },
          alternatives: [deLikeTyped(typed, ERGEBEN[typed.toLowerCase()])], context: { start: m.index, end: m.index + m[0].length } })
      # Clipped words of speech and their written forms ("Mathe", "Infos", "Kuli").
      - regex: "(?<![\\p{L}\\p{M}\\p{N}_@/#.-])(?:Mathe|Info|Infos|Uni|Unis|Abi|Kuli|Kulis|Limo|Deo|Klo|Reli)(?![\\p{L}\\p{M}\\p{N}_@/#-])"
        scan: owned
        flags: gu
        let:
          word: m[0]
          after: ctx.text.slice(m.index + word.length, m.index + word.length + 24)
          before: ctx.text.slice(Math.max(0, m.index - 12), m.index)
        when:
          # "Info-Abend", "Uni Hamburg", "NDR Info", "Info 2": part of a name or compound.
          - '!/^(?:-|[ \t]+(?:\p{Lu}\p{L}*(?!\p{L})|\p{N}))/u.test(after)'
          - '!/\p{Lu}{2,}[ \t]+$/u.test(before)'
          - "!ctx.dictionary.has(word.toLowerCase()) && !namedExampleBefore(ctx.text, m.index)"
          - "!deEnglishLine(ctx.text, m.index)"
        return: >-
          ({ ruleId: "germanColloquial", messageKey: "review_msg_german_colloquial", range: { start: m.index, end: m.index + word.length },
          alternatives: [...CLIPPED[word]], context: { start: Math.max(0, m.index - 40), end: m.index + word.length + 20 } })
      # Spoken names of a measured quantity and of arithmetic, and their written forms: "die
      # Voltzahl" (elektrische Spannung), "5 Kilo" (Kilogramm), "plus rechnen" (addieren),
      # "schneller als 50 Kilometer" (Kilometer pro Stunde: a speed, not a distance). These
      # scans start 64 characters before the chunk; a match must start in the chunk.
      - regex: "(?<![\\p{L}\\p{N}-])(?<unit>Volt|Ampere|Coulomb|Watt|Kilowatt|Megawatt|PS|Hertz|Joule|Kilogramm|Gramm)-?[Zz]ahl(?<plural>en)?(?![\\p{L}\\p{N}-])"
        scan: owned
        lookback: 64
        flags: gu
        return: >-
          measure(m, ctx, plural ? QUANTITY_NAMES[unit.toLowerCase()].map((n) => QUANTITY_PLURAL[n]) : [...QUANTITY_NAMES[unit.toLowerCase()]])
      # The word first, then a bounded look back: cheap on long runs of spaces without the
      # regex JIT.
      - regex: "(?<![\\p{L}\\p{N}-])Kilo(?![\\p{L}\\p{N}-])(?<=(?:{{NUMBER_WORD}})[ \\t]{1,8}Kilo)"
        scan: owned
        lookback: 64
        flags: gu
        return: measure(m, ctx, ["Kilogramm"])
      - regex: "(?<![\\p{L}\\p{N}-])Kilometer(?![\\p{L}\\p{N}-])(?:(?<=(?:schneller|langsamer)[ \\t]{1,8}als[ \\t]{1,8}(?:\\d+(?:,\\d+)?|\\p{Ll}+)[ \\t]{1,8}Kilometer)(?![ \\t]+(?:pro|je|in)(?![\\p{L}]))|(?<=(?:{{NUMBER_WORD}})[ \\t]{1,8}Kilometer)(?=[ \\t]{1,8}(?:schneller|langsamer)(?![\\p{L}])))"
        scan: owned
        lookback: 64
        flags: gu
        when: >-
          !/(?<!\p{L})(?:die|diese|den|der|alle|ersten|letzten)[ \t]+\S+[ \t]+$/u.test(ctx.text.slice(Math.max(0, m.index - 30), m.index))
        return: measure(m, ctx, ["Kilometer pro Stunde"])
      - regex: "(?<![\\p{L}\\p{N}-])(?<op>plus|minus|geteilt)[ \\t]+(?<verb>rechnen|rechnet|rechnest|rechne|gerechnet)(?![\\p{L}\\p{N}-])"
        scan: owned
        lookback: 64
        flags: gu
        return: "measure(m, ctx, [`${ARITHMETIC[op]}${RECHNEN_ENDINGS[verb]}`])"
      - regex: "(?<![\\p{L}\\p{N}-])(?<op>Plus|Minus|Geteilt|Mal)-Rechnen(?![\\p{L}\\p{N}-])"
        scan: owned
        lookback: 64
        flags: gu
        return: measure(m, ctx, [OPERATION[op]])
      # The spoken short forms of her-/hin- particles before a verb ("reingehen", "rumsitzen"),
      # and "rum", "rüber", "runter", "rauf", "raus" on their own.
      - regex: "(?<![\\p{L}\\p{M}\\p{N}_\\-'\\u2019])(?<short>[Rr](?:an|um|aus|ein|auf|unter|\\u00FCber))(?<rest>\\p{Ll}*)(?![\\p{L}\\p{M}\\p{N}_\\-'\\u2019])"
        scan: owned
        flags: gu
        let:
          word: m[0]
          low: word.toLowerCase()
          key: short.toLowerCase()
          capital: short !== key
          before: ctx.text.slice(Math.max(0, m.index - 60), m.index)
          after: ctx.text.slice(m.index + word.length, m.index + word.length + 12)
          alternatives: >-
            HER_FULL[key].map((full) => capital ? (full + rest)[0].toUpperCase() + (full + rest).slice(1) : full + rest)
        when:
          # A dictionary word of its own ("rangieren", "Ranzen"); the dictionary also lists a few
          # colloquial raus- verbs ("rauslassen"), which stay checked. Capitalized inside a sentence: a
          # noun ("die Rangliste"), unless a verb made one ("zum Rumprobieren"). "Rum" alone is the drink.
          - >-
            rest ? !((germanVerbLike(low) || germanInfinitive(low) || germanNounReading(low) !== null) && key === "ran") &&
            !(capital && !/(?:en|ern|eln)$/.test(rest) && !/(?:^|[.!?:\n„“"»«])[ \t]*$/.test(ctx.text.slice(Math.max(0, m.index - 4), m.index))) &&
            herVerbAfter(rest)
            : !capital && HER_ALONE.has(key)
          # Idioms with no written twin: "sich an jemanden ranmachen", "ans Telefon rangehen", "jemandem
          # eine runterhauen", "rum wie num"; and "rein- und rausschlüpfen".
          - '!(/^ran(?:zu|ge)?mach/.test(low) || (/^rum$/.test(low) && /^\s+wie\s/.test(after)))'
          - "!(/^ran(?:zu|ge)?geh|^ranging/.test(low) && /Telefon|Handy/.test(before))"
          - '!(/^runter/.test(low) && /(?<!\p{L})einen?\s+$/u.test(before))'
          - '!/-\s+(?:und|oder)\s+$/.test(before)'
          - "!ctx.dictionary.has(low) && !namedExampleBefore(ctx.text, m.index)"
          - "!deEnglishLine(ctx.text, m.index)"
        return: >-
          ({ ruleId: "germanColloquial", messageKey: "review_msg_german_colloquial", range: { start: m.index, end: m.index + word.length },
          alternatives, context: { start: Math.max(0, m.index - 40), end: m.index + word.length },
          ...(alternatives.length > 1 ? { requiresChoice: true as const } : {}) })
  - id: de.recommended
    checks: [germanRecommendedSpelling]
    style: match
    message: review_msg_german_recommended_spelling
    sets:
      # The adverb and participle pairs the Duden joins ("vielsagend").
      JOINED_PAIRS:
        [
          viel sagend,
          hoch begabt,
          schwer behindert,
          allein erziehend,
          hoch geschätzt,
          wohl erzogen,
          wohl temperiert,
        ]
      # The joined pairs the Duden writes apart ("tief betrübt").
      APART_PAIRS:
        [
          tiefbetrübt,
          tiefhängend,
          hochkompliziert,
          vielbeschäftigt,
          nichtrostend,
          freistehend,
          rotlackiert,
          neubekehrt,
        ]
    defs:
      # The Greek "ph" and its German "f", in each casing.
      PH_SPELLINGS: >-
        [[/phantas/g, "fantas"], [/Phantas/g, "Fantas"], [/PHANTAS/g, "FANTAS"], [/PHOTO/g, "FOTO"],
        [/graph/g, "graf"], [/Graph/g, "Graf"], [/GRAPH/g, "GRAF"], [/phon/g, "fon"], [/elphin/g, "elfin"],
        [/^Photo/, "Foto"], [/^photo/, "foto"], [/(?<=\p{L})photo/gu, "foto"]] as [RegExp, string][]
      # The finding for the group `name` of m, unless it is already right or the writer's word.
      recommendedFinding:
        args: "ctx: DetectContext, m: RegExpExecArray, name: string, replacement: string"
        type: RawFinding | null
        let:
          typed: m.groups![name]
          span: m.indices!.groups![name]
        when:
          - replacement !== typed && !ctx.dictionary.has(typed.toLowerCase())
          - "!namedExampleBefore(ctx.text, span[0])"
        return: >-
          ({ ruleId: "germanRecommendedSpelling", messageKey: "review_msg_german_recommended_spelling",
          range: { start: span[0], end: span[1] }, alternatives: [replacement],
          context: { start: Math.max(0, span[0] - 30), end: span[1] + 30 } })
    frames:
      # "Geographie", "Paragraph", "Photographin", "Mikrophon", "Phantasie", "Delphin": a Greek
      # ph German now writes f. "Graph" and "Graphen" (graphene) alone, "Phonetik",
      # "Philosophie" stay.
      - regex: "{{WG}}(?:(?<target>\\p{L}*?(?:[Gg]eo|[Bb]io|[Pp]ara|[Ff]oto|[Pp]hoto|[Oo]rtho|[Kk]rypto|[Cc]horeo|[Tt]ele|[Kk]alli|[Tt]opo|[Ee]thno|[Dd]emo|[Ss]teno|[Ll]itho|[Hh]olo|[Ss]eismo|[Kk]arto|[Tt]ypo)graph\\p{Ll}*|\\p{L}*?(?:[Mm]ikro|[Ss]axo|[Xx]ylo|[Mm]ega|[Gg]rammo|[Tt]ele)phon(?:e|en|s|es|ist|istin|istinnen|isten)?|\\p{Lu}*?(?:GEO|BIO|PARA|FOTO|PHOTO|ORTHO|KRYPTO|CHOREO|TELE|TOPO|TYPO)GRAPH\\p{Lu}*|(?:[Pp]hantas(?:ie|ien|tisch|tische[nmrs]?|ievoll|ievolle[nmrs]?|ielos|t|ten|tin)|PHANTASIE)|[Gg]raphi(?:k|ken|sch|sche|schen|scher|sches|schem|ker|kerin)|[Dd]elphin(?:e|en|s)?|[Pp]hoto(?:s|apparat|album|kopie)?)){{E}}"
        flags: dgu
        when:
          - >-
            !/^(?:graph|graphen|graphs|graphe)$/i.test(target)
          - >-
            !/["„“”«»'‚‘]$|Deutsche[ \t]+$/.test(ctx.text.slice(Math.max(0, m.index - 10), m.index))
        return: >-
          recommendedFinding(ctx, m, "target", PH_SPELLINGS.reduce((word, [from, to]) => word.replace(from, to), target))
      # A preposition and a noun the Duden recommends joining, where the phrase is that adverb
      # ("auf Grund des Wetters", "an Hand der Daten"); stylePhrasing has "infrage",
      # "zugunsten" and the like.
      - regex: "{{WG}}(?:(?<target>[aA]uf{{S}}Grund)(?={{S}}(?:des|der|dessen|deren|von|eines|einer|seines|seiner|ihres|ihrer){{E}}|[ \\t]*[.!?,;]|{{S}}(?:\\p{Ll}+{{S}}){0,3}(?:des|der|dessen|deren|von|eines|einer|seines|seiner|ihres|ihrer){{E}})){{E}}"
        flags: dgu
        return: >-
          recommendedFinding(ctx, m, "target", deLikeTyped(target, target.replace(/[ \t ]/g, "").toLowerCase()))
      - regex: "{{WG}}(?:(?<target>[aA]n{{S}}Hand)(?={{S}}(?:des|der|von|eines|einer|dieser|dieses){{E}}|[ \\t]*[.!?,;]|{{S}}(?:\\p{Ll}+{{S}}){0,3}(?:des|der|von|eines|einer|dieser|dieses){{E}})){{E}}"
        flags: dgu
        return: >-
          recommendedFinding(ctx, m, "target", deLikeTyped(target, target.replace(/[ \t ]/g, "").toLowerCase()))
      - regex: "{{WG}}(?:(?<target>[zZ]u{{S}}Tage)(?={{S}}(?:treten|tritt|trat|traten|getreten|fördern|fördert|förderte|gefördert|bringen|gebracht){{E}}|[ \\t]*[.!?,;]|{{S}}(?:\\p{Ll}+{{S}}){0,3}(?:treten|tritt|trat|traten|getreten|fördern|fördert|förderte|gefördert|bringen|gebracht){{E}})){{E}}"
        flags: dgu
        return: >-
          recommendedFinding(ctx, m, "target", deLikeTyped(target, target.replace(/[ \t ]/g, "").toLowerCase()))
      - regex: "{{WG}}(?:(?<target>[zZ]u{{S}}Rande)(?={{S}}(?:kommen|kommt|kam|kamen|gekommen){{E}}|[ \\t]*[.!?,;]|{{S}}(?:\\p{Ll}+{{S}}){0,3}(?:kommen|kommt|kam|kamen|gekommen){{E}})){{E}}"
        flags: dgu
        return: >-
          recommendedFinding(ctx, m, "target", deLikeTyped(target, target.replace(/[ \t ]/g, "").toLowerCase()))
      - regex: "{{WG}}(?:(?<target>[iI]n{{S}}Stand)(?={{S}}(?:setzen|setzt|setzte|gesetzt|halten|hält|hielt|gehalten|zu{{S}}setzen){{E}}|[ \\t]*[.!?,;]|{{S}}(?:\\p{Ll}+{{S}}){0,3}(?:setzen|setzt|setzte|gesetzt|halten|hält|hielt|gehalten|zu{{S}}setzen){{E}})){{E}}"
        flags: dgu
        return: >-
          recommendedFinding(ctx, m, "target", deLikeTyped(target, target.replace(/[ \t ]/g, "").toLowerCase()))
      # The Duden spells "To-do", "To-dos" and "To-do-Liste": "ToDo", "Todos", "TODO", "Todo
      # Liste".
      - regex: "{{WG}}(?:(?<target>(?:ToDo|Todo|TODO|To-Do|To{{S}}Do)(?<plural>s)?(?:(?<list>-?Liste|{{S}}Liste|-?Lists?|liste)(?<lists>n)?)?)){{E}}"
        flags: dgu
        let:
          many: '!!lists || !!list?.endsWith("s") || (!list && !!plural)'
        return: >-
          recommendedFinding(ctx, m, "target", list ? `To-do-Liste${many ? "n" : ""}` : `To-do${many ? "s" : ""}`)
      # An adverb and a participle the Duden recommends joining: "ein viel sagender Blick"
      # (vielsagender), "hoch begabt", "schwer behindert", "allein erziehend".
      - regex: "{{WG}}(?:(?<target>(?<lead>[Vv]iel|[Hh]och|[Ss]chwer|[Aa]llein|[Ww]ohl){{S}}(?<rest>(?<stem>sagend|begabt|behindert|erziehend|geschätzt|erzogen|temperiert)(?:e|en|er|es|em)?))){{E}}"
        flags: dgu
        when:
          - >-
            !(/^[Ww]ohl$/.test(lead) && rest === stem)
          - >-
            JOINED_PAIRS.has(`${lead.toLowerCase()} ${stem}`)
        return: recommendedFinding(ctx, m, "target", lead + rest)
      # "recht haben", "recht geben" (the Duden prefers lowercase over "Recht haben"), and "bis
      # auf Weiteres", "ohne Weiteres" (it prefers the capital). "das Recht haben" is the noun.
      - regex: "{{WG}}(?:(?<!(?:{{RECHT_NOT_AFTER}}){{S}})(?<=\\p{Ll}{{S}})(?<target>Recht)(?={{S}}(?:{{RIGHT_VERBS}}){{E}})|(?<!(?:{{RECHT_NOT_AFTER}}){{S}})(?<=(?:{{RIGHT_VERBS}})(?:{{S}}\\p{Ll}+){0,3}{{S}})(?<t2>Recht)(?=[ \\t]*[.!?,;])|(?<=(?:bis{{S}}auf|[Oo]hne|[Dd]es){{S}})(?<t3>weiteres|weiteren)(?=[ \\t]*[.!?,;]|{{S}}\\p{Ll})){{E}}"
        flags: dgu
        owner: target|t2|t3
        return: >-
          t3 ? recommendedFinding(ctx, m, "t3", `W${t3.slice(1)}`) : recommendedFinding(ctx, m, target ? "target" : "t2", "recht")
      # An adverb and a participle the Duden recommends writing apart: "tiefbetrübt" (tief
      # betrübt), "nichtrostend", "freistehend".
      - regex: "{{WG}}(?:(?<target>(?<lead>[Tt]ief|[Hh]och|[Vv]iel|[Nn]icht|[Ff]rei|[Rr]ot|[Nn]eu)(?<rest>(?:betrübt|hängend|kompliziert|beschäftigt|rostend|stehend|lackiert|bekehrt)(?:e|en|er|es|em)?))){{E}}"
        flags: dgu
        when: >-
          APART_PAIRS.has(lead.toLowerCase() + rest.replace(/(?:e|en|er|es|em)$/, ""))
        return: recommendedFinding(ctx, m, "target", `${lead} ${rest}`)
      # "Wir sind zuhause", "bekanntgegeben", "verlorengegangen": written apart.
      - regex: "{{WG}}(?:(?<target>zuhause)|(?<t2>(?<lead>bekannt|verloren)(?<verb>gegeben|gab|gaben|geben|gibt|zugeben|gemacht|machte|machten|machen|macht|zumachen|gegangen|ging|gingen|gehen|geht|zugehen))){{E}}"
        flags: dgu
        owner: target|t2
        return: >-
          target ? recommendedFinding(ctx, m, "target", "zu Hause") : recommendedFinding(ctx, m, "t2", `${lead} ${verb.replace(/^zu(?=\p{Ll}{3})/u, "zu ")}`)
  - id: de.redundancy
    checks: [stylePhrasing]
    style: match
    message: review_msg_style_phrasing
    maps:
      # Adjective stem: the nouns it repeats.
      REDUNDANT_NOUNS:
        rund: [Kugel, Kreis]
        weiß: [Schimmel]
        schwarz: [Rappe]
        tot: [Leiche, Leichnam]
        alt: [Greis, Greisin]
        ander: [Alternative]
        selten: [Rarität]
        falsch: [Trugschluss, Irrtum]
        zeitlich: [Verzögerung, Verspätung, Dauer]
        semantisch: [Bedeutung]
        viereckig: [Quadrat]
        jüdisch: [Synagoge]
        islamisch: [Moschee]
        katholisch: [Papst]
        akustisch: [Klang]
        einvernehmlich: [Konsens]
        wahr: [Tatsache, Fakt]
        problematisch: [Problem]
        künstlich: [Artefakt]
        üblich: [Gepflogenheit]
        überflüssig: [Ballast]
        schriftlich: [Klausur]
        neu: [Neuheit, Innovation, Novität]
        groß: [Riese]
        klein: [Zwerg]
        leer: [Vakuum]
        letzt: [Ultimatum]
        gemeinsam: [Kooperation, Zusammenarbeit]
        ehemalig: [Exfreund, Exfreundin, Expartner, Expartnerin]
      # First part: the heads it repeats ("Glas" in "Glasvitrine").
      REDUNDANT_HEADS:
        Trommel: [revolver]
        Glas: [vitrine]
        Fuß: [pedal]
        Baum: [allee]
        Außen: [fassade]
        Eier: [omelett, omelette]
        Papp: [karton]
        Internet: [blog]
        Alt: [veteran]
        Billig: [discounter]
        Haar: [frisur]
        Gesichts: [mimik]
        Vogel: [voliere]
        Holz: [xylophon, xylofon]
        Zeit: [verzögerung]
        Haupt: [protagonist, protagonistin]
        Einzel: [individuum]
        Lebens: [biografie, biographie]
        Rück: [erinnerung]
    defs:
      # The advice to drop the repeated part: `fix` replaces text[start, end).
      redundancyAdvice:
        args: "ctx: DetectContext, start: number, end: number, fix: string"
        type: RawFinding | null
        let:
          typed: ctx.text.slice(start, end)
        when: "!ctx.dictionary.has(typed.toLowerCase()) && !namedExampleBefore(ctx.text, start)"
        return: >-
          ({ ruleId: "stylePhrasing", messageKey: "review_msg_style_phrasing", range: { start, end },
          alternatives: [fix], context: { start, end } })
    frames:
      # An adjective that the noun already says ("eine runde Kugel", "die toten Leichen", "eine
      # weibliche Ärztin": a feminine person noun says it already).
      - regex: "{{WG}}(?<adj>(?<stem>{{REDUNDANT_STEMS}})(?:e|en|er|es|em)?){{S}}(?<noun>\\p{Lu}\\p{Ll}+){{E}}"
        flags: dgu
        owner: adj
        when: >-
          stem.toLowerCase() === "weiblich" ? [/^(\p{Lu}\p{Ll}+?)in(?:nen)?$/u.exec(noun)?.[1]?.toLowerCase()].some((base) => !!base && [base, deumlaut(base)].some((b) => germanNounReading(b) !== null)) : REDUNDANT_NOUNS[stem.toLowerCase()].some((n) => new RegExp(`^${n}(?:e|en|n|s|es|er|ern|nen)?$`, "u").test(noun))
        return: redundancyAdvice(ctx, m.indices!.groups!.adj[0], m.indices!.groups!.noun[1], noun)
      # A compound whose first part the second already says ("Glasvitrine", "Fußpedal").
      - regex: "{{WG}}(?<prefix>Trommel|Glas|Fuß|Baum|Außen|Eier|Papp|Internet|Alt|Billig|Haar|Gesichts|Vogel|Holz|Zeit|Haupt|Einzel|Lebens|Rück)(?<head>revolver|vitrine|pedal|allee|fassade|omelett|omelette|karton|blog|veteran|discounter|frisur|mimik|voliere|xylophon|xylofon|verzögerung|protagonist|protagonistin|individuum|biografie|biographie|erinnerung)(?<ending>{{NOUN_ENDING}}){{E}}"
        flags: dgu
        owner: prefix
        when: REDUNDANT_HEADS[prefix].includes(head)
        return: >-
          redundancyAdvice(ctx, m.index, m.index + m[0].length, head[0].toUpperCase() + head.slice(1) + ending)
  - id: de.anglicisms
    checks: [germanCompounds]
    style: match
    message: review_msg_closed_compound
    maps:
      # An English noun of a verb and a particle (Duden): "Check-in", "Make-up", "Burn-out".
      PHRASAL_PAIRS:
        check: [in, out]
        make: [up]
        stand: [up]
        burn: [out]
        pop: [up]
        add: ["on"]
        plug: [in]
        log: [in, out]
        drive: [in]
        buy: [out, in]
        kick: ["off"]
        follow: [up]
        push: [up]
        coming: [out]
        roll: [out]
        set: [up]
        sit: [in]
        warm: [up]
        cool: [down]
        start: [up]
        take: ["off"]
        pick: [up]
        walk: [in]
        knock: [out]
        teach: [in]
        break: [even]
        must: [have]
    sets:
      # Written as one word, these are wrong too; "Plugin", "Popup", "Setup" and "Startup" are in use.
      PHRASAL_JOINED_WRONG:
        [
          checkin,
          checkout,
          makeup,
          standup,
          drivein,
          pushup,
          comingout,
          followup,
          kickoff,
          breakeven,
          musthave,
        ]
    frames:
      # A capital first part (a German noun), then the particle: apart, with a hyphen, or joined.
      - regex: "{{WG}}(?<target>(?<verb>[C]heck|[M]ake|[S]tand|[B]urn|[P]op|[A]dd|[P]lug|[L]og|[D]rive|[B]uy|[K]ick|[F]ollow|[P]ush|[C]oming|[R]oll|[S]et|[S]it|[W]arm|[C]ool|[S]tart|[T]ake|[P]ick|[W]alk|[K]nock|[T]each|[B]reak|[M]ust)(?<sep>[ \\t]+|-)?(?<particle>[iI]n|[oO]ut|[uU]p|[oO]n|[oO]ff|[dD]own|[eE]ven|[hH]ave)(?<plural>s)?)(?![\\p{L}\\p{N}-])(?![ \\t]+\\p{Lu})"
        flags: dgu
        let:
          low: verb.toLowerCase()
          span: m.indices!.groups!.target
        when:
          - PHRASAL_PAIRS[low].includes(particle.toLowerCase())
          - '!(sep === "-" && particle === particle.toLowerCase())'
          - "!(!sep && !PHRASAL_JOINED_WRONG.has(low + particle.toLowerCase()))"
          - >-
            !(particle === "in" && sep !== "-" && /^(?:der|die|das|den|dem|des|(?:k?ein|mein|dein|sein|ihr|unser|eu[e]?r|dies|jen|jed|welch)\p{L}*|\p{N}.*)$/iu.test(deTokensAfter(ctx.text, span[1], 1)[0] ?? ""))
          - "!ctx.dictionary.has(target.toLowerCase()) && !deEnglishLine(ctx.text, span[0])"
          - "!namedExampleBefore(ctx.text, span[0])"
        return: >-
          ({ ruleId: "germanCompounds", messageKey: "review_msg_closed_compound", range: { start: span[0], end: span[1] }, alternatives: [`${verb}-${particle.toLowerCase()}${plural ?? ""}`], context: { start: span[0], end: span[1] } })
  - id: de.joinedVerbs
    checks: [germanJoinedVerbs]
    style: match
    message: review_msg_closed_compound
    maps:
      # The forms of the strong and irregular verbs below that a stem does not give.
      JOINED_IRREGULAR:
        nehmen: nimmt nimmst nahm nahmen genommen
        lassen: lässt ließ ließen gelassen
        sehen: sieht siehst sah sahen gesehen
        schreiben: schrieb schrieben geschrieben
        gehen: ging gingen gegangen
        laufen: läuft lief liefen gelaufen
        geben: gibt gibst gab gaben gegeben
        halten: hält hielt hielten gehalten
        treten: tritt trat traten getreten
        stehen: stand standen gestanden
        sprechen: spricht sprach sprachen gesprochen
        heißen: hieß hießen geheißen
        fallen: fällt fiel fielen gefallen
        tun: tue tust tut tat taten getan
        haben: habe hast hat habt hatte hatten gehabt
        kommen: kam kamen gekommen
        werden: wird wurde wurden geworden
        fahren: fährt fuhr fuhren gefahren
        ziehen: zog zogen gezogen
        bringen: brachte brachten gebracht
        schließen: schloss schlossen geschlossen
        sitzen: saß saßen gesessen
        wohnen: ""
      # First parts that never stand alone, with their verbs (germanCompounds, on by default).
      JOINED_BOUND:
        zunichte: machen werden
        inne: haben halten wohnen werden
        zuteil: werden
        vonstatten: gehen
        zugute: kommen halten
        preis: geben
      # Adjectives and adverbs that make one verb of one meaning with these verbs
      # (germanJoinedVerbs, opt-in). "zusammen", "wohl", "frei" and "gut schreiben" are left out:
      # both readings are common. "den Sekt kalt stellen" is literal. "wieder gut machen",
      # "wieder gutmachen": wiedergutmachen.
      JOINED_OPEN:
        fest: nehmen legen stellen halten setzen schreiben machen fahren
        klar: machen stellen kommen
        kalt: lassen
        krank: schreiben melden
        hoch: gehen rechnen laden stufen
        groß: schreiben ziehen
        klein: schreiben reden
        schwarz: sehen arbeiten fahren
        rot: sehen
        schief: gehen laufen
        glatt: gehen
        zufrieden: lassen geben stellen
        allein: lassen
        satt: haben
        gut: tun heißen
        heilig: sprechen
        kürzer: treten
        schwer: fallen tun
        sicher: stellen
        kurz: fassen schließen
        nahe: stehen treten legen bringen gehen
        wiedergut: machen
        wieder: gutmachen
    defs:
      # The forms of an infinitive, each with its kind: "machen" → "macht" (finite), "gemacht"
      # (participle), "gemachte" (attribute).
      joinedVerbForms:
        args: "infinitive: string"
        let:
          irregular: JOINED_IRREGULAR[infinitive]
          stem: infinitive.replace(/e?n$/, "")
          e: '/[td]$/.test(stem) ? "e" : ""'
          regular: irregular === undefined || irregular === ""
          participles: 'regular ? [`ge${stem}${e}t`] : irregular.split(" ").filter((f) => f.startsWith("ge"))'
          finite: >-
            regular ? ["e", "st", "t", "te", "ten", "test"].map((end) => stem + (end === "e" ? "" : e) + end)
            : [...irregular.split(" ").filter((f) => !f.startsWith("ge")), `${stem}e`]
        return: >-
          new Map<string, string>([[infinitive, "infinitive"], ...finite.map((f) => [f, "finite"] as [string, string]),
          ...participles.flatMap((p) => [[p, "participle"] as [string, string], ...["e", "en", "er", "es", "em"].map((end) => [p + end, "attribute"] as [string, string])])])
      # Each first part: the forms of its verbs.
      joinedTables:
        args: "table: Readonly<Record<string, string>>"
        return: >-
          new Map(Object.entries(table).map(([first, verbs]) => [first, new Map(verbs.split(" ").flatMap((verb) => [...joinedVerbForms(verb)]))] as [string, Map<string, string>]))
      JOINED_BOUND_FORMS: joinedTables(JOINED_BOUND)
      JOINED_OPEN_FORMS: joinedTables(JOINED_OPEN)
      # Words before the first part that make it a plain adverb: "genauso gut tun", "zu nahe treten".
      JOINED_DEGREE: /^(?:zu|allzu|so|genauso|ebenso|ganz|besonders|ziemlich|recht|wie|eher)$/
      JOINED_KOMMEN: /^(?:kommen|kommt|kam|kamen|käme|kämen|gekommen)$/
      joinedVerbFinding:
        args: 'ruleId: "germanCompounds" | "germanJoinedVerbs", start: number, end: number, fix: string'
        type: RawFinding
        return: >-
          ({ ruleId, messageKey: "review_msg_closed_compound", range: { start, end }, alternatives: [fix],
          context: { start: Math.max(0, start - 40), end: end + 20 } })
      # Whether the clause goes on after a verb form of this kind. "zufrieden lassen sie": the
      # finite verb of a main clause, then its subject.
      joinedCloses:
        args: "kind: string, after: string[]"
        let:
          next: after[0] ?? ""
        return: >-
          kind === "attribute" ? /^\p{Lu}/u.test(next) : BOUNDARY.test(next) || next === "und" || next === "oder" ? true
          : kind === "finite" || PRONOUNS.has(next) ? false : VERB_GOVERNORS.has(next) || germanVerbLike(next)
      # The first part of m and its verb, joined when the verb ends its clause. "Preis" is a noun
      # after a determiner or an adjective ("einen hohen Preis geben"). "zu teil.", "von
      # statten", "Er gab es nicht Preis.": the bound part alone, at the end. "preis geben",
      # "zugute kommen": the infinitive frame of de.compounds joins these.
      joinedFinding:
        args: 'ctx: DetectContext, m: RegExpExecArray, table: Map<string, Map<string, string>>, ruleId: "germanCompounds" | "germanJoinedVerbs"'
        type: RawFinding | null
        let:
          typed: m.groups!.first
          first: typed.replace(/[ \t ]+/g, "").toLowerCase()
          zu: m.groups!.zu
          verb: m.groups!.verb
          start: m.indices!.groups!.first[0]
          end: m.index + m[0].length
          before: deTokensBefore(ctx.text, start, 6)
          prior: (before.at(-1) ?? "").toLowerCase()
          after: deTokensAfter(ctx.text, end, 2)
          kind: "verb ? table.get(first)?.get(verb) : undefined"
        when:
          - "!JOINED_DEGREE.test(prior)"
          - '!(typed === "Preis" && !/^(?:nicht|nie|es|sich|alles|nichts|kaum|nur|gern|gerne|sofort)$/.test(prior))'
        return: >-
          !kind || (zu && kind !== "infinitive")
          ? (ruleId !== "germanCompounds" || verb || !BOUNDARY.test(after[0] ?? "") ||
          (first === "preis" && !before.some((t) => /^(?:gab|gibt|gaben|gebe|gibst)$/.test(t))) || !/[ \t]|^Preis$/.test(typed)
          ? null : joinedVerbFinding(ruleId, start, start + typed.length, first))
          : kind === "infinitive" && (typed === "preis" || typed === "zugute") ? null
          : !joinedCloses(kind, after) ? null : joinedVerbFinding(ruleId, start, end, `${first}${zu ? "zu" : ""}${verb}`)
    frames:
      # An adjective or adverb written apart from a verb with which it makes one verb: "fest
      # genommen" (festgenommen), "schief gehen" (schiefgehen).
      - regex: "{{WG}}(?:(?<first>wieder{{S}}gut|fest|klar|kalt|krank|hoch|groß|klein|schwarz|rot|schief|glatt|zufrieden|allein|satt|gut|heilig|kürzer|schwer|sicher|kurz|nahe|wieder)(?<zu>{{S}}zu)?{{S}}(?<verb>\\p{Ll}+){{E}})"
        flags: dgu
        owner: first
        return: joinedFinding(ctx, m, JOINED_OPEN_FORMS, "germanJoinedVerbs")

