        args: >-
          ctx: DetectContext, m: RegExpExecArray, parsed: GermanDeterminer, typed: string, head: string, reading: GermanGenderReading,
          adjectives: string[], typedReadings: [GermanCaseGender, GermanCase][], before: string[], prior: string, nounEnd: number,
