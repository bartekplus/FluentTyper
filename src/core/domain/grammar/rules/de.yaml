      - regex: "{{WG}}(?:(?<=(?:[Kk]eine|[Ww]eder){{S}})(?<target>kosten)(?={{S}}(?:und|noch){{S}}[Mm]ühen{{E}})|(?<=(?:[Kk]eine|[Ww]eder){{S}}[Kk]osten{{S}}(?:und|noch){{S}})(?<t2>mühen)){{E}}"
        flags: dgu
        owner: target|t2|t3|t4|t5
        when:
          - "idiomOpen(m, ctx)"
        return: "idiomFinding(m, ctx, frame, capitalize(m.groups!.target ?? m.groups!.t2))"
      # "auf dem gewissen haben", "mit meinem gewissen vereinbaren", "das schlechte gewissen": the
      # noun, with no noun after it that the adjective "gewiss" could qualify.
      - regex: "{{WG}}(?:(?<=(?:auf{{S}}dem|meinem|deinem|seinem|ihrem|unserem|euerem|Ihrem|reinem|ruhigem|gutem|schlechtem){{S}})(?<target>gewissen)(?={{S}}(?:haben|hat|hatte|hatten|hast|habe|gehabt|vereinbaren|zu{{S}}vereinbaren|lasten|belasten){{E}}|[ \t]*[.!?,;])|(?<=(?:schlechte|schlechtes|gute|gutes|reine|reines|ruhige|ruhiges|schlechten|guten|reinen){{S}})(?<t2>gewissen)(?=[ \t]*[.!?,;]|{{S}}(?:haben|hat|hatte|hast|habe|plagt|plagte|quält|quälte|machen|gemacht|beruhigen){{E}})){{E}}"
        flags: dgu
        owner: target|t2|t3|t4|t5
        when:
          - "idiomOpen(m, ctx)"
        return: 'idiomFinding(m, ctx, frame, "Gewissen")'
      # "das nachsehen haben": the loser's share, a noun before a form of "haben".
      - regex: "{{WG}}(?:(?<=[Dd]as{{S}})(?<target>nachsehen)(?={{S}}(?:haben|hat|hatte|hatten|hast|habe|gehabt){{E}})|(?<=(?:hat|hatte|hatten|hast|habe|haben|hätte|hätten)(?:{{S}}\\p{L}+){0,3}{{S}}das{{S}})(?<t2>nachsehen)(?=[ \\t]*[.!,;])){{E}}"
        flags: dgu
        owner: target|t2|t3|t4|t5
        when:
          - "idiomOpen(m, ctx)"
        return: 'idiomFinding(m, ctx, frame, "Nachsehen")'
      # "im aus", "ins aus gerollt", "das aus für": the noun.
      - regex: "{{WG}}(?:(?<=(?:im|ins){{S}})(?<target>aus)(?=[ \\t]*[.!?,;]|{{S}}(?:\\p{Ll}*ge\\p{Ll}+t|landete|landet|rollte|rollt|ging|geht|gehen|gerät|geriet){{E}})|(?<=[Dd]as{{S}})(?<t2>aus)(?={{S}}für{{E}})){{E}}"
        flags: dgu
        owner: target|t2|t3|t4|t5
        when:
          - "idiomOpen(m, ctx)"
        return: 'idiomFinding(m, ctx, frame, "Aus")'
      # "das ewige hin und her", "ein ständiges auf und ab": a pair made a noun after an article or
      # an adjective.
      - regex: "{{WG}}(?:(?<=(?:[Dd](?:as|em|es)|[Dd]ies(?:es|em)|[Ee]in(?:em|es)?|\\p{Ll}+(?:e|en|em|es)){{S}})(?<target>hin{{S}}und{{S}}her|auf{{S}}und{{S}}ab)){{E}}"
        flags: dgu
        owner: target|t2|t3|t4|t5
        let:
          prior: '/(\p{L}+)[ \t]+$/u.exec(m.input.slice(Math.max(0, m.index - 30), m.index))![1]'
          stem: 'prior.replace(/(?:e|en|em|es)$/, "")'
        when:
          - "idiomOpen(m, ctx)"
          - "/^(?:[Dd](?:as|em|es)|[Dd]ies(?:es|em)|[Ee]in(?:em|es)?)$/.test(prior) || germanAdjective(stem)"
        return: 'idiomFinding(m, ctx, frame, m.groups!.target.replace(/\p{L}+/gu, (w) => (w === "und" ? w : capitalize(w))))'
      # "durch Dick und dünn", "über Kurz oder lang", "von Klein auf", "von Nah und fern", "auf
      # Ewig": the adjectives of these fixed pairs stay lowercase.
      - regex: "{{WG}}(?:(?<=[Dd]urch{{S}})(?<target>[Dd]ick{{S}}und{{S}}[Dd]ünn)|(?<=[Üü]ber{{S}})(?<t2>[Kk]urz{{S}}oder{{S}}[Ll]ang)|(?<=[Vv]on{{S}})(?<t3>[Kk]lein{{S}}auf|[Nn]ah{{S}}und{{S}}[Ff]ern)|(?<=(?:[Aa]uf|immer{{S}}und){{S}})(?<t4>Ewig)(?!{{S}}\\p{Lu})){{E}}"
        flags: dgu
        owner: target|t2|t3|t4|t5
        when:
          - "idiomOpen(m, ctx)"
        return: "idiomFinding(m, ctx, frame, (m.groups!.target ?? m.groups!.t2 ?? m.groups!.t3 ?? m.groups!.t4).toLowerCase())"
      # "sich sorgen machen", "viele sorgen bereitet", "fragen stellen", "bei bedarf", "auf dem
      # hinweg": plural nouns before their verbs and nouns after a preposition. "Sie sorgen sich",
      # "wir fragen ihn", "der Text bedarf einer Kürzung" keep the verb.
      - regex: "{{WG}}(?:(?<=(?:sich|mir|dir|ihm|uns|euch|ihnen|keine|viele|andere|große|unnötige|ernste|einige|deine|meine|seine|unsere|eure|mehr|weniger)(?:{{S}}\\p{Ll}+)?{{S}})(?<target>sorgen)(?=(?:{{S}}(?:um|wegen){{S}}\\p{L}+)?{{S}}(?:zu{{S}})?(?:machen|machst|macht|machte|machten|gemacht|bereiten|bereitet|bereitete|haben|hat|hatte|hatten){{E}})|(?<t2>fragen)(?={{S}}(?:zu{{S}})?(?:stellen|stellt|stellte|stellten|gestellt|beantworten|beantwortet|beantwortete){{E}}|(?<=(?:ein{{S}}paar|einige|mehrere|weitere|offene){{S}}fragen){{S}}(?:dazu|zum|zur|bezüglich){{E}})|(?<t3>bedarf)(?={{S}}(?:an|daran|besteht|bestand){{E}})|(?<=(?:gibt{{S}}es|gab{{S}}es|[Bb]ei|kein|keinen|großen|hohen|dringenden|weiteren){{S}})(?<t4>bedarf)|(?<=(?:(?:[Aa]uf|[Ff]ür){{S}}(?:dem|den)|[Bb]eim){{S}})(?<t5>hinweg)){{E}}"
        flags: dgu
        owner: target|t2|t3|t4|t5
        when:
          - "idiomOpen(m, ctx)"
        return: "idiomFinding(m, ctx, frame, capitalize(m.groups!.target ?? m.groups!.t2 ?? m.groups!.t3 ?? m.groups!.t4 ?? m.groups!.t5))"
      # "nach seinem aus bei Volkswagen": the noun after a possessive or "dem".
      - regex: "{{WG}}(?:(?<=(?:[Nn]ach|[Vv]or|[Ss]eit){{S}}(?:dem|seinem|ihrem|deinem|meinem|unserem|eurem|diesem){{S}})(?<target>aus)(?={{S}}(?:bei|beim|im|als|gegen){{E}})){{E}}"
        flags: dgu
        owner: target|t2|t3|t4|t5
        when:
          - "idiomOpen(m, ctx)"
        return: 'idiomFinding(m, ctx, frame, "Aus")'
      # "die Farbe rot", "das blaue vom Himmel", "das gelbe vom Ei": a color named as a noun.
      - regex: "{{WG}}(?:(?<=(?:[Dd]ie|[Dd]er|[Ee]ine|[Ee]iner){{S}}Farbe{{S}})(?<target>rot|blau|grün|gelb|weiß|schwarz|grau|braun|lila|rosa|orange|violett|pink|türkis|beige)|(?<=[Dd]as{{S}})(?<t2>blaue)(?={{S}}vom{{S}}Himmel{{E}})|(?<=[Dd]as{{S}})(?<t3>gelbe)(?={{S}}vom{{S}}Ei{{E}})){{E}}"
        flags: dgu
        owner: target|t2|t3|t4|t5
        when:
          - "idiomOpen(m, ctx)"
        return: "idiomFinding(m, ctx, frame, capitalize(m.groups!.target ?? m.groups!.t2 ?? m.groups!.t3))"
      # "Danke an Alle", "euch Allen", "ist Alles dabei": the pronoun is lowercase inside a
      # sentence.
      - regex: "{{WG}}(?:(?<!(?:[Ee]in{{S}}und|mein|dein|sein|ihr|unser|euer){{S}})(?<=\\p{Ll}{{S}})(?<target>Alle|Alles|Allem|Aller)(?![ \\t]*[„\"“»«])|(?<=(?<!\\p{L})(?:euch|uns|ihnen|Ihnen|an|mit|von|zu|bei|aus|vor|nach|unter){{S}})(?<t2>Allen)){{E}}"
        flags: dgu
        owner: target|t2|t3|t4|t5
        message: review_msg_german_pronoun_case
        when:
          - "idiomOpen(m, ctx)"
        return: "idiomFinding(m, ctx, frame, (m.groups!.target ?? m.groups!.t2).toLowerCase())"
      # "meine ehe", "aus erster ehe", "ehe und Familie", "kein wunder", "wahre wunder": nouns. "ehe
      # er kam" is the conjunction; "wunder was", "es nimmt mich wunder" and the adjective "ein
      # wunder Punkt" stay lowercase.
      - regex: "{{WG}}(?:(?<=(?:meine|deine|seine|ihre|unsere|eure|die|der|einer|erster|zweiter|dritter|glückliche|glücklichen|offene|offenen){{S}})(?<target>ehe)(?=[ \\t]*[.!?,;)]|{{S}}(?:und|zerstört|geschieden|gescheitert|geschlossen|eingegangen|beendet|hielt|ist|war){{E}})|(?<t2>ehe)(?={{S}}und{{S}}Familie{{E}})|(?<!(?:nimmt|nahm|nehmen|genommen)(?:{{S}}\\p{L}+){0,2}{{S}})(?<=(?:kein|ein|wahre|wahres|ein{{S}}kleines|kleines|großes|vollbrachte|vollbringt|vollbringen|wirkt|wirkte|wirken|Ein){{S}})(?<t3>wunder)(?!{{S}}(?:was|wie|wer|wo|welche[rsnm]?){{E}}|{{S}}\\p{Lu})){{E}}"
        flags: dgu
        owner: target|t2|t3|t4|t5
        when:
          - "idiomOpen(m, ctx)"
        return: "idiomFinding(m, ctx, frame, capitalize(m.groups!.target ?? m.groups!.t2 ?? m.groups!.t3))"
      # "Der Laden hat Montags geschlossen" → montags; "eines dienstags" → Dienstags.
      - regex: "{{WG}}(?:(?<!(?:des|eines|jeden|jedes|[Ee]ines){{S}})(?<=\\p{Ll}{{S}})(?<target>(?:Montag|Dienstag|Mittwoch|Donnerstag|Freitag|Samstag|Sonntag)(?:vormittag|nachmittag|abend|morgen|mittag|nacht)?s)|(?<=(?:[Ee]ines|des){{S}})(?<t2>(?:montag|dienstag|mittwoch|donnerstag|freitag|samstag|sonntag)(?:vormittag|nachmittag|abend|morgen|mittag|nacht)?s)){{E}}"
        flags: dgu
        owner: target|t2|t3|t4|t5
        when:
          - "idiomOpen(m, ctx)"
        return: "idiomFinding(m, ctx, frame, m.groups!.target ? m.groups!.target.toLowerCase() : capitalize(m.groups!.t2))"
      # "Sie bekam eine drei in Physik": a school grade is a noun.
      - regex: "{{WG}}(?:(?<=(?:[Ee]ine|[Ee]iner|glatte|glatten|guten|gute|schlechte|schlechten){{S}})(?<target>eins|zwei|drei|vier|fünf|sechs)(?!{{S}}(?:\\p{Lu}|\\p{N}|mal|bis|oder|und)|[ \\t]*[-–])){{E}}"
        flags: dgu
        owner: target|t2|t3|t4|t5
        when:
          - "idiomOpen(m, ctx)"
        return: "idiomFinding(m, ctx, frame, capitalize(m.groups!.target))"
      # Names of two adjectives and a noun, each adjective capitalized: "Heiliges Römisches Reich".
      - regex: "{{WG}}(?<first>\\p{L}+?(?:e|en|er|es|em)){{S}}(?<second>\\p{L}+?(?:e|en|er|es|em)){{S}}(?<noun>Reich|Fernsehen|Komitee)(?:es|s)?{{E}}"
        flags: dgu
        owner: first
        let:
          context: "({ start: m.index, end: m.index + m[0].length })"
        when: "NAME_TRIPLES.has(`${nameStem(first)} ${nameStem(second)}:${noun.toLowerCase()}`)"
        return: >-
          [nameCapital(ctx, m.indices!.groups!.first[0], context), nameCapital(ctx, m.indices!.groups!.second[0], context)].filter((f) => f !== null)
      # Adjective and noun pairs that are no names, so the adjective stays lowercase inside a
      # sentence: "grüner Tee", "künstliche Intelligenz", "mit freundlichen Grüßen".
      - regex: "{{WG}}(?<adj>\\p{Lu}\\p{Ll}+?(?:e|en|er|es|em)){{S}}(?<noun>(?:{{LOWER_NOUNS}})(?:es|s|n)?){{E}}"
        flags: dgu
        owner: adj
        let:
          lemma: nameLemmas(noun).find((n) => LOWER_PAIRS.has(`${nameStem(adj)}:${n}`))
          start: m.index + m[0].indexOf(adj)
          before: ctx.text.slice(Math.max(0, start - 4), start)
        when:
          # Not at the start of a sentence, line or quotation, where the capital is due anyway.
          - '!(!lemma || start === 0 || /(?:^|[.!?:\n„“"»«])[ \t]*$/.test(before))'
          - "!ctx.dictionary.has(adj.toLowerCase()) && !namedExampleBefore(ctx.text, start)"
        return: >-
          ({ ruleId: "germanNounCasing", messageKey: "review_msg_german_adjective_lowercase", range: { start, end: start + 1 },
          alternatives: [adj[0].toLowerCase()], context: { start, end: m.index + m[0].length } })
      # "Reich deutscher Nation": the genitive closes the name.
      - regex: "Reich(?:es|s)?{{S}}(?<target>deutscher){{S}}Nation{{E}}"
        flags: dgu
        return: "nameCapital(ctx, m.indices!.groups!.target[0], { start: m.index, end: m.index + m[0].length })"
      # Adjectives of places in -er are capitalized and never inflect: "Wiener Kongress", "Berliner
      # Mauer", "Schweizer Käse".
      - regex: "{{WG}}(?<target>(?:wiener|berliner|münchner|münchener|hamburger|kölner|frankfurter|stuttgarter|dresdner|leipziger|bremer|nürnberger|düsseldorfer|bonner|heidelberger|zürcher|basler|berner|grazer|salzburger|innsbrucker|schweizer|pariser|londoner|römer|prager|mailänder|venezianer){{S}}\\p{Lu}\\p{Ll})"
        flags: dgu
        return: "nameCapital(ctx, m.indices!.groups!.target[0], { start: m.index, end: m.index + m[0].length })"
      # Names of several words capitalize their adjective too: "der Erste Weltkrieg", "die
      # Französische Revolution", "im Nahen Osten".
      - regex: "{{WG}}(?<adj>\\p{Ll}+?(?:e|en|er|es|em)){{S}}(?<noun>(?:{{NAME_NOUNS}})(?:es|s|n)?){{E}}"
        flags: dgu
        owner: adj
        let:
          lemma: '[noun, noun.replace(/(?:es|s|n)$/, "")].find((n) => NAME_NOUN_SET.has(n))'
          pair: '`${adj.replace(/(?:e|en|er|es|em)$/, "")}:${lemma}`'
          start: m.indices!.groups!.adj[0]
          before: ctx.text.slice(Math.max(0, start - 12), start)
        when:
          - "!!lemma && NAME_PAIR_SET.has(pair)"
          - NAME_ALWAYS.has(pair) || NAME_DEFINITE.test(before)
          - "!ctx.dictionary.has(adj) && !namedExampleBefore(ctx.text, start)"
        return: >-
          ({ ruleId: "germanNounCasing", messageKey: "review_msg_german_name_case", range: { start, end: start + 1 },
          alternatives: [adj[0].toUpperCase()], context: { start: m.index, end: m.indices!.groups!.noun[1] } })
      # "Hallo Liebe Katja" → liebe: after a greeting the adjective is lowercase.
      - regex: "(?<=(?:^|\\n)[ \\t]{0,8}{{GREETING_WORDS}}[ \\t]{1,4})(?<adj>Lieb(?:e|er|es))(?=[ \\t]+\\p{Lu})"
        scan: owned
        flags: gu
        return: >-
          ({ ruleId: "germanNounCasing", messageKey: "review_msg_german_idiom_case", range: { start: m.index, end: m.index + 1 }, alternatives: ["l"], context: { start: m.index, end: m.index + m[0].length } })
      # A verb in -en right before a lowercase "sie": "Kommen sie bitte herein!" (the polite
      # imperative).
      - regex: "(?<![\\p{L}\\p{M}\\p{N}_-])(?<verb>\\p{L}+en)[ \\t]+(?<sie>sie)(?![\\p{L}\\p{M}\\p{N}_-])"
        scan: owned
        flags: gu
        let:
          start: m.index + m[0].length - 3
          rest: '/^[^.!?\n]*([.!?\n]?)/.exec(ctx.text.slice(start))!'
          end: rest[1]
          please: 'end !== "?" && /(?<!\p{L})bitte(?!\p{L})/iu.test(ctx.text.slice(Math.max(0, m.index - 8), start) + rest[0])'
          before: deTokensBefore(ctx.text, m.index, 2)
          prior: before.at(-1) ?? ""
        when:
          - germanInfinitive(verb.toLowerCase())
          - end === "!" || please
          - >-
            politeOpens(before.at(-1)) || (/^(?:bitte|so|und|oder|aber|dann|jetzt|nun|doch|also)$/i.test(prior) && politeOpens(before.at(-2)))
        return: >-
          ({ ruleId: "germanNounCasing", messageKey: "review_msg_german_polite_sie", range: { start, end: start + 1 }, alternatives: ["S"], context: { start: m.index, end: start + 3 } })
  - id: de.prepositionCase
    checks: [germanPrepositionCase]
    style: match
    message: review_msg_german_preposition_case
    sets:
      # Prepositions that also follow their noun: "meiner Meinung nach", "dem Plan gemäß".
      PREP_POSTPOSITIONS: [nach, gemäß, nahe, entsprechend]
      PREP_QUANTIFIER_STEMS: [all, and, viel, wenig, einig, beid, mehrer, sämtlich, ganz, jed]
      # ein-words take no ending in the masculine and neuter nominative ("ein", "mein", "unser").
      PREP_EIN_WORDS: [ein, kein, mein, dein, sein, ihr, unser, euer]
      PREP_STEMS:
        [ein, kein, mein, dein, sein, ihr, unser, eur, euer, dies, jen, jed, welch, solch, all]
    maps:
      # The case each preposition governs.
      PREP_CASES:
        {
          mit: dative,
          von: dative,
          bei: dative,
          aus: dative,
          nach: dative,
          zu: dative,
          seit: dative,
          samt: dative,
          nebst: dative,
          außer: dative,
          gemäß: dative,
          nahe: dative,
          entsprechend: dative,
          wegen: genitive,
          trotz: genitive,
          während: genitive,
          statt: genitive,
          anstatt: genitive,
          aufgrund: genitive,
          bezüglich: genitive,
          angesichts: genitive,
          mangels: genitive,
          infolge: genitive,
          abzüglich: genitive,
          zuzüglich: genitive,
          inklusive: genitive,
          exklusive: genitive,
          hinsichtlich: genitive,
          anhand: genitive,
          anlässlich: genitive,
          seitens: genitive,
          mithilfe: genitive,
          für: accusative,
          gegen: accusative,
          durch: accusative,
          wider: accusative,
          ohne: accusative,
          um: accusative,
          betreffend: accusative,
        }
      PRONOUN_CASE_FIX:
        dative:
          {
            mich: mir,
            dich: dir,
            ihn: ihm,
            niemanden: niemandem,
            jemanden: jemandem,
            einen: einem,
            keinen: keinem,
            das: dem,
          }
        genitive: {}
        accusative: { mir: mich, dir: dich, ihm: ihn, allem: alles }
      # The definite article: its ending after "d", and its form for an ending.
      DEFINITE_ENDINGS: { die: e, das: s, den: en, dem: em, der: er, des: es }
      DEFINITE_FORMS: { e: die, s: das, en: den, em: dem, er: der, es: des }
    defs:
      PREP_DETERMINER_STEMS: /^(?:all|viel|wenig|ander|beid|einig|mehrer|solch|welch|manch|mein|dein|sein|ihr|unser|eur|dies|jen|jed|kein|ein|d)$/
      # "mit die größte", "mit das Beste", "mit meine Lieblingskneipe": "among the …".
      PREP_SUPERLATIVE: /(?:s|ß)t(?:e|en|er|es)$|^ *Lieblings/
      # Whether the word is the plural of a known noun by its form: an umlaut and -e or -er
      # ("Götter", "Düfte"), -er after a neuter ("Bilder"), or -nisse. A plain -e is left out, as
      # old datives keep it ("zu Hause"). "Müller" is "Müll" + -er, not a plural of "Mull".
      prepPluralForm:
        args: "word: string"
        let:
          low: word.toLowerCase()
          stem: low.replace(/e?r?$/, "")
          singular: deumlaut(stem)
          neuter: germanGender(singular)?.gender
        when: germanGender(word)?.plural !== false
        return: >-
          /nisse$/.test(low) ? germanNounReading(low.slice(0, -2)) !== null
          : singular.length < 3 ? false
          : singular !== stem ? germanNounReading(singular) !== null && !germanNounReading(stem)
          : /er$/.test(low) && (neuter === "n" || neuter === "x") && germanNounReading(low) !== null
        else: "false"
      # The stem and ending of a determiner: "meinen" → ["mein", "en"], "das" → ["d", "s"]. "mit ihr
      # Deutsch sprechen": the pronoun.
      prepSplit:
        args: "typed: string"
        type: "[string, string] | null"
        let:
          det: typed.toLowerCase()
          ending: '["en", "em", "er", "es", "e", ""].find((e) => det.endsWith(e) && PREP_STEMS.has(det.slice(0, det.length - e.length)))'
        return: >-
          Object.hasOwn(DEFINITE_ENDINGS, det) ? ["d", DEFINITE_ENDINGS[det]]
          : ending === undefined ? null
          : ending === "" && (!PREP_EIN_WORDS.has(det) || det === "ihr") ? null
          : [typed.slice(0, det.length - ending.length), ending]
      prepJoin:
        args: "stem: string, ending: string"
        return: 'stem === "d" ? DEFINITE_FORMS[ending] : (stem.toLowerCase() === "euer" ? stem.slice(0, 1) + "ur" : stem) + ending'
      # The neuter nominative/accusative: "das", "ein", "dieses".
      prepNeuter:
        args: "stem: string"
        return: 'stem === "d" ? "das" : PREP_EIN_WORDS.has(stem.toLowerCase()) ? stem : stem === "eur" ? "euer" : `${stem}es`'
      prepNoun:
        args: "word: string"
        return: germanNounReading(word.toLowerCase()) !== null
      # A noun, or a compound whose last part of four letters or more is one ("Aussichtspunkte").
      prepHeadNoun:
        args: "word: string"
        return: "[...word].some((_, i) => (i === 0 || (i >= 3 && word.length - i >= 4)) && prepNoun(word.slice(i)))"
      # A dative plural: "Autos", "Kindern" (Kinder + n), "Frauen" (Frau + en). "Haus", "Kurs" and
      # "Pass" are singular; "Termins" is a genitive singular of a noun with a plural in -e or -en;
      # "Kollegin" is feminine singular.
      prepDativePlural:
        args: "word: string"
        let:
          stem: word.slice(0, -1)
        return: >-
          word.endsWith("s") ? !(/[^aeiouys]$/.test(stem) && /^[mnx]$/.test(germanGender(stem)?.gender ?? "") &&
          (prepNoun(`${stem}e`) || prepNoun(`${stem}en`))) && (!/(?:us|is|ss|rs|ls)$/.test(word) || prepNoun(stem))
          : /(?:el|er)n$/.test(word) ? true
          : /in$/.test(word) ? false
          : /n$/.test(word) && (prepHeadNoun(word.slice(0, -1)) || prepHeadNoun(word.slice(0, -2)))
      # The plural without its dative -n: "Kindern" → "Kinder"; null when the -n belongs to it
      # ("Unterlagen": a feminine noun in -e takes its -n in every plural case).
      prepWithoutDativeN:
        args: "word: string"
        type: string | null
        let:
          stem: word.slice(0, -1)
        return: '/(?:el|er)n$/.test(word) ? stem : /en$/.test(word) && prepNoun(stem) && germanGender(stem)?.gender !== "f" ? stem : null'
      # A form that is only a plural: "Kinder" (Kind), "Mütter" (Mutter), "Äpfel" (Apfel).
      prepPluralOnly:
        args: "word: string"
        let:
          low: word.toLowerCase()
          plain: deumlaut(low)
        return: prepPluralForm(word) || (/(?:er|el)$/.test(low) && plain !== low && prepNoun(plain))
      # Adjectives after a dative or genitive article: always -en.
      prepWeak:
        args: "adjs: string"
        return: 'adjs.replace(/\p{Ll}+/gu, (a) => a.replace(/(?:e|en|er|es|em)$/, "en"))'
      # Adjectives with another ending: "-e" after "die", "-es" after neuter "ein".
      prepEnding:
        args: "adjs: string, to: string"
        return: 'adjs.replace(/\p{Ll}+/gu, (a) => a.replace(/(?:e|en|er|es|em)$/, to))'
      # "Termins": already a genitive. "Menschen", "Kunden": a weak noun keeps its -en ("des
      # Menschen"); "Wagen" takes -s.
      prepGenitiveNoun:
        args: "word: string"
        let:
          low: word.toLowerCase()
        return: >-
          /[^aeiouys]s$/.test(word) && !prepDativePlural(word) ? word
          : /(?:s|ß|x|z)$/.test(word) ? `${word}es`
          : low === "herrn" ? word
          : /en$/.test(low) && (prepNoun(low.slice(0, -2)) || prepNoun(low.slice(0, -1))) ? word
          : `${word}s`
      # "des Beschlusses" → "Beschluss", "eines Hauses" → "Haus".
      prepWithoutGenitive:
        args: "word: string"
        return: '/(?:ss|ß|z|x|ch|t|d|g)es$/.test(word) ? word.slice(0, -2) : word.replace(/s$/, "")'
      # The dative of a determiner phrase. "gemäß des Beschlusses", "nahe eines Hauses": the
      # genitive. "von dieses Aussichtspunkten": a plural, or unclear. "eine" has no plural;
      # "keine", "die" and "meine" have one. The noun's gender decides between the feminine and the
      # masculine or neuter; "mit die Kinder": a plural form; "mit die Lehrer": a masculine noun
      # that is also its own plural. With the gender unknown, "dem", "der" or "den" can be
      # correct, so all are offered and none is preselected.
      prepDativeFix:
        args: "stem: string, end: string, adjs: string, word: string, gender: GermanGenderReading | null"
        type: "{ replacements: string[]; choice?: true } | null"
        let:
          singular: '`${prepJoin(stem, "em")}${prepWeak(adjs)} ${word}`'
          feminine: '`${prepJoin(stem, "er")}${prepWeak(adjs)} ${word}`'
          plural: '`${prepJoin(stem, "en")}${prepWeak(adjs)} ${/[^ns]$/.test(word) ? word + "n" : word}`'
          hasPlural: stem !== "ein"
          pluralEnding: hasPlural && /(?:e|er|el|en|chen|lein)$/.test(word)
        return: >-
          end === "es" && /s$/.test(word) ? { replacements: [`${prepJoin(stem, "em")}${prepWeak(adjs)} ${prepWithoutGenitive(word)}`] }
          : end === "" || end === "s" || (end === "es" && stem !== "d")
          ? (end === "es" && /n$/.test(word) ? (prepDativePlural(word) ? { replacements: [plural] } : null) : { replacements: [singular] })
          : end === "en" ? (prepDativePlural(word) || /(?:er|el|en|e)$/.test(word) ? null : { replacements: [singular] })
          : end !== "e" ? null
          : prepDativePlural(word) || stem === "all" ? { replacements: [plural] }
          : gender?.gender === "f" ? { replacements: [feminine] }
          : !gender && prepPluralOnly(word) ? (hasPlural ? { replacements: [plural] } : null)
          : gender ? (gender.plural && pluralEnding ? { replacements: [singular, plural], choice: true } : { replacements: [singular] })
          : { replacements: pluralEnding ? [singular, feminine, plural] : [singular, feminine], choice: true }
      # "wegen den Autos" (plural), "wegen unseren Termin" (singular). "Fanartikeln" loses its
      # dative -n; "Geschehnissen" may or may not ("Katzen" keeps it).
      prepGenitivePlural:
        args: "stem: string, adjs: string, word: string"
        type: "{ replacements: string[]; choice?: true }"
        let:
          plain: prepWithoutDativeN(word)
          plurals: "plain ? (/(?:el|er)n$/.test(word) ? [plain] : [plain, word]) : [word]"
        return: >-
          ({ replacements: plurals.map((n) => `${prepJoin(stem, "er")}${adjs} ${n}`), ...(plurals.length > 1 ? { choice: true as const } : {}) })
      # The genitive of a determiner phrase. Feminine or plural: -er for both ("wegen einer
      # Stelle", "wegen der Leute"); "wegen die Lehrer": "die" before a masculine noun is its
      # plural; "eine" has none. With the gender unknown, "des" or "der" can be correct.
      prepGenitiveFix:
        args: "stem: string, end: string, adjs: string, word: string, gender: GermanGenderReading | null"
        type: "{ replacements: string[]; choice?: true } | null"
        let:
          singular: '`${prepJoin(stem, "es")}${prepWeak(adjs)} ${prepGenitiveNoun(word)}`'
          feminineOrPlural: '({ replacements: [`${prepJoin(stem, "er")}${prepWeak(adjs)} ${word}`] })'
        return: >-
          end === "em" ? { replacements: [singular] }
          : end === "en" ? (prepDativePlural(word) ? prepGenitivePlural(stem, adjs, word) : /(?:er|el|en|e)$/.test(word) || stem === "all" ? null : { replacements: [singular] })
          : end !== "e" || stem === "all" ? null
          : gender?.gender === "f" ? feminineOrPlural
          : gender ? (gender.plural && stem !== "ein" ? feminineOrPlural : { replacements: [singular] })
          : prepDativePlural(word) || prepPluralOnly(word) ? feminineOrPlural
          : { replacements: [singular, feminineOrPlural.replacements[0]], choice: true }
      # "für den Männern": a dative plural ("um den Willen", "für den Kollegen": a weak masculine
      # noun's accusative singular; "für den Lampen": a feminine plural, which keeps its -n).
      # "für deiner Frau", "wider aller Vernunft", "betreffend der Adresse": dative or genitive.
      prepAccusativeFix:
        args: "stem: string, end: string, adjs: string, word: string, gender: GermanGenderReading | null"
        type: "{ replacements: string[]; choice?: true } | null"
        let:
          plain: 'end === "en" && stem === "d" ? prepWithoutDativeN(word) : null'
          masculine: '`${prepJoin(stem, "en")}${prepEnding(adjs, "en")} ${word}`'
          neuterForm: '`${prepNeuter(stem)}${prepEnding(adjs, stem === "d" ? "e" : "es")} ${word}`'
        return: >-
          end === "er" && !/(?:er|el|en|n|s)$/.test(word) ? { replacements: [`${prepJoin(stem, "e")}${prepEnding(adjs, "e")} ${word}`] }
          : end === "em" ? (gender?.gender === "m" ? { replacements: [masculine] } : gender?.gender === "n" ? { replacements: [neuterForm] }
          : { replacements: [masculine, neuterForm], choice: true })
          : end === "en" && stem === "d" ? (plain?.endsWith("e") ? (germanGender(plain)?.gender === "f" ? { replacements: [`die${adjs} ${word}`] } : null)
          : plain ? { replacements: [`die${adjs} ${plain}`] } : null)
          : null
      prepCaseFix:
        args: "kind: string, stem: string, end: string, adjs: string, word: string, gender: GermanGenderReading | null"
        type: "{ replacements: string[]; choice?: true } | null"
        return: >-
          kind === "dative" ? prepDativeFix(stem, end, adjs, word, gender) : kind === "genitive" ? prepGenitiveFix(stem, end, adjs, word, gender)
          : prepAccusativeFix(stem, end, adjs, word, gender)
      # A zu-infinitive later in the clause: "ohne dem Leser zu sagen", "zu diesen Ort einzustufen".
      zuInfinitiveAfter:
        args: "ctx: DetectContext, end: number, separate: boolean"
        let:
          rest: ctx.text.slice(end, end + 120).split(/[.!?;:,\n]/)[0]
        return: '/\p{L}zu\p{Ll}+n(?!\p{L})/u.test(rest) || (separate && /(?<!\p{L})zu[ \t]+\p{Ll}/u.test(rest))'
      # Whether the word is a preposition over this phrase. Capitalized inside a sentence: a noun
      # ("auf verschiedenen Wegen"). "der Sache wegen", "an meiner statt", "meiner Meinung nach": a
      # postposition. "ab und zu", "nach und nach": adverbs; "hier zu" is "hierzu" written apart.
      # "was für einer", "sowas von die Nase voll", ", wegen dem": idioms and relative pronouns.
      # "ohne dem Leser zu sagen"; "half mit das Fahrrad reinzubekommen": a particle.
      prepGuarded:
        args: "ctx: DetectContext, m: RegExpExecArray, kind: string"
        let:
          prep: m.groups!.prep
          low: prep.toLowerCase()
          prior: deTokensBefore(ctx.text, m.index, 3).at(-1) ?? ""
          nounBefore: '/^\p{Lu}/u.test(prior) && !BOUNDARY.test(prior)'
          genitivePronoun: /^(?:meiner|deiner|seiner|ihrer|unserer|eurer)$/.test(prior)
        when:
          - '!(/^\p{Lu}/u.test(prep) && !BOUNDARY.test(prior))'
          - '!((kind === "genitive" || PREP_POSTPOSITIONS.has(low)) && (nounBefore || genitivePronoun))'
          - '!(low === "zu" && /^(?:hier|da|wo)$/i.test(prior))'
          - '!(prior === "und" && (low === "zu" || low === "nach"))'
          - '!(/^(?:was|sowas)$/i.test(prior) && (low === "für" || low === "von"))'
          - '!(prior === "," && /^(?:dem|der|den|denen)$/.test(m.groups!.target.split(/[ \t]/)[0]))'
        return: "!zuInfinitiveAfter(ctx, m.index + m[0].length, /^(?:ohne|um|statt|anstatt|zu)$/.test(low))"
        else: "false"
      # Whether the clause after `index` reads as a subordinate one: it ends in a verb form, or a
      # comma closes it ("Seit die Mauer fiel, …").
      clauseEndsInVerb:
        args: "ctx: DetectContext, index: number"
        let:
          rest: '/^[^.,;:!?\n]*[.,;:!?\n]?/.exec(ctx.text.slice(index, index + 200))![0]'
          last: rest.match(/\p{L}+/gu)?.at(-1)
        return: >-
          rest.endsWith(",") || (!!last && (germanVerbLike(last) || germanAuxiliary(last) || germanPastInfinitives(last).length > 0 ||
          /^\p{Ll}+(?:t|en)$/u.test(last)))
      # The finding of a preposition frame: `fix` replaces the `target` group.
      caseFinding:
        args: "m: RegExpExecArray, fix: { replacements: string[]; choice?: true }"
        type: RawFinding
        let:
          span: m.indices!.groups!.target
        return: >-
          ({ ruleId: "germanPrepositionCase", messageKey: "review_msg_german_preposition_case", range: { start: span[0], end: span[1] },
          alternatives: fix.replacements, context: { start: m.index, end: span[1] }, ...(fix.choice ? { requiresChoice: true as const } : {}) })
    frames:
      # The case a preposition governs, read from the article after it: "mit eine Freundin"
      # (dative: einer), "wegen dem Regen" (genitive: des Regens), "für deiner Mutter"
      # (accusative: deine). The polite "Ihr-" is the one capitalized determiner.
      - regex: "{{WG}}{{CASE_PREPOSITION}}{{S}}(?<target>(?<det>\\p{Ll}+|Ihr\\p{Ll}*)(?<adjs>(?:{{S}}{{INFLECTED_ADJ}}){0,2}){{S}}(?:(?<ordinal>\\d{1,2}\\.){{S}})?(?<noun>{{CAP_NOUN}})){{E}}"
        flags: dgu
        let:
          low: prep.toLowerCase()
          kind: PREP_CASES[low]
          parts: prepSplit(det)
          stem: parts[0]
          end: parts[1]
          mods: adjs ?? ""
          # "gemäß des Beschlusses", "nahe des Hauses": the genitive these take in error; "mit des
          # Kaisers Hilfe" is an old genitive attribute. "nahe" is otherwise an adjective.
          genitiveForm: end === "es" && /s$/.test(noun)
          after: deTokensAfter(ctx.text, m.indices!.groups!.noun[1], 2)
          next: after[0] ?? ""
          fix: 'prepCaseFix(kind, stem, end, mods, noun, germanGender(noun.split("-").at(-1)!))'
        when:
          - "!!parts && prepGuarded(ctx, m, kind)"
          - '!(low === "mit" && (PREP_SUPERLATIVE.test(mods) || PREP_SUPERLATIVE.test(noun)))'
          - "!/^bei die Fische$/i.test(`${prep} ${det} ${noun}`)"
          # "seit seine Mutter zurück ist", "während die Kinder spielen": also conjunctions, whose clause
          # ends in its verb ("Seit seine Jugend wohnt er hier" has none there).
          - '!(low === "seit" && end !== "en" && clauseEndsInVerb(ctx, m.indices!.groups!.noun[1]))'
          - '!(low === "während" && end === "e")'
          - '!(kind === "dative" && (low === "nahe" ? !genitiveForm : low !== "gemäß" && genitiveForm))'
          # "für der Forschung dienende Flächen": the article may belong to an attribute.
          - '!(end === "er" && stem === "d" && low !== "wider" && low !== "betreffend")'
          # "Statt einem Bluetooth Mikrofon" (open compound), "mit den Bau und Elektroarbeiten"
          # (coordination); a genitive after the noun ("von die Lippen Gottes") is fine. "durch der Natur
          # innewohnende Kräfte".
          - '!(/^\p{Lu}/u.test(next) && !/es$/.test(next))'
          - '!(/^(?:und|oder|sowie|&|\/)$/.test(next) && /^\p{Lu}/u.test(after[1] ?? ""))'
          - '!/^\p{Ll}+end(?:e|en|er|es|em)?$/u.test(next)'
          - fix
          - "!ctx.dictionary.has(noun.toLowerCase())"
        # A date ("seit den 13. Jahrhundert") keeps its ordinal.
        return: >-
          caseFinding(m, ordinal ? { ...fix, replacements: fix.replacements.map((r) => r.replace(/ (\S+)$/, ` ${ordinal} $1`)) } : fix)
      # "mit zwei Kinder" → Kindern: a number or plural quantity, an adjective, and a plural noun
      # in -e, -er or -el take the dative -n.
      - regex: "{{WG}}{{DATIVE_ONLY}}{{S}}(?:zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn|elf|zwölf|[2-9]|[1-9]\\d{1,2}|vielen|mehreren|beiden|zahlreichen|wenigen|einigen|\\p{Ll}{3,}en)(?:{{S}}\\p{Ll}+en)?{{S}}(?<target>\\p{Lu}\\p{Ll}+(?:e|er|el)){{E}}"
        flags: dgu
        let:
          dative: "`${target}n`.toLowerCase()"
          # "Tierärzten": a compound whose head the dictionary knows in the dative plural.
          known: >-
            [...dative].some((_, i) => (i === 0 || (i >= 3 && dative.length - i >= 4)) && germanNounReading(dative.slice(i)) !== null)
          counted: /(?:zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn|elf|zwölf|\d)/.test(m[0])
          reading: germanGender(target)
          quantity: '/(?:vielen|mehreren|beiden|zahlreichen|wenigen|einigen)(?!\p{L})/u.test(m[0])'
        when:
          - 'prepGuarded(ctx, m, "dative") && !ctx.dictionary.has(target.toLowerCase())'
          # "bis zu drei Bücher ausleihen": "bis zu" is "up to", the verb sets the case.
          - '!/bis[ \t]+$/i.test(ctx.text.slice(Math.max(0, m.index - 8), m.index))'
          - known
          # "zu ihren Mutter": a feminine singular after an -en word wants "ihrer", not "Muttern".
          - '!(!counted && reading?.gender === "f" && !reading.plural)'
          # "die zu fällenden Bäume", "viel zu knappen Gelder": "zu" before an adjective is no preposition.
          - '!(!counted && !quantity && m.groups!.prep.toLowerCase() === "zu")'
        return: "caseFinding(m, { replacements: [`${target}n`] })"
      # A plural noun with no article: "zu Götter", "nach Erkenntnisse", "bei Bilder".
      - regex: "{{WG}}{{DATIVE_ONLY}}{{S}}(?<target>\\p{Lu}\\p{Ll}+(?:e|er)){{E}}"
        flags: dgu
        let:
          next: deTokensAfter(ctx.text, m.indices!.groups!.target[1], 1)[0] ?? ""
        when:
          # "Ärzte ohne Grenzen": a name.
          - '!(/^(?:\p{Lu}|ohne$)/u.test(next) || !prepPluralForm(target) || ctx.dictionary.has(target.toLowerCase()))'
          - 'prepGuarded(ctx, m, "dative")'
        return: "caseFinding(m, { replacements: [`${target}n`] })"
      # An adjective in -en before a singular noun with no article: "mit ernsten Blick"
      # (ernstem), "mit vollen Absicht" (voller). With no article the adjective shows the
      # dative itself.
      - regex: "{{WG}}(?<prep>[Mm]it|[Vv]on|[Bb]ei|[Aa]us|[Nn]ach|[Ss]eit|[Aa]ußer|[Ss]amt){{S}}(?<target>(?<adj>\\p{Ll}{3,}?)en){{S}}(?<noun>\\p{Lu}\\p{Ll}+){{E}}"
        flags: dgu
        let:
          reading: germanGender(noun)
          next: deTokensAfter(ctx.text, m.indices!.groups!.noun[1], 1)[0] ?? ""
        when:
          - "!(PREP_QUANTIFIER_STEMS.has(adj) || !(germanAdjective(adj) || germanAdjective(`${adj}e`)))"
          - "!!reading && !reading.plural"
          - '!(/^\p{Lu}/u.test(next) || ctx.dictionary.has(`${adj}en`))'
          - 'prepGuarded(ctx, m, "dative")'
        return: 'caseFinding(m, { replacements: [`${adj}${reading.gender === "f" ? "er" : "em"}`] })'
      # A span of time after a number, in the dative: "in 10 Tage" (Tagen), "ab 18 Jahre"
      # (Jahren).
      - regex: "{{WG}}(?<prep>[Ii]n|[Vv]or|[Aa]b|[Bb]innen){{S}}(?:[2-9]|[1-9]\\d{1,3}|zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn|elf|zwölf|zwanzig|dreißig|hundert){{S}}(?<target>Tage|Jahre|Monate){{E}}"
        flags: dgu
        let:
          next: deTokensAfter(ctx.text, m.indices!.groups!.target[1], 1)[0] ?? ""
        when:
          # "vor 3 Jahre alt", "in 2 Jahre aufgeteilt": a measure, not a time.
          - '!(/^(?:alt|jung|älter|lang|später|früher)$/.test(next) || /^\p{Lu}/u.test(next))'
          # "in 12 Monate eingeteilt": "in" with the accusative of a division.
          - '!(/^[Ii]n$/.test(prep) && /^\p{Ll}+t$/u.test(next))'
        return: "caseFinding(m, { replacements: [`${target}n`] })"
      # An adjective in -e with no article after a dative preposition, before a noun whose
      # gender or plural is known: "mit perfekte Make-up" (perfektem), "mit
      # tageslichtabhängige Steuerung" (-er), "mit neue Felder" (neuen Feldern). "-e" is no
      # dative ending.
      - regex: "{{WG}}(?<prep>[Mm]it|[Vv]on|[Bb]ei|[Aa]us|[Aa]ußer|[Ss]amt){{S}}(?<target>(?<adj>\\p{Ll}{3,}?)e{{S}}(?<noun>\\p{Lu}\\p{L}*(?:-\\p{L}+)*)){{E}}"
        flags: dgu
        let:
          # "tageslichtabhängig": a compound adjective whose last part is known.
          known: "[...adj].some((_, i) => (i === 0 || (i >= 3 && adj.length - i >= 5)) && germanAdjective(adj.slice(i)))"
          next: deTokensAfter(ctx.text, m.indices!.groups!.noun[1], 1)[0] ?? ""
          reading: 'germanGender(noun.split("-").at(-1)!)'
          # "Sitzreihen", "Feldern": a dative plural already.
          dative: '/(?:er|el)n$/.test(noun) || (/en$/.test(noun) && germanGender(noun.slice(0, -1))?.gender === "f")'
          fix: >-
            reading && !reading.plural ? `${adj}${reading.gender === "f" ? "er" : "em"} ${noun}`
            : dative && prepHeadNoun(noun.slice(0, -1).toLowerCase()) ? `${adj}en ${noun}`
            : prepPluralForm(noun) ? `${adj}en ${noun}n` : null
        when:
          - '!(PREP_DETERMINER_STEMS.test(adj) || !(known || /^(?:ge|ver|be|er|ent)\p{Ll}+t$/u.test(adj)))'
          - "!/(?:ungen|heiten|keiten|schaften|ionen|täten|innen)$/.test(noun)"
          - '!(/^\p{Lu}/u.test(next) || ctx.dictionary.has(`${adj}e`))'
          - '!!fix && prepGuarded(ctx, m, "dative")'
        return: "caseFinding(m, { replacements: [fix] })"
      # "mit spannende Ausstellungen" → spannenden: an adjective in -e before a noun whose
      # ending only a plural has ("Ausstellungen").
      - regex: "{{WG}}{{DATIVE_ONLY}}{{S}}(?<target>\\p{Ll}{3,}e){{S}}\\p{Lu}\\p{Ll}+(?:ungen|heiten|keiten|schaften|ionen|täten|innen){{E}}"
        flags: dgu
        when: 'prepGuarded(ctx, m, "dative")'
        return: "caseFinding(m, { replacements: [`${target}n`] })"
      # Pronouns, "keinen der …", "das, was …" and "ohne allem".
      - regex: "{{WG}}{{CASE_PREPOSITION}}{{S}}(?<target>mich|dich|ihn|mir|dir|ihm|niemanden|jemanden|(?:k?einen)(?={{S}}de[rs]{{E}})|das(?=,{{S}}(?:was|wo){{E}})|allem(?=[ \\t]*[.!?,])){{E}}"
        flags: dgu
        let:
          kind: PREP_CASES[m.groups!.prep.toLowerCase()]
          replacement: PRONOUN_CASE_FIX[kind][target]
        when: "!!replacement && prepGuarded(ctx, m, kind)"
        return: "caseFinding(m, { replacements: [replacement] })"
  - id: de.confusions
    checks: [germanConfusedWords]
    style: german
    message: review_msg_contextual_grammar
    sets:
      # Adjectives that comment on a "dass" clause after them: "Schön, dass du da bist".
      THAT_ADJECTIVES:
        [
          gut,
          schön,
          super,
          toll,
          schade,
          klasse,
          prima,
          wichtig,
          komisch,
          seltsam,
          klar,
          logisch,
          merkwürdig,
          erstaunlich,
          interessant,
          traurig,
          spannend,
          praktisch,
          blöd,
          ärgerlich,
        ]
      # Adverbs after "da" + preposition that show the pronominal adverb: "da nach nicht" (danach).
      DA_ADVERBS:
        [
          nicht,
          auch,
          noch,
          schon,
          gar,
          kaum,
          nie,
          nur,
          immer,
          sofort,
          bitte,
          doch,
          ja,
          selbst,
          wohl,
          eben,
          erst,
          bald,
        ]
    maps:
      SEIN_FOR:
        {
          hat: ist,
          hast: bist,
          haben: sind,
          habt: seid,
