  - id: en.clauseGaps
    checks: [englishSentenceStructure, englishConfusedWords, englishThenThan]
    style: slot
    message: review_msg_confused_word
    frames:
      # "Delete the sentence if is too long", "since was happening", "if should have questions":
      # a subordinator directly before a finite verb has lost its subject.
      - regex: "(?<![\\p{L}'’])(?:if|since|because|unless|although|whether){{S}}(?<target>{{GAP_VERB}}|need){{S}}(?<next>[a-z]+){{E}}"
        message: review_msg_sentence_structure
        cue: ["if", "since", "because", "unless", "although", "whether"]
        fixer: clauseGapsIs
      # "either the client nor the server": either pairs with or.
      - regex: "(?<![\\p{L}'’])either{{S}}(?:[^.!?;:\\n,]{1,60}?){{S}}(?<target>nor){{E}}"
        check: englishConfusedWords
        cue: ["either"]
        fixer: clauseGapsNor
      # "I want wanted to thank you", "To made make it better": two forms of one verb.
      - regex: "(?<![\\p{L}'’-])(?<target>[a-z]{2,})(?={{S}}(?<two>[a-z]{2,}){{E}})"
        check: englishConfusedWords
        message: review_msg_repeated_words
        fixer: clauseGapsA
      # "greater that 10", "more than that expected": than after a comparative.
      - regex: "(?<![\\p{L}'’])(?<cmp>[a-z]+er|more{{S}}[a-z]+|less{{S}}[a-z]+|more|less|fewer){{S}}(?<target>that){{S}}(?=\\d|(?:ever|usual|expected|before|anticipated|planned|needed|necessary|required){{E}})"
        check: englishThenThan
        message: review_msg_then_than
        cue: ["that"]
        fixer: clauseGapsThat
      # "it decreases gradually there after.", "might there after happen": thereafter.
      - regex: "(?<![\\p{L}'’])(?<target>there{{S}}after)(?=[ \\t\\u00a0]*[.!?;]|{{S}}(?<verb>[a-z]+){{E}})"
