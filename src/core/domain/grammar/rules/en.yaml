  - id: en.clashFrames
    checks:
      [
        englishSentenceStructure,
        englishPronounVerbWhitelistAgreement,
        englishNounNumber,
        englishVerbComplements,
        stylePhrasing,
        englishAuxiliaryBaseVerb,
        englishPhraseCorrections,
      ]
    style: slot
    message: review_msg_sentence_structure
    frames:
      # "I'm haven't been", "It's just doesn't seem right": a contracted be before a negative
      # auxiliary. A contraction never ends a clause, so the be is always extra.
      - regex: "{{START}}(?:I|you|we|they|he|she|it)(?<target>['’](?:m|re|s))(?:{{S}}(?:just|really|still|also|obviously|actually|simply|certainly|definitely|probably|clearly|usually|honestly|sometimes|finally|ever|even|already))?{{S}}(?:has|have|had|does|do|did|is|are|was|were|wo|ca|could|would|should)n['’]t{{E}}"
        cue:
          [
            "hasn",
            "haven",
            "hadn",
            "doesn",
            "don",
            "didn",
            "isn",
            "aren",
            "wasn",
            "weren",
            "couldn",
            "wouldn",
            "shouldn",
          ]
        fix: ""
      # "He was hasn't there", "He wasn't obviously wasn't there": a full be at the clause start.
      # "What it is isn't clear" has its pronoun inside a subject clause.
      - regex: "{{START}}(?:I|you|we|they|he|she|it)(?<target>{{S}}(?:am|is|are|was|were)(?:n['’]t)?)(?:{{S}}(?:just|really|still|also|obviously|actually|simply|certainly|definitely|probably|clearly|usually|honestly|sometimes|finally|ever|even|already))?{{S}}(?:has|have|had|does|do|did|is|are|was|were|wo|ca|could|would|should)n['’]t{{E}}"
        cue:
          [
            "hasn",
            "haven",
            "hadn",
            "doesn",
            "don",
            "didn",
            "isn",
            "aren",
            "wasn",
            "weren",
            "couldn",
            "wouldn",
            "shouldn",
          ]
        fixer: clashFramesT
      # "It's the site that's we are using", "what's I'm doing": "'s" before a whole clause.
      # "you're" and "they're" count only before -ing or "not" ("what's you're name" is "your").
      - regex: "{{START}}(?<target>(?<word>that|what)['’]s){{S}}(?:(?:I|you|we|they|he|she|it){{S}}(?:am|are|is|was|were)|I['’]m|(?:he|she|it)['’]s|we['’]re|(?:you|they)['’]re(?={{S}}(?:[a-z]+ing|not){{E}})){{E}}"
        cue: ["that", "what"]
        fixer: clashFramesWord
      # "I isn't", "I really aren't", "we isn't", "she weren't": a negative be that does not
      # agree with its pronoun. "it" and "you" can be objects ("the ones that made it aren't").
      - regex: "{{START}}(?<subject>I|we|they|he|she)(?:{{S}}(?:just|really|still|also|obviously|actually|simply|certainly|definitely|probably|clearly|usually|honestly|sometimes|finally|ever|even|already))?{{S}}(?<target>(?<be>is|are|was|were)n['’]t){{E}}"
        check: englishPronounVerbWhitelistAgreement
        message: review_msg_pronoun_verb
        cue: ["isn", "aren", "wasn", "weren"]
        fixer: clashFramesBe
      # "He turned 25 year old.", "She is six month old now": a plural count before "old".
      # "a 25 year old" is a noun and wants hyphens.
      - regex: "(?:{{START}}(?:is|was|turned|turns|turn|turning|be|am|are|were|being)|['’](?:s|m|re)){{S}}(?<count>{{COUNT}}){{S}}(?<target>year|month|week|day){{S}}old(?=[ \\t\\u00a0]*(?:[.,;:!?)]|$)|{{S}}(?:and|but|now|today|this|last|when|in){{E}})"
        check: englishNounNumber
        message: review_msg_noun_count
        cue: ["old"]
        fixer: clashFramesYear
      # "My car needs fixed", "The walls need painted": the dialect "need" + participle.
      - regex: "{{START}}(?<subject>[a-z]+){{S}}(?<target>(?<need>needs|need|needed){{S}}(?<verb>[a-z]+ed))(?=[ \\t\\u00a0]*(?:[.!?,;]|$)|{{S}}(?:before|soon|again|now|badly|if|when|or|and){{E}})"
        check: englishVerbComplements
        message: review_msg_verb_complements
        cue: ["need", "needs", "needed"]
        fixer: clashFramesNeed
      # "She wasn't ever be able", "I'm never be able": be, an adverb, then a second be.
      - regex: "(?<target>(?<be>{{START}}(?:isn['’]t|aren['’]t|wasn['’]t|weren['’]t|am|is|are|was|were)|['’](?:m|re|s))(?<adverb>{{S}}(?:ever|never|always|still|just|not)){{S}}be)(?={{S}}(?:able|unable|possible|allowed){{E}})"
        cue: ["able", "unable", "possible", "allowed"]
        fixer: clashFramesBe2
      # "I'm bit lazy", "having bit of a problem", "think little bit different": "a" is missing.
      - regex: "(?:(?<lead>{{START}}[a-z]+|['’](?:m|re|s)){{S}})?(?<target>(?<little>little{{S}})?bit)(?={{S}}(?:of{{S}}an?|too|more|less|late|early|better|worse|different|differently|longer|slow|slower|faster|tired|lazy|busy|confused|stupid|strange|weird|odd|nervous|worried|bored|cold|hot|warm){{E}})"
        check: englishPhraseCorrections
        message: review_msg_contextual_grammar
        cue: ["bit"]
        fixer: clashFramesLittle
      # "Are we have to go?", "Am I finally go home?": be inverted before a base verb.
      - regex: "(?<target>(?<be>{{START}}(?:are|is|am|was|were))(?<rest>{{S}}(?<subject>I|you|we|they|he|she|it)(?:{{S}}(?:just|really|still|also|obviously|actually|simply|certainly|definitely|probably|clearly|usually|honestly|sometimes|finally|ever|even|already))?{{S}})(?<verb>[a-z]+)){{E}}"
        check: englishAuxiliaryBaseVerb
        message: review_msg_question_do
        cue: ["are", "is", "am", "was", "were"]
        fixer: clashFramesBe3
      # Opt-in: "more easy to read" -> "easier", "more clear" -> "clearer".
      - regex: "{{START}}(?<target>more{{S}}(?<adjective>[a-z]{3,8}))(?={{S}}(?:to|for|if|when|with){{E}}|{{S}}than{{S}}(?<other>[a-z]+)|[ \\t\\u00a0]*(?:[.,;:!?)]|$))"
        check: stylePhrasing
        message: review_msg_style_phrasing
        cue: ["more"]
        fixer: clashFramesMore
      # Opt-in: "The reason we left is because…" -> "is that".
      - regex: "{{START}}reason(?:{{S}}[a-z'’]+){0,8}?{{S}}(?:is|was){{S}}(?<target>because){{E}}(?!{{S}}of{{E}})"
        check: stylePhrasing
        message: review_msg_style_phrasing
        cue: ["reason"]
        fix: "that"
      # Opt-in: "Please send both files, please." A second please at the sentence end goes.
      - regex: "{{START}}please{{E}}[^.!?\\n]{1,100}?(?<target>,?{{S}}please)(?=[ \\t\\u00a0]*[.!?])"
        check: stylePhrasing
        message: review_msg_style_phrasing
        cue: ["please"]
        fixer: clashFramesT2
      # Opt-in: "very very cool" -> "very, very cool" or one "very". A word must follow ("so so"
      # alone is "so-so").
      - regex: "{{START}}(?<target>(?<word>very|so|far|long|really){{S}}\\k<word>){{S}}(?=[a-z])"
        check: stylePhrasing
        message: review_msg_style_phrasing
        cue: ["very", "so", "far", "long", "really"]
        fixer: clashFramesWord2

# Phrase tables by name, in index order: "typed = fix", "a | b = fix" for typed variants,
# "fix1; fix2" for choices. The "<module>.phrases", ".compounds" and ".style" tables
