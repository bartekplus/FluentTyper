rules:
  - id: en.fixedPhrases
    checks:
      [
        englishPhraseCorrections,
        englishClosedCompounds,
        englishToToo,
        englishVerbComplements,
        stylePhrasing,
      ]
    predicate: fixedPhrases
  - id: en.confusedWords
    checks: [englishConfusedWords]
    predicate: confusedWords
  - id: en.contextualConfusions
    checks:
      [
        englishUsagePhrases,
        englishContextualCompounds,
        englishPronounCase,
        englishTheirThereTheyAre,
        englishWereWhere,
        englishToToo,
      ]
    predicate: contextualConfusions
  - id: en.idiomPhrases1
    checks: [englishPhraseCorrections]
    message: review_msg_phrase_correction
    frames:
      # "a little of practice": a bare noun after "a little of".
      - regex: "(?<target>a{{S}}little{{S}}of){{S}}(?!{{PARTITIVE}}{{E}})[a-z]+{{E}}(?!['’])"
        fix: ["a little", "a bit of"]
      - regex: "(?<target>along{{S}}time){{E}}(?!{{S}}(?:ago|and|or|axis|axes|series|scales?|dimensions?|lines?){{E}})"
        fix: "a long time"
      - regex: "(?:take|takes|took|taken|taking){{S}}(?<target>advantage{{S}})(?={{DETERMINER}}{{E}})(?!a{{S}}(?:lot|bit|little|few|couple|while){{E}})"
        fix: "advantage of "
      - regex: "(?:after|for|in){{S}}(?<target>while){{COMPLETE}}"
        fix: "a while"
      - regex: "(?:go|goes|went|going|gone){{S}}ahead{{S}}(?<target>an){{S}}(?<verb>[a-z]+){{E}}"
        fixer: goAheadAnd
      - regex: "(?<target>an){{S}}in{{S}}(?!(?:with|at|to|for|on|into|among|groups?|crowd|joke|jokes|house|depth|person|store|game|app){{E}})[a-z]"
        fix: "and"
      - regex: "{{notAfter:one}}another{{S}}(?<target>an{{S}})(?=[a-z])"
        fix: ""
      - regex: "as{{S}}(?<target>follow){{E}}(?!{{S}}(?:up|ups|through|suit|on){{E}})"
        fix: "follows"
      - regex: "(?=on)(?<={{CLAUSE}}|(?<![a-z])(?:and|but|or|so|yet|that){{S}})(?<target>on){{S}}face{{S}}value{{E}}"
        fix: "at"
      - regex: "{{notAfter:not|n['’]t}}(?<target>in){{S}}the{{S}}very{{S}}least{{E}}"
        fix: "at"
      - regex: "(?=besides)(?<=(?:(?<![a-z'’])(?:is|was|are|were|be|been|seems|seemed)|[a-z]['’]s){{S}})(?<target>besides){{S}}the{{S}}point{{E}}"
        fix: "beside"
      - regex: "{{notAfter:the|a}}better{{S}}(?<target>of)(?:{{COMPLETE}}|(?={{S}}(?:[a-z]+ing|with|without|now|at|if|not|than|before|after|when|because|since|for|today|here|there|anyway|financially|then|can|could|will|would|and|but|or|so|overall|already){{E}}))"
        fix: "off"
      - regex: "beware{{S}}(?<target>about|with{{S}}regard{{S}}to|regarding|concerning|against|for|with|among|between){{E}}"
        fix: "of"
      - regex: "{{notAfter:{{POSSESSOR}}|can|could|will|would|may|might|must|should|shall|to|did|does|do|not|n['’]t}}(?<!(?<![a-z'’])(?:{{POSSESSOR}}){{S}}[a-z]+{{S}})(?<target>cause){{S}}it{{S}}is{{E}}"
        fixer: causeItIs
      - regex: "{{notAfter:most|more|least|less}}curious{{S}}(?<target>on|of){{E}}"
        fix: "about"
      - regex: "(?:(?:do|does|did)n['’]t|(?:do|does|did){{S}}not){{S}}(?<target>wan){{E}}"
        fix: "want"
      - regex: "(?<target>(?<aux>do|does|did)n['’]t{{S}}can){{S}}(?<verb>[a-z]+){{E}}"
        fixer: doNotCan
      - regex: "(?<target>during){{S}}ages{{E}}(?![ \\t]*:|{{S}}(?:of{{S}})?[0-9])"
        fix: "for"
      - regex: "(?=in)(?<={{CLAUSE}}|(?:(?<![a-z'’])(?:is|are|am|was|were|be|been|being|already|still|now|currently|while)|[a-z]['’](?:s|re|m)){{S}})(?<target>in){{S}}route{{S}}to{{E}}"
        fix: "en"
      - regex: "(?:I|we|you|they|he|she){{S}}(?<target>fond){{S}}on{{E}}"
        fix: "found"
      - regex: "{{notAfter:I|we|you|they|he|she}}fond{{S}}(?<target>on){{E}}"
        fix: "of"
      - regex: "(?=at{{S}}the{{S}}first)(?<=(?<![a-z])why{{E}}[^.!?\\n]{1,80})(?<target>at){{S}}the{{S}}first{{S}}place{{E}}"
        fix: "in"
      - regex: "{{notAfter:the|a|this|that|its|your|my|our|their|his|her|turn|turned|turns|switch|switched|toggle|toggled|set}}(?<target>(?<word>kind|sort){{S}}off)(?={{S}}[a-z])"
        fixer: kindOfOff
      - regex: "(?<target>kind{{S}}if){{S}}(?<next>[a-z]+){{E}}"
        fixer: kindIf
      - regex: "inspired{{S}}(?<target>from){{E}}(?!{{S}}(?:an?{{S}}(?:early|young)|the{{S}}(?:start|beginning|outset)|day{{S}}one|birth|childhood|then|now){{E}})"
        fix: "by"
  - id: en.idiomCompounds1
    checks: [englishClosedCompounds]
    message: review_msg_closed_compound
    frames:
      - regex: "(?<target>along{{S}}side)(?:{{COMPLETE}}|(?={{S}}(?:the|a|an|this|that|these|those|my|your|his|her|its|our|their|him|them|us|me|it|each|one|other){{E}}))"
        fix: "alongside"
  - id: en.idiomStyle1
    checks: [stylePhrasing]
    message: review_msg_style_phrasing
    frames:
      # "cliche" is an accepted spelling; the accented form is the conventional one.
      # A frame keeps capitals that a single-word style row would read as an abbreviation.
      - regex: "(?<target>cliche)(?=(?:s|d)?{{E}}|-)"
        fix: "cliché"
      # "arrive Monday" is common American usage; "arrive on Monday" is the neutral form.
      - regex: "(?<target>(?<verb>arrive|arrives|arrived|arriving){{S}})(?=(?:monday|tuesday|wednesday|thursday|friday|saturday|sunday|mon|tue|tues|wed|thu|thur|thurs|fri|sat|sun){{E}})"
        fixer: arriveOnDay
  - id: en.idiomPhrases2
    checks: [englishPhraseCorrections]
    message: review_msg_phrase_correction
    frames:
      # "true to her word" keeps a promise.
      - regex: "true{{S}}to{{S}}(?:{{POSSESSIVE}}){{S}}(?<target>words){{E}}"
        fix: "word"
      - regex: "(?:turn|turns|turned|turning){{S}}(?:it|them|this|that){{S}}(?<target>of){{COMPLETE}}"
        fix: "off"
      - regex: "(?:turn|turns|turned|turning){{S}}(?<target>i{{S}}of){{COMPLETE}}"
        fix: "it off"
      - regex: "{{notAfter:I|we|you|they|who|people|users|all|also|still|finally|already|now}}now{{S}}(?<target>know){{S}}as{{E}}(?!{{S}}(?:much|many|well|little|far|soon|long|good|bad|fact|a|an|the|of|it|they|we|i|you){{E}})"
        fix: "known"
      - regex: "on{{S}}(?<target>(?:bi{{S}})?[a-z]+(?:-[a-z]+)*|ad{{S}}hoc){{S}}basis{{E}}"
        fixer: basisArticle
