  - id: en.compoundForms
    checks: [englishClosedCompounds, englishContextualCompounds]
    style: match
    message: review_msg_compounds
    frames:
      # Phrasal verbs whose noun is joined or hyphenated: "a warm up" is "a warm-up". A word
      # after the particle that opens a noun phrase makes it a preposition: "the walk through
      # the park". "(?=\p{L})" opens the long frames: off words (on runs of spaces) their
      # alternations never run.
      - regex: "(?=\\p{L})(?<det>{{COMPOUNDFORMS_ARTICLE}}|(?:after|before|during|since|of|from|with|about|for|in|on){{S}}her){{S}}(?:(?<adj>[a-z]+){{S}})?(?<target>{{COMPOUNDFORMS_PHRASAL_KEYS}}){{E}}"
        check: englishContextualCompounds
        fixer: compoundPhrasalNoun
      # Plurals have no verb reading: "two warm ups", "the kick offs".
      - regex: "(?=\\p{L})(?<target>warm{{S}}ups|mock{{S}}ups|sit{{S}}ups|push{{S}}ups|pull{{S}}ups|chin{{S}}ups|start{{S}}ups|break{{S}}ups|knock{{S}}outs|kick{{S}}offs|take{{S}}downs|take{{S}}overs|take{{S}}offs|take{{S}}aways|buy{{S}}backs|flash{{S}}backs|work{{S}}arounds|work{{S}}outs|roll{{S}}outs|sign{{S}}ups|log{{S}}outs|check{{S}}ups|lay{{S}}outs|lay{{S}}offs|print{{S}}outs|sell{{S}}outs|lock{{S}}downs|shut{{S}}downs|break{{S}}downs|break{{S}}outs|set{{S}}backs|push{{S}}backs|follow{{S}}ups|clean{{S}}ups|cut{{S}}offs|pick{{S}}ups|write{{S}}ups|write{{S}}downs|write{{S}}offs|hook{{S}}ups|mix{{S}}ups|round{{S}}ups|tune{{S}}ups|wake{{S}}ups|stand{{S}}ups|get{{S}}togethers|make{{S}}overs|do{{S}}overs|blow{{S}}outs|come{{S}}backs|hang{{S}}overs|pay{{S}}offs|pay{{S}}outs|give{{S}}aways|get{{S}}aways|carry{{S}}overs|cover{{S}}ups|close{{S}}ups|hold{{S}}ups|let{{S}}downs|melt{{S}}downs|touch{{S}}downs|count{{S}}downs|slow{{S}}downs|trade{{S}}offs|add{{S}}ons|send{{S}}offs|rip{{S}}offs|bail{{S}}outs|black{{S}}outs|burn{{S}}outs|lift{{S}}offs|lock{{S}}outs|shoot{{S}}outs|stand{{S}}offs|take{{S}}outs|turn{{S}}arounds|drive{{S}}throughs|toss{{S}}ups){{E}}"
        check: englishContextualCompounds
        fixer: compoundPhrasalPlural
      # Numbers and units joined before a noun: "a 10 page report", "a two year old car".
      - regex: "(?<![\\p{N}.,/])(?<target>{{COMPOUNDFORMS_NUMBER}}{{S}}(?<unit>{{COMPOUNDFORMS_UNITS}})(?:{{S}}(?<old>old)(?<olds>s)?|-(?<hold>old)(?<holds>s)?)?)(?={{S}}(?<next>[\\p{L}\\p{N}]+)|[ \\t\\u00a0]*(?<end>[.,;:!?)]|$))"
        check: englishContextualCompounds
        fixer: compoundNumberUnit
      # "a two-year old reindeer": the hyphen stops one word short.
      - regex: "(?<![\\p{N}.,/])(?<target>(?<n>[0-9]+|{{COMPOUNDFORMS_NUMBER_WORDS}})-(?<unit>year|month|week|day){{S}}(?<old>old)(?<olds>s)?){{E}}"
        check: englishContextualCompounds
        fixer: compoundAgeOnly
      # "May be I am wrong" opens with the adverb "maybe"; "it may be" is the verb.
      - regex: "(?=may{{S}}be)(?:(?<=(?:^|[.!?(\\n])[ \\t\\u00a0\"“]{0,8})(?<target>may{{S}}be)(?={{S}}(?:I|we|you|he|she|they|there|his|her|my|your|our|their|someone|somebody|something|this|that|it['’]s|not){{E}})|(?<=\\b(?:is|are|was|were|it['’]s|this['’]s|that['’]s){{S}})(?<target2>may{{S}}be)(?={{S}}(?:the|a|an|some|just|because|not|it|this|that|too|very|so|more|less|still|also|only|even|better|worse){{E}})|(?<target3>may{{S}}be)(?={{S}}(?:could|can|should|would|will){{E}}))"
        check: englishContextualCompounds
        owner: none
        fixer: compoundMayBe
      # "sign into your account" is "sign in to"; "signed into law" is the verb with "into".
      - regex: "(?<target>(?<verb>sign|signs|signed|signing|log|logs|logged|logging){{S}}into)(?={{S}}(?:your|my|his|her|our|their|the|an?){{S}}(?:[\\p{L}-]+{{S}})?(?:accounts?|profiles?|apps?|sites?|website|portal|system|computer|e-?mail|server|dashboard|meeting|session|network|device){{E}})"
        check: englishContextualCompounds
        fixer: compoundSignInto
      # "an American born scientist", "English speaking people".
      - regex: "(?<target>(?<place>\\p{L}{3,}){{S}}(?<kind>born|speaking|based)){{E}}"
        check: englishContextualCompounds
        fixer: compoundOrigin
      # "I paid (may be) too much."
      - regex: "(?<=\\()(?<target>may{{S}}be)(?=\\))"
        check: englishContextualCompounds
        fixer: compoundParenMaybe
      # The frames below open with a lookahead on their words: the clause lookbehinds after it
      # then run only where the words are, not at every position (JavaScriptCore's regex
      # interpreter would try them all).
      # "an on going problem", "on going maintenance" at a sentence start; "keep on going" stays.
      - regex: "(?=on{{S}}going)(?:(?<=\\b(?:an|the|their|our|his|her|its|my|your|this|that|any|usual|an{{S}}){{S}})|(?<=(?:^|[.!?\\n])[ \\t\\u00a0]{0,8}))(?<target>on{{S}}going){{E}}"
        check: englishContextualCompounds
        fixer: compoundOnGoing
      # "Does any one need help?": the pronoun before a verb, not "any one of them".
      - regex: "(?=(?:any|some){{S}}one)(?<=(?:^|[.!?;\\n]|\\b(?:does|did|do|can|could|will|would|has|have|is|was|if|when|and|but){{S}})[ \\t\\u00a0]{0,8})(?<target>(?<q>any|some){{S}}one){{S}}(?<verb>[a-z]+){{E}}"
        check: englishContextualCompounds
        fixer: compoundAnyOne
