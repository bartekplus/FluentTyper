        cue: ["by"]
        fixer: slipFramesBy
      # "if it worse", "it safe to say", "she unable to read": the be is missing.
      - regex: "(?<target>(?<pron>it|she|he){{S}}(?<adj>safe|unable|able|worse|better|possible|impossible|likely|unlikely|necessary|important|true|clear|okay|fine|ready))(?={{S}}(?:to|or|than|that|for){{E}}|[ \\t\\u00a0]*[.!?])"
