      # "It is right in many way.": many ways.
      - regex: "(?:in|of){{S}}(?:many|several|various|different|few){{S}}(?<target>way)(?=[ \\t\\u00a0]*[.,!?;])"
        check: englishNounNumber
        message: review_msg_noun_count
        cue: ["way"]
        fix: "ways"
      # "Your order is requires approval", "It is tastes good": be before an -s verb.
      - regex: "(?<target>(?:is|are|was|were){{S}}(?<adverb>(?:always|also|just|really|still|often|never){{S}})?(?<verb>[a-z]+s)){{E}}"
        check: englishSubjectVerbAgreement
        message: review_msg_subject_verb
        cue: ["is", "are", "was", "were"]
        fixer: slipFramesIs
      # "I have than signed it", "you can than forward it": then after an auxiliary.
      - regex: "(?<![\\p{L}'’])(?:can|could|will|would|should|must|might|may|have|has|had|is|was|I|we|you|they|he|she){{S}}(?<target>than){{S}}(?<verb>[a-z]+){{E}}"
        check: englishThenThan
        message: review_msg_then_than_temporal
        cue: ["than"]
        fixer: slipFramesThan
      # "Send it to out team", "the link to out dashboard": our before a noun.
      - regex: "(?<![\\p{L}'’])(?:to|at|from|for|into|about){{S}}(?<target>out){{S}}(?<noun>[a-z]+){{E}}"
        cue: ["out"]
        fixer: slipFramesOut
      # "The team and it's members", "when it's state is changed", "filter it's content": a noun
