      - regex: "(?=\\p{L}){{COMPOUNDFORMS_SLOT}}{{S}}{{COMPOUNDFORMS_ADVERB}}(?<target>{{COMPOUNDFORMS_VERB_KEYS}}){{E}}"
        check: englishClosedCompounds
        fixer: compoundVerb
      # Modifiers hyphenated before a noun; a noun must follow (or a determiner precede).
      - regex: "(?=\\p{L})(?<target>{{COMPOUNDFORMS_MODIFIER_KEYS}}){{E}}"
        check: englishClosedCompounds
        fixer: compoundNounModifier
      # Modifiers after an article or possessive: "the end to end trip", "your go to person".
      - regex: "(?<det>{{COMPOUNDFORMS_DETERMINER}}){{S}}(?<target>multi{{S}}million{{S}}dollar|easy{{S}}to{{S}}understand|person{{S}}to{{S}}person|state{{S}}of{{S}}the{{S}}art|long{{S}}established|life{{S}}threatening|all{{S}}encompassing|difficult{{S}}to{{S}}use|well{{S}}established|record{{S}}breaking|easy{{S}}to{{S}}install|above{{S}}mentioned|month{{S}}to{{S}}month|point{{S}}to{{S}}point|not{{S}}for{{S}}profit|time{{S}}consuming|easy{{S}}to{{S}}follow|million{{S}}dollar|billion{{S}}dollar|second{{S}}largest|fourth{{S}}largest|second{{S}}biggest|second{{S}}highest|out{{S}}of{{S}}the{{S}}way|out{{S}}of{{S}}the{{S}}box|coast{{S}}to{{S}}coast|rags{{S}}to{{S}}riches|do{{S}}it{{S}}yourself|long{{S}}standing|life{{S}}changing|award{{S}}winning|all{{S}}inclusive|easy{{S}}to{{S}}learn|simple{{S}}to{{S}}use|third{{S}}largest|fifth{{S}}largest|third{{S}}biggest|off{{S}}the{{S}}shelf|one{{S}}of{{S}}a{{S}}kind|old{{S}}fashioned|user{{S}}friendly|card{{S}}carrying|cut{{S}}and{{S}}paste|long{{S}}distance|drive{{S}}through|year{{S}}to{{S}}year|step{{S}}by{{S}}step|door{{S}}to{{S}}door|face{{S}}to{{S}}face|head{{S}}to{{S}}head|back{{S}}to{{S}}back|peer{{S}}to{{S}}peer|many{{S}}to{{S}}many|long{{S}}awaited|long{{S}}lasting|mind{{S}}blowing|eye{{S}}catching|best{{S}}selling|fast{{S}}growing|never{{S}}ending|all{{S}}powerful|go{{S}}to{{S}}market|easy{{S}}to{{S}}read|hard{{S}}to{{S}}find|ready{{S}}to{{S}}use|out{{S}}of{{S}}place|high{{S}}quality|well{{S}}meaning|wall{{S}}to{{S}}wall|hand{{S}}to{{S}}hand|fly{{S}}by{{S}}night|dual{{S}}purpose|down{{S}}and{{S}}out|hard{{S}}working|good{{S}}looking|right{{S}}handed|far{{S}}reaching|one{{S}}to{{S}}many|straight{{S}}up|much{{S}}needed|short{{S}}lived|life{{S}}saving|all{{S}}knowing|all{{S}}natural|easy{{S}}to{{S}}use|hard{{S}}to{{S}}use|second{{S}}best|last{{S}}minute|open{{S}}source|first{{S}}class|second{{S}}hand|large{{S}}scale|small{{S}}scale|world{{S}}class|tailor{{S}}made|even{{S}}handed|ill{{S}}advised|out{{S}}of{{S}}body|mom{{S}}and{{S}}pop|cooling{{S}}off|middle{{S}}aged|left{{S}}handed|short{{S}}range|under{{S}}cover|know{{S}}it{{S}}all|end{{S}}to{{S}}end|day{{S}}to{{S}}day|one{{S}}to{{S}}one|up{{S}}to{{S}}date|for{{S}}profit|long{{S}}lived|all{{S}}seeing|third{{S}}best|short{{S}}term|well{{S}}known|full{{S}}scale|high{{S}}level|first{{S}}hand|heavy{{S}}duty|cut{{S}}throat|knife{{S}}edge|open{{S}}ended|long{{S}}range|high{{S}}speed|last{{S}}ditch|single{{S}}use|all{{S}}in{{S}}one|about{{S}}face|so{{S}}called|long{{S}}term|real{{S}}time|top{{S}}notch|low{{S}}level|read{{S}}only|brand{{S}}new|duty{{S}}free|do{{S}}or{{S}}die|follow{{S}}on|brick{{S}}red|full{{S}}time|part{{S}}time|high{{S}}risk|life{{S}}long|out{{S}}going|catch{{S}}all|home{{S}}work|drive{{S}}way|check{{S}}box|all{{S}}time|low{{S}}cost|high{{S}}end|tax{{S}}free|bug{{S}}eyed|new{{S}}look|low{{S}}risk|on{{S}}board|zero{{S}}day|hands{{S}}on|over{{S}}use|all{{S}}new|low{{S}}end|one{{S}}off|post{{S}}it|go{{S}}to|no{{S}}go){{E}}"
        check: englishClosedCompounds
