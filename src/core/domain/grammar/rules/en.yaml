      - regex: "(?<![\\p{L}'’])(?<subject>I|we|they|he|she)(?:{{S}}(?:formally|recently|really|just|also|never|always|often|usually|already|still|only|sometimes|actually|then))?{{S}}(?<target>[a-z]{4,}){{E}}"
