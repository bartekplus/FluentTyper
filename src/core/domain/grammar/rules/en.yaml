# Phrase tables by name, in index order: "typed = fix", "a | b = fix" for typed variants,
# "fix1; fix2" for choices. The "<module>.phrases", ".compounds" and ".style" tables
# follow phraseCorrections, closedCompounds and stylePhrases.
tables:
  phraseCorrections: |
    all of the sudden | all the sudden | all of sudden = all of a sudden
    without further adieu = without further ado
    much adieu about = much ado about
    nip it in the butt | nip this in the butt = nip it in the bud
    nipped it in the butt | nipped this in the butt = nipped it in the bud
    tow the line = toe the line
    tows the line = toes the line
    towed the line = toed the line
    towing the line = toeing the line
    baited breath = bated breath
    case and point = case in point
    doggy dog world | doggie dog world = dog-eat-dog world
    mute point | moo point = moot point
    old wise tale | old wives tale | old wive's tale = old wives' tale
    old wise tales | old wives tales = old wives' tales
    sneak peak = sneak peek
    sneak peaks = sneak peeks
    free reign = free rein
    deep seeded | deep-seeded = deep-seated
    wreck havoc | reek havoc = wreak havoc
    wrecks havoc | reeks havoc = wreaks havoc
    wrecked havoc | reeked havoc = wreaked havoc
    wrecking havoc | reeking havoc = wreaking havoc
    wet my appetite = whet my appetite
    wet your appetite = whet your appetite
    wet his appetite = whet his appetite
    wet her appetite = whet her appetite
    wet our appetite = whet our appetite
    wet their appetite = whet their appetite
    piece of mind = peace of mind
    tongue and cheek = tongue in cheek
    tongue-and-cheek = tongue-in-cheek
    one foul swoop | one fowl swoop = one fell swoop
    damp squid = damp squib
    slight of hand = sleight of hand
    statue of limitations | statue of limitation = statute of limitations
    all intensive purposes = all intents and purposes
    unchartered territory = uncharted territory
    unchartered waters = uncharted waters
    vocal chords = vocal cords
    a whole nother = a whole other
    extract revenge = exact revenge
    hunger pains = hunger pangs
    biting my time = biding my time
    biting your time = biding your time
    biting his time = biding his time
    biting her time = biding her time
    biting our time = biding our time
    biting their time = biding their time
    bare in mind = bear in mind
    bares in mind = bears in mind
    bare with me = bear with me
    bare with us = bear with us
    by in large = by and large
    pass mustard = pass muster
    dire straights = dire straits
    eek out = eke out
    eeked out = eked out
    eeking out = eking out
    by the waste side = by the wayside
    in the same vain, = in the same vein,
    in the same vain as = in the same vein as
    first come, first serve | first come first serve = first come, first served
    hair's breath | hairs breath = hair's breadth
    hay day = heyday
    make due with = make do with
    mind bottling | mind-bottling = mind-boggling
    nerve wrecking | nerve-wrecking = nerve-racking; nerve-wracking
    on tender hooks | on tenderhooks = on tenterhooks
    per say = per se
    prostrate cancer = prostate cancer
    prostrate gland = prostate gland
    scott free | scott-free = scot-free
    shoe-in = shoo-in
    through the ringer = through the wringer
    worse case scenario | worse-case scenario = worst-case scenario
    beckon call = beck and call
    do diligence = due diligence
    on the same token = by the same token
    pre-madonna | pre madonna = prima donna
    irregardless = regardless
    visa versa | vise versa = vice versa
    all be it = albeit
    take affect = take effect
    takes affect = takes effect
