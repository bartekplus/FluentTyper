      - regex: "(?<target>it['’]s){{S}}(?=[a-z])"
        check: englishItsContext
        message: review_msg_its_possessive
        cue: ["it"]
        fixer: slipFramesIt
      # "my big begs", "a grocery beg": bag.
      - regex: "(?:big|small|large|little|green|grocery|shopping|paper|plastic|tea|sleeping|school|travel|gym|garbage|trash|carrier|heavy|empty){{S}}(?<target>begs?){{E}}"
