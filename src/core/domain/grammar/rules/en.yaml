        cue: ["cause"]
        fixer: realWordFramesCause
      # "I though he left", "a problem they though was fixed", "higher than I though.": thought.
      - regex: "(?<![\\p{L}'’])(?<subject>I|you|we|they|he|she){{S}}(?<target>though)(?:{{S}}(?<next>of|about|that|so|it|he|she|I|you|we|they|this|was|is|the|a|my|his|her|their|our){{E}}|(?<end>[ \\t\\u00a0]*[.!?]))"
        cue: ["though"]
