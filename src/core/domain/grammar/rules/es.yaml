          ["hola", (at: SpanishAround) => (/^(?:una|la|gran|esta|esa|aquella|otra|cada|primera|segunda|nueva)$/u.test(at.prev()) ? ["ola"] : null)],
          ["haber", esHaberAVer],
        ])
      # "más efímera aún que": a comparative a few words back.
      esComparative:
        args: "at: SpanishAround"
        return: "[1, 2, 3].some((k) => /^(?:más|menos|mayor|menor|mejor|peor|tanto)$/u.test(at.prev(k)))"
      # "a ver estudiado", "a verlo dicho": "haber" before a participle. "podría a ver sido", "sin a
      # ver dicho", "¡A ver estudiado!"; "vuelva a ver afectado" sees. "Podría a ver otros",
      # "debería a verlo": a modal takes no "a", so "haber" is meant.
      esAVer:
        args: "tokens: SpanishTokens, i: number"
        let:
          ver: tokens[i + 1]
          m: /^(ver|vér)((?:me|te|se|nos|os|le|les|lo|los|la|las){0,2})$/u.exec(ver.lower)
          prev: esAround(tokens, i)
          next: tokens[i + 2]
        when:
          - tokens[i].lower === "a" && ver?.word && !ver.broken
          - m
          - prev.starts || ES_PERFECT_BEFORE.test(prev.prev())
          - >-
            (/^(?:pod|deb|pued|pud)\p{L}*$/u.test(prev.prev()) && !next?.broken) ||
            (next?.word && !next.broken && esIsPerfectParticiple(next.lower) && !esIsNoun(next.lower))
        return: '`hab${m[1] === "vér" ? "é" : "e"}r${m[2]}`'
    frames:
      # "aun que", "han habido", "el menos", "a ver" and the words of CHECKS. The fixer reads
      # the words around the token (review/spanish/confusions.ts).
      - regex: "(?:a|ah|anos?|apunto|ara|a[uú]n|ay|ayan?|bastantes|caso|cuidad|desech[ao]s?|e|echo|eh|el|entorno|haber|hab[ií]an|habr[aá]n|habr[ií]an|hallas?|hallan|han|hay|hayan?|haz|hech(?:os?|as?|an|amos)|hola|hubieran|hubiesen|[ií]ba|[ií]bais|[ií]ban|[ií]bas|[ií]bamos|lamas?|lamamos|lamo|mama|ola|ora|papa|pod(?:o|es|en)|se|sobretodo|tal|trav[eé]s|va|vais|vallas?|vallamos|vallan|vamos|van|vas|ven|voy){{WORD_TAIL}}"
        flags: giu
        scan: owned
        # The homophone checks of the token: "aun que", "han habido", "el menos", "a ver", the checks
        # by word. "aún que" / "aun que" are "aunque" (but "más aún que" compares). Existential
        # "haber" has no plural: "han habido quejas" is "ha habido"; "han habido de irse" (haber de +
        # infinitive, had to) agrees with its subject. "el menos tres": "al menos".
        let:
          tokens: esTokens(ctx)
          i: esTokenAt(tokens, m.index)
          token: tokens[i]
          at: esAround(tokens, i)
          singular: ES_PLURAL_HABER[token.lower]
          haber: esAVer(tokens, i)
          fixes: ES_CONFUSION_CHECKS.get(token.lower)?.(at)
        when:
          - i >= 0
          - token.word && token.start >= ctx.from && token.start < ctx.to
        return: >-
          (token.lower === "aún" || token.lower === "aun") && at.next() === "que" &&
          (at.starts || tokens[i - 1]?.text === "," || (token.lower === "aun" && !esComparative(at)))
            ? esReplaceToken(ctx, esSpan(ctx, token, tokens[i + 1]), ["aunque"], "spanishConfusions", "review_msg_spanish_confusion")
            : singular && at.next() === "habido" && at.next(2) !== "de"
              ? esReplaceToken(ctx, esSpan(ctx, token, tokens[i + 1]), [`${singular} habido`], "spanishConfusions", "review_msg_spanish_confusion")
              : token.lower === "el" && !/^(?:en|a|de|del|hasta|desde|entre|está|es)$/u.test(at.prev()) && at.next() === "menos" &&
                  esIsCount(tokens[i + 2]) && !tokens[i + 2].broken
                ? esReplaceToken(ctx, token, ["al"], "spanishConfusions", "review_msg_spanish_confusion", tokens[i + 1])
                : haber
                  ? esReplaceToken(ctx, esSpan(ctx, token, tokens[i + 1]), [haber], "spanishConfusions", "review_msg_spanish_confusion", tokens[i + 2])
                  : fixes
                    ? esReplaceToken(ctx, token, fixes, "spanishConfusions", "review_msg_spanish_confusion", tokens[i + 1])
                    : null
      # "rebeló que" / "revelarse contra": reveal versus rebel, by the word after.
      - regex: "re[bv]el[\\p{L}\\p{M}]*"
        flags: giu
        scan: owned
        # "rebeló que" / "revelarse contra": reveal versus rebel, by the word after. "el misterio
        # rebelado por el detective": "rebelarse" has no passive; "revelar" does.
        let:
          tokens: esTokens(ctx)
          i: esTokenAt(tokens, m.index)
          token: tokens[i]
          at: esAround(tokens, i)
          parts: /^(re)(b|v)(el\p{L}*)$/u.exec(token.lower)
          next: at.next()
          passive: parts[2] === "b" && /^el(?:ado|ada|ados|adas)$/u.test(parts[3]) && next === "por"
          fix: >-
            passive
              ? `rev${parts[3]}`
              : parts[2] === "v" && next === "contra"
                ? `reb${parts[3]}`
                : parts[2] === "b" && (next === "que" || (ES_DETERMINERS.has(next) && !ES_CLITICS.has(at.prev()) && !parts[3].endsWith("se")))
                  ? `rev${parts[3]}`
                  : null
        when:
          - i >= 0
          - token.word && token.start >= ctx.from && token.start < ctx.to
          - parts && /^el(?:o|a|as|amos|an|é|ó|aron|ar|arse|ado|ada|ados|adas|ando|aba|aban)$/u.test(parts[3])
          - fix
        return: 'esReplaceToken(ctx, token, [fix], "spanishConfusions", "review_msg_spanish_confusion", tokens[i + 1])'
      # "y les medidas", "os interesados": "les" and "os" before a plural noun.
      - regex: "(?:[lL]es|[oO]s){{WORD_TAIL}}"
        flags: gu
        scan: owned
        # "y les medidas", "os interesados" -> "las", "los": "les" and "os" are only clitics, and no
        # clitic goes before a plural noun or participle that is no verb form.
        let:
          tokens: esTokens(ctx)
          i: esTokenAt(tokens, m.index)
          token: tokens[i]
          next: tokens[i + 1].lower
          noun: esReadNoun(next)
          forms: 'noun.gender ? [noun.gender === "f" ? "las" : "los"] : ["los", "las"]'
        when:
          - i >= 0
          - i < tokens.length - 1
          - token.word && token.start >= ctx.from && token.start < ctx.to
          - /^(?:les|os|Les|Os)$/u.test(token.text) && !tokens[i + 1].broken
          - /^\p{Ll}+$/u.test(tokens[i + 1].text) && !ctx.dictionary.has(next)
          - noun?.plural && !esFiniteVerb(next) && !esSecondPersonVerb(next) && !esIsGerund(next)
        return: >-
          esReplaceToken(ctx, token, forms.map((form) => (/^\p{Lu}/u.test(token.text) ? `${form[0].toUpperCase()}${form.slice(1)}` : form)),
            "spanishConfusions", "review_msg_spanish_confusion", tokens[i + 1])
      # "d esta prueba", "n este caso", "l mesa": a lone consonant that lost its vowel.
      - regex: "[dln]{{WORD_TAIL}}"
        flags: gu
        scan: owned
        # "el resultado d esta prueba" -> "de", "pero n este caso" -> "en", "pero l mesa" -> "la": a
        # lone consonant between words, before a determiner or a singular noun, lost its vowel. A
        # letter named or counted ("la n", "los n primeros", "5 l de agua") is left alone. "para todo
        # n natural", "si n vale 3": a variable.
        let:
          tokens: esTokens(ctx)
          i: esTokenAt(tokens, m.index)
          token: tokens[i]
          at: esAround(tokens, i)
          prev: at.prev()
          next: at.next()
          noun: esReadNoun(next)
          singularNoun: "!!noun && !noun.plural"
          fixes: >-
            token.text === "d" && (ES_LEAD_DETERMINERS.has(next) || singularNoun)
              ? ["de"]
              : token.text === "n" && ES_LEAD_DETERMINERS.has(next)
                ? ["en"]
                : token.text === "n" && singularNoun && noun.gender !== "f"
                  ? noun.gender === "m" ? ["un", "en"] : ["un", "una", "en"]
                  : token.text === "l" && singularNoun
                    ? noun.gender ? [noun.gender === "f" ? "la" : "el"] : ["el", "la"]
                    : []
        when:
          - i >= 1 && i < tokens.length - 1
          - /^[dln]$/u.test(token.text) && token.start >= ctx.from && token.start < ctx.to
          - prev && next && /^\p{Ll}/u.test(tokens[i + 1].text)
          - '!(ES_DETERMINERS.has(prev) || ES_PREPOSITIONS.has(prev) || /^(?:letra|letras|todo|cada|cualquier|si|sea)$/u.test(prev))'
          - fixes.length
        return: 'esReplaceToken(ctx, token, fixes, "spanishConfusions", "review_msg_spanish_confusion", tokens[i + 1])'
  - id: es.verbForms
    checks: [spanishConfusions]
    group: spanishConfusions
    style: match
    message: review_msg_spanish_verb_form
    # Verb forms after an auxiliary ("han realizando" -> realizado, "ha ido aumentado" ->
    # aumentando), the auxiliary "ha"/"he" written as the preposition "a" or the conjunction "e",
    # and "de que" against the verbs that take or refuse it.
    sets:
      # "había llamadas": existential forms also stand before plural nouns.
      ES_EXISTENTIAL: [había, hubo, habrá, haya, hubiera, hubiese, habría, haber, habiendo]
      ES_ESTAR: [estoy, estás, está, estamos, estáis, están, estaba, estabas, estábamos, estaban]
      ES_PERFECT: [he, has, ha, hemos, habéis, han, había, habías, habíamos, habían]
      ES_QUANTIFIER_AFTER: [todos, todas, ambos, ambas, dos, tres, cuatro, cinco, seis, siete, ocho, nueve, diez, cien, mil, varios, varias]
      ES_BEFORE_AUXILIARY: [él, ella, usted, ello, me, te, se, nos, os, le, les, lo, la, "no", ya, siempre, nunca, también, todavía]
      # Verbs and phrases that take "de que" (queísmo when it is missing) and those that refuse it.
      ES_DAR:
        [
          di, diste, dio, dimos, disteis, dieron, doy, das, da, damos, dan, daba, dabas, dábamos, daban, dado, dar,
          darse, darme, darte, darnos, dé, des, den, diera, dieras, dieran, daría, darás, dará,
        ]
      ES_REFLEXIVE: [me, te, se, nos, os]
      ES_IMPERSONAL: [posible, fácil, probable, necesario, importante, seguro, cierto, difícil]
      # Irregular verb forms that are also nouns: "le vino", "le traje", "les dije".
      ES_VERB_NOUNS: [vino, traje, dije, puse, tuve, hice, vine, fui, cupo]
      ES_HABER_DE: [he, has, ha, hemos, habéis, han, había, habían, habrá, habrán]
      # Words after a modal that are no verb form, though they look like one: "no me gusta nada".
      ES_NOT_GOVERNED:
        [
          nada, cada, toda, nunca, siempre, ahora, entre, sobre, bajo, este, esta, ese, esa, aquella, otra, otro,
          cerca, fuera, dentro, arriba, abajo, delante, detrás, antes, mientras, tarde, pronto, alguna, ninguna,
          mucha, poca, demasiada, tanta, cuanta, media, mitad, que,
        ]
      # Subordinators after which "puede"/"quiere" stand alone: "cuando puede, intenta escapar".
      ES_ALONE_AFTER: [cuando, como, si, donde, quien, quienes, mientras, según]
      ES_VF_DEGREE: [muy, más, menos, tan, bastante, demasiado]
      # Words that read as finite verbs but close set phrases after these prepositions: "de veras",
      # "con creces".
      ES_AFTER_PREPOSITION: [veras, creces, sobra, sobras]
    maps:
      # "nos acomodarnos" -> "nos acomodamos": the clitic written twice around an infinitive.
      ES_FIRST_PLURAL: { ar: amos, er: emos, ir: imos }
      ES_ARTICLE_FORMS: { m: [el, los], f: [la, las] }
    defs:
      # "huele a quemado", "sabe a podrido": a smell or taste, not the auxiliary.
      ES_SENSES: /^(?:huel\p{L}*|ol\p{L}*|sab\p{L}*|sup\p{L}*)$/u
      ES_PRONOMINAL: /^(?:alegr|quej|enter|acord|acuerd|olvid|hart|arrepent|arrepient|convenc)\p{L}*$/u
      ES_SAYING: /^(?:pienso|piensa|piensas|pensamos|piensan|pensaba|pensé|pensó|creo|cree|crees|creemos|creen|creía|opino|opina|opinan|considero|considera|dijo|dije|dicen|digo|dice|decía|supongo|imagino|afirmó|afirma|comentó|asegura|aseguró|anunció|anunciar|explicó|declaró|parece|resulta|resultó)$/u
      # Verbs whose complement is an infinitive: "debería funcionar", "suele llegar", "me gusta
      # comer".
      ES_VF_MODALS: /^(?:deb(?:e|en|o|es|emos|ía|ías|ían|ería|erían|erías|eríamos|ió|ieron|erá|erán|erás)|suel(?:e|en|o|es)|sol(?:ía|ían|íamos)|pued(?:e|en|o|es)|pod(?:emos|ía|ías|ían|ría|rían|rías|rá|rán|rás)|gust(?:a|aba|aría|aban|an))$/u
      # "tener que", "hay que", "haber de": the phrase's last word comes right before the infinitive.
      ES_VF_TENER: /^(?:t(?:ien|eng|en|uv|endr)\p{L}*|hay|había|habrá|habría)$/u
      ES_PAST_OR_CONDITIONAL: /(?:aba|abas|aban|ábamos|rías?|rían|ríamos|aron|ieron|asteis|isteis|aste|iste)$/u
      # Futures that do not keep the infinitive whole ("mantener" -> "mantendrá").
      ES_IRREGULAR_FUTURE: >-
        [
          ["tener", "tendrá"], ["poner", "pondrá"], ["salir", "saldrá"], ["venir", "vendrá"], ["valer", "valdrá"],
          ["poder", "podrá"], ["querer", "querrá"], ["saber", "sabrá"], ["caber", "cabrá"], ["haber", "habrá"],
          ["hacer", "hará"], ["decir", "dirá"],
        ] as const
      # "le ha dado", "te he encontrado": the "haber" a clitic before a participle needs.
      ES_PERFECT_FOR: >-
        new Map([
          ["me", ["he", "ha"]], ["te", ["ha", "he"]], ["se", ["ha", "han"]], ["le", ["ha", "he"]],
          ["les", ["ha", "he"]], ["nos", ["ha", "hemos"]], ["os", ["ha", "habéis"]],
        ])
      # The gerund of a regular participle's verb: "aumentado" -> "aumentando", "leído" -> "leyendo".
      esGerundOf:
        args: "word: string"
        let:
          ado: /^(\p{L}+)ado$/u.exec(word)
          ido1: /^(\p{L}+)ído$/u.exec(word)
          ido: /^(\p{L}+)ido$/u.exec(word)
        return: 'ado ? `${ado[1]}ando` : ido1 ? `${ido1[1]}yendo` : ido ? `${ido[1]}iendo` : null'
      # "salpicadas" -> "salpicado", "realizando" -> "realizado", "encontraron" -> "encontrado".
      # `nominal`: an agreeing participle may be an adjective or noun here ("había determinadas").
      esPerfectOf:
        args: "word: string, nominal: boolean"
        let:
          agreement: esParticiple(word)
          ando: /^(\p{L}+)ando$/u.exec(word)
          iendo: /^(\p{L}+)iendo$/u.exec(word)
          aron: /^(\p{L}+)aron$/u.exec(word)
          ieron: /^(\p{L}+)ieron$/u.exec(word)
        return: >-
          agreement && (agreement.feminine || agreement.plural) && !nominal
            ? word.replace(/[oa]s?$/u, "o")
            : ando && esIsGerund(word) && esIsVerb(`${ando[1]}ar`)
              ? `${ando[1]}ado`
              : iendo && esIsGerund(word) && (esIsVerb(`${iendo[1]}er`) || esIsVerb(`${iendo[1]}ir`))
                ? `${iendo[1]}ido`
                : aron && esIsVerb(`${aron[1]}ar`)
                  ? `${aron[1]}ado`
                  : ieron && (esIsVerb(`${ieron[1]}er`) || esIsVerb(`${ieron[1]}ir`)) ? `${ieron[1]}ido` : null
      # "he intenta", "me he cansa", "he decido", "he quedé" -> "intentado", "cansado", "decidido".
      # "volver ha casa" is the preposition and "ha desecho" a misspelled "deshecho": a noun reading
      # leaves the word alone (an adjective one, "intenta", does not).
      esFinitePerfect:
        args: "word: string"
        let:
          ar: /^(\p{L}{2,}?)(?:o|a|as|an|e|es|en|é|ó|aste|ad|amos)$/u.exec(word)
          erIr: /^(\p{L}{2,}?)(?:o|e|es|en|í|ió|iste|ed|id|emos|imos)$/u.exec(word)
          found: >-
            [
              ...new Set(
                [
                  ar && esIsVerb(`${ar[1]}ar`) ? `${ar[1]}ado` : null,
                  erIr && (esIsVerb(`${erIr[1]}er`) || esIsVerb(`${erIr[1]}ir`)) ? `${erIr[1]}ido` : null,
                ].filter((fix) => fix !== null),
              ),
            ]
        when:
          - '!(word.length < 4 || !esFiniteVerb(word) || esIsInfinitive(word) || esIsGerund(word))'
          - '!esIsNoun(word)'
          - '!(esParticiple(word)?.feminine === false && /[ai]do$/u.test(word))'
        return: "found.length === 1 ? found[0] : null"
      # The auxiliary "ha" written as the preposition "a" before a participle: "se a ido", "ella a
      # vuelto", "el atleta a corrido", "A templado los ánimos". The preposition stays in "ponerse a
      # cubierto", "a pedido de", "huele a quemado", "de acusador a acusado" and "sujetos a borrado".
      # After a clitic, a subject pronoun or a verb's adverb only the auxiliary fits, even before a
      # participle that is a noun too ("dicho", "estado"). Opening the sentence before what the
      # verb takes: "A templado los ánimos". A noun subject right before: "el atleta a corrido"
      # ("fue a parar" has no participle).
      esAuxiliaryA:
        args: "at: SpanishAround"
        let:
          prev: at.prev()
          next: at.next()
          typed: at.tokens[at.i].text
          nextToken: at.tokens[at.i + 1]
        when:
          - esIsPerfectParticiple(next) && !nextToken.broken
          - typed === "a" || (typed === "A" && at.starts)
          - '!/^(?:cubierto|salvo|medio|pedido|contado)$/u.test(next)'
        return: >-
          ES_BEFORE_AUXILIARY.has(prev) || /^(?:alguien|nadie|quien)$/u.test(prev)
            ? true
            : at.starts && !esIsNoun(next) && (ES_DETERMINERS.has(at.next(2)) || at.next(2) === "de")
              ? true
              : /^(?:el|la|un|una|este|esta|ese|esa|mi|tu|su)$/u.test(at.prev(2)) && esIsNoun(prev) && !esFiniteVerb(prev)
                ? true
                : !esAttribute(prev)?.plural && !esIsNoun(next) && !esGenderedForm(next) && !ES_SENSES.test(prev) &&
                  !ES_CLITICS.has(prev) && /^\p{Ll}/u.test(nextToken.text) && at.tokens[at.i + 2]?.text !== "-" &&
                  ![1, 2, 3, 4].some((k) => at.prev(k) === "de")
        else: "false"
      # "ha salpicadas", "han realizando", "se han encontraron": the participle after "haber".
      # "había determinadas posibilidades": an adjective before its noun. "había empadronados",
      # "haya malentendidos": existential "haber" takes nominal participles; "1.900 ha
      # desarboladas" is the hectare. "pueden haber cambiado", "se puede haber dicho": existential
      # "haber" takes a singular modal and no "se", so after these the infinitive is the perfect's
      # ("pueden haber muertos" is a plural modal before existential "haber" and a noun). "Los
      # precios pueden haber…": a plural modal after its subject ("Pueden haber heridos" lacks one
      # and is existential). "habían clasificados todos los papeles": a quantifier or number starts
      # no noun phrase the participle could describe.
      esAfterHaber:
        args: "at: SpanishAround, word: string, prev: string, next: string"
        let:
          existential: >-
            ES_EXISTENTIAL.has(prev) && !ES_REFLEXIVE.has(at.prev(2)) &&
            !(prev === "haber" && !esIsNoun(word) &&
              (/^(?:\p{L}+(?:mos|is)|puedo|debo|podría|debería)$/u.test(at.prev(2)) ||
                (/^\p{L}+n$/u.test(at.prev(2)) && esSubjectAt(at, 3)) || at.prev(3) === "se"))
          nominal: existential || (esIsNoun(next) && !ES_QUANTIFIER_AFTER.has(next) && !/^\p{N}/u.test(next))
          fix: 'esPerfectOf(word, nominal) ?? (existential ? null : esFinitePerfect(word))'
        when: ES_HABER.has(prev) && !/^\p{N}/u.test(at.tokens[at.i - 2]?.text ?? "")
        return: "fix && fix !== word ? [fix] : null"
      # "nos hemos ido cansado": after a plural "haber" + "ido", a singular participle agrees with
      # nothing, so it is the gerund (or the plural adjective). "ha ido aumentado", "ha estado
      # intentado", "me estoy acostumbrado": a gerund. "ha estado interesado", "se fue cansado": an
      # adjective may follow; only a plain participle ("aumentado", "intentado") wants the gerund.
      # "estás intentado burlarte"; "está permitido fumar" is a passive.
      esGerundForParticiple:
        args: "at: SpanishAround, word: string, prev: string, next: string"
        let:
          gerund: esGerundOf(word)
        return: >-
          prev === "ido" && /^(?:hemos|habéis|han|habíamos|habíais|habían)$/u.test(at.prev(2)) && /[ai]do$/u.test(word) &&
          esParticiple(word) && gerund
            ? [gerund, `${word}s`]
            : esIsPerfectParticiple(word) && !esIsNoun(word) && !esGenderedForm(word) &&
                (((prev === "ido" || prev === "estado") && ES_PERFECT.has(at.prev(2))) ||
                  ((prev === "ido" || prev === "estado") && ES_CLITICS.has(at.prev(2))) ||
                  (ES_ESTAR.has(prev) && /^(?:me|te|se|nos|os)$/u.test(at.prev(2))) ||
                  (ES_ESTAR.has(prev) && esIsInfinitive(next) && /^(?:intent|trat|procur|pens)ado$/u.test(word))) &&
                gerund
              ? [gerund]
              : null
      # "nos e incluido", "siempre e ido": after a clitic, a subject pronoun or a verb's adverb only
      # the auxiliary fits, even before a participle that is a noun too ("dicho", "estado"). "E
      # invitado a un amigo": a sentence opens with the auxiliary, not with "and". "siempre e
      # comido": "e" (and) only goes before an i- sound. "lo ha vuelto ha hacer", "ha estos": the
      # preposition "a". "volver ha casa", "voy ha Sevilla": a verb of motion or an infinitive, then
      # a place; "comer ha sido" keeps the auxiliary before its participle.
      esAuxiliaryForms:
        args: "at: SpanishAround, word: string, prev: string, next: string"
        let:
          after: at.tokens[at.i + 1]
        return: >-
          word === "a" && esAuxiliaryA(at)
            ? ["ha"]
            : word === "e" && at.tokens[at.i].text === word && esIsPerfectParticiple(next) &&
                (ES_BEFORE_AUXILIARY.has(prev) || prev === "yo")
              ? ["he"]
              : word === "e" && at.starts && at.tokens[at.i].text === "E" && esIsPerfectParticiple(next)
                ? ["he"]
                : word === "e" && esIsPerfectParticiple(next) && !/^h?i/u.test(next)
                  ? ["he"]
                  : word === "ha" && next
                    ? esIsInfinitive(next) && next !== "haber"
                      ? ["a"]
                      : (ES_IR.has(prev) || /^(?:volver|regresar|llegar|venir|ir)$/u.test(prev)) && after.word &&
                          !esIsPerfectParticiple(next) && !/^(?:de|que|sido|estado)$/u.test(next)
                        ? ["a"]
                        : /^(?:este|esta|estos|estas|ese|esa|esos|esas|los|las|el|la)$/u.test(next) && !/^\p{Lu}/u.test(after.text) &&
                            !at.starts
                          ? ["a"]
                          : null
                    : null
      # The fixes of the word after an auxiliary, or null.
      esVerbFormCheck:
        args: "at: SpanishAround"
        let:
          word: at.tokens[at.i].lower
          prev: at.prev()
          next: at.next()
        return: >-
          esAfterHaber(at, word, prev, next) ?? esGerundForParticiple(at, word, prev, next) ??
          esAuxiliaryForms(at, word, prev, next)
      # "nos alegramos", "me quejo", "se han enterado", "alegrarse": the verb is reflexive. "me
      # alegra que" (it pleases me) is not reflexive: the verb agrees with the pronoun.
      esReflexive:
        args: "at: SpanishAround"
        let:
          verb: at.prev()
          k: '/(?:ado|ido)$/u.test(verb) && ES_HABER.has(at.prev(2)) ? 3 : 2'
          pronoun: at.prev(k)
        return: >-
          /(?:ar|er|ir|ndo)(?:se|me|te|nos|os)$/u.test(verb)
            ? true
            : !ES_REFLEXIVE.has(pronoun)
              ? false
              : k === 3
                ? true
                : pronoun === "me"
                  ? /(?:o|é|aba|ía)$/u.test(verb)
                  : pronoun === "te"
                    ? /s(?:te)?$/u.test(verb)
                    : pronoun === "nos"
                      ? /mos$/u.test(verb)
                      : pronoun === "os" ? /is$/u.test(verb) : !/(?:o|é|mos)$/u.test(verb)
      # "se dio cuenta que", "nos alegramos que", "estoy seguro que": "de que". "pienso de que", "es
      # posible de que", "me alegra de que": just "que". The last token of the phrase and its fix.
      esDeQue:
        args: "tokens: SpanishTokens, i: number"
        let:
          at: esAround(tokens, i)
          word: tokens[i].lower
          prev: at.prev()
        return: >-
          word === "que" && !tokens[i].broken &&
          ((prev === "cuenta" && ES_DAR.has(at.prev(2))) || (ES_PRONOMINAL.test(prev) && esReflexive(at)) ||
            (/^segur[oa]s?$/u.test(prev) && /^(?:estoy|estás|está|estamos|están|estaba|estaban|estar)$/u.test(at.prev(2))))
            ? { to: i, fix: "de que" }
            : word === "de" && at.next() === "que" && tokens[i + 1]?.text === "que" &&
                (ES_SAYING.test(prev) || (ES_IMPERSONAL.has(prev) && /^(?:es|era|sería|será|fue)$/u.test(at.prev(2))) ||
                  (/^(?:alegra|alegró|alegraba)$/u.test(prev) && /^(?:me|te|le|nos|os|les)$/u.test(at.prev(2))))
              ? { to: i + 1, fix: "que" }
              : null
      # "ayudar" -> ["ayuda", "ayudará"]: the third person the clitic most often goes with. Stems
      # that may change ("encuentra", "pide", "envía") get no guessed present.
      esThirdPerson:
        args: "infinitive: string"
        let:
          irregular: ES_IRREGULAR_FUTURE.find((pair) => infinitive.endsWith(pair[0]))
          future: 'irregular ? `${infinitive.slice(0, -irregular[0].length)}${irregular[1]}` : `${infinitive}á`'
          stem: infinitive.slice(0, -2)
          lastVowel: /[aeiouáéíóú](?=[^aeiouáéíóú]*$)/u.exec(stem)?.[0]
        return: >-
          irregular || !lastVowel || /[eo]/u.test(lastVowel) || /[iu]$/u.test(stem)
            ? [future]
            : [`${stem}${infinitive.endsWith("ar") ? "a" : "e"}`, future]
      # A clitic where Spanish allows none: before an infinitive ("te ayudar"), before a participle
      # without "haber" ("le dado"), or before a noun where the article goes ("les medidas"). "un te
      # helado": the tea; "No se nadar" is "sé". "le valido", "le olvido": a first person present
      # that looks like a participle; "le hecho sal": the verb "echar". "les tenias", "le sabia": an
      # imperfect missing its accent.
      esCliticSlot:
        args: "tokens: SpanishTokens, i: number"
        let:
          at: esAround(tokens, i)
          clitic: tokens[i].lower
          next: at.next()
          nextToken: tokens[i + 1]
          inf: /^(\p{L}+?)([aei])r(nos)?$/u.exec(next)
          noun: esReadNoun(next)
        when:
          - ES_PERFECT_FOR.has(clitic) && next && /^\p{Ll}/u.test(nextToken.text)
          - '!(clitic === "se" || /^(?:un|el|del|al|mi|tu|su)$/u.test(at.prev()))'
        return: >-
          inf && esIsVerb(`${inf[1]}${inf[2]}r`)
            ? inf[3]
              ? clitic === "nos"
                ? { from: i + 1, to: i + 1, fixes: [`${inf[1]}${ES_FIRST_PLURAL[`${inf[2]}r`]}`], key: "review_msg_spanish_verb_form" as const }
                : null
              : { from: i + 1, to: i + 1, fixes: esThirdPerson(`${inf[1]}${inf[2]}r`), key: "review_msg_spanish_verb_form" as const }
            : esIsPerfectParticiple(next) && !esIsVerb(`${next.slice(0, -1)}ar`) && next !== "hecho" && at.next(2) !== "de" &&
                !/^(?:nos|os)$/u.test(clitic)
              ? {
                  from: i,
                  to: i + 1,
                  fixes: ES_PERFECT_FOR.get(clitic)!.map((aux) => `${clitic} ${aux} ${next}`),
                  key: "review_msg_spanish_verb_form" as const,
                }
              : !noun?.gender || !/^(?:le|les|nos|os)$/u.test(clitic) || esParticiple(next) || noun.plural !== (clitic !== "le") ||
                  (/ia[sn]?$/u.test(next) && ["er", "ir"].some((e) => esIsVerb(next.replace(/ia[sn]?$/u, e)))) ||
                  esFiniteVerb(next) || esSubjunctiveLike(next) || esIsGerund(next) || ES_VERB_NOUNS.has(next) ||
                  ES_DETERMINERS.has(next)
                ? null
                : {
                    from: i,
                    to: i,
                    fixes: [ES_ARTICLE_FORMS[noun.gender][noun.plural ? 1 : 0]],
                    key: "review_msg_spanish_pronoun_article" as const,
                  }
      # "empezó a involucrase", "al encontrase": a preposition takes the infinitive ("-arse"), never
      # the imperfect subjunctive; "se va a celebra": "ir a" takes the infinitive.
      esPrepositionVerb:
        args: "at: SpanishAround"
        let:
          word: at.tokens[at.i].lower
          prev: at.prev()
          ase: /^(\p{L}{3,}?)ase$/u.exec(word)
          iese: /^(\p{L}{2,}?)iese$/u.exec(word)
          iese1: 'iese ? [`${iese[1]}er`, `${iese[1]}ir`].find((v) => esIsVerb(v)) : undefined'
          bare: /^(\p{L}{3,}?)([ae])$/u.exec(word)
          bare1: >-
            prev === "a" && bare && ES_IR.has(at.prev(2)) && !esGenderedForm(word)
              ? (bare[2] === "a" ? [`${bare[1]}ar`] : [`${bare[1]}er`, `${bare[1]}ir`]).find((v) => esIsVerb(v))
              : undefined
        when: /^(?:a|al|de|del|para|sin|por|tras|hasta)$/u.test(prev) && !esIsNoun(word)
        return: >-
          ase && esIsVerb(`${ase[1]}ar`)
            ? `${ase[1]}arse`
            : iese1
              ? `${iese1}se`
              : bare1 ?? null
      # A word that starts what "ser" takes and no verb: "el mejor", "muy fácil", "aprobado".
      esAttributeAfter:
        args: "next: string"
        return: >-
          !!next && !esFiniteVerb(next) &&
          (ES_DETERMINERS.has(next) || ES_VF_DEGREE.has(next) || !!esAttribute(next) || esIsInvariantEntry(next) ||
            esIsNoun(next) || /^(?:mejor|peor|mayor|menor)$/u.test(next))
      # "debería funciona" -> "funcionar", "tiene que considera" -> "considerar". "¿Qué tiene que
      # cree que es el mejor?": after a question word "que" may be a relative. "tiene que se el
      # mejor", "va a se muy fácil": "se" before no verb lost the "r" of "ser". "deberán
      # formalizase", "podías encontrara": a past subjunctive that lost the infinitive's "r"
      # ("formalizarse", "encontrar"). "tiene que cree", "debe considera": the infinitive lost its
      # last "r" ("creer", not "crear").
      esGovernedVerb:
        args: "at: SpanishAround"
        let:
          word: at.tokens[at.i].lower
          prev: at.prev()
          governs: >-
            (ES_VF_MODALS.test(prev) && !ES_ALONE_AFTER.has(at.prev(2)) &&
              (!/^gust/u.test(prev) || (ES_CLITICS.has(at.prev(2)) && !ES_ALONE_AFTER.has(at.prev(3))))) ||
            (prev === "que" && ES_VF_TENER.test(at.prev(2))) || (prev === "de" && ES_HABER_DE.has(at.prev(2))) ||
            (word === "se" && prev === "a" && ES_IR.has(at.prev(2)))
          past: /^(\p{L}{2,}?)(ara|ase|iera|iese)$/u.exec(word)
          ending: 'past ? (past[2].startsWith("a") ? "ar" : ["er", "ir"].find((e) => esIsVerb(`${past[1]}${e}`))) : undefined'
        when:
          - prev && /^\p{Ll}/u.test(at.tokens[at.i].text) && !ES_NOT_GOVERNED.has(word)
          - governs
          - '!(prev === "que" && /^(?:qué|cuál|cuáles)$/u.test(at.prev(3)) && esFiniteVerb(word))'
        return: >-
          word === "se"
            ? esAttributeAfter(at.next()) ? "ser" : null
            : ES_CLITICS.has(word) || ES_DETERMINERS.has(word) || ES_DETERMINER.has(word)
              ? null
              : esIsNoun(word) || esGenderedForm(word) || esParticiple(word) || esIsInfinitive(word)
                ? null
                : past && ending && esIsVerb(`${past[1]}${ending}`)
                  ? `${past[1]}${ending}${past[2] === "ase" ? "se" : ""}`
                  : /[ae]$/u.test(word) && esIsVerb(`${word}r`)
                    ? `${word}r`
                    : esPresentInfinitive(word)
      # "de debería probar", "desde es adulto", "en sueles": a preposition right before a form that
      # is only a finite verb. "desde" lost its "que"; the others hide a mistyped word. "de lo
      # debemos", "en los estamos": a pronoun between changes nothing; it needs a verb. "de las
      # cases": a present subjunctive no noun shares counts too. "la de es la cuarta letra": the
      # letter's name. "desde es adulto": "es" is the letter's name too, but no preposition takes
      # that. Only endings no noun or adverb shares ("debería", "cantaba", "llegaron"); a present
      # form ("arriba", "sede") is too often a word the lexicon does not list as a noun.
      esStrayFinite:
        args: "at: SpanishAround"
        let:
          word: at.tokens[at.i].lower
          k: 'ES_CLITICS.has(at.prev()) && at.prev() !== "se" ? 2 : 1'
          prev: at.prev(k)
        when: /^(?:de|del|en|con|desde|sin)$/u.test(prev) && /^\p{Ll}+$/u.test(at.tokens[at.i].text)
        return: >-
          k === 2
            ? prev === "del" || prev === "desde"
              ? false
              : (ES_PAST_OR_CONDITIONAL.test(word) || /^\p{L}{2,}(?:amos|emos|imos)$/u.test(word) ||
                  (/^\p{L}{2,}(?:e|es)$/u.test(word) && esSubjunctiveLike(word) && !esGenderedForm(word))) &&
                esFiniteVerb(word) && !esIsNoun(word) && !esAttribute(word) && !esIsInfinitive(word)
            : at.tokens[at.i - 2]?.text === "-" || ES_AFTER_PREPOSITION.has(word)
              ? false
              : /^(?:la|una|letra)$/u.test(at.prev(2))
                ? false
                : /^(?:es|eres|soy|somos|estoy|hay|fue|fui|fueron)$/u.test(word)
                  ? true
                  : ES_PAST_OR_CONDITIONAL.test(word) && esFiniteVerb(word) && !esIsNoun(word) && !esAttribute(word) &&
                    !esIsInfinitive(word) && !esIsGerund(word) && !ES_CLITICS.has(word) && !ES_DETERMINERS.has(word) &&
                    !ES_DETERMINER.has(word) && !ES_PREPOSITIONS.has(word) &&
                    !/^(?:que|como|cuando|donde|si|no|ya|más|menos|bien|mal|tal|tan|sí)$/u.test(word)
        else: "false"
      # The finding of a preposition before a stray finite verb: "desde" wants "desde que", the
      # others are a warning.
      esStrayFiniteFinding:
        args: "ctx: DetectContext, tokens: SpanishTokens, i: number"
        let:
          token: tokens[i]
          prep: 'ES_CLITICS.has(tokens[i - 1].lower) && tokens[i - 2]?.word ? tokens[i - 2] : tokens[i - 1]'
          desde: prep.lower === "desde"
          found: >-
            esReplaceToken(ctx, desde ? prep : esSpan(ctx, prep, token), desde ? ["desde que"] : [], "spanishConfusions",
              desde ? "review_msg_spanish_verb_form" : "review_msg_spanish_preposition_verb", token)
        return: "found && (desde ? found : { ...found, warningOnly: true as const })"
    frames:
      # Every word: the checks key on verb forms, which are no closed list. The fixer reads the
      # auxiliary, the clitics and the verb forms around the token (review/spanish/verbForms.ts).
      - regex: "{{TOKEN_WORD}}"
        flags: gu
        scan: owned
        # The verb form checks of the token: clitic slots, infinitives, stray finite verbs, "de que".
        let:
          tokens: esTokens(ctx)
          i: esTokenAt(tokens, m.index)
          token: tokens[i]
          slot: esCliticSlot(tokens, i)
          infinitive: esPrepositionVerb(esAround(tokens, i)) ?? esGovernedVerb(esAround(tokens, i))
          stray: esStrayFinite(esAround(tokens, i))
          fixes: esVerbFormCheck(esAround(tokens, i))
          de: esDeQue(tokens, i)
        when:
          - i >= 0
          - token.word && token.start >= ctx.from && token.start < ctx.to
        return: >-
          slot
            ? esReplaceToken(ctx, esSpan(ctx, tokens[slot.from], tokens[slot.to]), slot.fixes, "spanishConfusions", slot.key, tokens[i])
            : infinitive
              ? esReplaceToken(ctx, token, [infinitive], "spanishConfusions", "review_msg_spanish_verb_form", tokens[i - 1])
              : stray
                ? esStrayFiniteFinding(ctx, tokens, i)
                : fixes
                  ? esReplaceToken(ctx, token, fixes, "spanishConfusions", "review_msg_spanish_verb_form", tokens[i + 1])
                  : de
                    ? esReplaceToken(ctx, esSpan(ctx, token, tokens[de.to]), [de.fix], "spanishConfusions", "review_msg_spanish_verb_form", tokens[de.to + 1])
                    : null
  - id: es.prefixes
    checks: [spanishConfusions]
    group: spanishConfusions
    style: match
    message: review_msg_closed_compound
    # Spanish prefixes join the word they modify: "anti ruso" -> "antirruso", "ex-colonias" ->
    # "excolonias". Apart or hyphenated only before a capital, a number or a phrase.
    sets:
      # Prefixes that are also words ("ex", "pro", "tele", "foto", "euro"): joined when hyphenated,
      # or apart when the joined form is a word the dictionary knows ("micro biología"). The FREE
      # fragment holds the same list.
      ES_FREE_PREFIXES:
        [
          ex, pro, des, post, poli, tele, video, foto, euro, afro, micro, macro, mini, ultra, super, súper, auto,
          radio, bio, eco, socio, mega, giga, kilo, zoo, extra, astro, hispano, anglo, franco, luso, físico,
          químico, cuasi,
        ]
      # Free prefixes that join any adjective they grade: "pro democrático", "ultra conservador",
      # "cuasi perfecto"; the words themselves stand before nouns ("los pro y los contra").
      ES_GRADING_PREFIXES: [pro, ultra, cuasi, super, súper]
      # Adjective forms that open a compound of two related adjectives.
      ES_RELATIONAL_PREFIXES: [hispano, anglo, franco, luso, físico, químico]
      ES_SIZE_PREFIXES: [macro, micro, mini, mega, maxi]
    defs:
      # A noun or adjective the dictionary lists: "microbiología", "hispanohablantes". A noun ending
      # alone ("-sión") says nothing after "des", which is also a misspelled "de" ("des discusión").
      esKnownWord:
        args: "word: string"
        return: '!(word.startsWith("des") && ES_NOUN_ENDING.test(word)) && (esIsNoun(word) || esIsGenderedEntry(word) || !!esGenderedForm(word))'
    frames:
      # "anti ruso" -> "antirruso", "ex-colonias" -> "excolonias": a prefix joins the word it
      # modifies. Apart or hyphenated only before a capital, a number or a phrase.
      - regex: "(?<![\\p{L}\\p{N}\\-'’@/#.])({{BOUND}}|{{FREE}})(?:(-)|[ \\t]+)(\\p{L}[\\p{L}\\p{M}]{2,})(?![\\p{L}\\p{N}\\-'’@/])"
        flags: giu
        scan: owned
        lookback: 16
        # "anti ruso", "ex-colonias": a prefix apart from its word or hyphenated.
        let:
          prefix: m[1].toLowerCase()
          hyphen: m[2]
          word: m[3]
          lower: word.toLowerCase()
          # "un súper cercano": after a determiner the word is the noun (the supermarket).
          before: '/(\p{L}+)[ \t]+$/u.exec(ctx.text.slice(Math.max(0, m.index - 24), m.index))?.[1].toLowerCase() ?? ""'
          graded: ES_GRADING_PREFIXES.has(prefix) && !!esGenderedForm(lower) && !esIsNoun(lower) && !ES_DETERMINER.has(before)
          # "un macro análisis", "una mini falda": between a determiner and a noun of its number, a
          # size prefix can only be part of the noun.
          det: ES_DETERMINER.get(before)
          noun: esReadNoun(lower)
          sized: >-
            ES_SIZE_PREFIXES.has(prefix) && !!det && !!noun && !noun.paired && !esAttributeOf(lower) &&
            !ES_PRENOMINAL.has(lower) && (noun.invariant || noun.plural === det.slot >= 2)
          # "vice primer ministro", "ex alto cargo": the prefix takes a whole phrase.
          after: '/^[ \t]{1,8}(\p{L}+)/u.exec(ctx.text.slice(m.index + m[0].length))?.[1] ?? ""'
          apocope: /^(?:primer|tercer|gran|buen|mal|algún|ningún|alto|alta)$/u.test(word)
        when:
          - m.index >= ctx.from
          # "ex presidente" was the rule until 2010 and is still everywhere: only "ex-" is joined.
          - '!(!hyphen && prefix === "ex")'
          # "relaciones hispano-estadounidenses", "un análisis físico-químico": two adjectives that each
          # keep their meaning keep the hyphen ("hispanohablante" fuses into one).
          - '!(hyphen && ES_RELATIONAL_PREFIXES.has(prefix) && !esIsNoun(lower))'
          - '!(hyphen && ES_RELATIONAL_PREFIXES.has(prefix) && /(?:ense|és|ano|ana|ino|ina)s?$|eses$/u.test(lower))'
          - '!(!hyphen && ES_FREE_PREFIXES.has(prefix) && !graded && !sized && !esKnownWord(esJoinPrefix(prefix, word)))'
          - '!/^\p{Lu}/u.test(word)'
          - >-
            !(!hyphen && (apocope || esAttribute(word)) &&
            (esIsNoun(after.toLowerCase()) || esIsGenderedEntry(after.toLowerCase())))
          # "re menor" is the note.
          - '!(prefix === "re" && /^(?:mayor|menor|bemol|sostenido)$/u.test(word))'
          - '!(esKeepsTyped(ctx, m[1]) || ctx.dictionary.has(word) || namedExampleBefore(ctx.text, m.index))'
        return: >-
          esFinding("spanishConfusions", "review_msg_closed_compound", m.index, m.index + m[0].length,
          [esCarryCase(m[1], esJoinPrefix(prefix, word))], { bulkBlock: "context-dependent" })
  - id: es.splitCompounds
    checks: [spanishConfusions]
    group: spanishConfusions
    style: match
    message: review_msg_closed_compound
    sets:
      # Masculine determiners: "un saca corchos" can only be a compound noun, since "saca" (the verb)
      # takes no article and "la saca" (the sack) no masculine one.
      ES_MASCULINE_DETERMINERS: [el, un, del, al, este, ese, aquel, los, unos, estos, esos, aquellos]
    defs:
      # Verbs "mal" fuses with into a new meaning; "mal vive" (lives badly) stays apart.
      ES_MAL_VERBS: /^(?:interpret|gast|trat|cri|vend|her|entend|entiend|acostumbr)\p{L}+$/u
      # "un lanza misiles": the verb and its object, when the noun after is the object: plural, or a
      # mass noun the compound keeps singular. "al guarda", "el lanza": only a feminine noun
      # reading, which "el" cannot take.
      esObjectCompound:
        args: "head: string, tail: string"
        let:
          noun: esReadNoun(tail)
          nounHead: esReadNoun(head)
        return: >-
          noun && !noun.paired && (!nounHead || nounHead.gender === "f") &&
          (noun.plural || esIsNoun(esJoinPrefix(head, tail)))
            ? esJoinPrefix(head, tail)
            : null
      # The compound of two words, or null. "la sobre protegen": a clitic before "sobre" makes the
      # whole a verb.
      esSplitCompound:
        args: "at: SpanishAround, det: string, head: string, tail: string, hyphen: boolean"
        return: >-
          ES_MASCULINE_DETERMINERS.has(det) && /[^aeiou][ae]$/u.test(head) && esFiniteVerb(head)
            ? esObjectCompound(head, tail)
            : !hyphen && (head === "sobre" || (head === "mal" && ES_MAL_VERBS.test(tail))) &&
                !esIsNoun(tail) && !esAttribute(tail)
              ? (esFiniteVerb(tail) && esFiniteVerb(esJoinPrefix(head, tail)) && !ES_CLITICS.has(tail)) ||
                (head === "sobre" && ES_CLITICS.has(at.prev()) && esFiniteVerb(tail) && !esIsNoun(tail) &&
                  !ES_CLITICS.has(tail))
                ? esJoinPrefix(head, tail)
                : null
              : null
    frames:
      # A lowercase word that ends in "a" or "e" (a verb of a compound: "un lanza misiles",
      # "sobre protegen"), and "mal". The fixer reads the determiner before and the verb and
      # noun forms of both halves (review/spanish/prefixes.ts). After a finding, the scan
      # goes on after the second half.
      - regex: "(?:mal|\\p{Ll}*[ae]){{WORD_TAIL}}"
        flags: gu
        scan: owned
        # Compounds written apart: a verb and its object after a masculine determiner ("un lanza
        # misiles" -> "lanzamisiles") and "sobre"/"mal" before a verb ("sobre protegen", "mal
        # interprete").
        let:
          tokens: esTokens(ctx)
          i: esTokenAt(tokens, m.index)
          first: tokens[i]
          # "un lanza-misiles": a hyphen between the two halves.
          hyphen: tokens[i + 1].text === "-" && first.end === tokens[i + 1].start && !!tokens[i + 2]
          second: 'hyphen ? tokens[i + 2] : tokens[i + 1]'
          gap: ctx.text.slice(first.end, second.start)
          at: esAround(tokens, i)
          # "un «apaga fuegos»": the determiner before an opening quote.
          quoted: /^[«“"]$/u.test(tokens[i - 1].text) && !tokens[i].broken
          det: 'quoted ? esAround(tokens, i - 1).prev() : at.prev()'
          joined: esSplitCompound(at, det, first.lower, second.lower, hyphen)
        when:
          - i >= 1 && i + 1 < tokens.length
          # The tokenizer marks a word after a hyphen as glued; its letters still count here.
          - first.word && (second.word || hyphen) && !second.broken && first.start >= ctx.from
          - first.start < ctx.to
          - '!(hyphen && (ctx.text[second.end] === "-" || ctx.text[first.start - 1] === "-"))'
          - gap === " " || (hyphen && gap === "-")
          - /^\p{Ll}+$/u.test(second.text) && /^\p{Ll}+$/u.test(first.text)
          - joined && !esKeepsTyped(ctx, first.lower) && !ctx.dictionary.has(second.lower)
          - '!namedExampleBefore(ctx.text, first.start)'
          # The next match starts after the second half.
          - esResume(frame, second.end)
        return: >-
          esFinding("spanishConfusions", "review_msg_closed_compound", first.start, second.end, [joined],
          { bulkBlock: "context-dependent" })
  - id: es.doubledCompounds
    checks: [spanishConfusions]
    group: spanishConfusions
    style: match
    message: review_msg_closed_compound
    frames:
      # "pilla-pilla", "taca-taca": a doubled word is one compound.
      - regex: "(?<![\\p{L}\\p{N}\\-'\\u2019@/#.])([a-z\\u00F1]{2,5})-([a-z\\u00F1]{2,5})(?![\\p{L}\\p{N}\\-'\\u2019@/])"
        flags: gu
        scan: owned
        lookback: 16
        # "pilla-pilla", "taca-taca": a doubled word is one compound.
        when:
          - m.index >= ctx.from && m[1] === m[2] && !ctx.dictionary.has(m[0].toLowerCase())
          - '!namedExampleBefore(ctx.text, m.index)'
        return: >-
          ({
            ruleId: "spanishConfusions",
            messageKey: "review_msg_closed_compound",
            range: { start: m.index, end: m.index + m[0].length },
            alternatives: [`${m[1]}${m[2]}`],
            bulkBlock: "context-dependent",
          })
  - id: es.porque
    checks: [spanishConfusions]
    group: spanishConfusions
    style: match
    message: review_msg_spanish_confusion
    # porque / porqué / por qué / por que: the conjunction (because), the noun (the reason), the
    # question word (why) and preposition + relative. The frame around each picks the spelling: a
    # determiner makes the noun ("el porqué"), a verb of knowing the question ("no sé por qué").
    sets:
      ES_SINGULAR_DETS: [el, un, del, al, su, este, ese, aquel, ningún, algún, otro, mi, tu, nuestro, vuestro, cuyo]
      ES_PLURAL_DETS: [los, unos, sus, estos, esos, aquellos, mis, tus, nuestros, vuestros]
      # "Dime porque lo has hecho": a command to tell why.
      ES_TELL: [dime, dinos, decirme, decirnos, explícame, explícanos, explicarme, explicarnos]
      ES_NEED: [hay, había, habrá, habría, tengo, tienes, tiene, tenemos, tenéis, tienen, tenía, tenías, tenían]
      ES_REASON: [razón, razones, motivo, motivos, causa, causas]
      # Function words a loose verb reading would count: "no", "me", "una".
      ES_PORQUE_CLOSED: ["no", me, te, se, le, les, lo, la, los, las, nos, os, un, una, el, ya, muy, más]
      # Nouns that ask why: "la pregunta es por qué", "no tengo idea de por qué".
      ES_ASKING_NOUNS: [pregunta, cuestión, duda, idea, misterio, incógnita]
    defs:
      # Verbs whose object can be a "why" question: "no entiendo por qué", "dime por qué".
      ES_KNOWING: /^(?:sé|sabe|sabes|sabemos|saben|sabía|sabías|sabían|saber|supe|supo|sepa|sepas|sepan|entienda|entiendas|comprenda|pregunto|pregunta|preguntas|preguntan|preguntó|preguntaba|preguntarse|preguntarle|entiendo|entiendes|entiende|entender|comprendo|comprende|comprender|explica|explicar|explícame|explicarme|ignoro|averiguar|imagino|imagina|recuerdo|recuerda|dime|dinos|decirme|decirnos|aquí)$/u
      # Futures and conditionals the loose verb reading misses: "vendrá", "sabría".
      ES_FINITE_LOOK: /\p{L}{2,}(?:rá|rán|ré|rás|ría|rían|ríamos|remos)$/u
      # The spelling starting at tokens[i], or null: "porque", "porqué", "por que", "por qués".
      esPorqueSpelling:
        args: "tokens: SpanishTokens, i: number"
        let:
          token: tokens[i]
          next: tokens[i + 1]
        return: >-
          token.lower === "porque" || token.lower === "porqué"
            ? { end: i, kind: token.lower }
            : token.lower === "porques" || token.lower === "porqués"
              ? { end: i, kind: "plural" }
              : token.lower !== "por" || !next?.word || next.broken
                ? null
                : next.lower === "que"
                  ? { end: i + 1, kind: "por que" }
                  : next.lower === "qué"
                    ? { end: i + 1, kind: "por qué" }
                    : next.lower === "qués"
                      ? { end: i + 1, kind: "plural" }
                      : null
      # The finite verbs from tokens[j] to the end of the question, before tokens[end].
      esPorqueVerbs:
        args: "tokens: SpanishTokens, j: number, end: number"
        type: number
        return: >-
          j >= tokens.length || j >= end || tokens[j].broken || /^[?.!]$/u.test(tokens[j].text)
            ? 0
            : (tokens[j].word && esFiniteVerb(tokens[j].lower) && !ES_PORQUE_CLOSED.has(tokens[j].lower) ? 1 : 0) +
              esPorqueVerbs(tokens, j + 1, end)
      # The fixes of the spelling at tokens[i], or null.
      esPorqueFix:
        args: "tokens: SpanishTokens, i: number, spelling: { end: number; kind: string }"
        type: string[] | null
        let:
          at: esAround(tokens, i)
          # "entiendo perfectamente por qué", "¿sabes ya por qué?": an adverb between the verb and
          # the question.
          skip: '/^\p{L}{3,}mente$/u.test(at.prev()) || at.prev() === "ya" ? 1 : 0'
          prev: at.prev(1 + skip)
          # "¿Porque no viniste?", "¿Y porque no?": a question opening with the word asks why.
          opens: tokens[i - 1]?.text === "¿" || (tokens[i - 2]?.text === "¿" && at.prev() === "y")
          # "la pregunta es por qué", "idea de por qué".
          asked: >-
            ((prev === "es" || prev === "era") && ES_ASKING_NOUNS.has(at.prev(2 + skip))) ||
            (prev === "de" && ES_ASKING_NOUNS.has(at.prev(2 + skip)))
          after: esAround(tokens, spelling.end)
          next: after.next()
          closes: after.endsAfter() || next === "de" || next === "del"
          negated: at.prev(2) === "no" || at.prev(3) === "no"
          # "no le gustan por que sabe…": after a verb, a finite clause is a cause or a question; a
          # subjunctive after "por que" is a purpose ("lucha por que haya paz").
          verb: '/^(?:él|ella|ellos|ellas|usted|yo|tú|se|me|te|le|les|lo|la|nos)$/u.test(next) ? after.next(2) : next'
          subject: 'at.prev(2 + skip) === "se" ? 3 + skip : 2 + skip'
        return: >-
          spelling.kind === "plural"
            ? ES_PLURAL_DETS.has(prev) && tokens[i].lower !== "porqués" ? ["porqués"] : null
            : ES_SINGULAR_DETS.has(prev)
              ? spelling.kind !== "porqué" && closes ? ["porqué"] : null
              : ES_PLURAL_DETS.has(prev)
                ? closes ? ["porqués"] : null
                : spelling.kind === "por qué"
                  ? null
                  : asked
                    ? ["por qué"]
                    : spelling.kind === "porqué"
                      ? opens || ES_KNOWING.test(prev)
                        ? ["por qué"]
                        : esFiniteVerb(prev) && next && !closes ? ["porque", "por qué"] : null
                      : spelling.kind === "por que"
                        ? opens || ES_KNOWING.test(prev) || ES_REASON.has(next)
                          ? ["por qué"]
                          : ES_NEED.has(prev) && negated && esIsInfinitive(next)
                            ? ["por qué"]
                            : (esFiniteVerb(prev) || esIsInfinitive(prev)) && !esReadNoun(prev) && !!verb &&
                                esFiniteVerb(verb) && !esSubjunctiveLike(verb)
                              ? ["porque", "por qué"]
                              : null
                        : spelling.kind === "porque" && /^(?:razón|razones|motivo|motivos)$/u.test(prev) &&
                            ES_DETERMINER.has(at.prev(2)) && next &&
                            ![3, 4].some((k) => /^(?:(?:ten|tien|tuv|tend|d[aiáé])\p{L}*|con|sin)$/u.test(at.prev(k)))
                          ? ["por que"]
                          : opens && next && !(esPorqueVerbs(tokens, spelling.end + 1, spelling.end + 16) > 1)
                            ? ["por qué"]
                            : ES_KNOWING.test(prev) && at.prev(subject) === "no" && next
                              ? ["por qué"]
                              : ES_TELL.has(prev) && next
                                ? ["por qué"]
                                : ES_NEED.has(prev) && negated && esIsInfinitive(next) ? ["por qué"] : null
      # The porque spelling at tokens[i] and its fixes, or null.
      esPorquePhrase:
        args: "tokens: SpanishTokens, i: number"
        let:
          spelling: esPorqueSpelling(tokens, i)
          fix: esPorqueFix(tokens, i, spelling)
        when:
          - spelling && !tokens[spelling.end].broken
          - fix
        return: "({ end: spelling.end, fix })"
      # A finite verb, past function words a loose reading would count.
      esPorqueVerbAt:
        args: "token: SpanishToken | undefined"
        return: "!!token?.word && !ES_PORQUE_CLOSED.has(token.lower) && esFiniteVerb(token.lower) && !esReadNoun(token.lower)"
      # A "no" earlier in the clause, from tokens[j] back to tokens[stop]: "No lo hizo él si no…",
      # "para hoy no si no…".
      esNegatedBefore:
        args: "tokens: SpanishTokens, j: number, stop: number"
        type: boolean
        return: >-
          j < 0 || j <= stop
            ? false
            : /^[.;:!?¿¡]$/u.test(tokens[j].text) || tokens[j + 1].broken
              ? false
              : tokens[j].lower === "no" || tokens[j].lower === "nunca" || tokens[j].lower === "tampoco"
                ? true
                : esNegatedBefore(tokens, j - 1, stop)
      # "sino": "no canta sino baila" needs "sino que" or "si no" before a finite verb. "su sino"
      # (fate); "sino hace dos meses" (but rather two months ago).
      esSinoWord:
        args: "tokens: SpanishTokens, i: number, at: SpanishAround"
        let:
          next: tokens[i + 1]
          verb: 'ES_CLITICS.has(next.lower) ? tokens[i + 2] : next'
        when:
          - next?.word && !next.broken && next.lower !== "que"
          - '!(ES_DETERMINER.has(at.prev()) || /^(?:hace|hacía|hay)$/u.test(next.lower))'
          - '!ES_PREPOSITIONS.has(next.lower)'
          - verb && esPorqueVerbAt(verb) && !esSubjunctiveLike(verb.lower)
        return: '({ end: i, fix: at.starts || !esNegatedBefore(tokens, i - 1, i - 12) ? ["si no"] : ["si no", "sino que"] })'
      # The words after "si no", from tokens[j] to tokens[end]: true when the clause ends before a
      # verb, false when a verb makes it a condition ("si no vendrá", "si no me pagas"). "si no para
      # de llover": "para" before "de" is the verb "parar".
      esSiNoScan:
        args: "tokens: SpanishTokens, j: number, end: number"
        type: boolean
        return: >-
          j >= tokens.length || j >= end
            ? false
            : tokens[j].broken || /^[.;:!?]$/u.test(tokens[j].text)
              ? true
              : tokens[j].text === "," || ES_CLITICS.has(tokens[j].lower)
                ? false
                : tokens[j].lower === "para" && tokens[j + 1]?.lower === "de"
                  ? false
                  : !tokens[j].word || ES_PREPOSITIONS.has(tokens[j].lower) || ES_PORQUE_CLOSED.has(tokens[j].lower)
                    ? esSiNoScan(tokens, j + 1, end)
                    : ES_FINITE_LOOK.test(tokens[j].lower) || (esFiniteVerb(tokens[j].lower) && !esReadNoun(tokens[j].lower))
                      ? false
                      : esSiNoScan(tokens, j + 1, end)
      # "si no": "Si no, mañana" (otherwise); "Si no puedes…" opens a condition.
      esSiNo:
        args: "tokens: SpanishTokens, i: number, at: SpanishAround"
        let:
          after: tokens[i + 2]
          before: tokens[i - 1]
        when:
          - tokens[i].lower === "si" && at.next() === "no" && !tokens[i + 1].broken
          - after?.word && !after.broken && before && !/^[.;:!?¿¡]$/u.test(before.text)
          - '!tokens[i].broken && esNegatedBefore(tokens, i - 1, i - 12)'
          - after.lower === "que" || esSiNoScan(tokens, i + 2, i + 10)
        return: '({ end: i + 1, fix: ["sino"] })'
      # sino (but rather) against si no (if not): "no lo hizo él si no su primo" contrasts a phrase
      # with no verb of its own after a negation; "sino vienes" and "¿qué hacer sino quería…?" put a
      # finite verb right after, which "sino" never takes without "que".
      esSino:
        args: "tokens: SpanishTokens, i: number"
        let:
          at: esAround(tokens, i)
        return: 'tokens[i].lower === "sino" ? esSinoWord(tokens, i, at) : esSiNo(tokens, i, at)'
    frames:
      # "porque", "porqué", "por que", "por qué", "sino" and "si no". The fixer reads the
      # clause around the token (review/spanish/porque.ts). After a finding, the scan goes
      # on after the phrase.
      - regex: "(?:sino|si|porqu[eé]s?|por){{WORD_TAIL}}"
        flags: giu
        scan: owned
        let:
          tokens: esTokens(ctx)
          i: esTokenAt(tokens, m.index)
          phrase: esSino(tokens, i) ?? esPorquePhrase(tokens, i)
        when:
          - i >= 0
          - tokens[i].word && tokens[i].start >= ctx.from && tokens[i].start < ctx.to
          - phrase
          # The next match starts after the phrase.
          - esResume(frame, tokens[phrase.end].end)
        return: >-
          esReplaceToken(ctx, esSpan(ctx, tokens[i], tokens[phrase.end]), phrase.fix, "spanishConfusions",
          "review_msg_spanish_confusion")
  - id: es.clauseConfusions
    checks: [spanishConfusions]
    group: spanishConfusions
    style: match
    message: review_msg_spanish_confusion
    # Clause-level frames: a pronoun written apart from the gerund or infinitive it hangs on
    # ("cantando lo" -> "cantándolo"), and verb forms and their order.
    sets:
      ES_ENCLITIC: [lo, la, los, las, le, les, me, te, se, nos]
      # Prepositions, which take a noun or an infinitive and never a present form ("al informa",
      # "con informa"). Only -a forms are read: the lexicon knows the nouns spelled like one ("de
      # descarga", "con ayuda") better than those spelled like an -e form ("de aguante"). "hasta"
      # may mean "even" and "según" a clause ("y hasta escanea", "según informa la radio").
      ES_GOVERNING: [del, al, de, en, con, por, sin, desde, sobre, entre, hacia, contra, tras]
      # Adverbs and nouns that look like verb forms after a preposition: "de cerca", "desde hace".
      ES_NOT_FINITE_HERE:
        [hace, cerca, acerca, fuera, dentro, arriba, abajo, delante, detrás, antes, encima, debajo, afuera, adentro, este, atrás, adelante, nada, toda, cada, media, mitad, sobre, bajo, entre, tarde, pronto, mientras]
      # "haber" forms that are only the auxiliary: the third person singular ("ha", "había") may be
      # existential or the preposition "a".
      ES_AUXILIARY_ONLY:
        [he, has, hemos, habéis, han, habías, habíamos, habíais, habían, habrás, habremos, habréis, habrán, hayas, hayamos, hayáis, hayan, hubieras, hubiéramos, hubierais, hubieran]
    maps:
      ES_STRESS: { a: á, e: é }
    defs:
      ES_DAR_FORMS: /^d(?:a|as|an|ar|ado|ando|aba|aban|ió|ieron|ará|arán|aría|arían|é|en|iera|ieran)$/u
      ES_ALTA_AUXILIARIES: /^(?:ha|han|he|has|hemos|había|habían|habrán|va|van|iba|iban|a|puede|pueden|deben|debe|quieren|quiere)$/u
      # Verbs whose person takes an infinitive after "a": "permitió a los niños conocer".
      ES_LETTING: /^(?:permit|dej|impid|imped|prohib)\p{L}*$/u
      # Verbs whose participle is irregular ("hecho", "visto", "provisto"): no guessed fix.
      ES_IRREGULAR_PARTICIPLE: /(?:decir|hacer|poner|scribir|volver|solver|cubrir|abrir|romper|morir|^ver|prever|proveer|freír|imprimir)$/u
      # The present subjunctive endings a vosotros command takes after "no": "-ar" verbs spell the
      # sound of the stem's last consonant ("busquéis", "paguéis", "empecéis").
      ES_SUBJUNCTIVE_AR: '[[/c$/u, "qu"], [/g$/u, "gu"], [/z$/u, "c"]] as const'
      # Verbs whose subjunctive stem is irregular ("hagáis", "conozcáis", "cojáis"): no fix.
      ES_IRREGULAR_SUBJUNCTIVE_STEM: /^(?:ser|dar|ver|ir|caer|saber|haber|caber|valer)$|(?:decir|tener|venir|poner|salir|traer|cer|cir|ger|gir|guir)$/u
      # The gerund or infinitive with a pronoun joined to it: "cantando" + "lo" -> "cantándolo". A
      # gerund already carrying a pronoun has its accent: "diciéndose" + "lo".
      esJoinedEnclitic:
        args: "verb: string, pronoun: string"
        let:
          m: /^(\p{L}*?)([ae])(ndo)$/u.exec(verb)
        return: >-
          esIsInfinitive(verb) || /[áé]ndo/u.test(verb)
            ? `${verb}${pronoun}`
            : m ? `${m[1]}${ES_STRESS[m[2]]}${m[3]}${pronoun}` : null
      # "Estaba cantando lo en la puerta" -> "cantándolo": a pronoun after a gerund or infinitive and
      # before a preposition or the clause end can only hang on that verb, so it is written joined.
      # "hacer lo que", "comer la de chocolate" and "cantando la canción" keep their article. "ver
      # los «caminos naturales»": an opening quote starts the article's noun. "hasta ver lo." is odd
      # but "a la vez" is no pronoun: "lo"/"la" before "a" may be an article of a noun cut off by a
      # line break.
      esSeparatedEnclitic:
        args: "ctx: DetectContext, tokens: SpanishTokens, i: number"
        let:
          at: esAround(tokens, i)
          verb: tokens[i].lower
          pronoun: at.next()
          after: at.next(2)
          ends: esIsBoundary(tokens[i + 2]) && tokens[i + 2]?.text !== "," && !/^["“«'‘]$/u.test(tokens[i + 2]?.text ?? "")
          fix: esJoinedEnclitic(verb, pronoun)
        when:
          - ES_ENCLITIC.has(pronoun) && !tokens[i + 1].broken
          - esIsGerund(verb) || esIsInfinitive(verb)
          - '!(!ends && (!ES_PREPOSITIONS.has(after) || /^(?:de|del|que)$/u.test(after)))'
          - '!tokens[i + 2]?.broken'
          - fix
        return: 'esReplaceToken(ctx, esSpan(ctx, tokens[i], tokens[i + 1]), [fix], "spanishConfusions", "review_msg_spanish_enclitic")'
      # "Está apunto de llover" -> "a punto de": "apuntar" takes no "de" before an infinitive.
      esAPunto:
        args: "ctx: DetectContext, tokens: SpanishTokens, i: number"
        let:
          at: esAround(tokens, i)
        when: tokens[i].lower === "apunto" && at.next() === "de" && esIsInfinitive(at.next(2))
        return: 'esReplaceToken(ctx, tokens[i], ["a punto"], "spanishConfusions", "review_msg_spanish_confusion", tokens[i + 2])'
      esAltaAuxiliaries:
        args: "at: SpanishAround, k: number"
        type: number
        return: "k <= 3 && ES_ALTA_AUXILIARIES.test(at.next(k)) ? esAltaAuxiliaries(at, k + 1) : k"
      # "No les han dado de alta" -> "los"/"las", "No la dieron el alta" -> "le": "dar de alta"
      # takes the person as its object, "dar el alta" gives the discharge to them. "se le dio de
      # alta": the impersonal "se" takes "le". Only auxiliaries between the clitic and "dar": "les
      # han dado", "los iban a dar". "le" for a man ("le dieron de alta") is accepted leísmo; "les"
      # for a group is not.
      esAltaClitic:
        args: "ctx: DetectContext, tokens: SpanishTokens, i: number"
        let:
          clitic: tokens[i].lower
          at: esAround(tokens, i)
          k: esAltaAuxiliaries(at, 1)
          phrase: '`${at.next(k + 1)} ${at.next(k + 2)}`'
          fixes: >-
            /^de (?:alta|baja)$/u.test(phrase) && clitic === "les"
              ? ["los", "las"]
              : /^(?:el alta|la baja)$/u.test(phrase) && !clitic.startsWith("le") ? [clitic.endsWith("s") ? "les" : "le"] : []
        when:
          - /^(?:le|les|lo|la|los|las)$/u.test(clitic)
          - at.prev() !== "se"
          - ES_DAR_FORMS.test(at.next(k))
          - fixes.length
        return: 'esReplaceToken(ctx, tokens[i], fixes, "spanishConfusions", "review_msg_spanish_alta", tokens[i + k + 2])'
      # "Permitió que los niños conocer" -> "a los niños conocer": after "que" the verb would be a
      # subjunctive; with an infinitive the person is introduced by "a".
      esPermitQue:
        args: "ctx: DetectContext, tokens: SpanishTokens, i: number"
        let:
          at: esAround(tokens, i)
          det: at.next()
          noun: at.next(2)
        when:
          - tokens[i].lower === "que" && ES_LETTING.test(at.prev())
          - /^(?:el|la|los|las|mi|mis|tu|tus|su|sus|este|esta|estos|estas)$/u.test(det)
          - '!(!noun || !esReadNoun(noun) || esIsInfinitive(noun) || !esIsInfinitive(at.next(3)))'
        return: >-
          det === "el"
            ? esReplaceToken(ctx, esSpan(ctx, tokens[i], tokens[i + 1]), ["al"], "spanishConfusions", "review_msg_spanish_verb_form", tokens[i + 3])
            : esReplaceToken(ctx, tokens[i], ["a"], "spanishConfusions", "review_msg_spanish_verb_form", tokens[i + 3])
      # "al informa." -> "al informar", "con informa." -> "con informar": a preposition takes a noun
      # or an infinitive, never a present form, when nothing but a preposition or the clause end
      # follows it.
      esPrepositionFinite:
        args: "ctx: DetectContext, tokens: SpanishTokens, i: number"
        let:
          at: esAround(tokens, i)
          word: tokens[i].lower
          infinitive: esPresentInfinitive(word)
        when:
          - ES_GOVERNING.has(at.prev()) && !ES_NOT_FINITE_HERE.has(word) && !tokens[i].broken
          - /^\p{Ll}/u.test(tokens[i].text) && word.length >= 4
          - '!(esIsNoun(word) || esReadNoun(word) || esParticiple(word) || esIsInfinitive(word))'
          - esFiniteVerb(word) && /a$/u.test(word)
          - at.endsAfter() || ES_PREPOSITIONS.has(at.next())
          - infinitive
        return: 'esReplaceToken(ctx, tokens[i], [infinitive], "spanishConfusions", "review_msg_spanish_verb_form", tokens[i - 1])'
      # "no se han realizar" -> "realizado": the auxiliary "haber" takes a participle.
      esPerfectInfinitive:
        args: "ctx: DetectContext, tokens: SpanishTokens, i: number"
        let:
          word: tokens[i].lower
          m: /^(\p{L}+?)([aeií])r$/u.exec(word)
        when:
          - ES_AUXILIARY_ONLY.has(esAround(tokens, i).prev()) && /^\p{Ll}+$/u.test(tokens[i].text)
          - '!(!m || !esIsVerb(word.replace("í", "i")) || esIsNoun(word) || ES_IRREGULAR_PARTICIPLE.test(word))'
        return: >-
          esReplaceToken(ctx, tokens[i], [m[2] === "a" ? `${m[1]}ado` : /[aeo]$/u.test(m[1]) ? `${m[1]}ído` : `${m[1]}ido`],
            "spanishConfusions", "review_msg_spanish_verb_form", tokens[i - 1])
      # "te se cae" -> "se te cae": "se" goes before the other unstressed pronoun. "me se la
      # lección" is "me sé" without its accent: only a verb after "se" settles it.
      esCliticOrder:
        args: "ctx: DetectContext, tokens: SpanishTokens, i: number"
        let:
          first: tokens[i]
          second: tokens[i + 1]
          verb: esAround(tokens, i + 1).next()
        when:
          - /^(?:me|te|nos|os)$/u.test(first.lower) && second?.lower === "se" && !second.broken
          - verb && esFiniteVerb(verb) && !esIsNoun(verb) && !ES_CLITICS.has(verb)
        return: 'esReplaceToken(ctx, esSpan(ctx, first, second), [`se ${first.lower}`], "spanishConfusions", "review_msg_spanish_clitic_order", tokens[i + 2])'
      # "No contad nada" -> "No contéis": a negative command takes the subjunctive. "contad" has a
      # noun ending ("ciudad"); only a listed noun ("pared", "red") rules it out.
      esNegativeImperative:
        args: "ctx: DetectContext, tokens: SpanishTokens, i: number"
        let:
          word: tokens[i].lower
          m: /^(\p{L}{2,}?)([aei])d$/u.exec(word)
          infinitive: '`${m[1]}${m[2]}r`'
          rule: ES_SUBJUNCTIVE_AR.find((pair) => pair[0].test(m[1]))
        when:
          - esAround(tokens, i).prev() === "no" && /^\p{Ll}+$/u.test(tokens[i].text)
          - '!(!m || (esIsNoun(word) && !ES_NOUN_ENDING.test(word)))'
          - esIsVerb(infinitive)
          - '!(ES_IRREGULAR_SUBJUNCTIVE_STEM.test(infinitive) && !/[^g]uir$/u.test(infinitive))'
        return: >-
          esReplaceToken(ctx, tokens[i],
            [
              /[^g]uir$/u.test(infinitive)
                ? `${m[1]}yáis`
                : m[2] === "a" ? `${rule ? m[1].replace(rule[0], rule[1]) : m[1]}éis` : `${m[1]}áis`,
            ],
            "spanishConfusions", "review_msg_spanish_negative_imperative", tokens[i - 1])
      # "muy gravísimo" -> "gravísimo": a superlative in -ísimo takes no "muy".
      esDoubledSuperlative:
        args: "ctx: DetectContext, tokens: SpanishTokens, i: number"
        let:
          next: tokens[i + 1]
        when:
          - tokens[i].lower === "muy"
          - next?.word && !next.broken && /^\p{L}{3,}ísim[oa]s?$/u.test(next.lower)
        return: 'esReplaceToken(ctx, esSpan(ctx, tokens[i], next), [next.lower], "spanishConfusions", "review_msg_spanish_double_superlative", next)'
      # ", dado a que en muchas ciudades…" -> "dado que": the causal link has no "a".
      esDadoQue:
        args: "ctx: DetectContext, tokens: SpanishTokens, i: number"
        let:
          at: esAround(tokens, i)
        when:
          - tokens[i].lower === "dado"
          - at.next() === "a" && at.next(2) === "que" && at.starts
        return: 'esReplaceToken(ctx, esSpan(ctx, tokens[i], tokens[i + 2]), ["dado que"], "spanishConfusions", "review_msg_contextual_grammar", tokens[i + 2])'
    frames:
      # Every word: the frames key on gerunds, infinitives and present forms, which are no
      # closed list. The fixer reads the clause around the token (review/spanish/clauses.ts).
      - regex: "{{TOKEN_WORD}}"
        flags: gu
        scan: owned
        let:
          tokens: esTokens(ctx)
          i: esTokenAt(tokens, m.index)
        when:
          - i >= 0
          - tokens[i].word && tokens[i].start >= ctx.from && tokens[i].start < ctx.to
        return: "[esSeparatedEnclitic(ctx, tokens, i), esAPunto(ctx, tokens, i), esAltaClitic(ctx, tokens, i), esPermitQue(ctx, tokens, i), esPrepositionFinite(ctx, tokens, i), esPerfectInfinitive(ctx, tokens, i), esCliticOrder(ctx, tokens, i), esNegativeImperative(ctx, tokens, i), esDoubledSuperlative(ctx, tokens, i), esDadoQue(ctx, tokens, i)].filter((finding) => finding !== null)"
  - id: es.frameConfusions
    checks: [spanishConfusions]
    group: spanishConfusions
    style: match
    message: review_msg_spanish_confusion
    # Short closed-class frames: "de el" -> "del", "ala casa" -> "a la casa", "q" -> "que". The
    # first finding wins.
    sets:
      # Words that take "ala" (wing) without an article: "ala delta", "ala derecha".
      ES_WING: [delta, derecha, izquierda, norte, sur, este, oeste, oriental, occidental]
      ES_WING_DETERMINERS:
        [el, un, del, al, su, sus, mi, mis, tu, tus, este, ese, aquel, otra, otras, cada, las, unas, estas, esas, aquellas, nuestra, nuestras, vuestra, vuestras, sin, con, en, de, por]
      # Short imperatives that take their pronouns at the end: "dame", "hazlo", "ponte".
      ES_SHORT_IMPERATIVES: [da, di, haz, pon, sal, ten, ven, ve, sé]
    defs:
      # "la casa de el lago", "ve a el que quieras": the article joins "a" and "de". "y A el área": a
      # capital mid-sentence is a variable or a name. "de el." and "de el viene" are the pronoun
      # "él" missing its accent. "de el se hicieron copias": a clitic follows the pronoun, never the
      # article.
      esContraction:
        args: "ctx: DetectContext, at: SpanishAround"
        let:
          prep: at.tokens[at.i]
          article: at.tokens[at.i + 1]
          next: at.tokens[at.i + 2]
        when:
          - /^(?:de|a)$/u.test(prep.lower) && article?.text === "el" && !article.broken
          - '!(/^\p{Lu}/u.test(prep.text) && !at.starts)'
          - next?.word && !next.broken && /^\p{Ll}/u.test(next.text)
          - '!ES_CLITICS.has(next.lower)'
          - '!(esFiniteVerb(next.lower) && !esIsNoun(next.lower) && !esAttributeOf(next.lower))'
        return: >-
          esReplaceToken(ctx, esSpan(ctx, prep, article), [prep.lower === "de" ? "del" : "al"], "spanishConfusions",
            "review_msg_spanish_contraction", next)
      # "voy ala ciudad" -> "a la ciudad": "ala" (wing) before a bare noun is "a la".
      esAlaPreposition:
        args: "ctx: DetectContext, at: SpanishAround"
        let:
          word: at.tokens[at.i].lower
          prev: at.prev()
          next: at.next()
          noun: esReadNoun(next)
        when:
          - word === "ala" || word === "alas"
          - '!(!prev || ES_WING_DETERMINERS.has(prev) || !next || ES_WING.has(next))'
          - '!(!/^\p{Ll}/u.test(at.tokens[at.i + 1].text) || !esIsNoun(next) || esAttributeOf(next))'
          - noun && noun.plural === (word === "alas")
        return: >-
          esReplaceToken(ctx, at.tokens[at.i], [word === "ala" ? "a la" : "a las"], "spanishConfusions",
            "review_msg_spanish_confusion", at.tokens[at.i + 1])
      # "Juan, Antonio y de más." -> "y demás": the rest closing a list. The list ends there: "y de
      # más." ("y de más «peso»" compares).
      esDeMas:
        args: "ctx: DetectContext, at: SpanishAround"
        let:
          after: at.tokens[at.i + 2]
        when:
          - at.tokens[at.i].lower === "de" && at.next() === "más" && /^(?:y|e)$/u.test(at.prev())
          - '!(after && !after.broken && !/^[.,;:!…)]$/u.test(after.text))'
        return: 'esReplaceToken(ctx, esSpan(ctx, at.tokens[at.i], at.tokens[at.i + 1]), ["demás"], "spanishConfusions", "review_msg_spanish_confusion")'
      # "Con el calor q hace": the chat shorthand for "que" between two words.
      esShorthandQue:
        args: "ctx: DetectContext, at: SpanishAround"
        when:
          - at.tokens[at.i].text === "q" && at.prev() && at.next()
          - '!(/^(?:la|una|letra|de|con|y)$/u.test(at.prev()) || at.tokens[at.i + 1].text === ".")'
          - /^\p{Ll}/u.test(at.tokens[at.i + 1].text)
        return: 'esReplaceToken(ctx, at.tokens[at.i], ["que"], "spanishConfusions", "review_msg_typo")'
      # "Lo dame", "Le dale": a pronoun before an imperative that already carries one. "dale que te
      # dale": the repeated imperative of the idiom.
      esCliticTwice:
        args: "ctx: DetectContext, at: SpanishAround"
        let:
          clitic: at.tokens[at.i]
          verb: at.tokens[at.i + 1]
          m: /^(\p{L}+?)((?:me|te|le|les|lo|la|los|las|nos|os|se){1,2})$/u.exec(verb.lower)
          stem: esPlain(m[1])
          found: esReplaceToken(ctx, esSpan(ctx, clitic, verb), [], "spanishConfusions", "review_msg_spanish_clitic_twice")
        when:
          - ES_CLITICS.has(clitic.lower) && verb?.word && !verb.broken
          - /^\p{Ll}+$/u.test(verb.text) && !esIsNoun(verb.lower)
          - '!(at.prev() === "que" && at.prev(2) === verb.lower)'
          - m
          - >-
            ES_SHORT_IMPERATIVES.has(stem) ||
            (/[áéí]/u.test(m[1]) && /[ae]$/u.test(stem) && esFiniteVerb(stem) && !esIsInfinitive(verb.lower))
        return: "found && { ...found, warningOnly: true as const }"
      # "Les 20 primeros": a pronoun before a number stands where the article goes.
      esLesNumber:
        args: "ctx: DetectContext, at: SpanishAround"
        let:
          token: at.tokens[at.i]
          count: at.tokens[at.i + 1]
        when:
          - token.lower === "les" && count && !count.broken && /^\p{N}+$/u.test(count.text)
          - count.text !== "1"
        return: 'esReplaceToken(ctx, token, ["los", "las"], "spanishConfusions", "review_msg_spanish_pronoun_article", count)'
    frames:
      # "de el", "ala", "de más", "q", a clitic before an imperative and "les" before a
      # number. The fixer reads the words before and after the token
      # (review/spanish/frames.ts).
      - regex: "(?:de|a|alas?|q|me|te|se|les?|los?|las?|nos|os){{WORD_TAIL}}"
        flags: giu
        scan: owned
        let:
          tokens: esTokens(ctx)
          i: esTokenAt(tokens, m.index)
          token: tokens[i]
          at: esAround(tokens, i)
        when:
          - i >= 0
          - token.word && token.start >= ctx.from && token.start < ctx.to
        return: "esContraction(ctx, at) ?? esAlaPreposition(ctx, at) ?? esDeMas(ctx, at) ?? esShorthandQue(ctx, at) ?? esCliticTwice(ctx, at) ?? esLesNumber(ctx, at)"
  - id: es.typography
    checks: [spanishTypography]
    group: spanishTypography
    style: match
    message: review_msg_spanish_conjunction
    # Spanish writing conventions: "y" -> "e" before an /i/ sound and "o" -> "u" before /o/, years
    # without a thousands point, lowercase months and weekdays, invariable acronyms.
    sets:
      ES_MONTHS: [enero, febrero, marzo, abril, mayo, junio, julio, agosto, septiembre, setiembre, octubre, noviembre, diciembre]
      ES_WEEKDAYS: [lunes, martes, miércoles, jueves, viernes, sábado, domingo]
      # "este Verano", "cada Invierno"; "la Primavera de Praga" keeps its capital.
      ES_SEASONS: [primavera, verano, otoño, invierno]
      # Spanish acronyms that stay invariable in the plural ("las ONG", "los ERE").
      ES_ACRONYMS: [ong, tic, ere, ett, dni]
    defs:
      esKnown:
        args: "word: string"
        return: esIsNoun(word) || !!esAttributeOf(word) || esIsGenderedEntry(word) || esVerbLike(word)
      # The word starts with the vowel sound /i/ (not the /j/ of "hielo", "iones").
      esISound:
        args: "word: string"
        return: /^h?[ií](?![aeoáéó])/iu.test(word)
      esOSound:
        args: "word: string"
        return: /^h?[oó]/iu.test(word) || /^8/u.test(word)
      # "y" -> "e", "e" -> "y", "o" -> "u" and "u" -> "o" by the sound of the next word.
      esConjunction:
        args: "at: SpanishAround, token: SpanishToken"
        let:
          next: at.tokens[at.i + 1]
          after: next.text
          # An "h" in a foreign word is sounded: "y Hitler", "y hip-hop", "o hobbies".
          foreignH: >-
            /^h/iu.test(after) &&
            (/^\p{Lu}/u.test(after) && token.lower === "y"
              ? true
              : /^\p{Ll}/u.test(after) && (!esKnown(after.toLowerCase()) || at.tokens[at.i + 2]?.text === "-"))
          prev: at.prev()
        when:
          - next && !next.broken && (next.word || /^\p{N}/u.test(next.text))
          # "¿Y Inés?": a stressed "y" opening a question keeps its form.
          - at.tokens[at.i - 1]?.text !== "¿"
          # English names keep the English sound: "Ryanair y easyJet".
          - '!/^\p{Ll}+\p{Lu}/u.test(after)'
          - '!foreignH'
        # "hobbys u hobbies"; "la u" is the letter.
        return: >-
          token.lower === "y" && esISound(after)
            ? "e"
            : token.lower === "e" && !esISound(after) && /^h?[ií]/iu.test(after)
              ? "y"
              : token.lower === "o" && esOSound(after) && (!/^\p{N}/u.test(after) || /^\p{N}/u.test(at.tokens[at.i - 1]?.text ?? ""))
                ? "u"
                : token.text === "u" && next.word && prev && !/^(?:la|una|letra|vocal)$/u.test(prev) &&
                    esKnown(after.toLowerCase()) && !esOSound(after)
                  ? "o"
                  : null
      # "del año 1.989": a year is written without the thousands point. "de 2.000 euros", "en 1.500
      # metros": an amount with its unit.
      esYearDot:
        args: "at: SpanishAround, token: SpanishToken"
        let:
          m: /^([12])\.(\d{3})$/u.exec(token.text)
          year: Number(m[1] + m[2])
          prev: at.tokens[at.i - 1]?.text.toLowerCase() ?? ""
          next: at.next()
        when:
          - m
          - year >= 1100 && year <= 2099
        return: >-
          /^(?:año|años|del)$/u.test(prev)
            ? m[1] + m[2]
            : !/^(?:de|en|para|desde|hasta|y|-)$/u.test(prev)
              ? null
              : !next || (!esIsNoun(next) && !esAttributeOf(next)) ? m[1] + m[2] : null
      # "el 4 de Julio", "todos los Lunes": months and weekdays are common nouns. "4 de Julio de
      # 2020", "en Agosto.", "de Julio del año pasado". "Viernes de Dolores", "Domingo de Ramos":
      # holidays keep their capital.
      esCapitalName:
        args: "at: SpanishAround, token: SpanishToken"
        let:
          word: token.lower
          prev: at.prev()
          before: at.tokens[at.i - 2]
        when: /^\p{Lu}\p{Ll}+$/u.test(token.text) && !at.starts
        return: >-
          ES_MONTHS.has(word)
            ? (prev === "de" && !!before && /^\p{N}/u.test(before.text)) ||
              (/^(?:de|del)$/u.test(at.next()) && /^\p{N}|^año$/u.test(at.tokens[at.i + 2]?.text ?? "")) ||
              (/^(?:en|de|desde|hasta|y)$/u.test(prev) && at.endsAfter())
              ? word
              : null
            : ES_WEEKDAYS.has(word) || ES_SEASONS.has(word)
              ? /^(?:el|los|cada|este|próximo|pasado|del|al)$/u.test(prev) &&
                !/^\p{Lu}/u.test(at.tokens[at.i + 1]?.text ?? "") &&
                !(/^(?:de|del)$/u.test(at.next()) && /^\p{Lu}/u.test(at.tokens[at.i + 2]?.text ?? ""))
                ? word
                : null
              : null
      # "las ONGs", "los ERE's": a Spanish acronym takes no plural ending.
      esAcronymPlural:
        args: "text: string"
        let:
          m: /^(\p{Lu}{2,})(?:['’]?s|S)$/u.exec(text)
        return: 'm && ES_ACRONYMS.has(m[1].toLowerCase()) ? m[1] : null'
    frames:
      # Every word and number: the fixer checks the conjunctions, the years, the acronyms
      # and the names, and reads the words before and after the token
      # (review/spanish/typography.ts).
      - regex: "{{TOKEN_WORD}}|\\p{N}+(?:[.,:]\\p{N}+)*"
        flags: gu
        scan: owned
        # The conjunction, year, acronym and name checks of the token. "las tics": the feminine article
        # names the technologies ("los tics" are twitches); the acronym takes no plural ending.
        # Lowercase "las tic" is accepted. "Hazlo asín": the rustic form of "así"; "Fernando Asín" is a
        # surname.
        let:
          tokens: esTokens(ctx)
          i: esTokenAt(tokens, m.index)
          token: tokens[i]
          at: esAround(tokens, i)
          pick: >-
            token.word && /^[yeou]$/iu.test(token.text)
              ? ([esConjunction(at, token), "review_msg_spanish_conjunction"] as const)
              : /^\p{N}/u.test(token.text)
                ? ([esYearDot(at, token), "review_msg_spanish_year"] as const)
                : /^tics$/iu.test(token.text) && /^(?:las|estas|sus|nuevas)$/u.test(at.prev())
                  ? (["TIC", "review_msg_spanish_acronym"] as const)
                  : token.lower === "asín" && (token.text === "asín" || at.starts)
                    ? (["así", "review_msg_typo"] as const)
                    : token.word
                      ? ([esCapitalName(at, token), "review_msg_spanish_lowercase_name"] as const)
                      : ([null, "review_msg_spanish_conjunction"] as const)
          fix: pick[0]
          key: pick[1]
          # The tokenizer splits "ONG's" at the apostrophe: read the raw text after it.
          raw: >-
            !fix && /^\p{Lu}{2,}(?:s|S)?$/u.test(token.text)
              ? /^\p{Lu}{2,}(?:['’]s|s|S)(?!\p{L})/u.exec(ctx.text.slice(token.start))
              : null
          acronym: 'raw ? esAcronymPlural(raw[0]) : null'
        when:
          - i >= 0
          - token.start >= ctx.from && token.start < ctx.to
          - fix || acronym
        return: >-
          fix
            ? esReplaceToken(ctx, token, [fix], "spanishTypography", key, tokens[i + 1] ?? token,
                key === "review_msg_spanish_lowercase_name" || key === "review_msg_spanish_acronym")
            : esReplaceToken(ctx, { ...token, end: token.start + raw![0].length, text: raw![0] }, [acronym!],
                "spanishTypography", "review_msg_spanish_acronym",
                { ...token, end: token.start + raw![0].length, text: raw![0] }, true)
  - id: es.impossibleDates
    checks: [spanishTypography]
    group: spanishTypography
    style: match
    message: review_msg_spanish_date
    defs:
      ES_WEEKDAY_LIST: '["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"]'
      # Where a date goes: "Cédula: 6-51-2032" and "N° 99/73/2022" are numbers. Markdown emphasis can
      # come before the date: "el **32.04.2020**".
      ES_DATED: '/(?:^|\s)(?:el|del|al|día|fecha|desde|hasta)\s{1,8}[*_~]{0,3}$/iu'
      # A label that makes the next number a code: "Pedido N° 12/34/2022", "Ref. 31/13/2020".
      ES_CODE_LABEL: '/(?:^|[\s(])(?:n[º°o]\.?|núm\.?|número|#|ref\.?|código|expediente)\s*:?\s{0,8}$/iu'
      # Short month names in numeric dates: "29-feb-2005". The MONTH_SHORT fragment holds the same
      # list.
      esShortMonth:
        args: "month: string"
        return: >-
          ({ sept: 9, set: 9 } as Readonly<Record<string, number>>)[month.toLowerCase()] ??
          "ene|feb|mar|abr|may|jun|jul|ago|sep|sept|set|oct|nov|dic".split("|").indexOf(month.toLowerCase()) + 1
      # A day the month does not have: "31 de abril", "29 de febrero de 2023".
      esDayFinding:
        args: "ctx: DetectContext, start: number, day: string, month: number, year: number | undefined"
        let:
          max: esDaysInMonth(month, year)
          alternatives: 'month === 2 && year === undefined ? ["28", "29"] : [String(max)]'
        when:
          - '!(Number(day) <= max || Number(day) > 31 || month < 1)'
          - '!namedExampleBefore(ctx.text, start)'
        return: >-
          esFinding("spanishTypography", "review_msg_spanish_date", start, start + day.length, alternatives, {
            bulkBlock: "ambiguous",
            ...(alternatives.length > 1 ? { requiresChoice: true as const } : {}),
          })
      # A weekday before a date with no year: the weekday of each year the date can mean, or the
      # nearest day.
      esWeekdayNoYear:
        args: "ctx: DetectContext, m: RegExpExecArray, dayStart: number, monthIndex: number"
        let:
          weekday: m[1]
          day: m[3]
          years: esYearsFor(monthIndex, Number(day), esContextYear(ctx.text, m.index, ctx.lang))
          weekdays: '[...new Set(years.map((y) => esWeekdayOf(y, monthIndex, Number(day))))]'
          typed: ES_WEEKDAY_LIST.indexOf(weekday.toLowerCase())
          near: esNearestDayOn(years[0], monthIndex, Number(day), typed)
        when: years.length && !weekdays.includes(typed)
        return: >-
          ({
            ruleId: "spanishTypography" as const,
            messageKey: "review_msg_weekday_no_year" as const,
            range: { start: m.index, end: dayStart + day.length },
            alternatives: [
              ...weekdays.map((w) => `${esCarryCase(weekday, ES_WEEKDAY_LIST[w])}${m[2]}${day}`),
              ...(near === null ? [] : [`${weekday}${m[2]}${near}`]),
            ],
            requiresChoice: true as const,
            context: { start: m.index, end: m.index + m[0].length },
          })
    frames:
      # "31 de abril de 2020", "29 de febrero 2023", and a weekday before a full date
      # ("lunes, 7 de octubre de 2014").
      - regex: "(?<![\\p{L}\\p{N}.,/-])(?:(domingo|lunes|martes|miércoles|jueves|viernes|sábado)(,?[ \\t]+))?(\\d{1,2})(?:[ \\t]+de)?[ \\t]+({{MONTH_NAMES}})(?:[ \\t]+(?:de|del)?[ \\t]*([0-9]{4}))?(?![\\p{L}\\p{N}])"
        flags: giu
        scan: owned
        lookback: 16
        # A named date: its day, and the weekday before it. A full date with day 0 or a day above 31:
        # "32 de abril de 2020". A weekday makes day 0 a date with no year: "el lunes 0 de abril". The
        # next frame reports day 0 and a day above 31 after an article. The weekday of a full date is
        # fixed: "lunes, 7 de octubre de 2014" was a Tuesday.
        let:
          weekday: m[1]
          day: m[3]
          year: m[5]
          dayStart: 'm.index + (weekday ? weekday.length + m[2].length : 0)'
          monthIndex: esMonthNumber(m[4])
          yearNumber: 'year ? Number(year) : undefined'
          dayNumber: Number(day)
          fullDate: >-
            yearNumber !== undefined && (dayNumber === 0 || dayNumber > 31) &&
            !/(?:^|[\s(])(?:el|del|al|El|Del|Al)[ \t]{1,8}$/u.test(ctx.text.slice(Math.max(0, dayStart - 12), dayStart))
        when: dayStart >= ctx.from
        return: >-
          [
            esDayFinding(ctx, dayStart, day, monthIndex, yearNumber),
            (fullDate || (weekday && dayNumber === 0)) && !namedExampleBefore(ctx.text, m.index)
              ? esFinding("spanishTypography", "review_msg_spanish_date", dayStart, m.index + m[0].length, [], { warningOnly: true })
              : null,
            weekday && yearNumber && dayNumber >= 1 && dayNumber <= esDaysInMonth(monthIndex, yearNumber) &&
            ES_WEEKDAY_LIST[esWeekdayOf(yearNumber, monthIndex, Number(day))] !== weekday.toLowerCase() &&
            !namedExampleBefore(ctx.text, m.index)
              ? {
                  ruleId: "spanishTypography" as const,
                  messageKey: "review_msg_spanish_date" as const,
                  range: { start: m.index, end: m.index + weekday.length },
                  alternatives: [esCarryCase(weekday, ES_WEEKDAY_LIST[esWeekdayOf(yearNumber, monthIndex, Number(day))])],
                  context: { start: m.index, end: m.index + m[0].length },
                  bulkBlock: "ambiguous" as const,
                }
              : null,
            weekday && !year && dayNumber >= 1 && dayNumber <= esDaysInMonth(monthIndex) && !namedExampleBefore(ctx.text, m.index)
              ? esWeekdayNoYear(ctx, m, dayStart, monthIndex)
              : null,
          ].filter((finding) => finding !== null)
      # "el 32 de enero", "el 0 de abril": a day no month has, after the article a date takes.
      - regex: "(?<=(?:^|[\\s(])(?:el|del|al|El|Del|Al)[ \\t]{1,8})(00?|3[2-9]|[4-9]\\d|\\d{3})(?:[ \\t]{1,8}de)?[ \\t]{1,8}(?:{{MONTH_NAMES}})(?![\\p{L}\\p{N}])"
        flags: gu
        scan: owned
        lookback: 16
        # "el 32 de enero": a warning only.
        when: m.index >= ctx.from && !namedExampleBefore(ctx.text, m.index)
        return: 'esFinding("spanishTypography", "review_msg_spanish_date", m.index, m.index + m[0].length, [], { warningOnly: true })'
      # "31/11/1988", "30-2-2001". Numeric dates need a four-digit year: "30/2" alone is a
      # ratio. A two-digit year ("31.11.89") or none ("el 31.04.") only where a date goes.
      - regex: "(?<![\\p{N}/.:-])(\\d{1,3})([/.-])(\\d{1,2}|{{MONTH_NAMES}}|{{MONTH_SHORT}})(?:\\2([0-9]{4}|\\d{2}(?![\\p{N}])))?(?![\\p{N}/:-]|\\.\\p{N}|,\\p{N})"
        flags: giu
        scan: owned
        lookback: 16
        # A numeric date: "31/11/1988", "30-2-2001", "29-feb-2005". "el 31.04.", "el 30/2": a day and
        # month only where a date goes and the clause ends; "el 30.2 por ciento" and the score "el 3-2"
        # are numbers. "01/32/2014", "31.13.2014": no day-month or month-day reading. A zero day or
        # month has none either; it is a date only with a four-digit year ("0/5/2020"). "será
        # 32/04/2020" needs no cue: a full slash date with parts near a day or a month. "6-51-2032",
        # "1.45.2020" and "Pedido N° 99/73/2022" are codes, versions or scores. "29.02.89": a two-digit
        # year keeps its leap years ("00" may be 1900 or 2000).
        let:
          separator: m[2]
          monthText: m[3]
          yearText: m[4] ?? ""
          month: >-
            /^\d/u.test(monthText)
              ? Number(monthText)
              : ES_MONTHS.has(monthText.toLowerCase()) ? esMonthNumber(monthText) : esShortMonth(monthText)
          day: Number(m[1])
          dated: ES_DATED.test(ctx.text.slice(Math.max(0, m.index - 15), m.index))
          impossible: >-
            ((month > 12 || day > 31) && (day > 12 || month > 31)) ||
            (yearText.length === 4 && (day === 0 || month === 0))
          fullDate: >-
            separator === "/" && yearText.length === 4 && day <= 39 && month <= 39 &&
            !ES_CODE_LABEL.test(ctx.text.slice(Math.max(0, m.index - 16), m.index))
        when:
          - m.index >= ctx.from
          - >-
            yearText.length === 4 ||
            (dated && !(!yearText && (separator === "-" || !/^(?:[.;:!?)]|\s{0,8}$)/u.test(ctx.text.slice(m.index + m[0].length)))))
          - '!impossible || ((dated || fullDate) && !namedExampleBefore(ctx.text, m.index))'
          - impossible || (month >= 1 && month <= 12)
        return: >-
          impossible
            ? esFinding("spanishTypography", "review_msg_spanish_date", m.index, m.index + m[0].length, [], { warningOnly: true })
            : esDayFinding(ctx, m.index, m[1], month,
                yearText.length === 4 ? Number(yearText) : yearText && yearText !== "00" ? 2000 + Number(yearText) : undefined)
  - id: es.isoDates
    checks: [spanishTypography]
    group: spanishTypography
    style: match
    message: review_msg_spanish_date
    frames:
      # An ISO date that no calendar has ("2025-02-30", "2023-02-29"). The year first makes the
      # form clear in each language. A fourth numeric part before or after ("1-2025-02-30",
      # "2025-02-30-7", "2025-02-30.1") makes it an ID, not a date. Arabic-Indic digits count too
      # ("٢٠٢٥-٠٢-٣٠"). Markdown emphasis around the date is not a word ("_2025-02-30_"); an
      # underscore glued to a word is ("build_2025-02-30_x"). The match start owns the match.
      - regex: "{{ISO_DATE}}"
        flags: gdu
        owner: none
        let:
          range: esInvalidIsoDate(m, ctx)
        when: range
        return: '({ ruleId: frame.ruleId, messageKey: frame.messageKey, range, alternatives: [], warningOnly: true })'
  - id: es.typographyMarks
    checks: [spanishTypography]
    group: spanishTypography
    style: match
    message: review_msg_spanish_abbreviation_period
    maps:
      ES_ABBREVIATION_FORMS:
        nº: n.º
        n.°: n.º
        num: núm.
        pag: pág.
        pags: págs.
        telf: tel.
        tlf: tel.
        tlfn: tel.
    defs:
      ES_NOT_ORDINAL_AFTER: /^(?:cent|fahr|kel|grad|norte|sur|este|oeste|latitud|longitud|bajo)/u
      # A finding that replaces the whole match with `fix`; none when the fix is the typed text.
      esMarkFix:
        args: "m: RegExpExecArray, frame: FrameRef, fix: string | null"
        when: fix && fix !== m[0]
        return: esFinding("spanishTypography", frame.messageKey, m.index, m.index + m[0].length, [fix])
      # The frames that replace the whole match run outside named examples, in the chunk.
      esMarkOpen:
        args: "m: RegExpExecArray, ctx: DetectContext"
        return: m.index >= ctx.from && !namedExampleBefore(ctx.text, m.index)
      # The line of a closing mark from text[k], before text[stop]: -3 at a closing mark, -2 at a
      # mark that stops the scan, -1 for no end, else the end of the sentence. "¿Vino el Sr.
      # García?": a period ends the sentence only before a capital or the end.
      esClosingEnd:
        args: "text: string, k: number, stop: number"
        type: number
        let:
          c: text[k]
        return: >-
          k >= stop
            ? -1
            : c === "?" || c === "!"
              ? -3
              : c === "¿" || c === "¡" || c === "\n" || c === "￼" || c === "«" || c === '"'
                ? c === "\n" ? k : -2
                : (c === "." || c === "…") && /^(?:[ \t]+\p{Lu}|[ \t]*(?:\n|$))/u.test(text.slice(k + 1, k + 12))
                  ? /\p{Lu}\p{Ll}{0,3}$/u.test(text.slice(Math.max(0, k - 5), k)) ? esClosingEnd(text, k + 1, stop) : k
                  : k === text.length - 1
                    ? text.length
                    : esClosingEnd(text, k + 1, stop)
      # The last character before text[k] that is no space, from k back to `floor`.
      esLastNonSpace:
        args: "text: string, k: number, floor: number"
        type: number
        return: 'k > floor && /\s/u.test(text[k]) ? esLastNonSpace(text, k - 1, floor) : k'
    frames:
      # "etc..." and "etc…": the abbreviation ends in one point.
      - regex: "(?<!\\p{L})etc(?:\\.{2,}|…|\\.…)"
        flags: giu
        scan: owned
        return: esFinding("spanishTypography", frame.messageKey, m.index, m.index + m[0].length, [`${m[0].slice(0, 3)}.`])
        message: review_msg_spanish_abbreviation
      # "uno, dos…etc.": the ellipsis and "etc." say the same; keep one of them.
      - regex: "(?:,[ \\t]*)?(?:\\.{3}|…)[ \\t]*etc(?!\\p{L})\\.?"
        flags: giu
        scan: owned
        return: esFinding("spanishTypography", frame.messageKey, m.index, m.index + m[0].length, [", etc.", "…"])
        message: review_msg_spanish_abbreviation
      # "2do", "5ta.", "1er": ordinal abbreviations take a period and a raised letter: "2.º",
      # "1.er".
      - regex: "(?<![\\p{L}\\p{N}.,])(\\d{1,3})(do|da|ro|ra|to|ta|vo|va|no|na|mo|ma|ero|era|er|r)(\\.(?=[ \\t]{1,8}\\p{Ll}))?(?![\\p{L}\\p{N}])"
        flags: gu
        scan: owned
        lookback: 8
        when: esMarkOpen(m, ctx)
        return: 'esMarkFix(m, frame, /^e?r$/u.test(m[2]) ? `${m[1]}.er` : `${m[1]}.${m[2].endsWith("a") ? "ª" : "º"}`)'
        message: review_msg_spanish_ordinal
      # "5 hrs", "48hrs", "15 h. será", "5grs": unit symbols take no plural and no period.
      - regex: "(?<![\\p{L}\\p{N}.,])(\\d+(?:[.,:]\\d+)?)([ \\t]?)(hrs|hr|hs|HRS|HS|grs|gr|GRS|h)(\\.(?=[ \\t]{1,8}\\p{Ll}))?(?![\\p{L}\\p{N}])"
        flags: gu
        scan: owned
        lookback: 8
        # Hours only where a time goes ("a las 15 h. será", "a las 5hrs."): "500 h." may be
        # inhabitants.
        when: esMarkOpen(m, ctx)
        return: >-
          esMarkFix(m, frame,
            /^g/iu.test(m[3])
              ? `${m[1]} g`
              : !/(?:^|\s)(?:las|la|sobre|hacia|desde|hasta|durante|en)\s{1,8}$/iu.test(ctx.text.slice(Math.max(0, m.index - 12), m.index))
                ? null
                : m[3] === "h" && !m[4] && m[2] ? null : `${m[1]} h`)
        message: review_msg_spanish_unit
      # "la 2.º vez" -> "2.ª", "su 25ª aniversario" -> "25º": the raised letter takes the
      # gender of the noun after it.
      - regex: "(?<![\\p{L}\\p{N}.,])(\\d{1,3})(\\.?)([\\u00BA\\u00AA])(?=[ \\t]{1,8}(\\p{L}+)(?![\\p{L}\\p{N}]))"
        flags: gu
        scan: owned
        lookback: 8
        let:
          noun: esReadNoun(m[4].toLowerCase())
          fixed: 'noun?.gender === "f" ? "ª" : "º"'
        when: esMarkOpen(m, ctx)
        return: >-
          esMarkFix(m, frame,
            !noun?.gender || noun.paired || noun.plural || !/^\p{Lu}?\p{Ll}+$/u.test(m[4]) || fixed === m[3]
              ? null
              : `${m[1]}${m[2]}${fixed}`)
        message: review_msg_spanish_ordinal
      # "25ºC", "1 ºC": a degree sign, not the ordinal o, and a space before it ("3º C" is a
      # floor and a door).
      - regex: "(?<![\\p{L}\\p{N}.,])(\\p{N}+(?:[.,]\\p{N}+)?)[ \\t]?\\u00BA([CF])(?![\\p{L}\\p{N}])"
        flags: gu
        scan: owned
        lookback: 8
        when: esMarkOpen(m, ctx)
        return: 'esMarkFix(m, frame, `${m[1]} °${m[2]}`)'
        message: review_msg_spanish_unit
      # "n° 18", "n°18": the number sign is "n.º", with the raised o, not a degree. A degree
      # sign right after a lowercase "n" only; "N° 54" heads forms and is left alone.
      - regex: "(?<![\\p{L}\\p{N}])(n)[ \\t]?\\u00B0[ \\t]?(?=\\p{N})"
        flags: gu
        scan: owned
        lookback: 8
        when: esMarkOpen(m, ctx)
        return: 'esMarkFix(m, frame, `${m[1]}.º `)'
        message: review_msg_spanish_ordinal
      # "el Sr García", "en el núm 25": an abbreviation before a name or a number takes its
      # period.
      - regex: "(?<![\\p{L}\\p{N}.])(?:(?:Sr|Sra|Srta|Dr|Dra|Avda|Av|Lic|Ing|Prof|Mr|Mrs)(?=[ \\t]\\p{Lu}\\p{Ll})|(?:n\\u00FAm|p\\u00E1g|p\\u00E1gs)(?=[ \\t]\\p{N}))(?![.\\p{L}])"
        flags: gu
        scan: owned
        lookback: 8
        when: esMarkOpen(m, ctx)
        return: 'esMarkFix(m, frame, `${m[0]}.`)'
      # "2000euros", "5000habitantes": a number glued to the noun it counts.
      - regex: "(?<![\\p{L}\\p{N}.,])(\\p{N}+(?:[.,]\\p{N}{3})*)(\\p{Ll}{4,})(?![\\p{L}\\p{N}])"
        flags: gu
        scan: owned
        lookback: 8
        when: esMarkOpen(m, ctx)
        return: 'esMarkFix(m, frame, esIsNoun(m[2]) && m[2].endsWith("s") ? `${m[1]} ${m[2]}` : null)'
        message: review_msg_spanish_number_space
      # "LA semana pasada", "EL 2 de diciembre": an article in capitals opening a sentence of
      # lowercase words.
      - regex: "(?<=(?:^|[.!?\\u00A1\\u00BF][ \\t]{0,8}|\\n))(?:EL|LA|LOS|LAS|UN|UNA|UNOS|UNAS|NO|ES|SE|LO|YO|HAY|YA|MUY|ESTE|ESTA|ESTO|ESO)(?=[ \\t]{1,8}(?:\\p{N}+[ \\t]{1,8})?\\p{Ll}\\p{Ll})"
        flags: gu
        scan: owned
        lookback: 8
        when: esMarkOpen(m, ctx)
        return: 'esMarkFix(m, frame, `${m[0][0]}${m[0].slice(1).toLowerCase()}`)'
        message: review_msg_spanish_capital_article
      # "rojo, azul, etc", "el s XVIII", "N.I.F", "J. K Rowling": the abbreviation's period.
      - regex: "(?<![\\p{L}\\p{N}.])etc(?![\\p{L}\\p{N}.\\u2026])"
        flags: giu
        scan: owned
        lookback: 8
        when: esMarkOpen(m, ctx)
        return: 'esMarkFix(m, frame, `${m[0]}.`)'
      - regex: "(?<=(?:^|[\\s(])(?:el|del|al|los|en|El|Del|Al|Los|En)[ \\t]{1,8}|^|[.!?][ \\t]{1,8})[sS](?=[ \\t]{1,8}{{ROMAN}}(?![\\p{L}\\p{N}]))"
        flags: gu
        scan: owned
        lookback: 8
        when: esMarkOpen(m, ctx)
        return: 'esMarkFix(m, frame, /(?:^|[.!?][ \t]{1,8})$/u.test(ctx.text.slice(Math.max(0, m.index - 9), m.index)) ? `${m[0]}.` : "s.")'
      # "N.I.F", "D.C", "S. A,": the last letter of dotted initials lost its period. A lone
      # "A", "E", "O", "U" or "Y" may be a word opening the next sentence.
      - regex: "(?<![\\p{L}\\p{N}.])(?:\\p{Lu}\\.){1,5}\\p{Lu}(?![\\p{L}\\p{N}.\\-/@_])|(?<=(?<![\\p{L}\\p{N}.])\\p{Lu}\\.[ \\t])(?:[B-DF-NP-TV-XZ](?=[ \\t]\\p{Lu}\\p{Ll})|\\p{Lu}(?=,))"
        flags: gu
        scan: owned
        lookback: 8
        when: esMarkOpen(m, ctx)
        return: 'esMarkFix(m, frame, `${m[0]}.`)'
      # "p.ej.", "nº 18", "pag 4", "telf 666": the standard forms "p. ej.", "n.º", "pág.",
      # "tel.".
      - regex: "(?<![\\p{L}\\p{N}.])([pP])(?:[ \\t]?\\.[ \\t]?e(?:j[ \\t]?)?|[ \\t]ej[ \\t]?)\\.(?![\\p{L}\\p{N}])"
        flags: gu
        scan: owned
        lookback: 8
        when: esMarkOpen(m, ctx)
        return: 'esMarkFix(m, frame, `${m[1]}. ej.`)'
        message: review_msg_spanish_abbreviation_form
      - regex: "(?<![\\p{L}\\p{N}.])(n\\u00BA|n\\.\\u00B0|num|pag|pags|telf|tlf|tlfn)\\.?:?[ \\t]?(?=\\p{N})"
        flags: giu
        scan: owned
        lookback: 8
        let:
          fix: '`${ES_ABBREVIATION_FORMS[m[1].toLowerCase()]}${m[0].includes(":") ? ":" : ""} `'
        when: esMarkOpen(m, ctx)
        return: 'esMarkFix(m, frame, /^\p{Lu}/u.test(m[1]) ? fix[0].toUpperCase() + fix.slice(1) : fix)'
        message: review_msg_spanish_abbreviation_form
      # "el 9° clasificado", "la 2° edición": a degree sign for the ordinal's raised letter.
      - regex: "(?<=(?:^|[\\s(])(el|la|del|al|El|La|Del|Al)[ \\t]{1,8})(\\d{1,3})[ \\t]?\\u00B0(?=[ \\t]{1,8}(\\p{Ll}+))"
        flags: gu
        scan: owned
        lookback: 8
        when: esMarkOpen(m, ctx)
        return: >-
          esMarkFix(m, frame,
            ES_PREPOSITIONS.has(m[3]) || ES_NOT_ORDINAL_AFTER.test(m[3]) ? null : `${m[2]}.${/^la$/iu.test(m[1]) ? "ª" : "º"}`)
        message: review_msg_spanish_ordinal
      # "del '90", "los años '71": a shortened year takes no apostrophe.
      - regex: "(?:(?<=(?:^|[\\s(])(?:del|el|los|a\\u00F1os|d\\u00E9cada|en)[ \\t]{1,8})|(?<=['\\u2019\\u2018]\\d\\d[\\u2014\\u2013-]))['\\u2019\\u2018](\\d\\d)(?![\\p{L}\\p{N}'\\u2019])"
        flags: giu
        scan: owned
        lookback: 8
        when: esMarkOpen(m, ctx)
        return: esMarkFix(m, frame, m[1])
        message: review_msg_spanish_year_apostrophe
      # "la sra. García": abbreviations of address take a capital.
      - regex: "(?<![\\p{L}\\p{N}.])(?:sr|sra|srta|sres|sras|dr|dra)\\.(?=[ \\t]\\p{Lu}\\p{Ll})"
        flags: gu
        scan: owned
        lookback: 8
        when: esMarkOpen(m, ctx)
        return: esMarkFix(m, frame, m[0][0].toUpperCase() + m[0].slice(1))
        message: review_msg_spanish_treatment_capital
      # "Sí sí, ven": a repeated "sí" or "no" takes a comma between.
      - regex: "(?<=(?:^|[.!?\\u00A1\\u00BF\\n])[ \\t]{0,8})(?:(S\\u00ED|s\\u00ED|S\\u00CD)[ \\t]+(s\\u00ED|S\\u00CD)|(No|no|NO)[ \\t]+(no|NO))(?=[ \\t]*[,.!?])"
        flags: gu
        scan: owned
        lookback: 8
        when: esMarkOpen(m, ctx)
        return: 'esMarkFix(m, frame, `${m[1] ?? m[3]}, ${m[2] ?? m[4]}`)'
        message: review_msg_spanish_repeated_answer
      # "Es él ─dijo": a box-drawing or Hangul stroke typed for the long dash.
      - regex: "(?<=[\\p{Script=Latin}.,!?][ \\t]?)[\\u2500\\u2501\\u3161](?=\\p{Script=Latin})"
        flags: gu
        scan: owned
        lookback: 8
        when: esMarkOpen(m, ctx)
        return: esMarkFix(m, frame, "—")
        message: review_msg_spanish_dialogue_dash
      # "Adiós,. le dije": a comma and a period together; either one may be meant.
      - regex: "(?<=\\p{L}),\\.(?!\\.)"
        flags: gu
        scan: owned
        when: '!namedExampleBefore(ctx.text, m.index)'
        return: 'esFinding("spanishTypography", frame.messageKey, m.index, m.index + 2, [",", "."], { requiresChoice: true })'
        message: review_msg_duplicate_punctuation
      # "¿Qué es lo que pasa aquí." -> "aquí?", "¡Qué bonito" -> "bonito!": an opening mark
      # whose sentence ends without a closing one.
      - regex: "[¿¡]"
        flags: gu
        scan: text
        # Either closing mark answers either opening one. The line ends without a mark: add the closing
        # one after its last word.
        let:
          text: ctx.text
          close: 'm[0] === "¿" ? "?" : "!"'
          end: esClosingEnd(text, m.index + 1, Math.min(text.length, m.index + 400))
          last: esLastNonSpace(text, end - 1, m.index)
        when: end >= 0 && !namedExampleBefore(text, m.index)
        return: >-
          end === text.length || text[end] === "\n"
            ? /[\p{L}\p{N}]/u.test(text[last] ?? "")
              ? esFinding("spanishTypography", "review_msg_spanish_closing_mark", last, last + 1, [`${text[last]}${close}`])
              : null
            : text[end] === "."
              ? esFinding("spanishTypography", "review_msg_spanish_closing_mark", end, end + 1, [close])
              : null
        message: review_msg_spanish_closing_mark
      # "los años 1930s", "los 80's": a decade takes no plural ending in Spanish.
      - regex: "(?<=(?<![\\p{L}])(?:a\\u00F1os|los)[ \\t]{1,4})((?:1[0-9]|20)?[0-9]0)(?:['\\u2019]s|s)(?:[ \\t]+y[ \\t]+((?:1[0-9]|20)?[0-9]0)(?:['\\u2019]s|s))?(?![\\p{L}\\p{N}])"
        flags: giu
        scan: owned
        lookback: 8
        # "los años 20s y 30s": both decades of a pair.
        let:
          second: 'm[2] ? m.index + m[0].lastIndexOf(m[2]) : -1'
          first: /^\d+['’]?s/u.exec(m[0])![0]
        when: m.index >= ctx.from && !namedExampleBefore(ctx.text, m.index)
        return: >-
          [
            esFinding("spanishTypography", "review_msg_spanish_decade", m.index, m.index + first.length, [m[1]]),
            ...(m[2]
              ? [esFinding("spanishTypography", "review_msg_spanish_decade", second, second + m[0].slice(second - m.index).length, [m[2]])]
              : []),
          ]
        message: review_msg_spanish_decade
  - id: es.commas
    checks: [spanishTypography]
    group: spanishTypography
    style: match
    message: review_msg_spanish_comma
    # The comma after a sentence connector that opens its clause ("Sin embargo, no ganó") and
    # between a greeting and the person greeted ("Hola, Marta").
    sets:
      # What may follow a connector's words in another reading: "además de", "al contrario que",
      # "o sea que", "por otro lado del río", "de hecho y de derecho".
      ES_NOT_CONNECTOR_AFTER: [de, del, que, a, al, "y", e, o, u, como]
      # Greetings that may close a sentence: "Os deseo buenos días, amigos".
      ES_CLOSING_GREETINGS: [días, día, tardes, noches]
      # Words that open the clause after the person addressed: "Hola amigo, cómo estás".
      ES_CLAUSE_OPENERS: [cómo, como, qué, que, dónde, donde, cuándo, cuando, quién, quien, cuál, te, me, os, nos, le, les, ya, hoy]
      ES_ADDRESSED:
        [
          amigo, amiga, amigos, amigas, chico, chica, chicos, chicas, guapo, guapa, guapos, guapas, cariño,
          querido, querida, queridos, queridas, señor, señora, señores, señoras, señorita, jefe, jefa,
          compañero, compañera, compañeros, compañeras, hermano, hermana, tío, tía, mamá, papá, abuelo,
          abuela, hijo, hija, niños, niñas, estimado, estimada, estimados, estimadas, colega, colegas,
          preciosa, precioso, amor, cielo, vecino, vecina, vecinos, chaval, chavales, muchachos,
          muchachas, gente, familia, equipo,
        ]
      ES_NEGATIONS: ["no", nunca, jamás, tampoco, ni]
      # "No hace sino llorar", "nadie sino él", "no tiene otra salida sino esperar": "sino" means
      # "except" here and takes no comma.
      ES_EXCEPTIVE: [nadie, nada, ningún, ninguna, ninguno, otro, otra, otros, otras, más, menos, cosa]
      # Finite verbs the dictionary also lists as nouns.
      ES_COMMON_FINITE: [es, son, era, eran, fue, fueron, ha, han, va, van, da, dan, ve, ven, hay]
      # Determiners of a subject a comma may not cut from its verb; "mi"/"tu" open vocatives ("Mi
      # amor, está lista la cena"). The es.commas frame lists these words.
      ES_SUBJECT_DETERMINERS:
        [
          el, la, los, las, este, esta, estos, estas, ese, esa, esos, esas, aquel, aquella, aquellos, aquellas,
          nuestro, nuestra, nuestros, nuestras, su, sus,
        ]
      # Nouns that open a sentence as an adverbial or a remark, comma and all: "La verdad, no lo sé",
      # "El lunes, llegaron todos", "La mayoría, se fue".
      ES_NOT_SUBJECT_NOUNS:
        [
          verdad, semana, semanas, año, años, mes, meses, día, días, tarde, tardes, noche, noches, mañana,
          mañanas, vez, veces, momento, rato, verano, invierno, otoño, primavera, lunes, martes, miércoles,
          jueves, viernes, sábado, sábados, domingo, domingos, fin, principio, final, mayoría, mitad, resto,
        ]
      ES_SINGULAR_COPULA: [es, está, era, estaba, fue, será, ha, va, tiene]
      ES_PLURAL_COPULA: [son, están, eran, estaban, fueron, serán, han, van, tienen]
    defs:
      # The connectors; the es.commas frame lists their first words.
      ES_CONNECTORS: >-
        [
          "sin embargo", "por lo tanto", "por tanto", "por consiguiente", "por ende", "en consecuencia",
          "en cambio", "por el contrario", "al contrario", "por otro lado", "por otra parte", "por un lado",
          "por una parte", "además", "asimismo", "así pues", "en primer lugar", "en segundo lugar",
          "en tercer lugar", "por último", "en conclusión", "en resumen", "en definitiva", "en efecto",
          "es decir", "o sea", "de hecho", "por cierto", "en fin", "aun así", "de todos modos",
          "de todas formas",
          "afortunadamente", "desafortunadamente", "desgraciadamente", "lamentablemente", "evidentemente",
          "obviamente", "efectivamente", "sinceramente", "francamente", "honestamente", "curiosamente",
          "sorprendentemente", "indudablemente",
        ].map((phrase) => phrase.split(" "))
      # The greetings; the es.commas frame lists their first words. "cómo estás": a question to the
      # person addressed ("¿Cómo estás, Jorge?").
      ES_GREETINGS: >-
        [
          "hola", "adiós", "buenos días", "buenas tardes", "buenas noches", "felicidades", "enhorabuena",
          "hasta luego", "hasta pronto", "felices fiestas", "muchos besos", "muy buen día", "buen día",
          "buenas", "un beso", "un abrazo", "besos", "abrazos", "muchas gracias", "gracias", "saludos",
          "bienvenido", "bienvenida", "bienvenidos", "bienvenidas", "a sus órdenes", "feliz cumpleaños",
          "feliz navidad", "cómo estás", "cómo estáis",
        ].map((phrase) => phrase.split(" "))
      # A negation within 12 words before "sino", with two words (clitics aside) between.
      esSinoNegated:
        args: "at: SpanishAround, k: number, between: number"
        type: boolean
        let:
          word: at.prev(k)
        when:
          - k <= 12
          - word && !ES_EXCEPTIVE.has(word)
        return: 'ES_NEGATIONS.has(word) ? between >= 2 : esSinoNegated(at, k + 1, between + (ES_CLITICS.has(word) ? 0 : 1))'
        else: "false"
      # "No lo hizo él sino que lo hice yo" -> "él, sino que": "sino que" opening the clause that
      # replaces a negated one. Without "que" the comma may go ("no es azul sino verde"), and right
      # after the verb "sino" means "only" ("No te pido sino que te vayas").
      esCommaBeforeSino:
        args: "tokens: SpanishTokens, i: number"
        when:
          - tokens[i].lower === "sino" && !!tokens[i - 1]?.word && !tokens[i].broken
          - esAround(tokens, i).next() === "que"
        return: esSinoNegated(esAround(tokens, i), 1, 0)
        else: "false"
      esClauseVerb:
        args: "word: string"
        return: >-
          ES_COMMON_FINITE.has(word) ||
          (!!word && esFiniteVerb(word) && !esIsNoun(word) && !esGenderedForm(word) && !esParticiple(word))
      # A verb of its own in the words before tokens[i], from `back` to `last` words back.
      esClauseVerbBefore:
        args: "at: SpanishAround, back: number, last: number"
        type: boolean
        return: >-
          back > last || !at.prev(back) ? false : esClauseVerb(at.prev(back)) ? true : esClauseVerbBefore(at, back + 1, last)
      # The k-th word after tokens[i] past the clitics (to the fifth).
      esPastClitics:
        args: "at: SpanishAround, k: number"
        type: number
        return: "k < 5 && ES_CLITICS.has(at.next(k)) ? esPastClitics(at, k + 1) : k"
      # "Son muchos pero no bastan" -> "muchos, pero": "pero" joining two clauses. Only a negated
      # clause is surely one: "pero no bastan", "pero ya no lo tengo". The clause before it has a
      # verb of its own.
      esCommaBeforePero:
        args: "tokens: SpanishTokens, i: number"
        let:
          at: esAround(tokens, i)
          k: 'at.next(1) === "ya" ? 2 : 1'
        when:
          - tokens[i].lower === "pero" && !!tokens[i - 1]?.word && !tokens[i].broken
          - ES_NEGATIONS.has(at.next(k))
          - esClauseVerb(at.next(esPastClitics(at, k + 1)))
        return: esClauseVerbBefore(at, 1, 10)
        else: "false"
      # "Abrimos las ventanas ya que hacía calor" -> "ventanas, ya que": a causal "ya que" or "puesto
      # que" after a clause. Not right after a verb ("Te he dicho ya que no": "ya" is "already"; "Lo
      # ha puesto que…"), a determiner ("el puesto que ocupa") or a conjunction. "un buen puesto que",
      # "al cuarto puesto que": the noun "puesto" with its determiner.
      esCommaBeforeCausal:
        args: "tokens: SpanishTokens, i: number"
        let:
          at: esAround(tokens, i)
          before: at.prev()
        when:
          - /^(?:ya|puesto)$/u.test(tokens[i].lower) && !tokens[i].broken
          - at.next() === "que" && !!at.next(2)
          - before && !ES_CLITICS.has(before) && !ES_NEGATIONS.has(before) && !ES_CONJUNCTIONS.has(before)
          - '!(ES_DETERMINERS.has(before) || esClauseVerb(before) || esParticiple(before) || esIsInfinitive(before))'
          - '!(tokens[i].lower === "puesto" && (ES_DETERMINERS.has(at.prev(2)) || /^(?:al|del)$/u.test(at.prev(2))))'
        return: esClauseVerbBefore(at, 2, 10)
        else: "false"
      # A comma, a colon, a dash or a bracket from tokens[k] to tokens[end], on one line.
      esMarkSoon:
        args: "tokens: SpanishTokens, k: number, end: number"
        type: boolean
        return: >-
          k < end && tokens[k] && !tokens[k].broken
            ? /^[,;:—–()]$/u.test(tokens[k].text) || esMarkSoon(tokens, k + 1, end)
            : false
      # "El problema, es que…" -> "El problema es": a comma between a subject opening the sentence
      # and its verb: the index of the comma, or -1. Only common verbs that agree with it are read,
      # and a second comma soon after ("El problema, dice Juan, es…") marks an inserted remark.
      esSubjectComma:
        args: "tokens: SpanishTokens, i: number"
        let:
          nounToken: tokens[i + 1]
          # "Esas, se dividen en tres": a plural demonstrative standing for its noun ("Este, …" may
          # be a filler).
          pronoun: /^(?:estos|estas|esos|esas|aquellos|aquellas)$/u.test(tokens[i].lower)
          noun: >-
            pronoun && nounToken?.text === ","
              ? { plural: true }
              : nounToken?.word && !nounToken.broken
                ? esReadNoun(nounToken.lower)
                : null
          # One adjective after the noun: "Nuestro objetivo principal, es…".
          after: 'nounToken.text === "," ? i + 1 : i + 2'
          adjective: tokens[after]
          comma: 'after === i + 2 && adjective?.word && !adjective.broken && !esFiniteVerb(adjective.lower) ? after + 1 : after'
          # "El gobierno, no anunció nada", "La empresa, se fundó en 1990": "no" or "se" first.
          lead: '/^(?:no|se)$/u.test(tokens[comma + 1]?.lower ?? "") ? 1 : 0'
          verb: tokens[comma + 1 + lead]
          word: verb.lower
          # Any other verb whose third person ending agrees: "trabaja", "anunció", "llegaron".
          plural: >-
            ES_PLURAL_COPULA.has(word)
              ? true
              : ES_SINGULAR_COPULA.has(word)
                ? false
                : !/(?:n|[aeó])$/u.test(word) || !esFiniteVerb(word) || esIsNoun(word) ||
                    esAttributeOf(word) || esSubjunctiveLike(word) || ES_CLITICS.has(word)
                  ? null
                  : word.endsWith("n")
        when:
          - ES_SUBJECT_DETERMINERS.has(tokens[i].lower) && esAround(tokens, i).starts
          # "¿Este método, es seguro?": a question may set its topic apart.
          - '!/^[¿¡]$/u.test(tokens[i - 1]?.text ?? "")'
          - noun && !ES_NOT_SUBJECT_NOUNS.has(nounToken.lower)
          - tokens[comma]?.text === "," && !tokens[comma].broken
          - verb?.word && !verb.broken && !/^\p{Lu}/u.test(tokens[comma + 1].text)
          - plural === noun.plural
          - '!esMarkSoon(tokens, comma + 2, comma + 7)'
        return: comma
        else: "-1"
      # tokens[i..] spell `phrase` on one line: the index of its last token, or -1.
      esPhraseAt:
        args: "tokens: SpanishTokens, i: number, phrase: readonly string[]"
        return: >-
          phrase.every((word, k) => !!tokens[i + k]?.word && tokens[i + k].lower === word && !(k > 0 && tokens[i + k].broken))
            ? i + phrase.length - 1
            : -1
      # The end of the connector `phrase` at tokens[i], or -1. Only before a word of the clause it
      # opens; "Por tanto esfuerzo" is "for so much". "Francamente bueno", "Sinceramente tuyo": an
      # adverb of the word after it.
      esConnectorEnd:
        args: "tokens: SpanishTokens, i: number, phrase: readonly string[]"
        let:
          last: esPhraseAt(tokens, i, phrase)
          after: tokens[last + 1]
          next: after?.lower ?? ""
        return: >-
          !after?.word || after.broken || ES_NOT_CONNECTOR_AFTER.has(next)
            ? -1
            : phrase.join(" ") === "por tanto" && esIsNoun(next)
              ? -1
              : /mente$/u.test(phrase[0]) && (esAttributeOf(next) || /^(?:tuy|suy|vuestr)/u.test(next))
                ? -1
                : last
      # The person addressed after a greeting at tokens[at]: the index of its last word, or -1.
      # "Felicidades, mi querido amigo".
      esAddressee:
        args: "tokens: SpanishTokens, at: number"
        let:
          mine: 'tokens[at]?.lower === "mi" && !tokens[at].broken ? at + 1 : at'
          k: '/^querid[oa]s?$/u.test(tokens[mine]?.lower ?? "") && ES_ADDRESSED.has(tokens[mine + 1]?.lower ?? "") ? mine + 1 : mine'
          token: tokens[k]
        when: token?.word && !token.broken
        return: 'ES_ADDRESSED.has(token.lower) ? k : k === at && /^\p{Lu}\p{Ll}/u.test(token.text) ? k : -1'
        else: "-1"
      # A comma after tokens[i], unless the writer's word or casing says otherwise.
      esCommaAfter:
        args: "ctx: DetectContext, tokens: SpanishTokens, i: number"
        return: 'esReplaceToken(ctx, tokens[i], [`${tokens[i].lower},`], "spanishTypography", "review_msg_spanish_comma", tokens[i + 1])'
    frames:
      # "sino", "pero", "ya que", "puesto que", the determiner of a subject, and the first
      # words of the connectors and greetings of review/spanish/commas.ts. Every token of
      # the read window counts: the comma may go before the chunk. The fixer reads the
      # clause structure around the token. After a connector or a greeting, the scan goes
      # on after the phrase and the person addressed.
      - regex: "(?:sino|pero|ya|puesto|el|las?|los|es(?:t(?:e|a|os|as)|e|a|os|as)?|aquel(?:las?|los)?|nuestr[oa]s?|sus?|sin|por|en|al|adem[aá]s|asimismo|as[ií]|o|de|aun|a|un|(?:afortunada|desafortunada|desgraciada|lamentable|evidente|obvia|efectiva|sincera|franca|honesta|curiosa|sorprendente|indudable)mente|hola|adi[oó]s|buen(?:[oa]s)?|felicidades|enhorabuena|hasta|felices|much[oa]s|muy|besos|abrazos|gracias|saludos|bienvenid[oa]s?|feliz|c[oó]mo){{WORD_TAIL}}"
        flags: giu
        scan: owned
        lookback: 160
        lookahead: 160
        # The commas of the clause at the token: connectors, greetings, "sino", "pero", subjects.
        let:
          tokens: esTokens(ctx)
          i: esTokenAt(tokens, m.index)
          before: >-
            esCommaBeforeSino(tokens, i) || esCommaBeforePero(tokens, i) || esCommaBeforeCausal(tokens, i)
              ? esCommaAfter(ctx, tokens, i - 1)
              : null
          comma: esSubjectComma(tokens, i)
          subject: >-
            comma >= 0
              ? esReplaceToken(ctx, tokens[comma], [""], "spanishTypography", "review_msg_spanish_comma", tokens[comma + 1], true)
              : null
          starts: esAround(tokens, i).starts
          connector: 'starts ? ES_CONNECTORS.find((phrase) => esPhraseAt(tokens, i, phrase) >= 0) : undefined'
          connectorEnd: 'connector ? esConnectorEnd(tokens, i, connector) : -1'
          # "Hola Marta", "Adiós amigos"; "¡Hola a todos!" greets no one by name. Inside a sentence
          # only a closing greeting before the end: "Te deseo buenos días amigo."
          greeting: 'connectorEnd < 0 ? ES_GREETINGS.find((phrase) => esPhraseAt(tokens, i, phrase) >= 0) : undefined'
          greetingEnd: 'greeting ? esPhraseAt(tokens, i, greeting) : -1'
          greeted: 'greetingEnd >= 0 ? esAddressee(tokens, greetingEnd + 1) : -1'
          greets: >-
            greetingEnd >= 0 && greeted >= 0 &&
            (starts || (ES_CLOSING_GREETINGS.has(tokens[greetingEnd].lower) && esAround(tokens, greeted).endsAfter()))
          last: 'connectorEnd >= 0 ? connectorEnd : greets ? greetingEnd : -1'
          addressed: 'connectorEnd < 0 && greets ? greeted : -1'
          # "Hola amigo, cómo estás": the clause after the person addressed opens with a comma too.
          next: tokens[addressed + 1]
        when:
          - i >= 0
          - tokens[i].word
          # The next match starts after the phrase and the person addressed.
          - last < 0 || esResume(frame, tokens[Math.max(last, addressed)].end)
        return: >-
          [
            before,
            subject,
            ...(last < 0
              ? []
              : [
                  esCommaAfter(ctx, tokens, last),
                  addressed >= 0 && next?.word && !next.broken && ES_CLAUSE_OPENERS.has(next.lower)
                    ? esCommaAfter(ctx, tokens, addressed)
                    : null,
                ]),
          ].filter((finding) => finding !== null)
  - id: es.missingSpace
    checks: [commaPeriodSpacing]
    group: commaPeriodSpacing
    style: match
    message: review_msg_space_after_mark
    frames:
      # "frase.Y otra", "así?Siempre", "Ven.¿Como…?", "así…siempre", and "así .Siempre" with
      # the space on the wrong side. Lowercase only after "…": "archivo .txt" and "web?id" are
      # not prose.
      - regex: "(?<=\\p{L}\\p{Ll})(?:\\.(?=(?:{{STARTERS}})(?![\\p{L}\\p{N}])|[¿¡])|[?!](?=[¿¡]|\\p{Lu}\\p{Ll})|…(?=[¿¡]|\\p{L}))|(?<=\\p{L})[ \\t]+(?:[.?!]|…)(?=[¿¡]|\\p{Lu}\\p{Ll})"
        flags: gu
        scan: owned
        # A sentence mark glued to the next sentence: "frase.Y otra" -> "frase. Y otra". "P.A.Čerenkov",
        # "EE.UU.Hoy": initials and abbreviations stay glued.
        when:
          - '!/\.\p{L}{1,3}$/u.test(ctx.text.slice(Math.max(0, m.index - 4), m.index))'
          - '!namedExampleBefore(ctx.text, m.index)'
        return: >-
          ({
            ruleId: "commaPeriodSpacing",
            messageKey: "review_msg_space_after_mark",
            range: { start: m.index, end: m.index + m[0].length },
            alternatives: [`${m[0].trim()} `],
            context: { start: Math.max(0, m.index - 16), end: Math.min(ctx.text.length, m.index + 16) },
            bulkBlock: "context-dependent",
          })
      # "dijo : ven" -> "dijo: ven", "vino;pero" -> "vino; pero": Spanish sets no space before
      # a colon or a semicolon, and one after a semicolon between words.
      - regex: "(?<=\\p{L})[ \\t]+[:;](?=[ \\t]|$)|(?<=\\p{L}\\p{Ll});(?=\\p{Ll}{2})"
        flags: gmu
        scan: owned
        # "dijo : ven" -> "dijo: ven", "vino;pero" -> "vino; pero". "&nbsp;texto", "a;b" in code: an
        # entity or a token with no space around it.
        let:
          word: /\S*$/u.exec(ctx.text.slice(Math.max(0, m.index - 32), m.index))![0]
        when: '!(namedExampleBefore(ctx.text, m.index) || /[&#=/]/u.test(word))'
        return: >-
          ({
            ruleId: "commaPeriodSpacing",
            messageKey: m[0].startsWith(";") ? "review_msg_space_after_mark" : "review_msg_space_before_mark",
            range: { start: m.index, end: m.index + m[0].length },
            alternatives: [m[0].startsWith(";") ? "; " : m[0].trim()],
            context: { start: Math.max(0, m.index - 16), end: Math.min(ctx.text.length, m.index + 16) },
            bulkBlock: "context-dependent",
          })
  - id: es.quoteSpaces
    checks: [commaPeriodSpacing]
    group: commaPeriodSpacing
    style: match
    message: review_msg_space_after_opening_mark
    defs:
      # The straight double marks from text[k] to text[end].
      esQuoteMarks:
        args: "text: string, k: number, end: number"
        type: number[]
        return: "k >= 0 && k < end ? [k, ...esQuoteMarks(text, text.indexOf('\"', k + 1), end)] : []"
      # No space inside the pair of marks at `open` and `close`.
      esQuotePairSpaces:
        args: "ctx: DetectContext, open: number, close: number"
        let:
          inner: ctx.text.slice(open + 1, close)
          lead: '/^[ \t ]+(?=[\p{L}\p{N}¿¡])/u.exec(inner)?.[0].length ?? 0'
          trail: '/(?<=[\p{L}\p{N}.!?…])[ \t ]+$/u.exec(inner)?.[0].length ?? 0'
        when: inner.trim() && inner.length <= 200 && !namedExampleBefore(ctx.text, open)
        return: >-
          [
            lead && open >= ctx.from && open < ctx.to
              ? {
                  ruleId: "commaPeriodSpacing" as const,
                  messageKey: "review_msg_space_after_opening_mark" as const,
                  range: { start: open, end: open + 1 + lead },
                  alternatives: ['"'],
                  context: { start: open, end: close + 1 },
                  bulkBlock: "context-dependent" as const,
                }
              : null,
            trail && close >= ctx.from && close < ctx.to
              ? {
                  ruleId: "commaPeriodSpacing" as const,
                  messageKey: "review_msg_space_before_mark" as const,
                  range: { start: close - trail, end: close + 1 },
                  alternatives: ['"'],
                  context: { start: open, end: close + 1 },
                  bulkBlock: "context-dependent" as const,
                }
              : null,
          ].filter((finding) => finding !== null)
        else: "[]"
    frames:
      # Each line that touches the chunk, from the chunk start (a regex cannot start before
      # it): the fixer pairs the straight quotes of the whole line by position.
      - regex: "[^\\n]+\\n?|\\n"
        flags: g
        scan: text
        # 'Dijo " sí".' -> 'Dijo "sí".': no space inside a straight pair. The marks of a line pair up in
        # order, so a line with an odd count, or with a mark after a digit (6" for inches), is left
        # alone. The frame matches each line from the chunk start: the first match may start inside its
        # line.
        let:
          text: ctx.text
          lineStart: text.lastIndexOf("\n", m.index - 1) + 1
          lineEnd: 'm.index + m[0].length - (m[0].endsWith("\n") ? 1 : 0)'
          marks: "esQuoteMarks(text, text.indexOf('\"', lineStart), lineEnd)"
          usable: marks.length >= 2 && marks.length % 2 === 0 && !marks.some((k) => /\d/.test(text[k - 1] ?? ""))
        return: 'usable ? marks.flatMap((open, p) => (p % 2 ? [] : esQuotePairSpaces(ctx, open, marks[p + 1]))) : []'
  - id: es.dashes
    checks: [emdashShortcut]
    group: emdashShortcut
    style: match
    message: review_msg_spanish_dialogue_dash
    defs:
      # A dialogue or remark dash at [start, end) of the chunk gets the long dash.
      esLongDash:
        args: "ctx: DetectContext, start: number, end: number"
        return: >-
          start < ctx.from || start >= ctx.to
            ? null
            : esFinding("emdashShortcut", "review_msg_spanish_dialogue_dash", start, end, ["—"])
    # A dash may both open a dialogue line and open a remark: one finding for it.
    filter:
      let:
        seen: new Set<number>()
      return: findings.filter((f) => !seen.has(f.range.start) && !!seen.add(f.range.start))
    frames:
      # "Ven -dijo.", "-¿Perdón?": the dialogue dash, an optional typography check like the
      # dash. Verbs of saying after a dialogue line use the long dash.
      - regex: "(?<=[\\p{L}.,!?…][ \\t]?)[-–‒](?=(?:{{SAYING}})(?![\\p{L}]))|(?<=^|\\n)[-–‒](?=[¿¡]|\\p{Lu}\\p{Ll})|(?<=[ \\t]|^)--(?=[ \\t]|$)"
        flags: gu
        scan: owned
        lookback: 8
        when: '!namedExampleBefore(ctx.text, m.index)'
        return: esLongDash(ctx, m.index, m.index + m[0].length)
      # "Se fue -¿no?-, y volvió", "Finol –medalla de bronce– ganó": a remark set off by a pair
      # of hyphens or en dashes, open after a space and closed before a space or a mark.
      - regex: "(?<=[ \\t])[-\\u2013](?=[\\p{L}\\u00BF\\u00A1])[^-\\u2013\\n]{0,150}?[\\p{L}\\p{N}?!.\\u2026][-\\u2013](?=[ \\t,.;:)]|$)"
        flags: gu
        scan: owned
        lookback: 160
        # "Se fue -¿no?-, y volvió", "Finol –medalla de bronce– ganó": both dashes of the remark.
        let:
          close: m.index + m[0].length - 1
        when: '!namedExampleBefore(ctx.text, m.index)'
        return: '[esLongDash(ctx, m.index, m.index + 1), esLongDash(ctx, close, close + 1)].filter((dash) => dash !== null)'
  - id: es.rangeDash
    checks: [emdashShortcut]
    group: emdashShortcut
    style: match
    message: review_msg_range_dash
    defs:
      # "las páginas 10-15" -> "10–15" (opt-in). A label that makes the pair a phone number, a postal
      # code, an ID or a reference.
      ES_RANGE_CODE_BEFORE: '/(?:^|[\s(])(?:tel|teléf|tfno|tlf|teléfono|móvil|fax|whatsapp|c\.?p|código|cód|n\.?º|núm|número|ref|referencia|expediente|exp|lote|pedido|factura|matrícula|dni|nie|nif|cif|cuenta|iban|tarjeta|art|artículo|ley|decreto|modelo|versión|vuelo|línea|ruta)\.?:?(?:[ \t]{1,8}(?:es|era|será))?[ \t]{0,8}$/iu'
      # A result: "ganó 3-1", "empataron 2-2", "el marcador 1-2".
      ES_RANGE_SCORE_BEFORE: '/(?:^|\s)(?:gan\p{L}*|perd\p{L}*|venc\p{L}*|empat\p{L}*|derrot\p{L}*|golea\p{L}*|marcador|resultado|partido|set|sets|tanteo)[ \t]{1,8}(?:\p{L}+[ \t]{1,8}){0,2}$/iu'
    frames:
      # "pages 10-15", "1990-1995": two numbers of up to four digits joined by a hyphen. A dash,
      # a colon, a slash or a digit group after the second number makes a date, a phone number
      # or a code ("12-05-2020", "2024-05-01"); a decimal or a time ("8.00-9.00") stays.
      - regex: "{{RANGE_DASH}}"
        scan: owned
        lookback: 8
        flags: gu
        # "10-15" -> "10–15": an ascending range of numbers takes an en dash. A leading zero or a 3-4
        # pair is a phone number or an ID: "0034-600", "12-05", "915-5512". A range runs up: "1990-95"
        # and the season "2014-15" end in 1995 and 2015; "3-1" does not.
        let:
          a: m[1]
          b: m[3]
          last: 'a.length === 4 && b.length === 2 ? Number(a.slice(0, 2) + b) : Number(b)'
          before: ctx.text.slice(Math.max(0, m.index - 48), m.index)
        when:
          - m.index >= ctx.from && !namedExampleBefore(ctx.text, m.index)
          - '!(a[0] === "0" || b[0] === "0" || (a.length === 3 && b.length === 4))'
          - last > Number(a)
          - '!(ES_RANGE_CODE_BEFORE.test(before) || ES_RANGE_SCORE_BEFORE.test(before))'
        return: >-
          esFinding("emdashShortcut", "review_msg_range_dash", m.index + a.length, m.index + a.length + m[2].length, ["–"], {
            context: { start: m.index, end: m.index + m[0].length },
          })
  - id: es.decimalComma
    checks: [spanishTypographyStyle]
    style: match
    message: review_msg_spanish_decimal
    frames:
      # "9,349.5", "21,999,349": English digit groups, with a decimal point or with two commas.
      - regex: "(?<![\\p{N}.,])\\d{1,3}(?:(?:,\\d{3})+\\.\\d{1,3}|(?:,\\d{3}){2,})(?![\\p{N}]|[.,]\\p{N})"
        flags: gu
        scan: owned
        lookback: 32
        # "Pesa 1.4 kg" -> "1,4 kg", "9,349.5" -> "9.349,5": the Spanish decimal comma.
        when: m.index >= ctx.from && !namedExampleBefore(ctx.text, m.index)
        return: >-
          ({
            ruleId: "spanishTypographyStyle",
            messageKey: "review_msg_spanish_decimal",
            range: { start: m.index, end: m.index + m[0].length },
            alternatives: [m[0].replace(/[.,]/gu, (c) => (c === "." ? "," : "."))],
          })
      # "1.4 kg", "9349.5", "1 999 349.56": a decimal point before a unit, after four digits or
      # closing a group spaced by thousands. "a las 9.30", "versión 2.5" and "3.2.1" stay.
      - regex: "(?<![\\p{N}.,])(?:\\d{1,3}(?: \\d{3})+|\\d{4,}|\\d{1,3}(?=\\.\\d{1,2}{{UNIT_AFTER}}))\\.\\d{1,2}(?![\\p{N}]|[.,]\\p{N})"
        flags: gu
        scan: owned
        lookback: 32
        # "Pesa 1.4 kg" -> "1,4 kg", "9,349.5" -> "9.349,5": the Spanish decimal comma.
        when: m.index >= ctx.from && !namedExampleBefore(ctx.text, m.index)
        return: >-
          ({
            ruleId: "spanishTypographyStyle",
            messageKey: "review_msg_spanish_decimal",
            range: { start: m.index, end: m.index + m[0].length },
            alternatives: [m[0].replace(/[.,]/gu, (c) => (c === "." ? "," : "."))],
          })
      # "30 km2", "por m3": a unit's exponent is a superscript.
      - regex: "(?<=(?:\\d[ \\t\\u00a0]?|\\bpor[ \\t]|\\/))(?:km|cm|mm|dm|m)[23](?![\\p{L}\\p{N}])"
        flags: gu
        scan: owned
        lookback: 8
        let:
          start: m.index + m[0].length - 1
        when: m.index >= ctx.from && !namedExampleBefore(ctx.text, m.index)
        return: >-
          ({
            ruleId: "spanishTypographyStyle",
            messageKey: "review_msg_typographic_symbol",
            range: { start, end: start + 1 },
            alternatives: [m[0].endsWith("2") ? "²" : "³"],
          })
        message: review_msg_typographic_symbol
  - id: es.agreement
    checks: [spanishAgreement]
    group: spanishAgreement
    style: match
    message: review_msg_spanish_agreement
    frames:
      # Every word: the checks key on nouns, adjectives and determiners. The fixer reads the
      # gender and number of the noun phrase at the token (review/spanish/agreement.ts).
      - regex: "{{TOKEN_WORD}}"
        flags: gu
        scan: owned
        fixer: agreement
  - id: es.verbAgreement
    checks: [spanishAgreement]
    group: spanishAgreement
    style: match
    message: review_msg_spanish_verb_agreement
    # The subject's gender beats the copula's number alone: an attribute finding drops the
    # finding of the first frame at the same start.
    filter: attributeFirst
    frames:
      # Every word from 64 characters before the chunk: the checks key on verbs and subjects,
      # which are no closed list. The fixer reads the subject and the number of the verb
      # (review/spanish/verbAgreement.ts).
      - regex: "{{TOKEN_WORD}}"
        flags: gu
        scan: owned
        lookback: 64
        fixer: verbAgreement
      # The attribute after a copula: "Ellas están cansado" -> "cansadas".
      - regex: "{{TOKEN_WORD}}"
        flags: gu
        scan: owned
        lookback: 64
        fixer: verbAttribute
  - id: es.clauseAgreement
    checks: [spanishAgreement]
    group: spanishAgreement
    style: match
    message: review_msg_spanish_impersonal_haber
    # A plural verb before the impersonal "haber" ("pueden haber cuatro" -> "puede haber"), and "a"
    # before a doubled pronoun.
    sets:
      # What the impersonal "haber" introduces: a quantity or a plural noun phrase.
      ES_HABER_QUANTITY:
        [
          muchos, muchas, varios, varias, algunos, algunas, unos, unas, pocos, pocas, demasiados, demasiadas,
          tantos, tantas, más, menos, dos, tres, cuatro, cinco, seis, siete, ocho, nueve, diez, cien, mil, miles,
          cientos, millones, otros, otras, nuevos, nuevas, grandes,
        ]
      ES_DATIVE: [me, te, le, les, nos, os]
    maps:
      # The es.clauseAgreement frame lists these words.
      ES_PLURAL_MODAL:
        pueden: puede
        podían: podía
        podrían: podría
        pudieron: pudo
        deben: debe
        debían: debía
        deberían: debería
        suelen: suele
        solían: solía
        van: va
        iban: iba
        tienen: tiene
        tenían: tenía
        tendrán: tendrá
        tendrían: tendría
    defs:
      # The dative clitic each "a" + pronoun doubles: "a mí me gusta", "a ellas les gusta".
      ES_DOUBLED: >-
        new Map([
          ["mí", "me"], ["ti", "te"], ["él", "le"], ["ella", "le"], ["usted", "le"], ["nosotros", "nos"],
          ["nosotras", "nos"], ["vosotros", "os"], ["vosotras", "os"], ["ellos", "les"], ["ellas", "les"],
          ["ustedes", "les"],
        ])
      # "Pueden haber cuatro" -> "Puede": the verb before an impersonal "haber" stays singular.
      # "tienen que haber", "van a haber" need their linking word; "deben de haber" may have it.
      # "Podrían haber discrepancias": a plural noun. The participle of a perfect infinitive never
      # takes the plural ("pueden haber llegado"), so "pueden haber heridos" is a noun too. After a
      # subject ("Los precios pueden haber subidos") the plural participle is the error instead.
      esImpersonalHaber:
        args: "ctx: DetectContext, tokens: SpanishTokens, i: number"
        let:
          fix: ES_PLURAL_MODAL[tokens[i].lower]
          at: esAround(tokens, i)
          link: '/^t/u.test(tokens[i].lower) ? "que" : /^(?:van|iban)$/u.test(tokens[i].lower) ? "a" : null'
          k: 'link || at.next() === "de" ? 2 : 1'
          what: at.next(k + 1)
          form: esParticiple(what)
          quantity: >-
            ES_HABER_QUANTITY.has(what) || /^\p{N}/u.test(tokens[i + k + 1]?.text ?? "") ||
            (/s$/u.test(what) && esIsNoun(what) && !form) || (!!form?.plural && !esSubjectAt(at, 1))
        when:
          - fix
          - '!link || at.next() === link'
          - at.next(k) === "haber"
          - quantity
        return: 'esReplaceToken(ctx, tokens[i], [fix], "spanishAgreement", "review_msg_spanish_impersonal_haber", tokens[i + k])'
      esDoubledSkip:
        args: "at: SpanishAround, k: number"
        type: number
        return: "k < 4 && /^(?:no|ya|también|tampoco|nunca|siempre|sí)$/u.test(at.next(k)) ? esDoubledSkip(at, k + 1) : k"
      # "A mí no te gusta" -> "me": the clitic repeats the person "a" + pronoun names. "A él me lo
      # presentaron": two clitics, and the doubled one may be "lo".
      esDoubledPronoun:
        args: "ctx: DetectContext, tokens: SpanishTokens, i: number"
        let:
          at: esAround(tokens, i)
          want: ES_DOUBLED.get(at.next())
          k: esDoubledSkip(at, 2)
          clitic: at.next(k)
        when:
          - tokens[i].lower === "a" && at.starts
          - want
          - '!(!ES_DATIVE.has(clitic) || ES_CLITICS.has(at.next(k + 1)) || !esFiniteVerb(at.next(k + 1)))'
          - clitic !== want
        return: 'esReplaceToken(ctx, tokens[i + k], [want], "spanishAgreement", "review_msg_spanish_doubled_pronoun", tokens[i + 1])'
    frames:
      # A plural modal before the impersonal "haber", and "a" before a doubled pronoun. The
      # fixer reads the clause around the token (review/spanish/clauses.ts).
      - regex: "(?:a|pueden|pod[ií]an|podr[ií]an|pudieron|deben|deb[ií]an|deber[ií]an|suelen|sol[ií]an|van|iban|tienen|ten[ií]an|tendr[aá]n|tendr[ií]an){{WORD_TAIL}}"
        flags: giu
        scan: owned
        let:
          tokens: esTokens(ctx)
          i: esTokenAt(tokens, m.index)
        when:
          - i >= 0
          - tokens[i].word && tokens[i].start >= ctx.from && tokens[i].start < ctx.to
        return: "[esImpersonalHaber(ctx, tokens, i), esDoubledPronoun(ctx, tokens, i)].filter((finding) => finding !== null)"
  - id: es.frameAgreement
    checks: [spanishAgreement]
    group: spanishAgreement
    style: match
    message: review_msg_spanish_agreement
    # Short closed-class frames of agreement: "miles de persona" -> "personas", "soy conscientes" ->
    # "consciente". The first finding wins.
    sets:
      # Mass nouns an amount may still measure loosely ("millones de dinero" is clumsy, not plural).
      ES_MASS:
        [
          dinero, gente, agua, tiempo, información, trabajo, comida, ropa, música, arena, leche, aire, basura,
          energía, sangre, carne, madera, gasolina, petróleo, vino, cerveza, azúcar, sal, harina, público,
          personal, ganado, polvo,
        ]
      # Nouns of amount that count a plural: "miles de personas", "decenas de veces".
      ES_FR_AMOUNTS: [miles, millones, cientos, centenares, decenas, docenas, billones, millares]
      ES_SINGULAR_COPULA_FORMS: [soy, eres, estoy, estás]
      ES_FR_DEGREE: [muy, tan, bastante, demasiado, más, menos, tremendamente, realmente]
      ES_FR_PLURAL_DETERMINERS: [los, las, estos, estas, esos, esas, aquellos, aquellas, mis, tus, sus]
      ES_PREPOSITIONS_BEFORE_LO: [de, por, en, con, para, sin, desde, hasta, sobre, entre]
      # Feminine nouns with a stressed first "a": "el área", but "la misma área".
      ES_STRESSED_A: [área, agua, alma, arma, aula, águila, hambre, hacha, hada, ala, ancla, arca]
      # Copulas whose participle agrees with a subject placed after it: "queda garantizada la
      # entrega".
      ES_FR_COPULAS:
        [queda, quedan, quedó, quedaron, quedaba, quedaban, está, están, estaba, estaban, estuvo, estuvieron, resulta, resultan, resultó, resultaron]
      # "tener" + participle + object: "tenía prevista la reunión" (the participle agrees with it).
      ES_FR_TENER:
        [tengo, tienes, tiene, tenemos, tienen, tenía, tenías, teníamos, tenían, tuve, tuvo, tuvimos, tuvieron, tendrá, tendrán, tendría, tendrían, tenga, tengan]
    maps:
      # The feminine article of a masculine one before a noun with a stressed first "a".
      ES_FEMININE_ARTICLE: { el: la, un: una, del: de la, al: a la }
    defs:
      ES_COMPOUND_VERB: /^(?:corta|para|lava|saca|abre|guarda|limpia|porta|pasa|cuenta|rompe|mata|quita|salva|tapa|cubre|pica|lanza|toca|cumple|sujeta|chupa|espanta|trota|ciempiés)\p{L}{3,}s$/u
      # Shortened adjectives and their full plural forms: "buen amigo" but "buenos amigos".
      ES_APOCOPE: >-
        new Map([
          ["buen", ["buenos", "buenas"]], ["mal", ["malos", "malas"]], ["gran", ["grandes", "grandes"]],
          ["primer", ["primeros", "primeras"]], ["tercer", ["terceros", "terceras"]],
        ])
      # Participles that name or rank: "está considerado la mejor obra" (the subject is before).
      ES_NAMING: /^(?:considerad|llamad|conocid|nombrad|elegid|declarad|proclamad|reconocid|catalogad|calificad|denominad|tenid|situad|ubicad)[oa]s?$/u
      # "decenas de personalidad" -> "personalidades". "miles de millones", "cientos de miles":
      # amounts of amounts are plural already.
      esAmountOf:
        args: "ctx: DetectContext, at: SpanishAround"
        let:
          token: at.tokens[at.i + 2]
          word: token.lower
          noun: esReadNoun(word)
          plural: esPluralOf(word)
        when:
          - ES_FR_AMOUNTS.has(at.tokens[at.i].lower) && at.next() === "de"
          - token?.word && !token.broken && /^\p{Ll}+$/u.test(token.text)
          - '!(!noun || noun.plural || noun.invariant || !esIsNoun(word) || esAttributeOf(word))'
          - '!ES_MASS.has(word)'
          - '!(ES_FR_AMOUNTS.has(word) || esFiniteVerb(word))'
          - plural
        return: 'esReplaceToken(ctx, token, [plural], "spanishAgreement", "review_msg_spanish_agreement", at.tokens[at.i])'
      # "Soy conscientes", "Estoy cansados": a first or second person singular takes no plural. "Tú y
      # yo estamos" is plural; "yo soy" with a subject before keeps its person. The attribute
      # closes its phrase: "soy conscientes de", "estoy cansados.".
      esSingularAttribute:
        args: "ctx: DetectContext, at: SpanishAround"
        let:
          k: 'ES_FR_DEGREE.has(at.next()) ? 2 : 1'
          token: at.tokens[at.i + k]
          word: token.lower
          reading: esAttributeOf(word)
          singular: >-
            reading?.plural && /[oa]s$/u.test(word) && !esIsNoun(word)
              ? word.slice(0, -1)
              : word.endsWith("ces") && ES_INVARIANT.has(`${word.slice(0, -3)}z`)
                ? `${word.slice(0, -3)}z`
                : ES_INVARIANT.has(word.slice(0, -1))
                  ? word.slice(0, -1)
                  : ES_INVARIANT.has(word.slice(0, -2)) ? word.slice(0, -2) : null
          after: esAround(at.tokens, at.i + k)
        when:
          - ES_SINGULAR_COPULA_FORMS.has(at.tokens[at.i].lower)
          - '!/^(?:y|e|ni)$/u.test(at.prev(2))'
          - token?.word && !at.tokens[at.i + 1].broken && /^\p{Ll}+$/u.test(token.text)
          - word.endsWith("s")
          - singular
          - after.endsAfter() || /^(?:de|del|con|para|por|en|a|y|e|pero)$/u.test(after.next())
        return: 'esReplaceToken(ctx, token, [singular], "spanishAgreement", "review_msg_spanish_agreement", at.tokens[at.i])'
      # "buen amigos" -> "buenos amigos": the shortened form goes only before a singular noun. "gran
      # cortafuegos", "un buen paraguas": a verb-and-noun compound is singular too. "Gran Bretaña"
      # and other names are capitalized; "el mal menor" is no plural.
      esApocopePlural:
        args: "ctx: DetectContext, at: SpanishAround"
        let:
          token: at.tokens[at.i]
          forms: ES_APOCOPE.get(token.lower)
          nounToken: at.tokens[at.i + 1]
          noun: esReadNoun(nounToken.lower)
        when:
          - forms && nounToken?.word && !nounToken.broken && /^\p{Ll}+$/u.test(nounToken.text)
          - noun?.plural && noun.gender
          - '!ES_COMPOUND_VERB.test(nounToken.lower)'
        return: 'esReplaceToken(ctx, token, [forms[noun.gender === "f" ? 1 : 0]], "spanishAgreement", "review_msg_spanish_agreement", nounToken)'
      # "las consecuencias directas e indirectos" -> "indirectas": the second of two adjectives joined
      # after a noun agrees with the noun the first one already agrees with. The first adjective
      # agreeing with the noun shows the phrase is "noun adjective y …"; a second word that is a noun
      # too may start a phrase of its own ("faldas rojas y blanco").
      esCoordinatedAdjective:
        args: "ctx: DetectContext, at: SpanishAround"
        let:
          noun: esReadNoun(at.tokens[at.i].lower)
          first: at.next()
          second: at.tokens[at.i + 3]
          a: esGenderedForm(first)
          b: esGenderedForm(second.lower)
          feminine: noun.gender === "f"
          stem: /^(\p{L}+?)(?:o|a|os|as)$/u.exec(second.lower)?.[1]
        when:
          - noun?.gender && !noun.paired && /^\p{Ll}/u.test(at.tokens[at.i].text)
          - /^(?:y|e|o|u|ni)$/u.test(at.next(2)) && second?.word && !second.broken
          - '!(!a || !b || esIsNoun(second.lower) || esFiniteVerb(second.lower))'
          - '!(a.feminine !== feminine || a.plural !== noun.plural)'
          - '!(b.feminine === feminine && b.plural === noun.plural)'
          - stem && esAround(at.tokens, at.i + 3).endsAfter()
        return: >-
          esReplaceToken(ctx, second, [`${stem}${feminine ? "a" : "o"}${noun.plural ? "s" : ""}`], "spanishAgreement",
            "review_msg_spanish_agreement", at.tokens[at.i])
      # "Toda las frases" -> "Todas", "todos el día" -> "todo": "todo" takes its noun's number. Only
      # "toda las": "tienen todos el mismo precio" floats the quantifier after its verb. "sobre todo
      # las charlas", "del todo las diferencias", "habla de todo las tardes": "todo" stands alone
      # there. "todos el mismo día"? The noun after the determiner settles the number.
      esTodoNumber:
        args: "ctx: DetectContext, at: SpanishAround"
        let:
          m: /^(tod)(o|a)(s?)$/u.exec(at.tokens[at.i].lower)
          plural: ES_FR_PLURAL_DETERMINERS.has(at.next())
          noun: esReadNoun(at.next(2))
        when:
          - m && !at.tokens[at.i + 1]?.broken
          - plural && m[3] !== "s"
          - '!/^(?:sobre|del|ante|de|con|en|por|para|lo)$/u.test(at.prev())'
          - noun && noun.plural === plural
        return: >-
          esReplaceToken(ctx, at.tokens[at.i], [`tod${m[2]}${plural ? "s" : ""}`], "spanishAgreement",
            "review_msg_spanish_agreement", at.tokens[at.i + 2])
      # "por lo noche" -> "la noche": the neuter "lo" takes no feminine noun.
      esLoFeminine:
        args: "ctx: DetectContext, at: SpanishAround"
        let:
          word: at.next()
          noun: esReadNoun(word)
        when:
          - at.tokens[at.i].text === "lo" && ES_PREPOSITIONS_BEFORE_LO.has(at.prev())
          - '!(!noun || noun.plural || noun.gender !== "f" || noun.paired)'
          - '!(!esIsNoun(word) || esAttributeOf(word) || esFiniteVerb(word) || esIsInfinitive(word))'
        return: 'esReplaceToken(ctx, at.tokens[at.i], ["la"], "spanishAgreement", "review_msg_spanish_agreement", at.tokens[at.i + 1])'
      # "El mismo área" -> "La misma área": "el" serves the noun, not the adjective before it.
      esStressedAdjective:
        args: "ctx: DetectContext, at: SpanishAround"
        let:
          det: at.tokens[at.i]
          article: ES_FEMININE_ARTICLE[det.lower]
          adjective: at.next()
          m: /^(\p{L}+)o$/u.exec(adjective)
          form: esGenderedForm(adjective)
        when:
          - article && ES_STRESSED_A.has(at.next(2))
          - '!(!m || !form || form.feminine || form.plural || at.tokens[at.i + 2].broken)'
        return: >-
          esReplaceToken(ctx, esSpan(ctx, det, at.tokens[at.i + 1]), [`${article} ${m[1]}a`], "spanishAgreement",
            "review_msg_spanish_agreement", at.tokens[at.i + 2])
      # "Queda garantizado la entrega" -> "garantizada": the participle agrees with the subject after
      # it; "Tenía prevista el resultado" -> "previsto": or with the object of "tener" after it. Only
      # a clause start, a subordinator or a fronted "de esta forma" / "por tanto" before: "Ya está
      # pagada la cuenta", "que quede…". "Lo tiene agotado la enfermedad": the participle agrees
      # with the clitic; "tiene sentido la idea": a noun. "su reunión": with no known gender, only a
      # determiner that shows one decides.
      esPostposedSubject:
        args: "ctx: DetectContext, at: SpanishAround"
        let:
          verb: at.tokens[at.i].lower
          token: at.tokens[at.i + 1]
          prev: at.prev()
          fronted: >-
            (/^(?:forma|modo|manera)$/u.test(prev) && at.prev(3) === "de") ||
            (/^(?:tanto|ello|esto|eso|consiguiente)$/u.test(prev) && /^(?:por|con)$/u.test(at.prev(2)))
          form: esParticiple(token.lower)
          m: /^(\p{L}+?)(o|a|os|as)$/u.exec(token.lower)
          det: ES_DETERMINER.get(at.next(2))
          noun: esReadNoun(at.next(3))
          plural: det.slot >= 2
          feminine: 'noun.gender ? noun.gender === "f" : det.slot % 2 === 1'
        when:
          - token?.word && !token.broken && !ES_NAMING.test(token.lower)
          - >-
            ES_FR_COPULAS.has(verb)
              ? at.starts || fronted || /^(?:ya|que|no|así|también|ahora|hoy|y)$/u.test(prev)
              : ES_FR_TENER.has(verb) && !ES_CLITICS.has(prev) && !esIsNoun(token.lower)
          - form && m
          - '!(!det || !noun || /^(?:del|al)$/u.test(at.next(2)) || at.next(3) === "verdad")'
          - '!(!noun.gender && det.forms[0] === det.forms[1])'
          - '!(noun.plural !== plural && !noun.invariant)'
          - '!(form.feminine === feminine && form.plural === plural)'
        return: >-
          esReplaceToken(ctx, token, [`${m[1]}${feminine ? "a" : "o"}${plural ? "s" : ""}`], "spanishAgreement",
            "review_msg_spanish_agreement", at.tokens[at.i + 3])
      # "a favor de uno acreedores" -> "unos": the plural noun takes the plural article. "cada uno
      # sus cosas", "uno mismos"? Only a noun or adjective plural after it. With no known gender,
      # "unas" can be correct too: "de uno opiniones" (unas).
      esUnoPlural:
        args: "ctx: DetectContext, at: SpanishAround"
        let:
          next: at.tokens[at.i + 1]
          noun: esReadNoun(next.lower)
        when:
          - at.tokens[at.i].lower === "uno"
          - next?.word && !next.broken && /^\p{Ll}+s$/u.test(next.text)
          - '!(!noun?.plural || noun.gender === "f" || esFiniteVerb(next.lower))'
          - '!(ES_DETERMINER.has(next.lower) || /^(?:más|menos|tras|cuantos)$/u.test(next.lower))'
        return: >-
          esReplaceToken(ctx, at.tokens[at.i], noun.gender === "m" ? ["unos"] : ["unos", "unas"], "spanishAgreement",
            "review_msg_spanish_agreement", next)
    frames:
      # Every word: one frame keys on any noun before two joined adjectives. The fixer reads
      # the gender and number of the words around the token (review/spanish/frames.ts).
      - regex: "{{TOKEN_WORD}}"
        flags: gu
        scan: owned
        let:
          tokens: esTokens(ctx)
          i: esTokenAt(tokens, m.index)
          token: tokens[i]
          at: esAround(tokens, i)
        when:
          - i >= 0
          - token.word && token.start >= ctx.from && token.start < ctx.to
        return: "esAmountOf(ctx, at) ?? esSingularAttribute(ctx, at) ?? esApocopePlural(ctx, at) ?? esCoordinatedAdjective(ctx, at) ?? esTodoNumber(ctx, at) ?? esLoFeminine(ctx, at) ?? esStressedAdjective(ctx, at) ?? esPostposedSubject(ctx, at) ?? esUnoPlural(ctx, at)"
  - id: es.clauseStyle
    checks: [stylePhrasing]
    style: match
    message: review_msg_style_phrasing
    # "hace ... atrás", and an adverb that the clause repeats.
    sets:
      # The es.clauseStyle frame lists these words.
      ES_REPEATABLE_ADVERBS: [también, tampoco, ya, solo, sólo, aún, todavía, siempre, nunca]
    defs:
      ES_TIME_UNITS: /^(?:segundo|minuto|hora|día|semana|mes|año|siglo|década|lustro|rato|tiempo)(?:s|es)?$/u
      # The first time unit within five words after "hace", or 0.
      esTimeUnit:
        args: "at: SpanishAround, k: number"
        type: number
        return: "k > 5 || !at.next(k) ? 0 : ES_TIME_UNITS.test(at.next(k)) ? k : esTimeUnit(at, k + 1)"
      # "hace dos años atrás" -> "hace dos años" or "dos años atrás": "hace" and "atrás" both say
      # "ago". Up to five words of amount may stand between: "hace exactamente un mes y medio atrás".
      esAgoBack:
        args: "ctx: DetectContext, tokens: SpanishTokens, i: number"
        let:
          at: esAround(tokens, i)
          unit: esTimeUnit(at, 1)
          end: 'at.next(unit + 1) === "y" && /^medi[oa]$/u.test(at.next(unit + 2)) ? unit + 3 : unit + 1'
          amount: ctx.text.slice(tokens[i + 1].start, tokens[i + end - 1].end)
        when:
          - tokens[i].lower === "hace"
          - unit
          - at.next(end) === "atrás"
        return: >-
          esReplaceToken(ctx, esSpan(ctx, tokens[i], tokens[i + end]), [`hace ${amount}`, `${amount} atrás`], "stylePhrasing",
            "review_msg_style_phrasing")
      # The same word as tokens[i] in the k-th word after it, on one line of words: its k, or -1.
      esRepeatAt:
        args: "tokens: SpanishTokens, i: number, word: string, k: number"
        type: number
        let:
          token: tokens[i + k]
        return: >-
          k > 4 || !token || token.broken || !tokens[i + k - 1]?.word || !token.word
            ? -1
            : token.lower === word ? k : esRepeatAt(tokens, i, word, k + 1)
      # "También se llama también así" -> drop one: the same adverb twice in a short clause. "ya
      # sea uno, ya sea otro": the correlative repeats on purpose. Remove the second one with the
      # space before it.
      esRepeatedAdverb:
        args: "ctx: DetectContext, tokens: SpanishTokens, i: number"
        let:
          word: tokens[i].lower
          k: esRepeatAt(tokens, i, word, 2)
          start: tokens[i + k - 1].end
        when:
          - ES_REPEATABLE_ADVERBS.has(word) && !(word === "ya" && tokens[i + 1]?.lower === "sea")
          - k >= 0
        return: >-
          esReplaceToken(ctx, { ...tokens[i + k], start, text: ctx.text.slice(start, tokens[i + k].end) }, [""], "stylePhrasing",
            "review_msg_style_phrasing", tokens[i], true)
    frames:
      # "hace ... atrás", and an adverb that the clause repeats. The fixer reads the clause
      # around the token (review/spanish/clauses.ts).
      - regex: "(?:hace|tambi[eé]n|tampoco|ya|s[oó]lo|a[uú]n|todav[ií]a|siempre|nunca){{WORD_TAIL}}"
        flags: giu
        scan: owned
        let:
          tokens: esTokens(ctx)
          i: esTokenAt(tokens, m.index)
        when:
          - i >= 0
          - tokens[i].word && tokens[i].start >= ctx.from && tokens[i].start < ctx.to
        return: "[esAgoBack(ctx, tokens, i), esRepeatedAdverb(ctx, tokens, i)].filter((finding) => finding !== null)"
  - id: es.quotes
    checks: [spanishQuotes]
    style: match
    message: review_msg_spanish_quotes
    # Spanish typography quotes with angle marks first («así»), and with curly single marks inside
    # them (‘así’). Typewriter pairs typed on one line get the typographic ones. Opt-in: straight
    # quotes are common and accepted in informal text.
    defs:
      # The finding that replaces one straight mark of a pair.
      esQuoteMark:
        args: "start: number, replacement: string, pairEnd: number"
        return: >-
          ({
            ruleId: "spanishQuotes" as const,
            messageKey: "review_msg_spanish_quotes" as const,
            range: { start, end: start + 1 },
            alternatives: [replacement],
            context: { start: Math.max(0, start - 1), end: pairEnd },
          })
      # The straight pair of match `m` gets the marks `open` and `close`.
      esQuotePair:
        args: "m: RegExpExecArray, ctx: DetectContext, open: string, close: string"
        let:
          end: m.index + m[0].length
        when:
          - m.index >= ctx.from
          # Protected text, code and quoted examples keep their marks.
          - '!(ctx.text.slice(m.index, end).includes("￼") || namedExampleBefore(ctx.text, m.index))'
        return: "[esQuoteMark(m.index, open, end), esQuoteMark(end - 1, close, end)]"
    frames:
      # A straight pair around a phrase on one line: opening after a space, a bracket or a dash
      # and before a letter, closing after a letter, digit or sentence mark.
      - regex: "(?<=^|[\\s([{\\u00BF\\u00A1\\u2014\\u2013-])\"(?=[\\p{L}\\p{N}\\u00BF\\u00A1])([^\"\\n]{1,200}?)(?<=[\\p{L}\\p{N}.!?\\u2026])\"(?![\\p{L}\\p{N}])"
        flags: gu
        scan: owned
        lookback: 256
        return: esQuotePair(m, ctx, "«", "»")
      - regex: "(?<=^|[\\s([{\\u00BF\\u00A1\\u2014\\u2013-])'(?=[\\p{L}\\p{N}\\u00BF\\u00A1])([^'\\n]{1,200}?)(?<=[\\p{L}\\p{N}.!?\\u2026])'(?![\\p{L}\\p{N}])"
        flags: gu
        scan: owned
        lookback: 256
        return: esQuotePair(m, ctx, "‘", "’")
  - id: es.repeatedPair
    checks: [englishRepeatedWords]
    style: match
    message: review_msg_repeated_words
    defs:
      # "a casa a casa" -> "a casa": two words typed twice in a row. "paso a paso a la cima", "de dos
      # en dos en", "los de los pájaros", "sea quien sea quien": distributive pairs and set phrases
      # repeat their words.
      esRepeatedPair:
        args: "ctx: DetectContext, at: SpanishAround"
        let:
          t: at.tokens
          a: t[at.i]
          b: t[at.i + 1]
        when:
          - '!(!b?.word || a.lower === b.lower || /^(?:y|e|o|u|ni|que)$/u.test(b.lower))'
          - '!(/^(?:y|e|o|u|ni|de|sea|quien)$/u.test(a.lower) || ES_PREPOSITIONS.has(b.lower))'
          - '!(t[at.i + 2]?.lower !== a.lower || t[at.i + 3]?.lower !== b.lower)'
          - '![1, 2, 3].some((k) => t[at.i + k].broken || !t[at.i + k].word)'
          - t[at.i + 4]?.lower !== a.lower
        return: >-
          esReplaceToken(ctx, esSpan(ctx, a, t[at.i + 3]), [ctx.text.slice(a.start, b.end)], "englishRepeatedWords",
            "review_msg_repeated_words")
    frames:
      # Every word: the fixer compares the word pair at the token with the pair after it
      # (review/spanish/frames.ts).
      - regex: "{{TOKEN_WORD}}"
        flags: gu
        scan: owned
        let:
          tokens: esTokens(ctx)
          i: esTokenAt(tokens, m.index)
          token: tokens[i]
          at: esAround(tokens, i)
        when:
          - i >= 0
          - token.word && token.start >= ctx.from && token.start < ctx.to
        return: "esRepeatedPair(ctx, at)"

