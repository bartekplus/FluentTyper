# es grammar rules. See docs/agents/grammar-rules.md for the format.
lang: es

rules:
  - id: es.estarAccents
    checks: [spanishAccents]
    predicate: estarAccents
  - id: es.diacritics
    checks: [spanishAccents]
    predicate: diacritics
  - id: es.verbAccents
    checks: [spanishAccents]
    predicate: verbAccents
  - id: es.paraQueAccent
    checks: [spanishAccents]
    predicate: paraQueAccent
  - id: es.frameAccents
    checks: [spanishAccents]
    predicate: frameAccents
  - id: es.confusions
    checks: [spanishConfusions]
    predicate: confusions
  - id: es.verbForms
    checks: [spanishConfusions]
    predicate: verbForms
  - id: es.prefixes
    checks: [spanishConfusions]
    predicate: prefixes
  - id: es.porque
    checks: [spanishConfusions]
    predicate: porque
  - id: es.clauseConfusions
    checks: [spanishConfusions]
    predicate: clauseConfusions
  - id: es.frameConfusions
    checks: [spanishConfusions]
    predicate: frameConfusions
  - id: es.typography
    checks: [spanishTypography]
    predicate: typography
  - id: es.commas
    checks: [spanishTypography]
    predicate: commas
  - id: es.missingSpace
    checks: [commaPeriodSpacing]
    predicate: missingSpace
  - id: es.dashes
    checks: [emdashShortcut]
    predicate: dashes
  - id: es.decimalComma
    checks: [spanishTypographyStyle]
    predicate: decimalComma
  - id: es.agreement
    checks: [spanishAgreement]
    predicate: agreement
  - id: es.verbAgreement
    checks: [spanishAgreement]
    predicate: verbAgreement
  - id: es.clauseAgreement
    checks: [spanishAgreement]
    predicate: clauseAgreement
  - id: es.frameAgreement
    checks: [spanishAgreement]
    predicate: frameAgreement
  - id: es.clauseStyle
    checks: [stylePhrasing]
    predicate: clauseStyle
  - id: es.quotes
    checks: [spanishQuotes]
    predicate: quotes
  - id: es.repeatedPair
    checks: [englishRepeatedWords]
    predicate: repeatedPair

