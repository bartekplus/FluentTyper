# es grammar rules. See docs/agents/grammar-rules.md for the format.
lang: es

# Regex fragments of the frame rules: {{NAME}}.
fragments:
  # Prefixes that are no word of their own, so a space after them is always a split.
  BOUND: "anti|ciber|pre|re|vice|hiper|inter|neuro|geo|nano|agro|sub|semi|multi|pos|infra|intra|seudo|pseudo|archi|hemi|co|fito|meso|hidro|termo|electro|cardio|psico|sero"
  # Prefixes that are also words; FREE in review/spanish/prefixes.ts holds the same list.
  FREE: "ex|pro|des|post|poli|tele|video|foto|euro|afro|micro|macro|mini|ultra|super|súper|auto|radio|bio|eco|socio|mega|giga|kilo|zoo|extra|astro|hispano|anglo|franco|luso|físico|químico|cuasi"
  # Month names; MONTH_NAMES in review/spanish/typography.ts holds the same list.
  MONTH_NAMES: "enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|setiembre|octubre|noviembre|diciembre"
  # Short month names in numeric dates: "29-feb-2005".
  MONTH_SHORT: "ene|feb|mar|abr|may|jun|jul|ago|sep|sept|set|oct|nov|dic"
  ROMAN: "(?:X{1,2}(?:IX|IV|V?I{0,3})|IX|IV|V?I{1,3}|V)"
  # Verbs of saying after a dialogue line: "Ven -dijo." uses the long dash.
  SAYING: "dijo|dije|dice|digo|respondió|contestó|preguntó|añadió|exclamó|gritó|susurró|murmuró|explicó|comentó|replicó|insistió|pensó|repuso|admitió|aclaró"
  # A unit after a decimal number: "9,5 kg".
  UNIT_AFTER: "[ \\t\\u00a0]?(?:%|‰|€|\\$|kg|g|mg|km|m|cm|mm|ml|l|t|°|°C|ºC|m²|m³|km²|ha|kWh|kW|W|V|GB|MB|TB|Hz|kHz|MHz|GHz|kilos?|metros?|litros?|euros?|dólares|grados|millones)(?![\\p{L}\\p{N}])"
  # Words that open a Spanish sentence; STARTERS in review/spanish/typography.ts holds the
  # same list.
  # A whole token of review/spanish/common.ts: a letter run.
  TOKEN_WORD: "\\p{L}[\\p{L}\\p{M}]*"
  # The end of a token's letter run.
  WORD_TAIL: "(?![\\p{L}\\p{M}])"
  STARTERS: "El|La|Los|Las|Lo|Un|Una|Unos|Unas|Y|Pero|Es|Son|Era|Fue|Está|Hay|No|Sí|Yo|Tú|Él|Ella|Ellos|Ellas|Nosotros|Usted|Este|Esta|Estos|Estas|Eso|Esto|Ese|Esa|Se|Me|Te|Le|Les|Nos|Mi|Su|Sus|Tu|En|Del|Al|Con|Por|Para|Sin|Como|Cuando|Si|Que|Qué|Cómo|Dónde|Cuándo|Pues|Así|Luego|Después|Entonces|Ahora|Hoy|Ayer|También|Además|Ya|Todo|Siempre|Nunca|Aquí|Allí|Hola|Gracias|Bueno|Claro|Aunque|Porque|Mientras|Desde|Hasta|Según"

# The code of the rules' expressions (`let`, `when`, `return`): sets and defs that rules of
# several checks use. The names start with "es" or "ES_": a rule file shares its names with
# common.yaml and the rule library.
defs:
  # A finding that replaces [start, end) with each alternative.
  esFinding:
    args: 'ruleId: RawFinding["ruleId"], messageKey: RawFinding["messageKey"], start: number, end: number, alternatives: string[], extra?: Partial<RawFinding>'
    type: RawFinding
    return: "({ ruleId, messageKey, range: { start, end }, alternatives, ...extra })"
  # A token from the start of `first` to the end of `last`.
  esSpan:
    args: "ctx: DetectContext, first: SpanishToken, last: SpanishToken"
    type: SpanishToken
    return: "({ ...first, end: last.end, text: ctx.text.slice(first.start, last.end) })"

  # The scan of the frame reads its next match from `index`. Always true.
  esResume:
    args: "frame: FrameRef, index: number"
    return: frame.resume?.(index) === undefined
  # The tokens of the chunk, for a frame whose match starts a token.
  # "pre" + "rebajas" -> "prerrebajas": a word-initial r doubles after a vowel. "súper", "físico":
  # the first element loses its accent inside the compound.
  esJoinPrefix:
    args: "prefix: string, word: string"
    let:
      base: esPlain(prefix)
    return: '/[aeiou]$/iu.test(base) && word.startsWith("r") && !word.startsWith("rr") ? `${base}r${word}` : `${base}${word}`'

rules:
  # The rules of one check form a group, as the Spanish checks ran before the port: a rule
  # that throws stops its group and drops the group's findings.
  - id: es.estarAccents
    checks: [spanishAccents]
    group: spanishAccents
    style: match
    message: review_msg_spanish_accent
    frames:
      # The "esta" and "está" forms. The fixer reads the words before and after the token
      # (review/spanish/accents.ts).
      - regex: "est(?:[aá]s?|[eé]){{WORD_TAIL}}"
        flags: giu
        scan: owned
        fixer: estarAccents
  - id: es.diacritics
    checks: [spanishAccents]
    group: spanishAccents
    style: match
    message: review_msg_spanish_accent
    frames:
      # The question words, the relatives and the stressed monosyllables. The fixer reads the
      # words around the token (review/spanish/diacritics.ts).
      - regex: "(?:qu[eé]|qui[eé]n(?:es)?|c[oó]mo|a?d[oó]nde|cu[aá]ndo|cu[aá]l(?:es)?|cuan(?:t[oa]s?)?|m[ií]|t[uú]|[eé]l|se|de|t[eé]|si|a[uú]n|mas){{WORD_TAIL}}"
        flags: giu
        scan: owned
        fixer: diacritics
  - id: es.verbAccents
    checks: [spanishAccents]
    group: spanishAccents
    style: match
    message: review_msg_spanish_accent
    frames:
      # Every word: a verb form ("termino", "hablo") is no closed list. The fixer reads the
      # subject and the tense cues around the token (review/spanish/verbAccents.ts).
      - regex: "{{TOKEN_WORD}}"
        flags: gu
        scan: owned
        fixer: verbAccents
  - id: es.paraQueAccent
    checks: [spanishAccents]
    group: spanishAccents
    style: match
    message: review_msg_spanish_interrogative
    frames:
      # "para que" before an indicative, and "ingles", "Paris" and "seria" after the
      # words that ask for the accent. The fixer reads the words around the token
      # (review/spanish/clauses.ts).
      - regex: "(?:que|ingles|paris|seria){{WORD_TAIL}}"
        flags: giu
        scan: owned
        fixer: paraQueAccent
  - id: es.frameAccents
    checks: [spanishAccents]
    group: spanishAccents
    style: match
    message: review_msg_spanish_accent
    frames:
      # "continua" and "perpetua" as verbs, and the accented demonstratives before a noun.
      # The fixer reads the words before and after the token (review/spanish/frames.ts).
      - regex: "(?:continua[sn]?|perpetuan?|ést(?:e|a|os|as)|és(?:e|a|os|as)|aquél(?:la|los|las)?){{WORD_TAIL}}"
        flags: giu
        scan: owned
        fixer: frameAccents
  - id: es.confusions
    checks: [spanishConfusions]
    group: spanishConfusions
    style: match
    message: review_msg_spanish_confusion
    frames:
      # "aun que", "han habido", "el menos", "a ver" and the words of CHECKS. The fixer reads
      # the words around the token (review/spanish/confusions.ts).
      - regex: "(?:a|ah|anos?|apunto|ara|a[uú]n|ay|ayan?|bastantes|caso|cuidad|desech[ao]s?|e|echo|eh|el|entorno|haber|hab[ií]an|habr[aá]n|habr[ií]an|hallas?|hallan|han|hay|hayan?|haz|hech(?:os?|as?|an|amos)|hola|hubieran|hubiesen|[ií]ba|[ií]bais|[ií]ban|[ií]bas|[ií]bamos|lamas?|lamamos|lamo|mama|ola|ora|papa|pod(?:o|es|en)|se|sobretodo|tal|trav[eé]s|va|vais|vallas?|vallamos|vallan|vamos|van|vas|ven|voy){{WORD_TAIL}}"
        flags: giu
        scan: owned
        fixer: confusions
      # "rebeló que" / "revelarse contra": reveal versus rebel, by the word after.
      - regex: "re[bv]el[\\p{L}\\p{M}]*"
        flags: giu
        scan: owned
        fixer: rebelReveal
      # "y les medidas", "os interesados": "les" and "os" before a plural noun.
      - regex: "(?:[lL]es|[oO]s){{WORD_TAIL}}"
        flags: gu
        scan: owned
        fixer: cliticArticle
      # "d esta prueba", "n este caso", "l mesa": a lone consonant that lost its vowel.
      - regex: "[dln]{{WORD_TAIL}}"
        flags: gu
        scan: owned
        fixer: lostVowel
  - id: es.verbForms
    checks: [spanishConfusions]
    group: spanishConfusions
    style: match
    message: review_msg_spanish_verb_form
    frames:
      # Every word: the checks key on verb forms, which are no closed list. The fixer reads the
      # auxiliary, the clitics and the verb forms around the token (review/spanish/verbForms.ts).
      - regex: "{{TOKEN_WORD}}"
        flags: gu
        scan: owned
        fixer: verbForms
  - id: es.prefixes
    checks: [spanishConfusions]
    group: spanishConfusions
    style: match
    message: review_msg_closed_compound
    # Spanish prefixes join the word they modify: "anti ruso" -> "antirruso", "ex-colonias" ->
    # "excolonias". Apart or hyphenated only before a capital, a number or a phrase.
    sets:
      # Prefixes that are also words ("ex", "pro", "tele", "foto", "euro"): joined when hyphenated,
      # or apart when the joined form is a word the dictionary knows ("micro biología"). The FREE
      # fragment holds the same list.
      ES_FREE_PREFIXES:
        [
          ex, pro, des, post, poli, tele, video, foto, euro, afro, micro, macro, mini, ultra, super, súper, auto,
          radio, bio, eco, socio, mega, giga, kilo, zoo, extra, astro, hispano, anglo, franco, luso, físico,
          químico, cuasi,
        ]
      # Free prefixes that join any adjective they grade: "pro democrático", "ultra conservador",
      # "cuasi perfecto"; the words themselves stand before nouns ("los pro y los contra").
      ES_GRADING_PREFIXES: [pro, ultra, cuasi, super, súper]
      # Adjective forms that open a compound of two related adjectives.
      ES_RELATIONAL_PREFIXES: [hispano, anglo, franco, luso, físico, químico]
      ES_SIZE_PREFIXES: [macro, micro, mini, mega, maxi]
    defs:
      # A noun or adjective the dictionary lists: "microbiología", "hispanohablantes". A noun ending
      # alone ("-sión") says nothing after "des", which is also a misspelled "de" ("des discusión").
      esKnownWord:
        args: "word: string"
        return: '!(word.startsWith("des") && ES_NOUN_ENDING.test(word)) && (esIsNoun(word) || esIsGenderedEntry(word) || !!esGenderedForm(word))'
    frames:
      # "anti ruso" -> "antirruso", "ex-colonias" -> "excolonias": a prefix joins the word it
      # modifies. Apart or hyphenated only before a capital, a number or a phrase.
      - regex: "(?<![\\p{L}\\p{N}\\-'’@/#.])({{BOUND}}|{{FREE}})(?:(-)|[ \\t]+)(\\p{L}[\\p{L}\\p{M}]{2,})(?![\\p{L}\\p{N}\\-'’@/])"
        flags: giu
        scan: owned
        lookback: 16
        # "anti ruso", "ex-colonias": a prefix apart from its word or hyphenated.
        let:
          prefix: m[1].toLowerCase()
          hyphen: m[2]
          word: m[3]
          lower: word.toLowerCase()
          # "un súper cercano": after a determiner the word is the noun (the supermarket).
          before: '/(\p{L}+)[ \t]+$/u.exec(ctx.text.slice(Math.max(0, m.index - 24), m.index))?.[1].toLowerCase() ?? ""'
          graded: ES_GRADING_PREFIXES.has(prefix) && !!esGenderedForm(lower) && !esIsNoun(lower) && !ES_DETERMINER.has(before)
          # "un macro análisis", "una mini falda": between a determiner and a noun of its number, a
          # size prefix can only be part of the noun.
          det: ES_DETERMINER.get(before)
          noun: esReadNoun(lower)
          sized: >-
            ES_SIZE_PREFIXES.has(prefix) && !!det && !!noun && !noun.paired && !esAttributeOf(lower) &&
            !ES_PRENOMINAL.has(lower) && (noun.invariant || noun.plural === det.slot >= 2)
          # "vice primer ministro", "ex alto cargo": the prefix takes a whole phrase.
          after: '/^[ \t]{1,8}(\p{L}+)/u.exec(ctx.text.slice(m.index + m[0].length))?.[1] ?? ""'
          apocope: /^(?:primer|tercer|gran|buen|mal|algún|ningún|alto|alta)$/u.test(word)
        when:
          - m.index >= ctx.from
          # "ex presidente" was the rule until 2010 and is still everywhere: only "ex-" is joined.
          - '!(!hyphen && prefix === "ex")'
          # "relaciones hispano-estadounidenses", "un análisis físico-químico": two adjectives that each
          # keep their meaning keep the hyphen ("hispanohablante" fuses into one).
          - '!(hyphen && ES_RELATIONAL_PREFIXES.has(prefix) && !esIsNoun(lower))'
          - '!(hyphen && ES_RELATIONAL_PREFIXES.has(prefix) && /(?:ense|és|ano|ana|ino|ina)s?$|eses$/u.test(lower))'
          - '!(!hyphen && ES_FREE_PREFIXES.has(prefix) && !graded && !sized && !esKnownWord(esJoinPrefix(prefix, word)))'
          - '!/^\p{Lu}/u.test(word)'
          - >-
            !(!hyphen && (apocope || esAttribute(word)) &&
            (esIsNoun(after.toLowerCase()) || esIsGenderedEntry(after.toLowerCase())))
          # "re menor" is the note.
          - '!(prefix === "re" && /^(?:mayor|menor|bemol|sostenido)$/u.test(word))'
          - '!(esKeepsTyped(ctx, m[1]) || ctx.dictionary.has(word) || namedExampleBefore(ctx.text, m.index))'
        return: >-
          esFinding("spanishConfusions", "review_msg_closed_compound", m.index, m.index + m[0].length,
          [esCarryCase(m[1], esJoinPrefix(prefix, word))], { bulkBlock: "context-dependent" })
  - id: es.splitCompounds
    checks: [spanishConfusions]
    group: spanishConfusions
    style: match
    message: review_msg_closed_compound
    sets:
      # Masculine determiners: "un saca corchos" can only be a compound noun, since "saca" (the verb)
      # takes no article and "la saca" (the sack) no masculine one.
      ES_MASCULINE_DETERMINERS: [el, un, del, al, este, ese, aquel, los, unos, estos, esos, aquellos]
    defs:
      # Verbs "mal" fuses with into a new meaning; "mal vive" (lives badly) stays apart.
      ES_MAL_VERBS: /^(?:interpret|gast|trat|cri|vend|her|entend|entiend|acostumbr)\p{L}+$/u
      # "un lanza misiles": the verb and its object, when the noun after is the object: plural, or a
      # mass noun the compound keeps singular. "al guarda", "el lanza": only a feminine noun
      # reading, which "el" cannot take.
      esObjectCompound:
        args: "head: string, tail: string"
        let:
          noun: esReadNoun(tail)
          nounHead: esReadNoun(head)
        return: >-
          noun && !noun.paired && (!nounHead || nounHead.gender === "f") &&
          (noun.plural || esIsNoun(esJoinPrefix(head, tail)))
            ? esJoinPrefix(head, tail)
            : null
      # The compound of two words, or null. "la sobre protegen": a clitic before "sobre" makes the
      # whole a verb.
      esSplitCompound:
        args: "at: SpanishAround, det: string, head: string, tail: string, hyphen: boolean"
        return: >-
          ES_MASCULINE_DETERMINERS.has(det) && /[^aeiou][ae]$/u.test(head) && esFiniteVerb(head)
            ? esObjectCompound(head, tail)
            : !hyphen && (head === "sobre" || (head === "mal" && ES_MAL_VERBS.test(tail))) &&
                !esIsNoun(tail) && !esAttribute(tail)
              ? (esFiniteVerb(tail) && esFiniteVerb(esJoinPrefix(head, tail)) && !ES_CLITICS.has(tail)) ||
                (head === "sobre" && ES_CLITICS.has(at.prev()) && esFiniteVerb(tail) && !esIsNoun(tail) &&
                  !ES_CLITICS.has(tail))
                ? esJoinPrefix(head, tail)
                : null
              : null
    frames:
      # A lowercase word that ends in "a" or "e" (a verb of a compound: "un lanza misiles",
      # "sobre protegen"), and "mal". The fixer reads the determiner before and the verb and
      # noun forms of both halves (review/spanish/prefixes.ts). After a finding, the scan
      # goes on after the second half.
      - regex: "(?:mal|\\p{Ll}*[ae]){{WORD_TAIL}}"
        flags: gu
        scan: owned
        # Compounds written apart: a verb and its object after a masculine determiner ("un lanza
        # misiles" -> "lanzamisiles") and "sobre"/"mal" before a verb ("sobre protegen", "mal
        # interprete").
        let:
          tokens: esTokens(ctx)
          i: esTokenAt(tokens, m.index)
          first: tokens[i]
          # "un lanza-misiles": a hyphen between the two halves.
          hyphen: tokens[i + 1].text === "-" && first.end === tokens[i + 1].start && !!tokens[i + 2]
          second: 'hyphen ? tokens[i + 2] : tokens[i + 1]'
          gap: ctx.text.slice(first.end, second.start)
          at: esAround(tokens, i)
          # "un «apaga fuegos»": the determiner before an opening quote.
          quoted: /^[«“"]$/u.test(tokens[i - 1].text) && !tokens[i].broken
          det: 'quoted ? esAround(tokens, i - 1).prev() : at.prev()'
          joined: esSplitCompound(at, det, first.lower, second.lower, hyphen)
        when:
          - i >= 1 && i + 1 < tokens.length
          # The tokenizer marks a word after a hyphen as glued; its letters still count here.
          - first.word && (second.word || hyphen) && !second.broken && first.start >= ctx.from
          - first.start < ctx.to
          - '!(hyphen && (ctx.text[second.end] === "-" || ctx.text[first.start - 1] === "-"))'
          - gap === " " || (hyphen && gap === "-")
          - /^\p{Ll}+$/u.test(second.text) && /^\p{Ll}+$/u.test(first.text)
          - joined && !esKeepsTyped(ctx, first.lower) && !ctx.dictionary.has(second.lower)
          - '!namedExampleBefore(ctx.text, first.start)'
          # The next match starts after the second half.
          - esResume(frame, second.end)
        return: >-
          esFinding("spanishConfusions", "review_msg_closed_compound", first.start, second.end, [joined],
          { bulkBlock: "context-dependent" })
  - id: es.doubledCompounds
    checks: [spanishConfusions]
    group: spanishConfusions
    style: match
    message: review_msg_closed_compound
    frames:
      # "pilla-pilla", "taca-taca": a doubled word is one compound.
      - regex: "(?<![\\p{L}\\p{N}\\-'\\u2019@/#.])([a-z\\u00F1]{2,5})-([a-z\\u00F1]{2,5})(?![\\p{L}\\p{N}\\-'\\u2019@/])"
        flags: gu
        scan: owned
        lookback: 16
        # "pilla-pilla", "taca-taca": a doubled word is one compound.
        when:
          - m.index >= ctx.from && m[1] === m[2] && !ctx.dictionary.has(m[0].toLowerCase())
          - '!namedExampleBefore(ctx.text, m.index)'
        return: >-
          ({
            ruleId: "spanishConfusions",
            messageKey: "review_msg_closed_compound",
            range: { start: m.index, end: m.index + m[0].length },
            alternatives: [`${m[1]}${m[2]}`],
            bulkBlock: "context-dependent",
          })
  - id: es.porque
    checks: [spanishConfusions]
    group: spanishConfusions
    style: match
    message: review_msg_spanish_confusion
    # porque / porqué / por qué / por que: the conjunction (because), the noun (the reason), the
    # question word (why) and preposition + relative. The frame around each picks the spelling: a
    # determiner makes the noun ("el porqué"), a verb of knowing the question ("no sé por qué").
    sets:
      ES_SINGULAR_DETS: [el, un, del, al, su, este, ese, aquel, ningún, algún, otro, mi, tu, nuestro, vuestro, cuyo]
      ES_PLURAL_DETS: [los, unos, sus, estos, esos, aquellos, mis, tus, nuestros, vuestros]
      # "Dime porque lo has hecho": a command to tell why.
      ES_TELL: [dime, dinos, decirme, decirnos, explícame, explícanos, explicarme, explicarnos]
      ES_NEED: [hay, había, habrá, habría, tengo, tienes, tiene, tenemos, tenéis, tienen, tenía, tenías, tenían]
      ES_REASON: [razón, razones, motivo, motivos, causa, causas]
      # Function words a loose verb reading would count: "no", "me", "una".
      ES_PORQUE_CLOSED: ["no", me, te, se, le, les, lo, la, los, las, nos, os, un, una, el, ya, muy, más]
      # Nouns that ask why: "la pregunta es por qué", "no tengo idea de por qué".
      ES_ASKING_NOUNS: [pregunta, cuestión, duda, idea, misterio, incógnita]
    defs:
      # Verbs whose object can be a "why" question: "no entiendo por qué", "dime por qué".
      ES_KNOWING: /^(?:sé|sabe|sabes|sabemos|saben|sabía|sabías|sabían|saber|supe|supo|sepa|sepas|sepan|entienda|entiendas|comprenda|pregunto|pregunta|preguntas|preguntan|preguntó|preguntaba|preguntarse|preguntarle|entiendo|entiendes|entiende|entender|comprendo|comprende|comprender|explica|explicar|explícame|explicarme|ignoro|averiguar|imagino|imagina|recuerdo|recuerda|dime|dinos|decirme|decirnos|aquí)$/u
      # Futures and conditionals the loose verb reading misses: "vendrá", "sabría".
      ES_FINITE_LOOK: /\p{L}{2,}(?:rá|rán|ré|rás|ría|rían|ríamos|remos)$/u
      # The spelling starting at tokens[i], or null: "porque", "porqué", "por que", "por qués".
      esPorqueSpelling:
        args: "tokens: SpanishTokens, i: number"
        let:
          token: tokens[i]
          next: tokens[i + 1]
        return: >-
          token.lower === "porque" || token.lower === "porqué"
            ? { end: i, kind: token.lower }
            : token.lower === "porques" || token.lower === "porqués"
              ? { end: i, kind: "plural" }
              : token.lower !== "por" || !next?.word || next.broken
                ? null
                : next.lower === "que"
                  ? { end: i + 1, kind: "por que" }
                  : next.lower === "qué"
                    ? { end: i + 1, kind: "por qué" }
                    : next.lower === "qués"
                      ? { end: i + 1, kind: "plural" }
                      : null
      # The finite verbs from tokens[j] to the end of the question, before tokens[end].
      esPorqueVerbs:
        args: "tokens: SpanishTokens, j: number, end: number"
        type: number
        return: >-
          j >= tokens.length || j >= end || tokens[j].broken || /^[?.!]$/u.test(tokens[j].text)
            ? 0
            : (tokens[j].word && esFiniteVerb(tokens[j].lower) && !ES_PORQUE_CLOSED.has(tokens[j].lower) ? 1 : 0) +
              esPorqueVerbs(tokens, j + 1, end)
      # The fixes of the spelling at tokens[i], or null.
      esPorqueFix:
        args: "tokens: SpanishTokens, i: number, spelling: { end: number; kind: string }"
        type: string[] | null
        let:
          at: esAround(tokens, i)
          # "entiendo perfectamente por qué", "¿sabes ya por qué?": an adverb between the verb and
          # the question.
          skip: '/^\p{L}{3,}mente$/u.test(at.prev()) || at.prev() === "ya" ? 1 : 0'
          prev: at.prev(1 + skip)
          # "¿Porque no viniste?", "¿Y porque no?": a question opening with the word asks why.
          opens: tokens[i - 1]?.text === "¿" || (tokens[i - 2]?.text === "¿" && at.prev() === "y")
          # "la pregunta es por qué", "idea de por qué".
          asked: >-
            ((prev === "es" || prev === "era") && ES_ASKING_NOUNS.has(at.prev(2 + skip))) ||
            (prev === "de" && ES_ASKING_NOUNS.has(at.prev(2 + skip)))
          after: esAround(tokens, spelling.end)
          next: after.next()
          closes: after.endsAfter() || next === "de" || next === "del"
          negated: at.prev(2) === "no" || at.prev(3) === "no"
          # "no le gustan por que sabe…": after a verb, a finite clause is a cause or a question; a
          # subjunctive after "por que" is a purpose ("lucha por que haya paz").
          verb: '/^(?:él|ella|ellos|ellas|usted|yo|tú|se|me|te|le|les|lo|la|nos)$/u.test(next) ? after.next(2) : next'
          subject: 'at.prev(2 + skip) === "se" ? 3 + skip : 2 + skip'
        return: >-
          spelling.kind === "plural"
            ? ES_PLURAL_DETS.has(prev) && tokens[i].lower !== "porqués" ? ["porqués"] : null
            : ES_SINGULAR_DETS.has(prev)
              ? spelling.kind !== "porqué" && closes ? ["porqué"] : null
              : ES_PLURAL_DETS.has(prev)
                ? closes ? ["porqués"] : null
                : spelling.kind === "por qué"
                  ? null
                  : asked
                    ? ["por qué"]
                    : spelling.kind === "porqué"
                      ? opens || ES_KNOWING.test(prev)
                        ? ["por qué"]
                        : esFiniteVerb(prev) && next && !closes ? ["porque", "por qué"] : null
                      : spelling.kind === "por que"
                        ? opens || ES_KNOWING.test(prev) || ES_REASON.has(next)
                          ? ["por qué"]
                          : ES_NEED.has(prev) && negated && esIsInfinitive(next)
                            ? ["por qué"]
                            : (esFiniteVerb(prev) || esIsInfinitive(prev)) && !esReadNoun(prev) && !!verb &&
                                esFiniteVerb(verb) && !esSubjunctiveLike(verb)
                              ? ["porque", "por qué"]
                              : null
                        : spelling.kind === "porque" && /^(?:razón|razones|motivo|motivos)$/u.test(prev) &&
                            ES_DETERMINER.has(at.prev(2)) && next &&
                            ![3, 4].some((k) => /^(?:(?:ten|tien|tuv|tend|d[aiáé])\p{L}*|con|sin)$/u.test(at.prev(k)))
                          ? ["por que"]
                          : opens && next && !(esPorqueVerbs(tokens, spelling.end + 1, spelling.end + 16) > 1)
                            ? ["por qué"]
                            : ES_KNOWING.test(prev) && at.prev(subject) === "no" && next
                              ? ["por qué"]
                              : ES_TELL.has(prev) && next
                                ? ["por qué"]
                                : ES_NEED.has(prev) && negated && esIsInfinitive(next) ? ["por qué"] : null
      # The porque spelling at tokens[i] and its fixes, or null.
      esPorquePhrase:
        args: "tokens: SpanishTokens, i: number"
        let:
          spelling: esPorqueSpelling(tokens, i)
          fix: esPorqueFix(tokens, i, spelling)
        when:
          - spelling && !tokens[spelling.end].broken
          - fix
        return: "({ end: spelling.end, fix })"
      # A finite verb, past function words a loose reading would count.
      esPorqueVerbAt:
        args: "token: SpanishToken | undefined"
        return: "!!token?.word && !ES_PORQUE_CLOSED.has(token.lower) && esFiniteVerb(token.lower) && !esReadNoun(token.lower)"
      # A "no" earlier in the clause, from tokens[j] back to tokens[stop]: "No lo hizo él si no…",
      # "para hoy no si no…".
      esNegatedBefore:
        args: "tokens: SpanishTokens, j: number, stop: number"
        type: boolean
        return: >-
          j < 0 || j <= stop
            ? false
            : /^[.;:!?¿¡]$/u.test(tokens[j].text) || tokens[j + 1].broken
              ? false
              : tokens[j].lower === "no" || tokens[j].lower === "nunca" || tokens[j].lower === "tampoco"
                ? true
                : esNegatedBefore(tokens, j - 1, stop)
      # "sino": "no canta sino baila" needs "sino que" or "si no" before a finite verb. "su sino"
      # (fate); "sino hace dos meses" (but rather two months ago).
      esSinoWord:
        args: "tokens: SpanishTokens, i: number, at: SpanishAround"
        let:
          next: tokens[i + 1]
          verb: 'ES_CLITICS.has(next.lower) ? tokens[i + 2] : next'
        when:
          - next?.word && !next.broken && next.lower !== "que"
          - '!(ES_DETERMINER.has(at.prev()) || /^(?:hace|hacía|hay)$/u.test(next.lower))'
          - '!ES_PREPOSITIONS.has(next.lower)'
          - verb && esPorqueVerbAt(verb) && !esSubjunctiveLike(verb.lower)
        return: '({ end: i, fix: at.starts || !esNegatedBefore(tokens, i - 1, i - 12) ? ["si no"] : ["si no", "sino que"] })'
      # The words after "si no", from tokens[j] to tokens[end]: true when the clause ends before a
      # verb, false when a verb makes it a condition ("si no vendrá", "si no me pagas"). "si no para
      # de llover": "para" before "de" is the verb "parar".
      esSiNoScan:
        args: "tokens: SpanishTokens, j: number, end: number"
        type: boolean
        return: >-
          j >= tokens.length || j >= end
            ? false
            : tokens[j].broken || /^[.;:!?]$/u.test(tokens[j].text)
              ? true
              : tokens[j].text === "," || ES_CLITICS.has(tokens[j].lower)
                ? false
                : tokens[j].lower === "para" && tokens[j + 1]?.lower === "de"
                  ? false
                  : !tokens[j].word || ES_PREPOSITIONS.has(tokens[j].lower) || ES_PORQUE_CLOSED.has(tokens[j].lower)
                    ? esSiNoScan(tokens, j + 1, end)
                    : ES_FINITE_LOOK.test(tokens[j].lower) || (esFiniteVerb(tokens[j].lower) && !esReadNoun(tokens[j].lower))
                      ? false
                      : esSiNoScan(tokens, j + 1, end)
      # "si no": "Si no, mañana" (otherwise); "Si no puedes…" opens a condition.
      esSiNo:
        args: "tokens: SpanishTokens, i: number, at: SpanishAround"
        let:
          after: tokens[i + 2]
          before: tokens[i - 1]
        when:
          - tokens[i].lower === "si" && at.next() === "no" && !tokens[i + 1].broken
          - after?.word && !after.broken && before && !/^[.;:!?¿¡]$/u.test(before.text)
          - '!tokens[i].broken && esNegatedBefore(tokens, i - 1, i - 12)'
          - after.lower === "que" || esSiNoScan(tokens, i + 2, i + 10)
        return: '({ end: i + 1, fix: ["sino"] })'
      # sino (but rather) against si no (if not): "no lo hizo él si no su primo" contrasts a phrase
      # with no verb of its own after a negation; "sino vienes" and "¿qué hacer sino quería…?" put a
      # finite verb right after, which "sino" never takes without "que".
      esSino:
        args: "tokens: SpanishTokens, i: number"
        let:
          at: esAround(tokens, i)
        return: 'tokens[i].lower === "sino" ? esSinoWord(tokens, i, at) : esSiNo(tokens, i, at)'
    frames:
      # "porque", "porqué", "por que", "por qué", "sino" and "si no". The fixer reads the
      # clause around the token (review/spanish/porque.ts). After a finding, the scan goes
      # on after the phrase.
      - regex: "(?:sino|si|porqu[eé]s?|por){{WORD_TAIL}}"
        flags: giu
        scan: owned
        let:
          tokens: esTokens(ctx)
          i: esTokenAt(tokens, m.index)
          phrase: esSino(tokens, i) ?? esPorquePhrase(tokens, i)
        when:
          - i >= 0
          - tokens[i].word && tokens[i].start >= ctx.from && tokens[i].start < ctx.to
          - phrase
          # The next match starts after the phrase.
          - esResume(frame, tokens[phrase.end].end)
        return: >-
          esReplaceToken(ctx, esSpan(ctx, tokens[i], tokens[phrase.end]), phrase.fix, "spanishConfusions",
          "review_msg_spanish_confusion")
  - id: es.clauseConfusions
    checks: [spanishConfusions]
    group: spanishConfusions
    style: match
    message: review_msg_spanish_confusion
    frames:
      # Every word: the frames key on gerunds, infinitives and present forms, which are no
      # closed list. The fixer reads the clause around the token (review/spanish/clauses.ts).
      - regex: "{{TOKEN_WORD}}"
        flags: gu
        scan: owned
        fixer: clauseConfusions
  - id: es.frameConfusions
    checks: [spanishConfusions]
    group: spanishConfusions
    style: match
    message: review_msg_spanish_confusion
    frames:
      # "de el", "ala", "de más", "q", a clitic before an imperative and "les" before a
      # number. The fixer reads the words before and after the token
      # (review/spanish/frames.ts).
      - regex: "(?:de|a|alas?|q|me|te|se|les?|los?|las?|nos|os){{WORD_TAIL}}"
        flags: giu
        scan: owned
        fixer: frameConfusions
  - id: es.typography
    checks: [spanishTypography]
    group: spanishTypography
    style: match
    message: review_msg_spanish_conjunction
    frames:
      # Every word and number: the fixer checks the conjunctions, the years, the acronyms
      # and the names, and reads the words before and after the token
      # (review/spanish/typography.ts).
      - regex: "{{TOKEN_WORD}}|\\p{N}+(?:[.,:]\\p{N}+)*"
        flags: gu
        scan: owned
        fixer: typography
  - id: es.impossibleDates
    checks: [spanishTypography]
    group: spanishTypography
    style: match
    message: review_msg_spanish_date
    frames:
      # "31 de abril de 2020", "29 de febrero 2023", and a weekday before a full date
      # ("lunes, 7 de octubre de 2014").
      - regex: "(?<![\\p{L}\\p{N}.,/-])(?:(domingo|lunes|martes|miércoles|jueves|viernes|sábado)(,?[ \\t]+))?(\\d{1,2})(?:[ \\t]+de)?[ \\t]+({{MONTH_NAMES}})(?:[ \\t]+(?:de|del)?[ \\t]*([0-9]{4}))?(?![\\p{L}\\p{N}])"
        flags: giu
        scan: owned
        lookback: 16
        fixer: namedDate
      # "el 32 de enero", "el 0 de abril": a day no month has, after the article a date takes.
      - regex: "(?<=(?:^|[\\s(])(?:el|del|al|El|Del|Al)[ \\t]{1,8})(00?|3[2-9]|[4-9]\\d|\\d{3})(?:[ \\t]{1,8}de)?[ \\t]{1,8}(?:{{MONTH_NAMES}})(?![\\p{L}\\p{N}])"
        flags: gu
        scan: owned
        lookback: 16
        fixer: noSuchDay
      # "31/11/1988", "30-2-2001". Numeric dates need a four-digit year: "30/2" alone is a
      # ratio. A two-digit year ("31.11.89") or none ("el 31.04.") only where a date goes.
      - regex: "(?<![\\p{N}/.:-])(\\d{1,3})([/.-])(\\d{1,2}|{{MONTH_NAMES}}|{{MONTH_SHORT}})(?:\\2([0-9]{4}|\\d{2}(?![\\p{N}])))?(?![\\p{N}/:-]|\\.\\p{N}|,\\p{N})"
        flags: giu
        scan: owned
        lookback: 16
        fixer: numericDate
  - id: es.isoDates
    checks: [spanishTypography]
    group: spanishTypography
    style: match
    message: review_msg_spanish_date
    frames:
      # An ISO date that no calendar has ("2025-02-30", "2023-02-29"). The year first makes the
      # form clear in each language. A fourth numeric part before or after ("1-2025-02-30",
      # "2025-02-30-7", "2025-02-30.1") makes it an ID, not a date. Arabic-Indic digits count too
      # ("٢٠٢٥-٠٢-٣٠"). Markdown emphasis around the date is not a word ("_2025-02-30_"); an
      # underscore glued to a word is ("build_2025-02-30_x"). The match start owns the match.
      - regex: "{{ISO_DATE}}"
        flags: gdu
        owner: none
        fixer: common:invalidIsoDate
  - id: es.typographyMarks
    checks: [spanishTypography]
    group: spanishTypography
    style: match
    message: review_msg_spanish_abbreviation_period
    frames:
      # "etc..." and "etc…": the abbreviation ends in one point.
      - regex: "(?<!\\p{L})etc(?:\\.{2,}|…|\\.…)"
        flags: giu
        scan: owned
        fixer: etcDots
        message: review_msg_spanish_abbreviation
      # "uno, dos…etc.": the ellipsis and "etc." say the same; keep one of them.
      - regex: "(?:,[ \\t]*)?(?:\\.{3}|…)[ \\t]*etc(?!\\p{L})\\.?"
        flags: giu
        scan: owned
        fixer: etcEllipsis
        message: review_msg_spanish_abbreviation
      # "2do", "5ta.", "1er": ordinal abbreviations take a period and a raised letter: "2.º",
      # "1.er".
      - regex: "(?<![\\p{L}\\p{N}.,])(\\d{1,3})(do|da|ro|ra|to|ta|vo|va|no|na|mo|ma|ero|era|er|r)(\\.(?=[ \\t]{1,8}\\p{Ll}))?(?![\\p{L}\\p{N}])"
        flags: gu
        scan: owned
        lookback: 8
        fixer: ordinal
        message: review_msg_spanish_ordinal
      # "5 hrs", "48hrs", "15 h. será", "5grs": unit symbols take no plural and no period.
      - regex: "(?<![\\p{L}\\p{N}.,])(\\d+(?:[.,:]\\d+)?)([ \\t]?)(hrs|hr|hs|HRS|HS|grs|gr|GRS|h)(\\.(?=[ \\t]{1,8}\\p{Ll}))?(?![\\p{L}\\p{N}])"
        flags: gu
        scan: owned
        lookback: 8
        fixer: unit
        message: review_msg_spanish_unit
      # "la 2.º vez" -> "2.ª", "su 25ª aniversario" -> "25º": the raised letter takes the
      # gender of the noun after it.
      - regex: "(?<![\\p{L}\\p{N}.,])(\\d{1,3})(\\.?)([\\u00BA\\u00AA])(?=[ \\t]{1,8}(\\p{L}+)(?![\\p{L}\\p{N}]))"
        flags: gu
        scan: owned
        lookback: 8
        fixer: genderedOrdinal
        message: review_msg_spanish_ordinal
      # "25ºC", "1 ºC": a degree sign, not the ordinal o, and a space before it ("3º C" is a
      # floor and a door).
      - regex: "(?<![\\p{L}\\p{N}.,])(\\p{N}+(?:[.,]\\p{N}+)?)[ \\t]?\\u00BA([CF])(?![\\p{L}\\p{N}])"
        flags: gu
        scan: owned
        lookback: 8
        fixer: ordinalDegree
        message: review_msg_spanish_unit
      # "n° 18", "n°18": the number sign is "n.º", with the raised o, not a degree. A degree
      # sign right after a lowercase "n" only; "N° 54" heads forms and is left alone.
      - regex: "(?<![\\p{L}\\p{N}])(n)[ \\t]?\\u00B0[ \\t]?(?=\\p{N})"
        flags: gu
        scan: owned
        lookback: 8
        fixer: numberSign
        message: review_msg_spanish_ordinal
      # "el Sr García", "en el núm 25": an abbreviation before a name or a number takes its
      # period.
      - regex: "(?<![\\p{L}\\p{N}.])(?:(?:Sr|Sra|Srta|Dr|Dra|Avda|Av|Lic|Ing|Prof|Mr|Mrs)(?=[ \\t]\\p{Lu}\\p{Ll})|(?:n\\u00FAm|p\\u00E1g|p\\u00E1gs)(?=[ \\t]\\p{N}))(?![.\\p{L}])"
        flags: gu
        scan: owned
        lookback: 8
        fixer: bareAbbreviation
      # "2000euros", "5000habitantes": a number glued to the noun it counts.
      - regex: "(?<![\\p{L}\\p{N}.,])(\\p{N}+(?:[.,]\\p{N}{3})*)(\\p{Ll}{4,})(?![\\p{L}\\p{N}])"
        flags: gu
        scan: owned
        lookback: 8
        fixer: gluedCount
        message: review_msg_spanish_number_space
      # "LA semana pasada", "EL 2 de diciembre": an article in capitals opening a sentence of
      # lowercase words.
      - regex: "(?<=(?:^|[.!?\\u00A1\\u00BF][ \\t]{0,8}|\\n))(?:EL|LA|LOS|LAS|UN|UNA|UNOS|UNAS|NO|ES|SE|LO|YO|HAY|YA|MUY|ESTE|ESTA|ESTO|ESO)(?=[ \\t]{1,8}(?:\\p{N}+[ \\t]{1,8})?\\p{Ll}\\p{Ll})"
        flags: gu
        scan: owned
        lookback: 8
        fixer: shoutedArticle
        message: review_msg_spanish_capital_article
      # "rojo, azul, etc", "el s XVIII", "N.I.F", "J. K Rowling": the abbreviation's period.
      - regex: "(?<![\\p{L}\\p{N}.])etc(?![\\p{L}\\p{N}.\\u2026])"
        flags: giu
        scan: owned
        lookback: 8
        fixer: bareEtc
      - regex: "(?<=(?:^|[\\s(])(?:el|del|al|los|en|El|Del|Al|Los|En)[ \\t]{1,8}|^|[.!?][ \\t]{1,8})[sS](?=[ \\t]{1,8}{{ROMAN}}(?![\\p{L}\\p{N}]))"
        flags: gu
        scan: owned
        lookback: 8
        fixer: bareCentury
      # "N.I.F", "D.C", "S. A,": the last letter of dotted initials lost its period. A lone
      # "A", "E", "O", "U" or "Y" may be a word opening the next sentence.
      - regex: "(?<![\\p{L}\\p{N}.])(?:\\p{Lu}\\.){1,5}\\p{Lu}(?![\\p{L}\\p{N}.\\-/@_])|(?<=(?<![\\p{L}\\p{N}.])\\p{Lu}\\.[ \\t])(?:[B-DF-NP-TV-XZ](?=[ \\t]\\p{Lu}\\p{Ll})|\\p{Lu}(?=,))"
        flags: gu
        scan: owned
        lookback: 8
        fixer: openInitials
      # "p.ej.", "nº 18", "pag 4", "telf 666": the standard forms "p. ej.", "n.º", "pág.",
      # "tel.".
      - regex: "(?<![\\p{L}\\p{N}.])([pP])(?:[ \\t]?\\.[ \\t]?e(?:j[ \\t]?)?|[ \\t]ej[ \\t]?)\\.(?![\\p{L}\\p{N}])"
        flags: gu
        scan: owned
        lookback: 8
        fixer: forExample
        message: review_msg_spanish_abbreviation_form
      - regex: "(?<![\\p{L}\\p{N}.])(n\\u00BA|n\\.\\u00B0|num|pag|pags|telf|tlf|tlfn)\\.?:?[ \\t]?(?=\\p{N})"
        flags: giu
        scan: owned
        lookback: 8
        fixer: plainAbbreviation
        message: review_msg_spanish_abbreviation_form
      # "el 9° clasificado", "la 2° edición": a degree sign for the ordinal's raised letter.
      - regex: "(?<=(?:^|[\\s(])(el|la|del|al|El|La|Del|Al)[ \\t]{1,8})(\\d{1,3})[ \\t]?\\u00B0(?=[ \\t]{1,8}(\\p{Ll}+))"
        flags: gu
        scan: owned
        lookback: 8
        fixer: degreeOrdinal
        message: review_msg_spanish_ordinal
      # "del '90", "los años '71": a shortened year takes no apostrophe.
      - regex: "(?:(?<=(?:^|[\\s(])(?:del|el|los|a\\u00F1os|d\\u00E9cada|en)[ \\t]{1,8})|(?<=['\\u2019\\u2018]\\d\\d[\\u2014\\u2013-]))['\\u2019\\u2018](\\d\\d)(?![\\p{L}\\p{N}'\\u2019])"
        flags: giu
        scan: owned
        lookback: 8
        fixer: yearApostrophe
        message: review_msg_spanish_year_apostrophe
      # "la sra. García": abbreviations of address take a capital.
      - regex: "(?<![\\p{L}\\p{N}.])(?:sr|sra|srta|sres|sras|dr|dra)\\.(?=[ \\t]\\p{Lu}\\p{Ll})"
        flags: gu
        scan: owned
        lookback: 8
        fixer: lowerTreatment
        message: review_msg_spanish_treatment_capital
      # "Sí sí, ven": a repeated "sí" or "no" takes a comma between.
      - regex: "(?<=(?:^|[.!?\\u00A1\\u00BF\\n])[ \\t]{0,8})(?:(S\\u00ED|s\\u00ED|S\\u00CD)[ \\t]+(s\\u00ED|S\\u00CD)|(No|no|NO)[ \\t]+(no|NO))(?=[ \\t]*[,.!?])"
        flags: gu
        scan: owned
        lookback: 8
        fixer: repeatedAnswer
        message: review_msg_spanish_repeated_answer
      # "Es él ─dijo": a box-drawing or Hangul stroke typed for the long dash.
      - regex: "(?<=[\\p{Script=Latin}.,!?][ \\t]?)[\\u2500\\u2501\\u3161](?=\\p{Script=Latin})"
        flags: gu
        scan: owned
        lookback: 8
        fixer: strokeDash
        message: review_msg_spanish_dialogue_dash
      # "Adiós,. le dije": a comma and a period together; either one may be meant.
      - regex: "(?<=\\p{L}),\\.(?!\\.)"
        flags: gu
        scan: owned
        fixer: commaPeriod
        message: review_msg_duplicate_punctuation
      # "¿Qué es lo que pasa aquí." -> "aquí?", "¡Qué bonito" -> "bonito!": an opening mark
      # whose sentence ends without a closing one.
      - regex: "[¿¡]"
        flags: gu
        scan: text
        fixer: closingMark
        message: review_msg_spanish_closing_mark
      # "los años 1930s", "los 80's": a decade takes no plural ending in Spanish.
      - regex: "(?<=(?<![\\p{L}])(?:a\\u00F1os|los)[ \\t]{1,4})((?:1[0-9]|20)?[0-9]0)(?:['\\u2019]s|s)(?:[ \\t]+y[ \\t]+((?:1[0-9]|20)?[0-9]0)(?:['\\u2019]s|s))?(?![\\p{L}\\p{N}])"
        flags: giu
        scan: owned
        lookback: 8
        fixer: decade
        message: review_msg_spanish_decade
  - id: es.commas
    checks: [spanishTypography]
    group: spanishTypography
    style: match
    message: review_msg_spanish_comma
    # The comma after a sentence connector that opens its clause ("Sin embargo, no ganó") and
    # between a greeting and the person greeted ("Hola, Marta").
    sets:
      # What may follow a connector's words in another reading: "además de", "al contrario que",
      # "o sea que", "por otro lado del río", "de hecho y de derecho".
      ES_NOT_CONNECTOR_AFTER: [de, del, que, a, al, "y", e, o, u, como]
      # Greetings that may close a sentence: "Os deseo buenos días, amigos".
      ES_CLOSING_GREETINGS: [días, día, tardes, noches]
      # Words that open the clause after the person addressed: "Hola amigo, cómo estás".
      ES_CLAUSE_OPENERS: [cómo, como, qué, que, dónde, donde, cuándo, cuando, quién, quien, cuál, te, me, os, nos, le, les, ya, hoy]
      ES_ADDRESSED:
        [
          amigo, amiga, amigos, amigas, chico, chica, chicos, chicas, guapo, guapa, guapos, guapas, cariño,
          querido, querida, queridos, queridas, señor, señora, señores, señoras, señorita, jefe, jefa,
          compañero, compañera, compañeros, compañeras, hermano, hermana, tío, tía, mamá, papá, abuelo,
          abuela, hijo, hija, niños, niñas, estimado, estimada, estimados, estimadas, colega, colegas,
          preciosa, precioso, amor, cielo, vecino, vecina, vecinos, chaval, chavales, muchachos,
          muchachas, gente, familia, equipo,
        ]
      ES_NEGATIONS: ["no", nunca, jamás, tampoco, ni]
      # "No hace sino llorar", "nadie sino él", "no tiene otra salida sino esperar": "sino" means
      # "except" here and takes no comma.
      ES_EXCEPTIVE: [nadie, nada, ningún, ninguna, ninguno, otro, otra, otros, otras, más, menos, cosa]
      # Finite verbs the dictionary also lists as nouns.
      ES_COMMON_FINITE: [es, son, era, eran, fue, fueron, ha, han, va, van, da, dan, ve, ven, hay]
      # Determiners of a subject a comma may not cut from its verb; "mi"/"tu" open vocatives ("Mi
      # amor, está lista la cena"). The es.commas frame lists these words.
      ES_SUBJECT_DETERMINERS:
        [
          el, la, los, las, este, esta, estos, estas, ese, esa, esos, esas, aquel, aquella, aquellos, aquellas,
          nuestro, nuestra, nuestros, nuestras, su, sus,
        ]
      # Nouns that open a sentence as an adverbial or a remark, comma and all: "La verdad, no lo sé",
      # "El lunes, llegaron todos", "La mayoría, se fue".
      ES_NOT_SUBJECT_NOUNS:
        [
          verdad, semana, semanas, año, años, mes, meses, día, días, tarde, tardes, noche, noches, mañana,
          mañanas, vez, veces, momento, rato, verano, invierno, otoño, primavera, lunes, martes, miércoles,
          jueves, viernes, sábado, sábados, domingo, domingos, fin, principio, final, mayoría, mitad, resto,
        ]
      ES_SINGULAR_COPULA: [es, está, era, estaba, fue, será, ha, va, tiene]
      ES_PLURAL_COPULA: [son, están, eran, estaban, fueron, serán, han, van, tienen]
    defs:
      # The connectors; the es.commas frame lists their first words.
      ES_CONNECTORS: >-
        [
          "sin embargo", "por lo tanto", "por tanto", "por consiguiente", "por ende", "en consecuencia",
          "en cambio", "por el contrario", "al contrario", "por otro lado", "por otra parte", "por un lado",
          "por una parte", "además", "asimismo", "así pues", "en primer lugar", "en segundo lugar",
          "en tercer lugar", "por último", "en conclusión", "en resumen", "en definitiva", "en efecto",
          "es decir", "o sea", "de hecho", "por cierto", "en fin", "aun así", "de todos modos",
          "de todas formas",
          "afortunadamente", "desafortunadamente", "desgraciadamente", "lamentablemente", "evidentemente",
          "obviamente", "efectivamente", "sinceramente", "francamente", "honestamente", "curiosamente",
          "sorprendentemente", "indudablemente",
        ].map((phrase) => phrase.split(" "))
      # The greetings; the es.commas frame lists their first words. "cómo estás": a question to the
      # person addressed ("¿Cómo estás, Jorge?").
      ES_GREETINGS: >-
        [
          "hola", "adiós", "buenos días", "buenas tardes", "buenas noches", "felicidades", "enhorabuena",
          "hasta luego", "hasta pronto", "felices fiestas", "muchos besos", "muy buen día", "buen día",
          "buenas", "un beso", "un abrazo", "besos", "abrazos", "muchas gracias", "gracias", "saludos",
          "bienvenido", "bienvenida", "bienvenidos", "bienvenidas", "a sus órdenes", "feliz cumpleaños",
          "feliz navidad", "cómo estás", "cómo estáis",
        ].map((phrase) => phrase.split(" "))
      # A negation within 12 words before "sino", with two words (clitics aside) between.
      esSinoNegated:
        args: "at: SpanishAround, k: number, between: number"
        type: boolean
        let:
          word: at.prev(k)
        when:
          - k <= 12
          - word && !ES_EXCEPTIVE.has(word)
        return: 'ES_NEGATIONS.has(word) ? between >= 2 : esSinoNegated(at, k + 1, between + (ES_CLITICS.has(word) ? 0 : 1))'
        else: "false"
      # "No lo hizo él sino que lo hice yo" -> "él, sino que": "sino que" opening the clause that
      # replaces a negated one. Without "que" the comma may go ("no es azul sino verde"), and right
      # after the verb "sino" means "only" ("No te pido sino que te vayas").
      esCommaBeforeSino:
        args: "tokens: SpanishTokens, i: number"
        when:
          - tokens[i].lower === "sino" && !!tokens[i - 1]?.word && !tokens[i].broken
          - esAround(tokens, i).next() === "que"
        return: esSinoNegated(esAround(tokens, i), 1, 0)
        else: "false"
      esClauseVerb:
        args: "word: string"
        return: >-
          ES_COMMON_FINITE.has(word) ||
          (!!word && esFiniteVerb(word) && !esIsNoun(word) && !esGenderedForm(word) && !esParticiple(word))
      # A verb of its own in the words before tokens[i], from `back` to `last` words back.
      esClauseVerbBefore:
        args: "at: SpanishAround, back: number, last: number"
        type: boolean
        return: >-
          back > last || !at.prev(back) ? false : esClauseVerb(at.prev(back)) ? true : esClauseVerbBefore(at, back + 1, last)
      # The k-th word after tokens[i] past the clitics (to the fifth).
      esPastClitics:
        args: "at: SpanishAround, k: number"
        type: number
        return: "k < 5 && ES_CLITICS.has(at.next(k)) ? esPastClitics(at, k + 1) : k"
      # "Son muchos pero no bastan" -> "muchos, pero": "pero" joining two clauses. Only a negated
      # clause is surely one: "pero no bastan", "pero ya no lo tengo". The clause before it has a
      # verb of its own.
      esCommaBeforePero:
        args: "tokens: SpanishTokens, i: number"
        let:
          at: esAround(tokens, i)
          k: 'at.next(1) === "ya" ? 2 : 1'
        when:
          - tokens[i].lower === "pero" && !!tokens[i - 1]?.word && !tokens[i].broken
          - ES_NEGATIONS.has(at.next(k))
          - esClauseVerb(at.next(esPastClitics(at, k + 1)))
        return: esClauseVerbBefore(at, 1, 10)
        else: "false"
      # "Abrimos las ventanas ya que hacía calor" -> "ventanas, ya que": a causal "ya que" or "puesto
      # que" after a clause. Not right after a verb ("Te he dicho ya que no": "ya" is "already"; "Lo
      # ha puesto que…"), a determiner ("el puesto que ocupa") or a conjunction. "un buen puesto que",
      # "al cuarto puesto que": the noun "puesto" with its determiner.
      esCommaBeforeCausal:
        args: "tokens: SpanishTokens, i: number"
        let:
          at: esAround(tokens, i)
          before: at.prev()
        when:
          - /^(?:ya|puesto)$/u.test(tokens[i].lower) && !tokens[i].broken
          - at.next() === "que" && !!at.next(2)
          - before && !ES_CLITICS.has(before) && !ES_NEGATIONS.has(before) && !ES_CONJUNCTIONS.has(before)
          - '!(ES_DETERMINERS.has(before) || esClauseVerb(before) || esParticiple(before) || esIsInfinitive(before))'
          - '!(tokens[i].lower === "puesto" && (ES_DETERMINERS.has(at.prev(2)) || /^(?:al|del)$/u.test(at.prev(2))))'
        return: esClauseVerbBefore(at, 2, 10)
        else: "false"
      # A comma, a colon, a dash or a bracket from tokens[k] to tokens[end], on one line.
      esMarkSoon:
        args: "tokens: SpanishTokens, k: number, end: number"
        type: boolean
        return: >-
          k < end && tokens[k] && !tokens[k].broken
            ? /^[,;:—–()]$/u.test(tokens[k].text) || esMarkSoon(tokens, k + 1, end)
            : false
      # "El problema, es que…" -> "El problema es": a comma between a subject opening the sentence
      # and its verb: the index of the comma, or -1. Only common verbs that agree with it are read,
      # and a second comma soon after ("El problema, dice Juan, es…") marks an inserted remark.
      esSubjectComma:
        args: "tokens: SpanishTokens, i: number"
        let:
          nounToken: tokens[i + 1]
          # "Esas, se dividen en tres": a plural demonstrative standing for its noun ("Este, …" may
          # be a filler).
          pronoun: /^(?:estos|estas|esos|esas|aquellos|aquellas)$/u.test(tokens[i].lower)
          noun: >-
            pronoun && nounToken?.text === ","
              ? { plural: true }
              : nounToken?.word && !nounToken.broken
                ? esReadNoun(nounToken.lower)
                : null
          # One adjective after the noun: "Nuestro objetivo principal, es…".
          after: 'nounToken.text === "," ? i + 1 : i + 2'
          adjective: tokens[after]
          comma: 'after === i + 2 && adjective?.word && !adjective.broken && !esFiniteVerb(adjective.lower) ? after + 1 : after'
          # "El gobierno, no anunció nada", "La empresa, se fundó en 1990": "no" or "se" first.
          lead: '/^(?:no|se)$/u.test(tokens[comma + 1]?.lower ?? "") ? 1 : 0'
          verb: tokens[comma + 1 + lead]
          word: verb.lower
          # Any other verb whose third person ending agrees: "trabaja", "anunció", "llegaron".
          plural: >-
            ES_PLURAL_COPULA.has(word)
              ? true
              : ES_SINGULAR_COPULA.has(word)
                ? false
                : !/(?:n|[aeó])$/u.test(word) || !esFiniteVerb(word) || esIsNoun(word) ||
                    esAttributeOf(word) || esSubjunctiveLike(word) || ES_CLITICS.has(word)
                  ? null
                  : word.endsWith("n")
        when:
          - ES_SUBJECT_DETERMINERS.has(tokens[i].lower) && esAround(tokens, i).starts
          # "¿Este método, es seguro?": a question may set its topic apart.
          - '!/^[¿¡]$/u.test(tokens[i - 1]?.text ?? "")'
          - noun && !ES_NOT_SUBJECT_NOUNS.has(nounToken.lower)
          - tokens[comma]?.text === "," && !tokens[comma].broken
          - verb?.word && !verb.broken && !/^\p{Lu}/u.test(tokens[comma + 1].text)
          - plural === noun.plural
          - '!esMarkSoon(tokens, comma + 2, comma + 7)'
        return: comma
        else: "-1"
      # tokens[i..] spell `phrase` on one line: the index of its last token, or -1.
      esPhraseAt:
        args: "tokens: SpanishTokens, i: number, phrase: readonly string[]"
        return: >-
          phrase.every((word, k) => !!tokens[i + k]?.word && tokens[i + k].lower === word && !(k > 0 && tokens[i + k].broken))
            ? i + phrase.length - 1
            : -1
      # The end of the connector `phrase` at tokens[i], or -1. Only before a word of the clause it
      # opens; "Por tanto esfuerzo" is "for so much". "Francamente bueno", "Sinceramente tuyo": an
      # adverb of the word after it.
      esConnectorEnd:
        args: "tokens: SpanishTokens, i: number, phrase: readonly string[]"
        let:
          last: esPhraseAt(tokens, i, phrase)
          after: tokens[last + 1]
          next: after?.lower ?? ""
        return: >-
          !after?.word || after.broken || ES_NOT_CONNECTOR_AFTER.has(next)
            ? -1
            : phrase.join(" ") === "por tanto" && esIsNoun(next)
              ? -1
              : /mente$/u.test(phrase[0]) && (esAttributeOf(next) || /^(?:tuy|suy|vuestr)/u.test(next))
                ? -1
                : last
      # The person addressed after a greeting at tokens[at]: the index of its last word, or -1.
      # "Felicidades, mi querido amigo".
      esAddressee:
        args: "tokens: SpanishTokens, at: number"
        let:
          mine: 'tokens[at]?.lower === "mi" && !tokens[at].broken ? at + 1 : at'
          k: '/^querid[oa]s?$/u.test(tokens[mine]?.lower ?? "") && ES_ADDRESSED.has(tokens[mine + 1]?.lower ?? "") ? mine + 1 : mine'
          token: tokens[k]
        when: token?.word && !token.broken
        return: 'ES_ADDRESSED.has(token.lower) ? k : k === at && /^\p{Lu}\p{Ll}/u.test(token.text) ? k : -1'
        else: "-1"
      # A comma after tokens[i], unless the writer's word or casing says otherwise.
      esCommaAfter:
        args: "ctx: DetectContext, tokens: SpanishTokens, i: number"
        return: 'esReplaceToken(ctx, tokens[i], [`${tokens[i].lower},`], "spanishTypography", "review_msg_spanish_comma", tokens[i + 1])'
    frames:
      # "sino", "pero", "ya que", "puesto que", the determiner of a subject, and the first
      # words of the connectors and greetings of review/spanish/commas.ts. Every token of
      # the read window counts: the comma may go before the chunk. The fixer reads the
      # clause structure around the token. After a connector or a greeting, the scan goes
      # on after the phrase and the person addressed.
      - regex: "(?:sino|pero|ya|puesto|el|las?|los|es(?:t(?:e|a|os|as)|e|a|os|as)?|aquel(?:las?|los)?|nuestr[oa]s?|sus?|sin|por|en|al|adem[aá]s|asimismo|as[ií]|o|de|aun|a|un|(?:afortunada|desafortunada|desgraciada|lamentable|evidente|obvia|efectiva|sincera|franca|honesta|curiosa|sorprendente|indudable)mente|hola|adi[oó]s|buen(?:[oa]s)?|felicidades|enhorabuena|hasta|felices|much[oa]s|muy|besos|abrazos|gracias|saludos|bienvenid[oa]s?|feliz|c[oó]mo){{WORD_TAIL}}"
        flags: giu
        scan: owned
        lookback: 160
        lookahead: 160
        # The commas of the clause at the token: connectors, greetings, "sino", "pero", subjects.
        let:
          tokens: esTokens(ctx)
          i: esTokenAt(tokens, m.index)
          before: >-
            esCommaBeforeSino(tokens, i) || esCommaBeforePero(tokens, i) || esCommaBeforeCausal(tokens, i)
              ? esCommaAfter(ctx, tokens, i - 1)
              : null
          comma: esSubjectComma(tokens, i)
          subject: >-
            comma >= 0
              ? esReplaceToken(ctx, tokens[comma], [""], "spanishTypography", "review_msg_spanish_comma", tokens[comma + 1], true)
              : null
          starts: esAround(tokens, i).starts
          connector: 'starts ? ES_CONNECTORS.find((phrase) => esPhraseAt(tokens, i, phrase) >= 0) : undefined'
          connectorEnd: 'connector ? esConnectorEnd(tokens, i, connector) : -1'
          # "Hola Marta", "Adiós amigos"; "¡Hola a todos!" greets no one by name. Inside a sentence
          # only a closing greeting before the end: "Te deseo buenos días amigo."
          greeting: 'connectorEnd < 0 ? ES_GREETINGS.find((phrase) => esPhraseAt(tokens, i, phrase) >= 0) : undefined'
          greetingEnd: 'greeting ? esPhraseAt(tokens, i, greeting) : -1'
          greeted: 'greetingEnd >= 0 ? esAddressee(tokens, greetingEnd + 1) : -1'
          greets: >-
            greetingEnd >= 0 && greeted >= 0 &&
            (starts || (ES_CLOSING_GREETINGS.has(tokens[greetingEnd].lower) && esAround(tokens, greeted).endsAfter()))
          last: 'connectorEnd >= 0 ? connectorEnd : greets ? greetingEnd : -1'
          addressed: 'connectorEnd < 0 && greets ? greeted : -1'
          # "Hola amigo, cómo estás": the clause after the person addressed opens with a comma too.
          next: tokens[addressed + 1]
        when:
          - i >= 0
          - tokens[i].word
          # The next match starts after the phrase and the person addressed.
          - last < 0 || esResume(frame, tokens[Math.max(last, addressed)].end)
        return: >-
          [
            before,
            subject,
            ...(last < 0
              ? []
              : [
                  esCommaAfter(ctx, tokens, last),
                  addressed >= 0 && next?.word && !next.broken && ES_CLAUSE_OPENERS.has(next.lower)
                    ? esCommaAfter(ctx, tokens, addressed)
                    : null,
                ]),
          ].filter((finding) => finding !== null)
  - id: es.missingSpace
    checks: [commaPeriodSpacing]
    group: commaPeriodSpacing
    style: match
    message: review_msg_space_after_mark
    frames:
      # "frase.Y otra", "así?Siempre", "Ven.¿Como…?", "así…siempre", and "así .Siempre" with
      # the space on the wrong side. Lowercase only after "…": "archivo .txt" and "web?id" are
      # not prose.
      - regex: "(?<=\\p{L}\\p{Ll})(?:\\.(?=(?:{{STARTERS}})(?![\\p{L}\\p{N}])|[¿¡])|[?!](?=[¿¡]|\\p{Lu}\\p{Ll})|…(?=[¿¡]|\\p{L}))|(?<=\\p{L})[ \\t]+(?:[.?!]|…)(?=[¿¡]|\\p{Lu}\\p{Ll})"
        flags: gu
        scan: owned
        fixer: missingSpace
      # "dijo : ven" -> "dijo: ven", "vino;pero" -> "vino; pero": Spanish sets no space before
      # a colon or a semicolon, and one after a semicolon between words.
      - regex: "(?<=\\p{L})[ \\t]+[:;](?=[ \\t]|$)|(?<=\\p{L}\\p{Ll});(?=\\p{Ll}{2})"
        flags: gmu
        scan: owned
        fixer: colonSpacing
  - id: es.quoteSpaces
    checks: [commaPeriodSpacing]
    group: commaPeriodSpacing
    style: match
    message: review_msg_space_after_opening_mark
    frames:
      # Each line that touches the chunk, from the chunk start (a regex cannot start before
      # it): the fixer pairs the straight quotes of the whole line by position.
      - regex: "[^\\n]+\\n?|\\n"
        flags: g
        scan: text
        fixer: quoteSpaces
  - id: es.dashes
    checks: [emdashShortcut]
    group: emdashShortcut
    style: match
    message: review_msg_spanish_dialogue_dash
    filter: firstAtStart
    frames:
      # "Ven -dijo.", "-¿Perdón?": the dialogue dash, an optional typography check like the
      # dash. Verbs of saying after a dialogue line use the long dash.
      - regex: "(?<=[\\p{L}.,!?…][ \\t]?)[-–‒](?=(?:{{SAYING}})(?![\\p{L}]))|(?<=^|\\n)[-–‒](?=[¿¡]|\\p{Lu}\\p{Ll})|(?<=[ \\t]|^)--(?=[ \\t]|$)"
        flags: gu
        scan: owned
        lookback: 8
        fixer: dialogueDash
      # "Se fue -¿no?-, y volvió", "Finol –medalla de bronce– ganó": a remark set off by a pair
      # of hyphens or en dashes, open after a space and closed before a space or a mark.
      - regex: "(?<=[ \\t])[-\\u2013](?=[\\p{L}\\u00BF\\u00A1])[^-\\u2013\\n]{0,150}?[\\p{L}\\p{N}?!.\\u2026][-\\u2013](?=[ \\t,.;:)]|$)"
        flags: gu
        scan: owned
        lookback: 160
        fixer: remarkDashes
  - id: es.rangeDash
    checks: [emdashShortcut]
    group: emdashShortcut
    style: match
    message: review_msg_range_dash
    frames:
      # "pages 10-15", "1990-1995": two numbers of up to four digits joined by a hyphen. A dash,
      # a colon, a slash or a digit group after the second number makes a date, a phone number
      # or a code ("12-05-2020", "2024-05-01"); a decimal or a time ("8.00-9.00") stays.
      - regex: "{{RANGE_DASH}}"
        scan: owned
        lookback: 8
        flags: gu
        fixer: rangeDash
  - id: es.decimalComma
    checks: [spanishTypographyStyle]
    style: match
    message: review_msg_spanish_decimal
    frames:
      # "9,349.5", "21,999,349": English digit groups, with a decimal point or with two commas.
      - regex: "(?<![\\p{N}.,])\\d{1,3}(?:(?:,\\d{3})+\\.\\d{1,3}|(?:,\\d{3}){2,})(?![\\p{N}]|[.,]\\p{N})"
        flags: gu
        scan: owned
        lookback: 32
        fixer: decimalPoint
      # "1.4 kg", "9349.5", "1 999 349.56": a decimal point before a unit, after four digits or
      # closing a group spaced by thousands. "a las 9.30", "versión 2.5" and "3.2.1" stay.
      - regex: "(?<![\\p{N}.,])(?:\\d{1,3}(?: \\d{3})+|\\d{4,}|\\d{1,3}(?=\\.\\d{1,2}{{UNIT_AFTER}}))\\.\\d{1,2}(?![\\p{N}]|[.,]\\p{N})"
        flags: gu
        scan: owned
        lookback: 32
        fixer: decimalPoint
      # "30 km2", "por m3": a unit's exponent is a superscript.
      - regex: "(?<=(?:\\d[ \\t\\u00a0]?|\\bpor[ \\t]|\\/))(?:km|cm|mm|dm|m)[23](?![\\p{L}\\p{N}])"
        flags: gu
        scan: owned
        lookback: 8
        fixer: exponent
        message: review_msg_typographic_symbol
  - id: es.agreement
    checks: [spanishAgreement]
    group: spanishAgreement
    style: match
    message: review_msg_spanish_agreement
    frames:
      # Every word: the checks key on nouns, adjectives and determiners. The fixer reads the
      # gender and number of the noun phrase at the token (review/spanish/agreement.ts).
      - regex: "{{TOKEN_WORD}}"
        flags: gu
        scan: owned
        fixer: agreement
  - id: es.verbAgreement
    checks: [spanishAgreement]
    group: spanishAgreement
    style: match
    message: review_msg_spanish_verb_agreement
    # The subject's gender beats the copula's number alone: an attribute finding drops the
    # finding of the first frame at the same start.
    filter: attributeFirst
    frames:
      # Every word from 64 characters before the chunk: the checks key on verbs and subjects,
      # which are no closed list. The fixer reads the subject and the number of the verb
      # (review/spanish/verbAgreement.ts).
      - regex: "{{TOKEN_WORD}}"
        flags: gu
        scan: owned
        lookback: 64
        fixer: verbAgreement
      # The attribute after a copula: "Ellas están cansado" -> "cansadas".
      - regex: "{{TOKEN_WORD}}"
        flags: gu
        scan: owned
        lookback: 64
        fixer: verbAttribute
  - id: es.clauseAgreement
    checks: [spanishAgreement]
    group: spanishAgreement
    style: match
    message: review_msg_spanish_impersonal_haber
    frames:
      # A plural modal before the impersonal "haber", and "a" before a doubled pronoun. The
      # fixer reads the clause around the token (review/spanish/clauses.ts).
      - regex: "(?:a|pueden|pod[ií]an|podr[ií]an|pudieron|deben|deb[ií]an|deber[ií]an|suelen|sol[ií]an|van|iban|tienen|ten[ií]an|tendr[aá]n|tendr[ií]an){{WORD_TAIL}}"
        flags: giu
        scan: owned
        fixer: clauseAgreement
  - id: es.frameAgreement
    checks: [spanishAgreement]
    group: spanishAgreement
    style: match
    message: review_msg_spanish_agreement
    frames:
      # Every word: one frame keys on any noun before two joined adjectives. The fixer reads
      # the gender and number of the words around the token (review/spanish/frames.ts).
      - regex: "{{TOKEN_WORD}}"
        flags: gu
        scan: owned
        fixer: frameAgreement
  - id: es.clauseStyle
    checks: [stylePhrasing]
    style: match
    message: review_msg_style_phrasing
    frames:
      # "hace ... atrás", and an adverb that the clause repeats. The fixer reads the clause
      # around the token (review/spanish/clauses.ts).
      - regex: "(?:hace|tambi[eé]n|tampoco|ya|s[oó]lo|a[uú]n|todav[ií]a|siempre|nunca){{WORD_TAIL}}"
        flags: giu
        scan: owned
        fixer: clauseStyle
  - id: es.quotes
    checks: [spanishQuotes]
    style: match
    message: review_msg_spanish_quotes
    # Spanish typography quotes with angle marks first («así»), and with curly single marks inside
    # them (‘así’). Typewriter pairs typed on one line get the typographic ones. Opt-in: straight
    # quotes are common and accepted in informal text.
    defs:
      # The finding that replaces one straight mark of a pair.
      esQuoteMark:
        args: "start: number, replacement: string, pairEnd: number"
        return: >-
          ({
            ruleId: "spanishQuotes" as const,
            messageKey: "review_msg_spanish_quotes" as const,
            range: { start, end: start + 1 },
            alternatives: [replacement],
            context: { start: Math.max(0, start - 1), end: pairEnd },
          })
      # The straight pair of match `m` gets the marks `open` and `close`.
      esQuotePair:
        args: "m: RegExpExecArray, ctx: DetectContext, open: string, close: string"
        let:
          end: m.index + m[0].length
        when:
          - m.index >= ctx.from
          # Protected text, code and quoted examples keep their marks.
          - '!(ctx.text.slice(m.index, end).includes("￼") || namedExampleBefore(ctx.text, m.index))'
        return: "[esQuoteMark(m.index, open, end), esQuoteMark(end - 1, close, end)]"
    frames:
      # A straight pair around a phrase on one line: opening after a space, a bracket or a dash
      # and before a letter, closing after a letter, digit or sentence mark.
      - regex: "(?<=^|[\\s([{\\u00BF\\u00A1\\u2014\\u2013-])\"(?=[\\p{L}\\p{N}\\u00BF\\u00A1])([^\"\\n]{1,200}?)(?<=[\\p{L}\\p{N}.!?\\u2026])\"(?![\\p{L}\\p{N}])"
        flags: gu
        scan: owned
        lookback: 256
        return: esQuotePair(m, ctx, "«", "»")
      - regex: "(?<=^|[\\s([{\\u00BF\\u00A1\\u2014\\u2013-])'(?=[\\p{L}\\p{N}\\u00BF\\u00A1])([^'\\n]{1,200}?)(?<=[\\p{L}\\p{N}.!?\\u2026])'(?![\\p{L}\\p{N}])"
        flags: gu
        scan: owned
        lookback: 256
        return: esQuotePair(m, ctx, "‘", "’")
  - id: es.repeatedPair
    checks: [englishRepeatedWords]
    style: match
    message: review_msg_repeated_words
    frames:
      # Every word: the fixer compares the word pair at the token with the pair after it
      # (review/spanish/frames.ts).
      - regex: "{{TOKEN_WORD}}"
        flags: gu
        scan: owned
        fixer: repeatedPair

