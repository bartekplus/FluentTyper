      # "Nos lo confeso", "Me lo recordo": a stem-changing -ar verb has no present on its plain stem
      # ("confieso"), so after a clitic the -o form is the preterite missing its accent. "lo" alone
      # may be the neuter article before an adjective.
      esVaCliticPreterite:
        args: "at: SpanishAround, word: string, prev: string"
        let:
          plainStem: /^(\p{L}{3,})o$/u.exec(word)
        when: >-
          plainStem && ES_CLITICS.has(prev) && esIsVerb(`${plainStem[1]}ar`) && !esFiniteVerb(word) && !esNounForm(word) &&
          !esIsNoun(word) && (!esAttribute(word) || !/^(?:lo|la|los|las)$/u.test(prev) || ES_CLITICS.has(at.prev(2)))
        return: "`${plainStem[1]}ó`"
      # "lo hacia abajo": the preposition "hacia".
      esVaImperfect:
        args: "at: SpanishAround, word: string, prev: string"
        let:
          m: /^(\p{L}+)ia(s|n|mos)?$/u.exec(word)
          direction: >-
            word === "hacia" &&
            /^(?:abajo|arriba|adelante|atrás|afuera|adentro|allá|acá|aquí|allí|delante|el|la|los|las)$/u.test(at.next())
        when:
          - ES_VA_BEFORE_VERB.has(prev)
          - '!direction && m && (esIsVerb(`${m[1]}er`) || esIsVerb(`${m[1]}ir`) || esIsInfinitive(m[1]))'
        return: '`${m[1]}ía${m[2] ?? ""}`'
      # "con él varias cosas": a pronoun after a preposition is no subject. "se continua" ->
      # "continúa", "lo amplias" -> "amplías": -uar/-iar verbs stress the vowel. Every -uar verb but
      # -guar/-cuar ("averigua"); only the listed -iar verbs ("cambia" is not). "ya veras" ->
      # "verás", "se ira" -> "irá": a future without its accent.
      esVaStressed:
        args: "at: SpanishAround, word: string, prev: string"
        let:
          governed: ES_VA_SUBJECTS.has(prev) && ES_PREPOSITIONS.has(at.prev(2))
          stressed: /^(\p{L}+)([ui])(a|as|an|e|es|en)$/u.exec(word)
          iar: >-
            stressed?.[2] === "i" &&
            /^(?:ampl|env|conf|f|var|cr|gu|enfr|desv|vac|esp|desaf|exp|resfr|hast|roc)$/u.test(stressed[1])
          uar: stressed?.[2] === "u" && !/[gc]$/u.test(stressed[1])
          future: /^(\p{L}*?[eií]r)(a|as|an|e)$/u.exec(word)
        when: '!governed && (ES_VA_BEFORE_VERB.has(prev) || /^(?:ya|tú|que|si|quién)$/u.test(prev))'
        return: >-
          stressed && (iar || uar) && esIsVerb(`${stressed[1]}${stressed[2]}ar`) && !esIsNoun(word)
            ? `${stressed[1]}${stressed[2] === "u" ? "ú" : "í"}${stressed[3]}`
            : future && (esIsInfinitive(future[1]) || future[1] === "ir") &&
                (!esIsNoun(word) || /^(?:ya|tú|se|me|te|le|lo|no)$/u.test(prev)) && word !== "para"
              ? `${future[1]}${ES_FUTURE_ACCENTS[future[2]]}`
              : null
      esVaCliticsBack:
        args: "at: SpanishAround, k: number"
        type: number
        return: "k < 3 && /^(?:me|te|lo|la|los|las|le|les|nos|os)$/u.test(at.prev(k)) ? esVaCliticsBack(at, k + 1) : k"
      # "Yo lo analice ayer", "Me enfade.", "Ayer tome el día libre" -> "analicé", "enfadé", "tomé":
      # an -ar subjunctive needs a trigger before it ("que yo cante"), so at a sentence start after
      # "yo", "me" or "ayer" it is the first person preterite without its accent. "cuando ayer lo
      # analice", "cuando lo analice la semana pasada": a past time in the clause rules out the
      # subjunctive's future. A clitic before the verb and no "que" trigger before it ("el ayer
      # ocupe" is a noun). "Me envíe la factura" may be a request: only before the clause end or a
      # preposition.
      esVaFirstPreterite:
        args: "at: SpanishAround, word: string"
        let:
          k: esVaCliticsBack(at, 1)
          lead: at.prev(k)
          leadStarts: esAround(at.tokens, at.i - k).starts
          clitics: k > 1 && esAround(at.tokens, at.i - k + 1).starts
          pastAfter: >-
            [1, 2, 3].some((n) => /^(?:ayer|anoche|anteayer)$/u.test(at.next(n)) ||
              (/^(?:pasado|pasada)$/u.test(at.next(n)) &&
                /^(?:semana|año|mes|lunes|martes|miércoles|jueves|viernes|sábado|domingo|verano|invierno)$/u.test(at.next(n - 1))))
        when:
          - /^\p{L}{3,}e$/u.test(word) && esSubjunctiveLike(word) && !esIsNoun(word) && !esAttribute(word)
          - >-
            (leadStarts && /^(?:yo|ayer|anoche|anteayer)$/u.test(lead)) ||
            (k > 1 && lead !== "que" && (/^(?:ayer|anoche|anteayer)$/u.test(lead) || pastAfter) && !ES_VA_DETERMINERS.has(at.prev(k + 1))) ||
            (clitics && at.prev(k - 1) === "me" && (at.endsAfter() || /^(?:a|en|de|con|sin|por)$/u.test(at.next())))
        return: "`${word.slice(0, -1)}é`"
      # "e ira creciendo", "cómo ira armado": "ira" (anger) takes no gerund or participle after it
      # unless a determiner makes it the noun ("la ira creciendo en su pecho"). "rechazo e ira
      # dirigido a ellos": two nouns and their participle. "Cantara mañana" -> "cantará",
      # "¿Cuándo llegaras?" -> "llegarás": an -ar future without its accent reads as a past
      # subjunctive, which needs a trigger ("si", "que") before it.
      esVaFuture:
        args: "at: SpanishAround, word: string, prev: string"
        let:
          ira: /^ir(a|as|an)$/u.exec(word)
          arFuture: /^(\p{L}+ar)(a|as|an)$/u.exec(word)
        return: >-
          ira && !ES_DETERMINERS.has(prev) && !ES_PREPOSITIONS.has(prev) && !/^(?:mi|tu|su|sus|nuestra|vuestra)$/u.test(prev) &&
          (esIsGerund(at.next()) || (esPerfectParticipleLike(at.next()) && !ES_CONJUNCTIONS.has(prev)))
            ? `ir${ES_FUTURE_ACCENTS[ira[1]]}`
            : arFuture && esIsVerb(arFuture[1]) && !esIsNoun(word) &&
                ![1, 2, 3].some((k) => ES_FUTURE_BLOCKERS.has(at.prev(k))) &&
                ((/^(?:cuándo|cuánto|cuánta|cuántos|cuántas|dónde|adónde)$/u.test(prev) && at.tokens[at.i - 2]?.text === "¿") ||
                  at.next() === "mañana")
              ? `${arFuture[1]}${ES_FUTURE_ACCENTS[arFuture[2]]}`
              : null
      # "se creo" -> "creó", "él hablo" -> "habló", "no sabia" -> "sabía".
      esVerbAccent:
        args: "at: SpanishAround"
        let:
          word: at.tokens[at.i].lower
          prev: at.prev()
        return: >-
          esVaPreterite(at, word, prev) ?? esVaCliticPreterite(at, word, prev) ?? esVaImperfect(at, word, prev) ??
          esVaStressed(at, word, prev) ?? esVaFirstPreterite(at, word) ?? esVaFuture(at, word, prev)
      # The amount of time after "hacia": a time noun within seven words, or "que" right after the
      # amount.
      esHaciaTime:
        args: "at: SpanishAround, j: number, n: number, start: number"
        type: boolean
        let:
          token: at.tokens[j]
        when: j < at.tokens.length && n < 7
        return: >-
          token.broken || /^[.;:!?]$/u.test(token.text)
            ? false
            : ES_VA_TIME_NOUNS.has(token.lower) || (token.lower === "que" && j === at.i + start + 1) ||
              esHaciaTime(at, j + 1, n + 1, start)
        else: "false"
      # "Hacia dos años que…", "lo que hacia", "la hacia otra empresa": the imperfect "hacía". "Se
      # fue hacía el sur", "Miró hacía las estrellas": after a verb of its own, the preposition
      # towards a place. "Entonces hacia las veces de gerente": "hacer las veces". "¿Qué hacia en
      # la calle?", "lo que hacia no importaba". An amount of time: "hacia mucho tiempo", "hacia
      # dos años que no se veían", "hacia ya treinta días", "hacia muchos, muchos meses que";
      # "hacía mucho que no se veían": the amount alone, then "que".
      esHacia:
        args: "at: SpanishAround"
        let:
          lower: at.tokens[at.i].lower
          prev: at.prev()
          next: at.next()
          numeral: /^\p{N}/u.test(at.tokens[at.i + 1]?.text ?? "")
          start: 'next === "ya" ? 2 : 1'
          amount: at.next(start)
        return: >-
          lower === "hacía"
            ? (ES_DIRECTIONS.has(next) || ES_DETERMINERS.has(next)) && esFiniteVerb(prev) && !esIsNoun(prev) &&
              !esAttribute(prev) && !ES_CLITICS.has(prev)
              ? "hacia"
              : null
            : lower !== "hacia"
              ? null
              : next === "las" && at.next(2) === "veces"
                ? "hacía"
                : ES_DIRECTIONS.has(next) || numeral
                  ? null
                  : ES_OBJECT_CLITICS.has(prev)
                    ? "hacía"
                    : ES_DETERMINERS.has(next)
                      ? null
                      : (prev === "qué" || (prev === "que" && at.prev(2) === "lo")) && !/^(?:más|ya)$/u.test(next)
                        ? "hacía"
                        : ES_WEATHER.has(next) || (next === "las" && at.next(2) === "veces")
                          ? "hacía"
                          : (ES_VA_AMOUNTS.has(amount) || ES_VA_NUMBERS.has(amount)) && esHaciaTime(at, at.i + start, 0, start)
                            ? "hacía"
                            : null
      # "Esta observación seria correcta": the conditional "sería" before its attribute. "todo
      # seria más difícil": any adjective after a degree word.
      esSeria:
        args: "at: SpanishAround"
        let:
          prev: at.prev()
          k: '/^(?:más|menos|muy|tan|mucho|bastante)$/u.test(at.next(1)) ? 2 : 1'
          next: at.next(k)
          form: esGenderedForm(next) ?? esParticiple(next)
        when:
          - at.tokens[at.i].lower === "seria"
          - '!(ES_DEGREE_BEFORE.has(prev) || ES_LINKS.has(prev) || ES_DETERMINERS.has(prev))'
        return: >-
          next === "yo" || next === "mejor" || next === "peor"
            ? "sería"
            : !next || ES_VA_LEADING.has(next)
              ? null
              : form
                ? form.plural ? null : "sería"
                : k === 2 && (esIsNoun(next) || esIsInvariantEntry(next)) ? "sería" : null
      # "Veras el resultado", "Venia de lejos"; "veras" alone is "de veras" ("¿Veras?").
      esPlainTwin:
        args: "at: SpanishAround"
        let:
          word: at.tokens[at.i].lower
          fix: ES_PLAIN_TWINS.get(word)
          next: at.next()
        when:
          - fix
          - at.starts || ES_SUBJECT_OR_NO.has(at.prev())
        return: >-
          word === "veras"
            ? ES_VERAS_NEXT.has(next) ? fix : null
            : word === "venia"
              ? /^(?:de|a|desde|con|por)$/u.test(next) ? fix : null
              : next ? fix : null
      # "Rio de Janeiro": a river name ("Río de la Plata") with a name after "de".
      esHiatusNoun:
        args: "at: SpanishAround"
        let:
          fix: ES_HIATUS_NOUNS.get(at.tokens[at.i].lower)
          prev: at.prev()
        return: >-
          at.tokens[at.i].text === "Rio" && at.next() === "de" && /^\p{Lu}/u.test(at.tokens[at.i + 2]?.text ?? "")
            ? fix
            : fix && (ES_DETERMINERS.has(prev) || ES_BEFORE_HIATUS_NOUN.has(prev)) ? fix : null
      # "El hecho en si sucedió", "la idea en si es buena": "en sí" (in itself) after a noun. "Piensa
      # en si vendrá": after a verb, "si" opens an indirect question.
      esInItself:
        args: "at: SpanishAround"
        let:
          head: at.prev(2)
          next: at.next()
        when:
          - at.tokens[at.i].lower === "si" && at.prev() === "en"
          - '!(!esIsNoun(head) || esFiniteVerb(head) || esIsInfinitive(head))'
        return: 'at.endsAfter() || (esFiniteVerb(next) && !esIsNoun(next)) || ES_SER.has(next) ? "sí" : null'
    frames:
      # Every word: a verb form ("termino", "hablo") is no closed list. The fixer reads the
      # subject and the tense cues around the token (review/spanish/verbAccents.ts).
      - regex: "{{TOKEN_WORD}}"
        flags: gu
        scan: owned
        # A verb, noun or adverb form that needs its written accent at the token.
        let:
          tokens: esTokens(ctx)
          i: esTokenAt(tokens, m.index)
          token: tokens[i]
          at: esAround(tokens, i)
          fix: >-
            esNominal(at) ?? esVerbAccent(at) ?? esHacia(at) ?? esSeria(at) ?? esPlainTwin(at) ?? esHiatusNoun(at) ??
            esInItself(at)
        when:
          - i >= 0
          - token.word && token.start >= ctx.from && token.start < ctx.to
          - fix
        return: 'esReplaceToken(ctx, token, [fix], "spanishAccents", "review_msg_spanish_accent", tokens[i - 1] ?? token)'
  - id: es.paraQueAccent
    checks: [spanishAccents]
    group: spanishAccents
    style: match
    message: review_msg_spanish_interrogative
    # "para que" before an indicative asks ("para qué sirve"), and accents read from a frame.
    sets:
      # "el ingles", "curso de ingles": the language; "las ingles" (the groin) is plural.
      ES_BEFORE_LANGUAGE: [el, del, al, mi, tu, su, un, en, "y", o, buen, mal, nuestro, vuestro]
      ES_LANGUAGE_NOUNS:
        [curso, cursos, clase, clases, profesor, profesora, profesores, examen, nivel, libro, libros, alumnos, alumnas, academia, traducción, diccionario]
      # What a conditional "sería" goes on with and the adjective "seria" does not.
      ES_AFTER_SERIA: [lo, un, una, mejor, peor, posible, imposible, necesario, necesaria, conveniente, preferible, suficiente]
    defs:
      # Past subjunctives look like other tenses: "para que hablaran", "para que viniese".
      ES_PAST_SUBJUNCTIVE: /(?:ra|ras|ra|ramos|rais|ran|se|ses|semos|seis|sen)$/u
      # Present indicative endings, which "para que" (purpose) never takes.
      ES_PRESENT_INDICATIVE: /(?:o|as|a|amos|áis|an|es|e|emos|éis|en|imos|ís)$/u
      # "Quiero saber para que sirve" -> "para qué": an indicative after it asks for a purpose.
      # "para que nadie", "para que todo", "para que como usuario puedas": the verb is further on.
      # "para que halla": "haya" misspelled, not a question. "para que podamos": an -er/-ir
      # subjunctive in -a looks like an -ar indicative.
      esParaQue:
        args: "ctx: DetectContext, tokens: SpanishTokens, i: number"
        let:
          at: esAround(tokens, i)
          k: esSkipClitics(at, 1, 3)
          verb: at.next(k)
          a: /^(\p{L}+?)(?:a|as|an|amos|áis)$/u.exec(verb)
        when:
          - tokens[i].lower === "que" && at.prev() === "para" && tokens[i].text === "que"
          - verb && !/^\p{Lu}/u.test(tokens[i + k].text) && !ES_PAST_SUBJUNCTIVE.test(verb)
          - ES_PRESENT_INDICATIVE.test(verb) && !esSubjunctiveLike(verb) && esFiniteVerb(verb)
          - '!(esIsNoun(verb) || esParticiple(verb) || /^(?:como|cuando|donde|mientras|halla|hallas|hallan)$/u.test(verb))'
          - '!(a && (esIsVerb(`${a[1]}er`) || esIsVerb(`${a[1]}ir`)))'
        return: 'esReplaceToken(ctx, tokens[i], ["qué"], "spanishAccents", "review_msg_spanish_interrogative", tokens[i + k])'
      # "el ingles" -> "inglés", "en Paris" -> "París", "cuál seria" -> "sería". "curso de ingles",
      # but "depilación de ingles" is the groin. "el juicio de Paris" names the Trojan prince: only
      # prepositions of place. "una persona seria lo que buscamos": "lo que" is a relative.
      esFramedAccent:
        args: "ctx: DetectContext, tokens: SpanishTokens, i: number"
        let:
          at: esAround(tokens, i)
          word: tokens[i].lower
          prev: at.prev()
          fix: >-
            word === "ingles" && (ES_BEFORE_LANGUAGE.has(prev) || (prev === "de" && ES_LANGUAGE_NOUNS.has(at.prev(2))))
              ? "inglés"
              : tokens[i].text === "Paris" && /^(?:a|en|hacia|desde|hasta|para|por)$/u.test(prev) &&
                  !/^\p{Lu}/u.test(tokens[i + 1]?.text ?? "")
                ? "París"
                : word === "seria" &&
                    (/^(?:cuál|qué|quién|cómo|dónde)$/u.test(prev) || (ES_AFTER_SERIA.has(at.next()) && at.next(2) !== "que"))
                  ? "sería"
                  : null
        when: fix
        return: 'esReplaceToken(ctx, tokens[i], [fix], "spanishAccents", "review_msg_spanish_accent", tokens[i - 1])'
    frames:
      # "para que" before an indicative, and "ingles", "Paris" and "seria" after the
      # words that ask for the accent. The fixer reads the words around the token
      # (review/spanish/clauses.ts).
      - regex: "(?:que|ingles|paris|seria){{WORD_TAIL}}"
        flags: giu
        scan: owned
        let:
          tokens: esTokens(ctx)
          i: esTokenAt(tokens, m.index)
        when:
          - i >= 0
          - tokens[i].word && tokens[i].start >= ctx.from && tokens[i].start < ctx.to
        return: "[esParaQue(ctx, tokens, i), esFramedAccent(ctx, tokens, i)].filter((finding) => finding !== null)"
  - id: es.frameAccents
    checks: [spanishAccents]
    group: spanishAccents
    style: match
    message: review_msg_spanish_accent
    # "continua" and "perpetua" as verbs, and the accented demonstratives before a noun. The first
    # finding wins.
    maps:
      # Verbs in -uar whose stressed forms carry "ú": unaccented, they are adjectives. The
      # es.frameAccents frame lists these words and those of ES_ACCENTED_DEMONSTRATIVE.
      ES_UAR: { continua: continúa, continuas: continúas, continuan: continúan, perpetua: perpetúa, perpetuan: perpetúan }
      # Accented demonstratives (pronouns in the old spelling) and their determiner forms.
      ES_ACCENTED_DEMONSTRATIVE:
        éste: este
        ésta: esta
        éstos: estos
        éstas: estas
        ése: ese
        ésa: esa
        ésos: esos
        ésas: esas
        aquél: aquel
        aquélla: aquella
        aquéllos: aquellos
        aquéllas: aquellas
    defs:
      # "Continua recibiendo apoyos", "se perpetua": the verb before a gerund or after a pronoun.
      esUarVerb:
        args: "ctx: DetectContext, at: SpanishAround"
        let:
          token: at.tokens[at.i]
          verb: ES_UAR[token.lower]
          next: at.next()
        when:
          - verb
          - (/(?:ando|iendo|yendo)$/u.test(next) && esIsGerund(next)) || /^(?:se|me|te|le|les|nos|os|lo)$/u.test(at.prev())
        return: 'esReplaceToken(ctx, token, [verb], "spanishAccents", "review_msg_spanish_accent", at.tokens[at.i + 1] ?? token)'
      # "Éste señor" -> "Este señor": a demonstrative before its noun never takes an accent. The noun
      # agrees with the demonstrative: "ésta casa", "éstos libros".
      esAccentedDeterminer:
        args: "ctx: DetectContext, at: SpanishAround"
        let:
          token: at.tokens[at.i]
          plain: ES_ACCENTED_DEMONSTRATIVE[token.lower]
          nounToken: at.tokens[at.i + 1]
          noun: esReadNoun(nounToken.lower)
          nominal: esIsNoun(nounToken.lower) || noun?.paired
        when:
          - plain && nounToken?.word && !nounToken.broken && /^\p{Ll}/u.test(nounToken.text)
          - '!(!noun || !nominal || (esFiniteVerb(nounToken.lower) && !esIsNoun(nounToken.lower)))'
          - noun.plural === plain.endsWith("s")
        return: 'esReplaceToken(ctx, token, [plain], "spanishAccents", "review_msg_spanish_accent_extra", nounToken)'
    frames:
      # "continua" and "perpetua" as verbs, and the accented demonstratives before a noun.
      # The fixer reads the words before and after the token (review/spanish/frames.ts).
      - regex: "(?:continua[sn]?|perpetuan?|ést(?:e|a|os|as)|és(?:e|a|os|as)|aquél(?:la|los|las)?){{WORD_TAIL}}"
        flags: giu
        scan: owned
        let:
          tokens: esTokens(ctx)
          i: esTokenAt(tokens, m.index)
          token: tokens[i]
          at: esAround(tokens, i)
        when:
          - i >= 0
          - token.word && token.start >= ctx.from && token.start < ctx.to
        return: "esUarVerb(ctx, at) ?? esAccentedDeterminer(ctx, at)"
  - id: es.confusions
    checks: [spanishConfusions]
    group: spanishConfusions
    style: match
    message: review_msg_spanish_confusion
    # Spanish homophones decided by a closed-class frame around them: "cada ves" (vez), "el ano
    # pasado" (año), "ha echo" (hecho), "a ver estudiado" (haber). The typed word is a real word,
    # so each check names the neighbour that rules its reading out.
    sets:
      ES_CONFUSION_NUMBERS:
        [un, una, uno, dos, tres, cuatro, cinco, seis, siete, ocho, nueve, diez, once, doce, quince, veinte, treinta, cuarenta, cincuenta, sesenta, setenta, ochenta, noventa, cien, ciento, mil]
      ES_CONFUSION_MODALS:
        [puede, pueden, podía, podían, podrá, podrán, podría, podrían, debe, deben, debía, debían, debería, deberían, suele, suelen, solía, solían]
      # Words a perfect "he" follows but the conjunction "e" never does: "te e dicho", "ya e ido".
      ES_BEFORE_HE: [yo, me, te, le, les, lo, la, los, las, nos, os, se, "no", ya, siempre, nunca, jamás, también, tampoco, todavía]
      # Words around a letter "e" or a variable "e": "la letra e", "el apartado e del", "con e
      # mayúscula", "donde e es la carga", "a, b, c, d, e".
      ES_LETTER_BEFORE: [la, una, letra, vocal, constante, número, variable, donde, si, con, sin, apartado, inciso, punto]
      ES_LETTER_AFTER:
        [de, del, es, son, vale, mayúscula, minúscula, mayúsculas, minúsculas, final, inicial, abierta, cerrada, tónica, átona]
      # Adjectives "tan" is the degree of: "está tan mal", "es tan bueno".
      ES_TAN_ADVERBS: [bien, mal, lejos, cerca, pronto, tarde]
      ES_SER_ESTAR:
        [es, era, fue, son, eran, fueron, sea, está, estaba, estuvo, están, estaban, estoy, estás, estamos, soy, eres, somos, parece, parecía, resulta, resultó]
      # Words a lone "d", "n" or "l" may stand before when it lost a letter: "d esta", "n este".
      ES_LEAD_DETERMINERS: [el, la, los, las, un, una, este, esta, estos, estas, ese, esa, esos, esas, aquel, aquella, mi, mis, su, sus, tu, tus]
    maps:
      # Existential "haber" has no plural.
      ES_PLURAL_HABER:
        han: ha
        habían: había
