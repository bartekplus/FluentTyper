# es grammar rules. See docs/agents/grammar-rules.md for the format.
lang: es

# Regex fragments of the frame rules: {{NAME}}.
fragments:
  # Prefixes that are no word of their own, so a space after them is always a split.
  BOUND: "anti|ciber|pre|re|vice|hiper|inter|neuro|geo|nano|agro|sub|semi|multi|pos|infra|intra|seudo|pseudo|archi|hemi|co|fito|meso|hidro|termo|electro|cardio|psico|sero"
  # Prefixes that are also words; FREE in review/spanish/prefixes.ts holds the same list.
  FREE: "ex|pro|des|post|poli|tele|video|foto|euro|afro|micro|macro|mini|ultra|super|súper|auto|radio|bio|eco|socio|mega|giga|kilo|zoo|extra|astro|hispano|anglo|franco|luso|físico|químico|cuasi"
  # Month names; MONTH_NAMES in review/spanish/typography.ts holds the same list.
  MONTH_NAMES: "enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|setiembre|octubre|noviembre|diciembre"
  # Short month names in numeric dates: "29-feb-2005".
  MONTH_SHORT: "ene|feb|mar|abr|may|jun|jul|ago|sep|sept|set|oct|nov|dic"
  ROMAN: "(?:X{1,2}(?:IX|IV|V?I{0,3})|IX|IV|V?I{1,3}|V)"
  # Verbs of saying after a dialogue line: "Ven -dijo." uses the long dash.
  SAYING: "dijo|dije|dice|digo|respondió|contestó|preguntó|añadió|exclamó|gritó|susurró|murmuró|explicó|comentó|replicó|insistió|pensó|repuso|admitió|aclaró"
  # A unit after a decimal number: "9,5 kg".
  UNIT_AFTER: "[ \\t\\u00a0]?(?:%|‰|€|\\$|kg|g|mg|km|m|cm|mm|ml|l|t|°|°C|ºC|m²|m³|km²|ha|kWh|kW|W|V|GB|MB|TB|Hz|kHz|MHz|GHz|kilos?|metros?|litros?|euros?|dólares|grados|millones)(?![\\p{L}\\p{N}])"
  # Words that open a Spanish sentence; STARTERS in review/spanish/typography.ts holds the
  # same list.
  # A whole token of review/spanish/common.ts: a letter run.
  TOKEN_WORD: "\\p{L}[\\p{L}\\p{M}]*"
  # The end of a token's letter run.
  WORD_TAIL: "(?![\\p{L}\\p{M}])"
  STARTERS: "El|La|Los|Las|Lo|Un|Una|Unos|Unas|Y|Pero|Es|Son|Era|Fue|Está|Hay|No|Sí|Yo|Tú|Él|Ella|Ellos|Ellas|Nosotros|Usted|Este|Esta|Estos|Estas|Eso|Esto|Ese|Esa|Se|Me|Te|Le|Les|Nos|Mi|Su|Sus|Tu|En|Del|Al|Con|Por|Para|Sin|Como|Cuando|Si|Que|Qué|Cómo|Dónde|Cuándo|Pues|Así|Luego|Después|Entonces|Ahora|Hoy|Ayer|También|Además|Ya|Todo|Siempre|Nunca|Aquí|Allí|Hola|Gracias|Bueno|Claro|Aunque|Porque|Mientras|Desde|Hasta|Según"

# The code of the rules' expressions (`let`, `when`, `return`): sets and defs that rules of
# several checks use. The names start with "es" or "ES_": a rule file shares its names with
# common.yaml and the rule library.
sets:
  ES_HABER:
    [
      he, has, ha, hemos, habéis, han, había, habías, habíamos, habíais, habían, hube, hubo, habré, habrás,
      habrá, habremos, habrán, habría, habrías, habríamos, habrían, haya, hayas, hayamos, hayan, hubiera,
      hubieras, hubiéramos, hubieran, hubiese, haber, habiendo,
    ]
  ES_IR:
    [voy, vas, va, vamos, vais, van, iba, ibas, íbamos, iban, fui, fuiste, fuimos, fueron, vaya, vayas, vayamos, vayan, ir, yendo]

defs:
  # A finding that replaces [start, end) with each alternative.
  esFinding:
    args: 'ruleId: RawFinding["ruleId"], messageKey: RawFinding["messageKey"], start: number, end: number, alternatives: string[], extra?: Partial<RawFinding>'
    type: RawFinding
    return: "({ ruleId, messageKey, range: { start, end }, alternatives, ...extra })"
  # A token from the start of `first` to the end of `last`.
  esSpan:
    args: "ctx: DetectContext, first: SpanishToken, last: SpanishToken"
    type: SpanishToken
    return: "({ ...first, end: last.end, text: ctx.text.slice(first.start, last.end) })"

  # "como" in a greeting with no "¿": "hola" or a name addressed shortly before it, from
  # tokens[j] back to tokens[floor].
  esGreetingBack:
    args: "at: SpanishAround, j: number, floor: number"
    type: boolean
    return: >-
      j < floor || /^[.!?¿;]$/u.test(at.tokens[j].text) || at.tokens[j + 1].broken
        ? false
        : /^(?:hola|buenas|oye)$/u.test(at.tokens[j].lower) || esGreetingBack(at, j - 1, floor)
  esGreetingSlot:
    args: "at: SpanishAround"
    return: esGreetingBack(at, at.i - 1, Math.max(0, at.i - 6))
  # A "?" right after tokens[i], or after "hoy", "ahora" or a name: "como estas hoy?".
  esEndsQuestion:
    args: "at: SpanishAround"
    let:
      after: at.tokens[at.i + 1]
    return: >-
      after?.text === "?" ||
      (!!after?.word &&
        (/^(?:hoy|ahora|usted|ustedes)$/u.test(after.lower) || /^\p{Lu}\p{Ll}/u.test(after.text)) &&
        at.tokens[at.i + 2]?.text === "?")

  # "a ver" / "haber": what comes after a perfect "haber" is a participle.
  esIsPerfectParticiple:
    args: "word: string"
    return: /o$/u.test(word) && !!esParticiple(word) && !esParticiple(word)!.plural

  # The scan of the frame reads its next match from `index`. Always true.
  esResume:
    args: "frame: FrameRef, index: number"
    return: frame.resume?.(index) === undefined
  # The tokens of the chunk, for a frame whose match starts a token.
  # "pre" + "rebajas" -> "prerrebajas": a word-initial r doubles after a vowel. "súper", "físico":
  # the first element loses its accent inside the compound.
  esJoinPrefix:
    args: "prefix: string, word: string"
    let:
      base: esPlain(prefix)
    return: '/[aeiou]$/iu.test(base) && word.startsWith("r") && !word.startsWith("rr") ? `${base}r${word}` : `${base}${word}`'

rules:
  # The rules of one check form a group, as the Spanish checks ran before the port: a rule
  # that throws stops its group and drops the group's findings.
  - id: es.estarAccents
    checks: [spanishAccents]
    group: spanishAccents
    style: match
    message: review_msg_spanish_accent
    # Written accents that tell two real words apart: "esta" (this) / "está" (is). Each check reads
    # the closed-class words around the target; the lexicon only says whether a neighbour can be a
    # participle, an adjective or a noun.
    sets:
      # Adverbs that modify the verb or an adjective after it, never a noun.
      ES_ESTAR_PLACE_MANNER: [bien, mal, aquí, ahí, allí, allá, acá]
      ES_ESTAR_DEGREE: [muy, tan, bastante, demasiado, medio, casi]
      # Prepositions an "estar" phrase takes; "a", "para" and "por" start pronoun phrases too often.
      ES_ESTAR_PREPOSITIONS: [en, con, sin, bajo, sobre, entre, junto, dentro, detrás, delante, encima]
      # "esta en realidad", "esta sin duda": a pronoun and a parenthetical, not a location.
      ES_ESTAR_PARENTHETICAL:
        [realidad, cambio, particular, concreto, general, especial, principio, efecto, definitiva, resumen, cuanto, parte, todo, duda, embargo]
      # "está de acuerdo", "está de moda": fixed "estar de" phrases.
      ES_ESTAR_DE:
        [
          acuerdo, vacaciones, moda, pie, viaje, broma, baja, luto, más, sobra, paso, vuelta, camino, servicio,
          guardia, parto, suerte, buenas, malas, fiesta, rodillas, espaldas,
        ]
      # Quantifiers and "solo" read as masculine adjectives but start a pronoun's phrase: "esta mucho
      # más moderna", "esta solo es".
      ES_ESTAR_QUANTIFIERS: [mucho, poco, tanto, otro, cuanto, uno, ninguno, alguno, mismo, todo, solo]
      # Participles that are also everyday nouns the dictionary does not list as such.
      ES_PARTICIPLE_NOUNS:
        [
          subida, bajada, bebida, entrada, llegada, mirada, parada, jugada, caída, herida, medida, venida,
          ida, salida, comida, llamada, partida, vuelta, propuesta, respuesta, puesta, vista,
        ]
      # After these a verb is likely: the subject, a time adverb or "no" sits right before it.
      ES_ESTAR_BEFORE_VERB:
        ["no", ya, ahora, todavía, aún, siempre, también, tampoco, nunca, hoy, ayer, aquí, ahí, allí, que, él, ella, usted, uno]
      ES_ESTAR_TIME: [siempre, todavía, ya, aún, ahora, también, hoy, nunca]
      # "esta los domingos abre": a time phrase after the pronoun.
      ES_ESTAR_TIME_NOUNS:
        [domingos, lunes, martes, miércoles, jueves, viernes, sábados, semana, semanas, mañanas, tardes, noches, días, veces, vez, año, años, mes, meses]
      # After these a participle closing its clause is the attribute of "está".
      ES_ESTAR_RELATIVES: ["y", e, pero, cual, cuales, quien, quienes, donde, cuando]
      ES_ESTAR_INTERROGATIVES: [dónde, adónde, cómo, quién, quiénes, cuándo]
      ES_ESTAR_SUBJECTS_3: [él, ella, usted]
      ES_ESTAR_COUNTS: [dos, tres, cuatro, cinco, seis, siete, ocho, nueve, diez, veinte, treinta, cien, mil]
      ES_ESTAR_SUBJECTS_2: [tú, vos]
      # Words a demonstrative never comes before: "Esta cada día más cansada" is "está".
      ES_ESTAR_NOT_DETERMINED: [cada, afuera, encima, arriba, apenas]
      ES_ESTAR_HABER: [he, has, ha, hemos, habéis, han, hay, había, habías, habían, hubo, haya, hayan]
      # "que esté", "cuando esté", "tal vez esté": subjunctive triggers right before "este".
      ES_SUBJUNCTIVE_TRIGGERS: [que, cuando, aunque, mientras, ojalá, quizá, quizás]
      # Adverbs and the like that end like feminine nouns: "no está nada mal", "está fuera".
      ES_NOT_AFTER_DEMONSTRATIVE: [nada, cada, nunca, ahora, fuera, afuera, cerca, encima, arriba, contra, mañana, media, toda, apenas]
    defs:
      # "sé dónde está", "si supiéramos cómo está": verbs that introduce an indirect question.
      ES_ESTAR_ASKING: /^(?:s[ée]|sab\p{L}*|sup\p{L}*|pregunt\p{L}*|ver|veamos|dime|dinos|explica\p{L}*)$/u
      # A capitalized sentence-initial word the lexicon does not know: a name ("París está").
      esNameLike:
        args: "at: SpanishAround"
        let:
          before: at.tokens[at.i - 1]
          word: before.lower
        when: before?.word && !at.tokens[at.i].broken && /^\p{Lu}\p{Ll}/u.test(before.text)
        return: >-
          ES_GIVEN_NAMES.has(word) ||
          (word.length > 2 && !esIsNoun(word) && !esAttribute(word) && !esVerbLike(word) && !esIsInfinitive(word) &&
            !ES_PREPOSITIONS.has(word) && !ES_CONJUNCTIONS.has(word) && !ES_DETERMINERS.has(word) &&
            !ES_CLITICS.has(word) && !ES_SER.has(word) && !/mente$/u.test(word))
        else: "false"
      # A "¿" from tokens[j] back to tokens[floor] before a stop.
      esAsksBack:
        args: "at: SpanishAround, j: number, floor: number"
        type: boolean
        return: >-
          j < floor
            ? false
            : at.tokens[j].text === "¿"
              ? true
              : /^[.;!?…]$/u.test(at.tokens[j].text) || at.tokens[j + 1].broken ? false : esAsksBack(at, j - 1, floor)
      # The question word before tokens[i] opens a question: "¿Cómo está?", "No sé dónde está.".
      esAsks:
        args: "at: SpanishAround"
        return: ES_ESTAR_ASKING.test(at.prev(2)) || esAsksBack(at, at.i - 1, Math.max(0, at.i - 12))
      # After an attribute: the phrase ends there ("está casada.", "está basada en", "y"). "casada y
      # tiene", but "repentina y loable disposición". "licenciada y examinada por": two participles.
      esCloses:
        args: "at: SpanishAround, k: number"
        type: boolean
        let:
          after: at.next(k + 1)
          coordinated: at.next(k + 2)
        return: >-
          at.endsAfter(k) ||
          ES_PREPOSITIONS.has(after) ||
          ((after === "y" || after === "e") && !esIsNoun(coordinated) && !esAttributeOf(coordinated)) ||
          ((after === "y" || after === "e") && !!esParticiple(at.next(k)) && !!esParticiple(coordinated) &&
            !esIsNoun(coordinated) && esCloses(at, k + 2)) ||
          ES_ESTAR_PLACE_MANNER.has(after) ||
          /^\p{L}{4,}mente$/u.test(after)
      # The words 2 and 3 back before a noun before tokens[i]: a determiner and adjectives.
      esNounPhraseStep:
        args: "at: SpanishAround, k: number"
        type: boolean
        let:
          word: at.prev(k)
        return: >-
          k > 3
            ? false
            : ES_DETERMINERS.has(word)
              ? k > 2
              : !ES_PRENOMINAL.has(word.replace(/s$/u, "")) && (!esAttributeOf(word) || esFiniteVerb(word))
                ? false
                : esNounPhraseStep(at, k + 1)
      # "Su nueva novela esta…": a determiner, one or two adjectives and a noun before the word.
      esNounPhraseBefore:
        args: "at: SpanishAround"
        return: "!!at.prev() && esIsNoun(at.prev()) && esNounPhraseStep(at, 2)"
      esEstarFinite:
        args: "token: SpanishToken"
        return: >-
          token.word &&
          (esFiniteVerb(token.lower) || ES_ESTAR_HABER.has(token.lower) ||
            (ES_SER.has(token.lower) && !/^(?:ser|siendo|sido)$/u.test(token.lower)))
      esFiniteBefore:
        args: "tokens: SpanishTokens, j: number"
        type: boolean
        return: >-
          j < 0 || tokens[j + 1].broken || ES_BOUNDARY.test(tokens[j].text) || ES_OPENING.test(tokens[j].text)
            ? false
            : esEstarFinite(tokens[j]) || esFiniteBefore(tokens, j - 1)
      esFiniteAfter:
        args: "tokens: SpanishTokens, j: number"
        type: boolean
        return: "esIsBoundary(tokens[j]) ? false : esEstarFinite(tokens[j]) || esFiniteAfter(tokens, j + 1)"
      # No other word of the clause around tokens[i] may be a finite verb. The attribute itself may
      # spell a verb too ("enferma").
      esVerbless:
        args: "at: SpanishAround"
        return: "!esFiniteBefore(at.tokens, at.i - 1) && !esFiniteAfter(at.tokens, at.i + 2)"
      # "esta 100 % seguro", "El cabo esta 30 millas al sur", "Esta cien por cien seguro": no
      # singular demonstrative counts more than one.
      esEstarCounts:
        args: "at: SpanishAround, plural: boolean"
        let:
          count: at.tokens[at.i + 1]
        return: >-
          !plural && !!count && !count.broken &&
          ((/^\p{N}+$/u.test(count.text) && count.text !== "1") || ES_ESTAR_COUNTS.has(count.lower)) &&
          ((!!at.tokens[at.i + 2]?.word && at.next(2) !== "de") || at.tokens[at.i + 2]?.text === "%")
      # "¿Dónde está?", "no está.", "tú estás.": a verb closing its clause. "¡Ahí estás!", "Claro
      # está.", "Escrito está.": no noun for a determiner to agree with. "¡Qué cerca esta!", "¡Qué
      # buena esta!": an exclamation about how something is.
      esEstarAtEnd:
        args: "at: SpanishAround, plural: boolean, prev: string, prev2: string"
        let:
          subjects: "plural ? ES_ESTAR_SUBJECTS_2 : ES_ESTAR_SUBJECTS_3"
        when: at.endsAfter()
        return: >-
          prev === "no" ||
          (ES_ESTAR_INTERROGATIVES.has(prev) && esAsks(at)) ||
          (prev === "tal" && prev2 === "qué") ||
          (subjects.has(prev) && !ES_PREPOSITIONS.has(prev2)) ||
          ES_ESTAR_PLACE_MANNER.has(prev) ||
          ((prev2 === "qué" || prev2 === "que") && at.tokens[at.i + 1]?.text === "!" &&
            (!!esAttributeOf(prev) || prev === "cerca" || prev === "lejos" || ES_ESTAR_PLACE_MANNER.has(prev))) ||
          (!plural && esAttribute(prev)?.feminine === false && !esAttribute(prev)?.plural)
        else: "false"
      # The slot of a verb, once the word after is known: a subject, a name, "no", a time adverb or a
      # clause start. "¿A qué altura esta la calle?": a question phrase is the verb's slot too.
      esEstarSlot:
        args: "at: SpanishAround, plural: boolean, prev: string, prev2: string, next: string, reading: ReturnType<typeof esAttributeOf>"
        let:
          subjects: "plural ? ES_ESTAR_SUBJECTS_2 : ES_ESTAR_SUBJECTS_3"
          # "la tienda esta cerrada": after a determiner and its noun, "esta" cannot start another
          # noun phrase (the colloquial "la chica esta" is followed by its verb).
          afterNoun: >-
            (ES_DETERMINERS.has(prev2) && !!prev && !ES_PREPOSITIONS.has(prev) && !ES_CONJUNCTIONS.has(prev)) ||
            esNounPhraseBefore(at)
          asked: /^(?:qué|cuál|cuánto|cuánta|cuántos|cuántas)$/u.test(prev2) && esIsNoun(prev)
          slot: >-
            asked || at.starts || at.prevIsName || afterNoun || esNameLike(at) || ES_ESTAR_BEFORE_VERB.has(prev) ||
            subjects.has(prev) || ES_ESTAR_INTERROGATIVES.has(prev) ||
            ((esIsNoun(prev) || esAttribute(prev) !== null) && !esVerbLike(prev))
          nextToken: at.tokens[at.i + 1]
        # "y esta embarazada.", "la cual esta basada en": a true participle closing the clause after
        # a conjunction or a relative is the verb's attribute; the dictionary lists "basada" and
        # "pegada" as nouns too, the everyday ones are listed. "Esta subida en la silla.", "Esta
        # cada día más cansada", "Mira la vaca, esta enferma.": in a clause with no other verb the
        # word is the verb, not a determiner before an attribute; "esta fuera de lugar", but
        # "aunque esta fuera la mejor" (were); a verb's own form ("esta afecta a todos") only
        # closing the clause: "esta enferma.". "¿A qué distancia esta la calle?", "¿a qué altura
        # esta Lima?": after the asked phrase a noun phrase is the verb's subject, even one that
        # reads as a verb too ("calle"). "En el cerro esta la catedral": a determiner cannot follow
        # the demonstrative, so "está" introduces the subject; "esta la tiene" is a pronoun and its
        # clitic. "esta más allá de", "esta más cerca": a degree of place. "La tienda donde trabajo
        # esta al lado del banco": a place after "al" ("esta al menos").
        return: >-
          afterNoun && reading && !reading.plural && !ES_ESTAR_QUANTIFIERS.has(next) && esCloses(at, 1)
            ? true
            : !slot && (ES_ESTAR_RELATIVES.has(prev) || prev === "que") && reading && !reading.plural &&
                !!esParticiple(next) && (!esIsNoun(next) || /[ai]da$/u.test(next)) &&
                !ES_PARTICIPLE_NOUNS.has(next) && !esVerbLike(next) && esCloses(at, 1)
              ? true
              : !plural && !ES_ESTAR_QUANTIFIERS.has(next) && esVerbless(at) &&
                  (((ES_ESTAR_NOT_DETERMINED.has(next) || (next === "fuera" && at.next(2) === "de")) && !at.endsAfter(1)) ||
                    (reading && !reading.plural && reading.feminine !== false && esCloses(at, 1) &&
                      (at.endsAfter(1) ? !ES_PARTICIPLE_NOUNS.has(next) : !esFiniteVerb(next))))
                ? true
                : !slot
                  ? false
                  : asked && !plural &&
                      ((/^(?:el|la|los|las|mi|su|tu)$/u.test(next) && esIsNoun(at.next(2))) ||
                        (/^\p{Lu}\p{Ll}/u.test(nextToken.text) && !nextToken.broken))
                    ? true
                    : /^(?:el|la|los|las|un|una|mi|su|tu)$/u.test(next) && !esIsBoundary(at.tokens[at.i + 2]) &&
                        esIsNoun(at.next(2)) && !esVerbLike(at.next(2)) && !esFiniteVerb(at.next(2)) &&
                        !ES_ESTAR_TIME_NOUNS.has(at.next(2))
                      ? !at.starts
                      : next === "más" && /^(?:allá|cerca|lejos|adelante|atrás|arriba|abajo)$/u.test(at.next(2))
                        ? true
                        : next === "al" && /^(?:lado|fondo|final|norte|sur|este|oeste|borde|otro)$/u.test(at.next(2))
                          ? true
                          : esEstarAfterSlot(at, plural, prev, prev2, next, reading, subjects, afterNoun, nextToken)
      # The words after the verb's slot. "Tom está todavía despierto", "Está siempre corriendo": a
      # time adverb, then the attribute. "esta casada.", "está basada en", but "esta preciosa casa",
      # "esta llamada"; "basada", "pegada": participles the dictionary lists as nouns too. "Ya esta
      # terminada la obra": after an adverb, a participle that is no noun is the attribute even when
      # the clause goes on. "muy" only takes adjectives and adverbs; "tan bonita ciudad" may still be
      # a noun phrase. "La ciudad esta al este", "La casa esta a dos calles": a place after a
      # subject. "no esta casa": "no" before a verb, unless a noun follows. "¿Dónde esta tu padre?",
      # "Tom está feliz": a question word or subject right before it.
      esEstarAfterSlot:
        args: >-
          at: SpanishAround, plural: boolean, prev: string, prev2: string, next: string,
          reading: ReturnType<typeof esAttributeOf>, subjects: ReadonlySet<string>, afterNoun: boolean,
          nextToken: SpanishToken
        return: >-
          ES_ESTAR_TIME.has(next)
            ? esEstarTimeAdverb(at, plural)
            : reading && !reading.plural && !ES_ESTAR_QUANTIFIERS.has(next) && !ES_PARTICIPLE_NOUNS.has(next) &&
                !esVerbLike(next) &&
                (!esIsNoun(next) || ES_INVARIANT.has(next) || (!!esParticiple(next) && /[ai]da$/u.test(next))) &&
                (esCloses(at, 1) || (ES_ESTAR_BEFORE_VERB.has(prev) && !!esParticiple(next) && !esIsNoun(next)))
              ? true
              : ES_ESTAR_PLACE_MANNER.has(next)
                ? !ES_CLITICS.has(at.next(2)) && at.next(2) !== "la"
                : next === "cerca" || next === "lejos"
                  ? at.next(2) === "de" || at.endsAfter(1)
                  : ES_ESTAR_DEGREE.has(next)
                    ? (ES_ESTAR_PLACE_MANNER.has(at.next(2)) || at.next(2) === "cerca" || at.next(2) === "lejos" ||
                        !!esAttributeOf(at.next(2))) &&
                      (next === "muy" || !esIsNoun(at.next(2)) || ES_INVARIANT.has(at.next(2))) &&
                      !esIsNoun(at.next(3))
                    : ES_ESTAR_PREPOSITIONS.has(next)
                      ? !ES_ESTAR_PARENTHETICAL.has(at.next(2))
                      : (next === "al" || next === "a") && (afterNoun || subjects.has(prev))
                        ? !ES_CLITICS.has(at.next(2)) && !esIsInfinitive(at.next(2))
                        : prev === "no"
                          ? !esIsNoun(next) && !ES_CLITICS.has(next)
                          : ES_ESTAR_INTERROGATIVES.has(prev) || subjects.has(prev) || (prev === "tal" && prev2 === "qué")
                            ? (!esIsNoun(next) || ES_DETERMINERS.has(next) || /^\p{Lu}/u.test(nextToken.text)) &&
                              !ES_CLITICS.has(next)
                            : false
      esEstarTimeAdverb:
        args: "at: SpanishAround, plural: boolean"
        let:
          after: at.next(2)
          later: esAttributeOf(after)
        return: >-
          esIsGerund(after)
            ? true
            : later && !later.plural && later.feminine !== null && (plural || !later.feminine)
              ? !ES_ESTAR_QUANTIFIERS.has(after)
              : !!later && !later.plural && !esIsNoun(after) && !esVerbLike(after) && esCloses(at, 2)
      # The word after "esta" decides: "esta cantando", "estás haciéndolo". A masculine attribute
      # cannot agree with "esta"; no singular one with "estas".
      esEstarBeforeWord:
        args: "at: SpanishAround, plural: boolean, prev: string, prev2: string, next: string"
        let:
          reading: esAttributeOf(next)
        return: >-
          esIsGerund(next)
            ? true
            : next === "de"
              ? ES_ESTAR_DE.has(at.next(2))
              : /^\p{L}{4,}mente$/u.test(next)
                ? !ES_CONJUNCTIONS.has(prev) || prev === "que"
                : reading && !ES_ESTAR_QUANTIFIERS.has(next) && reading.feminine !== null && !reading.plural &&
                    (plural || !reading.feminine)
                  ? true
                  : ES_ESTAR_QUANTIFIERS.has(next) && (next === "solo" || next === "todo")
                    ? at.endsAfter(1) || ES_ESTAR_PLACE_MANNER.has(at.next(2)) || ES_ESTAR_DEGREE.has(at.next(2))
                    : esEstarSlot(at, plural, prev, prev2, next, reading)
      # "esta"/"estas" read as the verb "está"/"estás" from the words around them. `plural` is the
      # demonstrative's number: "estas" + a singular attribute cannot agree. "Deja la habitación
      # como esta.": left as it is. "Hola, como estas?": a greeting asked without its opening mark.
      # "por ser esta la casa", "de esta manera", "combinar esta con", "como esta", "toda esta
      # recogida": a pronoun or a determiner. "Escrito está.", "Lo hecho, hecho está": a participle
      # and the verb closing the clause. "Finalizada esta en 1445": an absolute participle clause,
      # then the pronoun. "lo esta", "se le esta", "¿no lo estás?": a clitic only comes before a
      # verb.
      esEstarReading:
        args: "at: SpanishAround, plural: boolean"
        let:
          prev: at.prev()
          prev2: at.prev(2)
          next: at.next()
        return: >-
          prev === "como" && !next && at.endsAfter() && [2, 3, 4, 5].some((k) => /^(?:d[eé]j|qued)\p{L}*$/u.test(at.prev(k)))
            ? true
            : prev === "como" && esGreetingSlot(esAround(at.tokens, at.i - 1)) && esEndsQuestion(at)
              ? true
              : ES_PREPOSITIONS.has(prev) || ES_SER.has(prev) || esIsInfinitive(prev) || prev === "como"
                ? false
                : /^tod[oa]s?$/u.test(prev)
                  ? false
                  : !next && at.endsAfter() && !plural && esParticiple(prev)?.feminine === false
                    ? true
                    : esParticiple(prev) && esAround(at.tokens, at.i - 1).starts
                      ? false
                      : ES_CLITICS.has(prev) && prev !== "la" && prev !== "las"
                        ? true
                        : esEstarCounts(at, plural)
                          ? true
                          : !next
                            ? esEstarAtEnd(at, plural, prev, prev2)
                            : esEstarBeforeWord(at, plural, prev, prev2, next)
      # "para que la cuenta este configurada", "que cualquier negocio este a la vanguardia": a trigger
      # a few words back, and what follows cannot go with masculine "este". "Dijo que el libro está
      # a la venta": a report keeps the indicative.
      esDistantTrigger:
        args: "at: SpanishAround"
        let:
          next: at.next()
        return: >-
          at.tokens[at.i].lower === "este" &&
          [2, 3, 4].some((k) => ES_SUBJUNCTIVE_TRIGGERS.has(at.prev(k)) &&
            !/^(?:dij|dic|dec|cre|pens|piens|sab|sé|afirm|asegur|explic|cuent|cont)\p{L}*$/u.test(at.prev(k + 1))) &&
          ((!!esParticiple(next)?.feminine && !esIsNoun(next)) || (next === "a" && at.next(2) === "la"))
      # "que esté", "cuando el niño esté", "que su país esté", "que no esté": "este" after a
      # subjunctive trigger. "cuando tu orden este procesada": a feminine participle cannot follow
      # masculine "este". "que este cansado.", "cuando esté lista", but "que este libro", "que este
      # mismo papa".
      esSubjunctiveReading:
        args: "at: SpanishAround"
        let:
          prev: at.prev()
          prev2: at.prev(2)
          clitic: ES_CLITICS.has(prev) && prev !== "la" && prev !== "las" && prev !== "los"
          prev3: at.prev(3)
          trigger: >-
            clitic || ES_SUBJUNCTIVE_TRIGGERS.has(prev) || (prev === "vez" && prev2 === "tal") ||
            (prev === "pronto" && prev2 === "tan") || (prev === "no" && ES_SUBJUNCTIVE_TRIGGERS.has(prev2)) ||
            (ES_SUBJUNCTIVE_TRIGGERS.has(prev3) && ES_DETERMINERS.has(prev2) && !!prev && !ES_CLITICS.has(prev2))
          next: at.next()
          reading: esAttributeOf(next)
        return: >-
          !trigger
            ? esDistantTrigger(at)
            : !next
              ? clitic && at.endsAfter()
              : esIsGerund(next)
                ? true
                : ES_ESTAR_PLACE_MANNER.has(next)
                  ? esCloses(at, 1)
                  : next === "de"
                    ? ES_ESTAR_DE.has(at.next(2))
                    : ES_ESTAR_PREPOSITIONS.has(next) || next === "al"
                      ? !ES_ESTAR_PARENTHETICAL.has(at.next(2))
                      : next === "por" || next === "a"
                        ? /^(?:encima|debajo|punto|tiempo)$/u.test(at.next(2))
                        : at.tokens[at.i].lower === "este" && esParticiple(next)?.feminine && !esIsNoun(next)
                          ? true
                          : next === "cerca" || next === "lejos"
                            ? at.next(2) === "de"
                            : ES_ESTAR_DEGREE.has(next)
                              ? !!esAttributeOf(at.next(2)) && esCloses(at, 2)
                              : !!reading && !ES_ESTAR_QUANTIFIERS.has(next) && !ES_PARTICIPLE_NOUNS.has(next) &&
                                !(esVerbLike(next) && !next.endsWith("o")) && esCloses(at, 1)
      # "de está manera", "Está misma mañana", "Estás casas": the verb where a determiner goes. A
      # preposition never governs a finite verb: "con está definición"; "según está escrito" and
      # "hasta está cansado" (even) are clauses. "Arreglar está avería", "Estás casas son verdes":
      # "estar" takes no bare noun, so a feminine noun after it wants the demonstrative. Nouns in -a
      # may be adjectives too ("está enferma"): only after an infinitive.
      esDemonstrativeReading:
        args: "at: SpanishAround"
        let:
          prev: at.prev()
          next: at.next()
          form: at.tokens[at.i].lower
        when: next
        return: >-
          /^mism[oa]s?$/u.test(next)
            ? true
            : ES_PREPOSITIONS.has(prev) && !/^(?:a|al|del|según|hasta)$/u.test(prev)
              ? (esIsNoun(next) || (!!esGenderedForm(next) && !esParticiple(next))) &&
                !ES_NOT_AFTER_DEMONSTRATIVE.has(next) && !esIsGerund(next)
              : esAttributeOf(next) || ES_NOT_AFTER_DEMONSTRATIVE.has(next) || !esIsNoun(next)
                ? false
                : form === "está"
                  ? at.next(2) !== "de" && (/(?:ión|dad|tud)$/u.test(next) || (/a$/u.test(next) && esIsInfinitive(prev)))
                  : form === "estás" && /as$/u.test(next)
        else: "false"
    frames:
      # The "esta" and "está" forms. The fixer reads the words before and after the token
      # (review/spanish/accents.ts).
      - regex: "est(?:[aá]s?|[eé]){{WORD_TAIL}}"
        flags: giu
        scan: owned
        # "esta"/"estas"/"este" read as "estar", "está"/"estás"/"esté" read as a demonstrative.
        let:
          tokens: esTokens(ctx)
          i: esTokenAt(tokens, m.index)
          token: tokens[i]
          at: esAround(tokens, i)
          lower: token.lower
          verb: >-
            lower === "esta"
              ? esEstarReading(at, false) && "está"
              : lower === "estas"
                ? esEstarReading(at, true) && "estás"
                : lower === "este"
                  ? esSubjunctiveReading(at) && "esté"
                  : false
          demonstrative: 'lower === "está" ? "esta" : lower === "estás" ? "estas" : lower === "esté" ? "este" : undefined'
        when:
          - i >= 0
          - token.word && token.start >= ctx.from && token.start < ctx.to
        return: >-
          [
            verb ? esReplaceToken(ctx, token, [verb], "spanishAccents", "review_msg_spanish_accent", tokens[i + 1]) : null,
            demonstrative && esDemonstrativeReading(at)
              ? esReplaceToken(ctx, token, [demonstrative], "spanishAccents", "review_msg_spanish_accent_extra", tokens[i + 1])
              : null,
          ].filter((finding) => finding !== null)
  - id: es.diacritics
    checks: [spanishAccents]
    group: spanishAccents
    style: match
    message: review_msg_spanish_accent
    # Question words after ¿ and ¡ or a verb of knowing (qué, cómo, dónde), and the stressed
    # monosyllables (tú, él, mí, sí, sé, dé, té, más, aún) told from their unstressed twins by the
    # closed-class word beside them. The es.diacritics frame lists the words of
    # ES_INTERROGATIVE, ES_PLAIN_RELATIVE and the cases of esMonosyllable.
    sets:
      # The accented question words.
      ES_ASKED_FORMS: [qué, cómo, dónde, adónde, cuándo, quién, quiénes, cuál, cuáles, cuánto, cuánta, cuántos, cuántas, cuán]
      # Words a question may open with before its question word: "¿Y de qué…?", "¿Pero cómo…?".
      ES_QUESTION_LEAD: ["y", e, o, u, pero, pues, entonces, bueno, ah, oye]
      ES_ADVERBIALS: [bien, mal, tarde, pronto, aquí, allí, ahí, siempre, nunca]
      # Nouns a question asks about after a preposition: "hasta qué punto", "de qué manera".
      ES_QUESTION_NOUNS:
        [punto, forma, manera, modo, hora, color, momento, medida, tipo, clase, edad, precio, tamaño, frecuencia, razón, motivo, lado, parte]
      ES_DIA_SUBJECTS: [yo, tú, él, ella, usted, nosotros, nosotras, vosotros, vosotras, ellos, ellas, ustedes]
      # Irregular finite verbs and adverbs the dictionary also lists as nouns.
      ES_DIA_FINITE:
        [
          es, son, era, fue, fui, vino, dije, dijo, hizo, puso, tuvo, estuvo, quiso, supo, pudo, trajo, anduvo, ve, ven,
          eres, soy, somos, sois, estás, da, dan, haz, pon, sal, ten, di, va, van, ha, han, hay,
        ]
      ES_DIA_NOT_NOUNS:
        [
          sí, "no", bien, mal, mañana, tarde, hoy, ayer, noche, siempre, nunca, igual, tal, solo, sola, así, esto, eso,
          aquello, ese, esa, qué, cómo, dónde, cuándo, quién, cuál, cuánto,
        ]
      # Gerunds whose missing object "qué" asks for: "¿Qué estás haciendo?". Any other progressive
      # right after "¿Que" reads as an echo: "¿Que estás temblando?" (you say you are…?).
      ES_ASKED_GERUNDS:
        [
          haciendo, diciendo, pensando, buscando, mirando, viendo, leyendo, comiendo, bebiendo, escribiendo,
          esperando, tramando, planeando, preparando, cocinando, escuchando, insinuando, sugiriendo,
          intentando, tomando, estudiando, contando, pidiendo, vendiendo, comprando, ocultando,
          escondiendo, pasando, ocurriendo, sucediendo, aprendiendo, celebrando, proponiendo,
        ]
      ES_DIA_QUANTITY:
        [
          mucho, mucha, muchos, muchas, poco, poca, pocos, pocas, varios, varias, algunos, algunas, algún, alguna,
          ningún, ninguna, tantos, tantas, bastantes, demasiados, demasiadas, dos, tres, cuatro, cinco, cien, mil,
        ]
      ES_EXISTS: [hay, había, habrá, hubo, habría]
      ES_PLACE_START: [en, a, al, dentro, detrás, debajo, encima, fuera, delante, tras, bajo, sobre, aquí, allí, ahí, allá]
      ES_AFTER_EVENT: [aquí, allí, ahí, allá, ahora, hoy, ayer, entonces, realmente, exactamente, después, antes, luego]
      ES_AFTER_DEED: [para, con, ahora, hoy, mañana, aquí, allí, ahí, después, luego]
      # Words that can follow a possessive "mi" inside its noun phrase.
      ES_BEFORE_NOUN:
        [mejor, peor, mayor, menor, primer, primera, último, última, único, única, propio, propia, gran, buen, querido, querida, pobre, viejo, vieja, nuevo, nueva, otro, otra]
      ES_DIA_NUMBERS: [dos, tres, cuatro, cinco, seis, siete, ocho, nueve, diez, cien, mil]
      # Verb forms no possessive goes before, though the dictionary lists "es" (the letter) and
      # "fue" as nouns; "mi era", "mi vino" and "mi son" are nouns too.
      ES_ONLY_VERBS:
        [es, fue, fui, dijo, hizo, puso, tuvo, estuvo, quiso, supo, pudo, trajo, eres, soy, somos, estás, va, van, ha, han, hay, parece, parecen, resulta, resultan]
      ES_ONE_OFF: [también, tampoco, nunca, jamás, mismo, misma]
      # Finite verbs too common to need the lexicon: "el fue" can only be "él fue".
      ES_COMMON_VERBS:
        [es, era, fue, está, estaba, estuvo, tiene, tenía, tuvo, dijo, dice, hizo, hace, sabe, sabía, quiere, quería, quiso, puede, podía, pudo, iba, ha, había, será, sería]
      ES_DIA_PRONOUNS: [yo, tú, ella, usted, nosotros, nosotras, vosotros, ellos, ellas, ti, mí, él]
      ES_PLAIN_SI_PREV: [que, pues, eso, claro, ahora, creo]
      ES_TEA: [verde, negro, rojo, blanco, chino, japonés, inglés, frío, caliente, helado, con, "y", de, del]
      # Bare objects "dar" takes in set phrases: "dé cuenta", "dé voz", "dé las gracias".
      ES_GIVEN:
        [cuenta, voz, gracias, permiso, asentimiento, golpecitos, crédito, importancia, consentimiento, aprobación, apoyo, bendición]
      # What "dar" gives with an article: "que Dios dé una respuesta", "que dé un alarido".
      ES_GIVEN_WITH_ARTICLE: [respuesta, alarido, abrazo, beso, consejo]
      # Subjects that may stand between the subjunctive trigger and "dé".
      ES_SUBJECT_FILLERS: [él, ella, usted, alguien, nadie, dios, uno, cada, mismo, ahora, "no", nunca, ya]
      # What follows an answer's "Sí,": "Sí, me gusta", "Sí, pero…", "Sí, claro".
      ES_ANSWER_AFTER:
        [
          pero, claro, gracias, señor, señora, vale, bueno, ya, también, me, te, nos, lo, la, le, es, son, está, hay,
          tengo, quiero, puedo, creo, exacto, correcto, perfecto, efectivamente, desde, seguro,
        ]
      ES_IRREGULAR_PAST:
        [hice, hizo, fui, fue, fuimos, fueron, tuve, tuvo, dije, dijo, puse, puso, vine, vino, estuve, estuvo, pude, pudo, quise, quiso, supe, supo]
      # Relatives written as question words after their antecedent: "nada qué hacer" -> "que".
      ES_QUANTITY_ANTECEDENTS: [nada, algo, nadie, alguien, mucho, poco, bastante]
      # Masculine adjectives that follow a subject "él": "él solo", "él mismo", "él propio".
      ES_NOT_AFTER_EL: [solo, sólo, mismo, propio, único, entero, solito, junto, todo, bueno]
    maps:
      ES_INTERROGATIVE:
        que: qué
        como: cómo
        donde: dónde
        adonde: adónde
        cuando: cuándo
        quien: quién
        quienes: quiénes
        cual: cuál
        cuales: cuáles
        cuanto: cuánto
        cuanta: cuánta
        cuantos: cuántos
        cuantas: cuántas
        cuan: cuán
      # "el modo cómo" -> "como", "la fecha cuándo" -> "cuando", "el lugar dónde" -> "donde".
      ES_NOUN_ANTECEDENTS:
        cómo: [modo, manera, forma]
        cuándo: [fecha, día, momento, época, hora, año]
        dónde: [lugar, sitio, casa, ciudad, zona, pueblo, país, parte, punto]
      ES_PLAIN_RELATIVE:
        qué: que
        quién: quien
        quiénes: quienes
        dónde: donde
        cómo: como
        cuándo: cuando
    defs:
      # Verbs whose object can be an indirect question: "no sé qué hacer", "pregunta dónde vive".
      ES_DIA_KNOWING: /^(?:sé|sabe|sabes|sabemos|saben|sabéis|sabía|sabías|sabían|sabíamos|saber|sabiendo|sabido|sabrá|sabré|sabría|supe|supo|supieron|supiera|supiéramos|pregunt\p{L}*|decidir|decide|decidió|decidieron|elegir|explica|explícame|explíqueme|explicar|imagin\p{L}*|recuerdo|recuerda|recordaba|averiguar|entender|entiendo|ignoro|dime|dinos)$/u
      # The verbs whose "que" + noun can only be "qué": "¿sabes qué libro…?", "pregunta qué hora es".
      ES_DIA_ASKING: /^(?:sé|sabe|sabes|sabemos|saben|sabía|sabías|sabían|saber|pregunt\p{L}*|decidir|elegir|averiguar|se)$/u
      # Verbs of affection whose object is the clitic before them: "¿Que me adora?" (that she…?).
      ES_AFFECTION: /^(?:quier[eo]|quieres|quieren|ama|amas|aman|adora|adoras|adoran|odia|odias|odian)$/u
      ES_EVENT: /^(?:pas|ocurr|suced)(?:a|ó|aba|ará|ará|ía|e|ió|erá|irá|ado|ido)$/u
      # "hacer" with no object of its own, after a dative clitic and a modal or "haber".
      ES_DEED: /^(?:hacer|hacerles?|hago|haces|hace|hacemos|hacen|hice|hiciste|hizo|hicimos|hicieron|hecho|haré|harás|hará|haría|harías)$/u
      ES_BEFORE_DEED: /^(?:puedo|puedes|puede|podemos|pueden|podría|podrías|debo|debes|debe|debemos|deben|quiero|quieres|quiere|queremos|quieren|voy|vas|va|vamos|van|tengo|tienes|tiene|tenemos|tienen|he|has|ha|hemos|han|había|habías|habían)$/u
      ES_PRETERITE: /^\p{L}{2,}(?:é|ó|aste|iste|ió|aron|ieron)$/u
      # Any noun or adjective the lexicon knows: "mente", "retrato", "asistencia".
      esKnownNominal:
        args: "word: string"
        return: esIsNoun(word) || !!esAttributeOf(word) || esIsGenderedEntry(word)
      # The question word right after "¿"/"¡", after at most one lead word and one preposition.
      esOpensQuestion:
        args: "at: SpanishAround"
        type: '"?" | "!" | null'
        let:
          j1: 'ES_PREPOSITIONS.has(at.prev(1)) && !at.tokens[at.i].broken ? at.i - 2 : at.i - 1'
          j: 'ES_QUESTION_LEAD.has(at.tokens[j1]?.lower ?? "") && at.tokens[j1]?.word ? j1 - 1 : j1'
          mark: at.tokens[j]
        when: mark && !(j < at.i - 1 && at.tokens[j + 1].broken)
        return: 'mark.text === "¿" ? "?" : mark.text === "¡" ? "!" : null'
      # A noun that no reading makes a verb form: "hora", "libro", "nombre".
      esSolidNoun:
        args: "word: string"
        return: >-
          !!word && esIsNoun(word) && !esAttributeOf(word) && !(esVerbLike(word) && !word.endsWith("o")) &&
          !esSecondPersonVerb(word) && !esSubjunctiveLike(word) && !esIsInfinitive(word) && !ES_DIA_FINITE.has(word) &&
          !ES_DIA_NOT_NOUNS.has(word) && !ES_DETERMINERS.has(word)
      # "¿Que has visto un ovni?", "¿Que el vecino vino?": a question that repeats a statement ("you
      # say that…?") rather than asking "what". Its clause names what "qué" would ask for. "te pasa"
      # is a verb after its clitic, not the adjective "pasa".
      esEchoQuestion:
        args: "at: SpanishAround, j: number, haber: boolean, afterPreposition: boolean"
        type: boolean
        let:
          token: at.tokens[j]
          word: token.lower
        when: j < at.tokens.length && j < at.i + 12
        return: >-
          token.broken || token.text === "?" || /^[.!;]$/u.test(token.text)
            ? false
            : !token.word
              ? /^\p{N}/u.test(token.text) || esEchoQuestion(at, j + 1, haber, afterPreposition)
              : (j > at.i + 1 && /^\p{Lu}/u.test(token.text)) ||
                  ES_DETERMINERS.has(word) || ES_DIA_SUBJECTS.has(word) || word === "que" || word === "no" ||
                  (/[áéíóú]/u.test(word) && ES_ASKED_FORMS.has(word)) ||
                  /^\p{L}{4,}mente$/u.test(word) ||
                  ((j === at.i + 1 || (ES_CLITICS.has(at.tokens[j - 1].lower) && !haber)) && esSubjunctiveLike(word)) ||
                  (!!esAttributeOf(word) && !haber && !esIsGerund(word) &&
                    !(ES_CLITICS.has(at.tokens[j - 1].lower) && esVerbLike(word))) ||
                  (esSolidNoun(word) && !afterPreposition)
                ? true
                : esEchoQuestion(at, j + 1, /^(?:he|has|ha|hemos|habéis|han|había|habías|habían)$/u.test(word), ES_PREPOSITIONS.has(word))
        else: "false"
      # "¿Que nos odian?", "¿Que estás temblando?": a clause that leaves nothing for "qué" to ask,
      # either a clitic object of a verb of affection or a progressive of a verb rarely asked about.
      esEchoClause:
        args: "at: SpanishAround"
        let:
          k: 'at.next(1) === "no" ? 2 : 1'
          first: at.next(k)
        return: >-
          /^(?:me|te|lo|la|nos|os|los|las)$/u.test(first) && ES_AFFECTION.test(at.next(k + 1))
            ? at.endsAfter(k + 1)
            : /^(?:estás|está|están|estáis|estamos|estaba|estabas|estaban)$/u.test(first)
              ? esIsGerund(at.next(k + 1)) && !ES_ASKED_GERUNDS.has(at.next(k + 1)) && at.endsAfter(k + 1)
              : false
      # A subjunctive verb before the "?": "¿Para que Juan venga?" states a purpose.
      esPurposeClause:
        args: "at: SpanishAround, j: number"
        type: boolean
        when: j < at.tokens.length && j < at.i + 12
        return: >-
          at.tokens[j].broken || /^[?.!;]$/u.test(at.tokens[j].text)
            ? false
            : (at.tokens[j].word && esSubjunctiveLike(at.tokens[j].lower) && !esIsNoun(at.tokens[j].lower)) ||
              esPurposeClause(at, j + 1)
        else: "false"
      # What follows a "que" can only be read as a wish or an echo: "¡Que te vaya bien!".
      esWishAfter:
        args: "at: SpanishAround, k: number"
